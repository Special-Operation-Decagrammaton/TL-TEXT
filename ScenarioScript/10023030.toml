[translation]
10023030-1 = "Эпизод 3; Сердце без часов"
10023030-2 = "Кто или что такое Благородная Воровка?"
10023030-3 = "Правильный вопрос — кто. Она одна из печально известных Семи заключённых... и знаменитая воровка."
10023030-4 = "[s1] «Разве Вакамо не одна из Семи заключённых...?!»\n[s2] «Прямо как Вакамо!»"
10023030-5 = "Именно. Лиса Бедствия известна пылающим адом и разрушением, которые оставляет после себя повсюду."
10023030-6 = "Именно. Лиса Бедствия известна пылающим адом и разрушением, которые оставляет после себя повсюду."
10023030-7 = "А Благородная Воровка заработала дурную славу тем, что крала всё, чего только желало её сердце."
10023030-9 = "Какое странное имя! И что за вор вообще всем объявляет, что он вор? Ха-ха-ха!"
10023030-10 = "Момои..."
10023030-11 = "У-У вас довольно беспечное отношение к ситуации..."
10023030-12 = "Но, пожалуйста, не недооценивайте Благородную Воровку. Она всегда успешно выполняла обещанное в своих визитных карточках."
10023030-13 = "Хотя некоторые скажут, что это лишь потому, что загадки на карточках настолько туманные и запутанные, что предмет успевают украсть раньше, чем загадку вообще разгадают!"
10023030-14 = ""
10023030-16 = ""
10023030-17 = "Мы не станем недооценивать нового врага! Бум-бум-бум! Пора нового квеста! Сразиться с Благородной Воровкой!"
10023030-18 = "Можем мы... посмотреть карточку... пожалуйста?"
10023030-19 = "Рад, что вы спросили. Я принёс её сегодня с собой."
10023030-20 = "Вот, визитная карточка."
10023030-22 = "Два путника встречаются двадцать два раза в день."
10023030-24 = "Ровно два. Но двадцать неясны. Полшага"
10023030-26 = "позади замёрзшего танца и Антикитеры лунный свет не сияет."
10023030-28 = "Печальный меч роскоши, никогда не вручённый другому, станет моим."
10023030-30 = ""
10023030-31 = "...Что?"
10023030-32 = ""
10023030-34 = ""
10023030-35 = "Я понимаю ваше замешательство. Все визитные карточки Благородной Воровки настолько же запутанные и непонятные."
10023030-36 = "Она заявляет, что лучше других воров, потому что заранее предупреждает. Но они все просто слишком загадочные!"
10023030-37 = "Уже первая строка не имеет смысла. Что за путники встречаются двадцать два раза в день?!"
10023030-38 = ""
10023030-40 = ""
10023030-41 = "Некоторые люди могут видеть друг друга больше двадцати раз в день, правда? Мы вот постоянно видимся!"
10023030-42 = "Это не то же самое, что встречаться двадцать два отдельных раза за один день. Такого просто не бывает."
10023030-44 = "Я разгадала загадку! Путники — это NPC. Во время выполнения ежедневок можно легко встретить NPC больше двадцати раз в день."
10023030-45 = "Арис... в реальной жизни нет NPC ежедневных заданий..."
10023030-47 = "Но Юзу — NPC ежедневного задания в моей реальной жизни! Я могу каждый день встретить её в одном месте, поговорить с ней, и она выдаёт мне квесты!"
10023030-49 = "...Не могу сказать, что она совсем неправа... И ведь даже не пытается быть злой..."
10023030-50 = ""
10023030-52 = ""
10023030-53 = "[ns] «Двадцать два раза в день — это примерно каждый час...»"
10023030-54 = "Но в сутках двадцать четыре часа. Двух часов не хватает..."
10023030-55 = "Часы... время...?"
10023030-56 = "Мэйтаро... У вас есть... аналоговые часы?"
10023030-57 = "Откуда вы знали? У нас в центре зала висят большие часы."
10023030-58 = "...Можно на них посмотреть?"
10023030-59 = "Конечно, но чем вас могли заинтересовать часы?"
10023030-60 = "Ты что-то поняла, Юзу?"
10023030-62 = "Если я правильно понимаю... эта визитная карточка..."
10023030-64 = "...Я была права!"
10023030-65 = "Ты была права... насчёт времени? Можно было просто посмотреть на телефон, а не идти через весь зал."
10023030-66 = "Дело было не в этом... Мне действительно нужно было увидеть настоящие аналоговые часы."
10023030-67 = "И теперь, когда я их увидела, кажется, первую часть я разгадала..."
10023030-68 = ""
10023030-69 = "...!"
10023030-70 = "Разгадала? Что там? Ну же, рассказывай!"
10023030-72 = "Два путника, встречающиеся двадцать два раза в день... Я поняла, что речь о стрелках часов. Поэтому мне и нужны были аналоговые часы..."
10023030-73 = "Но Юзу, я думала, в сутках двадцать четыре часа. Не двадцать два."
10023030-74 = "Ты права, Арис. Но стрелки часов за сутки на самом деле совпадают только одиннадцать раз. Значит, двадцать два раза за полные сутки."
10023030-75 = "Часовая стрелка движется на 0,5 градуса в минуту, а минутная — на 6 градусов... поэтому в 12 часов они совпадают дважды в сутки, а остальные 20 раз — в неудобные моменты."
10023030-76 = "Между 11 и 12 часами они вообще не совпадают..."
10023030-78 = "Иного от C&C и не ожидал! Есть идеи насчёт остальной карточки?"
10023030-79 = ""
10023030-81 = ""
10023030-82 = "...позади замёрзшего танца и Антикитеры лунный свет не сияет"
10023030-83 = "«Печальный меч роскоши, никогда не вручённый другому, станет моим», верно?"
10023030-84 = "А что значило «полшага»... Это наверняка ещё одна отсылка к часам!"
10023030-85 = "Часы... полшага на часах означал бы..."
10023030-86 = "О! Например, отметку половины часа!"
10023030-87 = "Юзу, можешь определить, в какое время после половины часа совпадут часовая и минутная стрелки?"
10023030-89 = "Между 5:27 и 7:38... кажется?"
10023030-90 = "Именно тогда воровка попытается проникнуть сюда!"
10023030-91 = "«...Антикитера, лунный свет не сияет.» Что это значит?"
10023030-92 = ""
10023030-94 = ""
10023030-96 = "Антикитера... Антикитера..."
10023030-97 = "Стой!"
10023030-98 = "Ты что-то знаешь об Антикитере?!"
10023030-99 = "Н-Нет! Эту часть я вообще не понимаю, но только что вспомнила кое-что о «печальном мече роскоши.»"
10023030-100 = "Думаю, речь идёт об одном произведении искусства, которое я выставлю на показе."
10023030-101 = "Вот эта картина."
10023030-102 = ""
10023030-104 = ""
10023030-106 = "Что изображено на этой картине?"
10023030-107 = "Старинная церемония посвящения в рыцари. Традиционно при посвящении используется меч."
10023030-108 = "Значит, это несчастный меч, потому что он не может покинуть картину и никогда не будет вручён кому-то ещё."
10023030-109 = "Немного метафорично, но описание подходит."
10023030-111 = "По-моему, логично!"
10023030-112 = "..."
10023030-114 = "Это одна из самых ожидаемых работ на предстоящем аукционе..."
10023030-115 = "Что бы я без вас делал? Никогда бы не догадался, что она собирается украсть настолько бесценную вещь."
10023030-116 = "На оставшееся время здесь я доверяю защиту этого произведения вашим надёжным рукам."
10023030-117 = "Только этого? Вас не беспокоят остальные работы?"
10023030-118 = "Конечно нет! Мы разгадали загадку Благородной Воровки и точно знаем, где она ударит в следующий раз!"
10023030-119 = "Ха-ха! Уверен, она не ожидала встретить достойного соперника в лице C&C!"
10023030-120 = "Ага... ха-ха... Наверное, нет?"
10023030-121 = "Но..."
10023030-122 = ""
10023030-124 = ""
10023030-125 = "Рады помочь..."
10023030-126 = "Первый этап квеста завершён! Следующая цель — защитить произведение искусства!"
10023030-127 = ""
10023030-129 = ""
10023030-130 = "Вообще-то, возможно, я мог бы немного расширить рамки следующего... «квеста»."
10023030-131 = "Что ты имеешь в виду?"
10023030-132 = "Я хотел бы, чтобы C&C следующие три дня, начиная с завтрашнего, отвечал за безопасность этого поместья."
10023030-133 = "Но мы ведь не... на сто процентов уверены, что правильно разгадали карточку..."
10023030-134 = "Ну да. Но если мы ошиблись и воровка выберет другой предмет, это не станет проблемой, верно?"
10023030-135 = "Благородная Воровка, возможно, самый неуловимый вор Кивотоса, но против таких опытных агентов вашего уровня у неё нет шансов. Ха-ха-ха."
10023030-136 = "Я был бы безмерно благодарен. И, конечно, вы получите щедрое вознаграждение."
10023030-137 = "Такая сумма вас устроит?"
10023030-138 = ""
10023030-141 = "?!?!?!"
10023030-143 = "(Т-Такого быть не может, да? Насколько же глубокие карманы у этого клиента?!)"
10023030-144 = "(Каждая могла бы купить себе личную FlyStation Pro И ZBOX Series X — причём дважды!)"
10023030-145 = "(Мидори! Что делать?!)"
10023030-146 = "(Я не знаю ответа на всё! И уж тем более на такое!)"
10023030-148 = "[ns] «(Их ошеломила сумма. Мне нужно вмешаться, быстро!)»"
10023030-149 = ""
10023030-150 = "[ns] «Нам нужна минутка, чтобы всё обсудить наедине. Если вы не против.»"
10023030-151 = "Конечно. Прошу. Я действительно вывалил на вас немало информации."
10023030-152 = ""
10023030-154 = ""
10023030-155 = "Фух! Отлично спасли, Сенсей! Мне нужно было перевести дух."
10023030-156 = "Всё полностью вышло из-под контроля. Мы не справимся с одной из Семи заключённых!"
10023030-157 = "Я хочу домой... Хочу свой шкаф... свой компьютер..."
10023030-158 = "В чём проблема? Это ведь очень простой квест, разве нет?"
10023030-159 = "[s3] «Давайте по одному шагу. Вы хотите продолжить?» \n[s4] «Если хотите, можем признаться и уйти домой.»"
10023030-160 = "Что будет, если мы откажемся?"
10023030-161 = "Что будет, если мы откажемся?"
10023030-162 = "Обычно подаётся официальная жалоба... Её передадут Семинару на рассмотрение, и в деле будут фигурировать и Отдел разработки игр, и C&C."
10023030-163 = "И-и тогда Нэру узнает и убьёт нас!"
10023030-164 = "Пожалуйста, не напоминай..."
10023030-166 = "Я всё ещё не понимаю! Момои, ты всегда говорила, что наш долг — держать слово и завершать квест, если мы его начали!"
10023030-167 = "Но мы должны... бросить? И не исполнить долг героя?"
10023030-168 = "Нет, Арис! Всё, что ты говоришь, верно..."
10023030-169 = "Но есть вещи, с которыми даже герои не справляются..."
10023030-170 = "[s] «Когда квест кажется непосильным, легко забыть, в чём на самом деле состоит задача.»"
10023030-171 = "Сенсей?"
10023030-172 = "Что это значит?"
10023030-173 = "[s] «Наша задача не в том, чтобы сражаться с воровкой, и тем более не в том, чтобы её поймать.»"
10023030-174 = "Вы вообще слушали? Именно в этом она и состоит."
10023030-175 = "Погодите! Кажется, я понимаю, что Сенсей хочет сказать."
10023030-176 = "Там прямо так и написано! Нас попросили лишь сделать так, чтобы ничего не украли!"
10023030-178 = ""
10023030-179 = "...!"
10023030-181 = "Смотрите, все. Мы уже так далеко зашли, и вы слышали Мэйтаро! У них и так отличная система безопасности. В худшем случае Сенсей нас вытащит."
10023030-182 = "Нам не нужно сражаться с воровкой или ловить её. Нужно лишь защитить произведения искусства!"
10023030-183 = "Это не невозможно..."
10023030-184 = "Мы сражались против... сражались вместе... и даже сражались за C&C... Мы многое прошли и многому научились."
10023030-185 = "Если мы сможем использовать весь накопленный опыт... Тогда, может быть, у нас получится... может быть."
10023030-186 = "[s] «Придётся много потрудиться, но в конце нас ждёт большая награда.»"
10023030-187 = "(А с такими деньгами мы могли бы... возможно, мы бы смогли...)"
10023030-188 = "Похоже, мы все уже решили, верно?"
10023030-189 = "*вздыхает* Мы точно считаем это хорошей идеей?"
10023030-190 = "Хех, только подумайте. Если у нас получится, потом можно будет тыкать этим Нэру в лицо!"
10023030-191 = "Ну представьте! Именно C&C будут нам должны!"
10023030-193 = "Я верю, что у нас всё получится! В конце концов, на нашей группе есть бафф Сенсея!"
10023030-197 = "Рад слышать ваше решение. Спасибо всем."
10023030-198 = "Тогда, как и договорились, следующие три дня C&C будет отвечать за безопасность моего поместья и находящихся в нём произведений искусства."
10023030-199 = "Если не возражаете, почему именно три дня?"
10023030-200 = "Следующие три дня я буду проводить здесь мероприятие."
10023030-201 = "Первый день — приём гостей, второй — просмотр галереи, а аукцион станет грандиозным финалом."
10023030-202 = "Вы ожидаете, что воровка ударит во время мероприятия, поэтому наняли дополнительную охрану."
10023030-203 = "Именно. Ах! И я был бы благодарен, если бы в первый день вы помогли ещё и с приёмом гостей."
10023030-205 = "А? С приёмом?!"
10023030-206 = "Как я и сказал. Считайте это работой под прикрытием параллельно с охраной периметра."
10023030-207 = "Это также поможет собирать информацию. Кто-то из гостей может быть связан с воровкой."
10023030-209 = "(А как же картина...?)"
10023030-210 = "(Разве наша работа не заключалась просто в защите одной картины? Теперь мы и охраной занимаемся, и приёмом гостей? Что-то тут... не так.)"
