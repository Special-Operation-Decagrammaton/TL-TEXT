[translation]
2000505-1 = "Вернуть туда, где взял"
2000505-2 = "Пляж Муйгахама"
2000505-3 = "Я жду Хифуми на пляже."
2000505-7 = "Сенсей!"
2000505-9 = "Я привезла арендованный танк, как и обещала!"
2000505-10 = "Теперь мы можем кататься на нём и вместе загорать!"
2000505-11 = "[s] «Зачем нам танк, чтобы загорать?»"
2000505-12 = "Что за вопрос? Все знают, что для загара нужен танк!"
2000505-13 = "Если подумать, кажется, я так и не устроила тебе настоящую экскурсию по «Крусейди»."
2000505-14 = "Тогда это идеальная возможность познакомить тебя со всеми возможностями «Крусейди»!"
2000505-15 = "У него нет командирской башенки, зато внутри есть крепление для зонта, чтобы защищать командира от опасных ультрафиолетовых лучей."
2000505-16 = "Заботиться о коже очень важно, даже когда находишься на башне танка."
2000505-17 = "При желании можно установить даже большой пляжный зонт!"
2000505-18 = "И конечно, хороший танк должен быть защищён от воды, чтобы быть готовым к пляжу. В комплекте с «Крусейди» идёт специальный коврик, который упрощает езду по мокрым дорогам и пляжам."
2000505-19 = "Последнее, чего нам хочется, — чтобы гусеницы пострадали от грязи или песка."
2000505-20 = "Материал немного грубый, но этот коврик можно использовать ещё и как пляжную подстилку!"
2000505-21 = "И наконец — защита от обезвоживания. «Крусейди» оснащён краном с холодной и горячей водой для заваривания чая."
2000505-22 = "В конце концов, чаепитие важно в любых условиях."
2000505-23 = "«Крусейди» позаботится о напитках, хочешь ты горячий чай или холодный!"
2000505-24 = "[s1] «Похоже, он лучше оснащён для девичьих посиделок, чем для войны.»\n[s2] «Потрясающе! У меня просто нет слов!»"
2000505-25 = "Ну, всё-таки это имущество Общей школы Тринити."
2000505-26 = "Правда ведь? «Крусейди» — самый крутой танк на свете."
2000505-27 = "Ну что, готов немного позагорать?"
2000505-31 = "Хм. Интересно, можно ли припарковаться здесь."
2000505-32 = "Солнечно, но при этом дует прохладный ветерок. Должно быть идеально."
2000505-33 = "Хотя, может, стоит подъехать чуть ближе. Отсюда воду плохо видно."
2000505-34 = "Ближе... Ещё совсем немного..."
2000505-36 = "А-А? Волны стали сильнее, чем были."
2000505-37 = ""
2000505-40 = ""
2000505-43 = "[ns] «Ты в порядке?!»"
2000505-44 = "Я-Я в порядке. Просто не ожидала, что меня внезапно окатит водой."
2000505-45 = "Хорошо, что я в купальнике. Купальники не ржавеют и не ломаются, даже если намокнут..."
2000505-46 = "...в отличие от оружия или деталей танка."
2000505-47 = "Аргх... М-Морская вода попала внутрь танка!"
2000505-48 = "[s] «Что ты сказала?»"
2000505-49 = "Внутри «Крусейди» всё залило морской водой из-за волн!"
2000505-50 = "У «Крусейди» нет защиты от СОЛЁНОЙ воды! Он точно заржавеет, а я не могу допустить, чтобы арендованное оборудование испортилось!"
2000505-51 = "Ч-Что делать? Нужно вымыть его, пока он не начал ржаветь..."
2000505-52 = "[s] «Вон там есть место для мытья.»"
2000505-53 = ""
2000505-54 = ""
2000505-55 = "Точно! Давай смоем там соль с танка."
2000505-56 = "[s] «А как же загорать?»"
2000505-57 = "Сейчас главное — почистить «Крусейди»!"
2000505-61 = "― Будем мыть! ♪ Каждый уголок! ♪[wa:2390]"
2000505-64 = "― Нельзя допустить, чтобы «Крусейди» заржавел.[wa:720]"
2000505-67 = "― Мы ведь все должны им пользоваться,[wa:620]"
2000505-69 = "― так что вернуть его нужно в хорошем состоянии.[wa:10]"
2000505-72 = "― Осторожнее, Сенсей.[wa:840]"
2000505-74 = "― Если останешься там, тебя может окатить струёй воды.[wa:80]"
2000505-77 = "― Ты не против, потому что ты в купальнике?[wa:1800]"
2000505-80 = "― Ну, это правда. Кстати, давай в следующий раз...[wa:2080]"
2000505-82 = "― поплаваем вместе![wa:680]"
2000505-85 = "Я рада, что мы успели искупать «Крусейди» до того, как он начал ржаветь..."
2000505-86 = "...но пока мы этим занимались, солнце село, и теперь позагорать уже не получится."
2000505-87 = "А сегодня была такая хорошая погода. Какая жалость."
2000505-88 = "[s] «Мне всё равно было весело провести с тобой весь день, Хифуми.»"
2000505-89 = "Правда? Но мы ведь весь день только и делали, что убирали."
2000505-90 = "Хотя я использовала уборку как предлог, чтобы обливать тебя водой, и это было довольно весело..."
2000505-91 = "Как насчёт того, чтобы вернуться и позагорать в следующий раз, когда будет хорошая погода?"
2000505-92 = "Я принесу всё необходимое!"
2000505-94 = "После этого мы с Хифуми снова забрались в танк и вернулись в кампус."
