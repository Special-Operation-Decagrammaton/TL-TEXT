[translation]
212020-1 = "Эпизод 2;Чинацу"
212020-2 = ""
212020-3 = "Итак, изменились третьекурсники. Я уже убедилась, что Хина и Ако стали другими..."
212020-4 = "А, Сэна..."
212020-5 = "Надо увидеть всё своими глазами."
212020-6 = ""
212020-8 = ""
212020-12 = ""
212020-14 = ""
212020-15 = ""
212020-17 = ""
212020-18 = ""
212020-19 = ""
212020-20 = "Доброе утро, Сэна."
212020-21 = ""
212020-23 = ""
212020-24 = "Чинацу."
212020-25 = "Давно не виделись."
212020-26 = "Искренне прошу прощения. Мне стоило заходить к тебе чаще."
212020-27 = "Мы обе были заняты. Долг зовёт, верно?"
212020-28 = "Ещё как зовёт."
212020-29 = ""
212020-33 = "...Сэна, я не могу не заметить, что Клуб скорой помощи тоже... готовится к битве."
212020-34 = "Фу-фу, разумеется."
212020-35 = "Ведь мы так давно мечтали об этой войне."
212020-36 = "..."
212020-37 = "...Ты ведь согласна, Чинацу?"
212020-38 = ""
212020-40 = ""
212020-41 = "Пришло время Префектуре обрушить бурю на мир за пределами Геенны."
212020-42 = "Сэна, я..."
212020-43 = "Я всё ещё помню."
212020-44 = "«Помнишь»... что?"
212020-45 = "Тот день. Послеобеденный час, когда ты сказала, что хочешь вступить в Префектуру."
212020-46 = "Н-Ну..."
212020-47 = "...Ты сказала, что «не можешь просто стоять в стороне и ничего не делать»."
212020-48 = "...Значит, ты запомнила."
212020-49 = "Да. Ведь это были твои слова, Чинацу."
212020-50 = ""
212020-52 = ""
212020-53 = "А...?"
212020-54 = "Я возлагала на тебя большие надежды. Ты была способным студентом младшего курса, настоящим дарованием, и однажды могла бы возглавить Клуб скорой помощи."
212020-55 = "...Д-для меня это новость."
212020-56 = "Потому что я никогда не говорила этого вслух. Ты же знаешь, я не слишком разговорчива."
212020-57 = "Я и представить... не могла, что ты настолько высокого обо мне мнения."
212020-58 = "Когда ты сказала, что хочешь перейти в другой клуб, я была потрясена. Хотя постаралась этого не показать."
212020-59 = "..."
212020-60 = ""
212020-62 = ""
212020-63 = "«Почему она не могла осуществить свою мечту в Клубе скорой помощи?»"
212020-64 = "«Дело в нас? Во мне? И если да, то как это исправить?»"
212020-65 = "Какое-то время я постоянно думала об этом."
212020-66 = "Э-Это..."
212020-67 = "Я захотела вступить в Префектуру вовсе не потому, что с Клубом скорой помощи что-то не так."
212020-68 = "Я видела столько травм и всё думала, как не просто лечить их, а ПРЕДОТВРАЩАТЬ..."
212020-69 = "Фу-фу... Да. Я знаю."
212020-70 = "...Сэна..."
212020-71 = "Всё просто. Мы, а точнее, я не смогли дать тебе того, к чему ты стремилась."
212020-72 = "Причин могло быть много, но истина очевидна."
212020-73 = "Теперь каждая из нас сделала выбор и нашла своё место."
212020-74 = "Я горжусь тем, какой ты стала, Чинацу."
212020-75 = ""
212020-77 = ""
212020-78 = "...Спасибо, Сэна."
212020-79 = "Если сейчас я стану извиняться, боюсь, это прозвучит оскорбительно."
212020-80 = "Ты... всегда так упорно старалась. Столько трудилась, чтобы всё наладить. Я прекрасно это помню."
212020-81 = "Я тоже гордилась тобой. И до сих пор горжусь."
212020-82 = "Я благодарна тебе за такие слова, Чинацу."
212020-83 = "И ещё..."
212020-84 = ""
212020-86 = ""
212020-87 = ""
212020-89 = "Надеюсь, мы будем чаще работать вместе."
212020-90 = "Пока мы будем обеспечивать медицинскую помощь, Префектура сыграет важнейшую роль в нашем славном завоевании Кивотоса."
212020-91 = "Ведь тебе предстоит выполнять важную работу в самом грозном боевом подразделении Геенны. Ты же отвечаешь за боевые операции."
212020-92 = "Глава Префектуры возлагает на тебя большие надежды. И я тоже."
212020-93 = "С-Сэна..."
212020-94 = "...Ты не уверена в своих силах?"
212020-95 = ""
212020-97 = ""
212020-98 = "Н-нет. Дело не в этом..."
212020-99 = "Скорая помощь, транспортировка раненых с поля боя, экстренное реагирование, распределение припасов и несложные медицинские процедуры..."
212020-100 = "Всему этому ты научилась в Клубе скорой помощи. А если прибавить твой богатый опыт работы в Префектуре..."
212020-101 = "Мне совершенно не о чем беспокоиться."
212020-102 = "Потому что я верю в тебя, Чинацу."
212020-103 = "..."
212020-104 = "Сэна."
212020-105 = "Да?"
212020-106 = "Если война действительно начнётся и Геенна уничтожит Кивотос..."
212020-107 = "Ты будешь довольна?"
212020-108 = "Будешь гордиться Геенной, которая это сделала?"
212020-109 = "...Слава требует жертв."
212020-110 = "Пострадавших будет много."
212020-111 = "Не только в Геенне, но и в других академиях. Пострадают даже мирные жители, ни в чём не повинные люди."
212020-112 = "Неужели... ты действительно этого хочешь?"
212020-113 = ""
212020-115 = ""
212020-116 = "Если честно..."
212020-117 = "..."
212020-118 = "Лично меня такие потери совсем не радуют."
212020-119 = "Однако независимо от наших желаний есть вещи, которые необходимо сделать."
212020-120 = "Что именно? Развязать завоевательную войну от имени Геенны?"
212020-121 = "Именно. Ведь сама эта война является медицинской процедурой."
212020-122 = "Что... ты имеешь в виду?"
212020-123 = "Посмотри на нынешние опасные отношения между академиями. Они словно соперничающие органы, истощающие единый организм по имени Кивотос."
212020-124 = "И единственный способ исцелить Кивотос — удалить всё лишнее и объединить его под единым порядком Геенны. Только так организм сможет выжить."
212020-125 = "Ты говорила о жертвах. Они подобны кровотечению во время операции."
212020-126 = "Если испугаться крови и бросить операцию на полпути, пациент умрёт. Ты прекрасно это знаешь, Чинацу."
212020-127 = ""
212020-129 = ""
212020-130 = "...Тебя, похоже, многое тревожит."
212020-131 = "А, Сэна..."
212020-132 = "..."
212020-133 = "А, я совсем потеряла счёт времени. Мне ещё нужно разобраться с медикаментами."
212020-134 = "Тогда... до встречи, Чинацу."
212020-135 = "...Да. Я ещё приду, Сэна."
212020-136 = ""
212020-138 = ""
212020-140 = ""
212020-141 = "Чинацу."
212020-142 = ""
212020-144 = ""
212020-145 = "Что?"
212020-146 = ""
212020-148 = ""
212020-149 = "От всего сердца надеюсь, что ты последуешь велению совести и выберешь правильный путь."
212020-150 = ""
212020-152 = ""
212020-153 = "...Да. Так и поступлю."
212020-155 = "Сена..."
212020-156 = "Этот ясный взгляд. Эти глаза, полные доверия ко мне... они остались прежними."
212020-157 = ""
212020-159 = ""
212020-160 = "..."
212020-162 = "Я... Я КЛЯНУСЬ... вернуть её."
212020-164 = "Следующий эпизод;Ответ Лиги наследия"
