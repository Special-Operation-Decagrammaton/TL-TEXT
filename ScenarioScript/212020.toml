[translation]
212020-1 = "Episode 2;Chinatsu"
212020-3 = "Most of the third-years have been affected... just like the Prefect Team leader and Administrative Officer Ako..."
212020-4 = "If that's the case, then perhaps..."
212020-5 = "...I have to confirm it."
212020-20 = "Good morning, Senpai."
212020-24 = "Chinatsu."
212020-25 = "It's been a while."
212020-26 = "I apologize for being out of touch."
212020-27 = "I know how busy you are. It's much the same on my end."
212020-28 = "Is that so...?"
212020-33 = "...So the Emergency Medicine Department is also preparing for battle."
212020-34 = "Of course."
212020-35 = "This is, after all, the long-cherished wish of us all."
212020-36 = "A long-cherished wish...?"
212020-37 = "...Isn't that the same for you, Chinatsu?"
212020-41 = "The time has come to show the power of the Prefect Team outside of Gehenna."
212020-42 = "I..."
212020-43 = "Chinatsu. I remember."
212020-44 = "Remember... what?"
212020-45 = "The time you told me you were going to the Prefect Team."
212020-46 = "Th-that is..."
212020-47 = "Your reason was, 'I couldn't just leave them be,' wasn't it?"
212020-48 = "You even remember that..."
212020-49 = "Of course. You are Chinatsu, after all."
212020-53 = "...Yes?"
212020-54 = "I had high expectations for you. #nI thought that, eventually, I might be able to entrust the department to you."
212020-55 = "You've never said anything like that before..."
212020-56 = "That's true. This is the first time I've said it."
212020-57 = "I never knew you held me in such high regard, Senpai..."
212020-58 = "That is precisely why... I was shocked when I heard you were transferring departments. #nThough I did my best to keep it from showing."
212020-59 = "..."
212020-63 = "Was the Emergency Medicine Department unable to grant your wishes?"
212020-64 = "Was there something wrong with us? #nIf so, how could we have fixed it?"
212020-65 = "At the time, I thought about that quite a lot."
212020-66 = "N-no, that's not it..."
212020-67 = "It wasn't because I was dissatisfied that I wanted to transfer..."
212020-68 = "Every time someone was injured, while I was thinking of ways to treat them faster..."
212020-69 = "Hehe. #n...Yes, I understand."
212020-70 = "Sena-senpai..."
212020-71 = "We were not the best place for you, Chinatsu."
212020-72 = "There are many reasons for it, I'm sure. But it's not something that needs to be put into words."
212020-73 = "We made our choices and found our respective places. #nAnd now, here we are."
212020-74 = "I am proud of you, Chinatsu."
212020-78 = "...Thank you."
212020-79 = "If I were to say 'I'm sorry' here... it would be an insult to you, wouldn't it?"
212020-80 = "You have always done your best and worked as hard as you could."
212020-81 = "I have always respected you, Senpai, and that hasn't changed."
212020-82 = "I've had a good junior, haven't I?"
212020-83 = "That is why—"
212020-89 = "I look forward to working with you in the future as well."
212020-90 = "The Prefect Team is, in both name and reality, Gehenna's strongest armed force. Their role is significant."
212020-91 = "After all, the continuation of the battle depends on your efforts, Chinatsu."
212020-92 = "The Prefect Team leader must be counting on you, too."
212020-93 = "Senpai..."
212020-94 = "...Are you anxious?"
212020-98 = "No... it's not that..."
212020-99 = "First aid, minor surgery, transporting patients, emergency response and resupply. #nThese are all things I taught you in the Emergency Medicine Department."
212020-100 = "And now, you have your own experience added to that."
212020-101 = "Therefore, I am not worried."
212020-102 = "I believe in you, Chinatsu."
212020-103 = "............"
212020-104 = "Sena-senpai."
212020-105 = "Yes?"
212020-106 = "If Gehenna were to destroy Kivotos..."
212020-107 = "Is that... something you desire, Senpai?"
212020-108 = "Can you really be proud of a Gehenna like that...?"
212020-109 = "...Greatness comes with sacrifice."
212020-110 = "There will surely be many casualties."
212020-111 = "Not just in Gehenna. Many citizens will be hurt and suffer as well."
212020-112 = "Senpai... do you really want that?"
212020-116 = "Let's see..."
212020-117 = "..."
212020-118 = "Personally, I do not care for such things."
212020-119 = "But I understand that, beyond personal likes and dislikes, it is necessary."
212020-120 = "Carrying out attacks, you mean?"
212020-121 = "Yes. Because it is a medical procedure for Kivotos."
212020-122 = "I don't understand what you mean."
212020-123 = "Kivotos is built upon a chaotic jumble of school orders. #nWhat else would you call that but an emergency patient?"
212020-124 = "Unification by Gehenna. #nEstablishing a powerful order is the only way to treat Kivotos."
212020-125 = "You mentioned casualties earlier. That is the same as the bleeding that occurs during surgery."
212020-126 = "If you give up on surgery because you're afraid of the bleeding, the patient will be beyond saving. #nYou understand that, don't you, Chinatsu?"
212020-130 = "...You seem quite troubled."
212020-131 = "Senpai..."
212020-132 = "..."
212020-133 = "I was in the middle of organizing the medicine."
212020-134 = "That's enough for today. ...We'll talk another time."
212020-135 = "...Yes. I will visit again."
212020-141 = "Chinatsu."
212020-145 = "Yes?"
212020-149 = "I hope you find your way to the right path."
212020-153 = "...Thank you."
212020-155 = "Sena-senpai..."
212020-156 = "Those clear eyes that believe in me. Even though those eyes haven't changed..."
212020-160 = "And yet..."
212020-162 = "I will... I will make sure to bring you back."
212020-164 = "Next Episode;The Gehenna Restoration Committee's Reaction"