[translation]
212020-1 = "Episódio 02;Chinatsu"
212020-2 = ""
212020-3 = "Quase todas as alunas do 3º ano foram afetadas...... incluindo a Presidente Hina e a Diretora Ako......"
212020-4 = "Sendo assim, será que lá também......"
212020-5 = "......Preciso ver com meus próprios olhos."
212020-6 = ""
212020-8 = ""
212020-12 = ""
212020-14 = ""
212020-15 = ""
212020-17 = ""
212020-18 = ""
212020-19 = ""
212020-20 = "Sena-senpai, bom dia."
212020-21 = ""
212020-23 = ""
212020-24 = "Chinatsu."
212020-25 = "Há quanto tempo."
212020-26 = "Peço desculpas por não ter vindo visitá-la antes."
212020-27 = "Não se preocupe, sei o quanto você é ocupada. Eu também estive bastante atarefada por aqui."
212020-28 = "Entendo......"
212020-29 = ""
212020-33 = "......O Clube de Resgate Médico também está se preparando para o combate, não é?"
212020-34 = "Naturalmente."
212020-35 = "Afinal, este é o grande objetivo de todas nós."
212020-36 = "Nosso objetivo......?"
212020-37 = "......Não é o seu também, Chinatsu?"
212020-38 = ""
212020-40 = ""
212020-41 = "Chegou a hora de mostrarmos a força do Comitê de Disciplina além dos limites de Gehenna."
212020-42 = "Eu......"
212020-43 = "Chinatsu. Eu ainda me lembro muito bem."
212020-44 = "Do quê...... exatamente?"
212020-45 = "Do dia em que você disse que iria se transferir para o Comitê de Disciplina."
212020-46 = "A-Aquilo......"
212020-47 = "Sua justificativa foi: 'Não posso deixar as coisas como estão'. Não foi?"
212020-48 = "A senhora ainda lembra disso......"
212020-49 = "Claro que lembro. Era de você que estávamos falando."
212020-50 = ""
212020-52 = ""
212020-53 = "......Como?"
212020-54 = "Eu tinha grandes expectativas a seu respeito.#nCheguei a cogitar que você um dia assumiria a liderança deste clube."
212020-55 = "A senhora nunca havia me dito isso antes......"
212020-56 = "Naturalmente. Afinal, estou dizendo pela primeira vez agora."
212020-57 = "Eu não fazia ideia de que a senhora tinha tamanho apreço por mim......"
212020-58 = "Justamente por isso...... saber que você estava partindo foi um choque imenso para mim.#nEmbora eu tenha me esforçado para não transparecer nada."
212020-59 = "......"
212020-60 = ""
212020-62 = ""
212020-63 = "Será que [ruby=aqui]o Clube de Resgate Médico[/ruby] não foi capaz de realizar os seus anseios?"
212020-64 = "O erro foi nosso?#nSe foi, o que poderíamos ter feito para corrigir isso?"
212020-65 = "Naquela época, passei longos dias refletindo sobre isso."
212020-66 = "N-Não foi nada disso......!"
212020-67 = "Eu não saí por insatisfação com o clube......"
212020-68 = "É que, toda vez que surgiam feridos, eu só pensava em como chegar mais rápido ao local para socorrê-los......"
212020-69 = "Fufufu.#n......Sim, eu compreendo."
212020-70 = "Sena-senpai......"
212020-71 = "[ruby=・]N[/ruby][ruby=・]ó[/ruby][ruby=・]s[/ruby] não éramos o melhor lugar para você."
212020-72 = "Havia inúmeras razões, sem dúvida. Mas não há necessidade de remexer no passado com palavras."
212020-73 = "Fizemos nossas escolhas, encontramos nossos lugares.#nE agora, estamos aqui."
212020-74 = "Tenho muito orgulho de você, Chinatsu."
212020-75 = ""
212020-77 = ""
212020-78 = "......Muito obrigada."
212020-79 = "Se eu dissesse que 'sinto muito' aqui...... seria um insulto à senhora, não é?"
212020-80 = "A senhora sempre deu o seu melhor, fazendo incansavelmente tudo o que estava ao seu alcance."
212020-81 = "Eu sempre a admirei e a respeitei com todo o meu coração. E continuo sentindo o mesmo hoje."
212020-82 = "Tive muita sorte de ter uma júnior como você."
212020-83 = "Por isso――"
212020-84 = ""
212020-86 = ""
212020-87 = ""
212020-89 = "Conto com a sua colaboração daqui para frente."
212020-90 = "O Comitê de Disciplina é o grupo armado supremo de Gehenna. O papel de vocês nesta guerra é fundamental."
212020-91 = "A sustentação do combate na linha de frente dependerá diretamente da sua competência, Chinatsu."
212020-92 = "A Presidente Hina também deposita imensa confiança em você."
212020-93 = "Senpai......"
212020-94 = "......Está insegura?"
212020-95 = ""
212020-97 = ""
212020-98 = "Não...... não é bem isso......"
212020-99 = "Primeiros socorros, procedimentos cirúrgicos de emergência, transporte e triagem de pacientes, resposta rápida e abastecimento.#nFoi tudo ensinado aqui, no Clube de Resgate Médico."
212020-100 = "E a isso você somou toda a experiência prática que acumulou."
212020-101 = "Sendo assim, não tenho a menor dúvida da sua capacidade."
212020-102 = "Eu confio em você, Chinatsu."
212020-103 = "............"
212020-104 = "Sena-senpai."
212020-105 = "Sim?"
212020-106 = "Se Gehenna marchar para destruir Kivotos......"
212020-107 = "Isso...... é realmente o que a senhora deseja?"
212020-108 = "A senhora realmente sentiria orgulho de uma Gehenna que fizesse isso......?"
212020-109 = "......A grandeza sempre cobra sacrifícios."
212020-110 = "Muitas pessoas vão se ferir gravemente."
212020-111 = "E não só as alunas de Gehenna. Cidadãos inocentes de todas as partes sofrerão as consequências."
212020-112 = "A senhora...... realmente apoia um massacre desses do fundo do seu coração?"
212020-113 = ""
212020-115 = ""
212020-116 = "Compreendo o seu ponto......"
212020-117 = "......"
212020-118 = "Em termos estritamente pessoais, repudio a destruição gratuita."
212020-119 = "Contudo, acima de preferências individuais, reconheço que este é um [ruby=・]pa[/ruby][ruby=・]s[/ruby][ruby=・]so[/ruby] [ruby=・]in[/ruby][ruby=・]dis[/ruby][ruby=・]pen[/ruby][ruby=・]sá[/ruby][ruby=・]vel[/ruby]."
212020-120 = "O ataque a Kivotos...... indispensável?"
212020-121 = "Sim. Esta guerra é, em essência, um procedimento cirúrgico em prol de toda a Kivotos."
212020-122 = "Eu não consigo entender a sua lógica."
212020-123 = "Kivotos jaz enferma sobre um emaranhado caótico de academias fragmentadas.#nComo poderíamos não classificar tal estado como um paciente em estado crítico terminal?"
212020-124 = "A unificação sob o comando de Gehenna,#ne a imposição de uma ordem implacável, é o único tratamento capaz de curar as feridas crônicas deste mundo."
212020-125 = "Você mencionou os feridos há pouco. Eles nada mais são do que o sangramento inevitável durante uma incisão cirúrgica."
212020-126 = "Se abortarmos a cirurgia pelo pavor do sangue, o paciente perecerá irremediavelmente.#nVocê, melhor do que ninguém, sabe muito bem disso, não sabe, Chinatsu?"
212020-127 = ""
212020-129 = ""
212020-130 = "......Vejo que seu coração está em grande tormento."
212020-131 = "Senpai......"
212020-132 = "......"
212020-133 = "Preciso concluir o inventário de medicamentos de campanha."
212020-134 = "Por hoje, encerramos por aqui. Conversaremos em outra oportunidade."
212020-135 = "......Certo. Eu virei vê-la novamente."
