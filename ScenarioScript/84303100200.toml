[translation]
84303100200-5 = ""
84303100200-6 = "Ты, наверное, очень любишь прятки! Теперь мне прятаться или всё ещё твоя очередь?"
84303100200-8 = "Прости. Тут было столько интересного, что я... немного заблудилась."
84303100200-10 = "Что ж, надеюсь, только поэтому..."
84303100200-11 = "...Хотя всё нормально. Мы не собираемся держать тебя на поводке."
84303100200-12 = "Но если заблудишься или что-то будет беспокоить, позвони нам."
84303100200-14 = "Фуфу. Не хотелось бы вас утруждать, но это очень заботливо. Спасибо."
84303100200-15 = ""
84303100200-18 = "...Хм?"
84303100200-19 = ""
84303100200-21 = "(Звонок от Рио...?)"
84303100200-22 = ""
84303100200-24 = "О, мне снова звонят... Одну минуту, простите."
84303100200-26 = "Не за что."
84303100200-27 = "Ты знаешь, где нас найти. Возвращайся, когда закончишь."
84303100200-29 = "Хорошо. Так и сделаю."
