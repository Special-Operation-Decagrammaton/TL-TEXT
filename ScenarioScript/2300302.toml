[translation]
2300302-1 = "Образ хакера"
2300302-2 = "Хакерская комната Веритас"
2300302-3 = "Возвращаясь после дел в Семинар Миллениума, я заглянул в клубную комнату Веритас."
2300302-4 = "Хм..."
2300302-5 = ""
2300302-6 = ""
2300302-7 = ""
2300302-8 = ""
2300302-9 = "О! Привет, Сенсей."
2300302-10 = "Ага, только что вернулась из кинотеатра. Смотрела «Eliminator 4»."
2300302-11 = "Но кое-что там было... немного..."
2300302-12 = "[s] «Что с таким лицом? Фильм не понравился?»"
2300302-13 = "Сказать, что фильм был неинтересным? Скорее, там была одна вещь, которая мне очень не понравилась."
2300302-14 = "Сам фильм нормальный. Эффекты яркие, персонажи запоминающиеся, зрителям понравилось."
2300302-15 = "Да... в целом всё было нормально, кроме..."
2300302-16 = "Того, как они показали хакеров! Это было ужасно!"
2300302-17 = "[s] «А что именно они сделали не так?»"
2300302-18 = "Почти всё! Но если выбрать несколько вещей... начну с одежды."
2300302-19 = "Да, хакеры любят удобную одежду, но что это за неряшливое худи на хакере из фильма? Они выставили всех хакеров компьютерными задротами, которые вообще не умеют одеваться."
2300302-20 = "И сцены взлома выглядели ужасно фальшиво."
2300302-21 = "По-твоему, реально, чтобы один хакер разом проломил защиту огромной корпорации, закрытую кучей программ безопасности? Даже у самых талантливых хакеров есть пределы."
2300302-22 = "И кто вообще после взлома оставляет ASCII-череп? Это же кринж."
2300302-23 = "Трудно поверить, что такая популярная франшиза, как Eliminator, допустила настолько дилетантские ошибки."
2300302-24 = "[s] «...Это правда настолько важно?»"
2300302-25 = "Ещё как! Это касается самой сути Веритас."
2300302-26 = "Именно из-за таких популярных фильмов, где хакеров показывают неправильно, репутация белых хакеров вроде нас катится в пропасть."
2300302-27 = "Мы взламываем не из мести и не ради личной выгоды. Веритас ищет только истину и свободу."
2300302-28 = "А они показали хакеров какими-то третьесортными скрипт-кидди лишь потому, что так проще для фильма. Непростительно..."
2300302-29 = "[s] «Я вообще перестал понимать...»"
2300302-30 = ""
2300302-31 = "...Нет, так не пойдёт. Нужно оставить студии, снявшей Eliminator, недвусмысленное предупреждение."
2300302-32 = "О, напрямую связываться с ними я не собираюсь. Всё просто. Нужно лишь взломать их серверы."
2300302-33 = "Заодно покажу им, чем настоящие хакеры отличаются от вымышленных."
2300302-34 = "Так, адрес их сайта..."
2300302-35 = ""
2300302-36 = ""
2300302-37 = "Как и ожидалось, защищён серьёзной системой безопасности. Но против меня у неё нет шансов."
2300302-38 = ""
2300302-39 = ""
2300302-41 = "...Готово. С чего бы начать?"
2300302-42 = "Сначала поставлю фильму одну звезду, а потом заблокирую им возможность что-либо менять..."
2300302-43 = ""
2300302-44 = ""
2300302-45 = "Перепишу все скрипты и добавлю предупреждение о том, как они искажают образ хакеров..."
2300302-46 = ""
2300302-47 = ""
2300302-48 = "И на всякий случай вставлю ASCII-версию логотипа Веритас... Идеально."
2300302-49 = "[s] «...»"
2300302-50 = "Хм? Сенсей, что такое?"
2300302-51 = "...Думаешь, то, что я сейчас делаю, не особо отличается от действий хакеров в фильме?"
2300302-52 = "Не смеши! В отличие от них, я не взламываю ради личной выгоды и не использую ASCII-арт..."
2300302-53 = ""
2300302-54 = "...Ладно, последнее, может, и делаю."
2300302-55 = "Ещё раз повторю. Не все хакеры такие!"
2300302-57 = "После этого я убедил Харэ восстановить взломанную ею главную страницу."
