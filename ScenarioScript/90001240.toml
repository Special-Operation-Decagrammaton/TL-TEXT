[translation]
90001240-1 = "Эпизод 24;Надежда"
90001240-3 = "[ns] «Этот коридор бесконечный.»"
90001240-4 = "Вполне ожидаемая реакция на задуманный дизайн. Этот тоннель построили так, чтобы ничто не могло помешать его назначению — сохранению семян."
90001240-5 = "В конце должна быть диспетчерская, к которой мы сможем получить доступ."
90001240-6 = "А? Откуда вы всё это знаете, госпожа Рио?"
90001240-7 = "Конструкция этого сооружения... Она очень похожа на проекты наших собственных хранилищ."
90001240-8 = "Да, я тоже заметила, что здание очень напоминает Миллениум."
90001240-9 = "Однако в наших архивах нет ни одной записи о подобном сооружении."
90001240-10 = "Вы хотите сказать, что строительство этого хранилища семян могли поручить стороннему подрядчику?"
90001240-11 = "Да. Это наиболее логичный вывод."
90001240-12 = "Так вот, как я и говорила."
90001240-13 = "Это сооружение стало ответом человечества на страхи о том, сможет ли оно выжить в случае глобальной катастрофы."
90001240-14 = "Отсюда и другое его название — Хранилище Судного дня."
90001240-15 = "Не будем показывать пальцем, но создатель должен был быть одновременно невероятно дотошным и безнадёжно странным человеком. Звучит как основа для хоррора или нелепой городской легенды."
90001240-16 = "Насколько я могу понять намерения этого чудака, он готовился к... самому последнему остатку человечества. Что, конечно, вызывает вопросы о его общем настрое..."
90001240-17 = "Ну, я-я могу это понять... немного..."
90001240-18 = "..."
90001240-19 = "Хорошо. Значит, этот объект построили, исходя из такой своеобразной идеи."
90001240-20 = "Но затем управление доверили ИИ и скрыли местонахождение?"
90001240-21 = "И что тогда произошло бы, если бы с создателем что-то случилось? Ни одна душа в мире не знала бы о его существовании, не говоря уже о том, чтобы найти его."
90001240-22 = "С этой точки зрения создатель хранилища семян оказался на удивление беспечным."
90001240-23 = "...А может, всё это было просто бездумной прихотью."
90001240-24 = "Или, возможно, оно всё это время ждало, пока его найдут."
90001240-25 = "Прямо как семя."
90001240-27 = "Семя?"
90001240-28 = "Семя?"
90001240-29 = "...?"
90001240-30 = "...!!"
90001240-31 = "Да, Кей! Всё верно! Ты наконец начинаешь понимать, что такое «жизнь»!"
90001240-32 = "Н-Нет...? Я не это имела в виду. Я просто подумала... ну, это здание ведь похоже на семя, разве нет?"
90001240-33 = "В общем, как бы сказать, внутри каждого семени есть возможность стать растением или деревом, верно?"
90001240-34 = "Да, да!"
90001240-35 = ""
90001240-36 = "[ns] «Да-да.»"
90001240-37 = "Арис я ещё прощу, но ВЫ! Немедленно уберите с лица эту самодовольную улыбку!"
90001240-39 = "Хочу заметить, не обязательно верно, что об этом объекте вообще никто не знал."
90001240-40 = "Пусть у меня было лишь смутное представление о нём, я ведь всё же знала о его существовании, правда?"
90001240-41 = "Это лишь означает, что вы с этим странным человеком родственные души, Рио."
90001240-42 = "Возможно, если бы нам удалось встретиться, мы бы нашли взаимопонимание."
90001240-43 = "Я вообще не это пыталась сказать! *вздох* Неважно. По крайней мере, меня радует, что в этой жизни мне приходится иметь дело только с одной представительницей вашего вида."
90001240-44 = "Что это значит?"
90001240-45 = "...Это значит, что ты хороша такой, какая есть..."
90001240-46 = "Х-Хороша как средство от моего низкого давления, вот что!"
90001240-47 = ""
90001240-49 = ""
90001240-51 = ""
90001240-53 = ""
90001240-55 = "Ч-Что случилось?"
90001240-56 = "Отключение электричества...? Источник питания отказал?!"
90001240-57 = ""
90001240-60 = ""
90001240-61 = "Постой..."
90001240-62 = "Н-Нас окружают...?"
90001240-63 = ""
90001240-68 = "Ч-Ч-Ч-Что это такое?!"
90001240-69 = "У-УАААА!!!"
90001240-70 = "[ns] «Все, успокойтесь! И...!»"
90001240-71 = "...!"
90001240-72 = "Безопасность Сенсея — в приоритете!"
90001240-74 = "Т-Тифи... р-решила провести разведывательную операцию!"
90001240-75 = "Молодец, Тифи. Молодец. Это необходимый шаг, чтобы понять возможности противника."
90001240-76 = "Если нам повезёт, мы узнаем, как им тогда удалось прорваться через наше энергетическое поле."
90001240-77 = "Н-Н-Н-Но что, если они разрушат объект?"
90001240-78 = "Не-а, такого не будет. Тиферет не позволит. Как она будет хранить и сохранять семена, если объект разрушится?"
90001240-79 = "Да-да. Она проведёт разведку, а затем организованно отступит."
90001240-80 = "И если после этого с ними станет хоть чуточку проще справиться — тем лучше!"
