[translation]
2601708-1 = "Protocol Specifications"
2601708-2 = "(Hearing Rana's message, I hurriedly rushed down to the first floor.)"
2601708-6 = "Damn it... Hurry up and get over here!"
2601708-7 = "Please don't scold her too harshly. I'm sure the Sensei is reflecting deeply as well."
2601708-8 = "I'm calling you here to scold you!"
2601708-10 = "[ns] \"Um, excuse me... Is there something you need...?\""
2601708-12 = "You're finally here! Are you this kid's guardian?"
2601708-13 = "[s] \"As an adult, I'm the guardian of all children.\""
2601708-14 = "Hmph, you've certainly got a quick tongue!"
2601708-15 = "If you're her guardian, you should fulfill your supervisory responsibilities before saying things like that... This kid here—"
2601708-17 = "Seriously... What kind of person accepts a food delivery in a place like this? #nBesides, at this distance, you could've just sent it by regular mail."
2601708-18 = "Well, I guess long-distance fees apply from here to D.U., so it works out for me."
2601708-19 = "Looks like she used a free delivery coupon too... #nEither way, it's getting billed later, so it's none of my business."
2601708-23 = "Oh, coming out to greet me? How kind of you."
2601708-27 = "Sorry to keep you waiting! I'm here to accept the delivery!"
2601708-28 = "Ah."
2601708-32 = "Hello, I am takoyaki."
2601708-33 = "Please accept me, tako."
2601708-37 = "Huh?"
2601708-40 = "[ns] \"Huh?\""
2601708-41 = "See? Aren't you going to get that kind of reaction?"
2601708-42 = "I've told her over and over that you can't deliver humans, but it's like talking to a brick wall—"
2601708-44 = "Hey— no, customer! This is a food delivery service, you know?!"
2601708-45 = "It doesn't matter if you put bonito flakes on your head and insist you're takoyaki!"
2601708-46 = "As you can see, I am takoyaki."
2601708-47 = "Ah, I forgot the aonori. Aonori is essential, I understand."
2601708-48 = "I-Told-You-So!! This place delivers food, period!!!"
2601708-49 = "Pardon me, but in delivery protocols, what is the definition of \"food\"?"
2601708-50 = "Pro... what now?"
2601708-51 = "You asking for the definition of food? Well, food is anything you can eat, obviously!"
2601708-52 = "Yes, you can eat me as well."
2601708-53 = "See, there are bonito flakes on top of my head, aren't there?"
2601708-54 = "Even if you say you can eat you, isn't it just a tiny little bit?!"
2601708-55 = "By that logic, #ncoconuts and crabs would also cease to be classified as food due to having a small edible portion..."
2601708-56 = "What the—?! N-No... Those are definitely food, aren't they?!"
2601708-57 = "Th-That's right! You're alive, aren't you? Therefore, you can't be food!"
2601708-58 = "By that logic, eating live whitebait (shirouo) would also no longer be classified as food."
2601708-59 = "Oh, come on!! Food is basically—"
2601708-60 = "By that logic—"
2601708-61 = "No! That's food! That's why—"
2601708-62 = "So you add a condition every time an exception arises to the definition."
2601708-63 = "The current conditional statements have reached 17. #nI recommend redefining it recursively once."
2601708-64 = "Wh-What the heck?!"
2601708-65 = "Now then, would this be considered food—"
2601708-68 = "Haa..."
2601708-69 = "[s1] \"The fact that you brought her all the way here...\"\n[s2] \"Did you end up admitting she was food...?\""
2601708-72 = "As if I'd do that!! #n Arguing any further was getting us nowhere, so I just dragged her here!"
2601708-73 = "I am very glad that exception handling has been added to the delivery protocol."
2601708-74 = "It hasn't been added!!"
2601708-75 = "I got paid properly, so I guess it's fine, but... ugh."
2601708-76 = "I'm never playing along with this kind of pretend play again, so make sure you give her a good scolding!"
2601708-77 = "[s3] \"I'm sorry...\"\n[s4] \"I'll talk to her...\""
2601708-80 = "Things could've been dangerous if it had been someone else, you know?"
2601708-81 = "Yes. I'm glad the delivery worker was a kind and good-natured person."
2601708-82 = "They even treated me, a piece of food, like a human being."
2601708-83 = "So... ugh, whatever. Well, I'll leave the rest to you!"
2601708-88 = "I'm glad to see they understood after a polite explanation."
2601708-89 = "[s5] \"It certainly didn't look that way at all...\"\n[s6] \"Let's stick to a safe method next time.\""
2601708-92 = "They put a helmet on me, so I was able to arrive safely."
2601708-93 = "So, what shall we do now?"
2601708-94 = "[s] \"Didn't you have something you wanted to do?\""
2601708-95 = "No, not really. I just wanted to see Sensei."
2601708-96 = "If you are going to work, I will wait right beside you."
2601708-97 = "[s] \"Then, how about we go for a walk?\""
2601708-98 = "Sounds nice. How lucky of me to be here when Sensei takes a walk."
2601708-99 = "I will follow you."
2601708-108 = "It's already nighttime."
2601708-109 = "Thanks to Sensei, it was a wonderful time."
2601708-110 = "There are so many interesting things in the world."
2601708-111 = "...It's bad for children to be out late, so I'll be heading home now."
2601708-112 = "I'll spend even more time with you next time, so try not to be too lonely."
2601708-113 = "[s7] \"She said everything she wanted to say...\"\n[s8] \"Promise me you won't come via delivery service next time, okay? Promise!\""
2601708-116 = "Of course. #nThis time I caused trouble for Sensei and the delivery worker. I won't do it again."
2601708-117 = "I won't use home delivery for transportation either. I remember what I was told."
2601708-118 = "Getting back will be no problem, so please don't worry."
2601708-119 = "[s] \"Great! In that case, I'll walk you to the station!\""
2601708-120 = "No. That won't be necessary."
2601708-121 = "If I hack the Red Winter server, a car from the office will come pick me up right away."
2601708-122 = "Therefore, you are free to head home first."
2601708-123 = "[s] \"I'm walking you home anyway!!\""
2601708-124 = "Is that so? Understood...?"
2601708-126 = "(Afterward, I saw Rana off.)"
2601708-127 = "(Rana waved until she was completely out of sight.)"
