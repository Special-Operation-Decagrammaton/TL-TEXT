[translation]
10018010-1 = "Эпизод 1; Требуется помощь!"
10018010-2 = ""
10018010-5 = ""
10018010-6 = "А ведь день так хорошо начинался..."
10018010-7 = "Сегодня у меня не было работы, я смогла выспаться, приготовила себе вкусный завтрак..."
10018010-8 = "Даже надевая кимоно, я с нетерпением ждала первой молитвы в новом году..."
10018010-9 = "Но потом... Потом..."
10018010-10 = ""
10018010-12 = ""
10018010-13 = "Почему именно я?!"
10018010-14 = "Фуука..."
10018010-15 = ""
10018010-17 = ""
10018010-20 = ""
10018010-21 = "То, что планы рушатся, — всего лишь часть самой жизни."
10018010-22 = "Снова и снова вам придётся преодолевать бесчисленные испытания, которые подбрасывает жизнь..."
10018010-23 = "Человеческие достижения рождаются лишь из пепла борьбы."
10018010-24 = "Высокопарные слова для человека, который меня похитил."
10018010-25 = "Не стоит благодарности."
10018010-26 = "Кстати о комплиментах: красивое кимоно, Фуука. Тебе очень идёт."
10018010-27 = "...Спасибо, наверное. Ты и твой наряд тоже выглядите прекрасно, Харуна."
10018010-28 = "Спасибо, спасибо. Сегодня я нарядилась чуть больше обычного."
10018010-29 = ""
10018010-31 = ""
10018010-32 = "Ну а теперь перейдём к делу."
10018010-33 = "Есть вопрос чрезвычайной важности, ради которого Общество гурманов... пригласило тебя сюда сегодня."
10018010-34 = "У нас для тебя важная миссия."
10018010-35 = "Ты ведь знаешь, что «похитить» и «пригласить» — не синонимы, да?"
10018010-36 = "Хотя к этому моменту я уже привыкла, что ты ведёшь себя так, будто это одно и то же."
10018010-37 = "Если задуматься, поговорка «Люди — рабы привычки» звучит немного пугающе, правда?"
10018010-38 = "Да-да, приносим извинения. Итак, Общество гурманов обнаружило настоящий неогранённый алмаз — ресторан под названием «Воробей»."
10018010-39 = "Но «Воробей» скоро закроется."
10018010-40 = ""
10018010-42 = ""
10018010-44 = "Фуука, если бы трюфели лежали без всякой защиты прямо у дороги..."
10018010-45 = "...что бы ты сделала как повар?"
10018010-46 = "Конечно же, настояла бы на них масло."
10018010-47 = "Их нужно было бы приготовить как можно скорее."
10018010-48 = "Именно. Именно так мы и должны рассматривать эту ситуацию."
10018010-49 = "Закрытие ресторана с таким огромным потенциалом — потеря для всего мира."
10018010-50 = "А позволить этому случиться было бы оскорблением самой гастрономии."
10018010-51 = "Если ты собираешься заставить меня выслушать всю эту речь, можешь хотя бы развязать меня?"
10018010-52 = "Эм, разве закрываться ресторану или нет — не решение владельца?"
10018010-53 = "Закрытие ресторана — решение его владельца..."
10018010-54 = "В основе своей это верно."
10018010-55 = ""
10018010-57 = ""
10018010-59 = "Но...! Даже если это их право, я, Куродатэ Харуна, отвергаю это решение!"
10018010-60 = "Бог прощает, а я — нет!"
10018010-62 = "Нет, пожалуйста, начни прощать людей. И начни их развязывать."
10018010-63 = ""
10018010-65 = ""
10018010-67 = "Думаю, уже скоро..."
10018010-68 = ""
10018010-71 = ""
10018010-72 = "О, ага. Вы здесь, Сенсей."
10018010-73 = ""
10018010-74 = "Ура!"
10018010-75 = ""
10018010-76 = "Как вы поживали?"
10018010-77 = ""
10018010-78 = "[ns] «Здравствуйте, все.»"
10018010-80 = "[ns] «Все выглядят потрясающе в этих нарядах.»"
10018010-81 = ""
10018010-84 = ""
10018010-85 = "Сенсей! Вы пришли меня спасти?!"
10018010-86 = "[s] «Хотелось бы, чтобы это было так...»"
10018010-87 = ""
10018010-89 = ""
10018010-90 = "[ns] «Но меня тоже похитили.»"
10018010-91 = ""
10018010-93 = ""
10018010-94 = "О. Понятно. Всё хорошо. Я в порядке. Я не буду плакать."
10018010-95 = "Можно я хотя бы поплачу?"
10018010-97 = "Все необходимые участники собрались, так что давайте придумаем решение."
10018010-98 = "Как нам спасти «Воробья»?"
10018010-99 = "Вот вопрос, который должно решить Общество гурманов!"
10018010-100 = ""
10018010-103 = "[ns] «Похищение правда было необходимой частью этого плана?»"
10018010-104 = "Это предприятие основано на решимости и твёрдости духа, Сенсей."
10018010-105 = "Используя столь нестандартные методы..."
10018010-106 = "...я показываю от всего сердца, насколько искренне к этому отношусь."
10018010-108 = "И какой следующий шаг твоей искренности? Убийство?"
10018010-109 = "*кивок* *кивок*"
10018010-111 = ""
10018010-112 = "[ns1] «Если забыть о похищении, мне кажется, мы пропустили один шаг.»\n[ns2] «А что обо всём этом говорит владелец?»"
10018010-115 = "Верно. Мнение человека, чьи средства к существованию от этого зависят..."
10018010-116 = "Я была настолько увлечена, настолько искренна, что эта маленькая деталь вылетела у меня из головы."
10018010-117 = "Спасибо за совет, Сенсей."
10018010-118 = "Хорошо, что мы похитили..."
10018010-119 = "То есть пригласили вас, Сенсей."
10018010-121 = "(Я начинаю сомневаться, насколько вообще она всё это продумала...)"
10018010-125 = ""
10018010-126 = ""
10018010-127 = "Хм? Это тот, о ком я думаю?"
10018010-128 = "Харуна, тут что-то не так..."
10018010-129 = ""
10018010-131 = ""
10018010-135 = "Вы что, не понимаете?"
10018010-136 = "Убирайтесь уже! Сколько раз вам ещё повторять?!"
10018010-138 = "Простите, простите. Такие вещи требуют времени."
10018010-139 = "У меня только что были последние гости. Я съеду, как только смогу..."
10018010-140 = "Уф, не то чтобы нам хотелось этим заниматься."
10018010-141 = "Мы хорошие люди. Самые хорошие. При правильных обстоятельствах."
10018010-142 = "А правильные обстоятельства — это всего лишь когда вы делаете то, что мы говорим."
10018010-143 = ""
10018010-145 = ""
10018010-146 = "Понимаете? Так давайте вместе создадим эти «правильные обстоятельства»."
10018010-147 = ""
10018010-149 = ""
10018010-151 = ""
10018010-152 = ""
10018010-153 = "Хи-хи-хи-хи..."
10018010-154 = "Х-Харуна?"
10018010-155 = "Похоже, сегодня у нас есть ещё гости. Неприятные."
10018010-156 = "Гости, с которыми мы разберёмся, правда, Харуна? ★"
10018010-157 = "Общество гурманов стремится найти лучшую еду, которую только может предложить мир."
10018010-158 = "Поэтому, когда тот, кто создаёт такую еду, попадает в беду..."
10018010-159 = "Что ж, мы просто не можем это проигнорировать."
10018010-160 = "Полностью согласна! Давайте начинать!"
10018010-161 = "Уф. Я знала, что случится что-то подобное."
10018010-163 = "Х-Харуна, что именно ты собираешься делать?"
10018010-164 = "Наверное, нам лучше отойти, на всякий случай..."
10018010-165 = "[s] «Мудро, Джури.»"
10018010-166 = ""
10018010-168 = ""
10018010-169 = "О, спасибо, Сенсей!"
10018010-170 = "Но это скорее не мудрость, а... рефлекс, приобретённый опытом?"
10018010-171 = "Ага, Сенсей. Когда Харуна такая, до неё невозможно достучаться..."
10018010-173 = ""
10018010-174 = ""
10018010-176 = ""
10018010-177 = "Э-Эй! Вы что творите?!"
10018010-178 = "Не видите, мы тут работаем?!"
10018010-179 = ""
10018010-181 = ""
10018010-184 = ""
10018010-185 = "Нет, не вижу."
10018010-186 = "Я вижу лишь бандитов, нарушающих гастрономическую гармонию."
10018010-187 = "А с бандитами я предпочитаю общаться при помощи стрельбы."
10018010-188 = ""
10018010-190 = ""
10018010-194 = ""
10018010-195 = "Ну что же."
10018010-196 = ""
10018010-198 = ""
10018010-200 = "Общество гурманов, вы готовы?"
