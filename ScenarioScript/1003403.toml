[translation]
1003403-1 = "Этикет I: Домашняя кухня"
1003403-2 = "Студенческая столовая Хяккияко №7"
1003403-3 = "Сегодня я арендовала студенческую столовую!"
1003403-4 = "Я хотела попрактиковаться в готовке — обязательном навыке настоящей леди."
1003403-5 = "Точнее, в домашней кухне."
1003403-6 = "[s] «Что ты хочешь приготовить?»"
1003403-7 = "Я хотела бы начать с самого основного домашнего блюда."
1003403-8 = "Тушёное мясо с картофелем!"
1003403-9 = "[s1] «О, классика!»\n[s2] «Самое настоящее домашнее блюдо!»"
1003403-10 = "Именно! Я хочу готовить как настоящая леди."
1003403-11 = "Именно! Я хочу готовить как настоящая леди."
1003403-12 = "Я считаю, что готовка настоящей леди должна быть изящной и непринуждённой."
1003403-13 = "Ингредиенты простые, а процесс понятный."
1003403-14 = "Поэтому после долгих размышлений я решила, что это лучший способ практиковать манеры настоящей леди."
1003403-15 = "Сенсей, вам нравится тушёное мясо с картофелем?"
1003403-16 = "[s3] «Это моё самое любимое блюдо.»\n[s4] «Знаешь, думаю, мне понравится, если его приготовишь ты!»"
1003403-17 = "Хи-хи. Рада это слышать."
1003403-18 = "Н-неужели?"
1003403-19 = "[s] «Я до сих пор вспоминаю тот сэндвич, который ты мне приготовила.»"
1003403-20 = "Правда?"
1003403-21 = "С-Спасибо."
1003403-22 = "[s] «Буду ждать с нетерпением.»"
1003403-23 = "Вы всегда так меня поддерживаете..."
1003403-24 = "Хорошо!"
1003403-25 = "Теперь я полностью мотивирована!"
1003403-26 = "Я вложу все силы!"
1003403-27 = "[s5] «Ты разве не говорила, что готовка должна быть „непринуждённой“?»\n[s6] «Не знаю, насколько это „изящно“...»"
1003403-28 = "Можете на меня рассчитывать!"
1003403-29 = "Можете на меня рассчитывать!"
1003403-30 = "[s] «Н-Ну, раз ты так говоришь.»"
1003403-33 = "[ns] «Эм... Мимори?»"
1003403-34 = "Минутку, Сенсей. Нужно только взвесить всё на весах..."
1003403-35 = "Нужно быть точной. Всё должно быть в точности по рецепту."
1003403-36 = "[s] «Не обязательно настолько...»"
1003403-37 = "Сенсей, пожалуйста!"
1003403-38 = "Я должна оправдать ваши ожидания. Настоящая леди никогда не разочаровывает."
1003403-39 = "Я хочу показать вам, насколько продвинулась в тренировках."
1003403-40 = "Обещаю, всё будет идеально!"
1003403-42 = "[s] «Я-Я очень благодарен, но...»"
1003403-44 = ""
1003403-45 = ""
1003403-46 = "*тук*"
1003403-47 = "Я готова, Сенсей! У меня есть соевый соус, кулинарное вино, сахар и вода...#nВсё, что указано в рецепте."
1003403-48 = "Тогда начинаю!"
1003403-49 = "Сложу сюда все отмеренные приправы..."
1003403-50 = "Положить в кастрюлю мясо, лук и морковь... И варить на слабом огне!"
1003403-52 = "*буль-буль*"
1003403-53 = "Когда бульон вот так закипает, лук должен начать становиться прозрачным."
1003403-54 = "Нужно убавить огонь... накрыть крышкой и тушить 20 минут."
1003403-55 = "Когда лук станет полностью прозрачным, добавить картофель и варить ещё 20 минут..."
1003403-58 = "*буль-буль*"
1003403-59 = "Готово, Сенсей. Я вложила всё сердце в это тушёное мясо с картофелем!"
1003403-60 = "Попробуете?"
1003403-61 = "[s] «С удовольствием!»"
1003403-62 = "*глоть*"
1003403-63 = "[s] «*ням* *ням*»"
1003403-64 = ""
1003403-67 = "[ns] «А?!»"
1003403-68 = "В-Вам нравится?"
1003403-69 = "[s] «Соль. Я чувствую только соль.»"
1003403-70 = "Не может быть... Н-Но я точно следовала рецепту!"
1003403-71 = "*жует* *жует*"
1003403-72 = ""
1003403-73 = "К-Как такое возможно? Оно и правда СЛИШКОМ солёное!"
1003403-74 = "[s] «Мимори, кажется, ты использовала соль вместо сахара.»"
1003403-75 = "О!"
1003403-76 = "Какая ужасная ошибка! П-Простите меня, Сенсей!"
1003403-77 = "Я была невнимательна! Что... Что же делать?!"
1003403-78 = "Я ведь сказала, что приготовлю вам замечательное домашнее блюдо!"
1003403-79 = "Я сказала, что не разочарую ваши высокие ожидания..."
1003403-80 = "Я совершенно недостойна называться настоящей леди..."
1003403-81 = "[s] «Всё нормально. Успокойся, Мимори.»"
1003403-82 = "Но, Сенсей..."
1003403-83 = "[s7] «Иногда ошибки приводят к открытиям.»\n[s8] «Даже настоящим леди приходится учиться на ошибках.»"
1003403-84 = "В-Вы правы. Спасибо за вашу доброту, Сенсей."
1003403-85 = "В-Вы правы. Спасибо за вашу доброту, Сенсей."
1003403-86 = "Хорошо. Настоящая леди должна спокойно принимать свои ошибки."
1003403-87 = "Паника ничего не решит."
1003403-88 = "Как вы и сказали, я могу чему-то научиться на этом."
1003403-89 = "Дайте подумать..."
1003403-90 = "О, кажется, я придумала!"
1003403-91 = "Одну минутку, Сенсей!"
1003403-92 = ""
1003403-94 = ""
1003403-95 = ""
1003403-96 = "[ns] «Это... карри.»"
1003403-97 = "В шкафу нашёлся брикет карри."
1003403-98 = "Тушёное мясо с картофелем не так уж сильно отличается от карри."
1003403-99 = "Я подумала, что можно добавить карри и уравновесить солёность."
1003403-100 = "К-Конечно, я пойму, если вы не захотите пробовать. Особенно после первой катастрофы..."
1003403-101 = ""
1003403-104 = "[ns] «Это карри очень вкусное, Мимори.»"
1003403-105 = "К-Какое облегчение..."
1003403-106 = ""
1003403-107 = "Хи-хи-хи!"
1003403-108 = "[s] «Что смешного?»"
1003403-109 = "Карри — очень распространённое домашнее блюдо."
1003403-110 = "Всё пошло не совсем по плану, но в итоге я всё равно получила желаемый результат."
1003403-111 = "Я просто счастлива, что всё получилось."
1003403-112 = "И это благодаря вашей поддержке."
1003403-113 = "Мне очень повезло."
1003403-114 = "[s] «Думаешь? Что ж, рад это слышать.»"
1003403-115 = "Правда!"
1003403-116 = "Мне очень нравится учиться у вас, Сенсей."
1003403-117 = "Но осталось ещё столько всего!"
1003403-118 = "Хотите добавки?"
1003403-120 = "Мы с Мимори с удовольствием съели приготовленное ею домашнее карри."
