[translation]
83302200500-5 = ""
83302200500-6 = "А-а-а! Хина, спасибо, что пришла!"
83302200500-7 = ""
83302200500-9 = ""
83302200500-11 = ""
83302200500-12 = "Я разобралась с теми... существами, которые устроили бардак в вашей клубной комнате..."
83302200500-13 = "Но, Джури, что здесь случилось?"
83302200500-14 = "Это... Это...!"
83302200500-15 = "Д-дело в том... Эм..."
83302200500-16 = "А-а-а! Фууку снова похитили!"
83302200500-17 = "Она сказала мне ждать, пока вернётся, но...!"
83302200500-18 = "Срок заказа еды для Общества Пандемониума уже почти наступил..."
83302200500-19 = "Я боялась, что Общество Пандемониума воспользуется просрочкой как поводом урезать бюджет Клуба школьных обедов, поэтому я... я... я—! *рыдает*"
83302200500-20 = "Дыши, Джури. Всё хорошо. Давай разберём события по порядку."
83302200500-22 = ""
83302200500-25 = ""
83302200500-27 = "Судя по тому, что ты рассказала..."
83302200500-28 = "Ты поняла, что срок заказа Общества Пандемониума уже слишком близко и больше откладывать нельзя."
83302200500-29 = "*шмыгает носом* Д-да..."
83302200500-30 = "Но в то же самое время Фуука..."
83302200500-31 = "Её, как назло, похитило Общество гурманов."
83302200500-32 = "*шмыгает носом* Д-да, именно так..."
83302200500-33 = "Но ты испугалась, что будет с клубом, если вы не закончите заказ. Поэтому решила сама изо всех сил выполнить его, хотя Фуука просила тебя подождать."
83302200500-34 = "И вспомнила, что глава Отдела горячих источников уверяла, будто под Клубом школьных обедов находится потрясающий горячий источник. Наверняка она рассказывала тебе, как добраться до жилы горячей воды."
83302200500-35 = "И ты решила использовать её, чтобы приготовить яйца в горячем источнике..."
83302200500-36 = "А в результате... появились эти существа."
83302200500-38 = "*шмыг* *всхлипывает* Да! Всё так...! Это всё моя вина!"
83302200500-39 = "(А Макото оказалась в таком состоянии после того, как съела еду Джури.)"
83302200500-40 = "А-а-а! Хина! Фуука! П-простите меня!"
83302200500-41 = "Тебе не за что извиняться, Джури."
83302200500-42 = "Даже если всё закончилось неприятностями, ты просто изо всех сил пыталась справиться с чрезвычайными обстоятельствами."
83302200500-43 = "*шмыгает носом* Х-Хина!"
83302200500-44 = "Однако если оставить Фууку у похитителей, это приведёт только к новым проблемам."
83302200500-45 = "Спасибо за помощь. Я займусь Фуукой, так что больше о ней не беспокойся."
83302200500-46 = "Хорошо! Спасибо, Хина! Я оставляю это вам!"
