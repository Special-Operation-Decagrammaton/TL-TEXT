[translation]
1005106-1 = "Пылающая душа капитана... страсти?"
1005106-6 = "Караоке возле Миллениума"
1005106-8 = "[ns1] «...И?»\n[ns2] «Ты уверена, что караоке сейчас — хорошая идея?»"
1005106-11 = "В смысле? Это же ты предложил подбодрить младших."
1005106-12 = "А что может поднять настроение лучше, чем поддержка?"
1005106-13 = "И где лучше поддерживать, чем в караоке!"
1005106-14 = ""
1005106-17 = "[ns3] «...И как ты к этому пришла?»\n[ns4] «Я не совсем понимаю.»"
1005106-18 = "Знаешь ведь, как бодрая музыка поднимает настроение?"
1005106-19 = "Знаешь ведь, как бодрая музыка поднимает настроение?"
1005106-20 = "Как бы я ни пыталась что-то придумать, мои инженерные навыки здесь им никак не помогут..."
1005106-21 = "Поэтому я решила, что следующая лучшая идея — караоке."
1005106-22 = "...А ещё я решила сочинить оригинальную песню для Инженерного отдела."
1005106-23 = "[s] «Оригинальную песню?»"
1005106-24 = "Хи-хи. Если точнее — тематическую песню."
1005106-25 = "Я хочу сочинить песню, которая действительно подчеркнёт все достижения Инженерного отдела."
1005106-26 = "[s] «Под песней ты имеешь в виду... настоящую песню? А под оригинальной — оригинал от Утахи?»"
1005106-27 = "На что ты намекаешь?"
1005106-28 = "Музыка и машины — по сути одно и то же."
1005106-29 = "Машинам нужны отдельные детали, которые работают вместе и образуют оптимальную конструкцию, а музыке нужны отдельные ноты, которые складываются в гармоничную песню."
1005106-30 = "Даже слова «маэстро», то есть дирижёр, и «мастер» имеют похожее происхождение."
1005106-31 = "Кто знает? Если бы я поступила в академию «Уайлдхант», а не в Миллениум, возможно, стала бы маэстро, а не мастером."
1005106-32 = "[s] «...»"
1005106-33 = "...Что такое? Вспомнил что-то неприятное?"
1005106-34 = "Если да, тебе повезло. У меня уже есть кое-что, что поднимет тебе настроение. Хочу, чтобы ты это услышал."
1005106-35 = ""
1005106-37 = ""
1005106-38 = ""
1005106-40 = "Я называю её... «Пылающая душа мастера, объятая огненной страстью»."
1005106-41 = ""
1005106-43 = ""
1005106-46 = ""
1005106-48 = ""
1005106-49 = "― Пылает душа мастера,"
1005106-51 = ""
1005106-52 = "― и трудимся мы, словно поезд, пожирающий уголь без меры."
1005106-55 = ""
1005106-56 = "― Улучшим ваши гаджеты, даже если вы не просили!"
1005106-59 = "[ns] «...»"
1005106-60 = ""
1005106-61 = "― Подвижным деталям смазку подай — и механизм не подведёт, так и знай."
1005106-63 = ""
1005106-64 = "― А для любого ремонта нет ничего лучше клейкой ленты."
1005106-67 = ""
1005106-68 = "― Починить машину способен любой, возможно, даже ты."
1005106-70 = ""
1005106-71 = "― Но если нужна надёжность — наше качество неоспоримо, только ответственности мы не несём."
1005106-74 = "[ns] «...Утаха, погоди, эм... Стой, Утаха.»"
1005106-75 = ""
1005106-77 = ""
1005106-78 = ""
1005106-79 = "Что такое, Сенсей? Я как раз собиралась перейти к кульминации."
1005106-80 = "С моей песней что-то не так? Недостаточно техническая?"
1005106-81 = "[s5] «Мелодия и ритм сбиваются.»\n[s6] «Текст... немного ставит в тупик.»"
1005106-82 = "Ритм сбивается?"
1005106-83 = "Это потому что... Возможно, страсть моих слов слишком сильна, чтобы простой звук мог ей соответствовать?"
1005106-84 = "Текст сложно понять?"
1005106-85 = "Наверное, потому что... Нет, определённо потому, что скрытая в этих словах страсть слишком велика, чтобы один человек мог воспринять её целиком."
1005106-86 = "Но инженерия — это одна часть изобретения и тысяча частей доработки. Я стану лучше, обещаю."
1005106-87 = "...А пока хочешь послушать ещё? Думаю, как только услышишь припев, вся песня наконец сложится для тебя воедино."
1005106-88 = "Итак."
1005106-89 = ""
1005106-92 = ""
1005106-93 = "― Как пармезан, кипящий в Табаско! Никакого фиаско-о-о-о!"
1005106-95 = ""
1005106-96 = "― Если страсть — наш ингреди-е-е-ент, всё получится в один моме-е-е-ент!"
1005106-100 = "[ns] «Но почему Табаско...?»"
1005106-102 = "Звуки Утахи, отдалённо напоминавшие песню, продолжались больше часа..."
1005106-103 = "...Вскоре я обнаружил, что участники Инженерного отдела вымотались из-за энергии, которую требовалось тратить на прослушивание странного вокала Утахи..."
