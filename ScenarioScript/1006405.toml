[translation]
1006405-1 = "Камджу и кот"
1006405-2 = "На следующее утро, пока я ждал Каёко на территории храма..."
1006405-3 = "О, Сенсей? Вы пришли раньше и ждали снаружи?"
1006405-4 = "Сегодня прохладно, а вы не стали ждать внутри..."
1006405-5 = "[s] «Ничего, я всё равно ждал недолго.»"
1006405-6 = ""
1006405-8 = ""
1006405-9 = ""
1006405-10 = "Но руки у меня совсем замёрзли..."
1006405-11 = "Лучше зайдём внутрь и согреемся."
1006405-12 = "Наверняка где-нибудь поблизости продают горячие напитки."
1006405-13 = "Как насчёт сладкого камджу?"
1006405-14 = "Его только что сварили, так что он очень горячий. Берите кружку, пока не остыл!"
1006405-15 = "Интересно, его раздают на территории храма из-за Нового года?"
1006405-16 = "Сенсей, может, согреемся камджу перед тем, как идти покупать амулет?"
1006405-17 = "[s] «Хорошо.»"
1006405-18 = "Сюда! Два стакана камджу, пожалуйста."
1006405-22 = "[ns1] «А-а, как тепло...»\n[ns2] «Чувствую, как согреваюсь изнутри...»"
1006405-23 = "Хи-хи. Я скучала по этому вкусу."
1006405-24 = "Хи-хи. Я скучала по этому вкусу."
1006405-25 = "Это напоминает мне о первом разе, когда я пила камджу совершенно беззаботно."
1006405-26 = "[s] «Давным-давно что-то случилось?»"
1006405-27 = "Ну, камджу — ферментированный напиток, так что в нём всё же есть немного алкоголя, да?"
1006405-28 = "Были ученики, которые плохо переносили алкоголь, и иногда после камджу они устраивали настоящий бардак."
1006405-29 = "Поэтому каждый год, когда я пью камджу, я не могу нормально наслаждаться вкусом: всё время переживаю, нет ли рядом пьяных учеников..."
1006405-30 = "Но рядом с вами, Сенсей, можно не волноваться, ведь вы взрослый."
1006405-31 = "[s] «А ты сама никогда не пьянела от камджу, Каёко?»"
1006405-32 = "Конечно нет! Разве можно опьянеть от того, что практически сок?"
1006405-33 = "Хотя я не уверена, что будет, если выпить несколько стаканов подряд..."
1006405-34 = "Камджу сладкий и вкусный, но я уже достаточно согрелась одной кружкой."
1006405-35 = "Ну что, раз мы согрелись, может..."
1006405-36 = ""
1006405-39 = "А..."
1006405-40 = "Простите, Сенсей, не могли бы вы немного подождать здесь?"
1006405-41 = "Меня кое-что заинтересовало..."
1006405-42 = "[s] «Конечно, иди.»"
1006405-43 = "Тогда я скоро вернусь."
1006405-44 = ""
1006405-46 = ""
1006405-48 = "Но прошло уже больше десяти минут, а Каёко всё не возвращалась..."
1006405-50 = "[ns] Пойти в ту сторону, куда ушла Каёко."
1006405-51 = ""
1006405-52 = ""
1006405-53 = "Вот так, вот так, хороший малыш. Хи-хи..."
1006405-54 = "Ты живёшь где-то рядом? Похоже, ты хорошо знаком с человеческими руками."
1006405-55 = ""
1006405-58 = "Ох, понятно, какое милое мяуканье."
1006405-59 = ""
1006405-61 = ""
1006405-62 = "Кис-кис, мягонький котик ♪"
1006405-63 = "[s3] «Похоже, тебе весело.»\n[s4] «Ты играла с этими котами?»"
1006405-64 = "С-Сенсей...?! Как вы вообще сюда пришли...?"
1006405-65 = "С-Сенсей...?! Как вы вообще сюда пришли...?"
1006405-66 = "Я не возвращалась, и вы сами меня нашли...? П-простите... Я отвлеклась, играя с этими котами..."
1006405-67 = "Так... эм... вы... вы..."
1006405-68 = "...всё это видели?"
1006405-69 = "[s] «...Ага.»"
1006405-70 = "Я не хотела специально говорить таким милым голосом..."
1006405-71 = "Хотя нет, хотела, но только потому, что думала, что никто не смотрит..."
1006405-72 = ""
1006405-74 = ""
1006405-75 = "...Во всём виноват камджу."
1006405-76 = "Я уверена, камджу, который мы пили раньше... затуманил мой рассудок..."
1006405-77 = "Я больше никогда не буду пить камджу...!"
1006405-79 = "...Позже я успокоил смущённую Каёко, и мы отправились покупать амулет."
