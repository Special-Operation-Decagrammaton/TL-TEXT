[translation]
2000109-1 = "Мейд-кафе! Часть 2"
2000109-2 = "Кафе Maidramatic!"
2000109-3 = ""
2000109-4 = "..."
2000109-5 = "..."
2000109-6 = "Не смотри на меня так."
2000109-7 = "Подруга вернулась на свою смену, но менеджер попросил меня помочь ещё один последний раз. Было бы неловко отказать."
2000109-8 = "*вздох* К тому же здесь все говорят, что я хорошо работаю. Вот бы меня так же хвалили за учёбу."
2000109-9 = "[s1] «Ты всегда работаешь вместо учёбы...»\n[s2] «Признание твоего труда — не так уж плохо, верно?»"
2000109-10 = "Верно. Тут не поспоришь."
2000109-11 = "Верно. Тут не поспоришь."
2000109-12 = "Но сегодня точно мой последний день! Без вариантов."
2000109-13 = "Ладно, Сенсей. Заказывай, когда будешь готов."
2000109-14 = "[s] «Я хочу ту особую просьбу, о которой мы говорили в прошлый раз.»"
2000109-15 = "Т-Ты всё ещё об этом?!"
2000109-16 = "Даже менеджер был против."
2000109-17 = "И ещё... я не хочу наступать на учителя. Это неправильно."
2000109-18 = "[s] «На учителя наступать неправильно, а на своего господина? Совсем другое дело.»"
2000109-19 = "Тут не поспоришь."
2000109-20 = "Ложись и—"
2000109-22 = "Кья! Г-Господин! Так нельзя!"
2000109-23 = "Ха-ха! Какая милашка! Я будто умер и попал в рай!"
2000109-24 = "Ух. Они пьяные."
2000109-25 = "Пьяные — худшие клиенты."
2000109-26 = "Чем вообще занимается менеджер?"
2000109-27 = "*ик* Настоящий ободок горничной! Можно потрогать?"
2000109-28 = "Ублюдок..."
2000109-29 = "Я могла бы быстро его заткнуть. Нет, погоди. Моё оружие не подходит для помещений."
2000109-30 = "И если разойдётся слух, что горничная застрелила клиента..."
2000109-31 = ""
2000109-32 = "Тц. И что мне делать...?!"
2000109-33 = ""
2000109-34 = "[ns] Встать и подойти к пьяному."
2000109-36 = "А? Ты кто такой?! Я такого не заказывал!"
2000109-37 = "[s3] «В нашем кафе есть горничные всех форм и размеров.»\n[s4] «Я заказываю тебе убраться отсюда к чёрту.»"
2000109-38 = "Ч-что?!"
2000109-39 = "Ч-что?!"
2000109-40 = "[s5] «Девушка рядом со мной? Она не так проста, как кажется.»\n[s6] «Думаешь, это шутка?»"
2000109-41 = "Г-Господи! Я думал, это рай, а это вечный ад!"
2000109-42 = "Г-Господи! Я думал, это рай, а это вечный ад!"
2000109-43 = "О-Отойдите от меня! С-Сдачу оставьте себе, только выпустите!"
2000109-45 = "С-Спасибо!"
2000109-46 = "...Невероятно."
2000109-47 = "Я у тебя в долгу. Спасибо, Сенсей."
2000109-48 = "Я всего на секунду отвернулась... и вот что случилось!"
2000109-49 = "Придётся сообщить об этом Валькирии."
2000109-50 = "Благодарю за помощь, незнакомец."
2000109-51 = "Вот специальная клубная карта нашего мейд-кафе."
2000109-52 = "С ней можно входить без платы за вход!"
2000109-53 = "[s7] «Тебе не обязательно отдавать это мне.»\n[s8] «Есть кое-что, что понравилось бы мне ещё больше.»"
2000109-54 = "Хочешь что-то другое? Если это в наших силах..."
2000109-55 = "Хочешь что-то другое? Если это в наших силах..."
2000109-56 = "Н-Нет. Только не говори..."
2000109-57 = "[s] «Особая просьба.»"
2000109-58 = "?!"
2000109-59 = "*вздох* Если клиент этого хочет."
2000109-60 = "Что?! С каких пор здесь клиент всегда прав?!"
2000109-61 = ""
2000109-63 = ""
2000109-64 = "П-Погоди!"
2000109-65 = "Я-я не думаю, что готова..."
2000109-66 = "Ух. Л-Ладно!"
2000109-67 = "...сделаю вот это."
2000109-68 = "Хорошо, Сенсей..."
2000109-69 = ""
2000109-70 = "Ложись."
2000109-73 = "― Э-Это правда... награда?[wa:3420]"
2000109-75 = "― Так... Эм. Это...[wa:3220]"
2000109-78 = "― ...очень стыдно. Но если ты и правда этого хочешь, Сенсей.[wa:2280]"
2000109-81 = "― Хочешь немного сильнее...? Л-Ладно.[wa:4760]"
2000109-84 = "― Если ты счастлив, Сенсей... тогда и я счастлива.[wa:2640]"
2000109-87 = "― А! Н-Не вставай так резко! Я могла упасть![wa:1420]"
2000109-90 = "Ты очень... интересный человек, Сенсей."
2000109-91 = "Но кое-что я хочу прояснить."
2000109-92 = "Сегодня последний раз... когда я делаю подобное в этом кафе."
2000109-93 = "..."
2000109-94 = "Хех. Не смотри так разочарованно."
2000109-95 = "Если ты захочешь что-нибудь подобное... где-нибудь наедине..."
2000109-96 = ""
2000109-97 = ""
2000109-98 = "...я подумаю. Ради тебя."
