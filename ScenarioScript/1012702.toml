[translation]
1012702-1 = "Динамичное письмо"
1012702-2 = "Офис Шале"
1012702-3 = "На следующий день."
1012702-4 = ""
1012702-7 = "[ns] «Входи.»"
1012702-9 = ""
1012702-10 = "Здравствуйте..."
1012702-11 = "Сакураи Миё, прибыла для выполнения сегодняшних обязанностей представительницы учеников."
1012702-12 = "[s1] «Спасибо, что пришла, Миё.»\n[s2] «Добро пожаловать в Шале!»"
1012702-15 = "П-Пожалуйста, не говорите так. Это я должна вас благодарить, Сенсей."
1012702-16 = "Вы дали мне редкую возможность выбраться наружу..."
1012702-17 = "Ух... Так давно я не испытывала ничего нового... Запредельная свобода..."
1012702-18 = "[s] «Я знаю, как трудно покидать Вайлдхант.»"
1012702-19 = "Да. Они... ещё строже относятся к студентам литературного направления вроде меня. У нас обязательные часы затворничества."
1012702-20 = "В конце концов, чтобы писать, не нужны ни свежий воздух, ни солнце."
1012702-21 = "И многие великие классические произведения действительно были написаны в заточении... и даже за решёткой..."
1012702-22 = "...Знаете, может, мне стоит признаться во всех контрабандных делах Картеля и попасть в тюрьму. Для моего письма и концентрации это могло бы творить чудеса."
1012702-23 = "[s3] «Если ты этого хочешь...»\n[s4] «А что, если я сам тебя запру?»"
1012702-26 = "Ч-Что вы...?"
1012702-27 = "С-С-Сенсей...?! Что вы делаете...?"
1012702-31 = "Гостиная Шале"
1012702-32 = "Это... гостиная?"
1012702-33 = "И вы хотите, чтобы я расслабилась и писала? О-о, какие хорошие письменные принадлежности!"
1012702-34 = "И я могу сама брать напитки из холодильника? А ещё у вас есть закуски?!"
1012702-35 = "Н-Но сегодня я пришла как представительница учеников... Если я вам не помогу, то я..."
1012702-36 = "...Моя единственная работа как писателя — писать?"
1012702-37 = "Ну... С этим не поспоришь..."
1012702-38 = "[s5] «Так что наслаждайся угощениями!»\n[s6] «...И напиши что-нибудь отличное!»"
1012702-39 = ""
1012702-40 = ""
1012702-42 = ""
1012702-43 = "...Спасибо, Сенсей."
1012702-45 = "Я оставил Миё в гостиной и вернулся к своей работе."
1012702-47 = "Хмммм..."
1012702-48 = "Так... Как лучше раскрыть, что у главного героя неизлечимая, прекрасная, трагичная, калечащая болезнь? Как сильнее провернуть нож?"
1012702-49 = "А родственники мобилизуют танковое подразделение и начинают наступление, чтобы разлучить влюблённых... Хе. О, это хорошо."
1012702-50 = "Ладно, может, немного... оммажа... из другого произведения?"
1012702-51 = ""
1012702-53 = ""
1012702-54 = "«А-А-А! Если небеса создали тебя, зачем они создали и меня?!»"
1012702-55 = "«БРР-р-р-тат-тат! Пиу! Не сдавайтесь! У нас ещё 200 противотанковых снарядов!»"
1012702-56 = "Ха, да. Вот оно! Идеально! Я гений!"
1012702-57 = "А дальше будет горячая..."
1012702-58 = ""
1012702-61 = ""
1012702-62 = ""
1012702-63 = "...Сенсей? Вам... что-то нужно?"
1012702-64 = "[s] «О... Мне подарили эту корзину, и я подумал, что тебе может...»"
1012702-65 = "...Вы слушали?"
1012702-66 = "[s] «...Я ничего не слышал.»"
1012702-67 = "Вы слышали, как я разговаривала сама с собой, да? Вы. Слышали. Всё."
1012702-68 = "[s] «...Нет! Не ВСЁ. Я работал и...»"
1012702-69 = "Начиная с какого места?"
1012702-70 = "[s] «...Что-то про прекрасную трагическую болезнь?»"
1012702-71 = "Так это и ЕСТЬ всё!"
1012702-72 = "А-а-а-а-а-а-а-а...!"
1012702-73 = ""
1012702-75 = ""
1012702-77 = "Миё выскочила из Шале и исчезла в вихре бумаг."
