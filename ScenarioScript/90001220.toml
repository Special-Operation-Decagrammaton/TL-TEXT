[translation]
90001220-1 = "Эпизод 22;Узловые точки"
90001220-2 = "Сияние исчезло, все схемы и устройства вернулись в норму."
90001220-3 = "Эх, жалко. Оно было таким красивым!"
90001220-4 = "Фу-фу. Хотя я согласна, что неожиданное сияние — прекрасное природное явление, его последствия куда опаснее."
90001220-5 = "Такое явление указывает на сильное возмущение электромагнитного поля, из-за чего и пострадали беспроводная связь и электроника."
90001220-6 = "П-Правда? Тогда хорошо, что оно быстро исчезло!"
90001220-7 = "Перебои беспроводной связи, вызванные возмущениями электромагнитного поля, обычно проходят за три-четыре часа. Слишком беспокоиться не нужно."
90001220-8 = "Госпожа Рио..."
90001220-9 = "Н-Неужели вы на самом деле довольно добрая? Раньше вы были такой упрямой и страшной!"
90001220-10 = "В-вот как...?"
90001220-11 = "Все, транспортный корабль прибудет примерно через пятнадцать минут. Пожалуйста, ещё раз проверьте свои вещи."
90001220-12 = "Поняла!"
90001220-13 = ""
90001220-15 = ""
90001220-16 = "А что касается госпожи Рио..."
90001220-17 = "Ей ничего напоминать не нужно. Наверняка она уже дважды всё перепроверила и разложила."
90001220-18 = ""
90001220-20 = ""
90001220-21 = ""
90001220-22 = "Кей? Ты закончила подготовку?"
90001220-23 = "Полагаю, да. В конце концов, единственная моя вещь — это тело."
90001220-24 = "Верно? Поскольку твоё тело — моё творение, ты должна легко справляться с любой ситуацией."
90001220-25 = "Ого. От тебя так и веет счастьем и удовлетворением, что даже сложно что-то ответить."
90001220-26 = "Однако, эм, Рио..."
90001220-27 = "Хм? Что такое?"
90001220-28 = "Это... Ну..."
90001220-29 = "?"
90001220-30 = "[s] «(Хм, может быть...?)»"
90001220-31 = ""
90001220-33 = ""
90001220-34 = "[ns1] «Ах! Как же так вышло!»\n[ns2] «Я кое-что там забыл!»\n[ns3] «Химари! Я ненадолго заберу Рио и Кей!»"
90001220-38 = "С-Сенсей?"
90001220-39 = "Ч-Что?! Что за ерунда, Сенсей?! Хватит меня тащить! Вы знаете, как сложно удерживать равновесие на одном колесе?!"
90001220-40 = ""
90001220-42 = ""
90001220-43 = "Сенсей? Если вы что-то ищете, тогда вам стоит..."
90001220-44 = ""
90001220-46 = ""
90001220-47 = "...справиться, раз с вами Рио и Кей."
90001220-48 = "Да. И Рио, и Кей."
90001220-49 = "Если задержитесь, я напишу вам в MomoTalk."
90001220-51 = ""
90001220-52 = ""
90001220-53 = ""
90001220-54 = "...Что такое? Что вы хотите нам сказать?"
90001220-55 = "Хм? Разве мы не помогаем Сенсею что-то искать?"
90001220-56 = "Ты действительно невыносима. Очевидно же, у Сенсея были скрытые мотивы, когда он привёл нас сюда. Тебя, может, нужно постоянно контролировать, чтобы ты в повседневной жизни не попадалась мошенникам?"
90001220-57 = "В-Вот зачем всё это было...?"
90001220-58 = "...Что? Мм? Вы думаете, я хотела что-то сказать Рио?"
90001220-59 = "Ч-Что вы такое говорите! Ничего подобного нет, вообще ничего!"
90001220-60 = "Мне нечего сказать...!"
90001220-61 = "[s] «Кей-Кей, а ты стесняешься своих чувств, да?»"
90001220-62 = "Ч-Что несёт этот взрослый?!"
90001220-63 = "..."
90001220-64 = "*вздох* Ладно. Я скажу это только затем, чтобы в будущем это не вызвало ошибок в расчётах..."
90001220-65 = "(Что же ей так сильно хотелось сказать...?)"
90001220-66 = "Ну, понимаешь. Во-первых... Ах, то есть я хочу сказать... На самом деле я вообще предпочла бы этого не говорить, однако...!"
90001220-68 = ""
90001220-69 = "Но я рада, что ты смогла получить собственное тело и быть вместе с нами."
90001220-70 = "Иначе... мы ведь не смогли бы вот так помогать друг другу, правда?"
90001220-71 = ""
90001220-72 = ""
90001220-73 = "Я-я просто хотела поблагодарить тебя."
90001220-74 = "Понимаю. Даже если ты меня ненавидишь, это очень—"
90001220-75 = "А?"
90001220-76 = "Что?"
90001220-77 = "Простите, что это вообще за ответ?"
90001220-78 = "Что вы имеете в виду...?"
90001220-79 = ""
90001220-81 = ""
90001220-82 = "[ns] «(Интересно, где-нибудь здесь есть попкорн...)»"
90001220-83 = "Ч-Что заставило тебя решить, что я буду тебя ненавидеть? Ты считаешь меня каким-то неблагодарным вредителем?!"
90001220-84 = "Н-Ну, до сих пор меня ненавидело довольно много людей, поэтому я решила, что со мной что-то не так!"
90001220-85 = "С тобой всё в порядке! Просто я... уф!"
90001220-86 = ""
90001220-88 = ""
90001220-89 = "Спасибо. Спасибо, что подарила мне новую жизнь. Вот и всё."
90001220-90 = "...!"
90001220-91 = "Просто... Как это объяснить?"
90001220-92 = ""
90001220-94 = ""
90001220-95 = ""
90001220-96 = "Этот опыт заставил меня почувствовать себя... живой."
90001220-97 = "Я вижу, могу двигаться и чувствовать. Даже находясь в таком теле."
90001220-98 = "...Несмотря на это тело. Да."
90001220-100 = "Ты... случайно не злишься из-за тела?"
90001220-101 = "Гх! Ты правда...!"
90001220-102 = "Нет. Прошу прощения. Я понимаю. Да. Ведь генетика и природа человека — это и есть судьба... На протяжении всей жизни мы либо бросаем ей вызов, либо принимаем её!"
90001220-103 = "Я-я уже запуталась, но, кажется, мне стоит извиниться...?"
90001220-104 = ""
90001220-106 = ""
90001220-107 = ""
90001220-108 = "[ns] «Кей-Кей, давай немного успокоимся.»"
90001220-109 = "Не знаю, сколько раз мне ещё повторять, но я не Кей-Кей!!"
90001220-111 = "..."
90001220-112 = "Эм... Прости, Кей, но я тоже хотела кое-что тебе сказать."
90001220-113 = "Думаю... мне следует извиниться."
90001220-114 = ""
90001220-116 = ""
90001220-117 = ""
90001220-118 = ""
90001220-119 = "...За что именно ты извиняешься, Рио?"
90001220-120 = "Ну, насчёт Арис... и тебя..."
90001220-121 = "Я..."
90001220-122 = "Я уже отпустила это."
90001220-123 = "П-Правда?"
90001220-124 = "Да. В конце концов, Арис тебя простила. Хотя, если быть точной, она заявила, что прощение вообще не требовалось."
90001220-125 = "А для нас двоих говорить об этом неловко и трудно, верно? Так что... всё хорошо."
90001220-126 = "Просто... дальше относись к нам обеим иначе. Лучше."
90001220-127 = "Я-я поняла."
90001220-128 = "...Спасибо."
90001220-129 = "Что ж, нам обеим было что сказать."
90001220-130 = "Если бы мы так и не обсудили это, было бы довольно неловко."
90001220-131 = "Транспортный корабль скоро прибудет, так что я пойду."
90001220-132 = ""
90001220-134 = ""
90001220-135 = ""
90001220-136 = "Рио."
90001220-137 = "А?"
90001220-138 = "Спасибо, что дала мне жизнь."
90001220-139 = "...!"
90001220-140 = ""
90001220-142 = ""
90001220-143 = ""
90001220-144 = ""
90001220-146 = "Кей быстро ушла, но Рио так и не сдвинулась с места."
90001220-147 = "Я специально громко ступал, приближаясь, чтобы не напугать её."
90001220-148 = ""
90001220-151 = "Сенсей...?"
90001220-152 = "Эм, простите. Пожалуйста, сейчас на меня не смотрите. Просто..."
90001220-153 = "Я скоро снова стану собой. Поэтому, пожалуйста..."
90001220-154 = "[s] «Платок?»"
90001220-155 = "...!"
90001220-156 = "..."
90001220-157 = "Да... Всего на минутку..."
90001220-159 = "Я остался рядом с Рио, пока она не успокоилась."
90001220-160 = ""
90001220-161 = ""
90001220-163 = "Спасибо, Сенсей."
90001220-166 = ""
90001220-167 = "Сейчас мы идём крейсерским ходом. Видимость хорошая, признаков возможной турбулентности нет."
90001220-168 = "Однако остаётся ещё одна проблема."
90001220-169 = "Какая, Токи?"
90001220-170 = "...Куда мы направляемся дальше?"
90001220-171 = "А, это. Не волнуйся, наша очаровательная Арис говорит, что знает дорогу."
90001220-172 = "[s] «А я об этом не знал...»"
90001220-173 = "Тогда всё сходится. Арис коротко объяснила мне это, когда вы с Кей и Рио ушли «искать» свои «потерянные вещи»."
90001220-175 = "Та-дам! Да! С этого момента моя очередь!"
90001220-176 = "Понятно. Кризис предотвращён. Хочешь посидеть со мной в кабине, Арис?"
90001220-177 = "Да, мэм! Токи, можно Кей тоже пойдёт с нами? На всякий случай!"
90001220-178 = "Да. Без проблем. Тогда пойдём."
90001220-179 = ""
90001220-181 = ""
90001220-182 = ""
90001220-183 = ""
90001220-185 = ""
90001220-186 = "[ns] «Тогда оставляю это вам!»"
90001220-187 = "О чём вы говорите, Сенсей?"
90001220-188 = "[s] «А...? В смысле?»"
90001220-189 = "Вы идёте с нами, Сенсей."
90001220-190 = "[s] «Там вообще хватит мест...?»"
90001220-191 = "Как-нибудь разместимся."
90001220-192 = ""
90001220-194 = ""
90001220-198 = "Удивительно, но места хватило всем."
90001220-199 = "Токи жестом предложила мне сесть к ней на колени, но после довольно долгих уговоров мне удалось заставить её отказаться от этой идеи."
90001220-201 = "Да. Так хорошо. Продолжайте в этом направлении."
90001220-202 = "Спасибо, Арис. Но на всякий случай укажи координаты нашей цели."
90001220-203 = "К-Координаты? Эм... Э-э..."
90001220-204 = "Поняла! Я знаю, что надо сказать! Пожалуйста, измените курс на северо-северо-запад!"
90001220-205 = "Что...?"
90001220-206 = "Ладно-ладно. Для этого я здесь и нужна. Посмотрим..."
90001220-207 = ""
90001220-209 = ""
90001220-210 = ""
90001220-211 = "Готово. Продолжайте движение к цели."
90001220-212 = "Спасибо, Кей. Похоже, я не ошиблась."
90001220-213 = "...Что? ЧТО? Когда ты так на меня смотришь, это всегда повод насторожиться!"
90001220-214 = "Что это значит? Я просто подумала, что Кей..."
90001220-215 = ""
90001220-217 = ""
90001220-219 = "...хорошая и добрая девочка."
90001220-220 = "Это точно, точно, ТОЧНО неправда!"
90001220-221 = "[s] «Правда. Кей-Кей такая хорошая и добрая девочка.»"
90001220-223 = "Я убью Сенсея, а потом пойду УМРУ!!!"
90001220-224 = ""
90001220-230 = "Кей? Кей?! Здесь не стоит слишком много двигаться!"
90001220-231 = "Да, Кей. Небольшая ошибка в кабине может привести к немедленным и необратимым последствиям, поэтому будь осторожна."
90001220-232 = ""
90001220-234 = ""
90001220-235 = ""
90001220-236 = "[ns] «Правда. Кей-Кей такая хорошая и добрая девочка, которая иногда выходит из-под контроля.»"
90001220-238 = "АААААРГХХХ!!!"
90001220-240 = "И так, выдерживая яростные взгляды и косые поглядывания Кей..."
90001220-241 = "...мы направились к месту назначения."
90001220-243 = ""
90001220-244 = "...Я подтвердила цель противника. Они направляются к... Узловым точкам."
90001220-245 = "Они действительно добрались так далеко... М-Может, стоит их признать..."
90001220-246 = "С этим я могу согласиться. Они немного превосходят остальных пустоголовых людей."
90001220-247 = "Если нам придётся перейти к плану C... нет, плану D, возможно, придётся рассмотреть отступление Тиферет на Стальной континент. Оставляю это тебе, Эйн."
90001220-248 = "Д-Да! Я займусь этим!"
90001220-249 = "Что ж, приступим? Как сказала Соф..."
90001220-250 = ""
90001220-252 = ""
90001220-253 = "...встречать гостей нужно с размахом!"
90001220-255 = "Следующий эпизод;Хранилище"
