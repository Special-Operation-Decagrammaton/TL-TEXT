[translation]
10037090-1 = "Эпизод 9;После того как взбежишь на гору"
10037090-4 = "Во имя Шаньхайцзина и его традиций я осуждаю Рюгэ Кисаки, президента Генрюмона!"
10037090-5 = ""
10037090-7 = ""
10037090-9 = ""
10037090-11 = ""
10037090-13 = "...!"
10037090-14 = ""
10037090-18 = ""
10037090-20 = ""
10037090-22 = ""
10037090-23 = "Ч-Что?! Почему нас...?!"
10037090-24 = "Черино. Встань за нами...!"
10037090-25 = "Д-Да! Эй, мы вообще-то просто гости! Что вы творите?"
10037090-26 = ""
10037090-28 = ""
10037090-30 = ""
10037090-31 = "...Ты очень эффективно окружила меня, Кагуя. Что будешь делать теперь?"
10037090-32 = ""
10037090-35 = ""
10037090-36 = "Госпожа Президент?!"
10037090-38 = "Стойте, Генрюмон! И спросите самих себя!"
10037090-39 = "То, что вы пытаетесь защитить, — госпожа Кисаки или Шаньхайцзин?!"
10037090-41 = "Что вы хотите этим сказать, Президент Кагуя...?"
10037090-43 = "Если у вас есть глаза и уши, вы должны знать! Генрюмон прежде всего — организация, защищающая традиции и ценности Шаньхайцзина!"
10037090-44 = "Но действительно ли госпожа Кисаки, глава Генрюмона, защищает традиции и ценности Шаньхайцзина?"
10037090-45 = "В прошлом — возможно! Тогда госпожа Кисаки была человеком, достойным всеобщего уважения и верности!"
10037090-46 = "Но какова она сейчас? Разве госпожа Кисаки прошлого и госпожа Кисаки настоящего — один и тот же человек?"
10037090-47 = "Я так не думаю. Смотрите! Посмотрите на перемены, которые госпожа Кисаки принесла в Шаньхайцзин!"
10037090-48 = ""
10037090-51 = ""
10037090-52 = "А? М-Мы...?!"
10037090-54 = "Я согласна... Лично пригласить студентов Красной Зимы в Шаньхайцзин было..."
10037090-55 = "Но это ведь президент..."
10037090-56 = "Это правда. Но что, если президент Генрюмона не защищает Шаньхайцзин...?"
10037090-58 = "Я так и знала. Генрюмон не проявляет инициативы."
10037090-59 = "Я знала, что вероятность того, что они решительно поддержат отстранение президента, невелика, но..."
10037090-61 = "Нет, этого достаточно."
10037090-62 = "Прежде всего наша цель — вернуть президента, свернувшую с правильного пути, обратно на верную дорогу."
10037090-63 = "Мы передадим ей наши искренние советы и мнения и своей решимостью направим её назад."
10037090-64 = "Не забывайте! Наш народ не замышляет измену — мы лишь демонстрируем непоколебимую верность."
10037090-65 = "Госпожа! Вам нужно бежать! Здесь опасно!"
10037090-67 = "Спасибо за заботу, Сая."
10037090-68 = "Однако... куда я вообще могу отсюда уйти? Фуфу."
10037090-69 = "Глава организации подобен жертве, приносимой небесам."
10037090-70 = ""
10037090-72 = ""
10037090-74 = ""
10037090-75 = "«То, что вы пытаетесь защитить, — госпожа Кисаки или Шаньхайцзин?!» Хм..."
10037090-76 = "Хех. Я с самого начала знала, что делать. Любой, кто захочет причинить вред госпоже Президенту..."
10037090-77 = ""
10037090-79 = ""
10037090-81 = ""
10037090-83 = ""
10037090-87 = "Сделает это только через мой труп!"
10037090-88 = ""
10037090-91 = ""
10037090-92 = "Мина...? Ты тоже должна бежать!"
10037090-93 = "Ха... Я никогда не опозорюсь настолько, чтобы бросить президента."
10037090-94 = ""
10037090-96 = ""
10037090-97 = "Даже если мне придётся сражаться со всем Шаньхайцзином, я защищу президента."
10037090-98 = ""
10037090-102 = "Хм, мне нравится твой стиль, Исполнительный Офицер Мина."
10037090-103 = ""
10037090-105 = ""
10037090-107 = ""
10037090-108 = "Что это было?"
10037090-109 = ""
10037090-111 = ""
10037090-113 = "Я не собиралась вмешиваться в проблемы других академий, но..."
10037090-114 = "Не могу позволить Исполнительному Офицеру Мине забрать всю славу себе!"
10037090-115 = "...Вот что вы имели в виду, председатель Марина?"
10037090-116 = "Я многим обязана президенту."
10037090-117 = "Блин, поданный гостю, нужно вернуть масляным супом!"
