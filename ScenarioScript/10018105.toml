[translation]
10018105-1 = "Эпилог; С Новым годом!"
10018105-3 = "Наконец водоворот сомнительных деловых махинаций, превративший праздничный сезон в череду сражений, подошёл к концу."
10018105-4 = ""
10018105-7 = ""
10018105-8 = "Сенсей! Скорее! Фестиваль начинается!"
10018105-11 = "Мы приготовили праздничную еду и осэти. Ничего страшного, если что-то останется."
10018105-12 = "Хорошо, что осэти всё равно принято есть в течение нескольких дней."
10018105-13 = "Невероятно! Я люблю Новый год! Он должен длиться дольше!"
10018105-14 = "Не думаю, что с такой вкусной едой нам вообще придётся переживать об остатках! ★"
10018105-15 = "Почему-то, когда это говоришь ты, я как раз начинаю переживать."
10018105-16 = "Говорят, все тревоги — это самосбывающиеся пророчества. ★"
10018105-17 = ""
10018105-20 = "Надеюсь, наступающий год будет полон прекрасных вещей..."
10018105-21 = "...и я смогу готовить ещё более прекрасную еду!"
10018105-22 = "Сенсей! Попробуйте и это!"
10018105-23 = "Это не что-то особенное... но я очень старалась..."
10018105-24 = "Хи-хи. Лучшая еда, лучшее место и лучший финал..."
10018105-25 = "Я увидела краешек того, где скрывается высшая гастрономия."
10018105-26 = "Прекрасный момент, который вскоре станет тёплым воспоминанием для меня и Общества гурманов."
10018105-28 = "[ns] «Кстати, что случилось с Няомото?»"
10018105-29 = "Он сказал: «Вы ещё обо мне услышите! Мва-ха-ха.» А потом убежал."
10018105-30 = "Я немного переживаю..."
10018105-31 = "Не переживай. Никто из тех, кто когда-либо говорил такое, хорошо не заканчивал."
10018105-32 = "Мы всегда можем снова собраться и лично в этом убедиться! ★"
10018105-33 = "А что с бандой гурманов в шлемах?"
10018105-34 = ""
10018105-37 = ""
10018105-38 = "Ты переживаешь за них, Фуука?"
10018105-39 = "Сенсей..."
10018105-40 = "[ns] «Я что-нибудь придумаю.»"
10018105-41 = ""
10018105-43 = ""
10018105-44 = "[ns] «Если они признают свои проступки...»"
10018105-45 = ""
10018105-47 = ""
10018105-49 = "Можно устроить их на подработку в «Воробей»."
10018105-50 = "Правда? Так можно?"
10018105-51 = "Они делали плохие вещи, но не выглядели по-настоящему плохими людьми."
10018105-52 = "Я поговорила об этом с Сенсеем."
10018105-53 = "[ns] «Исправить ошибки лучше, чем просто наказать за них.»"
10018105-55 = "...Вы слишком добрые."
10018105-56 = "Сенсей, как всегда, спасибо вам."
10018105-57 = "Спасибо, Сенсей."
10018105-58 = "Без вас мы бы не справились."
10018105-60 = "С Новым годом, Сенсей!"
10018105-62 = "С Новым годом."
10018105-63 = "С Новым годом."
10018105-64 = "За счастливый новый год, полный еды!"
10018105-65 = "Уже пора?"
10018105-66 = "С Новым годом! ★"
10018105-69 = "Так в Кивотосе начался новый год."
10018105-70 = ""
10018105-72 = "[ns] «(Надеюсь, в этот момент все счастливы.)»"
10018105-74 = "[ns] «(Независимо от того, идут ли они по правильному пути...)»"
10018105-76 = "[ns] «(...или по собственному, менее обычному пути.)»"
10018105-83 = "Что?! Жареный морской окунь ожил!"
10018105-84 = "П-Простите! Простите! Это моя ошибка!"
10018105-85 = "Да какая разница, чья вина! Как это вообще физически возможно?!"
