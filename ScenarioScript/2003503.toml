[translation]
2003503-1 = "Ускоренный курс"
2003503-5 = "Здравствуйте, Сенсей... *зевок*..."
2003503-6 = "[s] «О... Привет, Цубаки. Ты пришла в Шале в форме проводника по сну?»"
2003503-7 = "Ага... но, может, это была плохая идея... По дороге сюда меня постоянно спрашивали, как куда пройти..."
2003503-8 = "Это было очень... раздражающе..."
2003503-9 = "Единственное место, куда я могу кого-то проводить, — это сон..."
2003503-10 = ""
2003503-13 = "Сенсей, вы здесь? Я только что услышала, что Спящая красавица Хяккияко пришла в Шале!"
2003503-14 = "Хм?"
2003503-15 = "[ns] «...Цубаки? Что ты натворила?»"
2003503-16 = "Ничего..."
2003503-17 = "Хотя, если подумать... по дороге сюда мне и правда казалось, что за мной кто-то идёт..."
2003503-18 = ""
2003503-21 = "Мне ничего не оставалось, кроме как открыть дверь."
2003503-22 = ""
2003503-25 = "А за ней..."
2003503-26 = ""
2003503-30 = "Здравствуйте, Сенсей! Мы шли за Спящей красавицей до самого сюда!"
2003503-31 = "Ходит слух, что если последовать за Спящей красавицей, то в Шале можно обрести спокойный сон..."
2003503-32 = "Угх... Моя бессонница стала такой сильной, что даже снотворное почти не помогает... Пожалуйста, дайте мне поспать. Хотя бы час..."
2003503-33 = ""
2003503-37 = "Я две недели подряд была на ночном патрулировании без единого перерыва... Теперь режим сна полностью сбился."
2003503-38 = "[s] «Даже студент Валькирии?!»"
2003503-39 = "Нам нужен сон, чтобы поддерживать безопасность..."
2003503-40 = "...Что будем делать, Сенсей?"
2003503-41 = "[s1] «...Цубаки, пожалуйста.»\n[s2] «Проводи этих бедных студентов в царство снов!»"
2003503-44 = "Раз вы так говорите, Сенсей... Я постараюсь."
2003503-45 = "Не уверена, что подхожу для этой работы... но я обязательно попробую, Сенсей."
2003503-48 = ""
2003503-49 = "Как вы, наверное, знаете... получить достаточно сна на удивление трудно."
2003503-50 = "Многие люди в наше время страдают от бессонницы..."
2003503-51 = "Они отчаянно ищут решение. Обращаются к интернету, задают самые разные вопросы и мечтают хотя бы об одной ночи спокойного сна."
2003503-52 = "Кто-то принимает перед сном тёплую ванну, кто-то пьёт горячее какао или медитирует под белый шум. Список можно продолжать бесконечно..."
2003503-53 = "Уверена, все вы здесь уже пробовали подобные вещи, верно?"
2003503-55 = "Я пробовала принимать душ, но он только разгонял кровь, и я окончательно просыпалась..."
2003503-56 = "Я пила горячее какао, но кофеин, наоборот, меня взбодрил..."
2003503-58 = "Я слушала альбом с белым шумом, но он напомнил мне о работе... и в итоге всю ночь я только о ней и думала..."
2003503-59 = "Я слышала, что маска для сна довольно эффективна, надела её, но слух стал ещё чувствительнее, и шум не давал уснуть."
2003503-60 = "Да. Путей к хорошему сну много. Но найти тот, который подходит именно тебе, непросто..."
2003503-61 = "Позвольте показать несколько способов, которые оказались эффективны для меня."
2003503-62 = "Для начала дышите медленно и глубоко. Не заставляйте себя, просто чуть медленнее обычного."
2003503-63 = "Вдох — выдох — вдох — выдох — вдох — выдох —"
2003503-64 = ""
2003503-66 = ""
2003503-67 = "...Хр-р."
2003503-69 = "У-Уже?!"
2003503-70 = "Она и правда Спящая красавица Хяккияко... Н-Но что делать нам...?!"
2003503-71 = ""
2003503-74 = ""
2003503-75 = ""
2003503-76 = "А? Ой, простите, я уснула."
2003503-77 = "Следующий совет — не хмурьтесь. Не держите напряжение в глазах, веках, языке или челюсти. Медленно расслабьте лицо."
2003503-78 = "Продолжайте так же и сохраняйте ровное дыхание..."
2003503-79 = ""
2003503-81 = ""
2003503-82 = "...Хр-р."
2003503-83 = "Меня уже немного клонит в сон... Она опять уснула?!"
2003503-84 = "Я завидую и, честно говоря, немного поражена."
2003503-86 = "Что? Уже время перекуса? А, показалось..."
2003503-87 = "Теперь по порядку расслабьте шею, плечи, грудь, руки и ноги. Представьте, что всё тело обмякло, словно водяной шарик..."
2003503-88 = "Когда достаточно расслабитесь, представьте, как вся усталость стекает вниз от головы..."
2003503-89 = "Представьте, что все мысли в голове стираются... Сосредоточьтесь только на дыхании..."
2003503-90 = "А... Ещё советую перед тем как лечь надеть маску для сна и беруши..."
2003503-91 = "И маску для сна, И беруши?"
2003503-92 = "Ага... Тишина — на удивление важная часть засыпания..."
2003503-93 = "Если продолжать... и всё пойдёт хорошо..."
2003503-94 = ""
2003503-96 = ""
2003503-97 = "...Хр-р."
2003503-99 = "Потрясающе! Будто вся энергия покидает тело, но в хорошем смысле..."
2003503-100 = "Давно меня так не клонило в сон."
2003503-102 = "А? Что это? Веки такие тяжёлые... Мне просто хочется..."
2003503-103 = "...Хр-р."
2003503-104 = ""
2003503-106 = ""
2003503-109 = ""
2003503-114 = "Все студенты быстро погрузились в сон."
2003503-115 = "Цубаки применила Технику сна... Это суперэффективно!"
2003503-116 = ""
2003503-117 = "М-м? Все наконец уснули?"
2003503-118 = "Хи-хи... Я рада..."
2003503-119 = "[s] «Я знал, что на тебя можно положиться, Цубаки!»"
2003503-120 = "Тсс, Сенсей. Если будете слишком шуметь, они могут проснуться."
2003503-121 = ""
2003503-123 = "М-м... Наверное, мне тоже стоит ещё немного поспать..."
2003503-124 = ""
2003503-126 = ""
2003503-128 = ""
2003503-129 = "[ns] «(Ц-Цубаки?!)»"
2003503-130 = "Подушка, подушка... Нужна подушка."
2003503-131 = "Эта подойдёт. Спокойной ночи, Сенсей."
2003503-133 = "Цубаки устроилась на моих коленях как на подушке и отключилась."
2003503-134 = "Комнату отдыха наполнили мирные звуки спящих студентов."
