[translation]
90102105-2 = "This is FOX 3. The conductor in the cab—wait, can we even call that thing a conductor?"
90102105-3 = "……Target completely neutralized. Looks like it's down for good."
90102105-4 = "Up close, it looks like a train's heart straight out of a nightmare."
90102105-5 = "The train parts and crew uniforms are all tangled up in a grotesque mess……#nIt's totally different from any ROAR we've seen before."
90102105-6 = "Looks like it was trying to become something and failed, though…… I wonder what that was supposed to mean?"
90102105-7 = "……A thorough investigation can wait until the train has stopped."
90102105-8 = "I've activated the cab's EBS.#nIt'll be stopping shortly."
90102105-9 = "So…… is that it? Problem solved?"
90102105-10 = "FOX 4, would you stop jinxing us like that during an operation?"
90102105-11 = "It's gonna suddenly revive and trigger a boss phase two――"
90102105-17 = "Huh?#nIs the train picking up speed……?"
90102105-18 = "FOX 1, you activated the brake system, right?"
90102105-19 = "The brake pipe pressure isn't dropping…… Something is blocking the depressurization!"
90102105-20 = "That's why I told you not to say things like that, Otogi!"
90102105-21 = "Eh, you really think that's related?#nIf a single word could decide an operation's success or failure, SRT wouldn't even be necessary."
90102105-23 = "[ns] \"Isn't there another way?\""
90102105-24 = "I was hoping to save this as a last resort…… but we have no choice."
90102105-25 = "From here on, I'm going to use all of our cluster grenades to destroy the engine compartment."
90102105-26 = "There is a risk of derailment, so…… please keep low and brace for impact."
90102105-27 = "[s] \"O-Got it!\""
90102105-28 = "Everyone, evacuate outside the blast radius."
90102105-32 = "Deploying cluster grenades!"
90102105-37 = "3, 2, 1――"
90102105-38 = "It's blowing!"
90102105-45 = "……Haa."
90102105-46 = "Why is it always like this every time…… I don't want to ride a train for a while……."
90102105-47 = "Did we actually…… get it this time!?"
90102105-48 = "I told you to stop saying that! What are you going to do if it revives again!?"
90102105-49 = "Ahaha…… As if that's even possible, right?#nIt completely derailed."
90102105-53 = "Sensei, are you alright!?"
90102105-54 = "[s5] \"Yeah. Not a single scratch.\"\n[s6] \"Looks like the seat absorbed most of the impact.\""
90102105-60 = "……I'm just glad you're uninjured."
90102105-61 = "Oh man…… Even the tracks are blown away.#nI wonder how much the repairs are gonna cost……?"
90102105-62 = "Back in SRT days, the finance director would've come personally to lecture us."
90102105-63 = "I'm so glad this was a top-secret operation the General Student Council knows nothing about……"
90102105-64 = "Y-Yeah……."
90102105-70 = "W-Where are we……?"
90102105-71 = "Huh……?#nWe got on the train bound for Hyacinth Academy at Kawanishi Station and……."
90102105-72 = "Looks like there were other passengers besides us, too."
90102105-73 = "FOX 2, please check the civilians' vitals."
90102105-74 = "Got it, leave it to me."
90102105-77 = "Are you feeling alright?#nAre you feeling dizzy, or is anything hurting?"
90102105-78 = "Um, not really, but…… what about you guys?"
90102105-79 = "Um, we are……."
90102105-80 = "Ah, are you perhaps Takahashi?"
90102105-81 = "How do you know my name?"
90102105-82 = "Your friend asked us to look for you.#nThey said they couldn't reach you after you got on the train."
90102105-83 = "She was so worried about you.#nSo from now on, don't just carelessly board unfamiliar trains.#n You could get caught up in a crime."
90102105-84 = "My friend……."
90102105-88 = "I see. They still hadn't forgotten about me."
90102105-89 = "So…… where is this?"
90102105-90 = "Who knows? We don't really know either."
90102105-91 = "We're re-acquiring GPS right now, so any minute――"
90102105-95 = "Ah…… I think I get it."
90102105-96 = "These tracks are on the way to Hyacinth Academy……."
90102105-97 = "It's not like there are many train tracks lined with cluster amaryllises like this."
90102105-103 = "The scenery of the commute path, where cluster amaryllises bloom as far as the eye can see, swaying in a fiery red."
90102105-104 = "Beautiful……."
90102105-105 = "I feel like I can understand, just a little…… the feelings of the students who wanted to return to the past."
90102105-106 = "However, the past does not return. Because we must live in the present."
90102105-107 = "That being said…… I suppose we will never forget this beautiful scenery."
90102105-108 = "Yeah."
90102105-109 = "We've made another memory together, haven't we?"
90102105-115 = "Next Episode;Ekiben"
