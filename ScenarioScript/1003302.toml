[translation]
1003302-1 = "Нежная встреча"
1003302-2 = "У меня были дела, поэтому я вышел из офиса Шале и шёл по улице."
1003302-3 = "Эй! И что ты собираешься делать с моим мороженым?!"
1003302-4 = "А-а-а! П-Почему вы на меня кричите?!"
1003302-5 = "Она уронила мороженое, потому что ТЫ вдруг чихнула!#nТы вообще представляешь, как сильно она его ждала?!"
1003302-6 = "Отвечай за это! Ты должна возместить мне ущерб за то, что лишила меня#nванильно-фруктового гига-джамбо-делюкс мягкого мороженого Mk.02!"
1003302-7 = "П-Пожалуйста, не будьте такими неразумными! Я всего лишь чихнула."
1003302-8 = "[s] «Эй. Что здесь происходит?»"
1003302-9 = "А ты ещё кто такая?"
1003302-10 = "Погодите. Это же тот самый Сенсей из Шале, о котором все говорят."
1003302-11 = "Так ты и есть тот знаменитый Сенсей, да? И теперь суёшь свой нос#nв наши дела?"
1003302-12 = "Ладно. Тогда ТЫ и заплатишь за моё мороженое!"
1003302-13 = "[s1] «А теперь я кричу!»\n[s2] «Вообще-то мой кошелёк сейчас слегка пустоват...»"
1003302-16 = "А?! Не шути со мной. Если не можешь заплатить, тогда—"
1003302-17 = ""
1003302-20 = ""
1003302-21 = ""
1003302-23 = ""
1003302-27 = "[ns] «Что это было?»"
1003302-28 = "М-Мой герой! Огромное вам спасибо!"
1003302-29 = "Меня чуть не избили только за то, что я чихнула."
1003302-30 = "Я знала, что на знаменитого Сенсея из Шале можно положиться!"
1003302-31 = "[s] «Эм, конечно, но я ведь ничего не...»"
1003302-32 = "Наверное, это моя аллергия разыгралась. Как раз такое время года..."
1003302-33 = "А... А..."
1003302-34 = "А-А-А! Что...? Почему?"
1003302-35 = ""
1003302-38 = "Опять?! Я всего лишь чихнула!"
1003302-39 = ""
1003302-41 = ""
1003302-43 = "[ns3] «Выстрелы! Неужели это...?!»\n[ns4] «(Нужно убираться отсюда!)»"
1003302-47 = "Я изо всех сил побежал прочь, уклоняясь от новых выстрелов и внезапных взрывов."
1003302-51 = "Эй, сюда нельзя! Здесь строительная зона!"
1003302-52 = "Здесь всё подготовлено к контролируемому сносу, так что—"
1003302-53 = ""
1003302-56 = "Какого...?! Наша взрывчатка сработала?!"
1003302-57 = ""
1003302-59 = ""
1003302-62 = "Я убежал от взрыва так быстро, как только мог, пока не оказался в менее людном месте."
1003302-64 = "Ну-ну. Кого я вижу — Сенсей из Шале."
1003302-65 = "*хихиканье* Рад снова вас видеть, Сенсей!"
1003302-66 = "Вы выглядите таким взволнованным. Что-то случилось?"
1003302-67 = ""
1003302-70 = ""
1003302-71 = "А-А-А-А!"
1003302-72 = ""
1003302-74 = ""
1003302-76 = "[ns] «Тц!»"
1003302-86 = "Я бежал и бежал, пока наконец не нашёл почти совершенно безлюдное место."
1003302-89 = "[ns] «*тяжело дышит* *тяжело дышит* Здесь уже должно быть достаточно далеко...»"
1003302-90 = ""
1003302-93 = "Хи-хи. Наконец-то все помехи убрались с нашего пути."
1003302-94 = ""
1003302-97 = ""
1003302-98 = "[ns5] «Я так и думал, что это ты.»\n[ns6] «Давно не виделись, Вакамо.»"
1003302-99 = "О? Вы всё это время знали?"
1003302-100 = "О? Вы всё это время знали?"
1003302-101 = "Неужели это значит..."
1003302-102 = "...что вы просто вели меня туда, где мы сможем остаться наедине?"
1003302-103 = "[s] «Э-Эм...»"
1003302-104 = "Я... Я... больше ни секунды не могу сдерживаться!"
1003302-107 = "― Я так счастлива!"
1003302-110 = "― Я, Вакамо,"
1003302-112 = "― сделала всё, что могла, чтобы свести нас вместе, мой дорогой.[wa:1370]"
1003302-115 = "― Как же долго я мечтала выразить[wa:1510]"
1003302-117 = "― вам эти чувства снова...[wa:1310]"
1003302-120 = "― Несомненно, нашей встречей мы обязаны[wa:460]"
1003302-122 = "― красной нити судьбы, связывающей нас.[wa:700]"
1003302-125 = "― Ах... Я... Когда вы так на меня смотрите,[wa:3520]"
1003302-127 = "― даже я не могу не краснеть...[wa:2420]"
1003302-130 = "― Я не могу сдерживать накопившиеся желания,[wa:2020]"
1003302-132 = "― когда чувствую на себе ваш взгляд.[wa:10]"
1003302-135 = "― Но... если вы действительно этого хотите... тогда хорошо. ♥[wa:5900]"
1003302-138 = "― Подойдите. Ближе...[wa:1030]"
1003302-140 = "― Ещё чуточку ближе. Прямо ко мне. Хи-хи. ♥[wa:3370]"
1003302-143 = "Вот так, Сенсей. Ещё немного ближе."
1003302-144 = "[s] «Вакамо!»"
1003302-145 = "*ах!*"
1003302-146 = "[s7] «О чём ты вообще думала?!»\n[s8] «Разве я не говорил тебе не причинять вред невинным людям?»"
1003302-149 = "Д-Да, но..."
1003302-150 = "Я всего лишь хотела снова вас увидеть!"
1003302-151 = "[s] «И я говорил тебе, что ради этого нельзя вредить другим.»"
1003302-152 = "Н-Но чувства в моём сердце...!"
1003302-153 = "Мне казалось, что оно вот-вот вырвется из груди.#nУ меня не было другого выбора."
1003302-154 = "Пожалуйста, поверьте мне..."
1003302-155 = "[s] «Ты ведь не хочешь меня разочаровать, правда?»"
1003302-156 = "...!"
1003302-157 = "Нет, Сенсей! Только не это!"
1003302-158 = "Я не знаю, что со мной будет, если вы махнёте на меня рукой...!"
1003302-159 = "Простите, простите, простите!#nПожалуйста, простите меня, Сенсей!"
1003302-160 = "Я больше никогда не сделаю ничего, что вас разочарует, только пожалуйста!"
1003302-161 = "Пожалуйста, простите меня. Я сделаю всё что угодно!"
1003302-162 = "[s] «Только если ты искренне раскаиваешься в том, что сделала.»"
1003302-163 = ""
1003302-165 = ""
1003302-166 = "Сенсей..."
1003302-167 = ""
1003302-170 = "Ах. Они снова идут сюда, чтобы нам помешать."
1003302-171 = "Хорошо, Сенсей. Я клянусь вам, что больше никогда не сделаю ничего, что вас разочарует."
1003302-172 = "Сегодня вечером я вас отпущу, но можно мне..."
1003302-173 = "...потом снова прийти к вам?"
1003302-174 = "[s] «...Конечно.»"
1003302-175 = "Ура! Хорошо. Тогда до встречи."
1003302-176 = ""
1003302-178 = ""
1003302-180 = "Я смотрел, как Вакамо быстро убежала прочь."
