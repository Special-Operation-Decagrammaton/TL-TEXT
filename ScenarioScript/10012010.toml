10012010-12 = "Постойте... Сенсей?"
10012010-13 = "С каких пор мы пригласили Сенсея?"
10012010-14 = "Ну, Сенсей — советник Комитета по предотвращению закрытия. Естественно сообщать ему важные новости."
10012010-15 = "Вообще-то, причина не только в этом..."
10012010-16 = "Хочешь сама сообщить плохую новость, Аяне?"
10012010-18 = "Хватит их дразнить, Хошино. В общем... Призом Серики за первое место была поездка на курорт."
10012010-19 = ""
10012010-21 = ""
10012010-22 = "К-Клянусь, я не знала! Услышала «первое место» и сразу прибежала к вам!"
10012010-23 = "Хи-хи. Глупенькая Серика. Тут нечего стесняться."
10012010-24 = "Когда ещё нам выпадет шанс съездить в отпуск, где всё оплачено?"
10012010-25 = "И теперь у нас есть огромный вертолёт, так что добраться туда будет проще простого!"
10012010-26 = "Каждая здесь отдала этой школе все силы. Мы заслужили отдых."
10012010-28 = "Вот настоящая причина, почему мы позвали вас, Сенсей."
10012010-29 = "Так что... если вы не против..."
10012010-30 = "[s3] «Хотите, чтобы я поехал с вами?»\n[s4] «Да вы умеете меня баловать.»"
10012010-31 = "Только не привыкай."
10012010-32 = "Только не привыкай."
10012010-33 = "Курорт далеко... так что было бы неплохо, если бы с нами поехал взрослый."
10012010-34 = "Она права, Сенсей. Неужели вы позволите своим милым маленьким студентам путешествовать одним? Кто знает, что может случиться!"
10012010-35 = "Н-Но... только если вы сами хотите... Сенсей..."
10012010-36 = "[s5] «Конечно. Я с удовольствием.»\n[s6] «Дарёному коню в зубы не смотрят, да?»"
10012010-37 = "Ура! Сенсей едет с нами! ☆"
10012010-38 = "Ура! Сенсей едет с нами! ☆"
