10012010-1 = "Эпизод 1; Жизнь полна стольких сюрпризов"
10012010-2 = "...Вот, в общем-то, и вся ситуация."
10012010-3 = "Меня немного тревожит, насколько хорошо всё складывается."
10012010-4 = "[s1] «Вот это полоса удачи!»\n[s2] «Вертолёт и первое место. Вот это везение!»"
