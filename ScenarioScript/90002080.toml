[translation]
90002080-1 = "Эпизод 8;Повышение уровня"
90002080-2 = ""
90002080-3 = "Этот Стальной континент возник в результате предельной «эволюции» Нецаха, седьмого пророка."
90002080-4 = "...Хотя исходная форма Нецаха распространилась настолько, что её уже почти невозможно узнать."
90002080-5 = "Сейчас все пророки Декаграмматона находятся на Стальном континенте, и каждый из них защищает назначенную ему область."
90002080-6 = "Точнее, это реплики... но они ничем не отличаются от оригиналов."
90002080-7 = "Реплики. Понятно."
90002080-8 = "В конечном счёте, если Кивотос полностью покроется Стальным континентом, как планируют эти трое, их можно будет систематически создавать в любой момент."
90002080-9 = "Но... тут у нас есть небольшая проблема."
90002080-10 = "И в чём проблема, Кей?"
90002080-11 = "Сложно отследить... где сейчас находится каждый из пророков."
90002080-12 = "Почему? Улучшенная защита скрывает их?"
90002080-13 = "Именно так, Химари. Если говорить прямо..."
90002080-14 = "Сейчас они все прячутся. И делают это очень хорошо."
90002080-15 = "Однако я узнала ещё кое-что об этих трёх новых пророках."
90002080-16 = "Мы уже записали данные о первых семи в филогенетическом древе Древа Жизни, так что можем использовать их как ориентир."
90002080-17 = "Во-первых, Нецах — сам Стальной континент. Его титул — «Бесконечная земля, свидетельствующая победу», а его путь — «победа, наконец достигнутая»."
90002080-18 = ""
90002080-20 = ""
90002080-21 = ""
90002080-22 = "По крайней мере этот титул легко понять."
90002080-23 = "Да... это так. А следующий — Йесод, которого довольно трудно найти. Его титул — «Основание чистоты и силы»."
90002080-24 = "А его путь — «истина на пути к завершению»."
90002080-25 = ""
90002080-27 = ""
90002080-28 = ""
90002080-29 = "Любопытно. Что вообще значат эти титулы и пути? Они помогают им работать эффективнее?"
90002080-30 = "Подробностей я не знаю, но могу подтвердить, что они используют эти обозначения, чтобы регулировать поток энергии в Стальном континенте и тем самым..."
90002080-31 = "...приближаться к какой-то новой возможности."
90002080-32 = "Ага? И к какой же?"
90002080-33 = "...Не знаю."
90002080-34 = "А? Ты говорила так, будто сейчас выдашь грандиозное откровение, но ничего не сказала!"
90002080-35 = "Что, простите?!"
90002080-36 = "Момои! Пожалуйста! К-Кей, успокойся. Я прошу прощения от её имени..."
90002080-37 = "Ц... Всё в порядке, Мидори. Похоже, я немного увлеклась."
90002080-38 = "Хи-хи. Правда?"
90002080-39 = "Момои!!"
90002080-40 = ""
90002080-42 = ""
90002080-43 = "Ахаха! Кей злится!"
90002080-44 = "*вздыхает*..."
90002080-45 = "Ну... ладно. И наконец, Малкут. Её титул — «Паломница королевства на краю мира»."
90002080-46 = "А её путь... похоже, нечто вроде «воли, исходящей от флагмана»."
90002080-47 = ""
90002080-49 = ""
90002080-51 = ""
90002080-52 = ""
90002080-53 = ""
90002080-54 = "Меня прямо вдохновило! Может, использую это в следующей игре!"
90002080-55 = "...Ага. Возможно, сработает."
90002080-56 = "А? Ты на меня не злишься?"
90002080-57 = "Ты просто несёшь чепуху и живёшь в мире фантазий..."
90002080-58 = "Мне-то что, если ты используешь это в своём сюжете?"
90002080-59 = "К-Кей... Это немного жестоко..."
90002080-60 = "...Прости, Юзу. Я перегнула."
90002080-61 = "Хм? Что-то не так?"
90002080-62 = "Или всё-таки нет? По крайней мере мне удалось заставить Кей за что-то извиниться!"
90002080-63 = "...Ага... Это так в духе Момои..."
90002080-64 = "Н-наверное, это хорошо... Может быть...?"
90002080-65 = "В любом случае, наша главная проблема — Малкут, это очевидно."
90002080-66 = "Мы видели, на что она способна. Сейчас нам с её силой не справиться."
90002080-67 = "Честно говоря, она могла уничтожить нас всех прямо там. Но не стала."
90002080-68 = "Она быстро отступила, будто за ней кто-то гнался."
90002080-69 = "[s] «Что бы это могло значить?»"
90002080-70 = "Мне тоже интересно. Первое предположение — Малкут может действовать лишь очень короткое время."
90002080-71 = ""
90002080-73 = ""
90002080-74 = ""
90002080-75 = "Возможно, это уникальная единица, рассчитанная исключительно на короткие решающие сражения? Или вообще демонстратор технологии?"
90002080-76 = "Как непрактично. На войне важнее всего стандартизация и унификация."
90002080-77 = "В конце концов, бой — это прежде всего война на истощение."
90002080-78 = ""
90002080-80 = ""
90002080-81 = ""
90002080-82 = ""
90002080-83 = "Или... возможно, её вообще создавали не для боя."
90002080-84 = "Э... Что ты имеешь в виду? Тогда для чего она?"
90002080-86 = "Мы можем строить догадки до бесконечности, но времени у нас нет."
90002080-87 = "А вот что мы ТОЧНО знаем: Стальной континент разделён на несколько областей, каждой из которых управляет пророк."
90002080-88 = "И мы можем... «захватить» эти области и превратить их в нашу территорию."
90002080-89 = "Теперь, если подумать, силы Декаграмматона и Рабочие больше на нас не нападают."
90002080-90 = "Верно. Эта область уже некоторое время находится под нашим контролем."
90002080-91 = "...Точнее, с тех пор как Малкут устроила на нас засаду."
90002080-92 = "И тогда силы Декаграмматона и Рабочие перестали стекаться сюда."
90002080-93 = "Понятно. Значит... электронная оккупация области может не пускать вражеские подкрепления."
90002080-94 = ""
90002080-96 = ""
90002080-97 = ""
90002080-98 = "А когда мы полностью займём каждую область, сможем встретиться с её пророком."
90002080-99 = "Наконец, победив пророков... я должна суметь поглотить основное «информационное ядро» в это тело."
90002080-100 = "...В конце концов, это тело сделано из Стального континента."
90002080-101 = "Что ты узнаешь из информационного ядра пророка?"
90002080-102 = "По мере поглощения информационных ядер Стальной континент начнёт воспринимать меня как... нечто вроде..."
90002080-103 = "...совокупности пророков или какого-то высшего существа. По сути, это повышает мои административные привилегии."
90002080-104 = "Когда я возьму под контроль все информационные ядра, то должна буду суметь отдавать приказы самому Стальному континенту."
90002080-105 = "Например, я смогу отдать приказ «прекратить расширение и остановить операции»."
90002080-106 = "[s] «А? Тогда Стальной континент...!»"
90002080-107 = "Да. Это в корне решит нашу проблему."
90002080-108 = ""
90002080-110 = ""
90002080-111 = "..."
90002080-112 = "Понятно! Значит, если мы будем занимать каждую область Стального континента и побеждать её пророка, Кей будет повышать уровень!"
90002080-113 = "А когда Кей достигнет максимального уровня, у неё появятся полномочия остановить Стальной континент!"
90002080-114 = "Да. Мне нравится это сравнение, Арис. Однако..."
90002080-115 = "Однако...?"
90002080-116 = "Сейчас мы можем сразиться лишь с 8 пророками, а не с 10."
90002080-117 = "То есть... я смогу подняться только до 80-го уровня вместо полного 100-го."
90002080-119 = "А? Если подумать... ты права."
90002080-120 = "С Нецахом и Малкут мы сейчас действительно ничего не можем сделать..."
90002080-122 = "Тем не менее, похоже, этот план — наш единственный вариант."
90002080-123 = "По крайней мере мы сможем запутать и нарушить работу Стального континента и процесс его расширения."
90002080-124 = "[s] «Звучит как вполне ясная цель.»"
90002080-125 = ""
90002080-127 = ""
90002080-128 = ""
90002080-129 = "Да, Сенсей. Отныне мы должны занимать каждую область, уничтожать её пророка..."
90002080-130 = "...затем извлекать информацию из его ядра и сохранять её в Кей."
90002080-131 = "Если всё сработает, Кей сможет... серьёзно нарушить работу Стального континента."
90002080-132 = "Тогда решено, Сенсей."
90002080-133 = "Нам потребуется физически подготовиться."
90002080-134 = "[s] «Физически подготовиться?»"
90002080-135 = "Именно. Во-первых, не думаю, что смогу снова... экипировать Аби-Эшух."
90002080-136 = "Малкут серьёзно повредила внешнюю броню."
90002080-137 = "Основной каркас тоже сильно повреждён. Думаю, более целые детали мы всё же сможем спасти и использовать повторно."
90002080-138 = "Но, учитывая всё, я считаю лучшим решением передать каркас Аби-Эшух Арис."
90002080-140 = "Ч-что?! Аби-Эшух — мне?! Но...!"
90002080-141 = "Арис, мы должны использовать наши ресурсы и задействовать всё, что можем."
90002080-142 = "Теперь проблема в том, чтобы извлечь каркас, провести капитальный ремонт и переделать его под Арис."
90002080-143 = "А времени у нас в обрез."
90002080-144 = "И по возможности нам нужно вооружить всех остальных."
90002080-145 = "Даже простое удержание этой области уже растягивает наши ресурсы до предела..."
90002080-146 = ""
90002080-148 = ""
90002080-149 = "..."
90002080-150 = "Что вам нужно?"
90002080-152 = "А-А? Ну..."
90002080-153 = "Для начала... нужно отремонтировать транспортный корабль. Затем придётся всё перераспределить, модифицировать и установить дополнительные необходимые детали, как предложила Токи."
90002080-154 = "Поскольку людей у нас мало, а большая часть AMAS уничтожена, нам нужны различные мощности для автоматизированных процессов, и..."
90002080-155 = ""
90002080-157 = ""
90002080-160 = "[ns] «Ого...»"
90002080-161 = ""
90002080-162 = "Э-это уже звучит так, будто вы просите нас построить совершенно новый завод..."
90002080-163 = ""
90002080-165 = ""
90002080-166 = ""
90002080-167 = "Да, если говорить просто. Но это невозможно, поэтому придётся как-то выкручиваться..."
90002080-169 = "Но если мы всё подготовим, всё получится, верно?"
90002080-171 = "?!"
90002080-172 = "?!"
90002080-174 = "К-Кей? Я не до конца понимаю логистику, но Рио ведь сказала, что это невозможно..."
90002080-175 = "Нет. Это возможно. Конечно, одной мне не справиться."
90002080-176 = "Но если Арис будет рядом, это возможно."
90002080-177 = "Я...?"
90002080-178 = "Да. Реконструкция материи — одна из характерных сил Безымянных Богов. Я уже несколько раз об этом говорила, если хоть кто-то слушал."
90002080-179 = "Весь Стальной континент был создан этой силой."
90002080-180 = "Да. Мы это уже знали. Погодите, неужели?!"
90002080-181 = "Да. Именно то, о чём ты думаешь."
90002080-182 = "Это возможно, Кей?!"
90002080-183 = "С Арис — да."
90002080-184 = "Но я ведь... ничего не умею..."
90002080-185 = "Всё хорошо, Арис. Будет как в прошлый раз."
90002080-186 = ""
90002080-188 = ""
90002080-189 = ""
90002080-190 = "Это место... пропитано силой Безымянных Богов. Я почувствовала её, когда мы столкнулись с Малкут."
90002080-191 = "...И пусть она немного искажена, этой силой всё равно можно пользоваться."
90002080-192 = "И... думаю... в этом теле я смогу управлять ею даже лучше, чем раньше."
90002080-193 = "Так что давай покажем им, Арис."
90002080-194 = "Покажем, на что способны мы. На что способна ТЫ."
90002080-195 = ""
90002080-197 = ""
90002080-198 = ""
90002080-200 = "Покажем им наш истинный потенциал."
90002080-201 = "Что... мне делать?"
90002080-216 = "Всё просто. Посмотри на меня, Арис. Посмотри мне в глаза. Это есть в тебе. Ты всегда была идеальной."
90002080-217 = "И... дай мне свои руки. Пожалуйста, знай: я рядом. Мы связаны."
90002080-218 = "А теперь... представь. Вообрази."
90002080-219 = ""
90002080-233 = "Представить...?"
90002080-234 = "Да. Представь то, что нам нужно. То, о чём раньше говорила Рио. Каркас Аби-Эшух и то, чего ты можешь достичь. Я знаю, ты справишься."
90002080-235 = "...Представь, кем ты хочешь стать."
90002080-236 = "Достаточно будет общего образа. Детали я заполню сама. Просто... верь. Пожалуйста."
90002080-237 = ""
90002080-240 = "Не бойся, Арис."
90002080-241 = "Помнишь, как загорелось то сияние? Что оно означало?"
90002080-242 = ""
90002080-255 = "Ты... больше этого. Я вижу это в тебе."
90002080-259 = ""
90002080-260 = "Арис... Кей..."
90002080-261 = ""
90002080-262 = "Ого... Такое чувство, будто я попала в кат-сцену видеоигры?"
90002080-263 = "Ага... Пожалуй, ты права..."
90002080-264 = "Алиса...?"
90002080-266 = ""
90002080-268 = ""
90002080-269 = "..."
90002080-270 = "У меня новая броня... Это я? Что это?"
90002080-272 = "Да. Это твой потенциал."
90002080-273 = "Это твоя Аби-Эшух."
90002080-274 = "Вот это сверхъестественное явление, да, президент?"
90002080-275 = "За наши приключения я видела множество явлений. Это — величайшее."
90002080-277 = "И я... рада."
90002080-279 = "Следующий эпизод;Переодевание"
