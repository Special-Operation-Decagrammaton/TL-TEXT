[translation]
1012202-1 = "Сторона меня, о которой даже я не знала"
1012202-2 = ""
1012202-3 = "Ого, Сенсей!"
1012202-4 = "Что ты делаешь?"
1012202-5 = "Так ты гуляешь? Ну и как тебе?"
1012202-6 = "[s] «Хороший пляж.»"
1012202-7 = "Хи-хи, рада, что тебе нравится. Я много над ним работала!"
1012202-8 = "Хочешь узнать, есть ли у Чаепития ещё какие-нибудь частные владения?"
1012202-9 = "Хм-м. Даже не знаю..."
1012202-10 = "Но... наверное? Я не тот человек, у которого стоит это спрашивать."
1012202-11 = "А, Сенсей. Мне тут сказали, что твоё мнение о Чаепитии изменилось."
1012202-12 = "Ну и... в чём именно?"
1012202-13 = "[s] «Было приятно увидеть, как вы все расслабились.»"
1012202-14 = "А-ха-ха, понятно. Наверное, потому что ты наконец увидел нас «в естественной среде.»"
1012202-16 = "Я поговорил с Микой о новых сторонах членов Чаепития, которые мне удалось увидеть."
1012202-17 = ""
1012202-18 = "«Какие они обычно»? Хм, на это сложно ответить."
1012202-19 = "Может, они показывают свои настоящие характеры... какими были бы, если бы всего ЭТОГО не было, ха-ха."
1012202-20 = "[s] «Полагаю, ты видела все их стороны, Мика!»"
1012202-21 = "Ага! Мы ведь давно друг друга знаем! ☆"
1012202-22 = "Я всегда могу понять, если с ними что-то не так."
1012202-23 = "Например... О, сегодня они выглядят уставшими, рассеянными, ну и всё такое..."
1012202-24 = "Так я и поняла, что им обеим нужно расслабиться. А что может быть лучше отпуска?"
1012202-25 = "...Хотя не уверена, что всё прошло настолько уж хорошо."
1012202-26 = "[s] «Думаю, смена обстановки пошла им на пользу.»"
1012202-27 = "Надеюсь! ♪"
1012202-28 = "В отличие от них, мне особо нечего показать с новой стороны."
1012202-29 = "Хм? Ну, я всегда одинаковая."
1012202-30 = "Я же та самая избалованная маленькая нарушительница спокойствия, да?"
1012202-31 = "Даже в этот раз, когда я правда старалась, я ВСЁ РАВНО устроила весь этот хаос."
1012202-32 = "...А-ха-ха. Немного грустно, правда?"
1012202-33 = "Но зато я хотя бы последовательна, да?"
1012202-34 = "[s] «У тебя есть и другие стороны, Мика.»"
1012202-35 = "Ч-что?"
1012202-36 = "[s] «Ты заботишься о своих друзьях, разве нет?»"
1012202-37 = "В-вот как...?"
1012202-38 = "Не думаю, что я правда это делала..."
1012202-39 = "Настаиваешь? О, ха-ха, тогда продолжай!"
1012202-40 = ""
1012202-42 = ""
1012202-43 = "Но серьёзно. Ты слишком добр ко мне."
1012202-44 = "Я не хорошая. Мы оба это знаем."
1012202-45 = "[ns1] «Ты лучше, чем сама о себе думаешь.»\n[ns2] «Я вижу в тебе столько хорошего.»"
1012202-48 = ""
1012202-49 = "Серьёзно... Ты можешь говорить такое с невозмутимым лицом?"
1012202-50 = "..."
1012202-51 = ""
1012202-53 = "Кажется, ты видишь во мне то, чего не вижу я сама. Я правда не..."
1012202-54 = "...Но, может быть, ты прав."
1012202-55 = "Возможно, во мне есть ещё что-то. Может, есть сторона меня, о которой даже я пока не знаю!"
1012202-56 = "А вдруг окажется, что втайне я настолько обаятельная, что стану суперзнаменитой? Шучу! ☆"
1012202-58 = "Мика заметно повеселела, и мы продолжили болтать."
