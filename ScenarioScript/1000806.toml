[translation]
1000806-1 = "Проблемы с опозданиями"
1000806-2 = "Трущобы за пределами Миллениума"
1000806-3 = "..."
1000806-4 = "..."
1000806-5 = "..."
1000806-6 = "...Слышал?"
1000806-7 = "Говорят..."
1000806-8 = "Микамо Нэру столько пропускала занятия, что..."
1000806-10 = "...её посещаемость висит на волоске."
1000806-11 = "Да ладно..."
1000806-12 = "Если она пропустит ещё один урок или опоздает, её оставят на второй год или накажут дисциплинарно?"
1000806-13 = "Верно."
1000806-14 = "Если её завалят или ещё хуже, это может положить конец её карьере агента."
1000806-15 = "Ага. Именно."
1000806-16 = ""
1000806-18 = "Нам нужно всего лишь заставить Нэру опоздать. Любой ценой!"
1000806-20 = "По дороге в Миллениум"
1000806-21 = "Доброе утро, Сенсей!"
1000806-22 = "Хочешь поговорить о моей посещаемости?"
1000806-23 = "Хахаха. Не трать слова — я и так знаю, в какой заднице. Если ещё пропущу урок, мне конец."
1000806-24 = "Не понимаю, как так получается. Я всегда выхожу вовремя, но всё равно опаздываю."
1000806-25 = "Поэтому лучше двигаться. Поговорим по дороге."
1000806-26 = "Сегодня я точно приду в школу вовремя!"
1000806-28 = "Переулок Миллениума"
1000806-29 = "Эй, вы двое! Учитель и мелкая горничная!"
1000806-30 = "Кого ты назвала маленькой?!"
1000806-31 = "*клац*"
1000806-32 = "Ииик! Простите!"
1000806-33 = "Я только хотел предложить вам попробовать новое блюдо нашего магазина..."
1000806-34 = "Ну, сегодня я всё-таки пропустила завтрак."
1000806-35 = "Что думаете, Сенсей?"
1000806-36 = "[s] «Не забывай про время.»"
1000806-37 = "Будет впритык, но если только один кусочек..."
1000806-38 = "..."
1000806-39 = "*вздох* Нет. Нужно сосредоточиться... Я ведь только что сказала, что сегодня выложусь на полную."
1000806-40 = "Извините, но в этот раз я пас."
1000806-41 = "Ладно. Пойдёмте, Сенсей."
1000806-42 = ""
1000806-43 = "..."
1000806-44 = "Да ладно — она не купилась? Вот тебе и план со слабительным."
1000806-45 = "Хорошо, переходим к плану Б!"
1000806-47 = "Добро пожаловать! Сегодня у нас особые скидки."
1000806-48 = "Этот парик-регент сделает тебя настоящей крутой девчонкой. И скидка 90 процентов, но только следующие пять минут!"
1000806-49 = "..."
1000806-50 = ""
1000806-52 = "(Ч-Чёрт... Этот парик-регент выглядит ТАК КРУТО! Хочу!)"
1000806-53 = "(И скидка 90 процентов? Даже я понимаю, что это очень выгодно.)"
1000806-54 = ""
1000806-56 = "Ну как, мисс? Что скажете? На вас будет смотреться великолепно!"
1000806-57 = "П-Правда...?"
1000806-58 = "Один этот модный парик сделает тебя крутой. А в нашем магазине есть всё для полного образа! Даже парик длиной почти метр!"
1000806-59 = "Целый метр?"
1000806-60 = "Вот сюда, пожалуйста. Не хотите же упустить такую возможность?"
1000806-61 = "Н-Ну..."
1000806-62 = "[s] «Не забывай про время.»"
1000806-63 = "Это очень-очень плохо!! У-Угх"
1000806-64 = "Извините, но я пас! Нам пора, Сенсей!"
1000806-65 = ""
1000806-66 = "..."
1000806-67 = "Как она смогла не зайти? Я ведь расставил все ловушки..."
1000806-68 = "Чёрт. Опять ушла! Переходим к плану В."
1000806-70 = "..."
1000806-71 = "[s] «Ты выглядишь разочарованной.»"
1000806-72 = "...Может быть. Но этот продавец... Разве это не тот же человек, который предлагал нам попробовать новое блюдо?"
1000806-73 = "[s1] «Правда?»\n[s2] «Не знаю. Я не различаю лица продавцов.»"
1000806-74 = "Хм... Тут что-то нечисто."
1000806-75 = "Хм... Тут что-то нечисто."
1000806-77 = "Что нам теперь делать?"
1000806-78 = "Последний вариант — напасть в лоб. Устроим засаду в следующем переулке!"
1000806-79 = "Напасть на Нэру напрямую? У меня плохое предчувствие..."
1000806-80 = "Нужно лишь задержать её! По моим расчётам, Нэру появится в следующем переулке через минуту."
1000806-81 = "Если удержим её пятнадцать минут, она точно опоздает на урок!"
1000806-82 = "Хм... Да, пятнадцать минут, наверное, сможем, если застанем её врасплох."
1000806-83 = "У нас получится!"
1000806-84 = "*топ* *топ* *топ*"
1000806-85 = "Мы опаздываем, Сенсей! Беги!"
1000806-86 = "Наконец-то. Вот и она."
1000806-87 = "Вперёд! Время засады!"
1000806-88 = ""
1000806-89 = "*шурх*"
1000806-91 = "Готовься, Микамо Нэру!"
1000806-92 = "Пришло время ответить за все страдания, которые ты нам причинила... Погоди, где она?!"
1000806-93 = "Она только что была здесь..."
1000806-94 = ""
1000806-95 = "Я так и знала."
1000806-96 = ""
1000806-97 = "Ч-что?!"
1000806-98 = "Мне показалось, что я вас узнала... Вы те бандиты, которых мы недавно уделали, да?"
1000806-99 = "Вы вообще кто такие, чтобы пытаться заставить меня опоздать?!"
1000806-100 = ""
1000806-102 = "Вы за это заплатите."
1000806-103 = ""
1000806-104 = "И-Ик?!"
1000806-106 = "*БА-А-АХ*"
1000806-108 = "Главный коридор Милленниума"
1000806-109 = "*вздыхает*"
1000806-110 = "Фух. Еле успели. Оказывается, вовремя прийти в школу — та ещё задача."
1000806-111 = "[s] «Зато маршрут был очень живописный.»"
1000806-112 = "Хахаха. Ага, точно!"
1000806-113 = "Надо быть осторожнее, если хочу сохранить серию без опозданий."
1000806-114 = "Спасибо, что проводил меня до школы, Сенсей."
1000806-115 = "Ладно, мне пора на урок. Увидимся!"
1000806-116 = ""
1000806-118 = "Нэру вихрем умчалась в класс."
