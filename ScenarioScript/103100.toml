103100-224 = ""
103100-226 = ""
103100-227 = "Сенсей... П-Почему? Ради чего?"
103100-229 = "...Зачем вам это?"
103100-230 = "Вы не можете остановить уничтожение. Согласно моему анализу, это будущее было предрешено ещё до вашего появления."
103100-231 = "С того самого момента, как Сунаоками Широко появилась в этом мире, её судьба была определена."
103100-232 = "Время — не непрерывная линия. Оно лишь повторяется в заранее определённых причинах и следствиях."
