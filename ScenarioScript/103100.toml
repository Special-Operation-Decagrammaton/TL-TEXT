[translation]
103100-1 = "Эпизод 10;В небо"
103100-12 = "Сенсей, у меня хорошие новости!"
103100-13 = "Начну с самого важного..."
103100-14 = "Я успела закончить форму операторов!"
103100-15 = "[s] «О-Ого?! Впечатляет!»"
103100-16 = ""
103100-22 = ""
103100-23 = ""
103100-24 = ""
103100-27 = ""
103100-28 = ""
103100-29 = ""
103100-30 = ""
103100-31 = "[ns] «Так вот она какая, форма операторов!»"
103100-33 = "Эм... Эту форму обязательно носить?"
103100-34 = "Да! Мы же операторы межгалактического линкора! Было строгое требование соблюдать законы жанра, так что..."
103100-36 = "И кто же выдвинул это требование?"
103100-37 = "Технически это даже не линкор, не говоря уже о межгалактическом."
103100-38 = "*вздох* ...Что я вообще здесь делаю?"
103100-39 = "Хех... Смирись с судьбой. Ты смогла запомнить эту толстенную инструкцию, вот и оказалась здесь. Такая уж удача."
103100-41 = "Рин... Тебе идёт это пальто."
103100-42 = ""
103100-44 = ""
103100-45 = "Почему моё отличается от остальных?"
103100-46 = "[s] «Ты капитан, так что, конечно, тебе нужно пальто подлиннее!»"
103100-47 = "..."
103100-48 = "Ха-ха-ха... Недолго я это поношу, но..."
103100-49 = "Хи-хи. Собравшиеся здесь отвечают за важнейшую задачу — расчёт и проверку многомерного анализа."
103100-50 = "Для такой важной работы нужна особая одежда. Это не просто форма. Она отслеживает физическое состояние — мозговые волны, пульс и прочее, — чтобы вы могли выполнять обязанности без проблем."
103100-51 = "Также добавлены огнестойкость, защита от взрывов и водонепроницаемость. Иными словами, это специальное снаряжение операторов."
103100-53 = "Звучит как пульт с кучей лишних ненужных функций."
103100-54 = "А водонепроницаемая форма нам точно нужна...?"
103100-55 = "Ну-ну, все. Что сделано, то сделано, а времени у нас мало. Начнём."
103100-57 = "...Ага."
103100-58 = ""
103100-60 = ""
103100-63 = ""
103100-64 = "Мы поднимемся на борт Корабля Утнапиштима, чтобы проникнуть в Ковчег Атрахасис на высоте 75 000 метров над Кивотос."
103100-65 = "Наша цель — захватить Ковчег, отключить его и благополучно вернуться на землю."
103100-66 = "В операции примут участие следующие люди."
103100-67 = ""
103100-69 = ""
103100-70 = ""
103100-71 = "Операторы: Урава Ханако, Амау Ако,"
103100-72 = ""
103100-74 = ""
103100-75 = "Окусора Аяна, Хаясэ Юука,"
103100-76 = ""
103100-78 = ""
103100-79 = "Ониката Каёко, Акебоши Химари,"
103100-80 = ""
103100-82 = ""
103100-83 = "а также Юраки Момока и Ивабитсу Аюму."
103100-84 = ""
103100-87 = "...А я, Нанагами Рин, вместе с Сенсеем буду управлять Кораблём Утнапиштима."
103100-88 = "[s] «Рассчитываю на вас всех!»"
103100-89 = "После отправления Корабля Утнапиштима следующие участники возьмут на себя управление воздушным движением и техническую поддержку."
103100-90 = ""
103100-92 = ""
103100-93 = ""
103100-94 = "От Миллениум — Отосэ Котама и Омагари Харэ из Веритас."
103100-95 = ""
103100-97 = ""
103100-98 = "Конури Маки, Кагами Чихиро и..."
103100-99 = ""
103100-101 = ""
103100-102 = "...Нэкозука Хибики, Шираиши Утаха и Тоёми Котори из Инженерного отдела."
103100-103 = ""
103100-104 = "Далее, после проникновения на Ковчег, следующие участники помогут отражать возможные нападения и поддерживать захват."
103100-105 = ""
103100-108 = ""
103100-109 = "Таканаши Хошино, Куроми Сэрика и Изаёй Нономи из Комитета по предотвращению закрытия Абидос."
103100-110 = "А-ха-ха. Рассчитываю на вас всех."
103100-111 = "Хех. Оставьте это нам."
103100-112 = "Мы надерём зад Chroma!"
103100-113 = "Ага, ага! Мы спасём Широко."
103100-115 = "Да. Члены Комитета по предотвращению закрытия также вызвались обеспечить безопасность Сунаоками Широко."
103100-116 = "А ещё..."
103100-117 = ""
103100-122 = ""
103100-123 = "Тэндоу Алиса из Отдела разработки игр, у которой есть рельсотрон, — единственная на этом корабле с оружием. И..."
103100-124 = ""
103100-128 = ""
103100-129 = ""
103100-130 = ""
103100-131 = "Сайба Момои, Сайба Мидори и Ханаока Юзу будут помогать при захвате и обеспечивать поддержку по мере необходимости."
103100-132 = "П-Приятно будет с вами работать..."
103100-134 = "*вздох* ...Ну ладно. Похоже, придётся за ними присматривать."
103100-135 = "Без глупостей. Ваша безопасность — прежде всего, ясно?"
103100-137 = "И напоследок..."
103100-138 = "А? Разве это не все?"
103100-139 = ""
103100-142 = ""
103100-148 = ""
103100-150 = ""
103100-151 = "Айкиё Фуука из Клуба школьного питания Геенна... и Общество исследования гурманов будут отвечать за питание."
103100-152 = "Стоп! Подождите! Это вообще неправильно! Совсем!"
103100-154 = "Хи-хи-хи. Буду рада поработать со всеми."
103100-155 = "Как и почему я вообще здесь оказалась?!"
103100-156 = "Моё место в столовой! А не на межгалактическом линкоре!"
103100-157 = "То есть я понимаю. Я здесь, чтобы готовить еду. Но почему вместо Джури здесь Общество исследования гурманов?"
103100-158 = "Хи-хи-хи. Разве не очевидно, Фуука?"
103100-159 = "Потому что это шанс попробовать то, что обычно попробовать нельзя."
103100-161 = "То, что обычно нельзя попробовать...?"
103100-162 = "Да, причина нашего присутствия здесь та же, что и всегда."
103100-163 = "Исследовать гастрономию!"
103100-164 = "Мы здесь, чтобы выяснить, насколько вкусна еда в космосе!"
103100-165 = ""
103100-167 = ""
103100-168 = "Именно! Еда в космосе... Это же нечто особенное! Такой шанс выпадает не каждый день!"
103100-169 = "В фильмах про космос люди постоянно пьют через трубочку парящие капли сока. Я всегда хотела попробовать."
103100-170 = ""
103100-171 = "И никаких других причин нам не нужно! ★"
103100-173 = "Да. Космическая пища — особый вид еды, рассчитанный на невесомость."
103100-174 = "Нужно учитывать многое: обращение с жидкостями, особую среду, где готовить невозможно, и стерилизацию для предотвращения возможных мутаций."
103100-175 = "Так что..."
103100-176 = ""
103100-178 = ""
103100-179 = ""
103100-180 = "Вот почему ты здесь, Фуука!"
103100-181 = ""
103100-183 = ""
103100-184 = ""
103100-185 = "Но почему именно я?!"
103100-186 = "На всякий случай мы взяли грузовик Клуба школьного питания. Ты нам нужна, Фуука!"
103100-187 = "Что?! Грузовик Клуба школьного питания...? Как вы вообще это провернули?!"
103100-188 = "Гордись собой. Вместе мы прошли горы и реки, а теперь отправляемся в космос!"
103100-189 = "Точно! Ни один другой грузовик не испытывал невесомость!"
103100-190 = "Ни одно из этих приключений не было по моей воле... Мне это не нужно..."
103100-191 = "[s1] «(...)»\n[s2] «(Хотя мы не поднимемся достаточно высоко, чтобы испытать невесомость.)»"
103100-196 = "Сенсей. Я слышала, что управлять Кораблём Утнапиштима можно было только с помощью силы Sanctum Tower."
103100-197 = "Именно поэтому ЧВК Кайзер попыталась захватить Sanctum Tower сразу после того, как корабль откопали."
103100-198 = "Теперь, когда Sanctum Tower уничтожен, управлять кораблём придётся вам, Сенсей, как владельцу Ящик Шиттим."
103100-199 = "[s] «Да. Я знаю...»"
103100-200 = "Как всегда, мы рассчитываем на вас."
103100-201 = ""
103100-202 = "Верно. Благодаря своим способностям я могу пробудить этот артефакт."
103100-203 = "Но... Он отличается от других артефактов. Со мной всё будет хорошо, но..."
103100-204 = "Сенсей... Сила этого артефакта будет напрямую передаваться владельцу Ящик Шиттим. Вам."
103100-205 = "[s] «Всё хорошо, Арона.»"
103100-206 = "С-Сенсей, у вас обычное человеческое тело! Даже одна пуля может угрожать вашей жизни! А это...!"
103100-207 = "[s] «Разве ты не защищала меня каждый раз, Арона?»"
103100-208 = "Н-Но... Здесь совсем другой масштаб!"
103100-209 = ""
103100-212 = "Пожалуйста, передумайте, Сенсей. Нагрузка, которую придётся выдержать вашему человеческому телу... Это..."
103100-214 = "...Но я обязан предупредить."
