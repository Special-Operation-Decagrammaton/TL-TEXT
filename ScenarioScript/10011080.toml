[translation]
10011080-1 = "Эпизод 8;Что на самом деле стоит у нас на пути"
10011080-2 = ""
10011080-3 = "[ns] «Ты хочешь, чтобы мы остановились?»"
10011080-4 = "Мы наконец получили сообщение о ситуации, пусть и с опозданием."
10011080-5 = "Подумать только, что на встрече обмена допустили столь неприглядный инцидент..."
10011080-6 = "А о таком серьёзном происшествии, как похищение важного гостя, нужно было сообщить немедленно, не так ли?"
10011080-7 = "А! Ну, п-понимаете..."
10011080-8 = "Учитывая... усилия, которые вы приложили, чтобы исправить ситуацию, я закрою на это глаза."
10011080-9 = "Но дальше мы возьмём всё на себя."
10011080-10 = "В-Вы хотите, чтобы мы не вмешивались?"
10011080-11 = "Я бы не стала так выражаться, но да. К счастью, по трансляции нам удалось определить местонахождение Вольных Морё."
10011080-12 = "Мы вызовем Хяккарёран, чтобы они разобрались с ними. С этого момента операцию берёт на себя клуб Инь-Ян."
10011080-13 = "А теперь, с вашего позволения."
10011080-14 = ""
10011080-16 = ""
10011080-18 = "Вы не можете просто решить это за нас!"
10011080-19 = ""
10011080-21 = ""
10011080-22 = ""
10011080-24 = ""
10011080-25 = "Вот именно! В-Выступление ещё можно спасти!"
10011080-26 = "Мы все так старались, чтобы добраться сюда... Если поймаем Моурё, шоу сможет продолжиться!"
10011080-28 = "Как похвально. Но, кажется, не все здесь с вами согласны."
10011080-29 = "Похоже, один ключевой человек здесь так и не высказался."
10011080-30 = "...!"
10011080-31 = ""
10011080-33 = ""
10011080-34 = "*вздыхает*"
10011080-35 = "Я благодарна, что общественность ещё не узнала о случившемся."
10011080-36 = "Но позвольте мне говорить прямо."
10011080-37 = "Выступление уже провалено."
10011080-38 = "И немыслимо поручать устранение последствий Клубу исследования ниндзюцу. Какой-то разношёрстной группе, которая даже официальным клубом не является."
10011080-39 = "Мой совет? Отступите, пока не пострадали."
10011080-40 = "А если всё это ради официального признания вашего клуба..."
10011080-41 = "Есть ведь нормальная процедура, не так ли?"
10011080-42 = "Хрг!"
10011080-43 = ""
10011080-45 = ""
10011080-46 = ""
10011080-48 = "Кахо права."
10011080-49 = "Президент?!"
10011080-50 = "Президент...!"
10011080-51 = ""
10011080-52 = "[ns] «Мичиру.»"
10011080-53 = "В конце концов, именно мой эгоизм втянул нас во всё это. Если бы не я, мы бы не оказались в такой беде."
10011080-54 = "Простите... Простите меня, Кахо, Сенсей, все остальные..."
10011080-55 = "Из-за моего эгоизма пострадали все вокруг."
10011080-56 = ""
10011080-59 = ""
10011080-60 = "...И бедная Ибуки теперь напугана и совсем одна — тоже из-за меня."
10011080-61 = "Всё это из-за моей собственной глупости, так что..."
10011080-63 = "Да... Думаю, нам пора уходить..."
10011080-64 = "Нет! Ни за что!"
10011080-65 = ""
10011080-67 = ""
10011080-68 = ""
10011080-69 = "...Д-Да... Может, вице-президент Клуба Инь-Ян и права."
10011080-70 = "Почему ты ни за что не хочешь подать заявку на регистрацию клуба и почему так упорно настаивала на всём этом..."
10011080-71 = "Почему...? Почему ты ничего не сказала ни мне, ни Изуне, пока всё не стало настолько плохо..."
10011080-72 = "...Я просто большая рассеянная дурында, так что хоть убей, не могу этого понять!"
10011080-73 = "Цукуё..."
10011080-74 = "Но всё это неважно...! Мы дали обещание!"
10011080-75 = "...Обещание?"
10011080-76 = "Мы пообещали Ибуки..."
10011080-77 = "Мы обещали защитить её. Спасти, если ей понадобится помощь, чего бы это ни стоило."
10011080-78 = ""
10011080-84 = "...Цукуё?"
10011080-85 = "Третье правило ниндзя! Если ниндзя дают обещание..."
10011080-86 = "...Они всегда держат слово!"
10011080-87 = "Поэтому, пожалуйста, Сенсей. Пожалуйста... помогите нам..."
10011080-88 = "[s] «Понял. Предоставьте это мне.»"
10011080-89 = "Вы правда, совершенно искренне верите, что сможете пробиться силой?"
10011080-90 = "...Понятно. Что ж, хорошо. Будь по-вашему! Я дам вам бой, которого вы так отчаянно хотите."
