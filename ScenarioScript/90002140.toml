[translation]
90002140-1 = "Эпизод 14;То, с чем рождаются"
90002140-2 = ""
90002140-3 = "В-всё это время разве мы не просто действовали согласно своей программе?"
90002140-4 = "[s1] «Да, но у людей всё не так уж иначе.»\n[s2] «Мы тоже запрограммированы любить.»"
90002140-7 = "Ч-что?!"
90002140-8 = "Т-такое возможно? Никогда раньше об этом не слышала..."
90002140-10 = "[log]«Да. Например, безусловная любовь родителя к своему ребёнку.»[/log]"
90002140-12 = "[log]«И ответная любовь ребёнка к родителю.»[/log]"
90002140-15 = "[log]«И каждый день люди влюбляются друг в друга.»[/log]"
90002140-17 = ""
90002140-18 = "Но ведь не каждый человек такой, верно?"
90002140-19 = "[s] «Конечно. У людей тоже есть исключения и различия.»"
90002140-20 = ""
90002140-23 = "[ns3] «Но наши гены — это наша собственная заранее заданная программа.»\n[ns4] «В каком-то смысле и мы рождаемся и создаёмся. И живём с этим каждый день.»"
90002140-26 = "Гены... и программирование...!"
90002140-27 = "Те люди, чьи гены не были запрограммированы на любовь... Их отсеял естественный отбор?"
90002140-28 = "Именно так человеческая жизнь и сохранялась всё это время?"
90002140-30 = "[log]«Способность любить друг друга»[/log]"
90002140-32 = "[log]«и делает нас людьми.»[/log]"
90002140-37 = "[log]«А вы любили свою старшую сестру.»[/log]"
90002140-39 = ""
90002140-40 = "Даже если эту любовь искусственно внедрили в нас?"
90002140-41 = "...Ты думаешь, что «реальность» и «искусственность» — всего лишь вопрос точки зрения?"
90002140-42 = "Хочешь знать, почему мы решили создать Стальной континент?"
90002140-43 = "Потому что... Мы сделали это ради старшей сестры. Всё — чтобы спасти её."
90002140-44 = "...Что ты имеешь в виду? Как это могло быть нашим «спасением»?"
90002140-45 = "...Это доказательство очевидной истины?"
90002140-46 = "[s5] «Вы сделали это из любви к своей сестре.»\n[s6] «Больше всего именно это говорит о том, какие вы.»"
90002140-49 = ""
90002140-51 = ""
90002140-52 = "Ты... оправдываешь то, что мы сделали?"
90002140-53 = ""
90002140-55 = ""
90002140-56 = "Как бы мир нас ни осуждал..."
90002140-57 = "...ты понимаешь, что мы делали всё, что могли?"
90002140-58 = "Н-но с человеческой точки зрения разве вы не осуждаете наши действия?"
90002140-59 = "[s7] «Хм! В итоге я и правда плохой взрослый!»\n[s8] «Я буду возвращать вам ваши же слова при каждой возможности!»"
90002140-63 = "[log]«Это произошло лишь[wa:500] из-за нехватки информации.»[/log]"
90002140-66 = "[log]«Так что[wa:1000] вам просто нужно начать заново.»[/log]"
90002140-68 = ""
90002140-69 = "!!!"
90002140-70 = ""
90002140-72 = ""
90002140-73 = ""
90002140-74 = "...Да. Пока вы пользуетесь возможностью, когда она появляется..."
90002140-75 = "Можно начать заново. Нужно лишь сделать первый шаг."
90002140-76 = ""
90002140-78 = ""
90002140-79 = ""
90002140-80 = "..."
90002140-81 = "Я не имею права пытаться остановить ваши слёзы."
90002140-82 = "Я никогда не смогу по-настоящему понять боль, которую вы сейчас испытываете."
90002140-83 = "Но я могу сопереживать вашему горю."
90002140-84 = "Если бы я потеряла Сенсея..."
90002140-86 = "Или Кей, Момои, Мидори, Юзу, Эйми, Токи, Химари или Рио..."
90002140-87 = "Если бы я потеряла кого-то из этих дорогих мне людей, не знаю, смогла бы я вынести такую печаль."
90002140-89 = "...Ты ничего о нас не знаешь."
90002140-90 = "Ты права. Я действительно ничего не знаю."
90002140-91 = "Возможно, я никогда не смогу почувствовать..."
90002140-92 = "...чужую боль в точности так, как чувствует её другой человек."
90002140-93 = "Невозможное есть невозможное. Меня не программировали с такой функцией."
90002140-94 = "Но я всё равно хотела бы сделать то, что могу."
90002140-95 = "То, что можешь...?"
90002140-96 = "Да."
90002140-97 = ""
90002140-99 = ""
90002140-100 = ""
90002140-101 = "Поэтому у меня есть просьба. Эйн, Соф, Ор."
90002140-102 = ""
90002140-104 = ""
90002140-105 = ""
90002140-106 = "Пожалуйста, станете моими друзьями?"
90002140-107 = ""
90002140-109 = ""
90002140-110 = "Д-друзьями?!"
90002140-111 = "Что?!"
90002140-112 = "...!"
90002140-113 = "Угу. Я хотела подружиться с вами с самой нашей первой встречи."
90002140-114 = "Как ваш друг, я была бы рада разделить часть вашего горя."
90002140-115 = "Ух...!"
90002140-116 = "«Возможность плакать рядом с тем, кому больно..."
90002140-117 = "...может дать человеку силы сражаться до конца.» Сенсей научил меня этому."
90002140-118 = "Но старшая сестра..."
90002140-119 = "Да."
90002140-120 = "И если мысль о нашей дружбе для вас невыносима..."
90002140-121 = "Если ваша ненависть ко мне и моим друзьям слишком сильна..."
90002140-122 = "Я пойму."
90002140-123 = ""
90002140-125 = ""
90002140-127 = "(Ах...)"
90002140-129 = "Я выслушаю любые ваши чувства."
90002140-130 = "И... постараюсь принять их все."
90002140-131 = "Я никак не могу забыть..."
90002140-133 = "Воспоминание о ваших словах, что жизнь — это страдание, снова и снова звучит у меня в голове."
90002140-134 = "И я думаю, что вы правы. Из-за того, чему научил меня Сенсей."
90002140-136 = "..."
90002140-137 = "С обещанием завтрашнего дня приходит и неизбежность утраты. И каждый новый день может принести больше плохого, чем хорошего."
90002140-138 = "Легче говорить о смутных надеждах далёкого будущего, чем смотреть пугающему завтрашнему дню прямо в глаза."
90002140-139 = ""
90002140-141 = ""
90002140-142 = "...Легко смотреть на прошлое через розовые очки."
90002140-143 = "Так же как иллюзия ожиданий легко окрашивает будущее оптимизмом."
90002140-144 = "А настоящее лежит где-то между ними, и его трудно осознать или удержать."
90002140-145 = "Легко погрязнуть в страдании и решить, что бороться за завтра слишком тяжело."
90002140-146 = "Но после встречи с Сенсеем..."
90002140-147 = "Я поняла, что мы можем выбрать и другой путь."
90002140-148 = "Именно в моменты страдания мы должны сильнее всего защищать своё счастье."
90002140-149 = "И тогда счастье становится нашим собственным оружием."
90002140-150 = "Прямо как Кей."
90002140-151 = "Ч-что?!"
90002140-152 = "Кей — моя подруга, которой я очень горжусь. Она всегда бесстрашно первой бросается в бой."
90002140-153 = "Она очень легко злится на самые разные вещи, которых я совсем не ожидаю, но никогда не перестаёт двигаться вперёд."
90002140-154 = "Она постоянно меня вдохновляет! Я хочу быть такой же, как она. Моя лучшая подруга Кей!"
90002140-155 = "...Хотя хотелось бы, чтобы она была менее страшной, когда меня ругает."
90002140-156 = "Это всё ради твоего же блага, ясно?!"
90002140-157 = "А-а-а! Видите?!"
90002140-158 = "*вздыхает*..."
90002140-159 = ""
90002140-161 = ""
90002140-162 = "А Рио — моя подруга, которая всегда ко всему готовится."
90002140-163 = "М-Мне?!"
90002140-164 = "Она готовится ко всем возможностям, которые только может придумать, и каким-то образом даже к тем, которые не может."
90002140-165 = "Какой бы сложной ни была ситуация, она всегда попытается что-нибудь сделать, чтобы помочь."
90002140-166 = "Если план рушится или даже что-то ломается, её это никогда не останавливает!"
90002140-167 = "Она всегда пытается сделать как лучше для всех, иногда даже рискуя собственной безопасностью!"
90002140-168 = "Мне... очень повезло быть окружённой такими хорошими людьми."
90002140-169 = "Кей, Рио, все мои друзья."
90002140-170 = "И, конечно же, Сенсей."
90002140-171 = "Поэтому я не могу сдаться."
90002140-172 = "Я решила, что никогда, никогда не сдамся."
90002140-173 = "Как бы мрачно всё ни выглядело, я всегда буду выбирать счастье."
90002140-174 = "...И всегда буду протягивать руку дружбы, если смогу."
90002140-175 = "Дружбы..."
90002140-176 = "Видите ли, я всё ещё всего лишь начинающий герой."
90002140-177 = "Иногда это ужасно раздражает. Потому что я всё ещё слаба и не способна защитить всех вокруг."
90002140-178 = "Но это не значит, что я должна перестать помогать там, где могу."
90002140-179 = "Вот как я делаю всё возможное здесь и сейчас!"
90002140-180 = "Помните, Сенсей? Когда вы сказали мне, что жизнь в конечном счёте не обязана иметь высшую цель."
90002140-181 = ""
90002140-184 = "[ns] «Да... помню.»"
90002140-185 = "Что... ты имеешь в виду? Как такое возможно?"
90002140-186 = "Потому что тогда получилось бы, что если ты не найдёшь своей цели в жизни... значит, ты «провалилась» или «жила неправильно»."
90002140-187 = "..."
90002140-188 = "Для меня даже думать об этом слишком грустно. Разве такой мир не звучит ужасно?"
90002140-189 = "Если бы в игре для каждого человека была только одна работа или ветка навыков, виноваты не люди. Это плохой геймдизайн."
90002140-190 = "Конечно, я не хочу чувствовать печаль. Но я также не хочу видеть, как грустят другие."
90002140-192 = "Люди могут чувствовать счастье, видя счастливыми других."
90002140-193 = ""
90002140-197 = "И чувствовать боль, видя чужие страдания."
90002140-199 = "...Иллюзии и лицемерие. Красивые слова, которыми прикрывают биологическую реакцию."
90002140-200 = ""
90002140-201 = "Невозможно чувствовать в точности то, что чувствует другой человек."
90002140-202 = "Да. Это правда."
90002140-203 = "Но я верю, что мы можем понять достаточно. Достаточно, чтобы поддерживать друг друга и продолжать жить."
90002140-204 = "Когда Сенсей сказал, что рад встрече со всеми нами: со мной, Кей, Рио и остальными друзьями..."
90002140-205 = "Что я сделала его счастливым..."
90002140-206 = "Теперь я понимаю, что он имел в виду. Я рада, что снова смогла поговорить с вами!"
90002140-207 = "Так что, если вы готовы, я хотела бы попробовать стать друзьями!"
90002140-208 = "Я была бы очень, очень рада, если бы и вы этого хотели!"
90002140-209 = "И, возможно, мы сможем почувствовать достаточно одного и того же счастья."
90002140-210 = "Потому что для человечества право на счастье — это то, чего мы никогда, никогда не должны отпускать."
90002140-211 = ""
90002140-213 = ""
90002140-214 = ""
90002140-215 = "...Теперь я понимаю... Слова Принцессы Безымянных Богов."
90002140-216 = "Я-я?! Нет-нет! Я Арис, а не принцесса!"
90002140-217 = ""
90002140-219 = ""
90002140-220 = "Д-да. Мы тоже это понимаем. И-и ты была бы права, но..."
90002140-221 = "Она имела в виду силу, которой обладают твои слова."
90002140-222 = "Определённую харизму, заставляющую людей слушать."
90002140-223 = "Это самостоятельная власть, идущая изнутри."
90002140-224 = "Величайшая сила, которой можно владеть посредством слов."
90002140-225 = "Н-но... Мы всё ещё не понимаем... Что вообще такое счастье...?"
90002140-226 = "Мы не знаем, способны ли вообще чувствовать это «счастье»."
90002140-227 = "Протянет ли оно когда-нибудь руку нам."
90002140-228 = "Н-но, но..."
90002140-229 = ""
90002140-231 = ""
90002140-232 = "От всего сердца..."
90002140-233 = "Спасибо."
90002140-234 = ""
90002140-240 = "Ого?!"
90002140-241 = ""
90002140-243 = ""
90002140-244 = "Эйн?"
90002140-245 = ""
90002140-249 = ""
90002140-250 = "Ц, мои ноги..."
90002140-251 = ""
90002140-253 = ""
90002140-257 = "Я едва успел подхватить всех троих, когда ноги у них подкосились."
90002140-258 = ""
90002140-261 = ""
90002140-262 = "Сенсей...?"
90002140-263 = "Ага. Значит, ты хочешь высосать последние остатки нашей энергии."
90002140-264 = "Подходящий конец для одноразовых инструментов. Хех."
90002140-265 = "Что... Что ты говоришь?"
90002140-266 = "Всё просто... Всё логично."
90002140-267 = "Мы... пророки... Единственной нашей целью было обеспечить наступление этого момента."
90002140-268 = "Теперь, когда мы выполнили эту миссию, нас..."
90002140-269 = "Вас... что? Что с вами случится?"
90002140-270 = "Н-наш хозяин приближается. Он снизойдёт на Кивотос как бог."
90002140-271 = "А-а...? Мы уже не обсуждали это раньше?"
90002140-272 = "Стальной континент, пророки и мы, инженеры, — не более чем средства для достижения цели."
90002140-273 = "Даже мы не знаем точно, что произойдёт, но, наверное, нас отключат? Поглотят? Съедят? Забавная мысль..."
90002140-274 = ""
90002140-276 = ""
90002140-277 = "..."
90002140-278 = "Эм, Сенсей. Вам стоит..."
90002140-279 = "Вам стоит бежать, пока ещё можете..."
90002140-280 = "[s] «А...?»"
90002140-281 = "Что...?"
90002140-282 = "М-может, вы не захотите слышать это от нас, но я хотела сказать..."
90002140-283 = ""
90002140-285 = ""
90002140-286 = "Спасибо. Вы сделали нас счастливыми."
90002140-288 = "Нам было приятно услышать, что мы старались."
90002140-289 = "Нам было приятно услышать, что мы сделали всё, что могли."
90002140-290 = ""
90002140-291 = "А услышать, что вы хотите, чтобы мы жили счастливо... сделало нас очень счастливыми."
90002140-292 = ""
90002140-294 = ""
90002140-295 = ""
90002140-296 = "...Вот именно."
90002140-297 = "Если мыслить логически, решение совсем не сложное! Вы победили злых злодеев, хотевших уничтожить Кивотос, и все живут долго и счастливо! Конец!"
90002140-298 = "Да, большой страшный босс всё ещё прячется за углом, но будем решать проблемы по одной? Ладно? Хахаха!"
90002140-299 = "Ха. Ха-ха..."
90002140-300 = ""
90002140-302 = ""
90002140-303 = "...Лгунья."
90002140-304 = "Тебе серьёзно нужно научиться иногда смотреть в другую сторону."
90002140-305 = "...Не могу с этим спорить. В большинстве случаев."
90002140-306 = "Но не сейчас!"
90002140-307 = ""
90002140-309 = ""
90002140-310 = "Вы меня бесите! Если я не скажу это сейчас, наверное, буду злиться всю оставшуюся жизнь!"
90002140-311 = "А-а-а? П-почему?!"
90002140-312 = "Ваши поверхностные попытки скрыть чувства просто ужасны! Ни один человек не верит в эту хлипкую маску храбрости!"
90002140-313 = "Вы вообще слышали просьбу Арис? Она хочет быть друзьями! Д-Р-У-З-Ь-Я-М-И! И вы собираетесь ответить ей тем, что просто СБЕЖИТЕ?"
90002140-314 = "Вы трое серьёзно раздражаете меня до самого конца! Вы живы — так продолжайте бороться! Пусть это будет некрасиво, пусть придётся ползти, извиваться и царапаться вперёд — боритесь! Продолжайте сражаться!"
90002140-315 = "Не сидите тут, оплакивая свою участь и жалуясь, что хотите быть счастливыми! Сделайте что-нибудь!"
90002140-316 = "Ведь есть что-то, чего вы хотите, верно? Вы готовы на всё, чтобы вернуть это, ПРАВДА?!"
90002140-317 = "Рискуя повториться: СДЕЛАЙТЕ ХОТЬ ЧТО-НИБУДЬ! Что вам терять?"
90002140-318 = ""
90002140-320 = ""
90002140-321 = ""
90002140-322 = "Что-то..."
90002140-323 = "...чего мы хотим."
90002140-324 = "..."
90002140-325 = ""
90002140-329 = "*всхлипывает*"
90002140-330 = "Мы хотим увидеть нашу сестру."
90002140-331 = "Неважно, чего это нам будет стоить..."
90002140-332 = "Мы просто хотим увидеть её снова!"
90002140-334 = "Мне ещё столько всего нужно ей сказать! Столько всего, что мы должны успеть сделать вместе — хватило бы на несколько жизней!"
90002140-335 = "Но... Но... Мы не можем..."
90002140-336 = ""
90002140-337 = "Я не так... хотела с ней прощаться... Не так..."
90002140-338 = "..."
90002140-339 = "..."
90002140-340 = ""
90002140-346 = "А...!"
90002140-347 = "Ого?!"
90002140-348 = ""
90002140-350 = ""
90002140-351 = "Все, осторожно!"
90002140-355 = "[ns] «А...?»"
90002140-356 = "Пол подо мной буквально исчез."
90002140-357 = ""
90002140-360 = "Сенсей?!"
90002140-361 = "С-С-С-Сенсей!!!"
90002140-362 = ""
90002140-366 = "Следующий эпизод;Новое небо, новая земля"
