[translation]
80000109-1 = "Чувства главного стратега"
80000109-2 = "Получив сообщение от Кахо, я отправился в комнату Клуба Инь-Ян."
80000109-3 = "Спасибо, что пришли, несмотря на занятость, Сенсей."
80000109-4 = "[s1] «Если тебе нужна помощь, я с радостью помогу.»\n[s2] «Что тебе сейчас нужно?»"
80000109-7 = "Спасибо за доброту, но сегодня я позвала вас не ради помощи."
80000109-8 = "Я просто... хотела кое-что вам подарить..."
80000109-9 = "Я подготовила это вот здесь..."
80000109-10 = "[s3] «Уж не та ли это вещь?»\n[s4] «Это то, о чём я думаю?»"
80000109-13 = "А-А?"
80000109-14 = "О, это... Эм..."
80000109-15 = "Агх!"
80000109-16 = ""
80000109-17 = "(К-Как я должна это сделать, когда вы так формулируете, Сенсей?!)"
80000109-18 = "(В такой ситуации, может, стоит перейти к ТОМУ плану!)"
80000109-19 = ""
80000109-20 = "К-Кхм! Т-То, что я приготовила для вас сегодня, это..."
80000109-21 = "Мы специально подготовили это к Дню святого Валентина—"
80000109-22 = "П-П-Промо-товары Объединённой академии Хяккияко!"
80000109-23 = "В этом году мы получили множество промо-товаров от разных клубов, а также от гильдии торговцев!"
80000109-24 = "Я-я подумала, что это хороший повод поделиться некоторыми с вами в целях делового сотрудничества..."
80000109-25 = "[s] «А, да. Понимаю... Для сотрудничества...»"
80000109-26 = "Д-Да. В-Верно!"
80000109-27 = "Именно поэтому я сегодня вас и позвала..."
80000109-28 = "Ничего страшного, что я не предупредила заранее, правда?"
80000109-29 = "[s5] «Нет, вовсе нет.»\n[s6] «Ты занимаешься рекламой в праздник. Какая ты старательная, Кахо.»"
80000109-32 = "А?! Н-Нет..."
80000109-33 = "Сегодня я как раз полная противоположность усердию..."
80000109-34 = "Когда вы так говорите, мне становится даже стыдно..."
80000109-35 = "[s] «Стыдно?»"
80000109-36 = "Н-Ничего. Мне всё ещё нужно немного времени на подготовку..."
80000109-37 = "В общем... Позвольте объяснить рекламные материалы, начнём вот с этого!"
80000109-38 = "Это шоколадный брелок, изготовленный ассоциацией ремесленников. Очень тонкая и аккуратная работа."
80000109-39 = "А вот здесь..."
80000109-40 = ""
80000109-41 = "Шоколадная тарелка... от клуба керамики."
80000109-42 = "А здесь..."
80000109-43 = ""
80000109-44 = "...вкусная шоколадная якисоба от исследовательской ассоциации якисобы..."
80000109-45 = "А! Я-я чуть не у-уронила!"
80000109-46 = ""
80000109-47 = "И наконец... ш-шоколадные вагаси от мастера вагаси."
80000109-48 = "Х-Хотите попробовать?"
80000109-49 = "Почему-то руки Кахо дрожали, когда она протягивала мне вагаси."
80000109-50 = "[s] «Ты в порядке, Кахо? Ты дрожишь...»"
80000109-51 = "А? Н-Ничего!"
80000109-52 = "Я выгляжу немного нервной? Встревоженной? Напуганной?"
80000109-53 = "Ну..."
80000109-54 = "*вздох* Да, если и дальше ходить кругами, этому конца не будет..."
80000109-55 = "Я, Кахо, приняла решение!"
80000109-56 = "Н-Настоящая причина, по которой я вас позвала..."
80000109-57 = "Я хотела, чтобы вы приняли... вот это."
80000109-58 = ""
80000109-60 = ""
80000109-61 = ""
80000109-63 = "Это вам, Сенсей."
80000109-64 = "Я сделала это в благодарность за всю вашу прошлую помощь..."
80000109-65 = "Но мне было так неловко даже думать о том, чтобы вручить это вам!"
80000109-66 = "[s] «Вот почему ты сначала заговорила о промо-товарах.»"
80000109-67 = "Д-Да... А в итоге я просто без причины ходила кругами."
80000109-68 = "...Хуже того, я попыталась добиться личной цели под видом делового сотрудничества! Какая же из меня безответственная главный стратег!"
80000109-69 = "Не могу поверить, что показала вам такую свою сторону."
80000109-70 = "[s7] «Не стыдись.»\n[s8] «Я очень рад попробовать шоколад Кахо.»"
80000109-71 = ""
80000109-72 = ""
80000109-74 = ""
80000109-75 = "Но, Сенсей, я ведь солгала вам прямо в лицо."
80000109-76 = "И после всего этого вы всё равно хотите его попробовать?"
80000109-77 = "[ns] «Быть честным с самим собой непросто для любого человека.»"
80000109-79 = "[ns] «Спасибо за шоколад.»"
80000109-80 = ""
80000109-82 = ""
80000109-83 = "Ладно, Сенсей."
80000109-84 = "Я рада, что могу поделиться с вами своим шоколадом."
80000109-85 = "И своей благодарностью тоже."
80000109-87 = "Шоколад от Кахо был таким же сладким, как чувства, вложенные в него."
