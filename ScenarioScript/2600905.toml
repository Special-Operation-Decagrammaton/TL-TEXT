[translation]
2600905-1 = "Новая комната отдыха"
2600905-2 = "Мне нужно было по работе оказаться неподалёку от мэйд-кафе Юзу, поэтому я решил зайти к ней."
2600905-7 = ""
2600905-8 = ""
2600905-9 = ""
2600905-10 = ""
2600905-12 = ""
2600905-14 = "О-о! Не думала, что вы и-и правда придёте..."
2600905-15 = "С-с возвращением в C-Cafe Maidramatic, Господин!"
2600905-16 = "[s1] «Я вернулся, Юзу.»\n[s2] «Как работа?»"
2600905-19 = "У-у меня всё ещё не очень хорошо получается, но после вашей помощи стало гораздо лучше, Сенсей..."
2600905-20 = ""
2600905-22 = ""
2600905-24 = ""
2600905-25 = "А, Сенсей! Давненько не виделись."
2600905-26 = "Спасибо, что познакомили нас с таким замечательным студентом! Королева очень нам помогает."
2600905-27 = "[s] «...Королева?»"
2600905-28 = "О-о, это. Эм... Мне сказали, что в кафе нужно использовать псевдоним..."
2600905-29 = "Я по привычке написала ник, которым пользуюсь в играх, и все просто стали звать меня Королевой."
2600905-30 = "Ха-ха! Идеально! Чтобы сделать первоклассное мэйд-кафе, нужны яркие образы персонажей!"
2600905-31 = "Признаюсь, сначала она нервничала так сильно, что и я начал нервничать. Но я ошибался! Она почти не допускает ошибок и очень популярна у посетителей!"
2600905-32 = "А ещё совсем недавно сломалась бухгалтерская программа кафе. Ох, как же я паниковал! Но для Королевы это оказалось пустяком. Она мигом поняла, как исправить ошибку."
2600905-33 = "Ха-ха! Никогда ещё мне не хотелось так сильно называть её Королевой, как в тот момент!"
2600905-34 = "Э-э..."
2600905-35 = "[s] «Рад, что ты так хорошо здесь освоилась.»"
2600905-36 = "Х-Хорошо..."
2600905-37 = "Тогда, Сенсей... Эм, то есть, Господин. Позвольте проводить вас к столику!"
2600905-39 = "Несмотря на слова менеджера, всё это время Юзу продолжала ошибаться."
2600905-41 = ""
2600905-42 = "В-вот ваш заказ! Фирменный омурайсу Maidramatic!"
2600905-43 = "А? Но я заказывал только дынную газировку..."
2600905-44 = "П-прошу прощения! Я сейчас же её принесу!"
2600905-45 = ""
2600905-46 = "Т-теперь позвольте произнести волшебное заклинание, от которого еда станет вкуснее..."
2600905-47 = "Стань вкуснее..."
2600905-48 = "...Воскрешение!"
2600905-49 = "Это... кажется, не то заклинание."
2600905-51 = ""
2600905-53 = ""
2600905-54 = ""
2600905-55 = ""
2600905-56 = ""
2600905-57 = ""
2600905-58 = ""
2600905-60 = "А-ай. Простите!"
2600905-61 = "А-а... Ты пролила сок мне на рубашку... Похоже, останется пятно..."
2600905-62 = "Мне очень жаль! Я сейчас же вытру! Прямо сейчас!"
2600905-63 = ""
2600905-64 = ""
2600905-66 = ""
2600905-68 = "Почему Королева сегодня так много ошибается? На неё это не похоже..."
2600905-69 = "Ваше величество, можете на минутку подойти сюда?"
2600905-70 = "Эм... мне так жаль! Я всё время допускаю глупые ошибки... ещё и перед посетителями..."
2600905-71 = "Ничего страшного. Я больше переживаю за тебя. Всё в порядке?"
2600905-72 = "Сегодня ты особенно нервничаешь..."
2600905-73 = "Нет! Всё нормально... Ничего такого."
2600905-74 = ""
2600905-76 = ""
2600905-78 = ""
2600905-80 = "Что ж, рад это слышать."
2600905-81 = "Но скоро у тебя перерыв. Почему бы тебе не пойти в комнату отдыха и немного передохнуть?"
2600905-82 = "Хорошо..."
2600905-83 = ""
2600905-85 = ""
2600905-87 = "[ns] «Она обычно такая?»"
2600905-88 = "Нет, совсем нет. По крайней мере, после первого дня."
2600905-89 = "Надеюсь только, что после обеда не будет наплыва посетителей..."
2600905-94 = "Но после окончания перерыва Юзу так и не появилась."
2600905-95 = "[ns] Поискать Юзу."
2600905-97 = "Я обошёл всё кафе, но Юзу нигде не было."
2600905-98 = "Не придумав ничего лучше, я вышел через заднюю дверь в переулок за кафе."
2600905-100 = ""
2600905-102 = "Переулок у Cafe Maidramatic"
2600905-104 = "Эм... Пожалуйста, отойдите..."
2600905-105 = ""
2600905-108 = "Вы сидите на моей юбке... мне нужно возвращаться в кафе..."
2600905-109 = "[ns] «...Юзу?»"
2600905-112 = "― А, эм... В общем...[wa:2520]"
2600905-114 = "― Похоже, они забрались сюда... пока я спала...[wa:980]"
2600905-117 = "[ns] «Почему ты сидишь в этом контейнере, а не в комнате отдыха?»"
2600905-118 = "― Эм, просто... В комнате отдыха было много людей...[wa:3960]"
2600905-120 = "― И если я сяду там, они начнут со мной разговаривать...[wa:1940]"
2600905-123 = "― Мне придётся отвечать на всякие вопросы вроде «Где ты купила эту ленту?»[wa:1320]"
2600905-125 = "― Или «Чем ты любишь заниматься в свободное время?»[wa:2780]"
2600905-128 = "― И ещё на кучу других... Поэтому я сбежала.[wa:2460]"
2600905-131 = "― И нашла это место...[wa:2100]"
2600905-133 = "― Оказалось... это комната отдыха для кошек.[wa:3880]"
2600905-136 = "― И-и! Подождите, п-пожалуйста![wa:2020]"
2600905-139 = "― Я вылезаю! Я сейчас же вылезаю... Щекотно![wa:3770]"
2600905-142 = "Я убрал кошку и помог Юзу выбраться из контейнера."
2600905-144 = "С-Спасибо за помощь..."
2600905-145 = "Но, эм, [USERNAME] Сенсей, почему вы вернулись сюда?"
2600905-146 = "[s3] «Я волновался, когда ты не вернулась, Юзу.»\n[s4] «Я подумал, что тебе, может быть, нездоровится.»"
2600905-149 = "Нет! Всё в порядке! Физически я совершенно здорова!"
2600905-150 = "А? Вам показалось, что я всё утро нервничала?"
2600905-151 = "Эм... может быть, это потому, что..."
2600905-152 = "Потому что вы были рядом, Сенсей..."
2600905-153 = "[s] «Я заставил тебя нервничать?»"
2600905-154 = "...Да."
2600905-155 = "Раньше, во время нашей тренировки, вы так сильно мне помогли. Без вас я бы ни за что не набралась смелости сделать это. Но... теперь, когда вы здесь и видите меня в деле... мне стало страшно."
2600905-156 = "Вы всегда так добры ко мне, как бы сильно я ни тревожилась и ни боялась. Мне хотелось показать вам себя с лучшей стороны..."
2600905-157 = "И... эта мысль полностью заполнила мою голову. Мне казалось, что я должна справиться лучше обычного. Настолько, что в итоге начала совершать все эти ошибки."
2600905-158 = "[ns] «Не нужно так сильно из-за этого переживать.»"
2600905-160 = "[ns5] «Сегодня я здесь не как Сенсей.»\n[ns6] «Сегодня я здесь как Господин!»"
2600905-163 = ""
2600905-165 = ""
2600905-167 = ""
2600905-169 = "...Да. Вы правы. Я всё слишком усложнила."
2600905-170 = "Когда я в кафе, моя роль — быть горничной, а не студентом."
2600905-171 = "Пытаться быть и тем и другим одновременно... выглядело довольно нелепо, да?"
2600905-172 = "Хорошо! Как вы и сказали. Пока мы здесь, я Королева, а не Ханаока Юзу. Я изо всех сил постараюсь хорошо вам служить!"
2600905-173 = "[s] «Рад это слышать!»"
2600905-174 = "Но что мне делать со всеми посетителями, которые были здесь утром?"
2600905-175 = "Наверное, они ужасно разочарованы всеми моими ошибками..."
2600905-176 = "[s7] «Не переживай так сильно.»\n[s8] «Если кто-нибудь разозлится, я возьму ответственность на себя.»"
2600905-179 = "Ох... Хорошо..."
2600905-186 = "Королева, где ты была? Ты только сейчас вернулась с перерыва?"
2600905-187 = "П-Прости..."
2600905-188 = "Ничего страшного. Главное, что ты вернулась."
2600905-189 = "Но тебе лучше приготовиться. Все утренние посетители вернулись и просто жаждут тебя увидеть."
2600905-190 = "Ч-Что...? О нет! Все вернулись пожаловаться?"
2600905-191 = "Нет-нет! Ничего подобного!"
2600905-192 = "Один из них сказал мне: «Давно я не видел такой старомодной неуклюжей горничной!» Думаю, остальные считают так же. Они в восторге. Как только мы открылись после обеда, все сразу попросили обслуживать их именно тебя."
2600905-193 = "Ладно, Королева. Хватит болтать. Прямо сейчас тебя ждёт дюжина гостей! Иди готовься!"
2600905-194 = "Ч-Что? Я стала популярнее... потому что ошибалась...?"
2600905-195 = "[s] «Похоже, гостям это понравилось, Королева. Здорово!»"
2600905-196 = "Я... я больше не могу!"
2600905-198 = "Юзу весь день работала под давлением и продолжала ошибаться раз за разом. Посетители были очень довольны."
2600905-199 = "Количество заказов на обслуживание Юзу в тот день побило рекорд всего кафе..."
