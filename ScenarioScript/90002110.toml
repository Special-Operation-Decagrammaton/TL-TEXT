90002110-11 = "(Что-то сейчас начнётся...? Но что именно...?)"
90002110-12 = "(Данные пророков, заключённые в этом теле... Нет. Такое чувство, будто сами пророки и их информация...)"
90002110-13 = "(...внезапно ожили и задвигались...!)"
90002110-16 = "НЕТ!!!"
90002110-17 = "...?"
90002110-18 = "Это...? Что со мной происходит...?"
90002110-19 = ""
90002110-20 = ""
90002110-21 = "Старшая сестра! Старшая сестра! СЕСТРА!!!"
