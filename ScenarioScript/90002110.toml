90002110-83 = "Что?! Тогда я сама его начерчу! Я умру за тебя столько раз, сколько потребуется! Лишь бы ты жила, старшая сестра!! Лишь бы ты—"
90002110-84 = "Эйн. Пожалуйста, помни."
90002110-86 = "[log][FF6666]Такого пути не начертано.[-][/log]"
90002110-88 = "[log][FF6666]Ибо вам не была дарована Мистика.[-][/log]"
90002110-90 = ""
90002110-91 = "!!!"
