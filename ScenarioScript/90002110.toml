90002110-25 = "[log][FF6666]Раз сосуд завершён,[-][/log]"
90002110-27 = "[log][FF6666]чаша будет наполнена.[-][/log]"
90002110-30 = "Нам нужно больше времени! Я знаю, мы ничего для тебя не значим, но, пожалуйста, сжалься над нашей сестрой! Она наша единственная старшая сестра!"
90002110-31 = "Она последняя Сефира, завещанная тебе! Если мы правильно пройдём все пути..."
90002110-32 = "Просто... ещё немного времени. Час, десять минут... хотя бы одну минуту!"
90002110-33 = "Мы знаем и понимаем твоё желание! Нас создали, чтобы служить ему, но..."
90002110-34 = ""
90002110-36 = ""
90002110-40 = "[ns] «А? Что это за штука...?»"
90002110-41 = "Похоже, это сооружение для какого-то ритуала... В частности, религиозного. Кажется, это называется алтарём?"
90002110-42 = "Почему здесь вообще что-то такое...? И что важнее, весь Стальной континент..."
90002110-44 = "Это... Если так должно быть..."
90002110-45 = "Понятно. Однако это тело..."
90002110-46 = "Именно поэтому?"
90002110-47 = "...Понятно."
90002110-48 = "Я последняя Сефира, врата для молящихся, основание Древа Жизни."
90002110-49 = "Я творение, которому суждено пройти все пути и превзойти себя, став □□□□."
90002110-50 = "Если это моя предначертанная судьба..."
90002110-51 = ""
90002110-52 = "Нееет!!!"
90002110-53 = "А... А-а-а..."
90002110-54 = "*всхлип* *шмыг*"
90002110-56 = "Эйн, Соф, Ор."
90002110-57 = "Сделайте то, что должны."
