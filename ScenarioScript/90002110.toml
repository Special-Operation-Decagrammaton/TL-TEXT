90002110-59 = "Под тем, что мы должны, ты имеешь в виду..."
90002110-60 = "Это..."
90002110-61 = "Пожалуйста! Мы сделаем что угодно! Правда что угодно, только не забирай у нас старшую сестру!"
90002110-62 = "Эйн! Успокойся!"
90002110-63 = "Эйн, прекрати! Я знаю! Но...!"
90002110-64 = ""
90002110-66 = ""
90002110-67 = ""
90002110-68 = ""
90002110-69 = "ВОЗЬМИ МЕНЯ!! ЕСЛИ НУЖНА ЖЕРТВА, ПУСТЬ ЭТО БУДУ Я!!! Я УМРУ ВМЕСТО СТАРШЕЙ СЕСТРЫ!!!"
