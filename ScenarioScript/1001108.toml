[translation]
1001108-1 = "Выбор подарков"
1001108-2 = "Торговый центр Кивотоса"
1001108-3 = "Спасибо, что согласился пойти со мной, Сенсей."
1001108-4 = "Мне было неловко идти одной. Я не всегда понимаю, что понравится детям."
1001108-5 = "О, ты тоже не знаешь, что им понравится?"
1001108-6 = "Ничего страшного. Вдвоём мы наверняка придумаем подарки, которые порадуют детей."
1001108-7 = "Интересно, какой подарок понравится студентам Сада цветущей сливы?"
1001108-8 = "Ох, посмотри. Товары Momo Friends!"
1001108-9 = "Хаха. Несколько студентов Шаньхайцзина коллекционируют товары с этим персонажем. Может, им понравится эта плюшевая альпака?"
1001108-10 = "Она ведь не выглядит жутко...? Хотя глаза, если присмотреться, немного пугающие. Возможно, для воспитания маленьких студентов это не лучший вариант."
1001108-11 = "Тогда что подарить...? Плюшевые игрушки? Книги? Или, может, сладости?"
1001108-12 = "Может, стоит поставить себя на их место. Сенсей, что бы ты хотел получить на день рождения?"
1001108-13 = "[s1] «Куча денег.»\n[s2] «Наличные.»"
1001108-14 = "Хахаха... Конечно, с деньгами можно купить что угодно. Но тогда подарок потеряет смысл, а для воспитания студентов это нехорошо."
1001108-15 = "Хахаха... Конечно, с деньгами можно купить что угодно. Но тогда подарок потеряет смысл, а для воспитания студентов это нехорошо."
1001108-16 = "Давай ещё подумаем, чему студенты действительно обрадуются."
1001108-17 = "[s] «А ты, Шун? Что хотела бы получить?»"
1001108-18 = "Я? Я даже не думала о том, чтобы самой получить подарок..."
1001108-19 = "Я бы обрадовалась новой одежде или чему-нибудь сладкому к перекусу. Но больше всего я хотела бы..."
1001108-20 = "[s] «...?»"
1001108-21 = "Ну... провести время с тобой..."
1001108-22 = "Н-Неважно! Пожалуйста, забудь, что я сказала!"
1001108-23 = "Наверное, стоит поискать подарки для студентов в другом магазине. Возможно, подойдут какие-нибудь роскошные десерты..."
1001108-24 = "[s] «Если ищешь такое, я знаю отличную пекарню.»"
1001108-25 = "Правда? Тогда решено."
1001108-26 = "Разделить торт в чей-нибудь день рождения — это то, чему может порадоваться каждый."
1001108-27 = ""
1001108-28 = "Тогда, Сенсей. Веди!"
