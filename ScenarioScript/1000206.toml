[translation]
1000206-1 = "Истинный гурман"
1000206-2 = "Окраина D.U."
1000206-3 = "О, Сенсей?"
1000206-4 = "Не ожидала встретить тебя здесь."
1000206-5 = "Снова вышел на прогулку?"
1000206-6 = "Я тоже. Рада, что мы встретились."
1000206-7 = "[s] «Чем ты занималась?»"
1000206-8 = "Искала новые рестораны, которые можно попробовать."
1000206-9 = "Я хотела заглянуть в одно место, которое все нахваливали в соцсетях..."
1000206-10 = "...но оно оказалось совсем не таким, как я ожидала."
1000206-11 = "[s] «Только не говори, что ты взорвала ещё один ресторан.»"
1000206-12 = "Хе-хе. И где же будет веселье, если делать это каждый раз?"
1000206-13 = "Просто... в последнее время я всё глубже задумываюсь о еде..."
1000206-14 = "[s] «Похоже, у тебя многое на уме.»"
1000206-15 = "...Спасибо, что всегда обо мне беспокоишься."
1000206-16 = "Раз уж мы встретились, хочешь прогуляться вместе?"
1000206-17 = "[s] «С удовольствием.»"
1000206-21 = "(Мы с Харуной гуляли и разговаривали о еде.)"
1000206-22 = "По дороге мне на глаза попалась лавка с тайяки."
1000206-23 = "[s] «Хочешь тайяки?»"
1000206-24 = "...О, тайяки."
1000206-25 = "Хех. С удовольствием, Сенсей!"
1000206-27 = "Спасибо!"
1000206-29 = "...Хе-хе."
1000206-32 = "― Хех. Мне нравится идти домой вместе с тобой.[wa:1240]"
1000206-34 = "― И теперь у нас ещё целая куча тайяки."
1000206-37 = "― Не кажется ли мне это слишком простым?[wa:2160]"
1000206-40 = "― Нет... Для меня этот момент — вершина роскоши.[wa:1860]"
1000206-43 = "― Вот, Сенсей. Это тебе.[wa:1440]"
1000206-45 = "― Нет. Открой рот. Скажи «а-а-ам».[wa:1120]"
1000206-48 = "[ns] «А-а-ам.»"
1000206-49 = "― Есть любимую еду с любимым человеком.[wa:1820]"
1000206-52 = "― Это..."
1000206-55 = "[ns] «Мне уже становится немного неловко...»"
1000206-56 = "― Хм? Почему ты так на меня смотришь?[wa:1380]"
1000206-59 = "― Хех... Но меня это совсем не беспокоит.[wa:1920]"
1000206-62 = "― Мне не холодно?[wa:1260]"
1000206-65 = "― Нет. На самом деле мне тепло.[wa:2320]"
1000206-68 = "(Мы с Харуной весело шли домой, делясь тайяки.)"
