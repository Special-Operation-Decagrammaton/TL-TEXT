[translation]
1004906-1 = "Кошачий язык"
1004906-3 = "Сенсей, вы здесь?"
1004906-4 = "Я вхожу. Спасибо, что приняли."
1004906-5 = ""
1004906-8 = "О, хорошо. Я как раз застала вас на перерыве."
1004906-9 = "Что значит «что тебе нужно»?"
1004906-10 = "Так звучит, будто я разговариваю с вами только когда мне что-то нужно! Не выставляйте меня в плохом свете!"
1004906-11 = "То есть ладно. Я действительно хочу кое-что спросить, но..."
1004906-12 = "Но в этот раз это не просьба! Вам понравится."
1004906-13 = "Так вот, я пришла из-за этого."
1004906-14 = ""
1004906-17 = ""
1004906-18 = "[ns1] «Это... шоколадный торт? По какому поводу?»\n[ns2] «Обычно торт мне достаётся только на день рождения.»"
1004906-19 = "Эм, если точнее, это называется фондан о шокола..."
1004906-20 = "Эм, если точнее, это называется фондан о шокола..."
1004906-21 = "Ну, вы просто случайно пришли мне в голову, и... хаха..."
1004906-22 = "Я доплатила за хороший в пекарне... чтобы... Ну, понимаете..."
1004906-23 = "И потом пришла сюда... Эм..."
1004906-24 = "............"
1004906-25 = "*вздох* Забудьте. Я много кто, но не лгунья."
1004906-26 = "Простите. Справедливости ради, я и правда принесла его вам. Просто покупала не с мыслью о вас."
1004906-27 = "Вот, подойдите. Положите руку прямо над ним, Сенсей."
1004906-28 = ""
1004906-31 = "[ns3] «Горячо. Я чувствую тепло даже отсюда.»\n[ns4] «Раз он всё ещё такой горячий, значит совсем свежий.»"
1004906-32 = "Д-Да. Видите ли, внутри фондана о шокола горячий шоколад."
1004906-33 = "Д-Да. Видите ли, внутри фондана о шокола горячий шоколад."
1004906-34 = "Я не обратила внимания, когда покупала. Думала, это просто обычный шоколадный торт."
1004906-35 = "Нет, честно, я не привередничаю."
1004906-36 = "Просто, эм..."
1004906-37 = "У меня чувствительный язык... Я не могу есть горячее."
1004906-38 = "А шоколад внутри для меня слишком горячий."
1004906-39 = "Но такой десерт полагается есть горячим."
1004906-40 = "Поэтому я принесла его сюда, чтобы вместо меня съели вы."
1004906-41 = "А..."
1004906-42 = "В-Вы правда думаете, я притащила его сюда просто чтобы избавиться?!"
1004906-43 = "В-Вы ужасны! Я бы не стала просто спихивать на вас свой мусор!"
1004906-44 = "Это десерт очень высокого качества! Он вкусный! Я просто НЕ МОГУ его съесть!!!"
1004906-45 = "[s5] «Значит, у тебя кошачий язык.»\n[s6] «Хм, ты и правда немного похожа на кошку.»"
1004906-46 = "Что?!"
1004906-47 = "Что?!"
1004906-48 = "Ч-Что? Кошачий язык...?"
1004906-49 = "Ну, технически это правда..."
1004906-50 = ""
1004906-52 = ""
1004906-53 = "Подождите-ка, Сенсей."
1004906-54 = "Только не пытайтесь сейчас заработать себе очки. Я вообще-то не люблю кошек."
1004906-55 = "Не пытаетесь? Ну, раз вы так говорите..."
1004906-56 = ""
1004906-58 = ""
1004906-59 = "Всё равно мне кажется..."
1004906-60 = "Вы опять надо мной издевались, да?!"
1004906-61 = "Ч-Что? Вы его съедите? Да, конечно. Пожалуйста."
1004906-62 = "Только не ешьте его с мыслью, что «избавляетесь»! Вы должны насладиться!"
1004906-63 = "Я слежу за вами, Сенсей..."
1004906-65 = "Под подозрительным взглядом Казусы я «избавился» от тёплого фондана о шокола."
1004906-66 = "Как и сказала Казуса, он был вкусным и совсем не мусором."
