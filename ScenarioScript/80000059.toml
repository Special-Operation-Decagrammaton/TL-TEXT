80000059-32 = "Смотри, весь лимитированный шоколад раскупили первым! А я всю ночь простояла в очереди!"
80000059-33 = "Даже онлайн заказать было невозможно! В ту секунду, когда страница загрузилась, очередь уже была на три тысячи человек!"
