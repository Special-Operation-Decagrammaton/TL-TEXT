[translation]
10038010-1 = "Эпизод 1;Досадная случайность"
10038010-4 = ""
10038010-5 = "Ты закончила проверять договор с торговцами? А сценическое оборудование?"
10038010-6 = "Дай мне делать хотя бы по одному делу за раз... У меня уже голова вот-вот взорвётся."
10038010-7 = "Да, у меня тоже, но нужно продолжать, верно? Фестиваль совсем скоро, а рук у всех не хватает..."
10038010-8 = "Было проще, когда я отвечала только за готовку..."
10038010-9 = "Эх, это всего раз в год. Справимся."
10038010-10 = "Каждый год тяжело. Подготовка фестиваля — это просто куча работы."
10038010-11 = "Я слышала, есть академия, где фестивали проходят круглый год. Хякк...ияко?"
10038010-12 = ""
10038010-14 = ""
10038010-15 = "Серьёзно? Как там студенты вообще выживают?"
10038010-16 = ""
10038010-18 = ""
10038010-20 = "Всё идёт хорошо? Вы обе выглядите немного перегруженными."
10038010-21 = ""
10038010-24 = ""
10038010-25 = "П-Президент?! Нет, у нас всё нормально. Это пустяки!"
10038010-26 = "Правда? Это наше главное событие. Мы должны быть готовы!"
10038010-28 = "Конечно. Что ж, держитесь, а когда всё закончится, все как следует отдохнём."
10038010-29 = ""
10038010-32 = ""
10038010-33 = ""
10038010-36 = ""
10038010-37 = "Я знаю, этот фестиваль приносит нам хорошую выручку, но..."
10038010-38 = "...вешать на нас половину обязанностей по охране — немного мелочно."
10038010-39 = "Верно, зато теперь Генрюмон ворчит на нас вдвое меньше. Есть плюсы и минусы."
10038010-40 = "Минус в том, что потом разбираться со всеми последствиями полностью мне."
10038010-41 = "Я абсолютно в тебя верю, Рэйдзё."
10038010-42 = "Наверное, меня всё устраивает, пока эти начальницы Генрюмона не начинают устраивать из всего драму. После той встречи по обмену с Красной Зимой..."
10038010-43 = "Да, знаю. Пока отложим это."
10038010-44 = "Ты случайно не знаешь, что именно произошло в Зале Представлений Пекинской Оперы?"
10038010-45 = ""
10038010-47 = ""
10038010-48 = "Генрюмон говорит только, что произошёл небольшой инцидент. Больше я от них ничего не добилась."
10038010-49 = "По слухам, Клуб Пекинской Оперы сейчас полностью отстранён от деятельности..."
10038010-50 = "Признаюсь, мне тоже любопытно, но..."
10038010-51 = ""
10038010-53 = ""
10038010-54 = "...ладно, хватит об этом. Пока сосредоточимся на подготовке фестиваля."
10038010-55 = ""
10038010-57 = ""
10038010-58 = "......"
10038010-59 = "Поняла, госпожа Президент."
10038010-60 = "(Если Генрюмон хочет хранить свои секреты, они останутся секретами, как ни крути...)"
10038010-61 = ""
10038010-66 = "А-А-А!"
10038010-67 = ""
10038010-69 = ""
10038010-71 = "Что случилось? На тебя горячий жир попал или что-то такое?"
10038010-72 = ""
10038010-74 = ""
10038010-78 = ""
10038010-79 = ""
10038010-80 = "...Ох ты ж."
10038010-81 = "Что вообще происходит? Я никогда ничего подобного не видела..."
10038010-82 = ""
10038010-84 = ""
10038010-86 = "Т-Ты... Что ты...?"
10038010-87 = ""
10038010-89 = ""
10038010-91 = "Я-Я не знаю! Внезапно моё тело..."
10038010-92 = "Секунду назад всё было нормально. Ты... съела что-нибудь странное?"
10038010-93 = "Нет! Я весь день проверяла фестивальную площадку, так что на обед просто быстро съела жареный рис!"
10038010-94 = ""
10038010-97 = "Подожди... Посмотри на себя... Ты..."
10038010-98 = ""
10038010-100 = ""
10038010-103 = "Я-Я тоже?!"
10038010-104 = "Что происходит?!"
10038010-105 = ""
10038010-107 = ""
10038010-108 = "Госпожа Президент, что нам делать?!"
10038010-109 = "Для начала свяжемся с Генрюмоном. И с Обществом Восточной Алхимии тоже!"
10038010-110 = "С Генрюмоном...?!"
10038010-111 = "В таких обстоятельствах — да, придётся. И..."
10038010-112 = ""
10038010-116 = ""
10038010-117 = ""
10038010-119 = ""
10038010-120 = "А...?"
10038010-121 = "Эм... Ну..."
10038010-122 = "Что вообще происходит?!"
10038010-124 = "Ч-что?!"
10038010-125 = "Повтори. Ты уверена?"
10038010-127 = "Д-Да! Прямо сейчас происходит неизвестное «обратное старение»..."
10038010-128 = ""
10038010-130 = ""
10038010-131 = "...с эпицентром вокруг Променада Чёрной Черепахи!"
10038010-132 = "Президент Променада Чёрной Черепахи Акэширо Руми помещена в карантин. Вот результаты нашего расследования на данный момент!"
10038010-135 = ""
10038010-136 = "Хм-м... Это вроде комната изоляции, но ощущается скорее как комната допросов. Кажется, мне тут не место."
10038010-137 = "Прошу понять, Президент Руми."
10038010-138 = "У вас есть какие-нибудь версии, что может вызывать этот... «феномен обратного старения»?"
10038010-139 = "Без понятия..."
10038010-140 = "Я не помню, чтобы ела или пила что-нибудь странное, и никуда необычную не ходила."
10038010-141 = "Я даже не работала в последнее время с какими-либо подозрительными ингредиентами."
10038010-142 = "Мы готовимся к Фестивалю Лунного Света, а еда должна пройти сертификацию, прежде чем её разрешат продавать."
10038010-143 = "Значит, ничего необычного... кроме того, что члены Променада Чёрной Черепахи внезапно превратились в детей?"
10038010-144 = "Это всё, что я знаю. Сначала детьми стали остальные, потом я."
10038010-147 = ""
10038010-148 = "Нельзя верить всему, что говорят эти люди из Чёрной Черепахи. Ради бизнеса они скажут что угодно!"
10038010-149 = "Они наверняка что-то скрывают."
10038010-150 = ""
10038010-153 = ""
10038010-154 = "Я так не думаю. Если бы за этим стоял Променад Чёрной Черепахи, их президент Руми прежде всего нашла бы способ обезопасить себя."
10038010-155 = "Заговор, в котором больше всех теряет его организатор? До такой степени отчаянные планы встречаются редко."
10038010-156 = ""
10038010-158 = ""
10038010-159 = "Э-Это... Хм, понятно... Поняла, госпожа Президент."
10038010-161 = "Теперь продолжайте."
10038010-162 = ""
10038010-165 = ""
10038010-166 = "Да! Судя по тому, что удалось увидеть, феномен распространяется волнами, почти как инфекция."
10038010-167 = "Следователи на месте называют это «Синдромом Малыша»."
10038010-168 = "Похоже, этот Синдром Малыша начал распространяться от Променада Чёрной Черепахи на остальной Шаньхайцзин."
10038010-169 = "Понятно. Мы уже знаем, как он распространяется?"
10038010-170 = "П-Пока нет... Мы знаем лишь, где всё началось, судя по тому, кто преобразился первым."
10038010-171 = "Пока ни у кого не наблюдалось никаких симптомов, кроме «обратного старения». Кроме того, студенты Отдела дисциплинарной поддержки — Сада Сливового Цвета — не пострадали."
10038010-172 = "Хорошо. Полезная информация. Тогда..."
10038010-173 = ""
10038010-175 = ""
10038010-177 = "Немедленно раздайте защитное снаряжение членам Генрюмона на месте."
10038010-178 = "Одновременно как можно быстрее проведите эпидемиологическое исследование."
10038010-179 = "Ограничьте доступ на улицу Променада Чёрной Черепахи, пока не получим результаты исследования."
10038010-181 = "Это официальные приказы Рюгэ Кисаки, президента Генрюмона."
10038010-182 = ""
10038010-185 = ""
10038010-186 = "Да, как прикажете!"
10038010-187 = ""
10038010-189 = ""
10038010-191 = "Мина, похоже, мне снова нужна твоя сила."
10038010-192 = "Не могла бы ты отправиться на место и помочь?"
10038010-193 = "Оп!"
10038010-194 = "Не волнуйтесь, госпожа Президент! Я вас не подведу!"
10038010-195 = ""
10038010-197 = ""
10038010-199 = "Фух..."
10038010-200 = "[s] «Тебе правда нужно было отправлять Мину?»"
10038010-201 = "С практической точки зрения — не особенно. Но она ещё и символ. Она олицетворяет силу Генрюмона."
10038010-202 = "Её присутствие передаст всем определённое сообщение."
10038010-203 = "Какое сообщение, спрашиваете? Ничего пафосного..."
10038010-204 = "Просто то, что что бы ни случилось в Шаньхайцзине, президент Генрюмона всегда готова помочь."
10038010-205 = "[s1] «Сам факт, что тебе приходится передавать такое сообщение...»\n[s2] «...сам по себе звучит как проблема.»"
10038010-208 = "...Вот как вы это воспринимаете?"
10038010-209 = "Фуфу. Спасибо за откровенность, Сенсей. Раньше мне... возможно, не пришлось бы прилагать таких усилий, но..."
10038010-210 = "...мы больше не живём в прошлом. Потребности изменились."
10038010-211 = "[s] «Может, мне тоже пойти помочь на месте?»"
10038010-212 = "Вы? Хм... Нет, думаю, я не могу это рекомендовать."
10038010-213 = "Почему, спрашиваете?"
10038010-214 = ""
10038010-216 = ""
10038010-217 = "Что ж, это лишь моё предположение, но с учётом конкретных обстоятельств вас там могут встретить не слишком радушно."
10038010-220 = "Ну и сумасшествие сейчас творится."
10038010-221 = "Да, улица Променада Чёрной Черепахи закрыта."
10038010-222 = "Говорят, чтобы просто войти, нужен пропуск Генрюмона, а даже с ним большинство магазинов закрыто."
10038010-223 = "Жаль. Мне так нравится их мапо-тофу..."
10038010-224 = "Но... с нами всё будет в порядке?"
10038010-225 = "Что ты имеешь в виду?"
10038010-226 = "Ну... этот Синдром Малыша..."
10038010-227 = "......"
10038010-228 = "То есть Генрюмон говорит, что он ТОЛЬКО превращает людей в детей и больше ничего, но..."
10038010-229 = "Даже это сильно усложнит жизнь."
10038010-230 = "Это правда..."
10038010-232 = "Говорят, всё началось именно на улице Променада Чёрной Черепахи."
10038010-233 = "Думаешь, его занесли чужаки? В последнее время это был бы не первый инцидент."
10038010-234 = ""
10038010-236 = "Через Променад Чёрной Черепахи постоянно ходит множество студентов извне, так что там вполне могло что-то произойти..."
10038010-237 = "Фестиваль Лунного Света вообще будет в порядке? Если пустить ещё больше чужаков, проблем может стать больше."
10038010-240 = "К тому же в Риккагаку находится Сенсей из Шале. Тоже чужак."
10038010-241 = "Ну, уверена, госпожа что-нибудь придумает. Я слышала, Исполнительный Офицер Мина уже на месте."
10038010-242 = "От этого мне и правда спокойнее..."
10038010-243 = "И только потому, что всё случилось на Променаде Чёрной Черепахи, мы не знаем, они ли это вызвали. Расследование ещё идёт."
10038010-244 = ""
10038010-246 = ""
10038010-247 = "Но если это не Променад Чёрной Черепахи, тогда это должно быть..."
10038010-248 = ""
10038010-250 = ""
10038010-255 = ""
10038010-256 = "П-Подождите! Это нечестно! Общество Восточной Алхимии тут вообще ни при чём!"
10038010-257 = "Это всего лишь опрос свидетеля, так что, пожалуйста, пройдите с нами, Президент Сая."
10038010-258 = "Поскольку вы и Общество Восточной Алхимии под подозрением, у нас нет выбора. Просим понять."
10038010-259 = "...Среди студентов Шаньхайцзина сложилось мнение: если виноват не Променад Чёрной Черепахи, значит, виновато Общество Восточной Алхимии."
10038010-260 = ""
10038010-263 = ""
10038010-264 = "Да говорю же, это неправда! Общество Восточной Алхимии..."
10038010-265 = ""
10038010-267 = ""
10038010-270 = "(П-Подождите... Я ведь дала Инструктору Шун информацию об «Эликсире Омоложения». Неужели это как-то утекло...?!)"
10038010-271 = ""
10038010-273 = "Эм... просто предположение, но... это связано с кремом для кожи, который создало Общество Восточной Алхимии...?"
10038010-274 = "Общество Восточной Алхимии сделало крем для кожи? Впервые слышу."
10038010-275 = "К делу не относится, но звучит интересно. Может, позже дадите нам образец."
10038010-276 = ""
10038010-278 = ""
10038010-279 = "Может, тогда позволите мне пропустить опрос свидетеля."
10038010-280 = "Я сказала: «к делу не относится»."
10038010-281 = "Я так и думала, но всё же..."
10038010-282 = "Угх... Полагаю, когда что-то происходит на патологическом или фармацевтическом уровне, естественно подозревать Общество Восточной Алхимии..."
10038010-283 = "В этом есть смысл, но..."
10038010-284 = "Всё равно нечестно! На этот раз я правда ничего не делала!"
10038010-286 = "«На этот раз»...?"
10038010-287 = ""
10038010-290 = ""
10038010-291 = "...Я оговорилась!"
10038010-292 = "Как я уже сказала, это всего лишь опрос свидетеля."
10038010-293 = "Пока что, но он может превратиться в допрос!"
10038010-294 = "Хм... Я не могу полностью отрицать такую возможность."
10038010-295 = "Всё решит Генрюмон."
10038010-299 = ""
10038010-300 = "У меня промежуточный доклад, госпожа Президент."
10038010-301 = "Президент Общества Восточной Алхимии Сая сотрудничает с расследованием, но полезных показаний мы пока не получили."
10038010-302 = "Что значит «пока»?"
10038010-303 = "...Ну, участвуя в опросе, у меня возникло ощущение, что..."
10038010-304 = ""
10038010-306 = ""
10038010-307 = ""
10038010-308 = "...Президент Сая что-то скрывает."
10038010-309 = "Она не выглядела полностью удивлённой, когда мы упомянули «феномен обратного старения» в Шаньхайцзине..."
10038010-310 = "...Хм, и она не отрицала, что знает о нём? Интересно. Несмотря на внешность, Сая не слишком умелая лгунья..."
10038010-311 = ""
10038010-313 = ""
10038010-314 = "Хм? Что такое, Сенсей? У вас есть догадка?"
10038010-315 = "[s] «Н-Нет, совсем ничего.»"
10038010-316 = "Хм...? Ну, если вы так говорите, Сенсей. Я вам поверю."
10038010-317 = "И если вы ВСЁ-ТАКИ что-то скрываете, уверена, у вас на то есть веская причина."
10038010-318 = "Хорошо, продолжайте доклад."
10038010-319 = "Да! ...Кроме всего прочего, среди студентов Шаньхайцзина распространяется тревожный слух."
10038010-320 = "Ну, в такой момент вряд ли можно ожидать распространения УСПОКАИВАЮЩИХ слухов, но..."
10038010-321 = "Полагаю, есть причина, по которой это попало в доклад?"
10038010-322 = ""
10038010-324 = ""
10038010-325 = "Д-Да. Слух такой..."
10038010-326 = ""
10038010-328 = ""
10038010-329 = ""
10038010-330 = ""
10038010-336 = "Эй, ты слышала слух?"
10038010-337 = "Сейчас столько слухов ходит... Какой именно?"
10038010-338 = "Тот, что... президент Общества Восточной Алхимии вернулась."
10038010-339 = "А? Ты про Якуши Саю? Она вернулась из поездки или что?"
10038010-340 = "Нет, не её. Я про ту, что была до Саи..."
10038010-341 = "До неё была кто-то ещё...?"
10038010-342 = "Я только краем уха слышала, но кажется, её называли... «Обезьяной Чувств». Она была одной из Семерых Заключённых."
10038010-343 = ""
10038010-345 = ""
10038010-346 = "А? В нашей школе была одна из Семерых Заключённых?"
10038010-347 = "Так говорят. Изначально она была президентом Общества Восточной Алхимии, но потом её исключили."
10038010-348 = "Никогда об этом не слышала. Так как её звали?"
10038010-349 = "По тому, что я слышала, Шинтани Кай."
10038010-350 = "...Я серьёзно никогда о ней не слышала..."
10038010-351 = "Говорят, некоторые третьекурсницы её помнят."
10038010-354 = ""
10038010-355 = "...Вот как?"
10038010-356 = "...Да. Люди говорят. Пока немногие, но говорят..."
10038010-357 = "......"
10038010-358 = "Исключённому студенту было бы трудно вернуться без какой-либо официальной процедуры."
10038010-359 = "Тем более Шинтани Кай..."
10038010-360 = "Но для студентов, которые помнят её имя... что ж, это станет серьёзной проблемой. Если слух ложный, его придётся подавить."
10038010-361 = ""
10038010-363 = ""
10038010-364 = "Поняла, госпожа Президент!"
10038010-365 = ""
10038010-367 = ""
10038010-368 = "Фух..."
10038010-369 = "[s] «Есть кое-что, чего я не понимаю.»"
10038010-370 = "Hmm? What is it, Sensei?"
10038010-371 = "О, это насчёт Шинтани Кай...?"
10038010-372 = "......"
10038010-373 = "Что если я скажу... что ничего не могу вам о ней рассказать?"
10038010-374 = "О, вы же «уверены, что если я что-то скрываю, у меня есть веская причина»?"
10038010-375 = ""
10038010-377 = ""
10038010-378 = "Фуфу. Полагаю, вы заслужили право обратить мои слова против меня."
10038010-379 = ""
10038010-381 = ""
10038010-382 = "...Дайте мне немного времени, Сенсей. Совсем немного."
10038010-383 = "Не потому, что я вам не доверяю. Это моя собственная проблема..."
10038010-384 = "...и проблема, связанная с прошлым Шаньхайцзина."
