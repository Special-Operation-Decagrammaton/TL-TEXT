[translation]
1004003-1 = "Быть высокой не так уж плохо"
1004003-2 = "Я прибыл к условленному месту встречи точно вовремя."
1004003-3 = "Людей оказалось больше, чем я ожидал. Осмотревшись, я нашёл Цукуё в толпе."
1004003-4 = "Интуиция, отточенная за двадцать семь лет и четыре месяца поиска моделей, говорит мне, что ты можешь стать звездой!"
1004003-5 = "Ты станешь самой высокой топ-моделью Кивотоса!"
1004003-7 = "Нет! Я-я хочу стать ниндзя, а не моделью!"
1004003-8 = "Ниндзя? Ха-ха! Интересно."
1004003-9 = "Наверное, можно обыграть и это!"
1004003-10 = "Н-Нет... Я... я имела в виду настоящего ниндзя..."
1004003-11 = "*ахает* С-Сенсей?!"
1004003-12 = "П-Помогите!"
