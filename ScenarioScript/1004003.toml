1004003-73 = "Г-Где моя сестра? *плачет*"
1004003-74 = "Сенсей! Я вижу плачущего ребёнка! Наверное, у неё проблема!"
1004003-75 = "[s] «Ей нужен такой ниндзя, как ты. Давай поможем.»"
1004003-76 = "О... Да!"
1004003-82 = "Мы с Цукуё подошли помочь плачущей девочке, потерявшей сестру."
1004003-84 = "С-Спасибо, что нашли мою сестру! Как мне вас отблагодарить?"
1004003-85 = "Н-Не стоит! Для настоящего ниндзя вроде меня это пустяк!"
1004003-86 = "А...? Н-Ниндзя...?"
1004003-87 = "Спасибо, высокая тётя!"
1004003-88 = "Эй! Не груби!"
1004003-89 = "Нет! Всё нормально! Именно благодаря росту я смогла её найти!"
1004003-90 = "Б-Берегите себя! И не отпускай руку сестры, хорошо?"
1004003-91 = "Хорошо!"
1004003-92 = ""
1004003-96 = "[ns] «Это было потрясающе, Цукуё!»"
1004003-97 = "Вы были правы, Сенсей."
1004003-98 = "Я всегда считала свой рост... огромной проблемой... Из-за него я попадаю в странные ситуации..."
1004003-99 = "Я горблюсь и смотрю в землю, чтобы не ловить взгляды людей. Мне казалось, лучше сделать себя меньше..."
