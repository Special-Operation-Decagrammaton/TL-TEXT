1004003-14 = ""
1004003-16 = ""
1004003-18 = "О."
1004003-27 = "А? П-Подождите...! Я не плохой человек! Я правда вижу в вас огромный потенциал!"
1004003-28 = "Вы будущая суперзвезда! Пожалуйста, дайте мне шанс!"
1004003-30 = "[ns1] «Фух, здесь мы должны быть в безопасности.»\n[ns2] «Ты в порядке, Цукуё? Нигде не поранилась?»"
1004003-31 = "Я-я в порядке... но..."
1004003-32 = "Я-я в порядке... но..."
1004003-33 = "Уаааа! *плачет*"
1004003-34 = "Мне было так страшно, Сенсей!"
1004003-35 = "*шмыгает носом* Я знаю, что из-за роста сильно выделяюсь... но хочу, чтобы меня оставили в покое...!"
1004003-36 = "И из-за моих проблем пришлось вмешиваться вам...! П-Простите...! *рыдает*"
1004003-37 = "[s] «Это совсем не было обузой.»"
1004003-38 = "*икает* П-Правда?"
1004003-39 = "Я рада это слышать... но... со мной такое постоянно..."
1004003-40 = "Я такая высокая... поэтому заметная..."
1004003-41 = "П-Поэтому ко мне подходит много странных людей... и я попадаю в нелепые ситуации..."
1004003-42 = "На прошлой неделе, когда я шла по улице, встретила бандита в шлеме..."
1004003-43 = "«Ты такая высокая. В этом шлеме смотрелась бы отлично. Не хочешь к нам?»"
1004003-44 = "Я-я так удивилась, когда они ко мне подошли... что убежала..."
1004003-45 = "Я не знаю, что делать, когда люди так себя ведут."
1004003-46 = "[s3] «Так Бандиты в шлемах вербуют людей?»\n[s4] «Я бы тоже не знал, как на такое реагировать...»"
1004003-47 = "Правда...? Я просто запаниковала..."
1004003-48 = "Правда...? Я просто запаниковала..."
1004003-49 = "И это не единственная проблема из-за моего роста!"
1004003-50 = "Само моё существование — неудобство..."
1004003-51 = "Стоя рядом, я загораживаю вам обзор."
1004003-52 = "Из-за меня вам может не повезти... или пропасть аппетит... Всё из-за меня."
1004003-53 = "Простите, что я такая высокая..."
1004003-54 = "[s5] «(У неё неожиданно низкая самооценка...)»\n[s6] «Всё нормально! С тобой всё в порядке!»"
1004003-55 = "Никаких преимуществ в таком росте нет..."
1004003-56 = "Никаких преимуществ в таком росте нет..."
1004003-57 = "[s] «Цукуё, тебе стоит посмотреть на это иначе.»"
1004003-58 = "Что ты имеешь в виду?"
1004003-59 = "[s7] «Ты достаточно высокая, чтобы видеть поверх толпы. »\n[s8] «Ты можешь замечать то, чего не видят другие!»"
1004003-60 = "Мой рост... может быть полезным?"
1004003-61 = "Мой рост... может быть полезным?"
1004003-62 = "С-С-Сенсей?!"
1004003-63 = ""
1004003-65 = ""
1004003-67 = ""
1004003-68 = "П-Простите, Сенсей?! В-Вы так близко ко мне...!"
