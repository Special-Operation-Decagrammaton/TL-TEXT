[translation]
1600503-1 = "Летние игры у океана"
1600503-2 = "В-Вот ты где, Сенсей. Я ждала тебя, как ты и просил."
1600503-3 = "Насчёт того, о чём ты говорил раньше..."
1600503-4 = "[s1] «Я здесь, чтобы решить твою проблему, Цуруги.»\n[s2] «Тебе ведь не очень весело, да?»"
1600503-5 = "О, эм... Я бы соврала, если бы сказала, что меня это не беспокоит, но..."
1600503-6 = "О, эм... Я бы соврала, если бы сказала, что меня это не беспокоит, но..."
1600503-7 = "А?"
1600503-8 = "Ты принёс всё это, Сенсей?"
1600503-9 = "[s3] «Это всё вещи для игр на пляже.»\n[s4] «Пляжный волейбольный мяч, круг, зонт, фрисби...»"
1600503-10 = "Т-Тебе не стоило так стараться."
1600503-11 = "Т-Тебе не стоило так стараться."
1600503-12 = "Ты всё это сделал... ради меня?"
1600503-13 = "Показалось, что я тут всё время слоняюсь одна?"
1600503-14 = "Ну, да. Эм..."
1600503-15 = "Точно."
1600503-16 = "Ты прав — так и было. Не могу поверить, что ты так старался ради меня. Я даже не знаю, что сказать..."
1600503-17 = "А?"
1600503-18 = "Ты просто хочешь, чтобы мне было весело?"
1600503-19 = "Хм. Ну ладно."
1600503-20 = "Не уверена, умею ли я вообще веселиться, но я постараюсь!"
1600503-21 = "Я постараюсь повеселиться как можно лучше!"
1600503-22 = "..."
1600503-23 = "Оказалось, Цуруги ещё нужно тренироваться веселиться."
1600503-25 = "Тем не менее я раскрыл зонт, надул круг и пляжный волейбольный мяч. Всё складывалось отлично."
1600503-26 = "Кроме одной проблемы..."
1600503-28 = "Эм, я готова, Сенсей! Можешь подавать."
1600503-29 = "[s5] «Лови! Попробуй отбить!»\n[s6] Подать пляжный волейбольный мяч в сторону Цуруги."
1600503-30 = "*туп*"
1600503-31 = "*туп*"
1600503-32 = "..."
1600503-33 = "Крррраааагххх!"
1600503-34 = "[s] «...?»"
1600503-35 = "*бум*"
1600503-37 = ""
1600503-38 = ""
1600503-39 = "*хuff* *пых* Ах..."
1600503-40 = "Ну как, Сенсей? Я всё делаю правильно?"
1600503-41 = "Эм... Сенсей?"
1600503-42 = "..."
1600503-43 = "В-Вы в порядке?!"
1600503-44 = "[s7] «Было близко, но я в порядке.»\n[s8] «От того удара в земле осталась дыра...»"
1600503-45 = "П-Пожалуйста, прости меня. Мне так жаль..."
1600503-46 = "П-Пожалуйста, прости меня. Мне так жаль..."
1600503-47 = "Что? Ты правда хочешь, чтобы я попробовала ещё раз?"
1600503-48 = "Эм, хорошо. Будь что будет...!"
1600503-49 = "*туп*"
1600503-50 = "Крррраааагххх!"
1600503-52 = "*бум*"
1600503-53 = "..."
1600503-54 = "После этого мы оба решили, что с нас хватит."
1600503-56 = "М-Мне так жаль..."
1600503-57 = "Всё никогда не идёт так, как я представляю у себя в голове."
1600503-58 = "Не могу отделаться от ощущения, что просто трачу твоё время, Сенсей. Мне ужасно неловко из-за всего этого..."
1600503-59 = "[s] Протянуть фрисби вместо волейбольного мяча."
1600503-60 = ""
1600503-62 = "А? Что это, Сенсей?"
1600503-63 = "О, так вот что такое фрисби..."
1600503-64 = "И-И что мне с ним делать?"
1600503-65 = "О. Мне просто нужно побежать и принести его обратно? Это не должно быть слишком сложно."
1600503-66 = "Хорошо. Думаю, с этим я справлюсь, Сенсей."
1600503-67 = "М-Мне немного неловко, но я готова, когда скажешь!"
1600503-68 = "[s] Запустить фрисби вдаль."
1600503-69 = ""
1600503-71 = "..."
1600503-72 = "Крррраааагххх!"
1600503-73 = ""
1600503-74 = ""
1600503-75 = ""
1600503-76 = "Получилось, Сенсей! Я принесла его обратно!"
1600503-77 = "Ты уверен, что в эту игру надо играть именно так?"
1600503-78 = "[s9] «Ты поймала его прямо в воздухе!»\n[s10] «Цуруги, это было потрясающе...»"
1600503-79 = "Т-Ты говоришь, что это было впечатляюще? Тогда мне немного легче..."
1600503-80 = "Т-Ты говоришь, что это было впечатляюще? Тогда мне немного легче..."
1600503-81 = "Эм, кажется, получается! В эту игру я могу играть без проблем!"
1600503-82 = ""
1600503-83 = ""
1600503-84 = "Так что, если ты не против, давай продолжим..."
1600503-85 = "[ns] Взять фрисби у Цуруги."
1600503-86 = ""
1600503-89 = "Некоторое время я продолжал играть с Цуруги во фрисби."
1600503-90 = "Казалось, что вдвоём в эту игру обычно играют не так, но я постарался не обращать на это внимания."
1600503-91 = "*хuff* *пых* Ах..."
1600503-92 = "[s] «Ты в порядке? Хочешь передохнуть?»"
1600503-93 = "Кеке... Кекеке..."
1600503-96 = "― Кеке... Хи-хи-хи.[wa:1450]"
1600503-99 = "― Ой. Прости.[wa:1130]"
1600503-101 = "― Большое спасибо, Сенсей.[wa:1630]"
1600503-104 = "― Я впервые играю у океана... Это весело, но на это[wa:4450]"
1600503-107 = "― уходит гораздо больше сил, чем я думала.[wa:1930]"
1600503-110 = "― Ух. Я уже немного устала...[wa:4390]"
1600503-113 = "― Кстати, Сенсей. Мне только что пришло в голову...[wa:2270]"
1600503-115 = "― Этот купальник... Он немного меня беспокоит.[wa:3600]"
1600503-118 = "― Может, я взяла размер слишком маленький.[wa:2460]"
1600503-121 = "― О. Эм... Что-то не так?[wa:2250]"
1600503-123 = "― Я-Я что-то сделала не так?![wa:3260]"
