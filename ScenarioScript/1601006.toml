[translation]
1601006-1 = "Сладких снов (из помпонов)"
1601006-2 = "Отличная работа сегодня, Сенсей."
1601006-3 = "Учитывая прошлые отзывы, я сделала новое устройство поддержки, которое не взрывается намеренно."
1601006-4 = "Твоё мнение сильно повлияло на конструкцию, поэтому я хочу, чтобы именно ты испытал его первым."
1601006-5 = "[s] «Вижу, сегодня ты снова в форме болельщицы...»"
1601006-6 = "Ну да... А что ещё мне носить во время работы, связанной с поддержкой?"
1601006-7 = "То есть, если я не надену эту форму, что будет мотивировать меня создавать устройства поддержки? Лабораторный халат? Глупости."
1601006-8 = "...Может, теперь я и правда слишком часто ношу её по привычке..."
1601006-9 = "...Сейчас это неважно."
1601006-10 = "Гарантирую, это устройство поддержки тебе понравится."
1601006-11 = "Я усвоила урок прошлого раза. Видишь ли, конструкция этого устройства основана на естественном желании, которое нужно и которого жаждет каждый современный человек."
1601006-12 = "И из этого желания... я дарю тебе вот это."
1601006-13 = ""
1601006-15 = ""
1601006-16 = "[ns1] «Хибики, это помпоны.»\n[ns2] «Разве ты не собиралась отказаться от движения в поддержке?»"
1601006-17 = "Да, это помпоны. Но знаешь, чем они не являются? Обычными помпонами."
1601006-18 = "Да, это помпоны. Но знаешь, чем они не являются? Обычными помпонами."
1601006-19 = "У них есть одна особая функция. Они не взрываются."
1601006-20 = "Они беспроводные."
1601006-21 = "[s] «Беспроводные?»"
1601006-22 = "Они используют ту же частоту, что и моя прежняя «Вырубающая труба»."
1601006-23 = "Достаточный сон улучшает когнитивные способности и концентрацию — а и то и другое необходимо для любой работы."
1601006-24 = "Если хорошенько подумать, разве сон не лучшая форма поддержки?"
1601006-25 = "[s] «Первая часть точно звучала разумно, но...»"
1601006-26 = "Хорошо, Сенсей. Ложись и положи голову на эти помпоны."
1601006-31 = "...Когда я положил голову на помпоны, я услышал колыбельную, исполненную знакомым голосом."
1601006-32 = "[s] «Этот голос...»"
1601006-34 = "...Да."
1601006-35 = "Это колыбельная, которую я записала."
1601006-36 = "У меня не было времени подобрать подходящую колыбельную..."
1601006-37 = "Поэтому временно я сама её спела."
1601006-38 = "...Прости, возможно, классическая музыка подошла бы лучше..."
1601006-39 = "[s3] «Ни за что!»\n[s4] «Так гораздо лучше!»"
1601006-40 = ""
1601006-41 = ""
1601006-43 = ""
1601006-44 = "...Понятно."
1601006-45 = "Рада, что тебе нравится такая поддержка."
1601006-46 = "И пользоваться ими легко."
1601006-47 = "Просто положи помпоны рядом с головой и включи беспроводной режим."
1601006-48 = "Глубокий и спокойный сон гарантирован."
1601006-49 = ""
1601006-51 = ""
1601006-52 = ""
1601006-53 = ""
1601006-55 = "Что ж, Сенсей..."
1601006-56 = "Сладких снов."
1601006-58 = "Благодаря изобретению Хибики мой сон был долгим, спокойным и полным сладких снов."
