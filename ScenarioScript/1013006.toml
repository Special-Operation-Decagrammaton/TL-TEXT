[translation]
1013006-1 = "Гармошка у реки"
1013006-2 = ""
1013006-3 = ""
1013006-4 = "[ns] «Покупай что хочешь, Субару!»"
1013006-5 = "Умерь пыл!"
1013006-6 = "[s] «Вот это реакция!»"
1013006-7 = "Я правда ненавижу, когда ты так делаешь, Сенсей!"
1013006-8 = ""
1013006-9 = "Так вот, насчёт того, что я хотела купить..."
1013006-10 = "Д-Да, насчёт этого..."
1013006-11 = "..."
1013006-12 = "Это ноты."
1013006-13 = "[s] «А? Я не расслышала.»"
1013006-14 = "Э-Эм... Н..."
1013006-15 = "..."
1013006-16 = "Музыка? Ну, что-то вроде партитуры. Желательно такую, которую легко переложить для губной гармошки!"
1013006-17 = ""
1013006-18 = "Ого..."
1013006-19 = "[s] «Ты рада?»"
1013006-20 = "Рада?"
1013006-21 = "Может, да. Может, и нет."
1013006-22 = "Но для моего первого похода по магазинам было довольно приятно."
1013006-23 = "[s] «...Давай делать это почаще.»"
1013006-24 = "А? Ходить по магазинам?"
1013006-25 = "Ни за что. Я деньги не печатаю."
1013006-26 = "А? Ты не думаешь, что я много потратила?"
1013006-27 = "Ну, вы правы, но..."
1013006-28 = "Ну... в этом есть смысл... Да и просто смотреть витрины по-своему весело."
1013006-29 = "Но это ещё и рождает желание обладать вещами, без которого я могла бы обойтись."
1013006-30 = "Конечно, такое желание может стать мотивацией, а она — привести к действиям."
1013006-31 = "Но всё же мне кажется, подобные желания редко удаётся по-настоящему удовлетворить, особенно потреблением."
1013006-32 = "В конце концов, никто никогда не бывает полностью удовлетворён, правда? Какая трагедия."
1013006-33 = "..."
1013006-34 = "Сенсей, в конце концов... Наверное, я хотела получить окончательный ответ. Хотела, чтобы мучения закончились."
1013006-35 = "Конечно, это так же нелепо, как бесконечно чего-то желать. И всё же я невольно думаю: может, существует какое-то высшее счастье, которого мы способны достичь."
1013006-36 = "Я хочу хотя бы сохранить эту слабую надежду."
1013006-37 = "Я столкнулась со слишком многими неразрешимыми проблемами, слишком многими вопросами без ответа. Это изматывает."
1013006-38 = "[ns1] «...Хорошо.»\n[ns2] «Думаю, ты заслужила право так говорить.»"
1013006-41 = "...Спасибо."
1013006-42 = "Ха-ха. Но очевидно, что всё равно ничего не получится. Я опять трачу время на лишние раздумья."
1013006-43 = "[ns3] «Я бы ничего не исключала.»\n[ns4] «Просто делай всё, что можешь, прямо сейчас.»"
1013006-46 = "..."
1013006-47 = "[s5] «Например, играй на губной гармошке.»\n[s6] «И разучивай пьесу, которую нашла и можешь сыграть.»\n[s7] «Пусть однажды всё это исчезнет, сейчас оно всё равно имеет значение.»"
1013006-51 = "...!"
1013006-52 = "...Ты права."
1013006-53 = "Полагаю, мало что исчезает так же мгновенно, как прозвучавшая музыкальная нота."
1013006-54 = "Иногда мне немного неловко."
1013006-55 = ""
1013006-57 = ""
1013006-58 = ""
1013006-60 = "Мне не стоит стыдиться своего увлечения? Умом я это понимаю."
1013006-61 = "Оно успокаивает меня, да и младшим очень нравится, но..."
1013006-62 = ""
1013006-64 = ""
1013006-66 = ""
1013006-67 = ""
1013006-68 = "Иногда мне кажется, что я не просто старомодная душой..."
1013006-69 = "...а скорее самозванка. Будто подражаю какому-то детскому образу, увиденному в старом фильме."
1013006-70 = "Ох... Как стыдно. Зачем я вообще это сказала?"
1013006-71 = "[ns8] «Всё нормально.»\n[ns9] «А что в этом плохого?»"
1013006-74 = "Хватит расспрашивать. Это не твоя проблема. Это моя."
1013006-75 = ""
1013006-77 = ""
1013006-78 = "..."
1013006-79 = "Сенсей?"
1013006-80 = "Если хочешь, не прогуляешься со мной до берега реки?"
1013006-81 = "Я хочу кое-что тебе сыграть."
1013006-83 = "По просьбе Субару я отправилась вместе с ней к реке."
1013006-84 = "Перед нами начало садиться солнце."
1013006-86 = "Субару села на берегу и заиграла на губной гармошке."
1013006-87 = "Я молча позволила вечернему ветерку обдувать меня, наслаждаясь её исполнением."
1013006-91 = "― [log=니코 스바루]Так освежает.[/log][wa:3030]"
1013006-93 = "― [log=니코 스바루]Я впервые играю для одного слушателя...[/log][wa:1780]"
1013006-96 = "― [log=니코 스바루]Ну как? [/log][wa:2210]"
1013006-98 = "― [log=니코 스바루]Не было странно или типа того...?[/log][wa:1290]"
1013006-101 = "[ns] «Вовсе нет. Это было великолепно.»"
1013006-103 = "― [log=니코 스바루]Это... [/log][wa:3060]"
1013006-105 = "― [log=니코 스바루]Я ведь могу доверять твоим словам, да?[/log][wa:1720]"
1013006-108 = "― [log=니코 스바루]...Спасибо. [/log][wa:10]"
1013006-111 = "― [log=니코 스바루]Знаешь, мне хотелось бы[/log][wa:2590]"
1013006-113 = "― [log=니코 스바루]делать больше разных вещей... [/log][wa:10]"
1013006-116 = "― [log=니코 스바루]Но сейчас[/log]"
1013006-118 = "― [log=니코 스바루]это почти всё, что я могу...[/log]"
1013006-121 = "― [log=니코 스바루]Что? [/log][wa:250]"
1013006-123 = "― [log=니코 스바루]Ты хочешь снова посмотреть, как я занимаюсь и играю для тебя?[/log][wa:10]"
1013006-126 = "― [log=니코 스바루]Потому что я купила столько нот...?[/log][wa:10]"
1013006-129 = "― [log=니코 스바루]Э-Это...[/log][wa:1190]"
1013006-132 = "― [log=니코 스바루]Я... подумаю об этом [/log][wa:960]"
1013006-134 = "― [log=니코 스바루]как-нибудь позже. [/log][wa:10]"
