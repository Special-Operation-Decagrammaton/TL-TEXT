[translation]
103150-1 = "Эпизод 15;Захват Ковчега Атрахасис"
103150-2 = "Враг уничтожен! Оборона прошла успешно!"
103150-3 = "Отличная работа, Сенсей."
103150-4 = "Больше подозрительных сигналов не обнаруживаю—"
103150-5 = ""
103150-10 = "Ч-Что?! В-Взрыв?!"
103150-11 = "Откуда это прилетело?!"
103150-12 = ""
103150-17 = ""
103150-18 = ""
103150-19 = ""
103150-20 = ""
103150-21 = "!"
103150-22 = "Ай! Как она так легко проникла внутрь?!"
103150-23 = ""
103150-25 = ""
103150-26 = "[ns] «Широко...?!»"
103150-27 = "Понятно... В конечном счёте будущее предопределено."
103150-28 = ""
103150-30 = ""
103150-31 = "Разве я вас не предупреждала? Почему вы всё равно упорно идёте вперёд?"
103150-32 = "Здесь вас ждёт только смерть."
103150-33 = "Широко!!!"
103150-34 = ""
103150-36 = ""
103150-43 = "А ну стой!"
103150-44 = "Широко...?!"
103150-45 = "С-Широко?! Это ты?"
103150-46 = ""
103150-48 = ""
103150-54 = "Нет! П-Подожди, Широко?!"
103150-57 = "Стой, Широко!!!"
103150-58 = ""
103150-60 = ""
103150-63 = ""
103150-64 = ""
103150-65 = ""
103150-66 = "Граната?!"
103150-67 = ""
103150-69 = ""
103150-75 = "[ns] «Хошино...!»"
103150-77 = ""
103150-78 = "*кашель* *кашель*"
103150-79 = "Вы в порядке, Сенсей?"
103150-80 = "[s] «А-Аргх...»"
103150-81 = "*кашель* Куда она делась?!"
103150-82 = "Она убежала."
103150-83 = "Мы были правы. Широко находится на Ковчеге."
103150-84 = "Но... почему она...?"
103150-86 = "..."
103150-90 = "После этого взрыва состояние корабля стало ещё хуже."
103150-91 = "Инженерный отдел, вы меня слышите? Можете проверить состояние Утнапиштим?"
103150-93 = "*вздох* Моё сердце... Слава богу, вы все целы."
103150-94 = "Проверяем корабль..."
103150-95 = "Угх. Сказать, что всё плохо, — ничего не сказать."
103150-96 = "При столкновении и взрыве были повреждены различные операционные системы и программы."
103150-97 = "Начинаем диагностику, чтобы оценить масштаб повреждений. Но всё будет хорошо."
103150-98 = "Капитальный ремонт отсюда, наверху, может быть невозможен, но мы каким-нибудь образом перезапустим системы! Во что бы то ни стало!"
103150-99 = "Именно. Мы восстановим корабль и безопасно вернём вас всех на землю. Ставлю на это свою гордость инженера."
103150-100 = "Работать удалённо одним будет гораздо сложнее, так что нам понадобится помощь нескольких операторов."
103150-102 = "Кто-нибудь может помочь?"
103150-104 = "Я займусь. Просто скажите, что делать."
103150-105 = "О, да! Спасибо!"
103150-106 = "Спасибо. Пожалуйста, приведите корабль в порядок настолько, насколько это возможно."
103150-110 = "...Химари."
103150-111 = "Пространственное перемещение, которым только что воспользовалась Широко, похоже, задействовало вычислительные возможности этого Ковчега."
103150-112 = "Хм. Возможно, ты права. Это вполне возможно."
103150-113 = "Ковчег Атрахасис по сути является вычислительным устройством, рассчитывающим фазы измерений. Если знать как, его можно использовать для перемещения в пространстве, как сделала она."
103150-114 = "Похоже, Широко отлично умеет пользоваться Ковчегом."
103150-115 = "К чему ты клонишь, Рио?"
103150-116 = "Если мы сможем использовать вычислительные возможности Ковчега так же, как она, вероятно, получится создать последовательности пространственного скачка, похожие на её."
103150-117 = "Последовательности пространственного скачка...?"
103150-118 = "Я не преувеличиваю, когда говорю, что знаю технологии Безымянных богов лучше всех в Кивотос. Хотя моя прозорливость ограничена, раньше она уже оказывалась верной."
103150-119 = "Если правильно всё рассчитать, мы сможем переместить всех обратно на землю. Но шанс будет только один."
103150-120 = "Хмм... Понятно."
103150-121 = "Рио... Ты не веришь, что Инженерный отдел сможет починить корабль?"
103150-122 = "...Не надо так. Я не говорю, что не доверяю им."
103150-123 = "Да, конечно. Но ты ведь Старшая сестра."
103150-124 = "Ты всё знаешь, поэтому действуешь из тревоги и недоверия."
103150-126 = "Как король, который верит пророчествам."
103150-127 = "...?"
103150-128 = "Твоя тревожность и навязчивость создали больше проблем, чем решили."
103150-129 = "Ты не доверяешь коллегам и впадаешь в самоуверенную праведность, всегда считая, что права только ты."
103150-130 = "...Да, я такая, Химари."
103150-131 = "Наверное, это уже никогда не изменится. Можешь ненавидеть меня, если хочешь."
103150-132 = "Но прямо сейчас этот корабль — единственная надежда спасти твою жизнь, жизнь Сенсея и всех, кто здесь находится."
103150-133 = "Мы должны подготовиться к возможности провала нынешнего плана, какой бы малой ни была эта вероятность."
103150-134 = "В таких ситуациях я..."
103150-135 = "Знаешь, Рио... Я никогда тебя не ненавидела. Ты мне просто не нравишься."
103150-136 = "Между этими двумя вещами есть довольно важная разница."
103150-137 = ""
103150-139 = ""
103150-140 = "Спасибо за заботу, Рио."
103150-141 = "Вы имеете в виду...?"
103150-142 = "Инженерный отдел тоже наверняка будет тебе благодарен."
103150-143 = "Ведь если что-то пойдёт не так, у них будет запасной вариант."
103150-144 = "...Понятно."
103150-145 = "Если есть способ безопасно вернуться без Утнапиштима, это пойдёт на пользу всем нам."
103150-146 = "Я доверюсь тебе, Рио."
103150-147 = "...Спасибо. Дай мне немного времени, и я подготовлю всё необходимое, пока вы выполняете свою миссию."
103150-148 = "Что ж."
103150-149 = ""
103150-151 = ""
103150-152 = "..."
103150-155 = "Мы всё-таки проникли в Ковчег Атрахасис — буквально чудом."
103150-156 = "Но теперь мы в самом сердце вражеской крепости... Будьте готовы к нападению в любой момент."
103150-157 = "Мы не знаем, когда они ударят снова."
103150-158 = "Защита Корабля Утнапиштима тоже имеет высший приоритет."
103150-162 = "Пока Инженерный отдел занимается восстановлением корабля..."
103150-170 = "Я хочу, чтобы Отдел разработки игр, Комитет по предотвращению закрытия и Общество гурманов защищали его от любых атак противника."
103150-171 = ""
103150-172 = "А остальные операторы вместе с Шале должны перейти к следующему этапу."
103150-173 = "Следующий этап..."
103150-174 = "Мы ведь только начали..."
103150-175 = "С этого момента..."
103150-176 = ""
103150-178 = ""
103150-181 = "Мы проникнем внутрь и возьмём Ковчег Атрахасис под контроль!"
103150-182 = ""
