[translation]
1301008-1 = "Покерфейс"
1301008-2 = "Офис Семинар в Миллениум"
1301008-3 = "Пока мы ждали остальных, я предложил Юке сыграть в покер."
1301008-4 = "Покер? С чего вдруг?"
1301008-5 = "Хотя идея неплохая. Я как раз скучала."
1301008-6 = "Хе-хе... Лучше приготовься. Я всегда была хороша в азартных играх."
1301008-7 = "Азартная игра — это процесс, где ставка делается на ожидаемое значение, основанное на вероятности своей комбинации против вероятности комбинации соперника."
1301008-8 = "Опытный игрок умеет контролировать эмоции и объективно оценивать вероятности, сводя риск к минимуму."
1301008-9 = "Иными словами, лучшие игроки — те, кто лучше всего понимает математику."
1301008-10 = "[s] «Докажи.»"
1301008-11 = "Хе-хе. Тогда раздавай карты и сыграем партию."
1301008-12 = ""
1301008-13 = "Эм..."
1301008-14 = ""
1301008-15 = "(У меня тройка... Комбинация, вероятность которой, как ни забавно, всего около трёх процентов.)"
1301008-16 = "(Конечно, это не самая сильная комбинация, но шансы на победу на моей стороне.)"
1301008-17 = ""
1301008-18 = "Колл! У меня тройка."
1301008-19 = "[s] «Флеш.»"
1301008-20 = "Что? Пять карт одной масти? Вероятность такой комбинации всего 0,2%!"
1301008-21 = "[s] «За карточным столом возможно всё.»"
1301008-22 = "Это так, но..."
1301008-23 = "В этот раз тебе повезло. Ещё раунд!"
1301008-24 = ""
1301008-25 = "(Отлично. Теперь я точно выиграю!)"
1301008-26 = "Стрит!"
1301008-27 = "[s] «Каре.»"
1301008-28 = "Четыре туза?! Не верю!"
1301008-29 = "Уф... Ещё одну!"
1301008-30 = ""
1301008-31 = ""
1301008-32 = "(Вероятность получить эту комбинацию всего 0,0015%... Сенсей точно не сможет её перебить.)"
1301008-33 = "(Победа гарантирована!)"
1301008-34 = ""
1301008-35 = "Стрит-флеш!"
1301008-36 = "[s] «Роял-флеш.»"
1301008-37 = "Не может быть!"
1301008-38 = ""
1301008-39 = "Уф. Как я проиграла три раза подряд...? И каждый раз с хорошей комбинацией!"
1301008-40 = "Я ошиблась в расчётах?"
1301008-41 = "[s] «Для победы в покере одних расчётов недостаточно.»"
1301008-42 = "Но вероятности выпадения комбинаций фиксированы. На что ещё мне опираться, если не на расчёты?"
1301008-43 = "На интуицию и чутьё?"
1301008-44 = "Как вообще использовать чутьё в игре случая? Для меня это бессмысленно, хотя с результатом не поспоришь."
1301008-45 = "[s] «Я бы вообще не советовал играть на деньги.»"
1301008-46 = "С этим согласна."
1301008-47 = "Тогда уберу карты."
1301008-48 = ""
1301008-49 = ""
1301008-50 = ""
1301008-51 = ""
1301008-52 = ""
1301008-53 = ""
1301008-54 = "...Сенсей. Почему на столе два туза червей?"
1301008-55 = "В колоде только один, а в покер играют одной колодой..."
1301008-56 = "Ты прятал карты в рукавах?!"
1301008-57 = "[s1] «Мир азартных игр беспощаден.»\n[s2] «Может, объявим ничью...?»"
1301008-60 = ""
1301008-61 = ""
1301008-62 = "Ты просто невозможен!"
