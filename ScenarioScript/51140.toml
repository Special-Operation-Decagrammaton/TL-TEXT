[translation]
51140-1 = "Episódio 14;A Determinação da Garota"
51140-5 = "[ns] \"Onde será que a Yukari foi...?\""
51140-10 = "(Apesar de procurarmos, não havia mais sinal da Yukari.)"
51140-13 = "O local do festival é por aqui mesmo?"
51140-14 = "Anda logo! As barraquinhas vão esgotar tudo!"
51140-20 = "Ei, espera aí!"
51140-24 = "Ouvi dizer que vão soltar fogos de artifício quando o festival começar."
51140-25 = "Parece que são os novos modelos da fábrica de fogos! Mal posso esperar!"
51140-27 = "(Enquanto vozes cheias de expectativa ecoavam por toda a cidade...)"
51140-28 = "(Continuei procurando a Yukari em meio à multidão, até que...)"
51140-31 = "Sensei...!"
51140-32 = "Eu também procurei por lá, mas não encontrei sinal dela em lugar nenhum..."
51140-33 = "Talvez ela nem esteja mais por estas bandas...#nO que vamos fazer?"
51140-34 = "[s1] \"Tem gente demais por aqui...\"\n[s2] \"Cada vez mais pessoas estão chegando, então vai ficar cada vez mais difícil encontrá-la.\""
51140-37 = "Ah, já está tarde assim...?!"
51140-38 = "[s] \"O festival já vai começar, não é?\""
51140-39 = "Ah, sim.#nDaqui a mais ou menos uma hora, ele começa para valer."
51140-40 = "Neste exato momento, a Umika e a Pina estão adiantando os preparativos na sede..."
51140-41 = "[s3] \"Vocês se esforçaram tanto para preparar este festival, né.\"\n[s4] \"Não seria melhor você voltar logo para lá?\""
51140-44 = "Ah... bem, isso é verdade, mas..."
51140-48 = "..."
51140-49 = "...Eu não posso simplesmente deixá-la assim."
51140-50 = "O ponto alto deste festival é o \"ritual\"... ou seja, a \"Dança da Sacerdotisa dos Kadenokouji\"."
51140-51 = "Já que decidimos recriar o festival de 20 anos atrás,#nacho que a \"Dança da Sacerdotisa\" é indispensável. Até para fazer deste um festival que encante a todos."
51140-52 = "Mas... mais do que isso, agora eu quero conversar com a Yukari-san."
51140-53 = "[s] \"...Shizuko.\""
51140-55 = "[ns] \"Por que você decidiu recriar esse festival?\""
51140-56 = "Bem..."
51140-57 = "Não é como se houvesse algum motivo especial..."
51140-59 = "Eu só... pensei que queria recriar um festival que acabou sendo esquecido."
51140-60 = "Um festival que acontecia sem interrupções desde que Hyakkiyako se tornou uma aliança..."
51140-61 = "Não acha um desperdício deixar um festival tão maravilhoso cair no esquecimento desse jeito?"
51140-62 = "[s] \"Realmente, seria uma pena...\""
51140-64 = "Não é mesmo?!"
51140-65 = "Eu quero criar um festival capaz de colocar um sorriso no rosto de muita gente."
51140-66 = "Se conseguirmos realizar um festival assim, os turistas vão se divertir...#ne quem sabe até não abram um pouco mais a carteira? Dá até para ter essa esperança."
51140-67 = "O nome da Momoyodou também se espalharia por toda Kivotos, garantindo um baita poder de marca!"
51140-68 = "...Brincadeirinha, claro."
51140-69 = "[s] \"Brincadeira mesmo...?\""
51140-73 = "É brincadeira de verdade, tá?!"
51140-74 = "...Houve muitos obstáculos para realizarmos este evento."
51140-75 = "Mas, com a ajuda de muitas pessoas, conseguimos chegar até aqui de alguma forma."
51140-76 = "Por isso... eu queria que todo mundo pudesse receber o dia do festival com um sorriso..."
51140-77 = "Eu me esforcei tanto para que o festival fosse assim..."
51140-78 = "[s] \"Foi por isso que você foi até o Hyakkaryouran também, né.\""
51140-79 = "Sim... Mas o que aconteceu com a Yukari-san... é culpa minha."
51140-80 = "Até agora, eu só achava que era falta de sorte não conseguir contato com a sacerdotisa da família Kadenokouji. Achei que uma hora conseguiríamos falar com ela."
51140-81 = "Jamais imaginei... que algo assim tivesse acontecido entre a Yukari-san e o Hyakkaryouran."
51140-82 = "Talvez eu tenha sido ingênua demais."
51140-83 = "[s] \"Shizuko...\""
51140-84 = "Por isso mesmo, eu não posso recuar agora."
51140-85 = "Não apenas pelo sucesso do festival..."
51140-86 = "Você mesmo disse, não foi, Sensei?"
51140-88 = "\"Os sentimentos da Yukari-san pertencem somente a ela\"..."
51140-89 = "Eu concordo plenamente."
51140-91 = "Ela deve fazer o que deseja, e quem decide isso é ela mesma."
51140-92 = "...Mas ninguém disse isso para a Yukari-san, não é?"
51140-93 = "Então eu não posso voltar de mãos vazias."
51140-94 = "Não... eu não quero voltar.#nPelo menos não antes de encontrar a Yukari-san e conversar com ela."
51140-98 = "[ns5] \"Entendi... Isso é bem a sua cara, Shizuko.\"\n[ns6] \"Não esperava menos da nossa Presidente do Comitê de Organização de Festivais!\""
51140-101 = "Hein?!"
51140-102 = "N-Não! Não é nada para tanto assim..."
51140-103 = "[s] \"Então, vamos nos dividir para procurá-la.\""
51140-104 = "Uma busca rápida antes que a multidão aumente ainda mais, certo?"
51140-105 = "Uhh..."
51140-106 = "Sim! Vamos fazer isso!"
51140-107 = "[s] \"Quem encontrar primeiro avisa o outro.\""
51140-108 = "Sim! Pode deixar comigo!"
51140-109 = "A busca pela Yukari-san..."
51140-110 = "Está oficialmente retomada!"
51140-122 = "(Todos diziam a mesma coisa em uníssono...)"
51140-126 = "A jovem senhorita desta geração é verdadeiramente brilhante."
51140-127 = "Sim. Ela até tirou nota máxima no último exame unificado de Hyakkiyako!"
51140-128 = "E também venceu o concurso do outro dia..."
51140-131 = "Ela é uma jovem tão íntegra, dedicada e bela."
51140-132 = "A forma ágil como ela lida com qualquer tarefa é realmente um exemplo para todos."
51140-133 = "Que alívio... Sendo assim, nesta geração também poderemos..."
51140-135 = "Gravar o nome dos Kadenokouji na história de Hyakkiyako."
51140-140 = "(Tirar nota máxima era o mínimo esperado.)"
51140-143 = "(Ser útil aos outros era algo óbvio.)"
51140-144 = "(Corresponder às expectativas era uma obrigação.)"
51140-146 = "Meu nome é Yukari Kadenokouji."
51140-147 = "Herdeira da família Kadenokouji, uma das linhagens mais ilustres de Hyakkiyako."
51140-148 = "\"Mantenha-se sempre íntegra como membro da família Kadenokouji.\""
51140-149 = "Essa era a minha missão, o meu dever."
51140-154 = "...Eu sei muito bem disso. Sei que é o que devo fazer."
51140-156 = "Mas."
51140-158 = "(Aquelas costas firmes e retas.)"
51140-159 = "A primeira pessoa que me mostrou não o que eu \"devia fazer\", mas o que eu \"queria fazer\"."
51140-160 = "Aquele dia em que a encontrei pela primeira vez."
51140-165 = "E-Espere, por favor!"
51140-166 = "...Ué? Você ainda não foi para casa?#nJá está tarde, então..."
51140-167 = "Nagusa... -senpai!#nBem... aquilo de agora há pouco foi tão incrível... Eu fiquei profundamente impressionada!"
51140-168 = "...Hã?"
51140-169 = "O que devo fazer para me tornar alguém como você, Nagusa-senpai?"
51140-170 = "...Como eu?"
51140-171 = "Deixa eu ver..."
51140-172 = "Fazer exercícios com afinco todos os dias... talvez?"
51140-173 = "Hum... Exercícios diários! Entendo... Isso pode ser um pouco difícil para mim..."
51140-178 = "Tive uma excelente ideia!"
51140-179 = "Basta que eu também ingresse no Hyakkaryouran!"
51140-181 = "Hã...?"
51140-183 = "Assim, poderei estar junto da Nagusa-senpai...!"
51140-185 = "Poderei atuar ao lado da Nagusa-senpai!#nEstá decidido!"
51140-193 = "Naquele instante... eu tomei minha decisão."
51140-194 = "Me tornar membro do Hyakkaryouran e ficar junto daquela pessoa que tanto admiro, junto de todas vocês."
51140-198 = "Mas..."
51140-200 = "Naquele momento, o Hyakkaryouran já tinha acabado."
51140-202 = "Que tal aceitar a realidade?"
51140-203 = "Essa brincadeira de Hyakkaryouran já acabou."
51140-205 = "Renge-senpai, Kikyou-senpai..."
51140-206 = "Todas vocês..."
51140-209 = "Se o futuro que eu imaginava..."
51140-210 = "Não é desejado por mais ninguém..."
51140-213 = "...O festival."
51140-214 = "Sim... O festival vai começar."
51140-215 = "Normalmente, seria o Hyakkaryouran quem cuidaria da segurança, mas..."
51140-216 = "Agora já..."
51140-221 = "Arf... arf...#nEncontrei você...! Então era aqui que estava!"
51140-227 = "Yukari-san! Eu estava procurando por você!"
51140-228 = "A senhorita é... a Presidente do Comitê de Organização de Festivais, certo?#nPor que está me procurando...?"
51140-229 = "Ah... está me procurando por causa do festival...?"
51140-230 = "Vamos voltar para a sala de mediação do Hyakkaryouran!"
51140-231 = "...O quê?"
51140-232 = "Ela é a Estrategista do Hyakkaryouran, não é?"
51140-233 = "Acho que ela pegou pesado demais! Dizer tudo aquilo sem nem ouvir o que a Yukari-san tinha a dizer!"
51140-234 = "Quem decide onde é o seu lugar é você mesma... Quanta arrogância a dela...!"
51140-235 = "Vamos! Volte lá para conversar com ela!"
51140-236 = "Nessas horas, o melhor é colocar tudo em pratos limpos!"
51140-238 = "O festival já está prestes a começar..."
51140-239 = "Por que a Presidente se importa com um problema pessoal meu...?"
51140-240 = "É que eu não consigo simplesmente fazer vista grossa para algo assim!"
51140-241 = "...Entendo."
51140-242 = "...Agradeço imensamente suas palavras.#nMas eu estou bem."
51140-243 = "Hein? Como assim você está bem...?"
51140-244 = "Acredito que as palavras da Kikyou-senpai também não estejam erradas."
51140-245 = "Pois é verdade que eu fugi da minha casa."
51140-246 = "É natural que digam que foi apenas uma brincadeira.#nMesmo que jamais tenha sido essa a minha intenção."
51140-247 = "Mas...!"
51140-248 = "Presidente do Comitê de Organização de Festivais... não, Shizuko-san."
51140-249 = "Não temos mais tempo.#nFelizmente, eu me recordo dos passos do ritual, portanto..."
51140-250 = "Eu, Yukari Kadenokouji..."
51140-255 = "...Participarei como sacerdotisa, conforme o seu desejo."
51140-260 = "O quêêê?!"
51140-263 = "(Enquanto eu continuava correndo pela cidade à procura da Yukari...)"
51140-267 = "[ns] \"...Ah.\""
51140-268 = "(O início do festival estava cada vez mais próximo.)"
51140-272 = "Você soube?"
51140-273 = "Parece que a atração principal desta vez vai ser a \"Dança da Sacerdotisa\"!"
51140-274 = "Do \"Festival das Lanternas de Hyakkiyako\", né?#nA \"Dança da Sacerdotisa\"... Quem será que vai fazer desta vez?"
51140-275 = "Será que vai ser a Chise-sama?"
51140-276 = "Ah, sobre isso, parece que vai ser alguém do clã que realizou a \"Dança da Sacerdotisa\" há 20 anos."
51140-277 = "Se não me engano..."
51140-278 = "...Acho que disseram \"Kadenokouji\"."
51140-279 = "[s] (Kadenokouji...)"
51140-280 = "Falando nisso, por que será que o Festival das Lanternas de Hyakkiyako deixou de existir?"
51140-281 = "Ouvi dizer que recriaram o evento desta vez, mas não faço ideia do porquê de ele ter acabado."
51140-282 = "Bom, águas passadas, né?#nVamos aproveitar o que vem por aí."
51140-283 = "Verdade, você tem razão."
51140-284 = "Viemos até Hyakkiyako só para isso, então vamos curtir ao máximo!"
51140-292 = "[ns] \"...O motivo pelo qual o festival deixou de existir, hein.\""
51140-297 = "[ns] \"Ah, é a Shizuko ligando.\""
51140-301 = "(No exato momento em que fui atender o telefone...)"
51140-308 = "[ns] (...Hum?)"
51140-313 = "A hora chegou."
51140-314 = "Inúmeras histórias acumuladas agora aguardam o instante de seu início."
51140-318 = "O que se tecerá a partir de agora é a nossa \"Hyakumonogatari\"."
51140-323 = "Ahaha! Permita-me apresentar-me."
51140-324 = "Eu estava morrendo de vontade de conhecer você, sabia?#n— Sensei de Schale."
51140-326 = "Próximo;Encontro Súbito"
