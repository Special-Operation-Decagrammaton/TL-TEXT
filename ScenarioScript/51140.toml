[translation]
51140-1 = "Эпизод 14;Решительная девушка"
51140-5 = "[ns] «Где... она...?»"
51140-6 = ""
51140-10 = "Хотя мы почти сразу бросились вслед за Юкари, от неё не было ни слуху ни духу."
51140-13 = "А фестиваль в какой стороне? Сюда?"
51140-14 = "Давай! Мы опоздаем!"
51140-15 = ""
51140-17 = ""
51140-20 = "А, не оставляйте меня!"
51140-21 = ""
51140-23 = ""
51140-24 = "Говорят, на церемонии открытия будут фейерверки!"
51140-25 = "Да, именно эту часть я особенно жду! Слышала, Исследовательский центр фейерверков уже несколько месяцев лично готовит потрясающее шоу."
51140-27 = "Пока мы бродили сквозь толпу, посетители оживлённо обсуждали Фестиваль фонарей и то, что их ждёт."
51140-28 = "Мы искали Юкари на оживлённых улицах, казалось, целую вечность."
51140-31 = "Сенсей! Вот вы где!"
51140-32 = "Ни следа! Я больше не могу придумать, где искать."
51140-33 = "...Что нам делать, Сенсей?"
51140-34 = "[s1] «Улицы заполняются людьми...»\n[s2] «Такими темпами найти её будет невозможно.»"
51140-37 = "А! Я совсем потеряла счёт времени. Солнце уже садится..."
51140-38 = "[s] «Когда начинается фестиваль, Шизуко?»"
51140-39 = "Киоски уже начинают открываться, но в полную силу фестиваль заработает примерно через час."
51140-40 = "Умика и Пина, наверное, сейчас носятся повсюду, доделывая последние мелочи."
51140-41 = "[s3] «Ты столько работала, чтобы всё это устроить, Шизуко.»\n[s4] «Тебе ведь не терпится пойти им помочь?»"
51140-44 = "А! Вы меня раскусили!"
51140-45 = ""
51140-47 = ""
51140-48 = "..."
51140-49 = "Но я пока не могу вернуться. Ещё нет."
51140-50 = "Я обещала обеспечить танец мико Кадэнокодзи для фестивального ритуала."
51140-51 = "Учитывая, что этот фестиваль проводится впервые за двадцать лет, всё должно пройти идеально. Я обязана сдержать слово."
51140-52 = "Но важнее любых деловых договорённостей то, что я просто хочу ещё раз поговорить с Юкари."
51140-53 = "[s] «...Шизуко.»"
51140-55 = "[ns] «Почему ты вообще решила возродить старый забытый фестиваль, Шизуко?»"
51140-56 = "Это..."
51140-57 = "Ну, тут особо нечего объяснять. У меня нет какой-то великой личной или финансовой заинтересованности."
51140-59 = "Я хотела вернуть прошлое к жизни... Вот и всё."
51140-60 = "У Фестиваля фонарей огромная история. Он существует ещё со времён основания альянса Хяккияко."
51140-61 = "Я просто... не могла отделаться от мысли, что будет ужасно жаль позволить ему бесследно исчезнуть."
51140-62 = "[s] «Потеря части истории сама по себе всегда трагедия.»"
51140-64 = "Вы всегда меня понимаете, Сенсей!"
51140-65 = "Суета фестиваля, смех людей, которые веселятся... Нет звука лучше, знаете?"
51140-66 = "И не только это — фестивали привлекают туристов! Туристов со счастливыми улыбками и раскрытыми кошельками. Во время захватывающего мероприятия куда легче заставить человека расстаться с деньгами."
51140-67 = "Бренд Момоёдо будет расти и расширяться по всему Кивотосу! Когда люди увидят в нас гиганта индустрии развлечений, мы станем неудержимы—"
51140-68 = "Кхм! Конечно же, я шучу! Всё ради сообщества и чувства единства."
51140-69 = "[s] «Так это всё ради брендинга...?»"
51140-70 = ""
51140-72 = ""
51140-73 = "Нет-нет! Я просто пыталась немного разрядить обстановку шуткой, понятно? Ну правда, Сенсей!"
51140-74 = "Вы же знаете, я бы не взялась за такой проект, если бы не горела им! Вы даже не представляете, сколько бюрократических препон нам пришлось преодолеть, чтобы это случилось."
51140-75 = "И ваша помощь тоже была бесценна, Сенсей."
51140-76 = "Именно поэтому для меня так важно, чтобы у всех участников остались хорошие впечатления..."
51140-77 = "По крайней мере, я на это надеялась..."
51140-78 = "[s] «И поэтому ты пошла к Хяккарёран.»"
51140-79 = "Да... Я чувствую некоторую ответственность за то, как всё вышло с Юкари..."
51140-80 = "Я слишком зациклилась на том, чтобы встретиться с мико Кадэнокодзи. Я недостаточно всё изучила и не поняла, куда сую нос."
51140-81 = "Мне даже в голову не пришло, что Хяккарёран и Юкари могут быть в плохих отношениях."
51140-82 = "Похоже, я разбудила спящего медведя."
51140-83 = "[s] «Шизуко...»"
51140-84 = "Вот почему я хочу найти Юкари во что бы то ни стало."
51140-85 = "Теперь дело уже не только в ритуале или части истории."
51140-86 = "Вы сами сказали, Сенсей."
51140-88 = "«Юкари имеет право сама решать, как хочет прожить свою жизнь»."
51140-89 = "Полностью согласна."
51140-91 = "Не думаю, что в жизни есть более верный принцип, чем право человека самому выбирать свой путь."
51140-92 = "Юкари когда-нибудь вообще говорили такие слова?"
51140-93 = "Думаю, она заслуживает их услышать."
51140-94 = "Так что я не вернусь, пока не смогу посмотреть ей в глаза и сказать правду."
51140-95 = ""
51140-98 = "[ns5] «Рыцарство Шизуко никогда не подводит.»\n[ns6] «Вот она — наша единственная и неповторимая президент Фестивального отдела!»"
51140-101 = "Я-Я правильно услышала?!"
51140-102 = "Не смейтесь надо мной..."
51140-103 = "[s] «Нужно найти её, пока не стало слишком поздно! Разделимся.»"
51140-104 = "Скоро улицы будут забиты людьми, так что нам нужно как можно быстрее осмотреть как можно больше мест."
51140-105 = "Хм..."
51140-106 = "Хорошая идея! Думаю, сейчас это лучший вариант."
51140-107 = "[s] «Я свяжусь с тобой, как только появятся новости.»"
51140-108 = "Я тоже."
51140-109 = "Пошли!"
51140-110 = "Найти Юкари!"
51140-111 = ""
51140-122 = "(Шёпот не прекращался ни на секунду.)"
51140-125 = ""
51140-126 = "Госпожа Кадэнокодзи — образцовый студент. Она получала награды и высшие оценки по всем предметам."
51140-127 = "Я слышала, на вступительном экзамене в Хяккияко она набрала идеальные сто баллов. Представляешь!"
51140-128 = "Она ещё и заняла первое место на Ежегодном конкурсе мастеров оркестра!"
51140-130 = ""
51140-131 = "И вдобавок она такая красивая! Держится прямо как настоящая аристократка."
51140-132 = "Нет ничего, чего она не могла бы сделать! Настоящий пример для подражания."
51140-133 = "В её руках будущее будет в безопасности. Пока она продолжает блистать..."
51140-135 = "Имя Кадэнокодзи будет вечно звучать в стенах Хяккияко."
51140-136 = ""
51140-138 = ""
51140-139 = ""
51140-140 = "(Я родилась с грузом чужих ожиданий на плечах.)"
51140-142 = ""
51140-143 = "(Моим долгом было превзойти каждое из них.)"
51140-144 = "(Я улыбалась под тяжестью их ожиданий.)"
51140-145 = ""
51140-146 = "Меня зовут Кадэнокодзи Юкари."
51140-147 = "Наследница одной из старейших и наиболее почитаемых семей Хяккияко."
51140-148 = "Не посрами имя Кадэнокодзи."
51140-149 = "Таков был мой долг с самого момента рождения."
51140-150 = ""
51140-152 = ""
51140-153 = ""
51140-154 = "Я понимала своё положение. Правда, я приняла его."
51140-156 = "Но."
51140-157 = ""
51140-158 = "(Какая прямая осанка...)"
51140-159 = "Но затем вы пронеслись по моему тёмному небу долга и ответственности словно падающая звезда. Вы показали мне, что выбор существует там, где я всегда считала его невозможным."
51140-160 = "Как я могла повернуть назад после встречи с вами?"
51140-163 = ""
51140-164 = ""
51140-165 = "Прошу прощения! Здравствуйте!"
51140-166 = "Ты всё ещё здесь? Уже темно."
51140-167 = "Нагуса, верно? Я не забуду это имя! Такая демонстрация силы... Я больше не могла сдерживать своё восхищение!"
51140-168 = "...Что?"
51140-169 = "Я стремлюсь к вашей доблести, Нагуса! Как мне достичь такого уровня?"
51140-170 = "...Ты говоришь так, будто всё просто."
51140-171 = "Хм..."
51140-172 = "Вы тренируетесь каждый день?"
51140-173 = "Я... эм...! Э-Это довольно серьёзное требование..."
51140-174 = ""
51140-176 = ""
51140-177 = ""
51140-178 = "А! Меня осенило!"
51140-179 = "Мне просто нужно вступить в Хяккарёран, чтобы стать такой, как вы!"
51140-181 = "...Что?"
51140-183 = "Если я вступлю... я смогу каждый день наслаждаться вашим обществом!"
51140-185 = "Именно! Я, Юкари, присоединюсь к Хяккарёран, и мы вместе отправимся навстречу великим приключениям! Клянусь преданно следовать за каждым вашим шагом!"
51140-186 = ""
51140-189 = ""
51140-190 = ""
51140-191 = ""
51140-193 = "В тот самый миг моя решимость стала твёрдой."
51140-194 = "Я нашла своё призвание. Я поклялась полностью посвятить себя Хяккарёран, стоя плечом к плечу со своей наставницей и всеми членами клуба, которых мне предстояло полюбить."
51140-195 = ""
51140-198 = "Но теперь..."
51140-199 = ""
51140-200 = "Для Хяккарёран уже всё кончено. Всё, полностью кончено."
51140-201 = ""
51140-202 = "Пора взглянуть реальности в лицо."
51140-203 = "Игры с Хяккарёран окончены, госпожа Кадэнокодзи."
51140-205 = "Рэнгэ... Кикё..."
51140-206 = "Все..."
51140-209 = "То воспоминание, за которое я отчаянно цеплялась..."
51140-210 = "Похоже, отпустить его не могла только я одна..."
51140-212 = ""
51140-213 = "...Фестиваль."
51140-214 = "Я почти забыла. Сегодня вечером студенты участвуют в празднике."
51140-215 = "Хяккарёран... должен был сейчас патрулировать..."
51140-216 = "...По крайней мере, раньше всё было бы именно так..."
51140-217 = ""
51140-221 = "*тяжело дышит* Я... искала вас!"
51140-222 = ""
51140-224 = ""
51140-226 = ""
51140-227 = "Юкари! Вы не представляете, как я рада, что наконец вас нашла!"
51140-228 = "Вы ведь президент Фестивального отдела, верно? Почему вы меня искали?"
51140-229 = "А, да. Вы хотели моей помощи с фестивалем..."
51140-230 = "Давайте немедленно вернёмся в клубную комнату Хяккарёран!"
51140-231 = "...Простите?"
51140-232 = "Кем она вам приходится? Ваш директор по операциям?"
51140-233 = "Неважно! Важно то, что она перешла черту! Она не может просто решать всё за вас и говорить, что это ради вашего же блага."
51140-234 = "Только вы решаете, как прожить свою жизнь! У неё не было права!"
51140-235 = "Так что давайте вернёмся. Вместе. Думаю, вам двоим ещё есть о чём поговорить."
51140-236 = "Именно когда больше всего хочется убежать, нужно стоять на своём и разговаривать."
51140-238 = "Разве вы не президент Фестивального отдела? Почему вы протягиваете мне руку помощи?"
51140-239 = "Вы наверняка по уши завалены обязанностями, связанными с фестивалем."
51140-240 = "Так и есть! Но фестиваль должен приносить радость всем, и вам тоже!"
51140-241 = "...Как это доброжелательно с вашей стороны."
51140-242 = "Мне и правда не хватит слов, чтобы вас поблагодарить. Но всё в порядке."
51140-243 = "Всё... в порядке? Не понимаю."
51140-244 = "Кикё не ошибалась, когда говорила всё это."
51140-245 = "В конце концов, это правда. Я пыталась бросить свои обязанности и свой дом."
51140-246 = "Как бы мои намерения ни выглядели в её глазах... Факты остаются фактами."
51140-247 = "Но...!"
51140-248 = "Спасибо, президент Фестивального отде— Шизуко, верно?"
51140-249 = "Полагаю, вам нужно провести ритуал, так? И так уж вышло, что я хорошо обучена именно этому."
51140-250 = "В ответ на вашу просьбу..."
51140-251 = ""
51140-253 = ""
51140-255 = "Я, Кадэнокодзи Юкари, стану мико этого Фестиваля фонарей."
51140-256 = ""
51140-259 = ""
51140-260 = "А?!"
51140-263 = "Я бежал по одной улице за другой в поисках Юкари."
51140-267 = "[ns] «...А.»"
51140-268 = "Незадолго до официального начала фестиваля я начал слышать слухи."
51140-269 = ""
51140-272 = "Вы слышали новости?"
51140-273 = "Танец мико проведут в полночь! Никто не был уверен, состоится ли он вообще..."
51140-274 = "Это ведь старая традиция Фестиваля фонарей Хяккияко, да? Кто будет мико...?"
51140-275 = "Может, Чисэ?"
51140-276 = "Чисэ лучшая, но она актриса. Если они собираются следовать традиции, ритуал должна провести настоящая мико."
51140-277 = "Если слухи правдивы..."
51140-278 = "Это будет не кто иная, как сама госпожа Кадэнокодзи."
51140-279 = "[s] «(Кадэнокодзи...)»"
51140-280 = "Раньше я особо не задумывалась, но почему фестиваль вообще перестали проводить?"
51140-281 = "Никто толком не знает. Он как-то сам отошёл на задний план, пока в этом году не поднялась большая шумиха вокруг его возрождения."
51140-282 = "Будем просто рады, что он вернулся, и насладимся праздником."
51140-283 = "Полностью согласна."
51140-284 = "Никто не умеет проводить фестивали так, как Хяккияко, так что давайте насладимся им по полной."
51140-285 = ""
51140-287 = ""
51140-288 = ""
51140-289 = ""
51140-292 = "[ns] «Похоже, никто не знает, почему фестиваль изначально отменили...»"
51140-293 = ""
51140-297 = "[ns] «...Мне звонит Шизуко.»"
51140-298 = ""
51140-301 = "Я уже собирался ответить на звонок Шизуко, когда меня прервали..."
51140-302 = ""
51140-308 = "[ns] «(...А?)»"
51140-309 = ""
51140-313 = "Колокол звонит, и гуляки вырываются на волю!"
51140-314 = "Мы приближаемся к кульминации истории! От предвкушения у меня аж пальцы ног поджимаются."
51140-315 = ""
51140-317 = ""
51140-318 = "Замолчите и слушайте «Сто историй о призраках»."
51140-319 = ""
51140-321 = ""
51140-323 = "Теперь каждый из вас сможет упокоиться с миром. Хи-хи-хи."
51140-324 = "Я невероятно взволнована встречей с вами, Сенсей из Шале."
51140-326 = "Следующий эпизод;Встреча"
