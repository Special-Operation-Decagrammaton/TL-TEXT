[translation]
1300703-1 = "Поддельная еда"
1300703-2 = "Столовая академии Геенна"
1300703-3 = "Ты опоздал, Сенсей!"
1300703-4 = "Я предлагаю тебе изысканную еду, а ты ещё смеешь опаздывать на десять минут? За такое полагается смертная казнь!"
1300703-5 = "Тебе повезло, что единственный способ попробовать то, что я принесла, — оставить тебя в живых."
1300703-6 = "На этот раз помилую, но в следующий — расстрельная команда!"
1300703-7 = "[s] «Разве ты не говорила что-то о морепродуктах, когда приглашала меня?»"
1300703-8 = "Надеюсь, ты не подумал, что речь о настоящих морепродуктах. С моей зарплатой я их не потяну."
1300703-9 = "Сегодня у нас... вкусная подделка, которая обманет твои вкусовые рецепторы!"
1300703-10 = "[s] «И как она это сделает?»"
1300703-11 = "Человеческий язык очень чувствителен. Наверняка тебе знакомо, как сочетание нескольких ингредиентов создаёт совершенно новый вкус."
1300703-12 = "Судя по тому, что я нашла в интернете, вкус дорогих морепродуктов можно имитировать, сочетая гораздо более дешёвые продукты."
1300703-13 = "Позволь представить... имитацию икры морского ежа!"
1300703-14 = "[s] «Это же просто... соевый соус и пудинг из магазина?»"
1300703-15 = "Именно. Я читала, что пудинг с соевым соусом на вкус точь-в-точь как икра морского ежа."
1300703-16 = "Не спрашивай как и почему... если сочетание работает, значит работает! Нас ждёт интересный вкус!"
1300703-17 = "Вот, Сенсей, пробуй первым!"
1300703-18 = "[s] Откусить пудинг, политый соевым соусом."
1300703-19 = "Ну как? Чувствуешь вкус икры морского ежа?"
1300703-20 = "[s] «...Не уверен.»"
1300703-21 = "Странно. Люди клялись, что вкус точь-в-точь... *чавк*"
1300703-22 = "..."
1300703-23 = "Солёное... Сладкое... Странное..."
1300703-24 = "Какого чёрта?! Это вообще не похоже на икру морского ежа!"
1300703-25 = "Уф... Зачем кому-то заходить в интернет и врать? Кто вообще так делает?"
1300703-26 = "Н-Ничего! У меня ещё куча рецептов для проверки!"
1300703-27 = "На очереди второй."
1300703-28 = "[s] «Авокадо?»"
1300703-29 = "Та же идея. Говорят, если есть авокадо с соевым соусом, оно будет похоже на сашими из тунца!"
1300703-30 = "Авокадо такое же жирное, как тунец, так что это ОБЯЗАНО сработать!"
1300703-31 = ""
1300703-32 = "Ладно... была не была!"
1300703-34 = "...Чувствую себя идиоткой."
1300703-35 = "Меня обманули! Что это вообще было?! Ничего не похоже на то, что обещали!"
1300703-36 = "Авокадо с соевым соусом вместо сашими из тунца, мандарин с соевым соусом вместо икры лосося... Всё получается отвратительным!"
1300703-37 = "Такое понравилось бы только Изуми!"
1300703-38 = "*вздох* А я всего лишь хотела дорогих морепродуктов по доступной цене..."
1300703-39 = "Подожди. Ты думаешь, на деньги, потраченные на все эти ингредиенты, я могла купить настоящие морепродукты?"
1300703-40 = "Дай посчитать... набор пудинга, соевый соус, авокадо, мандарины..."
1300703-41 = ""
1300703-42 = "Ты прав! Выходит примерно столько же, сколько поход в суши-бар с конвейером!"
1300703-43 = "Меня опять обманули! Почему люди заходят в интернет и просто врут? Кто так делает?!"
