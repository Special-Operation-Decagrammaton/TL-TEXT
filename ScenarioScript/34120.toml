[translation]
34120-1 = "Episódio 12;Distrito Autônomo de Arius"
34120-6 = "E então, levaram a Atsuko... por ordem \"dela\"... para a Basílica do Distrito Autônomo de Arius..."
34120-7 = "É-é só isso que a gente sabe..."
34120-13 = "Hmm... Foram para o Distrito Autônomo de Arius para salvar a companheira delas... levando o Sensei junto?"
34120-14 = "Entendi... Então é isso."
34120-15 = "Vindo do Sensei, era de se esperar que fizesse isso mesmo."
34120-16 = "..."
34120-17 = "Mas..."
34120-18 = "Mesmo assim..."
34120-22 = "Eu... vou atrás delas.#nVou alcançá-las e me vingar."
34120-23 = "Será que ele vai me desprezar... ou ficar decepcionado comigo...?#nO Sensei era a única pessoa que eu não queria que me odiasse..."
34120-24 = "...Mas, ainda assim... eu não consigo me conter."
34120-25 = "Me desculpa... É que..."
34120-26 = "Eu jamais vou perdoar o Esquadrão Arius — mesmo que continuem me chamando de bruxa, preciso persegui-las até os confins da terra e ter a minha vingança."
34120-30 = "...Por isso, Sensei, não tente me impedir, tá?"
34120-39 = "..."
34120-40 = "...T-tá tudo limpo! Podem subir!"
34120-41 = "[ns] Subir."
34120-45 = "Por aqui a vigilância deve ser mais fraca... Acertamos na escolha."
34120-46 = "É-é verdade..."
34120-47 = "Uff... Ngh..."
34120-48 = "[s] \"Aqui é o Distrito Autônomo de Arius...?\""
34120-49 = "...Antigamente era, mas hoje não passa de ruínas."
34120-50 = "..."
34120-51 = "O verdadeiro distrito autônomo fica um pouco mais adiante.#nMas, como já sabem que estamos a caminho, acho que não vai ser tão fácil nos aproximarmos."
34120-52 = "...Aqui costumava ser um campo de treinamento."
34120-53 = "[s] \"Campo de treinamento?\""
34120-54 = "Originalmente eram ruínas, mas depois que a guerra civil acabou, o lugar passou a ser usado como campo de treinamento também."
34120-55 = "[s] \"Guerra civil...?\""
34120-57 = "Uma guerra que aconteceu há uns dez anos, quando o Distrito Autônomo de Arius se dividiu em dois.#nQualquer aluna de Arius da nossa idade sabe disso."
34120-58 = "[s] Ouvir em silêncio as palavras da Misaki."
34120-59 = "...Não é uma história muito agradável."
34120-60 = "Além disso, não tem nada a ver com a missão de agora... e não é algo sobre o qual eu goste de falar."
34120-61 = "Eu..."
34120-62 = "Eu ainda me lembro — foi aqui que conhecemos a Azusa-chan pela primeira vez, não foi?"
34120-63 = "..."
34120-67 = "Qual treinamento era mesmo...? Tiro, ou fabricação de bombas...?#nUma garota que não obedeceu às \"ordens\" dos adultos estava sendo espancada brutalmente..."
34120-68 = "[s] \"...\""
34120-69 = "Todo mundo ao redor só ficava olhando...#nMas aquela garota se levantava vez após vez, encarando os adultos sem desviar o olhar..."
34120-70 = "Se ninguém fizesse nada, o halo dela acabaria sendo destruído... mas eu estava com tanto medo que não conseguia me mexer..."
34120-71 = "Foi aí que a Saori-neesan... digo, a Líder veio correndo e..."
34120-72 = "...Deixem a nostalgia para depois. Agora precisamos focar na missão."
34120-76 = "E então... o que vamos fazer agora?"
34120-81 = "..."
34120-82 = "Por mais que tenhamos trazido um adulto, é impossível enfrentarmos todo este distrito autônomo e \"ela\" só nós. Como vamos salvar a Princesa?"
34120-86 = "...Líder?"
34120-91 = "[ns] \"Saori?\""
34120-92 = "L-Líder!?"
34120-93 = "Ugh... Ngh..."
34120-96 = "...Ela está ardendo em febre. Como ela aguentou calada até chegar a esse estado...?"
34120-97 = "F-febre!?"
34120-98 = "...A Líder já está há quase quatro dias sem descansar. Além de ferida, está sem dormir e exausta...#nAcho que ela chegou ao limite do que conseguia suportar só na força de vontade."
34120-99 = "A-ai, meu Deus... O-o que a gente faz?"
34120-103 = "[ns] Pegar um antitérmico do kit de remédios."
34120-104 = "R-remédio...!?"
34120-105 = "...Você anda com isso no bolso?"
34120-106 = "[s1] \"É que vende em qualquer loja de conveniência.\"\n[s2] \"Também tenho remédio para o estômago, petisco de gato, barra de chocolate e mais umas coisas.\""
34120-107 = "Entendi... Adultos dão medo..."
34120-108 = "Entendi... Adultos dão medo..."
34120-109 = "Que alívio... Obrigada."
34120-113 = "...Líder, tome isto. Vai fazer você se sentir melhor."
34120-119 = "(Glup)... Haa, uff..."
34120-120 = "Líder..."
34120-121 = "[s] \"Vamos descansar um pouco aqui.\""
34120-122 = "...Tem razão."
34120-123 = "Sim... Então, eu fico no primeiro turno de vigia...?"
34120-124 = "Vamos revezar. Você também precisa descansar, Hiyori."
34120-125 = "Durma um pouco também, Sensei. Eu assumo a vigília primeiro."
34120-126 = "[s] \"Certo, obrigado.\""
34120-127 = "S-sim. Entendido..."
34120-134 = "(Decidi me sentar em um canto qualquer para descansar...)"
34120-140 = "...Sensei, a minha voz está chegando até você...?"
34120-141 = "Se estiver me ouvindo... por favor... escute com atenção..."
34120-142 = "Neste momento, estou presa em um mundo limiar, que não é nem sonho nem realidade...#nNão sei ao certo por quanto tempo conseguirei permanecer aqui."
34120-143 = "Não me resta muito tempo... Preciso transmitir a situação atual a você, Sensei..."
34120-144 = "Eu... cometi um erro..."
34120-146 = "Em meus sonhos, tomei conhecimento da Gematria — e da reunião deles..."
34120-155 = "Beatrice, que governa o Distrito Autônomo de Arius, está prestes a realizar um ritual na Basílica..."
34120-167 = "Ao final desse ritual... Kivotos encontrará o seu fim..."
34120-169 = "Ainda não está claro o que exatamente ela pretende fazer com esse ritual..."
34120-170 = "Contudo, calculo que ela esteja tentando invocar \"algo\" que não existe em Kivotos..."
34120-173 = "Eu fui atacada por Beatrice dentro de um sonho lúcido#n— e acabei entrando em contato com a existência que aguarda do outro lado do ritual..."
34120-174 = "Sim — por ter tocado \"aquilo\", o meu receptáculo começou a se despedaçar..."
34120-176 = "...E, assim, eu feri a Mika."
34120-177 = "Após entrar em contato com o fim de Kivotos, caí em pânico e despejei culpas sobre a Mika... enquanto meu corpo se desfazia..."
34120-181 = "Eu estou sempre... machucando aquela garota..."
34120-183 = "Mika culpará a si mesma e tentará cometer um pecado irremediável..."
34120-187 = "E o ritual de Beatrice pode muito bem ser o estopim que conduzirá Kivotos à sua ruína."
34120-188 = "— Nesse processo, Atsuko, do Esquadrão Arius, terá a flor de sua vida ceifada."
34120-189 = "Por estar aprisionada neste limiar entre o sonho e a realidade,#n— tudo o que posso fazer, Sensei, é lançar estas palavras sem sequer saber se chegarão até você."
34120-190 = "Ah, e Sensei... tome cuidado. Beatrice está mirando em você."
34120-191 = "..."
34120-192 = "É impossível resolver todos esses problemas."
34120-193 = "Você já se esforçou mais do que o suficiente por nós, Sensei.#nPortanto, não tente carregar todos os fardos sozinho."
34120-194 = "Eu vou escapar daqui e, com a ajuda de Nagisa e das outras, trarei a Mika de volta."
34120-195 = "Desta vez, quero pedir desculpas a ela."
34120-196 = "Por isso, Sensei..."
34120-197 = "Sensei... se a minha voz estiver chegando até você... por favor..."
34120-202 = "Fuja — e afaste-se o máximo que puder do Distrito Autônomo de Arius."
34120-209 = "Caso contrário... Sensei, você..."
34120-211 = "............................................."
34120-213 = "Próximo;Nossa jornada até aqui"
