[translation]
34120-1 = "Эпизод 12;Район Ариуса"
34120-3 = ""
34120-4 = ""
34120-6 = "...И по её приказу... Ацуко увезли в базилику района Ариуса..."
34120-7 = "Э-Это всё, что мы знаем."
34120-8 = ""
34120-13 = "Вы отправились в район Ариуса... вместе с Сенсеем... спасать подругу?"
34120-14 = "Вот оно как. Хм."
34120-15 = "Почему Сенсей всегда ведёт себя именно как Сенсей?"
34120-16 = "..."
34120-17 = "Но..."
34120-18 = "Всё равно... Всё равно..."
34120-19 = ""
34120-21 = ""
34120-22 = "Это не остановит меня от мести."
34120-23 = "Они все будут меня ненавидеть, да? Может, даже Сенсей..."
34120-24 = "...Но я не могу остановиться."
34120-25 = "Просто не могу."
34120-26 = "Я не прощу отряд Ариуса за то, что они со мной сделали. Мне всё равно, каким чудовищем придётся стать ради мести."
34120-27 = ""
34120-30 = "...Так что не мешайте мне, Сенсей."
34120-31 = ""
34120-39 = "..."
34120-40 = "...Всё чисто! Поднимайтесь!"
34120-41 = "[ns] Пролезть через отверстие в потолке."
34120-44 = ""
34120-45 = "Я была права. Охраны нет."
34120-46 = "Н-Ни души."
34120-47 = "*тяжело дышит* *тяжело дышит*"
34120-48 = "[s] «Это район Ариуса?»"
34120-49 = "Когда-то был. Сейчас это просто старый заброшенный район."
34120-50 = "..."
34120-51 = "Настоящий район дальше. Нужно идти осторожно. Она нас ждёт."
34120-52 = "...Когда-то здесь был полигон."
34120-53 = "[s] «Полигон?»"
34120-54 = "Вообще-то это историческое место. Но после окончания гражданской войны его превратили в полигон."
34120-55 = "[s] «Была гражданская война?»"
34120-57 = "Десять лет назад район Ариуса раскололся надвое, и началась война. Любой студент Ариуса знает."
34120-58 = "[s] Наклониться поближе, чтобы лучше слышать."
34120-59 = "Вас это заинтересовало, Сенсей?"
34120-60 = "Всё не так захватывающе, как кажется. И к нынешней миссии отношения не имеет."
34120-61 = "Я..."
34120-62 = "Я помню это место. Здесь я впервые встретила Азусу."
34120-63 = "..."
34120-64 = ""
34120-66 = ""
34120-67 = "Кажется, это была тренировка по стрельбе... Какого-то ребёнка били за неповиновение приказу."
34120-68 = "[s] «...»"
34120-69 = "Никто ничего не говорил... все просто смотрели в страхе. А она снова и снова вставала!"
34120-70 = "Я помню, как плакала, потому что... п-потому что думала, её нимб разрушат."
34120-71 = "Потом Саори... то есть лидер прибежала..."
34120-72 = "Сейчас не время предаваться воспоминаниям."
34120-73 = ""
34120-75 = ""
34120-76 = "Какой план, лидер?"
34120-77 = ""
34120-79 = ""
34120-81 = "..."
34120-82 = "Пусть Сенсей и с нами, но со всей школой мы не справимся. Как действуем?"
34120-83 = ""
34120-85 = ""
34120-86 = "...Лидер?"
34120-87 = ""
34120-89 = ""
34120-91 = "[ns] «Саори?!»"
34120-92 = "Уа-а-а! Л-Л-Лидер?!"
34120-93 = "*тяжело дышит* *тяжело дышит*"
34120-94 = ""
34120-96 = "Ц. У неё жар. Всё это время терпела."
34120-97 = "Всё это время? Когда она успела заболеть?!"
34120-98 = "Думаю, она больна уже давно. Ранена и четыре дня подряд в бегах. Организм наконец сдал."
34120-99 = "М-Можно ей как-то помочь?"
34120-100 = ""
34120-102 = ""
34120-103 = "[ns] Достать жаропонижающее."
34120-104 = "К-Карман Сенсея волшебный! Там было лекарство!"
34120-105 = "Вы хорошо подготовились."
34120-106 = "[s1] «Я купил его в магическом месте под названием „магазин“.»\n[s2] «У меня ещё есть средство для желудка, кошачьи лакомства и шоколадка.»"
34120-107 = "Я так и знала... Взрослые такие... страшные..."
34120-108 = "Я так и знала... Взрослые такие... страшные..."
34120-109 = "Какое облегчение."
34120-110 = ""
34120-112 = ""
34120-113 = "Вот, лидер. Это поможет."
34120-114 = ""
34120-116 = ""
34120-119 = "*глоток* *тяжело дышит*"
34120-120 = "Лидер сильно страдает..."
34120-121 = "[s] «Пока отдохнём здесь.»"
34120-122 = "...Другого выбора нет."
34120-123 = "М-Мне остаться на страже?"
34120-124 = "Будем дежурить по очереди. Тебе тоже нужно отдохнуть, Хиёри."
34120-125 = "Я первая. Сенсей, вам тоже стоит поспать."
34120-126 = "[s] «Спасибо, Мисаки. Разбуди меня, если что-нибудь случится.»"
34120-127 = "Т-Ты лучшая, Мисаки."
34120-128 = ""
34120-130 = ""
34120-134 = "Я сел в углу и быстро уснул..."
34120-135 = ""
34120-139 = ""
34120-140 = "Сенсей? Наконец-то! Вы меня слышите?"
34120-141 = "Если слышите мой голос, пожалуйста..."
34120-142 = "Я застряла между мирами. Не сон и не реальность. Не знаю, когда смогу выбраться."
34120-143 = "Времени мало, слушайте внимательно."
34120-144 = "Я... совершила ошибку..."
34120-146 = "Я нашла Гематрию во сне и подслушала их встречу."
34120-147 = ""
34120-149 = ""
34120-151 = ""
34120-153 = ""
34120-155 = "Беатриче, которая правит районом Ариуса, пытается провести какой-то ритуал в базилике Ариуса..."
34120-158 = ""
34120-167 = "Конец... конец Кивотоса наступит, когда церемония завершится."
34120-169 = "Я не знаю точно, что она делает, но ясно, что результатом станет наша гибель."
34120-170 = "Похоже, она пытается призвать в Кивотос какое-то существо. Я не уверена."
34120-173 = "Но Беатриче подавила меня в осознанном сне, и я столкнулась с каким-то существом за пределами собственного сознания..."
34120-174 = "Это воздействие оказалось слишком сильным, и моё тело начало разрушаться."
34120-176 = "И я... Я ранила Мику."
34120-177 = "Мне было так страшно, когда я убедилась, что мои видения действительно показывают будущее Кивотоса. Я сорвалась на ней, обвинила её. А потом ей пришлось смотреть, как моё тело начинает отказывать."
34120-179 = ""
34120-181 = "Какой бы путь я ни выбрала... я всегда причиняю ей боль."
34120-183 = "Мика обвинит себя и сделает что-то, о чём пожалеет. Я её знаю."
34120-184 = ""
34120-186 = ""
34120-187 = "Если Беатриче добьётся успеха, Кивотос падёт."
34120-188 = "А Ацуко из отряда Ариуса принесут в жертву для ритуала."
34120-189 = "Застряв здесь, между мирами, я ничего не могу сделать. Мне остаётся лишь надеяться, что вы услышите мою мольбу."
34120-190 = "И Сенсей... Будьте осторожны. Беатриче хочет вашей смерти."
34120-191 = "..."
34120-192 = "Сенсей, вы должны понять: в одиночку вы всё это не решите."
34120-193 = "Вы столько сделали для каждой из нас. Теперь позвольте и нам взять часть тяжести."
34120-194 = "Я как-нибудь выберусь отсюда, предупрежу Нагису и остальных и верну Мику."
34120-195 = "Теперь моя очередь извиняться."
34120-196 = "Так что, Сенсей..."
34120-197 = "Сенсей... Если вы слышите мой голос... пожалуйста..."
34120-198 = ""
34120-200 = ""
34120-201 = ""
34120-202 = "Беги, Сенсей. Уходи как можно дальше от района Ариуса."
34120-203 = ""
34120-205 = ""
34120-206 = ""
34120-207 = ""
34120-208 = ""
34120-209 = "Иначе ты..."
34120-211 = "..."
34120-213 = "Следующий эпизод;Старая история"
