[translation]
1301006-1 = "Проспала"
1301006-2 = "Офис Семинар в Миллениум"
1301006-3 = "Почему в этой академии все постоянно опаздывают? Даже учителя."
1301006-4 = "Если бы они просто ложились вовремя, никто бы не просыпал. Насколько сложно соблюдать одно простое правило...?"
1301006-5 = "Моей работы было бы вдвое меньше, если бы студенты Миллениума умели себя контролировать."
1301006-8 = "*зевает* Который час..."
1301006-9 = "Если задержусь ещё дольше, могу проспать утреннее собрание в Шале."
1301006-10 = "Нужно... побыстрее... закончить..."
1301006-13 = "...А? Уже утро?"
1301006-14 = "Я уснула прямо за работой ученического совета? О нет..."
1301006-15 = "Который час...?"
1301006-16 = "Уже 11 утра?! Я-я опоздала!"
1301006-17 = "Нужно привести волосы в порядок... Нет, сначала подготовить документы к встрече...!"
1301006-18 = ""
1301006-20 = "Исполнительный офис Шале"
1301006-22 = "Я-я опоздала!"
1301006-23 = "[s] «Доброе утро, Юука.»"
1301006-24 = "М-мне очень жаль, Сенсей. Я засиделась за работой и проспала..."
1301006-25 = "..."
1301006-26 = "Подожди. Ты сегодня пришёл вовремя?"
1301006-27 = "[s] «Конечно. Разве вчера ты не говорила мне никогда не опаздывать?»"
1301006-28 = "...Прости!"
1301006-29 = "После вчерашнего я чувствую себя такой лицемеркой... Мне нечем оправдаться."
1301006-30 = "Пойму, если ты на меня обидишься."
1301006-31 = "Я сделаю что угодно, чтобы загладить вину — только скажи!"
1301006-32 = "[s] «Всё нормально, Юука...»"
1301006-33 = "Нет! Правила есть правила! Какой я казначей, если сама не соблюдаю правила, которые устанавливаю?!"
1301006-34 = "Не сдерживайся. Я сделаю что угодно!"
1301006-36 = "[s] «Тогда наказание — отправиться в общежитие и поспать.»"
1301006-37 = "Что...? Но это не наказание."
1301006-38 = "Меня нужно наказать, иначе я ничего не усвою."
1301006-39 = "[s] «На самом деле тебе нужен отдых. Ты слишком много работаешь.»"
1301006-40 = "Но..."
1301006-41 = "[s] «Разве ты не сказала, что сделаешь что угодно?»"
1301006-42 = "*вздох* Стоило догадаться."
1301006-43 = "Как хочешь. Тогда немного отдохну в комнате отдыха."
1301006-44 = "Но это не значит, что теперь тебе можно опаздывать. Я буду следить за твоей посещаемостью как ястреб."
1301006-45 = "И сама больше не опоздаю!"
1301006-47 = "Пока Юука отдыхала, я вместо неё занялся частью дел Семинар."
