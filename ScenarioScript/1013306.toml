[translation]
1013306-1 = "Непредвиденная переменная"
1013306-2 = "Рио позвонила мне."
1013306-5 = "А. Сенсей. У вас есть минутка?"
1013306-6 = "Модификации костюма завершены."
1013306-7 = "Но... проверить их в одиночку я не могу."
1013306-8 = "И Домработника Avant Guard тоже использовать не получится."
1013306-9 = "Не могли бы вы вместо него стать моим помощником, Сенсей?"
1013306-10 = "[s] «Да! Уже иду!»"
1013306-11 = "Спасибо."
1013306-12 = "Тогда... пожалуйста, приходите ко мне в комнату."
1013306-13 = ""
1013306-15 = ""
1013306-20 = "Добро пожаловать."
1013306-21 = "Как я и говорила, модификации моего костюма завершены."
1013306-22 = "...Хм? Выглядит так же?"
1013306-23 = "Да. Снаружи — так и есть."
1013306-24 = "Вместо того чтобы добавлять новые детали и, соответственно, лишний вес, я перепрофилировала уже существующие функции."
1013306-25 = "Если конкретнее, я создала систему обогрева."
1013306-26 = "У меня уже установлен усилитель, повышающий электрические сигналы в теле, поэтому его легко использовать для подачи тепла."
1013306-27 = "Мне нужно было изменить лишь несколько строк кода, и всё заняло меньше времени, чем я ожидала."
1013306-28 = "Однако... систему всё ещё нужно протестировать."
1013306-29 = "Поэтому мне нужна ваша помощь, Сенсей."
1013306-30 = "[s] «Просто скажи, что делать!»"
1013306-31 = "Я повышу температуру костюма, а вам нужно будет следить по тепловизору, равномерно ли тепло распределяется по всей поверхности."
1013306-32 = "[s] «Легко!»"
1013306-33 = "А затем... нужно будет проверить, не уходит ли тепло где-нибудь наружу."
1013306-34 = "Поэтому, пожалуйста, проведите руками по внешней поверхности моего костюма."
1013306-35 = "[s] «Уже не так легко!!»"
1013306-36 = "Только по спине. Остальное я могу проверить сама."
1013306-37 = "Домработник Avant Guard не способен определять температуру прикосновением."
1013306-38 = "Мне нужно подтвердить, что костюм работает как задумано, поэтому обратиться за помощью я могу только к вам, Сенсей."
1013306-39 = "[s] «Н-Ну, если только спина.»"
1013306-40 = "Да. Тогда я в ваших руках."
1013306-42 = "Я измерял температуру тепловизором и проверял утечки, проводя рукой по спине Рио."
1013306-43 = ""
1013306-47 = "А-Ай..."
1013306-48 = "[ns] «П-Прости! Тебе неприятно?!»"
1013306-49 = "Нет. Дело не в этом. Просто неожиданно щекотно."
1013306-50 = "И температура растёт быстрее, чем я рассчитывала..."
1013306-51 = "В любом случае, пожалуйста, продолжайте."
1013306-52 = "[s] «К-Конечно!»"
1013306-53 = "Я продолжил старательно проверять костюм и температуру Рио."
1013306-54 = ""
1013306-59 = "Фух... Хорошая работа. На этом тест завершён."
1013306-60 = "Мне удалось подтвердить, что функция обогрева работает идеально."
1013306-61 = "...Но возникла непредвиденная переменная."
1013306-62 = "[s] «Что за событие?»"
1013306-63 = "Слишком... жарко..."
1013306-64 = "Я заранее подняла температуру в комнате, потому что вы собирались прийти, так что..."
1013306-65 = "Придётся как-то выпустить тепло наружу."
1013306-68 = "Прошу простить."
1013306-71 = "― [log=리오 결전]*вздох*... Так намного лучше.[/log][wa:1390]"
1013306-74 = "― [log=리오 결전]Я забыла учесть температуру в помещении.[/log][wa:530]"
1013306-77 = "― [log=리오 결전]Я, должно быть— слишком отвлеклась,[/log][wa:1210]"
1013306-79 = "― [log=리오 결전]пытаясь получить результат прямо перед собой...[/log]"
1013306-82 = "― [log=리오 결전]...Дайте мне немного отдохнуть.[/log][wa:2130]"
1013306-84 = "― [log=리오 결전]Из-за жары я не могу нормально думать...[/log][wa:680]"
1013306-87 = "― [log=리오 결전]...Сенсей? Почему вы так на меня смотрите...[/log][wa:2870]"
1013306-90 = "― [log=리오 결전]*вздох*![/log][wa:2120]"
1013306-92 = "― [log=리오 결전](О-О чём я... думала...?!)[/log][wa:1050]"
1013306-95 = "― [log=리오 결전]Я-я не специально...! Простите...![/log][wa:2230]"
1013306-97 = "― [log=리오 결전]Т-Теперь со мной всё хорошо, так что...![/log][wa:1750]"
1013306-100 = ""
1013306-101 = "Я-я выпустила тепло наружу!"
1013306-102 = "С остальным справится система охлаждения костюма!"
1013306-103 = "Так что со мной всё хорошо! На сто процентов!"
1013306-104 = ""
1013306-106 = ""
1013306-107 = ""
1013306-108 = ""
1013306-109 = ""
1013306-110 = ""
1013306-111 = "[ns] «Но разве голова у тебя всё ещё не слишком горячая?»"
1013306-112 = "...!!"
1013306-113 = ""
1013306-115 = ""
1013306-117 = "[ns] «Р-Рио...?!»"
1013306-119 = "Я поспешно начал обмахивать Рио, чтобы помочь ей остыть."
1013306-120 = "К счастью, она довольно быстро пришла в себя."
1013306-121 = ""
1013306-122 = ""
1013306-123 = "В этом эксперименте оказалось... слишком много... непредвиденных переменных..."
