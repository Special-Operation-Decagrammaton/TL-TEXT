[translation]
3401-1 = "Слегка необычное утро в Шаньхайцзин 1"
3401-2 = ""
3401-3 = "Раз, два, три, четыре..."
3401-4 = ""
3401-6 = ""
3401-7 = ""
3401-8 = ""
3401-9 = ""
3401-10 = ""
3401-12 = ""
3401-13 = ""
3401-14 = ""
3401-15 = "Фух. В такой час даже Парк Белого Тигра пуст."
3401-16 = "Мм. Только сейчас я могу делать утреннюю разминку, чтобы никто не видел."
3401-17 = ""
3401-19 = ""
3401-20 = ""
3401-21 = ""
3401-22 = ""
3401-23 = ""
3401-24 = ""
3401-25 = "Фуфу. Движение пробуждает мой разум, да и телу идёт на пользу."
3401-26 = "И свобода действовать без постоянного надзора телохранителей и прочих сопровождающих тоже бодрит."
3401-27 = "Хотя... иногда было бы приятно поспать подольше."
3401-28 = "..."
3401-29 = "Хватит сентиментальных грёз. Мне пора возвращаться."
3401-30 = ""
3401-32 = ""
3401-36 = "Только что..."
3401-37 = "Я спряталась, чтобы убедиться, что действительно увидела то, что увидела!"
3401-38 = ""
3401-41 = "Президент... занималась кунг-фу?!"
3401-45 = "Я, Урусибара Кагуя, стала свидетелем чего-то невероятного..."
3401-46 = "Я была уверена, что ужасно ошиблась, ведь ни слухом ни духом не слышала никаких сплетен на эту тему!"
3401-47 = "Говорят, как бы далеко ни были друг от друга две души, достаточно прийти к взаимопониманию, чтобы почувствовать себя старыми соседями."
3401-48 = ""
3401-51 = "И президент наконец поняла нашу преданность и страсть к пекинской опере — и сама приобщилась к ней!"
3401-53 = ""
3401-54 = "Если честно, мне никогда не нравились люди из Генрюмон."
3401-55 = "Они шумные, грубые и заносчивые, и думают, будто устанавливают все правила..."
3401-56 = ""
3401-58 = ""
3401-59 = "...Хотя справедливости ради, порой это необходимое зло."
3401-60 = "Но госпожа всегда была исключением. Для начала, с ней можно договориться, и время от времени она проявляет милосердие."
3401-61 = "Чтобы ТА САМАЯ президент тайком практиковала кунг-фу...!"
3401-62 = "Как же хорошо, что я не прогуляла утреннюю тренировку. Я знала, что не просто так сегодня проснулась раньше обычного!"
3401-63 = "В таком случае надо воспользоваться шансом и пойти к президенту Руми...!"
3401-64 = ""
3401-66 = ""
3401-67 = "Да, нельзя упускать такую возможность! Нужно всем рассказать. Ладно, начну с нашей президентши! Так лучше всего!"
3401-68 = ""
3401-70 = ""
3401-72 = ""
3401-73 = "...В последнее время Клубу пекинской оперы приходится действовать незаметно из-за... одного неприятного случая."
3401-74 = "Разумеется, мы ни разу не усомнились в решении президента!"
3401-75 = "Но мы ужасно боялись, что Клуб пекинской оперы полностью утратил её доверие и нам больше никогда не выпадет шанс доказать свою преданность!"
3401-76 = "Но раз госпожа сама практикует танцы пекинской оперы, значит, в глубине души она нас вовсе не бросила!"
3401-77 = "Как можно сказать, что это не самая волнующая новость на свете?"
3401-78 = "Теперь бюджет Клуба пекинской оперы будет освобождён! Мы устроим самые яркие и изысканные представления пекинской оперы! Да!"
3401-79 = "В последнее время в Клубе пекинской оперы и так царила мрачноватая атмосфера, так что я обязана разнести эту хорошую новость по всему клубу!"
3401-80 = ""
3401-82 = ""
3401-85 = ""
3401-86 = "Значит, Кисаки рано утром практиковала кунг-фу?"
3401-87 = "Именно, президент! Чтобы кто-то кроме меня ценил красоту кунг-фу, да ещё и сама госпожа президент..."
3401-88 = "Как студент, я просто не могу этому не радоваться!"
3401-89 = "Эм... Ну это..."
3401-90 = "..."
3401-91 = "Да. Наверное."
3401-92 = "Тебя что-то тревожит, президент?"
3401-93 = "Нет, ничего."
3401-94 = "(Просто странно. Кисаки, которую я знаю, совсем не из тех, кто с энтузиазмом бросается в кунг-фу.)"
3401-95 = "Так... Что собираешься делать, Рэйдзё?"
3401-96 = "Хм? Ну, эм... Думаю, нужно разнести новость повсюду, всем остальным ученикам."
3401-97 = "Студентов, которые занимаются боевыми искусствами, очень мало не только в Шаньхайцзин, но и во всём Кивотос."
3401-98 = "Даже ещё один новый человек — уже повод всем нам собраться и отпраздновать!"
3401-99 = "Так что, президент! Я возьму сегодня отгул и займусь этим!"
3401-100 = ""
3401-102 = ""
3401-103 = ""
3401-104 = "Энтузиазм — это, конечно, хорошо, но..."
3401-105 = ""
3401-107 = ""
3401-108 = "Ах, ну, нечасто увидишь Рэйдзё настолько воодушевлённой."
3401-109 = "Но Кисаки... Всё это выглядит немного странно."
3401-110 = "Если Кисаки и правда тайком практикует кунг-фу..."
3401-111 = "...может, я незаметно поддержу её — угощениями!"
3401-113 = ""
3401-114 = "Это правда, президент?"
3401-115 = "Конечно! Я видела это собственными глазами!"
3401-116 = ""
3401-119 = "Я держалась подальше, чтобы меня не заметили, поэтому кто-то может усомниться в моих словах..."
3401-120 = "Но я увидела истину! Не чем иным, как собственными глазами!"
3401-121 = "Это движение, рука, описывающая изящный круг, позы, устремлённые к небу! Иного вывода быть не может! Она исполняла..."
3401-122 = "...сам «танец пекинской оперы» Клуба пекинской оперы!"
3401-123 = "Танец пекинской оперы... Высшая точка всех движений из представлений пекинской оперы..."
3401-124 = "Уникальный танец Клуба пекинской оперы!"
3401-125 = "Но, президент, разве это не странно? Откуда госпожа знает тайный танец клуба? Он ведь тайный, разве нет?"
3401-126 = "Ничего странного! Ответ совершенно очевиден!"
3401-127 = ""
3401-130 = "Госпожа знает всё!"
3401-131 = ""
3401-134 = ""
3401-135 = "Если так сказать, то действительно всё сходится!"
3401-136 = "Но даже самый гладкий и чистый нефрит может иметь изъян..."
3401-137 = "Танец госпожи, несомненно, повторял прекрасную плавность пекинской оперы, но кое-где движения были... неотточенными и несовершенными."
3401-138 = "Поэтому сейчас самое время Клубу пекинской оперы сделать свой ход!"
3401-139 = "Понимаю! Когда ты так говоришь, мне и правда кажется, что мы обязаны это сделать!"
3401-141 = ""
3401-142 = "Слышала? Слышала? Госпожа была—"
3401-143 = "А, это? Да, я тоже слышала! Ах, если члены Генрюмон услышат, как мы это обсуждаем, нас могут отругать..."
3401-144 = "Но разве это не потрясающе? ТА САМАЯ президент занимается таким, да ещё и с самого утра..."
3401-145 = "Я её понимаю. Если люди узнают, у неё могут начаться проблемы."
3401-149 = ""
3401-151 = "Хм, вы же из Клуба исследования боевых искусств? Что происходит?"
3401-152 = "А! Какая встреча! Хорошо, что мы на вас наткнулись!"
3401-153 = "Вы, наверное, знаете лучше всех, но речь о «том самом», что касается госпожи..."
3401-154 = "Пусть даже временно, мы хотели узнать, не хотите ли вы объединиться с Клубом исследования боевых искусств!"
3401-155 = "..."
3401-156 = "Ну, вы много раз помогали мне в прошлом."
3401-157 = "Давайте. Честно говоря, в этих обстоятельствах я бы поступила так же."
3401-158 = "Рассчитываю на вас в дисциплине и тренировках!"
3401-159 = "Да! Ради дисциплины и тренировок!"
3401-160 = "Раз уж об этом заговорили..."
3401-161 = "Не хочешь стать почётным членом Клуба исследования боевых искусств?"
3401-163 = "Ах... это, пожалуй, уже слишком. Прошу прощения. Работа на Променаде занимает у меня всё время."
3401-164 = "Вот как..."
3401-166 = ""
3401-167 = "Все собрались?"
3401-168 = ""
3401-171 = "Да, президент!"
3401-173 = "Это Парк Белого Тигра, где госпожа приходит практиковать танец пекинской оперы ранним утром."
3401-174 = "Разумеется, мы, члены Клуба пекинской оперы, прекрасно знаем это место, ведь часто используем его как открытую сцену."
3401-175 = "Неважно, насколько оно нам знакомо! Стоит другому человеку выйти на сцену — и само существование этого места меняется!"
3401-176 = "Говорят, чтобы подняться высоко, сначала нужно начать снизу."
3401-177 = "И потому именно здесь..."
3401-178 = "Мы исполним для госпожи наш изысканный танец пекинской оперы! Мы исполним её желание!"
3401-179 = ""
3401-182 = ""
3401-183 = "Мы пойдём за вами куда угодно, президент!"
