[translation]
62010-1 = "Эпизод 1;Анонимная общественная помощь"
62010-2 = ""
62010-3 = "Нас позвал звук того, кто нуждается в помощи, и мы двинулись к нему, следуя своему долгу!"
62010-4 = ""
62010-7 = ""
62010-8 = "В этом вообще нет никакого смысла!"
62010-9 = "[s] «Нет... Есть. Когда речь о Мине — есть.»"
62010-10 = "Что? Вы их знаете? Я их в жизни не встречала."
62010-11 = ""
62010-14 = ""
62010-15 = "А, Субару! Они—"
62010-16 = "[s] «?!?!»"
62010-18 = "[ns] «П-Подождите!»"
62010-19 = ""
62010-21 = ""
62010-28 = "[ns] «Все здесь?»"
62010-29 = "Д-Да..."
62010-30 = "Здесь. Но... зачем всё это было?"
62010-31 = "Да, прошу, просветите меня. Вместо того чтобы так бесцеремонно хватать меня за руку, можно было просто объяснить..."
62010-32 = "В чём проблема, Сенсей?"
62010-33 = "У вас было очень-очень страшное лицо! Хотите, Ханаэ прогонит его улыбкой? Хи-хи!"
62010-34 = "[s] «Для начала...»"
62010-35 = ""
62010-38 = ""
62010-39 = "Я знаю... этих людей?"
62010-40 = ""
62010-42 = ""
62010-44 = ""
62010-46 = "Ага. Это Рыцари исправительного курса."
62010-47 = "Рыцари исправительного курса Тринити."
62010-48 = "Рада встрече, рыцари. Полагаю, это наша первая встреча после столкновения в Четвёртом святилище."
62010-49 = "П-Похоже на то. Ага! Какой суматошный был день, да? Эм, как поживает отряд?"
62010-50 = "Кстати, а где та монашка? Та, что в очень... выразительном наряде?"
62010-52 = "Сакурако занята обязанностями главы Сестринства—"
62010-53 = ""
62010-56 = ""
62010-57 = "О-Она занята экзаменами! То есть подготовкой к экзаменам!"
62010-59 = "А-Ага... Тот экзамен..."
62010-60 = ""
62010-62 = ""
62010-63 = "А...? Но разве тогда... вам всем тоже не нужно учиться?"
62010-64 = "Дело в том, что—"
62010-65 = ""
62010-69 = "Протягивать руку помощи нуждающимся нельзя прекращать только потому, что наступил экзаменационный сезон!"
62010-70 = "Клянусь своей честью: наши храбрые Рыцари исправительного курса невредимыми пройдут и через помощь другим, и через экзамен!"
62010-71 = "Вот истинное воплощение помощи!"
62010-72 = "И что самое важное, сейчас я занимаю первое место в рейтинге пробных экзаменов и ещё ни разу не уступила его."
62010-73 = "[s] «Вообще-то это невероятно. Ты потрясающая, Мине.»"
62010-74 = ""
62010-76 = ""
62010-77 = "С-Спасибо, Сенсей..."
62010-78 = "[s1] «И всё же у меня есть просьба ко всем присутствующим.»\n[s2] «Не говорите здесь о Тринити или Рыцарях помощи.»"
62010-79 = ""
62010-80 = ""
62010-82 = ""
62010-84 = "П-Почему нам нужно так делать?"
62010-85 = "Я тоже в недоумении. Зачем окутывать наш праведный путь помощи завесой обмана..."
62010-86 = ""
62010-88 = ""
62010-90 = ""
62010-91 = ""
62010-92 = "Капитан? Вообще-то мне кажется, слова Сенсея имеют смысл."
62010-93 = "Правда? Но разве мы не пришли сюда помогать этим измученным студентам?"
62010-94 = "Видите ли... Если мы не скроем, что мы Рыцари исправительного курса, эм... На нашем пути помощи вырастут колючие лозы!"
62010-95 = "Вот... как?"
62010-96 = "Д-Да! В Писании ведь тоже есть что-то вроде: «Пусть левая рука не знает, что делает правая»!"
62010-97 = "Я не возражаю против истинности этих слов, но разве сама мысль не больше подходит Сестринству?"
62010-98 = "Думаю, у Сенсея должна быть очень веская причина!"
62010-99 = ""
62010-101 = ""
62010-102 = "Понимаю. Тогда я доверюсь вашему суждению. Сенсей, мы выполним вашу просьбу."
62010-103 = "[s] «Спасибо! И ты правда лучшая, Сэрина!»"
62010-104 = ""
62010-106 = ""
62010-107 = "Я-Я? Хи-хи. Спасибо."
62010-109 = "...Понимаю. Хотя моё сердце всё ещё сопротивляется, я уловила ваше намерение."
62010-110 = "Однако именно в такие времена человек должен быть готов выйти вперёд и гордо провозгласить наш посыл помощи!"
62010-111 = "Нам достаточно действовать искренне, и Ариус ответит тем же."
62010-112 = "[s] «Я тебя умоляю... Пожалуйста?»"
62010-113 = "Я дала вам слово. И с радостью исполню просьбу Сенсея."
62010-114 = ""
62010-116 = ""
62010-117 = "Пока мы здесь, ни слова о Рыцарях исправительного курса или Тринити не слетит с наших губ."
62010-118 = "[s] «Остальные тоже согласны?»"
62010-119 = ""
62010-121 = ""
62010-122 = ""
62010-125 = ""
62010-127 = ""
62010-128 = "Д-Да..."
62010-129 = "Тогда... Капитан...?"
62010-130 = "Пока мы здесь, можно нам называть вас просто... Мине?"
62010-131 = "Если мы будем обращаться к вам «капитан», это может вызвать подозрения."
62010-132 = "Прошу прощения? Однако..."
62010-133 = "...Нет. В этой обстановке такое обращение и правда звучало бы странно. Тогда, полагаю..."
62010-134 = "П-Пожалуйста, называйте меня так."
62010-135 = "Да! Ка— Мине!"
62010-136 = ""
62010-138 = ""
62010-139 = "«Мине»..."
62010-140 = "Я смогу, Мине..."
62010-141 = ""
62010-143 = ""
62010-144 = "П-Прошу прощения! Я не хотела вас обидеть! Всё только из-за обстоятельств!"
62010-145 = "Н-Ничего страшного."
62010-146 = "На самом деле мне даже приятно. «Мине». Разве это не делает меня похожей на вполне обычного, дружелюбного студента?"
62010-147 = ""
62010-149 = ""
62010-151 = "Простите, что перебиваю, но если все готовы..."
62010-152 = "Рыцари исправительного курса... Нет. Анонимный клуб волонтёрской помощи прибывает в Ариус, чтобы нести свой посыл помощи."
62010-153 = "Все поняли?"
62010-154 = "Поняли! Мы правда очень благодарны за всё это, я просто хотела спросить..."
62010-155 = "Ты и остальные члены отряда... точно не против?"
62010-156 = "Не волнуйся, Сэрина. Если нас спросят, откуда мы, мы без колебаний ответим: «Из Ариуса»."
62010-157 = "..."
62010-158 = "Но в действительности мы где-то посередине."
62010-160 = "...И даже это слишком щедро сказано."
62010-161 = "Хм-м-м... Значит, теперь все счастливы, да? Ура! Я так рада!"
62010-162 = "Фу-фу. Всегда приятно находиться рядом с таким жизнерадостным человеком. Буду рада работать с тобой."
62010-163 = "И мне!"
62010-164 = "..."
62010-165 = "Ханаэ рядом с нами всё равно что энергетическая таблетка. Может, обменяемся, Сэрина? Ты могла бы взять... Хиёри вместо неё."
62010-167 = "Ч-что?!"
62010-168 = "ЧТООО?!"
62010-169 = "..."
62010-170 = "П-Приятно познакомиться, Сэрина, Мине..."
62010-171 = "С-Сенсей? Можно ли считать это предложение... формой помощи?"
62010-173 = "А? А куда я иду?"
62010-174 = "Искренне прошу прощения. Просто Ханаэ сияла так ярко, что я не удержалась и пошутила."
62010-176 = "А-А! Теперь понимаю. Ханаэ и правда словно цветок ипомеи на рассвете, правда?"
62010-177 = "Хи-хи. Я всё время знала, что это шутка... Конечно знала..."
62010-178 = ""
62010-180 = ""
62010-182 = "Угх..."
62010-183 = "[s] «...Ты в порядке?»"
62010-184 = "Я немного вымоталась..."
62010-185 = "[s] «Знакомое чувство...»"
62010-186 = ""
62010-189 = "[ns] «И что теперь?»"
62010-190 = ""
62010-193 = ""
62010-194 = "Прекрасный вопрос, Сенсей."
62010-195 = "Для начала мы должны заложить основу, из которой с силой прорвётся дух помощи."
62010-196 = ""
62010-198 = ""
62010-199 = "Рыц... Нет. Первой миссией Анонимного клуба волонтёрской помощи станет создание лазарета!"
62010-204 = "Временный лазарет"
62010-206 = "Отличная работа, Мине! И вы тоже, Сенсей!"
62010-207 = "Хорошая работа, Сенсей. И ты тоже, Мине."
62010-208 = "«Мине»..."
62010-209 = ""
62010-211 = ""
62010-212 = "Получилось быстрее, чем вы ожидали? Ну конечно! Это наша специальность!"
62010-213 = ""
62010-217 = "Здравствуйте, Сенсей. И..."
62010-218 = ""
62010-223 = ""
62010-224 = "..."
62010-225 = "Здравствуйте, «волонтёры»."
62010-226 = ""
62010-228 = ""
62010-229 = "З-Здравствуйте. Вы здесь... президент школьного совета?"
62010-230 = "У нас здесь нет подобных должностей и титулов."
62010-231 = "Простите. Мы пока не до конца знакомы с местными порядками..."
62010-232 = ""
62010-235 = ""
62010-236 = "Мы не...?"
62010-237 = "Прошу прощения...?"
62010-240 = "Я едва успел остановить этих двоих, прежде чем они сказали лишнее..."
62010-243 = "То есть вы хотите сказать, что из всех мест выбрали именно это для волонтёрской работы, ничего не изучив заранее и не имея никакой особой причины?"
62010-244 = "Э-Это...!"
62010-245 = "..."
62010-246 = "Да, всё именно так. Вы видите в этом проблему?"
62010-247 = "К-Кап—Мине?!"
62010-248 = "Не сказала бы, что прямо проблему, но вы понятия не имеете, какие опасности могут ждать впереди."
62010-249 = "И несмотря на это, вы пришли сюда помогать несчастным ради собственного чувства удовлетворения."
62010-250 = "В каком-то смысле это поразительно храбро."
62010-251 = "Ах, я предположила, что ваши возражения будут сложнее. Ведь мой ответ предельно прост."
62010-252 = ""
62010-254 = ""
62010-255 = "Хм?"
62010-256 = "Вы страдаете от недостатка помощи!"
62010-257 = "«Помощи»...?"
62010-258 = "Именно! А единственное лекарство — ответить целым цунами помощи!"
62010-259 = "Если нашими усилиями мы сможем уменьшить число страдающих хотя бы на одного человека, мы не имеем права сдаваться!"
62010-260 = "В этом и заключается сущность помощи... и общественного служения!"
62010-261 = "Всё остальное не имеет значения!"
62010-263 = "Ага... ха-ха..."
62010-264 = "Это невероятно, Мине!"
62010-265 = ""
62010-267 = ""
62010-269 = "..."
62010-270 = "Действительно, «невероятно». Всё как я слышала."
62010-271 = ""
62010-273 = ""
62010-274 = ""
62010-275 = "(Как она слышала?!)"
62010-276 = ""
62010-278 = ""
62010-279 = "Да. Я многое слышала о Рыцарях исправительного курса Тринити."
62010-280 = "[s] «Что вы сказали?!?!»"
62010-281 = "Р-Рыцари исправительного курса? Ха! А-ха-ха! Это точно не мы трое! Мы... э-э... Лечебные солдаты...?"
62010-282 = "Ха-ха. Ценю старания, но можете прекращать спектакль."
62010-283 = "Вы правда думали, что сможете провести студентов Тринити мимо меня, из всех людей?"
62010-284 = "..."
62010-285 = "Уверена, никто не хочет затягивать, так что сразу к делу."
62010-286 = "Просто продолжайте изображать клуб общественной помощи, который пришёл помогать."
62010-287 = "Не лезьте дальше своего дела, и я позволю... это."
62010-288 = "Но знайте: если бы здесь были Чаепитие или Сестринство, разговор был бы совершенно другим."
62010-289 = "Однако я знаю, что Рыцари исправительного курса — довольно необычный клуб даже по меркам Тринити."
62010-290 = "Вы... всё это знаете?"
62010-291 = "Ничего особенного."
62010-292 = "Когда-то мы были одной академией, разве нет?"
62010-293 = "...!"
62010-294 = "Что ж, на этом всё. Не высовывайтесь, держите рот на замке — и я закрою глаза на ваше присутствие."
62010-295 = "Все согласны?"
62010-296 = ""
62010-298 = ""
62010-300 = ""
62010-301 = "...Поняла. Мы согласны на ваши условия."
62010-302 = "Спасибо."
62010-303 = "А капитан Рыцарей исправительного курса с вами не пришла? Хотя, наверное, логично."
62010-304 = "Она ведь одна. Руководить таким огромным клубом, должно быть, трудно и при этом участвовать во всех его делах."
62010-305 = "?!"
62010-306 = "А? Это..."
62010-307 = "Т-Точно! Наш капитан сейчас оказывает помощь другим нуждающимся! Поэтому и отправила нас! Ага... ха-ха..."
62010-308 = "Да. Именно... так. В общих чертах."
62010-309 = ""
62010-311 = ""
62010-312 = "Лааадно... Ну, в любом случае рада это слышать."
62010-313 = ""
62010-315 = ""
62010-316 = "Я и про неё слышала. Говорят, она воинственная командирша, которая сносит всё и всех на своём пути."
62010-317 = "Представляете, если бы КТО-ТО ТАКОЙ пришёл СЮДА?"
62010-318 = ""
62010-320 = ""
62010-321 = "...Я вынуждена прервать вас. Кажется, у вас возникло серьёзное заблуждение."
62010-322 = "Капитан Рыцарей исправительного курса посвятила саму жизнь и душу делу распространения помощи!"
62010-323 = "Ха-ха-ха. У нас таких обычно называют тупоголовыми невеждами."
62010-324 = "Прошу следить за словами. Она действует искренне и с непоколебимой решимостью."
62010-325 = "Так легкомысленно унижать её усилия и характер..."
62010-326 = "...Вы, Рыцари исправительного курса, и правда доверяете и уважаете друг друга, да?"
62010-327 = "Понятно. Тогда двинемся дальше."
62010-328 = "Моё присутствие только отвлечёт от вашей «общественной помощи», поэтому я уйду."
62010-329 = "Если что-нибудь случится, эм... В общем, позовите меня."
62010-330 = ""
62010-332 = ""
62010-334 = ""
62010-335 = "М-Мине..."
62010-336 = "Мине..."
62010-338 = "..."
62010-339 = "Не тревожьтесь, Сэрина, Ханаэ. Это лишь ещё одна причина полностью посвятить себя нашей миссии."
62010-341 = ""
62010-342 = "Д-Да..."
62010-343 = ""
62010-346 = ""
62010-347 = "Но прежде я ненадолго удалюсь отдохнуть. Прошу простить."
62010-348 = ""
62010-351 = ""
62010-352 = "Конечно! Отдыхайте сколько нужно! Ханаэ, давай пока перенесём те коробки снаружи?"
62010-353 = "Ладушки! Оставь это мне!"
62010-354 = ""
62010-356 = ""
62010-358 = "..."
62010-359 = "[s] «Эй. Ты в порядке?»"
62010-360 = ""
62010-362 = ""
62010-363 = "Разумеется. Я..."
62010-364 = "..."
62010-365 = "Полагаю, пытаться скрыть это от вас было бы глупостью."
62010-366 = ""
62010-368 = ""
62010-369 = "Когда сталкиваешься с такой бездонной яростью, которая кипит прямо под поверхностью... Какую правильную помощь вообще можно предложить?"
62010-370 = "[s] «...Вот что ты почувствовала?»"
62010-371 = "...Да."
62010-372 = "Именно эти мысли заставили меня промолчать."
62010-373 = "Правильная помощь... Это само по себе и есть помощь."
62010-374 = "Принять ненависть тех, кто всё это время жил здесь."
62010-375 = ""
62010-377 = ""
62010-379 = ""
62010-381 = "Если бы только этого было достаточно, чтобы она рассеялась, я принимала бы её снова и снова. Но они по-прежнему остаются в этом кипящем котле ненависти."
62010-382 = "...Помощь — это общение. Отношения. Если я протягиваю руку, а её отвергают, как это может называться помощью?"
62010-383 = "Возможно, моё убеждение цинично. Но нельзя надеяться убедить человека, если он хотя бы не оставляет дверь приоткрытой, чтобы вы могли заглянуть внутрь."
62010-384 = "Я уже видела такое. Люди намертво заколачивают вход, одновременно молясь, чтобы однажды пришёл кто-то достаточно сильный и полностью разнёс их баррикады."
62010-385 = ""
62010-387 = ""
62010-388 = "...Сенсей? Вас что-то тревожит? Вы ранены?"
62010-389 = "[s3] «Я снова и снова всё обдумывала, но тогда мне следовало поступить правильно.»\n[s4] «Мне не стоило оставлять всё как есть — и уж тем более так быстро.»"
62010-392 = "..."
62010-393 = "Прошлое всегда самый суровый наш критик. Нельзя умалять всё, что вы сделали для этого места и для нас, из-за ошибок и недостатков, которые вы теперь видите."
62010-394 = "Однако что касается этой ситуации..."
62010-395 = "Для них мы из Тринити, а значит, мы Рыцари исправительного курса."
62010-396 = "Если мы заявим, что сопереживаем им или понимаем их беды, ненависть студентов Ариуса лишь укоренится ещё глубже."
62010-397 = "Поэтому, возможно, само моё желание помочь коренится в высокомерии."
62010-398 = ""
62010-400 = ""
62010-402 = "И всё же моя наивная душа хочет восстановить мост, который нас связывает."
62010-403 = "Через недоверие и невежество мы никогда не придём к лучшему завтра."
62010-404 = "Но это... пока лишь красивые слова."
62010-405 = "[s] «Знаешь, Мине, кажется, я впервые вижу тебя уставшей»."
62010-406 = "Фуфу. Вполне возможно."
62010-407 = "Мне кажется, и вы сегодня ведёте себя не совсем как обычно, Сенсей."
62010-408 = ""
