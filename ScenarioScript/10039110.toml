[translation]
10039110-1 = "Послесловие;Дом с привидениями после уроков"
10039110-3 = "О... так вот как выглядит кафе Тринити в стиле дома с привидениями..."
10039110-4 = "Ладно, посмотрим, насколько у них страшнее, чем у нас."
10039110-5 = "Да, интересно, как всё устроено!"
10039110-6 = ""
10039110-11 = ""
10039110-12 = ""
10039110-15 = ""
10039110-16 = "Р-р-р, добро пожаловать..."
10039110-17 = ""
10039110-20 = ""
10039110-21 = "Я... монстр Франкенштейна! Я пришла... принять ваш заказ!"
10039110-22 = "Эм... это вообще не страшно."
10039110-23 = "Д-Да... Даже мило..."
10039110-24 = ""
10039110-26 = ""
10039110-27 = "Хм..."
10039110-28 = "Не сработало. Хорошо, следующий номер..."
10039110-29 = ""
10039110-31 = ""
10039110-32 = "Древний злой дух, я призываю тебя!"
10039110-34 = "Владыка смерти, восстань из глубин ада! Распространи проклятие отчаяния и задуши землю!"
10039110-35 = ""
10039110-38 = ""
10039110-39 = "Ик!"
10039110-40 = "О, сейчас будет круто..."
10039110-41 = ""
10039110-43 = ""
10039110-47 = ""
10039110-49 = ""
10039110-51 = ""
10039110-52 = "Перегнула ты с обещаниями, Нацу..."
10039110-53 = ""
10039110-55 = ""
10039110-56 = "Эм..."
10039110-57 = ""
10039110-59 = ""
10039110-61 = "Г-Грааах... Я... древняя мумия ужаса..."
10039110-62 = "Закажите что-нибудь, иначе падёт на вас моё проклятие..."
10039110-63 = ""
10039110-65 = ""
10039110-67 = ""
10039110-68 = "Мило, но, эм... мы точно в то кафе пришли?"
10039110-69 = "Я думала, здесь должно быть страшно."
10039110-71 = "Эм..."
10039110-72 = "Нацу, дурочка, что мы вообще здесь делаем?!"
10039110-73 = "Уф... Но у мумии такая богатая история. Как это могло не сработать?"
10039110-74 = "Хорошо. Я надеялась, что до этого не дойдёт..."
10039110-75 = ""
10039110-77 = ""
10039110-78 = "Пусть врата преисподней распахнутся, выпуская страшного теневого зверя!"
10039110-80 = "Явись, проклятое создание! Пусть все познают ярость Кат Палуга!"
10039110-81 = ""
10039110-83 = ""
10039110-85 = ""
10039110-86 = "Не называй меня так! Я просто оборотень!"
10039110-87 = "И ты готова на этом остановиться? «Просто оборотень?» Настоящий ужас достоин настоящего имени!"
10039110-88 = ""
10039110-90 = ""
10039110-91 = "А теперь, зверь! Эти глупцы вошли в наши владения! Прими их заказы! Пусть их животы созреют к твоей жатве!"
10039110-92 = ""
10039110-94 = ""
10039110-96 = "Я тебя сейчас пожну!"
10039110-97 = ""
10039110-100 = ""
10039110-101 = ""
10039110-102 = ""
10039110-104 = ""
10039110-105 = ""
10039110-106 = ""
10039110-107 = ""
10039110-109 = ""
10039110-110 = "Так это кафе с комедийными сценками, да...?"
10039110-111 = "Да? Тогда это БЫ объясняло..."
10039110-114 = "Мы здорово подводим посетителей."
10039110-115 = "Не волнуйся, всё это часть великой стратегии."
10039110-116 = "Мы ещё не показали настоящий ужас."
10039110-117 = ""
10039110-119 = ""
10039110-122 = "...Вообще-то снаружи НАПИСАНО «Дом с привидениями»..."
10039110-123 = "Ну а чего вы на самом деле ожидали? Да ладно."
10039110-124 = "Это фестиваль. Просто давайте получать удовольствие."
10039110-125 = "Раз уж мы здесь, можно взять десерт. Что у них есть?"
10039110-126 = "Эй, у вас меню есть?"
10039110-127 = ""
10039110-132 = ""
10039110-133 = "...А?"
10039110-134 = ""
10039110-138 = "Ч-Что это было...?"
10039110-139 = ""
10039110-141 = ""
10039110-145 = ""
10039110-147 = ""
10039110-148 = "..."
10039110-150 = "..."
10039110-152 = "Э-Эм..."
10039110-153 = ""
10039110-155 = ""
10039110-156 = ""
10039110-157 = "..."
10039110-158 = "Н-Нам у тебя заказывать или..."
10039110-159 = ""
10039110-161 = ""
10039110-162 = ""
10039110-164 = ""
10039110-166 = ""
10039110-167 = "А-А-А-А!!"
10039110-168 = "Б-БЕЖИМ! Валим отсюда!"
10039110-169 = ""
10039110-171 = ""
10039110-173 = "..."
10039110-174 = "П-Почему они убежали? Я просто стояла неподвижно, как сказала Нацу..."
10039110-175 = "Это было идеально. Без замечаний."
10039110-176 = "Высокое напряжение ужаса, убийца в маске... Мисс Минт!"
10039110-177 = "Это бесстрастное лицо, шаги всё ближе и ближе, тяжёлая бита скребёт по полу, пока она приближается для смертельного удара..."
10039110-179 = "...и сердце уже не знает ничего, кроме страха."
10039110-180 = "Н-Нацу, эм... всё нормально?"
10039110-181 = "Да. Всё идеально. Я уверена."
10039110-183 = "Как это идеально? Посетители убежали! Они даже ничего не заказали!"
10039110-184 = "Да кому до этого дело, когда перед нами сама икона следующего поколения хоррора!"
10039110-185 = "Из этого скромного начала в нашем разношёрстном кафе призраков Айри взойдёт к славе!"
10039110-186 = "Отпугнув всех наших клиентов?!"
10039110-187 = "Такими темпами мы разоримся! И что потом делать со всеми этими напитками и десертами?"
10039110-188 = "Продадим их тем, кто заслужит их, победив собственные страхи!"
10039110-190 = "Не слишком ли высокую планку ты ставишь?!"
10039110-191 = ""
10039110-193 = ""
10039110-195 = ""
10039110-196 = ""
10039110-199 = "[ns] «Ты отлично справилась, Айри.»"
10039110-200 = ""
10039110-202 = ""
10039110-203 = "С-Сенсей? Вы всё это сейчас видели?"
10039110-204 = "[s1] «Я ещё видел древнего духа.»\n[s2] «И теневого зверя.»"
10039110-205 = ""
10039110-206 = ""
10039110-209 = ""
10039110-210 = "А-а-а! Вы всё это время смотрели? Просто... забудьте всё, что здесь увидели, ладно?!"
10039110-211 = "Особенно «теневого зверя.»"
10039110-213 = "Что думаете, Сенсей? Вам нравится кафе?"
10039110-214 = "[s] «Да. Здесь мило.»"
10039110-216 = "[ns3] «А вот Айри пугает до смерти.»\n[ns4] «Отличное выражение лица, поза, реквизит...»"
10039110-220 = "Д-Думаете...? Мне вроде приятно это слышать, но в то же время как-то..."
10039110-221 = "Это комплимент, настоящий комплимент. Комплимент высшего уровня."
10039110-222 = "Дар вселять страх... Ты кое-что умеешь, Айри. Президентство тебе точно по плечу."
10039110-223 = "Я-Я бы так не сказала..."
10039110-224 = ""
10039110-226 = ""
10039110-228 = "Хотела бы я уметь быть такой страшной. А то мне ужасно неловко..."
10039110-229 = "[ns] «Попробуй ещё раз, Ёшими. Напугай меня.»"
10039110-230 = ""
10039110-232 = ""
10039110-233 = "НИ ЗА ЧТО!"
10039110-235 = "Раз уж речь зашла, нам и правда стоит доработать наши образы. В конце концов, это дом с привидениями."
10039110-236 = "У нас «процент попаданий» всего 25%. Этого недостаточно."
10039110-237 = "Может, стоит пересмотреть то, как вы понимаете своих персонажей."
10039110-238 = ""
10039110-241 = ""
10039110-242 = "А?"
10039110-243 = "К чему ты клонишь?"
10039110-245 = "Я о том, что как бы наспех ни были сделаны декорации и костюмы, наша обязанность — раскрыть персонажей по максимуму."
10039110-246 = "Вспомните истоки наших персонажей: книги, фильмы, продолжения. По одному только числу жертв мы уделаем Айри."
10039110-247 = "Н-Но всё равно..."
10039110-249 = "Никаких «но»! Нашей милоте здесь не место!"
10039110-250 = ""
10039110-252 = ""
10039110-253 = "Там, снаружи, мы студенты, но в этих стенах мы — СОЗДАНИЯ НОЧИ!"
10039110-254 = "А кто вообще говорил о милоте?"
10039110-255 = "Тогда изучите всё как следует! Исследуйте и освойте сами основы страха!"
10039110-256 = "Ой, кто бы говорил! Думаешь, с ТАКИМ видом ты кого-нибудь напугаешь?"
10039110-257 = "Монстр Франкенштейна — самое нестрашное создание здесь. Вся СУТЬ его истории в том, что он едва ли вообще монстр!"
10039110-258 = "Ага, так что может уже заткнёшься?"
10039110-259 = "Угх, понятно. Раз не можешь опровергнуть мой довод, решила прибегнуть к силе!"
10039110-260 = ""
10039110-262 = ""
10039110-263 = ""
10039110-264 = ""
10039110-265 = "Я знаю, как сделать её страшнее. Давайте подвесим её вверх ногами!"
10039110-266 = ""
10039110-268 = ""
10039110-269 = ""
10039110-271 = "Монстр Франкенштейна не сдастся! Пока не освободится от своего создателя и не найдёт идеальный десерт!"
10039110-272 = ""
10039110-277 = ""
10039110-278 = "Э-Эй, народ? Может, все немного успокоимся и подумаем?"
10039110-279 = "Какая у нас вообще цель? Мы правда должны пугать посетителей?"
10039110-280 = ""
10039110-283 = ""
10039110-284 = "Эм... Разве нет?"
10039110-286 = "Потому что это, вообще-то, не настоящий дом с привидениями. Это кафе В СТИЛЕ дома с привидениями."
10039110-287 = "Оно НЕ ОБЯЗАНО быть страшным."
10039110-288 = "...Справедливо."
10039110-289 = "...Возможно, мы так увлеклись этой темой, что сами стали её пленниками и жертвами..."
10039110-290 = "Да, давайте просто сделаем «миленько-страшно.»"
10039110-291 = ""
10039110-294 = ""
10039110-295 = "Погодите, мы СЕЙЧАС меняем курс? А что стало с твоим гениальным планом, Нацу?"
10039110-296 = "Идеальных планов не бывает. Нужно уметь приспосабливаться."
10039110-297 = "О нет, так легко ты не отделаешься! Это была твоя идея!"
10039110-298 = "Эй, эм, и какой тогда новый план?"
10039110-299 = ""
10039110-301 = ""
10039110-303 = ""
10039110-304 = "[ns] «Приятно видеть, что у всех столько энергии.»"
10039110-307 = "Они переделали дом с привидениями в стиле «миленько-страшно». После этого все посетители остались довольны."
10039110-308 = ""
10039110-311 = "А Айри обрела культ поклонников среди любителей ужасов..."
