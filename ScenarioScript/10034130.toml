[translation]
10034130-1 = "5 дней назад: Guppa"
10034130-3 = "Хм... Не уверена, что играю это правильно. Может, немного мимо."
10034130-4 = "Я стараюсь максимально подстроиться под звук. Может, проблема в моей технике..."
10034130-6 = "Как насчёт разбиться на группы и проверять позы и движения друг друга?"
10034130-7 = "То есть нам самим трудно увидеть, как мы играем. Даже если бы были зеркала, мы бы сосредоточились на игре, а не смотрели на себя."
10034130-8 = "Вообще-то звучит разумно. И как выберем команды? Сыграем в Guppa?"
10034130-9 = ""
10034130-12 = ""
10034130-14 = "Хм?"
10034130-15 = "G-Guppa?"
10034130-16 = "Guppa...?"
10034130-17 = ""
10034130-19 = ""
10034130-20 = "...Ха."
10034130-21 = ""
10034130-23 = ""
10034130-24 = "...Пф."
10034130-25 = "Пф... Пффф! Хаха...! Gu... Пф...! Guppa...! Аха!!"
10034130-27 = "...Никогда раньше не видела, чтобы она так смеялась."
10034130-28 = "Я тоже..."
10034130-30 = "О-о-о...!!"
10034130-31 = "*пыхтит* *задыхается*... *пых*... Не могу дышать... *пыхтит* *задыхается*... Простите, простите."
10034130-32 = "Но Guppa, серьёзно? Какой сейчас вообще год? Я даже НЕ ДУМАЛА об этой игре уже... вау, да."
10034130-33 = "Ха... Ха... Хааа...!!"
10034130-34 = "М-мне кажется, это милая идея, Ёшими!"
10034130-35 = "Возможно, мы будем первыми, кто сыграет в неё в этом веке!"
10034130-36 = "Гьяхх...!!"
10034130-38 = "Ладно, начинаем. Время Guppa."
10034130-39 = "А-а-а!!"
10034130-41 = "Guppaaa!!"
