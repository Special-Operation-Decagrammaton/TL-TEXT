[translation]
10015035-2 = ""
10015035-5 = ""
10015035-6 = "Всё идёт по плану?"
10015035-7 = "Мы устраиваем саботаж направо и налево. Я полностью уничтожила робота, которого сделал Клуб разработки материалов. Шарниры и плата сгорели — теперь это просто металлолом."
10015035-8 = "Они ни за что не починят его к своей драгоценной церемонии открытия. Им придётся делать совершенно нового."
10015035-9 = "Хорошая работа. Как идёт взлом? Получилось проникнуть на серверы?"
10015035-10 = "Насчёт этого... Мы, в общем-то, не смогли пройти систему защиты сервера."
10015035-11 = "Что?! Я купила для этой работы лучшие средства взлома, которые можно достать за деньги!"
10015035-12 = "Я-я знаю, но речь ведь о президенте «Веритас»."
10015035-13 = "Даже руководство «Семинара» говорит, что тягаться с Чихиро бесполезно. Что должны сделать такие любители, как мы?"
10015035-14 = "Уф... Ладно. Придётся отказаться от этого пути."
10015035-15 = "Такими мелкими пакостями мы «Семинар» ни к чему не вынудим! Это всё, что у нас есть?"
10015035-16 = "Эм... А-а как насчёт этой штуки? Я нашла её в промышленной лаборатории..."
10015035-17 = ""
10015035-23 = "Это очень продвинутый робот... но выглядит совершенно новым. Спорю, они ещё не настроили все протоколы безопасности. Мы вполне можем перехватить управление."
10015035-24 = "Неплохо... Когда Инженерный отдел успел разработать такого боевого робота?"
10015035-25 = "Хороший план. Взломаем этого робота и положим конец фарсу со спортивным фестивалем, даже не показывая лица."
10015035-26 = "Я ничего не имею против студентов, которые так старались всё это подготовить, но..."
10015035-27 = "Мы обязаны это сделать! Больше жертв не будет!"
10015035-28 = ""
10015035-29 = "Мы должны остановить Фестиваль Хало в Кивотосе любой ценой!"
