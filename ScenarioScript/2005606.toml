[translation]
2005606-1 = "Любимое дитя"
2005606-2 = "Стоило мне отложить телефон, как Коюки уже барабанила в дверь моего офиса в Шале."
2005606-5 = "Сенсей!! Я пришла!!"
2005606-6 = "*тяжело дышит* *пыхтит* Слава богу! Дайте мне отдышаться. Я вам говорю, этот побег был вопросом жизни и смерти!"
2005606-7 = "А? Что случилось?"
2005606-8 = "Вы не поверите, Сенсей! Эти злобные старшекурсницы хотели связать меня, как кролика!"
2005606-9 = "Хорошо, что я профессионально чувствую опасность! Иначе сейчас наверняка беспомощно лежала бы привязанной к кровати! Я не преувеличиваю!"
2005606-10 = "[s1] «Привязанной к кровати...?»\n[s2] «Что ты опять натворила...?»"
2005606-13 = "Вы слышите, что меня хотели связать, и сразу вините МЕНЯ?! На этот раз я серьёзно ничего не сделала!"
2005606-14 = "Ух! Жизнь такая несправедливая! Почему все ополчились против меня!"
2005606-15 = "Почему—"
2005606-16 = ""
2005606-18 = ""
2005606-19 = ""
2005606-20 = "...АПЧХИ!!"
2005606-21 = ""
2005606-22 = "[ns3] «...Апчхи...?»\n[ns4] «Ты... заболела?»"
2005606-25 = "А? О, эм, ну. Немного, наверное."
2005606-26 = "Но дело не в этом! Вы вообще СЛЫШИТЕ, что я говорю?! Меня чуть не связали, как изолированного пациента в психиатрической палате..."
2005606-27 = "...? А?"
2005606-28 = "...Сенсей? Что это за лицо?"
2005606-29 = "Я пыталась выйти, пока болею? Ну да! Наверное!"
2005606-30 = "Но я правда не настолько больна! Никто не знает моё тело лучше меня самой!"
2005606-31 = ""
2005606-34 = "...Что?"
2005606-35 = "Моя форма Семинара? ...Старшекурсницы её забрали."
2005606-36 = "Работа? ...Нет. Сегодня мне вообще ничего не дали делать."
2005606-37 = "Вот о чём я и говорю, Сенсей! Они не позволяли мне НИЧЕГО и заперли, как заключённую!"
2005606-38 = "[s5] «...Понятно. Вот что произошло.»\n[s6] «Теперь я понял ситуацию.»"
2005606-41 = "...? Эм. Вы начинаете меня немного пугать."
2005606-42 = "Только не говорите..."
2005606-43 = "С-Сенсей...! Вы собираетесь сдать меня Семинару?! После всего, через что мы прошли вместе?"
2005606-44 = ""
2005606-46 = ""
2005606-47 = "О, не собираетесь? Нихахаха!! Конечно не собираетесь!!"
2005606-48 = "...А? Что?"
2005606-49 = "Но вместо этого я должна остаться в комнате отдыха Шале?"
2005606-50 = "Но там можно играть, есть снеки и просто отдыхать?#n...Вы сейчас специально издеваетесь надо мной?"
2005606-51 = ""
2005606-53 = ""
2005606-54 = "...Вы серьёзно?"
2005606-55 = "[s7] «Если кто-нибудь придёт, я тебя прикрою.»\n[s8] «Где ещё прятаться безопаснее, чем здесь?»"
2005606-56 = ""
2005606-57 = ""
2005606-59 = ""
2005606-60 = ""
2005606-61 = "Нихахаха!! Звучит отлично, Сенсей! Подумать только, именно мне сегодня днём улыбнулась госпожа Удача... Даже мечтать о таком не могла!"
2005606-62 = "Ладно! Ну, если вы ПРАВДА настаиваете..."
2005606-63 = "...Я пойду играть туда!! УРА-А-А!!"
2005606-64 = ""
2005606-66 = ""
2005606-69 = "Когда она устроилась, я позвонил в Семинар и объяснил, что произошло с Коюки, чтобы они не слишком за неё переживали."
2005606-70 = "Я выждал достаточно времени, а затем пошёл в комнату отдыха проверить её."
2005606-71 = ""
2005606-74 = ""
2005606-75 = ""
2005606-76 = "Нгх... Ниха... Нихаха..."
2005606-77 = "Прощай, мир... С этими призовыми деньгами я проживу остаток жизни как захочу... Ниха... Нихахаха..."
2005606-78 = ""
2005606-80 = ""
2005606-81 = "...Апчхи!!"
2005606-82 = "*зевает*... Хр-р... *шмыгает носом*"
2005606-83 = "Ниха... Нихахаха..."
2005606-84 = ""
2005606-86 = "[ns9] Включить обогреватель и накрыть её одеялом.\n[ns10] Положить ей на лоб прохладный компресс."
2005606-91 = ""
2005606-93 = "Я оставался рядом с Коюки, пока она отсыпалась после простуды, приносил ей воду и по необходимости регулировал температуру."
2005606-94 = "...Ночь сменилась утром, и из Семинара посыпался поток сообщений, полных одновременно благодарности и беспокойства."
