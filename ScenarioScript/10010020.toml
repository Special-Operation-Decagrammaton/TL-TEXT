10010020-21 = "Надеюсь, ничего страшного, что мы вошли сами."
10010020-22 = "[s1] «Ну, нам выдали читательские пропуска.»\n[s2] «Шимико сказала, что всё будет нормально.»"
10010020-23 = "Д-Да. Я знаю."
10010020-24 = "Д-Да. Я знаю."
10010020-25 = "Она с жутким выражением лица сказала: «То, что она никуда не выходит, ещё не значит, что президент ВЛАДЕЕТ этой библиотекой!»"
10010020-26 = "Наверное, Шимико раздражает, что сюда почти никто не приходит."
10010020-27 = "Как думаете, она где-то здесь?"
10010020-28 = ""
10010020-30 = ""
10010020-33 = "А-а-а-а-а!"
10010020-34 = "[s] «...?»"
10010020-35 = "Это была не я. Чей это сейчас был голос?"
10010020-36 = "К-Кто здесь?! Вы грабители?!"
10010020-37 = "Что? Н-Нет, конечно!"
10010020-38 = "Мы ничего не собираемся красть! У нас даже есть читательские пропуска!"
10010020-39 = "Мы пришли встретиться с президентом Библиотечного комитета!"
10010020-41 = "Читательские пропуска...? И вы пришли к президенту...?"
10010020-42 = "Зачем? Что вам нужно?"
10010020-43 = "[s3] «Мы слышали, что она умеет реставрировать старые книги.»\n[s4] «Мы ищем специалиста по древним текстам.»"
10010020-44 = "Понятно. А вы кто?"
10010020-45 = "Понятно. А вы кто?"
10010020-46 = "Вижу, что одна из вас из Сестринства, но понятия не имею, кто вы."
10010020-48 = "Простите. Мне следовало представиться."
10010020-49 = "Как вы и сказали, я из Сестринства. Меня зовут Вакаба Хината.#nА это... Сенсей."
10010020-51 = ""
10010020-52 = "Что вы только что сказали?"
10010020-53 = "Сенсей? Тот самый Сенсей из... Шале?"
10010020-54 = "Сенсей... Сенсей..."
10010020-55 = "Хм... Сенсей."
