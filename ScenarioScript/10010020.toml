10010020-72 = ""
10010020-73 = ""
10010020-74 = "Я Козэки Уи, президент Библиотечного комитета.#nЯ заведую старой библиотекой..."
10010020-75 = ""
10010020-77 = ""
10010020-78 = "Так зачем вы пришли сюда, Сенсей?"
10010020-79 = "[s7] «Рад наконец познакомиться.»\n[s8] «Так ты и есть тот самый 'маг', о котором говорят?»"
10010020-80 = "Да, взаимно..."
10010020-81 = "*вздох* Это проклятое прозвище... От кого вы его услышали?"
10010020-82 = "А. Значит, пропуск вам выдали в Главной библиотеке."
10010020-83 = "Ц. Шимико... Надо было догадаться, что это она."
10010020-84 = "Сколько раз я ей говорила так не делать? Если это было настолько важно, могла бы прийти сама или прислать кого-нибудь из наших."
10010020-85 = "Позже придётся с ней поговорить... хотя, зная её, она всё равно не послушает.#n*вздох*..."
10010020-86 = "Эм, не обращайте внимания на то, что я только что сказала. Общение с вами, Сенсей, не обязательно меня напрягает."
10010020-87 = "А вот Сестра, которая пришла с вами..."
10010020-88 = ""
10010020-91 = ""
10010020-92 = ""
10010020-93 = "С ней... другое дело."
10010020-94 = "Что это должно значить?! Вам неприятно, что я здесь?!"
10010020-95 = "Дело не обязательно в том, что ты из Сестринства.#nТы чужая, а все чужие для меня примерно одинаковы."
10010020-96 = "И ещё, пожалуйста, говорите потише. В этом помещении очень сильное эхо."
10010020-97 = "П-Прости..."
10010020-98 = "Как я и собиралась сказать..."
10010020-99 = "Вы упомянули какую-то старую книгу?"
10010020-100 = ""
10010020-102 = ""
10010020-103 = "Ну...?"
10010020-104 = "Почему вы так нервничаете? Какая-то проблема?"
10010020-105 = "Что значит, это «было» писание? Я не понимаю."
10010020-106 = "[s] Показать Уи то, что осталось от древнего писания."
10010020-107 = ""
10010020-109 = ""
10010020-112 = "Что... это?"
10010020-113 = "Хм?"
10010020-114 = ""
10010020-116 = ""
10010020-117 = "Ах... Эм... Гх...?!"
10010020-119 = "С-Сенсей? Что с ней происходит?"
10010020-120 = "С Уи всё хорошо? Она вся дрожит..."
10010020-121 = ""
10010020-124 = ""
10010020-125 = "[ns9] «В укрытие!»\n[ns10] Молчи и закрой уши."
10010020-126 = "Сэн—"
10010020-127 = "Сэн—"
10010020-128 = "ЧТОООООООО?!?!?!"
10010020-129 = "А-а-а!"
10010020-131 = "Ч-Ч-Что вы наделали?!"
10010020-132 = "КАК вы могли?! Кто это сделал?! Как такое вообще возможно?!"
10010020-133 = "П-Пожалуйста, успокойся, Уи. Я могу объяснить—"
10010020-134 = "Успокоиться?! После ТАКОГО?!"
10010020-135 = "Не говорите мне «успокоиться»! Как я должна «успокоиться», увидев эту трагедию! Даже если бы захотела, я не смогла бы совершить такое зверство!"
10010020-136 = "И мало того — это не просто старая книга. Это древний текст, писание!#nНастоящий артефакт!"
10010020-137 = "Такой текст использовали ещё на соборах древности!"
10010020-138 = "Это должно считаться одним из сокровищ этой школы!"
10010020-139 = "Что вы сделали с этим бедным, ни в чём не повинным произведением...?"
10010020-140 = "[s11] «Ну, его состояние говорит само за себя.»\n[s12] «Теперь начинаю понимать, почему о тебе ходят такие слухи.»"
10010020-141 = "П-Пожалуйста, выслушай нас, Уи! Мы больше всего на свете хотим восстановить его,#nи—"
10010020-142 = "П-Пожалуйста, выслушай нас, Уи! Мы больше всего на свете хотим восстановить его,#nи—"
10010020-143 = "Восстановить?! Оперировать можно только того, кто ещё жив!#nВы просите меня воскресить мёртвого!"
10010020-144 = "Как могла произойти такая трагедия...?"
10010020-145 = "Бесценная история и записи, утраченные с каждой уничтоженной страницей...#nЭтого не может быть..."
10010020-146 = "[s13] «Глубоко дыши, Уи. Глу-у-у-убоко.»\n[s14] «Разве Маг Старой библиотеки ничего не может сделать?»"
10010020-147 = "...!"
10010020-148 = "...!"
10010020-149 = ""
10010020-151 = ""
10010020-152 = "*вдох*... *выдох*..."
10010020-153 = "*вдох*... *выдох*... Хорошо."
10010020-154 = "Простите меня. Мне жаль, что вам пришлось увидеть меня такой, Сенсей."
10010020-155 = "Что до... дела перед нами. Эту книгу необходимо восстановить — любой ценой."
10010020-156 = "Я хочу, чтобы вы рассказали мне всё с самого начала."
10010020-157 = "Где обнаружили эту книгу? Что произошло после того, как её передали под вашу ответственность?"
10010020-158 = "Мне нужно знать каждую мелочь."
10010020-159 = "[ns] Рассказать Уи всю историю."
10010020-161 = "Хорошо. Значит, это всё."
10010020-163 = ""
10010020-169 = "Хотела бы я сказать, что теперь всё стало ясно..."
10010020-170 = "...но некоторые части вашей истории звучат настолько комично нелепо, что в них трудно поверить."
10010020-171 = "Клянусь, это правда... Простите."
10010020-172 = "К счастью, Сенсей здесь и может подтвердить твои слова, поэтому я уверена, что всё было именно так."
10010020-173 = "Чтение назначено на завтра утром, верно?"
10010020-174 = "Я никогда не пойму, как устроен внешний мир. Эту книгу нашли всего два дня назад!"
10010020-175 = "Никто не подумал о её состоянии, необходимости консервации или немедленной обработке сразу после раскопок?"
10010020-176 = ""
10010020-179 = "Все писания Тринити, даже самые старые, проходили обработку, чтобы обеспечить их сохранность."
10010020-180 = "Хотя бывают исключения. Некоторые книги снаружи выглядят безупречно, но страницы внутри уже сильно изношены. Нельзя судить книгу по обложке — в этих случаях буквально."
10010020-181 = "Поэтому старые книги так важно оценивать сразу после обнаружения. Эта не исключение."
10010020-182 = "Очевидно, этого не сделали. Полагаю, внешне она выглядела достаточно хорошо и в момент находки ещё была целой."
10010020-183 = "Поэтому обнаружившие её люди вообще не приняли её состояние во внимание."
10010020-184 = "Вообще говоря, книга такого возраста уже должна была сгнить и исчезнуть из истории,#nно среда, где она хранилась, вероятно, была почти полностью лишена#nвоздуха."
10010020-187 = "А после попадания наружу её страницам хватило бы совсем немного, чтобы начать рассыпаться."
10010020-188 = "Поэтому я думаю, что даже если бы твоего... происшествия не случилось,#nона всё равно вскоре рассыпалась бы сама.#nЯ бы дала ей максимум несколько недель."
10010020-190 = "К-Какой ужас..."
10010020-191 = "Возможно, ответственные решили отложить консервацию до окончания этого большого мероприятия. Мол, если книга продержится всего несколько дней, волноваться не о чем."
10010020-192 = "Хотя сомневаюсь, что они вообще думали настолько далеко. Это пахнет их обычной самоуверенной и непродуманной политикой. Никто не любит думать о худшем исходе."
10010020-193 = "Как бы там ни было на самом деле, перспективы этой книги мрачные.#nСейчас надежды на восстановление почти нет."
10010020-194 = "В обычных обстоятельствах я бы назвала это невозможным."
10010020-195 = "[s15] «Похоже, надежды нет...»\n[s16] «Прости, что попросили тебя о невозможном.»"
10010020-198 = ""
10010020-200 = ""
10010020-201 = "Я сказала: «в обычных обстоятельствах»."
10010020-202 = "...?"
10010020-203 = "[s] «То есть...?»"
10010020-205 = "Разумеется, я не собираюсь просто оставить всё как есть."
10010020-206 = "Как я уже сказала, этот текст бесценен. От него нельзя так просто отказаться."
10010020-207 = "Разумеется. Всё-таки это священное писание..."
10010020-208 = "Я имела в виду не это. Вам не кажется, что во всём этом есть что-то странное?"
10010020-209 = ""
10010020-212 = ""
10010020-214 = "Зачем проводить публичное мероприятие в руинах старого собора на окраине, если его с тем же успехом можно было устроить в современном соборе?"
10010020-215 = "Чтобы создать атмосферу из-за того, что книга — артефакт? Думаете, руководство Тринити стало бы так стараться только ради этого?"
10010020-216 = "Для меня это нелогично. Здесь есть что-то ещё."
10010020-218 = ""
10010020-219 = "И ещё: зачем поручать перевозку книги Сестре, которая даже не умеет читать этот текст?"
10010020-220 = "Нельзя отрицать, что всё это выглядит подозрительно, правда?"
10010020-222 = "Мне ещё нужно самой всё проверить, но я почти не сомневаюсь, что в этой книге содержалась очень важная информация. Настолько важная, что..."
10010020-223 = "[s] «...её нельзя раскрывать кому попало.»"
10010020-224 = "Именно! Я не могу сказать наверняка, насколько велик этот секрет..."
10010020-225 = "...но там может храниться часть истории Тринити, давно утраченная во времени."
10010020-226 = ""
10010020-228 = ""
10010020-229 = ""
10010020-231 = "Клей из сфагнового мха."
10010020-232 = "А?"
10010020-233 = "[s] «Клей из сфагнового мха?»"
10010020-235 = "Да, нам нужен клей из сфагнового мха и немного святого тоника. Чтобы восстановить книгу, мне придётся повторить способ, которым её изначально изготовили."
10010020-236 = "Святой тоник вы должны суметь достать в местной больнице."
10010020-237 = "Такой клей сейчас уже просто так не найдёшь,#nно раньше его часто использовали в оконных рамах старых зданий и тому подобном.#nПринесите немного — я его переплавлю."
10010020-238 = "Если подумать, при строительстве этого самого здания наверняка тоже использовали клей из сфагнового мха... но повреждать его — не вариант."
10010020-239 = "В общем, если принесёте мне эти два материала, я сделаю всё возможное, чтобы восстановить текст."
10010020-240 = "У-Уи...!"
10010020-241 = "Не поймите неправильно. Мне нет дела ни до Сестринства, ни до того, чего добивается руководство Тринити."
10010020-242 = "Я просто не хочу, чтобы этот текст снова оказался утрачен для истории."
10010020-243 = ""
10010020-245 = ""
10010020-246 = ""
10010020-247 = ""
10010020-248 = "И если это просьба от вас, Сенсей, то... я сделаю всё, что смогу."
10010020-249 = "[s17] «Спасибо, Уи.»\n[s18] «Я принесу эти материалы.»"
10010020-250 = "Х-Хорошо. Тогда удачи."
10010020-251 = "Х-Хорошо. Тогда удачи."
10010020-253 = "О, и ещё кое-что."
10010020-255 = "Что такое?"
10010020-256 = "Лимитированный торт Miracle 5,000. Его продают у реки Солют.#nСначала, пожалуйста, добудьте его."
10010020-257 = "А?"
10010020-258 = "Мне нужен сахар, чтобы работать."
10010020-259 = "А... понятно..."
10010020-260 = "То есть это ещё один материал, необходимый для реставрации книги?"
10010020-261 = "(сверлит взглядом)"
10010020-262 = "Идите! Сейчас же!"
10010020-264 = "Д-да, мэм."
10010020-266 = "Мы уже идём..."
