[translation]
2601603-1 = "According to a certain scribe..."
2601603-2 = "Hmm. As I thought, the ocean really does have a lot of water!"
2601603-3 = "That's one fact confirmed!"
2601603-4 = "[s] \"A journey of a thousand miles begins with a single step, right!\""
2601603-5 = "Yes! Let's get going!"
2601603-10 = "Whisper, whisper, blah blah blah..."
2601603-11 = "Whisper, whisper, blah blah blah..."
2601603-12 = "Hello! We're from the 'Weekly Pandemonium'!"
2601603-13 = "Sorry for the sudden interruption, but do you have a moment? We have a few things we'd like to ask!"
2601603-14 = "An interview? I don't mind, but..."
2601603-15 = "Thank you! Well then—"
2601603-17 = "Just now, you two were saying 'whisper, whisper, blah blah blah'!"
2601603-18 = "What does that mean?"
2601603-19 = "Huh? You don't know?"
2601603-20 = "They say if you say 'whisper, whisper, blah blah blah' here, your wish will come true!"
2601603-21 = "We heard that legend and came here ourselves."
2601603-22 = "This is a hidden gem that only those in the know are aware of!"
2601603-24 = "A legend about the sea, sleeping in a hidden gem!"
2601603-25 = "Wow! This is a scoop! Um, where's my notepad—"
2601603-30 = "Oh, huh?"
2601603-31 = "[s] \"Is something wrong?\""
2601603-32 = "Y-yes... a huge problem...!"
2601603-33 = "I... I forgot my notepad...!"
2601603-34 = "All I have on me is this stone coaster..."
2601603-35 = "[s] \"Oh, you're right... it does look a bit like one...\""
2601603-36 = "And of all times, my phone is out of battery too..."
2601603-37 = "A-all I have is a pen..."
2601603-38 = "I guess I have no choice but to write on my palm...!"
2601603-40 = "Come to think of it, I heard some strange noises coming from that forest at night... #nDid you cover that in your report?"
2601603-41 = "Oh, that? Everyone's pretty scared of it."
2601603-42 = "There are other interesting stories too!?"
2601603-43 = "S-Sensei, could you lend me your palm too?"
2601603-44 = "Anywhere else is fine! I have to take notes before I forget...!"
2601603-45 = "[s1] \"Stop, stop!\"\n[s2] \"Calm down, Chiaki.\""
2601603-48 = "But I can't rely on my memory to write such a big scoop!"
2601603-49 = "All the stories might get mixed up, and I might forget them!"
2601603-53 = "Desperate times call for desperate measures! Please write on my back too!"
2601603-54 = "[s] \"Can we stop writing on people's bodies!?\""
2601603-55 = "B-but... there's nothing but sand under our feet, where else am I supposed to write—"
2601603-56 = "Hm? Sand?"
2601603-57 = "I see, that's the solution!"
2601603-68 = "—and that's why corned beef cans are shaped like that!"
2601603-69 = "I see, so that's why!"
2601603-70 = "We've completely drifted away from the topic of the sea, but that's a fascinating story!"
2601603-71 = "Oh, it's almost time for our meeting!"
2601603-72 = "We're heading out now! Good luck with your article!"
2601603-73 = "Yes! I've written everything you told me on the sandy beach!"
2601603-74 = "Thank you for your cooperation! Let's meet again!"
2601603-79 = "Wow! That went by so fast!"
2601603-80 = "Writing on the sand was a great strategy, if I do say so myself!"
2601603-81 = "Now all that's left is to snap a picture with the camera, and it's perfect!"
2601603-82 = "Alright, everyone in the sand! Say cheese!"
2601603-86 = "Huh...?"
2601603-89 = "A-aaaaahhh!!"
2601603-92 = "Oh... oh..."
2601603-93 = "[s3] \"Chiaki, are you okay!?\"\n[s4] \"The waves came in so suddenly...\""
2601603-96 = "Can't... undo...?"
2601603-97 = "Everything... gone..."
2601603-98 = "T-this is a lie, right...?"
2601603-99 = "[s] \"Chiaki, pull yourself together!!\""
2601603-100 = "...Huh?"
2601603-102 = "(Afterward, I did my best to comfort a depressed Chiaki.)"
2601603-103 = "(When I told her about recent events instead, she cheered up immediately.)"