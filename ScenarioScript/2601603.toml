[translation]
2601603-1 = "По словам одного секретаря,"
2601603-2 = "Как и следовало ожидать, в море всё ещё очень много воды!"
2601603-3 = "Первый факт подтверждён! Начало отличное!"
2601603-4 = "[s] «Важно ценить даже мелочи!»"
2601603-5 = "Тогда в путь! За мной, Сенсей!"
2601603-6 = ""
2601603-8 = ""
2601603-9 = ""
2601603-10 = "Шёпот-шёпот. Бла-бла...!"
2601603-11 = "Шёпот-шёпот. Бла-бла...!"
2601603-12 = "Здравствуйте! Простите за беспокойство! Мы из «Еженедельника Пандемониума»!"
2601603-13 = "Мы случайно услышали ваш разговор, когда проходили мимо! Не ответите на пару вопросов для нашего репортажа?"
2601603-14 = "Интервью? Это как на телевидении? Меня покажут по телевизору?"
2601603-15 = "Даже лучше телевидения! Если вы не против, мы с радостью зададим несколько вопросов!"
2601603-17 = "Я тут слышала, как вы что-то шептали!"
2601603-18 = "Не хотите рассказать, что происходит?"
2601603-19 = "А? Вы не знаете? Я думала, вы поэтому сюда и пришли."
2601603-20 = "Говорят, если здесь произнести вслух «Шёпот-шёпот. Бла-бла...!», любое желание сбудется!"
2601603-21 = "Мы услышали эту легенду и пришли загадать желание!"
2601603-22 = "Это страшно засекреченная тайна! Кто знает, тот знает!"
2601603-24 = "О-хо-хо-хо!! Легенда, связанная с морем! Да ещё и в тайном месте, о котором почти никто не слышал!"
2601603-25 = "Ого! Вот это сенсация! Так, где мой блокнот..."
2601603-26 = ""
2601603-28 = ""
2601603-29 = ""
2601603-30 = "А-А?"
2601603-31 = "[s] «Что-то случилось?!»"
2601603-32 = "Ничего страшного! Кроме того, что всё пропало!"
2601603-33 = "Я... забыла блокнот!"
2601603-34 = "Так торопилась выйти из дома от предвкушения, что случайно прихватила вместо блокнота подставку под кружку!"
2601603-35 = "[s] «О... Ну, они и правда немного похожи...»"
2601603-36 = "И кажется, телефон разрядился из-за жары..."
2601603-37 = "Р-ручку-то я не забыла..."
2601603-38 = "Точно! Ничего страшного! Просто запишу всё на ладони!"
2601603-40 = "А, кстати, говорят, из того леса каждую ночь доносятся странные звуки. Вы такое не изучали?"
2601603-41 = "Интересно, правда ли это. Звучит ужасно жутко!"
2601603-42 = "У меня уже есть одна легенда, а тут ещё одна увлекательная история сама падает в руки?"
2601603-43 = "С-сенсей! Можно одолжить и вашу ладонь?!"
2601603-44 = "Подойдёт любая часть тела! Нужно всё записать, пока не забыла!"
2601603-45 = "[s1] «Стой! Стой!»\n[s2] «С какой стороны ни посмотри, это выглядит подозрительно!»"
2601603-48 = "Но я не могу писать такие важные статьи, полагаясь только на память!"
2601603-49 = "Ещё перепутаю истории, что-нибудь забуду и в итоге начну выдумывать факты!"
2601603-50 = ""
2601603-52 = ""
2601603-53 = "Другого выхода нет! Тогда пишите у меня на спине!"
2601603-54 = "[s] «Может, перестанем писать на людях?!»"
2601603-55 = "Но здесь и писать-то не на чем, кроме песка..."
2601603-56 = "А? Песок?"
2601603-57 = "А! Точно!"
2601603-58 = ""
2601603-60 = ""
2601603-62 = ""
2601603-63 = ""
2601603-64 = ""
2601603-65 = ""
2601603-67 = ""
2601603-68 = "...И вот поэтому банки с солониной делают такой формы!"
2601603-69 = "О, так вот почему!"
2601603-70 = "К середине это уже вообще перестало относиться к пляжу, но всё равно о-о-очень, очень, очень интересно!"
2601603-71 = "А! Посмотрите на время! Нам пора встречаться с остальными!"
2601603-72 = "Нам пора! Удачи с вашей статьёй!"
2601603-73 = "Я записала всё на песке! Ничего не упустила! А-ха-ха!"
2601603-74 = "Спасибо за помощь с интервью! Пока-пока!"
2601603-75 = ""
2601603-77 = ""
2601603-79 = "Ого! Какой плодотворный день!"
2601603-80 = "Надо же, как ловко я сообразила записывать всё на песке, правда?"
2601603-81 = "На фотоаппарате ещё есть заряд, так что достаточно сфотографировать пляж — и все записи сохранятся!"
2601603-82 = "Ну что, песочек! Все улыбаемся!"
