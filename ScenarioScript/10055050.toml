[translation]
10055050-1 = "Episode 5;Society of the Dead Devils"
10055050-2 = "Sensei?"
10055050-3 = "Ugh... this doesn't look good."
10055050-4 = "It's deeper than I imagined. It's not just a simple hole; it seems to be divided into layers..."
10055050-5 = "I'd like to help them if I could, but..."
10055050-6 = "Iroha, hurry! They're coming!"
10055050-7 = "...We're in a similar situation here. #nSorry, but let's all do our best for now."
10055050-8 = "Just wait, Satsuki, Chiaki, Sensei! I'll definitely come back for you!"
10055050-9 = "Sensei, Senpai! I'll be right back!"
10055050-14 = "............"
10055050-15 = "Ah, ah..."
10055050-20 = "S-Satsuki-senpai, stay strong!!"
10055050-21 = "Sensei, what should we do!? #nSatsuki-senpai is terrified of the dark!"
10055050-22 = "[s1] \"Let's find a light first!\"\n[s2] \"It should be fine if we make it a little brighter!\""
10055050-25 = "I see! That's a great idea!"
10055050-31 = "Sensei! Satsuki-senpai!"
10055050-32 = "I couldn't find the room's light switch, but I found a lantern!"
10055050-33 = "Well done, Chiaki! Hurry up and light it!"
10055050-34 = "Yes! Alright, shine!"
10055050-41 = "What is this? It's just a normal room. What a waste of fear."
10055050-42 = "Ahaha, the ghost ship isn't much of a big deal after all!"
10055050-43 = "Actually, Iroha-chan was right. #nIt seems like we're on a different floor than them."
10055050-44 = "..."
10055050-45 = "Satsuki-senpai?"
10055050-46 = "Quiet. I'm analyzing right now."
10055050-47 = "Oh, right."
10055050-51 = "..."
10055050-52 = "............"
10055050-53 = "Um... Satsuki-senpai?"
10055050-54 = "Shouldn't we try to escape quickly...?"
10055050-55 = "I know that! #nBut..."
10055050-56 = "We need information for that, don't we? Who exactly is chasing us?"
10055050-57 = "Oh... I wonder who?"
10055050-58 = "It happened so fast I didn't get a good look... A ghost? Or maybe a pirate?"
10055050-59 = "...Fine. Let's think about this one step at a time. #nChiaki, what do you think of this room?"
10055050-60 = "Eh, me? Well... it's old. Old-fashioned, I suppose. #nIt even feels a bit like Trinity."
10055050-61 = "Hmm, I'm not sure. What do you think, Sensei?"
10055050-65 = "First, look at this furniture. It's common enough on land, but..."
10055050-66 = "Actually, having a space like this on a sailing ship without an engine is a luxury in itself. #nHaving personal furniture, let alone a private room, is quite special."
10055050-67 = "It's a room for someone of relatively high status... or perhaps a VIP cabin. #nBut then, there would be no need for a sextant or nautical charts."
10055050-68 = "In other words, there's a high probability that this is the quarters of a senior navigator... or the captain's cabin."
10055050-70 = "O-oh... so that means...?"
10055050-71 = "It suggests that the group here has a hierarchy and rules centered around a captain. #nThough I suppose that's only natural if they're operating a ship this size."
10055050-72 = "...Or perhaps I should say 'that was the case.' #nIf the ghost ship legend is true, the captain must have been driven out."
10055050-73 = "...This nautical chart is also bothering me. #nI wonder if I can make anything of it."
10055050-74 = "Hmm... is it... very old?"
10055050-75 = "I'm sorry, I have no idea."
10055050-76 = "Fufu, not bad for a beginner. #nThough, this chart is in poor condition. Parchment deteriorates quickly depending on how it's stored."
10055050-77 = "You can tell roughly when a map was made by looking at its contents. #nFor example, the sea route drawn here was the most common route in Kivotos, but..."
10055050-78 = "It hasn't been used since the canal passing through the Abydos Autonomous District was opened. #nIn other words, this was made before the canal opened."
10055050-79 = "The sextant from earlier is the same. It wouldn't be necessary if you had GPS..."
10055050-80 = "And this lantern we're using now. #nSee, the melted wax is stuck to it, right? #nIt seems they lived a life without electricity or gas."
10055050-81 = "It really is like being on a ship from hundreds of years ago."
10055050-85 = "Based on all of that..."
10055050-86 = "Based on...?"
10055050-91 = "This ship is a real ghost ship... *thud*"
10055050-92 = "Ah! Satsuki-senpai, please wake up!!"
10055050-95 = "Ah, oh... where was I?"
10055050-96 = "Um, you were saying this ship is from hundreds of years ago..."
10055050-97 = "...More importantly, I feel like there was something even scarier."
10055050-98 = "N-no, there wasn't! Please, keep talking!"
10055050-99 = "...? Oh well, I can't remember anyway. #nIt probably wasn't anything important."
10055050-103 = "First of all, if this ship and its crew are truly using equipment from hundreds of years ago, we might have a chance."
10055050-105 = "A chance?"
10055050-106 = "Yes. No matter how well-maintained it is, I don't think guns from hundreds of years ago would work properly."
10055050-107 = "I was surprised and ran away earlier, but our combat capabilities should be superior."
10055050-111 = "But still, combat is scary and I hate it... Chiaki, can't you take care of them instead?"
10055050-112 = "Ahaha... I'll do my best to protect Satsuki-senpai!"
10055050-113 = "You said it, right? You better mean it!"
10055050-114 = "...Oh? You're staring off into space, Sensei. Is something wrong?"
10055050-115 = "[s3] \"No, I was just thinking Satsuki is amazing.\"\n[s4] \"You're so calm even in this situation.\""
10055050-118 = "Calm? I suppose... well, maybe more so than Chiaki or Iroha."
10055050-119 = "Those two are just 'second-years,' after all."
10055050-120 = "Hm? What's the matter?"
10055050-121 = "Ah, if we're converting to Gehenna standards, isn't Sensei a 'first-year'? #nIt's only natural that there are many things you don't know. Not that you need to know them."
10055050-122 = "I'll just call it a difference in experience."
10055050-123 = "Perhaps there will come a day when I'll tell you in detail, Sensei."
10055050-124 = "Though it's not a very fun story, so I'm not exactly eager to bring it up."
10055050-128 = "For now, we have no more business here. #nIt doesn't look like there's any more information to be found."
10055050-129 = "We have to get back to the deck to escape, anyway..."
10055050-130 = "Shall we get going?"
10055050-137 = "Oh? Sensei, did you call me?"
10055050-138 = "[s5] \"I'm just a little curious about something.\"\n[s6] \"Is Satsuki always like this in the Prefect Team?\""
10055050-141 = "Hmm, not really."
10055050-142 = "Actually, this is the first time I've seen Satsuki-senpai like this!"
10055050-143 = "Honestly, it's a little exciting! To think there's a side of her I don't know yet!"
10055050-144 = "...Hm? No, wait, maybe not..."
10055050-145 = "Come to think of it, there's so much I don't know about Satsuki-senpai."
10055050-146 = "I only ever see her by Makoto-senpai's side, talking about difficult things."
10055050-147 = "But the seniors never talk about what happened before I enrolled~"
10055050-148 = "It's like she's a mastermind, or shrouded in a veil of mystery."
10055050-149 = "Is that just because she's the head of the Information Department?"
10055050-150 = "[s7] \"Is Satsuki really that full of secrets?\"\n[s8] \"I thought she was more straightforward and honest, if anything.\""
10055050-153 = "Hmm? I wonder, do you and I have different perspectives, Sensei?"
10055050-154 = "Ah!! I just thought of a great article idea!"
10055050-155 = "It's called: 'What Students Look Like from Sensei's Perspective!?'"
10055050-156 = "What do you think? Sounds like it would get a good response, right? #nIf we make it back safely, please let me interview you!"
10055050-157 = "Hey, what are you two having so much fun about! Hurry up and come here!? #nI'm all alone over here!"
10055050-158 = "Eek, yes, yes! Chiaki Motomiya is coming!!"
10055050-165 = "Is this a warehouse?"
10055050-166 = "It's way too dark! Isn't there any light?"
10055050-167 = "We should have brought that lantern from earlier. #nWait, should I go get it now?"
10055050-168 = "No, don't go! That would mean one less person here!?"
10055050-169 = "...I suppose it can't be helped."
10055050-176 = "Sensei, will you hold my hand?"
10055050-180 = "That's right, keep it up. Don't ever let go, never!"
10055050-181 = "A warehouse of this size should have tons of information... #nIf I can just find it quickly and grab a clue—"
10055050-182 = "............"
10055050-183 = "Never mind, Chiaki! Let's move out!"
10055050-184 = "Yes! Chiaki Motomiya, charging in!"
10055050-185 = "Any clues..."
10055050-189 = "Hm? This is..."
10055050-190 = "Sensei, Satsuki-senpai! Look at this!"
10055050-191 = "[s9] \"A handkerchief?\"\n[s10] \"There's some kind of mark on it...\""
10055050-197 = "It's a little different from what I'm familiar with, but..."
10055050-198 = "There's no mistake! This is the Gehenna school emblem!"
10055050-199 = "Gehenna's school emblem? Let me see that."
10055050-205 = "Well done, Chiaki. A major find."
10055050-206 = "This mark on the handkerchief is definitely from Gehenna."
10055050-207 = "Then this pirate... were they actually a Gehenna student?"
10055050-208 = "But why would this be here...?"
10055050-209 = "I should know about such interesting students, though~"
10055050-210 = "............"
10055050-211 = "Um, Satsuki-senpai?"
10055050-212 = "...In other words, that means... it's like that..."
10055050-213 = "[s11] \"Such intense focus...\"\n[s12] \"She went into focus mode in an instant.\""
10055050-216 = "Ahaha, I suppose so."
10055050-217 = "...Actually, are we going to be okay?"
10055050-218 = "I feel like we've been lost for quite a while now. If the pirates come here soon..."
10055050-222 = "Waaaah!? They really showed up~~!?"
10055050-223 = "Eek! Chiaki, Sensei! Hurry and defeat them!!"
10055050-225 = "Yo-ho-ho! So you were here!"
10055050-226 = "[s] \"This voice is...\""
10055050-228 = "[ns] \"Could it be Makoto?\""
10055050-230 = "No, that's not it."
10055050-231 = "From now on, you shall call me 'Captain Makoto'!"