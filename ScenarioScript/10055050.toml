[translation]
10055050-1 = "Эпизод 5;Общество мёртвых демонов"
10055050-2 = "Сенсей, вы там?"
10055050-3 = "Ух... Плохо дело."
10055050-4 = "Вы упали довольно глубоко. Кажется, на самый нижний уровень корабля."
10055050-5 = "Я бы помогла вам, если бы могла, но..."
10055050-6 = "Ироха! Скорее! Они идут!"
10055050-7 = "...У нас тут своих проблем хватает. Простите, пока придётся выбираться самим."
10055050-8 = "Держись, Сацуки! Сенсей! Клянусь, я вернусь за вами!"
10055050-9 = "Сенсей! Все! Ибуки скоро вернётся!"
10055050-10 = ""
10055050-13 = ""
10055050-14 = "..."
10055050-15 = "А-а..."
10055050-16 = ""
10055050-18 = ""
10055050-19 = ""
10055050-20 = "С-Сацуки! Очнись!"
10055050-21 = "Сенсей! Что нам делать?! Сацуки боится темноты! Да и вообще всего страшного!"
10055050-22 = "[s1] «Для начала найдём свет!»\n[s2] «Если здесь станет светлее, ей полегчает»."
10055050-25 = "О-о, хорошая идея, Сенсей!"
10055050-26 = ""
10055050-28 = ""
10055050-29 = ""
10055050-30 = ""
10055050-31 = "Сенсей! Сацуки!"
10055050-32 = "Не знаю, есть ли тут электричество, но я нашла фонарь."
10055050-33 = "П-превосходно, Чиаки! Немедленно зажги его!"
10055050-34 = "Да! Ну что, да будет ослепительный свет!"
10055050-35 = ""
10055050-37 = ""
10055050-39 = ""
10055050-40 = ""
10055050-41 = "Что? Обычная комната. Зря я боялась."
10055050-42 = "Ага! Корабли-призраки не так уж страшны, как о них рассказывают!"
10055050-43 = "Но Ироха, похоже, права. Мы о-очень глубоко."
10055050-44 = "..."
10055050-45 = "Сацуки?"
10055050-46 = "Тихо. Я анализирую ситуацию."
10055050-47 = "А, точно."
10055050-48 = ""
10055050-50 = ""
10055050-51 = "..."
10055050-52 = "..."
10055050-53 = "Эм... Сацуки?"
10055050-54 = "А нам не стоит попробовать... подняться наверх?"
10055050-55 = "Разумеется! Однако!"
10055050-56 = "Мы оказались в неизвестной ситуации. Поэтому сначала выясним, что нам известно. Кто или что за нами гналось?"
10055050-57 = "Эм... Не уверена...?"
10055050-58 = "Всё произошло так быстро... Кажется, они были похожи на призраков? Или пиратов? Что-то вроде того."
10055050-59 = "...Ладно, оценим наше нынешнее положение. Что вы думаете об этой комнате?"
10055050-60 = "О комнате? Ну... Она какая-то старомодная. Немного напоминает Тринити."
10055050-61 = "...Больше ничего в голову не приходит! Сенсей, а вы что думаете?"
10055050-62 = ""
10055050-64 = ""
10055050-65 = "Начнём с того, что на суше такая мебель выглядела бы совершенно обычно..."
10055050-66 = "Но на парусном судне без двигателя место на вес золота. Даже отдельные предметы мебели здесь редкость, не говоря уже о целой личной комнате."
10055050-67 = "Следовательно, здесь жил кто-то важный... А секстант и морские карты позволяют предположить, что это не гостевая каюта."
10055050-68 = "Полагаю, это была каюта капитана корабля."
10055050-70 = "О-о... То есть...?"
10055050-71 = "Вероятно, у команды была строгая иерархия во главе с капитаном. Хотя для такого большого корабля это вполне естественно."
10055050-72 = "Вернее, когда-то была. Если верить легендам, капитана изгнали."
10055050-73 = "...И эта морская карта любопытная. Вы замечаете на ней что-нибудь необычное?"
10055050-74 = "Хм... Она очень старая...?"
10055050-75 = "Простите, я понятия не имею."
10055050-76 = "Для новичка неплохая догадка. Но по одному пергаменту трудно судить о возрасте. При плохом хранении он быстро портится."
10055050-77 = "Карта хранит сведения, и по ним можно примерно установить время её создания. Например, отмеченный здесь морской проход когда-то был самым оживлённым торговым путём Кивотоса..."
10055050-78 = "Но после открытия канала через старый район Абидоса им совершенно перестали пользоваться. На нынешних картах его уже нет. Значит, эта карта как минимум старше канала."
10055050-79 = "Секстант, который мы видели, тоже подсказка. С появлением электронных систем вроде GPS секстанты на кораблях почти перестали использовать."
10055050-80 = "Посмотрите и на наш фонарь. Внутри расплавленный воск, а на фитиле видны следы тушения. Здесь привыкли освещать помещения свечами, а не электричеством."
10055050-81 = "Всё указывает на то, что кораблю несколько сотен лет. И при этом он возник буквально из ниоткуда."
10055050-82 = ""
10055050-84 = ""
10055050-85 = "Я могу сделать лишь один вывод..."
10055050-86 = "Да...?"
10055050-87 = ""
10055050-89 = ""
10055050-90 = ""
10055050-91 = "Что этот корабль... действительно корабль-призрак... *грох*"
10055050-92 = "А! Сацуки! Очнись!"
10055050-94 = ""
10055050-95 = "А... На чём я остановилась?"
10055050-96 = "Эм, ты говорила, что этому кораблю, похоже, несколько сотен лет..."
10055050-97 = "...Разве ты не сказала что-то ещё более страшное...?"
10055050-98 = "Н-нет! Ничего такого! Прошу, продолжай!"
10055050-99 = "Хм...? Ну, если не могу вспомнить, значит, ничего важного."
10055050-100 = ""
10055050-102 = ""
10055050-103 = "Так или иначе, если всё это правда, снаряжение команды тоже должно быть многовековой давности. А значит, у нас есть шанс дать отпор."
10055050-105 = "Хватит ли сил победить?"
10055050-106 = "Именно. Даже если они идеально ухаживали за оружием, время наверняка не прошло для него бесследно."
10055050-107 = "В первой стычке они застали нас врасплох, но в повторном бою мы, полагаю, превзойдём их и по огневой мощи, и по точности."
10055050-108 = ""
10055050-110 = ""
10055050-111 = "Но я ненавижу сражаться... Это страшно... Пожалуйста, сражайся за меня!"
10055050-112 = "Ахаха... Я постараюсь тебя защитить."
10055050-113 = "Правда? Обещаешь?"
10055050-114 = "...Хм? Сенсей, почему вы так поражены?"
10055050-115 = "[s3] «Просто подумалось, какая ты молодец, Сацуки».\n[s4] «Даже в такой ситуации ты удивительно спокойна»."
10055050-118 = "Хм... Полагаю, по сравнению с Чиаки и Ирохой это так."
10055050-119 = "Всё-таки они лишь второкурсники."
10055050-120 = "Вас это ещё удивляет?"
10055050-121 = "А, по меркам Геенны вы сами были бы всего лишь «первокурсником», Сенсей. Вам и незачем было это знать."
10055050-122 = "Если выразиться проще... Дело в жизненном опыте."
10055050-123 = "Когда-нибудь, если представится случай, я всё подробно вам расскажу."
10055050-124 = "Хотя предпочла бы вовсе не поднимать эту тему."
10055050-125 = ""
10055050-127 = ""
10055050-128 = "Кхм. Кажется, мы узнали здесь всё полезное, что могли."
10055050-129 = "Покинуть корабль мы сможем только через палубу."
10055050-130 = "Пора двигаться?"
10055050-135 = ""
10055050-136 = ""
10055050-137 = "Хм? Сенсей, вам что-нибудь нужно?"
10055050-138 = "[s5] «Просто кое-что любопытно».\n[s6] «Сацуки всегда так себя ведёт?»"
10055050-141 = "Хм-м... Не особо."
10055050-142 = "Вообще-то совсем нет! Я и сама впервые вижу её такой."
10055050-143 = "Понимаю, ситуация не из тех, над которыми смеются, но такое чувство, будто я нашла сенсацию! Оказывается, я ещё многого не знаю о своих товарищах."
10055050-144 = "Вообще-то, скорее наоборот..."
10055050-145 = "А что я вообще знаю о Сацуки?"
10055050-146 = "Раньше я видела в ней лишь тень Макото, которая постоянно твердила о каком-то «NK Ultra Project»."
10055050-147 = "Но старшекурсники упорно молчат обо всём, что происходило до моего поступления."
10055050-148 = "Она и правда сплошная загадка, да? Как запертое хранилище: понятия не имеешь, что внутри."
10055050-149 = "Всё-таки она председатель разведывательного комитета Общества Пандемониум."
10055050-150 = "[s7] «Неужели Сацуки настолько загадочная...?»\n[s8] «Мне она всегда казалась честной и искренней»."
10055050-153 = "Ого-о, учителя и студенты действительно видят мир по-разному, да?"
10055050-154 = "А! Придумала! У меня только что родился потрясающий заголовок!"
10055050-155 = "«Студенты глазами Сенсея»! Сделаем специальный выпуск!"
10055050-156 = "Читателям точно понравится! Согласны? Ну пожалуйста! Дайте взять у вас интервью, когда вернёмся домой!"
10055050-157 = "Почему вы там копаетесь?! Ни на секунду не оставляйте меня одну! Скорее, скорее!"
10055050-158 = "Ой! Мотомия Чиаки уже спешит!"
10055050-159 = ""
10055050-161 = ""
10055050-164 = ""
10055050-165 = "Это какое-то хранилище?"
10055050-166 = "Что бы это ни было, здесь кромешная тьма! Неужели нет света?"
10055050-167 = "А-а! Надо было взять фонарь! Может, вернуться за ним?"
10055050-168 = "Нет-нет! Не уходи! Нам нельзя разделяться!"
10055050-169 = "...Ну вот и приехали."
10055050-170 = ""
10055050-172 = ""
10055050-173 = ""
10055050-175 = ""
10055050-176 = "Сенсей, возьмите меня за руку."
10055050-179 = ""
10055050-180 = "Вот так. Не отпускайте. Понятно? Ни. За. Что. Не. Отпускайте."
10055050-181 = "Эта кладовая огромная. Уверена, мы сможем отыскать немало полезных зацепок..."
10055050-182 = "..."
10055050-183 = "Я не могу! Чиаки, твой выход!"
10055050-184 = "Есть! Мотомия Чиаки, секретарь Общества Пандемониум, приступает!"
10055050-185 = "Хм... Что-нибудь похожее на подсказку..."
10055050-186 = ""
10055050-188 = ""
10055050-189 = "Хм? Постой, это же...!"
10055050-190 = "Сенсей, Сацуки! Посмотрите сюда!"
10055050-191 = "[s9] «Носовой платок?»\n[s10] «На нём какая-то эмблема...»"
10055050-192 = ""
10055050-193 = ""
10055050-195 = ""
10055050-196 = ""
10055050-197 = "Есть небольшие отличия, но..."
10055050-198 = "Я уверена! Это герб Геенны!"
10055050-199 = "Геенны? Покажи."
10055050-200 = ""
10055050-202 = ""
10055050-203 = ""
10055050-204 = ""
10055050-205 = "Хорошая работа, Чиаки. Это важная зацепка."
10055050-206 = "На этом платке, несомненно, изображён герб Геенны."
10055050-207 = "Значит, эти пираты были из Геенны?"
10055050-208 = "Но как он здесь оказался?"
10055050-209 = "Исключено. Если бы на пиратском корабле-призраке жили студенты Геенны, я бы о них знала."
10055050-210 = "..."
10055050-211 = "Эм, Сацуки?"
10055050-212 = "...*бормочет*"
10055050-213 = "[s11] «Вот это сосредоточенность...»\n[s12] «Она мгновенно погрузилась в работу»."
10055050-216 = "Ахаха... И правда."
10055050-217 = "...Кстати, мы точно можем просто так стоять здесь?"
10055050-218 = "Мы уже долго бродим и шумим... Наверняка те пираты нас догнали..."
10055050-219 = ""
10055050-221 = ""
10055050-222 = "А-а-а?! Я их случайно накликала?!"
10055050-223 = "И-и! Что такое?! Чиаки! Сенсей! Сделайте что-нибудь!"
10055050-225 = "Йо-хо-хо-хо! Вот вы где!"
10055050-226 = "[s] «Этот голос...»"
10055050-227 = ""
10055050-228 = "[ns] «Макото, это ты?»"
10055050-229 = ""
10055050-230 = "Нет. Ибо я вовсе не «Макото»."
10055050-231 = "Отныне зовите меня «Капитан Макото»!"
