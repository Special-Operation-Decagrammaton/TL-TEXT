[translation]
2002406-1 = "Пусть едят..."
2002406-2 = "Закончив дела на окраине кампуса, я направился в ближайший торговый район, чтобы поздно пообедать."
2002406-4 = "Торговый комплекс на окраине района Тринити"
2002406-5 = "[ns] «Один хлеб „Чокосора“, пожалуйста.»"
2002406-6 = "Ох, как жаль..."
2002406-7 = "Сегодня в обед был такой наплыв посетителей, что мы распродали весь выпеченный хлеб."
2002406-8 = "Боюсь, ничего не осталось. Простите..."
2002406-9 = "[s] «А поблизости есть другие пекарни?»"
2002406-10 = "К сожалению, нет. Мы единственный магазин в этом районе, где продают хлеб... Поэтому во время приёмов пищи он у нас часто заканчивается."
2002406-11 = "Мне очень жаль. Может быть, вас заинтересует другая выпечка...?"
2002406-12 = "[ns] «А мне так хотелось именно хлеба...»"
2002406-13 = ""
2002406-16 = ""
2002406-17 = "О, Сенсей! Здравствуйте!"
2002406-18 = "Какая неожиданность встретить вас так далеко!"
2002406-19 = "Что привело вас сегодня после обеда в этот удалённый торговый комплекс?"
2002406-20 = "Ох. Вы пришли в пекарню пообедать, но хлеб закончился?"
2002406-21 = "[s] «Да. А мне как раз очень хотелось хлеба...»"
2002406-22 = "Хи-хи... К счастью, эту проблему очень легко решить!"
2002406-23 = "Если нет хлеба, можно съесть пирожное."
2002406-24 = "[s] «Звучит немного... деспотично.»"
2002406-25 = "Хи-хи, не поймите меня неправильно. Я буквально это и имею в виду!"
2002406-26 = "Пирожное — это выпеченная смесь муки, жидкости, разрыхлителя и других ингредиентов, так что по форме и текстуре это вполне неплохая замена хлебу."
2002406-27 = "И оно довольно сытное. Я часто замечала, что после чаепития с пирожными мне уже не нужен ещё один приём пищи."
2002406-28 = "И как раз по совпадению неподалёку есть довольно недооценённая кондитерская, где сладости делают на заказ. Я только что забрала оттуда целый торт."
2002406-29 = "И, по ещё одному совпадению... запланированное на сегодня после обеда чаепитие отменили по непредвиденным обстоятельствам, и я как раз думала, с кем поделить этот огромный торт..."
2002406-30 = "Если хотите, давайте разделим его."
2002406-32 = "Мы с Нагисой приятно провели чаепитие и вместе съели торт."
