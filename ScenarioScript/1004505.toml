[translation]
1004505-1 = "Я хочу читать ваши мысли"
1004505-3 = "Я вышел наружу, и солнце уже садилось."
1004505-4 = ""
1004505-7 = ""
1004505-9 = "Когда я пришёл на пляж, то увидел Хошино, стоящую ко мне спиной на песке и смотрящую на горизонт."
1004505-10 = ""
1004505-12 = ""
1004505-13 = ""
1004505-14 = "А? Сенсей...?"
1004505-15 = "Что вы здесь делаете? Что-то случилось?"
1004505-16 = "[s1] «Просто пришёл посмотреть, как дела.»\n[s2] «Просто увидел тебя на пляже.»"
1004505-17 = "Хех. Глупенький."
1004505-18 = "Хех. Глупенький."
1004505-19 = ""
1004505-21 = ""
1004505-22 = "Кстати, я ни о чём тяжёлом не размышляю."
1004505-23 = "Если не уточню, вы ведь начнёте переживать, что что-то не так?"
1004505-24 = "Я просто пришла сюда послушать волны."
1004505-25 = "[s3] «Я не переживал.»\n[s4] «Я так и подумал.»"
1004505-26 = "О? Получается, вы умеете читать мои мысли?"
1004505-27 = "О? Получается, вы умеете читать мои мысли?"
1004505-28 = "[s5] «Ну, ты буквально смотрела на океан.»\n[s6] «Ты была очень сосредоточена на том, куда смотрела.»"
1004505-29 = "Ого, потрясающе, Сенсей."
1004505-30 = "Ого, потрясающе, Сенсей."
1004505-31 = "Вообще-то любоваться океаном — не моё обычное хобби."
1004505-32 = "Песка мне хватило на десять жизней вперёд, а вот вся эта вода... Это трудно осмыслить."
1004505-33 = "Океан такой огромный... и в нём помещается столько морских существ..."
1004505-34 = "Рыбы, морские ушки, киты..."
1004505-35 = "Жаль, что я могу видеть только поверхность, а не то, что находится под водой."
1004505-36 = "Но просто представлять, что там может быть, тоже приятно."
1004505-37 = "Да, приятно."
1004505-38 = "[s7] «На курорте может быть заброшенная подлодка.»\n[s8] «Ты уверена, что просто „приятно“ — достаточно?»"
1004505-39 = "Хаха. Кажется, я тоже умею читать ваши мысли, Сенсей."
1004505-40 = "Хаха. Кажется, я тоже умею читать ваши мысли, Сенсей."
1004505-41 = "Но всё нормально. Я просто хочу запомнить этот момент."
1004505-42 = "Даже если я нырну под воду, всё равно не смогу увидеть весь океан."
1004505-43 = "Хотелось бы увидеть его целиком сразу. И то, что наверху, и то, что внизу."
1004505-44 = "Хаха. Вот опять я стала жадной."
1004505-45 = ""
1004505-49 = "А?"
1004505-50 = ""
1004505-52 = ""
1004505-53 = "Что это было? Я что-то услышала вдали..."
1004505-54 = ""
1004505-57 = "О!"
1004505-58 = "[s9] «Это прыгающие кефали.»\n[s10] «Не знал, что здесь водится кефаль.»"
1004505-59 = ""
1004505-60 = ""
1004505-62 = ""
1004505-63 = "Рыбы? Это рыбы?!"
1004505-64 = "Но рыбы прыгают! Они так умеют?"
1004505-65 = ""
1004505-68 = "О-Она снова прыгнула! Сенсей, смотрите! Ещё раз!"
1004505-69 = "И там тоже! Что? Их так много!"
1004505-70 = ""
1004505-72 = ""
1004505-73 = ""
1004505-74 = "Хи-хи."
1004505-75 = "Я не хотела показывать вам эту свою сторону. Слишком увлеклась."
1004505-76 = "Сделайте вид, что ничего не видели, Сенсей. Мне немного неловко."
1004505-77 = ""
1004505-80 = "...А эти ребята и правда любят прыгать."
1004505-81 = "[s11] «Наверное, мимо проплывала стая кефали.»\n[s12] «Ради такого вида стоило прийти.»"
1004505-82 = "Как здорово."
1004505-83 = "...Ага."
1004505-84 = "Приятно просто сидеть и наблюдать за миром. Видишь то, чего обычно не замечаешь."
1004505-85 = "Похоже, хорошие вещи приходят к тем, кто умеет ждать. Было здорово это увидеть."
1004505-86 = "Ну... ладно."
1004505-87 = ""
1004505-89 = ""
1004505-91 = ""
1004505-93 = "...Это действительно было потрясающее зрелище."
