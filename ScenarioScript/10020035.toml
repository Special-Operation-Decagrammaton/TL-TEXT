10020035-12 = ""
10020035-13 = ""
10020035-14 = ""
10020035-19 = "Кхх!!!"
10020035-20 = "С-Стой! Кто... Кто ты?"
10020035-21 = "Она снова убежала..."
10020035-23 = ""
10020035-25 = ""
10020035-26 = "Х-Хошино... Что происходит?"
10020035-27 = "Что ты имела в виду, сказав, что это не наша Широко?"
10020035-29 = "..."
10020035-30 = "Её глаза... У Широко глаза не такие."
10020035-31 = "Этот взгляд был..."
10020035-33 = ""
10020035-35 = ""
10020035-36 = ""
10020035-38 = ""
10020035-40 = "Благодаря помощи Химари мы успешно взломали сеть связи Области 4."
10020035-41 = "Область 4 — это..."
10020035-42 = "Именно там обнаружили сигнал Широко. Подождите. Сейчас выведу изображение."
10020035-43 = ""
10020035-45 = ""
10020035-52 = "Э-Это..."
10020035-53 = ""
10020035-55 = ""
10020035-56 = ""
10020035-58 = ""
10020035-60 = ""
10020035-61 = ""
10020035-62 = "С-Широко?!"
10020035-63 = "Широко...?"
10020035-64 = "Да. Вы наконец меня нашли. Я ждала, Сенсей."
10020035-65 = "[ns] «Широко?! Ты в порядке?! Не ранена?! Что случилось?!»"
10020035-66 = ""
10020035-68 = "Меня похитили... Но я не знаю кто. Они схватили меня, когда я ехала на велосипеде обратно в академию."
10020035-69 = "Наверное, я потеряла бдительность, потому что думала, что похищают только таких, как Серика. Простите. Нужно было быть осторожнее."
10020035-70 = "Только таких, как я?! Что ты этим хочешь сказать, Широко?!"
10020035-71 = "Я знала, что вы все меня спасёте. Но я слишком долго просидела здесь взаперти, поэтому немного затекла..."
10020035-72 = "Раз они меня не ранили, могу только предположить, что собирались требовать выкуп."
10020035-73 = "Но Широко, если ты знала, что всего лишь заложница, почему не сидела спокойно и тихо? Почему выглядишь так, будто готова драться?"
10020035-74 = "Ты про это? О, я всегда ношу это в сумке. Удача любит подготовленных, верно?"
10020035-75 = "Когда я поняла, что на это место напали, начала планировать побег. А пока ждала подходящего момента, решила поискать здесь ценности..."
10020035-76 = ""
10020035-78 = ""
10020035-79 = ""
10020035-80 = "Даже в такой ситуации ты умудрилась придумать план?"
10020035-81 = "Хм..."
10020035-82 = "Широко действительно умеет извлекать максимум из плохой ситуации, да?"
10020035-83 = "Не помнишь, что я тебе говорила, Широко?"
10020035-84 = ""
10020035-86 = ""
10020035-88 = ""
10020035-90 = ""
10020035-92 = ""
10020035-94 = "Мм..."
10020035-95 = "Если привыкнуть идти на компромиссы, однажды мы перестанем даже замечать такие вещи."
10020035-96 = "И если единственный способ спасти школу — срезать углы, действительно ли мы достойны быть её частью?"
10020035-98 = "..."
10020035-99 = "...Широко."
10020035-100 = "Широко... Это правда она..."
10020035-101 = "Верно, Широко."
10020035-102 = "Держись. Теперь, когда мы нашли тебя, скоро придём спасать."
10020035-103 = "Хорошо."
10020035-104 = "Мы расскажем тебе обо всём, что ты пропустила, Широко — будут истории, способные довести до слёз!"
10020035-105 = "Хорошо! Тогда увидимся."
10020035-106 = "Хошино. Сенсей. Все... Я знала, что вы придёте меня спасать."
10020035-107 = "[s] «...Да. Конечно.»"
10020035-108 = "Тогда... *треск* Я буду... здесь..."
10020035-109 = ""
10020035-111 = ""
10020035-112 = "..."
10020035-113 = "Широко..."
10020035-114 = "Не будем терять время. Направляйтесь в следующую Область."
10020035-115 = "Широко заперта в Области 4. Нам нужно туда."
10020035-116 = "Хорошо! Всё ещё немного хаотично, но..."
10020035-117 = "Спасти Широко — наш главный приоритет. Со всем остальным разберёмся потом."
10020035-119 = "Держись, Широко! Мы идём!"
10020035-121 = "Осталась лишь одна область Ковчега... Область 4."
10020035-122 = "Если возьмём её под контроль, получим контроль над всем Ковчегом."
10020035-123 = "А когда активируем самоуничтожение, Ковчег Атрахасиса будет уничтожен!"
10020035-124 = ""
10020035-126 = ""
10020035-128 = "Настоящая Широко находится в закрытой зоне Области 4."
10020035-129 = "Но чтобы открыть ворота в эту зону, нужно пробраться в Специальную область в верхней части Ковчега и уничтожить комнату управления."
10020035-130 = "А что в ней такого особенного?"
10020035-131 = "Она отделена от Ковчега и изолирована от сети. Поэтому даже если взломаем Ковчег, этой секцией всё равно управлять не сможем."
10020035-132 = "То есть кому-то нужно попасть в эту Специальную область и уничтожить комнату управления просто ради того, чтобы открыть дорогу?"
10020035-133 = "Да, чтобы разблокировать секцию Области 4, где находится Широко."
10020035-134 = ""
10020035-136 = ""
10020035-137 = "Ну, пожалуй, для такого дела лучше нас людей не найти."
10020035-138 = "А тем временем Сенсей сможет уничтожить Двигатель измерений и захватить Область 4!"
10020035-139 = "Нужно очистить зону, чтобы Широко смогла сбежать."
10020035-140 = "[s] «Хорошо. Все будьте осторожны.»"
10020035-142 = "Будем! Не переживайте."
10020035-143 = "Хорошо! За дело!"
10020035-144 = "Мы направимся в Специальную область. Скоро увидимся."
10020035-145 = ""
10020035-148 = "Перед нами последняя битва за захват Ковчега Атрахасиса..."
10020035-149 = "Да. Верно. Последняя..."
10020035-150 = "Кстати, враги, похоже, тоже понимают, что это финальная битва."
10020035-151 = "Момока?"
10020035-152 = ""
10020035-155 = ""
10020035-156 = "Прямо сейчас к нашей позиции несётся огромное количество врагов."
10020035-157 = "Что?!"
10020035-159 = "...Похоже, Утнапиштим снова нужно защищать."
10020035-160 = ""
10020035-163 = "О, об этом не волнуйся."
10020035-165 = "Мы прекрасно справимся."
10020035-166 = "Мы ведь дошли так далеко, верно? К тому же теперь уже нельзя сдаваться, даже если захочется."
10020035-167 = "Ага! На нас всегда можно положиться, если нужно закончить с грохотом! ★"
10020035-168 = "Но когда мы уже сможем поесть космической еды...?"
10020035-170 = "Мы... так или иначе защитим это место."
10020035-171 = "Именно. Оставьте это нам, Сенсей."
10020035-172 = "Арис... Ты в порядке?"
10020035-173 = ""
10020035-174 = "Да. Я ещё не полностью восстановилась, но этого достаточно, чтобы сражаться вместе со всеми!"
10020035-175 = "И всё же... Не перенапрягайся, Арис!"
10020035-177 = "Хорошо!"
10020035-179 = "Сенсей, в этой последней битве... пожалуйста, позаботьтесь о нас."
