10005065-138 = "Вся охрана вокруг неё основана на бумажной работе и живой силе, мобильные телефоны на территории запрещены."
10005065-139 = "Немного старомодно, но необходимо, чтобы удержать её взаперти."
10005065-140 = "Кстати, кажется, скоро время её кормить."
10005065-141 = "Вижу этот взгляд, но не тратьте жалость зря."
10005065-142 = "Это ещё довольно мягко, учитывая ущерб, который она нанесла Миллениуму."
10005065-143 = "*вздыхает*"
