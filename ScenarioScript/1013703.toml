[translation]
1013703-1 = "Чувство времени детектива"
1013703-2 = "Я отправился на Чёрный рынок кое-что поискать."
1013703-3 = "После неудачных поисков я уже возвращался с пустыми руками, когда услышал шум из переулка."
1013703-6 = ""
1013703-7 = ""
1013703-8 = ""
1013703-9 = ""
1013703-10 = ""
1013703-11 = "ТЫ! Вернись сюда!! Иди сюда!!"
1013703-12 = "С какого хрена мне это делать?!"
1013703-13 = "Ну раз так, лучше надейся, что сумеешь убежать! Если поймаю — тебе конец!"
1013703-14 = "И-И-И-К!!"
1013703-15 = ""
1013703-17 = ""
1013703-21 = "Слушай, я важный человек и у меня важные дела! Если потрачу здесь слишком много времени, не успею выполнить обязанности!"
1013703-22 = "Поэтому!! Я ТЕБЯ УМОЛЯЮ!! Просто надень это!! Хорошо?!"
1013703-23 = "Вот! Наручники! Два отверстия! Две руки! Ты знаешь, что делать, да?"
1013703-24 = "Ты точно сумасшедшая, если думаешь, что я сама себя закую!"
1013703-25 = "У тебя вместо мозгов яичница?! ХИЯ!"
1013703-26 = ""
1013703-30 = ""
1013703-31 = "Ух...! *тяжело дышит*"
1013703-32 = "Хаха! Пули с тефлоновым покрытием! Больно, да?"
1013703-33 = "Какой идиот вообще пытается блокировать пули СУМКОЙ?"
1013703-34 = "Даже стандартный бронежилет Валькирии не выдержит бой с этими малышами!"
1013703-35 = ""
1013703-37 = ""
1013703-41 = "ЧЕ-Е-Е-ЕГО?!?!?!"
1013703-42 = "Мы только что высадили в неё целый магазин!"
1013703-43 = "Это же какое неуважение — стрелять в школьную сумку студенты!!"
1013703-44 = "Моя драгоценная книга «Этика и этикет студенты Валькирии»!! Она в клочья!"
1013703-45 = "И ЧТО ТЫ ТЕПЕРЬ С ЭТИМ СДЕЛАЕШЬ?!"
1013703-46 = ""
1013703-48 = ""
1013703-57 = "Ай! Ау! Ты сама прикрылась сумкой!! А-А-А!"
1013703-58 = ""
1013703-62 = "Пытаешься подставить невинного образцового студента?! А?! ТЫ! ЗЛО!"
1013703-63 = "А-А! Хватит меня бить! Если эта дурацкая книга тебе так дорога, почему она вся в скотче?!"
1013703-64 = ""
1013703-68 = "ПОТОМУ ЧТО ОНА ТАКАЯ ДОРОГАЯ!! Искупай свою вину!!"
1013703-69 = "Тогда! Хватит!! БИТЬ МЕНЯ ЕЮ!! Ай!! А-А-А!!"
1013703-71 = "Ты точно из Валькирии?! Ведёшь себя как психопатка, а не офицер!! И-И-И-К!!"
1013703-72 = "Тебя это бесит? Тогда заходишь на сайт, скачиваешь документы на поступление, заполняешь от руки и отправляешь по факсу. И обязательно напиши, что я тебя рекомендовала."
1013703-73 = "Вернёмся к делу. Хочешь, я изобью тебя здесь и отвезу с собой, или ты добровольно наденешь наручники, пойдёшь со мной и я изобью тебя уже в участке?"
1013703-74 = "Что... ты вообще несёшь...?!"
1013703-75 = "У тебя два варианта! Быстро выбирай!"
1013703-76 = ""
1013703-77 = "[ns] «Э-Эм... Может, просто поговорим...?»"
1013703-78 = "С-Сенсей из Шале?!"
1013703-79 = "Спасите меня!"
1013703-80 = "Эй!! Не пытайся жаловаться на меня Сенсею! Это нечестно!!"
1013703-81 = "Привет, Сенсей! Мы тут просто как дети дурачились. Да? ДА?!"
1013703-82 = ""
1013703-83 = "[ns] «Может, вам всем просто... ладить...?»"
1013703-84 = "*вдох* Вы меня ругаете?!"
1013703-85 = "О, точно! Сенсей! Который сейчас час?"
1013703-86 = "Эй, ты! Оплати мой телефон! Ты разбила его своей головой!"
1013703-87 = "...Только потому, что ты им меня била!!"
1013703-88 = ""
1013703-89 = "[ns] «Сейчас 5:59...»"
1013703-90 = "...!"
1013703-91 = "?"
1013703-92 = "17:59... А... Время заканчивать смену."
1013703-93 = "Вот, дам тебе эти наручники. Надень и приходи в Валькирию завтра ровно к 9 утра. Сбежишь — будешь мертвее мёртвого."
1013703-94 = "Обещаешь, хорошо? Увидимся завтра!"
1013703-95 = "Прошу прощения, Сенсей, но мне НУЖНО отметиться вовремя!"
1013703-96 = "Пока!"
1013703-97 = ""
1013703-98 = "[ns] «Ч-Что...?»"
1013703-99 = ""
1013703-101 = ""
1013703-102 = ""
1013703-103 = "...Что?"
1013703-104 = "Она... ушла посреди ареста... просто потому, что закончилась смена...?"
1013703-105 = "С Валькирией всё нормально...?"
1013703-106 = "[s] «Сам не знаю...»"
1013703-108 = "Следующий день, 8:59"
1013703-109 = "Я почти забыл странный случай прошлого дня, когда услышал огромный шум."
1013703-110 = ""
1013703-112 = ""
1013703-113 = ""
1013703-114 = "И-и-и-к?! Это буквально другой конец города!! Откуда ты знала, где я?!"
1013703-115 = "Я шла по хлебным крошкам, идиотка! Я дала тебе очень конкретные инструкции!!"
1013703-116 = "Я всю ночь следила за тобой на всякий случай. И ты вообще не собиралась сдаваться!"
1013703-117 = "Но ты сказала, что смена закончилась! ТЫ СКАЗАЛА, ЧТО СМЕНА ЗАКОНЧИЛАСЬ!!"
1013703-118 = "Слежка за людьми — просто моё хобби, это другое!"
1013703-119 = "До девяти осталось 8 секунд! Не дай мне поймать тебя до начала смены!"
1013703-120 = "УА-А-А-А-А!! Спасите!! Я больше никогда не буду делать ничего плохого!!!"
1013703-121 = ""
1013703-123 = ""
1013703-124 = ""
1013703-125 = ""
1013703-127 = "Ровно в девять Коно́ка мгновенно арестовала подозреваемую."
1013703-128 = "Когда наши взгляды встретились, она посмотрела на время и победно улыбнулась."
