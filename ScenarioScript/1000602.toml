[translation]
1000602-1 = "Большое недоразумение"
1000602-2 = "Торговый район Кивотоса"
1000602-4 = "Я случайно уронил монету в 100 иен возле автомата."
1000602-5 = "Монета покатилась к канализационному люку и проскользнула в щель."
1000602-6 = "[s] Открыть люк и поискать монету."
1000602-8 = "(хлоп!)"
1000602-11 = "А? Что ты вообще делаешь?!"
1000602-14 = ""
1000602-15 = ""
1000602-16 = "...Сенсей?"
1000602-17 = "[s] «...»"
1000602-18 = "..."
1000602-19 = "[s] «...»"
1000602-20 = "Пожалуй, надо позвонить Префектурной команде и сообщить, что я наконец поймала извращенца, который тут ошивается..."
1000602-21 = "[s] «Кажется, произошло недоразумение.»"
1000602-22 = "Недоразумение? Хорошая попытка!"
1000602-23 = "Люки сделали только ради одного. Зачем ещё тебе открывать его и лезть внутрь?"
1000602-24 = "Ты хотел спрятаться там и заглядывать под юбки всем проходящим девушкам!"
1000602-25 = "[s] Попытаться объяснить."
1000602-26 = "Ты искал монету?"
1000602-27 = "Тебе, наверное, совсем мало платят. Столько возни ради одной монетки..."
1000602-28 = "Если тебе так нужны деньги, Сенсей, просто скажи. Я заплачу."
1000602-29 = "Что, слишком гордый, чтобы принять деньги от студента? Это всего 100 иен. В чём проблема?"
1000602-30 = "И не придётся искать мелочь в канализации."
1000602-31 = "А? Ты всё ещё там не из-за денег? Тогда почему...?"
1000602-32 = "[s1] «Кто бы знал, что из канализации открываются такие виды?»\n[s2] «Ты была права. Отсюда твои ноги выглядят неплохо.»"
1000602-33 = "Ч-что ты сейчас сказала?!"
1000602-34 = "Ч-что ты сейчас сказала?!"
1000602-35 = "Умри, извращенец!"
1000602-37 = "В итоге я всё-таки нашёл монету, но после моей маленькой шутки Иори больше никогда не относилась ко мне по-прежнему."
