[translation]
2002005-1 = "Спор гениального хакера"
2002005-9 = "Получив срочный звонок от Химари, я сразу отправился в её убежище."
2002005-10 = ""
2002005-15 = "[ns] «Химари! Всё в порядке?!»"
2002005-16 = ""
2002005-17 = "О, Сенсей. Ты пришёл."
2002005-18 = ""
2002005-21 = "[ns1] «Эм, ты вроде в порядке.»\n[ns2] «Ты говорила, что это срочно...?»"
2002005-24 = "Конечно."
2002005-25 = "Несмотря на моё спокойствие, у меня большие проблемы, Сенсей."
2002005-26 = "Причина, по которой я кажусь такой спокойной и собранной, разумеется..."
2002005-27 = "в том, что я, прекрасный супергениальный хакер Миллениума, которой все восхищаются как хрупким цветком, овладела искусством непроницаемого лица."
2002005-28 = "О, какая трагедия! Красавица, столь одарённая и почитаемая, вынуждена скрывать запутанные переживания собственного сердца..."
2002005-29 = "Какая печальная, но неизбежная история..."
2002005-30 = ""
2002005-33 = "[ns3] «Да с тобой всё прекрасно!»\n[ns4] «Так что случилось, Химари...?»"
2002005-36 = "Как обычно, я изящно проводила время, наслаждаясь тонкостями культуры... когда наткнулась на шокирующее открытие."
2002005-37 = "Пожалуйста, взгляните."
2002005-38 = ""
2002005-41 = "Химари достала сплетнический журнал Школы журналистики «Кронос», который я уже видел раньше."
2002005-42 = "[s] «А где тут те самые тонкости культуры, которыми ты наслаждалась?!»"
2002005-43 = "Не отвлекайтесь. Проблема прямо перед нами. Мне было очень больно это увидеть."
2002005-44 = ""
2002005-47 = "Химари указала на главную статью. Её заголовок гласил..."
2002005-48 = "[ns5] «Шок! Вы не поверите, кто возглавляет хакерский коллектив Веритас...»\n[ns6] «Скряга и нарушительница спокойствия с ужасным характером! Спецвыпуск!»"
2002005-51 = "[ns] «...На что я вообще смотрю?»"
2002005-52 = "Понятия не имею, откуда они взяли, что я скряга и нарушительница спокойствия с ужасным характером."
2002005-53 = "То есть, посмотрите на меня. Первая мысль в голове — «хрупкий прекрасный цветок», правда?"
2002005-54 = "[s] «К-конечно...»"
2002005-55 = "Простите? Что это за ответ?"
2002005-56 = "А, поняла..."
2002005-57 = "Когда что-то ценное всегда рядом, начинаешь ценить это только после потери..."
2002005-58 = "Наверное, это тот самый «синдром Синей птицы», о котором я столько слышала. Какая трагедия."
2002005-59 = "[s] «Я не понимаю...»"
2002005-60 = "Не волнуйтесь, потом это исправим. Сейчас важно то, что всё написанное здесь — клевета. Или диффамация. Неважно."
2002005-61 = "Они даже не раскрывают мою личность! Просто пишут, что я её скрываю!"
2002005-62 = "[s] «А разве нет?»"
2002005-63 = "Но, то есть... Постойте, вы хотите сказать, это случилось именно потому, что я скрываю личность?"
2002005-64 = "Ну..."
2002005-65 = "Наверное, логично: если никто не знает, кто я, никто не сможет понять, когда обо мне что-то выдумывают..."
2002005-66 = "*вздыхает* Какая неожиданная слепая зона..."
2002005-67 = "[s7] «Чем сильнее скрываешься, тем глубже такие журналы будут копать.»\n[s8] «Ты боишься, что они раскроют твою личность?»"
2002005-70 = "Хм?"
2002005-71 = "О, нет... Этого я не боюсь. Я более чем уверена в своей способности скрывать информацию."
2002005-72 = "[s] «Тогда... в чём проблема?»"
2002005-73 = ""
2002005-76 = "Если уж на то пошло, меня раздражают безосновательные обвинения насчёт моей личности и так называемых злодеяний."
2002005-77 = ""
2002005-80 = "Как и обещал заголовок, статья, на которую указала Химари, была полна догадок и смутных подозрений."
2002005-81 = "Например, что президент присваивает средства клуба Веритас..."
2002005-82 = "Я всегда присваивала всё честно и даже делилась с другими участниками!"
2002005-83 = ""
2002005-86 = "Что она стоит за многочисленными киберпреступлениями, происходившими в Миллениуме..."
2002005-87 = "Чепуха! Они вообще знают, сколько киберпреступлений я остановила?"
2002005-88 = "А вы сами вообще знаете?"
2002005-89 = "Я... Эм..."
2002005-90 = "Ну, знаете, бывает: когда тебя внезапно спрашивают, ты вдруг не можешь вспомнить ответ, который прекрасно знал секунду назад? Вот сейчас именно так..."
2002005-91 = ""
2002005-94 = "Она хранит тюбик зубной пасты до самого конца и даже разрезает его ножницами, чтобы использовать буквально последнюю каплю..."
2002005-95 = "А? Разве не все так делают? Это просто здравый смысл."
2002005-96 = "К тому же для меня сходить за новой пастой — целое событие."
2002005-97 = "[s] «Да, это я могу понять.»"
2002005-98 = ""
2002005-101 = "Она придумала «План майского исчезновения», который устроил хаос по всему Миллениуму."
2002005-102 = "Какая наглость с их стороны."
2002005-103 = "...Хотя да, признаю, тот случай, возможно, немного вышел из-под контроля, и Чи даже отчитала меня..."
2002005-104 = "[s] «Ты даже не отрицаешь, что это была ты!»"
2002005-105 = "Почему вы всегда цепляетесь за неважные вещи? Суть в том, что статья переполнена ложью и клеветой. Или диффамацией. Неважно."
2002005-106 = "Я не могу позволить этим нелепым слухам кружить вокруг меня, скрываю я личность или нет."
2002005-107 = "И не только потому, что это вредит мне."
2002005-108 = "Это пятнает репутацию Веритас. Более того, это оскорбление истины. А если есть что-то, что мне дорого, так это ясная, ничем не сдерживаемая, чистая истина."
2002005-109 = "[s] «Понятно... И что ты будешь делать? Потребуешь исправить статью?»"
2002005-110 = "А? Зачем мне это?"
2002005-111 = "Печально известная Школа журналистики «Кронос» не поддастся таким робким попыткам."
2002005-112 = ""
2002005-114 = ""
2002005-116 = ""
2002005-118 = "Нужно хорошенько всё встряхнуть. Хе-хе-хе."
2002005-119 = ""
2002005-123 = "И, как оказалось, «встряхнуть» означало снять видео «Правдивое самопредставление подтверждённого президента Веритас»."
2002005-127 = "[s] «Ты точно уверена, что уверена в этом?!»"
2002005-128 = "Абсолютно."
2002005-129 = "Истина никого не ждёт, но люди часто ждут истину. Значит, нам нужно проявить инициативу и дать людям ту правду, которой они ждали..."
2002005-130 = "В этом видео я, Акебоши Химари, расскажу о невероятном превосходстве Отряда Исследования Сверхъестественного и президента Веритас."
2002005-131 = "Я даже расскажу им о добрых делах, которые этот прекрасный супергениальный хакер совершает ежедневно, и о том, насколько окружающие доверяют и уважают её."
2002005-132 = "И кто расскажет об этом лучше меня самой?"
2002005-133 = "[s] «Вообще-то кто угодно. Такое о себе обычно не говорят...»"
2002005-135 = "[ns] «Химари, разве видео с самопредставлением — лучшая идея, пока ты скрываешь личность?»"
2002005-136 = "Признаю, на первый взгляд это может показаться непреодолимой проблемой."
2002005-137 = "Именно поэтому я позвала вас сегодня сюда."
2002005-138 = "Нам нужно придумать способ донести чистую истину и при этом не дать никому узнать мою настоящую личность."
2002005-139 = "[s] «Придумать... Есть идеи для начала?»"
2002005-140 = "Как насчёт этого?"
2002005-141 = "Размоем видео и изменим мой голос так, чтобы меня было совершенно невозможно узнать."
2002005-142 = "[s] «Наверное, это может сработать...»"
2002005-143 = "Хорошо, попробуем."
2002005-146 = "Следуя воодушевлённым указаниям Химари, мы сняли тестовое видео."
2002005-147 = ""
2002005-153 = "Когда посмотрели результат..."
2002005-156 = "[ns] «Всё видео размыто, а голос очевидно искажён, так что...»"
2002005-157 = ""
2002005-159 = ""
2002005-160 = "Я выгляжу в точности как подозрительный преступник, которым они пытаются меня выставить, да?"
2002005-161 = "[s] «С-Следующая! Давай следующую идею!»"
2002005-164 = "После этого мы попробовали разные идеи, которые предлагала Химари."
2002005-167 = "Я хочу скрыть внешность настолько, чтобы сохранить личность в тайне..."
2002005-168 = "Но оставить достаточно, чтобы моя врождённая величественность президента Веритас сияла сквозь маскировку."
2002005-169 = "[s] «...Кто-то вообще поверит в достоинство человека, который скрывает личность?»"
2002005-170 = "Хм... А как насчёт этого?"
2002005-171 = "Просто закроем мои глаза чёрной полосой."
2002005-172 = "Недостаточно?"
2002005-173 = "Хм, сложно..."
2002005-174 = "О, а если спрятать глаза другим способом?"
2002005-175 = "Например... повязкой на глаз?"
2002005-176 = "У меня есть повязка с изображением какого-то подозрительного бегемота..."
2002005-177 = "Что? Пероро не бегемот? Взять слова назад?"
2002005-178 = "Вы куда более... страстно относитесь к таким вещам, чем я думала, Сенсей."
2002005-179 = "[s9] «Разве это не моя реплика?»\n[s10] «И я не думаю, что просто спрятать глаза будет достаточно...»"
2002005-182 = "Хм, неожиданно сложно."
2002005-183 = "Любое счастье требует жертв..."
2002005-184 = "Истинная суть человеческого существования."
2002005-185 = "[s] «Когда всё стало таким мрачным?!»"
2002005-186 = "Я всего лишь хочу рассказать всю правду, скрыв свою личность и одновременно позволив всей силе моего достоинства проявиться в видео."
2002005-187 = "А если подумать, разве не важно, чтобы качество изображения и угол камеры соответствовали материалу?"
2002005-188 = "[s] «Серьёзно? Ты теперь ещё условия добавляешь?»"
2002005-189 = ""
2002005-191 = ""
2002005-192 = "Ах."
2002005-193 = "Хе-хе-хе."
2002005-194 = "У меня потрясающая идея."
2002005-196 = "Мы можем скрыть мою личность, не жертвуя достоинством: вместо лица покажем на экране картинку..."
2002005-197 = "Или применим минималистичный подход и оставим на экране только мой силуэт..."
2002005-198 = "О, и мои инициалы."
2002005-199 = "Да-да. Мне нравится. В голову приходит всё больше новых инновационных идей."
2002005-200 = ""
2002005-209 = "После множества проб и ошибок мы наконец закончили видео."
2002005-214 = "Да, теперь всё складывается."
2002005-215 = ""
2002005-218 = "[ns] «Теперь видео готово. Как ты его доставишь? По электронной почте?»"
2002005-219 = "О, я уже отправляла письма с жалобами, но их всегда игнорируют. Думаю, они сразу попадают в спам. Так не сработает."
2002005-220 = "[s] «Тогда... какой план?»"
2002005-221 = "Самый эффективный способ связи — тот, который нельзя проигнорировать..."
2002005-222 = ""
2002005-224 = ""
2002005-225 = ""
2002005-227 = "Я напрямую получу контроль над базой данных школы «Кронос» и загружу видео туда."
2002005-228 = ""
2002005-231 = "[ns] «Нет-нет-нет-нет-нет. Ты вообще понимаешь, что это преступление?!»"
2002005-232 = "Я уже загрузила видео."
2002005-233 = "Скоро выйдут новости школы «Кронос». Посмотрим, как они это извратят!"
2002005-234 = ""
2002005-239 = "Срочные новости!"
2002005-240 = "Около пяти минут назад в сети школы «Кронос» было обнаружено нарушение безопасности!"
2002005-241 = "Мы не знаем, кто нарушитель, но уверены, что это серьёзная угроза!"
2002005-242 = ""
2002005-245 = "Что? Нарушитель загрузил видео, похожее на признание?"
2002005-246 = "О! Ну... давайте посмотрим!"
2002005-247 = ""
2002005-251 = ""
2002005-252 = "Проверка, проверка. Здравствуйте, школа «Кронос»."
2002005-253 = "Позвольте представиться. Я супергениальный хакер Миллениума, эфемерно прекрасный, хрупкий, вечно цветущий миниатюрный цветок..."
2002005-254 = ""
2002005-255 = "А? Не стоит начинать так? Но это самопредставление. Я должна представиться..."
2002005-256 = "Что? Имя? А, точно."
2002005-257 = "Да, не волнуйтесь, я помню... Это, эм... О! Точно."
2002005-258 = ""
2002005-260 = ""
2002005-261 = ""
2002005-262 = "Меня зовут H. Кодовое имя H."
2002005-263 = "Цель этого видео — выступить против несправедливости Школы журналистики «Кронос», донести людям истину, чтобы—"
2002005-266 = "Ух ты! Как видите, опасная угроза в виде подозрительного видео от скрывающейся личности, называющей себя Кодовым именем H, была направлена против Школы журналистики «Кронос»!"
2002005-267 = "Поскольку этот материал явно является признанием вины, школа «Кронос» считает ситуацию достаточно серьёзной для подробного анализа видео!"
2002005-268 = "Однако мы хотим, чтобы зрители знали одно!"
2002005-269 = "Школа журналистики «Кронос» не ведёт переговоры с жалобщиками!"
2002005-270 = "Чтобы узнать больше точных подробностей, смотрите нас в следующий раз...!"
2002005-271 = ""
2002005-276 = "[ns] «Химари... Так, эм...»"
2002005-277 = ""
2002005-278 = "Хм..."
2002005-279 = "Я устала, мой мозг устал, и тело устало."
2002005-280 = ""
2002005-282 = ""
2002005-283 = "Хахаха. Сенсей, хотите сходить выпить кофе?"
2002005-284 = "[ns] «Ты просто собираешься спрятать голову в песок?!»"
2002005-286 = "После долгих вздохов я отчитывал девушку, чьи проблемы вышли далеко за пределы школы «Кронос» и распространились по всему Кивотосу."
