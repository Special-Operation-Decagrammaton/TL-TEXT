[translation]
10055020-1 = "Episode 2: The Girl's Drift Diary"
10055020-5 = "……It’s the same no matter how many times I try."
10055020-6 = "The connection is completely dead. The communication device has stopped working as well."
10055020-7 = "Is it impossible to fix?"
10055020-8 = "I’ve only been able to take a cursory look, but... as a tank commander, my assessment is..."
10055020-9 = "It would be accurate to say the engine has lived out its natural life."
10055020-10 = "Um... what does that mean?#nCan you fix it or not?"
10055020-11 = "Technically, yes. #nIf we can procure a new engine or parts, that is."
10055020-12 = "Out here in the middle of the ocean?"
10055020-13 = "Yes... so, it’s likely impossible."
10055020-14 = "……Iroha, are you angry, by any chance?"
10055020-15 = "…………."
10055020-16 = "……Sigh, I apologize. #nThat wasn't like me. I just got so frustrated, I couldn't help it."
10055020-17 = "Especially when everyone here is a victim, except for the culprit."
10055020-21 = "Why don't we summarize the situation for now?"
10055020-22 = "Chiaki, go bring Makoto here."
10055020-23 = "Yes! Understood!"
10055020-28 = "Iroha, please check our supplies. #nAnything relevant to our survival plan."
10055020-29 = "Also, check one more time to see if there are any spare parts we can use for repairs."
10055020-30 = "I can't believe our vacation turned into such a hassle... Oh well, I'm going."
10055020-35 = "I suppose this is all we can do for now."
10055020-36 = "[s] \"Satsuki, you're very calm.\""
10055020-37 = "That's not true. I'm anxious too."
10055020-38 = "But there's no point in being anxious, is there?"
10055020-39 = "Usually, Makoto would handle things, but..."
10055020-40 = "Hm? You mean Makoto? Yes, I trust her."
10055020-41 = "Isn't that obvious? Makoto is an amazing person, after all."
10055020-42 = "[s1] \"Is that so...?\"\n[s2] \"That's a lot of trust...\""
10055020-45 = "Hmm? I wonder if you have different standards for evaluating people, Sensei?"
10055020-46 = "It's interesting, but... well, that's not important right now."
10055020-47 = "Let's talk about that later, once we've safely returned to land."
10055020-48 = "For now... let's see."
10055020-49 = "Shall we wait until Makoto arrives?"
10055020-51 = "……I see. So that's the situation."
10055020-55 = "Iroha, why didn't you inform me immediately!"
10055020-56 = "Reporting, communicating, and consulting are the basics!"
10055020-60 = "Well, I only just found out myself."
10055020-61 = "Besides, Makoto-senpai, you were dead to the world from seasickness the whole time."
10055020-62 = "Gah! Can you only give canned responses!? You're acting like a bureaucrat!"
10055020-63 = "……Weren't you the one who started that, Makoto-senpai?"
10055020-64 = "Never mind the details!"
10055020-65 = "Satsuki, report the current status!"
10055020-66 = "Engine stopped. Communication with land is impossible. #nWe are truly drifting."
10055020-67 = "The only saving grace is that we have a decent amount of supplies left, I suppose?"
10055020-68 = "Though, it's only enough for about a week. #nLong-term cruises aren't possible on a boat like this, and we left most of our supplies on land."
10055020-69 = "A week's worth? Then there's no problem at all."
10055020-70 = "…………."
10055020-71 = "Heh-heh, you look confused, Iroha. #nBut think about it logically."
10055020-72 = "This is an unprecedented situation where we, the executives of the Pandemonium Society, cannot be reached. #nAnd for a whole week, at that."
10055020-73 = "The other members, and Gehenna as a whole, will surely be searching for us with everything they've got."
10055020-74 = "Huh? Were we really that important?"
10055020-75 = "What are you saying, as the secretary of the Pandemonium Society? #nIt's obvious!"
10055020-76 = "Now that you mention it, that's true. I wasted my time worrying."
10055020-77 = "In other words, we should just enjoy our one-week cruise to the fullest!"
10055020-78 = "……It’s always like this."
10055020-79 = "Hm? What’s with that dissatisfied look?"
10055020-80 = "No, nothing at all."
10055020-81 = "Well, I suppose you have a point. We didn't drift that far, and if we're lucky, we might run into another ship..."
10055020-82 = "We might even run into Odyssey Maritime School while they're on their cruise."
10055020-83 = "Heh-heh! You finally understand! With me, Makoto-sama, by your side, nothing can possibly go wrong!"
10055020-84 = "Rest easy and enjoy your vacation!"
10055020-86 = "[log]Day 4 of Drifting[/log]"
10055020-90 = "…………."
10055020-91 = "…………."
10055020-92 = "What day is it today...?"
10055020-93 = "Who knows."
10055020-94 = "The food seems to have dwindled quite a bit, too."
10055020-95 = "Indeed."
10055020-96 = "I’ve been thinking... just a little bit."
10055020-97 = "――Isn't this a dangerous situation?"
10055020-98 = "No. #nIt is a very dangerous situation."
10055020-100 = "[ns3] \"I-It's okay!\"\n[ns4] \"A rescue team will be here soon...!\""
10055020-103 = "……Could you at least look me in the eye when you say that?"
10055020-104 = "Well, we still have supplies, so it should last..."
10055020-105 = "Another week... that should be fine."
10055020-106 = "[s5] \"Didn't you say a week before?\"\n[s6] \"There's still more?\""
10055020-109 = "That is..."
10055020-113 = "……Sensei, do you have a moment?"
10055020-117 = "……It’s safe here."
10055020-118 = "I’m sure you’ve guessed it by now."
10055020-119 = "I’ve been secretly managing the supplies."
10055020-120 = "Making four portions look like five, cutting out desserts, and so on."
10055020-121 = "Well, it’s only natural, isn't it..."
10055020-125 = "I mean, logically speaking, isn't it strange to consume food on the original schedule when we're stranded!?"
10055020-126 = "[s7] \"True!\"\n[s8] \"Does anyone else know about this...?\""
10055020-129 = "No one knows. I’m the one managing the supplies, after all."
10055020-130 = "First of all, no good would come from Makoto-senpai knowing."
10055020-131 = "I haven't told Satsuki-senpai because I don't know how she'd react. #nHer actions are unpredictable."
10055020-132 = "Chiaki is relatively reasonable, but she's bad at lying, so she's not suited for sharing secrets."
10055020-133 = "And Ibuki is..."
10055020-134 = "Ah! Sensei!"
10055020-138 = "Oh, Iroha-senpai is here too!"
10055020-139 = "What is it, Ibuki?"
10055020-140 = "Um, you know! There was a dolphin over there..."
10055020-145 = "Oh, it disappeared! It was there just a second ago!"
10055020-149 = "Ibuki, are you having fun?"
10055020-150 = "Yeah! It's super fun!"
10055020-151 = "Aren't you having fun, Iroha-senpai?"
10055020-152 = "……I’m having fun too."
10055020-153 = "Hehe! Good!"
10055020-159 = "You understand, don't you, Sensei?"
10055020-160 = "[s9] \"The fact that we're stranded is a secret, right?\"\n[s10] \"She'd get worried, wouldn't she?\""
10055020-163 = "It might be rude to say this, but—"
10055020-164 = "—I’m really glad you’re here with us, Sensei."
10055020-165 = "If it were just us... *sigh*."
10055020-166 = "That said, we need to start thinking about serious countermeasures."
10055020-167 = "I said a week, but I don't know when rescue will arrive. #nJust rationing supplies will eventually reach its limit..."
10055020-168 = "…………."
10055020-169 = "……*sigh*."
10055020-170 = "Why do I have to be the one to worry about this... It’s truly a hassle."
10055020-171 = "[s11] \"I-I'll help as much as I can!\"\n[s12] \"Let's do our best together.\""
10055020-174 = "Especially since you’re a guest, Sensei... We’re both having a hard time."
10055020-175 = "……For now, let’s take things one at a time."
10055020-176 = "The most important thing for survival is—"
10055020-177 = "—food."
10055020-181 = "……."
10055020-182 = "Oh, Sensei."
10055020-183 = "[s13] \"Your eyes look dead...!\"\n[s14] \"Are you okay? Did something happen!?\""
10055020-186 = "No... nothing happened."
10055020-187 = "That is the problem, actually..."
10055020-188 = "At first, I thought being stranded would be a huge scoop... but I realized something."
10055020-189 = "Drifting means—repeating days with no change or stimulation!"
10055020-190 = "This is no different from a prison... #nI’ve been writing a journal, at least..."
10055020-191 = "But not having any reader feedback is..."
10055020-192 = "I hope someone who finds this one day will read it..."
10055020-193 = "Why are you saying such ominous things..."
10055020-194 = "Oh, Iroha-chan."
10055020-198 = "Oh, what’s that?"
10055020-199 = "A fishing rod. #nCould you help me with this?"
10055020-200 = "A fishing rod? I didn't know we had one."
10055020-201 = "I found it while looking for spare parts. #nIt was stuck in a gap in the floor; it probably belonged to someone who borrowed it before."
10055020-202 = "I don't know if an amateur can catch anything, but... I thought it was better than doing nothing."
10055020-203 = "Nice idea! Yes, yes! I'll do it!"
10055020-204 = "Is that really something to get so excited about...?"
10055020-205 = "I'm so bored it's painful! This is perfect!"
10055020-206 = "There are exactly two fishing rods. Here you go."
10055020-211 = "……I didn't think it would be easy to catch anything."
10055020-212 = "But I didn't think we'd catch nothing at all."
10055020-213 = "Fishing is a battle against time, you know!"
10055020-214 = "And getting skunked is common in lure fishing!"
10055020-215 = "……You’re surprisingly knowledgeable."
10055020-216 = "Ah! Actually, I’m an honorary member of the Fishing Club!"
10055020-217 = "Did our school even have one of those...?"
10055020-218 = "We do! Though we haven't been able to do any activities..."
10055020-219 = "……Does that club even have a purpose?"
10055020-220 = "It does! We're building a dam at Mt. Hinom... if things go well, we're planning to have a river running through Gehenna Academy in two years!"
10055020-221 = "A river crossing the academy... don't you want to see that with your own eyes?"
10055020-225 = "That’s putting the cart before the horse..."
10055020-226 = "No, I was wrong. I shouldn't think too deeply about what our students do."
10055020-227 = "……."
10055020-232 = "……What is it? Staring at my face so suddenly."
10055020-233 = "I’ve been thinking for a while now..."
10055020-234 = "Iroha-chan, you don't seem interested in Gehenna Academy at all."
10055020-235 = "……?"
10055020-236 = "Oh, no, I am, but... that’s sudden."
10055020-242 = "Well, you know, Iroha-chan, you're in the Pandemonium Society, right? #nThe Pandemonium Society is basically the student council of Gehenna."
10055020-243 = "Basically, or rather, it *is* the student council."
10055020-244 = "Exactly. But you can't do student council work without love for the school, right?"
10055020-245 = "I suppose... No, I haven't really thought about it that way."
10055020-246 = "I do it because the work is in front of me. #nI can do that much even without love."
10055020-247 = "Hey..."
10055020-248 = "Why did you join the Pandemonium Society, Iroha-chan—"
10055020-254 = "……! Chiaki, I’ve got a bite!"
10055020-255 = "Oh, ahhh!? W-w-w-wait!! Iroha-chan, help me!!"
10055020-256 = "You're in the Fishing Club, aren't you!?"
10055020-257 = "This is my first time actually doing it!"
10055020-258 = "Honestly...! Give it here!"
10055020-271 = "G-got it...! #nWhat do I do now...!?"
10055020-272 = "Iroha-chan! Look, the net!"
10055020-273 = "Wait, hold on, this thing is too lively...!!"
10055020-282 = "Ouch..."
10055020-283 = "[s15] \"Are you okay!?\"\n[s16] \"That was a pretty hard hit, right?\""
10055020-286 = "……It’s nothing. I made a louder noise than I expected, though."
10055020-287 = "Iroha-chan, help me up."
10055020-288 = "You can stand up yourself. Don't be so clingy."
10055020-292 = "It's so cold."
10055020-293 = "Anyway, the fish we caught... Oh! Sensei, you were holding it!"
10055020-297 = "Is this really what we caught...?"
10055020-298 = "Wow! A huge catch!"
10055020-299 = "I thought it was small."
10055020-300 = "It looked much bigger when it bit..."
10055020-301 = "Well, proving that we can be self-sufficient is a big step forward."
10055020-302 = "Eh?"
10055020-303 = "What is it?"
10055020-304 = "No, self-sufficient..."
10055020-305 = "Are we going to eat this?"
10055020-306 = "Yes, why?"
10055020-307 = "How...?"
10055020-308 = "Grilling it...?"
10055020-312 = "Come to think of it, we were saving fuel. #nThen, sashimi it is..."
10055020-313 = "Iroha-chan, can you fillet a live fish?"
10055020-314 = "……."
10055020-318 = "……."
10055020-319 = "……That’s right, Chiaki, you’re in the School Lunch Club, aren't you?"
10055020-320 = "I’m relieved. I can leave it to you, Chiaki."
10055020-321 = "T-the School Lunch Club is different!?"
10055020-322 = "I-I really can't handle filleting living things..."
10055020-323 = "Ah! Maybe ask Sensei..."
10055020-324 = "……That’s not a bad idea."
10055020-325 = "Let’s keep asking Sensei as a last resort."
10055020-327 = "[ns17] \"Am I that unreliable...?\"\n[ns18] \"I'll do it.\""
10055020-330 = "That’s not what I meant..."
10055020-331 = "Sensei is a guest."
10055020-332 = "……Well, in this situation, that might be meaningless. #nAt least one person thinks so, that's all."
10055020-333 = "Ahaha... Makoto-senpai has a sense of responsibility, too, in her own way..."
10055020-334 = "That person has a sense of responsibility...? Are you serious?"
10055020-335 = "Um, I just thought that maybe she thinks that way, even if she doesn't say it out loud..."
10055020-339 = "Anyway. I’ll handle the fish."
10055020-340 = "Wow! Is this Iroha-chan's homemade cooking!? My first time since joining the Pandemonium Society!!"
10055020-341 = "Being stranded isn't all bad!"
10055020-342 = "I’m telling you, don't get your hopes up. It’s my first time, too."
10055020-344 = "First, the scales..."
10055020-345 = "No, the head... Whoa!?"
10055020-352 = "I’ll ask just in case."
10055020-353 = "Iroha... what is this... mysterious object...?"
10055020-354 = "……It’s sashimi."
10055020-358 = "Chiaki! Honestly, how long are you going to keep laughing!!"
10055020-359 = "Because, look at this... Ahahahaha!"
