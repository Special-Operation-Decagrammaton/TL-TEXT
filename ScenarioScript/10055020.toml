[translation]
10055020-1 = "Эпизод 2;Пятеро в открытом море"
10055020-2 = ""
10055020-3 = ""
10055020-4 = ""
10055020-5 = "...Я уже всё перепробовала."
10055020-6 = "Это теперь скорее груда железа, чем двигатель. И связи у нас нет: оборудование тоже осталось без питания."
10055020-7 = "Ты можешь его починить?"
10055020-8 = "Как командир танка, я немного разбираюсь в ремонте. Не хочу обещать ничего, пока не разберусь получше, но технически — да."
10055020-9 = "Двигатель просто старый. Его ресурс окончательно исчерпан."
10055020-10 = "Что это значит? Починишь или нет?"
10055020-11 = "Починить могу. Если заменить двигатель. Или хотя бы необходимые детали."
10055020-12 = "А существует доставка запчастей для кораблей прямо в открытое море?"
10055020-13 = "Тогда нет. Не могу."
10055020-14 = "Эм, Ироха... Ты злишься?"
10055020-15 = "..."
10055020-16 = "...*вздох* Простите. Обычно я так не срываюсь."
10055020-17 = "Но все мы знаем, на кого я на самом деле злюсь. Мы здесь жертвы, а виновница себе беззаботно дрыхнет."
10055020-18 = ""
10055020-20 = ""
10055020-21 = "Давайте оценим ситуацию."
10055020-22 = "Чиаки, разбуди Макото и приведи сюда."
10055020-23 = "Сейчас!"
10055020-24 = ""
10055020-26 = ""
10055020-27 = ""
10055020-28 = "Ироха, проверь, какие у нас сейчас запасы. Если мы действительно застряли, придётся придумать, как их распределять."
10055020-29 = "И посмотри заодно, нет ли запасных деталей, которыми можно починить двигатель."
10055020-30 = "Разве это не должен был быть мой летний ОТПУСК? Ух, ладно, ладно. Вечно всё заканчивается одним и тем же..."
10055020-31 = ""
10055020-33 = ""
10055020-34 = ""
10055020-35 = "Полагаю, пока это всё, что мы можем сделать."
10055020-36 = "[s] «Ты хорошо держишься, Сацуки»."
10055020-37 = "Ничего подобного. Я беспокоюсь не меньше остальных."
10055020-38 = "Но тревогами делу не поможешь, так что лучше сосредоточусь на том, что в моих силах."
10055020-39 = "Макото наверняка уже придумала бы какое-нибудь решение."
10055020-40 = "М? Доверяю ли я Макото?"
10055020-41 = "Безоговорочно. Она потрясающий человек."
10055020-42 = "[s1] «Мы ведь говорим о Макото, да...?»\n[s2] «Не могу понять, почему ты ей так доверяешь»."
10055020-45 = "Любопытно. Похоже, у нас с вами разные критерии оценки людей."
10055020-46 = "Да, это интересно, но сейчас не имеет отношения к делу."
10055020-47 = "Обсудим это, когда благополучно вернёмся на сушу."
10055020-48 = "...А пока посмотрим."
10055020-49 = "Остаётся дождаться Макото."
10055020-51 = "...Понятно. Подумать только, я ничего об этом не знала."
10055020-52 = ""
10055020-54 = ""
10055020-55 = "Ироха! Почему ты не доложила мне сразу же, как это случилось?!"
10055020-56 = "Докладывать! Сообщать! Советоваться! Это основы работы любой организации!"
10055020-57 = ""
10055020-59 = ""
10055020-60 = "Ты вообще о чём? Я буквально только что сама узнала."
10055020-61 = "А ты всё это время валялась без сил."
10055020-62 = "Надоели твои отговорки! Ты... Ты прислужница бюрократии!"
10055020-63 = "«Докладывать! Сообщать! Советоваться!» Кто это только что сказал? Ты. Пять секунд назад."
10055020-64 = "Ты... Ты придираешься к словам!!"
10055020-65 = "Хватит! Сацуки! Доложи о положении дел!"
10055020-66 = "Двигатель вышел из строя, связь с сушей потеряна... Мы действительно дрейфуем в открытом море."
10055020-67 = "Единственное утешение — у нас ещё достаточно припасов."
10055020-68 = "Недельный запас я бы не назвала «достаточным». Мы не рассчитывали на такую долгую поездку и оставили многое в порту."
10055020-69 = "Неделя? Тогда всё будет просто замечательно!"
10055020-70 = "..."
10055020-71 = "Кихехе! Не понимаешь? Подумай, Ироха."
10055020-72 = "Бывало ли такое, чтобы всё руководство Общества Пандемониум исчезало хотя бы на день-два, не говоря уже о целой неделе?"
10055020-73 = "Нас будут искать не только остальные члены Пандемониума. Все студенты академии Геенна поднимутся спасать своих лидеров!"
10055020-74 = "Спасать... нас? Мы настолько важны?"
10055020-75 = "Не могу поверить, что наш собственный секретарь задаёт такой вопрос! Нет никого важнее нас!"
10055020-76 = "Если посмотреть на это так, даже не знаю, из-за чего мы вообще переживали."
10055020-77 = "Теперь у нас лишь одна задача: расслабиться и наслаждаться заслуженными каникулами всю следующую неделю!"
10055020-78 = "...Вечно она такая."
10055020-79 = "Ироха? На что ты там ворчишь?"
10055020-80 = "Ни на что. Забудь."
10055020-81 = "Хотя в чём-то она права. Да и отплыли мы не так далеко. Рано или поздно наверняка встретим рыбаков."
10055020-82 = "А ещё лучше, если попадётся патрульный катер «Одиссеи». Они смогут отбуксировать нас к берегу."
10055020-83 = "Кихехе! Теперь поняли? У меня никогда ничего не идёт не по плану!"
10055020-84 = "Так что расслабьтесь и наслаждайтесь летними каникулами!"
10055020-86 = "[log]Четвёртый день в открытом море[/log]"
10055020-89 = ""
10055020-90 = "..."
10055020-91 = "..."
10055020-92 = "Давно не виделись."
10055020-93 = "Ага. Давненько."
10055020-94 = "Припасы тают на глазах."
10055020-95 = "Ага. Тают."
10055020-96 = "Есть ли... хотя бы... малейшая вероятность..."
10055020-97 = "Мы в опасности?"
10055020-98 = "Мы уже по уши в ней."
10055020-99 = ""
10055020-100 = "[ns3] «Д-давайте не будем унывать!»\n[ns4] «Помощь может прийти в любую минуту!»"
10055020-103 = "...Если уж собираетесь мне лгать, хотя бы имейте смелость смотреть в глаза."
10055020-104 = "Радует только одно: с запасами у нас пока всё неплохо."
10055020-105 = "Должно хватить ещё... на неделю. Да, хотя бы на неделю."
10055020-106 = "[s5] «Ты говорила то же самое в первый день...»\n[s6] «Откуда у нас до сих пор столько запасов...?»"
10055020-109 = "Это..."
10055020-110 = ""
10055020-112 = ""
10055020-113 = "...Сенсей, можно вас на минутку?"
10055020-116 = ""
10055020-117 = "...Вот теперь будет интересно."
10055020-118 = "Думаю, вы уже догадываетесь, что я собираюсь рассказать."
10055020-119 = "На самом деле я при каждой возможности понемногу откладывала припасы."
10055020-120 = "По мелочи: растягивала четыре порции на пятерых, делила десерты на кусочки поменьше..."
10055020-121 = "А почему..."
10055020-122 = ""
10055020-124 = ""
10055020-125 = "Разве не очевидно? Мы застряли в море! Какой смысл продолжать питаться так, будто мы на роскошном круизе?!"
10055020-126 = "[s7] «Полностью с тобой согласен!»\n[s8] «Остальные об этом знают...?»"
10055020-129 = "Нет, никто из них. Всё равно запасами занималась только я."
10055020-130 = "Не могу придумать ни одной причины рассказывать Макото."
10055020-131 = "Сацуки поступает как ей вздумается, а я не люблю иметь дело с непредсказуемыми обстоятельствами."
10055020-132 = "Чиаки бы поняла, но в жизни не встречала человека, который хуже умеет лгать. Её сразу раскусят."
10055020-133 = "К тому же..."
10055020-134 = "А! Сенсей!"
10055020-136 = ""
10055020-137 = ""
10055020-138 = "О, Ироха тоже здесь!"
10055020-139 = "Всё хорошо, Ибуки?"
10055020-140 = "Да! Просто, эм, там был дельфин..."
10055020-141 = ""
10055020-143 = ""
10055020-144 = ""
10055020-145 = "А теперь уплыл! Ибуки честно-честно его видела!"
10055020-146 = ""
10055020-148 = ""
10055020-149 = "Тебе весело, Ибуки?"
10055020-150 = "Да! Ибуки очень-очень весело!"
10055020-151 = "А тебе, Ироха? Тебе тоже весело?"
10055020-152 = "Конечно. С тобой мне всегда весело."
10055020-153 = "Хи-хи-хи! Ибуки так рада!"
10055020-154 = ""
10055020-156 = ""
10055020-157 = ""
10055020-158 = ""
10055020-159 = "...Вы же понимаете, Сенсей?"
10055020-160 = "[s9] «Ибуки нельзя знать, что мы на самом деле застряли в море».\n[s10] «Она испугается и начнёт переживать, если узнает»."
10055020-163 = "Наверное, это прозвучит странно, но..."
10055020-164 = "Я очень рада, что вы тоже здесь, Сенсей."
10055020-165 = "Если бы вас не было, а остались только мы..."
10055020-166 = "Ладно, нам нужно всерьёз обдумать, что делать дальше."
10055020-167 = "Даже если припасов хватит ещё на неделю, без помощи это ничего не даст. Бесконечно растягивать запасы не выйдет."
10055020-168 = "..."
10055020-169 = "*вздыхает*"
10055020-170 = "Неужели на всей лодке больше никто об этом не беспокоится? Ну и морока."
10055020-171 = "[s11] «Я-я сделаю всё, что смогу, чтобы помочь тебе!»\n[s12] «Мы вместе справимся!»"
10055020-174 = "Вы ведь попали во всё это как приглашённый гость... Достаётся нам обоим."
10055020-175 = "...Будем решать проблемы по одной. Начнём с самого срочного."
10055020-176 = "Если хотим выжить, наш главный приоритет — это..."
10055020-177 = "...конечно же, еда."
10055020-180 = ""
10055020-181 = "..."
10055020-182 = "О, Сенсей..."
10055020-183 = "[s13] «Почему ты сама не своя?!»\n[s14] «Что-нибудь случилось?!»"
10055020-186 = "Ничего... Совсем ничего... не произошло..."
10055020-187 = "И именно в этом проблема!"
10055020-188 = "Я так ждала этих каникул! Думала, найду грандиозную сенсацию, которая взорвёт интернет... Но я, Мотомия Чиаки, секретарь Общества Пандемониума, совсем забыла о реальности."
10055020-189 = "Когда изо дня в день сидишь посреди океана с одними и теми же людьми, ничего не меняется!"
10055020-190 = "Для меня это худшее, что можно представить! Я, конечно, каждый день веду дневник, но..."
10055020-191 = "Я скучаю по читателям. По их откликам на мои статьи..."
10055020-192 = "Надеюсь, кто-нибудь, кто найдёт нашу лодку... в далёком будущем... с удовольствием его прочитает..."
10055020-193 = "Обязательно говорить таким зловещим тоном?"
10055020-194 = "О, Ироха!"
10055020-195 = ""
10055020-197 = ""
10055020-198 = "Хм? Это что?"
10055020-199 = "Удочка. И как удачно: я как раз хотела попросить тебя помочь."
10055020-200 = "У нас всё это время была удочка?"
10055020-201 = "Только что нашла её, пока искала запчасти. Она глубоко застряла в какой-то щели. Наверное, хозяин лодки забыл о ней."
10055020-202 = "Не знаю, поймаем ли мы что-нибудь без всякого опыта, но попробовать стоит."
10055020-203 = "О-о! Я хочу! Хочу!"
10055020-204 = "Вот кому не терпится снова поработать..."
10055020-205 = "Если мне придётся ещё хоть секунду сидеть без дела, я взорвусь!"
10055020-206 = "Там было две удочки, так что можем попробовать обе."
10055020-210 = ""
10055020-211 = "...Я знала, что это будет непросто."
10055020-212 = "Но ведь даже ни одной поклёвки..."
10055020-213 = "Говорят, в рыбалке главное — терпение!"
10055020-214 = "К тому же мы ловим на искусственную приманку, так что поклёвок и должно быть меньше, чем на живую наживку."
10055020-215 = "...Удивительно, что ты столько об этом знаешь..."
10055020-216 = "Ну, вообще-то я почётный член Рыболовного клуба."
10055020-217 = "У нас есть Рыболовный клуб?"
10055020-218 = "Ещё как! Правда, в Геенне толком негде ловить рыбу, так что мы пока ни разу не рыбачили."
10055020-219 = "...Тогда какой в нём вообще смысл?"
10055020-220 = "Чтобы рыбачить! Когда-нибудь! Рядом с вулканом Хинном сейчас строят плотину, и по прогнозам через два года закончат! Прямо посреди Геенны появится река!"
10055020-221 = "Река, протекающая через академию... Вот ЭТО будет сенсация!"
10055020-222 = ""
10055020-224 = ""
10055020-225 = "Тебя совсем не туда занесло..."
10055020-226 = "Знаешь, сама виновата. Мне давно пора перестать пытаться понимать чудаков среди наших студентов."
10055020-227 = "..."
10055020-228 = ""
10055020-230 = ""
10055020-231 = ""
10055020-232 = "...Что? Чего ты так смотришь?"
10055020-233 = "Хм, просто я давно хотела тебя кое о чём спросить..."
10055020-234 = "Тебе ведь, по большому счёту, почти безразлична наша академия, правда?"
10055020-235 = "...?"
10055020-236 = "Не стану отрицать, но с чего ты вообще взяла?"
10055020-237 = ""
10055020-239 = ""
10055020-240 = ""
10055020-241 = ""
10055020-242 = "Ну, ты ведь состоишь в Обществе Пандемониума, а оно, по сути, студенческий совет Геенны."
10055020-243 = "Понимаю, почему ты говоришь «по сути», но это и ЕСТЬ студенческий совет."
10055020-244 = "Ладно, верно. Но зачем брать на себя столько дополнительной работы в студсовете, если тебе вообще не важна академия?"
10055020-245 = "...Хм. Не знаю. Никогда об этом не думала."
10055020-246 = "Если работу нужно сделать, а больше некому, я просто делаю её. При чём тут мои чувства к Геенне?"
10055020-247 = "...Можно задать ещё вопрос?"
10055020-248 = "Почему ты вступила в Общество Пандемониум...?"
10055020-250 = ""
10055020-253 = ""
10055020-254 = "...! Чиаки, твоя удочка!"
10055020-255 = "А-а?! А-а-а?! Ироха, помоги!"
10055020-256 = "Ты разве не в Рыболовном клубе?!"
10055020-257 = "Да! Но я же говорила! Мы никогда по-настоящему не рыбачили!"
10055020-258 = "Ты что... Просто дай её мне!"
10055020-259 = ""
10055020-261 = ""
10055020-262 = ""
10055020-264 = ""
10055020-266 = ""
10055020-270 = ""
10055020-271 = "П-подожди! Я об этом не подумала!"
10055020-272 = "Ироха! Сачок, вот он!"
10055020-273 = "П-постой! Она никак не перестанет биться!"
10055020-274 = ""
10055020-276 = ""
10055020-277 = ""
10055020-281 = ""
10055020-282 = "Ай-ай..."
10055020-283 = "[s15] «Ты в порядке?!»\n[s16] «Звучало больно!»"
10055020-286 = "А... Всё хорошо. Звук был страшнее, чем удар."
10055020-287 = "Ироха, помоги-и-и!"
10055020-288 = "Ты серьёзно? Хватит драматизировать, вставай."
10055020-289 = ""
10055020-291 = ""
10055020-292 = "Какая зла-а-ая."
10055020-293 = "Но главное, где наша рыба?! А, Сенсей спас положение! Рыба у вас!"
10055020-294 = ""
10055020-296 = ""
10055020-297 = "Это... и есть рыба, которую мы поймали?"
10055020-298 = "Ого! Какой огро-о-омный улов!"
10055020-299 = "Для муравья, пожалуй."
10055020-300 = "Когда она билась на леске, казалась гораздо больше."
10055020-301 = "Но всё равно это важно. Теперь у нас есть ещё один источник еды."
10055020-302 = "А?"
10055020-303 = "Что такое?"
10055020-304 = "Поправь меня, если я ослышалась, но ты сейчас назвала ЭТО «едой»?"
10055020-305 = "Ты собираешься... это есть?"
10055020-306 = "Да? Мы все собираемся..."
10055020-307 = "И как... именно?"
10055020-308 = "Можно пожарить её на гриле..."
10055020-309 = ""
10055020-311 = ""
10055020-312 = "Хотя нам нужно беречь топливо, так что, может, просто сделаем сашими."
10055020-313 = "А ты вообще умеешь... чистить рыбу? И потрошить её?"
10055020-314 = "..."
10055020-315 = ""
10055020-317 = ""
10055020-318 = "..."
10055020-319 = "...Эй, ты ведь ещё и в Клубе школьного питания состоишь, да?"
10055020-320 = "Восхищаюсь. Какая же ты талантливая! Как ты всё успеваешь?"
10055020-321 = "Я-я НЕ состою?! Вообще ни капельки?! Не выдумывай мне биографию!"
10055020-322 = "Я не очень-то люблю... разделывать живых существ..."
10055020-323 = "Придумала! Пусть Сенсей сделает всё за нас!"
10055020-324 = "...Неплохая идея, но пока оставим её в запасе."
10055020-325 = "На самый крайний случай."
10055020-326 = ""
10055020-327 = "[ns17] «Я для вас всего лишь крайний случай...?»\n[ns18] «Я ведь совсем не против помочь»."
10055020-330 = "Нет, не совсем..."
10055020-331 = "Вы ведь приехали сюда как наш гость."
10055020-332 = "...Честно говоря, спустя пару дней об этом уже можно было забыть, но кое-кто до сих пор воспринимает это всерьёз."
10055020-333 = "А-ха-ха... В каком-то смысле это особенное чувство ответственности Макото..."
10055020-334 = "«Ответственности»? Мы точно об одном человеке говорим?"
10055020-335 = "Она не всегда говорит об этом прямо, но намерение у неё есть... Где-то очень глубоко внутри..."
10055020-336 = ""
10055020-338 = ""
10055020-339 = "Ладно, с рыбой я сама разберусь."
