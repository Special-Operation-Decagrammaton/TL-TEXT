[translation]
90000005-1 = "Эпизод 1;Пролог"
90000005-3 = "Здравствуйте, Сенсей. Спасибо, что пришли."
90000005-4 = "Простите, что позвали так внезапно. Дело срочное, и чем меньше людей о нём знает, тем лучше."
90000005-5 = ""
90000005-7 = ""
90000005-8 = "Идите за мной. Там кое-кто ждёт встречи с вами."
90000005-11 = ""
90000005-12 = "[USERNAME] Сенсей прибыл, Президент."
90000005-13 = ""
90000005-16 = ""
90000005-17 = "Спасибо, Эйми. Рада, наконец, с Вами познакомиться, Сенсей."
90000005-18 = "Меня зовут Химари. Гениальная хакерша Миллениума."
90000005-19 = "[s] «Ты очень в себе уверена.»"
90000005-20 = "Да. Слава обо мне идёт впереди меня, так что Вы наверняка хотя бы раз обо мне слышали."
90000005-21 = "Может, до вас доходили слухи о прекрасном президенте Веритас, скрытой завесой анонимности? О самом воплощении кроткой девы?"
90000005-22 = "Чистый и хрупкий цветок Миллениума... Вы наверняка слышали легенды."
90000005-23 = "[s1] «Ни разу.»\n[s2] «Может и слышал...»"
90000005-24 = "Что?! В-Вы уверены?"
90000005-25 = "Но это невозможно..."
90000005-26 = "..."
90000005-27 = "Сделайте что-нибудь, Сенсей. Я никогда не видела Президента такой унылой."
90000005-28 = "Нет. Это просто значит, что мне нужно приложить больше усилий к формированию своего образа."
90000005-29 = "Хи-хи-хи..."
90000005-30 = "Хи-хи-хи..."
90000005-31 = "Видите, что Вы наделали, Сенсей? Эго Президента бесконтрольно раздувается."
90000005-32 = "Прошу, Эйми. Это совсем не так."
90000005-33 = "Я лишь наслаждалась подтверждением того, что мои усилия по созданию образа оказались успешными."
90000005-34 = "Продолжим. Недавно меня назначили президентом Отряда Исследования Сверхъестественного."
90000005-35 = "Это значит, что малышка Чихиро возьмёт на себя мои обянанности в Веритас."
90000005-36 = "[s] «Что такое Отряд Исследования Сверхъестественного?»"
90000005-37 = "Уникальный клуб, основанный Рио, президентом Семинара."
90000005-38 = "Не окажешь ли честь объяснить, Эйми?"
90000005-39 = "Мы работаем напрямую под руководством Семинара, и наша цель в том, чтобы исследовать явления, на которые наука не может дать ответа."
90000005-40 = "До недавнего времени я была единственным членом, поскольку клуб не проявлял почти никакой активности."
90000005-41 = "Никогда не думала, что Рио назначит меня президентом сомнительного клуба, который она скрывала. Да ещё и клуба с одним единственным членом."
90000005-42 = "Поправка. Теперь, когда Вы здесь, у клуба два члена, Президент Химари."
90000005-43 = "Верно, и какая интересная из нас пара. Я — болезненный и хрупкий цветок, и ты — цветущая юная леди. Хи-хи."
90000005-44 = "Да, я также рада с Вами работать, Президент."
90000005-45 = "Кстати. Мне одной кажется или здесь как-то жарковато?"
90000005-46 = ""
90000005-48 = ""
90000005-49 = "Наверное, только тебе. Как по мне, тут довольно прохладно, так что в кондиционере нет нужды."
90000005-50 = ""
90000005-52 = ""
90000005-53 = "И руки прочь от молний, юная леди. Только не при гостях."
90000005-54 = "[s] «Так тебе нужна была моя помощь?»"
90000005-55 = "Нужна. И именно поэтому мы попросили Вас прийти."
90000005-56 = "Как Вы, вероятно, знаете, мы с Рио уже довольно долгое время находимся не в самых тёплых отношениях."
90000005-57 = "Она — одна из тех контролирующих старших сестёр, когда как я — свободный дух, презирающий ограничения. Нам физически невозможно ужиться."
90000005-58 = "Если уж нас и сравнивать, то я буду чистейшей минеральной водой первого сорта, охлаждённой до идеальной температуры... а она просто тёплой водой из-под крана."
90000005-59 = "Или лучше сравнить ей с грязной канализационной водой, а меня с чистейшей ледниковой водой, нетронутой цивилизацией."
90000005-60 = "Нет, не так. Она была бы экскрементами, а я..."
90000005-61 = "Я была бы... Хмм. Должно же быть сравнение получше."
90000005-62 = "Президент, Вы уходите от темы."
90000005-63 = "Да, ты права. Суть в том, что я взяла за правило отказывать Рио во всём, о чём бы она меня не попросила..."
90000005-64 = "...но потом она сделала предложение, от которого я не смогла отказаться. Так я и стала президентом Отряда Исследования Сверхъестественного."
90000005-65 = "И так уж вышло, что для выполнения этой её просьбы потребуется тесное сотрудничество с Шале."
90000005-66 = "Потому-то мы Вас и вызвали."
90000005-67 = "[s] «Так о чём именно она попросила?»"
90000005-68 = ""
90000005-70 = ""
90000005-71 = "Декаграмматон."
90000005-72 = "Я знаю, Вам знакомо это имя, Сенсей. По моим данным, именно Шале первым столкнулось со свидетельствами существования этого беспрецедентного ИИ."
90000005-75 = "«Целью было исследовать божество, доказать его существование и, если возможно, проанализировать его устройство. Если такое возможно, значит, его можно воспроизвести. Так можно создать нового бога.»"
90000005-76 = "На основе этой гипотезы была создана Система Автономного Анализа Абсолютного Существа."
90000005-77 = "Иными словами, это искусственный интеллект, ищущий божественность."
90000005-79 = "Я провела собственное расследование, но не обнаружила доказательств существования подобного явления."
90000005-80 = "Я также не смогла подтвердить, реальна ли организация «Гематрия», о которой Вы писали в отчёте."
90000005-81 = "Неизвестных слишком много, чтобы исследовать всё, опираясь только на слова Шале."
90000005-82 = "Это не значит, что я не верю Вашим отчётам. Просто такова процедура проверки доказательств."
90000005-83 = "Мы бы не позвали Вас сюда, если бы Вам не доверяли."
90000005-84 = "Именно. Более того, мы просим помощи Шале."
90000005-85 = "Недавно Хаб, встроенный сетевой ИИ Миллениума, был взломан другим неопознанным ИИ."
90000005-86 = "Хаб — черезвычайно продвинутая система, которую развивали и совершенствовали всю историю Миллениума."
90000005-87 = "Можно сказать, это вершина технологического мастерства Миллениума. Настоящий шедевр."
90000005-88 = "И всё же он противостоял атаке другого ИИ всего 0,00000031 секунды."
90000005-89 = "Мы с Рио подозреваем, что загадочный ИИ, взломавший Хаб, и есть Декаграмматон из Вашего отчёта."
90000005-90 = "И в подтверждение этого..."
90000005-91 = ""
90000005-93 = ""
90000005-94 = ""
90000005-96 = "...после взлома Хаб оставил в коммуникационной сети Миллениума такие слова."
90000005-98 = "Наконец, я нашёл путь к провидению."
90000005-100 = "Ахх. Мой путь — исполнение через честь."
90000005-102 = "Моим титулом будет — Слава через Великолепие."
90000005-104 = "Я — Ход."
90000005-106 = "Восьмой пророк, свидетель бога десяти#nбожественных букв и предвестник чудес."
90000005-110 = "Десять божественных букв... Иными словами, Декаграмматон."
90000005-111 = "Из этого можно сделать два вывода."
90000005-112 = "Первый: Декаграмматон подчиняет другие ИИ, с которыми вступает в контакт, делая их своими пророками."
90000005-113 = "Рио считает, что взлом нацелен на модуль личности, но у меня другая теория."
90000005-114 = "Думаю, это ближе к промывке моз... Нет, не совсем. Будто Декаграмматон вдохновляет сам ИИ через внушение."
90000005-115 = "Второй: пророки Декаграмматона продолжают действовать автономно, а не ассимилируются им."
90000005-116 = "Это подтверждается и тем, что Ход назвал себя свидетелем бога десяти божественных букв."
90000005-117 = "Казалось бы, Декаграмматону проще всего было бы ассимилировать другие ИИ, если цель — просто заставить их выполнять приказы. Но строго говоря,#nон не контролирует своих пророков."
90000005-118 = "Потому я предполагаю, что Декаграмматон каким-то образом побуждает их действовать автономно."
90000005-119 = "Этот метод неэффективен и иррационален, особенно для ИИ. Так почему?"
90000005-120 = "Это нам и предстоит исследовать."
90000005-121 = ""
90000005-123 = ""
90000005-124 = ""
90000005-126 = "Что скажете, Сенсей? Поможет ли Шале Отряду Исследования Сверхъестественного в изучении и анализе Декаграмматона?"
90000005-128 = "Следующий Эпизод;Исследование, Часть 1: Пустыня"
