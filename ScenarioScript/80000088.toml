80000088-14 = "Д-Да, это шоколадная кора."
80000088-15 = "Я, эм, очень хотела купить вам что-то получше... но я н-не могу позволить себе дорогой магазинный шоколад... П-Простите..."
80000088-16 = "Поэтому я просто, эм... с-сделала немного сама... Это всего лишь шоколад из сухпайка, смешанный с фруктами, которые я с-собрала в горах."
