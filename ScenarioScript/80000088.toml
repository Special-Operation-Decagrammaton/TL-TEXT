80000088-18 = "Эм... Угх. В-Вы разочарованы, да? Вы н-не захотите есть такой уродливый шоколад..."
80000088-19 = "[s] «Вовсе нет. Меня очень тронула твоя искренность, Мию.»"
80000088-20 = "К-Конечно, вы бы так и сказали, но... Я з-знаю, что другие студенты подарили вам много шоколада. Д-Да?"
80000088-21 = "И-и среди всех этих р-роскошных шоколадок эти странные уродливые листочки... Их, к-конечно же, забудут..."
80000088-22 = "И н-не успеете заметить, как забудете, что я вообще что-то вам дарила..."
80000088-23 = "И-и в конце концов обо мне никто не вспомнит, а я останусь забытой вместе с этим п-пыльным шоколадом на задней полке шкафа..."
