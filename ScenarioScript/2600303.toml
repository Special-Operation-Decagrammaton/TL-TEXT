[translation]
2600303-1 = "Ангел ночного дежурства"
2600303-2 = "День выдался настолько тяжёлым, что к его концу у меня едва оставались силы моргать."
2600303-3 = "(Работы было невпроворот, и мне пришлось есть прямо за столом, не прекращая работать.)"
2600303-5 = "(В какой-то момент я потерял счёт времени, и дальше почти ничего не помню.)"
2600303-6 = "(Уже поздно.)"
2600303-7 = "Хм-хм. Хм-хм-м!"
2600303-8 = "[s] «...?»"
2600303-11 = "Хм... А?"
2600303-12 = "О. Ты проснулся, Сенсей?"
2600303-13 = "Ты снова довёл себя до изнеможения переработками. Даже представить не могу, насколько плотный у тебя график."
2600303-14 = "Ты наверняка вымотан. Поэтому Серина здесь, чтобы помочь!"
2600303-15 = "Помнишь наше обещание? Я сказала, что буду рядом, когда понадоблюсь."
2600303-16 = "Хотелось бы, чтобы ты позвал меня до того, как всё дошло до такого..."
2600303-18 = "Не так быстро! Полотенце на лбу соскользнёт."
2600303-19 = "И ещё я наклеила обезболивающие пластыри на шею, руки и поясницу."
2600303-20 = "Когда придёт время, я сама их сниму. Тебе не о чем беспокоиться, Сенсей!"
2600303-21 = "[s1] «Ты сделала всё это, пока я спал?»\n[s2] «И я от этого не проснулся?»"
2600303-22 = "Да. Я удивилась, насколько крепко ты спал. Вообще не проснулся."
2600303-23 = "Да. Я удивилась, насколько крепко ты спал. Вообще не проснулся."
2600303-24 = "Я переживала, что полотенце и пластыри будут мешать, когда буду их накладывать."
2600303-25 = "Наверное, ты действительно был ужасно вымотан, раз ничего не заметил."
2600303-26 = "Я же говорила не переутомляться, Сенсей! Слушай меня!"
2600303-27 = "Пациенты, которые игнорируют советы медсестры, хуже всех. Н-Ну, технически я не медсестра, но всё же..."
2600303-28 = "В общем, если снова меня проигнорируешь, я тебе всё выскажу!"
2600303-29 = "Что? Моё прикосновение такое мягкое, что тебе кажется, будто ты ещё спишь...?"
2600303-30 = "П-Прекрати! Лестью ты ничего не добьёшься, Сенсей!"
2600303-31 = ""
2600303-32 = "Сенсей... сказал, что я нежная..."
2600303-33 = ""
2600303-34 = "А? Н-Ничего! Я ничего не говорила! Просто разговаривала сама с собой..."
2600303-35 = "Погоди, Сенсей! Ты пытаешься сменить тему, пока я тебя ругаю!"
2600303-36 = "Ты просто воплощение плохого пациента. Если заболеешь, я уколю тебя самой большой иглой, какая у меня есть."
2600303-37 = "[s3] «Я искренне прошу прощения за своё поведение.»\n[s4] «Не-е-ет! Только не иголки!»"
2600303-40 = ""
2600303-41 = "...Ничего. Просто задумалась."
2600303-42 = "Я понимаю, что с твоими обязанностями мало что можно сделать."
2600303-43 = "Не думаю, что тебе нравится работать сверхурочно до полного изнеможения..."
2600303-44 = "...но и отвернуться от всех людей, которым ты нужен, ты не можешь."
2600303-45 = "Так что мне остаётся только заботиться о тебе настолько хорошо, насколько смогу."
2600303-46 = "..."
2600303-47 = "Если искать плюсы, было забавно посмотреть, как ты выглядишь во сне."
2600303-48 = "Так что не всё плохо. Даже чувствую себя немного привилегированной. Хи-хи."
2600303-49 = "О, уже пора снимать пластыри. Я сама, сиди спокойно."
2600303-50 = ""
2600303-51 = ""
2600303-52 = "Эм... Я..."
2600303-53 = "Наклеить их было легко, но... теперь, когда ты проснулся, немного неловко."
2600303-54 = "Обрабатывать твоё тело в сознании как-то странно, поэтому..."
2600303-55 = "...если не против, можешь снова потерять сознание, Сенсей?"
2600303-56 = "Не думаешь, что сможешь так быстро уснуть? Не волнуйся. У меня есть методы."
2600303-57 = "Говорят, если вот так похлопывать человека, ему легче уснуть..."
2600303-58 = "Ты сам назвал меня нежной, Сенсей, так что не сопротивляйся."
2600303-59 = "А теперь расслабься и устройся поудобнее!"
2600303-60 = "Тебе о-о-очень хочется спать. Закрывай глаза..."
2600303-61 = "Просто расслабься и позволь моим рукам творить чудеса. Сначала плечи, потом шея..."
2600303-63 = "(...Я действительно начинаю засыпать.)"
2600303-65 = "(Когда я немного позже пришёл в себя, Серина, мокрое полотенце и пластыри исчезли.)"
2600303-66 = "(Будто её здесь вообще не было...)"
2600303-67 = "(Может, это был сон от усталости?)"
2600303-69 = "(...Стоп.)"
2600303-70 = "(Если бы она вошла, система безопасности меня бы предупредила.)"
2600303-71 = "(Если Серина действительно здесь была...)"
2600303-72 = "(...как она вошла?)"
