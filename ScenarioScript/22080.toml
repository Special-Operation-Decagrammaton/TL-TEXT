[translation]
22080-1 = "Эпизод 8; Разрушенная повседневность"
22080-2 = ""
22080-20 = "..."
22080-21 = "[s] «Момои...»"
22080-22 = ""
22080-34 = "В тот роковой день Момои рухнула без сознания..."
22080-35 = "В тот день Алиса по непонятной причине впала в безумие."
22080-36 = "Момои оказалась втянута в суматоху и потеряла сознание."
22080-37 = "Мы как можно быстрее доставили Момои в лазарет Шале."
22080-38 = "Но прошло уже два дня..."
22080-39 = "...а Момои так и не подавала признаков пробуждения."
22080-40 = ""
22080-44 = ""
22080-45 = ""
22080-47 = "Странные роботы внезапно включились, а Алиса неожиданно потеряла контроль. Всё произошло в одно мгновение."
22080-48 = ""
22080-50 = ""
22080-51 = "К счастью, благодаря Неру и участницам C&C, которые появились позже, нам удалось взять ситуацию под контроль, но..."
22080-52 = ""
22080-54 = ""
22080-55 = "[ns] «(Почему Алиса так отреагировала...?)»"
22080-56 = "Это было затишье перед бурей. И у всех нас осталось множество вопросов."
22080-57 = ""
22080-59 = ""
22080-60 = "По словам Харе..."
22080-61 = "...поведение Алисы было явно ненормальным и вызвано контактом с теми странными роботами."
22080-62 = ""
22080-64 = ""
22080-65 = ""
22080-66 = "А по словам Мидори..."
22080-67 = "Когда Алиса изменилась, а роботы начали активироваться..."
22080-68 = ""
22080-70 = ""
22080-73 = "...сломанная консоль, которую Момои всё это время хранила, тоже вдруг включилась."
22080-74 = "[ns] «Игровая консоль Момои... на ней данные из руин...»"
22080-75 = ""
22080-79 = "..."
22080-80 = "*бип*"
22080-81 = "Добро пожаловать в систему Divi:Sion. Введите пункт, по которому вам требуется помощь."
22080-84 = "[56cd7b]Проверка личности: вы AL-1S?"
22080-87 = "[ns] «Компьютер... из руин... и система Divi:Sion...»"
22080-88 = "Почему Алиса потеряла контроль? И что это были за роботы?"
22080-89 = "И почему игровая консоль Момои включилась именно в тот момент?"
22080-90 = "Связано ли это с папкой под названием \"ключ\" из руин?"
22080-91 = "[ns] «Я сразу проверил игровую консоль Момои, но...»"
22080-92 = ""
22080-95 = "Она не включалась. Будто никогда и не работала."
22080-96 = "Будто на ней вообще никогда не было никаких данных."
22080-97 = ""
22080-100 = "От такого количества вопросов у меня шла кругом голова."
22080-101 = ""
22080-109 = ""
22080-110 = "Сенсей... Алиса..."
22080-111 = ""
22080-115 = ""
22080-116 = ""
22080-117 = "Сенсей...!"
22080-118 = ""
22080-120 = ""
22080-121 = "[ns] «Как Алиса?»"
22080-123 = "Алиса... Эм... Она всё ещё..."
22080-124 = "Она всё ещё одна в клубной комнате."
22080-125 = "[s] «...Хорошо.»"
22080-126 = "Я несколько раз пыталась поговорить с ней через дверь, но..."
22080-127 = "Я-Я не знаю, что делать..."
22080-128 = "*всхлипывает*"
22080-129 = "[s] «Всё хорошо. Всё будет хорошо.»"
22080-130 = "...Сенсей?"
22080-131 = "...!"
22080-132 = "[s] «Всё нормально, предоставь это мне.»"
22080-133 = ""
22080-138 = "[ns] «...Хорошо.»"
22080-139 = ""
22080-142 = "[ns] «Алиса? Ты здесь? Можно войти?»"
22080-144 = "[ns] «Сочту это за согласие. Я вхожу.»"
22080-146 = ""
22080-147 = ""
22080-148 = "[ns] «Алиса.»"
22080-149 = ""
22080-150 = "[ns] «Алиса, ты в порядке? Пожалуйста, поговори со мной.»"
22080-151 = ""
22080-152 = ""
22080-153 = "..."
22080-154 = "[s] «Все волнуются. Ты ничего не ела и не выходила из клубной комнаты.»"
22080-155 = "С-Сенсей..."
22080-156 = "[s] «Мы все ждём, когда ты вернёшься. Пойдём вместе.»"
22080-158 = "Я не могу... этого сделать."
22080-159 = "[s] «...Почему?»"
22080-160 = "Потому что... из-за меня..."
22080-161 = "Момои пострадала..."
22080-162 = "[s] «Алиса...»"
22080-163 = "Я знаю, что во всём виновата я."
22080-164 = "Я не знаю почему. Я не знаю, что произошло."
22080-165 = "В-Во время... того происшествия..."
22080-166 = "Что-то захватило меня. Будто кто-то загрузил файл сохранения, о котором я не знала, что он есть на моей карте памяти."
22080-167 = "[s] «...Ах.»"
22080-170 = "Я нигде не могу найти его на своей карте памяти. Но, кажется, он находится... где-то внутри моего тела."
22080-171 = "Это было похоже на то, будто я играю в старую видеоигру, которую не запускала много лет."
22080-172 = ""
22080-173 = ""
22080-174 = "Даже без обучения или объяснений я всё равно чувствовала, куда нужно идти."
22080-176 = "...И моё тело само отвечало и действовало."
22080-177 = "Почему-то я не могу вспомнить, что делала..."
22080-178 = ""
22080-182 = "Но очевидно, что... я... я..."
22080-183 = "Я ранила Момои...!"
22080-184 = "[s] «Погоди, Алиса! Не будем делать поспешных выводов...»"
22080-185 = "Но, Сенсей... Что мне делать?"
22080-186 = "Верно, ты ранила её. Это правда."
22080-188 = "[ns] «Кто здесь?!»"
22080-189 = ""
22080-192 = ""
22080-193 = ""
22080-194 = "Сенсей!"
22080-195 = "П-Президент...!"
22080-196 = ""
22080-200 = ""
22080-201 = ""
22080-202 = "Похоже, мои худшие опасения подтвердились."
22080-203 = "[ns] «Ты...?»"
22080-204 = "Вы Сенсей из Шале?"
22080-205 = "...Жаль, что наша столь важная первая встреча состоялась при таких обстоятельствах."
22080-206 = "Меня зовут Цукацуки Рио."
22080-207 = "Я пришла кое-что вам всем сообщить."
22080-208 = ""
22080-210 = ""
22080-211 = "Правду об Алисе."
