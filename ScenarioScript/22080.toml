[translation]
22080-1 = "Episódio 8;O Cotidiano Despedaçado"
22080-20 = "......"
22080-21 = "[s] \"Momoi...\""
22080-34 = "(— Momoi desabou)"
22080-35 = "(Naquele dia em que a Aris perdeu o controle,)"
22080-36 = "(Momoi acabou envolvida no incidente e perdeu a consciência.)"
22080-37 = "(Trouxemos a Momoi às pressas para a enfermaria da Schale, mas...)"
22080-38 = "(Mesmo depois de dois dias inteiros,)"
22080-39 = "(Momoi ainda não recobrou a consciência—)"
22080-47 = "(Um robô desconhecido que começou a se mover ao mesmo tempo em que a Aris perdeu o controle... Num instante, a sala do clube virou um mar de chamas...)"
22080-51 = "(Felizmente, graças à C&C que correu para ajudar, a situação foi controlada, mas...)"
22080-55 = "[ns] (O que era aquilo que aconteceu com a Aris...?)"
22080-56 = "(Só porque a situação se acalmou não significa que tudo acabou. Aquele incidente deixou inúmeras dúvidas e cicatrizes.)"
22080-60 = "(Hare disse:)"
22080-61 = "(\"O comportamento da Aris provavelmente foi causado pelo 'contato' com aquele robô.\")"
22080-66 = "(Midori disse:)"
22080-67 = "(\"Naquela hora em que o jeito da Aris mudou,)"
22080-73 = "(o 'console' que a Momoi segurava ligou de repente.\")"
22080-74 = "[ns] \"O console da Momoi... se não me engano, veio das Ruínas...\""
22080-79 = "..."
22080-80 = "(Bip-bip)"
22080-81 = "[Bem-vindo ao Divi:Sion System. Por favor, insira o item que deseja pesquisar.]"
22080-84 = "<Você é AL-1S?>"
22080-87 = "[ns] \"As Ruínas... o computador... e... o Divi:Sion System...\""
22080-88 = "(Por que a Aris perdeu o controle? Qual será a relação entre aquele robô e a Aris...?)"
22080-89 = "(E o que foi aquilo com o console da Momoi ligando do nada naquela hora...?)"
22080-90 = "(Será que tem alguma relação com aquela pasta chamada <Key> que estava nas Ruínas?)"
22080-91 = "[ns] \"Tentei dar uma olhada no console da Momoi, mas...\""
22080-95 = "(Ele nem sequer ligou. Como se sempre tivesse sido assim—)"
22080-96 = "(Como se o conteúdo lá dentro tivesse ficado completamente vazio—)"
22080-100 = "(E enquanto meus pensamentos giravam sem encontrar nenhuma resposta...)"
22080-110 = "Sensei... a Aris-chan..."
22080-117 = "Ah... Sensei..."
22080-121 = "[ns] \"O que houve com a Aris?\""
22080-123 = "É que... a Aris-chan... ainda..."
22080-124 = "Não sai da sala do clube."
22080-125 = "[s] \"...Entendo.\""
22080-126 = "Tentamos chamar por ela várias vezes, mas... não teve jeito..."
22080-127 = "N-Numa hora dessas... eu não sei o que fazer..."
22080-128 = "Snif..."
22080-129 = "[s] \"Tudo bem.\""
22080-130 = "...Sensei?"
22080-131 = "......!"
22080-132 = "[s] \"Está tudo bem. Deixem comigo.\""
22080-138 = "[ns] \"...Ufa.\""
22080-142 = "[ns] \"Aris, posso entrar um pouquinho?\""
22080-144 = "[ns] \"Estou entrando.\""
22080-148 = "[ns] \"Aris.\""
22080-150 = "[ns] \"...Você está bem?\""
22080-153 = "......"
22080-154 = "[s] \"Ouvi dizer que você ficou trancada aqui sem nem comer.\""
22080-155 = "S-Sensei..."
22080-156 = "[s] \"Todo mundo está preocupado. Vamos sair...?\""
22080-158 = "Aris não consegue."
22080-159 = "[s] \"...Por quê?\""
22080-160 = "Aris... por culpa... da Aris..."
22080-161 = "Por culpa... da Aris... a Momoi se machucou..."
22080-162 = "[s] \"Aris...\""
22080-163 = "Foi a Aris... que fez tudo isso."
22080-164 = "Por que isso está acontecendo... nem a Aris... consegue entender."
22080-165 = "Naquela hora... alguma coisa..."
22080-166 = "Como se...#nComo se existisse um \"save\" que a Aris não conhece dentro da Aris..."
22080-167 = "[s] \"...Ah.\""
22080-170 = "Não está nas memórias da Aris, mas... é como se ela tivesse um \"save\" guardado."
22080-171 = "Este corpo está reagindo."
22080-174 = "Para dar um exemplo... sim, é como conseguir avançar sem tutorial nem explicação... ou como se estivesse jogando um jogo que já zerou várias vezes..."
22080-176 = "...O corpo da Aris reagiu.#nEle se moveu."
22080-177 = "O que a Aris fez naquela hora... não consegue se lembrar de nada, mas..."
22080-182 = "Ainda assim, uma coisa é certa... a Aris... a Aris......"
22080-183 = "A Aris... fez isso com a Momoi...!"
22080-184 = "[s] \"Aris, calma...!\""
22080-185 = "Sensei, o que a Aris... o que a Aris deve fazer...?!"
22080-186 = "Sim, foi você quem a feriu.#n— Essa é uma verdade da qual não se pode escapar."
22080-188 = "[ns] \"Quem...?!\""
22080-194 = "Sensei!"
22080-195 = "A-A Presidente...!"
22080-202 = "Ah, como eu temia — aconteceu exatamente o que eu receava."
22080-203 = "[s] \"Presidente...?\""
22080-204 = "— Então você é o famoso Sensei da Schale?"
22080-205 = "...É extremamente lamentável que um encontro tão marcante com o Sensei aconteça nestas circunstâncias."
22080-206 = "Meu nome é Tsukatsuki Rio."
22080-207 = "Eu vim contar a você — e a elas..."
22080-211 = "A \"verdade\"."
22080-213 = "Próximo;A Verdade Cruel (1)"
