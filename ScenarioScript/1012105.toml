[translation]
1012105-1 = "Цветок, распустившийся в глубине"
1012105-2 = "Я пришёл раньше назначенного времени, зная, что Юкари всегда приходит заранее."
1012105-3 = "Однако минуты шли, а её нигде не было видно."
1012105-4 = ""
1012105-7 = "Я услышал плеск воды, а затем резкий вдох."
1012105-8 = ""
1012105-11 = "...? ...!"
1012105-12 = "[ns1] «(Это была Юкари...?!)»\n[ns2] «(Она тонет?!)»"
1012105-15 = "[ns] Прыгнуть в воду."
1012105-16 = ""
1012105-19 = "[ns] Открыть глаза."
1012105-22 = "― [log=유카리 수영복](Сенсей! Вы нашли меня под водой!)[/log][wa:3380]"
1012105-25 = "― [log=유카리 수영복](Я и не ожидала увидеть такую прекрасную картину)[/log][wa:1670]"
1012105-27 = "― [log=유카리 수영복](под водой, на которую раньше смотрела лишь издалека.)[/log][wa:1210]"
1012105-30 = "― [log=유카리 수영복](И оказаться в таком месте вместе с Сенсеем...)[/log][wa:3140]"
1012105-32 = "― [log=유카리 수영복](Ах, разве я не счастливица?)[/log][wa:3260]"
1012105-35 = "― [log=유카리 수영복](Эм, Сенсей? У вас лицо... э-э, что...?)[/log][wa:3470]"
1012105-37 = "― [log=유카리 수영복](Я что-то сделала не так?)[/log][wa:410]"
1012105-40 = "― [log=유카리 수영복](Наверх? Там ведь ничего нет, кроме солнца...)[/log][wa:330]"
1012105-42 = "― [log=유카리 수영복](Что? Вы не это имели в виду?)[/log][wa:550]"
1012105-45 = "Фух!"
1012105-46 = "Я промокла насквозь! Ха-ха!"
1012105-47 = "[ns3] «Похоже, тебе весело!»\n[ns4] «Что ты делала?»"
1012105-50 = "Ну... Я пришла пораньше и, пока смотрела на море..."
1012105-51 = "...увидела под водой что-то похожее на цветы. Морские цветы!"
1012105-52 = "Но, Сенсей, почему вы нырнули вслед за мной?"
1012105-53 = "А-а?! Неужели я так увлеклась, что опоздала?!"
1012105-54 = "Хм? Нет... произошло недоразумение...? А... Вы подумали, что я тону?!"
1012105-55 = "Так вот почему вы выглядели таким встревоженным! Я так обрадовалась, увидев вас, что даже не поняла!"
1012105-56 = "Даже не знаю, что чувствовать. Простите... но мне в то же время очень лестна ваша отвага!"
1012105-57 = "[s5] «Главное, что ты цела, Юкари!»\n[s6] «Давай лучше повеселимся!»"
1012105-60 = "А. ...Да!"
1012105-62 = "После этого мы с Юкари веселились у моря до самого вечера."
