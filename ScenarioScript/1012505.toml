[translation]
1012505-1 = "Восполнение маны"
1012505-2 = ""
1012505-3 = ""
1012505-4 = ""
1012505-5 = ""
1012505-6 = "Привет, Мастер."
1012505-7 = "Ого, я уже давно не выбиралась из академии."
1012505-8 = "Хм. Как весело..."
1012505-9 = "[s] «Тебе весело? По тебе не скажешь.»"
1012505-10 = "Ну, вообще-то да."
1012505-11 = "По крайней мере, по сравнению с тем, как всё было в последнее время."
1012505-12 = "Я до сих пор помню это. То чудовище, которое я создала на холсте в классе..."
1012505-13 = ""
1012505-15 = ""
1012505-16 = "А-а! Оно снова у меня перед глазами! Здесь нужна магия стирания памяти..."
1012505-17 = ""
1012505-23 = "[ns] «Б-Бить себя книгой по голове не поможет!»"
1012505-24 = ""
1012505-25 = ""
1012505-26 = "Фух..."
1012505-27 = "Тогда, возможно, нужна другая магия."
1012505-28 = "Что предложишь, Мастер? Как мне восстановить ману?"
1012505-29 = "[s] «Кажется, я знаю идеальное заклинание для голодной души.»"
1012505-30 = "О, ты меня заинтриговал."
1012505-31 = "Давай проверим это заклинание. Веди."
1012505-38 = ""
1012505-39 = "Хм, что это за место?"
1012505-40 = "[s1] «Одна из моих любимых рамэнных.»\n[s2] «Она рядом с офисом, и здесь вкусно готовят.»"
1012505-43 = "Одно из любимых мест Мастера, хм?"
1012505-44 = "...Понятно.#nЯ чувствую следы маны самым кончиком носа."
1012505-45 = "Да, это насытит мою голодную душу."
1012505-46 = "И желудок. Давай сядем."
1012505-47 = ""
1012505-52 = ""
1012505-53 = "Есть блюдо, которое ты особенно рекомендуешь, Мастер?"
1012505-54 = "[s] «Думаю, тебе понравится тонкоцу-рамэн.»"
1012505-55 = "Хм-м. Рамэн, извлекающий густую ману из самой сущности костей."
1012505-56 = "Да, это вполне подойдёт."
1012505-57 = "Тогда тонкоцу-рамэн."
1012505-59 = "Я сидел с Эри, пока наши души не насытились."
1012505-60 = ""
1012505-68 = ""
1012505-69 = "Фух, чувствую, как мана снова наполняет меня."
1012505-70 = "[s3] «Раз уж поели, давай заглянем в библиотеку.»\n[s4] «Я знаю место, где много книг по оккультизму.»"
1012505-73 = "Библиотека, говоришь."
1012505-74 = "Конечно, оккультизм мне интересен, но больше всего я хотела бы заполучить одну конкретную книгу, запрещённую в нашей академии."
1012505-75 = "Если бы мне удалось её найти, моя магия смогла бы развиться ещё сильнее. Ню-ху-ху."
1012505-76 = "[s] «К-Книга, запрещённая в Вайлдхант? Что это за книга?»"
1012505-77 = "Она называется «Практические техники вязания узлов»."
1012505-78 = "Если освою такой навык, Префектурный совет больше никогда меня не поймает."
1012505-79 = "[s] «Поэтому эту книгу и запретили?»"
1012505-80 = "О нет. Причина... куда более странная."
1012505-81 = "Говорят, один художник-перформансист связал себя узлами из этой книги и так ходил по улицам."
1012505-82 = "Узлы в форме черепахи? Что-то вроде того. Это всё, что я знаю."
1012505-83 = "Ты ведь... ничего об этом не знаешь, правда, Мастер?"
1012505-84 = "[s] «Совершенно ничего!!»"
1012505-85 = "Что ж, наверное, сама всё узнаю, когда прочитаю книгу."
1012505-86 = "Ню-ху-ху, ах, какое предвкушение."
1012505-88 = "Мы с Эри исследовали магазин и просмотрели разные книги."
1012505-90 = ""
1012505-91 = ""
1012505-92 = ""
1012505-93 = ""
1012505-94 = ""
1012505-95 = ""
1012505-97 = "Чтобы продолжить восполнять её ману, после этого я ещё долго гулял вместе с ней."
1012505-99 = ""
1012505-100 = ""
1012505-101 = ""
1012505-102 = ""
1012505-103 = ""
1012505-104 = ""
1012505-106 = ""
1012505-107 = ""
1012505-108 = ""
1012505-109 = ""
1012505-110 = ""
1012505-112 = ""
1012505-113 = ""
1012505-114 = ""
1012505-115 = ""
1012505-119 = ""
1012505-120 = "Фух, это было очень приятно."
1012505-121 = "Спасибо, Мастер. День получился замечательный."
1012505-122 = "[s] «И тебе спасибо! Мне тоже понравилось.»"
1012505-123 = "Пожалуй, стоит оставить что-нибудь на память."
1012505-124 = "Как насчёт совместной фотографии?"
1012505-125 = "[s] «Отличная идея!»"
1012505-126 = ""
1012505-128 = ""
1012505-129 = ""
1012505-130 = "Ню-ху-ху, тогда позволь мне. Смотри сюда..."
1012505-131 = "Раз, два, три!"
1012505-133 = ""
1012505-134 = ""
1012505-135 = ""
1012505-136 = "Так, посмотрим..."
1012505-137 = "А, хорошо получилось."
1012505-138 = "..."
1012505-139 = "Фотографии, конечно, очень удобная вещь."
1012505-140 = "Можно запечатлеть целую сцену одним нажатием кнопки."
1012505-141 = "Знаешь, говорят, когда изобрели фотоаппарат, многие художники впали в отчаяние."
1012505-142 = "Зачем тратить часы или дни на картину, если фотография делает всё за мгновение?"
1012505-143 = "Но те художники не сдались. Никогда."
1012505-144 = "Они обратились внутрь себя и стали рисовать «пейзажи разума», поля собственных эмоций — то, что мог выразить только художник и только на холсте."
1012505-145 = "Фотография может запечатлеть то, что существует перед глазами, а картина — то, что невидимо."
1012505-146 = "Когда я прочитала об этих художниках и увидела их работы... мне захотелось сделать то же самое."
1012505-147 = "[s] «Ты всё ещё так думаешь?»"
1012505-148 = "Конечно! Искусство я люблю не меньше, чем оккультизм."
1012505-149 = "Запомни мои слова: однажды я стану знаменитой художницей, а мои картины будут висеть в каждом доме."
1012505-150 = "[s5] «Я бы уже сейчас повесил одну у себя.»\n[s6] «Можно заранее заказать картину?»"
1012505-153 = "Что? Прямо сейчас?"
1012505-154 = "Я-Я не могу написать тебе картину ПРЯМО сейчас... но если подождёшь, обязательно подарю тебе шедевр!"
1012505-155 = "...Когда у меня появятся время и желание спокойно посидеть, конечно."
1012505-156 = "Спасибо, Мастер. Ты помог мне вспомнить, почему я вообще начала заниматься искусством."
1012505-157 = "Я постараюсь оправдать твою веру в меня!"
1012505-158 = "[s] «Вперёд! Я буду за тебя болеть.»"
1012505-159 = "Хи-хи-хи..."
1012505-160 = "Удивительно, правда?"
1012505-161 = "Сегодня я была раздражена и вымотана, пока не появился ты, а теперь чувствую себя совершенно обновлённой."
1012505-162 = "Твои слова и правда обладают магией, Мастер."
1012505-164 = "Улыбаясь, Эри ещё долго рассказывала мне о своих мечтах."
1012505-165 = "Пока не стало слишком поздно, я отвёл её обратно в академию."
