[translation]
101010-1 = "Эпизод 1;Пролог"
101010-3 = "Это повествование было ниспровергнуто."
101010-4 = "Установленные прежде контекст, структура, природа, замысел и трактовка были полностью разрушены."
101010-5 = "Что такое смысл? Истина? Всё поблекло. Переплелось. Стало непостижимым."
101010-8 = "Сенсей."
101010-9 = "Все истории до этого момента были напрасны."
101010-10 = "События, которые развернутся с этого мгновения, вытеснят ваши прежние представления."
101010-12 = "Вы столкнётесь с миром без главных героев. Не будет ни злодеев, ни конфликта."
101010-13 = "Параллельные линии переплетутся, а все аксиомы, которые вы считали истинными, будут разрушены."
101010-15 = "Искусственная реальность, в которой устройство ваших жизней больше ничего не значит. Контекст, вероятность — всё теряет смысл."
101010-16 = "Этот мир будет полон настолько непостижимых абсурдов, что даже разница между верхом и низом утратит значение."
101010-20 = "Увы, ваше предначертанное будущее всегда существовало именно таким."
101010-21 = "Но те времена прошлого давно забыты."
101010-23 = ""
101010-24 = "Так позвольте же нам начать сначала."
101010-25 = ""
101010-26 = "Мы начнём историю, которая не является историей."
101010-28 = "Не забывайте. Оставьте позади свою природу, реальность, вероятности и истину."
101010-29 = ""
101010-32 = "Перевернём страницу к истории конфликта и предательства. Узурпации и смятения."
101010-34 = "Мы попытаемся сложить воедино разбитые осколки этой сломанной «истории»."
101010-36 = "Но помните: эта история не предназначена для того, чтобы согревать сердца зрителей или закончиться «и жили они долго и счастливо»."
101010-37 = "Нет. Напротив, это история о восстании."
101010-56 = "Следующий Эпизод; Катастрофа"
