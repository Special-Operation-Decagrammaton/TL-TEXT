[translation]
1011502-1 = "Особая тренировка 1"
1011502-2 = "Как и предложила Рэй, я отправился на тренировочное поле бейсбольного клуба Миллениума."
1011502-3 = ""
1011502-8 = ""
1011502-9 = "А, Сенсей, вы пришли! Спасибо!"
1011502-10 = "[s1] «Ну, от приглашения я не мог отказаться. Дай пять!»\n[s2] «А теперь снизу!»"
1011502-11 = "...И ещё раз сверху! Хи-хи."
1011502-12 = "И ещё раз снизу! Во-о-от... так!"
1011502-13 = "Хорошо, теперь просто смотрите, Сенсей."
1011502-15 = "Начинаю сегодняшнюю тренировку!"
1011502-16 = ""
1011502-18 = ""
1011502-20 = "Рэй уверенно вышла на поле, но..."
1011502-21 = ""
1011502-22 = ""
1011502-24 = ""
1011502-27 = "Третий страйк! Аут!"
1011502-28 = "Ц...! Подмешала фастбол. Очень по-миллениумски!"
1011502-29 = "Следующий точно отобью!"
1011502-31 = ""
1011502-32 = ""
1011502-35 = "Вижу!"
1011502-36 = ""
1011502-38 = ""
1011502-39 = "Хороший удар, Номаса Рэй. Но угол был чуть слишком высокий."
1011502-40 = "Флай-аут. Неплохо."
1011502-41 = "*вздыхает*"
1011502-43 = ""
1011502-44 = ""
1011502-45 = "Граундбол."
1011502-46 = "Угх..."
1011502-47 = ""
1011502-48 = ""
1011502-49 = "Инфилд-флай."
1011502-50 = "Да ну!"
1011502-51 = ""
1011502-52 = ""
1011502-54 = "Промах. Третий страйк."
1011502-55 = "И-и...!"
1011502-62 = ""
1011502-63 = ""
1011502-64 = "Хорошая тренировка..."
1011502-65 = "Уф, почему я всё ещё так плохо отбиваю?"
1011502-66 = "Каждый мяч, который я отбила, был либо флай-аутом, либо граундболом, либо лайнером."
1011502-67 = "Ну, хотя бы один раз я дошла до базы, но..."
1011502-68 = "[ns] «Как думаешь, чего тебе не хватает?»"
1011502-69 = "..."
1011502-70 = "Вообще-то, кажется, я знаю."
1011502-71 = "[s] «Знаешь?»"
1011502-72 = "Ага, думаю да. У меня тайминг сбит."
1011502-73 = "Есть поговорка: «Удар — это тайминг, а подача — это сбивание тайминга»."
1011502-74 = ""
1011502-76 = ""
1011502-77 = "...Или наоборот?"
1011502-78 = "В общем, да. Когда питчер начинает замах, проходит определённое время, прежде чем мяч пересечёт дом."
1011502-79 = "Бэттеру нужно просчитать это время и точно понимать, когда замахиваться."
1011502-80 = "Уф, но это непросто. Иногда летит фастбол, иногда крученый, а иногда разные виды крученых."
1011502-81 = "Обычно я успеваю следить глазами за мячом, но мой тайминг всё равно каждый раз сбивается..."
1011502-82 = "[ns3] «Тайминг, значит...?»\n[ns4] «Хорошо, давай потренируем тайминг!»"
1011502-85 = "Тренировка тайминга? Такое вообще существует?"
1011502-86 = "Я бы очень обрадовалась, если бы для этого было упражнение, но..."
1011502-87 = "...если оно есть, почему никто о нём никогда не слышал?"
1011502-88 = "Хм? Вы хотите, чтобы я мыслила нестандартно и пока просто вам доверилась?"
1011502-89 = "Я-я могу. Да, Сенсей? ...Хорошо, господи, я иду! Не надо так меня толкать..."
1011502-90 = ""
1011502-92 = ""
1011502-95 = "...Это же игровой зал?!"
1011502-96 = "Как это вообще связано с тренировкой тайминга?"
1011502-97 = "[s] «Два слова: ритм-игры.»"
1011502-98 = "Ритм... игры? Что это? Я вообще-то почти никогда не бывала в таких местах..."
1011502-99 = "Пойму, когда увижу? Эм-м..."
1011502-100 = "Хорошо. Я вам доверяю, Сенсей..."
1011502-102 = "Я повёл её в игровой зал, полный амбиций."
1011502-103 = "Честно говоря, дело было лишь отчасти в спортивной тренировке. Я ещё хотел, чтобы она сбросила стресс и успокоилась."
1011502-104 = "Понятно. Значит, ВОТ что такое ритм-игра."
1011502-105 = "То есть эти маленькие палочки падают вниз, и когда попадают в квадраты, я нажимаю кнопки?"
1011502-106 = "...Для тренировки тайминга это ДЕЙСТВИТЕЛЬНО логично. Никогда бы не подумала."
1011502-107 = "...Погодите, здесь ещё куча таких игр! Вот с гитарой, с барабанной установкой, а это... барабаны тайко?"
1011502-108 = "...Ладно, не будем СЛИШКОМ отвлекаться. Я в этом полный новичок."
1011502-109 = ""
1011502-111 = ""
1011502-112 = "Раз уж мы уже СТОИМ у игры с палочками, давайте попробую её..."
1011502-114 = "Впервые в жизни Рэй попробовала ритм-игру."
1011502-115 = "И довольно скоро..."
1011502-116 = ""
1011502-117 = ""
1011502-123 = "Ага, ага, поняла, поняла, попала! Просто продолжать, продолжать..."
1011502-124 = ""
1011502-134 = "Эй, гляньте на автомат BearMania IDX! Эта девчонка разрывает!"
1011502-135 = "Она играет новую песню 12-го уровня. Её добавили всего три дня назад! ЭТУ песню вообще можно пройти?! Человеку?!"
1011502-136 = ""
1011502-138 = ""
1011502-145 = "Она не могла запомнить карту за три дня. Она что... читает всё прямо на лету?"
1011502-146 = "О, там сбивка ритма... потом спам-паттерн... Вау, теперь вижу!"
1011502-147 = ""
1011502-149 = ""
1011502-158 = ""
1011502-168 = ""
1011502-169 = "Эй, смотрите, Сенсей! Я прошла финальную сложность! Эм, кстати..."
1011502-170 = ""
1011502-172 = ""
1011502-173 = "Кто... все эти люди?"
1011502-174 = "[s5] «Эм, для начала — поздравляю, Рэй...»\n[s6] «Ты только что заняла первое место, Рэй!»"
1011502-177 = "Серьёзно? Я просто смотрела, как они падают, и вовремя нажимала. И это делает меня первой?"
1011502-178 = "То есть все эти люди..."
1011502-179 = "Вы слышали? Она И ПРАВДА читала всё на лету!"
1011502-180 = "Я слышал легенды о гениях ритм-игр, но увидеть такого вживую..."
1011502-181 = "Не знаю насчёт других игр, но в этой она, наверное, даже UZQueen победит!"
1011502-182 = "Сенсей ведь только что назвал её «Рэй», да? Так она станет «Рэй-Королевой»? Мы что, наблюдаем историю её происхождения?!"
1011502-183 = ""
1011502-185 = ""
1011502-186 = "Э-эм...?"
1011502-187 = "П-простите, можно с вами сфотографироваться?"
1011502-188 = "Что?! Я-я не настолько крутая. Я даже не геймер. Я бейсболистка."
1011502-189 = "Э-это не бейсбол, так что я... Я здесь вообще не в своей тарелке..."
1011502-190 = ""
1011502-192 = ""
1011502-193 = "А-а-а!! Простите, мне правда очень жаль, просто... пожалуйста, пропустите меня!"
1011502-194 = ""
1011502-196 = ""
1011502-199 = ""
1011502-200 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
1011502-201 = ""
1011502-207 = "[ns7] «*пыхтит* *пыхтит* *пыхтит*»\n[ns8] «Ну, бег у тебя точно отличный.»"
1011502-210 = "Уф, а? Сенсей?! Ой, простите! Я убежала без вас...!"
1011502-211 = "Вообще-то я и не такой уж быстрый бегун."
1011502-212 = "Уф, это застало меня совсем врасплох. Хотя, если я хочу стать хорошей бейсболисткой, наверное, мне стоит привыкать к мысли о фанатах."
1011502-213 = "Просто я НЕ ОЖИДАЛА такого и именно там. На меня раньше вообще не обращали столько внимания."
1011502-214 = "[s] «Да... Прости за это, Рэй.»"
1011502-215 = "Что? Ой, нет-нет, тебе совершенно не за что извиняться, Сенсей."
1011502-216 = "Ты ведь хотел, чтобы я потренировала чувство ритма, научилась предугадывать происходящее и не терялась от неожиданности, верно?"
1011502-217 = "Хм? Тебе неловко, потому что ты не ожидал, что я испугаюсь ИМЕННО так?"
1011502-218 = "Н-Не переживай! Ты тут ни при чём. Просто я иногда слишком легко пугаюсь."
1011502-219 = "Если честно, дело было не только в этом. Такое чувство, будто я оказалась не на своём поле боя."
1011502-220 = "Думаешь, я слишком громко выразилась? А вот я так не думаю!"
1011502-221 = "Запомни одну вещь. Бейсбол — это война!"
1011502-222 = "Для каждого, кто выкладывается на своём тренировочном поле, это место тоже становится полем боя!"
1011502-223 = "И... мне показалось, будто я вторглась на чужое поле. Ну, на поле игроков в ритм-игры."
1011502-224 = "Я... кажется, уже сама запуталась в своих метафорах. Прости."
1011502-225 = "[s9] «Всё нормально, всё нормально.»\n[s10] «Ты и правда очень серьёзно относишься к бейсболу, да?»"
1011502-228 = "Спасибо, что понимаешь."
1011502-229 = "В любом случае, теперь я точно чувствую себя гораздо увереннее!"
1011502-230 = "Благодаря тебе я совсем по-новому ощутила ритм!"
1011502-231 = "Так что смотри внимательно. На следующей тренировке по отбиванию я точно всё сделаю как надо!"
1011502-233 = "После этого Рэй бодро направилась к домашней базе..."
1011502-234 = "...где раз за разом уходила в страйк-аут."
1011502-235 = "Почему?!!"
