[translation]
84311100400-5 = "Отличная работа. И... простите."
84311100400-6 = "Я не предсказала тревогу или... всё остальное. Мне следовало быть тщательнее."
84311100400-7 = "Ещё раз искренне прошу прощения, что подвергла вас обеих опасности."
84311100400-8 = "Не думаю, что за это нужно извиняться. Можно сказать, на всех прошлых проникновениях нам невероятно везло, а это было гораздо ближе к норме."
84311100400-9 = "...Ого, я как раз собиралась сказать то же самое."
84311100400-10 = "Конечно, я занимаюсь этим недолго, но уже начинаю замечать закономерности."
84311100400-11 = ""
84311100400-13 = ""
84311100400-14 = ""
84311100400-15 = "...Эй."
84311100400-16 = "...Не хочешь работать в C&C?"
84311100400-17 = ""
84311100400-20 = ""
84311100400-21 = "Нэру...! Она состоит в Чаепитии Тринити! Ты хочешь дипломатический скандал устроить?"
84311100400-23 = "Не переживай, ничего подобного не будет. Но спасибо за комплимент, Нэру."
84311100400-24 = "Мне лестно, что ты так высоко меня оцениваешь."
84311100400-25 = "И уверена, именно это ты и хотела выразить. Ты ведь не всерьёз пыталась меня завербовать."
84311100400-26 = "Конечно нет. Никто не был бы настолько глуп, чтобы воспринять это буквально. Разве что Рио."
84311100400-28 = "..."
84311100400-29 = "Похоже, дополнительные меры безопасности в выставочном зале ввёл Семинар."
84311100400-30 = "Судя по всему, к усилению системы безопасности подключились Веритас или Отряд Исследования Сверхъестественного."
84311100400-31 = ""
84311100400-33 = ""
84311100400-34 = "Рио...? Ты как-то иначе звучишь."
84311100400-35 = "Она просто дуется. Не переживай."
84311100400-37 = "Я не дуюсь, и пытаться провоцировать меня своими детскими подколами бесполезно."
84311100400-38 = ""
84311100400-41 = ""
84311100400-42 = "Дуется."
84311100400-43 = "Я же говорю."
84311100400-45 = "Не дуюсь."
84311100400-46 = ""
84311100400-49 = ""
84311100400-50 = "...Не дуюсь."
84311100400-53 = "После этого они утешили Рио и разошлись."
