80000060-36 = "Хотя то, что я так много болтаю с вами в такой день, тоже показывает, насколько мне неловко."
80000060-37 = "День святого Валентина — это день, когда люди находят романтику в десертах."
80000060-38 = "Будь чувство, вложенное в десерт, романтической любовью или дружбой..."
80000060-39 = "Сегодня его не принято выражать словами."
