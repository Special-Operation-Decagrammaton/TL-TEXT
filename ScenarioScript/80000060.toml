80000060-8 = "Этот романтический день посвящён тому, как люди следуют велению своего сердца."
80000060-9 = "Бессмысленные ограничения, обычно подавляющие людей, снимаются, и они могут открыто говорить о своих истинных чувствах!"
80000060-10 = "Сегодня всё состоит из эмоций, выражений, жестов..."
80000060-11 = "Представьте, насколько прекрасным и вдохновляющим был бы мир, будь каждый день таким."
80000060-12 = "Увы, так быть не может. Поэтому люди и выдумывают особые дни — жалкие оправдания."
80000060-13 = "К сожалению, в этом мире внимание вызывает лишь редкость."
80000060-14 = "Мы добавляем в календарь всё больше особых дней, настолько много, что некоторые сами становятся обыденными."
