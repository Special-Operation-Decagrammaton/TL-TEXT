80000060-25 = "Вообще-то я люблю День святого Валентина."
80000060-26 = "Я член Клуба сладостей после уроков. С чего бы мне не любить день, когда люди обмениваются десертами, выражая свои чувства?"
80000060-27 = "Наверное, вы заметили мою нерешительность. Возможно, я уже заболтала вас..."
