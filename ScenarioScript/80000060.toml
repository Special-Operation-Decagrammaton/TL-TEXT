80000060-19 = "И среди всех этих особых дней — насколько особенный День святого Валентина?"
80000060-20 = "Когда-то он был днём признаний в любви, а теперь превратился в праздник потребления —#nсоревнование кондитерских компаний за прибыль.#nТак ли уж особенным остался День святого Валентина?"
80000060-21 = "Лучшее, что мы можем сделать, — искренне высказать своё мнение по таким важным вопросам."
80000060-22 = "Хотя, возможно, даже такое выражение бессмысленно."
80000060-23 = "[s1] «На тебя не похоже сомневаться в романтике.»\n[s2] «Ты не любишь День святого Валентина?»"
