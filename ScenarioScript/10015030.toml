[translation]
10015030-1 = "Эпизод 3;Тренеры «Миллениума»"
10015030-5 = "Западный корпус «Миллениума»"
10015030-6 = "Мы с Ноа продолжили ходить из клуба в клуб по «Миллениуму», прося студентов помочь с предстоящим спортивным фестивалем."
10015030-7 = "Посмотрим... Инженерный отдел чинит сломанного робота, обработкой данных уже занимаются..."
10015030-8 = "Осталось лишь оценить состояние спортсменок и распределить заявки."
10015030-9 = "[s] «Нужно проверять их состояние?»"
10015030-10 = "Да, это часть работы «Семинара». Мы хотим убедиться не только в том, что они выступят в лучшей форме, но и что никто не получит травму под нашим присмотром."
10015030-11 = "Вообще-то эта задача формально лежит на нас, но мы плохо разбираемся в тонкостях этой области. Поэтому ею занимается Клуб спортивной подготовки."
10015030-12 = "Скорее всего, они сейчас как раз проводят последнюю тренировку перед соревнованиями."
10015030-13 = ""
10015030-15 = ""
10015030-16 = "Последняя остановка перед стадионом, Сенсей! Давайте заглянем в фитнес-центр и подбодрим спортсменок."
10015030-17 = ""
10015030-21 = ""
10015030-23 = "Фитнес-центр «Миллениума»"
10015030-24 = "Отведи таз назад и следи, чтобы колени и носки смотрели в одну сторону!"
10015030-25 = "Хорошо! А теперь ещё два подхода приседаний!"
10015030-26 = "П-подождите! Президент Сумирэ! Я думала, после этого подхода всё!"
10015030-27 = "Да! И-и прошлый раз вы тоже сказали, что это последний подход!"
10015030-28 = "Слушайте внимательно! Приседания со штангой создают дополнительную нагрузку и напряжение благодаря весу, стимулируя общий рост мышц!"
10015030-29 = "Но от такого лёгкого веса никакого эффекта не будет без большого количества повторений! Я специально взяла для вас, новичков, самые лёгкие штанги!"
10015030-30 = "Помните, ради чего вы стараетесь. Разве вы не хотите показать лучший результат на спортивном фестивале? А теперь ещё раз!"
10015030-32 = "Если нам придётся и дальше выдерживать её безумный режим тренировок..."
10015030-33 = "К началу фестиваля мы даже двигаться не сможем!"
10015030-34 = ""
10015030-38 = "О. На тренировке время и правда летит. Уже поздно."
10015030-39 = "Ладно, перерыв! Жду всех обратно через десять минут."
10015030-40 = ""
10015030-45 = "Сумирэ! Твой тренировочный пыл никогда не угасает!"
10015030-46 = "Ноа? И... Тренер?"
10015030-47 = "Что привело вас в фитнес-центр так поздно ночью?"
10015030-48 = "Мы проводим последний раунд проверок перед завтрашним днём и решили заодно заглянуть подбодрить вас!"
10015030-49 = "Ты выкладываешься на полную даже на самой финишной прямой!"
10015030-50 = "[s1] «Давно не виделись, Сумирэ.»\n[s2] «Ты кажешься энергичнее обычного.»"
10015030-53 = "Я просто переполнена энергией, Тренер! Рада вас видеть!"
10015030-54 = "Я уже несколько месяцев жду начала Фестиваля Хало."
10015030-55 = "Студенты «Миллениума» куда больше думают о математических формулах, чем о гантелях, так что это единственный особый день, когда спорт получает шанс блистать."
10015030-56 = "Я уже представляю... Рёв толпы такой громкий, будто поднимает стадион в воздух..."
10015030-57 = "И наши спортсменки! Они будут сражаться на поле всем разумом, телом и духом!"
10015030-59 = "Вот он, наш шанс! Мы докажем студентам, что спорт важен! Они увидят величие и силу наращивания мышц!"
10015030-60 = "[s] «Я... эм, рада, что ты так воодушевлена?»"
10015030-61 = "О... Простите. Я немного увлеклась."
10015030-62 = "В-в общем... Как видите, мы усердно проводим последнюю тренировку перед завтрашним днём."
10015030-63 = ""
10015030-68 = "К-куда все делись? Я же разрешила им только десятиминутный перерыв."
10015030-69 = "Не хочу приносить плохие новости, но они тихонько сбежали, пока ты разговаривала."
10015030-70 = "Для сна, может, ещё и рановато, но для тренировки уже действительно поздно."
10015030-71 = "Они ушли?! Но мы ведь только разминку закончили!"
10015030-72 = "Новичкам необходимо пройти круговую тренировку, чтобы организм адаптировался к более интенсивным комплексным нагрузкам. И как они теперь будут тренировать лёгкие...?"
10015030-73 = "А потом я собиралась показать им несколько изолирующих упражнений на наших новых блочных тренажёрах..."
10015030-74 = "И-и... я даже приготовила всем протеиновые напитки, чтобы мышцы быстрее восстановились сразу после тренировки."
10015030-75 = "[s] «Ух ты. Ты действительно вложила в это очень много сил.»"
10015030-76 = "Конечно! Это была прямая просьба «Семинара», поэтому я должна была сделать тренировочную программу идеальной."
10015030-77 = "Тела у всех совершенно разные, поэтому и для физического прогресса каждой нужно своё. Стандартные программы, которые не учитывают эти различия, редко одинаково хорошо подходят всем."
10015030-78 = "Мы понимали, насколько важен индивидуальный подход, поэтому Клуб спортивной подготовки проанализировал всё: опыт, питание, тип телосложения — чтобы создать идеальный план для каждой спортсменки."
10015030-79 = "Я рассказывала, как рада возможности показать остальным студентам прелесть спорта, но настоящая ставка здесь — доказать эффективность и жизнеспособность наших экспериментальных тренировок."
10015030-80 = "Вот... вот почему раньше я так увлеклась. Для меня это очень важно."
10015030-81 = "[s3] «Я только что кое-что понял о Сумирэ.» \n[s4] «Сумирэ и правда настоящий студент „Миллениума“.»"
10015030-84 = "Ха-ха! Вы совершенно правы. Неважно, каким делом или клубом мы занимаемся: в «Миллениуме» мы верим в успех через эмпирические методы."
10015030-85 = "Похоже, каждая из вас вложила в это все силы. Я с нетерпением жду, когда спортсменки «Миллениума» одержат победу на фестивале."
10015030-86 = "Мне придётся извиниться... но боюсь, такого зрелища вы не увидите."
10015030-87 = ""
10015030-89 = ""
10015030-90 = "К сожалению, большинство участниц спортивного фестиваля — новички, которые не завершили полный курс подготовки."
10015030-91 = "Но главное — дух соревнования! Важен спортивный огонь, а не победа или поражение!"
10015030-92 = "...По крайней мере, именно это я себе повторяю."
10015030-93 = "Я не понимаю. Я с огромным трудом составила индивидуальные планы, чтобы помочь им стать сильнее за то короткое время, что у нас было. Но все просто сдались."
10015030-94 = "[s] «Может, график был для них слишком тяжёлым?»"
10015030-95 = "Глупости. Всего два часа анаэробных упражнений в день..."
10015030-96 = "Ну, ещё разминка и растяжка... А, и конечно аэробные упражнения, ведь надо укреплять лёгкие."
10015030-97 = "Но максимум четыре часа в день! Я занимаюсь почти вдвое больше!"
10015030-98 = "[s] «(Я бы тоже сбежал...)»"
10015030-99 = "Мне только что пришла идея! Раз уж вы пришли так далеко, почему бы не устроить небольшую лёгкую тренировку, пока вы здесь?"
10015030-100 = "[s7] «Спасибо за предложение, но мы заняты подготовкой к фестивалю...»\n[s8] «Нам пора возвращаться. Правда, Ноа?»"
10015030-103 = "О нет. Вообще-то у нас полно времени."
10015030-104 = "По расписанию осталось только забрать робота-болельщика из Инженерного отдела! Мы всё закончили очень эффективно."
10015030-105 = "И, разумеется, было бы невежливо прийти за заказом раньше срока, особенно учитывая, насколько срочно мы его попросили сделать."
10015030-106 = "Почему бы нам не отдохнуть здесь минут тридцать?"
10015030-107 = "Тридцать минут...?"
10015030-108 = "За это время можно провести отличную силовую тренировку!"
10015030-109 = ""
10015030-113 = ""
10015030-114 = "[ns] «Н-Ноа...? Ты ведь тоже будешь тренироваться...? Пожалуйста?»"
10015030-115 = "К-конечно..."
10015030-116 = ""
10015030-119 = "Что это? О боже! Мне только что пришло очень-очень срочное письмо. Я сяду вот здесь и немедленно его изучу."
10015030-120 = "Какая жалость, что придётся пропустить тренировку..."
10015030-121 = "Сумирэ, вы с Сенсеем начинайте без меня!"
10015030-122 = ""
10015030-124 = ""
10015030-125 = "[ns] «Как ты могла так меня предать, Ноа?!»"
10015030-126 = "Хи-хи. Идеально. Я как раз хотела попробовать изолирующие упражнения на грудь и бицепс с нашей новой машиной Смита."
10015030-127 = ""
10015030-129 = ""
10015030-130 = "Тренер, встаньте вот сюда."
10015030-131 = ""
10015030-133 = ""
10015030-134 = ""
10015030-135 = "[ns] «О-оно... такое... тяжёлое...!»"
10015030-136 = "Техника совсем неправильная! Видите, как вас шатает?"
10015030-137 = "Держите спину прямо! Носки смотрят наружу, они должны быть на одной линии с остальным телом."
10015030-138 = "Первый из трёх подходов, начали!"
10015030-140 = "Сенсей! Не повредите спину!"
10015030-141 = ""
10015030-145 = "Следующие тридцать минут Сумирэ гоняла меня по мучительной силовой тренировке, пока я уже не мог поднять собственную руку."
