[translation]
104110-1 = "Эпизод 11; Послесловие 1"
104110-2 = "Здравствуйте, Сенсей."
104110-3 = "[s] «Как ты, Плана?»"
104110-4 = "...В порядке. Арона хорошо обо мне заботится."
104110-5 = "Хи-хи... Вот это нужно... с клубничным молоком..."
104110-6 = "...Хотя она всё ещё спит."
104110-7 = "[s] «Л-Ладно...»"
104110-8 = "Просыпайся. Арона. Сенсей здесь."
104110-9 = "Сейчас не время спать."
104110-10 = "Хр-р... Хр-р..."
104110-11 = "Арона. Если не встанешь, я ткну тебя в щёку."
104110-12 = ""
104110-14 = ""
104110-17 = "(Волосы дыбом...)"
104110-18 = "Хр-р... Что-то всё время... А?"
104110-19 = "О. Что...?"
104110-20 = "Ч-Ч-Что?"
104110-21 = "[s] «Доброе утро, Арона.»"
104110-22 = "Ч-Ч-Что-о-о?! К-Когда успело наступить утро...?!"
104110-23 = "Сейчас уже обед, Арона. Нельзя так долго спать. Это основы."
104110-24 = "У-Ух... Я же должна быть для тебя примером..."
104110-25 = "Сначала научись рано вставать. А уж потом показывай пример."
104110-26 = "М-м... Как всё до этого дошло..."
104110-27 = "[s] «...Тебе, наверное, непросто, Плана.»"
104110-28 = "...Всё хорошо. Я начинаю привыкать присматривать за Ароной."
104110-29 = "Почему-то мне кажется, что это уже я получаю нагоняй..."
104110-30 = "Но ничего, ведь если мы с Планой будем вместе, Ковчег Шиттим в будущем сможет делать ещё больше!"
104110-31 = "Подтверждаю. Я тоже буду помогать. Сенсей."
104110-32 = "[s] «...Буду ждать, Плана и Арона.»"
104110-34 = "Взаимно. Я тоже буду ждать, Сенсей [USERNAME]."
104110-35 = "Хи-хи... Да! Сенсей!"
104110-39 = "Хр-р... Хи-хи-хи..."
104110-40 = "В последнее время Арона много спит..."
104110-41 = "Это... из-за меня. Ковчег Шиттим перегружен из-за моего присутствия."
104110-42 = "..."
104110-43 = "И я понимаю, что... президент Генерального ученического совета здесь тоже пропала."
104110-48 = ""
104110-49 = "Президент Генерального ученического совета пропала и в этом мире..."
104110-51 = "Следующий эпизод; Послесловие 2"
