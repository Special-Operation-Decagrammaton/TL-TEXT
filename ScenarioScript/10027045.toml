[translation]
10027045-1 = "Эпизод 4;Тайная гармония"
10027045-8 = "Горная дорога Красной Зимы"
10027045-9 = "*задыхается* *задыхается* Я ожидала медведей и кроликов, но боевые дроны?! Откуда они взялись?!"
10027045-10 = ""
10027045-12 = ""
10027045-14 = "[ns1] «Через реку и леса!»\n[ns2] «И по снегу мы идём!»"
10027045-17 = "...Завидую вашему спокойствию, Сенсей."
10027045-18 = "Вы поёте, чтобы не думать о... замёрзших пальцах?!"
10027045-19 = "Надо было сразу сказать! Вот, возьмите грелку для рук."
10027045-20 = ""
10027045-22 = ""
10027045-24 = ""
10027045-25 = ""
10027045-27 = ""
10027045-30 = "Не нужно благодарить... В Красной Зиме экипировка для холодной погоды необходима для выживания."
10027045-31 = "*вздыхает* Хорошо, что нам не пришлось забираться слишком глубоко в горы. Зачем они вообще встречаются в таком отдалённом месте?"
10027045-32 = "Преданность и страсть Фронта освобождения знаний можно было бы направить на что-нибудь—"
10027045-33 = ""
10027045-36 = ""
10027045-37 = ""
10027045-39 = "Мэру! Я достала новое издание!"
10027045-40 = "Разве это не просто переиздание старого выпуска?"
10027045-41 = "О-Объективно говоря, да... Но... для нас оно новое!"
10027045-42 = "Ну, потому что мы видим его впервые...?"
10027045-43 = "Ладно, неважно, старое оно или новое. Приток новых знаний в любом случае обогащает сердце."
10027045-45 = ""
10027045-47 = ""
10027045-48 = "..."
10027045-49 = "Неважно. Забудь."
10027045-51 = ""
10027045-55 = "Съезд фанфиков"
10027045-57 = "[ns] «Мы пришли?»"
10027045-58 = "Думаю, да."
10027045-59 = ""
10027045-62 = "И правда, встреча проводится так далеко..."
10027045-63 = "И посмотрите, сколько здесь книг. Стенды забиты!"
10027045-64 = "[s] «Здесь все либо читают, либо покупают, либо продают...»"
10027045-65 = "Ага. Напоминает мне кое-что, что я уже видела."
10027045-66 = ""
10027045-69 = "[ns] «А! Мэру, смотри. Это...?»"
10027045-70 = "Да? Что ты нашла? Погоди— Неужели это то, о чём я думаю?"
10027045-71 = ""
10027045-73 = ""
10027045-74 = ""
10027045-75 = "Финальный том «Луны»?!"
10027045-76 = "[s] «О, но на нём написано „Образец“.»"
10027045-77 = "А, ну конечно. Полная книга, наверное, где-то спрятана."
10027045-78 = "О, покупатели! Спасибо, что пришли! Пожалуйста, осматривайтесь."
10027045-79 = "(Продавец благодарит нас за то, что мы пришли? К такому я могла бы привыкнуть.)"
10027045-80 = ""
10027045-82 = ""
10027045-83 = "Давайте посмотрим, Сенсей. Может, это и есть тот самый финальный том «Луны», который мы искали!"
10027045-85 = ""
10027045-93 = "[ns] «Давно я не читал по-настоящему хорошую книгу.»"
10027045-95 = "[ns3] «Две Луны объединились...»\n[ns4] «Соединив свои силы, они встретились с последним врагом...»"
10027045-98 = "Нет, нет, нет. Подождите! Тут что-то не так!"
10027045-99 = "«Луна» вообще-то должна быть романтикой. По словам Момидзи, там любовь, жизнь, панк-тематика, группа, фильмы и... всё такое. Почему они внезапно оказались в огромной боевой сцене?"
10027045-100 = "[s] «Какая разница? История хорошая!»"
10027045-101 = "Да, компоновка и история действительно впечатляют!"
10027045-102 = "Но всё же... Стиль не соответствует темам «Луны». Ничего здесь не имеет смысла и не сочетается с остальной историей."
10027045-103 = "[s5] «Погоди... Тут ещё одна „Луна“.»\n[s6] «Эта называется „Финал Луны“.»"
10027045-106 = ""
10027045-108 = ""
10027045-109 = ""
10027045-110 = "(Ещё одна?!)"
10027045-111 = "(Но тогда получается...)"
10027045-112 = ""
10027045-115 = ""
10027045-117 = "Вот. Это тоже образец. Давайте прочитаем."
10027045-119 = ""
10027045-129 = "[ns] «В конце две Луны разошлись каждая своей дорогой...»"
10027045-130 = "Нет, нет, нет. Это неправильно!"
10027045-131 = "По крайней мере, здесь были любовь, жизнь, панк-тематика, группа, фильмы и... всё, что и должно быть! Но сюжеты «Луны» всегда про то, как принять недостатки друг друга и помириться!"
10027045-132 = "А они просто взяли и выбросили всё это в окно, написав прощание!"
10027045-133 = "[s] «Да, история была такой грустной!»"
10027045-134 = "Да, написано хорошо. Она цепляет именно за нужные струны. Выдающаяся работа!"
10027045-135 = "Но финальный том «Луны» просто не может закончиться вот так!"
10027045-136 = ""
10027045-139 = "[ns7] «Вот ещё одна „Луна“.»\n[ns8] «Эта называется „Без Луны“.»"
10027045-142 = ""
10027045-144 = ""
10027045-145 = ""
10027045-146 = "(Неужели каждый финальный том «Луны», выставленный здесь... отличается?)"
10027045-147 = "(Надеюсь, что нет! Но по тому, что я вижу, это единственный возможный вывод!)"
10027045-149 = ""
10027045-151 = "Сенсей, подождите! Не читайте образец в одиночку! Давайте вместе!"
10027045-153 = ""
10027045-164 = "[ns] «Никто так и не узнал, что стало с двумя Лунами, но...»"
10027045-165 = "«Мы продолжаем жить, начиная новую жизнь, вдохновлённые их жертвой...» Это и есть концовка?"
10027045-166 = "Нет, я отказываюсь это принимать! У истории должна быть чёткая развязка! Это появилось буквально из ниоткуда. Оно вообще не вяжется с остальным сюжетом! Просто эпилог эпилога эпилога..."
10027045-167 = "[s] «Но рисунок ведь был очень хорош?!»"
10027045-168 = "Да, рисунок был потрясающим! Некоторые панели даже выглядели как оммаж классическому искусству!"
10027045-169 = "Но дело не в этом! Красивые панели сами по себе не делают мангу мангой. Важна история — и подходящая концовка!"
10027045-170 = "Будто они проигнорировали то, что больше всего нас интересует, и нарисовали ту концовку, которая им самим захотелась!"
10027045-171 = "[s] «Смотри, Мэру. Вон там тоже есть „Луна“...»"
10027045-172 = "Не надо, Сенсей. Она будет такой же, как остальные. Я уже понимаю, что это за место и что представляют собой все эти тома «Луны»."
10027045-173 = ""
10027045-175 = ""
10027045-178 = "Нашли что-нибудь интересное? Знаете, у нас акция: бесплатная иллюстрация к любой книге!"
10027045-179 = "Вообще, почему бы вам не посмотреть последнее издание? Оно только что вышло!"
10027045-180 = "Продажа «Г. Луны» ограничена одной книгой на человека! Пожалуйста, дождитесь своей очереди!"
10027045-181 = ""
10027045-183 = ""
10027045-184 = "..."
10027045-185 = "Мы на официальном съезде «Луны»... Всё это фанфики!"
10027045-186 = "[s] «Что? Мэру, я не понимаю.»"
10027045-187 = "Ну..."
10027045-189 = ""
10027045-196 = "[ns9] «Понятно! Фанаты „Луны“ устроили огромную встречу.»\n[ns10] «Значит, все эти концовки „Луны“... просто их версии того, что могло произойти?»"
10027045-199 = "Именно. Всё здесь — фанфики, их представление о том, каким мог или должен был быть финальный том."
10027045-200 = "Что бы они ни придумали — фантастику, противоречие оригинальному сюжету, эпилог эпилога... Как фанфик на таком съезде допускается всё."
10027045-201 = "[s] «Значит, фанаты создают собственные версии финального тома „Луны“...»"
10027045-202 = "Да, поэтому каждый из них отличается от остальных, а трактовки так далеко уходят от оригинала."
10027045-203 = "...Некоторые из них — чистый плод желаний самого автора..."
10027045-204 = "[s] «Но разве не желание вдохновляет на удивительные творения?»"
10027045-205 = "Ух. Почему вы так стараетесь это оправдать, Сенсей?"
10027045-206 = "...Да. Пожалуй, в этом есть смысл. Неловко или красноречиво написан каждый том — все они доказывают одно и то же."
10027045-207 = "Фанаты здесь испытывают настоящую, неугасающую любовь к «Луне»."
10027045-208 = "Но зачем они проводят это мероприятие? Почему каждый создаёт свой финальный том «Луны»?"
10027045-209 = "..."
10027045-210 = ""
10027045-212 = ""
10027045-215 = ""
10027045-216 = "Так... Ты всё-таки нашла дорогу сюда, Мэрури."
10027045-218 = ""
10027045-220 = ""
10027045-221 = "А?"
