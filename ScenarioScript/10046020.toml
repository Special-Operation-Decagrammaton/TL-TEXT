[translation]
10046020-1 = "Эпизод 2;Кризис горячих источников"
10046020-4 = ""
10046020-6 = ""
10046020-7 = ""
10046020-9 = ""
10046020-10 = ""
10046020-13 = ""
10046020-14 = "Кто это? И ЧТО она делает?!"
10046020-15 = ""
10046020-17 = ""
10046020-18 = "[ns1] «Мэгу...?!»\n[ns2] «Почему ты здесь?»"
10046020-19 = ""
10046020-20 = ""
10046020-24 = "Эй, ты! Стой! Брось оружие."
10046020-25 = "Это здание и окружающий его пляж принадлежат Чаепитию! Сейчас ты находишься здесь незаконно!"
10046020-26 = ""
10046020-28 = ""
10046020-29 = "...?"
10046020-30 = "...Она меня вообще услышала?"
10046020-31 = ""
10046020-34 = ""
10046020-35 = "...О, а? Эй, тут кто-то есть!"
10046020-36 = ""
10046020-38 = ""
10046020-39 = "И Сенсей тоже! Вы слишком рано! Горячий источник ещё не открыт."
10046020-40 = ""
10046020-42 = ""
10046020-43 = "...Сенсей? Вы знаете эту... особу?"
10046020-44 = "[s3] «...Эм, ну...»\n[s4] «Это долго объяснять...»"
10046020-47 = "Ага! Эй, дамочка, я Мэгу из Кружка горячих источников! Президент Касуми отправила меня установить бомбу? Для разработки горячего источника?"
10046020-48 = ""
10046020-50 = ""
10046020-51 = "...Что? Бомбу...?"
10046020-52 = "Стой, погоди. Ты ЧТО разрабатываешь?!"
10046020-53 = ""
10046020-55 = ""
10046020-56 = ""
10046020-58 = "Кружок горячих источников! Это террористический кружок Геенны!"
10046020-59 = "Вы решили бросить нам вызов во время ОТПУСКА? Непростительно!"
10046020-60 = "...Что такое, Сенсей?"
10046020-61 = "Успокоиться? Простите? Вы хотите поговорить?"
10046020-62 = ""
10046020-64 = ""
10046020-66 = "Сенсей, она террористка! Она устроила засаду на нашей частной территории со взрывчаткой!"
10046020-67 = "Что значит «добрые намерения»? Вы хотите сказать, что я должна доверять этой девушке?"
10046020-68 = "[ns5] «Нет, я не это сказал!»\n[ns6] «Необязательно ей доверять, но...»"
10046020-71 = "Это ЧАСТНАЯ территория! Уже просто находясь здесь без... надлежащего разрешения, она совершает преступление!"
10046020-72 = "И что ты устанавливаешь? Бомбу для разработки горячих источников...?"
10046020-73 = "Брось её! Немедленно прекрати! Это приказ, отданный полномочиями Оперативной группы Правосудия!"
10046020-74 = ""
10046020-77 = ""
10046020-78 = "Э...? Это место всё равно разваливается. Разве всем не будет лучше, если мы превратим его в горячий источник?"
10046020-79 = "Какая наглость! С чего ты это взяла? Ты мне угрожаешь?"
10046020-80 = "Нет! Но президент сказала, что это место скоро рухнет, поэтому..."
10046020-81 = "...? О чём ты вообще..."
10046020-82 = "Нет. Я не стану отвлекаться на твой бред."
10046020-83 = "[s7] «Она просто так разговаривает...»\n[s8] «Знакомое чувство...»"
10046020-84 = ""
10046020-85 = ""
10046020-87 = ""
10046020-88 = ""
10046020-93 = "Я сказала остановиться! Если слов для тебя недостаточно, я применю силу!"
10046020-94 = ""
10046020-96 = ""
10046020-97 = "А? Эм...! Эй, расслабься! Президент сказала, что я должна это установить. Ничего страшного."
10046020-98 = "Что? Это нелепо...!!"
10046020-99 = ""
10046020-101 = ""
10046020-102 = ""
10046020-103 = "П-Почему она такая сильная?!"
10046020-104 = ""
10046020-106 = ""
10046020-107 = ""
10046020-108 = ""
10046020-114 = ""
10046020-115 = "В-Вааа...? А-а-а...?"
10046020-116 = "[s9] «Она подняла Хасуми...?!»\n[s10] «Она замахивается для силового броска...?!»"
10046020-117 = ""
10046020-118 = ""
10046020-120 = ""
10046020-126 = ""
10046020-127 = "*кашель* *кашель* Ч-Что...?! Это недопустимо!"
10046020-128 = "Меня ещё никогда в жизни не поднимали и не швыряли вот так!"
10046020-129 = "Я просто прошу тебя успокоиться! Я уйду, как только установлю эту бомбу!"
10046020-130 = "Что ты несёшь?! Как вообще можно такое предлагать?!"
10046020-131 = "[s11] «Это же Мэгу...»\n[s12] «Эти двое явно начали не с той ноги...»"
10046020-134 = "[ns13] «Дай мне поговорить.»\n[ns14] «Может, мы рассмотрим...»"
10046020-137 = "Нет, Сенсей. Пожалуйста... оставьте это мне."
10046020-138 = "Как член Оперативной группы Правосудия, я не могу оставить такое неуважение без ответа."
10046020-139 = "Даже без оружия я не отступлю и не позволю студенту Геенны..."
10046020-140 = "...ТЕРРОРИСТКЕ одолеть меня в рукопашном бою!"
10046020-141 = ""
10046020-143 = ""
10046020-144 = "...Прошу прощения?"
10046020-145 = "Она настолько сильна, что может построить горячий источник без оборудования?"
10046020-146 = "Эм..."
10046020-147 = ""
10046020-149 = ""
10046020-151 = "И всё равно я не проиграю захватчице из Геенны!"
10046020-152 = "[ns15] «Я так и думал, что ты это скажешь.»\n[ns16] «Я знал, что хорошо это не кончится...»"
10046020-153 = ""
10046020-154 = ""
10046020-156 = ""
10046020-157 = "Ещё раз, ты, гехеннский... титан! Приготовься!"
10046020-158 = "А-а! Просто подожди, пожалуйста! Я не хочу торопиться!"
10046020-159 = "Ты даже не считаешь меня достойной драки? Какое неуважение..."
10046020-160 = ""
10046020-162 = ""
10046020-163 = ""
10046020-176 = ""
10046020-177 = ""
10046020-185 = ""
10046020-186 = "Ч-Что происходит? Кто-нибудь пострадал?"
10046020-187 = ""
10046020-189 = ""
10046020-190 = "...А?"
10046020-191 = ""
10046020-198 = ""
10046020-199 = ""
10046020-200 = "...Что...?"
10046020-201 = ""
10046020-205 = ""
10046020-211 = ""
10046020-212 = "Угх...! *кашель* *кашель*"
10046020-213 = "Ч-что это было?"
10046020-214 = ""
10046020-218 = "А-а-а-а—! Я больше не могу!"
10046020-219 = ""
10046020-221 = ""
10046020-222 = "Х-Хасуми...?"
10046020-223 = ""
10046020-225 = ""
10046020-226 = ""
10046020-227 = ""
10046020-228 = "Успокойся...! Спокойнее, я не совсем понимаю, что происходит, но нам стоит всё обсудить...!"
10046020-229 = "Дыши и расслабься. Найди внутренний покой..."
10046020-230 = ""
10046020-232 = ""
10046020-233 = ""
10046020-235 = ""
10046020-236 = "...О! Ты та девушка, которая нравится президенту! Вы разговаривали в поезде, да? Приятно познакомиться!"
10046020-237 = ""
10046020-239 = ""
10046020-241 = ""
10046020-242 = "...Ну..."
10046020-244 = "...Чего-о-о?!"
10046020-247 = "Кружок горячих источников?! Что вы здесь делаете?!"
10046020-248 = "Как вы сюда пробрались?"
10046020-249 = "Нет, неважно! Что бы это ни было, вам конец! Вы арестованы!"
10046020-250 = ""
10046020-252 = ""
10046020-253 = "...А? Что вы сказали, Сенсей?"
10046020-254 = "Успокоиться...?"
10046020-255 = ""
10046020-257 = ""
10046020-258 = "Сенсей, вы, должно быть, ошибаетесь. Это Кружок горячих источников. Вы правда думаете, что они пришли сюда с «добрыми намерениями»?"
10046020-259 = "[s17] «Ичика?!»\n[s18] «Ты говоришь прямо как Хасуми...»"
10046020-262 = "Разве не очевидно? Если мы не остановим её сейчас, она всё здесь разрушит!"
10046020-263 = "...Прошу прощения?"
10046020-264 = "...А что стало с «обретением внутреннего покоя»?"
10046020-265 = ""
10046020-267 = ""
10046020-269 = "...Кружок горячих источников — исключение! Полная противоположность! Они всегда такими были!"
10046020-270 = "Вперёд, Ичика! Мы справимся с ней!"
10046020-271 = ""
10046020-273 = ""
10046020-274 = "Да! Я её схвачу, а ты бей!"
10046020-275 = ""
10046020-277 = ""
10046020-278 = ""
10046020-279 = "А-А-А-А-А-А!!!"
10046020-280 = ""
10046020-283 = ""
10046020-284 = ""
10046020-292 = ""
10046020-293 = ""
10046020-294 = "Ч-Что...! Не может быть...!"
10046020-295 = "Хахаха! О! Ты тоже любишь бороться?"
10046020-297 = "Сосредоточься, Ичика! Она чудовищно сильная! Работай корпусом!"
10046020-298 = ""
10046020-301 = ""
10046020-303 = "А-А-А-А-А-А!!!"
10046020-304 = ""
10046020-315 = ""
10046020-316 = "Ч-Что?! Что это за шум? Кто-то... перекладывает плитку в ванной?"
10046020-317 = ""
10046020-323 = ""
10046020-324 = "...А?"
10046020-325 = ""
10046020-330 = ""
10046020-331 = ""
10046020-332 = ""
10046020-340 = ""
10046020-341 = "Ай... З-За что это?"
10046020-342 = ""
10046020-344 = ""
10046020-345 = "А? Кто эта девушка?"
10046020-346 = ""
10046020-348 = ""
10046020-350 = ""
10046020-351 = "Хм, ещё одна. Ой, вас уже слишком много."
10046020-352 = "Президент сказала отступать, если соберётся толпа... думаю, это уже считается. Какая жалость!"
10046020-353 = "А...? Ты просто уходишь? Это...«какая жалость»?"
10046020-354 = "Ага, простите! Приказ сверху. Думаю, у нас ещё есть время..."
10046020-355 = "Жаль, конечно, но что поделаешь? Президент всегда права..."
10046020-356 = "Стой, погоди. Но сначала, ты...?"
10046020-357 = "Мне пора сматываться! Всем хорошего дня!"
10046020-358 = ""
10046020-360 = ""
10046020-361 = ""
10046020-362 = ""
10046020-363 = "Это была кто-то из Гехен...ны?"
10046020-364 = ""
10046020-366 = ""
10046020-368 = ""
10046020-369 = "Куда ты собралась, гехеннская угроза?! Я с тобой ещё не закончила!"
10046020-370 = "Кружок горячих источников! Вы ещё пожалеете об этом дне!"
10046020-371 = ""
10046020-374 = ""
10046020-375 = "А-а-а! Все, расслабьтесь! Успокойтесь! Стойте!"
10046020-377 = "Когда Оперативная группа перевела дух, я объяснил Мике ситуацию."
10046020-380 = "Вот оно что. И именно сегодня, из всех возможных дней..."
10046020-381 = "...Прости, Мика. Я выставила себя дурой."
10046020-382 = "Н-Нет! Не извиняйся. Ты просто... следовала своему порыву. Да!"
10046020-383 = ""
10046020-385 = ""
10046020-386 = "...Хм? Сенсей?"
10046020-387 = "Я в порядке? ...Почему спрашиваете?"
10046020-388 = "А... А-а..."
10046020-389 = "Хаха. Точно. Спасибо за беспокойство."
10046020-390 = "Конечно, я стараюсь мыслить позитивно, но признаю: меня немного... раздражает, что это происходит в мой ЕДИНСТВЕННЫЙ отпуск."
10046020-391 = "И что этим вредителем снова оказалась именно Геенна."
10046020-392 = "Хм... Если честно... Думаю, меня это немного... хм."
10046020-393 = "Знаете что? Думаю, лучше сосредоточиться на уборке."
10046020-394 = "Наги не выдержит, если увидит такой беспорядок. Всё веселье пропадёт..."
10046020-395 = "По крайней мере, девушка из Кружка горячих источников ушла..."
10046020-397 = "Нет, это неправильно!!"
10046020-398 = ""
10046020-400 = ""
10046020-401 = "А?!"
10046020-402 = "...Ичика?"
10046020-403 = ""
10046020-405 = ""
10046020-407 = "Кружок горячих источников не отступает! Раз они положили глаз на это место, они вернутся!"
10046020-408 = "Они будут снова и снова налетать сюда и мешать отдыху, пока не получат желаемое! Если мы не остановим их сейчас, отпуск будет испорчен."
10046020-409 = "Сенсей, вы знаете правду. Стоит Нагисе узнать об этом, и отпуск закончится. Она снова включит рабочий режим."
10046020-410 = "Нет-нет! Даже если это Геенна, не может же всё быть настолько плохо... Правда, Сенсей?"
10046020-411 = "[s19] «У меня голова болит от одной мысли об этом...»\n[s20] «...Они и правда довольно настойчивы.»"
10046020-412 = ""
10046020-413 = ""
10046020-415 = ""
10046020-416 = "С-Сенсей тоже так думает?! А Хасуми?"
10046020-417 = "...Если позволите говорить откровенно, студенты Геенны не славятся выдающимися умственными способностями."
10046020-418 = "И мы все слышали, что сказала Ичика."
10046020-419 = "Если эти люди сумели вывести из себя даже ЕЁ, значит, с ними будут проблемы."
10046020-420 = "Более того, если мы не остановим Кружок горячих источников сейчас, они снова появятся... скорее всего, в самый неподходящий момент."
10046020-421 = "Я просто не хочу сегодня устраивать сцен..."
10046020-422 = "Хорошо. Это наш отпуск, но и ваш тоже."
10046020-423 = "Если вы двое не можете расслабиться, пока Кружок горячих источников на свободе, тогда..."
10046020-424 = ""
10046020-426 = ""
10046020-427 = "...нам стоит разобраться с этим как можно скорее."
