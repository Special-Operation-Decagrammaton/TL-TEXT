[translation]
10055090-1 = "Эпизод 9;Солёный сон"
10055090-2 = "Я искренне, от всей души прошу прощения!"
10055090-3 = ""
10055090-4 = "Я изо всех сил пыталась их остановить, но команда была совершенно уверена, что вы пираты, и открыла огонь!"
10055090-5 = "Но такого никто из нас и представить не мог!"
10055090-6 = "Подумать только, на борту был САМ Сенсей! И уважаемое Общество Пандемониум Геенны!"
10055090-7 = "[s1] «Н-ничего страшного».\n[s2] «Апчхи!»"
10055090-10 = "Боже мой! Ой-ой! Сенсей, вы заболеваете? Срочно принесите полотенца! Одеяла! Всё, что есть!"
10055090-11 = "[s3] «Не надо, со мной всё хорошо».\n[s4] «Сначала позаботьтесь о моих студентах»."
10055090-14 = "Разумеется! Мы спасли всех пятерых, сейчас они в безопасности и восстанавливаются!"
10055090-15 = "И, эм... Я была бы очень признательна, если бы вы замолвили за нас словечко перед Обществом Пандемониум..."
10055090-16 = "[s5] «Пятерых...?»\n[s6] «Нет, там было ещё двое...»"
10055090-19 = "...А. Значит, вы тоже их видели, Сенсей."
10055090-20 = "Все упорно твердят, что на борту точно было больше людей..."
10055090-21 = "[s7] «То есть... они пропали?!»\n[s8] «Их оставили в океане?!»"
10055090-24 = "Нет, ни в коем случае! «Трезубец» уже ведёт полномасштабные поиски!"
10055090-25 = "Прошу, не поймите неправильно то, что я сейчас скажу!"
10055090-26 = ""
10055090-28 = ""
10055090-29 = "Понимаю, прозвучит совершенно дико..."
10055090-30 = "Но они словно... растворились."
10055090-32 = "И дело не только в тех студентах. Сам корабль тоже исчез."
10055090-33 = "Он не затонул. Мы не нашли ни паруса, ни пушки, ни даже щепки. Словно его никогда и не существовало."
10055090-40 = "...А, Сенсей."
10055090-41 = "Вы пришли посоветоваться со мной о корабле-призраке, верно? Ведь именно у меня скорее всего найдутся сведения о нём."
10055090-42 = "И вы... отчасти правы."
10055090-43 = "У меня есть кое-какие данные. Но многое в них лишь предположения."
10055090-44 = "...Но почему вы ищете ответы, Сенсей?"
10055090-45 = "[s9] «Они ведь тоже студенты».\n[s10] «Поэтому...»"
10055090-48 = "...Пусть даже это студенты, но они же не ВАШИ студенты, верно?"
10055090-49 = "Порой мне всё ещё трудно понять ваш взгляд на мир."
10055090-50 = "Впрочем, если вы будете нам обязаны, это очень пригодится и мне, и Обществу Пандемониум."
10055090-51 = "Так что расскажу всё, что знаю, включая догадки."
10055090-52 = ""
10055090-54 = ""
10055090-55 = "...Имейте в виду, речь о глубокой древности. К нам она почти не относится."
10055090-56 = "Когда-то академия Геенна вынашивала грандиозные планы выхода в море. Хотели основать морское отделение академии."
10055090-57 = "Тогдашний председатель студсовета построила парусный корабль, назвала его в свою честь и собрала множество студентов на торжественную церемонию первого плавания."
10055090-58 = "И что, по-вашему, произошло?"
10055090-59 = "Он тут же затонул."
10055090-60 = "Вопреки многим популярным пересказам этой истории, серьёзные проблемы были очевидны с самого начала."
10055090-61 = "Самое главное, Геенна никогда не была морской академией. С чего бы ей вдруг уметь строить такие большие и исправные суда? Предприятие было обречено с самого начала."
10055090-62 = "Но самый известный случай, окончательно похоронивший эту затею, если можно так выразиться..."
10055090-63 = "...стал праздничный залп в честь события."
10055090-64 = "Корабль затонул после первого же залпа, а проект Морской школы Геенны закрыли."
10055090-67 = ""
10055090-69 = "[ns] «Значит, герб, который мы видели...»"
10055090-70 = "Именно. Он изначально предназначался для Морской школы Геенны."
10055090-71 = "Он достаточно похож на герб Геенны, а нынешние студенты и вовсе не знают о существовании Морской школы. Её сочли позорным провалом и вычеркнули из учебников истории. Неудивительно, что Макото приняла его за наш герб."
10055090-72 = "[s11] «Но вы говорили, что корабль затонул?»\n[s12] «И школа тоже исчезла»."
10055090-75 = "Именно. А теперь начинаются предположения."
10055090-76 = "Корабль, которого больше не должно существовать. Герб, стёртый из истории. Словно сама судьба разыграла свои карты, и он загадочным образом явился перед нами..."
10055090-77 = ""
10055090-79 = ""
10055090-80 = "А это значит..."
10055090-81 = "...это и правда был корабль-призрак?!"
10055090-82 = ""
10055090-84 = ""
10055090-86 = "[ns13] «Сацуки?!»\n[ns14] «Держись, САЦУКИ-И-И!»"
10055090-90 = "Эй! Есть тут кто-нибудь?!"
10055090-91 = ""
10055090-93 = ""
10055090-94 = "У меня тут напитки закончились!"
10055090-95 = "И вишня мне ваша понравилась. Принесите ещё, самую свежую."
10055090-96 = ""
10055090-98 = ""
10055090-99 = ""
10055090-100 = "Разве минуту назад мы не были врагами?"
10055090-101 = "Да кем она себя возомнила? Явилась и командует нами!"
10055090-102 = "Эй, вы там! Меньше болтовни, больше дела!"
10055090-103 = "Д-Да!"
10055090-104 = ""
10055090-106 = ""
10055090-107 = ""
10055090-108 = ""
10055090-109 = "..."
10055090-110 = "..."
10055090-111 = "Ироха!"
10055090-113 = "А-а! Напугала меня."
10055090-114 = "Ибуки. И Сенсей."
10055090-115 = "Знаешь... Ибуки понимает, что происходит."
10055090-116 = "Ты ведь хочешь помириться с Макото, правда?"
10055090-117 = ""
10055090-119 = ""
10055090-120 = "Что?"
10055090-121 = "Ибуки и Сенсей будут за тебя болеть!"
10055090-122 = "Ибуки поможет, хорошо?"
10055090-123 = ""
10055090-125 = ""
10055090-126 = ""
10055090-127 = ""
10055090-128 = "П-постой, Ибуки!"
10055090-129 = ""
10055090-130 = "..."
10055090-131 = "...С чего бы мне хотеть мириться с ней?"
10055090-132 = "Она высокомерная, эгоистичная и упрямая."
10055090-134 = "А? Кто здесь?"
10055090-135 = ""
10055090-136 = "Ироха...? Что ты тут делаешь?"
10055090-137 = "...Макото."
10055090-138 = "Оставим это. У меня к тебе два вопроса."
10055090-139 = "..."
10055090-140 = "Помнишь, что сказала, когда собиралась на корабль-призрак?"
10055090-141 = ""
10055090-142 = "Если так боишься, можешь не идти. Хочешь остаться на лодке — оставайся."
10055090-143 = "А кто хочет идти со мной, следуйте за мной. Я поведу."
10055090-144 = ""
10055090-145 = "Да. Именно так я и сказала."
10055090-146 = "...А что бы ты сделала, если бы за тобой никто не пошёл?"
10055090-147 = "Вот что ты хотела узнать?"
10055090-148 = "Простой вопрос, простой ответ."
10055090-149 = "Если бы никто не пошёл за мной, я справилась бы в одиночку."
10055090-150 = "Однако такого попросту не могло произойти."
10055090-151 = "...Вы серьёзно?"
10055090-152 = "Ты хоть понимаешь, как это звучит? Для начала, это противоречие."
10055090-153 = "То есть ты просто втянула нас всех в свой непродуманный план?"
10055090-154 = "Ты ведь пошла за мной вместе с остальными, разве нет, Ироха?"
10055090-155 = "Это..."
10055090-156 = ""
10055090-158 = ""
10055090-159 = "..."
10055090-160 = "Второй вопрос."
10055090-161 = "Любому было видно, что корабль-призрак опасен. Ты ведь тоже это понимала, Макото?"
10055090-162 = "Почему ты бросилась на борт?"
10055090-163 = "..."
10055090-164 = "...Так и знала. Ты вообще ни о чём не подумала, да?"
10055090-165 = "Глупо было на что-то рассчитывать..."
10055090-166 = "Нет, это..."
10055090-167 = "Это неправда."
10055090-168 = "Что?"
10055090-169 = "У меня была причина. Но..."
10055090-170 = "...Ладно, выкладывай. Какое на этот раз оправдание?"
10055090-171 = "Нет. Просто..."
10055090-172 = "Никогда и никому не рассказывай, что я тебе сейчас скажу. Никогда."
10055090-173 = ""
10055090-175 = ""
10055090-176 = "Потому что..."
10055090-177 = "Да?"
10055090-178 = ""
10055090-180 = ""
10055090-181 = "Я подумала... если смогу эффектно разрешить все проблемы..."
10055090-182 = "...то, может быть, ты передо мной извинишься."
10055090-184 = "..."
10055090-185 = "...?!"
10055090-186 = "Ты ИЗДЕВАЕШЬСЯ?!"
10055090-187 = "Как ты можешь произносить такую неловкую чушь с невозмутимым видом?!"
10055090-188 = "Вот поэтому я и сказала! Никому об этом не рассказывай!"
10055090-189 = "Не могу поверить! Вся эта заваруха началась из-за..."
10055090-191 = ""
10055090-192 = "Ибуки, ты удивительная."
10055090-193 = "А?"
10055090-194 = "Я боялась оставлять их наедине. Но стоило им немного поговорить, как всё само собой разрешилось."
10055090-195 = "Ты ведь знала, что так будет, правда, Ибуки?"
10055090-196 = "Ага! Потому что Ироха..."
10055090-197 = "...очень-очень любит Макото!"
10055090-198 = "..."
10055090-199 = "Ахаха! Идеальный ответ! Ибуки настоящий гений!!"
10055090-200 = "Эй! Я вообще-то всё слышу!"
10055090-201 = "Ик!"
10055090-202 = "Ибуки, отступаем!"
10055090-203 = "Ура! Отступаем!"
10055090-204 = ""
10055090-206 = ""
10055090-207 = ""
10055090-208 = "Честно говоря..."
10055090-209 = "...Я? Люблю такую, как она?"
10055090-210 = "Она высокомерная, эгоистичная и упрямая."
10055090-211 = ""
10055090-213 = ""
10055090-215 = ""
10055090-216 = ""
10055090-218 = ""
10055090-220 = ""
10055090-221 = ""
10055090-222 = "И всё же..."
10055090-223 = "Иногда. Очень-очень редко..."
10055090-225 = "Она бывает довольно крутой. Иногда."
10055090-226 = "В путь! Корабль Пандемониума: #nРоскошный летний отдых председателя Макото!"
