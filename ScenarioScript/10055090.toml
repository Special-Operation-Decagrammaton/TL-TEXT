[translation]
10055090-1 = "Episode 9;Dream of Saltwater"
10055090-2 = "I am truly, terribly sorry!!"
10055090-4 = "I-I tried to stop them! But the crew insisted, 'It's definitely a pirate ship,' and wouldn't listen... They just started the battle on their own..."
10055090-5 = "And then, of all the unbelievable things!"
10055090-6 = "The famous Sensei from Schale... and everyone from Gehenna's Pandemonium Society actually came all this way!!"
10055090-7 = "[s1] \"I-It's okay.\"\n[s2] \"A-choo!!\""
10055090-10 = "A-Are you alright, Sensei!? Everyone, hurry and bring every blanket and towel we have left!!"
10055090-11 = "[s3] \"I'm fine.\"\n[s4] \"Please look after the others.\""
10055090-14 = "Yes, yes! Of course! All five have been safely rescued, and everyone is in stable condition."
10055090-15 = "As for the members of the Pandemonium Society, please, I leave them in your care..."
10055090-16 = "[s5] \"...Five?\"\n[s6] \"There were others on that ship...\""
10055090-19 = "...Ah, so you saw them too, Sensei."
10055090-20 = "Everyone kept saying, 'There are other people there,' but..."
10055090-21 = "[s7] \"Are they missing!?\"\n[s8] \"Did everyone fall into the sea!?\""
10055090-24 = "No, heaven forbid! Trident is currently searching with all our might!"
10055090-25 = "That... I really, really don't want you to misunderstand, but..."
10055090-29 = "Well, this might sound like I'm saying something strange."
10055090-30 = "...It's as if they all just vanished."
10055090-32 = "Not just the people, but the sunken ship itself is gone."
10055090-33 = "It's as if it never existed in the first place... We can't even find a single plank."
10055090-40 = "...Ah, Sensei."
10055090-41 = "You came to ask, didn't you? Whether I know something about the true nature of 'that thing'."
10055090-42 = "You're half right."
10055090-43 = "The other half is still just speculation, so it has no value as information."
10055090-44 = "But... why do you care so much?"
10055090-45 = "[s9] \"Because those girls were students too?\"\n[s10] \"That's why...\""
10055090-48 = "Even if they were students, they were just people you met for the first time, right?"
10055090-49 = "I still don't really understand how your mind works, Sensei."
10055090-50 = "Well, I suppose owing you a favor has its own merits for the Pandemonium Society..."
10055090-51 = "Fine, I'll tell you. The 'information' that only I know."
10055090-55 = "...This is a story from long ago that has nothing to do with us."
10055090-56 = "There was a time when Gehenna Academy dreamed of expanding into the ocean. They were trying to build a marine academy as a branch school."
10055090-57 = "The student council president at the time named the ship after herself, gathered students, and held a launch ceremony."
10055090-58 = "And... what do you think happened?"
10055090-59 = "It sank the moment it set sail."
10055090-60 = "There were many reasons. Well, in the end, it was a ship destined to sink."
10055090-61 = "It was a natural result. An academy that had never even built a boat was suddenly trying to build a large sailing ship."
10055090-62 = "But... the most famous cause, and what is said to be the biggest factor, was..."
10055090-63 = "The celebratory cannon fire during the launch ceremony."
10055090-64 = "The ship sank right there, and the Gehenna Marine Academy project was scrapped."
10055090-69 = "[s] \"The school emblem we saw back then...\""
10055090-70 = "Yes, that was the one they were supposed to use for the Gehenna Marine Academy."
10055090-71 = "But Makoto-chan couldn't tell the difference either, and I don't think there's anyone left who would know. #nIt already looks similar to the Gehenna Academy emblem, and the very existence of the Marine Academy was erased as a dark history."
10055090-72 = "[s11] \"But that ship sank, right?\"\n[s12] \"And the academy is gone too.\""
10055090-75 = "That's right. That's why it's a strange story."
10055090-76 = "A ship and an emblem that shouldn't exist. #nThey appeared right before our eyes."
10055090-80 = "...In other words."
10055090-81 = "That was a real ghost ship..."
10055090-86 = "[ns13] \"Satsuki!?\"\n[ns14] \"Pull yourself together!! Satsuki!!\""
10055090-90 = "Is anyone there?"
10055090-94 = "I need a refill on my drink."
10055090-95 = "Oh, and the cherries were delicious. Bring me the freshest ones you have."
10055090-100 = "...Weren't we just fighting a moment ago?"
10055090-101 = "Who is that guy? Acting so high and mighty..."
10055090-102 = "You there! Get to work!"
10055090-103 = "Y-Yes, sir!!"
10055090-109 = "..."
10055090-110 = "..."
10055090-111 = "Iroha-senpai!"
10055090-113 = "Y-You startled me."
10055090-114 = "Ibuki and... Sensei?"
10055090-115 = "Actually, Ibuki knows."
10055090-116 = "Iroha-senpai, you want to make up with Makoto-senpai, right?"
10055090-120 = "Huh?"
10055090-121 = "Ibuki and Sensei will cheer you on!"
10055090-122 = "Yes, Ibuki will help!"
10055090-128 = "W-Wait, Ibuki!"
10055090-130 = "..."
10055090-131 = "...Why would I want to make up with someone like that?"
10055090-132 = "Selfish, self-centered, overbearing..."
10055090-134 = "Hm? Who's there?"
10055090-136 = "Iroha...? What are you doing there?"
10055090-137 = "...Makoto-senpai."
10055090-138 = "To be blunt, I have two questions for you."
10055090-139 = "..."
10055090-140 = "At the beginning, when we were boarding the ghost ship, you said this, didn't you?"
10055090-142 = "If you're anxious, you don't have to follow me. If you want to stay on the ship, do as you please."
10055090-143 = "Those who wish to come with me, follow behind me. #nI, Lord Makoto, shall lead the way."
10055090-145 = "Ah, yes. I did."
10055090-146 = "At that time... what were you planning to do if no one followed you?"
10055090-147 = "Are you curious about that?"
10055090-148 = "The answer is simple. I'll give you two answers."
10055090-149 = "One: If no one was there, I would have solved it by myself."
10055090-150 = "Two: There is no way people wouldn't follow me."
10055090-151 = "...That's your answer?"
10055090-152 = "That's truly ridiculous... I mean, those two answers contradict each other."
10055090-153 = "Were we dragged into such a nonsensical plan?"
10055090-154 = "Speaking of which, Iroha, you followed me in the end, didn't you?"
10055090-155 = "That is..."
10055090-159 = "..."
10055090-160 = "Here is my second question."
10055090-161 = "That ghost ship was clearly dangerous to anyone who looked at it. But you noticed that too, didn't you, Makoto-senpai?"
10055090-162 = "Then why did you jump into it?"
10055090-163 = "..."
10055090-164 = "...I thought so. You really weren't thinking about anything, were you?"
10055090-165 = "I was a fool for expecting anything..."
10055090-166 = "No, about that..."
10055090-167 = "That's not it."
10055090-168 = "Huh?"
10055090-169 = "There was a reason... but."
10055090-170 = "...Are you lying again? That was your specialty, wasn't it?"
10055090-171 = "No... that's not it."
10055090-172 = "Just don't go blabbing this to anyone else. Absolutely not."
10055090-176 = "...So?"
10055090-177 = "Huh?"
10055090-181 = "Well, you see... if I solved everything perfectly..."
10055090-182 = "I thought Iroha might apologize..."
10055090-184 = "..."
10055090-185 = "...!?"
10055090-186 = "You're lying, right!!?"
10055090-187 = "How could you even say that out loud!?"
10055090-188 = "I told you! I said don't tell anyone!"
10055090-189 = "Honestly, this is unbelievable!? The whole thing started because of—"
10055090-192 = "Ibuki-chan is amazing."
10055090-193 = "Hm?"
10055090-194 = "I was worried and tried to keep those two apart... #nBut the moment I left them to it, everything worked out."
10055090-195 = "Ibuki-chan, you knew from the start, didn't you?"
10055090-196 = "Yeah! Because Iroha-senpai..."
10055090-197 = "Loooooves Makoto-senpai so much~!"
10055090-198 = "..."
10055090-199 = "Ahahaha! That's right! Ibuki-chan is a genius after all!!"
10055090-200 = "You there, keep it down! I can hear everything you're saying!?"
10055090-201 = "Eek!"
10055090-202 = "Ibuki-chan, retreat!!"
10055090-203 = "Yay~ re-treat."
10055090-208 = "Honestly..."
10055090-209 = "Why would I ever..."
10055090-210 = "Selfish, self-centered, overbearing..."
10055090-222 = "But well..."
10055090-223 = "Once in a while... truly, just once in a while."
10055090-225 = "You can be a little cool, Makoto-senpai."
10055090-226 = "Set Sail! The Pandemonium Ship: Chairman Makoto's Magnificent Summer Retreat"