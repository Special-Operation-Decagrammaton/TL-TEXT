[translation]
1004815-1 = "Доказательство того, что всё было не зря"
1004815-2 = "Через некоторое время Саори пришла ко мне."
1004815-4 = "Простите за внезапный визит, Сенсей."
1004815-5 = "Но есть одна вещь, которую я очень хочу починить."
1004815-6 = "...Вот."
1004815-7 = ""
1004815-9 = ""
1004815-11 = "[ns] «Твоя маска?»"
1004815-12 = "Да. Фильтр очистки сломан."
1004815-13 = "Эту модель сняли с производства, детали нестандартные, поэтому в ремонтной мастерской её не приняли."
1004815-14 = "[s] «Значит, она довольно старая.»"
1004815-15 = "Я получила её в Спутниковой школе Ариус во время своей первой настоящей миссии. Это их старая базовая модель."
1004815-16 = "В любом случае, если сможете, Сенсей, пожалуйста, помогите найти способ её починить."
1004815-17 = "Если у вас получится, я сделаю для вас что угодно."
1004815-18 = "[s] «Что угодно?»"
1004815-19 = "Д-Да. Что угодно."
1004815-20 = "[s1] «Эта маска, должно быть, очень много для тебя значит.»\n[s2] «С ней связана какая-то история?»"
1004815-21 = ""
1004815-22 = ""
1004815-24 = ""
1004815-25 = "...Как я уже говорила, она была частью моего первоначального снаряжения."
1004815-26 = "В самой маске нет ничего особенного. Она считается расходником."
1004815-27 = "Просто особенно прочным и долговечным расходником..."
1004815-28 = "...но в конце концов и она износилась."
1004815-29 = "Раньше, если какой-то мой инструмент ломался или становился бесполезным..."
1004815-30 = "...я бы выбросила его, не задумываясь."
1004815-31 = "Но эта маска для меня скорее как товарищ."
1004815-32 = "Как напарник."
1004815-33 = "Даже если она сломана..."
1004815-34 = "я не хочу просто выбрасывать её, будто она ничего не значит."
1004815-35 = "Поэтому я хочу её починить."
1004815-36 = "Потому что... я уже не такая, какой была тогда."
1004815-37 = "[s] «Понятно...»"
1004815-38 = ""
1004815-41 = "[ns3] «Теперь я понимаю, почему ты так решительно настроена.»\n[ns4] «Давай вместе найдём способ её починить!»"
1004815-44 = "Правда? Спасибо. Искренне."
1004815-45 = "[s] «Фуфуфу. Не забудь своё обещание. Починим — и ты сделаешь „что угодно“.»"
1004815-46 = "К-Конечно. Обещание есть обещание."
1004815-48 = "Я отправился в путь уверенно, но..."
1004815-50 = "О, давно не видел таких масок. Не знал, что кто-то ещё ими пользуется."
1004815-51 = "К сожалению, похоже, заменить придётся почти каждую деталь."
1004815-52 = "У меня и так слишком много заказов, поэтому не знаю, когда смогу взяться..."
1004815-53 = "Хотя бы примерно?"
1004815-54 = "М-м... Честно говоря, минимум через несколько лет."
1004815-55 = "...Понятно."
1004815-57 = "Ох, добро пожаловать. Что вы ищете?"
1004815-58 = "...Что? Простите, но деталей для такой маски у меня нет..."
1004815-59 = "Даже не помню, когда в последний раз такую видел."
1004815-60 = "Может, лучше купите новую? У меня есть много моделей получше."
1004815-61 = "...Простите. Мне нужна именно эта маска."
1004815-63 = "Фуфуфу, добро пожаловать. У меня есть как раз нужные вам детали."
1004815-64 = "Вот моя оценка стоимости. Что скажете?"
1004815-65 = "Ох, дорого... но детали у вас есть?"
1004815-66 = "Ну, технически пока нет, но я могу их достать. Наверное, смогу. Так или иначе."
1004815-67 = "...Пойдёмте, Сенсей."
1004815-69 = "После этого мы обошли ещё много магазинов, но нигде нам не повезло."
1004815-71 = ""
1004815-72 = "Уже ночь?"
1004815-73 = "Ну, я знала, что будет непросто."
1004815-74 = "Может, это просто моя упрямость."
1004815-75 = "...Наверное, даже если фильтр не работает, я всё ещё могу использовать её, чтобы скрывать лицо."
1004815-76 = "Спасибо, что терпели меня, Сенсей. Я найду способ отплатить вам за—"
1004815-77 = "[s5] «Подожди!»\n[s6] «Мы не можем так просто сдаться!»"
1004815-80 = "Но если никто не может её починить..."
1004815-81 = "[s7] «А, ещё один человек остался.»\n[s8] «Ты прямо на него смотришь, Саори!»"
1004815-84 = "...Сенсей?"
1004815-85 = "[s9] «Мне уже доводилось делать простой ремонт.»\n[s10] «А чего не знаю — изучу и разберусь.»"
1004815-88 = "Я-я тоже думала попробовать самой."
1004815-89 = "Но это не так просто."
1004815-90 = "[s11] «Уверен, что непросто.»\n[s12] «Но я лучше попробую, чем сдамся.»"
1004815-93 = ""
1004815-95 = ""
1004815-96 = "Если вы готовы попробовать, я с радостью помогу."
1004815-97 = "Скажите, если вам что-нибудь понадобится."
1004815-98 = "[s13] «Можешь пока помочь, взяв на себя работу представителя учеников в „Шале“.»\n[s14] «Давай вместе добьёмся результата!»"
1004815-101 = "Я — представитель учеников в «Шале»...?"
1004815-102 = "...Да. Я постараюсь изо всех сил."
1004815-104 = "На следующий день..."
1004815-105 = ""
1004815-107 = ""
1004815-108 = "Я начал ремонтировать маску, а Саори помогала."
1004815-113 = ""
1004815-115 = ""
1004815-116 = ""
1004815-118 = "Я знал, что будет тяжело, но не до конца понимал, НАСКОЛЬКО..."
1004815-119 = ""
1004815-124 = ""
1004815-126 = "...поэтому в итоге работал и днём и ночью."
1004815-128 = "Я тщательно изучал всё, чего не знал..."
1004815-129 = "...и извлекал подходящие запчасти из других устройств."
1004815-130 = ""
1004815-134 = ""
1004815-136 = "И всё это время..."
1004815-137 = "...я молился, чтобы любимый «товарищ» Саори снова заработал."
1004815-138 = ""
1004815-142 = "Несколько дней спустя..."
1004815-144 = "Хм... А? Уже утро?"
1004815-145 = "Наверное, я задремала."
1004815-146 = "Хм...? Сенсей? Почему вы улыбаетесь?"
1004815-147 = "[s15] «Фуфуфу, получилось...»\n[s16] «Миссия выполнена!!»"
1004815-150 = ""
1004815-153 = "Неужели...?! Вы её починили?!"
1004815-154 = "[s] «Ага! Примерь!»"
1004815-155 = ""
1004815-157 = ""
1004815-158 = ""
1004815-159 = ""
1004815-160 = "Это..."
1004815-161 = "...Она работает. Фильтр как новый."
1004815-162 = "Вы правда её починили."
1004815-163 = ""
1004815-165 = ""
1004815-166 = "Спасибо за весь ваш труд, Сенсей. Я снова у вас в долгу."
1004815-167 = "[s] «Без твоей помощи ничего бы не получилось, Саори.»"
1004815-168 = ""
1004815-171 = "[ns] «Мы сделали это вместе.»"
1004815-172 = "Результат наших общих усилий."
1004815-173 = "От этих слов маска кажется мне ещё более особенной."
1004815-174 = ""
1004815-176 = ""
1004815-177 = "Спасибо, Сенсей. Я буду беречь её, чтобы она снова не сломалась."
1004815-178 = "[s] «А теперь пора выполнить твоё обещание, Саори.»"
1004815-179 = "Обещание? А..."
1004815-180 = "[s] «То самое, где ты сказала, что после ремонта сделаешь что угодно.»"
1004815-181 = "...Конечно. Я сделаю всё, что захотите, Сенсей."
1004815-182 = "[s17] «Фуфуфу... Я так долго этого ждал.»\n[s18] «Я всегда хотел это сделать...!!»"
1004815-185 = "...И что именно вы задумали?"
1004815-186 = "Я сказала, что сделаю что угодно, но... вы придумали что-то странное?"
1004815-187 = "[s] «Да, что-то ОЧЕНЬ неловкое и смущающее.»"
1004815-188 = "Цк...! Л-Ладно, говорите, чего хотите!"
1004815-189 = "[ns] «Я хочу, чтобы ты...»"
1004815-191 = "[ns] «...приходила в „Шале“ когда захочешь.»"
1004815-192 = "До какой степени вы можете быть бесстыдным...?!"
1004815-193 = "...А? Что?"
1004815-194 = "[s] «Вот и всё. Просто заходи, когда захочешь.»"
1004815-195 = ""
1004815-198 = "[ns19] «Без давления.»\n[ns20] «И не нужно переживать.»"
1004815-201 = "[ns] «Тебе здесь всегда рады, Саори.»"
1004815-202 = ""
1004815-203 = "...Понятно. Если подумать, я ведь ни разу не рассматривала возможность просто прийти сюда."
1004815-204 = "Мысль о встрече с вами один на один всегда заставляла меня сильно нервничать."
1004815-205 = "Но вы разрушили этот барьер."
1004815-206 = "Понятно. Тогда я попробую, Сенсей."
1004815-207 = "Я постараюсь приходить сюда спокойно."
1004815-208 = "И всё же... если маске снова понадобится обслуживание, можно будет опять попросить вас помочь?"
1004815-209 = "Раз уж мы напарники по её ремонту."
1004815-210 = "[s] «Конечно! Приноси в любое время!»"
1004815-211 = "...Вы учите меня стольким новым вещам, Сенсей."
1004815-212 = "И я буду ждать возможности узнать ещё больше."
1004815-214 = "После этого Саори расслабилась, и остаток времени мы провели вместе."
