[translation]
1001206-1 = "Свидание с Тренером"
1001206-2 = "Торговый центр возле Миллениума"
1001206-3 = "..."
1001206-4 = "О, вот ты где, Тренер."
1001206-5 = "Я ждала тебя."
1001206-6 = "А? Я пришла купить ещё что-нибудь для тренировок?"
1001206-7 = "Н-Нет! Не в этот раз."
1001206-8 = "Просто я не смогла придумать место лучше для встречи."
1001206-9 = "Наверное, потому что мы только и говорим о тренировках."
1001206-10 = "Поэтому сегодня я хотела поговорить с тобой о чём-нибудь другом..."
1001206-11 = "..."
1001206-12 = ""
1001206-13 = "О-О! Прости, Тренер!"
1001206-14 = "Ты ведь сегодня наверняка занят! Мне ужасно неловко, что я так эгоистично трачу твоё время!"
1001206-15 = "[s1] «Я не против. Мне не помешает сменить обстановку.»\n[s2] «А, значит, это должно быть свидание...»"
1001206-16 = "Т-Ты уверен?"
1001206-17 = "Спасибо, мне стало спокойнее."
1001206-18 = "...?!"
1001206-19 = "А? С-свидание? Я не имела в виду..."
1001206-20 = "То есть я была бы не против, но..."
1001206-21 = "Ннннгх..."
1001206-22 = "[s] «Ну и куда пойдём сначала?»"
1001206-23 = "Так уж вышло, что по нашему плану питания сегодня можно сахар и жир."
1001206-24 = "Кажется, люди называют это читмилом."
1001206-25 = "Так что если ты не против, давай сходим куда-нибудь и воспользуемся этим."
1001206-26 = "[s] «Я за что-нибудь сладкое!»"
1001206-27 = "Поняла, Тренер!"
1001206-30 = "Ух ты. Я так давно не бывала в таких местах."
1001206-31 = "Я часто слышу, как одноклассницы обсуждают любимые кафе, и прохожу мимо людей, которые туда заходят и выходят."
1001206-32 = "Мне всегда казалось, что для таких, как я, там ничего нет..."
1001206-33 = "...но теперь, когда я внутри, понимаю, насколько здесь мило."
1001206-34 = "Хороший выбор, Тренер."
1001206-35 = "Могу принять ваш заказ?"
1001206-36 = "О, минутку, пожалуйста."
1001206-37 = ""
1001206-38 = "Эм..."
1001206-39 = "О, этот торт."
1001206-40 = "Какой милый."
1001206-41 = "[s] «Хочешь заказать его?»"
1001206-42 = "Да, Тренер."
1001206-43 = "О, но прежде чем заказать..."
1001206-44 = "Извините? Можно задать вопрос?"
1001206-45 = "Конечно. Какой?"
1001206-46 = "Насчёт этого торта с милым маскотом."
1001206-47 = "Где можно посмотреть пищевую ценность десерта?"
1001206-48 = "П-Простите?"
1001206-49 = "Общее количество калорий, сахара и жиров..."
1001206-50 = "О, и пусть там наверняка немного, я бы ещё хотела узнать содержание белка."
1001206-51 = "О, я-я не знаю..."
1001206-52 = "[s] «Эй, Сумирэ...»"
1001206-53 = "Да, Тренер?"
1001206-54 = ""
1001206-55 = "А..."
1001206-56 = "Ох, я опять за своё... Прости."
1001206-57 = "Давай начнём сначала и сделаем вид, что этого не было. Прости."
1001206-59 = "(После этого мы с Сумирэ взяли десерты и сели.)"
1001206-60 = "*вздох* Мне всё ещё неловко за то, что было раньше, Тренер."
1001206-61 = "Я знаю, сегодня читмил, но не могу игнорировать, насколько питание важно для режима тренировок."
1001206-62 = "Здоровое питание — ключ и к здоровью, и к набору мышечной массы."
1001206-63 = "Кстати. Ты принимаешь протеиновые добавки, которые я тебе дала?"
1001206-64 = "Из обычной еды, естественно, невозможно получить бесконечное количество белка."
1001206-65 = "Поэтому и существуют добавки. Они позволяют легко увеличить потребление белка с высокой биологической ценностью."
1001206-66 = "БЦ? Биологическая ценность. Она относится к усвоению питательных веществ, отвечающих за поддержание и рост организма..."
1001206-67 = "[s3] «Эм... Сумирэ.»\n[s4] «Твой десерт выглядит одиноким.»"
1001206-68 = "...О."
1001206-69 = "...О."
1001206-70 = "Опять!"
1001206-71 = "Прости, Тренер."
1001206-72 = "Я снова увлеклась."
1001206-73 = "Так всегда происходит, когда начинаю говорить о тренировках..."
1001206-74 = "Мне уже нечем оправдываться, Тренер."
1001206-75 = "[s] «Ничего. Давай просто наслаждаться едой.»"
1001206-76 = "...Если вы так говорите."
1001206-78 = "(После этого мы с Сумирэ съели вкусные десерты.)"
1001206-80 = "[ns] «Готова возвращаться?»"
1001206-81 = "...Да."
1001206-82 = "А? Я выгляжу подавленной?"
1001206-83 = "П-Просто..."
1001206-84 = "Мне неловко из-за того, насколько я зациклена на тренировках."
1001206-85 = "Сегодня должен был быть наш выходной, чтобы поговорить о чём-то обычном."
1001206-86 = "[s5] «Разве мы не это и сделали?»\n[s6] «Мне казалось, мы хорошо провели время вместе.»"
1001206-87 = "..."
1001206-88 = "..."
1001206-89 = "Хи-хи. Хорошо."
1001206-90 = "Простите, девушка! Подождите минутку."
1001206-91 = "А?"
1001206-92 = "Торт, который вы купили, участвует в специальной акции. Мы раздаём эти куклы первым покупателям."
1001206-93 = "Я думала, их уже не осталось, но проверила и нашла одну. Вот!"
1001206-94 = ""
1001206-95 = "Т-Такая милая..."
1001206-96 = "Хорошего дня!"
1001206-97 = "Ух ты, Тренер."
1001206-98 = "Разве она не прелесть?"
1001206-99 = "[s] «Я тоже так думаю, Сумирэ.»"
1001206-100 = "Хи-хи. Да."
1001206-101 = "Как ни крути, дни, которые я провожу с тобой, почему-то всегда заканчиваются на хорошей ноте."
1001206-102 = ""
1001206-103 = "Эм, Тренер."
1001206-104 = "Надеюсь, у нас ещё будет много таких дней вместе."
1001206-105 = "Спасибо, что нашёл для меня время!"
1001206-106 = "Тренер."
