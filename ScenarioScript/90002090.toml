[translation]
90002090-1 = "Эпизод 9;Переодевание"
90002090-4 = ""
90002090-5 = ""
90002090-6 = "Я не заставила вас долго ждать, Сенсей?"
90002090-7 = "[s] «Мидори...?»"
90002090-8 = "Что такое...?"
90002090-9 = "[s] «Ты невероятно милая...!»"
90002090-10 = "Э-хе-хе. Спасибо. Я рада..."
90002090-11 = ""
90002090-13 = ""
90002090-14 = ""
90002090-15 = "Мы последовали примеру Арис и вооружились новой одеждой и оружием."
90002090-16 = "А Мидори... предложила особенно вдохновлённые дизайны."
90002090-17 = "[s1] «Все готовы?»\n[s2] «Все восемь?»"
90002090-20 = "Да."
90002090-21 = "Никаких проблем."
90002090-22 = "И очевидно... у Мидори была своя «эстетика»."
90002090-23 = "Токи и я, разумеется, проверили практическую сторону."
90002090-24 = "Да. Благодаря Кей всё было довольно просто."
90002090-25 = "Погоди, Мидори... можно я добавлю одну мысль?"
90002090-26 = "Почему... мы выглядим как астронавты?"
90002090-28 = "Это весьма практично."
90002090-30 = "Но ведь внешний вид тоже важен? Милота!"
90002090-31 = "Я просто старалась сделать экипировку безопасной. Вы хорошо защищены."
90002090-32 = "Я-я это ценю, но..."
90002090-33 = "Но всё же, понимаешь? Может, чуть больше стиля?"
90002090-34 = "[s] «По-моему, вы обе выглядите круто!»"
90002090-35 = "А? Т-ты так думаешь? Если Сенсей так говорит... Э-хе-хе..."
90002090-37 = "В любом случае, вы обе защищены. Это главное."
90002090-38 = "По статистике, у вас шансы выжить выше, чем у всех нас. Сможете убрать за нами беспорядок."
90002090-39 = "К-Кей?! Можно, ПОЖАЛУЙСТА, не говорить такие вещи?"
90002090-40 = "Мидори, я просто пошутила. Забудь."
90002090-41 = "А... дальше..."
90002090-42 = ""
90002090-44 = ""
90002090-45 = "Здравствуйте, Сенсей. Асума Токи тоже докладывает. Теперь я в более оптимизированной и облегчённой форме. Видите?"
90002090-46 = "...Серьёзно, можешь, ПОЖАЛУЙСТА, вести себя нормально?"
90002090-47 = "НЕТ. У меня новый наряд. Он хорошо выглядит. Наблюдайте."
90002090-48 = "Но не все так считают? Ты только что слышала?"
90002090-49 = "Но я хорошо выгляжу."
90002090-50 = "Ладно, ладно. Я поняла..."
90002090-51 = "[s] «Понятно. Ты отдала Аби-Эшух Арис...»"
90002090-52 = "Да. Поэтому я преобразовала себя в мобильный разведывательный модуль."
90002090-53 = "В отличие от моей стандартной формы горничной, эта эффективно сохраняет тепло тела."
90002090-54 = ""
90002090-57 = "[ns] «...Тебе всё это время было холодно?»"
90002090-58 = "Да."
90002090-59 = "[s] «И ты всё равно продолжала носить тот наряд?»"
90002090-60 = "Да."
90002090-61 = "Спрашиваете, почему?"
90002090-62 = "..."
90002090-63 = "Сенсей. Бывают моменты, когда нужно терпеть. Я не позволю себе поддаться холоду."
90002090-64 = "Опять спрашиваете, почему?"
90002090-66 = "Потому что я не могу проиграть Эйми."
90002090-67 = "[s] «Я вообще не понимаю твой ответ, Токи...»"
90002090-68 = "Всё хорошо. Я его понимаю. Это главное."
90002090-69 = ""
90002090-71 = ""
90002090-72 = ""
90002090-73 = "Т-Токи..."
90002090-74 = "*вздыхает*..."
90002090-75 = "Продолжим. Обратите внимание: основное вооружение — пара энергетических пистолетов. Когда аккумулятор разряжается, он отстреливается назад. Выглядит весьма эффектно."
90002090-76 = "Мне показалось, это круто! Я решила, что фирменные цвета Токи должны быть белым и синим!"
90002090-77 = "А когда я сниму эту белую куртку, вы сможете оценить мою превосходную фигуру. Хотите посмотреть?"
90002090-78 = "Что?!"
90002090-79 = "[s] «Нет! Думаю, сейчас не время.»"
90002090-80 = "Понятно. Тогда приберегу это на потом, для нашего особого времени наедине."
90002090-81 = "Токи?!?!"
90002090-82 = "Мидори, я тебя понимаю, но перестань реагировать. У нас нет времени."
90002090-83 = "А ты, Эйми. Что такое? Жара донимает?"
90002090-84 = "Постарайся потерпеть. Когда-нибудь я хотела бы проанализировать тебя с инженерной точки зрения. Ты весьма уникальна."
90002090-85 = ""
90002090-87 = ""
90002090-89 = ""
90002090-90 = "Фух..."
90002090-91 = "Эйми?! Разве на тебе не был плащ?"
90002090-92 = "А, он? Я... сняла его. Мне стало жарко."
90002090-93 = "Ну, это понятно..."
90002090-94 = "Но, Эйми, разве плащ не помогает с маскировкой? Ты у нас поддержка с тыла."
90002090-95 = "Если честно, мне казалось, что я получу в нём тепловой удар."
90002090-96 = "А это... не поможет. Вы ведь не хотите, чтобы ваш стрелок потерял сознание, да?"
90002090-98 = "А... Ну... Я думала, можно завязать плащ вокруг талии? Не обязательно его надевать."
90002090-100 = "Спасибо, Мидори. Твоя предусмотрительность меня спасла."
90002090-101 = "..."
90002090-102 = "Ага... Это мой недосмотр... Надо было подумать."
90002090-103 = "И, как у Токи, мы заменили твоё оружие, Эйми... Оно использует аккумулятор."
90002090-104 = "Хотя... размер батареи и выходная мощность у него совсем другие."
90002090-105 = "Кроме того, визор поможет наводиться на уязвимые места. Это требует значительного расхода энергии..."
90002090-106 = "И твой аккумуляторный рюкзак намного больше, чем у Токи."
90002090-108 = "Что думаете, Сенсей?"
90002090-109 = "Выглядит эффективно? Мм..."
90002090-110 = "..."
90002090-111 = "[s] «Что такое, Эйми?»"
90002090-112 = "Не обращай внимания. Наверное, это странно. Обычно я бы просто приняла комплимент."
90002090-113 = "Но мне хотелось услышать кое-что другое."
90002090-114 = "Что именно я хотела услышать? Наверное..."
90002090-115 = ""
90002090-117 = ""
90002090-118 = "..."
90002090-119 = "Что я красивая... может быть?"
90002090-121 = "?!"
90002090-122 = "?!"
90002090-123 = ""
90002090-125 = ""
90002090-126 = ""
90002090-127 = "[ns] «Ага. Ты правда очень красивая.»"
90002090-128 = "Ага?"
90002090-129 = "Спасибо, Сенсей."
90002090-131 = "Мидори. Что это сейчас было?"
90002090-132 = "Кей! Забудь!"
90002090-133 = "Знаю. Знаю. Но..."
90002090-134 = ""
90002090-136 = ""
90002090-137 = "..."
90002090-138 = "Ух. Так, всё. Все, прекратите. И я вижу, что ты в восторге, так что выкладывай."
90002090-140 = ""
90002090-141 = "Что вы думаете о моём новом костюме, Сенсей?"
90002090-142 = "[s] «Эм... Без обид, но...?»"
90002090-143 = "Хм?"
90002090-144 = "[s] «Тебе... не холодно?»"
90002090-145 = "О боже. Как любопытно. А я всё гадала, что вы скажете."
90002090-146 = "Как вы знаете, я нежный, умный, элегантный сверхгениальный хакер. Я учла возможные условия среды."
90002090-147 = "Этот костюм защищает от холода и воды и полностью адаптивен — боюсь, вы даже не способны представить насколько."
90002090-148 = ""
90002090-151 = "[ns3] «Нежный...»\n[ns4] «Элегантный...»"
90002090-152 = ""
90002090-153 = ""
90002090-155 = ""
90002090-156 = ""
90002090-157 = "...Послушайте, думаю, мы все об этом подумали... У тебя вообще есть стыд?!"
90002090-158 = "Кей... Разве констатация фактов не является важной частью научного метода?"
90002090-159 = "Констатация фактов... Ладно. Справедливо."
90002090-160 = "Подобно тому как чисто белый цвет символизирует мою абсолютную чистоту..."
90002090-161 = "*всхлипывает*"
90002090-162 = "[s] «Химари? Что такое...?»"
90002090-163 = "О... Сенсей. Я так потрясена собственной красотой и милотой, что не могу сдержать слёз."
90002090-164 = "Простите, Сенсей. Я позабочусь о президенте Химари. Она совсем забылась."
90002090-165 = ""
90002090-167 = ""
90002090-169 = "Эйми? Эйми?! Я ещё не закончила!"
90002090-172 = "[ns] «Момент упущен...»"
90002090-173 = "В буквальном смысле..."
90002090-174 = "(Н-надо сменить тему! Эм...!)"
90002090-175 = ""
90002090-177 = ""
90002090-178 = "Рио? Выходи! Скорее!"
90002090-179 = ""
90002090-183 = ""
90002090-184 = ""
90002090-185 = "[ns] «Рио...?»"
90002090-186 = "Что такое, Сенсей?"
90002090-187 = "[s] «Ну, то есть...»"
90002090-188 = "Не знаю, почему вы так реагируете, но вот так получилось."
90002090-189 = "Работа на месте, использование объектов, анализ обстановки... Я надела костюм, соответствующий задаче."
90002090-190 = "Это было практичное решение."
90002090-191 = "...Я подумала, что должна контрастировать с президентом Химари, хотя сама не могу объяснить почему..."
90002090-192 = "Мидори... Думаю, в твоём подходе к дизайну есть проблема."
90002090-193 = "Президент. Пожалуйста, возьмите себя в руки. Не хотелось бы снова заталкивать вас обратно в комнату."
90002090-194 = "Угх..."
90002090-195 = "Для меня как дизайнера это был момент гордости!"
90002090-197 = "Мне не за что извиняться! Она отлично выглядит!"
90002090-198 = ""
90002090-200 = ""
90002090-202 = "Хорошо. Без комментариев."
90002090-203 = "Костюм Рио разработан для обеспечения исключительной защиты и радиоэлектронного противодействия."
90002090-204 = "В отличие от Химари, она будет обеспечивать техническую поддержку непосредственно на месте."
90002090-205 = "[s] «Рио? Разве это не опасно?»"
90002090-206 = "Это было наиболее рациональное решение."
90002090-207 = "Это Стальной континент, и мы должны быть готовы к технической войне прямо на ходу."
90002090-208 = "[s5] «Хорошо. Понятно.»\n[s6] «Береги себя, Рио.»"
90002090-211 = "Хорошо."
90002090-212 = "Предоставьте это мне, Сенсей."
90002090-213 = "А дальше..."
90002090-215 = ""
90002090-216 = ""
90002090-218 = ""
90002090-219 = "Юзу?"
90002090-220 = "...Выходи, Юзу. Ты довела нас сюда..."
90002090-221 = "Юзу? Ты в порядке?"
90002090-223 = ""
90002090-224 = ""
90002090-225 = ""
90002090-226 = ""
90002090-227 = ""
90002090-228 = ""
90002090-229 = "Угх..."
90002090-230 = "[s] «А? Твой наряд не похож на наряды близняшек...»"
90002090-231 = "Н-Ну..."
90002090-232 = "Я сама попросила."
90002090-233 = "Ага. Сначала я сказала, что нам стоит носить одинаковое..."
90002090-234 = "[s] «Но?»"
90002090-235 = "..."
90002090-236 = "Можно я не буду объяснять?"
90002090-237 = "Мы на Стальном континенте... Нас могут прослушивать, нужно быть осторожными."
90002090-238 = "Я не просто так попросила сделать костюм Юзу именно таким. Пожалуйста, поверьте."
90002090-239 = "[s] «Ты скрываешь причины от своих союзников?»"
90002090-240 = "...Прости. Знаю, что не должна."
90002090-241 = "Я правда вам всем доверяю... Но..."
90002090-242 = "[s] «Всё хорошо. Я поверю тебе, Рио.»"
90002090-243 = "П-Правда...?"
90002090-245 = "Вы правда так думаете, Сенсей?"
90002090-246 = "Вы правы. Всё это время у Рио были «благие намерения»..."
90002090-247 = "Ну... возможно..."
90002090-248 = "Да! Именно! Я согласна!"
90002090-249 = "Алиса?!"
90002090-250 = "Алиса?!"
90002090-251 = "Арис...???"
90002090-252 = ""
90002090-254 = ""
90002090-255 = ""
90002090-256 = "..."
90002090-257 = "Ты мне доверяешь... после всего этого?"
90002090-258 = "Да. Потому что я видела, как усердно ты работала над Аби-Эшух и пушкой Кей!"
90002090-259 = "Я верю, что ты хотела как лучше! Я это вижу!"
90002090-260 = "Вообще-то я тоже помогала, знаешь ли?!"
90002090-261 = "Это правда! Химари тоже помогала!"
90002090-262 = "*вздох*... Хорошо. Только на этот раз я закрою на это глаза, потому что ты такая милая, Арис."
90002090-263 = "Я добавила много сюрпризов. Думаю, вам понравится."
90002090-264 = ""
90002090-266 = ""
90002090-267 = ""
90002090-268 = "[ns] «Кстати, а пушка Кей?»"
90002090-269 = "Хм?"
90002090-270 = "А, да. Ну... что есть, то есть."
90002090-271 = "Остаться без оружия в Кивотосе... это всё равно что бегать голышом."
90002090-272 = "Она называется «Эарендиль: Сияющая Нова». Это энергетическое оружие, как и остальные."
90002090-273 = "Ух... Я это ценю... но этот наряд... правда мой?"
90002090-274 = "То есть, что я вообще делаю?"
90002090-275 = "[s7] «Юзу, ты отлично выглядишь.»\n[s8] «Нам... нужна ты, Юзу!»"
90002090-278 = "Ч-что?!"
90002090-279 = "Н-Ну..."
90002090-280 = "Как скажешь..."
90002090-281 = "Хорошо. Я... постараюсь."
90002090-282 = "[s] «Тогда давайте проведём финальную проверку!»"
90002090-283 = ""
90002090-286 = ""
90002090-289 = ""
90002090-292 = ""
90002090-293 = ""
90002090-294 = "Эм, Кей?"
90002090-295 = "Что такое, Рио?"
90002090-296 = "Я хотела кое-что тебе сказать."
90002090-297 = "Почему мне? Здесь ведь есть и Сенсей."
90002090-298 = "Что ж."
90002090-299 = "Чтобы проверить..."
90002090-300 = "Ты... можешь скрывать информацию от Стального континента и тех троих детей. Верно?"
90002090-301 = "..."
90002090-302 = "Очень проницательно. Как ты догадалась?"
90002090-303 = "Они не знали о тебе и Арис, пока мы не добрались до Тиферет."
90002090-304 = "И поэтому ты думаешь, что можешь рассказать мне о своём «скрытом козыре»?"
90002090-305 = "Хорошо. Я могу поставить файрвол, но у нас будет всего около тридцати секунд."
90002090-306 = "Хорошо. Этого должно хватить."
90002090-308 = ""
90002090-309 = "..."
90002090-310 = "..."
90002090-311 = "..."
90002090-312 = "Ч-Что такое?"
90002090-313 = "Рио. Ты..."
90002090-314 = "Х-Хм?"
90002090-315 = "Ты ведь не в своём уме, да...?"
90002090-316 = "Н-неужели...? Но... любой бы...?"
90002090-317 = "Нет. Это странно. Даже чересчур предусмотрительно."
90002090-318 = "...И всё же, учитывая ситуацию, конкретно сейчас это можно считать оправданным."
90002090-319 = "Но всё равно... Серьёзно. Боже мой."
90002090-320 = "Это настолько странно...?"
90002090-321 = "В любой другой ситуации я бы сказала, что да."
90002090-322 = "Но в этом случае..."
90002090-323 = "..."
90002090-324 = "Я благодарна тебе, Рио. Просто знай это."
90002090-325 = "В-вот как...?"
90002090-326 = "Но мне интересно насчёт костюма Юзу. С ней всё будет в порядке? То есть... это сработает?"
90002090-327 = "Да."
90002090-328 = "И насчёт второго этапа..."
90002090-329 = "Должно сработать. Я провела симуляции. Всё должно быть просто."
90002090-330 = "Конечно... я не хочу делать это с ней."
90002090-331 = "Ага. Скрытый козырь. Его никогда не хочется использовать."
90002090-332 = "[s] «Хм? Скрытый козырь?»"
90002090-333 = "С-Сенсей?!?!"
90002090-334 = "Это, эм, просто...!"
90002090-335 = "..."
90002090-336 = "Мы обсуждали вечеринку-сюрприз? Блюдо с «секретным ингредиентом»?"
90002090-337 = "[s] «Вечеринка-сюрприз?»"
90002090-338 = "Что ж."
90002090-339 = "Мы ведь победим, да? Ты это знаешь."
90002090-340 = "[s] «А. Так вот о чём вы говорили?»"
90002090-341 = "Да."
90002090-342 = "Правда, Рио?"
90002090-343 = "..."
90002090-344 = "Да. Именно."
90002090-345 = "Что происходит между Рио и Кей? Кажется, я слышала что-то про вечеринку-сюрприз?"
90002090-346 = "Ой... Я всё испортила? Мы отпразднуем, когда всё это закончится?"
90002090-347 = "Думаю, будет очень весело, Сенсей!"
90002090-348 = "[s9] «Ага! Я тоже!»\n[s10] «И... мы все будем целы и счастливы, да?»"
90002090-351 = "...Пожалуй."
90002090-352 = "А чтобы это гарантировать, нам нужен более подробный план."
90002090-353 = "Подробный план?"
90002090-354 = "Да. Я уверена, что Сенсей поможет нам одолеть каждого пророка и занять его территорию, но..."
90002090-355 = "Думаю, нам следует в первую очередь заняться Биной."
90002090-356 = "[s] «Бина? Почему?»"
90002090-357 = "Потому что мы знаем, где находится Бина."
90002090-358 = "[s] «Я знала, что ты справишься, Кей-Кей!»"
90002090-359 = "Не называйте меня Кей-Кей!"
90002090-360 = "Кхм... И есть ещё одна причина."
90002090-361 = "Как я уже говорила, Стальной континент — это единая сеть..."
90002090-362 = "У Бины есть... файрвол."
90002090-363 = "Отключив его, мы сможем взломать защиту системы Континента."
90002090-364 = "Думаю, его взлом раскроет местонахождение остальных пророков."
90002090-365 = "И... как сообщила мне Арис, если я не разберусь с этим файрволом..."
90002090-366 = "Стальной континент, скорее всего, продолжит расширяться."
90002090-367 = "[s] «П-Понятно?»"
90002090-368 = "Кей права. Нам нужны более высокие полномочия."
90002090-369 = "Бина должна дать нам уровень доступа, необходимый для взлома Стального континента."
90002090-370 = "[s] «Тогда, похоже, всё решено.»"
90002090-371 = "Да, Сенсей. У нас есть первая цель."
90002090-372 = "Самопровозглашённый «Созерцатель Неравенства»."
90002090-374 = "Третий пророк Декаграмматона, Бина."
90002090-376 = "Следующий эпизод;000, 00, 0"
