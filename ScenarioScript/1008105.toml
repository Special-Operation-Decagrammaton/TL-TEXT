[translation]
1008105-1 = "Отдых важен!"
1008105-4 = ""
1008105-5 = "Я пришла! Надеюсь, я не заставила тебя ждать, Сенсей."
1008105-6 = "[s] Добро пожаловать, Юкари. Подождёшь минутку? Мне ещё нужно кое-что подготовить."
1008105-7 = "Конечно! Я подожду прямо здесь!"
1008105-8 = "Не обращай внимания."
1008105-9 = ""
1008105-11 = ""
1008105-12 = ""
1008105-13 = "Хм-хм. ♪"
1008105-14 = "Чему же Сенсей научит меня сегодня?"
1008105-15 = "Хи-хи, я так взволнована."
1008105-16 = ""
1008105-20 = "Хм? Что это за звук?"
1008105-21 = ""
1008105-23 = ""
1008105-24 = ""
1008105-25 = ""
1008105-26 = ""
1008105-28 = "А..."
1008105-29 = "[s] Юкари? Что случилось?"
1008105-30 = "Сенсей... Дождь идёт..."
1008105-34 = "Мы немного подождали в офисе, но дождь так и не прекратился."
1008105-35 = "[s] По прогнозу дождь будет идти весь день. Вот досада."
1008105-36 = ""
1008105-38 = ""
1008105-39 = "Похоже, никаких приключений на улице сегодня не будет."
1008105-40 = "[s] Прости, Юкари. Надо было проверить прогноз."
1008105-41 = "Не переживай. Я ведь тоже не проверила."
1008105-42 = "А насчёт сегодняшнего дня... Я уже всё придумала."
1008105-43 = "Я составлю Сенсею компанию, пока он работает!"
1008105-44 = "[s] Ахаха... Это мило, Юкари. Но..."
1008105-45 = "Но что?"
1008105-46 = "Тебе кажется, будто ты потратил моё время зря, потому что мы не можем выйти?"
1008105-47 = "О, Сенсей."
1008105-48 = ""
1008105-50 = ""
1008105-51 = ""
1008105-52 = "Вот если ты будешь так думать, мне действительно станет грустно."
1008105-53 = "[s] «А?»"
1008105-54 = "Я пришла сегодня, потому что хотела провести время с тобой, Сенсей."
1008105-55 = ""
1008105-58 = "Нам не обязательно куда-то идти или делать что-то особенное."
1008105-59 = "Мне достаточно просто быть рядом с тобой в этом мире."
1008105-60 = "Каждый опыт, который ты мне показываешь, для меня новый."
1008105-61 = "И каждый день кажется особенным."
1008105-62 = "Если сегодня мы не можем выйти, будет завтра."
1008105-63 = "А если завтра тоже что-нибудь помешает, будем ждать следующего раза."
1008105-64 = "Какую историю Сенсей расскажет мне завтра? Какой удивительный урок преподаст на следующей неделе?"
1008105-65 = "Одно только ожидание заставляет каждый день сиять."
1008105-66 = "Так что если тебе когда-нибудь покажется, что ты зря потратил моё время..."
1008105-67 = "Не думай так! Ты всё видишь наоборот."
1008105-68 = "Каждое мгновение с тобой бесценно, Сенсей!"
1008105-69 = "[s] Спасибо тебе за эти слова, Юкари. Правда."
1008105-70 = "Ох! Я просто сказала то, что чувствую!"
1008105-71 = "Благодарить меня за такую очевидную вещь... Ты меня смущаешь!"
1008105-72 = "Хи-хи-хи. ♪"
1008105-73 = "[s] Я рад, что ты смогла сказать о своих настоящих чувствах."
1008105-74 = "Я тоже."
1008105-75 = "Спаси—"
1008105-76 = "Погоди... О моих настоящих чувствах?"
1008105-77 = ""
1008105-78 = "Каждое мгновение с тобой бесценно, Сенсей!"
1008105-79 = ""
1008105-80 = "..."
1008105-81 = "..."
1008105-82 = "(Погоди... Я-Я только что—?! )"
1008105-83 = "(Я так увлеклась моментом. Что я вообще сейчас сказала?!)"
1008105-84 = "[s] Я постараюсь соответствовать твоим ожиданиям, Юкари."
1008105-85 = "А... Да...!"
1008105-86 = "Ух ты... С-Сенсей точно умеет подобрать слова!"
1008105-87 = "О! Наверное, я съела слишком много вредной еды. Вот почему сердце будто сейчас выпрыгнет!"
1008105-88 = "[s] Юкари?"
1008105-89 = "Это был чудесный разговор, Сенсей."
1008105-91 = "Остаток дня мы с Юкари слушали дождь. Она почти не говорила и всё время избегала моего взгляда."
