[translation]
12170-1 = "Эпизод 17;То, что нужно защитить"
12170-2 = "Главные ворота академии Геенна"
12170-3 = "Вы хотите встречи с главой префектов? Думаете, можно просто заявиться сюда и поболтать с самой главой Префектурной команды Геенна?"
12170-4 = "Знаете что. Может быть, если встанете на четвереньки и оближете мне ноги..."
12170-5 = ""
12170-6 = ""
12170-8 = "И-и-и?!"
12170-9 = "Я даже договорить не успела. Серьёзно?"
12170-10 = "У вас вообще осталось хоть немного человеческого достоинства?"
12170-11 = "[s1] «Вовсе нет.»\n[s2] «Раньше боялся, но больше нет.»"
12170-12 = "И вы называете себя учителем! Вы ненормальный!"
12170-13 = "И вы называете себя учителем! Вы ненормальный!"
12170-14 = "Такого извращённого взрослого нужно...!"
12170-15 = "Что смешного?"
12170-16 = "Г-глава префектов?"
12170-17 = "Я видела немало людей, которые вставали на колени и молили ради себя... но впервые вижу учителя, который делает то же ради студента."
12170-18 = "Поднимите голову, Сенсей."
12170-19 = "Скажите. Что вам от меня нужно?"
12170-20 = "Погодите, глава префектов. Этот учитель не просто стоял на коленях, он пытался облизать мои..."
12170-21 = "..."
12170-22 = ""
12170-24 = "...?!"
12170-26 = "..."
12170-27 = "Понятно. Спасибо за объяснение, Хифуми."
12170-28 = "Если то, что говорит этот учитель, правда, мы не можем закрыть на это глаза."
12170-29 = "Сейчас мы занимаемся подготовкой договора, поэтому не можем позволить себе безрассудство."
12170-30 = "Однако очевидно, что присутствие PMC не принесёт нашим студентам ничего хорошего."
12170-31 = "Поэтому, думаю, в этот раз будет лучше сделать исключение."
12170-32 = "К-конечно, Нагиса."
12170-33 = "У класса буксируемой артиллерии ведь запланировано занятие на открытом воздухе, верно? С прошлого прошло немало времени, так что немного практической стрельбы не повредит."
12170-34 = "И погода сегодня прекрасная. Почти как пикник."
12170-35 = "Под буксируемой артиллерией... ты имеешь в виду L118?"
12170-36 = "А почему бы и нет? Это меньшее, что я могу сделать для такого образцового студента, как ты, Хифуми."
12170-37 = "Что посеешь, то и пожнёшь. И я знаю, что ты отплатишь мне, правда?"
12170-38 = "Нгх..."
12170-39 = ""
12170-40 = "Что ещё важнее, нам будет выгодно, если Сенсей Шале окажется у нас в долгу."
12170-43 = "*грохот* *грохот*"
12170-44 = "М-м. Почти готово."
12170-45 = "Ого, отличный ларёк!"
12170-46 = "Вообще-то Шиба Seki Ramen когда-то начинался именно с такого ларька."
12170-47 = "Э-это всё из-за меня... Как мне искупить свои грехи? Я не заслуживаю жить!"
12170-48 = "Кстати, я слышала, вы закрывались! Похоже, неправда. Рада видеть, что вы снова открылись, хозяин!"
12170-49 = "Это было бы невозможно, если бы кто-то не оставил перед моей дверью крупное пожертвование."
12170-50 = "..."
12170-51 = "Я уже собирался уйти на покой и жить спокойно, а теперь вы просите меня снова открыться? Ну и морока."
12170-52 = "..."
12170-55 = "Держите, четыре миски рамэна Шиба Seki. По 580 иен за каждую."
12170-56 = "Хм... Ты опять ошибся с порциями?"
12170-57 = "Ахаха! Просто ешьте!"
12170-58 = "Приятного аппетита!"
12170-60 = "Ах... Вкусно было. Ладно. Выдвигаемся?"
12170-61 = "Кстати, босс... Мы правда идём?"
12170-62 = "Сражаться с PMC — пустая трата времени. Нам нечего получить от участия в этой битве."
12170-63 = "...Хмф."
12170-64 = "Да ладно, Каёко. Ты до сих пор не понимаешь?"
12170-65 = "Чего?"
12170-66 = "По лицу Ару не видно? Оно прямо говорит: «Такой вкусный рамэн — вся награда, которая мне нужна!»"
12170-67 = "..."
12170-68 = "..."
12170-69 = "Т-теперь я понимаю, Ару! Шагнуть прямо в ад ради защиты любимого рамэна! Вот что сделали бы настоящие преступницы!"
12170-70 = "Я-я постараюсь стать настоящей преступницей! Я всех их разнесу!"
12170-71 = "Хмф. Ну, раз понимаешь."
12170-72 = "Ладно, все готовы последовать за мной хоть в самые глубины ада?"
12170-73 = "Хе-хе..."
12170-74 = ""
12170-75 = ""
12170-78 = "(Ч-что я вообще несу?!)"
12170-79 = "(Я же собиралась просто пойти домой после рамэна!)"
12170-80 = "(Я так сама себя накрутила, что теперь уже поздно отступать...!!?)"
12170-81 = "(А если просто сбежать...? Нет. Стоп...)"
12170-82 = "(Девчонки из Абидоса всё благодарили меня, говорили, что я вправила им мозги и что теперь смотрят на меня иначе...)"
12170-83 = "(Ч-что мне делать?! Мы ведь не с какими-то рыночными охранниками связываемся — это полноценная PMC...! Нам конец!)"
12170-84 = "(Что делать?! ЧТО МНЕ ДЕЛАТЬ?!)"
12170-85 = ""
12170-86 = "Ладно, Ару! Пошли!"
12170-87 = "Я-я последую за тобой хоть в ад и обратно!"
12170-88 = "*вздох* Для бизнеса это ничем хорошим не кончится."
12170-90 = "Вот так. Мы готовы."
12170-91 = "Ага-ага! Припасов полно, закусок тоже."
12170-92 = "Мы ещё и хорошо отдохнули и наелись!"
12170-93 = "Я также собрала все старые карты Пустыни Абидос и обновила их."
12170-94 = "По данным Сенсея, Хошино находится в центре Района 51 ЧВК Кайзер."
12170-95 = "Я проведу вас туда по самому безопасному маршруту!"
12170-96 = "[s] «Вперёд!»"
12170-97 = "Хорошо!"
12170-98 = "Начинаем операцию по спасению Хошино!"
12170-100 = "Верно."
12170-101 = "То, что сломано, можно восстановить."
12170-102 = "Главное — люди, которые приходят есть мой рамэн."
12170-103 = "Пока у этой раменной есть верные посетители, она никуда не денется. Не самая поэтичная формулировка, но именно так я чувствую."
12170-104 = ""
12170-105 = ""
12170-107 = ""
12170-108 = "Так что вперёд, Комиссия по взысканию долгов Абидоса!"
