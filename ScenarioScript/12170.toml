[translation]
12170-1 = "Episódio 17;O Que Quero Proteger"
12170-2 = "Academia Gehenna - Portão Principal"
12170-3 = "Hã? Quer ver a Chefe do Comitê Disciplinar? Você acha mesmo que pode encontrar a Chefe do Comitê Disciplinar de Gehenna assim tão fácil?"
12170-4 = "É, bom, se você se ajoelhar e lamber meu pé, quem sabe..."
12170-8 = "Hyan?!"
12170-9 = "Ei, eu nem terminei de falar... Nn! Ei?!"
12170-10 = "Você não tem orgulho como adulto ou hesitação como ser humano?!"
12170-11 = "[s1] \"Não tenho nada disso.\"\n[s2] \"Até tinha antes, mas...\""
12170-12 = "Você é maluco! Pervertido! Distorcido!"
12170-13 = "Você é maluco! Pervertido! Distorcido!"
12170-14 = "Para um adulto pervertido como você—"
12170-15 = "Parece que estão se divertindo, né?"
12170-16 = "C-Chefe...?"
12170-17 = "...Já vi muitas pessoas se ajoelhando pelos próprios desejos. Mas é a primeira vez que vejo um Sensei se ajoelhar por uma aluna."
12170-18 = "Por favor, levante o rosto, Sensei."
12170-19 = "Me diga, o que você quer que eu faça?"
12170-20 = "Não, é que, Chefe... o Sensei não estava se ajoelhando, ele estava, tipo, lambendo meu pé..."
12170-21 = "...?"
12170-24 = "!!!!???"
12170-26 = "..."
12170-27 = "Entendo, muito obrigada pela explicação. Compreendi perfeitamente o que você disse, Hifumi-san."
12170-28 = "Se o que esse Sensei disse for verdade, parece que não poderemos simplesmente ignorar isso."
12170-29 = "O tratado está quase aí e não podemos fazer movimentos precipitados agora, mas..."
12170-30 = "...No entanto, é certo que a existência dessa tal empresa PMC pode acabar causando uma má influência sobre as alunas da nossa escola."
12170-31 = "Desta vez, como uma pequena exceção, acho melhor pensarmos em alguma coisa."
12170-32 = "M-Muito obrigada, Nagisa-sama..."
12170-33 = "Vejamos... Se não me engano, havia justamente uma aula ao ar livre agendada para o uso de obuseiros rebocados."
12170-34 = "Já que é assim, que tal um pequeno piquenique?"
12170-35 = "Hum, obuseiro rebocado quer dizer... o L118...?"
12170-36 = "Sim. Sendo você, Hifumi-san, deixo tudo em suas mãos. Eu cuido dos detalhes."
12170-37 = "O amor é algo que vai e volta... Mal posso esperar pelo dia em que você retribuirá o meu amor, Hifumi-san. Fufu."
12170-38 = "A-Au..."
12170-40 = "Além disso, com certeza... não, sem dúvida alguma, será bom ter o \"Sensei da Schale\" nos devendo um favor..."
12170-43 = "(Com agilidade)"
12170-44 = "É, acho que já está bom assim."
12170-45 = "Uau, a barraquinha ficou bem legal também!"
12170-46 = "Na verdade, o Lámen Shibasaki começou como uma barraquinha. Dá até uma nostalgia."
12170-47 = "E-Eu... Por minha culpa a loja... E-Eu devo morrer? Posso morrer? Eu vou morrer!!!"
12170-48 = "Calma, calma. Mas mesmo assim, eu tinha ouvido que você ia parar, que bom que decidiu abrir a loja de novo~."
12170-49 = "Ah, é que um tempo atrás uma certa pessoa deixou dinheiro na frente da loja."
12170-50 = "..."
12170-51 = "Na verdade, eu estava pensando em me aposentar e descansar... mas se me pedem para continuar funcionando, não tem jeito."
12170-52 = "..."
12170-55 = "Quatro tigelas de Lámen Shibasaki de 580 ienes, saindo!"
12170-56 = "Acho que ele errou a quantidade de novo...?"
12170-57 = "Aha, deixa pra lá, tanto faz~."
12170-58 = "Bom apetite!"
12170-60 = "Aaah, que delícia. Bom, vamos indo?"
12170-61 = "...Presidente, a gente vai mesmo?"
12170-62 = "Essa luta não traz nenhuma vantagem pra nós. Enfrentar a PMC sem nem receber recompensa..."
12170-63 = "...Hmph."
12170-64 = "Kayoko-chan, olha bem pra ela."
12170-65 = "Hm?"
12170-66 = "Só de olhar pra cara da Aru-chan já dá pra ver, né? Ela tá quase dizendo \"Só de poder saborear esse lámen já é pagamento suficiente\"!"
12170-67 = "..."
12170-68 = "..."
12170-69 = "E-Entendi! Como esperado da Aru-sama! Sem dizer muitas palavras, marchando rumo ao inferno por uma tigela de lámen... isso é puro hard-boiled!"
12170-70 = "E-Eu também vou me esforçar para me tornar uma verdadeira fora da lei! Desta vez, vou apagar tudo direitinho!!"
12170-71 = "...Fufu."
12170-72 = "Pois bem, estão preparadas para me acompanhar até as profundezas do inferno?"
12170-73 = "Kufufu...!"
12170-78 = "(Acabei falandooooo!!!)"
12170-79 = "(Eu só ia comer lámen e voltar pra casa, mas me deixei levar e mandei uma frase toda estilosa—!!?)"
12170-80 = "(E-Esse clima já não permite mais dizer \"deixa pra lá\", né...?!)"
12170-81 = "(Será que dá pra fugir agora... Uuu... M-Mas...)"
12170-82 = "(Depois daquilo, o pessoal de Abydos veio me dizer \"obrigada\" e \"mudei minha opinião sobre você\" e tudo mais...)"
12170-83 = "(Além disso, o inimigo dessa vez nem é a Guarda do Mercado, é a PMC... O resultado é óbvio demais, não é?!)"
12170-84 = "(O-O que eu faço nessa situação?!)"
12170-86 = "Vamos logo, Aru-chan!"
12170-87 = "E-Eu a acompanharei até as profundezas do inferno!"
12170-88 = "Haah, parece que a gente só sai no prejuízo... mas não tem jeito, né."
12170-90 = "Nn, tudo pronto."
12170-91 = "Suprimentos garantidos, e coloquei um montão de lanchinhos também!"
12170-92 = "Também estou pronta! Dormi bem e estou de barriga cheia! Podem vir de qualquer lado!"
12170-93 = "Da minha parte, atualizei todos os mapas antigos de Abydos."
12170-94 = "De acordo com as informações que o Sensei nos passou, a Hoshino-senpai deve estar perto do centro do Setor 51 da Kaiser PMC."
12170-95 = "Vou guiar vocês pela rota mais segura, vamos!"
12170-96 = "[s] \"Então, vamos partir!\""
12170-97 = "Sim! Operação de Resgate da Hoshino-senpai...!"
12170-98 = "Começar!!"
12170-100 = "...É verdade, né."
12170-101 = "Eu tinha me esquecido... Se der tudo errado, é só recomeçar."
12170-102 = "O que importa são as pessoas que vêm comer lámen."
12170-103 = "Enquanto houver clientes, a loja não desaparece. É assim que funciona. Por isso..."
12170-108 = "...Vão lá, Comitê de Contramedidas."
