[translation]
10009035-2 = "[ns] «КАК она сбежала на этот раз?!»"
10009035-3 = "Она каким-то образом вскрыла наручники поданным ей оякодоном!#nНе спрашивайте меня, как это вообще возможно."
10009035-4 = "Начинаю понимать, почему её зовут Лисой Бедствий."
10009035-5 = "[s] «Это вообще не имеет смысла!»"
10009035-6 = "Но ничего. На ужин ей подадут лапшу соба.#nПосмотрим, как она откроет наручники этим."
10009035-7 = "[s] «И ЭТО ваш безупречный план?!»"
10009035-8 = "Не волнуйтесь! Я же сказала, всё будет нормально!"
10009035-9 = "Уверена, на этот раз они будут предельно осторожны."
10009035-10 = "Учиться на ошибках — вот что значит Полицейская академия Валькирии."
10009035-11 = "Ещё раз спасибо за помощь, Сенсей!"
10009035-12 = "Нам пора возвращаться к работе!"
10009035-13 = "[s] «Точно...»"
10009035-14 = ""
10009035-17 = ""
10009035-18 = "Снова патрулировать?"
10009035-19 = "[s] «(Пожалуйста, пусть на этот раз всё закончится...)»"
