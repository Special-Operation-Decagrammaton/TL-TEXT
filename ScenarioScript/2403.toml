[translation]
2403-1 = "Ночь коротка — беги, девочка. Часть 1"
2403-2 = "(Глубокая ночь, немного за час ночи...)"
2403-3 = ""
2403-5 = "М-м..."
2403-7 = "(Так... спааать хочется...)"
2403-9 = "(Что это был за звук...?)"
2403-10 = ""
2403-11 = ""
2403-13 = ""
2403-14 = "Ты всё подготовила, как я просила, Мимори?"
2403-15 = "Да. Тебе нужны были вот это и это, верно?"
2403-16 = "Ага. Этого хватит."
2403-17 = "Похоже, всё готово. Пойдём?"
2403-18 = "Да. Каэдэ может проснуться в любую минуту, так что поспешим."
2403-19 = ""
2403-20 = ""
2403-22 = "(Цубаки...? И Мимори?)"
2403-23 = "Куда это вы без меня? Хр-р-р..."
2403-26 = "А?!"
2403-27 = "Мне это приснилось?"
2403-28 = ""
2403-29 = ""
2403-31 = "Каэдэ, ты проснулась?"
2403-32 = "Я только начала готовить завтрак. Если уже встала — сначала умойся."
2403-33 = "А... Ммм..."
2403-34 = "*зевок*"
2403-35 = "Цубаки, тебя это тоже касается! Хватит клевать носом, готовься к завтраку."
2403-36 = "Ну же. Подъём, Каэдэ."
2403-37 = "*зевает* Да, мам..."
2403-38 = "Что?! Я-я тебе не мама...!"
2403-39 = "Хр-р..."
2403-40 = "Цубаки? Ты прямо здесь уснула? Уже утро! Нельзя снова засыпать!"
2403-41 = ""
2403-43 = "..."
2403-45 = "Момоёдо"
2403-46 = "Вот что сегодня случилось! Что думаете, Сенсей?!"
2403-47 = "[s1] «А я всё гадал, к чему это...»\n[s2] «Не знаю, хорошая ли это идея...»"
2403-48 = "Эй! Что это за разочаровывающая реакция?!"
2403-49 = "Эй! Что это за разочаровывающая реакция?!"
2403-50 = "Вы не понимаете, Сенсей? Это серьёзнейшая проблема! Очень-очень серьёзная!"
2403-51 = "*глоток* Настолько серьёзная?! А я и не знала!"
2403-52 = "[s] «Ну естественно, ведь ничего особо серьёзного и не было...»"
2403-53 = "Не-а. Именно это и важно!"
2403-54 = "То, что они тайком ушли ночью без меня, ужасно... Ну, это прям очень... э-э... п-по... по..."
2403-55 = "Подозрительно? Ты это хотела сказать?"
2403-56 = "Да! Вот это слово!"
2403-57 = "Подозрительно! Подозрительно в миллион раз! Разве нет?!"
2403-58 = "Почему они уходят только после того, как я засыпаю? Они точно что-то скрывают!"
2403-59 = "Ага... Может, они вдвоём состоят в каком-нибудь тайном обществе! Тут явно пахнет загадкой!"
2403-60 = "Умница, Пина! Я знала, что ты поймёшь. Держи наклейку за похвалу!"
2403-61 = "О-о-о. Спасибо, Каэдэ!"
2403-62 = "[s] «Не уверен я во всём этом.»"
2403-63 = "Вы слишком наивны, Сенсей! С такими способностями к дедукции великим детективом вам не стать!"
2403-64 = "Вы бы попали в настоящую беду, окажись на отрезанном бурей острове или в домике посреди глуши, когда мост разрушен!"
2403-65 = "[s] «Обычно такие вещи не происходят.»"
2403-66 = "В ЛЮБОМ СЛУЧАЕ! В отличие от вас, я крутая, милая и обладаю великолепными детективными навыками. Как перспективный сыщик с блестящим умом, я предполагаю...!"
2403-67 = ""
2403-69 = "Может, потише и лучше съешь клубничный анмицу, который заказала? Я слышу, как ты сама себя нахваливаешь, с другого конца заведения."
2403-70 = ""
2403-71 = "А эти два — вам, Каэдэ и Сенсей."
2403-72 = "Спасибо, Шизуко!"
2403-73 = "Ладно, признаю: клубничный анмицу выглядит вкусно!"
2403-74 = "[s] «Спасибо, Шизуко.»"
2403-75 = "Я просто делаю свою работу. Сейчас не слишком людно, так что есть немного времени поболтать."
2403-76 = "Но вообще-то вам всем стоит послушать Сенсея и перестать валять дурака."
2403-77 = "Мы не валяем дурака! Кроме того, выслушивать проблемы клиентов — одна из обязанностей Момоёдо!"
2403-79 = "Я прямо как официантка из чайного домика в фильмах про мстителей!"
2403-80 = "Вот именно! Нужно быть добрее к своим клиентам! *ням* *ням*"
2403-81 = "Сказала нежеланная гостья... Ладно, признаю, это было немного непрофессионально."
2403-82 = "Давайте начну сначала."
2403-83 = "Кхм. Ваш клубничный анмицу, господин! А теперь скажу волшебные слова, чтобы он стал ещё вкуснее!"
2403-84 = "Фокус-покус, стань ещё вкуснее..."
2403-85 = "Не надо. Я и так доволен."
2403-86 = "Хм?"
2403-87 = "Разве это не одна из тех бесполезных услуг, которые заведения придумывают сами, чтобы потом брать с клиентов больше денег?"
2403-88 = "Я всё про это знаю! На такие очевидные уловки я не попадусь!"
2403-89 = "П-Погоди! Ты на что намекаешь про нас, официанток?!"
2403-90 = "[s] «А я ведь всё это время доверял сфере обслуживания...»"
2403-91 = "Д-Даже вы, Сенсей?!"
2403-92 = "В общем, вернёмся к делу. Очевидно, мои старшие что-то от меня скрывают. *ням*"
2403-93 = ""
2403-94 = "Так вот. *ням*"
2403-95 = "Может, дождёшься, пока доешь?"
2403-96 = ""
2403-97 = "*ням* *глоток* А-а-а... Так вот что я хочу сказать!"
2403-98 = "Чем бы они ни занимались без меня... это явно связано с какой-то секретной миссией Клуба внутренней дисциплины, в которой мне нельзя участвовать."
2403-99 = "Секретная миссия? С чего ты взяла?"
2403-100 = "Такое происходит уже не в первый раз."
2403-101 = "Это было и вчера, и три дня назад... и на прошлой неделе тоже. Вообще-то так бывает минимум пять раз в неделю."
2403-102 = "То есть, по сути, каждый день..."
2403-103 = "Что они от меня скрывают? Почему тайком уходят ночью без меня? А, Сенсей?"
2403-104 = "[s] «Не знаю.»"
2403-105 = "Поняла! Какая же я умная. Вариант может быть только один."
2403-106 = "Это то, чем по ночам занимается каждая утончённая женщина... Они ходят тусоваться!"
2403-107 = "Настоящие леди ведь каждую ночь так делают, да? А меня не берут, потому что я ещё не достигла высот женственности, так?!"
2403-108 = "Что-то подсказывает мне, что это вообще не похоже на правду."
2403-109 = "А откуда президент Фестивального отдела это знает? Ты тоже тайком куда-то ходишь по ночам?!"
2403-110 = "Это правда, президент?!"
2403-111 = "Ночные вылазки президента..."
2403-112 = "Наверняка именно тогда ты, хозяйка Момоёдо, каждую ночь очищаешь улицы Хяккияко от мерзавцев и злодеев! Да?! Как круто!"
2403-113 = "[s] «У Шизуко и правда неплохой правый хук...»"
2403-114 = "Ничего подобного! И вообще, люди ночью обычно занимаются не этим. Скорее, ну знаешь..."
2403-115 = "Но если не этим, тогда почему они оставляют меня позади?"
2403-116 = "Потому что я неопытная младшеклассница? Наверняка ведь так, да?"
2403-117 = "Неужели старшие считают меня бесполезным ребёнком?"
2403-118 = "Каэдэ..."
2403-119 = "*вздох* Если тебя это так беспокоит, почему бы просто не спросить их напрямую?"
2403-120 = "Хм?"
2403-121 = "Если будешь вечно только переживать, ничего не решится."
2403-122 = "Так ты хотя бы сможешь прояснить все недоразумения."
2403-123 = "Выяснить... самой?"
2403-124 = "Ага. Вот, держи рамунэ с маття. Выпей и иди домой, вместо того чтобы сидеть здесь и киснуть."
2403-125 = "Я так и знала, Шизуко! Ты делаешь вид, будто тебе всё равно, но на самом деле отлично заботишься о людях. Именно этого я и ожидала от идола Момоёдо!"
2403-126 = "[s] «Отличный ассист, Шизуко!»"
2403-127 = "Н-Ничего подобного! Я сделала это только потому, что если ты продолжишь тут унывать, испортишь настроение остальным клиентам."
2403-128 = "Выяснить самой. Это..."
2403-129 = "...отличная идея! Я знала, что на президента Фестивального отдела можно рассчитывать! Может, даже поставлю тебе зачёт. За это полагается наклейка-похвала!"
2403-130 = "А я должна этому радоваться? Что ещё за наклейка-похвала?"
2403-131 = "О, это я сама придумала! Каждый, кто зарабатывает балл, получает одну. А если соберёшь достаточно наклеек, можешь получить награду!"
2403-132 = "Ты сказала... награду? Какую?"
2403-133 = "Если соберёшь десять наклеек, я спою для тебя на день рождения!"
2403-134 = "Вот же чудачка! Кому такое вообще нужно?!"
2403-135 = "*вздох* Ладно, в любом случае твоя проблема решена, да? Вернёшься и спросишь их, почему..."
2403-136 = "Точно. Поэтому сегодня ночью я прослежу за ними и сама всё выясню!"
2403-137 = "Погоди, как ты вообще пришла к такому выводу?!"
2403-138 = "Это единственный способ самой докопаться до истины!"
2403-139 = "Вперёд, Каэдэ! Я полностью тебя поддерживаю!"
2403-140 = "Вы ведь тоже поможете, Сенсей? Не откажете в просьбе такому очаровательному студенту, правда...?"
2403-141 = "[s] «Д-Да, конечно...»"
2403-142 = "Тогда начинаем прямо сейчас. А, и спасибо за анмицу!"
2403-143 = ""
2403-145 = "*вздох* Эта девочка хоть минуту может посидеть спокойно? Ах да, кстати..."
2403-146 = "Спасибо, что оплатили счёт, Сенсей. ♥"
2403-147 = "[s] «Я так и знал, что этим кончится!»"
2403-150 = "Следующей ночью..."
2403-151 = ""
2403-152 = ""
2403-153 = ""
2403-154 = "Эм..."
2403-155 = "*совершенно не спит*!"
2403-156 = "Цубаки и Мимори уже должны были уйти."
2403-157 = "Значит, мой шанс!"
2403-158 = ""
2403-160 = "Сенсей, сюда. Сюда!"
2403-161 = "[s] «Привет, Каэдэ. Всё-таки не уснула.»"
2403-162 = "Думали, я нарушу обещание? Я не какой-то ребёнок. Я достойная леди, стремящаяся стать великолепной леди."
2403-163 = "Сегодня я тайком выпила пять чашек чёрного кофе, чтобы не уснуть этой ночью."
2403-164 = "Она всегда запрещает мне пить кофе, но это чрезвычайная ситуация!"
2403-165 = "Я подготовилась лучше некуда! Какая же я умная!"
2403-166 = "*зевок*"
2403-167 = "[s] «У меня плохое предчувствие...»"
2403-168 = "А? В смысле?"
2403-169 = "Ах! У нас нет на это времени, Сенсей!"
2403-170 = ""
2403-171 = ""
2403-172 = "Надо найти их, пока не стало слишком поздно. Погоня начинается!"
