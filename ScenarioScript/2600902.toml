[translation]
2600902-1 = "Новый дизайн персонажа"
2600902-2 = "Клубная комната Отдела разработки игр"
2600902-3 = "Мне нужно было заехать в Миллениум по делам Шале, и я решил заодно заглянуть в Клуб разработки игр."
2600902-4 = ""
2600902-7 = "Но когда я пришёл в комнату клуба, там никого не было..."
2600902-8 = ""
2600902-11 = "[ns] Открыть дверцу шкафа, чтобы повесить пальто."
2600902-14 = ""
2600902-15 = ""
2600902-16 = "А-а-а-а-а!"
2600902-17 = "С-С-Сенсей?! Что вы здесь делаете?"
2600902-18 = "[ns1] «Прости! Я не понял, что ты там.»\n[ns2] «Я принёс вкусняшки!»"
2600902-22 = "[ns] «Но... почему на тебе форма горничной?»"
2600902-23 = "А, эм... Н-не поймите неправильно..."
2600902-24 = "Н-нет, дело не в этом. Я надела её по собственной воле!"
2600902-25 = "Ну, то есть не то чтобы я хотела её надевать, но..."
2600902-26 = "П-просто дайте мне объяснить!"
2600902-28 = "Когда мне удалось немного успокоить Юзу, я выслушал её объяснение."
2600902-30 = "[ns] «Референс для дизайна персонажа?»"
2600902-31 = "Ага. Эм..."
2600902-32 = "Я хотела добавить в нашу текущую игру персонажа-горничную."
2600902-33 = "Но костюмы горничных очень сложные. У них строгая конструкция и много украшений. Мидори было трудно с этим разобраться."
2600902-34 = "Поэтому... я надела костюм горничной, чтобы попозировать ей."
2600902-35 = "[s] «Понятно. Но почему ты сидела в шкафу?»"
2600902-36 = "Эм... Мидори забыла кое-что в общежитии."
2600902-37 = "А я-я не могла просто сидеть одна в комнате клуба в костюме горничной!"
2600902-38 = "А вдруг бы сюда зашёл другой студент и увидел меня?"
2600902-39 = "Надо мной бы точно стали смеяться..."
2600902-40 = "[s] «Разве нельзя просто сказать, что ты позируешь как модель?»"
2600902-41 = "...Я? Модель?"
2600902-42 = "Кто вообще в это поверит?"
2600902-43 = "Я ведь не такая стильная и уверенная в себе, как участницы C&C..."
2600902-44 = "[s3] «Юзу. Ты милая, что бы ни надела.»\n[s4] «Юзу, твой костюм горничной — лучший!»"
2600902-47 = "А? А? Ч-что?!"
2600902-48 = "[s5] «Не переживай так сильно о том, что думают другие.»\n[s6] «Юзу, ты можешь быть кем захочешь!»"
2600902-51 = ""
2600902-53 = ""
2600902-55 = ""
2600902-57 = "...Ага."
2600902-58 = "Вы правы! Если я должна стать референсом для персонажа-горничной в игре, нельзя подходить к этому с такими сомнениями."
2600902-59 = "Так будет неправильно! Я не могу так поступить с фанатами, которые ждут игру!"
2600902-60 = "Спасибо, Сенсей."
2600902-61 = "Ваши слова... действительно придали мне смелости."
2600902-62 = "...Но мне всё ещё немного неловко. Думаю, я переоденусь обратно в школьную форму, прежде чем меня увидят другие студенты."
2600902-63 = ""
2600902-65 = ""
2600902-68 = "Президент Юзу? Вы здесь?"
2600902-69 = "Мне нужна ваша подтверждающая подпись в официальном журнале за этот квартал для президентской конференции."
2600902-70 = ""
2600902-72 = ""
2600902-74 = "А! А-а-а..."
2600902-75 = "Хм? Костюм горничной? И Сенсей из Шале тоже здесь..."
2600902-76 = "Ну! Понимаете! Просто!"
2600902-77 = "Простите! Простите. Похоже, я помешала..."
2600902-78 = "Нет! Этому есть объяснение! Подождите!"
2600902-80 = "...Хорошего дня! Пока!"
2600902-81 = ""
2600902-82 = "Я... я... я не могу..."
2600902-84 = "Юзу снова забилась в шкаф. Потребовалось время, чтобы успокоить её настолько, чтобы она показала лицо."
