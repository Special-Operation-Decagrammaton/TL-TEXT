80000045-28 = "[s] «Эй, Мидори. Я здесь.»"
80000045-29 = "С-Сенсей?! Давно вы здесь?!"
80000045-30 = "П-Простите! Я знаю, как невежливо опаздывать после того, как сама попросила встретиться так рано..."
80000045-31 = "[s1] «Всё хорошо. Я здесь совсем недолго.»\n[s2] «Ничего страшного. Так о чём ты хотела поговорить?»"
80000045-32 = "О, эм... Я позвала вас потому что..."
80000045-33 = "О, эм... Я позвала вас потому что..."
80000045-34 = "(С-Спокойно. Я столько раз репетировала это с Момои!#nНужно просто глубоко вдохнуть и сделать!)"
80000045-35 = "*глоток* *вдох* *выдох* Ты сможешь..."
80000045-36 = "*вдох*... *зевок*..."
80000045-37 = ""
80000045-40 = ""
80000045-41 = "П-Почему я сейчас зеваю?! А, потому что я почти не спала ночью..."
80000045-42 = "[s] «Не спала? Опять всю ночь играла?»"
80000045-43 = "Н-Нет! С чего бы мне делать это перед сегодняшним днём?!"
80000045-44 = "Это ведь я сама назначила встречу.#nПоследнее, что я бы сделала, — опоздала из-за игр всю ночь..."
80000045-45 = "Это была бы катастрофа! Как вы могли обо мне такое подумать?!"
80000045-46 = "[s] «Я шутил. Уверен, у тебя была хорошая причина.»"
80000045-47 = "Правда...?"
80000045-48 = "[s] «Конечно. Полегчало?»"
80000045-49 = "Вы всегда такой, Сенсей..."
80000045-50 = "Но да. Полегчало."
80000045-51 = "В общем, настоящая причина, почему я почти не спала..."
80000045-52 = "Потому что..."
80000045-53 = "Угх. Так трудно сказать..."
80000045-54 = "Нет! Я не могу сдаться! Иначе весь мой план пойдёт насмарку!"
80000045-55 = "[s] «Что, прости?»"
80000045-56 = "Я попросила вас встретиться утром, потому что хотела дать вот это."
80000045-57 = ""
80000045-59 = ""
80000045-60 = "[ns] «Это то, о чём я думаю?»"
80000045-61 = "Я сама приготовила этот шоколад. Было много проб и ошибок,#nпоэтому я и не спала почти всю ночь."
80000045-62 = "Он должен был получиться самым лучшим, потому что..."
80000045-63 = "...я хотела сегодня сделать первый ход."
