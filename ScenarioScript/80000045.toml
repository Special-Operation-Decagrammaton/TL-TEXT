[translation]
80000045-1 = "Я хочу быть первой, Сенсей"
80000045-2 = "За день до Дня святого Валентина мне позвонила Мидори."
80000045-3 = "Эм, Сенсей. У вас завтра утром есть планы?"
80000045-4 = "Н-Нет?"
80000045-5 = "Т-Тогда... если вы не против, можете встретиться со мной завтра в 7 утра?!"
80000045-6 = "[s] «Конечно, но почему так рано?»"
80000045-7 = "Я-Я объясню завтра!"
80000045-8 = "Тогда до встречи!"
80000045-9 = ""
80000045-13 = "Утро Дня святого Валентина."
80000045-14 = ""
80000045-18 = "[ns] «Вот место. Интересно, где Мидори.»"
80000045-19 = ""
80000045-22 = "Ожидая Мидори, я осматривался вокруг и наслаждался прохладным утренним воздухом."
80000045-23 = ""
80000045-26 = "*тяжело дышит* Собираться заняло гораздо больше времени, чем я думала!"
