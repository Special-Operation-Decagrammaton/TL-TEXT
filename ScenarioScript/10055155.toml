[translation]
10055155-2 = ""
10055155-3 = "Эх, мы проигра-а-ли..."
10055155-4 = ""
10055155-6 = ""
10055155-8 = "Мы ещё не побеждены. Давайте ещё раз."
10055155-9 = "Сколько энергии. Не угнаться мне, старушке, за вами, молодыми."
10055155-10 = "Мы вообще-то РОВЕСНИКИ!"
10055155-11 = "И чего ТЫ валяешься на земле? Ты даже не сражалась! А ну вставай!"
10055155-12 = "Ахаха... Широко, может, немного передохнём?"
10055155-13 = "Аяне...?"
10055155-14 = "Почему ты меня предаёшь...? Неужели... контроль над разумом...?"
10055155-15 = "У Широко такое богатое воображение. Такая милая. ☆"
10055155-16 = "По-моему, Аяне права. Нашему малышу нужно передохнуть перед следующей схваткой."
10055155-17 = "«Следующей схваткой»...? Это что, уже целый турнир?"
10055155-18 = "Постой, вы не знали? Раз с вами Сенсей, мы подумали, что..."
10055155-19 = "То есть, погодите... Ух!"
10055155-20 = "Мне так неловко! Мы просто подошли и вызвали вас на... что бы это ни было!"
10055155-21 = "Хм, я вас прощаю."
10055155-22 = "С чего она такая довольная? Всю работу сделал МОЙ краб..."
10055155-23 = "Но если вы здесь и ждали поединка... Тут что, какой-то фестиваль? Этот остров не необитаемый?"
10055155-24 = "Хе, как ни больно проигравшим, придётся нам вам всё рассказать."
10055155-25 = "На этом острове проходит жестокая королевская битва за звание сильнейшего ракообразного в мире..."
10055155-26 = "«Всемирный турнир боевых искусств крабов-отшельников»!"
10055155-27 = "...Какое дурацкое название."
10055155-28 = "Какое ясное и понятное название!"
10055155-29 = "Правила просты. У каждой команды есть звёзды, и победитель забирает одну звезду у проигравшего."
10055155-30 = "Первая команда, собравшая пять звёзд, побеждает в турнире."
10055155-31 = "И это ещё не всё! Победившего краба коронуют как сильнейшего в мире. Но главное..."
10055155-32 = "Победитель получит «Билет желания королевы», исполняющий ЛЮБОЕ желание!"
10055155-33 = "Мы выиграем турнир и одним махом погасим все долги!"
10055155-34 = "Что?! Серьёзно?!"
10055155-35 = "Разумеется, нет. В лучшем случае они преувеличивают."
10055155-36 = "Ахаха... Если честно, нам самим всё это кажется подозрительным."
10055155-37 = "...Кстати, как мы вообще в это ввязались?"
10055155-38 = "Аяне, присмотри, пожалуйста, за нашим маленьким речным раком."
10055155-39 = "А, конечно! Сейчас подойду!"
10055155-40 = ""
10055155-42 = ""
10055155-43 = "..."
10055155-44 = "Приплыть ИМЕННО на этот остров, оказаться прямо перед Тайгершаркмару и тут же узнать о турнире..."
10055155-45 = "Это может быть лишь..."
10055155-46 = "...божественное провидение! Сами небеса даровали нам этот шанс!"
10055155-47 = "Слушайте все! С этой минуты Общество Пандемониума бросает все силы на победу во «Всемирном турнире боевых искусств крабов-отшельников»!"
10055155-48 = "Ура! Мы победим!"
10055155-49 = "Да, следуйте за мной! Вперёд, к победе!"
