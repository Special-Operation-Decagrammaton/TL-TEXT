[translation]
10055155-3 = "I've been defeated..."
10055155-8 = "It's not over yet. Let's have another match."
10055155-9 = "Shiroko-chan, you're so energetic~ Old man here can't keep up with you anymore~"
10055155-10 = "No, I told you, we're not that far apart in age!"
10055155-11 = "Besides, Ayane-chan was the one who fought, so why is the senior the one collapsed on the ground!"
10055155-12 = "Ahaha... Shiroko-senpai. Let's take a break for now."
10055155-13 = "Ayane...?"
10055155-14 = "Why are you saying that? Could it be mind control...?"
10055155-15 = "That's not it, Shiroko-chan☆"
10055155-16 = "Ayane-chan is just trying to let Mr. Crayfish rest in preparation for the next match!"
10055155-17 = "Next match...? Is this a tournament?"
10055155-18 = "Eh? You didn't know? #nSince you were with Sensei, I assumed you were aware..."
10055155-19 = "Does that mean... Ahhh!?"
10055155-20 = "I'm so sorry! I challenged people who didn't know anything to a match!"
10055155-21 = "Hmph. I, Makoto-sama, shall forgive you with my magnanimous heart."
10055155-22 = "Actually, it was me and the hermit crab who did the hard work."
10055155-23 = "Anyway, what's this about a tournament? #nWasn't this just an uninhabited island?"
10055155-24 = "Hmm... well, since I lost, I guess I'll tell you."
10055155-25 = "What's happening on this island right now is... #nThe most terrifying and wicked battle royale to decide the strongest crustacean on Earth!"
10055155-26 = "It's called the \"Tenkaichi Crab Martial Arts Tournament\"!"
10055155-27 = "...That's a lame name!"
10055155-28 = "Oh! What an intuitive and humorous name!"
10055155-29 = "The rules are simple. Each participant starts with a star, and you bet them in matches. #nIf you win the match, you can take the opponent's star."
10055155-30 = "By repeating these matches... the first team to collect 5 stars wins."
10055155-31 = "And guess what! The winner gets the honor of being the world's strongest crab, and..."
10055155-32 = "They get the \"Queen's Anything Ticket\" that grants any wish you want!"
10055155-33 = "I'll win this tournament and pay off all of our school's debt!"
10055155-34 = "Wait, is that true!?"
10055155-35 = "No, that's a lie."
10055155-36 = "Ahaha... we're suspicious of it too, but..."
10055155-37 = "Wait? Why did we even participate in this tournament in the first place...?"
10055155-38 = "Ayane-chan, I need you to help me treat Mr. Crayfish~"
10055155-39 = "Ah, yes! I'm coming right away!"
10055155-43 = "..."
10055155-44 = "To drift to an island, encounter the Tiger Shark Maru by chance, and stumble upon a tournament like this..."
10055155-45 = "This is truly..."
10055155-46 = "It can only be divine providence! Heaven has granted us a chance!"
10055155-47 = "Everyone, listen well! From this moment on, Pandemonium Society will use all our might to win the \"Tenkaichi Crab Martial Arts Tournament\"!"
10055155-48 = "All-out war!"
10055155-49 = "Our goal is the summit, and nothing else! Now, follow me, Makoto-sama――!!"