[translation]
10052095-2 = "Молчание Хокмы подтверждено."
10052095-3 = "И всё ещё жарко... даже жарче, чем раньше."
10052095-4 = "[s1] «Пока что, пожалуйста, оставайся одетой.»\n[s2] «Я не хочу, чтобы ты пострадала.»"
10052095-7 = "...Эм, Эйми? Прости, но у меня просьба."
10052095-8 = "Хм? Говори. Только быстро."
10052095-9 = "Эм, в этом как раз и проблема."
10052095-10 = "Температура и давление здесь отличаются от предыдущих областей, поэтому извлечение ядра займёт немного больше времени, чем обычно..."
10052095-11 = ""
10052095-13 = ""
10052095-16 = "[ns] «Э-Эйми?!»"
10052095-17 = "М-мне правда очень жаль, Эйми!"
10052095-18 = "Нет... Кей... Сенсей... Вы не виноваты."
10052095-19 = "Мир... само существование... вот кто виноват..."
10052095-20 = "...Она начинает говорить как те сёстры."
