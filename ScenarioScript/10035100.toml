[translation]
10035100-1 = "Эпизод 10;Я справилась как спасатель!"
10035100-2 = ""
10035100-3 = "А? Сенсей, что вы здесь делаете?"
10035100-4 = "[s1] «Эй, Чихиро, я как раз хотел спросить тебя о том же.»\n[s2] «Почему вы в аквапарке без купальников?»"
10035100-7 = "Мы здесь из-за одного нарушителя."
10035100-8 = ""
10035100-10 = ""
10035100-12 = "Здравствуйте, Сенсей. Неожиданная встреча."
10035100-13 = "Жаль только, обстоятельства могли быть получше."
10035100-15 = "Эта форма... Вы студенты «Миллениума»?"
10035100-16 = "Но важнее другое... какой нарушитель?"
10035100-17 = "Я примерно догадываюсь."
10035100-18 = ""
10035100-20 = ""
10035100-22 = ""
10035100-23 = "Я Огата Канна, директор Бюро общественного порядка Полицейской школы «Валькирия»."
10035100-24 = "Случайно Мехагатор никак не связан с Научной школой «Миллениум»?"
10035100-26 = "*вздыхает*... Да, связан."
10035100-27 = "Утаха, расскажи им."
10035100-28 = "Эм... Да, в общем, всё примерно так, как вы думаете."
10035100-29 = "Этого аллигатора создал наш Инженерный департамент «Миллениума»."
10035100-30 = ""
10035100-33 = ""
10035100-35 = ""
10035100-36 = "Зачем вообще создавать такую штуку?"
10035100-37 = "Он устроил здесь панику!"
10035100-39 = "И нам всем за это стыдно."
10035100-40 = "Но уточню: Инженерный департамент его собрал. Проектировали его не мы."
10035100-41 = "Разве это не почти одно и то же?"
10035100-43 = "Совсем нет."
10035100-44 = ""
10035100-47 = ""
10035100-49 = "Короче говоря, его создавали как водную игрушку, но параллельно мы разрабатывали инструмент для сноса зданий, и их поведенческие алгоритмы перемешались."
10035100-50 = "Так вот почему он атаковал аттракционы, а не людей..."
10035100-51 = ""
10035100-53 = ""
10035100-54 = ""
10035100-55 = "Погодите! Если это «водная игрушка», зачем ей оружие?"
10035100-56 = "Меня не обманешь!"
10035100-57 = "Вы поставили на неё огнемёт и ракетную установку!"
10035100-58 = ""
10035100-61 = ""
10035100-62 = "Это было... для эффектности."
10035100-63 = ""
10035100-66 = ""
10035100-67 = "Что?"
10035100-68 = "В общем, к тому моменту, когда мы обнаружили проблему, он уже сбежал в море..."
10035100-69 = "Так что поймать его мы не успели и не знали, куда он делся..."
10035100-70 = "...пока Чихиро не вспомнила, что журналы активности сохраняются на сервере. Оттуда она помогла нам его отследить."
10035100-71 = "Хотя из всех возможных мест я бы ни за что не подумала, что он окажется здесь."
10035100-72 = "*вздыхает* Инженерный департамент полностью возьмёт на себя ответственность за ущерб."
10035100-73 = "Пожалуйста, примите наши искренние извинения."
10035100-75 = "Вот видишь?!"
10035100-76 = "Я же говорила, это не мы!"
10035100-77 = "Не бросайтесь обвинениями без доказательств!"
10035100-78 = "Вы БЫЛИ самыми вероятными подозреваемыми."
10035100-79 = "Да заткнись! Ладно, раз уж ВЫ теперь здесь, может, разберёмся."
10035100-80 = "А, конечно!"
10035100-82 = "Разобраться с чем?"
10035100-83 = "Когда аллигатор увидел директора Канну, он начал вести себя странно."
10035100-84 = "То есть это не так уж важно, но всем любопытно."
10035100-85 = "Вёл себя странно, говоришь?"
10035100-86 = "Интересно. Дайте-ка я посмотрю внимательнее."
10035100-87 = ""
10035100-89 = ""
10035100-96 = "Отключаю настройки безопасности..."
10035100-97 = ""
10035100-99 = ""
10035100-100 = "И готово."
10035100-101 = "Отличная работа, Чихиро."
10035100-102 = ""
10035100-104 = ""
10035100-105 = "Так, вот локальный журнал активности. Здесь должны быть все самые свежие данные."
10035100-106 = "А странное поведение... А, вот оно."
10035100-107 = ""
10035100-109 = ""
10035100-110 = "Код ошибки 4885: активирован биомиметический алгоритм инстинкта жертвы. Запуск протоколов уклонения."
10035100-111 = "Биомиметический чего?"
10035100-112 = "Можно как-нибудь попроще?"
10035100-113 = "Если коротко..."
10035100-114 = ""
10035100-116 = ""
10035100-117 = "...аллигатор распознал противника как превосходящего хищника."
10035100-118 = "Поэтому и сменил поведение."
10035100-119 = "...Ты уверена, что он испугался человека?"
10035100-120 = ""
10035100-122 = ""
10035100-124 = ""
10035100-125 = "[ns] «...»"
10035100-126 = "Т-Так вообще возможно?!"
10035100-128 = "Если не считать протоколы сноса, Мехагатор должен был вести себя как настоящий аллигатор."
10035100-129 = "Если настоящий аллигатор увидит более сильного хищника, он убежит."
10035100-130 = "Но директор человек."
10035100-131 = "Да, она суровая, но всё равно это не имеет смысла."
10035100-132 = ""
10035100-134 = ""
10035100-136 = ""
10035100-137 = "...Хи-хи."
10035100-138 = "Директор?"
10035100-139 = "Ха-ха-ха..."
10035100-140 = "В этом есть смысл. Я поняла."
10035100-141 = "Директор, вы в порядке?"
10035100-142 = "Неуместный вопрос, сотрудница. Главное, я прекрасно знаю, какое впечатление произвожу."
10035100-143 = "В этом очень конкретном случае это оказалось плюсом, но если в следующий раз меня захотят поставить перед публикой, придётся отказаться."
10035100-144 = "Думаю, гражданам и так хватило страхов за последнее время. Ха-ха."
10035100-145 = ""
10035100-148 = ""
10035100-150 = "Эй, не надо меня жалеть. У каждого в жизни есть места, для которых он подходит, и места, для которых нет."
10035100-151 = "Мне куда привычнее в комнате для допросов, чем в аквапарке."
10035100-152 = "И, если честно, приятно наконец это принять."
10035100-153 = "..."
10035100-154 = "По твоему лицу не скажешь, что тебе ТАК уж полегчало, Дикая Гончая."
10035100-155 = "А ты помолчи."
10035100-156 = "Что ж, нам всем ещё предстоит уборка."
10035100-157 = "Я начну собирать обломки. Кирино и Фубуки, если вы займётесь людьми—"
10035100-158 = ""
10035100-162 = "Извините..."
10035100-163 = ""
10035100-165 = ""
10035100-167 = "А?"
10035100-168 = "Разве это не тот ребёнок, которого директор спасла? Эй, малыш. Тебе что-то нужно?"
10035100-169 = ""
10035100-172 = "Госпожа спасатель..."
10035100-173 = ""
10035100-175 = "О?"
10035100-176 = "Я?"
10035100-177 = "(кивает, кивает)"
10035100-178 = "Что такое? Ты пострадал из-за меня?"
10035100-179 = "(мотает головой)"
10035100-180 = "Тогда...?"
10035100-181 = "Эм..."
10035100-182 = ""
10035100-186 = "Спасибо, что спасли меня!"
10035100-187 = ""
10035100-189 = ""
10035100-190 = "Я-Я так испугался аллигатора..."
10035100-191 = "Я просто застыл на месте..."
10035100-192 = "А потом вы прибежали и подняли меня! Поэтому... спасибо! Огромное спасибо!"
10035100-193 = ""
10035100-195 = ""
10035100-196 = "Ну..."
10035100-197 = ""
10035100-199 = ""
10035100-200 = ""
10035100-201 = "...Я просто рада, что ты в порядке."
10035100-202 = "Всё закончилось хорошо."
10035100-203 = ""
10035100-210 = ""
10035100-211 = "Сенсей? Что вы только что сделали...?"
10035100-212 = "[s3] «Поймал твою улыбку.»\n[s4] «Поймал твоё сердце.»"
10035100-215 = "...Не совсем понимаю, что вы имеете в виду."
10035100-216 = "[s] «Вот, посмотри.»"
10035100-217 = "Что вообще...?"
10035100-218 = ""
10035100-222 = "[ns] «Ну как? Хорошо получилось, правда?»"
10035100-224 = "[ns5] «Из тебя выйдет отличный спасатель.»\n[ns6] «У тебя есть качества отличной сотрудницы Бюро общественной безопасности.»"
10035100-225 = ""
10035100-226 = ""
10035100-228 = ""
10035100-229 = "...Хи-хи."
10035100-230 = "И снова вы за своё, Сенсей."
10035100-231 = "Как я уже сказала, я прекрасно понимаю, что плохо работаю с людьми."
10035100-232 = "Сегодня не было исключением."
10035100-233 = "И всё же..."
10035100-234 = "Если это возможно..."
10035100-235 = "Я бы хотела попробовать стать лучше... как спасатель."
10035100-236 = "Вот что я чувствую."
