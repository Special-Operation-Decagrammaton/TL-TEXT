[translation]
1004603-1 = "Играем с песком вместе с Изуной!"
1004603-2 = "Хм-хм-хм. ♪"
1004603-3 = "Изуна на страже! ♪"
1004603-4 = "Я снова пошёл на пляж вместе с Изуной."
1004603-6 = ""
1004603-12 = ""
1004603-13 = "О! Господин, господин! Видите, как волны накатывают на песок?"
1004603-14 = "Когда смотришь, как они идут вперёд и назад, немного кружится голова!"
1004603-15 = "[s] «Да, волны бывают мощными.»"
1004603-16 = "Хи-хи-хи!"
1004603-17 = "Пляж — такое удивительное место!"
1004603-18 = "Хм! Какую тренировку проведём сегодня?"
1004603-19 = "[s] «О, Изуна. Раз уж мы здесь, может, попробуем поплавать?»"
1004603-20 = "О, п-плавать?!"
1004603-21 = "Т-Так... Эм..."
1004603-22 = "Ну..."
1004603-23 = ""
1004603-25 = ""
1004603-26 = ""
1004603-27 = ""
1004603-28 = "Ах!"
1004603-29 = "Г-Господин! Это хорошая идея, но раз уж мы на пляже..."
1004603-30 = "я изучила ещё одну ниндзя-тренировку, которую хочу попробовать!"
1004603-31 = "[s] «О, правда? Какую именно?»"
1004603-32 = "Тренировку, которую можно проводить только на песке летнего пляжа..."
1004603-33 = "Это...!"
1004603-34 = "Это строительство ниндзя-замка из песка этого пляжа, господин!"
1004603-35 = "[s1] «...Ч-Что?»\n[s2] «(Как это вообще связано с тренировкой ниндзя...?)»"
1004603-38 = "Я однажды слышала об этом!"
1004603-39 = "В прошлом был пляж, где люди построили огромный песчаный замок и вступили в жестокую битву со злодеями!"
1004603-40 = "[s] «(Это случайно не из одного из её фильмов?)»"
1004603-41 = "После трёх дней обороны от постоянных осад они наконец победили нападавших головорезов!"
1004603-42 = "В процессе многие были ранены, но никто не погиб!"
1004603-43 = "А ещё из океана вышел каппа и помог им!"
1004603-44 = "[s3] «Мне кажется... эта история сильно приукрашена...»\n[s4] «(Разве каппа не мифическое морское существо?)»"
1004603-47 = "Хм! Значит, я должна соответствовать званию ниндзя!"
1004603-48 = "Замок, который никто не сможет взять или захватить..."
1004603-49 = "Я построю грандиозный замок, который сможет полностью защитить вас, господин!"
1004603-50 = "Я горю решимостью!"
1004603-51 = ""
1004603-53 = ""
1004603-56 = "Так что, эм... Поможете мне его построить, господин?"
1004603-57 = "[s] «Ну, почему бы и нет. Давай построим песчаный замок.»"
1004603-58 = "Ура!"
1004603-60 = "Мы с очень мотивированной Изуной начали строить песчаный замок в уголке песчаного пляжа."
1004603-62 = "Чтобы сделать идеальный песчаный замок, важен фундамент!"
1004603-63 = "Сначала подготовим площадку отсюда и досюда..."
1004603-64 = ""
1004603-66 = ""
1004603-67 = ""
1004603-68 = ""
1004603-69 = "Хи-хи! Как вам?"
1004603-70 = ""
1004603-72 = ""
1004603-75 = "О! Угол, над которым мы так старались!"
1004603-76 = "Ух... Он разрушился из-за волны..."
1004603-77 = "[s] «Нам лучше не строить слишком близко к океану.»"
1004603-78 = "Ух! Вы правы, господин."
1004603-79 = "Как бы трудно ни было, я не сдамся!"
1004603-80 = "Я ниндзя, которая учится на своих ошибках!"
1004603-81 = "[s] «Да! У тебя несгибаемая сила воли!»"
1004603-82 = "Нин-нин! Я буду усердно работать, чтобы ваша поддержка не пропала даром!"
1004603-83 = ""
1004603-85 = ""
1004603-86 = "Теперь давайте медленно строить снаружи..."
1004603-87 = ""
1004603-89 = ""
1004603-90 = ""
1004603-91 = "О! Господин! Пожалуйста, придержите ту сторону!"
1004603-92 = ""
1004603-95 = "Ай! Опять рассыпалось?!"
1004603-96 = "[s] «Похоже, он не выдержал вес. Это ведь просто песок.»"
1004603-97 = "Ух! Хорошо, теперь я знаю!"
1004603-98 = "Господин! Давайте ещё раз!"
1004603-100 = "А-а?! Сторожевая башня опять рухнула?!"
1004603-101 = "Так трудно правильно распределить вес!"
1004603-103 = "Теперь ещё и крабы атакуют середину стены замка?!"
1004603-104 = "О, н-нет! Туда нельзя!"
1004603-105 = "У-а-а-а?!"
1004603-107 = "Мы пробовали много раз, но строительство песчаного замка шло не так хорошо, как мы надеялись."
1004603-109 = "[ns] «Изуна, так ничего не получится.»"
1004603-110 = "В-Вы правы, господин."
1004603-111 = "Возможно... мои амбиции превосходят мои способности."
1004603-112 = "Я ведь всего лишь хотела защитить вас..."
1004603-113 = "Хотела защитить вас самым совершенным песчаным замком на свете."
1004603-114 = "Но! Если мы вообще не построим замок, весь наш труд пропадёт зря!"
1004603-115 = "Ваши слова помогли мне кое-что понять!"
1004603-116 = "[s] «(Кажется, я вообще ничего не сказал...)»"
1004603-117 = "Мне нужно быть менее амбициозной... Мы можем уменьшить размер!"
1004603-118 = "Если он будет меньше, сделать его крепким и прочным станет легче!"
1004603-119 = "[s] «Хорошо! Давай постараемся, Изуна!»"
1004603-120 = "Да! Сделаем это!"
1004603-122 = ""
1004603-123 = ""
1004603-125 = ""
1004603-126 = ""
1004603-128 = "Мы не перестали строить замок, хотя он постоянно рушился."
1004603-129 = ""
1004603-131 = ""
1004603-132 = ""
1004603-133 = ""
1004603-137 = ""
1004603-138 = ""
1004603-140 = "Мы пробовали снова, снова и снова."
1004603-141 = ""
1004603-144 = ""
1004603-145 = ""
1004603-146 = ""
1004603-148 = ""
1004603-149 = ""
1004603-153 = "Господин... Это тоже очень тяжёлая тренировка!"
1004603-154 = "[s] «Но ты стараешься изо всех сил!»"
1004603-155 = "Я думала, волны классные, но они злые злодеи, разрушающие стены замка!"
1004603-156 = "А как только мы закончили крышу, в неё влетел волейбольный мяч!"
1004603-157 = "[s] «Тот, кто бросил мяч, очень долго извинялся.»"
1004603-158 = "Но мы ни разу не сдались! Учились на ошибках и пробовали снова!"
1004603-159 = "И придумывали новые идеи, когда это было нужно!"
1004603-160 = "Всё получилось потому, что мы работали вместе, господин!"
1004603-161 = "[s] «Ты отлично справилась, Изуна.»"
1004603-162 = "Получилось! Мы наконец сделали это!"
1004603-163 = "Это замок, который мы создали вместе!"
1004603-164 = ""
1004603-166 = ""
1004603-168 = "Как вам, господин?!"
1004603-169 = "[s5] «Отлично! Маленький, зато крепкий!»\n[s6] «Кажется, он немного отличается от нашей первоначальной цели.»"
1004603-172 = "Хи-хи-хи! Прямо как я!"
1004603-173 = "Но мы всё-таки его закончили!"
1004603-174 = "Строить песчаный замок намного веселее вместе с кем-то!"
1004603-175 = "Это был новый опыт! Я так многому научилась, господин."
1004603-176 = "[s] «Изуна...»"
1004603-177 = ""
1004603-181 = "О, уже столько времени..."
1004603-182 = "Хи-хи-хи. Мы закончили замок, и уже поздно, так что..."
1004603-183 = "Наверное, нам пора возвращаться в общежитие..."
1004603-184 = ""
1004603-187 = "На сегодня игр с песком достаточно..."
1004603-188 = "Господин, можно мы..."
1004603-189 = "[s] «Изуна, день ещё не закончился!»"
1004603-190 = "...А?"
1004603-191 = "[s7] «Теперь замок меньше, зато можно сосредоточиться на количестве!»\n[s8] «Времени ещё полно, можно построить ещё!»"
1004603-194 = "[ns] «Что думаешь?»"
1004603-195 = "То есть..."
1004603-196 = "я могу ещё подольше поиграть с вами в песке...?"
1004603-197 = ""
1004603-199 = ""
1004603-200 = "Если это ваш приказ..."
1004603-201 = "Конечно, господин!"
1004603-202 = "Хи-хи-хи!"
1004603-204 = "Пока солнце не скрылось за горизонтом..."
1004603-205 = "я играл с Изуной в песке."
