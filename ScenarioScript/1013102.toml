[translation]
1013102-1 = "Объект критики"
1013102-2 = "Здравствуйте, Сенсей. Меня зовут Миёси Таканэ, и я хотела бы поприветствовать вас."
1013102-3 = "[s] «Добро пожаловать, Таканэ. Ты впервые в Шале?»"
1013102-4 = "Фуфу. Именно так. Благодарю за тёплый приём. Шале и правда столь замечательно, как о нём говорят."
1013102-5 = "А раз уж речь зашла о «тепле»... Погода сегодня довольно мягкая, не правда ли? Кажется, мне ещё не доводилось бывать в таком климате."
1013102-6 = "Прошу простить за столь внезапный вопрос, но... с самого начала моего пути в Шале меня не покидало одно любопытство."
1013102-7 = "[s] «Что именно?»"
1013102-8 = "Дело в том, что я..."
1013102-9 = "Хочу узнать о вас побольше."
1013102-10 = "[s] «Ч-Чего это вдруг?!»"
1013102-11 = "Что ж... Разве вы тоже не хотите узнать побольше обо МНЕ, Сенсей?"
1013102-12 = "Уверена, что хотите. Ведь каждый учитель должен стараться понимать своих учеников, разве нет?"
1013102-13 = "Прекрасно. Значит, мы пришли к согласию. Отныне посвятим это время тому, чтобы лучше узнать друг друга."
1013102-14 = "В конце концов, критик обязан как следует знать то, что собирается критиковать."
1013102-15 = "[s] «Ты ещё и людей критикуешь?!»"
1013102-16 = "Хм... Формально говоря, это не то, что я стала бы записывать и публиковать."
1013102-17 = "И всё же сам процесс — узнать предмет поближе, проанализировать его и обнаружить скрытую... ценность... — чрезвычайно важен."
1013102-18 = "Мне кажется, критика и человеческие отношения в этом похожи."
1013102-19 = "В этом смысле, если я буду тщательно подбирать слова, то, пожалуй, однажды смогу критиковать и людей."
1013102-20 = "...Разумеется, исключительно с добрыми и конструктивными намерениями."
1013102-21 = "[s] «Как всегда красноречиво...»"
1013102-22 = "Разумеется."
1013102-23 = "...Если я не буду такой в нынешнюю «цифровую эпоху»... мне ни за что не заработать на жизнь писательством."
1013102-24 = "Итак, Сенсей. Обсудим эту книгу? Я нашла её под вашим столом."
1013102-25 = "Может, мне прочитать её вместе с вами, а потом мы вместе разберём её достоинства и темы?"
1013102-26 = "[s] «Только не эту!»"
1013102-27 = "П-Почему же...?"
1013102-28 = "Что бы ни случилось, мне «прямо запрещено» читать или критиковать эту книгу...?"
1013102-29 = "Хм..."
1013102-30 = ""
1013102-32 = ""
1013102-33 = "Что ж, ладно. Храните свои секреты."
1013102-34 = "Но признаюсь, я немного разочарована... Знаете, Сенсей, я довольно широких взглядов."
1013102-35 = "Вы точно уверены, что мне нельзя?"
1013102-36 = "[s] «Только через мой труп.»"
1013102-37 = "Неужели всё настолько серьёзно?"
1013102-39 = "Тем не менее я заметила... весьма эклектичную коллекцию предметов, расставленных по вашему кабинету."
1013102-40 = "Всё настолько разномастно, что я не могу уловить ни общей темы, ни замысла."
1013102-41 = "О? Вот как? Это подарки от ваших дорогих учеников? Какая милая коллекция сувениров — и как беспорядочно они сложены."
1013102-42 = "..."
1013102-43 = "И хотя это весьма «мило», я вынуждена настоять, чтобы вы навели здесь ХОТЬ какой-нибудь порядок."
1013102-44 = "Классификация и расстановка должны показывать осмысленность. То, как вы располагаете вещи, само по себе демонстрирует их ценность."
1013102-45 = "Кроме того, это помогло бы мне понять, что вы за человек."
1013102-46 = "Так что, следуя этой идее, я принесла вам подарок."
1013102-47 = "Здесь собраны культурные рецензии Кивотоса за этот месяц, изданные нашим Издательским отделом."
1013102-48 = "О, страницы с 22-й по 24-ю можете смело пропустить."
1013102-49 = "Там находится... «творческий» уголок Мэрури."
1013102-50 = "[s] «Вы выпускаете это каждый месяц, Таканэ?»"
1013102-51 = "Я не единственный автор, но стараюсь заполнить отведённые мне страницы как можно лучше."
1013102-52 = "...Хотя в периоды, когда критиковать попросту нечего, мне иногда приходится, скрепя сердце, идти на уступки..."
1013102-54 = "...Именно. Если бы мы занимались исключительно печатными изданиями, то давно бы не выжили."
1013102-55 = "Продолжая работать в сфере издательства и культурного просвещения, мы стараемся осваивать и другие направления — всё, что поможет свести концы с концами."
1013102-56 = "Порой мне кажется, что хвост уже виляет собакой, поэтому лично я предпочла бы вернуться к временам, когда мы занимались только печатными работами, но..."
1013102-57 = "*вздох* Понимаю, что звучу неблагодарно. Даже я вынуждена признать, что деловая стратегия президента оказалась успешной."
1013102-58 = "И потому я снова прихожу к одному и тому же выводу."
1013102-59 = "Если у меня есть время жаловаться на компромиссы, на которые приходится идти ради работы, значит, мой долг — создавать хорошие рецензии для широкой публики..."
1013102-60 = "...чтобы находить скрытые жемчужины и знакомить с ними как можно больше людей."
1013102-61 = "Так что, Сенсей! Раз уж мы заговорили об этом..."
1013102-62 = "Не могли бы вы показать мне те стороны себя, которые обычно скрываете?"
1013102-63 = "[s] «Учителя не хранят секретов от учеников...»"
1013102-64 = "Ух ты, прямо ответ из учебника. Будто вас специально натаскали."
1013102-65 = "Но я уже раскрыла две вещи, вы ведь понимаете?"
1013102-66 = "Я знаю, что подарки учеников имеют для вас огромную сентиментальную ценность."
1013102-67 = "...И что даже у ВАС есть нечто, что вы хотите скрыть от учеников. У меня есть догадка, что именно."
1013102-68 = "[s] «Т-Тогда, думаю, теперь твоя очередь показать скрытую сторону себя!»"
1013102-69 = "Конечно. Спрашивайте обо всём, что угодно."
1013102-70 = "О, только прошу не лезть в слишком деликатные темы..."
1013102-71 = "..."
1013102-72 = "В зависимости от вопроса мне, возможно, придётся подвергнуть себя цензуре."
1013102-73 = "[s] «Я-Я и не собирался спрашивать ничего такого странного!»"
1013102-74 = "П-Правда...?"
1013102-75 = "Тогда что бы вы хотели узнать?"
1013102-76 = "Что? Мои увлечения? То есть кроме очевидного ответа — «чтения»?"
1013102-77 = "Хм... Мне не нравится мысль, что вы сочтёте меня такой банальной и предсказуемой."
1013102-78 = "Особенно обидно, потому что ваша догадка совершенно верна."
1013102-79 = "Фуфу... Но даже у меня есть хобби, от которого вы наверняка удивлённо поднимете брови."
1013102-80 = "Это хоккей!"
1013102-81 = "[s] «Хоккей?!»"
1013102-82 = "Да! Хоккей — великолепный вид спорта! Насколько хорошо вы знакомы с хоккеем, Сенсей?"
1013102-83 = "[s1] «Немного...?»\n[s2] «Не особо.»"
1013102-84 = "П-Правда? Тогда мне любопытно..."
1013102-85 = "Вы тоже подписаны на онлайн-каналы, страстно болеете за любимую команду и тщательно анализируете игру соперников?!"
1013102-86 = "А, не настолько... В таком случае, Сенсей..."
1013102-87 = "О да. Тогда всё сходится."
1013102-88 = "В Красной Зиме всегда холодно, поэтому мы постоянно занимаемся традиционными «зимними видами спорта». Я понимаю, что в других местах всё иначе."
1013102-89 = "Тогда, быть может, Сенсей..."
1013102-90 = "Не хотели бы вы посмотреть со мной хоккейный матч, когда в следующий раз приедете в Красную Зиму?"
1013102-91 = "Я с удовольствием буду комментировать..."
1013102-92 = "...Нет, я даже буду давать рецензии!"
