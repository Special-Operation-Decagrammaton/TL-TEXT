[translation]
1000405-1 = "Чужие предпочтения"
1000405-2 = "Небольшой торговый центр на окраине Геенны"
1000405-3 = ""
1000405-4 = ""
1000405-5 = ""
1000405-6 = "..."
1000405-7 = "О... Здравствуйте, Сенсей."
1000405-8 = "[s1] «Хина среди бела дня. Вот так встреча.»\n[s2] «Хина и голубое небо. Редкое сочетание.»"
1000405-9 = "Да ладно тебе. Ничего особенного."
1000405-10 = "Да ладно тебе. Ничего особенного."
1000405-11 = "Перестань смотреть на меня так, будто увидел городскую легенду."
1000405-12 = "К тому же после нашей прошлой встречи я решила увидеться с тобой днём."
1000405-13 = "[s] «А как же твоя занятость?»"
1000405-14 = "Глупости. Не то чтобы мне приходилось работать без остановки."
1000405-15 = "Я могу освободить три часа, немного переставив дела в расписании..."
1000405-16 = "[s3] «Три часа?»\n[s4] «И всё?»"
1000405-17 = "А...?"
1000405-18 = "А...?"
1000405-19 = "Э-Этого мало?"
1000405-20 = "Э-Этого должно хватить, чтобы мы... сходили... за покупками."
1000405-21 = "[s] «Не переживай. Что-нибудь придумаем. Пойдём!»"
1000405-22 = "А, к-конечно..."
1000405-24 = "Я вошёл в торговый центр вместе с Хиной."
1000405-26 = ""
1000405-27 = "(Здесь не так много людей.)"
1000405-28 = "(Наверное, Сенсей специально выбрал это место.)"
1000405-29 = "(Ну и ну...)"
1000405-30 = "Ну? Ты ведь говорил, что тебе нужно купить что-то важное?"
1000405-31 = "[s5] «Нет, не особо.»\n[s6] «Это был лишь предлог для свидания.»"
1000405-32 = "..."
1000405-33 = "...О нет..."
1000405-34 = "Я так и знала."
1000405-36 = "Магазин аксессуаров с персонажами"
1000405-37 = "Здесь действительно много аксессуаров."
1000405-38 = "Правда, большинство с какими-то странными персонажами..."
1000405-39 = "Что? Хочу ли я что-нибудь?"
1000405-40 = "Нет. Такие вещи меня не интересуют."
1000405-41 = "Знаю, многие студенты считают их милыми, но я никогда не понимала, что в них особенного. Я даже имён этих персонажей не знаю."
1000405-42 = "Может, пойдём куда-нибудь ещё?"
1000405-44 = "Игровой центр"
1000405-45 = "Так вот что такое игровой центр."
1000405-46 = "Нет, я раньше здесь не бывала. Мне это неинтересно."
1000405-47 = "Слишком много шума и раздражителей. И людей тоже полно."
1000405-48 = "Понимаю, кому-то такое нравится, но это не моё."
1000405-49 = "Может, пойдём в другое место?"
1000405-51 = "Магазин одежды"
1000405-52 = "Значит, здесь специализируются на уличной моде..."
1000405-53 = "Многие студенты носят что-то такое, когда выходят куда-нибудь на выходных..."
1000405-54 = "Что? Нравится ли мне такой стиль?"
1000405-55 = "Не особо."
1000405-56 = "Зачем покупать одежду, которая мне не нужна?"
1000405-57 = "У меня есть школьная форма, и мне этого достаточно."
1000405-58 = "[s7] «Что плохого в том, чтобы всё равно выбрать одну?»\n[s8] «Ну же, просто скажи, какая тебе нравится больше всего.»"
1000405-59 = "...?"
1000405-60 = "...?"
1000405-61 = "Ну..."
1000405-62 = "Хм..."
1000405-63 = ""
1000405-64 = "Хммм..."
1000405-65 = ""
1000405-66 = "Я-я... не очень понимаю."
1000405-67 = "П-Прости."
1000405-69 = "Закусочная на фудкорте"
1000405-70 = "Мы решили сделать перерыв в ближайшей закусочной."
1000405-71 = "..."
1000405-72 = "..."
1000405-73 = "..."
1000405-74 = "[s] «Что такое, Хина?»"
1000405-75 = "А...?"
1000405-76 = "О, ничего... Я просто подумала, что сегодняшний день, наверное, тебя разочаровал."
1000405-77 = "Такое чувство... будто я только испортила всё, чем ты хотел заняться."
1000405-78 = "Я знаю, со мной не очень весело проводить время. *вздох* Никогда не было."
1000405-79 = "[s9] «Но мне нравится эта твоя сторона.»\n[s10] «Именно она делает тебя Хиной.»"
1000405-82 = "..."
1000405-83 = "(Как Сенсей может быть таким внимательным...?)"
1000405-84 = "(Ну и ну..)"
1000405-85 = "Вы готовы сделать заказ?"
1000405-86 = "О... Д-Да. Мне чёрный кофе. Без сливок и сахара."
1000405-87 = "А ты что будешь, Сэн... А?"
1000405-88 = "Что-то не так?"
1000405-89 = "[s11] «Я просто думал, какая ты взрослая.»\n[s12] «У тебя всегда были зрелые вкусы.»"
1000405-90 = "Я? В-Взрослая?"
1000405-91 = "Я? В-Взрослая?"
1000405-92 = "..."
1000405-93 = "Ахаха... Ты себя слышишь? Здесь взрослый вообще-то ты."
1000405-94 = "А я всё ещё ребёнок. Низкая, худая, ворчливая и совсем не милая."
1000405-95 = ""
1000405-96 = "(Но даже если я сама ещё незрелая...)"
1000405-97 = "(...я всё равно восхищаюсь тем, каким взрослым ты умеешь быть.)"
1000405-98 = ""
1000405-100 = "Можешь сказать честно. Наверняка я вытянула из сегодняшнего дня всё веселье..."
1000405-101 = "[s13] «Вовсе нет. Я был рад сегодня увидеть твою улыбку.»\n[s14] «Нет. Сегодня был хороший день.»"
