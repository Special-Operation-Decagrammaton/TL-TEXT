[translation]
10011085-3 = ""
10011085-4 = "Не могу поверить! Вы способны настолько раскрыть свой боевой потенциал лишь потому, что командование взял на себя Сенсей?"
10011085-5 = "Не понимаю. Почему вы продолжаете упорствовать?"
10011085-6 = "Как я уже сказала, есть гораздо более простой путь получить официальное признание клуба."
10011085-7 = "Всё просто."
10011085-8 = ""
10011085-10 = ""
10011085-11 = "Мы хотим поддерживать решения нашего президента."
10011085-12 = ""
10011085-14 = ""
10011085-15 = "Какими бы они ни были."
10011085-16 = "Вот именно! Правильно! Правильно!"
10011085-17 = "Так точно! Мы поддержим нашего президента, потому что..."
10011085-18 = ""
10011085-20 = ""
10011085-21 = "Именно так поступает Клуб исследования ниндзюцу!"
10011085-22 = "...!"
10011085-23 = "Я... Я тоже это вижу."
10011085-24 = "Даже такая дурочка, как я, понимает, что за человек наш президент."
10011085-26 = ""
10011085-27 = "Она бывает мелочной, эгоистичной, а иногда и откровенно самодовольной."
10011085-28 = "Я и правда не раз думала, что она безнадёжна."
10011085-29 = "А ещё... такая, такая безрассудная!"
10011085-31 = "Но несмотря на всё это..."
10011085-32 = "Она изо всех сил старается, чтобы мы могли и дальше следовать нашей любви к ниндзя!"
10011085-33 = ""
10011085-35 = ""
10011085-36 = "Вот какая она на самом деле!"
10011085-37 = ""
10011085-40 = ""
10011085-41 = "Цукуё, верно?"
10011085-42 = "Ого, ты и правда очень высокая!"
10011085-43 = "...!"
10011085-44 = "О! Ну... эм... Знаешь, я..."
10011085-45 = "Знаешь, все величайшие ниндзя тоже очень высокие!"
10011085-46 = "Если тебе интересно..."
10011085-47 = ""
10011085-49 = ""
10011085-50 = "Присоединяйся к Клубу исследования ниндзюцу! Это мой клуб, и он самый лучший!"
10011085-51 = ""
10011085-53 = ""
10011085-54 = ""
10011085-56 = "Мне нравится наш президент! И я её уважаю!"
10011085-57 = "Поэтому я останусь с ней. Мы сделаем выступление успешным и заставим вас признать наш клуб. Чего бы это ни стоило!"
10011085-58 = "И мы обязательно сдержим обещание, данное Ибуки!"
10011085-59 = "Вот что значит быть ниндзя!"
10011085-60 = "...Правда, президент?"
10011085-62 = "Цукуё... Я...!"
10011085-63 = "Вот что... значит быть ниндзя...?"
10011085-64 = ""
10011085-67 = ""
10011085-71 = "[ns] «Надеюсь, это не то, о чём я думаю.»"
10011085-77 = ""
10011085-78 = "Все в порядке?"
10011085-79 = "[s] «Ироха?!»"
10011085-80 = "Ага! Я нашла её — она ходила кругами внутри особняка — и вывела наружу!"
10011085-81 = "А потом мы нашли этот танк, и она сказала, что очень хочет на нём покататься!"
10011085-82 = "Пока я блуждала по тому особняку, я кое-что поняла."
10011085-83 = "Не знаю, чем я вообще занималась, пытаясь действовать честно и бегая туда-сюда как идиотка. Это совсем не в моём стиле."
10011085-84 = "Я не позволю всему закончиться здесь. Я спасу Ибуки — так или иначе."
10011085-85 = "Вы ведь тоже ещё не сдались, правда?"
10011085-86 = "П-Постойте секунду?!"
10011085-90 = "...Президент?"
10011085-91 = "Президент!"
10011085-92 = ""
10011085-94 = ""
10011085-95 = "[s] «Мичиру.»"
10011085-96 = ""
10011085-98 = ""
10011085-99 = ""
10011085-100 = ""
10011085-101 = ""
10011085-102 = "Я уже вообще ничего не понимаю, но была не была! Клуб исследования ниндзюцу, выступаем!"
