[translation]
2003602-1 = "Грандиозная операция по выходу в ноль"
2003602-2 = "По приглашению Серики я вышел во двор перед курортом."
2003602-3 = "Я вас ждала, Сенсей! Так, это должно быть..."
2003602-4 = "Погодите... Уф, это неудобно нести..."
2003602-5 = ""
2003602-7 = ""
2003602-8 = ""
2003602-9 = "...Сенсей?"
2003602-10 = "Простите, но поможете мне это донести? Оно не очень тяжёлое, просто слишком громоздкое..."
2003602-11 = "[s1] «Ты столько всего принесла.»\n[s2] «Что это вообще такое?»"
2003602-14 = "Ну, это всё обычные вещи, просто..."
2003602-15 = "Я хотела убедиться, что ничего не забыла. Тут есть еда, напитки..."
2003602-16 = "Это постелить на землю, вот купальные принадлежности на всякий случай, камера, мачете и..."
2003602-17 = "...А?"
2003602-18 = "Слишком много? Думаете, нам всё это не понадобится?"
2003602-19 = "Вы вообще меня слушали? Я же говорила: у нас должны быть лучшие каникулы в жизни! Это только самое необходимое!"
2003602-20 = "...Что значит, я всё неправильно поняла?"
2003602-21 = "[s3] «Нам нужны лучшие каникулы, а не „идеальные“.»\n[s4] «Нельзя проводить отпуск, постоянно обо всём переживая.»"
2003602-24 = "П-Правда...? Хм... Почему это звучит довольно убедительно...?"
2003602-25 = ""
2003602-27 = ""
2003602-28 = "Нет-нет! Так просто вы меня не переубедите!"
2003602-29 = "Во всяком случае, не в этот раз. Просто... подыграйте мне, хорошо? Хотя бы сегодня?"
2003602-30 = "...А?"
2003602-31 = "«Хорошо»? И вы просто согласитесь?"
2003602-32 = "«На отдыхе не стоит ссориться»? Я-я вовсе не пыталась ссориться!"
2003602-33 = "Ну, в любом случае вы согласились, так что..."
2003602-34 = ""
2003602-36 = ""
2003602-37 = "Ну что, начинаем наши «лучшие каникулы» прямо сейчас!"
2003602-39 = "Я помог Серике собрать все вещи, после чего мы вместе отправились искать «лучшее место для отдыха.»"
2003602-40 = ""
2003602-45 = "[ns5] «...Ну как вам?»\n[ns6] «Хорошее место.»"
2003602-48 = ""
2003602-49 = "Хм... Здесь определённо ХОРОШО, но..."
2003602-50 = "Как бы сказать?.. Немного предсказуемо. Слишком обычно."
2003602-51 = "Для «лучших каникул» как-то не подходит."
2003602-54 = ""
2003602-55 = "[ns7] «А здесь?»\n[ns8] «Атмосфера уже совсем другая, правда?»"
2003602-58 = "Это... правда, но... Хм..."
2003602-59 = "Не знаю... Всё равно что-то не то... Может, потому что мы всё ещё у моря..."
2003602-62 = ""
2003602-63 = "[ns9] «Теперь мы ушли от моря.»\n[ns10] «Кажется, мы уже начинаем упускать сам смысл...»"
2003602-66 = "Хм... Как странно..."
2003602-67 = "Место хорошее... Они все хорошие, но... не знаю почему. Просто не чувствую, что это оно."
2003602-68 = "Такими темпами я весь день буду таскать вас за собой и мучить без всякой причины... Плохо дело..."
2003602-70 = ""
2003602-71 = ""
2003602-72 = "...Очень плохо..."
2003602-74 = "...В итоге мы так и не нашли место и вернулись на курорт."
2003602-75 = ""
2003602-81 = "..."
2003602-82 = "Т-Так... Эм... С-Сенсей, я, эм..."
2003602-83 = ""
2003602-85 = ""
2003602-86 = "...Простите."
2003602-87 = "Я так увлеклась, заставила вас таскать все эти вещи, а в итоге мы вообще ничего не сделали."
2003602-88 = "Это и правда непросто. Найти лучшее место для отдыха..."
2003602-89 = "Я только зря вас измучила..."
2003602-90 = "...А?"
2003602-91 = "Вы так не думаете? Это уже лучшие каникулы...?"
2003602-92 = "В каком смысле? Мы весь день только бродили туда-сюда и так ничего и не нашли..."
2003602-93 = "[s11] «Нам нужны лучшие каникулы, а не „идеальные“.»\n[s12] «Отпуск ведь не обязан быть заполнен какими-то делами.»"
2003602-96 = "А, вот опять. Вы всё пытаетесь меня утешить..."
2003602-97 = "...Что? Вы меня не утешаете?"
2003602-98 = "Вы правда так думаете? ...Что вы имеете в виду?"
2003602-99 = "[s13] «Благодаря тебе мы весь день исследовали окрестности.»\n[s14] «Благодаря тебе мы сейчас так приятно разговариваем летней ночью.»"
2003602-102 = "...О-Ох..."
2003602-103 = "То есть... всё получилось?"
2003602-104 = "Ну, мы ведь сходили на пляж, в лес, в пещеру..."
2003602-105 = "Несколько раз отдыхали, перекусывали... И всё это вместе с вами, Сенсей..."
2003602-106 = "Наверное... если посмотреть на это так..."
2003602-107 = "...Хм."
2003602-108 = "...Хи-хи."
2003602-109 = "Может, вы и правы..."
2003602-110 = ""
2003602-112 = ""
2003602-113 = "...Да! Я ХОЧУ думать об этом именно так!"
2003602-114 = "Ладно, на сегодня хватит! Продолжим завтра."
2003602-115 = "Сегодня было неплохо, конечно, но..."
2003602-116 = "...мы ещё не закончили! До самого последнего дня у нас будут «лучшие каникулы»!"
2003602-117 = "Поняли, Сенсей? Просто продолжайте мне подыгрывать! Обещаете?"
2003602-118 = "Я-я пойду спать!"
2003602-119 = ""
2003602-121 = ""
2003602-123 = "Я подобрал вещи, которые забыла Серика, и вернулся в свою комнату."
