13200-219 = "Созвать вообще все силы ЧВК Кайзер! Все дочерние компании!"
13200-220 = "Это тотальная война! Корпорация Кайзер начнёт полномасштабную войну в Абидосе...!!"
13200-221 = "Полномасштабную войну...!"
13200-222 = "Наша цель — Долина председателей студсовета...! Захватить Железнодорожную пушку! *кашель* *кашель*...!"
13200-223 = "Железнодорожную пушку необходимо вывезти из района Абидоса! Обязательно!"
13200-224 = "Есть, обязательно!"
