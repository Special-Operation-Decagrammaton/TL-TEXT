[translation]
13200-1 = "Episódio 20;Caça ao Tesouro"
13200-4 = "..."
13200-8 = "Hoshino-senpai!"
13200-9 = "Onde está o Presidente...?"
13200-12 = "Hmph..."
13200-17 = "..."
13200-20 = "Um helicóptero...?!"
13200-25 = "...Ah!"
13200-27 = "Foi por pouco, hein."
13200-28 = "Com isto, o Canhão Ferroviário é meu."
13200-31 = "Suou-kun, cadê aquilo?"
13200-32 = "Aqui está."
13200-37 = "Q-Quando você pegou o meu cartão...?!"
13200-38 = "Afinal, preciso disto para ir ao \"Vale do Conselho Estudantil\"."
13200-40 = "Vale do Conselho Estudantil...?"
13200-41 = "Sim. Ao que parece, é necessária a autorização do Grupo Nephthys para entrar lá."
13200-42 = "Eu bem que gostaria de levar a própria dona,#nmas infelizmente não foi possível."
13200-44 = "...Contudo, contanto que eu tenha este cartão, não há problema algum."
13200-45 = "O Canhão Ferroviário está num lugar chamado \"Vale do Conselho Estudantil\"...?"
13200-46 = "Não me diga que vocês também pretendem ir até lá?"
13200-47 = "Considerando o valor estratégico, tecnológico e histórico do \"Canhão Ferroviário Shemata\"..."
13200-48 = "Seu valor chega a cerca de 80 bilhões de ienes!"
13200-49 = "O-Oitenta bilhões de ienes...?!"
13200-50 = "I-Isso só pode ser mentira!"
13200-52 = "Se vocês fizerem sequer um arranhão no Canhão Ferroviário,#nvão ter que pagar uma indenização milionária."
13200-53 = "Têm coragem para arcar com isso?"
13200-56 = "É verdade. Vou fazer a Hoshino-kun trabalhar até quitarem a indenização.#nTenho certeza de que o Terno Preto também vai ficar encantado."
13200-57 = "...Ou será que preferem brigar na justiça?#nNão me importo de aceitar o desafio."
13200-60 = "Quando vocês se formarem, vou atormentar as novas calouras.#nIsto é, se Abydos sequer tiver um futuro.#nHa ha ha ha ha!"
13200-65 = "...Hm?"
13200-66 = "O que houve, Suou-kun?"
13200-72 = "O quê...?"
13200-73 = "U-Uooooh?!"
13200-79 = "Presidente?!"
13200-88 = "Guaaaah!"
13200-92 = "Eles estão brigando entre si...?!"
13200-93 = "...!"
13200-94 = "Hã?! O que está acontecendo?!"
13200-95 = "Mas o que é isso...?"
13200-100 = "Guh..."
13200-101 = "Ugh...!"
13200-105 = "Presidente!"
13200-106 = "O senhor se machucou?!"
13200-107 = "Ugh... Cof, cof."
13200-111 = "E-Entrem em contato com a sede imediatamente!"
13200-113 = "...Hoshino Takanashi.#nVocê sabe a que lugar o Vale do Conselho Estudantil se refere, não sabe?"
13200-114 = "Se quiser deter o Canhão Ferroviário, venha até lá."
13200-116 = "Você é..."
13200-117 = "Se não vier, eu mesma vou ativar o Canhão Ferroviário."
13200-121 = "..."
13200-122 = "Onde será que fica esse lugar...?"
13200-123 = "Eu também não sei."
13200-127 = "(Vale do Conselho Estudantil...)"
13200-128 = "(Isso mesmo, o Setor 35-9!)"
13200-130 = "Acho que todos os lugares são iguais."
13200-131 = "Mesmo que houvesse itens valiosos em exposição, o antigo conselho estudantil já vendeu tudo há muito tempo."
13200-134 = "Antigamente, o Conselho Estudantil de Abydos construiu um pavilhão de exposições no deserto.#nEsse lugar é o Vale do Conselho Estudantil."
13200-135 = "Entendi, então estava escondido lá."
13200-141 = "Espere, Hoshino-senpai!"
13200-146 = "Isso mesmo, senpai!"
13200-147 = "Espere, por favor, precisamos conversar!"
13200-148 = "Hoshino-senpai!"
13200-149 = "A Nonomi-senpai foi salva!"
13200-151 = "E o Conselho Estudantil de Abydos também não vai mais acabar."
13200-152 = "É verdade, então por favor, acalme-se!#nVamos bolar um plano todas juntas!"
13200-153 = "...Me desculpem."
13200-154 = "Ah?!"
13200-155 = "Hoshino-senpai..."
13200-156 = "[s] \"Hoshino, espere.\""
13200-158 = "Se eu continuar no Comitê de Contramedidas, não vou poder destruir o Canhão Ferroviário."
13200-159 = "...!"
13200-160 = "...Eu não sou do Comitê de Contramedidas.#nEu sou do Conselho Estudantil de Abydos."
13200-161 = "Não é mais!"
13200-162 = "O Comitê de Contramedidas é o Conselho Estudantil de Abydos—"
13200-164 = "—Como não foi possível dar continuidade ao contrato, essa decisão perdeu o sentido."
13200-165 = "O Comitê de Contramedidas não deve se envolver neste problema."
13200-166 = "...!"
13200-167 = "Isto precisa ser um ato isolado, cometido por conta própria#npor Hoshino Takanashi, que se autoproclama do conselho estudantil."
13200-171 = "[ns] \"Espere, Hoshino!\""
13200-177 = "Kyaa?!"
13200-185 = "Desculpe, Shiroko-chan."
13200-195 = "Ngh!"
13200-196 = "O Canhão Ferroviário não pode ficar em Abydos."
13200-197 = "Por isso, eu vou destruí-lo.#nPara proteger o futuro das minhas queridas calouras."
13200-198 = "...Obrigada por tentarem proteger as memórias que vivi com a Yume-senpai."
13200-203 = "Hoshino-senpai!!"
13200-209 = "F-Falta pouco!"
13200-210 = "Guh... Vamos sair de Abydos depressa."
13200-211 = "...E convoque todos os funcionários do Grupo Kaiser."
13200-212 = "T-Todos os funcionários?!"
13200-214 = "Exatamente!"
13200-215 = "Kaiser Industry."
13200-216 = "Kaiser Loans."
13200-217 = "Kaiser Construction."
13200-218 = "Kaiser Convenience."
13200-219 = "Kaiser PMC."
13200-220 = "Com todo o poder da nossa corporação, partiremos para um Ataque Total...!"
13200-221 = "Ataque Total...!"
13200-222 = "O alvo é o Vale do Conselho Estudantil...!#nEntendido? Cof, cof...!"
13200-223 = "Consigam o Canhão Ferroviário a qualquer custo!"
13200-224 = "E-Entendido, senhor!"
13200-230 = "..."
13200-231 = "Hoshino-senpai..."
13200-232 = "..."
13200-239 = "..."
13200-245 = "Próximo;A Segunda Perseguição"
