13200-23 = ""
13200-24 = ""
13200-25 = "...Он сбежал."
13200-27 = "К сожалению, маленькие мои, Железнодорожная пушка теперь моя!"
13200-28 = "Проще говоря — мат."
13200-31 = "Карта, Суо?"
13200-32 = "Вот они."
13200-33 = ""
13200-35 = ""
13200-36 = ""
13200-37 = "П-Подождите... Это моя карта! Когда вы...?!"
13200-38 = "Она нужна, чтобы открыть путь в Долину председателей студсовета."
13200-40 = "Долина председателей студсовета...?"
13200-41 = "Да. По нашему анализу, для доступа к маршруту нужна авторизация владельца Нефтис."
13200-42 = "В идеале сам владелец тоже должен присутствовать... но похоже, Хошино этого не допустит."
13200-44 = "...Впрочем, думаю, одной карты будет достаточно."
13200-45 = "Железнодорожная пушка... находится в этой «Долине председателей студсовета»...?"
13200-46 = "Всё ещё собираетесь преследовать? Я не позволю."
13200-47 = "Мы оценили денежную стоимость Железнодорожной пушки «Схемата»! Учли её стратегическую, технологическую и историческую ценность..."
13200-48 = "Стоимость составляет... примерно восемьдесят миллиардов йен!"
13200-49 = "В-Восемьдесят миллиардов йен...?!"
13200-50 = "Что это вообще за безумное число?!"
13200-52 = "Юридически Железнодорожная пушка принадлежит Кайзер. Посмеете её тронуть — придётся выплатить астрономическую компенсацию за порчу имущества."
13200-53 = "Готовы ещё сильнее влезть в долги, Комитет по выплате долга Абидоса?"
13200-56 = "Если до этого дойдёт... найду тебе работу в ЧВК Кайзер, Хошино. Чёрный Костюм будет рад."
13200-57 = "Или хочешь пойти законным путём и судиться со мной? Тоже приветствую. Буду мучить тебя до самого выпуска."
13200-60 = "А потом буду мучить ваших новых студентов. Если они вообще появятся, ха-ха-ха!"
