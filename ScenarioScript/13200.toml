13200-108 = ""
13200-110 = ""
13200-111 = "Травмы серьёзные! Н-Немедленно связаться со штабом!"
13200-113 = "...Таканаши Хошино. Долина председателей студсовета. Ты знаешь, где это, верно?"
13200-114 = "Я буду ждать тебя там. Преследуй, если хочешь остановить Железнодорожную пушку."
13200-116 = "Ты..."
13200-117 = "Если не придёшь, я активирую Железнодорожную пушку и вывезу её из Абидоса."
13200-118 = ""
13200-121 = "..."
13200-122 = "Д-Долина председателей студсовета...? Г-Где это?"
13200-123 = "Н-Не уверена. Кажется, я где-то это слышала..."
13200-124 = ""
13200-126 = ""
13200-127 = "(Долина председателей студсовета...)"
13200-128 = "(Помню... Сектор 35-9.)"
13200-130 = "Куда бы мы ни пошли, всё будет одинаково. Если бы этот «Выставочный зал председателей Абидоса» со всеми ценными сокровищами действительно существовал..."
13200-131 = "...предыдущий студсовет давно бы его нашёл и всё распродал."
13200-132 = ""
13200-134 = "Говорят, прежние председатели студсовета Абидоса когда-то построили выставочный зал."
13200-135 = "В народе его называют Долиной председателей студсовета... Я знаю это место... Подумать только, Железнодорожная пушка всё это время была там..."
13200-136 = ""
13200-138 = ""
13200-140 = ""
13200-141 = "Стой! Хошино?!"
13200-142 = ""
13200-144 = ""
13200-146 = "К-Куда ты?!"
13200-147 = "Хошино! Пожалуйста, подожди! Просто поговори с нами!"
13200-148 = "Х-Хошино!"
13200-149 = "Нам нужно поговорить! Теперь всё хорошо! Мы даже спасли Нономи..."
13200-151 = "Благодаря Сенсею нам не пришлось отрицать ни президентство Юмэ, ни Комитет по выплате долга."
13200-152 = "Да! Поэтому не уходи одна! Сделаем это вместе!"
13200-153 = "...Прости. Я не могу."
13200-154 = "Что?!"
13200-155 = "Хошино, т-ты ведь не..."
13200-156 = "[ns] «Хошино, подожди.»"
13200-158 = "Если я сейчас вернусь в Комитет по выплате долга... мы не сможем уничтожить Железнодорожную пушку."
13200-159 = "...!!"
13200-160 = "...Я не могу быть частью Комитета по выплате долга. Мой студсовет Абидоса должен оставаться отдельно от вас."
13200-161 = "Что?!"
13200-162 = "Нет! Твоё заявление теперь ничего не значит!"
13200-164 = "...Даже если ничего не значит, мне всё равно нужно это для того, что я должна сделать."
13200-165 = "Да, всё, что случится дальше, должно быть никак не связано с Комитетом по выплате долга."
13200-166 = "...!!"
13200-167 = "Это будет просто самовольная атака Хошино, члена фальшивого студсовета. Иначе вина ляжет на Комитет."
