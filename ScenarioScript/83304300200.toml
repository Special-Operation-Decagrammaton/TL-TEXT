83304300200-6 = ""
83304300200-8 = ""
83304300200-9 = "Уф! Мусор повсюду!"
83304300200-10 = ""
83304300200-12 = ""
83304300200-14 = ""
83304300200-15 = "Иори? Что ты делаешь?"
83304300200-16 = "Глава префектов! Вы только посмотрите, сколько здесь листовок!"
83304300200-17 = "Общество Пандемониума разбрасывало повсюду листовки с какими-то странными лозунгами!"
83304300200-18 = "Я не могла оставить наши улицы заваленными мусором, поэтому начала всё собирать."
83304300200-19 = "...И я слышала, что при раздаче листовок произошёл какой-то переполох."
83304300200-20 = "Что-то про членов Общества Пандемониума и Сенсея, которые остановили председателя Макото, когда та снова устроила погром."
83304300200-21 = "...Подробностей я не знаю, но, похоже, Сенсею сейчас нелегко."
83304300200-22 = "Хм. Ты правильно поступила, Иори. Мы, как Префектурная команда, не можем терпеть мусор на улицах."
83304300200-23 = ""
83304300200-25 = ""
83304300200-26 = "...До начала тренировки ещё есть время."
83304300200-27 = ""
83304300200-29 = ""
83304300200-31 = "Давай вместе уберём эти листовки."
83304300200-33 = "Хорошо! Давайте покончим с этим!"
