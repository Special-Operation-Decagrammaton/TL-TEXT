[translation]
101140-1 = "Эпизод 14; Операция по возвращению Шале 2"
101140-3 = "...Значит, шесть зафиксированных нами энергетических объектов — это Хрома?"
101140-4 = "Подтверждения пока нет. Но скоро будет."
101140-5 = "Кайзер действовали самостоятельно, поэтому сейчас у нас мало информации..."
101140-6 = "Изначально меня не интересовала идея сверхъестественных сил... но появление Ковчега радикально изменило ситуацию."
101140-7 = "Стоит ли беспокоиться об артефакте под Пустыней Абидос, который теперь у Кайзер, или не стоит... Вот в чём вопрос."
101140-8 = "Не тревожься. У президента нет способа им управлять."
101140-9 = "Ковчег — наша главная и единственная забота."
101140-10 = "Продолжим по плану."
101140-12 = "...Communio Sanctorum, завершённый посредством Mimesis, — первый. Амброзиус провалился, а Грегориус ещё не готов."
101140-13 = "Библиотека знаний только начала работу, а магу из парка аттракционов, возможно, понадобится больше времени."
101140-14 = "Что касается пророков Декаграмматона... силы Созерцателя, Арбитра и Славы уже получены."
101140-15 = "Раз Декаграмматон выбрал смерть и оставил своих пророков позади, сейчас это всё, что мы можем сделать."
101140-16 = "В идеале стоило бы выяснить, означает ли это повторное пришествие божественности, но, к сожалению, времени не будет."
101140-17 = "Хрома приближается, а Безымянные жрецы воскресают... Нужно подготовиться к обоим."
101140-18 = "..."
101140-19 = "..."
