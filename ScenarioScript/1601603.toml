[translation]
1601603-1 = "Объяснять не нужно..."
1601603-2 = "Я был в центре города и покупал кое-что необходимое для Шале."
1601603-3 = ""
1601603-8 = "Сенсей. Какая неожиданность."
1601603-9 = ""
1601603-12 = "[ns1] «...А? Этот голос...»\n[ns2] «...Минэ?»"
1601603-13 = ""
1601603-14 = ""
1601603-17 = ""
1601603-18 = "Вас привела сюда работа Шале? Какое приятное совпадение."
1601603-19 = "Меня сюда также привели дела Рыцарей исцеления. Если вы не против, давайте продолжим путь вместе, пока нам не придётся разойтись."
1601603-20 = ""
1601603-22 = ""
1601603-23 = "Сенсей? Что-то не так? Ваше выражение лица..."
1601603-24 = "...А, мой костюм?"
1601603-25 = ""
1601603-27 = ""
1601603-28 = ""
1601603-29 = "Теперь понимаю. Прошу прощения. Моё объяснение было недостаточным."
1601603-30 = "Я здесь по делам Рыцарей исцеления, но дело связано с чем-то вроде концерта в знак благодарности. Я решила, что этот костюм лучше подойдёт для подобных обстоятельств."
1601603-31 = "Теперь недоразумений не осталось?"
1601603-32 = "[s3] «А, понятно. У тебя всегда полно дел.»\n[s4] «Вижу, ты усердно работаешь.»"
1601603-35 = "Хи-хи. Я лишь исполняю свои обязанности."
1601603-36 = ""
1601603-38 = ""
1601603-39 = "Теперь, когда ваше любопытство удовлетворено... пойдём?"
1601603-40 = ""
1601603-42 = ""
1601603-46 = "...Несколько дней спустя."
1601603-52 = "Я находился в дорогом ресторане на рабочей встрече."
1601603-53 = ""
1601603-58 = "...Хм? Сенсей?"
1601603-59 = ""
1601603-63 = ""
1601603-64 = "Ещё одно неожиданное совпадение. И ведь подобное уже случалось всего несколько дней назад."
1601603-65 = "Хотя совпадение, благодаря которому я встречаю вас, Сенсей, безусловно, можно считать хорошим. Хи-хи."
1601603-66 = "[s5] «Ты здесь ради концерта?»\n[s6] «Ты снова в айдольском костюме.»"
1601603-69 = "Хм?"
1601603-70 = "Нет-нет, на этот раз никакого концерта. Мне просто порекомендовали это место, сказав, что здесь очень вкусно."
1601603-71 = "А этот костюм просто..."
1601603-72 = ""
1601603-74 = ""
1601603-75 = ""
1601603-76 = "..."
1601603-77 = "...с-случайно оказался самым подходящим нарядом для этого случая... Да..."
1601603-78 = "Всё-таки это ресторан высокой кухни. Нужно соответствовать ситуации. Звучит как вполне убедительное объяснение."
1601603-79 = "[s7] «(...Для этого случая?)»\n[s8] «(А эта пауза сейчас к чему была...?)»"
1601603-82 = "Н-Ну. Уверена, у вас, как всегда, очень плотный график, поэтому я, пожалуй, пойду."
1601603-83 = "Прошу меня извинить. Ещё увидимся...!"
1601603-84 = ""
1601603-86 = ""
1601603-89 = "После этого мы с Минэ продолжали случайно встречаться."
1601603-92 = ""
1601603-95 = ""
1601603-98 = ""
1601603-100 = "Каждый раз она всё ещё была в айдольском костюме и всякий раз придумывала всё более странное оправдание."
1601603-101 = ""
1601603-106 = "А затем, на следующий день..."
1601603-107 = ""
1601603-112 = "Я допоздна работал сверхурочно и отправился в магазин у дома, чтобы немного взбодриться."
1601603-113 = ""
1601603-118 = ""
1601603-119 = ""
1601603-120 = ""
1601603-121 = "...Сенсей? Вы довольно поздно на улице."
1601603-122 = "С-Сверхурочная работа? Понятно. Вы усердно исполняете свой долг."
1601603-123 = "Не могу говорить за всех, но уверена, что все благодарны вам за такой тяжёлый труд."
1601603-124 = "И ещё..."
1601603-125 = ""
1601603-127 = ""
1601603-128 = ""
1601603-129 = "...Ах..."
1601603-130 = "...Эм... Сенсей."
1601603-131 = "Это... То есть этот костюм..."
1601603-132 = "[s9] «Минэ, секунду.»\n[s10] «Тебе не нужно придумывать оправдание, почему ты его носишь.»"
1601603-133 = ""
1601603-134 = ""
1601603-136 = ""
1601603-137 = "Н-Это не совсем...! Это... эм..."
1601603-138 = "Эм! Как бы это сказать..."
1601603-139 = ""
1601603-141 = ""
1601603-142 = "А! Да. Это просто повседневная одежда. Сегодня перед вами не капитан Рыцарей исцеления, а обычная гражданка. Следовательно, я одета так, как одевался бы обычный гражданин."
1601603-143 = "Погодите. Прошу секунду. Люди правда носят подобное как «повседневную одежду»?"
1601603-144 = "Как же к этому подойти? Как человеку естественно вести себя в такой ситуации?"
1601603-145 = "Я-я только что сказала это вслух?"
1601603-146 = ""
1601603-148 = ""
1601603-149 = ""
1601603-150 = "Хм? Что вы сказали, Сенсей?"
1601603-151 = "...Простите? Это... нормально? Ч-Что вы имеете в виду...?"
1601603-152 = "[s11] «Я знаю, что тебе нравятся милые вещи.»\n[s12] «Думаю, хорошо, что ты позволяешь себе это показывать.»"
1601603-155 = "Да. Эм. Конечно. В таком случае это даже облегчение..."
1601603-156 = "...слышать..."
1601603-157 = ""
1601603-159 = ""
1601603-160 = ""
1601603-161 = "...Сенсей?"
1601603-162 = "Стойте. Сенсей. Эти слова... которые вы только что сказали... их смысл..."
1601603-163 = ""
1601603-168 = ""
1601603-169 = "...Ах. Да."
1601603-170 = "Вы знали с самого начала. С самого-самого начала."
1601603-171 = "Вот как..."
1601603-172 = ""
1601603-174 = ""
1601603-175 = ""
1601603-176 = "...Сенсей."
1601603-177 = ""
1601603-179 = ""
1601603-180 = ""
1601603-182 = "[ns13] «...?! Минэ...?!»\n[ns14] «Какой грозный взгляд!»"
1601603-183 = ""
1601603-184 = ""
1601603-185 = "Такие..."
1601603-187 = "Такие вещи... нужно говорить сразу."
