[translation]
1014008-1 = "Прощальная лисица"
1014008-2 = "Заседание Генерального студенческого совета в тот день затянулось гораздо дольше, чем я ожидал."
1014008-3 = "Я вышел со станции и наконец направился обратно в Шале."
1014008-4 = ""
1014008-8 = "[ns1] «Фонарь сломан?»\n[ns2] «...Сегодня необычно темно.»"
1014008-12 = "[ns] «О-Ого!»"
1014008-14 = "[ns3] «(Сейчас настолько темно, что я не вижу собственных ног)»\n[ns4] «(И улицы почти пустые)»"
1014008-17 = ""
1014008-18 = "В этом районе орудует грабитель: прячется в переулках и крадёт у людей ценности."
1014008-19 = "Он выслеживает жертву до пустынного места... а потом нападает сзади и опустошает карманы."
1014008-22 = "[ns] «Надо спешить...»"
1014008-25 = ""
1014008-26 = "[ns] «(За мной кто-то идёт?)»"
1014008-29 = ""
1014008-30 = "[ns5] «Н-Не трогайте меня!»\n[ns6] «У меня нет денег!»"
1014008-33 = "О чём ты?"
1014008-34 = ""
1014008-36 = ""
1014008-37 = "...Вы подумали, что я тот грабитель?"
1014008-38 = "[s7] «Это ты, Куруми... Какое облегчение.»\n[s8] «...Да. Я решил, что ты грабитель.»"
1014008-41 = "Мне показалось, что увидела вас по дороге из магазина. Значит, не ошиблась."
1014008-42 = "Если так страшно, зачем ходите ночью один?"
1014008-43 = "Я же говорила: попросите кого-нибудь из студентов проводить вас домой... хотя бы меня."
1014008-44 = "[s] «Знаю, но идти совсем недалеко.»"
1014008-45 = "Вам действительно не хватает осторожности, Сенсей."
1014008-46 = "Вы будете говорить то же самое, когда на вас реально нападут?"
1014008-47 = "[s9] «Да, мэм. У тебя есть фонарик?»\n[s10] «Я ничего не вижу из-за темноты.»"
1014008-50 = "Фонарик? Сейчас нет."
1014008-51 = "Вот, можно подсветить телефоном..."
1014008-52 = ""
1014008-55 = "Ух, осталось только 10% заряда. Не пойдёт."
1014008-56 = "[s] «А твой Flash Shield?»"
1014008-57 = "Он создан для ослепляющей вспышки, а не чтобы освещать дорогу."
1014008-58 = "Если использовать его сейчас, в такой темноте, меня сочтут нарушительницей общественного порядка."
1014008-59 = "[s] «...Полностью согласен.»"
1014008-60 = ""
1014008-62 = ""
1014008-63 = ""
1014008-64 = ""
1014008-65 = "Вот, возьмите меня за руку."
1014008-66 = "У меня хорошее ночное зрение. Просто идите за мной, и не упадёте и не ушибёте ноги."
1014008-67 = "...«Обязательно ли держаться за руки»?"
1014008-68 = "П-Почему это ВЫ делаете ситуацию странной? Это утверждённый тактический метод передвижения в условиях плохой видимости!"
1014008-69 = "Н-Не думайте ничего такого и держите крепче. В тактических целях."
1014008-73 = "Я вышел из тёмного переулка, всё ещё держа Куруми за руку."
1014008-74 = ""
1014008-75 = "[ns] «Похоже, ты привыкла к таким ситуациям, Куруми.»"
1014008-76 = "Разумеется. Я же иду первой, помните?"
1014008-77 = "Я привыкла врываться в тёмные места, освещать их и вести остальных."
1014008-78 = "Привыкла... но даже мне не всегда спокойно."
1014008-79 = "Если выберу неверный путь и заведу всех в ловушку или опасное место..."
1014008-80 = "Я могу поставить жизни товарищей по отряду под угрозу."
1014008-81 = "С каждым новым шагом я чувствую немного страха и сомнения."
1014008-83 = "...Правильно ли я веду всех?"
1014008-84 = "[s11] «Темнота всегда полна неопределённости.»\n[s12] «Не узнаешь, пока не сделаешь шаг.»"
1014008-87 = ""
1014008-88 = "Именно. Вот поэтому я нервничаю..."
1014008-89 = "[s] «Но мы всё ещё держимся за руки!»"
1014008-90 = "..."
1014008-91 = "[s13] «Если ты споткнёшься, Куруми, я подхвачу сзади.»\n[s14] «Для этого в отряде и нужны прикрывающие, правда?»"
1014008-94 = "Наверное, потому что вы в последнее время помогаете нам на стольких операциях, но сейчас вы говорите как настоящий боец спецназа, Сенсей."
1014008-95 = "Именно. Эта сцепленная рука нужна не только для того, чтобы вести кого-то вперёд."
1014008-96 = "Так что, Сенсей..."
1014008-97 = ""
1014008-99 = ""
1014008-100 = "Не отпускайте."
1014008-102 = "Я держал Куруми за руку, пока мы благополучно не вернулись в Шале."
