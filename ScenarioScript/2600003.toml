[translation]
2600003-1 = "Обычный день"
2600003-2 = "Вот вы где, Сенсей. Сюда."
2600003-3 = "Удивлены, что я предложила встретиться в игровом центре?"
2600003-4 = "Ну, обычно мы и правда встречаемся в местах куда менее... шумных."
2600003-5 = "Я предполагала, что это может застать вас врасплох."
2600003-6 = "Признаюсь, я предпочитаю спокойные места. Читальные залы, медпункт..."
2600003-7 = "...но даже мне иногда хочется сменить обстановку."
2600003-8 = "Я иногда захожу в игровые центры, как и все, и часто люблю ходить по магазинам."
2600003-9 = "Особенно в такой день, как сегодня."
2600003-10 = "...Когда у меня нет обязанностей Префектурной команды."
2600003-11 = "[s1] «Так у тебя сегодня выходной?»\n[s2] «Свободный день? Больше ни слова — я в деле!»"
2600003-12 = "Именно. Целый выходной."
2600003-13 = "Хотя не у всей Префектурной команды. Это мой личный отпуск."
2600003-14 = "..."
2600003-15 = "Потому что я... попросила его. Даже у меня бывает личное свободное время."
2600003-16 = "В любом случае, значит, я могу провести его как захочу."
2600003-17 = "..."
2600003-18 = "Т-так что, если вы не против, Сенсей..."
2600003-19 = "...я надеялась, что вы проведёте этот день со мной."
2600003-20 = "Считайте это моей благодарностью за вашу прошлую помощь."
2600003-21 = "М-мне трудно находить свободное время вне таких дней."
2600003-22 = "Я знаю, что уже повторяюсь, но..."
2600003-23 = "...вас точно всё устраивает? Я не мешаю вам?"
2600003-24 = "[s3] «Ты уверена, что хочешь провести время именно со мной?»\n[s4] «Разве не лучше погулять с товарищами по клубу?»"
2600003-25 = "Не то чтобы мне не нравилось проводить время с остальными. В этом есть своё очарование."
2600003-26 = "Не то чтобы мне не нравилось проводить время с остальными. В этом есть своё очарование."
2600003-27 = "Но даже от них иногда нужно отдыхать."
2600003-28 = "С каждой из них порой бывает непросто справиться..."
2600003-29 = "Утомляет, когда кажется, будто именно ты всё время работаешь няней."
2600003-30 = "...Простите. Наверное, звучит так, будто я только и делаю, что жалуюсь."
2600003-31 = "Будучи учителем, вы наверняка знакомы с этим чувством."
2600003-32 = "Послушайте меня, опять говорю без остановки. Наверное, я пытаюсь сказать..."
2600003-33 = "[s5] «Каждому нужен день, чтобы себя побаловать. Я рад помочь.»\n[s6] «Сегодня любое ваше желание — приказ, миледи.»"
2600003-34 = "...?!"
2600003-35 = "...?!"
2600003-36 = "Вы правда только что...?"
2600003-37 = "..."
2600003-38 = "Неважно. Я... поняла."
2600003-39 = "Не знаю, действительно ли вы не против или просто хотите меня побаловать..."
2600003-40 = "..."
2600003-41 = "Но в любом случае вы уже согласились, так что я воспользуюсь предложением."
2600003-42 = "Я вам доверяю и ещё раз скажу: спасибо за это."
2600003-43 = "...Правда."
2600003-45 = "(Чинацу неожиданно взяла меня за руку и повела за собой.)"
2600003-47 = ""
2600003-48 = ""
2600003-49 = ""
2600003-50 = ""
2600003-51 = ""
2600003-52 = ""
2600003-53 = ""
2600003-54 = ""
2600003-55 = ""
2600003-56 = ""
2600003-57 = "Затем мы пошли по расписанию, которое она составила для своего выходного."
2600003-58 = "(Сначала были игры в аркадном центре, затем кафе и хип-хоп-концерт. Последним пунктом был торговый центр.)"
2600003-59 = "(Весь день прошёл точь-в-точь по плану.)"
2600003-61 = "(Это и правда был совершенно обычный выходной.)"
2600003-62 = "Ничего необычного вообще не произошло."
2600003-65 = "(На закате Чинацу, которая шла впереди, внезапно остановилась.)"
2600003-66 = "Вот и всё, Сенсей. Мы выполнили всё расписание, которое я составила."
2600003-67 = "Ну... как вам? Для меня сегодняшний день был особенным..."
2600003-68 = "...но я пойму, если вам он показался обычным."
2600003-69 = "[s7] «Мне понравился этот редкий спокойный выходной.»\n[s8] «Конечно, он был особенным. Я провёл день с тобой!»"
2600003-70 = "..."
2600003-71 = "..."
2600003-72 = "В-вы всегда такое говорите..."
2600003-73 = "И всё же... хорошо. Рада, что вы так думаете."
2600003-74 = "Если честно, я боялась, что вы не согласитесь. Больше мне не с кем так расслабиться..."
2600003-75 = "Е-если вы не против, я бы хотела..."
2600003-76 = "...снова куда-нибудь сходить с вами вот так... в ближайшем будущем."
2600003-77 = "..."
2600003-78 = "Т-только если вы сами не против, конечно...! Если не хотите, тогда...!"
2600003-79 = "..."
2600003-80 = "Хи-хи..."
2600003-81 = "Вы порой настоящая загадка, Сенсей."
2600003-82 = "Правда будет нормально, если я снова вас приглашу?"
2600003-83 = "[s] «Разумеется»."
2600003-84 = "..."
2600003-85 = "Хорошо тогда."
2600003-86 = "Спасибо, Сенсей. Я буду ждать."
2600003-87 = "Но не думайте, что я стану часто вас беспокоить. У членов Префектурной команды не так много выходных."
2600003-88 = "..."
2600003-89 = "Это лучший способ, которым я могла выразить вам то, что давно было у меня на душе."
2600003-90 = "Так что к этому моменту вы наверняка уже поняли, что я чувствую."
2600003-91 = "..."
2600003-92 = "Н-неважно. Для меня это уже слишком."
2600003-93 = "Но... меня это устраивает."
2600003-94 = "Я рада двигаться шаг за шагом."
2600003-96 = "(Перед возвращением в клубную комнату я попрощался с Чинацу, а она проводила меня улыбкой.)"
