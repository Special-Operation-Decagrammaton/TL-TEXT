[translation]
1012803-1 = "Сладкая цена"
1012803-2 = "На следующий день я отправился в торговый квартал."
1012803-3 = "Я всерьёз искал кое-что особенное."
1012803-6 = "Я искал около двух часов, но..."
1012803-9 = "...К сожалению, так и не нашёл то, что хотел."
1012803-10 = "Однако..."
1012803-11 = "Это Сенсей?"
1012803-12 = ""
1012803-14 = ""
1012803-15 = "Какая неожиданная встреча!"
1012803-16 = "Как поживаешь?"
1012803-17 = "[s] «Хорошо. А ты, Фую?»"
1012803-18 = "У меня всё отлично, благодаря тебе!"
1012803-19 = "Я только что была в хозяйственном магазине. КТО-ТО сломал катапульту, и я решила, что лучше сразу заняться ремонтом."
1012803-20 = "А ещё собирала материалы для предстоящей инсталляции."
1012803-21 = "[s] «Так ты занимаешься не только контрабандой?»"
1012803-22 = "...Фуфу."
1012803-23 = "В любом случае, что привело тебя сюда в такой прекрасный день?"
1012803-24 = "Судя по пустой сумке, продукты ты не ищешь."
1012803-25 = "Что? Покупаешь предмет первой необходимости?"
1012803-26 = "Семиступенчатого трансформирующегося робота из термоядерного суперсплава...?"
1012803-27 = "Как здорово."
1012803-28 = "Пожалуй, такую вещь действительно можно назвать «необходимостью»."
1012803-29 = "[s] «Я не смог его найти.»"
1012803-30 = "Правда? Вот облом!"
1012803-31 = "Как наш Предпочтительный Платиновый Клиент ты должен был сразу написать мне, что ищешь его!"
1012803-32 = "[s] «Предпочтительный Платиновый Клиент...?»"
1012803-33 = "Снятые с производства товары, распроданные безделушки, потенциально смертоносные роботы..."
1012803-34 = "У Картеля есть свои способы. Мы можем найти его для тебя."
1012803-35 = "[s] «Как и ожидалось от менеджера по продажам...!»"
1012803-36 = "Акцент на слове «продажи». Это будет стоить денег. Фу-фу."
1012803-37 = "[s] «И какова цена...?»"
1012803-38 = "Эм..."
1012803-39 = ""
1012803-41 = ""
1012803-42 = "Хм..."
1012803-43 = "Ну... Эм... Хм... Сложный вопрос."
1012803-44 = "[s] «...?»"
1012803-45 = "Наверное, ты мог бы... угостить меня обедом..."
1012803-46 = "Или м-мы могли бы вместе посмотреть фильм..."
1012803-47 = "Наверное, это уже слишком. Можно что-нибудь покороче — например, просто зайти за десертом в кафе?"
1012803-48 = "[s1] «То есть мы поедим, посмотрим фильм,»\n[s2] «...а потом поболтаем в десертном кафе?»"
1012803-51 = ""
1012803-53 = ""
1012803-54 = "Ч-Ч-Ч-Ч-Что?!"
1012803-55 = "П-П-П-П-П-П-Правда?!"
1012803-56 = "То есть! Ага! Именно это я и сказала. Ты мне серьёзно задолжал. Эм..."
1012803-57 = "З-Звучит... отлично..."
1012803-59 = "Я провёл с Фую весёлый день. Мы пообедали, посмотрели фильм и вместе съели десерт."
1012803-60 = "Вскоре после этого игрушечного робота заботливо доставили в Шале."
