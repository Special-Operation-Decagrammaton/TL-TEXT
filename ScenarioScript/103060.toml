[translation]
103060-1 = "Эпизод 6; Корабль Утнапиштима 1"
103060-6 = "..."
103060-7 = "Хм, должно быть, это мостик корабля. Выглядит прямо по-настоящему!"
103060-8 = "Да. Похоже, это центр управления кораблём..."
103060-16 = "Я не слишком разбираюсь в таких летательных аппаратах, но это точно должна быть кабина управления."
103060-17 = "Пультовая довольно большая. Похоже, для управления нужно минимум десять человек."
103060-19 = "И это только внутри корабля. А ещё подумайте, сколько людей должны обеспечивать управление воздушным движением с земли."
103060-20 = "Ты права... Один танк обслуживают четыре-пять человек... а корабль такого размера..."
103060-21 = "И это артефакт с технологиями, которых мы не понимаем. Чем больше людей будет помогать интерпретировать, анализировать и обрабатывать информацию, тем лучше."
103060-22 = ""
103060-24 = ""
103060-26 = "Нам нужно собрать как можно больше студентов."
103060-27 = "Студентов, умеющих в стратегию, тактику и управление, технических специалистов, хакеров... Всех, чьи навыки пригодятся."
103060-28 = "[s] «Я созову всех, кого смогу.»"
103060-29 = "Чи, слышала? Сейчас станет очень занятно."
103060-30 = ""
103060-32 = ""
103060-33 = "*вздыхает* ...Ты неугомонная. Никто из нас уже несколько дней не отдыхал, Химари."
103060-34 = "И хуже всего... когда они узнают про межзвёздный боевой корабль, их вообще будет не остановить."
103060-39 = ""
103060-41 = "Меж!"
103060-42 = "Звёздный!"
103060-43 = "Боевой!"
103060-44 = "Корабль!"
103060-46 = "Они слишком возбуждены..."
103060-47 = "Это правда боевой корабль, созданный древней технологией? Похоже, теперь нам предстоит это выяснить!"
103060-48 = "Межзвёздный боевой корабль древней цивилизации станет вершиной наших исследовательских и инженерных достижений!"
103060-50 = "Все смеялись над идеей боевого корабля, но наши исследования были не напрасны. Алиса, твой рельсотрон — тому доказательство."
103060-52 = "Ага! Научная фантастика сейчас очень в тренде! Жанр на пике!"
103060-53 = ""
103060-55 = ""
103060-56 = "П-Подождите!"
103060-57 = "Алиса?! Что ты здесь делаешь?"
103060-58 = "Н-Ну... Я услышала, что нашли межзвёздный боевой корабль, и надеялась прийти вместе с Инженерным отделом..."
103060-59 = "Нет! Я сказала тебе оставаться в Миллениум! Мы ведь до сих пор не знаем, где президент Рио!"
103060-60 = "Что ты будешь делать, если она решит напасть прямо сейчас? Ты уязвима!"
103060-61 = "Н-Но я хочу... Я хочу стать космическим героем!"
103060-62 = "Хватит глупостей и возвращайся в Миллениум! Немедленно! Ноа охраняет академию на случай чрезвычайной ситуации."
103060-64 = "Ты холодное, расчётливое чудовище! Ты ничего не понимаешь о мечтах космических героев!"
103060-65 = "Э-Эй..."
103060-66 = "Это уже новое прозвище..."
103060-67 = ""
103060-69 = ""
103060-71 = ""
103060-72 = "Юука, если тебя беспокоит её безопасность, то ваше нынешнее местоположение, вероятно, безопаснее любого другого места в Кивотос."
103060-73 = "Ты серьёзно, Ноа?"
103060-74 = ""
103060-77 = ""
103060-78 = ""
103060-80 = ""
103060-81 = ""
103060-82 = ""
103060-84 = "Фирменный стиль президента Рио — держать всё под контролем. Район Миллениум живёт у неё на ладони."
103060-85 = "Я... Наверное..."
103060-86 = "Она может знать каждый уголок Миллениум, но про этот корабль президент не знает. Здесь безопаснее."
103060-87 = "Поэтому я отправила Алису вместе с Отделом разработки игр. Пожалуйста, присмотришь за ней?"
103060-88 = "Нет, конечно нет! Здесь небезопасно!"
103060-89 = "Не только президент охотится за Алисой!"
103060-90 = "Ух... Ну, наверное, всё-таки безопаснее, если она будет у меня на виду..."
103060-91 = ""
103060-93 = ""
103060-94 = "А-А?"
103060-95 = ""
103060-97 = ""
103060-98 = ""
103060-100 = "Алиса?! Куда она делась?!"
103060-102 = "Хи-хи. Рассчитываю на тебя, Юука. Только не переусердствуй."
103060-103 = "Ноа, я..."
103060-104 = "Мы защитим академию, так что разгладь эти морщинки, Юука."
103060-105 = ""
103060-107 = ""
103060-108 = ""
103060-109 = "*вздыхает* ...Мы сюда не играть пришли... серьёзно..."
103060-113 = "Хмм, конструкция здесь..."
103060-114 = "Сантехника и проводка проще, чем мы думали. Ну, даже древний артефакт не может нарушать гравитацию и законы физики, да?"
103060-115 = "Веритас сейчас анализирует операционную систему корабля. Скоро узнаем больше о целостности его конструкции."
103060-116 = "Отлично, отлично! Разберём его по частям!"
103060-118 = "Да! Я посмотрю вот здесь."
103060-122 = "...Анализ алгоритма нейронного кода завершён."
103060-123 = "Как успехи, Котама? Доступ получила?"
103060-124 = ""
103060-127 = ""
103060-129 = "Да, соединение с центральным процессором прошло успешно. Работает!"
103060-130 = ""
103060-132 = "Ого! Это потрясающе!"
103060-133 = "И благодаря помощи вице-президента всё заняло совсем немного времени! Я думала, с древней технологией и всем таким будут проблемы."
103060-134 = ""
103060-137 = ""
103060-139 = "Это главная операционная система корабля..."
103060-140 = "Я не узнаю язык, но, наверное, смогу разобраться."
103060-142 = "Химари, мы вошли в операционную систему. Сейчас отправляю тебе алгоритмы."
103060-143 = "Отличная работа. Спасибо, Чи."
103060-146 = ""
103060-147 = "Как успехи, Химари?"
103060-148 = "Теперь у нас есть доступ к центральной нервной системе основной системы корабля. Анализировать её первой было необходимо, потому что..."
103060-149 = "Если понять структуру нервной системы, можно одним взглядом понять принципы работы всех частей, верно?"
103060-150 = "Верно. Ты быстро схватываешь."
103060-151 = ""
103060-153 = ""
103060-155 = "Тогда с чего начнём? Что нам уже известно об этом древнем артефакте, созданном неизвестной технологией?"
103060-156 = ""
103060-161 = "...Хм."
103060-164 = "Вот его чертежи."
103060-165 = "Общая конструкция, разумеется, соответствует ожиданиям. Он оправдывает своё имя — Корабль Утнапиштима."
103060-166 = "Размеры — сто тридцать пять на двадцать три на тринадцать метров. Внутри пятнадцать зон, но мы всё ещё разбираемся в мелких деталях конструкции."
103060-168 = ""
103060-170 = "Если не считать внешнего вида, на этом корабле почти нечего использовать как оружие."
103060-171 = "Значит, он был построен не для боя, а для какой-то другой функции?"
103060-172 = "Пока рано говорить. Продолжим анализ."
103060-173 = ""
103060-177 = ""
103060-178 = "Хм..."
103060-179 = "Эм..."
103060-181 = "..."
103060-184 = ""
103060-185 = "Враг, появившийся в Кивотос, находится за пределами моего понимания."
103060-186 = "И враги, вторгающиеся извне Кивотос... ни Безымянные боги, ни забытые боги их не знают."
103060-187 = "Непостижимый враг... Похоже, он копирует те же способности Ковчега Атрахасис, построенного нами, Безымянными богами."
103060-188 = "Интересно, знаете ли вы, принцесса."
103060-189 = "Артефакт, на котором вы сейчас стоите, — грозное противоковчежное оружие, созданное нашими древними врагами, чтобы победить нас."
103060-190 = "Ваши друзья никогда не смогут понять, как его использовать."
103060-191 = "Вы понимаете, принцесса?"
103060-192 = ""
103060-194 = ""
103060-195 = "Сейчас вы находитесь на борту своего самого опасного врага."
103060-196 = "...Вы должны бежать, принцесса. Бегите как можно быстрее."
103060-197 = "Я знаю, вы отвергли меня. Я понимаю, что вы отрицали моё существование."
103060-198 = "Но всё же я ваш слуга, тот, кто должен привести вас к вашему истинному предназначению..."
103060-199 = "Несмотря на то, что вы отвергли моё существование и своё собственное, я всё равно не желаю вашей смерти."
103060-200 = "Вы не должны находиться на борту Утнапиштима, когда его двигатель запустится."
103060-201 = "Он прежде всего уничтожит вас, принцессу Безымянных богов... потому что именно для этого он существует."
103060-203 = "Моя принцесса... Вы будете полностью уничтожены."
103060-204 = "Я не приказываю вам. Это не предупреждение."
103060-205 = ""
103060-208 = "Это моя отчаянная мольба."
103060-210 = "Следующий эпизод; Корабль Утнапиштима 2"
