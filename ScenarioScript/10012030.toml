[translation]
10012030-1 = "Эпизод 3; Победа упреждающим ударом"
10012030-14 = "...Мы неплохо поработали."
10012030-15 = "После хорошей уборки наш курорт и правда выглядит неплохо."
10012030-16 = "[s1] «Ого, ты сказала „наш курорт“?»\n[s2] «Приятно видеть, что ты гордишься своей работой.»"
10012030-17 = "Я имела в виду лишь то, что теперь здесь хотя бы можно жить!"
10012030-18 = "Я имела в виду лишь то, что теперь здесь хотя бы можно жить!"
10012030-19 = "Здесь гораздо лучше, чем просто «можно жить»! Мы уже почти могли бы принимать гостей."
10012030-20 = "Не будем забегать вперёд. Нам ещё нужно провести обслуживание и ремонт, чтобы всё заработало."
10012030-21 = "Нужно запустить всё в электрощитовой, оборудовать зоны отдыха..."
10012030-22 = "Подготовительной работы ещё много."
10012030-23 = "Но спорить не буду — удивительно видеть, насколько всё изменилось с нашего приезда."
10012030-24 = "Не ожидала, что всё это окажется настолько приятной разрядкой."
10012030-25 = "Ладно, хватит хвалить себя. Пойдём в электрощитовую."
10012030-26 = "...Сначала еда."
10012030-27 = ""
10012030-29 = ""
10012030-31 = "Еда?"
10012030-33 = "Очевидно. На необитаемом острове добыча еды и воды — главный приоритет для выживания."
10012030-34 = "В-Выживания?"
10012030-35 = "«Выживание» звучит немного слишком серьёзно... У нас даже связь на телефонах есть, так что всё должно быть нормально."
10012030-36 = "В такой среде можно использовать рыбалку как источник белка."
10012030-37 = "Чтобы выжить, необходимо учитывать подобные вещи."
10012030-38 = "...Её не переубедить."
10012030-39 = ""
10012030-41 = ""
10012030-42 = "Какое совпадение... У нас тут как раз есть рыболовное снаряжение."
10012030-43 = ""
10012030-45 = ""
10012030-46 = "Все приготовления к выживанию завершены. Теперь приступаем."
10012030-47 = ""
10012030-49 = ""
10012030-50 = ""
10012030-51 = "...Это не совпадение. Я сама упаковала рыболовные снасти."
10012030-52 = "Ну-ну. Не будем портить ей настроение."
10012030-53 = "Аяне, может, займёмся электричеством после наших мероприятий по выживанию?"
10012030-55 = "Хаха. Мне всё равно, в каком порядке делать дела. Хорошо!"
10012030-56 = "Но я не знала, что ты любишь рыбачить, Широко. Для Абидоса это не самое обычное хобби."
10012030-57 = "Дело не в рыбалке. Дело в выживании."
10012030-58 = "...Понятно. Наверное."
10012030-59 = ""
10012030-62 = ""
10012030-63 = "Мне — нет, но остановить её теперь точно невозможно."
10012030-64 = "Кстати об этом, Сенсей?"
10012030-65 = "[s3] «Конечно. Я люблю рыбалку.»\n[s4] «Да. Я пойду с Широко.»"
10012030-66 = "Сенсей?"
10012030-67 = "Сенсей?"
10012030-68 = "Вы тоже идёте?"
10012030-70 = "Спасибо! Пожалуйста, присмотрите за ней, Сенсей!"
10012030-71 = "Мы можем поискать еду здесь! Наверняка тут много вкусных фруктов!"
10012030-72 = "Ты только поймай что-нибудь огромное!"
10012030-74 = "Хорошо."
10012030-75 = ""
10012030-77 = ""
10012030-78 = "Я вас не разочарую."
10012030-80 = ""
10012030-82 = ""
10012030-86 = "Мы с Широко нашли плоский камень прямо у берега."
10012030-87 = "[ns5] «Здесь должно быть хорошо, да?»\n[ns6] «Тут много хороших мест для рыбалки.»"
10012030-88 = "Да. Подойдёт."
10012030-89 = "Да. Но это место подойдёт."
10012030-90 = "Удочка, прикормка, наживка, садок... Все необходимые инструменты у нас есть."
10012030-91 = "[s] «А подсак, чтобы вытаскивать пойманную рыбу?»"
10012030-92 = "В нём нет необходимости."
10012030-93 = "Сенсей, ваша задача — держать удочку..."
10012030-94 = "...а моя — стрелять в рыбу."
10012030-95 = "[s] «А, логично.»"
10012030-96 = ""
10012030-99 = "[ns] «...Вообще-то, можешь повторить?»"
10012030-100 = "Я буду стрелять в рыбу. Мёртвая рыба не убежит."
10012030-101 = "Хм?"
10012030-102 = "Рыба может развалиться, если я выстрелю в неё из оружия?"
10012030-103 = "Эм... Ой..."
10012030-104 = "[s7] «Ты забыла, что потом эту рыбу надо есть, да?»\n[s8] «...Пойдём за сачком.»"
10012030-105 = "Наверное..."
10012030-106 = "Хорошо..."
10012030-107 = "Хорошо, что он у меня как раз с собой."
10012030-108 = "...Аяне?"
10012030-109 = ""
10012030-112 = "Я чувствовала, что что-нибудь пойдёт не так."
10012030-113 = "[s9] «Аяне? Что ты здесь делаешь?»\n[s10] «Ты всё это время шла за нами?»"
10012030-114 = "Н-Ну... Я переживала, что вы пойдёте вдвоём..."
10012030-115 = "Н-Ну... Я переживала, что вы пойдёте вдвоём..."
10012030-116 = "И остальные тоже переживали... поэтому я пошла следом..."
10012030-117 = "...Понятно. Спасибо, Аяне."
10012030-119 = "Тогда я выстрелю в рыбу из оружия Аяне."
10012030-120 = "Неважно, из какого оружия ты будешь стрелять... в рыбу стрелять нельзя."
10012030-121 = "Если мы собираемся её есть, рыбу нужно поймать живой. Пожалуйста, используй сачок, который я принесла."
10012030-122 = "...Хорошо."
10012030-123 = "[s] «Широко довольно хорошо слушается Аяне.»"
10012030-124 = "М-Мне?!"
10012030-125 = "В-Вы ошибаетесь! Широко просто..."
10012030-126 = "Слушаюсь. Потому что Аяне всегда принимает правильные решения."
10012030-127 = "Ч-Что?"
10012030-128 = "На решения Аяне всегда можно положиться. Мы все так думаем."
10012030-129 = "Я собиралась попросить Аяне осмотреть пойманную рыбу."
10012030-130 = "Съедобна ли она, ядовита ли..."
10012030-132 = "...или вообще стоит ли она каких-нибудь денег."
10012030-134 = "Ох..."
10012030-135 = "Нашли тебя!"
10012030-136 = ""
10012030-138 = ""
10012030-140 = "Это не те придурки, с которыми мы дрались раньше."
10012030-141 = "Наверное, это остальные из их команды."
10012030-142 = "Отлично! Разделяй и властвуй!"
10012030-144 = "Эм... Мы знакомы?"
10012030-146 = "Хи-хи-хи. На этот раз всё будет не по-вашему. Мы привели подкрепление."
10012030-147 = "Разве я не говорила, что при следующей встрече вы заплатите?"
10012030-148 = "Вакамо!"
10012030-150 = ""
10012030-152 = ""
10012030-153 = "[ns] «...?»"
10012030-155 = "[ns] «...Кто???»"
10012030-156 = ""
10012030-157 = "Это... Это и было то срочное дело, из-за которого вы прибежали ко мне плакаться?"
10012030-158 = "Какая скука. Вам понадобилось подкрепление против двух жалких противников?"
10012030-159 = "Вы не способны победить даже маленьких муравьёв и надеетесь выиграть охоту?"
10012030-160 = "Хм?"
10012030-161 = "...!"
10012030-162 = "...Что я вижу?"
10012030-163 = "Сенсей?"
10012030-164 = "[s11] «...Вакамо?»\n[s12] «Вот это поворот.»"
10012030-165 = "...?"
10012030-166 = "...?"
10012030-167 = "Что...? Что здесь происходит?"
10012030-169 = ""
10012030-171 = ""
10012030-172 = "......"
10012030-174 = "Мне... мне нужна минутка."
10012030-175 = ""
10012030-177 = ""
10012030-178 = "...А-Аааа?!"
10012030-179 = "[s13] «Широко?!»\n[s14] «Без предупреждения?»"
10012030-182 = "Да."
10012030-183 = "Лучшая защита — это нападение. Прошу, ведите, Сенсей."
