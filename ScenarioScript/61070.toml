[translation]
61070-1 = "Эпизод 7;Гармоника"
61070-2 = "Итак, Сенсей."
61070-3 = "Ваш план — доставить эти экзаменационные листы..."
61070-4 = "...и помочь студентам Ариуса подготовиться к экзамену, верно?"
61070-5 = ""
61070-7 = ""
61070-8 = ""
61070-9 = ""
61070-10 = "[ns] «Да. Желательно под названием „Комплексный экзамен Ариуса“.»"
61070-11 = "Да, то, как это будет представлено, очень важно."
61070-12 = "Нагиса сказала то же самое."
61070-13 = ""
61070-14 = "Если учесть название «Комплексный экзамен Тринити»..."
61070-15 = "Студентам Ариуса было бы почти невозможно его принять. И кто тогда будет проверять работы?"
61070-16 = "С вопросами с вариантами ответа всё просто. Но задания со свободным ответом более субъективны и создают больше проблем."
61070-17 = "Если по случайности лишний экземпляр Комплексного экзамена Тринити..."
61070-18 = "...окажется в руках отряда, а те доставят его в Ариус..."
61070-19 = "Разумеется, Тринити замнёт это дело."
61070-20 = "Хм, возможно, произошла ошибка при печати. Или груз по ошибке направили через станцию Каваниси. Там постоянно что-нибудь теряется."
61070-21 = "Управлять школой и правда непросто."
61070-23 = "Ошибка доставки... Значит, мы будем одновременно курьерами и телохранителями."
61070-24 = "...А что насчёт оплаты?"
61070-25 = "[s] «Не волнуйся. Я прослежу, чтобы вам достойно заплатили.»"
61070-26 = "..."
61070-27 = "Я это запомню."
61070-28 = "[s] «А ещё у меня есть свой маленький секретный план!»"
61070-29 = "У-У вас есть?! Ч-Что за план? Я хочу знать!"
61070-30 = "Не подначивай его. Когда Сенсей так себя ведёт, можно не сомневаться — опять придумал какую-нибудь глупость."
61070-32 = "Но я всё равно немного заинтригована. Уверена, ожидание того стоит."
61070-33 = ""
61070-34 = "Однако это не решает всех наших проблем."
61070-35 = "Сложно сдавать экзамен, не изучив материал заранее."
61070-36 = "А я совершенно не знаю, какое образование получают в Ариусе. Боюсь, содержание экзамена окажется для них слишком незнакомым."
61070-37 = "Именно поэтому я попросила вас помочь, Сенсей."
61070-38 = "Так что ещё раз спасибо. И прошу прощения, что взвалила это на вас, отряд Ариус."
61070-39 = ""
61070-41 = ""
61070-42 = "Я понимаю, что всё, что мы сейчас делаем, идёт вразрез с привычным порядком."
61070-43 = "Если люди узнают, что Тринити пытается хоть как-то влиять на дела Ариуса..."
61070-44 = "Большинству это покажется немыслимым."
61070-45 = "В конце концов, мы две полностью самостоятельные организации..."
61070-46 = "Что вы об этом думаете?"
61070-47 = "Я благодарна вам, Нагиса."
61070-48 = ""
61070-50 = ""
61070-51 = "Пока я могу сказать лишь, что благодарна за выбранный вами путь."
61070-52 = "У вас было множество возможностей навязать Ариусу свою власть."
61070-53 = "Пусть ненадолго, но в прошлый раз Тринити действительно удалось захватить и оккупировать Ариус."
61070-55 = "Такой силовой подход ни к чему бы нас не привёл."
61070-56 = "Именно поэтому я, Кирифуджи Нагиса, обратилась в Шале не как хозяйка Чаепития, а просто как студент."
61070-57 = ""
61070-58 = "Знаете, трудно придумать более окольный способ решить сравнительно простую проблему."
61070-59 = "П-Политика всегда такая...? Страшно... очень страшно..."
61070-61 = "Такой танец — часть жизни в обществе. Понятно."
61070-62 = "Должна признать, Кирифуджи Нагиса меня впечатлила."
61070-63 = "А? Лидер? Ты теперь поддерживаешь Чаепитие?"
61070-64 = "Я-Я не это имела в виду..."
61070-66 = "Мисаки. Когда появляется возможность, можем ли мы позволить себе привередничать, у кого учиться?"
61070-67 = "Мы слишком многого не знаем об этом мире."
61070-68 = "Цок..."
61070-69 = ""
61070-70 = "Субару! Пожалуйста, сыграешь нам на губной гармошке?"
61070-71 = "Ну пожааалуйста! Ты так давно не играла!"
61070-72 = "Ч-Что?! Прямо сейчас...?"
61070-73 = "Да ладно! Ты ведь не будешь из-за этого стесняться?"
61070-74 = "Просто... ну..."
61070-75 = "Играть на гармошке среди этих руин и делать вид, будто мы предаёмся чувствам..."
61070-76 = "Последнее время я думаю..."
61070-77 = "...может, мы уже немного выросли из этого."
61070-78 = "Ого! Субару сейчас краснеет?"
61070-79 = "Ха-ха-ха! Кто бы мог подумать, что даже Субару умеет смущаться! Сегодня мы стали свидетелями редчайшего события!"
61070-80 = "Э-Эм... Меня долго не было, так что... я тоже очень хочу снова услышать, как ты играешь, Субару."
61070-81 = "Ух! Не смотри на меня этими щенячьими глазами!"
61070-83 = "Я... что-то сделала не так...?"
61070-84 = "Это уже нечестный приём!"
61070-85 = "...Не вижу причин отказываться."
61070-86 = "УРА-А-А!!"
61070-87 = ""
61070-89 = ""
61070-90 = ""
61070-91 = "Иногда я действительно слишком позволяю вам помыкать мной."
61070-92 = "Ну, раз уж вы загнали меня в угол..."
61070-93 = ""
61070-95 = ""
61070-96 = ""
61070-97 = ""
61070-99 = ""
61070-101 = "Даже если я возьму неправильную ноту, не хочу услышать ни единого звука недовольства!"
61070-102 = "Ты всегда так говоришь!"
61070-103 = "И никогда на самом деле не ошибаешься!"
61070-105 = "Я помню день, когда Мадам запретила музыку..."
61070-106 = "Но ещё лучше помню, как ты тайком играла для нас, когда её не было рядом."
61070-107 = "Для меня это никогда не звучало неловко или скованно..."
61070-108 = "Я ничего не понимаю в музыке, но мне кажется, ты правда очень хорошо играешь, Субару!"
61070-109 = ""
61070-111 = ""
61070-112 = "Надеюсь, ты понимаешь, что лестью ничего не добьёшься!"
61070-113 = "..."
61070-114 = "В-В любом случае..."
61070-115 = "Я начинаю... Хорошо?"
61070-116 = ""
61070-118 = ""
61070-127 = "Ого..."
61070-128 = "Я правда очень по этому скучала."
61070-129 = ""
61070-130 = "(Звук её игры...)"
61070-131 = "(Такое чувство, будто меня встречают тёплыми, распахнутыми объятиями.)"
61070-148 = "Мы и правда вернулись."
61070-149 = "...Да. Похоже на то."
61070-150 = "*вдох*... *выдох*..."
61070-151 = "Мисаки? Ты в порядке?"
61070-152 = "Всё нормально. Я в порядке."
61070-153 = "..."
61070-154 = "Всё в порядке. Я понимаю."
61070-156 = "...Ага."
61070-157 = "Э-Э-Эм... В-Вы правда думаете, что нам нормально вот так вернуться сюда?"
61070-158 = "Я знаю, мы уже много раз это обсуждали..."
61070-159 = "Но теперь, когда мы действительно здесь... мне как-то... не по себе? Неспокойно?"
61070-160 = "[ns] «Ты права, Хиёри. Хорошо сказано.»"
61070-161 = "Я... Я забыла, что и вы здесь не впервые, Сенсей..."
61070-162 = "Если честно, Хиёри, скорее всего, права."
61070-163 = "...Вряд ли в Ариусе нам будут рады."
61070-165 = "Для тех, кто остался, мы всего лишь предательницы."
61070-166 = "Да. Скорее всего, именно так большинство нас и воспринимает."
61070-167 = "..."
61070-168 = "После нашего ухода руководство взяла на себя Субару, верно?"
61070-169 = "Есть..."
61070-170 = ""
61070-171 = "Вообще-то мы уже несколько раз отправляли посланниц в Ариус, пытаясь установить контакт с оставшимися студентами."
61070-172 = "И как они отреагировали?"
61070-173 = "...Скажем так, Рыцарям исправительного курса пришлось заняться своими изначальными обязанностями — помощью и лечением."
61070-174 = "Единственное, что нам удалось узнать, — имя студента, который ими руководит."
61070-175 = "Какахаси Субару."
61070-176 = "...!"
61070-177 = ""
61070-178 = "[ns] «Что Субару за человек?»"
61070-179 = "Хм-м... Сао-Сао знает её лучше всех."
61070-180 = "..."
61070-181 = "Не могу сказать, что знаю о ней всё, но..."
61070-182 = "На первый взгляд она кажется общительной и харизматичной. Но одновременно всегда ощущалось, будто между вами есть дистанция, которую никак не преодолеть."
61070-184 = "Уф. Ненавижу такое. Можно вести себя хоть немного последовательнее?"
61070-185 = ""
61070-187 = ""
61070-188 = "Хотя это действительно довольно точное её описание."
61070-189 = "[ns] «Хм. Значит, не похоже, что она полностью отгородится от вас.»"
61070-190 = "Это более позитивный способ на это посмотреть, но..."
61070-191 = "Ну, зная вас, вы всё равно попытаетесь с ней поговорить, что бы я ни сказала."
61070-192 = "Тогда все готовы?"
61070-193 = ""
61070-195 = ""
61070-196 = "Отряд Ариус, выдвигаемся."
61070-197 = ""
61070-199 = ""
61070-200 = "Приятно снова слышать это от тебя."
61070-204 = ""
61070-205 = "Сенсей."
61070-206 = "Можно с вами поговорить? Возможно, это наш последний шанс спокойно поговорить."
61070-207 = "Я не понимаю... почему вы так мало заботитесь о собственном благополучии. Вы бросаетесь в опасность, даже не задумываясь."
61070-208 = "П-Простите. Я-Я не злюсь. Я не это имела в виду."
61070-209 = ""
61070-211 = ""
61070-212 = "..."
61070-213 = "Я больше не хочу видеть, как вы получаете ранения или страдаете."
61070-214 = "Ни душевно, ни физически."
61070-215 = "[s] «Одной твоей заботы уже достаточно, чтобы придать мне сил, Саори!»"
61070-216 = "П-Правда? Значит, если я буду сильнее за вас переживать, то смогу вас защитить?"
61070-217 = "...С моей стороны это было по-детски. Наверное, я хочу, чтобы всё складывалось удобно и именно так, как хочу я."
61070-218 = "Хм? С чего вдруг такие мысли?"
61070-219 = "..."
61070-220 = "Ну, не знаю. Наверное, потому что мы здесь, в Ариусе."
61070-221 = "Здесь воспоминания возвращаются особенно ярко. Всё ощущается куда сильнее."
61070-222 = "..."
61070-223 = "С-Сенсей?"
61070-224 = "..."
61070-225 = "Сенсей, я давно хотела извиниться—"
61070-226 = ""
61070-229 = "[ns] «А, точно! Чуть не забыл! Переведённые студенты!»"
61070-230 = "А-А?"
61070-231 = "[s] «Они попросили меня передать вам кое-что: „Спасибо“.»"
61070-232 = "Что...?"
61070-233 = "Почему?"
61070-234 = ""
61070-235 = "Единственное, что мы сделали как отряд Ариус..."
61070-236 = "Хотя, наверное, если бы не мы, они вообще не смогли бы перевестись."
61070-238 = "Н-Но... всё то, что мы сделали..."
61070-239 = "Я думала, это всё было... очень плохо... разве нет?"
61070-240 = "Да, плохо. Мы никогда не должны были этого делать."
61070-241 = "Уааа! Уааа! Я так и знала!!"
61070-242 = ""
61070-243 = "[ns3] «Как бы то ни было, те переведённые студенты...»\n[ns4] «...действительно были вам всем благодарны.»\n[ns5] «Это чистая правда.»"
61070-247 = "..."
61070-248 = "Что вообще такое «правда», Сенсей?"
61070-249 = "Или даже «история»?"
61070-250 = "[s6] «Мой ответ прозвучит старомодно.»\n[s7] «Мы учимся, чтобы открывать и понимать „истину“, верно?»"
61070-253 = "Хех. Стоило ожидать именно такого ответа."
61070-254 = "Вы действительно учитель."
61070-255 = "Хм? А раз вы учитель, вам можно задать ещё один вопрос?"
61070-256 = "[s] «Вы все не забрасываете учёбу?»"
61070-257 = "Ага. Конечно, Сенсей. Как бы трудно в это ни было поверить, мне довольно нравится учиться."
61070-258 = "Хех. Хи-хи... Мне тоже! Вы ведь постоянно с таким трудом тайком передаёте нам Blu-ray и конспекты!"
61070-259 = "...Только когда мне совсем нечем заняться."
61070-260 = "Я тоже занимаюсь. Для моей работы полезно лучше понимать, как устроено общество."
61070-261 = "...То есть ровно то, что вы нам только что объясняли. Ацуко была права. Вы И ПРАВДА учитель, Сенсей."
61070-262 = ""
61070-263 = "[ns8] «Мой грандиозный план...»\n[ns9] «...обретает форму!»"
61070-266 = "...Сенсей, чем сильнее вы радуетесь, тем тревожнее становится мне."
61070-267 = "Э-Эм! Все!"
61070-268 = "Что такое, Хиёри?"
61070-269 = "Ах."
61070-270 = "Л-Лидер..."
61070-272 = "Мы наконец..."
61070-273 = "Мы вернулись домой."
61070-274 = ""
61070-275 = "*шмыгает носом* Это было... так трогательно, Субару."
61070-276 = "На бис! На бис!"
61070-277 = "Не сегодня..."
61070-278 = "Ну почему?! Пожалуйста, пожалуйста, пожалуйста! Ничего страшного, если ты стесняешься!"
61070-279 = "Нет, дело просто в том..."
61070-280 = "Я просто не знаю других песен."
61070-281 = "А... Ну да, логично. Мы ведь не можем просто сходить в магазин и купить новые ноты."
61070-282 = "Ладно, хорошо—"
61070-283 = ""
61070-287 = "С-Субару! Субару! П-Прямо сейчас! Там снаружи! Это...!"
61070-288 = "Всё хорошо. Успокойся. Что случилось?"
61070-289 = "Н-Ну!"
61070-290 = "Отряд и Сенсей из Шале только что вошли в Ариус!"
61070-291 = ""
61070-293 = ""
61070-294 = "Отряд...?!"
61070-295 = "И у них хватило наглости показать здесь свои лица!"
61070-296 = "Им здесь больше не место!"
61070-297 = ""
61070-298 = "..."
61070-299 = "Я их не пущу!"
61070-300 = "Согласна! Я никогда их не прощу."
61070-301 = "Устроим им тот же приём, что и тем «посланницам» из Тринити!"
61070-303 = "Подождите."
61070-304 = "Ты сказала, с ними Сенсей из Шале?"
61070-305 = "Д-Да, всё верно!"
61070-306 = "..."
61070-307 = "Значит, на этот раз они решили подумать головой..."
61070-308 = "Или, может, это их самих завербовали..."
61070-309 = "Что ты имеешь в виду?"
61070-310 = "Послушайте, все."
61070-311 = "Если бы это был только отряд, я бы даже не стала тратить на них время."
61070-312 = "Но проблема в этом взрослом. Сенсее из Шале."
61070-313 = "Одно его присутствие означает, что нам придётся действовать осторожно."
61070-314 = ""
61070-317 = ""
61070-318 = "Почему?"
61070-319 = "Ты серьёзно? Вспомни, что этот взрослый здесь уже сделал!"
61070-320 = "Именно он заставил Мадам исчезнуть, помнишь?"
61070-321 = "Д-Да, но почему... А!"
61070-322 = "Именно."
61070-323 = "Мы понятия не имеем, что этот взрослый может сделать и какими силами обладает."
61070-324 = "Взрослые такие и есть. Мы понятия не имеем, что они могут сделать с Ариусом... или с нами."
61070-325 = "...Ты права."
61070-326 = "Они совершают самые немыслимые вещи так буднично, будто завтракают."
61070-328 = "Т-Тогда что нам делать, Субару?"
61070-329 = "Не паникуй. Всё нормально."
61070-330 = "..."
61070-331 = "Мы выйдем и встретим их."
61070-332 = "Ч-Что? Серьёзно?!"
61070-333 = "Не могу гарантировать, что это правильный путь или самый безопасный."
61070-334 = "Но я лучше попробую что-нибудь сделать, чем просто сдамся перед ними. Разве нет?"
61070-335 = "А пока..."
61070-336 = "Предохранители не снимать. Не выключайте их. Пока что."
61070-337 = "Поняла, Субару!"
61070-338 = ""
61070-340 = "Следующий Эпизод;По-ариусски"
