[translation]
2300606-1 = "День перезарядки"
2300606-2 = "(У входной двери Момоёдо меня встретила табличка.)"
2300606-3 = "(«Сегодня Момоёдо откроется в 13:00.»)"
2300606-4 = "[s] «Точно. Она сказала мне воспользоваться задней дверью.»"
2300606-8 = "(Внутри заведения непривычно тихо.)"
2300606-9 = "(Посреди этой тишины...)"
2300606-10 = "О! Сенсей, вы пришли."
2300606-14 = "― Хи-хи. С возвращением, Господин.[wa:3260]"
2300606-17 = "[ns] «Ты выглядишь куда более расслабленной.»"
2300606-18 = "— Ещё бы![wa:190]"
2300606-20 = "― Я прямо сейчас бездельничаю![wa:2480]"
2300606-23 = "― Это немного забавно.[wa:830]"
2300606-25 = "― Вообще-то,[wa:600]"
2300606-28 = "― это[wa:430]"
2300606-30 = "― против правил.[wa:260]"
2300606-33 = "― Но когда я с вами...[wa:80]"
2300606-35 = "― ...мне так спокойно.[wa:590]"
2300606-38 = "― Садитесь рядом со мной, Сенсей.[wa:2130]"
2300606-40 = "― Это из-за вас я так изменилась, так что пора вам взять за это ответственность."
2300606-43 = "Отлично. Теперь я чувствую, что восстановила силы."
2300606-44 = "Шизуко вернулась!"
2300606-45 = "Благодаря вам у меня хватит энергии на всю сегодняшнюю смену."
2300606-46 = "Спасибо, Сенсей."
2300606-47 = "[s] «Пустяки.»"
2300606-48 = "Так что я могу рассчитывать на вас до конца дня?"
2300606-49 = "Хи-хи."
2300606-51 = "(Я провёл вторую половину дня, помогая Шизуко с работой в Момоёдо.)"
