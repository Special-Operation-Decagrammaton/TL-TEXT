[translation]
2600803-1 = "Но... ради чего всё это было?"
2600803-2 = ""
2600803-5 = ""
2600803-6 = "Я шёл вдоль пляжа, где должен был встретиться с Шизуко, пока наконец не заметил её."
2600803-7 = "О... Сенсей?"
2600803-8 = "Вы пришли очень рано."
2600803-9 = "Неужели так сильно по мне соскучились?!"
2600803-10 = "[s] «Я просто переживал, что это ты по мне соскучилась.»"
2600803-11 = "Нет! Пожалуйста, держите фантазию под контролем!"
2600803-12 = "[s] «Это было немного обидно...»"
2600803-13 = "Вы сами меня спровоцировали!"
2600803-14 = "Вы взрослый и учитель, между прочим!"
2600803-15 = "Мне ведь должно быть можно немного с вами пошутить, да?!"
2600803-16 = "[s] «Всё нормально? Ты выглядишь чем-то озабоченной.»"
2600803-17 = "Почему вы такой наблюдательный? Я просто хотела заговорить свои проблемы пустой болтовнёй."
2600803-18 = "Сенсей, вам нужно научиться проще относиться к жизни!"
2600803-19 = "Ладно... Расскажу, что у меня на уме."
2600803-21 = "Как вы и советовали, я наблюдала за франшизой пляжного кафе «Момоёдо»..."
2600803-22 = "Клиенты..."
2600803-23 = "Ну, клиенты выглядели не очень довольными."
2600803-24 = "[s] «В каком смысле?»"
2600803-26 = "Эм... Это всего лишь догадка, так что я могу ошибаться, но..."
2600803-27 = "На еду они не жаловались..."
2600803-28 = "И большинство говорило, что им очень нравится оформление!"
2600803-29 = "Клиенты выглядели расслабленными и довольными, но..."
2600803-31 = "А-а-а! Куда бы я ни пошла, у меня в голове звучат их слова!"
2600803-32 = "Они сказали, что, судя по репутации «Момоёдо»..."
2600803-33 = "...пляжное кафе не кажется чем-то особенно уникальным или выдающимся!"
2600803-34 = "Мне так обидно и грустно!"
2600803-35 = "[s] «П-Подожди, Шизуко, давай успокоимся.»"
2600803-36 = "Как мне успокоиться?!"
2600803-37 = "Это кризис! Я загнана в угол!"
2600803-39 = "Так мы потеряем доверие клиентов!"
2600803-40 = "Каждый филиал, один за другим!"
2600803-41 = "Эти слова разлетятся как пожар!"
2600803-42 = "И мы ничего не сможем сделать против силы сарафанного радио!"
2600803-43 = "Это будет удар по гордости и бренду «Момоёдо»!"
2600803-44 = "Это будет полная катастрофа! Ещё хуже, чем сейчас!"
2600803-45 = "Если это случится... А-а-а! Если это случится...!"
2600803-46 = "[s] «Всё нормально! Уверен, до такого не дойдёт!»"
2600803-48 = "Как вы можете говорить это так уверенно?!"
2600803-49 = "[s] «Потому что это моя интуиция и надежда?»"
2600803-50 = "Это вообще не помогает! У-а-а-а!"
2600803-51 = "[s] «Я понимаю, но, Шизуко...»"
2600803-53 = "[ns] «Мы ничего не забываем?»"
2600803-54 = "А? Нет, я никогда ничего не забываю."
2600803-55 = "Моя принадлежность? Конечно же, к Отделу организации фестивалей."
2600803-56 = "Бизнесы «Момоёдо» — один из способов собирать средства на фестивали."
2600803-57 = "Это не самый эффективный способ и очень тяжёлая работа."
2600803-58 = "А теперь ещё и франшиза пляжного кафе..."
2600803-59 = "Работы становится всё больше и больше!"
2600803-60 = "Почему я продолжаю всё это делать? Потому что..."
2600803-61 = "Я... люблю фестивали, наверное?"
2600803-62 = "[s] «Да, но можно я выскажу своё мнение?»"
2600803-64 = "[ns] «Мне кажется, тебе нравится заставлять других улыбаться.»"
2600803-65 = ""
2600803-67 = ""
2600803-68 = "Это... правда..."
2600803-70 = "Когда фестиваль наконец открывается после всех трудностей подготовки..."
2600803-71 = ""
2600803-74 = ""
2600803-75 = ""
2600803-76 = ""
2600803-77 = "...когда клиенты «Момоёдо» благодарят меня и улыбаются..."
2600803-78 = ""
2600803-81 = ""
2600803-82 = ""
2600803-83 = ""
2600803-84 = "...когда мы все объединяемся, чтобы пережить вечерний наплыв..."
2600803-86 = "работа уже не кажется такой тяжёлой."
2600803-87 = "[s] «Наверное, прибыль „Момоёдо“ и пляжного кафе тоже помогает?»"
2600803-88 = "Определённо помогает..."
2600803-89 = "Но это не главный приоритет."
2600803-90 = "Чего я действительно хотела добиться для пляжного кафе... Хм..."
2600803-91 = "Я хотела, чтобы оно ощущалось как настоящее лето!"
2600803-92 = "Хотела, чтобы людей захватывало летнее настроение, как только они войдут!"
2600803-93 = "А ещё хотела показать вам свой купальник во время летних каникул..."
2600803-94 = "Ик... Что со мной не так?!"
2600803-95 = "[s] «Шизуко...?»"
2600803-96 = "Что?! А?"
2600803-97 = "Ничего! Забудьте!"
2600803-98 = "Вот! Поэтому я и не хотела говорить о своих проблемах."
2600803-99 = "Просто забудьте весь этот разговор прямо сейчас! Быстрее!"
2600803-100 = ""
2600803-106 = ""
2600803-107 = "Эй, эй. Что вы делаете на нашем пляже?"
2600803-108 = "Вы не знаете, кто мы?"
2600803-109 = "Мы новые владельцы этого острова. Проявите уважение!"
2600803-111 = "Как раз то, что мне сейчас было нужно. Ух."
2600803-113 = "Ты нам сейчас дерзишь?"
2600803-114 = "Мы никому не позволяем нас не уважать!"
2600803-115 = "Мы сейчас... мы сейчас..."
2600803-116 = "(Можешь подраться за меня? Я не справлюсь.)"
2600803-117 = "(Нет, я ни разу не выигрывал драку! Давай просто продолжать блефовать!)"
2600803-119 = "Вообще-то, может, это и правда именно то, что мне сейчас нужно."
2600803-120 = ""
2600803-122 = ""
2600803-123 = "К вашему несчастью, пляжное кафе имеет право отказать в обслуживании!"
2600803-124 = "Я выплесну на вас всё своё раздражение и смущение!"
2600803-125 = ""
2600803-132 = "Ай! Ай, больно! Что ты делаешь?!"
2600803-133 = "Я-я сдаюсь! Сдаюсь! Прекрати!"
2600803-134 = "Думаешь, сможешь убежать? А?! Стоять!"
2600803-135 = ""
2600803-140 = "Мне едва удалось успокоить Шизуко, прежде чем мы вернулись в общежитие."
