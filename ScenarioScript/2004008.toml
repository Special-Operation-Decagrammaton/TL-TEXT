[translation]
2004008-1 = "Сацуки дрожит"
2004008-2 = ""
2004008-3 = "Привет, Сенсей."
2004008-4 = "[s] «Привет, Сацуки. Боюсь, у меня снова очень загруженный день.»"
2004008-5 = "Хи-хи, конечно. Вы работаете в Шале — одном из важнейших учреждений Кивотоса..."
2004008-6 = "...настоящей сокровищнице совершенно секретной информации, скрытой от масс."
2004008-7 = "А как глава Разведывательного комитета, одной из важнейших организаций Геенны, я идеально подхожу на роль вашего представителя учеников."
2004008-8 = "И через вашу работу я соберу всю информацию, до которой смогу дотянуться."
2004008-9 = "[s1] «Там просто куча скучной бумажной работы...»\n[s2] «Вот. Рассчитываю на тебя.»"
2004008-12 = ""
2004008-15 = "Это... довольно внушительная гора."
2004008-16 = "Вы проверяете мою способность выделять важное?"
2004008-17 = "Что ж, логично. Разведывательный комитет обязан уметь искать иголки в стоге сена."
2004008-18 = "Я закончу это в мгновение ока."
2004008-20 = "Жаль, что один только энтузиазм не ускоряет эту работу."
2004008-22 = "Мы закончили лишь поздно ночью."
2004008-23 = ""
2004008-25 = "Ну как я справилась, Сенсей? Я же закончила всё для вас в два счёта, верно?"
2004008-26 = "[s] «Ага... Отличная работа.»"
2004008-27 = "Всегда приятно продемонстрировать свои навыки обработки информации."
2004008-28 = "Когда вашим представителем учеников становлюсь я, можете быть уверены: работа в надёжных и быстрых руках. Хи-хи."
2004008-29 = "Хм, я проголодалась. Сенсей, не хотите пойти и взять что-нибудь—"
2004008-30 = ""
2004008-32 = ""
2004008-34 = ""
2004008-35 = "О, что происходит?"
2004008-36 = ""
2004008-38 = ""
2004008-40 = ""
2004008-42 = ""
2004008-45 = ""
2004008-46 = "...!"
2004008-47 = "[ns] «Отключили электричество.»"
2004008-48 = ""
2004008-49 = "[ns] «Всё нормально. Работа закончена. Я всё сохранил.»"
2004008-50 = "..."
2004008-51 = "[s] «Сацуки...?!»"
2004008-52 = "..."
2004008-53 = "[s3] «Сацуки?»\n[s4] «Ты в порядке?»"
2004008-56 = "*ахает*"
2004008-57 = "Я в порядке. Просто... не ожидала, что вдруг станет настолько темно."
2004008-58 = "Отключение света в такое время — нехорошо..."
2004008-59 = "[s] «Да. Как раз пора заканчивать работу...»"
2004008-60 = ""
2004008-64 = "...!"
2004008-65 = ""
2004008-67 = ""
2004008-69 = ""
2004008-70 = "[ns] «А, наверное, ветер распахнул то окно.»"
2004008-71 = ""
2004008-72 = ""
2004008-73 = ""
2004008-74 = "[ns] «С-Сацуки?!»"
2004008-75 = ""
2004008-76 = "Я просто испугалась громкого звука, ясно?"
2004008-77 = ""
2004008-80 = "*вдох* *выдох* Сенсей? Где вы? Я вас не вижу. Тут слишком темно..."
2004008-81 = "...Вы там? Хорошо. Не двигайтесь. Я иду к вам."
2004008-82 = ""
2004008-84 = ""
2004008-85 = "Просто продолжайте издавать какие-нибудь звуки, чтобы я знала, где вы."
2004008-86 = "Свистите, пойте, отбивайте чечётку — всё равно."
2004008-87 = "[s] «Хорошо, я останусь на месте и...»"
2004008-88 = ""
2004008-91 = ""
2004008-93 = ""
2004008-94 = "[ns] «Вот блин, ветер сдул все бумаги со стола...»"
2004008-95 = ""
2004008-96 = ""
2004008-97 = ""
2004008-98 = "[ns] «Сацуки, ты в порядке...?»"
2004008-99 = ""
2004008-100 = "Я в порядке. Когда тут темно, это место становится ОПАСНЫМ."
2004008-101 = "ОЧЕНЬ опасным. Не ходите один, Сенсей. Оставайтесь прямо рядом со мной."
2004008-102 = ""
2004008-105 = "[ns] «Сацуки, ты, эм...»"
2004008-107 = "[ns] «Ты боишься?»"
2004008-108 = "*вздыхает* И снова вы меня впечатляете, Сенсей..."
2004008-109 = "Вы нашли все мои слабости."
2004008-110 = "[s] «Это было нетрудно...»"
2004008-111 = "Ну, теперь уже нет смысла отрицать."
2004008-112 = "Да, я боюсь. И не люблю страшные вещи, а темноту ПРОСТО НЕНАВИЖУ."
2004008-113 = "Так что в такой ситуации..."
2004008-114 = "Если бы вас здесь не было, я... я бы, наверное, потеряла сознание..."
2004008-115 = ""
2004008-117 = ""
2004008-118 = "Долго ещё будет темно?"
2004008-119 = ""
2004008-122 = "...Что значит, вы не знаете? Это Шале! Вы не знаете, как работает собственный офис?"
2004008-123 = "Ух... Ненавижу это..."
2004008-124 = "[s] «Хорошо. Останемся вместе, пока свет не вернётся.»"
2004008-125 = "Верно. А когда станет светлее, сможем двигаться."
2004008-126 = "Теперь идите сюда. Оставайтесь прямо рядом со мной."
2004008-128 = "Я молча держал её за руку, пока она не перестала дрожать."
2004008-129 = ""
2004008-132 = "!!"
2004008-133 = ""
2004008-138 = ""
2004008-140 = "[ns] «О, хорошо, свет вернулся.»"
2004008-141 = "*вздыхает* Наконец-то..."
2004008-142 = ""
2004008-144 = ""
2004008-145 = "Ну что ж, Сенсей. Закончим на сегодня?"
2004008-146 = "[s5] «Ты быстро пришла в себя.»\n[s6] «Ага, заканчиваем!»"
2004008-149 = ""
2004008-151 = ""
2004008-152 = "Значит, сегодня вы нашли ещё одну мою слабость."
2004008-153 = "Рядом с вами ничего никогда не идёт по плану."
2004008-154 = "Но я не переживаю."
2004008-155 = "Тот Сенсей, которого я знаю, никогда не воспользуется ни одной моей слабостью. Верно?"
2004008-156 = "[s] «Верно. Я бы никогда не захотел так поступить ни с одним учеником.»"
2004008-157 = "Фуфу, я так и думала, что вы это скажете."
2004008-158 = "Конечно, не могу обещать того же, если однажды наши роли поменяются."
2004008-159 = "[s] «Разве там всё было именно так...?»"
2004008-160 = "Ну, раз мы всё это выяснили..."
2004008-161 = ""
2004008-163 = ""
2004008-164 = ""
2004008-165 = "Хотите пойти перекусить? Я ужасно голодна."
2004008-167 = "После вкусной еды с Сацуки я проводил её до общежития."
