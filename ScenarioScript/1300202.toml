[translation]
1300202-1 = "Держать темп"
1300202-2 = "Столовая Геенны"
1300202-3 = "Сенсей, до конкурса по поеданию еды в центре города осталось совсем мало времени!"
1300202-4 = "На этот раз будет соревнование по поеданию гамбургеров. Я раньше не участвовала в таких соревнованиях именно с гамбургерами, поэтому немного нервничаю."
1300202-5 = "Но сдаваться нельзя! Мне нужно сохранить победную серию третий год подряд!"
1300202-6 = "Поэтому я заранее потренируюсь есть бургеры здесь, в столовой Геенны."
1300202-7 = "Только... если заниматься одной, я могу неправильно распределить силы. Помоги мне держать темп и следи, чтобы я не перестаралась!"
1300202-8 = "[s] «Держать темп?»"
1300202-9 = "А? Тебе никогда не приходилось задавать темп?"
1300202-10 = "На марафонах есть бегуны, которые бегут рядом с другими, чтобы помогать им сохранять ровный темп."
1300202-11 = "Если думать только о скорости и не учитывать оставшуюся дистанцию, силы закончатся слишком быстро."
1300202-12 = "Конкурс по еде — тот же марафон. Если не держать темп и сразу начать заглатывать всё подряд, вкус быстро надоест. А ещё хуже — можно заработать расстройство желудка!"
1300202-13 = "Поэтому я хочу, чтобы ты ел вместе со мной и задавал мне темп, Сенсей!"
1300202-14 = "[s] «Но я и близко не могу съесть столько, сколько ты, Акари...»"
1300202-15 = "Не волнуйся! Я знала, что ты так скажешь, поэтому приготовила для тебя маленькие бургеры."
1300202-16 = "Каждый раз, когда ты съедаешь один такой мини-бургер, я съедаю большой. Так я смогу держать твой темп."
1300202-17 = "Ну что, начинаем!"
1300202-18 = ""
1300202-19 = "Тридцать один гамбургер готов!"
1300202-20 = "Так, пора за тридцать второй..."
1300202-21 = "[s] «Ургх...»"
1300202-22 = "Сенсей, ты ещё не доел свой мини-бургер? Он же на один укус, просто проглоти целиком."
1300202-23 = "Нам ещё далеко идти, и ты мне нужен. Цель — сто штук! Давай, живее!"
1300202-24 = "...Хочешь знать мировой рекорд по поеданию гамбургеров?"
1300202-25 = "If I remember correctly, there was a competitive eater who ate thirty burgers in one go in a competition ten years ago, and that's still the record. Since that monumental occasion, burgers have never been selected as the subject of an eating contest."
1300202-26 = "Что, думаешь, стоит остановиться, раз я уже поставила новый рекорд?"
1300202-27 = "Ни за что! В любом соревновании нужно выкладываться полностью, независимо от рекордов!"
1300202-28 = "Пойми... эта битва — битва с самой собой!"
1300202-29 = "[s] «Я уже безнадёжен...»"
1300202-30 = "Ну же, Сенсей! Меньше жалоб, больше еды! Я ещё даже близко не закончила."
1300202-31 = "Если сам уже не можешь есть, я тебя покормлю. Открой рот, хорошо?"
1300202-32 = "Ну же, Сенсей. Скажи «А-а-ам...» ♥"
1300202-34 = "После этого Акари уговорила меня съесть ещё несколько мини-бургеров, но я сдался, не дотянув даже до сорока..."
