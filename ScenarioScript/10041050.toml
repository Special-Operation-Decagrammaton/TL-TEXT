[translation]
10041050-1 = "Эпизод 5;Негативные эмоции"
10041050-4 = "Часом ранее..."
10041050-7 = "Убежище Рио, сразу после ухода Сэи."
10041050-8 = ""
10041050-10 = ""
10041050-11 = ""
10041050-12 = "...Нэру."
10041050-13 = ""
10041050-16 = ""
10041050-17 = "А? Это как?"
10041050-18 = "Я хочу кое-что спросить."
10041050-19 = "Но вопрос личный, к работе не относится, поэтому я не уверена, стоит ли вообще его поднимать."
10041050-20 = ""
10041050-22 = ""
10041050-23 = "Ну так что там??"
10041050-24 = "Исходя из моего опыта общения с тобой, я могу предсказать твою реакцию на вопрос, но не со стопроцентной точностью."
10041050-25 = "Ты будешь спрашивать или нет?"
10041050-26 = "Если я всё-таки спрошу, твоя реакция может быть..."
10041050-27 = ""
10041050-29 = ""
10041050-30 = ""
10041050-33 = ""
10041050-35 = "Правда?!"
10041050-36 = "Правда-правда?! Да ладно!"
10041050-37 = "Ещё раз заговоришь со мной таким тоном — тебе конец. Просто выкладывай уже, ясно?!"
10041050-38 = ""
10041050-40 = ""
10041050-42 = ""
10041050-43 = "...Ладно."
10041050-44 = "Меня беспокоит Юризоно Сэя."
10041050-45 = "Девчонка из Чаепития? А что, считаешь её слишком эмоциональной? Думаешь, создаст проблемы?"
10041050-46 = "Нет. Наоборот, я полностью ей доверяю."
10041050-47 = "Меня скорее беспокоит то, что я сказала ей раньше."
10041050-48 = "«Что ты ей сказала»...?"
10041050-49 = ""
10041050-51 = ""
10041050-52 = "...А. Когда ты её отчитала."
10041050-53 = "Сначала казалось, что она восприняла всё нормально. Я думала, что убедила её. Более того, она даже извинилась..."
10041050-54 = "...но я пришла к пониманию, что внешняя реакция человека не обязательно отражает его эмоциональное состояние."
10041050-55 = "Так что, с этой точки зрения, как думаешь, она могла..."
10041050-56 = ""
10041050-58 = ""
10041050-59 = "Как думаешь, она могла обидеться или это могло повлиять на её мнение обо мне?"
10041050-60 = ""
10041050-62 = ""
10041050-63 = "...Что?"
10041050-64 = "Проще говоря, я думаю, не стала ли она теперь хуже обо мне думать."
10041050-65 = "Возможно, это трудно понять. Позволь переформулировать: из-за её эмоционального состояния и внутреннего—"
10041050-66 = "Нет-нет, я сказала «что» не потому, что не поняла."
10041050-67 = "Короче, ты спрашиваешь: «Она считает меня придурком, потому что я вела себя как придурок?» Так?"
10041050-68 = "...Я бы не сказала, что обошлась с ней НАСТОЛЬКО жёстко."
10041050-69 = "А, не сказала бы? А зря, потому что именно так и было."
10041050-70 = "Я... В той ситуации у меня не было выбора, кроме как говорить прямо."
10041050-71 = "Дело срочное. На кону судьба школы. Это важнее всех наших личных чувств."
10041050-72 = "Мне нужно было её убедить, поэтому я привела самые веские аргументы, какие у меня были."
10041050-73 = "Но если из-за этого она перестанет мне доверять или начнёт меня не любить, тогда..."
10041050-74 = "Если так случится, тогда я... я..."
10041050-75 = ""
10041050-78 = ""
10041050-79 = "Угх! Серьёзно, угх!"
10041050-80 = "Это самая нелепая вещь, о которой вообще можно переживать!"
10041050-81 = "Это вообще имеет смысл? Чтобы она ходила надутой и держала обиду?"
10041050-82 = "Ты правда думаешь, что она из таких людей?"
10041050-83 = "К тому же тебе ПРИШЛОСЬ сказать то, что ты сказала, верно? Значит, по-другому ты и не могла?"
10041050-84 = ""
10041050-87 = ""
10041050-88 = "А теперь хочешь одна плакаться: «Уа-а, а вдруг она меня ненавидит»?"
10041050-89 = "Ну ты и головная боль, знаешь?"
10041050-90 = "А я, м-м? Я у тебя в мыслях вообще бываю? Ты никогда не переживаешь, что Я могу тебя ненавидеть или хотя бы недолюбливать?"
10041050-91 = "Почему ты ни разу не спрашивала МЕНЯ о чём-нибудь таком?"
10041050-92 = ""
10041050-94 = ""
10041050-96 = "...Микамо Нэру."
10041050-97 = "Если бы я тебе не нравилась, ты бы сразу дала мне это понять. У меня есть масса данных, которые это подтверждают."
10041050-98 = "Ты действуешь исходя из своих чувств, независимо от того, как я могу отреагировать. Со мной ты социально проста, поэтому и я с тобой веду себя так же."
10041050-99 = "Ты сейчас назвала меня простой?"
10041050-100 = "Не в уничижительном смысле, но..."
10041050-101 = ""
10041050-103 = ""
10041050-104 = "...если это поможет прояснить вопрос и установить между нами взаимопонимание, то да, в некоторых отношениях я действительно считаю тебя простой."
10041050-105 = ""
10041050-107 = ""
10041050-109 = "Ага, отличный разговор. Знаешь что? Теперь прочитай ВОТ ЭТО эмоциональное состояние!!"
10041050-110 = ""
10041050-115 = "П-прекрати...! Я посреди поиска данных...!"
10041050-116 = ""
10041050-122 = "*вздох* Я что-то засекла!"
10041050-123 = "Ф-фитнес-центр! Направляйся в фитнес-центр, Нэру! Сейчас не время для этого!!"
10041050-124 = "Не моя проблема!!"
