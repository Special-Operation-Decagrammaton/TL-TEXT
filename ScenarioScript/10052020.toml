[translation]
10052020-1 = "Иегова Элохим"
10052020-2 = "Точка Оскар достигнута. Я... начинаю."
10052020-3 = "[s] «Как мы можем помочь?»"
10052020-4 = "Сначала я подключусь к локальной сети через этот HMD."
10052020-5 = ""
10052020-7 = ""
10052020-8 = ""
10052020-9 = "Обычного VR будет недостаточно... А, понятно. Ты установила в это устройство усилитель сигнала. Он работает не только со звуком и изображением."
10052020-10 = "Верно. Через HMD я смогу войти в эту сеть и взаимодействовать с ней как с синтетическим многообразием."
10052020-11 = "Все данные сети будут представлены в бесконечном пространстве, ограниченном тремя измерениями."
10052020-12 = "Ладно! Теперь я наконец вижу проблему, Рио!"
10052020-13 = "Ч-Что...?"
10052020-14 = "До конца этой миссии тебе запрещено давать сложные объяснения. Пожалуйста, упрощай."
10052020-15 = "Ага. На этот раз я даже согласна с сестрёнкой. Я ценю, что ты СТАРАЕШЬСЯ объяснять понятнее..."
10052020-16 = "...Но иногда это слишком, особенно в такой срочной ситуации."
10052020-17 = "(А мне казалось, всё понятно...)"
10052020-18 = ""
10052020-20 = ""
10052020-21 = ""
10052020-22 = "[ns] «Итак. Что нужно делать НАМ?»"
10052020-23 = "В общем, пока я благополучно не вернусь, пожалуйста, защищайте... это место. И меня."
10052020-24 = "Пока я в сети, я буду уязвима."
10052020-25 = "И Кей, пожалуйста, прикрой меня."
10052020-26 = "Хорошо! Обеспечиваем периметр! Вперёд, Мидори! Юзу!"
10052020-27 = ""
10052020-29 = ""
10052020-30 = ""
10052020-31 = ""
10052020-33 = "Рио, возможно, вопрос очевидный. У тебя всего один HMD."
10052020-34 = "Я ведь на самом деле ничем не смогу помочь, да?"
10052020-35 = "Пока нет. Но если со мной что-то случится..."
10052020-36 = "Я хочу, чтобы ты взяла этот HMD."
10052020-37 = "...А? Что это значит...?"
10052020-38 = ""
10052020-40 = ""
10052020-41 = "...! Ты ведь не задумала ничего безрассудного? Зачем я вообще спрашиваю? Ты усиливаешь биоэлектрические токи..."
10052020-42 = "Если ты там потерпишь неудачу, синаптическая отдача может..."
10052020-43 = "...Да. Она тоже усилится."
10052020-44 = "Мой мозг будет полностью выжжен."
10052020-45 = "Ты с ума сошла?! Отдай эту штуку мне. Моё тело наверняка выдержит удар гораздо лучше твоего."
10052020-46 = ""
10052020-47 = "[ns] «Рио. Я не хочу, чтобы ты так рисковала.»"
10052020-48 = "Нет. Я должна это сделать. Кей... остаётся нашей последней линией обороны. Конечно, я понимаю, что и Кей, и я можем потерпеть неудачу."
10052020-49 = "Но я знаю, что не могу просить её пробовать первой, пока сама не сделаю попытку."
10052020-50 = "Сенсей, пожалуйста, доверьтесь моему решению."
10052020-51 = "В конце концов, если бы это было настолько опасно... Химари ведь не позволила бы мне спуститься сюда, правда?"
10052020-53 = "Ух, это...!"
10052020-54 = "[ns] «...Я могу довериться тебе, да?»"
10052020-55 = "Да. Пожалуйста."
10052020-56 = ""
10052020-58 = ""
10052020-59 = ""
10052020-60 = "...Если я увижу хотя бы один подозрительный рывок, я сорву эту штуку с тебя. И даже не вздумай жаловаться."
10052020-61 = "Поняла."
10052020-62 = "Тогда... я вхожу."
10052020-66 = ""
10052020-67 = "Ух...!"
10052020-68 = "(Голова кружится... Такое чувство, будто я тону в море информации.)"
10052020-69 = "(Будто я парю. Я могу потерять координаты.)"
10052020-70 = "(Для начала введём виртуальную гравитацию, чтобы...)"
10052020-71 = ""
10052020-73 = ""
10052020-76 = ""
10052020-77 = "Фух... Так немного лучше."
10052020-78 = "(В любом случае, зрелище впечатляет.)"
10052020-79 = "О боже, вы не торопились. Я уж думала, состарюсь, пока жду вас... хотя я и не старею."
10052020-80 = "?!"
10052020-81 = ""
10052020-83 = "Добро пожаловать, Цукацуки Рио. Какая честь, несомненно."
10052020-84 = "Ты Ор...!"
10052020-85 = "О, ты меня помнишь? Как мило, хотя это не имеет значения. Постараюсь насладиться твоими последними, столь вдумчивыми словами."
10052020-86 = "А теперь будь добра, сдохни."
10052020-87 = "А!!"
10052020-88 = ""
10052020-91 = ""
10052020-92 = "Хм. Какая шустрая. Но увернёшься ли от этого?"
10052020-93 = ""
10052020-95 = ""
10052020-96 = "?! Пол...?!"
10052020-97 = "О боже, похоже, ты пала с небес на землю."
10052020-98 = ""
10052020-101 = "Ты так старалась запрограммировать искусственную гравитацию и всё остальное..."
10052020-102 = "Это... так очаровательно по-человечески. Пытаться обрести опору. Пытаться удержать контроль."
10052020-103 = "Уф!"
10052020-104 = "Но мы с сёстрами не ограничены подобными узкими представлениями."
10052020-105 = "Как сказала бы дорогая Соф, мы принципиально иной вид. Мы ничем не скованы, а вы..."
10052020-106 = "Как насчёт этого?"
10052020-107 = ""
10052020-110 = "??? Она повернула гравитацию... вбок?"
10052020-111 = "Каково это — падать вправо? Влево! А теперь вверх!"
10052020-112 = ""
10052020-116 = ""
10052020-117 = "Что ж, в качестве последнего акта милосердия я тебя прикончу."
10052020-118 = ""
10052020-120 = ""
10052020-121 = ""
10052020-124 = "У-Ух...!"
10052020-126 = "Ты оказалась довольно утомительной, маленькая тряпичная кукла. Может, закончим?"
10052020-127 = "Здесь у нас с тобой может не быть физических тел..."
10052020-128 = "Снова воспользуюсь словами Соф — мы словно цифровые призраки."
10052020-129 = "Так что, пусть твоему физическому телу я навредить и не могу..."
10052020-131 = "...с разумом всё иначе."
10052020-132 = "А теперь небольшой тест, умница..."
10052020-134 = "Ты умная девочка. Если ты здесь «умрёшь», что станет с твоим физическим телом?"
10052020-135 = "...Мощный мгновенный скачок электричества выжжет мне мозг."
10052020-136 = "Хм, впечатляет. По крайней мере ты быстро соображаешь."
10052020-137 = "В таком случае..."
10052020-138 = "..."
10052020-139 = ""
10052020-142 = "Н-Но... это правда нормально...? Если они встретятся с тем ребёнком, даже эти люди..."
10052020-143 = "...наверняка погибнут?"
10052020-144 = "Да... Это весьма сложная проблема."
10052020-145 = "Мы ещё ни разу не причиняли вреда человеку, не желали этого и даже не думали об этом..."
10052020-146 = ""
10052020-149 = ""
10052020-150 = "...Тц."
10052020-151 = "Готовься, Цукацуки Рио!"
10052020-152 = ""
10052020-163 = "Ещё не конец...! Я не закончила!"
10052020-164 = "Бесполезно!"
10052020-165 = "...!"
10052020-166 = "Сюрприз!"
10052020-167 = ""
10052020-181 = "А...!"
10052020-182 = ""
10052020-186 = "О чём мечтаешь? Двигайся. Уворачивайся."
10052020-187 = ""
10052020-189 = ""
10052020-191 = "Э...?"
10052020-192 = "Хм..."
10052020-193 = "Химари...?!"
10052020-194 = ""
10052020-199 = "Хи-хи."
10052020-201 = "Я знала, что так будет, Рио. Такая сверхгениальная хрупкая красавица, как я, не могла просто сидеть и смотреть, поэтому прикатила сюда лично, чтобы поддержать тебя. Надеюсь, ты оценишь все мои усилия."
10052020-202 = "Ты... Этот байк..."
10052020-203 = "Это инвалидное кресло."
10052020-204 = "Но это же БАЙК..."
10052020-205 = "Кресло. На колёсах. Я сижу. У него есть колёса... в некотором смысле."
10052020-206 = "Х-Хорошо..."
10052020-208 = "Сдавайся, Рио. Она будет защищать это до смерти."
10052020-209 = "Как ты знаешь, обычно я отвечаю за поддержку. Но всё это время я вполне могла сама выезжать на поле боя."
10052020-210 = "Можно сказать, я универсальная боевая красавица. И главное — у этого кресла есть скрытая функция..."
10052020-211 = "..."
10052020-212 = "Фу-фу. Оставим это тайной. Секреты сильнее всего, пока их не раскрыли."
10052020-213 = "К тому же загадочность идеально подходит сверхгениальной красавице-байкеру — НЕТ, сверхгениальной, прекрасно-хрупкой, прекрасной деве."
10052020-214 = "...Ты дважды назвала себя «прекрасной»?"
10052020-215 = "О боже, Кей. Как грубо такое спрашивать. Весьма невоспитанно."
10052020-216 = "Для женщины века вроде меня, которой куда больше подходят прозвища вроде «распустившегося изящного цветка», «кристально чистой родниковой воды» и «снежинки, только что упавшей на величественную гору»..."
10052020-217 = "...нет ничего страшного, если слово «прекрасная» повторится несколько раз. В этом есть ритм. Это поэтично."
10052020-218 = "Эйми... Пожалуйста, скорее... Я сейчас с ума сойду."
10052020-221 = ""
10052020-222 = "Итак, что дальше, наша милая маленькая госпожа Ор?"
10052020-223 = "Все твои оставшиеся ходы и фигуры уже сметены с доски сверхгениальной хрупкой красавицей и кибер-феей Акебоши Химари."
10052020-224 = "...Значит, Акебоши Химари последовала за тобой. Но даже так, здесь..."
10052020-225 = "...в МОЁМ месте, где ВСЁ под МОИМ контролем..."
10052020-226 = "У вас нет ни единого шанса на успех!"
10052020-227 = ""
10052020-231 = "(Ух, она сильнее, чем выглядит.)"
10052020-232 = "(Но я должна использовать свои навыки и выиграть нам немного времени...!)"
10052020-233 = "О боже, ты действительно так думаешь? Мне полагалось впечатлиться этой попыткой атаки?"
10052020-234 = "Какая дерзость. Здесь я могу делать и быть чем угодно. Неужели ты не понимаешь?"
10052020-235 = "Или мне показать ещё? Девочки из Миллениума лучше усваивают материал на практике?"
10052020-236 = "Цукацуки Рио и Акебоши Химари, несмотря на вашу интеллектуальную ограниченность и оскорбительную назойливость, ВМЕСТЕ вы хотя бы должны понимать тщетность своих усилий?"
10052020-237 = "Итак, в какую сторону хотите падать теперь? Может, по диагонали? Или рассчитать кривую?"
10052020-238 = "Осторожно, Химари! Гравитация здесь...!"
10052020-239 = ""
10052020-241 = ""
10052020-242 = "...?"
10052020-243 = ""
10052020-245 = ""
10052020-246 = ""
10052020-247 = ""
10052020-248 = "...???"
10052020-249 = "Фуфуфу."
10052020-250 = "П-погоди. Ещё раз!"
10052020-251 = ""
10052020-253 = ""
10052020-254 = ""
10052020-256 = ""
10052020-257 = "...Ничего не происходит."
10052020-258 = "Ч-что?!"
10052020-259 = "О боже, с тобой всё хорошо? Ты сломалась?"
10052020-260 = "Мои сигналы заглушены."
10052020-261 = "Что ты сделала, Акебоши Химари?!"
10052020-262 = "А тебе разве не интересно?"
10052020-263 = ""
10052020-265 = ""
10052020-266 = ""
10052020-267 = "Госпожа Рио, президент. Вы меня слышите?"
10052020-268 = "Всё, как вы сказали... это место... Не знаю, как его назвать, но..."
10052020-269 = "...я уничтожила всё."
10052020-270 = "Прекрасная работа, Эйми. Идеальный момент."
10052020-271 = "Подтверждаю. Отключаюсь."
10052020-272 = ""
10052020-274 = ""
10052020-275 = "..."
10052020-276 = "..."
10052020-277 = "...?"
10052020-278 = "Уничтожила всё?! Ты про наш коммуникационный узел?"
10052020-279 = "Это ведь самый быстрый способ взломать систему, не так ли?"
10052020-280 = "Человечество и правда безнадёжно!"
10052020-281 = "...Прошу прощения."
10052020-282 = "За что ты извиняешься, Рио? ЭТО ОНА пыталась тебя убить."
10052020-283 = "П-Прости..."
10052020-284 = "Теперь мы на равных. Почему бы тебе не сдаться, Ор? Может, я даже отпущу тебя, если хорошо попросишь."
10052020-285 = "Думаешь, я стану плясать под твою дудку?"
