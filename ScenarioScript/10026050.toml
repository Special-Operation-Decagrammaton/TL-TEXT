[translation]
10026050-1 = "Эпизод 5;Участок C: Заброшенная лимонная роща"
10026050-2 = "Участок C представлял собой большую ровную площадку, вырубленную в склоне горы и густо засаженную лимонными деревьями."
10026050-3 = "За давно заброшенными деревьями никто не ухаживал, они разрослись и полностью скрыли тропинки между ними."
10026050-4 = ""
10026050-7 = "[ns1] «Ой-ой. Она заблудилась...?»\n[ns2] «С другими участками всё понятно, но как она умудрилась заблудиться здесь?»"
10026050-10 = "Ого! Вот вы где, Сенсей!"
10026050-11 = ""
10026050-14 = ""
10026050-15 = "[ns] «Ханако?»"
10026050-16 = "Деревья, должно быть, растут очень густо, раз даже вы заблудились, да, Сенсей?"
10026050-17 = "На этом этапе это уже скорее лимонный лес, чем роща..."
10026050-18 = "Хи-хи..."
10026050-19 = "А?"
10026050-20 = "Не знаю, откуда я знаю, что это роща. Просто знаю."
10026050-21 = "По крайней мере, раньше это была роща..."
10026050-22 = ""
10026050-24 = ""
10026050-25 = "...Хм. Наверное, вы правы."
10026050-26 = "Возможно, это просто моя интуиция."
10026050-27 = "Может, пока просто поверите мне на слово?"
10026050-28 = "По вашему лицу вижу, что вы мне не верите. Но и допрос с пристрастием устраивать не стали..."
10026050-29 = "Да... Если подумать, вы всегда были человеком, который ищет причины происходящего."
10026050-30 = "Почему же теперь молчите? Почему не спрашиваете, зачем я привезла нас сюда, зачем втянула Кохару и всё остальное?"
10026050-31 = "Значит, вы не против, даже если не до конца всё понимаете?"
10026050-32 = "[s3] «Уверен, всё будет хорошо. В конце концов, это же ты.»\n[s4] «Мне любопытно, но я тебе доверяю.»"
10026050-35 = "А..."
10026050-36 = "Не ожидала услышать от вас такое."
10026050-37 = "Похоже, вы доверяете мне больше, чем я думала."
10026050-38 = "Наверное, пока можно оставить всё как есть. Но когда в следующий раз у нас выдастся минутка наедине..."
10026050-39 = "[s] «...»"
10026050-41 = "[ns7] «Если хочешь поговорить, я не против.»\n[ns8] «Жаль было бы закончить разговор на этом.»"
10026050-44 = "..."
10026050-45 = "Хи-хи..."
10026050-46 = "Именно такого ответа я от вас и ожидала, Сенсей."
10026050-47 = "Похоже, теперь ход за мной, да?"
10026050-48 = "Я не привыкла говорить настолько прямо..."
10026050-49 = "Но раз уж мы об этом заговорили, как насчёт..."
10026050-50 = "Да, почему бы и нет? Всё-таки сейчас лето."
10026050-54 = "Скажу прямо..."
10026050-55 = "Я знаю, что вы понимаете: всю эту ситуацию я устроила ради Уи и Кохару."
10026050-56 = "Вы ни капли не беспокоились, хотя я ничего вам не объяснила. Вы просто... верите в меня."
10026050-57 = "И вот мы на прекрасном отдалённом острове. Почти что в отпуске."
10026050-58 = "Да, мы приехали исследовать руины, но делаем это в купальниках посреди лета."
10026050-59 = "Она не признается, но я знаю, Кохару ужасно хотелось чего-то подобного. А то, что это ещё и помогает Уи выбраться из неприятностей..."
10026050-60 = "Получается, все в выигрыше, правда?"
10026050-61 = "...Да."
10026050-62 = "Всё именно так, как надо."
10026050-63 = "Вы ведь всё это предвидели, Сенсей?"
10026050-64 = "..."
10026050-65 = "Но... Сенсей."
10026050-66 = "Чисто гипотетически..."
10026050-67 = ""
10026050-69 = ""
10026050-70 = "Что, если я скажу, что не только Кохару и Уи это было нужно?"
10026050-71 = "Ну, а если..."
10026050-72 = "[s9] «...Ханако?»\n[s10] «Это значит...?»"
10026050-75 = "Предсказуемо, знаю."
10026050-76 = "Что бы кто ни говорил, я всё ещё старшеклассница в самом расцвете юности."
10026050-77 = "Знаю, не всегда так кажется, но... я правда обычная девушка."
10026050-78 = "Иногда я ничем не отличаюсь от Кохару и остальных... Иногда у меня бывают наивные надежды и мечты."
10026050-79 = "Я постоянно говорю, что устроила всё это ради остальных, но и ради себя тоже."
10026050-81 = "В глубине души я просто хотела быть частью всего этого."
10026050-84 = "Я жалею, что не пошла с вами тогда."
10026050-85 = ""
10026050-86 = "Не совсем же невозможно, чтобы я так себя чувствовала, правда? Хи-хи..."
10026050-87 = "[s] «...»"
10026050-88 = "А теперь вы молчите. Я сделала ситуацию неловкой, да?"
10026050-89 = "Странно слышать такое объяснение от такой молодой девушки, как я, правда?"
10026050-90 = "[s11] «Нет, Ханако. Я просто подумал, что сейчас ты стала гораздо спокойнее.»\n[s12] «Я рад, что рядом со мной ты смогла открыться.»"
10026050-93 = "..."
10026050-94 = "Хм... Правда?"
10026050-95 = "Знаете... Думаю, вы правы."
10026050-96 = "Несмотря на странное место, мне хотелось провести наше время вместе как можно лучше."
10026050-97 = "Мне не хотелось рассказывать обычные шутки и истории, о которых мы можем поговорить в любой момент."
10026050-98 = "И раз уж так, Сенсей."
10026050-99 = "Всё это, то, что мы здесь вместе... Мне бы хотелось, чтобы в будущем такое происходило чаще..."
10026050-100 = "Можно мне немного пожадничать?"
10026050-101 = "[s] «Да.»"
10026050-102 = "Какой быстрый ответ."
10026050-103 = "Даже слишком быстрый. Вам так не кажется?"
10026050-104 = "Я понимаю, что многого от вас прошу, возможно, даже больше, чем вы осознаёте..."
10026050-105 = "[s13] «Ну... Всё-таки сейчас лето.»\n[s14] «Ну, в конце концов, ты просто старшеклассница в самом расцвете юности.»"
10026050-108 = "...Хи-хи."
10026050-109 = "Хорошо! Тогда мне уже не терпится узнать, что ждёт нас впереди."
10026050-110 = "Вы ведь понимаете, что я этого не забуду? У меня довольно хорошая память."
10026050-111 = ""
10026050-113 = ""
10026050-114 = "И вы дали мне обещание. ♡"
10026050-115 = ""
10026050-117 = ""
10026050-119 = "Мы ещё немного побродили вместе по лимонной роще, а затем вернулись в базовый лагерь."
10026050-120 = ""
10026050-123 = "А когда Кохару услышала, сколько времени мы с Ханако провели наедине, она пригрозила ей смертной казнью."
