10055070-93 = "……."
10055070-94 = "……Captain, what should we do?"
10055070-99 = "Why did this have to happen on the day I'm Captain? Should I just say I don't know anything? No, but as the person in charge, not knowing while being the Captain is a failure of responsibility……."
10055070-100 = "Oh, right! It hasn't been confirmed that they're enemies yet, right?"
