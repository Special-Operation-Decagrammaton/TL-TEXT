[translation]
10055070-1 = "Эпизод 7;Августовские глупцы"
10055070-2 = "...Сегодня ужасно густой туман."
10055070-3 = "И надо же, именно сегодня мне досталось дежурство наблюдателя."
10055070-4 = "Расслабься. Ничего не случится."
10055070-5 = "Сегодня ни об одном корабле не сообщали, да и на АИС ничего нет."
10055070-6 = "Просто закончим патруль и..."
10055070-7 = ""
10055070-9 = ""
10055070-10 = "Закончим... патруль...?"
10055070-11 = "Погоди. Дай бинокль."
10055070-13 = "..."
10055070-14 = ""
10055070-15 = "Правый борт! Доклад наблюдателя!"
10055070-16 = ""
10055070-18 = ""
10055070-19 = "..."
10055070-20 = "...?"
10055070-21 = "Правый борт, что происходит?"
10055070-22 = "Почему ты оборвала доклад на полуслове?"
10055070-23 = "А, Сумика! Как раз вовремя!"
10055070-24 = "Капитан, вообще-то!"
10055070-25 = "Нам обязательно звать тебя «капитаном»? Мы же просто распределили роли по жребию..."
10055070-26 = "Капитан!"
10055070-27 = "Ладно, ладно, «капитан»."
10055070-28 = "Как же ты любишь титулы..."
10055070-29 = "А теперь по делу: что с докладом? Почему ты замолчала?"
10055070-30 = "Только не говори, что проснулась после дремоты и увидела что-то странное?"
10055070-31 = "Так вот насчёт этого..."
10055070-32 = ""
10055070-34 = ""
10055070-35 = ""
10055070-36 = "Но что мы вообще увидели?"
10055070-37 = "Ты видела то же, что и я!"
10055070-38 = "Знаю... Просто в голове не укладывается!"
10055070-39 = "Хватит шептаться! Я вообще-то здесь!"
10055070-40 = "Как капитан «Гарпии», я должна знать обо всём, что происходит на борту!"
10055070-41 = ""
10055070-44 = ""
10055070-45 = "...Ты её слышала."
10055070-46 = "Ну ладно. Я правда ей расскажу."
10055070-47 = ""
10055070-49 = ""
10055070-50 = "Правый борт! Доклад наблюдателя!"
10055070-51 = "Один парусный корабль! Пеленг 010 градусов! Дистанция — 1000 ярдов!"
10055070-52 = "Идёт курсом на столкновение! Прямо на нас!"
10055070-53 = ""
10055070-56 = ""
10055070-57 = "*вздох* Послушайте. Знаю, вы все меня недолюбливаете."
10055070-58 = "Я ведь даже не председатель и не заместитель. С какой стати мне быть капитаном? Но они не могут везде успеть, и иногда нам приходится патрулировать без них."
10055070-59 = "Поэтому я взяла на себя эту тяжкую обязанность, невзирая на всеобщую ненависть. Ради безопасности нашего корабля и команды..."
10055070-60 = "Перестань выставлять нас кучкой ненормальных! Всем вообще плевать!"
10055070-61 = "Просто... Ух! Смотри сюда!"
10055070-62 = ""
10055070-64 = ""
10055070-65 = ""
10055070-66 = ""
10055070-67 = "...На что я там должна смотреть?"
10055070-68 = ""
10055070-70 = ""
10055070-71 = ""
10055070-72 = "...?"
10055070-73 = "Что это?!"
10055070-74 = ""
10055070-76 = ""
10055070-77 = ""
10055070-78 = "Корабль! Огромный военный корабль!"
10055070-79 = "ВОЕННЫЙ КОРАБЛЬ?"
10055070-80 = "Да! Такой, как в старые времена: с пушками, парусами и всем прочим!"
10055070-81 = "Я знаю, что такое военный корабль! Почему он в тысяче ярдов от нас?! Да он прямо перед носом!"
10055070-82 = "Как он подобрался так близко, что никто не заметил?"
10055070-83 = "Ты туман за бортом видела? Ничего же не разглядеть!"
10055070-84 = "У нас же есть радар?! Что с ним случилось?"
10055070-85 = "Не работает! Вообще никаких сигналов!"
10055070-86 = ""
10055070-88 = ""
10055070-89 = ""
10055070-90 = "...Без двигателя? И радиомолчание?"
10055070-91 = "...Ты сказала, это военный корабль?"
10055070-92 = "То есть к нам сквозь туман беззвучно приближается военный корабль, вооружённый пушками?"
10055070-93 = "..."
10055070-94 = "...Что будем делать, капитан?"
10055070-95 = ""
10055070-97 = ""
10055070-98 = ""
10055070-99 = "Почему это должно было случиться именно в моё капитанское дежурство? Может, сделать вид, что я ничего не слышала? Ух, не выйдет. Ответственность всё равно повесят на меня."
10055070-100 = "А, точно! Мы ведь ещё не подтвердили, что они враждебны!"
10055070-101 = "Пробовали связаться по радио?"
10055070-102 = "Мы постоянно их вызываем, но они не отвечают!"
10055070-103 = "А световой сигнал об опасности столкновения?"
10055070-104 = "Уже давно подаём. Никакой реакции."
10055070-105 = "Может, сейчас повернуть на правый борт?"
10055070-106 = "Н-нет, нельзя!"
10055070-107 = "До них всего тысяча ярдов! Если резко повернём и дадим крен... они могут воспользоваться моментом и напасть! Если корабль с такой историей, как «Гарпия», потопят в МОЮ вахту...!"
10055070-108 = "Капитан! Сообщение из гидроакустического отсека!"
10055070-109 = "Мы уловили чей-то голос с того корабля. Похоже, говорящая носит капитанскую шляпу!"
10055070-110 = "А! Сейчас я туда..."
10055070-111 = "Времени нет! Просто включите запись через палубные динамики!"
10055070-112 = ""
10055070-114 = ""
10055070-115 = "...Так, всё хорошо. Уверена, мы разберёмся без конфликта!"
10055070-116 = "Мы ведь из «Одиссеи». Какой идиот решится связываться с нами на море?"
10055070-118 = "Настоящий пират обязан сделать лишь одно!"
10055070-119 = "Разграбим все до единого сокровища Кивотоса! Йо-хо-хо-хо!"
10055070-120 = ""
10055070-121 = "..."
10055070-123 = "..."
10055070-124 = "...Я всё это время смотрела на ситуацию не с той стороны."
10055070-125 = "Они всего лишь разношёрстная кучка пиратов на древнем судёнышке. А мы «Трезубец»! Морская элита! И раз я капитан, вся слава за их разгром достанется мне!"
10055070-126 = "Капитан?"
10055070-127 = "Вдох... Выдох..."
10055070-128 = "Всем по боевым постам! Разнесём этих пиратов!"
10055070-130 = "Есть, капитан!"
10055070-131 = ""
10055070-133 = ""
10055070-138 = ""
10055070-139 = "Проклятье! Флот уже сел нам на хвост!"
10055070-140 = "Какой ещё флот?! Мы не пираты, Макото!"
10055070-141 = "Неважно! Важно то, что МОЙ корабль превращают в решето!"
10055070-142 = "Они думают, мы будем просто сидеть и терпеть?!"
10055070-143 = "Всем на палубу! Дадим отпор! Выполняйте мои приказы!"
10055070-144 = ""
10055070-147 = ""
10055070-149 = "...Вы меня не слышали?"
10055070-151 = "Ну, ты говоришь «дать отпор», но..."
10055070-152 = "Как именно?"
10055070-154 = "Что значит «как»? На корабле есть отличные пушки!"
10055070-155 = "Да какие они отличные."
10055070-156 = "Я пыталась тебе сказать раньше. Они насквозь проржавели."
10055070-157 = "От одной чистки снаружи они не заработают."
10055070-158 = "...А. Так вот почему вы не выполнили мой приказ."
10055070-160 = "Ага... По боевой мощи мы практически рыбацкая лодка."
10055070-161 = "И мы вообще никогда не воевали, капитан."
10055070-162 = ""
10055070-164 = ""
10055070-165 = ""
10055070-166 = ""
10055070-167 = "Я понимаю."
10055070-168 = "Я ещё глубже ПОНИМАЮ, НАСКОЛЬКО ВЫ БЕЗМОЗГЛЫ!"
10055070-169 = ""
10055070-172 = ""
10055070-174 = "Пушки проржавели! И что с того?!"
10055070-175 = "Так вы намерены стоять сложа руки, пока корабль, на котором живёте, медленно опускается на морское дно?"
10055070-177 = "Но..."
10055070-178 = "Невозможное остаётся невозможным..."
10055070-180 = "Невозможное? Откуда вы знаете? Вы хоть пробовали?!"
10055070-181 = "Говорите, никогда не сражались? А хоть раз пытались стрелять из пушек?"
10055070-182 = "Вы сдаётесь, даже пальцем не пошевелив! И ещё смеете называть себя пиратами!"
10055070-183 = "Вам недостаёт силы духа! Если её достаточно, можно заставить выстрелить любое оружие!"
10055070-184 = "Это... по-моему, не так работает."
10055070-185 = "Если не можете поверить в себя, поверьте в меня!"
10055070-186 = "Эти пушки ОБЯЗАТЕЛЬНО выстрелят!"
10055070-187 = "Все по местам! Заряжайте пушки и готовьтесь к залпу!"
10055070-188 = ""
10055070-191 = ""
10055070-192 = "...Нельзя заставить что-то произойти одной лишь силой воли, капитан!"
10055070-193 = "Пушки этого корабля..."
10055070-195 = "Довольно! Если отказываетесь, прочь с дороги!"
10055070-196 = "Команда Пандемониума справится сама!"
10055070-198 = "П-постой, мы?!"
10055070-199 = "Я с вами! Хочу заряжать пушку!"
10055070-200 = "Ибуки тоже поможет!"
10055070-201 = "А я... понаблюдаю отсюда. Удачи, товарищи!"
10055070-202 = ""
10055070-203 = ""
10055070-204 = "Ну и глупость. Полная глупость..."
10055070-205 = "[s] «Ироха, а ты тоже не поможешь?»"
10055070-206 = "...Она не успокоится, пока я не присоединюсь."
10055070-207 = "Она лучше учится на практике. Словами до неё не достучаться."
10055070-208 = "Всё это с самого начала какое-то чудовищное недоразумение. Надо просто связаться с ними, а потом вернуться домой..."
10055070-209 = "До чего же она раздражает."
10055070-210 = ""
10055070-211 = "Раз-два, взяли! Раз-два, взяли!"
10055070-212 = "Раз-два, взяли! Раз-два, взяли!"
10055070-213 = "Ибуки получилось? Ибуки помогла?"
10055070-214 = "Отличная работа! Теперь гораздо легче!"
10055070-215 = ""
10055070-216 = "*вздох*... В дульнозарядную пушку сначала засыпают порох, верно?"
10055070-217 = ""
10055070-219 = ""
10055070-220 = "А, нет, Ироха!"
10055070-221 = "Надо отмерить порох, насыпать его в картуз, а уже потом вложить в дуло!"
10055070-222 = ""
10055070-224 = ""
10055070-225 = "Ух...!"
10055070-226 = "А! Ибуки, тяжёлое понесу я."
10055070-227 = "Спасибочки, Ироха! У Ибуки ещё маленькие мышцы, ей такое не поднять!"
10055070-229 = ""
10055070-230 = "Теперь ядро! Чтобы оно не каталось, нужно сделать для него небольшую подстилку, вот так..."
10055070-231 = "И напоследок засыпать немного пороха в запальное отверстие и поджечь!"
10055070-232 = "О-о... Ибуки, да ты в этом разбираешься."
10055070-233 = "Ага! Ибуки очень много училась!"
10055070-235 = "..."
10055070-236 = "..."
10055070-238 = "Команда! Пушки заряжены?!"
10055070-240 = "Ну, вроде да..."
10055070-242 = "Не слышу!"
10055070-244 = "Есть, капитан!"
10055070-245 = "Теперь осталось поджечь, и БАБАХ!"
10055070-247 = "Отлично! Просто превосходно!"
10055070-248 = "Первый залп — по моей команде!"
10055070-249 = "Наша цель — проклятый корабль военного флота!"
10055070-251 = "Столько суеты впустую."
10055070-252 = "Не выстрелит. Ни за что. Даже смотреть на это стыдно."
10055070-254 = "Йо-хо-хо! Просто смотрите!"
10055070-255 = "Сейчас я покажу вам чудо!"
10055070-256 = ""
10055070-258 = ""
10055070-259 = "Приготовиться...!"
10055070-261 = ""
10055070-263 = ""
10055070-265 = ""
10055070-267 = ""
10055070-270 = "ОГОНЬ!"
10055070-273 = "...Что?"
10055070-274 = "Не может быть..."
10055070-275 = "Ого!! Прозвучало как фейерверк!"
10055070-276 = "Теперь очередь Ибуки! Получайте, получайте!"
10055070-277 = ""
10055070-280 = "Йо-хо-хо! Я так и знала, что всё дело в силе духа!"
10055070-281 = ""
10055070-282 = "Она... действительно выстрелила."
10055070-283 = "С того самого дня из пушек этого корабля не стреляли ни разу..."
10055070-285 = "Наше контрнаступление началось! Команда, перезарядить!"
10055070-286 = ""
10055070-289 = ""
10055070-291 = "Есть, капитан!"
