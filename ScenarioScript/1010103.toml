[translation]
1010103-1 = "В поисках звуков фестиваля"
1010103-4 = "А, Сенсей. Я здесь."
1010103-5 = "Спасибо, что пришли."
1010103-6 = "[s] «У тебя новая работа?»"
1010103-7 = "Да, именно. Но с ней возникли некоторые проблемы."
1010103-8 = "На этой работе я буду диджеем на фестивале. Я хотела попросить вас кое с чем помочь."
1010103-9 = "Всё оборудование, включая вертушку, я уже подготовила. Однако у меня всё ещё нет самого важного — сэмпла."
1010103-10 = "Вы не знаете, что такое сэмпл?"
1010103-11 = "Диджеи берут фрагменты существующих аудиозаписей, изменяют их или смешивают с другими треками. Так они создают новые миксы."
1010103-12 = "Это называется «сэмплированием»."
1010103-13 = "Даже самое дорогое оборудование в мире ничего не даст, если у меня не будет подходящих звуков для выступления."
1010103-14 = "[s] «А как вообще получают аудиозаписи?»"
1010103-15 = "Нужно получить разрешение автора, а значит — договориться и заплатить роялти."
1010103-16 = "Так написано в «Руководстве начинающего диджея»."
1010103-17 = "Но денег на роялти у меня нет."
1010103-18 = "Поэтому я решила сама найти звуки для сэмплирования."
1010103-19 = "[s] «Ты собираешься сочинить собственную музыку?»"
1010103-20 = "Эм... Я бы хотела, но сочинять музыку, скорее всего, выше моих возможностей."
1010103-21 = "Вместо этого я собиралась записывать звуки вокруг и использовать их в своих треках."
1010103-22 = "На фестивальных площадках всегда кипит жизнь, поэтому, думаю, там найдётся множество разных звуков для сэмплов."
1010103-23 = "Проще говоря, я добуду их на месте."
1010103-24 = "[s] «Хорошая идея! Я помогу.»"
1010103-25 = "Спасибо."
1010103-26 = ""
1010103-28 = ""
1010103-29 = "Тогда отправимся на территорию фестиваля."
1010103-33 = "Эм, что станет нашей первой целью?"
1010103-34 = "Что думаете, Сенсей?"
1010103-35 = "[s] «Как насчёт той лавки с едой?»"
1010103-36 = "Верно. Вокруг неё довольно шумно."
1010103-37 = "Там наверняка найдутся хорошие звуки для сэмплов."
1010103-42 = ""
1010103-44 = "Добро пожаловать! Жареный кальмар, куриные шашлычки, якисоба — всё, что пожелаете!"
1010103-45 = "Низкие-низкие цены! Восхитительное качество!"
1010103-46 = "[s] «Я внезапно проголодался...»"
1010103-47 = ""
1010103-52 = "Шипение готовящейся еды..."
1010103-53 = "Думаю, это можно использовать."
1010103-54 = ""
1010103-56 = ""
1010103-57 = "Осталось только записать."
1010103-58 = "...Хм?"
1010103-59 = "Что вы делаете, Сенсей? Вы... покупаете мне куриный шашлычок?"
1010103-60 = "Н-Нет-нет. Вы и так оказываете мне услугу, это я должна купить вам один..."
1010103-61 = "[s] «Считай это благодарностью за возможность посмотреть, как ты собираешь сэмплы.»"
1010103-62 = "Эм... Не думаю, что за такое стоит благодарить, но..."
1010103-63 = "Было бы невежливо записывать здесь звуки, ничего не купив у продавца."
1010103-64 = "Спасибо, Сенсей. Я обязательно вам отплачу."
1010103-68 = "Пляж..."
1010103-69 = "Шум волн, разбивающихся о берег, станет отличным сэмплом."
1010103-70 = ""
1010103-72 = ""
1010103-73 = "Так... мой диктофон..."
1010103-74 = ""
1010103-76 = ""
1010103-77 = "Эм, по-моему, мы далековато. Качество записи довольно плохое."
1010103-78 = "[s] «Можно я помогу?»"
1010103-79 = "А? Что вы имеете в виду, Сенсей? Для записи мне ведь нужно только нажать эту кнопку..."
1010103-80 = ""
1010103-86 = "Зачем вы снимаете обувь? Вы... собираетесь зайти в воду?!"
1010103-87 = "[s1] «Вода приятная и прохладная.»\n[s2] «Разве это не лучший способ записать звук?»"
1010103-90 = "Если вас это устраивает, я очень благодарна, Сенсей."
1010103-91 = "Ещё один сэмпл запи—"
1010103-92 = ""
1010103-95 = "[ns] «Ого!»"
1010103-98 = ""
1010103-100 = ""
1010103-101 = "Вы так внезапно упали! Вы в порядке, Сенсей?!"
1010103-102 = "[s] «Я просто споткнулся. Всё нормально.»"
1010103-103 = "Вы так говорите, но ваша одежда промокла насквозь. Нужно найти место, где вы сможете высохнуть."
1010103-104 = "А? На что вы хотите, чтобы я посмотрела?"
1010103-105 = "А, диктофон. Вы умудрились не намочить его при падении..."
1010103-106 = "Вам нужно научиться ставить собственное благополучие выше, Сенсей."
1010103-107 = "Я бы очень переживала, если бы вы простудились."
1010103-108 = "...В любом случае я благодарна за все ваши старания, Сенсей. Благодаря вам я могу продолжать собирать сэмплы."
1010103-114 = "А теперь — прибрежный лес."
1010103-115 = ""
1010103-118 = "Мы только вошли сюда, а стрекот насекомых уже такой громкий."
1010103-119 = "[s] «Они подойдут для сэмпла?»"
1010103-120 = "Узнать можно только попробовав. Я хочу иметь как можно больше разных звуков."
1010103-121 = ""
1010103-123 = ""
1010103-124 = "Постараемся двигаться как можно тише."
1010103-131 = "Так непривычно просто неспешно гулять вот так."
1010103-132 = "Я никого не преследую, никто не преследует меня, и мне не нужно судорожно укладываться в срок."
1010103-133 = "Если подумать, кажется, у меня никогда не было возможности так отдыхать."
1010103-134 = "Меня всегда занимала какая-нибудь работа."
1010103-135 = "[s] «Если захочешь прогуляться, просто позвони мне.»"
1010103-136 = ""
1010103-138 = ""
1010103-139 = "Очень типичный для вас ответ, Сенсей."
1010103-140 = "Я это запомню."
1010103-151 = "Сегодня время пролетело очень быстро."
1010103-152 = "Пора нам желать друг другу спокойной ночи."
1010103-153 = "[s] «Ты всегда такая старательная — даже ради подработки заходишь так далеко.»"
1010103-154 = "А, точно... Всё это было ради моей работы..."
1010103-155 = "Спасибо, что напомнили. Я почти забыла."
1010103-156 = "Должно быть, я действительно расслабилась, раз забыла о своей задаче. Причина этого..."
1010103-157 = ""
1010103-159 = ""
1010103-160 = ""
1010103-161 = "Понятно... Причина, по которой я так расслабилась..."
1010103-162 = "[s] «Что это?»"
1010103-163 = ""
1010103-165 = ""
1010103-166 = "Считайте это коммерческой тайной."
1010103-167 = "В-В любом случае... Я сделаю из собранных сэмплов готовую композицию и отправлю вам. Нужно ещё обработать всё и превратить в настоящий трек."
1010103-168 = "Давайте прощаться. Уже поздно."
1010103-169 = ""
1010103-171 = ""
1010103-173 = ""
1010103-174 = "Спасибо, что провели со мной сегодня время, Сенсей."
