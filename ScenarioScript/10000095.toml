[translation]
10000095-2 = "Хорошо. Мы пойдём готовиться к грандиозному финалу."
10000095-3 = "Босс, обязательно найди хорошее место, откуда смотреть представление!"
10000095-4 = "[s] «Хорошо. Идите, вы двое.»"
10000095-6 = "Проводив Шизуко и Пину, я снова вернулся на оживлённую фестивальную улицу."
10000095-8 = "Я слышала, что фейерверки на этом фестивале запускаются с помощью технологий Миллениум!"
10000095-9 = "Поторопимся, пока не пропустили!"
10000095-11 = "[ns] Последовать за толпой."
10000095-15 = "Я добрался до переполненной смотровой площадки, чтобы посмотреть фейерверк."
10000095-16 = "И тут среди толпы я заметил знакомое лицо."
10000095-17 = ""
10000095-18 = "Т-тут столько людей! Изуна едва может дышать!"
10000095-19 = "[s] «Изуна. Сюда.»"
10000095-20 = "А? Этот голос! Сенсей...! То есть — мой господин!"
10000095-21 = ""
10000095-22 = ""
10000095-23 = "Изуна внезапно налетела на меня с объятиями, и я чуть не потерял равновесие."
10000095-24 = "Изуна заняла для вас место, мой господин!"
10000095-25 = ""
10000095-26 = "Но Изуна не ожидала, что пока она ждёт вас, соберётся такая огромная толпа!"
10000095-27 = "Ч-что теперь? Людей так много, что мы даже не можем добраться до наших мест!"
10000095-28 = "Изуна начала паниковать, поэтому я решил, что нам лучше остаться здесь."
10000095-29 = "[s] «Отсюда тоже хорошо видно. Давай останемся здесь.»"
10000095-30 = "Эм, хорошо! Хи-хи-хи!"
10000095-32 = "О, смотри. Начинается."
10000095-38 = "Ого...! Потрясающе!"
10000095-39 = "Некоторое время мы с Изуной любовались фейерверками, освещавшими ночное небо."
10000095-41 = "Чуть позже той же ночью..."
10000095-43 = "Так приятно наслаждаться чем-то вместе с вами, мой господин."
10000095-44 = "..."
10000095-45 = "Эм, Изуна просит прощения за то, что... доставила столько хлопот."
10000095-46 = "Изуна просто, эм..."
10000095-47 = "[s1] «Я твой Сенсей. Я всегда тебя прощу.»\n[s2] «Тебе не нужно извиняться за то, что ты остаёшься собой.»"
10000095-48 = "Сенсей... Даже после всего этого вы всё ещё...?"
10000095-49 = "Сенсей... Даже после всего этого вы всё ещё...?"
10000095-50 = ""
10000095-51 = "Хи-хи! Точно! Изуна дала клятву своему господину!"
10000095-52 = "Мы товарищи-ниндзя! Ведь мой господин — самый большой сторонник мечты Изуны!"
10000095-53 = "Изуна навсегда останется верна своему господину."
10000095-54 = "[s] «Н-навсегда?»"
10000095-55 = "Так что, мой господин...!"
10000095-56 = "Изуна с нетерпением ждёт того, что нас ожидает в будущем!"
10000095-57 = "И Изуна обещает продолжать тренироваться, чтобы быть достойной своей клятвы!"
10000095-58 = ""
10000095-59 = ""
10000095-60 = "Нин-нин!"
10000095-63 = "Старое школьное здание Хяккияко 38"
10000095-65 = ""
10000095-66 = ""
10000095-67 = "Мы с Изуной стояли перед дверью, которая, похоже, вела в клубную комнату Клуба исследования ниндзюцу."
10000095-68 = "На двери висела табличка: «Никаких продавцов! Набор участников!»"
10000095-69 = "О, так вот он какой, Клуб исследования ниндзюцу, о котором слышала Изуна."
10000095-70 = "Это клуб, где изучают искусство ниндзя. Разве не потрясающе?"
10000095-71 = "Может, если Изуна будет тренироваться здесь, она сможет отточить свои навыки ниндзя!"
10000095-72 = ""
10000095-73 = "Я попробую!"
10000095-74 = ""
10000095-76 = "Есть кто-нибудь? Простите!"
10000095-77 = ""
10000095-79 = "Конец...?"
10000095-80 = "Переполох на фестивале цветения сакуры!"
