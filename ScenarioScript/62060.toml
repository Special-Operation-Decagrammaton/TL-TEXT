62060-1 = "Эпизод 6;Потерянный ребёнок"
62060-2 = ""
62060-3 = "Хорошая работа, все."
62060-4 = ""
62060-6 = ""
62060-8 = "С-Сегодня и правда было что-то..."
62060-9 = "Ещё бы."
62060-10 = "И всё же вы все держитесь удивительно спокойно."
62060-11 = "Ну, жизнь в бегах тоже не была прогулкой по парку."
62060-12 = "[s] «Вы все стали такими сильными...»"
62060-13 = "Не потому, что я этого хотела, ясно?"
62060-14 = "Что? Обычно люди сильнее всего растут именно потому, что приходится, а не потому что хочется?"
62060-15 = "Уф. Как же бесит, что ты вечно оказываешься прав."
62060-16 = "Н-Но мы..."
62060-17 = "..."
62060-18 = "Когда мы здесь закончим, нам ведь снова придётся скрываться, да?"
62060-19 = "Хиёри...?"
62060-20 = ""
62060-22 = ""
62060-23 = "Н-Ничего! Я всё равно счастлива! Э-хе-хе..."
62060-24 = "Но всё же..."
62060-25 = "Что-то..."
62060-26 = "Ага...! Хах! Может, у меня просто лезут в голову всякие странные мысли, потому что мы давно сюда не возвращались..."
62060-27 = "[s1] «Нет, Хиёри. Это совсем не странно.»\n[s2] «Что касается вас всех и Ариуса...»\n[s3] «...я несу ответственность за свою халатность.»"
62060-28 = ""
62060-29 = ""
62060-30 = ""
62060-32 = ""
62060-33 = "Что? Ч-Что ты такое говоришь?"
62060-34 = "Сенсей...?"
62060-35 = "..."
62060-36 = ""
62060-38 = ""
62060-40 = "Знаете, Сенсей. Пожалуйста, не думайте, что всё обязательно должно лежать на ваших плечах."
62060-41 = "Мы сами отвечаем за сделанный нами выбор, и нести эту ответственность тоже должны сами."
62060-42 = "Но пока давайте сосредоточимся на том, что можем сделать прямо сейчас."
62060-43 = "Вместе мы что-нибудь придумаем."
62060-44 = "Для начала я хочу заняться просьбой Мине."
62060-45 = "[s] «Она сказала: „Повседневная жизнь“...»"
62060-46 = "Да. Повседневная жизнь в Ариусе."
62060-47 = "...Что ж, описанная ею повседневность — полная противоположность реальности Ариуса."
62060-48 = "Верно... Всё, что студенты испытали с нашего прибытия, было для них совершенно новым..."
62060-49 = "Посещать занятия... учиться... ездить на экскурсии... Они даже увидели трубочки, фильтрующие воду, и медицинские принадлежности, о существовании которых раньше не знали."
62060-51 = "Для них это не просто «аварийные припасы». Студенты впервые получили одеяла с нормальной теплоизоляцией, а не лоскуты ткани, которыми обычно пользовались."
62060-52 = "Даже питательные наборы, которые они привезли, для Ариуса в новинку."
62060-53 = "Понятно. То, что для одного кажется мелочью повседневной жизни, для другого может быть настоящим чудом."
62060-55 = "Мине просила нас защитить именно это, верно?"
62060-56 = "Иметь обычный распорядок. Чувствовать уверенность в завтрашнем дне. Расти благодаря такой жизни..."
62060-57 = "Оказывается, всё это удивительно трудно получить."
62060-58 = "[s4] «Ты права, Мисаки.»\n[s5] «Именно здесь я должен стать лучше как учитель.»"
62060-61 = "Но... я правда больше не хочу учиться..."
62060-62 = "[s] «Стыдоба! Это твоя обязанность как студенты!»"
62060-63 = ""
62060-65 = ""
62060-66 = "Т-Только что ты и правда прозвучал как настоящий учитель...!"
62060-67 = "А. Точно. Ты же И ЕСТЬ учитель, да?"
62060-68 = "[s6] «Ладно! Ничего не поделаешь!»\n[s7] «То, что я сейчас сделаю, — худший кошмар любого ученика!»"
62060-69 = ""
62060-70 = ""
62060-72 = ""
62060-73 = "Что... это?"
62060-74 = "[s8] «Я разошлю всем сообщение через MomoTalk!»\n[s9] «И объявлю, что завтра занятия по расписанию!»"
62060-77 = "Как жестоко, Сенсей."
62060-78 = "Люди растут и становятся сильнее, заставляя себя делать то, чего не хотят?"
62060-79 = "*вздыхает* В Ариусе говорят примерно то же самое, только наша версия немного мрачнее."
62060-80 = "Я это помню..."
62060-81 = "Фуфу. Лично мне занятия Сенсея нравятся больше, чем ариусские. Разумеется, говорю только за себя."
62060-82 = "Ах, уверена, Мисаки со мной не согласится, верно?"
62060-83 = "...Я такого не говорила."
62060-84 = ""
62060-86 = ""
62060-88 = "Хи-хи!"
62060-89 = "Хех. Хи-хи..."
62060-90 = ""
62060-93 = ""
62060-94 = "Почему, когда речь обо мне, вы всегда начинаете вот это?!"
