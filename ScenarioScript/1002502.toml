[translation]
1002502-1 = "Как удобно быть маленькой!"
1002502-2 = "Кафе «Мильфей»"
1002502-3 = "Мне лимитированный парфе с ромом и изюмом, пожалуйста!"
1002502-4 = "[s1] «Парфе?»\n[s2] «Вот что ты хотела попробовать с тех пор, как стала маленькой?»"
1002502-5 = "Это не просто парфе — это лимитированный парфе с ромом и изюмом!"
1002502-6 = "Это не просто парфе — это лимитированный парфе с ромом и изюмом!"
1002502-7 = "В кафе «Мильфей» круглый год продают множество вкусных парфе, но вариант с ромом и изюмом — лимитированный, его продают только зимой."
1002502-8 = "А всё потому, что мороженое с изюмом, настоянным на роме, трудно хранить в жаркую погоду."
1002502-9 = "Здешний ромовый изюм особенно роскошный на вкус. Высококачественный изюм выдерживают в тёмном роме!"
1002502-10 = "Единственный недостаток — продают только по одной порции на человека, а сама порция настолько маленькая, что толком не успеваешь насладиться..."
1002502-11 = "Но теперь я такая маленькая, что даже этой небольшой порции парфе мне хватит, чтобы наесться!"
1002502-12 = "[s] «Почему я сам до этого не додумался?!»"
1002502-13 = "Похожая сцена была в истории, которую ты раньше читал детям из Сада цветущей сливы."
1002502-14 = "Главный герой попадает в страну великанов, где съедает много тортов, каждый из которых больше него."
1002502-15 = "С моим крошечным телом даже Кивотос теперь кажется мне королевством великанов."
1002502-16 = "Кстати, какой парфе возьмёшь ты, Сенсей?"
1002502-17 = "Не хочешь попробовать ромовый изюм вместе со мной?"
1002502-18 = "[s] «Я возьму обычный клубничный йогурт.»"
1002502-19 = "Что? Клубничный йогурт?"
1002502-20 = "Конечно, клубничный йогурт сладкий, я понимаю. Но на фоне глубоких вкусов вроде матча и рома с изюмом он немного простоват."
1002502-21 = "Может, это у тебя здесь детский вкус, Сенсей."
1002502-22 = "[s3] «Взрослым тоже может нравиться сладкое!»\n[s4] «Просто я сохранил детское чувство восторга — вот и всё!»"
1002502-23 = "Хи-хи. В этом нет ничего плохого. Я тоже люблю сладкий клубничный парфе."
1002502-24 = "Хи-хи. В этом нет ничего плохого. Я тоже люблю сладкий клубничный парфе."
1002502-25 = "Но сегодня особый случай, поэтому я буду наслаждаться ромовым изюмом."
1002502-26 = "Надеюсь, его скоро принесут. Не могу дождаться."
1002502-29 = "Спасибо за ожидание. Ваш клубнично-йогуртовый парфе, а вот ромовый изюм."
1002502-30 = "А? Простите, но вы перепутали наши заказы."
1002502-31 = "Сенсей заказал клубничный йогурт, а я — ромовый изюм."
1002502-32 = "Простите? Этот вкус рассчитан на взрослых. Для девочки вашего возраста он слишком утончённый."
1002502-33 = "(сверлит взглядом)"
1002502-34 = "П-Прости."
1002502-35 = "Приятного аппетита!"
1002502-36 = ""
1002502-38 = ""
1002502-39 = "Как грубо. Судить о моих вкусах только по внешности. Странная официантка."
1002502-40 = "В любом случае, приступим!"
1002502-41 = ""
1002502-43 = ""
1002502-44 = ""
1002502-45 = ""
1002502-46 = "...?!"
1002502-47 = "[s] «Что случилось?»"
1002502-48 = "О-О. Наверное, я просто давно его не ела. Вот и немного удивилась..."
1002502-49 = "Хорошо. Ещё один кусочек."
1002502-50 = ""
1002502-51 = ""
1002502-52 = "Э-Эм..."
1002502-53 = "[s] «С парфе что-то не так?»"
1002502-54 = "Нет, не думаю."
1002502-55 = "Нежная сладость изюма, глубокая насыщенность тёмного рома... Это всё тот же знакомый мне парфе, но..."
1002502-56 = "...может, из-за того, что теперь я меньше, насыщенный вкус ромового изюма кажется мне слишком сильным."
1002502-57 = "[s] «Хочешь поменяться на мой клубничный парфе?»"
1002502-58 = "В моём нынешнем состоянии клубничный и правда звучит привлекательнее..."
1002502-59 = "Нет, нельзя. Это должен был быть особый случай, и он доступен лишь ограниченное время. Я не могу сдаться сейчас."
1002502-60 = "Я попробую ещё раз!"
1002502-62 = "Всё-таки я не могу его есть..."
1002502-63 = ""
1002502-65 = ""
1002502-67 = ""
1002502-68 = "[ns] Поменяться парфе с Шун."
1002502-69 = ""
1002502-70 = "Спасибо, Сенсей."
1002502-71 = ""
1002502-72 = "*жует* *жует*"
1002502-73 = ""
1002502-74 = "Похоже, с этим телом сладости всё-таки подходят лучше всего!"
1002502-76 = "После этого я наблюдал, как Шун по-детски счастливо ест клубничный парфе."
1002502-77 = "Парфе с ромом и изюмом, который заказала Шун, действительно обладал глубоким взрослым вкусом..."
