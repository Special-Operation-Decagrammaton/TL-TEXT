[translation]
2002205-1 = "Не спеша, вот так"
2002205-2 = "Кампус Геенны"
2002205-8 = ""
2002205-9 = "Сенсей! Прости. Надеюсь, ты не слишком долго ждал."
2002205-10 = "[s] «Не извиняйся! Я тоже только что пришёл.»"
2002205-11 = "Я надела кимоно, как ты и просил."
2002205-12 = "Но... что мы будем делать?"
2002205-13 = "[s1] «Для начала мы отсюда выберемся.» \n[s2] «Тебе стоит иногда выбираться из Геенны, Фуука.»"
2002205-16 = "Ч-Что...?"
2002205-17 = "Ну, хорошо. Я доверюсь тебе, Сенсей."
2002205-19 = "Центр города"
2002205-20 = "Я слышала, как некоторые студенты рассказывали об этом месте. Это огромная смотровая площадка в небоскрёбе, да?"
2002205-21 = "Я ещё никогда не ездила в таком быстром лифте..."
2002205-22 = "У меня до сих пор немного кружится голова. Кто бы мог подумать, что меня укачивает?"
2002205-23 = ""
2002205-25 = ""
2002205-26 = "Смотри, Сенсей. Отсюда и правда видно весь город!"
2002205-27 = "Н-но... почему даже пол здесь стеклянный?!"
2002205-28 = "Так страшно... Кажется, я даже не смогу подойти к тебе."
2002205-29 = "П-прости, Сенсей, но можешь подойти и взять меня за руку?"
2002205-31 = ""
2002205-34 = ""
2002205-35 = "Фух! Какое облегчение снова стоять обеими ногами на твёрдой земле."
2002205-36 = "Не пойми меня неправильно! Вид мне понравился. Просто... высота... да ещё и прозрачный пол..."
2002205-37 = "Что? Тебе тоже было страшно, Сенсей?"
2002205-38 = "Странное явление... Почему люди платят деньги, чтобы попасть туда, где им страшно?"
2002205-39 = "Что ты имеешь в виду? Это напомнило тебе о другом месте, куда ты хочешь сходить?"
2002205-40 = "Только пусть оно не будет страшным, Сенсей! Мне понравилась смотровая площадка, но это почти предел моих сил!"
2002205-42 = ""
2002205-48 = "Парк развлечений"
2002205-50 = "О, парк развлечений! Недавно я слышала, как студенты в столовой восторженно обсуждали поездку в такое место."
2002205-51 = ""
2002205-53 = ""
2002205-54 = "Что? Он разгоняется с нуля до 110 миль в час за 1,56 секунды?!"
2002205-55 = "И у него есть петля вверх ногами диаметром 39,7 метра?"
2002205-56 = "Это вообще безопасно для людей?! Мы не умрём?"
2002205-57 = "[s] «Не заставляй себя, если не хочешь.»"
2002205-58 = "Но... ты ведь столько сил потратил, чтобы всё это для нас спланировать."
2002205-59 = "Ладно. Я справлюсь. Я прокачусь на американских горках!"
2002205-61 = "КЬЯЯЯ!"
2002205-63 = ""
2002205-69 = ""
2002205-70 = "Ух... Я-я ещё жива?"
2002205-71 = "Хм? Скоро начнётся парад?"
2002205-72 = "О, вот оно! На баннере написано «Объединённая академия Хяккияко»."
2002205-73 = "Я слышала о роскошных фестивалях Хяккияко, но даже не мечтала увидеть один из них своими глазами!"
2002205-74 = "Смотри, Сенсей. За ними академия Шанхайцзин! И... Красная Зима тоже?"
2002205-75 = "Понятно. Как интересно! Это парад, показывающий уникальные особенности и символы разных школ Кивотоса."
2002205-76 = "Интересно, увидим ли мы Геенну! А, вон там Тринити и..."
2002205-78 = "Торговый квартал"
2002205-79 = ""
2002205-82 = ""
2002205-83 = "Спасибо за сегодняшний день, Сенсей. Ха-ха-ха."
2002205-84 = "Ты проголодался? Я тоже не отказалась бы от перерыва... Где будем есть?"
2002205-85 = "Хм? Мы можем пойти в любой ресторан, который выберу я?"
2002205-86 = "И я могу заказать всё, что захочу?"
2002205-87 = "Я... Мне будет так неловко..."
2002205-88 = "Н-ну... Если ты так говоришь, Сенсей."
2002205-90 = "Мы с Фуукой зашли в выбранный ею ресторан и заказали всё, что захотели из меню."
2002205-92 = "Какой вкусный ужин. Н-но..."
2002205-93 = "Ты уверен, Сенсей? Счёт такой..."
2002205-94 = "Ты правда не против потратить столько денег на кого-то вроде меня?!"
2002205-95 = "[s] «Кто-то вроде тебя заслуживает ужина куда лучше этого, Фуука!»"
2002205-96 = "Простите..."
2002205-97 = "Хм? За это не нужно извиняться?"
2002205-98 = "Я просто... Ладно, наверное, я понимаю..."
2002205-99 = "Спасибо, Сенсей."
2002205-100 = "[s] «Может, немного прогуляемся, если ты не устала.»"
2002205-101 = "Совсем не устала! Давай прогуляемся."
2002205-103 = "Улица"
2002205-104 = ""
2002205-107 = ""
2002205-108 = "Как тихо..."
2002205-109 = "Обычно я уже не бываю на улице к тому времени, когда город начинает засыпать."
2002205-110 = "[s] «Мы провели вместе долгий день.»"
2002205-111 = "Но день был довольно невероятным."
2002205-112 = "[s] «Я рад. Сегодня я хотел, чтобы ты почувствовала себя свободной.»"
2002205-113 = "С-свободной?"
2002205-114 = "Что ты имеешь в виду?"
2002205-115 = "[ns] «Твой мир заперт в столовой Геенны...»"
2002205-117 = "[ns] «...Но ты заслуживаешь увидеть больше. Испытать всё.»"
2002205-118 = ""
2002205-120 = ""
2002205-121 = "С-Сенсей..."
2002205-122 = "Я бы не сказала, что я там заперта..."
2002205-123 = "Я сама решила сосредоточиться на своих обязанностях."
2002205-124 = "[ns] «Именно это мне в тебе и нравится, Фуука.»"
2002205-126 = "[ns] «Но такая трудолюбивая девушка, как ты, заслуживает праздничного подарка.»"
2002205-127 = "Мой праздничный подарок..."
2002205-128 = "Кажется, я понимаю, чего ты хотел добиться сегодня, Сенсей."
2002205-131 = "― Я просто... так счастлива.[wa:2800]"
2002205-134 = "― Ещё раз спасибо тебе, Сенсей.[wa:2800]"
2002205-137 = "― Ты всегда столько мне даёшь.[wa:3420]"
2002205-140 = "― Ты всегда с удовольствием ешь мою еду...[wa:1860]"
2002205-141 = "― Тебе она нравится больше, чем кому-либо.[wa:1180]"
2002205-144 = "― Это...[wa:1300]"
2002205-145 = "― самый лучший подарок, который мне вообще могли бы подарить.[wa:1980]"
2002205-148 = "― Поэтому, эм... Сенсей.[wa:3840]"
2002205-149 = "― Пожалуйста, продолжай есть мою еду и завтра, и всегда.[wa:2080]"
2002205-152 = "Фуука наслаждалась тихой прогулкой по спящему городу, пока я провожал её домой."
2002205-153 = "Кампус Геенны"
2002205-154 = ""
2002205-157 = ""
2002205-158 = ""
2002205-159 = ""
2002205-160 = ""
2002205-161 = "А-А-А!"
2002205-162 = ""
2002205-164 = ""
2002205-166 = "[ns] «Ты в порядке?!»"
2002205-167 = "Д-да, я просто немного споткнулась..."
2002205-168 = "Ай!"
2002205-169 = "Прости... Кажется, я подвернула лодыжку. Ай!"
2002205-170 = ""
2002205-171 = "Я успел поймать Фууку как раз в тот момент, когда она пошатнулась вперёд."
2002205-172 = ""
2002205-174 = "С-Сенсей?"
2002205-175 = "Сенсей..."
2002205-176 = "Можно нам... ещё немного побыть вот так?"
2002205-177 = ""
2002205-179 = ""
2002205-180 = "(На самом деле уже совсем не болит...)"
2002205-181 = "(Прости, Сенсей. Кажется... я плохая девочка.)"
2002205-183 = "Поддерживая Фууку за больную ногу, я помог ей добраться обратно до комнаты."
