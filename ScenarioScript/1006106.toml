[translation]
1006106-1 = "Неожиданное увлечение"
1006106-2 = "Я пришёл в кабинет Сакурако в соборе на консультацию, о которой она попросила."
1006106-3 = ""
1006106-6 = "Спасибо, что пришли, Сенсей."
1006106-7 = ""
1006106-12 = "Спасибо, что ради меня вы нашли время прийти, хотя дело касается лишь моей личной проблемы."
1006106-13 = "Правильнее было бы мне прийти к вам, а не наоборот, но, к сожалению, сейчас я не могу себе этого позволить."
1006106-14 = "[s1] «Знаю. Из-за работы, да?»\n[s2] «Не переживай. Я всё прекрасно понимаю.»"
1006106-17 = "А, вижу, объяснять не нужно. Спасибо, Сенсей."
1006106-18 = ""
1006106-20 = ""
1006106-21 = "Тогда перейду сразу к делу. Не хочу тратить ваше время."
1006106-22 = "Сегодня я хотела спросить вас об увлечениях."
1006106-23 = "[s] «Об увлечениях?»"
1006106-24 = "Да. Недавно, когда я выслушивала исповедь одной из сестёр, она задала мне вопрос."
1006106-25 = "Она рассказывала, что ей тяжело из-за того, что на увлечения стало оставаться меньше времени."
1006106-26 = "В какой-то момент она остановилась и спросила: «А какое у вас увлечение, сестра Сакурако?»"
1006106-27 = "И... я не смогла ответить."
1006106-28 = "Хотела бы я ответить, но, кажется, у меня нет ничего, что я могла бы назвать увлечением."
1006106-29 = "Если честно, я даже не уверена, что точно понимаю, что такое увлечение."
1006106-30 = "Разумеется, я не считаю, что раз у всех остальных есть хобби, то и мне обязательно нужно его завести."
1006106-31 = "Однако..."
1006106-32 = "[s3] «Ты хочешь лучше понимать, как помогать другим.»\n[s4] «Ты хочешь лучше понимать чувства других.»"
1006106-35 = "Верно. Теперь, когда я рассказала вам, пожалуй, эта история уже не только обо мне."
1006106-36 = "Возможно, мне трудно понять увлечения, потому что мои повседневные обязанности строго определены, и свободного времени почти не остаётся."
1006106-37 = "А когда оно всё же появляется, я обычно ещё раз проверяю подготовку к предстоящему мероприятию в соборе или занимаюсь расписаниями других сестёр."
1006106-38 = "А, не поймите неправильно. Я не жалуюсь. Я не чувствую давления сроков и не несчастна из-за своих обязанностей. Но всё же..."
1006106-39 = "Сенсей."
1006106-40 = ""
1006106-42 = ""
1006106-43 = ""
1006106-45 = "Каково это — иметь «свободное время»? Что такое хобби?"
1006106-46 = "Я слышала, что у вас есть увлечения, на которые вы иногда тратите время и силы."
1006106-47 = "Поэтому мне хотелось понять, как человек обретает хобби и зачем..."
1006106-48 = "А?"
1006106-49 = "О, то есть у него вовсе не обязательно должна быть цель или смысл. Понятно. Тогда... это скорее похоже на привычку?"
1006106-50 = ""
1006106-52 = ""
1006106-53 = "Действительно. В этом есть смысл."
1006106-54 = "Я поняла свою ошибку. Я воспринимала хобби как осознанно выбранное занятие, которое выбирают из понимания себя или заботы о себе."
1006106-55 = "Но теперь понимаю, что увлечение формируется куда более подсознательно, чем я думала. Кажется, теперь я понимаю чуть лучше."
1006106-56 = "Тогда возможно ли, что у меня уже есть хобби, о котором я сама не знаю?"
1006106-57 = "[s] «Вспомни, чем ты занималась в последнее время, когда не было работы.»"
1006106-58 = ""
1006106-60 = ""
1006106-61 = "[ns5] «То, к чему ты тянулась неосознанно.»\n[ns6] «То, что ты делала без какой-либо цели.»"
1006106-62 = ""
1006106-63 = ""
1006106-65 = ""
1006106-66 = "Ах... Понятно."
1006106-67 = "В последнее время... что я делала без особого намерения? Чем занималась, когда появлялось немного времени..."
1006106-68 = "Дайте подумать. Между делами или во время поездок у меня иногда бывают небольшие паузы."
1006106-69 = "И в это время..."
1006106-70 = "Полагаю, именно тогда я отправляла вам сообщения в MomoTalk, Сенсей."
1006106-71 = "Или, когда вспоминала что-нибудь интересное, рассказывала вам об этом..."
1006106-72 = "Или, когда меня что-то беспокоило, просила вас о консультации..."
1006106-73 = "Или... эм... что-то ещё..."
1006106-74 = "Вроде... этого..."
1006106-75 = ""
1006106-77 = ""
1006106-78 = ""
1006106-79 = ""
1006106-80 = ""
1006106-82 = ""
1006106-84 = "[ns7] «...Сакурако?»\n[ns8] «Что это сейчас было?»"
1006106-85 = ""
1006106-86 = ""
1006106-88 = ""
1006106-89 = "Хм?"
1006106-90 = "Эм. Хм... Ну..."
1006106-91 = ""
1006106-93 = ""
1006106-94 = "Сенсей."
1006106-95 = "Сенсей."
1006106-96 = "Простите, но можно попросить на сегодня закончить наш разговор?"
1006106-97 = "Что касается решения... думаю, я его нашла. Однако сейчас мне нужно немного времени, чтобы прийти в себя."
1006106-98 = "Я понимаю, что сейчас веду себя довольно невежливо."
1006106-99 = "Но надеюсь, вы, как обычно, отнесётесь с пониманием."
1006106-100 = "Так что, пожалуйста. На сегодня..."
1006106-101 = ""
1006106-103 = ""
1006106-105 = "[ns] «...»"
1006106-107 = "[ns] «...?»"
1006106-109 = "Сакурако проводила меня из собора, всё это время выглядя заметно смущённой."
