[translation]
1001008-1 = "Разведка города"
1001008-2 = "Улица возле Абидоса"
1001008-3 = ""
1001008-4 = "(По дороге я случайно наткнулся на Широко.)"
1001008-5 = "13:30... Грузовик Кайзер прибыл точно по расписанию. Сначала они погрузят самые тяжёлые вещи."
1001008-6 = "Когда кладовщик уйдёт, часть склада останется без присмотра."
1001008-7 = "Это даст мне окно, чтобы проникнуть в здание через заднюю дверь. В зависимости от ситуации, возможно, придётся заранее подготовить машину..."
1001008-8 = "Хм. Сейчас слишком людно, нужно выбрать время получше."
1001008-9 = "Отлично. Следующая точка."
1001008-10 = ""
1001008-11 = "[s] Проследить за Широко и выяснить, почему она ведёт себя подозрительно."
1001008-13 = "Другая улица"
1001008-14 = ""
1001008-15 = "(Широко намеренно держится вне поля зрения и наблюдает за шоссе.)"
1001008-16 = "Сейчас 14:10... Водитель грузовика Kouki Electric всегда спит в это время под эстакадой шоссе KV."
1001008-17 = "Это может стать способом попасть в здание... если мне удастся забраться в грузовой отсек."
1001008-18 = "Хм. Тогда нужно взять еду, потому что грузовик пять часов без остановки едет по окраинам..."
1001008-19 = "Хм. Перехожу к следующей точке."
1001008-20 = ""
1001008-21 = "[s] Продолжить следить за Широко, чтобы докопаться до причины её странного поведения."
1001008-23 = "Крыша здания"
1001008-24 = ""
1001008-25 = "(Широко скрытно наблюдает за банком сверху.)"
1001008-26 = "Сейчас 15:00. Охрана серьёзная... но во время смены караула всегда появляется окно."
1001008-27 = "Если ударить за те пять минут, пока они передают обязанности, путь к хранилищу будет открыт..."
1001008-28 = ""
1001008-29 = ""
1001008-30 = "[s] «Что ты делаешь?»"
1001008-31 = "?!"
1001008-32 = "..."
1001008-33 = "С-Сенсей?!"
1001008-34 = "Эм, ну... Я могу объяснить..."
1001008-35 = "Я, эм... Как бы объяснить? Это..."
1001008-36 = "[s] «Не думаю, что могу закрыть на это глаза, Широко.»"
1001008-37 = "..."
1001008-38 = "То есть вы говорите, что грабить банк нельзя?"
1001008-39 = "[s] «Думаю, это относится к преступлениям вообще.»"
1001008-40 = "Это не преступление, если тебя не поймали..."
1001008-41 = "[s] «Считай, что тебя поймали.»"
1001008-42 = "Но... Простите. Я понимаю..."
1001008-43 = "Если честно, я и не собиралась доводить план до конца. Это скорее... хобби."
1001008-44 = "..."
1001008-45 = "...Простите."
1001008-46 = ""
1001008-47 = "(Широко выглядела немного подавленной.)"
