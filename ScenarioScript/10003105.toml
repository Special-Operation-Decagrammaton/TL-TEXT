[translation]
10003105-1 = "Эпизод 10;Лето ещё не закончилось"
10003105-2 = "Так Хина успешно подавила инцидент, угрожавший погрузить пляж в хаос."
10003105-3 = "Летний тренировочный лагерь завершился по расписанию, и почти пришло время возвращаться в Геенну."
10003105-5 = "Штаб летнего лагеря"
10003105-6 = "П-Пожалуйста, простите меня, главный префект! Я лишь хотела решить проблему до того, как всё выйдет из-под контроля!"
10003105-7 = "Но именно это и произошло, разве нет?"
10003105-8 = "Я думала, мы справимся своими силами..."
10003105-9 = "Я не понимаю, зачем ты вообще пыталась скрыть это от меня."
10003105-10 = "Всё решилось бы намного проще, если бы ты просто сказала мне."
10003105-11 = "Но если бы мы так сделали..."
10003105-12 = "Хм?"
10003105-13 = "Если бы мы так сделали, вы бы не смогли насладиться отпуском!"
10003105-14 = "А?"
10003105-15 = "Я всего лишь хотела, чтобы вы наконец заслуженно отдохнули от работы! *всхлип*"
10003105-16 = "Какой ещё отпуск? О чём ты говоришь?"
10003105-17 = "Эм, ну... На самом деле Ако хотела сказать..."
10003105-18 = "Она сказала нам, что в последнее время вы очень напряжены."
10003105-19 = "Напряжена? С чего бы мне быть напряжённой?"
10003105-20 = "*всхлип* Потому что недавно вы сказали, что кофе, который я приготовила, был превосходным. Вы бы никогда так не сказали..."
10003105-21 = "Кофе? Ты о той чашке, которую приготовила, когда мы обсуждали сотрудничество с Шале?"
10003105-22 = "Кажется, здесь произошло недоразумение, Ако."
10003105-23 = "А?"
10003105-24 = "Я назвала кофе превосходным не потому, что была в стрессе. Скорее, потому что у меня было хорошее настроение..."
10003105-25 = "[s1] «Работа с Шале всегда делает кофе вкуснее?»\n[s2] «Ого, прямо как жареная кукуруза на пляже...»"
10003105-26 = "С-Сенсей?! Я вовсе не это имела в виду...!"
10003105-27 = "С-Сенсей?! Я вовсе не это имела в виду...!"
10003105-28 = "Я хотела сказать..."
10003105-29 = "Н-Неважно — это несущественно! Вернёмся к делу: я понимаю, что ты хотела как лучше, но наверняка были и другие способы дать мне немного отдыха."
10003105-30 = "Да, прошу прощения."
10003105-31 = "Однако... правда в том, что за эти два дня я смогла отдохнуть больше обычного. Для меня это был новый опыт."
10003105-32 = "Но это совершенно отдельный вопрос от моего самочувствия."
10003105-33 = "Я поняла, что предпочту быть чем-то занята, чем просто сидеть без дела."
10003105-34 = "[s] «Ага. Трудоголик. Чистый стокгольмский синдром.»"
10003105-35 = "Ты что-то сказал, Сенсей?"
10003105-36 = "[s] «Н-Ничего.»"
10003105-37 = "В любом случае, летний лагерь этого года из-за всего этого превратился в катастрофу. Не думаю, что остальные получили много полезной тренировки."
10003105-38 = "Неизвестно, как отреагирует Общество Пандемониума, если мы вернёмся без каких-либо ощутимых результатов."
10003105-39 = "Полагаю, другого выбора у нас нет."
10003105-40 = "Настоящий летний тренировочный лагерь начинается прямо сейчас."
10003105-41 = "П-Погодите, главный префект. Это ведь значит...?"
10003105-42 = "С этого момента никому нельзя приближаться к пляжу. Мы начинаем изнурительный летний тренировочный режим, который я изначально планировала."
10003105-43 = "..."
10003105-44 = "..."
10003105-45 = "..."
10003105-46 = "Последние пару дней вы развлекались. Теперь начинается настоящая тренировка, и поскольку времени мало, работать будем и ночью."
10003105-47 = "К тому времени, как я с вами закончу, даже Общество Пандемониума будет впечатлено результатами."
10003105-48 = "Это должна быть какая-то больная шутка!"
10003105-49 = "Мы уже вымотаны, но не думаю, что она примет «нет» за ответ."
10003105-50 = "Д-Да, мэм. Поняла..."
10003105-51 = "..."
10003105-52 = "А ты, Сенсей? Есть возражения?"
10003105-53 = "[s] «Нет, мэм.»"
10003105-54 = "Хороший ответ."
10003105-55 = ""
10003105-56 = ""
10003105-58 = ""
10003105-59 = "(Потом загладишь передо мной вину. Хорошо?)"
10003105-61 = "И так обманчиво короткое лето, проведённое мной с Дисциплинарным комитетом Геенны... ещё не закончилось."
10003105-62 = "Летние каникулы главного префекта Хины!"
