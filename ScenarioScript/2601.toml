[translation]
2601-1 = "Игрушка для взрослых. Часть 1"
2601-3 = "Офис Променада Чёрной Черепахи"
2601-4 = "Здравствуйте, президент Руми. Добрый день."
2601-5 = "О, Кокона. Добро пожаловать."
2601-6 = "Не называйте меня просто Коконой. Называйте меня инструктор Кокона!"
2601-7 = "Я тоже полноценный инструктор, как и вы, ясно? Серьёзно... Пожалуйста, не обращайтесь со мной как с ребёнком!"
2601-8 = "Ха-ха, прости. Я всё ещё не привыкла тебя так называть."
2601-9 = "Итак, что привело сегодня в офис «инструктора Кокону»?"
2601-10 = "Проголодалась? Может, приготовить тебе жареного риса?"
2601-11 = "Нет, я пришла не поесть. Я пришла забрать ингредиенты."
2601-12 = "Ингредиенты?"
2601-13 = "Да. Шун попросила меня забрать продукты для еды детей из Сада сливовых цветов."
2601-14 = "Вы не получили уведомление?"
2601-15 = "Ах, как я могла забыть? Наверное, совсем заработалась."
2601-16 = "Подожди здесь минутку. Я скоро вернусь."
2601-18 = ""
2601-19 = "Посмотрим. Я принесла капусту, бамбуковые побеги, морковь, лук... а ещё сушёную китайскую лапшу и соевое молоко."
2601-20 = "А, и возьми плоские персики у входа. Они сладкие, так что получится полезный десерт."
2601-21 = "Э-Этого же очень много. Вы уверены, что всё нормально?"
2601-22 = "Я думала, что просто заберу немного оставшихся продуктов..."
2601-23 = "Более чем нормально. Эти дети — будущее Шаньхайцзина. Им нужно хорошо питаться и расти крепкими!"
2601-24 = "Ох, хотя, может, для тебя одной это всё-таки тяжеловато."
2601-25 = "Н-Нет, я справлюсь. Для такого инструктора, как я, это пустяки."
2601-26 = "Тогда замечательно."
2601-27 = "О, чуть не забыла. Возьми ещё и это."
2601-28 = ""
2601-29 = ""
2601-30 = "Что в пакете? Ещё еда?"
2601-31 = "Нет, это особый предмет, который инструктор Шун специально заказала у Променада Чёрной Черепахи."
2601-32 = "Это..."
2601-33 = ""
2601-34 = "...секрет."
2601-35 = "А? Серьёзно?!"
2601-36 = "Именно. Шун даже заставила меня поклясться никому не рассказывать."
2601-37 = "Даже если ты младшая сестра Шун, сохранение тайны клиентов — вопрос доверия к Променаду. Прости, но рассказать не могу."
2601-38 = "Ух. Теперь мне ещё любопытнее."
2601-40 = "Там что-то твёрдое, и если потрясти, оно гремит. Игрушка?"
2601-41 = "Ну, ты не совсем ошиблась. Если придираться к формулировкам, это можно назвать игрушкой для взрослых."
2601-42 = "Игрушка... для взрослых?"
2601-43 = "Ага. Внутри лежит то, что детям точно не предназначено — даже детям твоего возраста."
2601-44 = "Так что даже не думай тайком заглянуть внутрь по дороге обратно."
2601-45 = "Да ладно! Вы с Шун не настолько уж старше меня!"
2601-46 = "Я тоже полноценный инструктор, так что совершенно нечестно, что только я ничего не знаю!"
2601-47 = "Некоторые вещи лучше не знать, Кокона."
2601-48 = "Например, если раскрывается секрет Генрюмона — студсовета Шаньхайцзина, — его сотрудники устраняют всех свидетелей ради сохранения школьной тайны. Разве не так?"
2601-49 = "Поэтому студенты Шаньхайцзина убегают, если кто-то пытается рассказать им секрет Генрюмона, — чтобы случайно не услышать того, чего им знать не следует."
2601-50 = "Генрюмон?! То, что внутри, связано с ними?!"
2601-51 = "Хм. Не могу ни подтвердить, ни опровергнуть... но давай просто предположим, что связано."
2601-52 = "Так что, Кокона, после всего сказанного, думаю, лучше тебе просто доставить предмет. Согласна?"
2601-53 = "П-Поняла!"
2601-54 = "Обещаю не смотреть внутрь и сразу отнести это Шун!"
2601-55 = "Вот и хорошо. Поручаю это твоим надёжным рукам."
2601-56 = ""
2601-58 = ""
2601-59 = ""
2601-60 = "Х-Ха-ха. Немного жестоко, но, похоже, она поверила."
2601-62 = "Улица Променада Чёрной Черепахи"
2601-63 = ""
2601-64 = ""
2601-65 = ""
2601-66 = "Чем больше думаю, тем любопытнее. Это ведь вроде как игрушка для взрослых, да?"
2601-67 = "Но президент Руми сказала, что если посмотрю, могу влипнуть в большие неприятности. Лучше выбросить это из головы и просто отнести Шун."
2601-68 = "[s] «Привет, Кокона.»"
2601-69 = "О, Сенсей. Здравствуйте."
2601-70 = "[s1] «Выглядит довольно тяжёлым.»\n[s2] «Что ты несёшь?»"
2601-71 = "Это куча продуктов от Променада Чёрной Черепахи и..."
2601-72 = "Это куча продуктов от Променада Чёрной Черепахи и..."
2601-73 = "...эм, игрушка для взрослых для Шун."
2601-74 = "[s] «...Что-что?»"
2601-76 = "О нет! Президент Руми сказала, что мне нельзя никому об этом рассказывать!"
2601-77 = "Плохо дело. Эти страшные люди из Генрюмона могут появиться в любую секунду и утащить нас..."
2601-78 = "Постойте. Вы взрослый, Сенсей, так что, может, вам можно знать о таких вещах, как игрушки для взрослых."
2601-79 = "[s] «...А что это вообще такое?»"
2601-80 = "Я и сама не знаю. Знаю только, что Шун вроде бы заказала это у Променада Чёрной Черепахи."
2601-81 = "Судя по форме пакета, там какое-то длинное твёрдое устройство..."
2601-82 = "Президент Руми сказала, что если я загляну внутрь, может случиться что-то очень плохое, поэтому это нужно хранить в тайне."
2601-83 = "Как думаете, что это может быть?"
2601-84 = "[s3] «Может, это просто новое оружие.»\n[s4] «Думаешь, это выпрямитель для волос?»"
2601-85 = "Хм. Наверное, может быть."
2601-86 = "Очень мощное и сложное оружие и правда стоило бы держать подальше от детей."
2601-87 = "Может, это ужасающее новое оружие, созданное с помощью запрещённой технологии..."
2601-88 = "Да ну. Если бы это было что-то настолько обычное, не было бы причин это скрывать, верно?"
2601-89 = "К тому же все знают, что у Шун волосы от природы идеально прямые."
2601-90 = "Наверняка это какое-то новое страшное оружие, слишком опасное для детей, или вообще какая-нибудь бомба..."
2601-91 = "Погодите. Который час? Не верится, что уже так поздно."
2601-92 = "Если продолжу мешкать, пропущу полдник. Надо торопиться."
2601-93 = ""
2601-94 = ""
2601-95 = "Сенсей, вы обязаны хранить игрушку для взрослых Шун в секрете! Обещайте!"
2601-96 = ""
2601-98 = ""
2601-101 = "Сад Цветущей Сливы"
2601-103 = "Эй, я вернулась!"
2601-104 = "Боже, сколько ингредиентов. Спасибо, что забрала их."
2601-105 = "Ага, президент Руми дала гораздо больше, чем я ожидала."
2601-106 = "Капуста, бамбуковые побеги, морковь... Она даже дала плоские персики на десерт."
2601-107 = "Ещё она попросила меня отдельно передать ту вещь, которую ты заказала."
2601-108 = "Ч-что?!"
2601-109 = ""
2601-111 = ""
2601-112 = ""
2601-113 = ""
2601-114 = "Ох, Руми. Я же говорила ей, что сама зайду за этим позже!"
2601-115 = "Кхм... Ты ведь не смотрела, что внутри, Кокона?"
2601-116 = "Нет. Президент Руми сказала не смотреть и что это не для детей."
2601-117 = "Вот и хорошо."
2601-118 = "Отличная работа, Кокона. Я скоро вынесу перекус, так что, пожалуйста, собери студентов."
2601-119 = ""
2601-121 = ""
2601-122 = "Кокона, Кокона. Что ты принесла с Променада Чёрной Черепахи?"
2601-123 = "Не называйте меня просто Коконой. Называйте меня инструктор Кокона!"
2601-124 = "Я просто забирала еду для всех. Скоро будет перекус, так что потерпи немного, ладно?"
2601-125 = "А что было в том пакете, который ты отдала Шун? Я слышала, как внутри что-то гремит. Там тоже еда?"
2601-126 = "Нет, это не для еды. Это игрушка для взрослых."
2601-127 = "Игрушка для взрослых? Я тоже хочу посмотреть! Что это за игрушка?!"
2601-128 = "Нет! Я же сказала: она для взрослых и ТОЛЬКО для взрослых. Если дети её увидят, случится что-то очень плохое."
2601-129 = "Почему? Она страшная?"
2601-130 = "Д-Да... Очень страшная! Вся в шипах и буграх! И выглядит ужасно, дети начинают плакать, как только её увидят."
2601-131 = "(Страшная...)"
2601-132 = "А, и это секрет, хорошо? Никому нельзя говорить, что ты об этом знаешь."
2601-133 = "Да, хорошо."
2601-134 = "Вот и умница. Правда же, ты хорошо умеешь слушаться?"
2601-135 = "Я пойду помогу Шун с перекусом, так что посиди спокойно ещё немного."
2601-136 = ""
2601-138 = ""
2601-140 = "Ты видела те пакеты, которые недавно были у Коконы и Шун? Что там было?"
2601-141 = "Ага, Кокона принесла еду, а в пакете Шун была игрушка для взрослых."
2601-142 = "Игрушка для взрослых? Это что?"
2601-143 = "Шун тайком купила её на Променаде Чёрной Черепахи. Это страшная игрушка с острыми шипами..."
2601-144 = "Страшно..."
2601-145 = "Что происходит? Вы страшилки рассказываете?"
2601-146 = "Ага. Это секрет, но Шун..."
2601-148 = "Вскоре слух о том, что Шун купила подозрительную игрушку, разошёлся по всему Шаньхайцзину из уст студентов Сада сливовых цветов..."
