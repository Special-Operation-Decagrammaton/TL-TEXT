[translation]
10037070-1 = "Эпизод 7;В глубине леса Юйчжоу"
10037070-4 = "Ух...!"
10037070-5 = ""
10037070-16 = "..."
10037070-17 = "(Я совсем запуталась. Что произошло...?)"
10037070-18 = "(Точно... Гости из Красной Зимы были в бамбуковом лесу... Мы собирались посмотреть на панд, а потом...)"
10037070-19 = ""
10037070-22 = "(А потом...?)"
10037070-23 = "[ns] «Ты уже очнулась, Кисаки?»"
10037070-24 = ""
10037070-26 = ""
10037070-27 = "Сенсей? Почему вы здесь...?"
10037070-28 = "Нет, подождите. Мне нужно привести мысли в порядок..."
10037070-29 = ""
10037070-31 = ""
10037070-32 = "..."
10037070-33 = "Не могли бы вы включить больше света? В комнате темновато."
10037070-34 = ""
10037070-44 = "А-а-а!"
10037070-45 = "[s] «...Мне снова его выключить?»"
10037070-46 = "...Пожалуйста..."
10037070-48 = "Что произошло в бамбуковом лесу?"
10037070-49 = "Понятно. Значит, гости какое-то время смотрели на панд, а потом вернулись...?"
10037070-50 = "Председатель Марина всё пыталась обнять панд? Фуфуфу... Мине, наверное, пришлось нелегко, пока она её останавливала..."
10037070-51 = "Похоже, председатель Марина и правда очень любит медведей. Но какими бы милыми они ни были, панды всё равно медведи."
10037070-52 = "Если бы что-то пошло не так, она могла серьёзно пострадать. Уверена, Мине было совсем нелегко обеспечить её безопасность."
10037070-53 = "Что я за президент, если даже гостей как следует встретить не могу? Я совершенно не подхожу для этой должности. Вы ведь тоже так считаете, Сенсей?"
10037070-54 = "[s] «...»"
10037070-55 = "Забавные они, эти гости из Красной Зимы."
10037070-56 = ""
10037070-58 = "И Великий Вождь Черино, какой бы непостижимой она ни казалась, обладает очень сильной волей."
10037070-59 = "Главный секретарь Томоэ старается это скрывать, но за её фасадом хорошо видна мудрость."
10037070-60 = "А председатель Марина... Фуфуфу! Освежает видеть человека с таким положением настолько непосредственным."
10037070-61 = "Все они замечательные. Все..."
10037070-62 = "[s] «...»"
10037070-65 = ""
10037070-66 = "..."
10037070-67 = "Вы удивлены, Сенсей?"
10037070-68 = "[s1] «...В таком состоянии нельзя всё время переживать за других...»\n[s2] «Сейчас я бы хотел, чтобы ты позаботилась о себе.»"
10037070-71 = "Вот что вы хотите мне сказать, Сенсей?"
10037070-72 = "О моём состоянии знают другие студенты? А гости из Красной Зимы?"
10037070-73 = "[s] «Сая всё хорошо уладила. Даже Мина ничего не заметила.»"
10037070-74 = "Вот как? Тогда я спокойна."
10037070-75 = "[s] «Я хочу, чтобы ты рассказала мне, что с тобой произошло.»"
10037070-76 = "Ничего особенного."
10037070-77 = "Просто... моё тело стало настолько слабым, что нормально функционировать я могу лишь небольшую часть каждого дня."
10037070-78 = "[s] «Разве это не очень серьёзно?!»"
10037070-79 = "Всё в порядке. Я ведь не полностью лишилась подвижности. Значит, я всё ещё могу делать многое, и мне этого достаточно. Правда..."
10037070-80 = "Кто ещё знает?"
10037070-81 = "Насколько я понимаю, никто, кроме Саи."
10037070-82 = "Даже Руми не знает. Я сделала всё возможное, чтобы мой секрет никто не раскрыл."
10037070-83 = "Это правда. Я знаю Руми очень давно."
10037070-84 = "Но в детстве, когда мы росли вместе, я не была настолько слабой."
10037070-85 = "[s] «Хочешь сказать, это началось внезапно?»"
10037070-86 = ""
10037070-88 = ""
10037070-89 = "..."
10037070-90 = "Всё началось, когда я сделала беспрецедентный шаг и стала президентом Генрюмона на втором курсе."
10037070-93 = "По традиции должность президента переходила третьекурсницам, но тот студент третьего курса опозорился и лишился своего положения."
10037070-94 = "Поэтому все единогласно решили выбрать меня."
10037070-95 = "Даже сейчас это кажется странным. Студенты, яростно защищавшие традиции, нарушили их, чтобы назначить меня, второкурсницу, президентом Генрюмона..."
10037070-96 = "[s3] «Неужели это...»\n[s4] «Может, дело в том, что быть президентом Генрюмона очень тяжело?»"
10037070-101 = "...Фу-фу..."
10037070-102 = "Иногда лучше не подходить к истине слишком близко, Сенсей."
10037070-103 = "Одним из первых моих действий на посту президента-второкурсницы было исключение третьекурсницы."
10037070-104 = "Все возражали. Такое суровое наказание обычно требует очень строгой процедуры."
10037070-105 = "...Получился настоящий парадокс. Те же люди, которые нарушили традицию, чтобы поставить второкурсницу президентом, в этом решении цеплялись за традиции."
10037070-106 = "Ох... Я отвлеклась. Вернёмся к сути."
10037070-107 = "Сразу после этого моё тело начало проявлять необычные признаки болезни."
10037070-108 = "Но, знаете... Фуфу. С тем же успехом это могли быть признаки стресса от тяжёлой работы президента."
10037070-109 = "[s] «...»"
10037070-110 = "Почему вы так уныло выглядите, Сенсей? Разве мне не удалось хорошо обмануть остальных?"
10037070-111 = "Если ни вы, ни Руми ничего не заметили, значит, удалось."
10037070-112 = "Вообще-то, думаю, с моими актёрскими талантами меня бы приняли в театральную труппу или киноклуб другой академии."
10037070-113 = "Фуфуфу! Актёрский мир Кивотоса, возможно, теряет огромный талант. Не думаете, Сенсей?"
10037070-114 = "[s5] «Если это настолько выматывает, может...»\n[s6] «Тебе стоит перестать скрываться под чужими образами?»"
10037070-117 = "...Да. Наверное, это было бы правильно."
10037070-118 = "Тот, кто потерял контроль над собственным телом, должен отдыхать в старом дворце."
10037070-119 = "Вы, наверное, думаете, зачем я продолжаю менять внешность и бродить вокруг будто без цели..."
10037070-120 = "[s] «...»"
10037070-121 = "Что ж, Сенсей, возможно, во мне говорит эгоизм и жадность..."
10037070-122 = "Но... пока не стало слишком поздно..."
10037070-123 = "Я хочу увидеть как можно больше, пока у меня ещё есть время."
10037070-124 = "[s7] «Почему... ты скрываешь болезнь от остальных студентов?»\n[s8] «Если бы ты рассказала правду, они могли бы тебе помочь.»"
10037070-125 = ""
10037070-126 = ""
10037070-128 = ""
10037070-129 = "..."
10037070-130 = "Потому что такова роль президента Генрюмона."
10037070-139 = ""
10037070-141 = "Если покажешь хоть малейшую слабость — хоть малейшее несовершенство — они заживо сожрут тебя изнутри."
10037070-142 = "Именно так предыдущая президент потеряла свою должность."
10037070-145 = "Вы считаете, что я слишком серьёзно отношусь к роли президента... Если бы это было не так, возможно, мне жилось бы легче."
10037070-146 = "Но, Сенсей, вы сами видели, что сделали студенты Шаньхайцзина — девушки из Генрюмона..."
10037070-147 = "Когда я сказала им приветствовать гостей по традициям Генрюмона, они отвели их в комнату допросов."
10037070-148 = "Они истолковали мои указания как приказ раскрыть любые заговоры...!"
10037070-149 = "[s9] «Во многих академиях студенты плохо себя ведут!»\n[s10] «Например, Общество Гурманов или Отдел Горячих Источников!»\n[s11] «Даже ребята из Инженерного Отдела Миллениума... Они добрые, но...!»"
10037070-153 = "...Вот как?"
10037070-154 = "..."
10037070-155 = "Но, Сенсей."
10037070-156 = "И всё же кажется... мне трудно просто оставить Шаньхайцзин как есть."
10037070-157 = ""
10037070-159 = ""
10037070-160 = "Кисаки медленно приподнялась и села..."
10037070-161 = ""
10037070-163 = ""
10037070-164 = ""
10037070-167 = "Затем наклонилась ко мне и прислонилась лбом к моей груди."
10037070-168 = "Лунный свет проникал в комнату через ближайшее окно."
10037070-171 = "У меня к вам просьба."
10037070-172 = "Я не хочу, чтобы о моём состоянии знал кто-либо, кроме вас и Саи. Пожалуйста."
10037070-173 = "Сая пообещала всегда хранить мой секрет. Так что если слухи разойдутся... я буду знать, кто рассказал."
10037070-174 = "[s] «...Хорошо.»"
10037070-175 = "Что такое, Сенсей? Вы выглядите обеспокоенным."
10037070-176 = "Всё хорошо. Я ведь всё ещё жива и могу двигаться, правда?"
10037070-177 = ""
10037070-179 = ""
10037070-180 = "Я поднял руку и мягко погладил Кисаки по волосам сзади."
10037070-181 = "Фуфу... Так приятно. Мне спокойнее, и кажется, боль хоть немного отступает."
10037070-182 = "Не переживайте так сильно, Сенсей. Кого ещё я могла бы попросить о таком одолжении, кроме вас?"
10037070-183 = ""
10037070-187 = "Кисаки подняла на меня взгляд ясных глаз и мягко улыбнулась."
10037070-188 = "Я не мог вынести такого выражения на её лице и неохотно закрыл глаза..."
10037070-195 = "...Вы хорошо себя чувствуете, Президент?"
10037070-196 = "Да, мне уже намного лучше. Не переживай."
10037070-197 = "Это так странно. Я совершенно уверена, что сегодня приняла эликсир бессмертия."
10037070-198 = "Да. Именно поэтому я здесь."
10037070-199 = ""
10037070-201 = ""
10037070-202 = ""
10037070-204 = "...Слушайте внимательно, госпожа. Я обнаружила, что кто-то подменил ваш эликсир."
10037070-205 = "...?!"
10037070-206 = "Уверена, вы понимаете, что означает такой поступок..."
10037070-207 = ""
10037070-209 = ""
10037070-211 = ""
10037070-212 = "Ну, во-первых, я должна прямо сейчас отчитать тебя за некомпетентность в управлении кадрами Общества Восточной Алхимии!"
10037070-213 = "Да, я заслуживаю порицания... Но есть проблема ещё серьёзнее!"
10037070-214 = "Это означает, что на ключевой должности в Обществе Восточной Алхимии есть предатель."
10037070-215 = "Да, иначе это истолковать невозможно..."
10037070-216 = "Я думала, беда пришла с холодным северным ветром, но, похоже, она пришла совсем с другой стороны."
10037070-217 = "Начиная с завтра я лично буду готовить ваш эликсир бессмертия, госпожа. А затем начну проверять каждого члена Общества Восточной Алхимии."
10037070-218 = "Печальный день, когда президент Общества Восточной Алхимии не может доверять собственным людям..."
10037070-219 = "Редко, но такое иногда случается."
10037070-220 = "Госпожа, вам следует быть гораздо осторожнее. А последствия своих ошибок я приму, когда всё это закончится."
10037070-221 = "Да. Так и сделаем. Ты тоже будь осторожна."
10037070-222 = "Мне жаль... Если бы я только могла приготовить более совершенный эликсир..."
10037070-223 = "Если бы мне удалось найти лекарственную траву, способную хоть немного улучшить состояние президента..."
10037070-224 = "Но результаты всегда либо временные, либо сопровождаются побочными эффектами, либо вообще никак не улучшают её состояние..."
10037070-225 = "Что ты такое говоришь? Без твоего эликсира ничего из этого вообще не получилось бы."
10037070-226 = ""
10037070-228 = ""
10037070-229 = "Госпожа, умоляю. Хотя бы завтра отмените все планы и отдохните."
10037070-230 = "Фуфу... Боюсь, ты просишь слишком многого. У нас важные гости."
10037070-231 = "Возможно, когда гости вернутся домой, я отдохну. А пока прошу простить эту ужасную пациентку."
10037070-232 = "...Понимаю..."
10037070-233 = ""
10037070-237 = ""
10037070-238 = "Телефонный звонок...?"
10037070-239 = ""
10037070-241 = ""
10037070-242 = "Это мне. Кто это... Кагуя?"
10037070-243 = ""
10037070-249 = "Уже так поздно... Что случилось?"
10037070-250 = ""
10037070-252 = ""
10037070-253 = "Примите мои глубочайшие извинения за звонок в столь поздний час, госпожа! Но я должна была сообщить: мы только что закончили работу над новой идеей для Пекинской оперы!"
10037070-254 = "Если возможно, завтра, до окончания их экскурсии, я хотела бы показать её гостям из Красной Зимы. Вы позволите?"
10037070-255 = "Новая постановка Пекинской оперы... Для начала я должна похвалить твои старания."
10037070-256 = "Я разрешаю представление, раз Великому Вождю Черино ты, похоже, действительно понравилась."
10037070-257 = "Благодарю за ваше великодушное решение, госпожа!"
10037070-258 = "Я обязана сообщить: поскольку это новая Пекинская опера, мы хотели бы пригласить всех членов Генрюмона. Вы не возражаете?"
10037070-259 = "Хм... Пожалуйста. Парк Белого Тигра просторный, и многие члены Генрюмона любят Пекинскую оперу."
10037070-260 = "Спасибо, госпожа! Я вложу в подготовку всё сердце и душу!"
10037070-261 = ""
10037070-263 = ""
10037070-265 = "Новая Пекинская опера в такое время...?"
10037070-266 = "Она выглядела очень воодушевлённой. Для художника это хорошее качество."
10037070-267 = "И учитывая, что в последнее время настроение было несколько... подавленным, возможно, это идеальный шанс поднять дух."
10037070-268 = "Общество Восточной Алхимии тоже будет участвовать? Пока подготовлю место и для них."
10037070-269 = "Хм... Сейчас Обществу Восточной Алхимии следовало бы размышлять над своими поступками..."
10037070-270 = "Однако если продолжать давить на них, котёл, так сказать, может выкипеть."
10037070-271 = "Уверена, сегодня ты уже крепко взяла дисциплину Общества Восточной Алхимии в свои руки. Верно?"
10037070-272 = "...Вы уже знали..."
10037070-273 = "Конечно. Именно так ты бы и поступила. Фуфу! Жду завтрашнего дня."
