[translation]
10003065-1 = "Эпизод 6;Ночь опускается на пляж"
10003065-2 = "Запланированная Ако прогулка у моря пошла не по плану из-за всеобщего изнеможения."
10003065-3 = "[s] «Я не могу просто сидеть и ничего не делать...»"
10003065-4 = "(Мы приехали сюда помочь Хине расслабиться, значит, мне нужно как-то это компенсировать.)"
10003065-5 = "[s] «Пойду спрошу Хину, не хочет ли она прогуляться со мной.»"
10003065-6 = "Когда я искал её номер в телефоне, от Хины пришло сообщение."
10003065-8 = "Не мог бы ты немного побыть со мной, Сенсей?"
10003065-12 = "Я пришёл на пляж, как просила Хина."
10003065-13 = ""
10003065-14 = ""
10003065-15 = "Ты не против, если мы просто немного прогуляемся?"
10003065-16 = ""
10003065-20 = "..."
10003065-21 = ""
10003065-25 = "..."
10003065-26 = ""
10003065-30 = "Мы так долго шли молча, что я потерял счёт времени."
10003065-32 = ""
10003065-33 = "Наверное, с такой, как я, не очень весело проводить время, да, Сенсей?"
10003065-34 = "[s] «Что? С чего ты это взяла?»"
10003065-35 = "Весь день у тебя были дела поважнее."
10003065-36 = "В прошлый раз ты убежал и сказал: «Я нашёл исчезающий вид осьминога, мне нужно его защитить!»"
10003065-37 = "Как всё прошло?"
10003065-38 = "[s] «На самом деле, я, эм...»"
10003065-39 = "Всё хорошо. Я знаю."
10003065-40 = "Будь моя воля, я бы весь день разговаривала с тобой, но это просто эгоизм."
10003065-41 = "Могу представить, как скучно разговаривать с такой неинтересной, как я."
10003065-42 = "[s1] «Нет, ты всё неправильно поняла, Хина.»\n[s2] «Я никогда так о тебе не думал, Хина!»"
10003065-43 = "Спасибо, Сенсей, но не нужно меня так утешать."
10003065-44 = "Спасибо, Сенсей, но не нужно меня так утешать."
10003065-45 = "[s] «Нет, это правда!»"
10003065-46 = "Серьёзно?"
10003065-47 = "[s] «Да, правда!»"
10003065-48 = "..."
10003065-49 = "..."
10003065-50 = "Пф."
10003065-51 = "Ха-ха. У вас было такое лицо, будто вы сейчас расплачетесь."
10003065-52 = "Я просто пошутила."
10003065-53 = "Я лучше всех знаю, что о таком ты бы не стал лгать."
10003065-54 = "Просто захотелось немного тебе отплатить."
10003065-55 = "[s] «Что ты имеешь в виду?»"
10003065-56 = "Ты сегодня был занят из-за тренировок Дисциплинарного комитета, да?"
10003065-57 = "Удивительно, что ты настолько переживал за нас, что всё время бегал туда-сюда."
10003065-58 = "Спасибо, Сенсей. Я ценю, что ты всегда о нас заботишься."
10003065-59 = "[s3] «Настоящая улыбка Хины и благодарность!»\n[s4] «Может, в лете и правда есть что-то волшебное.»"
10003065-60 = "Что это должно значить? Не нужно так бурно реагировать."
10003065-61 = "Что это должно значить? Не нужно так бурно реагировать."
10003065-62 = "Хотя нельзя сказать, что я понимала всё, что происходило сегодня."
10003065-63 = "Например, почему раньше все были в грязи и совершенно вымотаны."
10003065-64 = "Неужели Ако так сильно их загоняла?"
10003065-65 = "Я рада, что она сама предложила взять ответственность, и уверена, что справилась хорошо..."
10003065-66 = "...но мысль о том, как усердно работают остальные, только сильнее заставляет меня нервничать, пока я заперта в комнате."
10003065-67 = "[s5] «Тебе не нравилось сидеть там, да?»\n[s6] «Ты вообще хоть немного отдохнула?»"
10003065-68 = "Когда весь день сидишь внутри, я начинаю нервничать."
10003065-69 = "Когда весь день сидишь внутри, я начинаю нервничать."
10003065-70 = "Да, работа обычно держит меня невероятно занятой..."
10003065-71 = "...но когда тебя вот так на весь день оставляют одну, это, ну..."
10003065-72 = "[s] «Ну?»"
10003065-73 = "Не пойми неправильно. Передать тренировки Ако было моим решением, и я не говорю, что жалею об этом."
10003065-74 = "Но, пожалуй, мне было..."
10003065-75 = "...скучно, если уж называть вещи своими именами."
10003065-76 = ""
10003065-78 = "[ns7] «Ну, мы всё ещё на пляже...»\n[ns8] «Есть что-то, что ты особенно хотела бы сделать?»"
10003065-79 = "Что-то, чем можно заняться на пляже..."
10003065-80 = "Что-то, чем можно заняться на пляже..."
10003065-81 = "Да. Если ты предлагаешь, Сенсей, есть кое-что, что я хочу сделать."
10003065-82 = "...Научиться плавать."
10003065-83 = "[s] «Плавать?»"
10003065-84 = "У меня, эм... никогда толком не было возможности плавать."
10003065-85 = "Я знаю, что мне не хватает этого навыка, поэтому хочу наверстать упущенное и стать лучше."
10003065-86 = "По расписанию Ако завтра всё утро я снова буду ждать. Так что..."
10003065-87 = ""
10003065-88 = ""
10003065-90 = ""
10003065-91 = "Ну как, Сенсей?"
10003065-92 = "Не мог бы ты завтра утром дать мне урок плавания?"
10003065-93 = ""
10003065-95 = "[ns] «Да! С удовольствием!»"
10003065-96 = "Хорошо. Тогда до завтра."
10003065-98 = "Штаб летнего лагеря"
10003065-99 = "[ns] «Вот, собственно, и вся история.»"
10003065-100 = "..."
10003065-101 = "Эй, Ако...? Ты в порядке?"
10003065-102 = "Я растрогана! Не могу поверить, что сам главный префект попросила уроки плавания!"
10003065-103 = "Это может означать только одно: она наконец признала, что находится на летнем отдыхе!"
10003065-104 = "Должна признать, для неё это и правда необычно, даже если она всё ещё воспринимает плавание лишь как навык..."
10003065-105 = "Я впечатлена, что вам наконец удалось принести пользу, Сенсей!"
10003065-106 = "Благодаря стараниям всех план идёт гладко."
10003065-107 = "Так что не будем стоять без дела. У нас есть цель на завтра, а значит, нужно подготовиться."
10003065-108 = "Мы не остановимся ни перед чем, чтобы президентке ничто не мешало на уроке плавания!"
10003065-109 = "..."
10003065-110 = "..."
10003065-111 = "Мы не можем позволить ничему её прервать, ясно? Даже если ради этого придётся пожертвовать собой и уйти в водную пучину!"
10003065-113 = "Готовьтесь завтра снова поставить жизнь на кон! Разойтись!"
10003065-114 = ""
10003065-115 = ""
10003065-116 = "..."
