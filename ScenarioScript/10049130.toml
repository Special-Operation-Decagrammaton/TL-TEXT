[translation]
10049130-1 = "Послесловие;Блюз Банды шлемов"
10049130-2 = "[log]5 дней назад...[/log]"
10049130-4 = "Хорошо, давайте ещё раз всё повторим."
10049130-5 = "В эти выходные мы отправляемся поймать подозрительного торговца в Парке развлечений Пограничья и передать его заказчику."
10049130-6 = "Если понадобится, сначала можем его избить, главное — потом сдать. Вопросы?"
10049130-7 = "У меня вопрос, капитан!"
10049130-8 = "Вот это настрой! Давай."
10049130-9 = "Нам ведь придётся зайти внутрь парка, да? А что с входными билетами?"
10049130-10 = "Даже самые дешёвые билеты для нас, похоже, слишком дорогие."
10049130-11 = "Не думаю, что на этот раз хватит мелочи, найденной на улице."
10049130-12 = "А что будем есть и пить там? Просто нюхать еду и ходить голодными?"
10049130-13 = "И разве этот парк не огромный? Как МЫ найдём одного человека в такой толпе?"
10049130-14 = "Уа-а..."
10049130-15 = "А..."
10049130-16 = "Хех."
10049130-17 = ""
10049130-19 = ""
10049130-20 = "Хе-хе... Хахахаха!!!"
10049130-21 = "На этот раз всё будет иначе!"
10049130-22 = "Клиент уже дал нам входные билеты!"
10049130-23 = "И ещё! Нам помогут наши товарищи из других Банд шлемов!"
10049130-24 = "К-Капитан?!"
10049130-25 = "Серьёзно?! Вы правда нашли нам такую работу?"
10049130-26 = "Эй, не ВСЁ же здесь отстой, верно?"
10049130-27 = "О, и знаете что ещё?"
10049130-28 = "Билеты премиальные. Безлимитный доступ."
10049130-29 = "Безлимитный?!"
10049130-30 = "То есть можно кататься на всех аттракционах? Весь день?"
10049130-31 = "ОБА дня. Все выходные."
10049130-32 = "А-а, я знала, что вы нас не подведёте, капитан!"
10049130-33 = "Бесплатные билеты, настоящая поддержка? Наконец-то всё налаживается!"
10049130-34 = "Надо встать в очередь сразу после открытия!"
10049130-35 = "Цель может появиться там в любой момент!"
10049130-36 = "Нужно взять обед, раз мы будем там долго."
10049130-37 = "И сделаем кучу фотографий! Эм, чтобы потом внимательно изучить их на предмет улик!"
10049130-38 = "Хи-хи!"
10049130-39 = "Эй. Не думайте ТОЛЬКО о развлечениях. На кону многое."
10049130-40 = "И знаете что? После того как заберём награду... идём на барбекю!"
10049130-41 = "Да-а!!"
10049130-42 = "Вы лучшая, капитан!"
10049130-44 = ""
10049130-45 = "Хм..."
10049130-46 = "Хмм...?"
10049130-47 = "Похоже, ворота открылись, капитан."
10049130-48 = "Почему мы не идём внутрь?"
10049130-49 = "Скоро на все большие аттракционы будут очереди..."
10049130-50 = "Нашей поддержки ещё нет."
10049130-51 = "И у них все наши билеты."
10049130-52 = "Н-Нас кинули?!"
10049130-53 = "Да ну, зачем им это?! ...Если только они не хотели забрать нашу работу..."
10049130-54 = "Лучше позвоню. Если они НА САМОМ ДЕЛЕ нас кинули, пожалеют!"
10049130-55 = "Ага, капитан!! Проучим их!!"
10049130-56 = ""
10049130-58 = ""
10049130-59 = ""
10049130-61 = "Эй! Вы вообще придёте?!"
10049130-62 = "Если собираетесь бросить нас здесь..."
10049130-63 = "М-Мы сейчас немного заняты!! Простите!! Мы уже ехали!!"
10049130-64 = "Но они нас поймали!!"
10049130-65 = "Что?! Кто вас поймал? Цель? Где вы?!"
10049130-66 = "Поезд!! Мы ехали, но потом поездная бригада просто..."
10049130-67 = "Э-Эта поездная бригада БЕЗУМНАЯ!!"
10049130-68 = "В-Вы не можете так делать!!"
10049130-69 = "Ещё как можем!!"
10049130-70 = "Мешать нашей работе непростительно!"
10049130-71 = "Аааа!!"
10049130-72 = ""
10049130-76 = ""
10049130-77 = ""
10049130-78 = "К-Капитан?! Что они сказали...?"
10049130-79 = "На них напали? Тогда что с поддержкой? А билеты?"
10049130-80 = "Что-то про безумную поездную бригаду..."
10049130-81 = "А?"
10049130-82 = "Почему это происходит?"
10049130-83 = "Не знаю..."
10049130-84 = "Нас кто-то ЕЩЁ кинул...?"
10049130-86 = "Капитан? Куда вы идёте?"
10049130-87 = "А работа? Разве входные ворота не в той стороне?"
10049130-89 = "*задыхается* *задыхается*... Так. Мы в зоопарке, как и было на карте."
10049130-90 = "Охрана здесь будет занята животными, поэтому за людьми следят не так внимательно."
10049130-91 = "К тому же животные наверняка иногда срабатывают на сигнализации, так что любой сигнал МОЖЕТ быть ложным, а часть сигнализаций, возможно, вообще отключена."
10049130-92 = "И... ха. Похоже, зоопарк всё равно закрыт на обслуживание."
10049130-93 = "Очень вовремя."
10049130-94 = "Ух ты... Как вы на ходу придумали весь этот план?"
10049130-95 = "В отличие от нас, капитан не сбежала из школы, потому что ненавидела учиться!"
10049130-96 = "Правда, капитан? Вы хорошо учились, да?"
10049130-97 = "Тьфу. Скажем так, в той школе я оказалась не по своей воле."
10049130-98 = "Я пыталась держать всё в себе, но то место меня убивало."
10049130-99 = "Ц, надо было сбежать раньше, ещё после того Карнавала."
10049130-100 = "Никогда не устаю слушать вашу историю, капитан."
10049130-101 = "Ты намекаешь, что я слишком часто её повторяю?"
10049130-103 = "В любом случае, я решила, что это наш лучший шанс."
10049130-104 = "И вообще, это не то чтобы незаконное проникновение. Наши билеты ведь существуют, да? КТО-ТО за них заплатил."
10049130-106 = "Н-Наверное, в этом есть смысл."
10049130-107 = "Вы такая умная, капитан."
10049130-108 = "Ой, не льсти мне. Давайте переберёмся через следующую стену..."
10049130-111 = "Видите? Никаких сигнализаций."
10049130-112 = "Хм, место выглядит довольно дико."
10049130-113 = "Дико, да?"
10049130-114 = "Ладно, двигаемся дальше."
10049130-115 = "Без билетов, без подкрепления — не проблема!"
10049130-116 = "Лишь бы аллигаторов не было."
10049130-117 = ""
10049130-119 = ""
10049130-120 = ""
10049130-121 = "...Поче-е-ему ты трясёшься?"
10049130-122 = "К-К-К-К-Капитан? Тогда у нас проблема."
10049130-123 = "Хм?"
10049130-125 = "Это... Это вольер аллигаторов...!"
10049130-126 = ""
10049130-128 = ""
10049130-129 = "А. Точно, в зоопарке и правда есть настоящие аллигаторы..."
10049130-130 = "Ну конечно."
10049130-131 = ""
10049130-134 = "*глубоко вдыхает* А-а-а!!"
