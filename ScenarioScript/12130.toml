[translation]
12130-1 = "Episódio 13;O Que Escapou por Entre os Dedos"
12130-4 = "Para todas do Comitê de Contramedidas de Abydos,"
12130-5 = "Primeiro, peço que me perdoem por me despedir assim, por carta. É que esse jeito antiquado combina mais com o velhote aqui."
12130-6 = "Tem uma coisa que eu nunca contei para vocês."
12130-7 = "Na verdade, faz bastante tempo que venho recebendo uma proposta de recrutamento."
12130-8 = "A proposta era eu trabalhar como mercenária da Kaiser PMC e, em troca, eles assumiriam a maior parte da dívida de Abydos... Era esse o acordo."
12130-9 = "...Uhe, não acham que são ótimas condições? Pode não parecer, mas o velhote aqui até que é bem valorizado pelas suas habilidades~."
12130-10 = "Eu dou um jeito na dívida. Não dá para resolver tudo de uma vez, mas acho que isso já vai aliviar bastante o peso por enquanto."
12130-11 = "Desculpa por ter falado daquele jeito metido no Mercado Negro e acabar não conseguindo cumprir minhas próprias palavras."
12130-13 = "(Entrega)"
12130-14 = "...Assim está bom?"
12130-15 = "...Sim, perfeitamente."
12130-16 = "Agora que temos sua assinatura no contrato... todos os seus direitos como aluna, Hoshino-san, foram transferidos para mim."
12130-19 = "Com isso, assumiremos formalmente a maior parte da dívida do Colégio Abydos."
12130-21 = "Assim, as coisas devem ficar um pouco mais fáceis para o Comitê de Contramedidas."
12130-22 = "Eu vou deixar o Colégio Abydos e também Kivotos, mas não se preocupem comigo."
12130-23 = "Me desculpem por agir por conta própria."
12130-24 = "Mas isso tudo é responsabilidade minha."
12130-25 = "Afinal, eu sou a última integrante do Conselho Estudantil de Abydos."
12130-26 = "Então, é aqui que nos despedimos. Até mais."
12130-28 = "Para o Sensei,"
12130-29 = "Na verdade, eu odiava adultos. Nunca confiei muito neles."
12130-30 = "Até naquele dia em que a Shiroko-chan trouxe você nas costas, eu pensei algo tipo: \"Nossa, apareceu um adulto bem furado\", sabe?"
12130-31 = "Mas, por ter conhecido um adulto como você no final, eu... Ah, deixa para lá, já chega de falar coisas vergonhosas."
12130-32 = "Sensei."
12130-33 = "Desculpa fazer um último pedido egoísta, mas por favor... A Shiroko-chan é uma boa garota, mas sem alguém ao lado para apoiá-la, não dá para saber o que pode acontecer com ela."
12130-34 = "Quero que você a apoie para que ela não acabe seguindo por um mau caminho."
12130-35 = "Se for com você, Sensei, tenho certeza de que ela vai ficar bem."
12130-38 = "Vamos, entra."
12130-39 = "...Para onde estamos indo?"
12130-40 = "Para o Deserto de Abydos."
12130-45 = "Shiroko-chan, Nonomi-chan, Serika-chan, Ayane-chan."
12130-46 = "Por favor, protejam a nossa escola."
12130-47 = "Pode ser só um lugar cheio de areia... mas é o único lugar com significado que me restou."
12130-48 = "E mais uma coisa... se por algum acaso no futuro nós acabarmos nos enfrentando como inimigas..."
12130-49 = "Nessa hora, \"destruam\" a minha auréola."
12130-50 = "Conto com vocês."
12130-52 = "Hoshino-senpai!!!!"
12130-54 = "Que história é essa?! Depois de falar toda cheia de razão!! Ela mesma sabia que faria qualquer loucura se ficasse encurralada!!"
12130-55 = "Como é que a gente vai aceitar uma coisa dessas?!"
12130-56 = "...Precisamos salvá-la."
12130-57 = "Eu vou. Para não causar problemas ao Comitê de Contramedidas, eu vou sozinha..."
12130-58 = "Por favor, acalmem-se! Primeiro precisamos nos organizar juntas...!"
12130-59 = "BOOOOOM!!!"
12130-60 = "Uaaah?!"
12130-61 = "Uma explosão...?!"
12130-62 = "Foi perto! Onde foi...?!"
12130-63 = "..."
12130-64 = "...N-Não pode ser?!"
12130-66 = "BOOOOOM!!!"
12130-68 = "Avancem, avancem!"
12130-69 = "Em frente!"
12130-71 = "Aaaaah?!"
12130-72 = "Rápido, corram!!"
12130-74 = "...Uma ordem de despejo já foi emitida para este distrito autônomo."
12130-77 = "Heh heh heh, hehehehehehe..."
12130-78 = "Finalmente, todas as condições foram cumpridas."
12130-79 = "A última integrante do Conselho Estudantil abandonou Abydos... Com isso, na prática, o Colégio Abydos deixou de existir!!"
12130-80 = "Agora só falta a nossa Kaiser Corporation absorver e anexar Abydos!"
12130-82 = "Vamos, ocupem o Colégio Abydos!"
12130-84 = "Centenas de soldados da PMC estão avançando na nossa direção! E, ao mesmo tempo, estão atacando a cidade indiscriminadamente!"
12130-85 = "A Kaiser PMC?! Por que logo agora...?!"
12130-86 = "P-Precisamos revidar!! Seja como for, não podemos ficar paradas enquanto Abydos é atacada...!"
12130-87 = "Não temos tempo para pensar, vamos logo!"
12130-88 = "M-Mas eles são muitos para conseguirmos repelir sozinhas...!"
12130-89 = "D-De qualquer forma, primeiro vamos evacuar os cidadãos!"
12130-93 = "Um ataque em tamanha escala... Por que isso, tão de repente..."
12130-98 = "Comitê de Contramedidas avistado! Por aqui!!"
12130-100 = "Guaaah?!"
12130-104 = "Os batedores já chegaram até aqui..."
12130-105 = "Muitos soldados da Kaiser PMC detectados nos arredores do Colégio Abydos! Vários já invadiram o campus!"
12130-106 = "Por enquanto, vamos acabar com os que invadiram a escola primeiro! Ayane-chan, contamos com você!"
12130-107 = "Entendido! Vamos garantir a segurança do Sensei enquanto repelimos os inimigos que invadiram a escola!"
12130-109 = "Depois de garantirmos a segurança do campus, partiremos para evacuar os cidadãos!"
