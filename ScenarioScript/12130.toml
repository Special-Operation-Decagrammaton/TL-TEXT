[translation]
12130-1 = "Эпизод 13;То, что ускользнуло сквозь трещины"
12130-4 = "Целевой группе по взысканию долгов Абидоса,"
12130-5 = "Простите, что делаю это письмом. Так показалось более старомодно — прямо в моём стиле."
12130-6 = "Есть кое-что, что я от вас скрывала."
12130-7 = "Уже некоторое время меня пытается завербовать один человек."
12130-8 = "Стать наёмницей ЧВК Кайзер пожизненно в обмен на погашение долга Абидоса. Если коротко, условия такие."
12130-9 = "Хех. Неплохая сделка, да? Видимо, навыки такой хитрой старой ветеранши, как я, дорого стоят."
12130-10 = "Я как-нибудь разберусь с долгом. Может, не со всем, но хотя бы смогу уменьшить вашу ношу."
12130-11 = "Знаю, на Чёрном рынке я говорила громко. Простите, что не смогла сдержать слово."
12130-13 = "*пишет*"
12130-14 = "Вот здесь, да?"
12130-15 = "Да. Ваша подпись на контракте, госпожа Хошино."
12130-16 = "Все ваши права как студенты переданы нам."
12130-17 = ""
12130-19 = "С этого момента большая часть долга Абидоса считается погашенной."
12130-21 = "Значит, теперь... с Целевой группой всё будет хорошо."
12130-22 = "Мне придётся покинуть Абидос и вообще Кивотос, но это неважно."
12130-23 = "Вот что бывает с упрямой старой ослицей вроде меня."
12130-24 = "Но это... всё это... моя ответственность."
12130-25 = "...как последнего члена последнего Студсовета Абидоса."
12130-26 = "Значит, здесь всё заканчивается."
12130-28 = "Дорогой Сенсей,"
12130-29 = "Если честно, взрослые мне никогда не нравились. Я не думала, что им можно доверять."
12130-30 = "С тех пор как услышала, что Широко пришлось тащить тебя на спине, я только и думала: «Чёрт. Наверняка бесполезный». Хех. Разве я ошибалась?"
12130-31 = "Но в итоге ты оказался... Ну, сам знаешь. К тому же некоторые вещи лучше не произносить вслух, правда?"
12130-32 = "Сенсей."
12130-33 = "Знаю, это эгоистично, но у меня последняя просьба. Широко в глубине души хорошая девочка, но без кого-то, кто удержит её на земле, она побежит куда ветер понесёт."
12130-34 = "Проследи, чтобы она не сбилась с пути."
12130-35 = "Пожалуйста, позаботься о ней."
12130-37 = ""
12130-38 = "Давай. Садись в машину."
12130-39 = "Куда едем?"
12130-40 = "В Пустыню Абидос."
12130-45 = "Всем вам,"
12130-46 = "Пожалуйста, позаботьтесь о нашей школе."
12130-47 = "Сейчас здесь одна пустыня, но это единственное место, которое ещё что-то для меня значит."
12130-48 = "И ещё, если однажды мы встретимся как враги..."
12130-49 = "...не колеблясь уничтожьте мой нимб."
12130-50 = "Пожалуйста."
12130-52 = "ХОШИНО!"
12130-54 = "Ч-Что за-?! После всех этих слов теперь ТЫ придумываешь оправдания?! Говоришь, другого выхода не было?!"
12130-55 = "Думаешь, я просто смогу это принять?!"
12130-56 = "Где Хошино? Нужно отправляться за ней — сейчас же."
12130-57 = "Если придётся идти одной — пусть. Если помощь ей станет бременем для Целевой группы, тогда я..."
12130-58 = "Все, тихо! Сейчас не время ссориться друг с другом."
12130-59 = "*БА-А-АХ*"
12130-60 = "Ч-Что...?!"
12130-61 = "Что это было?! Похоже на взрыв!"
12130-62 = "С-Слишком близко... Это..."
12130-63 = "..."
12130-64 = "Какого...?!"
12130-66 = "*БА-А-АХ*"
12130-68 = "Вперёд."
12130-69 = "Вперёд."
12130-71 = "А-А-а!"
12130-72 = "Бегите!"
12130-73 = ""
12130-74 = "Для этого района выдан приказ о выселении."
12130-76 = ""
12130-77 = "Хахаха."
12130-78 = "Наконец-то — наконец выполнено последнее условие."
12130-79 = "Последний член Студсовета бросил школу, а значит, Абидоса больше нет!"
12130-80 = "Теперь Кайзеру остаётся лишь аннексировать район!"
12130-82 = "Захватить старшую школу Абидоса!"
12130-84 = "С-Сотни бойцов PMC приближаются!"
12130-85 = "Что происходит?! Почему Кайзер нападает на нас?! Я не понимаю..."
12130-86 = "М-Мы должны их остановить!! Что бы это ни значило, мы не можем стоять и смотреть, как они атакуют Абидос...!"
12130-87 = "Ты права. Думать некогда. Нужно действовать прямо сейчас!"
12130-88 = "Н-Но их слишком много! Мы не справимся с такими силами одни!"
12130-89 = "К тому же они атакуют всё подряд. Нужно сосредоточиться на эвакуации тех, кто ещё остался в городе!"
12130-90 = ""
12130-91 = ""
12130-93 = "Бой такого масштаба... Как всё дошло до этого...? Почему это снова происходит...?"
12130-98 = "Целевая группа обнаружена! Сюда!"
12130-99 = ""
12130-100 = "Гх?!"
12130-101 = ""
12130-102 = ""
12130-104 = "Вражеский разведчик. Они уже здесь."
12130-105 = "Несколько разведотрядов ЧВК Кайзер приближаются к Абидосу! Они уже прорвались на территорию!"
12130-106 = "Сначала разберёмся с теми, кто внутри! Аяне, рассчитываем на тебя!"
12130-107 = "Принято! Вступаем в бой с врагами, проникшими в школу. Безопасность Сенсея — высший приоритет!"
12130-109 = "Когда академия будет в безопасности, начнём эвакуацию гражданских!"
