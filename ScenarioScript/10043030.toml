[translation]
10043030-1 = "Эпизод 3;Манибол"
10043030-3 = ""
10043030-4 = "А, Сенсей! Я здесь!"
10043030-5 = "Фух, я уже боялась, что не найду вас в этой толпе."
10043030-6 = "[s] «Что-нибудь случилось?»"
10043030-7 = "Нет. Пока ничего."
10043030-8 = "Новых зацепок всё ещё нет."
10043030-9 = "В любом случае «Герои» скоро будут отбивать, значит, преступник должен позвонить..."
10043030-10 = ""
10043030-15 = ""
10043030-16 = "Это наверняка он."
10043030-17 = ""
10043030-19 = ""
10043030-20 = "*задыхается* *задыхается*"
10043030-21 = "Хорошо. Всё. Я успокоился. Тренер, вы слушаете?"
10043030-22 = ""
10043030-25 = ""
10043030-26 = "Н-не волнуйтесь, слушаю."
10043030-28 = "Вы говорите «не волнуйтесь» после ТАКОГО иннинга?! Защита была жалкой!"
10043030-29 = "Буду краток. Пусть первый отбивающий выйдет на базу, потом сделайте бант."
10043030-30 = "Именно так. Ничего больше. Слышите меня?"
10043030-31 = ""
10043030-33 = ""
10043030-34 = "Погодите. Здесь нужно учитывать множество правил — как прописанных, так и негласных."
10043030-35 = "Ещё традиции и классические стратегии."
10043030-36 = "Слова, которые нельзя произносить, или правило отвечать за хит-бай-питч..."
10043030-37 = "...ИЛИ то, что в начале игры не следует делать бант."
10043030-38 = "Мы только в нижней половине второго иннинга! Они едва увидели несколько подач, а вы уже хотите бант?!"
10043030-39 = "И посмотрите, кто бьёт вторым. Стабильно попадает по мячу, бегает быстрее среднего и в последнее время отлично выбивает на силу!"
10043030-40 = "Он идеально подходит, чтобы подготовить ситуацию для мощного отбивающего, а вы хотите заставить его делать бант? Серьёзно?"
10043030-41 = "Вы вообще смотрели саберметрику? В этой ситуации бант СНИЖАЕТ ожидаемое количество ранов!"
10043030-42 = "[s] «Что такое саберметрика?»"
10043030-43 = ""
10043030-45 = ""
10043030-46 = "Это вроде математики бейсбола. Там всё давно просчитано."
10043030-47 = "Если бегун на первой базе и нет аутов, команда в среднем набирает 0,88 рана за иннинг. Вероятность набрать хотя бы один — 43,4%."
10043030-48 = "Но если сделать бант, отдать аут и перевести бегуна на вторую? Среднее падает до 0,71 рана, а шанс набрать хотя бы один — до 41,6%!"
10043030-49 = ""
10043030-52 = "[ns1] «...Эм... А?»\n[ns2] «(О чём она вообще говорит?)»"
10043030-55 = "Есть один фильм, который вам стоит посмотреть: там такую математику используют для поиска игроков и оптимизации всей статистики."
10043030-56 = "И команда поднимается с самого дна на вершину!"
10043030-57 = "Вообще, если ВАМ интересно, Сенсей, мы могли бы—"
10043030-58 = ""
10043030-61 = "За..."
10043030-62 = ""
10043030-64 = ""
10043030-65 = "За... что?"
10043030-66 = ""
10043030-69 = "Заткнись, самозванка!!"
10043030-70 = ""
10043030-72 = ""
10043030-73 = "Самозванка?!!"
10043030-74 = "Ты и половины не понимаешь! Ты вообще посмотрела средний процент отбивания третьего игрока, прежде чем начала умничать?!"
10043030-75 = "Давай, открой прямо сейчас!"
10043030-76 = "Ладно, хорошо, посмотрим. Третий отбивающий «Героев»..."
10043030-77 = "...Хотя средний процент отбивания немного устаревший показатель, но..."
10043030-78 = ""
10043030-80 = ""
10043030-81 = ""
10043030-82 = "Что? Такого не может быть..."
10043030-83 = "Ноль целых семнадцать сотых?!"
10043030-84 = "[s] «Семнадцать процентов?!»"
10043030-85 = "Теперь дошло? А?!"
10043030-86 = ""
10043030-88 = ""
10043030-89 = "...Какой потрясающий отбивающий!"
10043030-90 = "Что...?"
10043030-91 = "По меркам «Героев», я имею в виду. У него... статистика лучше моей."
10043030-92 = "...Ты бейсболистка?"
10043030-93 = "Ага! У меня самой аж целых ноль целых восемь сотых!"
10043030-94 = "[s] «...»"
10043030-95 = "Ноль целых восемь сотых?"
10043030-96 = "Суть в том, что это один из наших сильнейших отбивающих, а ты хочешь, чтобы ОН делал бант?!"
10043030-97 = "С точки зрения хода игры или использования ресурсов это расточительство—"
10043030-98 = ""
10043030-101 = "Хватит! Если вы немедленно не сделаете, как я сказал, я взорву эту фабрику жевательных игрушек до последнего кирпича!"
10043030-102 = ""
10043030-104 = ""
10043030-105 = "Уф."
10043030-106 = "[s] «Всё поняли, тренер?»"
10043030-107 = "...Да, я услышал. Вы привели хороший аргумент, но у нас связаны руки."
10043030-108 = "Значит, делаем бант."
10043030-109 = "Но сначала нужно вывести игрока на базу, и... О, начинается..."
10043030-110 = ""
10043030-114 = ""
10043030-118 = ""
10043030-123 = ""
10043030-124 = "Есть хит! О нет, граундер на шортстопа!"
10043030-125 = "...Но шортстоп роняет мяч! Ошибка!"
10043030-126 = "[s] «А теперь они ещё и спотыкаются... Это наш шанс!»"
10043030-127 = "Да! Беги! Беги-и-и!! Беги, будто от этого зависит твоя жизнь!"
10043030-128 = ""
10043030-138 = "«Мародёры» роняют мяч, и первый отбивающий добегает до первой базы!"
10043030-139 = "Наверное, шортстоп занервничал."
10043030-140 = "Или верхняя половина второго иннинга слишком затянулась, и им снова нужно размяться."
10043030-141 = "Неужели ход игры меняется? Напишут ли сегодня «Герои» эпическую сагу о великом возвращении?"
10043030-142 = ""
10043030-146 = ""
10043030-147 = "Выходит третий отбивающий!"
10043030-148 = "У него хороший шанс отправить мяч далеко. И... это бант? Очень... неожиданно."
10043030-149 = "Пожалуйста... Пожалуйста, у тебя должно получиться!"
10043030-150 = ""
10043030-155 = ""
10043030-158 = "Мяч медленно катится к третьей базе — ровно настолько, чтобы бегун успел!"
10043030-159 = "Ну, направление правильное. Похоже, защита немного растерялась."
10043030-160 = "Думаю, такая жертва себя оправдала."
10043030-161 = "Мы сделали это!"
10043030-162 = "Фух..."
10043030-163 = "[s] «Это плохо для моего сердца...»"
10043030-164 = "Хорошо. Теперь выходит мощный отбивающий. ВОТ ТЕПЕРЬ можно бить в полную силу."
10043030-165 = "Один ран. Всего один ран, шаг за шагом. У вас получится."
10043030-166 = "Они правы, тренер. Отсюда мы МОЖЕМ занести ран!"
10043030-167 = "Верно, можем. Это может запустить нашу победную серию!"
10043030-170 = ""
10043030-172 = "Четвёртый отбивающий входит в бэттерский бокс. В воздухе напряжение."
10043030-173 = "Это может стать переломным моментом."
10043030-174 = "Сегодня бейсбол во многом построен на статистике, но ход игры всё ещё важен."
10043030-175 = "Точно! Некоторые говорят, что настоящее мастерство команды — в умении продлевать этот импульс!"
10043030-176 = ""
10043030-182 = ""
10043030-187 = "И вот первая подача. Есть контакт!"
10043030-188 = ""
10043030-190 = ""
10043030-191 = ""
10043030-192 = "Есть контакт! Но о нет, нет!! Мягкий мяч на третью базу, прямо сейчас?!"
10043030-193 = "[s] «А бегун со второй ещё и ошибся со временем...»"
10043030-194 = "И теперь рандаун! Выхода нет!"
10043030-195 = ""
10043030-199 = "Его зажали между второй и третьей! Всё, поймали... и аут! Вот и приехали."
10043030-200 = "«Героям» был очень нужен этот ран. Крайне разочаровывающе."
10043030-201 = ""
10043030-204 = "..."
10043030-205 = ""
10043030-208 = ""
10043030-209 = "О? Сенсей, вы в порядке?!"
10043030-210 = "[s] \"I'm fine.\""
10043030-211 = "Э-это вы, тренер?"
10043030-212 = "Не я."
10043030-213 = "Тогда кто...?"
10043030-214 = ""
10043030-218 = "Это был я!!"
10043030-219 = "Ленивый поп-ап на третью? Устроить рандаун ПРЯМО СЕЙЧАС?"
10043030-220 = "«Мощный отбивающий» даже не может выбить мяч за пределы инфилда? И ОБА бегуна тормозят?"
10043030-221 = "Как это вообще команда?! Как это команда?!"
10043030-222 = ""
10043030-224 = ""
10043030-225 = "Д-давайте, Герои, давайте... *хлопок* ... *хлопок*"
10043030-226 = "Не надо! Прекрати! Твоя поддержка только продлевает агонию!"
10043030-227 = "*вдох* *выдох* *вдох* ... *вздох* Ладно. Хорошо. Игра ещё не закончена."
10043030-228 = "«Пока не конец — ещё не конец», верно?"
10043030-229 = ""
10043030-231 = ""
10043030-232 = "Обожаю эту фразу."
10043030-233 = ""
10043030-235 = ""
10043030-237 = "Заткнись! ...Ладно. Новый план. Идём от обратного..."
10043030-238 = ""
10043030-241 = "В третьем иннинге снимаем питчера и начинаем контратаку!"
10043030-242 = ""
10043030-244 = ""
10043030-245 = "Погодите, погодите? Уже снимаем стартового питчера? Он даже до пятого не дошёл!"
10043030-246 = "Ну да, начало у него было тяжёлое..."
10043030-247 = "...но потенциал у него есть, мне кажется!"
10043030-248 = "Ты слепой?!"
10043030-249 = "Уф. Как грубо."
10043030-250 = "Его ERA — 7! Ты называешь это «потенциалом»?"
10043030-251 = ""
10043030-253 = ""
10043030-254 = "Ага! Это же даже не 10!"
10043030-255 = ""
10043030-258 = "..."
10043030-259 = ""
10043030-262 = "[ns] «Кажется, они снова потеряли сознание...»"
10043030-265 = "Знаете, при всём хаосе, который они устраивают..."
10043030-266 = "...похоже, им самим тоже нелегко."
10043030-267 = "Всё, хватит. Вы все заткнитесь и делайте В ТОЧНОСТИ, как я говорю, иначе я СОЖГУ ВЕСЬ ЧЁРТОВ СТАДИОН!! Вместе с трибунами!"
10043030-268 = ""
10043030-270 = ""
10043030-271 = "Трибунами?!"
10043030-273 = "Да, вы всё слышали! Снимайте питчера! В третьем иннинге!"
10043030-274 = ""
10043030-278 = ""
10043030-279 = ""
10043030-280 = "Хм... Что теперь делать, Сенсей?"
10043030-281 = "[s] «Пока что...»"
10043030-283 = "[ns] «...давай ещё немного осмотрим трибуны.»"
10043030-284 = "Да, хорошо. Так и сделаем..."
