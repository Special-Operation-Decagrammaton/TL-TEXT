[translation]
22175-6 = "Os movimentos do Avant-Garde ficaram lentos, agora é a nossa chance!#nVamos lá, Clube de Engenharia!"
22175-7 = "Sim! Entendido!"
22175-8 = "Entendido. Vou instalar aquilo."
22175-16 = "[ns] \"O-O que diabos vai acontecer agora?!\""
22175-17 = "Além de rastreamento autônomo, é totalmente à prova d'água e poeira."
22175-18 = "E ainda conta com estabilidade garantida do zero absoluto até mais de três mil graus,#ncom certificação de super-mega-hiper-ultrassegurança...!"
22175-19 = "Nossa obra-prima definitiva, feita com metade do orçamento anual—"
22175-21 = "O Alto-Falante Remoto de Última Geração!"
22175-26 = "..."
22175-30 = "(Confusão)"
22175-31 = "[ns] \"...Para que um alto-falante precisa de tudo isso?\""
22175-32 = "Essa é uma pergunta tola, Sensei."
22175-33 = "Para começar, funções existem para ser adicionadas sempre que possível—"
22175-34 = "...A regra de ouro é enfiar o máximo que der."
22175-35 = "É exatamente isso."
22175-36 = "Pois bem—"
22175-37 = "Fogo!"
22175-44 = "(...Glup)"
22175-45 = "...E-Eu tô me coçando inteira pra soltar aquela frase...!"
22175-46 = "Mana, segura essa vontade aí!"
22175-47 = "...N-Não precisa dizer isso de jeito nenhum."
22175-55 = "...Realmente, o alto-falante que fizemos tem uma acústica excelente!"
22175-56 = "[s] \"Era esse tipo de alto-falante?!\""
22175-57 = "Bom, bom, vamos deixar os detalhes de lado!#nDe qualquer forma, com isso...!"
22175-58 = "...Sim. Finalmente conseguimos derrubá-lo."
22175-60 = "Isso aí! A gente venceu!"
22175-61 = "[s1] \"Acabou antes mesmo de eu entender o que aconteceu...\"\n[s2] \"Caramba... o Avant-Garde era mesmo um inimigo e tanto.\""
22175-62 = "...G-Graças ao esforço de todo mundo, c-conseguimos derrotá-lo."
22175-63 = "...G-Graças ao esforço de todo mundo, c-conseguimos derrotá-lo."
22175-64 = "É verdade. Como eu posso dizer..."
22175-65 = "Tipo quando você finalmente derrota um chefe de raid!!"
22175-67 = "Bom trabalho, pessoal. Mas o verdadeiro desafio começa agora."
22175-68 = "Precisamos avançar enquanto o \"Espelho\" ainda mantém a rede de pé...#nPor enquanto, vou guiando vocês."
22175-69 = "Ah, sobre isso..."
22175-70 = "Bem..."
22175-71 = "...Desculpa, parece que a gente vai só até aqui."
22175-76 = "[ns] \"V-Vocês estão bem?!\""
22175-77 = "...Até o momento de instalar o alto-falante, estava tudo bem."
22175-78 = "Para quem é caseira... f-fizemos esforço físico demais..."
22175-79 = "...Não consigo mover nem mais um dedo."
22175-80 = "Como podem ver. Sinto muito por não conseguirmos ir até o fim, mas nos despedimos aqui."
22175-82 = "Utaha-senpai..."
22175-86 = "Não, tudo bem! Muito obrigada por ajudarem a gente!#nAquele alto-falante de antes foi demais!"
22175-87 = "Daqui pra frente, a gente dá um jeito!"
22175-92 = "[ns] \"Não se preocupem. Nós com certeza vamos trazer a Aris de volta.\""
22175-94 = "...É verdade. Se você diz isso com tanta certeza."
22175-95 = "Momoi."
22175-96 = "Hã?"
22175-97 = "Fique com isto.#nVai ser útil numa hora de aperto."
22175-98 = "Isso é..."
22175-99 = "Certo, entendi."
22175-100 = "Bem, pessoal... o resto agora está nas mãos de vocês!"
22175-101 = "Boa sorte, pessoal."
22175-103 = "Próximo;A Muralha Ainda Intransponível"
