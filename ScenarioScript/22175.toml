[translation]
22175-1 = ""
22175-6 = "Авангард замедлился, так что сейчас самое время, Инженерный Департамент!"
22175-7 = "Есть!"
22175-8 = "Я установлю предмет, который мы изготовили специально для этого!"
22175-9 = ""
22175-16 = "[ns] «Ч-Что это за штука?!»"
22175-17 = "Она оснащена автономным наведением и защищена от воды и пыли."
22175-18 = "Кроме того, она сохраняет абсолютную стабильность даже при абсолютном нуле или в среде с температурой выше трёх тысяч градусов!"
22175-19 = "На создание этого шедевра Инженерный Департамент потратил половину годового бюджета..."
22175-20 = ""
22175-21 = "Совремейший дистанционный динамик!"
22175-22 = ""
22175-25 = ""
22175-26 = "..."
22175-27 = ""
22175-30 = "*шок*"
22175-31 = "[ns] «...Зачем динамику вообще все эти функции?»"
22175-32 = "Какой бессмысленный вопрос, Сенсей."
22175-33 = "Если есть возможность добавить функцию..."
22175-34 = "...логично её добавить."
22175-35 = "Лучше и не скажешь."
22175-36 = "Теперь..."
22175-37 = "Огонь!"
22175-38 = ""
22175-43 = ""
22175-44 = "*глоть*"
22175-45 = "Я тоже хочу сказать что-нибудь крутое!"
22175-46 = "Н-Не об этом сейчас, Момои!"
22175-47 = "...Пожалуйста, не начинайте так разговаривать."
22175-48 = ""
22175-50 = ""
22175-54 = ""
22175-55 = "...Я горжусь динамиком, который мы сделали. Он великолепен."
22175-56 = "[s] «Эта штука — ракета! Взрывчатка! Не динамик!»"
22175-57 = "Семантика. В любом случае, все, за дело!"
22175-58 = "...Ух ты, мы правда смогли его победить."
22175-60 = "Получилось! Ух ты!"
22175-61 = "[s1] «Понятия не имею, что, чёрт возьми, случилось!»\n[s2] «Авангард был... грозным противником!»"
22175-62 = "Но... мы смогли победить его, потому что действовали вместе."
22175-63 = "Но... мы смогли победить его, потому что действовали вместе."
22175-64 = "Ага! Такое чувство, будто..."
22175-65 = "Мы вместе успешно победили рейдового босса!"
22175-67 = "Хорошо, отличная работа, ребята. Но это было только начало."
22175-68 = "Пока сеть захвачена Зеркалом, нужно двигаться быстро. Я буду вести вас."
22175-69 = "Ну, насчёт этого..."
22175-70 = "Видите ли..."
22175-71 = "...Простите, думаю, мы уже на пределе."
22175-72 = ""
22175-74 = ""
22175-76 = "[ns] «В-Все в порядке?»"
22175-77 = "Мы сумели установить динамики, но это забрало все наши силы..."
22175-78 = "Для нас, людей скорее домашнего типа, это было очень тяжело..."
22175-79 = "...Я даже пальцами пошевелить не могу."
22175-80 = "Как видите, нам придётся пока выйти из боя."
22175-82 = "Утаха..."
22175-83 = ""
22175-85 = ""
22175-86 = "Да всё нормально! Спасибо за помощь! Эта штука, динамик-ракета, была невероятной!"
22175-87 = "Дальше мы сами!"
22175-88 = ""
22175-90 = ""
22175-91 = ""
22175-92 = "[ns] «Не волнуйтесь. Мы обязательно спасём Алису.»"
22175-94 = "Хорошо. Тогда доверяем её вам."
22175-95 = "Момои."
22175-96 = "Да?"
22175-97 = "На всякий случай отдам это тебе. Используй, если окажешься в опасности."
22175-98 = "Ты уверена...?"
22175-99 = "Хорошо, поняла!"
22175-100 = "Остальное оставляю вам!"
22175-101 = "Удачи всем."
22175-103 = "Следующий Эпизод: Непреодолимая стена"
