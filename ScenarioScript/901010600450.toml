[translation]
901010600450-6 = ""
901010600450-7 = "Reunindo o que descobrimos sobre a Família Carpaccio, que controla a guarita do porto..."
901010600450-8 = "A Família Carpaccio é famosa nessa região por estar metida em todo tipo de esquema ilícito."
901010600450-9 = "Parecida com a Família Rivolita que enfrentamos no passado, eles mantêm uma rígida hierarquia mafiosa e pegam qualquer trabalho sujo por dinheiro."
901010600450-10 = "Bom, no fundo não passam de delinquentes de rua com terno engomado."
901010600450-11 = "Mas as alunas da [ruby=família]organização[/ruby] que atuam aqui têm alvará legal para prestar serviço de segurança privada."
901010600450-12 = "Mas e os juros extorsivos? Praticar agiotagem descarada assim não é crime grave?"
901010600450-13 = ""
901010600450-15 = ""
901010600450-16 = "Consultei os índices e, por incrível que pareça, a taxa deles fica no teto exato permitido pelo Conselho Estudantil Federal. #nNa letra fria da lei, estão amparadas."
901010600450-17 = "O verdadeiro problema está nos métodos de cobrança—"
901010600450-18 = ""
901010600450-20 = ""
901010600450-21 = ""
901010600450-22 = "Muitos dos moradores que pegaram empréstimos com a Família Carpaccio não suportaram a pressão da cobrança e desapareceram logo em seguida."
901010600450-23 = "Não há boletins de agressão física aberta, mas o terror psicológico devia ser insuportável."
901010600450-24 = "Hummm... Acho que estamos começando a desemaranhar esse nó cego."
901010600450-25 = "A razão de haver tantos sumiços inexplicáveis nessa região foi..."
901010600450-26 = ""
901010600450-28 = ""
901010600450-29 = ""
901010600450-32 = ""
901010600450-33 = "A razão de haver tantos sumiços inexplicáveis nessa região foi...\n[as1] Porque foram atacados pelo caranguejo monstro.\n[as2] Porque acharam um portal para um mundo paralelo.\n[as3] Fugiram do terror da cobrança da Família Carpaccio."
901010600450-34 = ""
901010600450-36 = ""
901010600450-37 = "Sensei, a gente acabou de provar que não tem caranguejo comedor de gente nenhum!"
901010600450-38 = "Você tava prestando atenção no que a Niko falou?"
901010600450-39 = "Pensa melhor, por favor."
901010600450-40 = ""
901010600450-42 = ""
901010600450-43 = ""
901010600450-47 = "Ah, eu li um mangá com esse mesmo enredo outro dia!"
901010600450-48 = "O protagonista cruza um portal místico no cais e reencarna como herói num mundo de fantasia—"
901010600450-49 = ""
901010600450-51 = ""
901010600450-52 = "QUAL É, OTOGI! A gente tá numa investigação séria da SRT, para de viajar na maionese!"
901010600450-53 = ""
901010600450-55 = ""
901010600450-57 = ""
901010600450-58 = ""
901010600450-62 = "...Faz todo o sentido."
901010600450-63 = "A Família Carpaccio emprestava dinheiro a juros abusivos para pessoas no limite do desespero e exigia o pagamento com ameaças veladas. Incapazes de pagar, muitos preferiram fugir no meio da noite."
901010600450-64 = "De fato, a época em que os desaparecimentos começaram a ser registrados coincide com o período em que a Família Carpaccio expandiu seus negócios de crédito no porto."
901010600450-65 = "No fim das contas, gente viva e maldosa mete muito mais medo do que qualquer assombração."
