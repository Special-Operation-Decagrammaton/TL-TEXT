[translation]
901010600450-6 = ""
901010600450-7 = "Подведём итог по семье Карпаччо, отвечающей за безопасность у главного входа в порт Канэсаки..."
901010600450-8 = "Семья Карпаччо — печально известная банда, которая держит район в страхе и под контролем."
901010600450-9 = "Их организация занимается множеством незаконных дел. У них строгая иерархия, как у семьи Риболлита, с которой мы сталкивались раньше."
901010600450-10 = "Хмм. Как бы они себя ни называли и какого бы размера ни были, всё равно просто шайка головорезов."
901010600450-11 = "Члены семьи, которых я встречала, вроде бы честно зарабатывают на охранной работе."
901010600450-12 = "Но они ведь дают деньги под огромный процент? Разве это не незаконно?"
901010600450-13 = ""
901010600450-15 = ""
901010600450-16 = "Я проверила. Ставка не превышает лимит, установленный Генеральным студенческим советом. Выглядит подозрительно, но технически законно."
901010600450-17 = "Настоящая проблема — в их отделе взыскания..."
901010600450-18 = ""
901010600450-20 = ""
901010600450-21 = ""
901010600450-22 = "Есть несколько историй о том, как должники внезапно исчезали после того, как семья Карпаччо начинала требовать возврата денег."
901010600450-23 = "Я не слышала о конкретных случаях насилия, но, полагаю, большинство угроз звучало за закрытыми дверями."
901010600450-24 = "Похоже, мы наконец к чему-то приближаемся."
901010600450-25 = "Причина, по которой так много людей исчезло в этом районе, заключается в том, что..."
901010600450-26 = ""
901010600450-28 = ""
901010600450-29 = ""
901010600450-32 = ""
901010600450-33 = "#Q;오토기;Причина, по которой так много людей исчезло в этом районе, заключается в том, что...\n[as1] «На них напали крабы-монстры.»\n[as2] «Они нашли врата в другой мир.»\n[as3] «Они не смогли вернуть долги семье Карпаччо.»"
901010600450-34 = ""
901010600450-36 = ""
901010600450-37 = "Когда это мы говорили про крабов-монстров?"
901010600450-38 = "Сенсей, вы вообще меня слушали?"
901010600450-39 = "Подумайте получше."
901010600450-40 = ""
901010600450-42 = ""
901010600450-43 = ""
901010600450-47 = "А, я читала похожую мангу."
901010600450-48 = "Что-то про перерождение после прохода через дверь в другой мир..."
901010600450-49 = ""
901010600450-51 = ""
901010600450-52 = "Погодите, какое это вообще имеет отношение к нашему разговору?!"
901010600450-53 = ""
901010600450-55 = ""
901010600450-57 = ""
901010600450-58 = ""
901010600450-62 = "...В этом есть смысл."
901010600450-63 = "Семья Карпаччо давала людям в порту займы под высокий процент, а потом давила на них, требуя вернуть деньги. Логично, что кто-то от них сбежал."
901010600450-64 = "Если смотреть по времени, люди начали пропадать в порту Канэсаки только после того, как семья Карпаччо запустила кредитные услуги."
901010600450-65 = "Не зря говорят, что люди страшнее призраков."
