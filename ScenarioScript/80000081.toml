[translation]
80000081-1 = "Дарить как ниндзя"
80000081-2 = ""
80000081-3 = "День святого Валентина, раннее утро."
80000081-5 = ""
80000081-6 = "Наконец-то настал..."
80000081-7 = "Сегодня День святого Валентина."
80000081-8 = "День, когда даришь шоколад тому самому особенному человеку..."
80000081-9 = ""
80000081-11 = ""
80000081-12 = "Хорошо, я приготовила шоколад точно по книге, но..."
80000081-13 = "Просто вручить его обычным способом недостаточно."
80000081-14 = "Нужно подарить его как ниндзя. Там сказано, что это важно."
80000081-15 = "Но... что это значит? Как ниндзя должен дарить...?"
80000081-16 = "Как ниндзя... как ниндзя..."
80000081-17 = ""
80000081-19 = ""
80000081-20 = "Хм... О! Это может сработать..."
80000081-25 = "[ns1] «Фух, на этом утренние выездные дела, кажется, закончены...»\n[ns2] «Дальше нужно до обеда разобраться с этой кипой документов.»"
80000081-31 = "[ns] «Вот ещё одна готова...»"
80000081-33 = "..."
80000081-34 = ""
80000081-37 = "[ns] «Мне послышалось...? А, неважно...»"
80000081-39 = "[ns] «Надо допечатать этот документ и—»"
80000081-41 = ""
80000081-43 = "...Ух..."
80000081-45 = "[ns] «Опять этот звук... Нет, у меня нет на это времени.»"
80000081-47 = "[ns] «Нужно собрать все эти файлы до дедлайна—»"
80000081-49 = "Угххх..."
80000081-50 = ""
80000081-53 = "[ns] «Мне не показалось!»"
80000081-54 = "*всхлип* *всхлип* Угх..."
80000081-55 = "По пустому кабинету исполнительного совета разнёсся загадочный звук... На мгновение я запаниковал."
80000081-56 = "[ns] «Это... п-п-призрак?»"
80000081-57 = "*всхлип* Сенсей, п-помогите мне!"
80000081-58 = "[s] «Это идёт... из шкафа?»"
80000081-63 = ""
80000081-64 = "[ns] «Цукуё, почему... Что ты делаешь в шкафу?»"
80000081-65 = "Сенсей... Я застряла... Совсем не могу двигаться..."
80000081-66 = "М-Можете помочь мне...? *всхлип*"
80000081-68 = "В конце концов Цукуё объяснила, как умудрилась застрять в моём шкафу."
80000081-70 = "Ну, сегодня День святого Валентина, поэтому..."
80000081-71 = "Вроде бы нужно дарить шоколад важному человеку... да?"
80000081-72 = "Поэтому я и пришла... но..."
80000081-73 = "[s] «Но...?»"
80000081-74 = "*всхлип* Ну... мне сказали, что нельзя просто взять и вручить вам шоколад..."
80000081-75 = "Нужно подарить его так, как сделал бы ниндзя..."
80000081-76 = "[s] «Да, кажется, я догадываюсь, кто это сказал.»"
80000081-77 = "Поэтому я долго думала, как подарить вам шоколад по-ниндзяски..."
80000081-78 = "[s] «И поэтому ты залезла в шкаф?»"
80000081-79 = "Залезть-то я смогла, но потом не получилось выбраться..."
80000081-80 = "И... наверное... потому что я слишком большая..."
80000081-81 = "Из-за того, что моё тело такое... такое бесполезно большое..."
80000081-82 = "Я только создаю вам проблемы..."
80000081-83 = "*всхлип* П-простите меня..."
80000081-84 = "[s] «Нет, это совсем не так. Всё хорошо, Цукуё.»"
80000081-86 = "[ns] «Меня тронуло уже то, на что ты пошла ради этого шоколада.»"
80000081-87 = "П-Правда...?"
80000081-88 = "Ну, мне было немного страшно... и я не была уверена, что так можно..."
80000081-89 = "Но всё же..."
80000081-90 = "Первое правило ниндзя: ниндзя должен быть готов взяться за что угодно, когда угодно и где угодно, без колебаний..."
80000081-91 = "Поэтому, помня об этом, я вложила все силы в шоколад для вас."
80000081-92 = ""
80000081-94 = ""
80000081-95 = ""
80000081-96 = "[ns] «Цукуё, насчёт этого шоколада...»"
80000081-97 = "Да? О, его форма?"
80000081-98 = "О, ну..."
80000081-99 = "Наверное, я... слишком крепко держала его в шкафу."
80000081-100 = "И он растаял в это... месиво..."
80000081-101 = "И ещё, эм..."
80000081-102 = "Это всё из-за тепла моего тела..."
80000081-103 = "П-П-Простите!"
80000081-104 = "Он превратился в такой ужас...!"
80000081-105 = "[s] «Т-Тепло... твоего тела...?!»"
80000081-106 = "П-Простите! Я не могу подарить его вам в таком виде!"
80000081-107 = "Я-я скоро принесу вам нормальный подарок, обещаю!"
80000081-108 = ""
80000081-110 = ""
80000081-111 = ""
80000081-113 = "[ns] «Нет! Всё нормально!»"
80000081-114 = "С-Сенсей?"
80000081-115 = "[s] «Неважно, как он выглядит! Я рад, что ты сделала его для меня, Цукуё.»"
80000081-116 = "П-Правда...?"
80000081-117 = "[s] «Ага!»"
80000081-118 = "Ну... хорошо! Тогда..."
80000081-119 = ""
80000081-121 = ""
80000081-122 = "[ns] «Спасибо, Цукуё. Я обязательно с удовольствием—»"
80000081-123 = "Э-Эм, Сенсей! Если вы не против..."
80000081-124 = "Можете... съесть его прямо сейчас и сказать... что думаете?"
80000081-125 = "Или я слишком многого прошу...?"
80000081-126 = "[s3] «А? Эм, ну...»\n[s4] «(Съесть это сейчас... после того, как Цукуё его растопила?!)»"
80000081-127 = "..."
80000081-128 = "..."
80000081-129 = "О... Я так и знала..."
80000081-130 = "Потому что он такой уродливый..."
80000081-131 = "Я только ставлю вас в неловкое положение, прося съесть такую гадость..."
80000081-132 = "Хе... хе-хе... хе... П-простите! Я была слишком настойчива..."
80000081-133 = "[s] «Нет! Я съем его прямо сейчас!»"
80000081-134 = "П-Правда?"
80000081-135 = "[s] «Ты же сама его сделала!»"
80000081-136 = "А..."
80000081-137 = "Собравшись с духом, я съел шоколад Цукуё одним кусочком."
80000081-138 = ""
80000081-141 = "[ns] «Ммм! Вкусно!»"
80000081-142 = "Правда?"
80000081-143 = "Я... я так рада!"
80000081-144 = "Тогда в следующий раз я дам вам ещё больше!"
80000081-145 = "И в следующий раз всё будет ещё более по-ниндзяски!"
80000081-146 = "[s] «О, э-э, хорошо! Буду ждать!»"
80000081-147 = "Хи-хи-хи!"
80000081-149 = "Оставшуюся часть Дня святого Валентина я провёл с Цукуё, но, учитывая, что подобное могло повториться..."
80000081-150 = "...мне пришлось укрепить решимость сразу в нескольких смыслах."
