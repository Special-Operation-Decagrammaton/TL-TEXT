[translation]
90000035-2 = "Начинаем анализировать данные, полученные от ЧВК."
90000035-5 = ""
90000035-7 = "Нашли что-нибудь полезное, Президент?"
90000035-8 = "Наоборот. Там пусто."
90000035-9 = "Как такое возможно?"
90000035-10 = "Любопытно. Всё, что добывали на месте раскопок, шифровалось и передавалось в штаб. Тут не осталось ни следа."
90000035-11 = "Слишком уж много усилий для скрытия «ничего»."
90000035-12 = "Согласна. Обычная частная военная компания не стала бы так защищать данные. Это вызывает ещё больше подозрений."
90000035-13 = "Похоже, придётся залезть прямо в логово дракона. Меняем цель на штаб-квартиру Кайзера."
90000035-14 = "Разве это не будет намного сложнее?"
90000035-15 = "Да, однако..."
90000035-16 = ""
90000035-18 = ""
90000035-20 = "Готово. База данных как на ладони. Для такой прекрасной и обворожительной хакерши, как я, нет ничего невозможного."
90000035-21 = "Впечатляет. Но я всё ещё не согласна, что красота здесь хоть как-то участвует."
90000035-22 = "Участвует. Взлом — базовый навык любой прекрасной девушки."
90000035-23 = ""
90000035-25 = ""
90000035-26 = "Посмотрим, что ЧВК от нас скрывает."
90000035-30 = "Хмм... Понятно."
90000035-31 = "Записи боёв с Биной. Разбирать придётся немало."
90000035-32 = "Записи боёв с Биной. Разбирать придётся немало."
90000035-33 = "ЧВК сражалась с Биной на месте раскопок в пустыне?"
90000035-34 = "Скорее, они защищали раскопки от Бины."
90000035-35 = "Мне становится всё интереснее, что именно они там делали."
90000035-36 = ""
90000035-38 = ""
90000035-39 = ""
90000035-41 = "Данные раскопок полностью засекречены. Более того, я никогда не видела такой тип брандмауэра."
90000035-42 = "Хи-хи, как смело. Новая технология? Я прямо чувствую, как во мне разгорается хакерский азарт."
90000035-43 = "Схема использует одноразовый пароль на основе обычного алгоритма случайных чисел. Не особо сложно, но специально сделано так, чтобы отнимать время."
90000035-44 = "Наверняка это ловушка: пока злоумышленник работает, они успевают изменить схему."
90000035-45 = "Но думаю, я справлюсь за четыре часа."
90000035-46 = "...Президент. В этом нет необходимости. Наша цель — Бина, а не раскопки."
90000035-47 = "Но... на кону моя репутация прекрасной хакерши, что снизошла до того, чтобы осчастливить эту планету своим присутствием..."
90000035-48 = "Наша единственная цель — Бина. И снова: красота никак не связана с миссией."
90000035-49 = "..."
90000035-50 = "[s] (Она дуется...)"
90000035-53 = "...Ладно. Пророки — главный приоритет. Свою гениальность я докажу в свободное время..."
90000035-54 = "(Как раздражает.)"
90000035-55 = "Не трать силы на злые взгляды. Разве я уже великодушно не согласилась сосредоточиться на текущем деле?"
90000035-56 = "Ладно. Прошу прощения."
