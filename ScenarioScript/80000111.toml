[translation]
80000111-1 = "На полную ради юности"
80000111-2 = "Исполнительный офис Шале"
80000111-3 = "Сенсей. Как вы наверняка знаете, сегодня День святого Валентина."
80000111-4 = "[s] «А, да. Точно.»"
80000111-5 = "День святого Валентина настолько важен для молодёжи, что его впору переименовать в День юности!"
80000111-6 = "Если говорить о том, насколько он культовый... Если кого-нибудь спросить: «Какой день года самый юношеский?»"
80000111-7 = "Неудивительно, если его поставят в один ряд с «первым днём в школе», «выпускным», «кануном Рождества», «летним фестивалем фейерверков», «Новым годом» и «ночью перед школьным фестивалем, когда не спишь до утра»."
80000111-8 = "День святого Валентина — настоящий символ страсти юности."
80000111-9 = "[s] «Не слишком ли много других дней в этом списке, чтобы называть День святого Валентина культовым?»"
80000111-10 = "Хм? Нет... Список совершенно нормальный."
80000111-11 = "При правильном настрое любой день может быть наполнен юностью для таких её последователей, как мы."
80000111-12 = "И, к слову, если меня кто-нибудь спросит, я не задумываясь отвечу именно так."
80000111-13 = "Мы живём настоящим! Каждый новый сегодняшний день — самый юношеский из всех!"
80000111-14 = "Для меня, которая каждый день предаётся юношеским занятиям вместе с Сенсеем— То есть, с Наставником, каждый день переполнен юностью."
80000111-15 = "[s1] «Как ловко ты обошла всё, что только что сказала!»\n[s2] «Что ж, по крайней мере твои слова согрели мне сердце!»"
80000111-18 = "В любом случае... Вот что действительно важно."
80000111-19 = "Мы опозорили бы звание наставников юности, если бы просто сидели без дела в такой наполненный юностью день, как День святого Валентина."
80000111-20 = "И прежде всего есть одна вещь, которую сегодня мы просто обязаны сделать. Разве нет?"
80000111-21 = "[s] «Начинается на Ш и заканчивается на Д?»"
80000111-22 = "Как посредник юности, посвятивший себя юношеским занятиям вместе со своим наставником..."
80000111-23 = "Я хочу сделать сегодняшний День святого Валентина настолько прекрасным, чтобы Сенсей никогда его не забыл!"
80000111-24 = "Поэтому я решила."
80000111-25 = "Я создам супер-крутой валентиновский шоколад, достойный моей цели... и подарю его вам, Сенсей."
80000111-26 = "Что скажете о моём плане, Сенсей?!"
80000111-27 = "[s] «Думаю, он меня очень радует, Рэнгэ.»"
80000111-28 = "Правда? Аха-ха."
80000111-29 = "Я использую все бесчисленные юношеские впечатления, которые показал мне мой Наставник, как ориентир..."
80000111-30 = "И покажу вам лучшую версию себя, Фува Рэнгэ. Ждите с нетерпением!"
80000111-31 = "[s] «Ладно. Как скажешь, Рэнгэ...»"
80000111-32 = "Тогда договорились. Адьос, Наставник!"
80000111-33 = ""
80000111-35 = ""
80000111-36 = "[ns] «Буду ждать— А, уже ушла.»"
80000111-38 = "После уверенного заявления Рэнгэ я терпеливо ждал в Шале."
80000111-39 = ""
80000111-42 = "Увы, всё никогда не идёт точно по плану."
80000111-45 = "Через три часа после ухода Рэнгэ..."
80000111-46 = ""
80000111-50 = "[ns] «Привет, Рэнгэ, шоколад готов...?»"
80000111-51 = ""
80000111-53 = ""
80000111-54 = "А, простите, Наставник. Я позвонила сказать, что с шоколадом потребуется ещё немного времени."
80000111-55 = "Но всё идёт хорошо, так что подождите ещё совсем чуть-чуть!"
80000111-56 = "[s] «А, отлично. Хорошо. Только не переусердствуй.»"
80000111-57 = "Не переживайте. Я постепенно начинаю понимать, как всё делать. Тогда до скорого!"
80000111-58 = ""
80000111-60 = ""
80000111-62 = "Ещё через ТРИ часа после звонка Рэнгэ..."
80000111-66 = "[ns] «Эм, Рэнгэ. Шоколад...?»"
80000111-67 = "Именно поэтому я и позвонила!"
80000111-68 = "Простите, Наставник! Осталось ещё са-а-амую малость! Я почти закончила."
80000111-69 = "По моим расчётам, готово где-то на 80%... ммм, 78%... нет, 67... Да, примерно наполовину!"
80000111-70 = "[s] «Как ты умудрилась потерять 30% прогресса за несколько секунд, Рэнгэ?!»"
80000111-71 = "Всё нормально! Говорят же: хорошее начало — половина дела, да?"
80000111-72 = "[s] «После этой фразы я уже сомневаюсь, закончила ли ты хотя бы половину!»"
80000111-73 = "В-Всё нормально! В сутках ещё полно времени!"
80000111-74 = "Тогда ладно! Позвоню, как закончу, Наставник!"
80000111-75 = ""
80000111-77 = ""
80000111-79 = "ЕЩЁ через три часа..."
80000111-82 = ""
80000111-83 = "[ns] «Ал—»"
80000111-84 = "Простите! Наставник! Пожалуйста, потерпите! Осталось совсем чуть-чуть!"
80000111-85 = "Я только что узнала, что такое водяная баня!"
80000111-86 = "Неудивительно, что у меня были такие проблемы! Оказывается, шоколад нельзя плавить прямо на огне!"
80000111-87 = "Похоже, юность — это ещё и постоянное изучение нового!"
80000111-88 = "[s] «Эм, н-ну да...»"
80000111-89 = "Тогда, Наставник... Я позвоню, как только закончу! Ни секундой раньше!"
80000111-90 = ""
80000111-92 = ""
80000111-96 = "Ещё через три часа после последнего звонка Рэнгэ..."
80000111-97 = ""
80000111-100 = "[ns] «На этот раз Рэнгэ не позвонила... Надеюсь, с ней всё хорошо.»"
80000111-101 = "Я подумал было дождаться её звонка, но..."
80000111-102 = ""
80000111-105 = "[ns] «Наверное, стоит проверить.»"
80000111-109 = "Кухня Хяккарёран"
80000111-110 = "[ns] «Везде выключен свет...»"
80000111-111 = "Я обошёл места, где, как мне казалось, могла быть Рэнгэ."
80000111-112 = ""
80000111-113 = ""
80000111-114 = ""
80000111-115 = "Ух, что бы я ни делала, форма всё равно не получается... Такими темпами я не успею..."
80000111-116 = "[s] «...Рэнгэ?»"
80000111-117 = ""
80000111-119 = ""
80000111-120 = "С-Сенсей?! Почему вы здесь?"
80000111-121 = "А... Вы забеспокоились, потому что я не позвонила..."
80000111-122 = "...Ух."
80000111-123 = "Мне так жаль, Сенсей! Просто—!"
80000111-126 = ""
80000111-127 = "[ns] «У тебя не получилось сделать шоколад таким, как ты хотела, да?»"
80000111-128 = "Мне нечем оправдаться, Сенсей..."
80000111-129 = "Я хотела сделать сегодняшний День святого Валентина самым лучшим... поэтому хотела приготовить самый лучший валентиновский шоколад..."
80000111-130 = "Простите! После всей моей бравады я в итоге заставила вас ждать до глубокой ночи..."
80000111-131 = "...Я даже нормально готовить не умею! Неудивительно, что хороший шоколад у меня не получается."
80000111-132 = "Аха-ха... Распустила язык перед Сенсеем, даже не зная своего места... Как же стыдно..."
80000111-133 = ""
80000111-135 = ""
80000111-136 = ""
80000111-137 = "Простите... Вы ведь не хотите слушать, какая я неумёха, правда?"
80000111-138 = "Если бы я знала, что всё закончится так, я бы вообще не придумывала этот план с шоколадным подарком..."
80000111-139 = "[s] «Нет... это совсем не так, Рэнгэ.»"
80000111-140 = "Сэн... сэй?"
80000111-141 = "[s3] «Рэнгэ, то, с какой уверенностью ты сказала, что приготовишь мне шоколад...»\n[s4] «Меня это обрадовало. Потому что ты сама так решила.»"
80000111-144 = "То есть... вы не разочарованы, что я не смогла приготовить вам шоколад?"
80000111-145 = "Вы правда—"
80000111-146 = "[s] «Неудачи — тоже часть юности. А если потерпел неудачу, значит, можно попробовать снова.»"
80000111-148 = "[ns] «Я помогу тебе столько, сколько потребуется. В конце концов, я твой наставник.»"
80000111-149 = "Сэн— Нет, Наставник..."
80000111-150 = ""
80000111-152 = ""
80000111-153 = "...Да!"
80000111-154 = "Я немного пала духом из-за того, что снова и снова терпела неудачу."
80000111-155 = "Но это совсем на меня не похоже!"
80000111-156 = "Кхм."
80000111-157 = "...Тогда, хоть просить об этом немного бесстыдно..."
80000111-158 = "Вы поможете мне приготовить шоколад?"
80000111-159 = "[s] «Разумеется»."
80000111-160 = ""
80000111-163 = ""
80000111-165 = "Проведя несколько минут вместе с Рэнгэ над горячей кастрюлей..."
80000111-168 = ""
80000111-169 = "А... Н-Наконец-то..."
80000111-170 = ""
80000111-172 = ""
80000111-174 = "Я у-успела закончить до конца дня! И всё благодаря вам, Наставник!"
80000111-175 = "[s] «Фух, какое облегчение.»"
80000111-176 = "А... Но правда, огромное спасибо, Наставник."
80000111-177 = "Мне всегда немного страшно думать, как всё могло бы сложиться без ваших наставлений."
80000111-178 = "Я так рада, что вы рядом..."
80000111-179 = "А! Нельзя тратить время! Хотя немного неловко, ведь мы сделали это вместе."
80000111-180 = "Наставник! Пока день ещё не закончился, может—"
80000111-181 = "[s] «Поделимся шоколадом? Конечно.»"
80000111-182 = ""
80000111-184 = ""
80000111-186 = "Шоколад, который мы приготовили вместе с Рэнгэ, был тёплым и очень сладким."
