[translation]
10001045-1 = "Эпизод 4; Первая победа!"
10001045-2 = "Бывший институт академии Красная Зима"
10001045-3 = "Примерно через час после начала состязания..."
10001045-4 = "Уф... У-у-у..."
10001045-5 = "Э-это пытка... Я никогда даже не слышала о таком компоте..."
10001045-6 = "[s] «Там есть алкоголь?»"
10001045-7 = "Нет, проблема в том, что он—"
10001045-8 = "Сладкий! Слишком сладкий!"
10001045-9 = "Что происходит, Шигурэ?! Этот компот настолько сладкий, что у меня зубы болят!"
10001045-10 = "Сахар быстро сгорает, поэтому засахаренные фрукты в компоте идеально помогают бороться с суровым холодом здесь."
10001045-11 = "Может и так, но это безумие! Я чувствую кристаллы сахара в каждом глотке! Такими темпами у меня все зубы выпадут!"
10001045-12 = "Уф, если мне придётся сделать ещё хоть один глоток, кажется, я..."
10001045-13 = "Х-хех... Похоже, ты уже на пределе."
10001045-14 = "Я постоянно ем всякие сладости в секретариате. Для меня такая сладость — п-п-пустяк!"
10001045-15 = "Если хочешь сдаться, сейчас самое время!"
10001045-16 = "У-у-у... Я не хочу проигрывать, но..."
10001045-17 = ""
10001045-18 = "...Я сдаюсь."
10001045-20 = "Ура! Я победила!"
10001045-21 = "Блестящая победа, Великий лидер! Достойная нашей любимой президента Черино!"
10001045-22 = "Сегодняшнее состязание войдёт в историю академии Красная Зима как великое событие!"
10001045-23 = "Прекрасная идея, главный секретарь Томоэ! О моём величии будут знать многие будущие поколения студентов!"
10001045-24 = "Как лучше написать? «Президент академии Красная Зима Черино лично бросила вызов студентам Спецотряда и одержала сладкую победу во имя...»"
10001045-25 = "Эм... А зачем мы вообще устраивали это состязание?"
10001045-26 = "А, неважно. Наверное, ничего важного. Главное, что я победила! Ха-ха-ха!"
10001045-27 = ""
10001045-29 = "Уф, ну и отстой... Не могу поверить, что проиграла этой мелкой соплячке..."
10001045-30 = "Ты всё ещё называешь меня мелкой соплячкой даже после моей победы?!"
10001045-31 = "В-в общем, пусть ты и не смогла сравниться со мной, но держалась довольно неплохо."
10001045-32 = "Если бы я пренебрегала своим пудинговым режимом, то и глотка этого компота не смогла бы сделать, не свалившись с ног."
10001045-33 = "Товарищ Нодока, как товарищу по полю битвы сладостей, я хочу выразить тебе уважение за то, что выдержала всё до конца."
10001045-34 = "Президент Черино..."
10001045-35 = "Поэтому, когда я вернусь в секретариат, я немедленно отменю твоё отстранение!"
10001045-36 = "Но ты должна была сделать это давным-давно!"
10001045-37 = "А? П-правда?"
10001045-38 = "Эх... Ладно, и на том спасибо."
10001045-39 = "Выбраться отсюда без твоей помощи будет сложно, к тому же есть ещё Сенсей..."
10001045-40 = "Так что пока я тебе помогу."
10001045-41 = ""
10001045-42 = "Ха-ха! Моё великое лидерство наконец принесло плоды."
10001045-43 = ""
10001045-44 = "Даже изгнанницы не могут устоять перед моей харизмой! Ха-ха-ха!"
10001045-45 = ""
10001045-46 = "Гх! Терпеть не могу эту самодовольную малявку!"
10001045-47 = ""
10001045-48 = "Я же сказала, что я не малявка!"
