[translation]
1011006-1 = "Девушка, за которой следуют птицы"
1011006-2 = "Я отправился в Тринити обсудить рабочие вопросы, касающиеся и Тринити, и Генерального студенческого совета."
1011006-3 = "Тем для обсуждения было довольно много, поэтому к моменту окончания встречи уже стемнело."
1011006-8 = "[ns1] «...? Птичье щебетание?»\n[ns2] Пойти туда, откуда доносится звук."
1011006-14 = "[ns3] «Это место...»\n[ns4] «...крытый парк Чаепития?»"
1011006-17 = "...Сенсей?"
1011006-18 = ""
1011006-21 = ""
1011006-22 = "Что ты здесь делаешь...?"
1011006-23 = "А-а. Точно, вы говорили, что пришли по делам. Я не участвовала во встрече, потому что она меня не касалась..."
1011006-24 = "...но я забыла, что вы там будете. Возможно, стоило всё-таки прийти."
1011006-25 = "Хотя сидеть на всей встрече, к которой я не имею отношения, только ради встречи с вами было бы немного неловко."
1011006-26 = "Но в итоге мы всё равно встретились, значит, сегодня мой счастливый день."
1011006-27 = "...Хм? Что я здесь делала?"
1011006-28 = "Просто гуляла, как видите. Здесь приятно тихо. Ни сплетен, ни стрельбы, ни гранат."
1011006-29 = "Я воспользовалась связями и зарезервировала весь парк только для себя."
1011006-30 = ""
1011006-32 = ""
1011006-33 = "...Фуфу, нет, я шучу."
1011006-34 = "Я просто подумала, что вы, возможно, пройдёте мимо. О, пожалуйста, не смотрите на меня так."
1011006-35 = "[s5] «Тогда это птичье щебетание...»\n[s6] «Это пела птица, которая сейчас сидит у тебя на руке?»"
1011006-38 = "Щебетание...?"
1011006-39 = ""
1011006-41 = ""
1011006-42 = ""
1011006-43 = "...Ага."
1011006-44 = "Нет, если вы об этом, я вовсе не планировала заманивать вас сюда."
1011006-45 = "Мне просто хотелось увидеть, как вы проходите мимо."
1011006-46 = "Щебетание, значит..."
1011006-47 = "Хотите знать, исходило ли оно от этой малышки? Возможно."
1011006-48 = "...С уверенностью сказать трудно."
1011006-49 = "[s7] «То есть, может быть?»\n[s8] «Звучит загадочно.»"
1011006-52 = "Фуфу, я и правда люблю загадки, но сейчас дело не в этом. Видите ли..."
1011006-53 = "В этом парке живёт множество этих малышей, и некоторые часто прилетают к моему окну. Порой они даже садятся на меня, хотя я никогда не уверена, кто из них кто."
1011006-54 = "Так что услышанное вами щебетание могло принадлежать этой птице, а могло и совершенно другой."
1011006-55 = "Единственное, что я могу сказать наверняка: у всех них прекрасные голоса."
1011006-56 = "И какая бы из них ни очаровала вас настолько, что привела сюда, я ей искренне благодарна."
1011006-57 = "Уверена, малышкам было бы приятно узнать, что они добавили немного любопытства в ваш день. И мне тоже."
1011006-58 = "[s9] «Красиво поют.»\n[s10] «Хорошая песня.»"
1011006-61 = "Спасибо. То есть позвольте мне принять ваш комплимент от их имени."
1011006-62 = "Кстати..."
1011006-63 = "Я люблю хорошие песни. Иногда, когда остаюсь одна, даже сама пою."
1011006-64 = "...Фуфу."
1011006-65 = "Мне нравится ваше удивлённое лицо после этих слов."
1011006-66 = "И мне очень хочется воспользоваться моментом и спеть для вас..."
1011006-67 = "...но, пожалуй, стоит воздержаться. Первая песня, которую я спою для вас, должна прозвучать в особом месте и в особое время."
1011006-68 = ""
1011006-71 = "О, не смотрите на меня так."
1011006-72 = "Пение имеет для меня особое значение, Сенсей."
1011006-73 = "Когда-то я была невероятно застенчивой и неловкой в разговорах с людьми. Даже сильнее, чем сейчас. Стоило мне открыть рот, как окружающим становилось не по себе."
1011006-74 = "Изменить это было трудно, и я не всегда была уверена, что вообще должна."
1011006-75 = "Но иногда наступали редкие моменты, когда мне нужно было сказать людям правду прямо, без прикрас."
1011006-76 = "...И тогда моим способом становилось пение."
1011006-77 = "Для людей из Чаепития, Сестринства и Рыцарей исцеления... даже для других студентов Тринити."
1011006-78 = "И даже во время редких встреч со студентами других школ я пела, чтобы выразить свои мысли, когда это было совершенно необходимо."
1011006-79 = "Моя жизнь была полна оправданий и хождения вокруг да около. Я лицемерила и не могла быть честной с самой собой..."
1011006-80 = "Пение было моим единственным способом сказать: «только не в этот раз.»"
1011006-81 = "Поэтому я не могу спеть вам лишь потому, что мне захотелось. Я сама приучила себя к другому."
1011006-82 = ""
1011006-84 = ""
1011006-85 = ""
1011006-86 = ""
1011006-87 = ""
1011006-88 = ""
1011006-89 = ""
1011006-90 = "Вы выглядите очень разочарованным. Неужели теперь ваша очередь вести себя как капризный ребёнок?"
1011006-91 = "Хм, хотя почему-то..."
1011006-92 = "Мне начинает казаться, что однажды я всё же захочу для вас спеть."
1011006-93 = "Ах, вы всегда так хорошо читаете мои намерения. Моя притворная невозмутимость вас никогда не обманывает. Мне остаётся лишь подыгрывать вашему подыгрыванию."
1011006-94 = "С учётом всего сказанного, возможно, вам так никогда и не доведётся услышать, как я пою."
1011006-95 = "Разве это не было бы досадно?"
1011006-96 = "...О, вы снова меня раскусили."
1011006-97 = "Есть одна истина, которую я хочу вам сказать. Хотя к этому моменту она, пожалуй, уже вряд ли станет откровением."
1011006-98 = "Тогда я спою её для вас..."
1011006-99 = "Сенсей..."
1011006-100 = ""
1011006-102 = ""
1011006-103 = ""
1011006-104 = ""
1011006-106 = "Это моя..."
1011006-107 = "...«песня благодарности» для вас."
