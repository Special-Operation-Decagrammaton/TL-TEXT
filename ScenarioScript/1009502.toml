[translation]
1009502-1 = "Я стану горничной, Сенсей"
1009502-2 = "Работа в Миллениуме закончилась быстрее, чем я ожидал."
1009502-3 = "Вспомнив слова Мидори, я решил заглянуть в Отдел разработки игр."
1009502-7 = "[ns] «Есть кто-нибудь? Я в гости.»"
1009502-8 = ""
1009502-9 = "А? С-С-Сенсей?! Сейчас не самое подходящее время, то есть...!"
1009502-10 = "Я-я правда говорила, что было бы здорово, если бы вы заглянули в нашу клубную комнату, но...!"
1009502-11 = "[s1] «А, привет, Мидори.»\n[s2] «Так ты теперь в костюме горничной.»"
1009502-14 = "Как вы можете относиться к этому настолько спокойно?!"
1009502-15 = "[s] «Ну... кажется, я уже начинаю привыкать.»"
1009502-16 = "Какая-то обидная реакция!"
1009502-17 = "[s] «Почему?»"
1009502-18 = "Ну, хотя бы потому, что неловко почему-то только мне."
1009502-19 = "Я выгляжу совсем не как обычно, а вы почти никак не отреагировали."
1009502-20 = "Не то чтобы это было чем-то ПЛОХИМ..."
1009502-21 = "...но я надеялась на более заметную реакцию!"
1009502-22 = "[s] «Хм, а что ты имеешь в виду под „реакцией“?»"
1009502-23 = "Вы правда хотите, чтобы я сказала это вслух?"
1009502-24 = "Ладно, могу сказать, наверное... или всё-таки нет..."
1009502-26 = "В общем, если говорить проще, например, короче говоря...!"
1009502-27 = "[s] «Всё хорошо, Мидори. Не спеши, соберись с мыслями.»"
1009502-29 = ""
1009502-30 = "Так вот... я рисовала концепт-арт для игры про горничную."
1009502-31 = "Но чем дольше я над ним работала, тем больше путалась."
1009502-32 = "Если поискать, можно найти ТОННЫ референсов с костюмами горничных."
1009502-33 = "Их столько, что просто тонешь в информации."
1009502-34 = "Из-за этого сложно придерживаться какого-то одного направления, понимаете?"
1009502-35 = "Вот я и подумала, что будет полезно испытать всё на себе..."
1009502-36 = "[s] «И поэтому ты переоделась?»"
1009502-37 = "Ну..."
1009502-38 = "Вы ведь думаете, что мне не обязательно было заходить так далеко? А вот и обязательно!"
1009502-39 = "Сенсей, образ обычной горничной в наши дни уже довольно избит."
1009502-40 = "Горничная, которая идеальна и непобедима во всём, но показывает слабость лишь своему хозяину, встречается сейчас чуть ли не на каждом шагу."
1009502-41 = "И горничная, которая сильна, отлично сражается, занимается проникновением и устранением целей, а заодно ещё и спасает мир, тоже стала слишком уж обычным делом."
1009502-42 = "[s] «(Не уверен, хорошо ли это...)»"
1009502-43 = "Поэтому, чтобы выделиться, я решила создать классическую, традиционную горничную! Вот правильный путь."
1009502-44 = "Но... я зашла в тупик..."
1009502-45 = "Вот только что именно значит «традиционная горничная»?"
1009502-46 = "Что думаете, Сенсей?"
1009502-47 = "[s] «Без понятия...»"
1009502-48 = "Ну, ничего страшного. У меня всё же есть несколько идей."
1009502-49 = "Для традиционной горничной самое важное — её «хозяин»!"
1009502-50 = "Тот, кто отдаёт ей приказы, контролирует её работу, награждает за успехи и наказывает, если она не справляется."
1009502-51 = "Проще говоря, слуга, которому некому служить, — уже не слуга."
1009502-52 = "А если смотреть реалистичнее, без начальника, который платит ей зарплату, горничная не сможет быть горничной."
1009502-53 = "[s] «Оплата труда действительно важна!»"
1009502-54 = "Правда? Хи-хи. Вы понимаете."
1009502-55 = "Так или иначе, для меня важнее всего понять ИСТИННЫЙ смысл того, что значит быть горничной."
1009502-56 = "А чтобы понять это, нужно самой оказаться на месте горничной."
1009502-57 = "Повторюсь: чтобы полностью вжиться в эту роль..."
1009502-58 = "...я не могу обойтись без хозяина!"
1009502-59 = "Именно поэтому с сегодняшнего дня у меня не остаётся иного выбора, кроме как какое-то время быть вашей горничной, Сенсей!"
1009502-60 = "[s] «Тебе не кажется, что вывод немного странный?!»"
1009502-61 = "Нет, он совершенно логичный."
1009502-62 = "Логичнее и быть не может!"
1009502-63 = "[s] «...Ну, раз ты так говоришь!»"
1009502-64 = "Хи-хи-хи. Отлично!"
1009502-65 = "В таком случае, Сенсей, рассчитываю на вашу поддержку в моём опыте работы горничной."
1009502-66 = "Что бы вы хотели поручить мне первым делом?"
1009502-67 = "...Хозяин?"
1009502-68 = "Если хотите, я могу вернуться с вами в Шале и помочь с домашними делами..."
1009502-69 = ""
1009502-71 = ""
1009502-72 = "Вообще-то, я даже настаиваю. Давайте начнём прямо сейчас!"
1009502-73 = "[s] «Эй, Мидори, просто вдохни. Успокойся.»"
1009502-74 = "Я и так совершенно спокойна, спасибо."
1009502-76 = "В конце концов мне удалось уговорить Мидори отказаться от идеи прислуживать мне, после чего я вернулся в Шале."
