[translation]
80000071-1 = "Небрежно упакованный шоколад на День святого Валентина"
80000071-2 = "Сад Цветущей Сливы"
80000071-3 = "По делам Шале я заглянул в Сад сливовых цветов."
80000071-4 = "Добро пожаловать, Сенсей."
80000071-5 = "Простите, что не смогла прийти к вам! Как видите, я вся в делах!"
80000071-6 = "[s] «Что это за куча шоколада?»"
80000071-7 = "Разве не очевидно? Это валентиновский шоколад!"
80000071-8 = "Обычно мы не даём детям сладости. Для них это не слишком полезно."
80000071-9 = "Но сегодня День святого Валентина, поэтому после обеда я раздам им шоколад как особое угощение."
80000071-10 = "[s] «Ты такой хороший учитель, Кокона!»"
80000071-11 = "Не Кокона! Инструктор Кокона!"
80000071-12 = "Я-я имею в виду... Я просто сказала по привычке."
80000071-13 = "Ты специально меня подловил, да?"
80000071-14 = "Угх! Учителя — то есть, ты играешь нечестно, Сенсей!"
80000071-15 = "[s] «Я правда считаю тебя хорошим инструктором, Кокона.»"
80000071-16 = "Х-Хмпф! Ну конечно же!"
80000071-17 = "Но раз ты так сказал, можешь получить шоколад."
80000071-18 = "Я чуть не забыла купить для тебя, но в последний момент вспомнила. Поэтому вот шоколад."
80000071-19 = "Но вспомнила буквально в самый последний момент. Совсем-совсем последний."
80000071-20 = ""
80000071-22 = ""
80000071-24 = "[ns] «Спасибо, Кокона! Но...»"
80000071-25 = "Ч-Что? Думаешь, этот шоколад выглядит иначе, чем остальные?"
80000071-26 = "Нет! Ни за что! Это просто последнее, что я купила, когда брала шоколад студентам! Всё покупала в одном месте!"
80000071-27 = "[s] «Но упаковка не такая аккуратная...»"
80000071-28 = "О чём ты? Не хочешь же ты сказать... что кто-то завернул его вручную?"
80000071-29 = "Глупости! М-Может, продавец просто устал в тот день!"
80000071-30 = "[s] «А-а, конечно. Понятно.»"
80000071-31 = "Что это за всезнающая улыбка?"
80000071-32 = "Прекрати! Ты портишь мне настроение."
80000071-33 = "[s] «Значит, я могу съесть шоколад прямо здесь, да?»"
80000071-34 = "З-Здесь?"
80000071-35 = "Что? Конечно нет! Ни за что!"
80000071-36 = "Не могу поверить, что даже ты настолько не знаешь этикета. Я разочарована!"
80000071-37 = "А...? Если он просто из магазина, его ведь можно есть где угодно?"
80000071-38 = "Ну... да. Наверное, но..."
80000071-39 = "Но нет! Если собираешься его есть, сделай это, когда вернёшься в Шале."
80000071-40 = "И ни с кем не делись! Понял? Понял."
80000071-41 = ""
80000071-43 = ""
80000071-45 = "Кокона сбежала."
80000071-46 = ""
80000071-52 = ""
80000071-53 = "Но внезапно появилась снова так же быстро, как исчезла..."
80000071-54 = "Обещай мне, хорошо?!"
