[translation]
70000020-1 = "Подозрительная встреча 2"
70000020-2 = "И вот встреча по обмену между Офисом Красная Зима и Обществом Пандемониума наконец началась."
70000020-3 = ""
70000020-5 = ""
70000020-6 = "Хи-хи-хи! Явка на перевыборы Общества Пандемониума в этом году была самой низкой за всю историю! Не слишком впечатляйтесь, Великий Вождь."
70000020-8 = ""
70000020-10 = ""
70000020-11 = ""
70000020-14 = ""
70000020-15 = "(Макото сегодня разошлась. Ладно, посмотрим, чем закончится эта борьба за власть.)"
70000020-16 = "Вижу, ты не понимаешь. Позволь просветить тебя."
70000020-17 = "Политика — это охлократия! Следовательно, чем меньше студентов участвует в политике, тем сильнее становимся мы!"
70000020-18 = "Наша явка в 3,8% — символ абсолютной власти Общества Пандемониума!"
70000020-20 = "По-моему, это полная чушь, председатель Макото. Твой подход к власти — дилетантский!"
70000020-21 = "Томоэ, доложи явку на всеобщих выборах Красная Зима!"
70000020-22 = "Явка на последних выборах составила 300%, Великий Вождь."
70000020-24 = "Т-Триста?!"
70000020-25 = "Теперь понимаешь? Чем больше, тем лучше!"
70000020-26 = "С такими жалкими приёмами тебе никогда не превзойти академию Красная Зима!"
70000020-27 = "К-Как такое возможно?! Как мне бороться с такими цифрами?"
70000020-28 = "... *вздох*"
70000020-30 = ""
70000020-32 = ""
70000020-33 = "К-Как они смеют меня недооценивать? Я великая, единственная и неповторимая Макото!"
70000020-34 = "Да-да. Мы уже можем возвращаться?"
70000020-35 = "Ни за что! Я, председатель Общества Пандемониума, не могу поджать хвост и сбежать после такого унижения. Я не позволю себя победить!"
70000020-36 = "...А?"
70000020-37 = ""
70000020-39 = ""
70000020-43 = "Ч-Что это вообще такое...?"
70000020-45 = "Вот. Ты это увидела."
70000020-47 = ""
70000020-49 = ""
70000020-50 = "В-Великий Вождь...!"
70000020-51 = ""
70000020-53 = ""
70000020-56 = ""
70000020-57 = "Это автопортрет. Художник поистине передал устрашающую мощь моей власти."
70000020-58 = "Разве не невероятно? Знаю, восторг и благоговение, поднимающиеся в твоей душе, почти невыносимы."
70000020-59 = "Я-я бы описала это не совсем так..."
70000020-60 = ""
70000020-62 = ""
70000020-63 = "(В какой вселенной это её портрет?! )"
70000020-64 = "(Начать с того, что тут даже пол другой...)"
70000020-65 = ""
70000020-67 = "Н-Ну и ладно! У тебя отвратительный вкус в искусстве!"
70000020-68 = "И ты называешь себя лидером Геенна? С таким убогим пониманием пропаганды?"
70000020-69 = "Я всерьёз переживаю за будущее Геенна."
70000020-70 = "Повтори это мне ещё раз. Только попробуй."
70000020-71 = "Эй-эй. Если мы начнём драться здесь, никто не выиграет."
70000020-72 = "И, президент Черина, пожалуйста, успокойтесь. Ваш подход слишком узколобый."
70000020-74 = "А тебе не стоит так мелочно реагировать на обычный разговор, председатель."
70000020-75 = "Вот видишь, я совершенно не реагирую на то, что ты назвала меня узколобой."
70000020-76 = "Ладно-ладно. Раз уж эта встреча нужна для установления дружеских отношений между нашими школами, позволь вручить тебе подарок."
70000020-77 = "Каков твой девиз, председатель? Расскажи мне о философии своих убеждений."
70000020-79 = ""
70000020-81 = ""
70000020-82 = ""
70000020-83 = "Что ты имеешь в виду? Мой девиз?"
70000020-84 = "Девиз Макото... Наверное, это..."
70000020-85 = "О. Однажды она сказала кое-что после того, как украла пудинг из холодильника."
70000020-87 = ""
70000020-88 = "Пудинг?"
70000020-89 = "Хи-хи-хи. А что с ним? Я его съела."
70000020-90 = "Ты ждала извинений?"
70000020-91 = "Ну, это твоё дело, но..."
70000020-92 = "Ты просто... настолько бесстыжая."
70000020-93 = "Хи-хи-хи. Воспользуюсь случаем и кое-чему тебя научу, Ироха. Самоанализ? Сожаление? Всё это только тянет тебя назад."
70000020-94 = "Председатель Общества Пандемониума никогда не опустится до такого."
70000020-95 = "Я, Макото..."
70000020-96 = "...ни о чём не жалею!"
70000020-97 = "....Ладно. Хорошо. Как скажешь."
70000020-99 = "...Я недооценила тебя."
70000020-100 = "Нет ничего серьёзнее пудинга. Я уважаю твоё бесстрашие — так нагло атаковать наш драгоценнейший ресурс, председатель Макото."
70000020-101 = "Позволь ответить тебе тем же!"
70000020-102 = "Томоэ, призови величайшего мастера во всём Красная Зима!"
70000020-103 = "Да, Великий Вождь!"
70000020-104 = "Я подарю тебе нечто под стать твоему неумолимому девизу!"
70000020-106 = "(Я не понимаю ни одну из них...)"
70000020-108 = "Несколько дней спустя, перед воротами школы Геенна..."
70000020-109 = ""
70000020-112 = ""
70000020-113 = ""
70000020-114 = "...Что это?"
70000020-115 = "Недавно Общество Пандемониума провело встречу по обмену с Красная Зима. Их президент прислала этот... подарок, созданный в честь события."
70000020-116 = "Предполагается, что это председатель Макото... Наверное."
70000020-118 = ""
70000020-121 = "..."
70000020-123 = ""
70000020-128 = "Странная статуя была обращена в пыль выстрелами из Ishbosheth."
70000020-129 = "Путевой журнал Красная Зима"
70000020-132 = ""
70000020-134 = ""
70000020-135 = ""
70000020-137 = ""
70000020-140 = ""
70000020-141 = "Та-дам! Это твой любимый талисман, Ибуки!"
70000020-142 = "Хи-хи! Привет-привет! Ибуки надеется, что пудинг Ибуки цел и невредим!"
70000020-143 = "?!"
70000020-144 = "И-Ибуки... Видишь ли..."
70000020-145 = "Ну... Эм..."
70000020-147 = "Что? Г-Где... Где ПУДИНГ Ибуки?!"
70000020-148 = "Почему Ибуки нельзя его съесть? И-Ибуки сделала что-то плохое? Ибуки была плохой девочкой?"
70000020-149 = "Нет, Ибуки. Плохо поступила не ты."
70000020-150 = "И-Ибуки! Прости! Я не знала, что он твой... и я... Сожаление! Самоанализ! АААА!"
70000020-151 = "Это я плохая! Я тебя обидела! Я столько всего жалею!"
70000020-152 = "*вздыхает*"
