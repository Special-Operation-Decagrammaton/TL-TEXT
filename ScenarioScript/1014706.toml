[translation]
1014706-1 = "Countering Satsuki's Gaze"
1014706-5 = "This beach is so crowded..."
1014706-6 = "It's funny how different the same ocean can feel depending on where you are."
1014706-7 = "[s1] \"It's lively, I suppose—\"\n[s2] \"It really feels like 'The Beach!'\""
1014706-10 = "I suppose so. It's almost a bit too noisy."
1014706-11 = "Actually, I don't really like places with so many people."
1014706-12 = "When there are this many people, you have so much more to worry about, don't you?"
1014706-13 = "The only reason I came here was—"
1014706-14 = "I wanted to observe how my heart reacts in an environment different from the usual."
1014706-15 = "Lately, I've been feeling strange whenever I'm with you, Sensei."
1014706-16 = "Oh, it's not that I dislike it! Quite the opposite, actually."
1014706-17 = "Once we get back, I intend to analyze the reason based on today's data."
1014706-21 = "Ahaha! If you catch me, I'll buy you a juice!"
1014706-26 = "Wait... ah!"
1014706-30 = "[ns] \"Whoa there, that was quite a tumble...!\""
1014706-31 = "Waaaaah! It hurts!"
1014706-36 = "[ns] \"Are you okay? Are you hurt?\""
1014706-38 = "*Sniff*... yeah..."
1014706-39 = "[s] \"It's easy to slip on the sand, so let's walk slowly, okay?\""
1014706-40 = "Okay! Walking slowly!"
1014706-45 = "Walking slowly!"
1014706-53 = "My, you stopped crying quickly. That must have hurt."
1014706-54 = "Still... you're quite good with children, aren't you, Sensei?"
1014706-55 = "[s] \"I am a teacher, after all.\""
1014706-56 = "Hehe. As expected of my collaborator."
1014706-57 = "Anyway, about what I was saying earlier—"
1014706-58 = "H-help me, please!!"
1014706-59 = "Huh...?"
1014706-60 = "[s] \"Is someone drowning!?\""
1014706-64 = "(Pulled the person who was drowning out of the water)"
1014706-67 = "Haa, haa... t-thank you so much..."
1014706-68 = "My leg suddenly cramped up... and my mind just went blank..."
1014706-69 = "[s] \"It might be a good idea to do some thorough warm-up exercises next time.\""
1014706-70 = "Haha... I just saw the ocean and wanted to jump right in! I'm so sorry!"
1014706-71 = "You saved my life. Thank you so much for your help."
1014706-76 = "Hmm... to be able to move so instantly."
1014706-77 = "I wonder if you're just incapable of ignoring someone in trouble."
1014706-78 = "But do be careful. #nWhen rescuing someone from a water accident, the rescuer can get dragged in too, you know."
1014706-79 = "[s3] \"Yeah, thanks.\"\n[s4] \"I'll be careful.\""
1014706-82 = "When there are this many people, these kinds of problems are bound to happen."
1014706-83 = "So then—"
1014706-87 = "Oh? Are you by any chance the Sensei from Schale?"
1014706-88 = "[s] \"Yes, that's me.\""
1014706-89 = "Perfect! If you don't mind, could you help us out for a moment?"
1014706-90 = "There's a bit of a fight breaking out at the beach house, but both of them are so stubborn..."
1014706-91 = "We can't handle it on our own... #nI think they'd listen if it were you, Sensei..."
1014706-92 = "[s] \"Where do I need to go?\""
1014706-96 = "Thank you! Right this way!"
1014706-104 = "(The troubles continued after that, and we were kept busy running around...)"
1014706-107 = "[ns] \"Phew...\""
1014706-110 = "..."
1014706-111 = "[s] \"Sorry, Satsuki... I've been running around this whole time.\""
1014706-112 = "Hmm..."
1014706-113 = "Well, it can't be helped."
1014706-114 = "You're the type who can't overlook an incident, after all."
1014706-115 = "But... having too wide a field of vision can be a problem, you know."
1014706-116 = "Most of the incidents today would have been resolved even without you, wouldn't they?"
1014706-117 = "[s] \"That... might be true.\""
1014706-118 = "So... from now on, no looking away."
1014706-119 = "You only need to look at me, Sensei."
1014706-120 = "That's the safest way, after all."
1014706-121 = "[s] \"I think it's actually more dangerous not to look at your surroundings...\""
1014706-122 = "I'll watch over them for you. That makes you feel at ease, right?"
1014706-123 = "So... just keep your eyes on me, Sensei."
1014706-128 = "Come on, sit here."
1014706-130 = "(A while later...)"
1014706-132 = "..."
1014706-133 = "[s] \"Hey, Satsuki.\""
1014706-134 = "Yes, Sensei?"
1014706-135 = "[s5] \"You've been staring at me this whole time, too...\"\n[s6] \"Doesn't that mean you haven't been looking at anything else?\""
1014706-141 = "Eh? I-is that so?"
1014706-142 = "Am I... really looking at you that much...?"
1014706-143 = "[s] \"Yeah. You have been for a while now...\""
1014706-144 = "..."
1014706-145 = "Y-you noticed, did you!"
1014706-146 = "I was just testing to see if you were actually listening to me."
1014706-150 = "Now, let's pull ourselves together and continue."
1014706-157 = "(Even after that, Satsuki never took her eyes off me.)"
1014706-158 = "(Until we left, she kept looking only at me, looking somewhat happy.)"