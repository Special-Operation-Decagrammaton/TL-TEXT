[translation]
1014706-1 = "План Сацуки по привлечению внимания"
1014706-4 = ""
1014706-5 = "На этом пляже довольно многолюдно."
1014706-6 = "Море то же самое, но здесь столько народу."
1014706-7 = "[s1] «Как здесь оживлённо...»\n[s2] «Сразу видно, популярное место»."
1014706-10 = "Согласна. Здесь куда оживлённее."
1014706-11 = "Если честно, обычно я стараюсь избегать слишком людных мест."
1014706-12 = "Чем больше людей, тем сложнее мне сосредоточиться. Приходится постоянно оценивать растущую опасность. Голова от этого раскалывается."
1014706-13 = "...Тогда почему же я пришла сюда?"
1014706-14 = "Кто знает? Возможно, захотелось сменить обстановку."
1014706-15 = "В последнее время рядом с вами я испытываю какие-то странные чувства."
1014706-16 = "Нет-нет, ничего неприятного или плохого."
1014706-17 = "Я так и не смогла установить точную причину, поэтому намерена выяснить её, задействовав всю мощь разведывательного комитета..."
1014706-20 = ""
1014706-21 = "Ва-ха-ха! Поймаешь меня — получишь сто йен!"
1014706-22 = ""
1014706-24 = ""
1014706-25 = ""
1014706-26 = "Стой... А!"
1014706-27 = ""
1014706-30 = "[ns] «Ох, как сильно они упали...!»"
1014706-31 = "Ва-а! Больно!!"
1014706-32 = ""
1014706-36 = "[ns] «Ты в порядке? Нигде не ушибся?»"
1014706-37 = ""
1014706-38 = "*всхлип* Нет..."
1014706-39 = "[s] «По песку трудно бегать, поэтому не спеши»."
1014706-40 = "Хорошо! Буду ходить помедленнее!"
1014706-41 = ""
1014706-44 = ""
1014706-45 = "Медленно! Медленно!"
1014706-46 = ""
1014706-48 = ""
1014706-49 = ""
1014706-50 = ""
1014706-51 = ""
1014706-52 = ""
1014706-53 = "Хм? Наверное, было больно. Какой храбрый ребёнок."
1014706-54 = "Сенсей, вы удивительно хорошо ладите с детьми."
1014706-55 = "[s] «Всё-таки я учитель»."
1014706-56 = "Фу-фу. Как и следовало ожидать от моего надёжного партнёра!"
1014706-57 = "Так, на чём мы остановились..."
1014706-58 = "П-помогите!!"
1014706-59 = "А...?"
1014706-60 = "[s] «Турист упал в воду?!»"
1014706-64 = "Я вытащил туриста, который барахтался на мелководье."
1014706-66 = ""
1014706-67 = "*тяжёлое дыхание* *тяжёлое дыхание*... С-спасибо... У меня ногу свело судорогой..."
1014706-68 = "Хотя там было мелко, я совсем растерялся..."
1014706-69 = "[s] «Перед купанием нужно как следует размяться»."
1014706-70 = "Да! В следующий раз обязательно! Просто я так обрадовался морю, что сразу бросился в воду, не подумав. Ва-ха-ха!"
1014706-71 = "В любом случае спасибо, что спасли! Без вас бы не выбрался."
1014706-72 = ""
1014706-74 = ""
1014706-75 = ""
1014706-76 = "Вы действовали почти инстинктивно."
1014706-77 = "Помогать другим уже стало для вас второй натурой, не так ли, Сенсей?"
1014706-78 = "Но даже тогда нужно в первую очередь заботиться о собственной безопасности. Тонущий человек в панике может утащить за собой спасателя."
1014706-79 = "[s3] «Это верно...»\n[s4] «Хотя здесь вода всего по пояс...»"
1014706-82 = "Когда вокруг столько людей, нас постоянно что-нибудь отвлекает."
1014706-83 = "В общем..."
1014706-84 = ""
1014706-87 = "О? Сенсей? Из Шале?"
1014706-88 = "[s] «А, это я»."
1014706-89 = "А! Как хорошо! Не могли бы вы нам помочь?"
1014706-90 = "Возле пляжного домика завязалась небольшая ссора, и ни одна сторона не хочет уступать."
1014706-91 = "Нам не удаётся их утихомирить, а вы славитесь умением разрешать споры..."
1014706-92 = "[s] «Только покажите, куда идти»."
1014706-93 = ""
1014706-95 = ""
1014706-96 = "Спасибо! Сюда, пожалуйста!"
1014706-97 = ""
1014706-99 = ""
1014706-101 = ""
1014706-102 = ""
1014706-104 = "После этого мелкие происшествия посыпались одно за другим..."
1014706-107 = "[ns] «Уф...»"
1014706-109 = ""
1014706-110 = "..."
1014706-111 = "[s] «Прости, Сацуки... Нас постоянно отвлекают»."
1014706-112 = "Хм..."
1014706-113 = "Что ж, тут ничего не поделаешь."
1014706-114 = "Просто вы такой человек."
1014706-115 = "Однако вы уделяете слишком много внимания всему вокруг."
1014706-116 = "Большинство сегодняшних происшествий разрешилось бы и без вашего вмешательства."
1014706-117 = "[s] «Тут ты права...»"
1014706-118 = "Поэтому с этого момента сосредоточьтесь на мне."
1014706-119 = "Смотрите только на меня."
1014706-120 = "Так мы сможем защититься от многочисленных опасностей этого места."
1014706-121 = "[s] «Но разве не опаснее перестать следить за тем, что происходит вокруг?»"
1014706-122 = "Нет, если мы будем присматривать друг за другом, верно?"
1014706-123 = "Поэтому вам достаточно смотреть в мою сторону."
1014706-124 = ""
1014706-126 = ""
1014706-127 = ""
1014706-128 = "Ну-ну. Никаких возражений. Идите, садитесь."
1014706-130 = "Некоторое время спустя..."
1014706-132 = "..."
1014706-133 = "[s] «Эм, Сацуки»."
1014706-134 = "Хм? Что такое, Сенсей?"
1014706-135 = "[s5] «Если ты буквально ни на что, кроме меня, не смотришь...»\n[s6] «...ты ведь не сможешь следить за опасностями, верно?»"
1014706-138 = ""
1014706-140 = ""
1014706-141 = "Н-неужели?"
1014706-142 = "Я и не заметила, что ни разу не отвела взгляд..."
1014706-143 = "[s] «Да. С тех самых пор...»"
1014706-144 = "..."
1014706-145 = "Превосходно!"
1014706-146 = "Это была проверка того, как хорошо вы усвоили мои уроки безопасности."
1014706-147 = ""
1014706-149 = ""
1014706-150 = "Ну-ну. Хватит об этом думать. Продолжим."
1014706-151 = ""
1014706-154 = ""
1014706-155 = ""
1014706-157 = "Но Сацуки так ни разу и не посмотрела в другую сторону."
1014706-158 = "До самого конца нашего отдыха она не сводила с меня глаз."
