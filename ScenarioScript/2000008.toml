[translation]
2000008-1 = "Дождь делает меня сентиментальной"
2000008-2 = "42-я библиотека Миллениума"
2000008-3 = ""
2000008-4 = ""
2000008-5 = "О, Сенсей."
2000008-6 = "Пришёл взять книгу?"
2000008-7 = "Что? Интересно, что я здесь делаю?"
2000008-8 = "Хе-хе. Наверняка тебе любопытно, что я читаю."
2000008-9 = "Попробуй угадать!"
2000008-10 = "[s1] «Это точно BL.»\n[s2] «Что-то научное?»\n[s3] «Поэзия?»"
2000008-11 = "Хаха. Нет!"
2000008-12 = "Хаха. Нет!"
2000008-13 = "Хаха. Нет!"
2000008-14 = "Та-да! Вот это."
2000008-15 = "[s] «“Введение в психологию для девушек”?»"
2000008-16 = "Ты не первый, кого это удивляет."
2000008-17 = "Просто... после всего времени, которое мы провели вместе в лаборатории, Сенсей..."
2000008-18 = "...я хочу понимать человеческие эмоции так же хорошо, как понимаю логику."
2000008-19 = "На самом деле физика и психология не могли бы быть дальше друг от друга."
2000008-20 = "Для меня это совершенно новая область."
2000008-21 = "Физика может объяснить, почему от упавшего в воду камня расходятся круги..."
2000008-22 = "...но только психология может исследовать, почему наши слова вызывают такие же круги в чьём-то сердце."
2000008-23 = "У меня нет опыта в таких предметах... поэтому я и решила их изучить."
2000008-24 = "И, может быть... то, что я узнаю, пригодится и тебе, Сенсей!"
2000008-25 = ""
2000008-26 = "Хе-хе. Спасибо. Мне приятно."
2000008-27 = "Хм? Если подумать..."
2000008-28 = "Ты ведь не похож на человека, который пришёл взять книгу, Сенсей."
2000008-29 = "[s] «Идёт дождь, так что я хотел одолжить зонт.»"
2000008-30 = "А, понятно."
2000008-31 = "Тогда тебе повезло. Я создала идеальную вещь именно для такой ситуации..."
2000008-32 = "[s] «Пожалуйста, мне нужен просто обычный зонт.»"
2000008-33 = "Ну вот... У него даже нет функции самоуничтожения..."
2000008-34 = "Но ладно."
2000008-35 = "Мастер Миллениума умеет выполнять и такие заказы."
2000008-36 = "Я изобрела..."
2000008-37 = "...вещь, способную навсегда изменить само понятие зонта."
2000008-38 = "[s] «Мне правда нужен просто обычный зонт.»"
2000008-39 = "Ладно. Похоже, выбора у меня нет."
2000008-40 = "Если тебе нужен самый обычный зонт... у меня есть только мой."
2000008-41 = "..."
2000008-42 = "...Хи-хи."
2000008-43 = "Может, поделимся?"
2000008-44 = "Как раз собиралась идти в Шале."
2000008-45 = "А, погоди. Мне нужна ещё одна книга."
2000008-46 = ""
2000008-48 = ""
2000008-49 = ""
2000008-50 = ""
2000008-51 = "Пойдём, Сенсей."
2000008-54 = "...Наверное, обычный зонт не так уж плох."
