[translation]
34230-1 = "Episódio 23;Kyrie Pelas Garotas (1)"
34230-12 = "Haa... haa..."
34230-13 = "Ugh... dói... tô tão cansada...#nAaah, já tô toda machucada..."
34230-18 = "Mas... eu ainda aguento."
34230-30 = "..."
34230-34 = "Aqui é... a sala do coral?"
34230-38 = "Um órgão e... partituras..."
34230-42 = "Até um gramofone...#n...Ah, faz sentido, né? Arius devia ter as mesmas aulas que a gente."
34230-47 = "...Não funciona, é?#nBom, parece que não é usado há muito tempo, então não tem jeito."
34230-48 = "..."
34230-56 = "Haa..."
34230-57 = "Quando a Koharu-chan se jogou na frente pra me salvar... ela foi tão legal."
34230-58 = "A Koharu-chan parecia uma princesa de conto de fadas.#nE então o Sensei apareceu pra salvá-la... Eu também gosto desse tipo de história."
34230-59 = "Uma princesa em apuros é salva pela pessoa destinada a ela — um conto de fadas assim."
34230-60 = "Infantil, cheio de sonhos... lindo, de fazer o coração bater mais forte..."
34230-61 = "...Eu também queria ter sido a protagonista de uma história assim."
34230-62 = "Mas eu sei — eu não tenho esse direito."
34230-63 = "Porque não existe nenhuma história neste mundo em que a \"bruxa\" tenha um final feliz."
34230-64 = "Saori... eu queria que você sentisse a mesma dor que eu senti.#nEu achava que seria injusto se não fosse assim."
34230-65 = "Mas... é verdade..."
34230-66 = "Assim como eu, vocês também queriam ser salvas, né?"
34230-67 = "Vocês também... só queriam ser felizes, né?"
34230-68 = "Eu também entendo o motivo de você querer salvar a Atsuko..."
34230-69 = "Mesmo alguém como você, que enganou tanta gente e as jogou no desespero...#nSe, no último instante, você pudesse salvar alguém..."
34230-70 = "Só isso já faria toda a sua vida cheia de sofrimento valer a pena...#n...Foi isso que você pensou, não foi?"
34230-71 = "Eu entendo — porque comigo e com a Seia-chan também é assim."
34230-76 = "Por isso... Esquadrão Arius."
34230-80 = "Eu vou rezar por vocês."
34230-81 = "Para que um dia..."
34230-82 = "Um dia, a dor de vocês seja curada —"
34230-83 = "Assim como se anseia por uma chance de recomeçar —"
34230-84 = "Que vocês tenham um futuro... uma nova oportunidade —"
34230-85 = "Por isso, eu..."
34230-86 = "— Eu perdoo vocês."
34230-87 = "Porque esse com certeza é um final muito melhor do que todas nós sermos igualmente infelizes."
34230-97 = "— Mesmo que consigam salvar a Atsuko, o futuro de vocês certamente será cheio de provações."
34230-98 = "Talvez sejam perseguidas pelo resto da vida...#nTalvez tenham uma vida miserável, sem nunca poder andar à luz do dia."
34230-99 = "Mas, ainda assim..."
34230-100 = "Se vocês acreditam que existe nem que seja um único raio de esperança no futuro de vocês —"
34230-101 = "Então, ao salvarem a Atsuko, salvem a si mesmas também."
34230-102 = "Para mim já é tarde demais... mas vocês ainda têm tempo, não têm?"
34230-103 = "Além disso... o Sensei está ajudando, então tenho certeza de que vai dar tudo certo..."
34230-104 = "Que a felicidade acompanhe o caminho de vocês —"
34230-106 = "E que vocês sejam abençoadas —"
34230-111 = "...Hã?"
34230-116 = "Ahaha, não estava quebrado?"
34230-120 = "Esse é... um hino que clama por misericórdia."
34230-121 = "Não é como se eu gostasse dessa música, mas..."
34230-122 = "É, combina bem."
34230-137 = "Aha☆ Por que toda essa pressa?"
34230-138 = "Vocês não vão passar daqui.#nO que há lá na frente é o palco dos protagonistas que lutam pela salvação."
34230-139 = "Não é um lugar permitido para vilãs como nós."
34230-140 = "Vá, Sensei — salve aquelas garotas."
34230-144 = "Porque aqui eu vou segurar as pontas."
34230-153 = "— [i]Kyrie[/i]"
34230-155 = "[i]Eleison[/i]"
34230-168 = "Próximo;Kyrie Pelas Garotas (2)"
