34230-137 = "Куда так спешите, а? Встреча выпускников?"
34230-138 = "К сожалению, дальше я вас не пропущу. Там герои сказки сражаются за своё спасение."
34230-139 = "Злодейкам вроде нас туда нельзя."
34230-140 = "Ладно, Сенсей. Спасите этих детей."
