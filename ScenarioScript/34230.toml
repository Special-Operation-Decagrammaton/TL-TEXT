34230-56 = "*вздыхает*"
34230-57 = "Кохару, разве не круто было, когда Сенсей пришёл тебя спасать?"
34230-58 = "Да, в тот день Кохару была словно принцесса из сказки. Мне нравятся такие истории."
34230-59 = "Истории, где главный герой приходит и спасает отчаявшуюся принцессу."
34230-60 = "Может, немного по-детски, но мне кажется, это прекрасно."
34230-61 = "...Я тоже хотела быть принцессой."
34230-62 = "Ха. Но я никогда не слышала о ведьме, которая превращается в принцессу."
34230-63 = "Это была бы не сказка, если бы злодейка получила счастливый конец."
34230-64 = "...Похоже, я и правда стала злодейкой, да? Прости, Саори. Я действительно думала, что справедливо заставить тебя страдать так же, как страдала я."
34230-65 = "Но если хорошо подумать..."
34230-66 = "Уверена, ты просто хотела, чтобы тебя спасли."
34230-67 = "Ты и правда похожа на меня. Ты тоже хотела найти счастье."
34230-68 = "Саори, я понимаю, почему ты так одержима Ацуко..."
34230-69 = "Даже если пришлось лгать, обманывать и ранить всех вокруг, всё казалось допустимым, если это спасёт твою принцессу."
34230-70 = "Ты думала, что так сможешь хотя бы немного искупить себя. Верно?"
34230-71 = "Я знаю, потому что мы с Сэей думали так же."
34230-72 = ""
34230-75 = ""
34230-76 = "Поэтому я болею за вас, отряд."
34230-77 = ""
34230-79 = ""
34230-80 = "Буду молиться о вашем спасении."
34230-81 = "Так же отчаянно, как сама хочу, чтобы мои страдания закончились..."
34230-82 = "...я надеюсь, что закончатся и ваши."
34230-83 = "Так же как я желаю, молюсь и умоляю о втором шансе."
34230-84 = "Надеюсь, вы получите бесконечное число шансов."
34230-85 = "Я хочу, чтобы меня простили..."
34230-86 = "...поэтому прощаю вас."
34230-87 = "Такая концовка нравится мне больше любой «справедливой»."
34230-91 = ""
34230-93 = ""
34230-95 = ""
34230-97 = "Даже если спасёте Ацуко, ваше будущее будет полно страданий."
34230-98 = "За вами будут гоняться до конца жизни, вы будете скитаться по грязным переулкам, жить в холоде, голоде и нищете."
34230-99 = "Но если несмотря на это..."
34230-100 = "Если несмотря на всё это вы действительно верите, что сможете найти счастье в будущем..."
34230-101 = "Спасите Ацуко. Спасите себя."
34230-102 = "Для меня уже слишком поздно... но почему-то я верю, что у вас получится."
34230-103 = "Сенсей будет рядом с вами. Я уверена."
34230-104 = "Да... Сенсей поможет вам пройти через это."
34230-106 = "Я правда надеюсь, что вы найдёте ответы на свои вопросы."
34230-107 = ""
