[translation]
1600405-1 = "Бесконечная ночь"
1600405-2 = "О, Сенсей! Сюда!"
1600405-3 = "Так рада вас видеть!"
1600405-4 = "Хм..."
1600405-5 = "Надеюсь, я вам не мешаю. Иногда мне неловко, что я так к вам липну..."
1600405-6 = "[s1] «У меня выходной, не волнуйся.»\n[s2] «Иногда прогуливать весело.»"
1600405-7 = "Ох, слава богу! А я уже переживала!"
1600405-8 = "Сенсей! Разве человеку в вашем положении можно такое говорить?!"
1600405-9 = "Ну, неважно."
1600405-10 = "Раз уж вы пришли, я хочу, чтобы вам было весело!"
1600405-11 = "И чтобы вы не переживали: нет, сегодня мы посмотрим не один фильм."
1600405-12 = "Нас ждёт марафон из 21 фильма! Хоть один вам точно понравится!"
1600405-13 = "Хе-хе. Вы удивлены. Хотите спросить, как мы посмотрим 21 фильм всего с двумя билетами?"
1600405-14 = "Это не обычные билеты в кино..."
1600405-15 = ""
1600405-16 = "Барабанная дробь... Это марафонские абонементы! Та-дам!"
1600405-17 = "[s] «Марафонские абонементы? Такое вообще бывает?»"
1600405-18 = "Я знала, что вы удивитесь. Бывают мероприятия, где один за другим показывают кучу фильмов."
1600405-19 = "Отличный способ для любителей кино посмотреть сразу много фильмов одного жанра!"
1600405-20 = "И само собой, весь наш марафон состоит из гангстерских фильмов и нуара!"
1600405-21 = "Быстрее! Времени нет! Нужно успеть на первый фильм! Пойдём!"
1600405-23 = "Пина схватила меня за руку и потащила в кинотеатр."
1600405-24 = "(К удивлению, первый фильм оказался неплох. Все жестокие сцены были смонтированы со вкусом.)"
1600405-25 = "(До шедевра ему было далеко, но зрителей он развлекал вполне достойно.)"
1600405-27 = "Ого. Это было..."
1600405-28 = "...потрясающее кино! Босс — то есть, Сенсей! Эм, то есть, Босс..."
1600405-29 = "Н-нет, Сенсей. Правильно? Сенсей... Простите."
1600405-30 = "Ну как? Вам понравилось?"
1600405-31 = "[s] «Знаешь что? Отныне можешь называть меня Боссом»."
1600405-32 = "...!"
1600405-33 = "П-правда?! Вы серьёзно, Босс?!"
1600405-34 = "Хорошо! Как скажете, Босс! Тогда сразу на следующий фильм!"
1600405-35 = "Второй фильм называется «Кулак верного кота»!"
1600405-37 = "(Все последующие фильмы тоже оказались невероятными.)"
1600405-38 = "(Каждый был по-своему суровым: где-то лиричным, где-то страстным.)"
1600405-39 = "(...)"
1600405-40 = "(Но...)"
1600405-42 = "Ого! Это было потрясающе, Сэн— то есть, Босс!"
1600405-43 = "Тогда смотрим следующий фильм!"
1600405-45 = "(Неважно, насколько хороши фильмы. Когда подряд смотришь 21 картину одного жанра...)"
1600405-46 = "(...а рядом кто-то без остановки тараторит тебе в ухо и всё время не даёт уснуть...)"
1600405-48 = "*ах* Вот этот я ждала больше всего! Следующий фильм...!"
1600405-50 = "(...большинство людей...)"
1600405-52 = "Не может быть!"
1600405-54 = "(...назвали бы это пыткой.)"
1600405-56 = "Просто."
1600405-57 = ""
1600405-58 = "Потрясающе."
1600405-59 = ""
1600405-60 = "Согласны?"
1600405-62 = "(Похоже, на двадцать первом и последнем фильме я всё-таки отключился.)"
1600405-63 = "Когда я пришёл в себя, то лежал на траве у реки возле кинотеатра."
1600405-65 = "..."
1600405-66 = "С-Сенсей...? Вы в порядке?"
1600405-67 = "[s3] «Где я? Кто я?»\n[s4] «Это... реальный мир?»"
1600405-68 = "О-о нет!"
1600405-69 = "О-о нет!"
1600405-70 = "Сенсей! Не отключайтесь! Простите меня!"
1600405-71 = "*хнык* Простите... Я боялась, что так случится."
1600405-72 = "Я привыкла смотреть гангстерские фильмы днями напролёт... и даже не подумала, насколько тяжело будет вам."
1600405-73 = "Это всё моя вина. Пожалуйста, простите."
1600405-74 = "Я больше никогда не буду просить вас смотреть со мной фильмы..."
1600405-75 = "*шмыг* *всхлип*"
1600405-76 = "[s5] «Всё хорошо. Не переживай.»\n[s6] «А как же „Босс“?»"
1600405-77 = "...?"
1600405-78 = "...?"
1600405-79 = "А? Вы уверены?"
1600405-80 = "Разве мне не стоит за вас переживать?"
1600405-81 = "Вы не потеряли сознание... Вы просто уснули?"
1600405-82 = "Странно... Я была уверена, что вы совсем отключились."
1600405-83 = "Простите?"
1600405-84 = "Не... перечить? Конечно нет! Я никогда не стану вам перечить, Босс!"
1600405-85 = "Всё, что вы говорите, — правда. Значит, вы просто уснули! Это я ошиблась!"
1600405-86 = "И всё же я-я..."
1600405-87 = "..."
1600405-88 = "Хи-хи."
1600405-89 = "Ва-ха-ха-ха! А-а-а!"
1600405-90 = "Ха-ха! Я плачу. Я правда плачу! Ха-ха-ха!"
1600405-91 = "Ха-ха... ха... Боже мой!"
1600405-92 = "..."
1600405-93 = "Спасибо, Сенсей. Вы всегда так добры ко мне."
1600405-94 = "Несмотря на то, сколько всего вам приходится из-за меня терпеть... Я даже не знаю, как отплатить."
1600405-95 = "Трудно объяснить, но гангстерский дух, который я чувствую в вас, отличается от моего. Он очень тёплый и мягкий..."
1600405-96 = "В вас есть что-то особенное — рядом с вами спокойно и хочется доверять."
1600405-97 = "Вот какую справедливость я чувствую в вас... а я никогда не лгу."
1600405-98 = "Хи-хи."
1600405-100 = "(После этого мы с Пиной долго обсуждали фильмы, которые посмотрели за день.)"
1600405-101 = "(И ещё пообещали, что в следующий раз пойдём вместе на один фильм, а не на марафон.)"
