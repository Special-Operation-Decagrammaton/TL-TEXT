[translation]
90100090-1 = "Эпизод 9;В погоне за иллюзиями"
90100090-3 = "Подвал Шале, оперативный штаб отряда FOX"
90100090-4 = "[ns1] «Все в порядке?!»\n[ns2] «Я слышал, на вас напал Лор...!»"
90100090-7 = ""
90100090-8 = "Нннгх..."
90100090-9 = "*глоть*"
90100090-10 = "...Прошу прощения, Сенсей."
90100090-11 = "Отряд FOX вернулся примерно 90 минут назад."
90100090-12 = "[s3] «А... Вы ели.»\n[s4] «Мне зайти позже?»"
90100090-15 = "Нет, вовсе нет. Скорее, мне самой нужно извиниться за беспорядок."
90100090-16 = "А, Сенсей! Как раз вовремя."
90100090-17 = "Не хотите поесть с нами?"
90100090-18 = "[s] «Спасибо за предложение, но я уже поужинал.»"
90100090-19 = ""
90100090-22 = "[ns] «О, это жареные мешочки из тофу...?»"
90100090-23 = "Ага. Их приготовила Нико. Кстати, жареный тофу мы принесли сами. Мы не грабили холодильник в комнате отдыха."
90100090-24 = "На одном из заданий я познакомилась с мастером, который жарит тофу. Иногда мы получаем от него качественный жареный тофу, и тогда я готовлю такие блюда."
90100090-25 = "Даже я признаю, что Нико умеет обращаться с тофу."
90100090-26 = "Хмм... Это гриб? Мне нравится, как его вкус пропитал мешочек."
90100090-27 = "Правда? А мне кажется, будто я ем одни бобы..."
90100090-28 = "Вы же меня не травите дедовщиной, да?!"
90100090-29 = "Хватит жаловаться и ешь. Надо изгнать призрака, который прицепился к тебе на прошлой миссии."
90100090-30 = "Прочь, духи! Добро пожаловать, удача!"
90100090-31 = "...Разве духов прогоняют не ЖАРЕНЫМИ бобами? А не варёными?"
90100090-32 = "Может, съешь свой мешочек с тофу и успокоишься?"
90100090-33 = "[s] «Вы упомянули призраков?»"
90100090-34 = "Это долгая история..."
90100090-36 = "...Поэтому я считаю, что неопознанное присутствие, повлиявшее на FOX 4, и есть то белое пугало, которое видели пострадавшие. Они называли его кунэ-кунэ."
90100090-37 = ""
90100090-39 = ""
90100090-40 = ""
90100090-41 = "[ns] «Ты в порядке? Хорошо себя чувствуешь?»"
90100090-42 = "Да, всё нормально. Когда вернулась, прошла осмотр. Сказали, что со мной всё в порядке."
90100090-43 = "Если уж на то пошло, затылок сильнее болит от удара Куруми. Кажется, там даже шишка..."
90100090-44 = "Какая неблагодарность! Если бы я не вмешалась, тебе конец был бы!"
90100090-45 = "Слушай. Я благодарна, что не стала жертвой..."
90100090-46 = "...Но воздействие на тебя всё равно было. Ты не помнишь огромный кусок произошедшего — ни поле, ни то, как выглядел кунэ-кунэ."
90100090-47 = "Нагрудная камера была включена. Мы можем посмотреть запись."
90100090-48 = ""
90100090-52 = "«...Может, это мираж... На карте его точно не было, но я вижу поле прямо за улицей.»"
90100090-53 = "«Посреди заросшей травы стоит потрёпанное пугало, а рядом человек в белой одежде с жуткой улыбкой...»"
90100090-54 = ""
90100090-55 = "...Уф. Это правда МОЙ голос? Ненавижу слушать себя в записи."
90100090-56 = "Да. Это ты. Смирись."
90100090-57 = "Ты упомянула поле. Но мы все знаем, что возле станции Широ Унаги никакой зелени нет."
90100090-58 = "А может, это был мираж? Ну, знаете, когда людям вдали мерещится водоём, которого там нет?"
90100090-59 = "Нет. Такое бывает только на плоской открытой местности... например, в Абидосе. Марево заставляет людей думать, что они видят воду."
90100090-60 = "Точка Ромео находится в Деловом районе 3. Поскольку обзор перекрыт зданиями, странной оптической иллюзии там быть не должно."
90100090-61 = "...Марево, открывающее новые, потусторонние места..."
90100090-62 = "Думаю, очевидно, что здесь простым объяснением не обойтись. Это настоящий Лор."
90100090-63 = "[s5] «Нельзя продолжать так безрассудно.»\n[s6] «Юкино. Позволь Шале заняться этим, а ты—»"
90100090-66 = "...Мы спецназ. Наша обязанность — понимать, когда нужно отступить из заведомо проигрышного боя. Но сейчас не тот случай."
90100090-67 = "Кролики могут вести себя иначе, но лисы сочетают любопытство с осторожностью."
90100090-68 = "Игнорировать новую зацепку против моей природы."
90100090-69 = "[s] «...Новую зацепку?»"
90100090-70 = "Сенсей, пожалуйста, взгляните на это."
90100090-71 = "Это гильза, выброшенная после того, как FOX 4 вчера нажала на спуск."
90100090-72 = "Очевидно, она выстрелила. Пуля полетела в сторону цели, но никаких следов попадания на земле мы не нашли."
90100090-73 = "Скорее всего, она исчезла вместе с иллюзией."
90100090-74 = "Пули пятидесятого калибра, особенно выпущенные из крупнокалиберной снайперской винтовки, несут огромную физическую энергию. Я к тому, что если пуля попала в цель и исчезла вместе с ней..."
90100090-75 = "...значит, это не иллюзия. У неё есть физическая форма. А значит, мы можем её уничтожить."
90100090-76 = ""
90100090-78 = ""
90100090-79 = "Прежде чем передавать эту миссию другому подразделению, прошу разрешить отряду FOX провести ещё одну разведывательную операцию."
90100090-80 = ""
90100090-83 = "[ns7] «...Ладно. Только ещё один раз.»\n[ns8] «И я пойду с вами.»"
90100090-86 = "Благодарю за согласие."
90100090-87 = "Вот это другое дело! Она права — если у них есть физическое тело, значит, мы можем их расстрелять, взорвать и прикончить."
90100090-88 = "Это начинает подозрительно напоминать старые времена..."
90100090-90 = ""
90100090-91 = "Так куда идём? Снова в точку Ромео?"
90100090-92 = "Согласна, точка Ромео подошла бы лучше всего, если мы хотим воспроизвести ситуацию..."
90100090-93 = "...Мы надеемся на столкновение. Нам нужно место получше."
90100090-94 = "Почему?"
90100090-95 = "Представь вот что. Если мы начнём издалека стрелять по врагу, которого больше никто не видит, гражданские запаникуют."
90100090-96 = "Кроме того, в деловом районе слишком велик риск случайных жертв."
90100090-97 = "Да, верно. Нам ни к чему, чтобы кто-нибудь вызвал Валькирию, пока мы сражаемся с кунэ-кунэ."
90100090-98 = "...Это было бы крайне некстати."
90100090-99 = "[s9] «Если нужна помощь с общественным мнением, оставьте это мне.»\n[s10] «Я возьму ответственность за всё...»"
90100090-102 = "Отказано. Мы сменим место."
90100090-103 = "Какой бы ни была миссия, мы обязаны свести вред гражданским к минимуму."
90100090-104 = "Если кто-нибудь попадёт под перекрёстный огонь... это будет на нашей совести."
90100090-105 = "Кроме того, нас ещё официально не помиловали."
90100090-106 = "Если вы вмешаетесь, Сенсей, президент Генерального студенческого совета окажется в затруднительном положении."
90100090-107 = "[s] «Раз ты так говоришь, Юкино...»"
90100090-108 = "Для начала посмотрим, сможем ли мы наблюдать марево в контролируемом замкнутом пространстве."
90100090-109 = "Нужно найти уединённое место. Нам понадобится сильный поток воздуха и перепад температур."
90100090-110 = "Поняла. Проверю карту."
90100090-111 = "А, и меня беспокоит ещё кое-что."
90100090-112 = "Как нам к этому подступиться? Теперь, когда мы все знаем о кунэ-кунэ, обычный метод не сработает."
90100090-113 = "Наш обычный метод...?"
90100090-114 = "Кунэ-кунэ ввёл Отоги в транс просто потому, что она посмотрела на него. Она перестала нас слышать."
90100090-115 = "Какой бы хаотичной ни стала битва, мы не сможем действовать сообща, если не сможем общаться. А если понадобится отступить?"
90100090-116 = "А если разбиться на пары? Один наблюдает, второй нажимает на спуск?"
90100090-117 = "Отказано. Мы исходим из уже провалившегося сценария. Мы не хотим, чтобы ВООБЩЕ КТО-ЛИБО попал под влияние кунэ-кунэ."
90100090-118 = "В худшем случае из строя выйдут все четверо."
90100090-119 = "А защитные очки?"
90100090-120 = "Могут помочь. Но Отоги смотрела через прицел, а не невооружённым глазом, и всё равно подверглась воздействию."
90100090-121 = "Стекла или зеркал может быть недостаточно."
90100090-122 = "Проблема. Как нам сражаться с тем, на что нельзя смотреть?"
90100090-123 = "Похоже, пора звать экстрасенса? Может, местного медиума?"
90100090-124 = ""
90100090-126 = ""
90100090-127 = ""
90100090-128 = ""
90100090-129 = "А. То есть нам нужно видеть врага, не глядя на него напрямую, верно?"
90100090-130 = "А если использовать... вот это?"
90100090-131 = "..."
90100090-133 = "...Думаете, это правда сработает?"
90100090-135 = "Следующий эпизод;Во тьму"
