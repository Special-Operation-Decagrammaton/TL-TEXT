[translation]
90100090-1 = "Episódio 9;Pistas"
90100090-3 = "Subsolo de Schale · QG de Operações do Esquadrão FOX"
90100090-4 = "[ns1] \"Vocês estão bem?!\"\n[ns2] \"Fiquei sabendo que foram atacadas por uma anomalia... ninguém se feriu?\""
90100090-7 = ""
90100090-8 = "*Glup*...?!"
90100090-9 = "(Engole a seco)"
90100090-10 = "...Peço perdão pela falta de compostura."
90100090-11 = "O Esquadrão FOX retornou há cerca de uma hora e meia."
90100090-12 = "[s3] \"Ah, vocês estavam jantando.\"\n[s4] \"Desculpa atrapalhar, querem que eu volte depois...?\""
90100090-15 = "Não se preocupe. Lamento termos sido pegas desprevenidas..."
90100090-16 = "Já que está aqui..."
90100090-17 = "Não gostaria de se juntar a nós para uma refeição, Sensei?"
90100090-18 = "[s] \"Agradeço o convite, mas já jantei lá em cima.\""
90100090-19 = ""
90100090-22 = "[ns] \"Isso aí é... trouxinha de tofu frito?\""
90100090-23 = "Sim, a Niko que fez. Ah, e trouxemos o tofu de fora, tá? #nNão mexemos em nada na geladeira da sala de descanso de Schale, pode ficar tranquilo."
90100090-24 = "Conheci o dono de uma fábrica artesanal de tofu durante uma operação passada. #nEle costuma nos enviar produtos frescos regularmente, então aproveito para preparar isso de vez em quando."
90100090-25 = "Mas sério, modéstia à parte, os pratos de tofu frito da Niko são uma delícia sem tamanho."
90100090-26 = "Hummm... esse recheio é de cogumelo? O caldinho saindo da massa de tofu tá um espetáculo~"
90100090-27 = "Ei... tô reparando desde o começo... #npor que na minha trouxinha só tem feijão de soja puro?"
90100090-28 = "Isso é trote de calouro? Eu fiz alguma coisa de errado...?"
90100090-29 = "Engole o choro e come calada."
90100090-30 = "Não dizem que grãos de soja afastam os maus espíritos e atraem a sorte?"
90100090-31 = "Soja de Setsubun é pra expulsar demônio, não tem nada a ver com o que aconteceu!"
90100090-32 = "Bom, não posso negar que o gosto tá ótimo, pelo menos."
90100090-33 = "[s] \"O que aconteceu lá fora?\""
90100090-34 = "A explicação é um tanto extensa, mas..."
90100090-36 = "...E sendo assim, concluímos que a entidade branca desconhecida que afetou a FOX4 é a mesmíssima coisa que o espantalho branco — popularmente conhecido como \"Kunekune\"."
90100090-37 = ""
90100090-39 = ""
90100090-40 = ""
90100090-41 = "[ns] \"Você tá se sentindo bem? Nada de estranho?\""
90100090-42 = "Tô zerada, zerada. Fizemos os testes físicos assim que voltamos e não deu nenhuma sequela."
90100090-43 = "Na real, o que dói mais é o galo na cabeça que a Kurumi me deu. Acho que vai ficar roxo..."
90100090-44 = "Olha a ingrata! #nSe eu tivesse demorado dois segundos a mais, você ia estar babando no chão até agora, sabia?!"
90100090-45 = "Não ter terminado que nem as outras vítimas foi pura sorte, isso sim..."
90100090-46 = "Só que quando acordei, deu um apagão total na memória. #nNão lembro da cara do Kunekune e nem pra qual lado ficava o tal \"gramado azul\"..."
90100090-47 = "Felizmente, a câmera tática corporal da FOX3 registrou o áudio da conversa na íntegra."
90100090-48 = ""
90100090-52 = "Ali, do outro lado da pista. Dá pra ver um descampado sob o céu azul. #nNão tem nada disso no mapa... é miragem?"
90100090-53 = "A relva tá alta... tem um espantalho... e lá atrás, uma pessoa de branco rindo—"
90100090-54 = ""
90100090-55 = "...Gente, minha voz é fina desse jeito mesmo? Toda vez que escuto gravação minha, dá uma vergonha alheia."
90100090-56 = "Sua voz sempre foi assim, relaxa."
90100090-57 = "Mas é muito bizarro. Não existe descampado florido nenhum perto da Estação Shirounagi."
90100090-58 = "Deve ter sido miragem. Quando o ar esquenta demais, ele reflete coisas de muito longe."
90100090-59 = "Fenômenos assim só acontecem no Grande Deserto de Abydos, onde não tem nada bloqueando o horizonte."
90100090-60 = "O Ponto Romeo, no 3º Distrito Comercial, é cercado de arranha-céus por todos os lados. #nPor mais que a luz entortasse, jamais conseguiria projetar uma paisagem rural."
90100090-61 = "Uma miragem que mostra um lugar que não deveria estar ali..."
90100090-62 = "Em suma, ficou provado que nosso alvo é uma anomalia além da compreensão racional: uma [ruby=Lore]Lenda Urbana[/ruby]."
90100090-63 = "[s5] \"Avançar às cegas além disso é perigoso demais.\"\n[s6] \"Deixem esse caso sob responsabilidade de Schale—\""
90100090-66 = "Recuar quando a segurança não pode ser garantida é uma virtude de qualquer tropa de elite."
90100090-67 = "No entanto, diferente dos \"coelhos\", as \"raposas\" não são apenas cautelosas — são também animais extremamente curiosos."
90100090-68 = "Dar as costas tendo uma pista tão valiosa diante dos nossos olhos... vai contra a nossa própria natureza."
90100090-69 = "[s] \"...Uma nova pista?\""
90100090-70 = "Poderia dar uma olhada nisso, por favor?"
90100090-71 = "Este é o estojo de munição ejetado quando a FOX4 disparou em meio ao transe da miragem."
90100090-72 = "Se a cápsula foi ejetada, significa que o projétil viajou. #nNo entanto, nenhuma marca de impacto foi achada em lugar nenhum."
90100090-73 = "Provavelmente sumiu junto com a anomalia."
90100090-74 = "Um tiro antimaterial de calibre .50 carrega uma energia cinética colossal. #nPara o bem ou para o mal, o fato de ter interagido com a entidade indica que..."
90100090-75 = "O alvo não é mera ilusão imaterial. Ele é um \"alvo físico\" tangível que pode ser atingido."
90100090-76 = ""
90100090-78 = ""
90100090-79 = "Sensei. Antes de repassar esse caso para outra unidade, #npermita-nos realizar um último reconhecimento armado #npara neutralizar a ameaça e evitar mais vítimas civis."
90100090-80 = ""
90100090-83 = "[ns7] \"...Tudo bem. Mas esta será a última investida.\"\n[ns8] \"E eu irei junto com vocês na operação.\""
90100090-86 = "Muito obrigada pela autorização, Sensei."
90100090-87 = "Saber que o alvo é de carne e osso — ou algo sólido — dá um alívio enorme. #nSe tem forma física, basta encher de chumbo grosso e explosivo que alguma reação vai ter."
90100090-88 = "Parece até que estamos revivendo certos confrontos traumáticos com as nossas calouras..."
90100090-90 = ""
90100090-91 = "E onde vai ser a emboscada? No Ponto Romeo de novo?"
90100090-92 = "Para reproduzir as mesmas condições, aquele seria o ponto ideal, mas..."
90100090-93 = "Se prevemos tiroteio pesado, sugiro mudarmos de setor."
90100090-94 = "Por quê?"
90100090-95 = "Pensa bem. Se a gente abrir fogo no meio de uma praça aberta contra um \"inimigo invisível\", #nos civis vão achar que enlouquecemos de vez."
90100090-96 = "Sem contar que o distrito comercial ferve de pedestres de dia. Um ricochete poderia causar um desastre."
90100090-97 = "Apoiado. #nTer que encarar as alunas de Valkyrie no segundo round depois de liquidar o Kunekune seria pedir pra se dar mal."
90100090-98 = "...Isso seria bastante problemático."
90100090-99 = "[s9] \"Deixem que eu convenço a população.\"\n[s10] \"Eu assumo a responsabilidade por qualquer repercussão—\""
90100090-102 = "Não. Nós mudaremos o local."
90100090-103 = "Mesmo em missão de emergência, minimizar danos a civis é dever inegociável."
90100090-104 = "Se colocarmos civis em risco durante a ação... a culpa recairá unicamente sobre nós."
90100090-105 = "Sobretudo porque ainda estamos em liberdade condicional provisória."
90100090-106 = "Se o Sensei tiver que intervir publicamente para nos defender, a posição política da Presidente ficará ainda mais delicada."
90100090-107 = "[s] \"...Compreendo.\""
90100090-108 = "Selecionaremos o perímetro tendo como primeiro requisito a formação de miragem térmica."
90100090-109 = "Além disso, deve ser um local com fluxo nulo de pedestres e com diferencial de temperatura acentuado no ar."
90100090-110 = "Entendido. Vou rastrear locais compatíveis no mapa tático."
90100090-111 = "E tem mais um ponto que tá me martelando a cabeça..."
90100090-112 = "Tem como executar uma \"operação tática padrão\" quando olhar pro Kunekune já faz a gente perder o juízo?"
90100090-113 = "Como assim...?"
90100090-114 = "Na última vez, assim que a Otogi avistou a criatura, perdeu totalmente a capacidade de se comunicar, lembra?"
90100090-115 = "Se a operadora entrar em pane com [ruby=NORDO]perda total de rádio[/ruby] e ignorar ordens de recuo, não há combate sustentável."
90100090-116 = "E se operarmos em duplas? Uma faz a mira de olhos fechados e a outra dá as coordenadas?"
90100090-117 = "Inviável. Não podemos montar um plano baseado no pressuposto de que alguém será possuído."
90100090-118 = "Num piscar de olhos as quatro poderiam ser neutralizadas ao mesmo tempo."
90100090-119 = "E se usarmos óculos de proteção balística?"
90100090-120 = "Duvido que adiante. A Otogi foi afetada mesmo olhando pela lente da mira telescópica."
90100090-121 = "Interpor apenas um pedaço de vidro ou espelho não vai bloquear o efeito cognitivo."
90100090-122 = "Que osso duro de roer..."
90100090-123 = "Será que vamos ter que contratar uma médium exorcista pra resolver isso?"
90100090-124 = ""
90100090-126 = ""
90100090-127 = ""
90100090-128 = ""
90100090-129 = "Peraí... o objetivo não é enxergar a silhueta dele sem olhar diretamente pra luz dele?"
90100090-130 = "Se for isso... que tal usarmos isto aqui?"
90100090-131 = "............"
90100090-133 = "...Você tem certeza de que isso vai funcionar?"
90100090-135 = "A Seguir;Adentrando as Trevas"
