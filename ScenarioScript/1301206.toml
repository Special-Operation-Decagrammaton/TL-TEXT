[translation]
1301206-1 = "Детский сад идёт в город"
1301206-2 = "Вход в Полицейскую школу"
1301206-4 = "Здравствуйте, дети! Добро пожаловать в Полицейскую школу «Валькирия»!"
1301206-5 = "Я Кирино из Бюро общественной безопасности, и сегодня буду вашим экскурсоводом."
1301206-6 = "А почему ты не из Бюро безопасности или Следственного бюро?"
1301206-7 = "Я хотела послушать кучу историй про арест страшных преступников..."
1301206-8 = "Глупышка. Студенты Бюро безопасности и Следственного бюро заняты. Конечно, к нам отправили кого-то из общественной безопасности. Им всё равно нечем заняться."
1301206-9 = "Н-Неправда! Да, мы не так заняты, как Бюро безопасности, но у Бюро общественной безопасности тоже дел по горло!"
1301206-10 = "Мы ищем владельцев потерянных вещей и регулярно патрулируем центр города, чтобы выявлять опасные объекты!"
1301206-11 = "Чего? Какая скукотища."
1301206-12 = "Кому вообще есть дело до вашей мелкой работы?"
1301206-13 = "Н-Но... Ну, дело в том..."
1301206-14 = "[s1] «Не позволяй им смутить тебя, Кирино.»\n[s2] «Следуй инструкции и начинай экскурсию.»"
1301206-15 = ""
1301206-16 = ""
1301206-17 = "В-Верно! Все за мной!"
1301206-18 = "Я проведу вас по зданиям и расскажу историю Полицейской школы «Валькирия»!"
1301206-20 = "Это общежитие, где живут кадеты!"
1301206-21 = "Большинство студентов «Валькирии» живёт в школьных общежитиях, чтобы быстро реагировать на любые происшествия."
1301206-22 = "У входа находится памятный камень, на котором высечены наставления первого президента школы. Входя в здание, студенты вспоминают о своей ответственности как сотрудников полиции и получают возможность задуматься о себе."
1301206-23 = "«Долг полиции — прежде всего думать о безопасности граждан и относиться к своим товарищам с сердцем слуги.»"
1301206-24 = "Бу-у... Скукота!"
1301206-25 = "И что такого важного в этой скучной лекции?"
1301206-26 = "Мы хотим знать, как круто выглядеть, когда валишь плохих парней!"
1301206-27 = "Н-Но понимать обязанности полиции очень важно."
1301206-28 = "Полицейские, которым плевать на безопасность граждан, ничем не лучше преступников, которых они останавливают!"
1301206-29 = "Да-да, понятно. А теперь расскажи истории про страшных преступников!"
1301206-30 = "Ты когда-нибудь стреляла из оружия на месте преступления?"
1301206-31 = "Дай угадаю. Тебе даже стрелять не разрешают, потому что ты из Бюро общественной безопасности, да?"
1301206-32 = "Э-Это совсем не так! Стрельба — базовый навык, которым обязаны владеть все студенты «Валькирии» независимо от отдела!"
1301206-33 = "И так уж вышло, что недавно я как раз разрешила ситуацию с заложником при помощи своего оружия! Ха-ха-ха..."
1301206-34 = "[s3] «...»\n[s4] «Да неужели?»"
1301206-35 = ""
1301206-36 = "(Н-Не смотрите на меня так! Дети что-нибудь заподозрят!)"
1301206-37 = ""
1301206-38 = "(Н-Не говорите так неубедительно! Дети что-нибудь заподозрят!)"
1301206-39 = "Ты стреляла во время захвата заложника? Тебе не было страшно преступника?"
1301206-40 = "Ну, конечно, было страшно, но ведь у него был заложник..."
1301206-41 = "Я всегда думала, что Бюро общественной безопасности занимается только скукотищей, но это так круто!"
1301206-42 = "(Технически я не соврала, но всё равно чувствую, будто обманываю этих невинных детей.)"
1301206-43 = "(По крайней мере, теперь я завладела их вниманием. Дальше экскурсия должна пройти гораздо спокойнее.)"
1301206-44 = "А что это за бутылочка у тебя на поясе? Ещё одно оружие?"
1301206-45 = "А, это? Дымовая граната. Она не такая мощная, как обычная, зато полезна при освобождении заложников: дым перекрывает преступнику обзор."
1301206-46 = "Вообще-то она сыграла важную роль в деле с заложниками, которое произошло в прошлом месяце в городе Шиба!"
1301206-47 = "Это когда те тяжеловооружённые школьницы ворвались в магазин пудингов?"
1301206-48 = "Ого! Так ты тоже там была?!"
1301206-49 = "Круто! Обалдеть!"
1301206-50 = "А-ха-ха..."
1301206-51 = "(Если честно, моя дымовая граната тогда скорее всё усложнила...)"
1301206-52 = "А что это за резинки у тебя?"
1301206-53 = "Это не резинки — это наручники. Я использую их, чтобы арестовывать преступников, застёгивая на их запястьях."
1301206-54 = "Без ключа из них не выбраться, поэтому обращаться с ними нужно очень осторожно."
1301206-55 = "Правда? Выглядят так, будто развалятся, если просто дёрнуть..."
1301206-56 = "Ничего подобного. Внутри спрятан механизм, из-за которого их невозможно ослабить руками!"
1301206-57 = "Почему бы мне не показать на примере?"
1301206-58 = "Сначала ограничиваем движения преступника, обездвиживаем его и застёгиваем одно запястье..."
1301206-59 = ""
1301206-61 = "...затем обводим второй конец наручников вокруг прочной конструкции и застёгиваем вторую руку."
1301206-62 = ""
1301206-64 = "Та-дам! Преступник задержан!"
1301206-65 = ""
1301206-67 = ""
1301206-70 = "Как видите, после задержания сбежать уже невозможно."
1301206-71 = "Ого, круто!"
1301206-72 = "Я впервые вижу, как кто-то пользуется наручниками!"
1301206-73 = "Ха-ха. Рада, что вам понравилось."
1301206-74 = "А теперь пора открыть наручники ключом..."
1301206-75 = "Ч-что за...?"
1301206-76 = ""
1301206-80 = ""
1301206-81 = "(Р-Рука соскользнула, и я уронила ключ от наручников!)"
1301206-82 = "(И, словно этого мало, он укатился в канализацию!)"
1301206-83 = "Эй, что случилось? Какая-то проблема?"
1301206-84 = "Эм. Ну, вообще-то..."
1301206-87 = "― (Ч-Что же мне делать...?)[wa:810]"
1301206-89 = "― (Ннгх, хмпф! Они...не снимаются?!)[wa:2170]"
1301206-92 = "[ns] «Только не говори, что ты потеряла ключ.»"
1301206-93 = "― А-А? Нет-нет![wa:920]"
1301206-95 = "― Такой образцовый офицер, как я, никогда не потеряет ключ![wa:1870]"
1301206-98 = "― Это просто, эм...[wa:960]"
1301206-100 = "― Это демонстрация тренировки по освобождению![wa:10]"
1301206-103 = "― На случай, если вас когда-нибудь по ошибке закуют в наручники.[wa:10]"
1301206-105 = "― Я лично покажу вам, как выбраться![wa:420]"
1301206-108 = "[ns] «Разве такую информацию можно раскрывать гражданским?»"
1301206-109 = "― Не беспокойтесь! Я обученный сотрудник полиции![wa:1370]"
1301206-111 = "― Для меня это пустяк![wa:10]"
1301206-114 = "― Гххххх! А-а-а-а! *вздох*[wa:1550]"
1301206-117 = "― За что мне всё это...?[wa:10]"
1301206-119 = "― Пожалуйста... спасите меня, Сенсей...[wa:680]"
1301206-122 = "Кирино оставалась закованной в наручники, пока не пришёл другой студент «Валькирии» и не помог ей."
1301206-124 = ""
1301206-125 = ""
1301206-126 = ""
1301206-127 = "*вздох* Сегодняшняя экскурсия полностью провалилась..."
1301206-128 = "Половину дня я просидела в наручниках, словно какой-то жалкий преступник, вместо того чтобы показать детям, какой крутой может быть полиция."
1301206-129 = "Какой ребёнок после такого вообще станет смотреть на полицейских как на пример для подражания?"
1301206-130 = "[s5] «Всё будет хорошо.»\n[s6] «Ты сделала всё, что могла, Кирино.»"
1301206-131 = "Но..."
1301206-132 = "Но..."
1301206-133 = "Госпожа полицейская!"
1301206-134 = "Ты одна из студентов с экскурсии. Что-то случилось?"
1301206-135 = "Я хотела поблагодарить вас за экскурсию. Мне было очень весело!"
1301206-136 = "Но... я сегодня всё испортила."
1301206-137 = "Я даже не смогла показать вам всё замечательное, что есть в Полицейской школе «Валькирия», да ещё и опозорилась перед вами..."
1301206-138 = "Но ведь это случилось только потому, что вы отвечали на наши вопросы."
1301206-139 = "Было так круто, что вы отвечали на всё, что мы спрашивали, каким бы пустяковым ни был вопрос!"
1301206-140 = "Старшие девочки в других школах, куда мы ездили на экскурсии, даже не обращали на нас внимания только потому, что мы маленькие."
1301206-141 = "Когда я вырасту, я тоже хочу стать доброй полицейской, как вы!"
1301206-142 = ""
1301206-144 = ""
1301206-145 = "Ого... Как мило с твоей стороны!"
1301206-146 = "Я, Кирино, торжественно клянусь всегда изо всех сил защищать граждан, служить им и относиться к ним с уважением!"
1301206-147 = "[s] «Я рад, что им понравилось.»"
1301206-148 = "Я тоже. Рада, что они смогли почувствовать, насколько я была искренней."
1301206-149 = "Но всё же я допустила ошибки. Мне ещё многому нужно научиться, если я не хочу повторять их снова."
1301206-150 = "Я буду усердно тренироваться выбираться из наручников, чтобы в следующий раз, когда потеряю ключ, сразу освободиться!"
1301206-151 = "[s] «Точно это тебе нужно улучшать?»"
