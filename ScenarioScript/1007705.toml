[translation]
1007705-1 = "Одно обещание"
1007705-2 = "Под вечер я пошёл в магазин у переулка купить что-нибудь попить."
1007705-3 = ""
1007705-5 = ""
1007705-6 = "И там я обнаружил Ичику, складывающую коробки в углу детской площадки."
1007705-7 = "...А?"
1007705-8 = "Сенсей! Что вы делаете на улице так поздно?"
1007705-9 = "А, пить захотелось, да?"
1007705-10 = "Наверное, это значит, что вы снова работаете допоздна."
1007705-11 = "Жаль это слышать. Вы правда очень много работаете, да?"
1007705-12 = "Ну, вы не одиноки. Я тоже работаю. Если понадобится помощь — скажите!"
1007705-13 = "Что со мной?"
1007705-14 = "А я задержалась допоздна, потому что собираю вещи для барахолки, и осталось разобраться ещё с несколькими коробками..."
1007705-15 = "[s1] «Т-Ты собираешься тащить всё это?»\n[s2] «Да тут целая гора! Я уж подумал, что ты переезжаешь.»"
1007705-18 = "Ахаха! Да, мне часто так говорят..."
1007705-19 = "Мне нравится пробовать разные вещи, а значит, у меня накапливается куча барахла. Время от времени я всё перебираю и продаю то, чем больше не пользуюсь."
1007705-20 = "Большинство людей долго пользуются тем, что покупают. Но у меня это работает не совсем так."
1007705-21 = "Когда нахожу новое увлечение, я внезапно очень загораюсь и узнаю о нём всё. А потом однажды так же внезапно теряю интерес."
1007705-22 = "И, ну..."
1007705-23 = "Из-за этого многие мои вещи почти не использованы. А поскольку состояние хорошее, продаются они довольно быстро."
1007705-24 = ""
1007705-26 = ""
1007705-27 = "Посмотрите это приложение. Через него я продаю вещи на барахолке. Посмотрите, сколько у меня безопасных сделок..."
1007705-28 = "[s3] «Ого, у тебя платиновый рейтинг!»\n[s4] «Да это уже почти специализированный магазин!»"
1007705-31 = "И покупают у меня не только студенты Тринити. Я продаю в Миллениум, Хяккияко... всем подряд!"
1007705-32 = "Мне очень нравится торговаться, а ещё приятно видеть, как люди радуются покупке, когда им удалось выгодно её получить."
1007705-33 = "Разве не здорово? Без этого приложения я бы не продала и половины вещей. Они просто отправились бы в мусор."
1007705-34 = "А?"
1007705-35 = "А. Гитара?"
1007705-36 = "...Ах."
1007705-37 = "Нет, её я не продала."
1007705-38 = "Я пока не готова с ней расстаться. Всё-таки Сенсей похвалил меня за неё..."
1007705-39 = "Хотя, наверное, могла бы продать, если встречу человека, которому она действительно нужна."
1007705-40 = ""
1007705-42 = ""
1007705-43 = "Мф. Опять наговорила лишнего, да?"
1007705-44 = "[s5] «Нет, хорошо быть честной.»\n[s6] «Ичика, рассказывай столько, сколько тебе комфортно.»"
1007705-47 = "*вздыхает*"
1007705-48 = "Опять вы за своё. Вы всегда такое говорите?"
1007705-49 = "«Как тебе удобно». «Как хочешь». «Ты такая талантливая». То есть вы ПРЯМ ОЧЕНЬ поддерживаете!"
1007705-50 = "..."
1007705-51 = "Вы со всеми студентами такой добрый? Наверняка."
1007705-52 = "Делаете для них приятные вещи, говорите приятные вещи, помогаете им добиться успеха..."
1007705-53 = "А если кто-то пытается отплатить тем же, вы отмахиваетесь, мол, просто хороший учитель."
1007705-54 = "Эм..."
1007705-55 = "Хммм...!"
1007705-56 = "[s7] «Ичика?»\n[s8] «Что это за взгляд...?»"
1007705-59 = "Нет, так не пойдёт. Мне это не нравится."
1007705-60 = "Если я и дальше позволю вам всё делать для меня, однажды вы отдадите слишком много, и это испортит наши отношения."
1007705-61 = "Мне нужно отплатить вам за доброту, Сенсей, иначе я всегда буду чувствовать себя должной."
1007705-62 = "Нам нужно кое-что друг другу пообещать."
1007705-63 = "Обещание такое..."
1007705-64 = "...небольшое. Ничего серьёзного. Я бы не стала так вас обременять, Сенсей. Вы и так сделали достаточно..."
1007705-65 = "Просто пообещайте: если столкнётесь с любой проблемой — какой угодно маленькой или раздражающей — расскажете мне."
1007705-66 = "Например, как та стычка между студентами или когда пытаетесь сторговаться при покупке..."
1007705-67 = "Я хочу сказать, что хорошо умею ладить с людьми и хочу помогать. Поэтому, пожалуйста, позвольте мне помочь."
1007705-68 = "Вы должны согласиться, хорошо? По-другому нельзя."
1007705-69 = "[s9] «А моё мнение вообще ничего не значит?!»\n[s10] «Спасибо. Я знаю, что всегда могу на тебя рассчитывать.»"
1007705-72 = "...Хи-хи!"
1007705-73 = "Буду ждать дня, когда вам понадобится моя помощь."
1007705-75 = "После этого мы с Ичикой разошлись. Она направилась на барахолку, а я — в магазин."
1007705-76 = "Купив напиток, я вернулся, но парк уже был пуст."
