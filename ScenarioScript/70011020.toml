[translation]
70011020-1 = "Меланхолия Канбары Мисузу 2"
70011020-2 = "И сколько они стоят?"
70011020-3 = ""
70011020-5 = ""
70011020-6 = "Что...?"
70011020-7 = "Эм, возможно, вы меня неправильно расслышали. Я спросила, есть ли у вас друзья на воле."
70011020-8 = "Допустим, заведу. Сколько на них можно заработать?"
70011020-9 = "...Мне трудно понять ваш ход мыслей. Обычно друзей заводят не ради финансовой выгоды..."
70011020-10 = "Тогда они мне бесполезны. Мусор."
70011020-11 = "Ну, в мире есть множество вещей, которые нельзя купить за деньги..."
70011020-12 = "Привет."
70011020-13 = "Нельзя купить за деньги? Ха. Смешно, смешно."
70011020-14 = "Не трать моё время. Ты просто тешишь своё эго."
70011020-15 = "Н-Нет, я совсем не это имела в виду. Я... Я..."
70011020-17 = "...Эй."
70011020-19 = "ЭЙ!"
70011020-20 = "Да?!"
70011020-21 = "Я не была уверена, но вы... правда уснули? Прямо передо мной?!"
70011020-22 = "О, мне ужасно жаль. Я просто так устала..."
70011020-23 = "Но сейчас утро. Вы что, всю ночь не спали, леди?"
70011020-24 = "Ну, можно и так сказать, хи-хи..."
70011020-25 = "...Но важнее другое... Вы знаете, почему сейчас сидите здесь со мной?"
70011020-26 = "Ну да. Примерно представляю."
70011020-27 = "Мне неинтересно вас допрашивать. Но мне любопытно: что именно вас так не устраивает в пребывании здесь?"
70011020-28 = "Да особо ничего."
70011020-29 = "Особо ничего... Неплохой ответ. Такой приятно слышать."
70011020-30 = "Но «хорошим ответом» это тоже не делает. Я изучила ваши школьные записи, но мне показалось, что они совсем не рассказывают ВАШУ историю."
70011020-31 = "Что подтолкнуло вас к побегу? Почему вы захотели это сделать?"
70011020-32 = "...Слушайте, какой-то особой причины не было."
70011020-33 = "Просто подумала, что смогу. И попробовала. Вот и всё."
70011020-34 = "..."
70011020-35 = "...Можно спросить, откуда взялась такая уверенность?"
70011020-36 = "Когда я была снаружи, слышала, что отсюда сбежали аж семь заключённых и никого из них не поймали."
70011020-37 = "Кажется, их называли «Семеро заключённых» или как-то так."
70011020-38 = "Вот и подумала... почему бы не попробовать?"
70011020-39 = "Семь студентов действительно сбежали."
70011020-40 = "Но если позволите уточнить... За всю нашу историю они — ЕДИНСТВЕННЫЕ семь."
70011020-41 = "Во всех остальных случаях у Исправительного бюро безупречный результат. Мы пресекли абсолютно все остальные попытки побега."
70011020-42 = "...? А я слышала другое. Все говорят, это место — шутка."
70011020-43 = "«Лиса бедствий» ходит туда-сюда, будто тут всё её. Ну, эта, Как-Её-Там?"
70011020-44 = "Вакамо."
70011020-45 = "..."
70011020-46 = "Давайте сосредоточимся на вас. Других сейчас обсуждать не нужно."
70011020-47 = "Я хочу, чтобы вы поняли: Исправительное бюро существует не для того, чтобы издеваться над вами или унижать."
70011020-48 = "Студентов направляют в Исправительное бюро, когда их родные школы уже не знают, что делать... или когда их учебная история неясна."
70011020-49 = "Чаще всего мы занимаемся проблемными студентами, с которыми одна школа просто не способна справиться..."
70011020-50 = "Жёстко."
70011020-51 = "...Критерии субъективны. Геенна вообще не отправляет своих студентов, зато более строгие школы ссылают сюда любую, кто хоть на шаг переступит черту."
70011020-52 = "К чему я веду... Сам факт того, что вы оказались здесь, в Исправительном бюро, не означает, что вы заслуживаете дурной репутации или презрения."
70011020-53 = "Это что, попытка меня утешить?"
70011020-54 = "В каком-то смысле, да..."
70011020-55 = "...И всё же, несмотря на всё сказанное, Полицейская школа Валькирия отвечает за безопасность Кивотос. Мы не можем позволять проблемным студентам просто делать всё, что им вздумается."
70011020-56 = "Но это также означает: как только мы убеждаемся, что студент исправился и больше не будет нарушать порядок, мы вправе отпустить его по своему усмотрению."
70011020-57 = "Чтобы было предельно ясно: Исправительное бюро — НЕ тюрьма."
70011020-58 = "Если после размышлений вы покажете, что изменились, то сможете уйти. Сбегать никогда не было необходимости."
70011020-59 = "Ладно, хорошо. Подумаю над своими поступками или типа того."
70011020-60 = ""
70011020-62 = ""
70011020-63 = "У меня к вам ещё один вопрос. Очень важный."
70011020-64 = "Почему вы попытались сбежать?"
70011020-65 = "Что? Я же только что сказала. И всё! Просто захотелось."
70011020-66 = "Вы подумали, что сможете... А что собирались делать, если бы получилось?"
70011020-67 = "...Похоже, у вас уже есть готовый ответ, так почему бы просто не сказать его?"
70011020-68 = "У меня нет ВАШЕГО ответа. Совсем. Я не узнаю его, пока вы сами не расскажете, что у вас в голове."
70011020-69 = "...Ладно! Расскажу! Только не смейтесь!"
70011020-70 = ""
70011020-72 = ""
70011020-73 = "Сегодня у меня... день рождения, ясно?"
70011020-74 = "Но меня запихнули сюда всего пару дней назад. Я ещё толком не успела завести друзей..."
70011020-75 = "Вот и подумала, что было бы весело отпраздновать с корешами! Я не собиралась оставаться снаружи навсегда. Я бы вернулась."
70011020-76 = "...Понятно."
70011020-77 = "Хмф. Не то чтобы я рассчитывала, что вы мне поверите."
70011020-78 = "Простите, если создаю такое впечатление."
70011020-79 = ""
70011020-81 = ""
70011020-84 = "Охрана? Можете принести предмет, который я просила?"
70011020-85 = "Да, мэм. Мы сохранили его для вас."
70011020-87 = "...? Что это?"
70011020-88 = "...Я надеялась вручить это при более приятных обстоятельствах, так что простите за обстановку."
70011020-89 = "С днём рождения. Я сама связала эту шапку."
70011020-90 = ""
70011020-92 = ""
70011020-93 = ""
70011020-94 = ""
70011020-95 = ""
70011020-96 = "Ч-Что...?"
70011020-97 = "Мне показалось, что пастельный оттенок хорошо подчеркнёт ваши прекрасные светлые волосы, поэтому я взяла светло-розовую пряжу. Надеюсь, вам понравится."
70011020-98 = "Нет, стойте. Вы знали, что у меня день рождения...? И сделали подарок?"
70011020-99 = "Вы на моём попечении, а это особенный день. День рождения всё-таки бывает лишь раз в году."
70011020-100 = "Наверняка неприятно проводить его в Исправительном бюро. Я надеялась, это хоть немного вас подбодрит, но..."
70011020-101 = "Конечно, этого, наверное, недостаточно."
70011020-102 = "Если позволите спросить, можете дать мне контакты ваших друзей?"
70011020-103 = "...Что?"
70011020-104 = "Я хотела бы пригласить их в Исправительное бюро. Разве не было бы приятно устроить здесь маленькую вечеринку вместе? Вы заслуживаете почувствовать себя особенной."
70011020-105 = "...Вы серьёзно?"
70011020-106 = "Что именно вас удивляет?"
70011020-107 = "Ну, я ведь заключённая, которая только что пыталась сбежать."
70011020-108 = "Вы всё понимаете наоборот. Я же говорила: Исправительное бюро — не тюрьма."
70011020-109 = "...Так что вы не заключённая. Никогда ею и не были."
70011020-111 = "Отличная работа, мэм!"
70011020-112 = "На выходе она ревела как ребёнок! Потрясающе."
70011020-113 = "Мне больно думать, что она плакала в свой особенный день..."
70011020-114 = "О, она плакала не от грусти!"
70011020-115 = "Теперь я понимаю, откуда у вас такая репутация, директор! Вы правда меняете жизни."
70011020-116 = "...Как я уже говорила, всю тяжёлую работу делают они сами. Я лишь человек, с которым можно поговорить."
70011020-117 = "Если собеседник не готов открыться..."
70011020-118 = "...или мыслит так, что я не в состоянии его понять... я ничего не могу сделать."
70011020-119 = "Другой «образ мышления»?"
70011020-120 = "Ой, простите. Я неудачно выразилась. Пожалуйста, забудьте."
70011020-121 = "Спасибо за всю помощь сегодня утром!"
70011020-122 = "Что вы, я просто делаю свою работу, мэм! Зовите, если что-нибудь понадобится!"
70011020-123 = ""
70011020-125 = ""
70011020-126 = ""
70011020-127 = "...Они были настоящими. Они были здесь, и с ними невозможно было ни поговорить, ни найти общий язык. Казалось, они вообще не из этого мира."
70011020-129 = "...Те самые «заключённые»."
70011020-137 = "Новоиспечённый директор Канбара Мисузу скажет несколько слов. Встречайте её—"
70011020-138 = ""
70011020-141 = "Чрезвычайная ситуация! Заключённые сбежали!"
70011020-142 = "Семеро! Все семеро исчезли без следа!"
70011020-143 = "Групповой побег!"
70011020-145 = "В тот день Канбара Мисузу стала директором Исправительного бюро."
70011020-146 = "В том году число желающих работать в Исправительном бюро упало на 80%."
70011020-147 = "Меланхолия Канбары Мисузу"
