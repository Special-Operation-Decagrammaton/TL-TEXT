[translation]
10059050-1 = "Episode 5;Large-Scale Search"
10059050-2 = "(The next day. They gathered at the Art Council to exchange information.)"
10059050-3 = "(And so, the possibility emerged that the same person was involved in the series of incidents.)"
10059050-5 = "[ns1] \"The Broker of Greed...\"\n[ns2] \"I haven't met them yet either...\""
10059050-8 = "They are a well-known prisoner who operates out of the black market."
10059050-9 = "It is said that they mediate the distribution of illegal goods and profit from the commission..."
10059050-10 = "Furthermore, they seem to be expanding into various illegal businesses, using railway transport as their weapon."
10059050-11 = "There is a rumor that they are also involved in the distribution of premium milk, perhaps as one of those ventures."
10059050-12 = "For now, it remains just a rumor, so Valkyrie hasn't been able to take action..."
10059050-13 = "…That matches the information I obtained as well. #nIf that is the case, then that broker is—"
10059050-14 = "[s3] \"Using the milk distribution network to transport the artworks.\"\n[s4] \"Are you saying they're using that for money laundering?\""
10059050-17 = "We don't have definitive proof yet, but that is highly likely."
10059050-18 = "It seems we will be facing another Seven Prisoners, following the Phantom Thief of Benevolence."
10059050-19 = "I have already placed restrictions on the distribution of dairy products within the academy. #nBut that alone will not solve anything."
10059050-20 = "The fact that the Wild Hunt's name was used for illegal activities will not disappear."
10059050-21 = "What we need now is concrete evidence."
10059050-22 = "Therefore, we will conduct a full-scale search of the academy."
10059050-23 = "There must be someone who colluded with the broker and instigated the students."
10059050-24 = "Otherwise, it is impossible that our students would be blinded by money... #nand sell off their works and pride themselves."
10059050-25 = "Vice President Urara. Please summon the Dormitory Warden Squad immediately."
10059050-26 = "We will search every corner of the dorms thoroughly. I don't intend to miss even a single ant."
10059050-27 = "Um... it's difficult to say, Manami-sama. #nIf we conduct such a large-scale surprise inspection, there will be significant backlash from the students..."
10059050-28 = "This is a matter concerning the prestige of the academy. We cannot leave it unchecked any longer."
10059050-29 = "If there are complaints, tell them it was all under my orders."
10059050-30 = "If it is to protect the honor of the academy, I do not care what anyone thinks of me."
10059050-31 = "U... ugh."
10059050-35 = "…Understood. I will summon the Dormitory Warden Squad."
10059050-41 = "[ns] \"Are you really sure about this?\""
10059050-42 = "…I am sure."
10059050-43 = "If this is how I can protect the academy and the students."
10059050-52 = "Surprise inspection! Everyone, hands on your heads! Move outside slowly!"
10059050-53 = "Oh my. This is the first time something like this has happened."
10059050-54 = "Shhh! Did you do something behind my back!?"
10059050-55 = "Hehehe... well, who knows..."
10059050-56 = "Could it be... that the Council President's plan to infiltrate the museum was exposed?"
10059050-57 = "What are you muttering about?"
10059050-58 = "Suspicious. Body search, right now."
10059050-59 = "Starting with you. Take off your hat!"
10059050-60 = "Huh!? E-ehhh!?"
10059050-61 = "How shameless! To tell us to strip... how can you say such a thing so calmly...!"
10059050-62 = "Stop talking nonsense and take it off quickly."
10059050-68 = "Kyaaaa...!!"
10059050-71 = "I am truly sorry... #nIf I could, I wouldn't want to do this either..."
10059050-72 = "But these are the Council President's orders..."
10059050-73 = "The fact that even the Vice President is here means... I guess we really were found out. #nHeh, in that case—"
10059050-77 = "I'm sooorry... It was just a momentary lapse in judgment. #nPlease, just this once, let us go..."
10059050-78 = "It's no use playing the victim! I'm taking you all in...!"
10059050-79 = "It can't be helped. It seems we have no choice but to explain properly."
10059050-80 = "Ugh, why do I have to go through this too, seriously..."
10059050-82 = "Meanwhile, in another location..."
10059050-85 = "M-Miyo-chan...? #nWhy is there a high-caffeine drink, which is prohibited, in your room...?"
10059050-86 = "Ah, um... t-this is, well...!"
10059050-87 = "I-I was planning to use this for my artwork! It's an empty can! It's just an empty can!"
10059050-88 = "Y-yes! #nI was working on a project to sublimate prohibited items into new art!"
10059050-89 = "Hmm... you only brought in empty cans, right?"
10059050-90 = "In that case, there's no problem."
10059050-91 = "There's no way there's no problem! Your work is too sloppy!"
10059050-92 = "Miyo-chan. Now that we've found it, we can't just overlook it."
10059050-93 = "Everyone, follow me. Before this becomes a bigger issue."
10059050-94 = "I'm glad I drank it all in a hurry..."
10059050-95 = "Shhh!"
10059050-96 = "Uuuu... I'm sorry, Hiromi-chan..."
10059050-102 = "W-what? What did I do!?"
10059050-103 = "To think you'd be hiding such harmful literature, and you can still keep a straight face."
10059050-104 = "Harmful literature!? This artistic manga!?"
10059050-105 = "What part of this suspicious manga is artistic!"
10059050-106 = "Huh? You haven't even read this yet, have you? #nIf you had, you definitely wouldn't be able to say that!"
10059050-107 = "It's a masterpiece among masterpieces that walks the fine line between censorship and editing!"
10059050-111 = "…Really?"
10059050-112 = "Now that you mention it... I'm starting to get curious..."
10059050-117 = "H-how disgraceful...!!"
10059050-118 = "Hey, close it quickly! Do you want to get caught with me!?"
10059050-119 = "S-sorry!"
10059050-124 = "Don't try anything funny, just come quietly! #nThe order is to take in anyone who looks even slightly suspicious!"
10059050-125 = "Ugh...! Just because you're the Council President, you think you can do whatever you want!? This is tyranny!!"
10059050-127 = "(After that, the large-scale surprise inspection continued.)"
10059050-129 = "Manami-sama. So far, there have been no reports leading to the broker of greed."
10059050-130 = "Reports have come in, but most of them are trivial."
10059050-131 = "The only notable one is that there were people planning to infiltrate your museum, Manami-sama."
10059050-132 = "The people from Room 404 of Dorm 4?"
10059050-133 = "Exactly."
10059050-134 = "I knew all along that they would set their sights on my museum next."
10059050-135 = "They are the type of people who want to peek even more when something is hidden. #nIs there anything else worth noting?"
10059050-136 = "…As expected, there seems to be significant backlash from the students."
10059050-137 = "The Dormitory Warden Squad is suppressing it as instructed, but..."
10059050-138 = "It doesn't matter. The backlash was already factored in. #nPlease continue as you are."
10059050-139 = "Right now, the investigation is the priority above all else. #nWe must find the person colluding with the broker at all costs."
10059050-140 = "[s] \"This is just... a hypothetical, but.\""
10059050-145 = "[ns5] \"If there was no one colluding with the broker—\"\n[ns6] \"If the students were blinded by money and did it on their own—\""
10059050-148 = "We will have no choice but to strictly punish the students who sold the works."
10059050-149 = "To ensure they never repeat the same mistake again."
10059050-150 = "…."
10059050-152 = "…That is Manami-sama's intention. #nUrara-sama. Please continue the investigation."
10059050-157 = "(Ugh... it's not good to keep provoking the students any further...)"
10059050-158 = "(If this kind of search continues, that person's safety will also be at risk...)"
10059050-163 = "(If it comes to this...)"
10059050-164 = "(I am sorry, Manami-sama.)"
10059050-165 = "(I will have to... disobey your orders.)"
10059050-169 = "Um... everyone from the Dormitory Warden Squad? #nI have some urgent business, so I'll be stepping away for a moment."
10059050-170 = "If anything happens, please contact me immediately."
10059050-171 = "Yes! Leave it to us!"
10059050-178 = "…It's me."
10059050-179 = "I'm sorry, but I have something I'd like to discuss regarding this matter..."
10059050-180 = "…Yes. Thank you. #nThen, I will be waiting at that place."
10059050-187 = "Oh, you were already here."
10059050-188 = "I apologize. For calling you out so suddenly."
10059050-192 = "No, I was actually thinking I wanted to have a quiet talk with you once as well."
10059050-193 = "…In a safe place that won't be recorded."
10059050-194 = "Fufu... is that so? I'm glad our intentions align."
10059050-195 = "Then... I will get straight to the point."
10059050-196 = "There is something I would like to ask of you, so that no one finds out."
10059050-197 = "Not to Miria-sama of the Dormitory Warden Squad—"
10059050-199 = "[log=우라라]The Phantom Thief of Benevolence.[/log]"
10059050-201 = "[log=우라라]To Kiyosumi Akira-sama.[/log]"
