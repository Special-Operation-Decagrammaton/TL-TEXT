10002135-111 = "Сенсей?"
10002135-112 = "Эти фотографии. Неужели это правда...?"
10002135-113 = "[s9] «Видишь? Все хорошо провели время.»\n[s10] «Это всё фотографии с выполнения списка желаний.»"
