[translation]
10002135-1 = "Эпизод 13;Список желаний летнего неба"
10002135-2 = "К концу дуэли фейерверков пляж пропах порохом и напалмом."
10002135-3 = "На улице и без того было темно, но из-за дыма и копоти вокруг стало совсем непроглядно."
10002135-5 = "*кашель* *кашель* А-а-а! Повсюду дым."
10002135-6 = "Победа за нами."
10002135-7 = "Морская соль и напалм... Так вот чем пахнет пляж ночью. Мне даже нравится."
10002135-8 = "Азуса, ты опять всё понимаешь неправильно!"
10002135-9 = "Мы пришли сюда не для того, чтобы побеждать в сражениях..."
10002135-10 = "И я даже не успела сделать нормальные фотографии фейерверков. Что теперь делать?"
10002135-11 = "[s1] «Не переживай. Я одну сделал.»\n[s2] «Думаю, эта вполне подойдёт.»"
10002135-12 = "Когда вы успели это сделать, Сенсей?!"
10002135-13 = "Когда вы успели это сделать, Сенсей?!"
10002135-15 = ""
10002135-16 = "Это потрясающе!"
10002135-17 = "Если бы я не знала, что было на самом деле, подумала бы, что это обычное шоу фейерверков!"
10002135-18 = ""
10002135-19 = "А потом всё перестало быть обычным..."
10002135-20 = "[s] «Цуруги, тоже хочешь посмотреть?»"
10002135-22 = "А? Я?!"
10002135-23 = "...!"
10002135-24 = "Я, эм..."
10002135-25 = "Да, пожалуйста..."
10002135-27 = "После этого мы всю ночь убирали пляж."
10002135-28 = "Когда мы закончили складывать вещи обратно в Крусейди, солнце уже начинало вставать."
10002135-30 = "[ns] «Ладно. Поехали домой.»"
10002135-31 = ""
10002135-34 = ""
10002135-35 = ""
10002135-36 = "Неудивительно, что после бессонной ночи остальные вымотались и проспали всю дорогу домой."
10002135-37 = "После всех вчерашних сражений они выглядели совершенно расслабленными."
10002135-38 = ""
10002135-40 = ""
10002135-42 = ""
10002135-43 = "Все, кроме Хифуми, которой всё ещё приходилось везти нас домой."
10002135-45 = "На следующий день."
10002135-48 = "Комната Комитета правопорядка"
10002135-50 = ""
10002135-51 = "Рада снова вас видеть, Сенсей."
10002135-52 = "Я слышала, вы сопровождали остальных. Надеюсь, поездка вам понравилась."
10002135-53 = "Маширо и Цуруги сейчас на дежурстве, так что прошу прощения, что их нет здесь, чтобы вас встретить."
10002135-54 = "Но я рада сказать, что Цуруги снова стала собой. Я не знаю, как вас отблагодарить."
10002135-55 = "Даже Маширо теперь выглядит спокойнее и собраннее."
10002135-56 = "А что насчёт остальных двоих? Как думаете, поездка пошла им на пользу, Сенсей?"
10002135-57 = "[s3] «Думаю, они изо всех сил старались повеселиться.»\n[s4] «Для них это больше походило на домашнее задание.»"
10002135-58 = "А?"
10002135-59 = "А?"
10002135-60 = ""
10002135-62 = ""
10002135-63 = ""
10002135-64 = "[ns] Показать список."
10002135-66 = "А-а. Наверное, он немного давил на них."
10002135-67 = "Вы говорите, список всё-таки оказался полезен?"
10002135-68 = "Хи-хи."
10002135-69 = "Спасибо, что сказали. Я составляла его с лучшими намерениями, но всё равно боялась, что он будет слишком давить на них."
10002135-70 = "Я знаю, что к Цуруги бывает трудно привыкнуть, поэтому надеялась, что список поможет всем быстрее найти общий язык."
10002135-71 = "Прошу прощения, если он лишь усложнил жизнь тем двоим из Клуба дополнительных занятий."
10002135-72 = "Я думала, что чёткий список заданий поможет им насладиться летними каникулами."
10002135-73 = "[s5] «Думаю, он свою задачу выполнил.»\n[s6] «Без него всё было бы гораздо хуже.»"
10002135-74 = "Спасибо, Сенсей. Теперь мне спокойнее."
10002135-75 = "Спасибо, Сенсей. Теперь мне спокойнее."
10002135-76 = "Когда в следующий раз увидите тех двоих, не могли бы вы сказать им, что больше не придётся выполнять такие списки?"
10002135-77 = "Думаю, от вас это прозвучит лучше, чем от меня."
10002135-78 = "Ещё раз спасибо за всё, Сенсей."
10002135-79 = ""
10002135-81 = ""
10002135-82 = ""
10002135-83 = "До новой встречи."
10002135-84 = ""
10002135-86 = ""
10002135-87 = ""
10002135-88 = "[ns] «Хасуми.»"
10002135-89 = "А?"
10002135-90 = "[s7] «Почему бы тебе в следующий раз не поехать с нами?»\n[s8] «Было бы здорово, если бы в следующий раз ты присоединилась.»"
10002135-91 = "А? Вы хотите, чтобы в следующий раз я тоже поехала?"
10002135-92 = "А? Вы хотите, чтобы в следующий раз я тоже поехала?"
10002135-93 = "Понятно. Я не смогла бы надолго оставить это место..."
10002135-94 = "...но спасибо за приглашение. От одной мысли об этом моё сердце будто уже отправилось в чудесный отпуск."
10002135-95 = "А?"
10002135-96 = "Вы хотели обсудить что-то ещё?"
10002135-97 = "Вас всё ещё интересует список? Насколько заранее он был написан?"
10002135-98 = "Значит, вы заметили. На этот вопрос сложно ответить."
10002135-99 = "Иногда, когда я устаю, я записываю вещи, которые когда-нибудь хотела бы сделать."
10002135-100 = "Вот и всё, так что не придавайте этому слишком большого значения."
10002135-101 = "Ой, чуть не забыла. Вы ведь сделали фотографии для каждого пункта?"
10002135-102 = "Даже если я не смогла поехать сама, мне хотелось увидеть на фотографиях, как все веселятся. Можно посмотреть?"
10002135-103 = "[s] Показать Хасуми фотографии."
