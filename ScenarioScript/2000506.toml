[translation]
2000506-1 = "Эксклюзивный летний мерч Пероро!"
2000506-2 = "Перед пляжной закусочной"
2000506-3 = "Мы с Хифуми как раз выходим из пляжной закусочной после сытного обеда."
2000506-4 = "Ух ты, было очень вкусно!"
2000506-5 = "Я думала, это будет обычная якисоба, но она оказалась намного вкуснее той, что продают возле школы."
2000506-6 = "Интересно, у соуса в этом заведении есть какой-то секретный рецепт?"
2000506-7 = "[s] «Может, она казалась вкуснее, потому что мы ели у самого пляжа?»"
2000506-8 = "Может быть. Наверное, когда настроение хорошее, всё кажется вкуснее."
2000506-9 = "Возможно, эта якисоба — своего рода особая летняя традиция, которой по-настоящему можно насладиться только в это время года."
2000506-10 = "Ну что, куда отправимся дальше, раз мы уже сыты?"
2000506-11 = "У тебя ещё осталось место для десерта?"
2000506-12 = "Здравствуйте, мисс! Как насчёт фруктового льда Моримори-кун на десерт после еды?"
2000506-13 = "Если купите сейчас, сможете поучаствовать в розыгрыше плюшевого Пероро из Momo Friends!"
2000506-14 = "П-Плюшевого Пероро?!"
2000506-15 = "Это лимитированный дизайн из коллаборации... Я обязана его заполучить!"
2000506-16 = "[s] «Не знаю. Дизайн выглядит немного подозрительно...»"
2000506-17 = "Наоборот. Недорогой коллаборационный мерч всегда выпускают небольшими тиражами, и он быстро распродаётся. Поэтому среди коллекционеров он ценится гораздо выше."
2000506-19 = "Сенсей, сегодня мы обязаны взять этот фруктовый лёд на десерт!"
2000506-20 = "[s1] «Один — ладно...»\n[s2] «Хорошо. Покупаю.»"
2000506-21 = "Два Моримори-кун со вкусом газировки, пожалуйста!"
2000506-22 = "Два Моримори-кун со вкусом газировки, пожалуйста!"
2000506-23 = "Обязательно!"
2000506-26 = "Такой сладкий и освежающий..."
2000506-27 = "Акция акцией, но на пляже ничто не сравнится с фруктовым льдом."
2000506-28 = "Ну что, раз мы доели, давай посмотрим, что написано на палочках."
2000506-29 = ""
2000506-31 = "Поздравляем! Вы выиграли два бесплатных фруктовых льда Моримори-кун!"
2000506-32 = "А? Ещё фруктовый лёд?"
2000506-33 = "Именно. С вероятностью 50 процентов можно выиграть ещё один фруктовый лёд или плюшевого Пероро."
2000506-34 = "Разумеется, бесплатные порции тоже участвуют в розыгрыше, так что если не выиграете плюшевого Пероро, сможете продолжать попытки!"
2000506-35 = "О, хорошо. Тогда попробую ещё раз!"
2000506-36 = ""
2000506-37 = "Думаешь, в тебя влезет ещё один фруктовый лёд, Сенсей?"
2000506-38 = "[s] «Да, думаю, ещё один осилю...»"
2000506-39 = ""
2000506-40 = ""
2000506-41 = "Была не была!"
2000506-44 = "Но плюшевого Пероро мы так и не выиграли."
2000506-46 = "П-Поздравляем. Вы выиграли ещё два Моримори-кун..."
2000506-47 = "Как это вообще возможно? Это уже десятый! Почему мне до сих пор не выпал приз?"
2000506-48 = "И теперь у меня мозги замёрзли от такого количества фруктового льда..."
2000506-49 = "[s3] «У меня голова болит...»\n[s4] «Живот превратился в глыбу льда.»"
2000506-50 = "Как странно. Шанс выиграть ещё одну порцию льда и шанс выиграть куклу Пероро должны быть одинаковыми..."
2000506-51 = "Как странно. Шанс выиграть ещё одну порцию льда и шанс выиграть куклу Пероро должны быть одинаковыми..."
2000506-52 = ""
2000506-53 = "(Эм, мисс. Я могу потом просто отдать вам плюшевого Пероро, так что не заставляйте себя продолжать.)"
2000506-54 = "Ни за что! Я дала обещание Пероро!"
2000506-55 = "Я никогда не смогу смотреть этому плюшу в глаза, если не выиграю его честно!"
2000506-56 = ""
2000506-57 = "Ты ведь осилишь ещё один фруктовый лёд... правда, Сенсей?"
2000506-58 = "[s] «Я попробую.»"
2000506-59 = "Есть..."
2000506-61 = "Поехали!"
2000506-65 = "П-Поздравляем! Вы выиграли лимитированного плюшевого Пероро!"
2000506-66 = "Получилось! Мы наконец сделали это!"
2000506-67 = "Без тебя и всех тех порций фруктового льда, которые ты съел, я бы не справилась, Сенсей. Спасибо тебе за всё."
2000506-68 = "Подожди. Почему всё вдруг начало кружиться? У меня голова идёт кругом..."
2000506-69 = ""
2000506-70 = ""
2000506-72 = "В-Вы в порядке, мисс?! Пожалуйста, придите в себя!"
2000506-73 = "Наверное, у вас закружилась голова от такого количества холодной еды. Нужно отвести вас к врачу."
2000506-74 = "[s] «Тогда сразу к двум врачам.»"
2000506-75 = ""
2000506-79 = "Ты тоже?!"
2000506-80 = "Пожалуйста, держись! Всё будет хорошо!"
2000506-82 = "..."
2000506-83 = "Плюшевый Пероро наконец был наш, но мне пришлось промывать желудок и провести в постели целых три дня."
