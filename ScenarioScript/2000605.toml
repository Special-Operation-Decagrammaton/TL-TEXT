[translation]
2000605-1 = "Любимое место Саи"
2000605-2 = "Лапшичная"
2000605-3 = "Это одно из моих любимых мест с раменом!"
2000605-4 = "Каждую Неделю рамэна хозяин придумывает новое необычное меню, используя самые неожиданные ингредиенты."
2000605-5 = "И я уверена, что новинка будет потрясающей! ♪"
2000605-6 = "Что такое, Сенсей? Вы неважно выглядите."
2000605-7 = "Вы не любите рамен?"
2000605-8 = "[s1] «Не то чтобы я его не любил...»\n[s2] «Что-то тут подозрительно пахнет.»"
2000605-12 = ""
2000605-13 = "О, Сая. Ты снова здесь."
2000605-14 = "Ага. Пришла попробовать новое блюдо вместе с Сенсеем."
2000605-15 = "Что ж... не хочу вас расстраивать, но на этой неделе оно всё ещё не готово. Если хотите новый рамен, придётся поискать другое место."
2000605-16 = "Что? Правда? Ещё на прошлой неделе ты говорил, как рад, что придумал новый секретный бульон."
2000605-17 = "С ним что-то не так?"
2000605-18 = "Да, вроде того. Возникла одна проблема..."
2000605-19 = "Лучше сами посмотрите."
2000605-20 = ""
2000605-21 = ""
2000605-22 = "[s] «Я так и знал, что тут что-то подозрительно пахнет.»"
2000605-23 = "Верно. За основу бульона я взял рыбный соус кусая."
2000605-24 = "Он густой, а вкус умами лучше, чем у любого рамена, который я делал раньше, но от этого характерного рыбного запаха никак не избавиться."
2000605-25 = "Если я подам такое посетителям, репутации Променада конец."
2000605-26 = "Вот беда. А я так хотела его попробовать..."
2000605-27 = ""
2000605-28 = "Слушай, Сая, у тебя случайно нет какого-нибудь секретного средства, которое могло бы убрать этот запах?"
2000605-29 = "А? С чего ты решил, что у меня есть что-то подобное?"
2000605-30 = "Твоя специализация — алхимия, разве нет? Ты умеешь смешивать самые разные вещества и получать нужный эффект."
2000605-31 = "Если кто и знает, как сделать что-нибудь, влияющее на обоняние, то это ты."
2000605-32 = "И разве не говорят, что клиент всегда прав?"
2000605-33 = "При чём тут деловые лозунги и мои занятия алхимией?!"
2000605-34 = "Хе-хе... Что ж, тебе повезло — всё идеально совпало."
2000605-35 = "Так уж вышло, что у меня с собой есть эликсир, блокирующий неприятные запахи!"
2000605-36 = "[s3] «Повезло?»\n[s4] «Так уж вышло?»"
2000605-37 = "Хватит смотреть на меня как на подозреваемую!"
2000605-38 = "Хватит смотреть на меня как на подозреваемую!"
2000605-39 = "Для учёного совершенно естественно носить материалы с собой, чтобы проводить исследования в любое время и в любом месте."
2000605-40 = "Я мигом сделаю соус, нейтрализующий неприятные запахи, просто смешав несколько базовых компонентов!"
2000605-41 = "Тогда мой рамен в полном твоём распоряжении для экспериментов!"
2000605-42 = "Хе-хе. Ну что, начнём?"
2000605-45 = "― Хе-хе-хе. Запашок и правда будь здоров.[wa:4140]"
2000605-47 = "― В таком виде это точно не съешь.[wa:1330]"
2000605-50 = "― Сначала одна ложка дезодоранта, чтобы убрать запах.[wa:1840]"
2000605-52 = "― Затем две ложки горчичного порошка, чтобы приглушить послевкусие.[wa:1380]"
2000605-55 = "― Ещё совсем чуть-чуть... Ты будешь восхитительным.[wa:440]"
2000605-58 = "― Эм, секундочку.[wa:330]"
2000605-60 = "― Я случайно насыпала слишком много горчичного порошка![wa:570]"
2000605-63 = "― Эх, ничего страшного.[wa:1810]"
2000605-65 = "― Просто добавлю что-нибудь ещё, чтобы нейтрализовать запах.[wa:1270]"
2000605-68 = "Готово! Пробуйте!"
2000605-69 = "Я щедро добавила своего особого соуса, так что теперь запах вас беспокоить не должен."
2000605-70 = "И правда. Рыбный запах полностью исчез."
2000605-71 = "Теперь посмотрим, какой вкус..."
2000605-72 = ""
2000605-74 = ""
2000605-75 = ""
2000605-76 = ""
2000605-78 = "ОСТРО! ОЧЕНЬ ОСТРО!"
2000605-79 = "*кашель* *кашель* Что это?! Этот соус такой острый! У меня рот горит!"
2000605-80 = "Хе-хе-хе. В этом весь смысл!"
2000605-81 = "Ведь корень проблемы в том, что рыбный запах слишком сильный для человеческого носа, верно?"
2000605-82 = "Ну..."
2000605-83 = "...если добавить столько остроты, что у едока онемеет обоняние, он вообще не почувствует запах!"
2000605-84 = "Я гений! Хахаха!"
2000605-85 = "Но кто станет это есть, если оно НАСТОЛЬКО острое?"
2000605-87 = ""
2000605-88 = "Кто-то сказал «острый суп»?"
2000605-89 = "Не возражаете, если я попробую?"
2000605-90 = "А ты...?"
2000605-91 = "Конечно! Он приготовлен с моим особым соусом!"
2000605-92 = "Так, посмотрим..."
2000605-93 = ""
2000605-95 = ""
2000605-96 = ""
2000605-97 = ""
2000605-99 = "ОСТРО! ОЧЕНЬ ОСТРО!"
2000605-100 = "[s] «Два из двух.»"
2000605-101 = "*кашель* *кашель* Никогда не пробовал ничего настолько острого. Обычному человеку даже в рот такое положить будет непросто."
2000605-102 = "...И всё же под остротой скрывается глубокий вкус, который весьма приятен."
2000605-103 = "Нет, даже лучше. Он гармонично сочетается с остротой и доставляет ни с чем не сравнимое удовольствие!"
2000605-104 = "Решено."
2000605-105 = "Победителем этой Недели рамэна становится этот острый рамен!"
2000605-106 = "Вы ведь не тот самый легендарный гурман... господин Некобара?"
2000605-107 = "Кто я — неважно. Важно лишь то, что здесь есть вкусная еда."
2000605-108 = ""
2000605-109 = "Похоже, скоро у вас будет наплыв посетителей, так что я загляну в другой раз."
2000605-110 = ""
2000605-112 = ""
2000605-114 = "Странный он. Кто просто уходит после такой восторженной рецензии?"
2000605-115 = "В любом случае моя работа здесь закончена. Я возвращаюсь."
2000605-118 = "Это здесь продают острый рамен, который господин Некобара похвалил в соцсетях?"
2000605-119 = "Слышала, любителям острого обязательно стоит попробовать. Можно мне порцию?"
2000605-120 = "И мне! Одну порцию того нового рамена, о котором все говорят!"
2000605-121 = "Но его ведь ещё даже официально нет в меню. Как все о нём узнали?"
2000605-122 = "Я-я хотел сказать, сейчас будет!"
2000605-123 = ""
2000605-124 = "ОН ТАКОЙ ОСТРЫЙ! Но и вкусный!"
2000605-125 = "Это самое острое, что я когда-либо пробовала! Кажется, я влюбилась..."
2000605-126 = "Так жжёт... а палочки сами тянутся за добавкой!"
2000605-127 = ""
2000605-129 = ""
2000605-130 = "Вам всем правда настолько нравится?"
2000605-131 = "(Такого никогда не бывает...)"
2000605-132 = "[s] «Чего так удивилась? Ожидала другого?»"
2000605-133 = "К-Конечно нет! Я его сделала, так что знала, что будет вкусно!"
2000605-134 = "...Может, и нам самим попробовать?"
2000605-136 = "После этого мы с Саей поделили миску рамена с особым соусом."
2000605-137 = "...Больше трёх дней мне казалось, будто в животе бурлит лава."
