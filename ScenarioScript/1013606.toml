[translation]
1013606-1 = "Какао вместе с тобой"
1013606-2 = ""
1013606-3 = "Сегодня вы хорошо поработали, Сенсей."
1013606-4 = "[s1] «Ты тоже отлично поработала, Эйми.»\n[s2] «Постой, а ты сейчас где? Я тебя не вижу...»"
1013606-7 = "Я?"
1013606-8 = "Наверху."
1013606-9 = "Я на задании?"
1013606-10 = "Нет, но..."
1013606-11 = "Хм."
1013606-12 = "Хотите подняться сюда, Сенсей?"
1013606-13 = "Здесь просто... есть что-то особенное."
1013606-16 = "Ориентируясь на голос Эйми, я поднялся к ней."
1013606-17 = ""
1013606-21 = "― [log=에이미 결전]Добро пожаловать, Сенсей.[/log][wa:1347]"
1013606-23 = "― [log=에이미 결전]Это ночное небо... Немного странное, правда?[/log][wa:220]"
1013606-26 = "[ns] «И правда...»"
1013606-27 = "― [log=에이미 결전]Оно такое же, как знакомое нам ночное небо...[/log][wa:2340]"
1013606-30 = "― [log=에이미 결전]Но при этом во многом совершенно другое.[/log][wa:860]"
1013606-32 = "― [log=에이미 결전]Прямо как я сейчас.[/log]"
1013606-35 = "― [log=에이미 결전]Раньше у меня никогда[/log][wa:2040]"
1013606-37 = "― [log=에이미 결전]не было причины смотреть на небо.[/log]"
1013606-40 = "― [log=에이미 결전]А в последнее время мне это начало нравиться.[/log][wa:720]"
1013606-43 = "― [log=에이미 결전]Но знаете...[/log][wa:1360]"
1013606-45 = "― [log=에이미 결전]Каждый раз, когда я смотрю вверх, вспоминаю лицо Сенсея.[/log][wa:740]"
1013606-48 = "[ns] «Почему?»"
1013606-49 = "― [log=에이미 결전]Фуфу. Интересно почему?[/log][wa:3010]"
1013606-51 = "― [log=에이미 결전]Сенсей.[/log]"
1013606-54 = "― [log=에이미 결전]Я правда счастлива, что встретила вас.[/log][wa:4010]"
1013606-56 = "― [log=에이미 결전]Да. Правда, очень-очень счастлива.[/log][wa:4203]"
1013606-59 = ""
1013606-60 = "А? Вы на всякий случай принесли какао?"
1013606-61 = "Спасибо за заботу, но—"
1013606-62 = "[s] «Конечно. Я принёс тебе холодное какао!»"
1013606-63 = "Ого. Спасибо, Сенсей."
1013606-64 = "Мне очень нравится эта ваша сторона."
1013606-67 = "Я устроился поудобнее рядом с Эйми."
1013606-69 = ""
1013606-70 = "До того как встретила вас, Сенсей..."
1013606-71 = "До того как встретила вас, Сенсей..."
1013606-72 = "Мне казалось, что люди должны сами разбираться со своей жизнью."
1013606-73 = "Я никогда не формулировала это вслух и даже толком не осознавала..."
1013606-74 = "Только сейчас понимаю, что где-то глубоко в подсознании именно так и думала."
1013606-75 = "Больше всего я была эффективна, когда работала одна."
1013606-76 = "Учёба и получение знаний тоже казались одиночным занятием."
1013606-77 = "[s] «А теперь?»"
1013606-78 = "Хм..."
1013606-79 = "Ну, если бы сегодня я была одна..."
1013606-80 = "Никто не принёс бы мне холодное какао."
1013606-81 = "И не было бы никого, с кем можно поделиться теплом тела."
1013606-82 = ""
1013606-84 = ""
1013606-85 = ""
1013606-86 = ""
1013606-87 = "Когда Эйми придвинулась ближе, она казалась теплее, чем когда-либо."
1013606-88 = "Вам всё ещё холодно, Сенсей?"
1013606-89 = "[s] «Нет. Какао приятно горячее.»"
1013606-90 = "Хмф."
1013606-91 = "[s3] «Я просто дразнюсь.»\n[s4] «Ты меня отлично согреваешь, Эйми.»"
1013606-94 = "Хорошо. Именно это я хотела услышать."
1013606-95 = "..."
1013606-96 = "Приятно, правда?"
1013606-97 = "Да. Мне нравится."
1013606-98 = "А? Отныне я буду работать с большим количеством людей..."
1013606-99 = "Значит, я изменюсь ещё сильнее?"
1013606-100 = "..."
1013606-101 = "..."
1013606-102 = "..."
1013606-103 = "Я подумаю."
1013606-104 = "[s] «Почему сомневаешься?»"
1013606-105 = "Я всё ещё считаю, что СЛИШКОМ много людей делают всё утомительным."
1013606-106 = "[s] «Вот какой у тебя аргумент...?»"
1013606-107 = "Разумеется. Это важно, Сенсей."
1013606-108 = "Одна из главных причин стремиться к эффективности — избежать лишней мороки."
1013606-109 = "[s] «Не могу спорить...»"
1013606-110 = "А прямо сейчас мне кажется, что одного вас мне вполне достаточно."
1013606-111 = "[s] «Ч-Что?!»"
1013606-112 = "Здесь не получится притвориться глухим, Сенсей."
1013606-113 = "В конце концов, я сказала это специально для ваших ушей."
1013606-114 = ""
1013606-116 = ""
1013606-118 = "Мы с Эйми пили какао и болтали под тем же самым и одновременно другим ночным небом, пока наконец не отправились спать."
