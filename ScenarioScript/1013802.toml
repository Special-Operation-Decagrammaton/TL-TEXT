[translation]
1013802-1 = "Снимай!"
1013802-2 = "Я купил материалы, которые попросила Рэна, и отправился в Академию искусств Вайлдхант."
1013802-3 = "Однако..."
1013802-5 = "Мамма миа! Что это за мерзость?!"
1013802-6 = "Кетчуп... на спагетти?!"
1013802-7 = "Хм? Вкусно. Немного сладко. Хочешь попробовать?"
1013802-8 = "Молчать! Это оскорбление всего, за что стоит Вайлдхант! Наша легендарная кухня... ты её осквернила!"
1013802-9 = "Постой... А ЧТО это рядом? Какое-то... ризотто?"
1013802-10 = "О, это? Просто рис. Отлично идёт с соусом от пасты. То есть... с кетчупом."
1013802-11 = "А-А-а-а-а...! К оружию, демон!"
1013802-12 = "Ахахаха! Ищешь неприятностей — ты их нашла!"
1013802-13 = ""
1013802-14 = "[ns] «Эм... девушки?»"
1013802-15 = ""
1013802-20 = "Я оказался втянут в спор между двумя студентами."
1013802-21 = ""
1013802-25 = ""
1013802-26 = "Вы обе... Оружие на землю! Никаких ссор перед гостем!"
1013802-27 = "Но она...! Она кладёт кетчуп на спагетти!"
1013802-28 = "А ОНА разбавляет эспрессо. ЛЬДОМ!"
1013802-29 = "Какой ужас...!! Арестовать обеих!!"
1013802-30 = ""
1013802-32 = ""
1013802-33 = ""
1013802-34 = ""
1013802-35 = "[ns] «Похоже, вопрос и правда оказался очень чувствительным...»"
1013802-36 = "Совершенно верно. И снова правосудие восторжествовало!"
1013802-37 = "Сенсей, вы в порядке? Вас... не ранили?"
1013802-38 = "[s] «Я-я в порядке.»"
1013802-39 = "Я рад это слышать."
1013802-40 = "Приношу извинения за эту поистине, поистине ужасную сцену. Я прослежу, чтобы такое больше не повторилось."
1013802-41 = "Так, зеваки! Разошлись! Если только не хотите лекцию по обновлённому списку запрещённых предметов!"
1013802-42 = ""
1013802-44 = ""
1013802-46 = "Драка закончилась..."
1013802-47 = "Но вокруг остался полный беспорядок."
1013802-48 = "[ns] «Хотя бы стол поставлю обратно.»"
1013802-50 = "И когда я присел, собираясь поднимать ногами..."
1013802-51 = ""
1013802-54 = "[ns] «...?!»"
1013802-55 = "Что-то... Моя задница?"
1013802-56 = "Я порвал штаны?! На людях? В ШКОЛЕ?!"
1013802-57 = "[ns] «Ч-Что делать?! Нельзя, чтобы кто-нибудь увидел...!»"
1013802-58 = "Всё вокруг начало темнеть."
1013802-59 = "Мозг лихорадочно искал ответ. Должен же быть способ спастись...!"
1013802-60 = "...?"
1013802-61 = "Сенсей? Что вы здесь делаете?"
1013802-62 = ""
1013802-64 = "[ns] «...!!»"
1013802-65 = "Вы так и не пришли, поэтому я пошла вас искать!"
1013802-66 = "Серьёзно, вы даже телефон проверить не можете?"
1013802-67 = "...Хм? Что случилось? Почему вы весь вспотели? И так скрючились?"
1013802-68 = "..."
1013802-69 = "Вы что-то скрываете, да?"
1013802-70 = "Что у вас за спиной? Покажите!"
1013802-71 = "[s] «Н-Не могу! Э-Это...!!»"
1013802-72 = "Что значит «не можете»?"
1013802-73 = "Если пытаетесь разыграть меня, прекращайте. Это не смешно."
1013802-74 = ""
1013802-76 = ""
1013802-77 = "..."
1013802-78 = "...?!"
1013802-79 = "Ч-Ч-Что?! ПРЯМО ТАМ?!"
1013802-80 = "М-Можно было просто сказать, что они п-порвались!!"
1013802-81 = "[s] «Я-я пытался...!»"
1013802-82 = "А-Ах...!"
1013802-83 = "Так, просто стойте на месте! Не... двигайтесь. Я сейчас вернусь."
1013802-84 = ""
1013802-86 = ""
1013802-88 = "К счастью, у Рэны в сумке оказался какой-то платок. Я обвязал его вокруг талии и спасся."
1013802-89 = ""
1013802-90 = "Фух. Думаю, теперь безопасно."
1013802-91 = "[s] «Спасибо огромное, Рэна!»"
1013802-92 = "Хватит ёрзать в этой странной позе!"
1013802-93 = "Сенсей, пока рано меня благодарить."
1013802-94 = "Потому что сейчас начнётся серьёзное."
1013802-95 = "*вздыхает*"
1013802-96 = ""
1013802-98 = ""
1013802-99 = "Снимайте."
1013802-100 = "[s] «...Что?»"
1013802-101 = "Вы заставите меня повторить?"
1013802-102 = "Сни. Май. Те! Чтобы я могла зашить! Очевидно же!"
1013802-103 = "[s] «А... Да!»"
1013802-106 = "Я поспешил в угол, снял порванные штаны и передал их Рэне."
1013802-107 = "Я завернулся в её платок и наблюдал за работой."
1013802-109 = "Так... они порвались, когда вы пытались поставить стол обратно?"
1013802-110 = "Не нужно было этого делать. Префектурный совет сам бы всё убрал. Эти девушки обожают любую работу..."
1013802-111 = "Серьёзно, вы слишком добрый."
1013802-112 = "[s] «Значит... я тебе нравлюсь...?»"
1013802-113 = "Ч-Что?! О чём вы вообще?!"
1013802-114 = ""
1013802-116 = ""
1013802-117 = "...Ах."
1013802-118 = "Я-Я ТОЛЬКО ЧТО ОШИБЛАСЬ ИЗ-ЗА ВАС!"
1013802-119 = "Серьёзно, только создаёте лишнюю работу...! Точно как мои соседки!"
1013802-120 = "[s] «Я настолько для тебя важен? Тронут!»"
1013802-121 = "Будете продолжать дразнить — зашью карманы."
1013802-122 = "Так что лучше молчите и ведите себя хорошо."
1013802-123 = "С иголкой и ниткой я опасна. *вздох*"
1013802-124 = "А теперь сидите тихо и дайте мне сосредоточиться!"
1013802-126 = "Я послушно сидел, как потребовала Рэна."
1013802-127 = "А немного позже..."
1013802-128 = ""
1013802-129 = "Вот. Готово. Примерьте."
1013802-130 = ""
1013802-132 = ""
1013802-133 = ""
1013802-134 = ""
1013802-136 = "Закончили?"
1013802-137 = "[s] «Да. Всё прилично.»"
1013802-138 = "Точно? Если открою глаза, ничего странного не увижу, да?"
1013802-139 = "[s] «Конечно!»"
1013802-140 = "Х-Хорошо. Поверю вам."
1013802-141 = "Открываю."
1013802-142 = "..."
1013802-143 = "Ну как? Как ощущается?"
1013802-144 = "[s] «Очень удобно! Смотри!»"
1013802-145 = ""
1013802-150 = "[ns] «А...»"
1013802-151 = ""
1013802-152 = ""
1013802-153 = "ИДИОТ! Зачем вы так носились?!"
1013802-154 = "Вы снова порвали штаны! И теперь ещё сильнее!"
1013802-155 = "Снимайте сейчас же! Или на этот раз я реально зашью карманы!"
1013802-157 = "Рэна снова зашивала мои штаны, пока я тихо сидел в углу и размышлял над своими поступками."
