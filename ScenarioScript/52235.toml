[translation]
52235-4 = "...Pensando em algo, Presidente Niya?"
52235-8 = "Ora, prazer em conhecê-la... creio eu?"
52235-9 = "Você é a contadora de histórias de terror por trás disso tudo?#nOu seria a sombra de uma certa pessoa...?"
52235-10 = "Ser colocada no mesmo patamar que aquela tola é um tanto desagradável."
52235-11 = "Ufufu, é que aparecer sem avisar lembrou tanto a Shuro-san."
52235-12 = "Acabei ofendendo você? Peço mil perdões."
52235-16 = "...Provocações baratas assim não vão mudar nada."
52235-17 = "Mesmo que insistam em realizar o festival, esta situação não será revertida. É a mesma coisa."
52235-18 = "Ora..."
52235-19 = "Ops, acabei me atrasando com as apresentações."
52235-20 = "Meu nome é Azami Habu."
52235-21 = "Como já deve ter percebido, sou a narradora da história desta noite, artista do macabro do Clube Beleza da Natureza — e confidente da Srta. Kokuriko."
52235-23 = "O livro que gera histórias de terror, o \"Inou Mononokeroku\", deveria ter sido destruído da última vez..."
52235-24 = "Além disso, por mais interessante que seja uma história, ouvir a mesma coisa várias vezes acaba cansando... Vocês não aprendem mesmo, né?"
52235-25 = "É ultrajante ver minha obra comparada a tamanha mediocridade."
52235-26 = "Meu grimório macabro, o \"Inoutei Mononokeroku\", nasceu do medo."
52235-27 = "É diferente do desejo de que o \"Inou Mononokeroku\" precisa. O medo do \"Inoutei Mononokeroku\" revela com muito mais nitidez o coração daqueles que tremem."
52235-28 = "Pode até haver quem desconheça os próprios desejos, mas não existe ninguém que não sinta medo."
52235-29 = "De vermes a feras colossais... maus amigos familiares ou estranhos que o insultam..."
52235-30 = "Os medos escondidos no coração são tão variados quanto as pessoas.#nQuando reunidos em um só lugar, formarão um belo arco-íris."
52235-31 = "Por mais que se debatam, jamais conseguirão escapar deste terror."
52235-32 = "Enquanto o olhar dos Hitotsume estiver voltado para vocês, serão apenas o alicerce que alimenta o medo do \"Inoutei Mononokeroku\"."
52235-33 = "Nyaha... Discursos de gente apaixonada por si mesma são tão longos e entediantes, né?"
52235-34 = "Pois bem, vou perguntar mais uma vez, Presidente Niya."
52235-35 = "Você acredita mesmo que lutar contra isso vai melhorar a situação?"
52235-36 = "Não?"
52235-37 = "Na verdade, estou bem no meio de sentir na pele a minha própria impotência."
52235-41 = "Então por que se dar ao trabalho de insistir no festival?"
52235-42 = "Não passa de uma gota d'água no oceano, não é?"
52235-46 = "...Azami-san, certo? Posso fazer uma pergunta também?"
52235-47 = "Desde os tempos de guerra do passado até os dias de hoje."
52235-48 = "As anomalias que enganavam as pessoas por toda Hyakkiyako e davam origem às lendas de terror —#nvocê sabe por que, depois da unificação da academia, passaram a aparecer apenas nos arredores?"
52235-49 = "Gente como o Clube Yin-Yang deve ter feito alguma coisa, não?"
52235-50 = "Nyahaha, de jeito nenhum."
52235-51 = "Se eu tivesse que lidar até com esse tipo de serviço, já teria largado a presidência do Clube Yin-Yang há muito tempo."
52235-56 = "A resposta... são os festivais de Hyakkiyako, realizados não importa o que aconteça."
52235-57 = "...Festivais?"
52235-58 = "Sim. Daqueles bem espalhafatosos, onde todo mundo se diverte junto."
52235-59 = "Você nunca achou estranho?"
52235-60 = "Por que um simples clube como o \"Comitê de Organização de Festivais\" decide os eventos da academia e controla até o fluxo financeiro do distrito autônomo?"
52235-61 = "Isso não é só resultado da minha preguiça, sabia?#nÉ algo estabelecido desde a antiguidade, na época da Kuzunoha."
52235-62 = "Dizem que, originalmente, o festival começou como um rito em prece por uma vida pacífica."
52235-63 = "Faziam-se oferendas, relatavam-se as dificuldades atuais aos céus e rogava-se por um futuro tranquilo..."
52235-64 = "Em suma, o que vamos realizar agora não é um mero festival."
52235-68 = "...É um \"ritual\" para purificar as calamidades."
52235-69 = "Que absurdo sem sentido..."
52235-73 = "Os Hitotsume estão... se dissipando?"
52235-87 = "Mas o que você fez...?!"
52235-88 = "Eu não fiz nadinha de especial."
52235-89 = "Ajudar todos a viverem dias em harmonia, como sempre foi, é simplesmente o trabalho do Clube Yin-Yang."
52235-94 = "— Quando a balança pende para o Yin, trazemos equilíbrio com o poder do Yang.#nÉ o mais básico princípio do Yin e Yang."
52235-97 = "T-Tem um olho aqui também!"
52235-98 = "Tem olhos por toda parte... Eles não param de olhar pra gente...!"
52235-99 = "J-Já era... Não adianta nem fugir..."
52235-100 = "O Hyakkaryouran nem está aqui... Aquele monstro vai devorar todo mundo!"
52235-104 = "...Ué? Não tem uma música tocando em algum lugar?"
52235-105 = "Numa situação dessas...? Não é coisa da sua cabeça?"
52235-106 = "Não... É uma música, com certeza.#nE essa voz, eu conheço de algum lugar..."
52235-108 = "Atenção, pessoal! O Festival Waraku vai acontecer conforme o planejado!#nPor favor, reúnam-se em frente ao palco!"
52235-109 = "É uma chance única na vida de ouvir a música inédita da Chise-chan bem na primeira fila!"
52235-110 = "Displays de acrílico exclusivos da Chise-chan, pelúcias da Chise-nyan e muito mais... Estamos liberando uma enxurrada de produtos limitados!"
52235-111 = "E que tal uma soda de sakura para acompanhar o show~!"
52235-114 = "Quem é? Fazer um show numa hora dessas..."
52235-115 = "Você não conhece?!#nÉ a maior idol de Hyakkiyako e a estrela principal deste festival: \"Chise-chan, a Princesa Waraku\"!"
52235-116 = "Não acredito que vão mesmo fazer o show... Achei que nunca mais ia poder ouvir a voz da Chise-sama..."
52235-123 = "Sai da frente! Eu vou assistir ao show da Chise-sama!"
52235-124 = "Mesmo com fantasmas por toda parte?!"
52235-125 = "Se é o fim do mundo de qualquer jeito, quero assistir ao show especial da Chise-sama antes de morrer!"
52235-130 = "Segurem firme, pessoal~"
52235-131 = "Vamos lá, para o outro lado do Crepúsculo~"
52235-136 = "...Entendo. Então havia um plano por trás disso."
52235-137 = "Dissipar as cores do medo com a algazarra de um festival...#nDe fato, isso é capaz de neutralizar o terror do \"Inoutei Mononokeroku\"."
52235-138 = "Mas... não existe um festival que dure para sempre, não é?"
52235-139 = "Todo festival chega ao fim eventualmente.#nQuando as cortinas caírem, o medo voltará a cobrir esta academia."
52235-140 = "Pode até achar que foi uma jogada genial, mas no fim não passa de um paliativo."
52235-141 = "Será mesmo? Não acha que deveria se preocupar consigo mesma agora?"
52235-142 = "Afinal, até fogos de artifício brancos já foram lançados na torre do castelo..."
52235-143 = "Não importa quantos daqueles fogos lancem..."
52235-144 = "Ora, então você não sabia. Pois vou aproveitar a oportunidade para lhe ensinar."
52235-145 = "Antes do desenvolvimento da tecnologia de rádio — fogos de artifício eram usados como sinal para indicar a localização de quem precisa de resgate."
52235-147 = "Sua desgraçada, não me diga que —"
52235-149 = "Esta é a técnica de tiro estilo Hyakkaryouran —"
52235-153 = "Fogos de Artifício da Juventudeee!!"
52235-164 = "Próximo;O Lamento dos Demônios Diante do Rugido do Leão"
