[translation]
52235-3 = ""
52235-4 = "...Что ты задумала, президент Ния?"
52235-5 = ""
52235-7 = ""
52235-8 = "О? Кажется, мы ещё не имели удовольствия познакомиться?"
52235-9 = "Я разговариваю с бардом, который устроил это маленькое представление? Или ты очередная тень?"
52235-10 = "Бард? Ты сравниваешь меня с той глупой мелкой соплячкой? Пусть ты и глава клуба Инь-Ян, я бы была осторожнее с оскорблениями."
52235-11 = "Фу-фу, вот как? Просто ты очень напомнила мне Сюро — ввалилась сюда даже не представившись."
52235-12 = "Разумеется, я вовсе не хотела тебя обидеть. Надеюсь, ты найдёшь в сердце силы меня простить."
52235-13 = ""
52235-15 = ""
52235-16 = "...Твои дешёвые провокации не улучшат положение."
52235-17 = "Как и твои грубые попытки насильно протащить этот фестиваль — они ничего не дадут."
52235-18 = "...О-хо."
52235-19 = "Тогда, пожалуй, представлюсь."
52235-20 = "Меня зовут Хабу Азами."
52235-21 = "Как ты и догадалась, сегодня я рассказчица, Фантомная художница «Красоты природы» и самая доверенная помощница госпожи Кокурико."
52235-23 = "В прошлый раз мы уничтожили «Фантомные записи Ино»..."
52235-24 = "Повторение делает даже самую забавную историю скучной, но, полагаю, людям с дурным вкусом..."
52235-25 = "Опять оскорбляешь. Тот посредственный том пытается рассказывать историю без единой иллюстрации."
52235-26 = "Мой же том — «Фантомные иллюстрации Тоутэй». Он рождается из человеческого страха."
52235-27 = "«Фантомные записи» питает туманное желание. А страх... Страх «Фантомных иллюстраций» телесный. Яркий. Изысканный."
52235-28 = "Желания мимолётны и переменчивы, а страх пускает корни в самой душе."
52235-29 = "От крошечных насекомых до гигантских зверей. От знакомых мучителей до безымянных незнакомцев."
52235-30 = "Нельзя избавиться от страха, просто отвернувшись и закрыв глаза. Мазки его кисти оставляют обжигающие шрамы."
52235-31 = "Как ни старайся, человеку не дано преодолеть свой страх."
52235-32 = "Пока взгляд Хитоцумэ направлен на вас, вы будете жить в бесконечном кошмаре. И этот кошмар станет рассадником власти «Фантомных иллюстраций»."
52235-33 = "Нья-ха-ха. «Рассадником», говоришь? Такие старомодные выражения популярны в филиале Эбису?"
52235-34 = "Спрошу ещё раз, президент Ния."
52235-35 = "Ты настолько наивна, что думаешь, будто эта безнадёжная борьба изменит исход сегодняшней ночи?"
52235-36 = "Нет? Не особо?"
52235-37 = "Я болезненно хорошо понимаю, что сама не способна изменить вообще ничего."
52235-38 = ""
52235-40 = ""
52235-41 = "Тогда зачем упорно устраиваешь этот бесплодный фестиваль?"
52235-42 = "Это какая-то попытка облегчить собственное чувство вины?"
52235-43 = ""
52235-45 = ""
52235-46 = "...У меня к тебе встречный вопрос, Азами."
52235-47 = "От нашего бурного прошлого до нынешнего дня..."
52235-48 = "Когда-то Фантомы свободно бродили по Хяккияко и разносили свои истории о призраках повсюду. Знаешь, почему после объединения школ они теперь лишь изредка танцуют на окраинах района?"
52235-49 = "Несомненно, работа вашего назойливого клуба Инь-Ян."
52235-50 = "Нья-ха-ха! Какая ты милая."
52235-51 = "Я бы никогда не осталась президентом, если бы борьба с Фантомами входила в мои обязанности."
52235-52 = ""
52235-54 = ""
52235-56 = "Ответ прост: фестивали Хяккияко."
52235-57 = "...Фестивали?"
52235-58 = "Начинаешь понимать. Яркие, шумные фестивали, которые объединили когда-то разделённый район."
52235-59 = "Ты правда ни разу об этом не задумывалась?"
52235-60 = "Не странно ли, что Фестивальный отдел обладает такой властью? Не студсовет, не дисциплинарный комитет. Всего лишь клуб — а управляет годовым календарём и контролирует финансы академии."
52235-61 = "Вопреки распространённому мнению, дело не в моей лени. Эту систему установила сама Кузуноха."
52235-62 = "Говорят, когда-то фестивали были священными обрядами общения с небесами."
52235-63 = "Мы приносили еду, рассказывали о трудностях и от всего сердца желали мирного будущего."
52235-64 = "Если вкратце: то, что мы устраиваем сегодня ночью, — не просто фестиваль."
52235-65 = ""
52235-67 = ""
52235-68 = "...Это великий ритуал, наш фестиваль, который откроет путь спокойному завтра."
52235-69 = "Что ты...?"
52235-70 = ""
52235-72 = ""
52235-73 = "Глаз Хитоцумэ... тускнеет?"
52235-87 = "Ты! Что ты сделала?!"
52235-88 = "Ничего особенного. Просто то, что делала всегда."
52235-89 = "Клуб Инь-Ян существует ради поддержания равновесия."
52235-90 = ""
52235-92 = ""
52235-94 = "Если город затопит инь, мы просто уравновесим его ян... В конце концов, это даже в нашем названии."
52235-97 = "Т-Там тоже глаз!"
52235-98 = "Неважно, куда бежим! От его взгляда не скрыться!"
52235-99 = "Этот взгляд... Аргх! Эти ужасные мысли слишком сильны! Пусть это прекратится!"
52235-100 = "Всё кончено... Всё кончено... Без Хяккарёран, который нас защищает, этот монстр всех нас проглотит!"
52235-101 = ""
52235-103 = ""
52235-104 = "...А? Кто-то... поёт?"
52235-105 = "Теперь тебе ещё и голоса мерещатся? Кто вообще может петь в такой момент?"
52235-106 = "Нет-нет. Послушай. Разве не слышишь? Я... знаю этот голос..."
52235-108 = "Все! Фестиваль Вараку продолжается! Пожалуйста, собирайтесь у сцены!"
52235-109 = "Это ваш единственный в жизни шанс услышать неизданную песню Чисэ прямо из первого ряда!"
52235-110 = "И мы выпускаем весь лимитированный мерч Чисэ, который берегли специально для сегодняшнего дня!"
52235-111 = "По дороге к сцене обязательно освежитесь холодной сакуровой газировкой!"
52235-113 = ""
52235-114 = "Кто... эта исполнительница?"
52235-115 = "Ты серьёзно?! Это Чисэ! Весь фестиваль посвящён ей — айдолу №1 Хяккияко, принцессе Вараку!"
52235-116 = "Они всё ещё проводят фестиваль? Я думала, больше никогда не услышу её голос..."
52235-118 = ""
52235-119 = ""
52235-120 = ""
52235-122 = ""
52235-123 = "С дороги! Я иду на живое выступление Чисэ!"
52235-124 = "Наши жизни в опасности! Ты сейчас серьёзно идёшь ВЕСЕЛИТЬСЯ на фестиваль?!"
52235-125 = "Если мне суждено умереть, хочу встретить конец рядом с Чисэ!"
52235-126 = ""
52235-128 = ""
52235-130 = "Все держитесь крепче!"
52235-131 = "На самый дальний край мира духов!"
52235-136 = "...Признаю, ход был неплохой."
52235-137 = "Значит, ты с самого начала задумала нейтрализовать страх «Фантомных иллюстраций» радостью фестиваля."
52235-138 = "Но что дальше? Собираешься устроить вечный фестиваль?"
52235-139 = "Стоит вашему маленькому празднику закончиться — и страх снова захватит академию."
52235-140 = "Ты лишь откладываешь неизбежное. Вечно отворачивать его взгляд не получится."
52235-141 = "Вот как? Мне льстит, что ты настолько мной увлечена, но не стоит ли обратить немного внимания на то, куда он смотрит сейчас?"
52235-142 = "Иначе пропустишь прекрасное шоу фейерверков над Тэнсюкаку."
52235-143 = "...С чего бы мне вообще было дело до фейерверков?"
52235-144 = "О-хо, не знаешь? Позволь просветить."
52235-145 = "Задолго до появления беспроводной связи люди использовали фейерверки как сигнальные ракеты, когда им требовалась помощь."
52235-147 = "Ты мелкая...! Ты подала сигнал Хяккарёран?!"
52235-149 = "Это меткость Хяккарёран..."
52235-150 = ""
52235-153 = "Наша пылающая молодость!"
52235-154 = ""
52235-162 = ""
52235-164 = "Следующий эпизод;Крик облегчения"
