[translation]
1600906-1 = "Девушка-ниндзя хочет сиять!"
1600906-2 = "Парк Крякающих Уток Хяккияко"
1600906-3 = "Я договорился встретиться с Мичиру в парке и пришёл к назначенному времени."
1600906-4 = "[ns] «Так зачем я сегодня здесь?»"
1600906-5 = "Хи-хи-хи. Как вы, наверное, догадались... есть только одна причина, почему мы встречаемся сегодня вечером."
1600906-6 = "Недавно я создала совершенно новое ниндзюцу!"
1600906-7 = "Я хочу снять его и загрузить на канал «Мичиручи: свиток девушки-ниндзя»!"
1600906-8 = "[s] «Ого. Я просто потрясён.»"
1600906-9 = "Ну же, Сенсей. Что вы такое говорите?"
1600906-10 = "Я же всё это время подводила к этому!"
1600906-11 = "[s] «Подводила?»"
1600906-12 = "Ну да. Помните, вы сказали, что я вдруг сменила тему, когда мы болтали в MomoTalk?"
1600906-13 = "Подумайте! О чём я говорила прямо перед тем, как сменить тему?"
1600906-14 = "[s] «О каком-то томе какой-то манги, который ты оставила в Шале...»"
1600906-15 = "Именно, Сенсей! Как вы знаете, девятнадцатый том «Бурной битвы Кама-Боко» даже выпустили в печати из-за его влияния!"
1600906-16 = "Кама-Боко, главный герой, наконец через кровь, пот и слёзы получает своё фирменное ниндзюцу!"
1600906-17 = "[s] «О-Ого! Не может быть?»"
1600906-18 = "Вы этого не знали? Сенсей, вам нужно больше тренироваться!"
1600906-19 = "В общем, среди трендового контента сейчас отлично заходят ролики «Я сделал XX из XX», знаете?"
1600906-20 = "Поэтому я сниму видео под названием «Самодельное ниндзюцу, которое должно появиться в Кама-Боко!»"
1600906-21 = "Вот это мы сегодня будем использовать для съёмки!"
1600906-22 = "Это набор ниндзя-фейерверков «Огненный танец»! Нужно только поджечь и смотреть, как летят искры!"
1600906-23 = "Это последний ингредиент моего фирменного ниндзюцу! Моя мечта!"
1600906-24 = "[s1] «Кажется, мы немного неправильно используем слово „ниндзюцу“.»\n[s2] «С огнём опасно. Будь осторожна, хорошо?»"
1600906-25 = "Не переживайте о мелочах! Я подготовилась идеально, всё будет хорошо!"
1600906-26 = "Не переживайте о мелочах! Я подготовилась идеально, всё будет хорошо!"
1600906-27 = ""
1600906-29 = ""
1600906-30 = "Я даже принесла ведро воды на случай чрезвычайной ситуации! Я продумала в голове каждую сцену."
1600906-31 = "Сенсей! Я рассчитываю на вас!"
1600906-32 = "Будет грандиозно!"
1600906-33 = ""
1600906-35 = ""
1600906-36 = ""
1600906-39 = "― Сейчас покажу![wa:1690]"
1600906-41 = "― Это совершенно новое ниндзюцу стиля Мичиру![wa:3110]"
1600906-44 = "― Ниндзюцу! Техника Искрящегося Пламени![wa:1670]"
1600906-47 = "― Ха-ха-ха! Сенсей! Ну как вам?[wa:1560]"
1600906-49 = "― Разве не круто?!"
1600906-52 = "― Как я выгляжу на экране?[wa:1050]"
1600906-55 = "― Настоящая атмосфера ниндзя... Идеально![wa:2440]"
1600906-57 = "― Я сильнейший президент Клуба исследования ниндзюцу![wa:1400]"
1600906-60 = "― О, дальше будет ещё лучше.[wa:320]"
1600906-62 = "― Продолжайте смотреть!"
1600906-65 = "― Раз, два![wa:680]"
1600906-69 = "Хия! Разве не круто получилось?"
1600906-70 = "Это невероятно! Думаю, вот оно — видео, которое наконец завирусится!"
1600906-71 = "Я укажу ваше имя в особой благодарности!"
1600906-72 = ""
1600906-75 = "[ns] «Мичиру. Конец твоего шарфа.»"
1600906-76 = "Хм?"
1600906-77 = "Ай! Горячо! Ч-Что это?"
1600906-78 = "Д-Достопочтенный Сенсей! Вода, вода! Используйте ниндзюцу!"
1600906-79 = "[ns] «Ниндзюцу: ведро воды!»"
1600906-80 = ""
1600906-82 = ""
1600906-83 = "*плеск* *кашляет*"
1600906-85 = "(Благодаря быстрой реакции нам удалось потушить огонь, пока всё не превратилось в катастрофу.)"
1600906-87 = "Отменяем дубль! Снимем ещё раз! В этот раз всё получится!"
1600906-88 = "А? Нельзя?"
1600906-89 = "П-Почему нельзя, Сенсей?!"
1600906-90 = "[s3] «Это слишком опасно. И ты ещё простудишься.»\n[s4] «Давай придумаем другую концепцию. Что-нибудь безопаснее для тебя.»"
1600906-91 = "О, вы... беспокоитесь обо мне?"
1600906-92 = "О, вы... беспокоитесь обо мне?"
1600906-93 = "О! Д-Да, понимаю..."
1600906-94 = "Уааа! Но я ненавижу, что не сняла то, что хотела!"
1600906-95 = "Но я, Чидори Мичиру, президент Клуба исследования ниндзюцу, никогда не сдамся!"
1600906-96 = "Клянусь, я найду способ! Я создам вирусный контент про ниндзя!"
1600906-97 = "Я прославлю ниндзя по всему Кивотосу, и наш канал достигнет трёхзначного числа подписчиков!"
1600906-98 = "[s] «Как твоя цель умудряется быть одновременно такой большой и такой маленькой?»"
1600906-99 = "Вы переживаете о неважных вещах!"
1600906-100 = "Я продолжу создавать контент про ниндзя и усердно работать ради Клуба исследования ниндзюцу!"
1600906-101 = "Обязательно помогайте мне, Сенсей!"
1600906-102 = "[s] «Да, конечно.»"
1600906-103 = "Вахаха. Отлично!"
