[translation]
51030-1 = "Episódio 3;Um Encontro Inesperado (2)"
51030-3 = "Tsc! Quem diria que era o Sensei da Schale!"
51030-4 = "E-Eu sabia, isso não ia dar certo!"
51030-5 = "Hã? Não foi você quem disse \"vamos aproveitar os preparativos do festival pra faturar alto\"?!"
51030-6 = "O quê?! Q-Quando foi que eu disse isso...?! Quem me deu essa ideia foi outro cara!"
51030-7 = "Droga! Esquece! Vamos recuar por enquanto, todo mundo em retirada!"
51030-13 = "...V-Vencemos, não é mesmo?"
51030-19 = "O que foi aquilo agora há pouco? Foi simplesssmente incrível!"
51030-20 = "Cada instrução foi tão precisa, uma sensação de sintonia perfeita...#nComo se eu tivesse reencontrado o cãozinho querido com quem cresci na infância..."
51030-21 = "Por acaso... vossa senhoria seria um amigo de infância...#nde quem fui separada há muito tempo?"
51030-22 = "[s] \"Acho que não sou nem seu cãozinho, nem seu amigo de infância...\""
51030-23 = "Oh..."
51030-24 = "Entendo."
51030-25 = "[s] (Ela parece bem decepcionada...)"
51030-26 = "Puxa vida, os movimentos da senhorita também foram impressionantes."
51030-27 = "Essas roupas... você é uma das garotas da Hyakkaryouran, não é?"
51030-31 = "[ns] (Falando na Hyakkaryouran, se bem me lembro...)"
51030-32 = "Ah, bem..."
51030-33 = "Não, não pode ser.#nOuvi dizer que vocês estão suspensas por causa da tal \"Ordem de Dissolução\"."
51030-38 = "Não!"
51030-43 = "Isso seria um mal-entendido, por assim dizer... Ainda estou averiguando a situação, digamos..."
51030-44 = "Se descobrirem que estou aqui, vão perceber que fugi...#nAcho melhor não dizer nada agora... Hmm..."
51030-45 = "[s] \"...?\""
51030-46 = "...? Parece que você tem seus motivos."
51030-47 = "Bom, não entendo os detalhes, mas..."
51030-52 = "Vocês dois me salvaram. Muito obrigado."
51030-53 = "Eu tinha certeza de que tinha deixado cair em algum lugar..."
51030-58 = "Que nada! Isso não foi nada...#nSe estiver em apuros, estarei sempre à disposição para ajudar!"
51030-60 = "(O morador se despediu agradecido e foi embora)"
51030-64 = "Permita-me apresentar-me formalmente mais uma vez."
51030-69 = "Eu me chamo Kade..."
51030-73 = "Y-Yukari, ao seu dispor.#nAgradeço imensamente pela ajuda de agora há pouco."
51030-74 = "[s] \"Ajudar uma aluna em apuros é o mínimo que eu poderia fazer.\""
51030-75 = "Como?"
51030-76 = "Ajudar os outros com tanta naturalidade e sequer se gabar disso..."
51030-77 = "...Ah!"
51030-78 = "Agora que me lembro, a Renge-senpai já me falou sobre isso...!"
51030-79 = "...Que esse tipo de atitude é uma armadilha engenhosa!"
51030-80 = "Dizem que há indivíduos inescrupulosos que começam parecendo gentis, mas depois ligam dizendo \"Sou eu! Sou eu!\" e exigem quantias absurdas de dinheiro...!"
51030-81 = "...Será que eu estou em uma enrascada sem saída?!"
51030-82 = "[s] \"Calma, eu não sou ninguém suspeito, sou o Sensei da Schale.\""
51030-86 = "...Peço mil desculpas por minha ignorância."
51030-87 = "Mas graças ao Sensei, conseguimos ajudar alguém em necessidade!"
51030-88 = "Hmm... Como poderei retribuir tamanha dívida de gratidão?"
51030-92 = "— Já decidi!"
51030-93 = "Já que está aqui, eu mesma farei uma visita guiada por Hyakkiyako!"
51030-99 = "[ns] \"Er, na verdade eu tenho um compromisso...\""
51030-100 = "Venha, Sensei! Por aqui!"
51030-105 = "(E assim, acabei sendo guiado por Yukari através de Hyakkiyako)"
51030-108 = "Hyakkiyako é um distrito autônomo onde o turismo floresce..."
51030-109 = "A apresentação mais popular daqui é..."
51030-118 = "(Puxado pela mão por uma Yukari entusiasmada que caminhava à frente, acabei voltando ao local do festival)"
51030-126 = "Conecta aquele lado primeiro! Segura firme, segurança em primeiro lugar!"
51030-127 = "Onde eu coloco esses materiais...?#nPreciso liberar o espaço logo...!"
51030-130 = "Uff... Não termino nunca a confirmação final dos participantes das apresentações..."
51030-131 = "Ei, você aí! Não fica parado olhando, mexe esse corpo!"
51030-132 = "Ei, pessoal! Depois que comerem isso, a gente continua!"
51030-134 = "[ns] \"Parece que está todo mundo bem ocupado.\""
51030-135 = "Sim, haverá um festival em breve."
51030-136 = "[s] \"Mas... o clima parece diferente dos festivais de sempre.\""
51030-140 = "Notar algo assim... o senhor tem um olhar muito apurado."
51030-141 = "E não é para menos, pois o festival desta vez é..."
51030-142 = "O renascimento do \"Festival das Lanternas de Hyakkiyako\", que havia sido abolido há 20 anos.#nÉ muuuuito especial."
51030-145 = "Esta é uma tradição transmitida na academia..."
51030-146 = "Há muito tempo, após superar uma era de conflitos, a Academia Hyakkiyako mudou seu nome para Academia Aliada Hyakkiyako e renasceu."
51030-149 = "Contudo, mesmo com o fim das disputas, as feridas não cicatrizariam tão facilmente..."
51030-150 = "Então, para acalmar a inquietação do povo, uma figura central de Hyakkiyako naquela época propôs este \"Festival das Lanternas de Hyakkiyako\"."
51030-153 = "Depositar as mágoas do passado nas lanternas e desejar um bom futuro...#nOuvi dizer que é assim que os corações de todos se conectam."
51030-154 = "[s] \"Mas por que ele foi abolido há 20 anos...?\""
51030-155 = "Bem, sobre isso..."
51030-156 = "Eu também não ouvi os detalhes exatos do que aconteceu naquela época... Até aí eu não sei..."
51030-162 = "Um detalhe tão pequeno não tem importância."
51030-167 = "Sim?!"
51030-169 = "Vocês vieram ajudar?#nOu são só turistas que chegaram cedo demais?"
51030-170 = "Bem, tanto faz... Essa vista não é de tirar o fôlego?"
51030-171 = "[s] \"Sim, realmente.\""
51030-172 = "Não sei o que aconteceu há 20 anos, mas...#né maravilhoso podermos reviver esse festival assim."
51030-173 = "É verdade! Afinal, Hyakkiyako é a academia dos festivais!"
51030-174 = "Especialmente depois daquilo tudo que aconteceu... Naturalmente, todo mundo acabou se empenhando ainda mais."
51030-178 = "Por causa disso, estou tão ocupado que já estou ficando tonto!#nRealmente precisamos de toda ajuda possível! Hahaha!"
51030-179 = "A Presidente do Comitê de Organização de Festivais tem se esforçado muito!#nEla é cheia de energia, realmente impressionante."
51030-184 = "A Presidente do Comitê de Organização de Festivais..."
51030-185 = "[s] \"Entendi, então a Shizuko...\""
51030-187 = "E ainda ouvi dizer que, no festival desta vez, aquela Donzela do Santuário vai realizar o ritual!"
51030-188 = "Sim!"
51030-189 = "Como o grande destaque deste \"Festival das Lanternas de Hyakkiyako\" —"
51030-196 = "Eu sei o quanto todos depositam suas esperanças nisso, mas..."
51030-197 = "Mas... eu quero estar na Hyakkaryouran..."
51030-202 = "Senhorita!"
51030-203 = "Então a senhorita estava aqui! Soubemos que saiu correndo da mansão assim que ouviu falar da Ordem de Dissolução, estávamos muito preocupados."
51030-207 = "...!!"
51030-212 = "[ns] \"...Hm?\""
51030-214 = "Já me encontraram... Não há o que fazer."
51030-215 = "Ahem... Sensei [USERNAME]. Agradeço imensamente pela sua ajuda hoje.#nJamais esquecerei esta dívida de grati—"
51030-219 = "Arf, arf...! Não vou deixar você fugir de novo!"
51030-220 = "— Bem, parece que não há tempo para expressar todos os meus sentimentos!"
51030-221 = "Embora lamente me despedir tão cedo, preciso me retirar!"
51030-225 = "Senhorita, espere! Senhoritaaaaa!!!"
51030-231 = "[ns] \"Ela passou como um furacão...\""
51030-234 = "Próximo;No Clube Yin-Yang"
