[translation]
51030-1 = "Эпизод 3; Неожиданная встреча 2"
51030-3 = "Ч-Чёрт! Кто бы мог подумать, что появится Шале!"
51030-4 = "Я так и знал! Надо было сидеть дома! Не стоило вообще ввязываться!"
51030-5 = "А? Это же ты говорил, что на огромной толпе фестиваля можно разбогатеть на карманных кражах!"
51030-6 = "Ты о чём? Я думал, это ты говорил, что во время подготовки к фестивалю можно обдирать людей!"
51030-7 = "Н-Неважно! В-Все, отступаем!"
51030-8 = ""
51030-10 = ""
51030-13 = "...После всей бравады они довольно быстро сбежали."
51030-14 = ""
51030-16 = ""
51030-18 = ""
51030-19 = "Но какой потрясающий бой! Как вам это удалось?"
51030-20 = "Каждая команда идеально совпадала с тем, что я собиралась сделать... Мы были полностью синхронны, будто я снова встретила щенка, с которым играла много лет назад..."
51030-21 = "Или будто давно потерянный друг детства вернулся исполнить старое обещание, прямо как в истории!"
51030-22 = "[s] «Не думаю, что я щенок... или твой друг детства.»"
51030-23 = "Ах..."
51030-24 = "Не так?"
51030-25 = "[s] «(Она выглядит разочарованной...)»"
51030-26 = "Кстати о потрясающем, мисс, я никогда не видел, чтобы кто-то так сражался!"
51030-27 = "С такими навыками и такой одеждой вы наверняка из Хяккарёран!"
51030-28 = ""
51030-30 = ""
51030-31 = "[ns] «(Хяккарёран...)»"
51030-32 = "А, ну, правда в том, что..."
51030-33 = "Погодите, это не сходится. Мне говорили, что они больше не патрулируют академию — после того как им приказали распуститься или что-то вроде того."
51030-34 = ""
51030-36 = ""
51030-38 = "Нет!"
51030-39 = ""
51030-42 = ""
51030-43 = "Эм, я хотела сказать... Произошло недоразумение. Я здесь не в официальном качестве."
51030-44 = "То есть если бы я была из Хяккарёран, меня, скорее всего, доложили бы, узнай кто-нибудь, что я вышла патрулировать, так что..."
51030-45 = "[s] «...?»"
51030-46 = "Вот как?"
51030-47 = "Ну, для меня это слишком сложно, мисс. Я деталей не знаю, но в одном уверен."
51030-48 = ""
51030-50 = ""
51030-51 = ""
51030-52 = "Я благодарен вам за помощь."
51030-53 = "Спасибо. И вам тоже. Не представляю, что бы я делал, если бы вы не вернули мой кошелёк. Огромное спасибо."
51030-55 = ""
51030-57 = ""
51030-58 = "Ах... Да пустяки! Я просто рада, что смогла вам помочь."
51030-60 = "Старик ушёл, на каждом шагу щедро благодаря нас."
51030-64 = "А теперь позвольте мне как следует представиться."
51030-65 = ""
51030-67 = ""
51030-68 = ""
51030-69 = "Меня зовут Ка—"
51030-70 = ""
51030-72 = ""
51030-73 = "Ю-Юкари! Спасибо за своевременную помощь."
51030-74 = "[s] «Помогать ученикам в беде — моя обязанность.»"
51030-75 = "О?"
51030-76 = "Хм, вы говорите так, будто помогать нуждающимся — это само собой разумеющееся."
51030-77 = "...А!"
51030-78 = "Рэнгэ рассказывала мне о чём-то подобном!"
51030-79 = "В мире есть злодеи, которые подходят к тебе с улыбкой... лишь затем, чтобы поймать в свои коварные сети!"
51030-80 = "Они демонстративно проявляют щедрость, чтобы загнать тебя в долг, а потом требуют двойную плату за помощь, крича: «Помнишь, что ты мне должна?!»"
51030-81 = "...О нет, я попала в беду?!"
51030-82 = "[s] «Нет! ...Нет. Я просто учитель. Сенсей из Шале.»"
51030-83 = ""
51030-85 = ""
51030-86 = "...А. Простите, я не знала."
51030-87 = "Но благодаря вам я смогла исправить несправедливость, и больше никто не пострадал."
51030-88 = "М-м-м, значит, теперь я должна отплатить за услугу... Что же делать, что же..."
51030-89 = ""
51030-91 = ""
51030-92 = "...А! Знаю!"
51030-93 = "Я покажу вам Хяккияко!"
51030-94 = ""
51030-97 = ""
51030-99 = "[ns] «П-Постой, у меня ещё есть другие дела...»"
51030-100 = "Сюда, Сенсей!"
51030-101 = ""
51030-105 = "Юкари схватила меня за руку и побежала вперёд, увлекая за собой."
51030-108 = "В районе Академии Хяккияко много туристов, особенно во время фестивалей..."
51030-109 = "А артисты в том театре невероятно популярны...!"
51030-113 = ""
51030-114 = ""
51030-118 = "Было приятно гулять по району с Юкари, у которой, кажется, была история про каждый угол, пока мы не оказались почти там же, откуда начали."
51030-119 = ""
51030-126 = "Вот! Убедитесь, что соединение затянуто как следует, чтобы ничего не упало!"
51030-127 = "Эй! Почему материалы сложены здесь? Нужно немедленно освободить этот участок!"
51030-130 = "Уф! Как мне вообще проверить всех артистов, записавшихся на фестиваль? Список имён бесконечный!"
51030-131 = "Помоги-ка, мы дорогу перегородили!"
51030-132 = "Выглядишь голодным! Не работай на пустой желудок — перекуси!"
51030-134 = "[ns] «Все такие занятые.»"
51030-135 = "Конечно! Фестиваль вот-вот откроется."
51030-136 = "[s] «Но это ощущается иначе, чем другие фестивали Хяккияко, которые я видел.»"
51030-137 = ""
51030-139 = ""
51030-140 = "У вас острый глаз, Сенсей, раз вы поняли это с первого взгляда."
51030-141 = "В этом фестивале действительно есть кое-что особенное..."
51030-142 = "Впервые за двадцать лет... проводится Фестиваль фонарей Хяккияко!"
51030-145 = "С ним связана старая история..."
51030-146 = "Давным-давно Хяккияко восстала из пепла конфликта, переродившись в союз."
51030-149 = "Но шрамы раздоров не исчезают легко."
51030-150 = "Поэтому человек, который в те времена возглавлял Хяккияко, предложил академии провести фестиваль фонарей..."
51030-153 = "Чтобы, отпуская фонари в небо, люди одновременно отпускали свою боль. Так всех объединило бы общее видение лучшего будущего..."
51030-154 = "[s] «Но почему фестиваль не проводили двадцать лет?»"
51030-155 = "Эм, это..."
51030-156 = "Это история ещё до моего рождения... Поэтому я не уверена..."
51030-157 = ""
51030-162 = "Ха-ха-ха! Да это не главное!"
51030-163 = ""
51030-166 = ""
51030-167 = "П-Простите?!"
51030-169 = "Вы сотрудники фестиваля? Или туристы, приехавшие чуть раньше?"
51030-170 = "В любом случае, посмотрите на нашу подготовку! Красота, а?"
51030-171 = "[s] «А, да... Красиво.»"
51030-172 = "Не знаю, почему раньше фестиваль прекратили проводить, но замечательно, что он вернулся."
51030-173 = "Ага! Что бы кто ни говорил, Хяккияко — академия фестивалей!"
51030-174 = "Кажется, с того самого дня у нас вообще не было фестивалей... Наверное, поэтому мы и вкалываем вдвое усерднее, лишь бы появился повод отпраздновать!"
51030-175 = ""
51030-178 = "Мы так заняты, что принимаем помощь буквально от любого прохожего, ха-ха-ха!"
51030-179 = "Фестивальный отдел работал день и ночь, чтобы вернуть этот фестиваль к жизни. Президент с головой ушла в подготовку — её энергия вдохновляет!"
51030-180 = ""
51030-182 = ""
51030-184 = "Президент Фестивального отдела, говорите..."
51030-185 = "[s] «Шизуко усердно работает.»"
51030-187 = "Говорят, во время фестиваля знаменитая мико проведёт ритуал!"
51030-188 = "А, так вы тоже об этом слышали!"
51030-189 = "Это должно стать главным событием Фестиваля фонарей Хяккияко! Весь район гудит от предположений..."
51030-190 = ""
51030-192 = ""
51030-193 = ""
51030-194 = ""
51030-195 = ""
51030-196 = "Я знаю, все рады фестивалю, но..."
51030-197 = "Хяккарёран заслуживает большего, чем просто исчезнуть в..."
51030-198 = ""
51030-202 = "Юная госпожа! Мне сообщили, что вы сбежали из особняка после оглашения Декларации о роспуске!"
51030-203 = "Так вот где вы укрылись!"
51030-204 = ""
51030-206 = ""
51030-207 = "...Ух!"
51030-208 = ""
51030-211 = ""
51030-212 = "[ns] «...А?»"
51030-214 = "Уже здесь...! У меня нет выбора!"
51030-215 = "Кхм. Сенсей из Шале. Примите мою глубочайшую благодарность за сегодняшнюю помощь. За оказанную мне услугу я, Юкари, буду всегда благодарна и..."
51030-216 = ""
51030-218 = ""
51030-219 = "*пых* *пых*! Юная госпожа! Подождите меня!"
51030-220 = "...и простите, мне пора!"
51030-221 = "Жаль первой покидать сцену, но пришло время эффектно исчезнуть!"
51030-222 = ""
51030-224 = ""
51030-225 = "Госпожа! Госпожа! Не нужно так спешить! Госпожа?!"
51030-226 = ""
51030-228 = ""
51030-231 = "[ns] «Это было... быстро.»"
51030-234 = "Следующий эпизод; Из Клуба Инь-Ян"
