[translation]
10050020-1 = "Эпизод 2;Берегите книги"
10050020-2 = "?!?!"
10050020-3 = ""
10050020-9 = "Н-Нагиса? НАГИСА?!?!"
10050020-10 = ""
10050020-12 = ""
10050020-13 = "Ч-что это за книга?!?!"
10050020-14 = "Что ты имеешь в виду?!"
10050020-15 = "Ах. Ты ведь говорила, что ещё не успела её открыть. Проще будет, если посмотришь сама."
10050020-16 = "Да. Да..."
10050020-17 = ""
10050020-19 = ""
10050020-20 = "О-о боже!"
10050020-21 = "Да. Думаю, теперь ты понимаешь всю серьёзность ситуации."
10050020-22 = "Пожалуйста, точно следуй моим указаниям! Нельзя упустить ни одной детали."
10050020-24 = "Я должна сама связаться с Сенсеем! Это единственно верный путь!"
10050020-25 = "Есть! Поняли!"
10050020-26 = ""
10050020-28 = ""
10050020-29 = "(Н-но мне понравилось...)"
10050020-30 = "(Особенно та сцена и ТА сцена...)"
10050020-34 = "[ns1] «Ты сказала, что это важно, поэтому я пришёл так быстро, как смог.»\n[ns2] «Что случилось, Нагиса? Ты говорила так серьёзно...»"
10050020-37 = "Добро пожаловать, Сенсей. Для начала я хотела бы извиниться, что так внезапно отняла у вас время из плотного расписания."
10050020-38 = "[s] «Я к этому привык.»"
10050020-39 = "Перейду прямо к делу."
10050020-40 = "Тринити столкнулась с угрозой, какой ещё никогда не видела!"
10050020-41 = "[s] «С чего вдруг?! На вас напали?»"
10050020-42 = "Если бы всё было так просто. Этот враг гораздо коварнее."
10050020-43 = "На самом деле какое-нибудь открытое проявление военной силы было бы предпочтительнее. Осязаемая угроза для Тринити — не угроза."
10050020-44 = "Но ЭТО! Кто-то пытается расшатать Тринити изнутри! Троянский конь!"
10050020-45 = "О чём я говорю? Я говорю о... ВОТ ЭТОМ!"
10050020-46 = ""
10050020-48 = ""
10050020-50 = "[ns3] «Разве это не просто книга?»\n[ns4] «Похоже на мангу с невзрачной обложкой.»"
10050020-53 = "Верно. Но, как и в любой книге, главное — содержание."
10050020-54 = "Пожалуйста, взгляните."
10050020-55 = ""
10050020-59 = "[ns5] «(...? Ничего особенного.)»\n[ns6] «(Так даже это для Тринити слишком откровенно...)»"
10050020-62 = "Это явно попытка подорвать ценности и традиции Тринити, исподволь... Я хочу сказать! Они пытаются поощрять в Тринити неподобающее поведение!"
10050020-63 = "Это единственное возможное объяснение существованию этой несанкционированной книги!"
10050020-64 = ""
10050020-70 = "Здравствуйте, Нагиса. О! Сенсей, вы тоже здесь!"
10050020-71 = "[s] «О! Привет, Шимико!»"
10050020-72 = "Привет, Шимико. Однако я надеялась поговорить с Уи..."
10050020-73 = "..."
10050020-74 = "Ах, понятно. Я всё понимаю. Спасибо за твою тяжёлую работу, Шимико."
10050020-75 = "Да, Нагиса. Спасибо за понимание. И всё же, могу я чем-нибудь помочь?"
10050020-76 = "Дело в этой книге. Ты знаешь о ней, Шимико?"
10050020-77 = "Эта? Она распространилась по Тринити как лесной пожар — правда, довольно скрытно."
10050020-78 = "Да. Тогда, чтобы добраться до сути этой катастрофы: ты знакома с её содержанием?"
10050020-79 = "..."
10050020-80 = "(Я ЕЁ читала, но чувствую, сейчас не лучшее время в этом признаваться...)"
10050020-81 = "Нет, мэм. До моего стола она пока не дошла."
10050020-82 = "Я и сама узнала о ней лишь недавно, так что можно предположить, что её зловещие щупальца ещё не охватили всю Тринити."
10050020-83 = "Для начала я совершенно уверена, что её привезли из другого района."
10050020-84 = "Согласна. В Библиотечном комитете действует тщательная процедура проверки новой литературы в Тринити."
10050020-85 = "Но пока это всё, что нам известно. Нам не удалось добыть никакой информации о происхождении книги."
10050020-86 = "Подводя итог, Тринити сейчас под огнём! Враг начал по-настоящему хитроумную психологическую атаку на наших студентов!"
10050020-87 = "Внешние силы замышляют уничтожить Тринити, а вместе с ней и всех нас!"
10050020-88 = ""
10050020-90 = ""
10050020-91 = "Эм, Сенсей? Кажется, её понесло..."
10050020-92 = "[s] «Когда она такая, остановить её немного сложно...»"
10050020-93 = "Это правда..."
10050020-94 = "Поэтому наш высший приоритет — установить, кто распространяет эту книгу. Это прямая угроза безопасности всего нашего района."
10050020-95 = "Есть ещё один вопрос, который я должна затронуть. Поскольку мы подтвердили, что книга поступила извне..."
10050020-96 = "...Чаепитию будет трудно вмешаться напрямую."
10050020-97 = "Не зная, кто к этому причастен, наше вмешательство может вызвать дипломатические проблемы."
10050020-98 = "Изначально я хотела поручить операцию Комитету правосудия..."
10050020-99 = "Однако такая эскалация может вызвать тревогу среди студентов. Тогда мы сыграем прямо на руку врагу."
10050020-100 = "Поэтому Библиотечный комитет, лучше всех знакомый с контролем распространения материалов в Тринити, показался подходящим выбором."
10050020-101 = "Именно поэтому я просила помощи Уи..."
10050020-102 = "Я снова у тебя в долгу, Шимико."
10050020-103 = "Понятно. Что именно нужно сделать Библиотечному комитету?"
10050020-104 = "Расследовать источник. Определить масштаб операции и то, какое влияние она уже оказала на Тринити."
10050020-105 = "И пожалуйста... Разберитесь с этим вопросом предельно осторожно."
10050020-106 = "..."
10050020-107 = "В некоторых вещах ты совсем не меняешься, Нагиса."
10050020-108 = "Что ты имеешь в виду?"
10050020-109 = "Ах, ничего."
10050020-110 = "Хм...? Как бы то ни было, одному Библиотечному комитету не хватает ресурсов, чтобы справиться с этой угрозой."
10050020-111 = "Поэтому я предоставлю тебе право при необходимости задействовать Комитет правосудия."
10050020-112 = "Понятно. Хотя позволить Комитету правосудия возглавить операцию было бы проблематично..."
10050020-113 = "...их работа вместе с Библиотечным комитетом создаёт куда лучшее впечатление."
10050020-114 = "Как всегда быстро схватываешь, Шимико."
10050020-115 = "Итак, мы, Чаепитие, хотели бы официально, но без лишнего шума поручить это дело Сенсею и Шимико."
10050020-116 = "Считайте, что ресурсы Тринити в вашем распоряжении. И ещё раз — действуйте незаметно."
10050020-117 = "Поняла, Нагиса."
10050020-118 = "Пока что я временно приглашу Шимико в Комитет правосудия в качестве консультанта. Думаю, этот титул поможет вам в работе."
10050020-119 = "С-Спасибо..."
10050020-120 = ""
10050020-127 = "Привет-привет, Наги! Я пришла попить чаю! Но... А? Сенсей?!"
10050020-128 = "Мика?"
10050020-129 = "[s] «Добро пожаловать, Мика.»"
10050020-130 = "А, э, эм, да! Ага, спасибо. Привет, Сенсей. Я не знала, что вы здесь. Я бы немного иначе уложила волосы... может, получше подготовилась..."
10050020-131 = "[s] «Ты мне нравишься такой, какая ты сейчас, Мика.»"
10050020-132 = "Ик?! Боже, от этих слов у меня сердце ёкнуло..."
10050020-133 = "(Соберись, Мика. Сенсей совсем не это имеет в виду! Совсем!)"
10050020-134 = "Привет, Сенсей. И Мика. Чтобы уточнить: Сенсей не вкладывал в это ничего особенного. Пожалуйста, имей хоть немного здравого смысла, чтобы понимать хотя бы это."
10050020-135 = "Ну вот! Сейя опять ведёт себя как Сейя. ★"
10050020-136 = "Так о чём вы тут говорили? Об этой книге? Она новая?"
10050020-137 = "НЕЕЕЕЕТ!!!"
10050020-138 = ""
10050020-140 = ""
10050020-143 = "[ns] «Н-Нагиса?!»"
10050020-145 = "Эй, успокойся, Наги! Я просто хочу посмотреть!"
10050020-146 = "П-прости за внезапный крик, Мика. Но эта книга... Она... Она... Она нехорошая, Мика!"
10050020-147 = "Это какие?"
10050020-148 = "Ну-ну..."
10050020-149 = "Эта книга — разновидность апокрифа, которую Сестринство запросило у Библиотечного комитета через Чаепитие."
10050020-150 = "А? Сестринство? Ну, тогда понятно. Ладненько."
10050020-151 = "Вообще с ними лучше лишний раз не связываться..."
10050020-152 = "...Это не было чересчур, Нагиса?"
10050020-153 = "Мике ещё слишком рано читать такое!"
10050020-154 = "Хотя я понимаю твои чувства... Ты кудахчешь, как чрезмерно опекающая наседка."
10050020-155 = "Эй! Ненавижу, когда вы держите от меня секреты и оставляете меня в стороне. Наги! Сейя!"
10050020-156 = "И ты до сих пор не извинилась, Наги! Это было грубо! Невоспитанно!"
10050020-157 = "Неужели меня отчитывает за манеры... Мика? Мне надо присесть..."
10050020-158 = "Это ещё что должно значить? ★"
10050020-159 = "[s] «В этот раз я на стороне Мики...»"
10050020-160 = "Ура! Спасибо, Сенсей! Вы лучший. ♡"
10050020-161 = "Ах. Поняла. Простите, Сенсей."
10050020-163 = "Не ожидала встретить там всё Чаепитие. Нервы до сих пор шалят."
10050020-164 = "Вы в порядке, Сенсей? Выглядите немного..."
10050020-165 = "[s] «От одного этого разговора у меня несварение...»"
10050020-166 = "А? А-а... Если живёшь здесь, к их манерам привыкаешь."
10050020-167 = "Но я понимаю, почему для вас они могут быть немного утомительными, Сенсей."
10050020-168 = "[s] «Ты правда ничего не знаешь об этой книге, Шимико?»"
10050020-169 = "А? Вы о чём...?"
10050020-170 = "..."
10050020-171 = "Вы правы, Сенсей. Я член Библиотечного комитета Тринити."
10050020-172 = "А как член комитета я обязана выяснять правду обо всех книгах, которые распространяются в Тринити."
10050020-173 = "Конечно, я читала её не против своей воли. Мне её посоветовала подруга."
10050020-174 = "[s] «...Можно спросить, сколько ты уже прочитала?»"
10050020-175 = "Всю."
10050020-176 = "[s] «Ты даже не задумалась!»"
10050020-177 = "Конечно нет. Зачем мне скрывать это от вас, Сенсей?"
10050020-178 = "А? Есть ли у меня твёрдое мнение о содержании? Хм, ну..."
10050020-179 = "Я думаю, это серая зона. Открыто обсуждать и продвигать такое было бы табу..."
10050020-180 = "...но и для запрета оснований недостаточно."
10050020-181 = "[s] «Полностью согласен.»"
10050020-182 = "Да. Вообще сама мысль, что старшеклассницы совершенно не интересуются подобными темами, довольно смешна."
10050020-183 = "Как человек, много работающий с книгами, я на самом деле была очень впечатлена их... скажем так, навыками редактирования."
10050020-184 = "Намеренные вырезки... Выдающаяся работа."
10050020-185 = "А? Вас удивляет, насколько спокойно я к этому отношусь?"
10050020-186 = "..."
10050020-187 = "Сенсей. В старой библиотеке Тринити хранится очень, очень много книг."
10050020-188 = "[s] «Я это уже знаю.»"
10050020-189 = "Верно? Тогда как думаете, сколько среди этих книг, как бы это сказать... не совсем «для детей»?"
10050020-190 = "[s7] «...?»\n[s8] «...!»"
10050020-193 = "Да. Именно."
10050020-194 = "Значит, все члены Библиотечного комитета в какой-то мере привычны к вещам такого рода?"
10050020-195 = "Не могу говорить за всех, чтобы не порочить их честь, но что касается меня..."
10050020-196 = "Можно сказать, я уже привыкла."
10050020-197 = "Я считаю, что здесь рассматривается куда более фундаментальный вопрос. Книга сама по себе — это средство передачи записанной информации."
10050020-198 = "Как мы вообще можем судить, что следует помнить, а что — нет? И кто мы такие, чтобы считать, будто имеем на это право?"
10050020-199 = "Если у каждого есть неотъемлемые права, которых его нельзя лишать, то, думаю, с книгами всё так же."
10050020-200 = "В каком-то смысле я вижу в книгах воплощение человеческой души!"
10050020-201 = "[s] «Поэтому видеть, как кто-то настолько жестоко поносит книгу...»"
10050020-202 = "Да. Их нужно заставить осознать, что они делают, даже если для этого придётся стукнуть их по голове."
10050020-203 = "Как и в случае, когда кто-то переходит черту: мы наказываем и исправляем его, чтобы он задумался над своими поступками."
10050020-205 = "...Этот разговор ещё раз подтвердил то, что я и так знала: никогда не злите Шимико."
