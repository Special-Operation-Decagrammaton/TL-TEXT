10051070-165 = "А? Вы обо мне знаете?"
10051070-167 = "Это благодаря «Мичиручи: свиток девушки-ниндзя»...?! Вы подписались? Потому что, знаете, если не подписаться, алгоритм—"
10051070-168 = "Свиток ниндзя... что?"
