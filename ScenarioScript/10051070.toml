[translation]
10051070-1 = "Эпизод 7;Незнакомая пустота"
10051070-2 = "Съёмочная площадка «Мичиручи: свиток девушки-ниндзя»"
10051070-3 = "Ня-ха-ха, да, это я."
10051070-4 = "Камера, парадная одежда... Мне так приятно видеть, что вы хорошо пользуетесь тем, что одолжил вам Клуб Инь-Ян."
10051070-5 = ""
10051070-7 = ""
10051070-8 = "Ния...!"
10051070-9 = "Вы пришли забрать платья?!"
10051070-10 = "Ня-ха-ха, нет. Можете вернуть их, когда захотите... и когда у вас появится запасной комплект одежды."
10051070-11 = "Тогда, может быть, вы пришли учиться?"
10051070-12 = "Добро пожаловать, Ния! Путь ниндзя всегда открыт для вас! Нин-нин!"
10051070-13 = "Нет, и не за этим..."
10051070-15 = "Тогда что привело сюда президента Клуба Инь-Ян?"
10051070-16 = "Ну, скажем так, я просто проходила мимо..."
10051070-17 = "Но хватит обо мне. Не могу не заметить, что Цукуё здесь нет. Как я и ожидала."
10051070-18 = "Ага. До неё трудно дозвониться, и она немного опаздывает..."
10051070-19 = ""
10051070-21 = ""
10051070-22 = "Но погодите. «Как и ожидали»? Что вы имеете в виду?"
10051070-24 = "Ах, я слышала, что Цукуё покидает Клуб исследования ниндзюцу."
10051070-25 = ""
10051070-27 = ""
10051070-28 = ""
10051070-29 = "Что?!"
10051070-30 = "Ч-что вы сказали?!"
10051070-31 = "Так вы ещё не слышали. Как неловко."
10051070-32 = "Ну, я предполагала, что такое может случиться. В конце концов, вас двоих, похоже, интересуют только... ниндзя..."
10051070-33 = "Стоп-стоп-стоп. Цукуё уходит из Клуба исследования ниндзюцу? С чего вы вообще это взяли?"
10051070-34 = "Я президент. Она бы сказала мне, если бы собиралась—"
10051070-35 = "Мичиру, ты случайно не читаешь «Ron-ro» или «Heart Girls»?"
10051070-36 = "Что это? Манга?"
10051070-37 = "Тогда о «BiBi» ты, вероятно, тоже не знаешь... А социальные сети? Ты следишь за новостями?"
10051070-38 = "Социальные сети? Эм... У меня есть канал. Мы... иногда получаем... комментарий."
10051070-39 = "Хм, понятно-понятно. Тогда ТОТ прямой эфир ты точно пропустила."
10051070-40 = "Прямой эфир? Какой эфир?"
10051070-41 = "М-м... Проще просто показать. Это на канале Кронос, если знаешь такой."
10051070-42 = ""
10051070-44 = ""
10051070-47 = "И последний вопрос. Мир должен знать! Быстро, одним предложением! Расскажите о своих планах на будущее."
10051070-48 = "Я-Я продолжу стараться стать в-великой фотомоделью...?"
10051070-49 = "А все мы в Кронос желаем только успеха модельной карьере Цукуё!"
10051070-50 = ""
10051070-53 = ""
10051070-54 = "Эм..."
10051070-55 = "Эм... Э-э..."
10051070-56 = "Цукуё? Что она говорит? Модель? Она говорит, что продолжит... работать моделью?"
10051070-57 = "Президент..."
10051070-58 = "..."
10051070-59 = "Эм... Почему? Нет, с каких пор...?"
10051070-60 = "Я слышала, что Цукуё прошлась по подиуму во время модного показа."
10051070-61 = "Хотя она была экстренной заменой, она произвела настоящий фурор среди модных критиков и людей из индустрии."
10051070-62 = "Агентство Шайнкэт завербовало Цукуё сразу после этого."
10051070-63 = "...Ты ПРАВДА ничего не знала, Мичиру?"
10051070-64 = "..."
10051070-65 = "Я... правда не знала."
10051070-66 = "...Понятно. Похоже, на сегодня разговоров достаточно."
10051070-67 = "Прошу меня извинить."
10051070-68 = ""
10051070-70 = ""
10051070-71 = "Президент... Цукуё..."
10051070-72 = "Изуна, помнишь, как выглядела Цукуё на сцене?"
10051070-73 = "...Да."
10051070-74 = "Ну как вам?"
10051070-75 = "...Она выглядела прекрасно."
10051070-76 = "И?"
10051070-77 = "И... Эм..."
10051070-78 = "Казалось, будто она в другом мире и именно там ей место."
10051070-79 = "...!"
10051070-80 = "Мы смотрели снизу сцены, из самого тёмного уголка..."
10051070-81 = "...а Цукуё стояла высоко, в самой яркой части подиума."
10051070-82 = "Но, Президент... Разве сердце ниндзя не сияет ярче всего в самых тёмных местах?"
10051070-83 = "Верно, но... Нет, может, именно поэтому Цукуё решила..."
10051070-84 = ""
10051070-86 = ""
10051070-87 = "Ах да. Ещё кое-что, девушки."
10051070-88 = "Ик!"
10051070-89 = "Вы всё ещё здесь?!"
10051070-90 = "Да. Я поняла, что так и не сказала вам НАСТОЯЩУЮ причину, почему оказалась здесь, ня-ха-ха."
10051070-91 = "Причину? Это была не случайная встреча?"
10051070-92 = "Фу-фу, это была НАМЕРЕННАЯ случайность."
10051070-93 = "Вы говорите бессмыслицу...!"
10051070-94 = "Если случайность намеренная, то это уже не случайность!"
10051070-95 = "Фу-фу, это называется «дипломатическая риторика». Поищи в словаре."
10051070-96 = "В любом случае, раз уже очевидно, что Цукуё не сможет прийти на съёмку..."
10051070-97 = "Я привела специального помощника по съёмке, чтобы восполнить нехватку рук!"
10051070-99 = "«Помощника по съёмке»...?!"
10051070-100 = "Эм, Ния, я искренне благодарна за вашу необычную и подозрительную доброту..."
10051070-101 = "Но Цукуё нельзя просто заменить—"
10051070-102 = ""
10051070-106 = ""
10051070-107 = "[ns] «Здравствуйте. Сегодня я буду помогать.»"
10051070-108 = "Аааааа!!!"
10051070-109 = "Мой господин!"
10051070-110 = "Что за?! Нельзя просто так подбегать сзади! Что это было?!"
10051070-111 = "[s1] «Это была своего рода засада.»\n[s2] «Разве одна засада до официального представления не разрешена?»"
10051070-114 = "Как и ожидалось от достопочтенного Сенсея! Вы запомнили мой урок—"
10051070-115 = "Стоп, нет, не в этом дело...! Ния, вы завербовали Сенсея нам в помощники по съёмке? Как?!"
10051070-116 = "Ня-ха-ха, не будем переживать о таких мелочах."
10051070-117 = "Ну, причину своего прихода я объяснила, так что пойду. Теперь уже правда."
10051070-118 = ""
10051070-120 = ""
10051070-121 = "Ура! Мой господин! Рада вас видеть!"
10051070-122 = "Изуна ещё счастливее, потому что это был сюрприз! Нин-нин!"
10051070-123 = "Итак, достопочтенный Сенсей работает у нас помощником по съёмке..."
10051070-124 = "Вот уж неожиданность..."
10051070-125 = "Тогда... Эм... Пожалуй, можем начинать запись..."
10051070-126 = "Хм? Разве можно снимать без Цукуё?"
10051070-127 = "Конечно нельзя... но она с нами не разговаривает, и мы не знаем, где она... Но шоу должно продолжаться, да?"
10051070-128 = "[s3] «Я тоже не знаю, где Цукуё...»\n[s4] «Но знаю, как с ней связаться.»"
10051070-131 = "Что?!"
10051070-132 = "Правда, мой господин?!"
