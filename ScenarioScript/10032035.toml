[translation]
10032035-3 = "...На этом почти всё. Мы вырубили всех, кого не было в списке гостей."
10032035-4 = "Здесь был настоящий цирк! Сколько людей мы вообще избили?"
10032035-5 = "У этого Аранчино столько врагов..."
10032035-6 = "У боссов банд их обычно немало, знаешь ли."
10032035-7 = "Но должна признать... Мы собрали просто безумную гору бомб."
10032035-8 = "С такой огневой мощью можно половину Кивотоса взорвать!"
10032035-9 = "Я-я пока выбросила всё в мусорный контейнер в переулке сзади..."
10032035-10 = "Последнее, что осталось в нашем списке..."
10032035-11 = ""
10032035-13 = ""
10032035-15 = ""
10032035-16 = "Вот она. Это последняя комната."
10032035-17 = "[s1] «Нам вообще можно заходить в гримёрную...?»\n[s2] «Разве артисты сейчас не готовятся к выступлению?»"
10032035-20 = "Сенсей такой внимательный! Вы переживаете об их чувствах и всё такое, да?"
10032035-21 = "Но вообще-то они правы. Если все пятеро ворвёмся туда прямо перед началом представления, радушного приёма не будет."
10032035-22 = "Эм... Если внутри есть оперативники, всё равно начнётся драка. Так что в любом случае разницы особо нет."
10032035-23 = "Что будем делать, босс? Идём напролом?"
10032035-25 = "Нам не нужно привлекать к себе лишнее внимание."
10032035-26 = "Мы с Каёко пойдём вдвоём. Так будет проще не попадаться на глаза."
10032035-27 = "Учитывая, что мы одеты соответственно случаю, никто и глазом не моргнёт при виде двух красивых студентов, гуляющих вокруг. А вот Сенсей..."
10032035-28 = "Муцуки и Харука будут охранять Сенсея, пока мы не вернёмся."
10032035-30 = "Просто свяжитесь с нами, если понадобимся!"
10032035-31 = "Да, конечно! Мы защитим Сенсея всем сердцем и душой! Никто даже дышать в их сторону не посмеет!"
10032035-33 = "Отлично. Если вы не против подождать, Сенсей..."
10032035-34 = "...А? Ко мне?"
10032035-35 = "Хи-хи. Я ценю заботу, но настоящему преступнику она ни к чему."
10032035-36 = "Я вернусь раньше, чем ты успеешь заметить."
10032035-37 = "Пора начинать, Каёко."
10032035-38 = ""
10032035-40 = ""
10032035-42 = ""
10032035-43 = ""
10032035-44 = "...Я вернусь, Сенсей."
10032035-45 = "Если что-нибудь случится, коммуникатор у вас с собой, верно?"
10032035-46 = "[s3] «Вот он.»\n[s4] «И ты тоже будь осторожна, хорошо?»"
10032035-49 = "...Хи-хи."
10032035-50 = "...Хорошо."
10032035-51 = ""
10032035-53 = ""
10032035-60 = ""
10032035-61 = "[ns5] «С возвращением, Ару! Каёко!»\n[ns6] «Вы вернулись! Ну как всё прошло?»"
10032035-64 = "Более-менее как мы и ожидали. Ни бомб, ни подозреваемых."
10032035-65 = "Ну, мы не то чтобы подтвердили личность каждого актёра."
10032035-66 = "Охраны было слишком много, да и вокруг царил хаос. Мы не могли просто ходить и допрашивать артистов."
10032035-67 = "Оперативнику было бы почти невозможно проникнуть в гримёрную, если только он сам не артист."
10032035-68 = "Но мы сверили их список с нашим, и всё совпадает."
10032035-70 = "Ура! Значит, проверка Оперного театра завершена!"
10032035-71 = "Дальше у нас—"
