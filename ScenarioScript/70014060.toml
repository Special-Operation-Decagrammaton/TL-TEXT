[translation]
70014060-1 = "Странствия аптекаря 6"
70014060-2 = "Поучиться?"
70014060-3 = "[ns] «Да. Ты умная, Кай»."
70014060-4 = ""
70014060-7 = "[ns1] «То, на что люди опираются в жизни...»\n[ns2] «То, на чём строят своё существование, и всё подобное...»"
70014060-10 = "[ns3] «Обо всём этом есть учебники и научные статьи».\n[ns4] «...Всё, что накопило человечество к этому моменту».\n[ns5] «В мире ещё так много неизведанного»."
70014060-14 = "Вы предлагаете мне изучить привычные методы «других людей»? Сейчас?"
70014060-15 = "[s] «Именно»."
70014060-16 = "..."
70014060-17 = ""
70014060-19 = ""
70014060-20 = "В теории я с ними знакома. Но такой традиционный подход мне не даётся естественным образом."
70014060-21 = "...В каком-то смысле это похоже на необходимость постоянно помнить, что нужно дышать, и сознательно продумывать каждый вдох, словно от этого зависит твоя жизнь."
70014060-22 = "...Хотя для других дыхание естественно с самого рождения."
70014060-23 = "Вы предлагаете мне запомнить старые методы и научиться дышать по ним, Сенсей?"
70014060-24 = "[s] «Да. Именно так»."
70014060-25 = "А если я откажусь?"
70014060-26 = "У меня есть причины. Ведь для меня этот процесс был бы настоящей пыткой."
70014060-27 = "Каждый имеет право отказаться от страданий. Или я не права?"
70014060-28 = "[s6] «...Да. Поэтому я не могу тебя заставить, Кай».\n[s7] «Но мне бы хотелось, чтобы ты попробовала»."
70014060-31 = "Почему...?"
70014060-32 = "[s] «Нельзя ожидать другого результата, если действовать теми же методами, верно?»"
70014060-33 = "Ах."
70014060-34 = "Кхе-хе-хе... Тут вы меня поймали."
70014060-35 = "Давайте сразу кое-что проясним, Сенсей."
70014060-36 = "Я не исправилась и никогда не исправлюсь."
70014060-37 = "[s] «Ну... Не думаю, что это будет легко»."
70014060-38 = ""
70014060-41 = "[ns] «И всё же мне хочется, чтобы ты хотя бы раз попробовала побыть студентом»."
70014060-42 = "..."
70014060-43 = "Понятно."
70014060-50 = "О, вы уже уходите?"
70014060-51 = "[s8] «Да. Спасибо вам за всё».\n[s9] «Берегите себя, пожалуйста»."
70014060-54 = "Ха-ха-ха... Не беспокойтесь. Теперь я совершенно здорова."
70014060-55 = "Да и Кай всегда мне очень помогает."
70014060-56 = "...Ну, сейчас мне особо нечем заняться."
70014060-57 = "В конце концов, я ведь пыталась забрать ваш дом, верно?"
70014060-58 = "Ох, ты всё ещё об этом? Не переживай. Если он тебе так нужен, можешь забрать хоть сейчас."
70014060-59 = "Это старое тело сумело дожить до сегодняшнего дня. Неужели думаешь, я не смогу позаботиться о себе, куда бы ни отправилась?"
70014060-60 = ""
70014060-62 = ""
70014060-63 = "...Мне уже неинтересно."
70014060-64 = "О. Вот как."
70014060-66 = "Кай, старушка и Чёрный рынок остались позади."
70014060-67 = "В голове крутились слова Кай."
70014060-68 = "И всё это время мысли возвращались к другому студенту, за которого было тревожно..."
70014060-69 = "С непривычной тяжестью в ногах пришлось отправиться в Шале."
70014060-73 = "Ну как, съедобно?"
70014060-74 = "Ха-ха... Так ты ещё и готовить умеешь."
70014060-75 = "По сути, это больничная еда. Пресная, нежирная, поэтому многим не нравится."
70014060-76 = "Более чем достаточно. Даже приятно, что желудку так легко."
70014060-77 = "Но... Почему ты вдруг решила сделать что-то подобное?"
70014060-78 = "Ну, ничего особенного. Просто..."
70014060-79 = ""
70014060-81 = ""
70014060-82 = "..."
70014060-83 = "Захотелось немного сменить обстановку. Решила попробовать научиться дышать так же, как все остальные."
70014060-84 = "Похоже, я как раз нашла подходящего «подопытного»."
70014060-86 = "Странствия аптекаря"
