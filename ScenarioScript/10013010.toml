[translation]
10013010-1 = "Эпизод 1;Нужно сделать одну вещь!"
10013010-6 = "Все, остановитесь! Стойте!"
10013010-7 = "А? Аяне?"
10013010-8 = "Аяне?! Разве ты не должна сейчас отвозить Сенсея?"
10013010-9 = "Она пленница этих злодеев."
10013010-10 = "Ох, боже. Этого мы не допустим."
10013010-12 = "П-Пожалуйста, остановитесь хотя бы на секунду!"
10013010-14 = "Сенсей! Вы знаете этих преступниц?!"
10013010-15 = "[s] «М-Может быть?»"
10013010-16 = "П-Потрясающе! У господина даже есть связи с плохими людьми."
10013010-17 = "А?! Это кого ты называешь плохими? Здесь хорошие — мы!"
10013010-18 = "[s] «Давайте, эм, все на минутку остановимся, хорошо?»"
10013010-20 = "Я успокоил ситуацию и всех представил."
10013010-22 = "Так... люди в масках — студенты старшей школы Абидос?"
10013010-23 = "Маски — реквизит для фестиваля?! Может, они отражают уникальную культуру Абидоса?!"
10013010-24 = "Я слышала о замечательном фестивале в Геенне, где студенты надевают декоративные маски, но эти даже лучше! Правда, босс?"
10013010-26 = "П-Пожалуйста, хватит придумывать странные вещи о нашей школе..."
10013010-28 = "Сколько раз мне повторять! Называй меня «президент»!"
10013010-29 = "Но что мы вообще сделали Абидосу? Почему вы на нас напали?"
10013010-30 = "Разве это не наша реплика?!"
10013010-31 = "Сенсей, почему вы водитесь с ними? Отдел проведения фестивалей — злые преступники, стоящие за Охотой на курорты!"
10013010-32 = "Сколько раз вам повторять, что это не мы?!"
10013010-33 = ""
10013010-35 = ""
10013010-36 = ""
10013010-37 = ""
10013010-39 = ""
10013010-40 = "Может, обсудим всё за чашкой чая."
10013010-41 = "Я-я могу заварить чай!"
10013010-43 = ""
10013010-46 = ""
10013010-48 = "Сенсей. Звонит президент Ния."
10013010-49 = ""
10013010-51 = ""
10013010-52 = "Ня-ха-ха! Скучали? Надеюсь, вы там не слишком веселитесь без меня."
10013010-53 = "Я волновалась, что с вашей маленькой компанией могло что-то случиться. Представляете, сколько бумажной работы на меня бы свалилось?"
10013010-54 = "[s] «Звучит так, будто тебе скорее весело, чем тревожно...»"
10013010-55 = "Ну тогда развлеките меня. Случилось что-нибудь интересное? Какой-нибудь переполох?"
10013010-56 = "Не твоё дело! Это ты сказала, цитирую: «Я слишком важна и слишком занята, чтобы помогать.»"
10013010-57 = "Хи-хи-хи! Очень в стиле Шизуко. Сначала стрелять, потом задавать вопросы."
10013010-58 = "Ладно, хватит дразнить."
10013010-59 = "Я не просто сидела сложа руки. Я немного всё расследовала."
10013010-60 = "Кавава Шизуко. Я знаю, во что ты вляпалась своими милыми маленькими ножками! ♪"
10013010-61 = ""
10013010-64 = ""
10013010-66 = ""
10013010-67 = "Что ты имеешь в виду? Во что я вляпалась?"
10013010-68 = "Я подтвердила, что недавно у Момоёдо были крупные деловые операции. Похоже на правду?"
10013010-69 = "Что?! Не суй свой коварный нос в мои дела!"
10013010-70 = "[s] «Что именно это была за операция?»"
10013010-71 = "Спасибо за вопрос, Сенсей! Отдел проведения фестивалей вложился в один особый продукт при помощи взносов от разных клубов Хяккияко."
10013010-72 = "[s] «Шизуко... вложилась...»"
10013010-73 = "К сожалению, по крайней мере для вас, всё это было мошенничеством."
10013010-75 = "М-м-мошенничеством?"
10013010-76 = "В документе сказано, что Отдел проведения фестивалей официально приобрёл права на курорт «Потерянный рай», но..."
10013010-77 = "Курорт «Потерянный рай» закрылся двадцать лет назад."
10013010-78 = "...?!"
10013010-79 = "Но не волнуйся, ты не единственная дурочка, которую обманули."
10013010-80 = "Разве Абидос тоже не попался?"
10013010-81 = "В-Верно! Мы выиграли то, что я считала полностью оплаченным отпуском, и приехали сюда..."
10013010-82 = "Сенсей... Сенсей был прав? Права есть не только у нас?"
10013010-83 = "Смотрите, здесь Отдел проведения фестивалей указан как владелец."
10013010-84 = ""
10013010-86 = ""
10013010-87 = ""
10013010-89 = "«Владелец курортов „Потерянный рай“: Объединённый отдел проведения фестивалей Академии Хяккияко»...?"
10013010-90 = "Наверняка это подделка. С чего бы наше название было в чужом документе?"
10013010-91 = ""
10013010-93 = ""
10013010-94 = "Н-Но...! Это же наша печать?! Как она здесь оказалась?"
10013010-95 = "Шизуко, тебя очень основательно провели."
10013010-96 = "Контракт, который вы купили, также раздали другим группировкам, а из-за лазейки в контракте..."
10013010-97 = "[s] «...началась Охота на курорты.»"
10013010-98 = "Из мрачного любопытства: у кого вы купили права?"
10013010-99 = "Сенсей..."
10013010-101 = "Вот печать. Теперь всё в порядке?"
10013010-102 = "Ха-ха-ха! Вы официально вложили средства Отдела проведения фестивалей в специальный инвестиционный продукт Банка «Осьминог»."
10013010-103 = "Этим летом вы будете управлять Пляжной хижиной в «Потерянном раю», многофункциональном курортном комплексе! Умное решение! Это самое безопасное вложение, какое вы могли выбрать."
10013010-104 = "Мы ищем управляющих объектами курорта. Ваш опыт здесь очень пригодится."
10013010-106 = "Н-Но я клянусь, я прочитала контракт слово в слово!"
10013010-107 = "Ложь заложена в самом контракте."
10013010-108 = "Согласно моим... источникам, Банк «Осьминог», вероятно, вообще не имел прав на эту собственность."
10013010-109 = "Тогда продажа была незаконной, а контракт ничтожен! Я просто пойду и заберу свои вложения обратно."
10013010-111 = "Не хочу вмешиваться, но вы сказали Банк «Осьминог»?"
10013010-112 = "Д-Да. А что?"
10013010-113 = ""
10013010-115 = ""
10013010-116 = ""
10013010-117 = "Простите за плохие новости, но всё будет не так просто."
10013010-118 = "[s] «Ты знаешь этот банк, Хошино?»"
10013010-120 = "..."
10013010-121 = "Банк «Осьминог» — это..."
10013010-122 = "...фирма-прокладка Кайзер Кредит."
10013010-123 = "[s] «Кайзер Кредит...?!»"
10013010-124 = "Мы хорошо знакомы с их уловками... Здесь почерк Кайзер Кредит виден за километр."
10013010-125 = "Согласна с Аяне. Наверняка именно они дёргают за ниточки."
10013010-126 = "Эти мерзкие ублюдки! Не могу поверить, что они снова нас обманули!"
10013010-128 = "Не ожидала, что их тень дотянется за нами даже сюда..."
10013010-129 = "Хм..."
10013010-130 = "Я бы предположила, что корпорация Кайзер с самого начала нацелилась на Отдел фестивалей."
10013010-131 = "Право Отдела фестивалей проводить фестивали в Академии Хяккияко наверняка их заинтересовало."
10013010-132 = "[s] «Как и с Абидосом, они вцепились когтями в Хяккияко...»"
10013010-133 = "Ну тебя и развели, Шизуко ♪"
10013010-134 = "...Ух."
10013010-135 = "Но это особенно на тебя не похоже."
10013010-136 = "Ты обычно не делаешь настолько безрассудных вложений."
10013010-137 = "Денег не хватает, Шизуко?"
10013010-138 = "Это..."
10013010-140 = "Нет! Видите ли, босс..."
10013010-141 = "Спасибо, Умика, но тебе не нужно меня прикрывать. Да, Ния."
10013010-142 = "[s] «Шизуко...?»"
10013010-143 = "Это унизительно, но теперь скрывать что-либо уже бессмысленно."
10013010-144 = "Я хотела быстро заработать, поэтому сделала неудачное вложение. Этот результат — следствие моей глупости."
10013010-145 = "Я умею признавать свои ошибки."
10013010-146 = "Босс..."
10013010-147 = "Я беру всю ответственность на себя. Простите меня, все."
10013010-148 = "Н-Ну... если ты правда сожалеешь..."
10013010-149 = "Серика, нельзя всегда реагировать на всё злостью."
10013010-150 = "Ты первой сюда прибежала! Причём с оружием наперевес!"
10013010-151 = "[s] «Сейчас важно понять, как всё исправить.»"
10013010-153 = "Немедленно возвращайся в академию, Кавава Шизуко."
10013010-154 = "А?"
10013010-155 = "Внешняя сила, нацелившаяся на Отдел проведения фестивалей, равносильна нападению на всю Академию Хяккияко."
10013010-156 = "Это уже далеко за пределами твоей компетенции. Клуб Инь-Ян знает, как разбираться с грязными приёмами."
10013010-157 = "Отдел фестивалей должен вернуться и подготовить ответ на скандал."
10013010-159 = "Нет! Не могу! Не буду!"
10013010-160 = ""
10013010-162 = ""
10013010-163 = "...Простите?"
10013010-164 = "...Что ты мне сказала?"
10013010-165 = "Да, если мы уйдём, сможем избежать Охоты на курорты и дальнейших проблем."
10013010-166 = "Я не хочу слышать продолжение. Просто подчинись, Шизуко."
10013010-167 = "Но это ничего не решит!"
10013010-168 = "...?"
10013010-169 = "Я понимаю, Ния."
10013010-170 = "Но пока имя Момоёдо указано владельцем курорта, ценность нашего бренда будет падать."
10013010-171 = "[s] «Ваш бренд очень ценен, правда?»"
10013010-172 = "В точку, Сенсей! Если мы потеряем доверие, это ударит по туристической отрасли Хяккияко, от которой сильно зависит наш доход."
10013010-173 = "Поэтому я пока не могу вернуться. Я должна исправить свою ошибку."
10013010-174 = "...Ты серьёзно пытаешься использовать это как оправдание? Хватит упрямиться!"
10013010-175 = "Ты называешь мою решимость упрямством? Ты ужасна!"
10013010-176 = "Я просто не понимаю. Я уже предложила всё исправить за тебя. Зачем выбирать более трудный путь?"
10013010-178 = "Потому что я хочу."
10013010-179 = ""
10013010-181 = ""
10013010-182 = "И это не единственная причина, по которой я хочу остаться, ясно?"
10013010-183 = "В-В общем, я остаюсь, и точка!"
10013010-184 = "Разумеется, я возьму на себя всю ответственность."
10013010-185 = "Я справлюсь сама. Обещаю, я всё исправлю."
10013010-186 = "[s] «Мы поможем.»"
10013010-187 = "С-Сенсей! Я правда серьёзно. Я могу сделать это сама."
10013010-188 = "Обязанность леди — помогать тем, кто в беде, Шизуко."
10013010-189 = "Да, она права. Президент Ния ведёт себя злобно. Мы поможем."
10013010-191 = "Даже Чисэ..."
10013010-193 = "Все...!"
10013010-194 = "Я тоже в деле! Вместе с господином мы способны на всё."
10013010-196 = "Меня окружают идиоты. Ладно, хорошо. Каков тогда твой план? Надеюсь, он у тебя есть."
10013010-197 = "По словам студентов Абидоса, переговоры с Банком «Осьминог» ни к чему не приведут."
10013010-198 = "Но мы не можем просто сидеть и ждать, пока на нас снова нападут."
10013010-199 = "А что говорят о лучшей защите?"
10013010-200 = "...Хорошее нападение?"
10013010-201 = "Именно! Мы победим в Охоте на курорты!"
10013010-202 = "Мне нравится её подход."
10013010-203 = "[s] «Ты точно всё обдумала?!»"
10013010-204 = "Конечно! Но мы не будем ничего красть, как эти преступники."
10013010-205 = "По контракту мы владельцы курорта, но другие люди получили часть НАШИХ прав через свои контракты."
10013010-206 = "Получается, они вроде... управляющих, как говорил сотрудник банка."
10013010-208 = "О! Да, контракт и правда можно так трактовать."
10013010-209 = "Управляющих чем? Какими-то разваливающимися зданиями?"
10013010-211 = "Технические детали неважны. Всех нарушителей на архипелаг пригласили сюда произвольными контрактами, составленными уже после того, как Банк «Осьминог» продал нам курорт."
10013010-212 = "По-моему, они просто незаконные захватчики!"
10013010-213 = "На лето Момоёдо заключил контракт как владелец, так что у нас есть полное право их выгнать!"
10013010-214 = "В этом есть смысл! Наверное!"
10013010-215 = "Мы примем участие в Охоте на курорты, победим всех и заберём их контракты! Другими словами — враждебное поглощение!"
10013010-216 = "На кону наша гордость! Я не признаю поражения до последнего вздоха!"
10013010-217 = "Мы докажем, что с Момоёдо нужно считаться!"
10013010-218 = "Мы поглотим каждую последнюю организацию курорта «Потерянный рай»!"
10013010-219 = "И переименуем его в курорт «Рай Момоёдо»!"
10013010-220 = "[s] «Кто сможет отказать такому энтузиазму?»"
10013010-221 = ""
10013010-223 = ""
10013010-224 = "Ура!"
10013010-226 = "Если мне будут давать перерывы на сон, я в деле."
10013010-227 = "Я рада помочь!"
10013010-228 = "Я воспользуюсь любой возможностью надрать Кайзеру зад!"
10013010-230 = "Все..."
10013010-231 = "Хорошо! Первый шаг — собрать всю информацию!"
