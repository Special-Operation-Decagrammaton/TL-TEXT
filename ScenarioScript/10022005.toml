[translation]
10022005-1 = "Проект восстановления: город Ширатори, D.U."
10022005-3 = "С-Сенсей. Спасибо за всё, что вы сделали."
10022005-4 = "Хотя бой закончился, ущерб районам Кивотоса огромен. Город Ширатори в D.U. пострадал сильнее всего."
10022005-5 = "Мы должны сделать ремонт главным приоритетом."
10022005-6 = "К счастью, глава Казначейства Аой одобрила экстренный грант на восстановление города Ширатори. Поэтому мы смогли запустить проект через Надзорный офис."
10022005-7 = "Проблема в том, что Рин отстранена, а одной ей с таким объёмом не справиться."
10022005-8 = "Поэтому нам нужна ваша помощь, Сенсей. Похоже, мы снова будем у вас в долгу."
10022005-9 = ""
10022005-11 = ""
10022005-12 = "Конечно, Рин, Момока и я тоже будем помогать с восстановлением!"
10022005-13 = "Но все мы рассчитываем на вас в восстановлении города Ширатори, Сенсей!"
