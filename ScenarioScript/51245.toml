[translation]
51245-3 = "Kyaaah?!"
51245-4 = "Ugh...?!"
51245-5 = "...Ngh!"
51245-18 = "[ns] (Além de não terem fim, a força dos ataques... é intensa demais!)"
51245-23 = "Calem a boca."
51245-25 = "Calem a boca, calem a boca, calem a boca, calem a boca!"
51245-26 = "É tudo inútil, tuuudo inútil. Não importa o que vocês façam, jamais vão me derrotar."
51245-27 = "Por mais que fiquem enfileirando palavras bonitas..."
51245-28 = "Por mais que tentem destruir a história..."
51245-29 = "Eu já não disseee...? A premissa absoluta de uma história não pode ser mudada."
51245-31 = "Sem qualificação, é impossível derrotar o Hyakumonogatari —"
51245-32 = "Pois já foi decidido desde o princípio que essa é a história."
51245-33 = "...Isso mesmo."
51245-34 = "Enquanto a Presidente do Hyakkaryouran — a Ayame — não estiver aqui!"
51245-35 = "Eu vou arrastar todas vocês para o \"Crepúsculo\", igualzinho à Ayame —!"
51245-50 = "...Hã?"
51245-55 = "O quê? Mas o que é issooo...?"
51245-56 = "Ei, o que significa issooo?"
51245-59 = "Vocês não estavam encurraladas? Hein?"
51245-60 = "Eu já não despedacei o seu coração várias e várias vezes?"
51245-61 = "Mesmo assim —"
51245-65 = "Ei, que tal se olhar no espelhooo?#nOlha só esse seu estado patético —"
51245-66 = "Suas pernas estão tremendo e seu rosto está todo borrado de lágrimas."
51245-70 = "Você está doidinha para sair correndo daqui..."
51245-78 = "Por que está agindo como se fosse a \"Presidente\" ou algo assim...?#nEi, Nagusa-chaaan...!!"
51245-79 = "Com que cara você tem coragem de imitar a Ayame a essa altura?"
51245-86 = "[log=나구사ND]Eu não sou a Ayame.[/log]"
51245-91 = "Nagusa"
51245-92 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-93 = "[log=나구사ND]Eu — [wa:2500]não consigo ser a Ayame.[/log]"
51245-98 = "Nagusa"
51245-99 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-100 = "[log=나구사ND]Tudo o que eu tento alcançar,[/log]"
51245-102 = "[wa:550][log=나구사ND]acaba [wa:1550]se quebrando.[/log]"
51245-107 = "Nagusa"
51245-108 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-109 = "[log=나구사ND]Por isso eu tinha medo.[/log]"
51245-111 = "[wa:20][log=나구사ND]Medo de ouvir que era culpa da minha imaturidade,[/log]"
51245-114 = "Nagusa"
51245-115 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-116 = "[wa:110][log=나구사ND]que tudo era culpa minha,[/log]"
51245-118 = "[wa:250][log=나구사ND]de ser culpada por tudo... [wa:500][/log]"
51245-123 = "Nagusa"
51245-124 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-125 = "[log=나구사ND]Eu tinha medo [wa:1200]que descobrissem [wa:2420]quem eu realmente sou.[/log]"
51245-130 = "Nagusa"
51245-131 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-132 = "[log=나구사ND]Mas —[/log]"
51245-137 = "Nagusa"
51245-138 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-139 = "[log=나구사ND]Mais do que isso... [wa:2700]como aconteceu com a Ayame...[/log]"
51245-144 = "Nagusa"
51245-145 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-146 = "[log=나구사ND]A Yukari...[/log]"
51245-151 = "Nagusa"
51245-152 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-153 = "[log=나구사ND]A Kikyou... [wa:2000]a Renge... [wa:1870]perder vocês me dá [wa:1780]muito mais medo![/log]"
51245-157 = "Shuro"
51245-158 = "[7cd0ff]Clube Beleza da Natureza[-]"
51245-159 = "[log=슈로]...Na[wa:500]gu...[wa:1000]saaa...![/log]"
51245-164 = "Nagusa"
51245-165 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-166 = "[log=나구사ND]Você tem razão, [wa:2180]Shuro.[/log]"
51245-171 = "Nagusa"
51245-172 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-173 = "[log=나구사ND]O máximo que consigo fazer [wa:2180]é \"atuar\".[/log]"
51245-176 = "Nagusa"
51245-177 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-178 = "[wa:80][log=나구사ND]Mesmo agora, estou mal conseguindo ficar de pé, [wa:2890]fingindo ser quem não sou.[/log]"
51245-183 = "Nagusa"
51245-184 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-185 = "[log=나구사ND]Mas, [wa:1910]se mesmo alguém como eu [wa:2930]puder salvar todas elas...[/log]"
51245-188 = "Nagusa"
51245-189 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-190 = "[wa:400][log=나구사ND]Por mais ridícula que eu pareça, [wa:3370]eu vou continuar atuando.[/log]"
51245-195 = "Nagusa"
51245-196 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-197 = "[log=나구사ND]...O papel de Presidente Interina do Hyakkaryouran — [wa:2920]Goryou Nagusa...[/log]"
51245-200 = "Nagusa"
51245-201 = "[7cd0ff]Comitê de Mediação de Conflitos Hyakkaryouran[-]"
51245-202 = "[log=나구사ND]Para sempre![/log]"
51245-207 = "Por isso, Yukari... Renge, Kikyou... Sensei."
51245-211 = "Por favor, me ajudem."
51245-216 = "Sim!!"
51245-217 = "Isso aí! Era isso que eu estava esperando ouvir!"
51245-218 = "...Sim."
51245-220 = "[ns] \"Claro, com todo o prazer.\""
51245-221 = "...!"
51245-222 = "Ainda não... ainda não acabouuu...!!"
51245-226 = "Ah, espere aí!"
51245-236 = "De qualquer forma, as suas balas nem sequer me alcançam..."
51245-237 = "Para mim, que possuo o \"Livro Macabro\", essa é uma verdade imutável...!#nÉ inútil desde o início —"
51245-239 = "[ns] \"Agora!!\""
51245-243 = "Ah... ugh...?!"
51245-244 = "Po-por que... o ataque...!"
51245-257 = "..."
51245-262 = "Não pode... ser..."
51245-263 = "A Nagusa... logo a Nagusa-chan...!"
51245-264 = "Só por ter mudado de ideia... tocou o \"Mistério\" do Livro Macabro...?"
51245-266 = "Haaah!!"
51245-271 = "Ugh... ainda não... ainda não!!"
51245-285 = "Se for o meu Hyakumonogatari...!"
51245-286 = "[ns] \"Renge, conto com você!\""
51245-291 = "Pode deixar comigo!"
51245-299 = "O quê, num instante...?!"
51245-307 = "Fuwa Renge, Líder de Vanguarda do Comitê de Mediação de Conflitos Hyakkaryouran."
51245-308 = "Já são dois anos treinando tiro sem parar."
51245-310 = "Na arte de tiro estilo Hyakkaryouran, à qual dediquei toda a minha juventude — lembre-se de que vantagem numérica não significa nada!"
51245-314 = "Droga...!"
51245-321 = "Que droga! Preciso recuar...!"
51245-326 = "Ngh...! Na rota de fuga...?!"
51245-329 = "Escolheu recuar no instante em que bloqueou nossa visão. E, ao garantir sua segurança, invocaria o Hyakumonogatari — esse era o seu plano, não é?"
51245-333 = "Ler essa sua linha de pensamento simplória é moleza."
51245-337 = "Não me faça riiir, Kiryuu Kikyou...!"
51245-338 = "Um ataque seu nunca vai me atingir...!"
51245-345 = "Hã...? O chão... tá...?!"
51245-346 = "E daí que ataques não funcionam em você?#nEu ainda posso destruir o chão."
51245-347 = "Mesmo com esse Livro Macabro, você não sabe voar, sabe?"
51245-352 = "Tsc... isso...! A Efígie Sem Rosto... com a Efígie Sem Rosto!"
51245-354 = "Com aquilo...!!"
51245-361 = "...Sumiu? ...Por quê?"
51245-366 = "Se procura pela Efígie Sem Rosto, ela não está mais aqui."
51245-367 = "Não vou mais deixar que manipule meus sentimentos como bem entender.#nEu decidi isso em meu coração."
51245-368 = "Kadenokouji... Yukari..."
51245-369 = "Sim. Eu, Kadenokouji Yukari,"
51245-370 = "como integrante do Comitê de Mediação de Conflitos Hyakkaryouran..."
51245-371 = "Yabuki Shuro — eu a declaro presa!"
51245-375 = "!!"
51245-381 = "Ghh...!!"
51245-382 = "Resistir ainda mais é inútil."
51245-383 = "Por quê...?"
51245-384 = "Até agora há pouco, vocês estavam se machucando umas às outras...?"
51245-385 = "Vocês não estavam se xingando e se culpando?!"
51245-386 = "Então por que estão unindo forças agora...? Por quê...? Ei, por quê?!"
51245-387 = "...Porque decidi que quero encarar tudo, mesmo que só agora."
51245-388 = "Mesmo que isso seja apenas uma \"atuação\"..."
51245-392 = "Porque eu quero encarar todas elas como parte do Hyakkaryouran."
51245-393 = "Sim, exatamente!"
51245-395 = "...!!!"
51245-396 = "[ns] \"Shuro, acabou.\""
51245-397 = "Sensei... da Schale..."
51245-403 = "Ha, haha..."
51245-409 = "Aha... ahahaha!"
51245-410 = "AHAHAHAHAHAHAHAHAHAHA!!!!!"
51245-414 = "Nagusa-chan...!"
51245-415 = "Naaa-guuu-saaa-chaaaaaaan!!!!!"
51245-423 = "Pois bem... tudo beeeem. Tanto faz agora...#nSinceramente, não gostei nem um pouco dissooo..."
51245-424 = "Desta vez, vou deixar a vitória para vocês...!#nSim, sim! Vou aceitar até mesmo um desfecho assim."
51245-425 = "Mas... não pensem que acabou por aqui, táaa?"
51245-426 = "Da próxima vez... com certeza, pelas minhas próprias mãos...!"
51245-427 = "Eu dedicarei à Senhora Kokuriko o melhor \"Hyakumonogatari\" de todos —"
51245-431 = "[ns] \"Pessoal! Tomem cuidado!!\""
51245-438 = "Ela... abriu o livro do nada?!"
51245-445 = "Próximo;Agora, Para Você"
