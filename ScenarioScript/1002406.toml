[translation]
1002406-1 = "Последняя остановка"
1002406-2 = "Я вышел к зданию и увидел Широко у ворот."
1002406-3 = "Привет, Сенсей."
1002406-4 = "Я тоже только что приехала. Идеально совпали по времени."
1002406-5 = "[s1] «Что привело тебя сюда, Широко?»\n[s2] «Почему сюда? Разве ты не должна быть в поездке?»"
1002406-6 = "Ну, я выбрала эту дорогу, потому что она ведёт прямо сюда."
1002406-7 = "Ну, я выбрала эту дорогу, потому что она ведёт прямо сюда."
1002406-8 = "По пути не было подъёмов, так что ничто меня не замедляло. И я подумала, что будет приятно насладиться прохладным ветерком."
1002406-9 = "Но нет. Поездка ещё не закончена."
1002406-10 = "Это последняя контрольная точка. Чтобы завершить маршрут, мне нужно вернуться в Абидос."
1002406-11 = "[s3] «Это последняя точка?»\n[s4] «После неё ты возвращаешься в Абидос?»"
1002406-12 = "Да. Я хотела ещё раз увидеть тебя перед возвращением домой."
1002406-13 = "Да. Я хотела ещё раз увидеть тебя перед возвращением домой."
1002406-14 = "А? Почему я просто не попросила тебя встретить меня в Абидосе?"
1002406-15 = "Хм. До сих пор ты приезжал ко мне на каждую точку. Я подумала, что хоть раз сама должна приехать к тебе."
1002406-16 = "Мне написать тебе, когда доберусь до Абидоса?"
1002406-17 = "Нет? Тогда что будем делать?"
1002406-18 = "[s5] «Отсюда я могу поехать вместе с тобой.»\n[s6] «По дороге обсудим твоё путешествие.»"
1002406-19 = "Ой, эм..."
1002406-20 = "Ой, эм..."
1002406-21 = "Я ценю твоё желание, Сенсей, но до Абидоса отсюда всё ещё далеко на велосипеде. Тебе будет нелегко."
1002406-22 = "И этот велосипед рассчитан только на одного человека. Вот если бы сзади было сиденье..."
1002406-23 = "..."
1002406-24 = "Нет, неважно. Всё должно быть нормально, если я поеду медленно. Я могу подстроиться под твою скорость."
1002406-25 = "Я поеду впереди. А ты иди следом в удобном для тебя темпе."
1002406-26 = "Буду двигаться медленно и ровно."
1002406-27 = "[s] Следовать за Широко пешком."
1002406-30 = "Широко медленно катила велосипед рядом, подстраиваясь под мой шаг, и мы вместе направились в Абидос."
1002406-31 = "По дороге Широко рассказывала обо всём, что увидела во время путешествия."
1002406-32 = "Она была гораздо разговорчивее обычного."
1002406-44 = "Широко была права. Путь пешком от Шале до Абидоса занял очень много времени."
1002406-45 = "Мы вышли рано после полудня, но к тому моменту, когда добрались до спортивной площадки, солнце уже начинало садиться."
1002406-47 = ""
1002406-48 = "Хорошо. Мы пришли."
1002406-49 = "Моё путешествие по Кивотосу наконец закончено, Сенсей. Я справилась."
1002406-50 = "Я думала сделать что-нибудь на память об этом, но это было бы немного..."
1002406-51 = "[s] «Поздравляю с завершением путешествия, Широко.»"
1002406-52 = "О."
1002406-53 = "Спасибо, Сенсей."
1002406-54 = "Думаю, мне удалось это сделать благодаря твоей помощи."
1002406-55 = "На побережье, в горах, когда я пересекала мост..."
1002406-56 = "...на берегу реки и наконец в самом сердце города."
1002406-57 = "Ты всегда был рядом, Сенсей."
1002406-58 = ""
1002406-60 = ""
1002406-61 = "Ты всегда был со мной."
1002406-62 = "[s] «...?»"
1002406-63 = "Эм, неважно. Ничего."
1002406-64 = "Просто, ну..."
1002406-65 = "Когда я вспоминаю все разные места, где мне удалось встретиться с тобой, Сенсей..."
1002406-66 = "...я не могу не думать, что была права."
1002406-67 = ""
1002406-69 = ""
1002406-70 = ""
1002406-71 = "Что отправиться в это путешествие было хорошей идеей."
1002406-72 = "Я так рада, что решилась."
