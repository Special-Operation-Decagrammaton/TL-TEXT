[translation]
2000502-1 = "Летний дебют!"
2000502-2 = "Магазин купальников в Шиба-таун"
2000502-3 = ""
2000502-4 = ""
2000502-5 = ""
2000502-6 = ""
2000502-7 = "Сюда, Сенсей! Я здесь!"
2000502-8 = "[s] «Ты рано пришла, Хифуми.»"
2000502-9 = "Я так хотела выбрать новый купальник, что просто не могла ждать."
2000502-10 = "Начинается сезон отпусков, поэтому в магазине столько милых моделей."
2000502-11 = "Столько разных цветов и дизайнов. Даже просто смотреть на них — уже будто отпуск начался."
2000502-12 = "Кстати, тебе самому разве не нужен новый купальник?"
2000502-13 = "[s1] «Того, что я купил в прошлом году, вполне хватит.»\n[s2] «Вообще-то я иногда люблю купаться голышом.»"
2000502-14 = "Наверное. Но вдруг ты найдёшь такой, который тебе очень понравится."
2000502-15 = "Т-Ты не можешь так делать! Тебя же могут посадить, Сенсей!"
2000502-16 = "Давай для начала разойдёмся по разным отделам и посмотрим купальники."
2000502-17 = "Я начну вон с того отдела бикини!"
2000502-19 = "Хм. Сложно."
2000502-20 = "Мне нравится, что тут есть оборки, но дизайн немного простоват..."
2000502-21 = "Как девушке вроде меня вообще выделиться в нём? Я буду выглядеть такой же обычной, как камешек на пляже."
2000502-22 = "Мне нужно что-нибудь покруче... Что-то действительно заметное."
2000502-23 = ""
2000502-24 = ""
2000502-25 = ""
2000502-26 = "[ns] «Нашла купальник, который тебе нравится?»"
2000502-27 = "Д-Да! Я как раз выбрала один!"
2000502-28 = "Купальник, который я выбрала... вот этот!"
2000502-29 = ""
2000502-30 = ""
2000502-31 = ""
2000502-33 = "[ns3] «...»\n[ns4] «Тебе не кажется, что он немного...»"
2000502-34 = "А? Тебе не нравится?"
2000502-35 = "А? Тебе не нравится?"
2000502-36 = "Наверное, для студента он немного слишком смелый, да?"
2000502-37 = ""
2000502-38 = ""
2000502-39 = "И воображению он почти ничего не оставляет..."
2000502-40 = ""
2000502-41 = ""
2000502-42 = "[ns] «А как насчёт вот этого купальника с оборками?»"
2000502-43 = "Я тоже подумала, что он милый, но тебе не кажется, что он слишком простой?"
2000502-44 = "Просто обычный дизайн, который надела бы обычная девушка из Тринити."
2000502-45 = "Мне всегда говорили, что я обычная. Но летние каникулы — это особенное событие. Я хочу, чтобы они ощущались особенными. И сама хочу выглядеть особенной..."
2000502-46 = "[s5] «Для меня ты всегда была особенной.»\n[s6] «Ты будешь мило выглядеть в любом купальнике.»"
2000502-47 = "О-О. Я рада, что ты так думаешь, Сенсей..."
2000502-48 = "О-О. Я рада, что ты так думаешь, Сенсей..."
2000502-49 = "Ну хорошо. Тогда возьму купальник, который ты посоветовал."
2000502-50 = "Сейчас пойду примерю. Подожди секундочку, ладно?"
2000502-54 = ""
2000502-55 = "Эм... Вот купальник, который, как ты сказал, тебе понравился."
2000502-56 = "К-Как я выгляжу? Он ведь не слишком простой?"
2000502-57 = "[s7] «Ты выглядишь так эффектно, что я тебя едва узнал!»\n[s8] «Он и правда довольно классический... но именно поэтому мне и нравится!»"
2000502-58 = "Ха-ха. Поверю тебе на слово."
2000502-59 = "Ха-ха. Поверю тебе на слово."
2000502-60 = "Мне всё ещё кажется, что я выгляжу простовато, но если тебе нравится, может, быть обычной не так уж плохо."
2000502-61 = "Теперь мне ещё сильнее не терпится попасть на пляж."
2000502-63 = "После того как Хифуми заплатила за купальник, мы вернулись в школу."
