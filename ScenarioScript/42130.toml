[translation]
42130-1 = "Эпизод 13: Шок и страх"
42130-2 = "Конференц-зал Генерального студенческого совета Кивотоса"
42130-4 = ""
42130-5 = "У меня есть одно условие. Скорее просьба, если угодно."
42130-6 = "Пусть Управление Красной Зимы возьмёт на себя ответственность за протестующих из вашей академии и распустит их."
42130-7 = "Договорились, председательница Черина?"
42130-8 = ""
42130-10 = ""
42130-12 = "Похоже, вы заблуждаетесь, временная председательница Генерального студенческого совета."
42130-13 = "Видите ли, я не просто «председательница»."
42130-14 = "Я председательница ученического совета Академии Красной Зимы, глава отдела благоустройства, Великая Вождь, глава отдела физического воспитания И отдела питания, а ещё лучший дегустатор пудинга этого месяца — Черина!"
42130-15 = "Я отказываюсь откликаться на столь жалкий титул!"
42130-16 = "Да, председательница ученического совета Академии Красной Зимы и глава всевозможных отделов Черина. Вернёмся к делу..."
42130-17 = "Глава всевозможных отделов...? Ты принижаешь мою должность?! Я велю тебя чистить!"
42130-18 = ""
42130-20 = ""
42130-21 = ""
42130-23 = "(...Почему эта мелкая девчонка передо мной так цепляется за выдуманные должности, до которых никому нет дела?)"
42130-24 = ""
42130-26 = ""
42130-27 = ""
42130-29 = "...Прошу прощения, Великая Вождь Черина."
42130-30 = "Но протестующие мешают Генеральному студенческому совету выполнять свои обязанности, и это серьёзная проблема. Они устраивают беспорядки по всему D.U."
42130-31 = "Внешняя проверка безопасности подтвердила, что большинство этих нарушителего — студента Академии Красной Зимы."
42130-32 = "Как глава Оборонного отдела D.U. и временная председательница Генерального студенческого совета я настоятельно требую, чтобы Управление Красной Зимы взяло на себя ответственность."
42130-33 = "Раз уж вы об этом заговорили, Рабочая партия и правда подозрительно притихла. Так вот что они задумали..."
42130-34 = "А из-за чего они протестуют на этот раз?"
42130-35 = "Хороший вопрос, Великая Вождь Черина."
42130-36 = "Эти студенты требуют не только бесплатные порции пудинга и нереалистичную двухдневную рабочую неделю, но ещё..."
42130-37 = "Они ещё и пытаются устроить переворот!"
42130-38 = ""
42130-41 = ""
42130-42 = "Вот как? И?"
42130-43 = ""
42130-46 = ""
42130-47 = "...Эта огромная шапка вам слух перекрывает?!"
42130-48 = "Переворот! Мятеж! Они пытаются свергнуть сам Генеральный студенческий совет!"
42130-49 = "Как временная председательница Генерального студенческого совета, отвечающая за безопасность Кивотоса, я не могу оставить это без—"
42130-50 = "Понимаю. Перевороты бывают весьма утомительны. Мне самой довелось пережить несколько."
42130-51 = "Из своего опыта я усвоила одну вещь, глава Кая: попытка подавить переворот силой лишь подливает масла в огонь."
42130-52 = "И разве не естественно, что студенты бунтуют, если недовольны действиями совета?"
42130-53 = "Что вы хотите этим сказать?"
42130-54 = "Всегда найдутся недальновидные студенты, неспособные понять замыслы выдающихся лидеров вроде нас."
42130-55 = "Пусть это и не Красная Зима, но, полагаю, быть председательницей Генерального студенческого совета D.U. тоже непросто. Народ никогда вас не поймёт."
42130-56 = "Именно поэтому я и прошу, чтобы Управление Красной Зимы взяло на себя ответственность..."
42130-57 = "Итак, обычно я не вмешиваюсь в дела за пределами своей академии, но усердный труд должен быть вознаграждён."
42130-58 = ""
42130-60 = ""
42130-62 = "Поэтому Управление Красной Зимы пришлёт вам коробку «Черенки»!"
42130-63 = ""
42130-66 = ""
42130-67 = "Пришлёт мне... чего?"
42130-68 = "*ахает* Вы никогда не пробовали «Черенку», глава Оборонного отдела?"
42130-69 = "«Черенка» — фирменный молочный шоколад Академии Красной Зимы. Его насыщенному вкусу нет равных!"
42130-70 = "Если он вам понравится, возможно, Генеральный студенческий совет сможет получать регулярные поставки."
42130-71 = "Мне сейчас нужны люди, а не—"
42130-72 = "О нет! Как такое могло случиться?"
42130-73 = "Я так увлеклась беседой с единомышленницей-лидером, что едва не пропустила время дневного сна."
42130-74 = "Продолжим позже, временная председательница Генерального студенческого совета Ка... как там вас."
42130-75 = ""
42130-77 = ""
42130-79 = ""
42130-80 = "Эта наглая соплячка..."
42130-81 = "Неужели в Академии Красной Зимы нет ни одного серьёзного студента?!"
42130-82 = ""
42130-84 = ""
42130-86 = ""
42130-87 = ""
42130-88 = "...Погодите, я вообще не из Академии Красной Зимы."
42130-90 = "Я знаю. Я говорила не о тебе."
42130-91 = "Вы уверены, что эта мелкая действительно председательница ученического совета и представительница Академии Красной Зимы, глава аппарата?"
42130-93 = "Да. В настоящий момент Ренкава Черина занимает должность председательницы ученического совета Федеральной академии Красной Зимы."
42130-94 = "В настоящий момент?"
42130-95 = "На прошлой неделе, кажется, председательницей была Икекура Марина."
42130-96 = ""
42130-98 = ""
42130-99 = "Если я всё правильно понимаю..."
42130-100 = "Нам нужно устранить эту угрозу безопасности, договариваясь с академией, где руководство меняется каждую неделю?"
42130-102 = "И всё же прежняя временная председательница Рин, похоже, вполне с этим справлялась."
42130-103 = "С правильными стимулами это должно быть сущим пустяком по сравнению с переговорами с Тринити и Геенной..."
42130-104 = "Полагаю, человек с опытом в обороне умеет пользоваться только кнутом. *ням*"
42130-105 = ""
42130-108 = ""
42130-111 = "Эм... глава Кая...?"
42130-112 = "...Временная председательница Генерального студенческого совета."
42130-113 = "П-Простите! Временная председательница Генерального студенческого совета!"
42130-114 = "Касательно регулярных отчётов Оборонного отдела... Многочисленные граждане жалуются на новое правило, обязывающее их... предъявлять десять удостоверений личности при снятии наличных..."
42130-115 = "Кроме того, по всему D.U. произошло несколько случаев, когда раздражённые граждане вместо документов доставали оружие и заставляли сотрудников банков выдать им деньги."
42130-116 = "Это... Это же откровенное вооружённое ограбление!"
42130-117 = "Это происходит повсюду? И офицеры Валькирии с охранниками Кайзер просто... сидят сложа руки?"
42130-118 = "Как уже упоминалось, и Бюро безопасности, и Служба безопасности Кайзер работают на пределе из-за огромного количества ежедневных проверок..."
42130-119 = "Если им не хватает людей, наймите частные охранные компании для поддержания порядка."
42130-120 = "Пока я отвечаю за Кивотос, я не потерплю ни одного преступления."
42130-121 = ""
42130-123 = ""
42130-126 = "Она так говорит, но с тех пор, как она пришла к власти, всё стало куда хаотичнее."
42130-127 = "Сегодня утром протест задержал меня на тридцать минут, когда я пыталась добраться до Башни Санктум."
42130-128 = "Мелких преступлений стало меньше, зато число тяжких выросло..."
42130-129 = "Потому что все наши ресурсы ушли на контроль граждан. Преступники внезапно получили гораздо больше свободы действий."
42130-130 = "А поскольку директор Отдела кадров выбыла из строя, у главы Каи теперь ещё меньше сторонников..."
42130-131 = "Может, она просто не справляется с давлением этой должности..."
42130-132 = "Главный администратор Рин с каждым днём выглядит всё компетентнее."
42130-133 = ""
42130-136 = ""
42130-137 = "...Довольно! Заседание окончено!"
42130-138 = ""
42130-140 = ""
42130-142 = ""
42130-152 = "Кабинет временной председательницы Генерального студенческого совета"
42130-155 = ""
42130-156 = "...Ты заставил меня ждать."
42130-157 = "Вот и вы, временная председательница Генерального студенческого совета."
42130-158 = "Я пришёл лично, потому что, похоже, выплаты Служба безопасности Кайзер задерживаются."
42130-159 = "Учитывая необходимое количество людей и оборудования, предыдущей оплаты даже близко недостаточно, чтобы покрыть—"
42130-161 = "Почему меня до сих пор донимают мелкими проблемами?"
42130-162 = "С тем количеством денег, которое мы вам заплатили, как вы умудряетесь быть неспособными разобраться даже с одним студенческим протестом до того, как он доходит до меня?"
42130-163 = "Ну конечно, потому что вы не заплатили соответствующую цену."
42130-164 = "Вы говорите, что уже выплатили мне столько, сколько Генеральный студенческий совет одобрил в бюджете."
42130-165 = "Но если ваша проблема никуда не исчезла, значит, возможно, бюджета попросту недостаточно."
42130-166 = "...Ты не в том положении, чтобы просить больше, Кайзер."
42130-167 = "Забыл, что именно я не дала Корпорация Кайзер стремительно рухнуть в банкротство? Где бы вы были, если бы я не скрыла ваши преступления во время того инцидента?"
42130-168 = "Разумеется, не забыл. Доверие — основа любых деловых отношений."
42130-169 = "Однако я также не считаю разумным вести дела, подчиняясь эмоциональным прихотям."
42130-170 = "Возможно, вы спасли нас от банкротства, но это не значит, что ради вас я стану прожигать доходы компании."
42130-171 = ""
42130-173 = ""
42130-175 = "Но вы спросили, где бы я был. Я бы довольно легко восстановился. Если дела пойдут плохо, я просто выброшу бренд Кайзер и создам новую компанию."
42130-176 = "А вы? Вы так легко ставите на кон своё имя и репутацию. Если всё развалится, что останется у Ширануи Каи?"
42130-177 = ""
42130-180 = ""
42130-181 = "...Я помогала тебе. Хранила твои секреты. Думаю, общественности было бы интересно узнать о бункере, который вы построили под станцией Коусаги."
42130-183 = "Это уже другой вопрос. Именно мы понесли убытки, когда при вашем покровительстве вскрылась та льгота. Из-за этого план реконструкции района пошёл прахом."
42130-184 = "Я уже сказала. Когда всё уладится, я расплачусь. Запиши на мой счёт. Я даже проценты добавлю."
42130-185 = "Как пожелаете."
42130-186 = "Ваш долг уже превращается в весьма внушительную сумму."
42130-187 = "Насколько я понял, доверия Казначейства вы всё ещё не добились. На распределение бюджета вы почти не влияете, верно?"
42130-188 = "Поддерживать лидера, который не способен внушить уверенность собственной команде, кажется довольно неразумным."
42130-189 = ""
42130-192 = ""
42130-193 = ""
42130-195 = "(Почему это происходит?)"
42130-196 = "(Почему мне никто не доверяет?)"
42130-197 = "(Если бы они просто слушались! Но вместо этого на каждом шагу — подозрения и неподчинение!)"
42130-198 = "(И каким-то образом председательница Генерального студенческого совета... та женщина... Весь Кивотос следовал за ней и доверял ей!)"
42130-199 = "(Почему ей? Что она умеет такого, чего не умею я?)"
42130-200 = "(Почему я тоже не могу стать сверхчеловеком?)"
42130-201 = "(Что изменилось между тогда и сейчас? Между её Кивотосом и моим?)"
42130-202 = ""
42130-204 = ""
42130-205 = ""
42130-206 = ""
42130-208 = "Я поняла."
42130-209 = "Этому Кивотосу не хватает страха."
42130-210 = "Если они будут меня бояться, то встанут в строй."
42130-213 = "...Кая?"
42130-214 = "Юкино, где сейчас хранится термобарическая боеголовка из проекта A.N.T.I.O.C.H.? Та, которую вы конфисковали у Кайзер."
42130-215 = "Боеголовка деактивирована и хранится на военном объекте на окраине D.U."
42130-216 = "Но из-за её взрывной мощности полностью обезвредить её было невозможно."
42130-217 = "Это прямой приказ, Юкино."
42130-218 = "Доставь боеголовку в бункер под станцией Коусаги и взорви её."
42130-219 = ""
42130-221 = ""
42130-223 = ""
42130-225 = ""
42130-226 = "...Могу я спросить зачем?"
42130-227 = "На тебя не похоже подвергать сомнению мои приказы."
42130-228 = "Поэтому на этот раз я тебе отвечу."
42130-229 = "Как ты сказала, мощность боеголовки A.N.T.I.O.C.H. огромна, поэтому полностью нейтрализовать её трудно."
42130-230 = "К тому же большая часть жителей города Коусаги уже переселилась из-за реконструкции, так что жертв будет минимум."
42130-232 = "«Большая часть жителей Коусаги» означает, что там всё ещё кто-то живёт."
42130-233 = "Если взорвать боеголовку в замкнутом пространстве вроде станции метро, то—"
42130-235 = "Да, я знаю, как это работает. Станция Коусаги и соседние станции будут повреждены."
42130-236 = ""
42130-238 = ""
42130-239 = ""
42130-241 = "Именно в этом смысл. Мне нужна демонстрация силы. Такая, чтобы превзошла самые дикие представления, иначе этого не хватит, чтобы заставить их подчиниться."
42130-243 = "...!"
42130-244 = "Они должны знать, что мы способны стереть небольшой город за считаные секунды. Тогда они дважды подумают, прежде чем идти против нас."
42130-245 = "Если «авария» произойдёт в метро, мы сможем свалить всё на халатность работников транспорта."
42130-246 = "Для нас всё будет аккуратно упаковано и перевязано бантиком."
42130-247 = ""
42130-249 = ""
42130-251 = "Ха-ха... Великолепно."
42130-252 = "Я знал, что вы немного безумны, но на этот раз вы действительно превзошли мои ожидания."
42130-253 = "У нашего президента Кайзер и правда поразительное чутьё на таланты."
42130-255 = "...Спасибо за похвалу."
42130-256 = "Однако есть одно возражение. Бункер под станцией метро принадлежит Кайзер. Я не особенно горю желанием, чтобы вы взрывали мою собственность."
42130-257 = "Справедливо. Мы воспользуемся вашей собственностью, поэтому в качестве компенсации..."
42130-258 = "...Вас устроит контроль над системой метро D.U.?"
42130-259 = "После того как я избавлюсь от нынешних сотрудников транспортного отдела, нам понадобится кто-то, кто возьмёт метро под управление."
42130-260 = "Если Корпорация Кайзер готова этим заняться, выиграют все."
42130-261 = "Звучит заманчиво. Мы присматриваемся к транспортной сфере ещё с тех пор, как сорвалась попытка поглощения железной дороги Saint Нефтис."
42130-262 = "Контроль над основным транспортом, связывающим районы, обеспечил бы стабильный источник дохода..."
42130-263 = "Я не из тех, кто упускает долгосрочную возможность, ослеплённый краткосрочной выгодой."
42130-264 = "Хорошо. Мы подготовим бункер к приёму боеголовки. Нужно будет скоординироваться с вашими лисами."
42130-266 = "..."
42130-267 = "Наконец-то с этим разобрались."
42130-268 = "...Теперь вернёмся к моему приказу."
42130-269 = "Командир отряда Юкино. Твой ответ?"
42130-270 = ""
42130-272 = ""
42130-273 = "...FOX 1. Принято."
42130-275 = "Следующий эпизод: Дилемма заключённого"
