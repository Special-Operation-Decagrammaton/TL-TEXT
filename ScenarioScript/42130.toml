[translation]
42130-1 = "Episódio 13;Choque e Pavor"
42130-2 = "Sala de Reuniões do Conselho Estudantil Geral de Kivotos"
42130-5 = "...A única condição que eu exijo é uma só."
42130-6 = "Como se trata de manifestantes da Academia Federal Red Winter, o Secretariado deve assumir a responsabilidade e dispersá-los."
42130-7 = "...Entendeu bem, Presidente Cherino?"
42130-12 = "Parece que há um mal-entendido aí, nova Presidente Interina do Conselho Estudantil Geral."
42130-13 = "Eu não sou apenas a presidente do conselho estudantil..."
42130-14 = "Eu sou a grande Cherino-sama: Presidente do Conselho Estudantil da Academia Federal Red Winter, Chefe do Clube de Embelezamento Ambiental, Secretária-Geral, Representante dos Clubes Esportivos, Chefe do Clube de Limpeza, Presidente do Comitê Disciplinar, Chefe do Refeitório e eleita a Melhor Degustadora de Pudim do mês!"
42130-15 = "Não abrevie meu título para \"Presidente Cherino\"!"
42130-16 = "Sim. Cherino-sama, Presidente do Conselho Estudantil da Academia Federal Red Winter e detentora de várias outras pesadas responsabilidades. O importante agora não é o seu título, mas—"
42130-17 = "\"Várias outras\"...?#nQue insolência!"
42130-23 = "(Por que será que ela faz tanta questão de cargos com os quais ninguém se importa...?)"
42130-29 = "...Peço desculpas, Secretária-Geral Cherino."
42130-30 = "Contudo, o que precisamos resolver com mais urgência agora são os manifestantes que estão liderando protestos em vários pontos do D.U. e paralisando a administração do Conselho Estudantil Geral."
42130-31 = "De acordo com investigações de órgãos externos de segurança, descobriu-se que a grande maioria desses manifestantes são alunas da Academia Federal Red Winter."
42130-32 = "Como Chefe do Gabinete de Defesa responsável pela ordem pública do D.U. e Presidente Interina do Conselho Estudantil Geral,#nprotesto veementemente junto ao Secretariado de Red Winter."
42130-33 = "Pensando bem, eu estranhei que o pessoal do Departamento de Obras estava quieto demais ultimamente...#nEntão era lá que eles estavam fazendo protesto..."
42130-34 = "Afinal, do que é que eles estão reclamando?"
42130-35 = "Boa pergunta, Presidente Cherino."
42130-36 = "Elas não estão apenas exigindo medidas absurdas como distribuição de pudim e semana de cinco dias de folga..."
42130-37 = "...Elas estão tentando dar um golpe de Estado!"
42130-42 = "...E o que tem isso?"
42130-47 = "...Parece que a conexão estava ruim."
42130-48 = "É um golpe de Estado... Uma rebelião—#nElas estão tramando derrubar o Conselho Estudantil Geral!"
42130-49 = "Como Presidente Interina do Conselho Estudantil Geral encarregada de manter a ordem em Kivotos, não posso tolerar uma situação—"
42130-50 = "Golpes de Estado... Eu sei muito bem o quanto isso dá dor de cabeça.#nEu mesma já passei por isso várias vezes."
42130-51 = "Mas escute, Chefe do Gabinete de Defesa — não existe uma forma de impedir golpes de Estado pela raiz."
42130-52 = "Não gostam das políticas do conselho estudantil, então dão um golpe de Estado.#nNão é algo perfeitamente natural?"
42130-53 = "Como?#nHum, o que exatamente você quer dizer com..."
42130-54 = "É claro que alunas comuns jamais conseguiriam compreender as políticas de grandes líderes como nós."
42130-55 = "Pelo visto você também tem muito trabalho como Presidente Interina... Lidar com essa gente realmente não é fácil."
42130-56 = "Por isso mesmo, o Secretariado de Red Winter deve assumir a responsabilidade e dispersar os manifestantes—"
42130-57 = "Em princípio, eu não me envolvo em assuntos fora da minha academia, mas#ndesta vez, em consideração à Presidente Interina do Conselho Estudantil Geral—"
42130-62 = "O nosso Secretariado de Red Winter enviará a você uma caixa de Cheryonka!"
42130-67 = "O que é... Cheryonka?"
42130-68 = "Hmm? A Chefe do Gabinete de Defesa nunca comeu Cheryonka?"
42130-69 = "Cheryonka é o chocolate ao leite especial produzido na Academia Federal Red Winter! É uma verdadeira iguaria!"
42130-70 = "Experimente e, se gostar — posso considerar entregas regulares de Cheryonka para o Conselho Estudantil Geral."
42130-71 = "Como eu já disse, o que precisamos agora não é de chocolate ao leite, e sim que os protestos—"
42130-72 = "...Opa! Já está nessa hora?"
42130-73 = "A conversa estava tão boa que quase perdi a hora do meu cochilo."
42130-74 = "Bem, conversamos de novo outra hora... Presidente Interina sei lá das quantas."
42130-80 = "Essa pirralha..."
42130-81 = "Não existe uma única aluna normal na Academia Federal Red Winter?!"
42130-88 = "...Hã? E-eu nem sou da Academia Red Winter, sabia?"
42130-90 = "...Não estou falando de você."
42130-91 = "Chefe do Gabinete de Coordenação. Aquela tampinha é mesmo a representante e presidente do conselho estudantil da Academia Federal Red Winter?"
42130-93 = "Sim, a atual Presidente do Conselho Estudantil da Academia Federal Red Winter é ela — Renkawa Cherino."
42130-94 = "Atual...?"
42130-95 = "É que... há uma semana, a Presidente do Comitê Ikekura Marina era a Presidente do Conselho Estudantil de Red Winter."
42130-99 = "Ou seja, nós agora..."
42130-100 = "Temos que negociar com uma academia cuja representante muda a cada semana para resolver nossos problemas de segurança?"
42130-102 = "Isso mesmo.#nMas a Rin-senpai, que estava antes, lidava com isso sem reclamar uma única vez~"
42130-103 = "Se souber equilibrar direitinho a cenoura e o chicote, acho até mais fácil conversar com elas do que com as presidentes de Trinity ou Gehenna..."
42130-104 = "Bem, para certa pessoa vinda do Gabinete de Defesa que só conhece o chicote,#ntalvez seja um pouquinho difícil mesmo. (Croc)"
42130-111 = "C-com licença... Chefe Kaya..."
42130-112 = "...Presidente Interina do Conselho Estudantil Geral."
42130-113 = "D-desculpe... Presidente Interina do Conselho Estudantil Geral!"
42130-114 = "É sobre o relatório periódico do Gabinete de Defesa... Os cidadãos estão demonstrando grande insatisfação com o novo decreto administrativo que exige mais de dez tipos de documentos toda vez que sacam dinheiro da conta..."
42130-115 = "Relatos indicam que, em vários pontos do D.U., pessoas estão apontando armas para os bancários em vez de entregar documentos, obrigando-os a liberar os depósitos à força."
42130-116 = "Isso... é simplesmente assalto a banco!"
42130-117 = "Com tantos assaltos a banco acontecendo por todo o D.U., o que o Departamento de Segurança da Valkyrie e a Kaiser Security estão fazendo?!"
42130-118 = "Como informei anteriormente, o Departamento de Segurança e a Kaiser Security estão sobrecarregados nos postos de controle..."
42130-119 = "Se falta pessoal, contratem empresas privadas de segurança ou o que for necessário e estabilizem a ordem pública!"
42130-120 = "Na Kivotos sob a minha gestão, não tolerarei um único crime!"
42130-126 = "Olha, parece estar ainda mais caótico do que antes..."
42130-127 = "Até para chegar aqui levei mais de trinta minutos a mais que o normal por causa dos protestos..."
42130-128 = "A taxa de criminalidade caiu, mas os crimes graves aumentaram, né..."
42130-129 = "Falando sério, isso não é só resultado de terem ficado filtrando cidadãos inocentes?"
42130-130 = "Depois que a Chefe do Gabinete de Recursos Humanos saiu, parece que o número de oficiais que apoiam a Chefe Kaya diminuiu bastante também..."
42130-131 = "Será que vai mesmo dar certo ela continuar como interina assim?"
42130-132 = "Talvez a Administradora Rin fosse mais competente..."
42130-137 = "...Dispensadas!#nEsta reunião está encerrada!"
42130-152 = "Gabinete da Presidente Interina do Conselho Estudantil Geral"
42130-156 = "...Está atrasada."
42130-157 = "Chegou, Presidente Interina do Conselho Estudantil Geral."
42130-158 = "Parece que a transferência do pagamento está atrasada.#nPor isso vim fazer uma visita pessoalmente."
42130-159 = "Considerando o pessoal e o equipamento necessários para manter a ordem pública, sou obrigado a dizer que é difícil continuar operando com o valor já pago—"
42130-161 = "Por que há brechas no controle?"
42130-162 = "Quanto vocês acham que eu já gastei com vocês?#nNão conseguem nem conter um grupinho de manifestantes e ainda têm a cara de pau de vir me cobrar."
42130-163 = "Ora, ora... Você realmente acha que pagou tudo isso?"
42130-164 = "Com essa quantia, esse nível de contenção já é o limite."
42130-165 = "Quando as tropas que você contrata não resolvem o problema, a primeira coisa a se pensar é se você está pagando o suficiente."
42130-166 = "...Vocês não estão em posição de falar sobre dinheiro, estão?"
42130-167 = "Já se esqueceram de que a Kaiser Corporation só escapou da falência porque eu abafei o incidente anterior?"
42130-168 = "Como eu poderia esquecer?#nO valor de uma empresa está na sua credibilidade."
42130-169 = "...No entanto, a paciência do Presidente não vai durar para sempre."
42130-170 = "Por mais que você tenha nos ajudado, emprestar tanto esforço por um pagamento tão baixo simplesmente não compensa."
42130-175 = "Na pior das hipóteses, nós podemos abandonar o nome Kaiser e fundar uma nova organização."
42130-176 = "Mas e você?#nSerá que consegue jogar fora toda a reputação que construiu até agora e recomeçar do zero?"
42130-181 = "...Fazer vista grossa para o silo que vocês construíram no subsolo da Estação Kousagi não foi o suficiente?"
42130-183 = "Isso é outra história. Com a exposição das propinas da última vez, acabamos foi no prejuízo."
42130-184 = "Eu pagarei quando este trabalho terminar, então anote como dívida. Com juros bem generosos."
42130-185 = "Se é o que deseja, assim faremos."
42130-186 = "...Mas tem certeza de que pode acumular ainda mais faturas?"
42130-187 = "Ouvi rumores de que a nova Presidente Interina ainda não conquistou a confiança da Chefe do Gabinete de Finanças e está tendo dificuldades para levantar verba..."
42130-188 = "Investir em uma líder que mal tem o apoio dos próprios subordinados me deixa um pouco apreensivo."
42130-195 = "(...Qual é o problema, afinal?)"
42130-196 = "(Por que as pessoas à minha volta simplesmente não confiam em mim?)"
42130-197 = "(Bastaria seguirem minhas instruções para tudo ficar perfeito... Por que todo mundo se rebela...?)"
42130-198 = "(...Não importava o que aquela mulher dissesse, todas as alunas de Kivotos a seguiam com confiança absoluta.)"
42130-199 = "(Qual é a diferença entre mim e ela...?)"
42130-200 = "(Por que eu não consigo me tornar uma \"super-humana\"...?)"
42130-201 = "(A diferença entre o antigo Conselho Estudantil Geral e o atual...)"
42130-208 = "...Entendi."
42130-209 = "O que falta nesta Kivotos é o pavor."
42130-210 = "...Se eu mostrar a eles o mais puro pavor, todos passarão a me obedecer."
42130-213 = "...Kaya?"
42130-214 = "Yukino, onde está armazenado atualmente o resultado do projeto <A.N.T.I.O.C.H.> que você recuperou outro dia — a bomba termobárica para míssil balístico?"
42130-215 = "...Aquilo foi desativado e está guardado em uma instalação militar nos arredores do D.U."
42130-216 = "O poder destrutivo é alto demais, e o descarte por detonação também não é simples."
42130-217 = "...É uma ordem, Comandante Yukino."
42130-218 = "Leve imediatamente essa ogiva para o silo subterrâneo da Estação Kousagi e detone-a."
42130-226 = "...O motivo?"
42130-227 = "Responder a uma ordem com uma pergunta não combina com você."
42130-228 = "— É muito simples."
42130-229 = "Como a Comandante Yukino acabou de mencionar, a ogiva do <A.N.T.I.O.C.H.> é extremamente poderosa, e adiamos seu descarte por receio de danos às áreas vizinhas."
42130-230 = "Contudo, a maioria dos moradores já deixou Kousagi Town devido à revitalização, então os danos da detonação podem ser mantidos no mínimo."
42130-232 = "Mesmo assim, ainda há muitos cidadãos vivendo em Kousagi Town."
42130-233 = "Além disso, se detonarmos uma bomba termobárica em um espaço confinado como o metrô, o poder destrutivo será amplificado—"
42130-235 = "Sim, eu sei perfeitamente.#nNão apenas a Estação Kousagi, mas também as estações vizinhas serão atingidas."
42130-241 = "...Mas se exibirmos uma ameaça desse nível, todos finalmente entenderão o nosso poder, não acha?"
42130-243 = "...!"
42130-244 = "Quando descobrirem que podemos varrer facilmente uma pequena cidade do mapa se for preciso, nenhuma aluna ousará nos desafiar."
42130-245 = "Além do mais, será um \"acidente\" no metrô.#nPodemos usar falhas nos sistemas de segurança como pretexto para responsabilizar o Gabinete de Trânsito e expulsar seus oficiais..."
42130-246 = "— Não é exatamente o que chamam de matar dois coelhos com uma cajadada só?"
42130-251 = "Hehe... Magnífico."
42130-252 = "Eu já sabia que você era capaz de fazer sem pestanejar o que pessoas comuns jamais ousariam —#nmas não imaginava que seria tão audaciosa assim."
42130-253 = "Realmente, o Presidente nunca erra no seu julgamento."
42130-255 = "...Vou aceitar isso como um elogio."
42130-256 = "Porém, o silo subterrâneo da Estação Kousagi pertence à nossa Kaiser Corporation. O que nós ganhamos provocando essa explosão?"
42130-257 = "Vejamos — já que utilizaremos uma instalação da sua empresa, pagaremos uma compensação à altura..."
42130-258 = "...Que tal os direitos de operação do metrô do D.U.?"
42130-259 = "Quando substituirmos os oficiais do Gabinete de Trânsito, precisaremos de uma nova organização para operar o metrô."
42130-260 = "Se a Kaiser Corporation aceitar assumir esse papel, eu ficarei mais do que satisfeita."
42130-261 = "Nada mal. De qualquer forma, acabamos de fracassar na aquisição do setor ferroviário da Saint Nephthys. Estávamos mesmo procurando uma alternativa."
42130-262 = "A operação do principal meio de transporte que conecta os distritos autônomos — isso garantirá uma fonte de renda mais estável do que qualquer outra indústria..."
42130-263 = "Não sou um tolo que se deixa cegar por lucros imediatos e desperdiça a fortuna do futuro."
42130-264 = "Pois bem. Deixarei tudo pronto para o transporte da ogiva e a ativação do silo. Assim que as raposas entrarem em ação, nós faremos a nossa parte."
42130-266 = "..."
42130-267 = "Muito obrigada.#nCom isso, assunto encerrado—"
42130-268 = "...Ah, é mesmo. Ainda não ouvi a resposta à minha ordem."
42130-269 = "Comandante Yukino, sua resposta?"
42130-273 = "...FOX 1, entendido."
42130-275 = "Próximo;O Dilema do Prisioneiro"
