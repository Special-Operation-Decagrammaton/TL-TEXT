[translation]
90100030-1 = "Episódio 03;Saco Vazio Não Para em Pé"
90100030-2 = "Periferia de D.U. - Churrascaria Nobre com Reserva"
90100030-5 = ""
90100030-6 = "[ns1] \"......Acho que vou começar pedindo um fraldinha bem suculento.\"\n[ns2] \"E traz um chá de oolong bem geladinho pra acompanhar, por favor!\""
90100030-9 = "É pra já, cliente amigo～!"
90100030-10 = ""
90100030-12 = ""
90100030-13 = "É... bem..."
90100030-14 = "Pois é..."
90100030-15 = "Hehehe..."
90100030-16 = ""
90100030-17 = "[ns3] \"Ah, bota uma língua de boi fatiada na conta também!\"\n[ns4] \"E pode caprichar naquela porção mista de legumes na brasa!\""
90100030-20 = "Com certeza absoluta, saindo no capricho～～!"
90100030-21 = ""
90100030-23 = ""
90100030-24 = "......Sensei."
90100030-25 = "Antes que o senhor continue fazendo pedidos no cardápio, gostaria de esclarecer uma dúvida."
90100030-26 = "[s5] \"Ué? Tá com vontade de comer algum outro corte de carne?\"\n[s6] \"Pode pedir sem vergonha nenhuma, é por minha conta!\""
90100030-29 = "Não, não se trata da carne."
90100030-30 = "Eu tinha entendido que este encontro fora convocado para o alinhamento tático da nossa operação..."
90100030-32 = "Por que razão exatamente viemos parar em uma churrascaria de alta gastronomia?"
90100030-33 = "[s7] \"Calma, relaxa... nada melhor do que conversar com a barriga cheia de carne boa!\"\n[s8] \"......Olha aí, o fraldinha já tá no ponto perfeito da brasa. Pega aí, serve você primeiro.\""
90100030-36 = "A-Ah... muito obrigada..."
90100030-37 = "Bem, já que colocaram na minha frente, seria falta de educação não comer..."
90100030-38 = ""
90100030-39 = ""
90100030-40 = ""
90100030-41 = "HUMMM?! M-Mas o que... que carne é essa?!"
90100030-42 = "Derrete suavemente na ponta da língua e quando você morde espirra uma explosão de caldo suculento e defumado...#nHummm... a boca fica completamente dominada pelo sabor...!"
90100030-43 = "Huumm... que delícia dos deuses. Acho que nunca comi uma carne tão nobre na minha vida inteira.#nA ração da SRT era boa, mas comparada a isso aqui não dá nem pro cheiro..."
90100030-44 = "[s] \"Agora experimentem essa língua de boi na brasa.\""
90100030-45 = "Nossa... a crocância tostada da língua com o toque azedinho do molho de limão harmonizou com perfeição."
90100030-46 = "Com fatias tão generosas assim, se picar bem fininho daria um recheio espetacular para enroladinhos de inari..."
90100030-47 = "Eu nunca imaginei que língua de boi pudesse ser tão maravilhosa!#nO casamento com esse molho especial ficou divino～!"
90100030-48 = ""
90100030-50 = ""
90100030-51 = "......Peraí. Isso aqui é literalmente a língua do boi, não é?#nComer língua de boi quer dizer que a gente tá beijando o boi de língu――"
90100030-52 = "NÃO FALA NOJEIRA PRA ESTRAGAR MEU APETITE, SUA TONTA!!"
90100030-53 = ""
90100030-55 = ""
90100030-56 = ""
90100030-57 = "[ns9] \"A Yukino quase não tocou no prato ainda...\"\n[ns10] \"Será que você prefere miúdos ou costela bovina?\""
90100030-60 = "Não, não tenho preferência por vísceras..."
90100030-61 = "Mas repito com todo o respeito: o problema não reside no cardápio de carnes."
90100030-62 = ""
90100030-64 = ""
90100030-65 = "Nosso plano inicial era definir os alvos da missão inteiramente por nossa conta, para não onerar o Sensei com fardos adicionais."
90100030-66 = "No entanto, a Presidente do Conselho Estudantil Federal nos informou que o Sensei exigiu pessoalmente o comando direto da nossa unidade."
90100030-67 = "[s11] \"Se emprestei meu nome e a retaguarda da Schale, tenho que assumir as responsabilidades do pacote.\"\n[s12] \"Pode soar intrometido, mas me deixe dar meus palpites no processo.\""
90100030-70 = "Palpites, o senhor diz......"
90100030-71 = "O Sensei fala com leveza, mas esta operação representa o nosso 'processo de expiação criminal'. O senhor sabe muito bem disso."
90100030-72 = "Em outras palavras, os 'palpites' do Sensei nada mais são do que tomar para si parte do fardo dos nossos pecados."
90100030-73 = ""
90100030-75 = ""
90100030-76 = "......Sensei."
90100030-77 = "Por que o senhor faz tanto por nós?"
90100030-78 = "Já não bastasse estender a mão quando estávamos no fundo do poço, ainda nos cobre com tamanha generosidade imerecida..."
90100030-79 = "Sendo muito franca com o senhor, sinto mais estranheza e perplexidade do que gratidão. Chega a me causar um frio de pavor na espinha."
90100030-80 = "[s] \"Não encasqueta com isso, gente. É só um almoço gostoso.\""
90100030-81 = ""
90100030-85 = "[ns] \"......Ah, já sei! Tá com medo de que a picanha esteja envenenada?\""
90100030-86 = "Veneno?! Como assim, do que o senhor est――"
90100030-87 = ""
90100030-89 = ""
90100030-90 = "Cof! Cof, cof, cof!"
90100030-91 = "Come mais devagar, criatura de Deus!"
90100030-92 = "Toma essa água aqui... Francamente, como é que você consegue se engasgar com carne de primeira?"
90100030-93 = "N-Não foi isso... Eu engasguei de susto com o que ele disse...!"
90100030-94 = "Pensando bem, já tivemos uma conversa parecida com essa tempos atrás, não tivemos?"
90100030-95 = "......Não faço a mais remota ideia de qual conversa vocês estão se referindo."
90100030-97 = "Com licença, vou trocar a grelha da mesa de vocês."
90100030-98 = "[s] \"Opa, aproveita e traz mais três porções generosas de costela nobre, por favor!\""
90100030-99 = "Três porções de costela nobre, é pra já!"
90100030-100 = ""
90100030-102 = ""
90100030-104 = ""
90100030-105 = "......Se fosse algo claro e óbvio como veneno, seria infinitamente mais fácil de lidar."
90100030-106 = "Receber uma benevolência unilateral e gratuita... Não há nada mais aterrorizante neste mundo do que isso."
90100030-107 = "O Sensei nos resgatou da beira de um abismo sem fundo. Graças ao senhor, não cometemos um erro irreparável e salvamos a vida das nossas calouras e as nossas próprias."
90100030-108 = "Já temos uma dívida de honra que nem cem vidas seriam suficientes para pagar... e ainda assim, o senhor continua nos tratando com tanto carinho e gentileza."
90100030-109 = "Fico me perguntando dia e noite o que o senhor espera em troca... e continuo incapaz de decifrar."
90100030-110 = "[s] \"Essa é uma pergunta que me traz lembranças nostálgicas.\""
90100030-111 = ""
90100030-114 = "[ns14] \"É porque eu sou o professor de vocês.\"\n[ns15] \"Eu não faço nada disso esperando recompensa ou pagamento em troca.\""
90100030-117 = "......Confesso que tenho extrema dificuldade em compreender essa lógica."
90100030-118 = "Oferecer um banquete de churrasco sofisticado a criminosas por acaso faz parte do ofício de um professor?"
90100030-119 = "[s16] \"Mas é claro que faz!\"\n[s17] \"Garantir que as crianças comam direito e fiquem fortes é o dever primordial de qualquer adulto.\""
90100030-122 = ""
90100030-124 = "[ns18] \"Comendo bem, a gente ganha ânimo pra lutar.\"\n[ns19] \"Comendo bem, o corpo cresce saudável.\"\n[ns20] \"......Afinal, só quem se alimenta com fartura consegue se tornar um adulto de verdade.\""
90100030-128 = "......"
90100030-129 = "Não posso refutar o argumento de que uma tropa precisa se alimentar bem."
90100030-130 = "Afinal, o clássico aforismo militar já dizia: 'Um exército marcha sobre o seu estômago'."
90100030-131 = ""
90100030-134 = "[ns] \"Olha lá, a costela na brasa tá douradinha e tinindo!\""
90100030-135 = ""
90100030-136 = "......É uma carne boa."
90100030-137 = "Pera aí um minuto! A sua avaliação de uma carne dos deuses foi SÓ ESSA?!"
90100030-138 = "......Por acaso eu falei algum disparate?"
90100030-139 = "Ela não tem cheiro ruim e não está dura feito sola. Por isso afirmei que é uma carne de qualidade."
90100030-140 = "Classificar a costela marmorizada mais nobre de Kivotos como 'não tá fedendo' é uma heresia que beira a loucura!"
90100030-141 = "Mas que ultraje gastronômico! Como alguém pode ter papilas gustativas tão desesperadoramente atrofiadas?!"
90100030-142 = "Sensei, por favor, não desperdice carne cara com a Yukino!#nCapaz de ela dizer a mesma coisa se comer um bife de cem ienes do mercadinho da esquina!"
90100030-143 = "Kurumi-chan, calma... acho que você pesou um pouquinho a mão no esculacho..."
90100030-144 = "Eu achava que ela comia ração militar de combate todo dia porque tinha uma disciplina de ferro...#nmas na verdade ela só não tem paladar nenhum!"
90100030-145 = "Espere aí. Por mais desprendida que eu seja em relação à culinária, isso é uma difamação descabida."
90100030-146 = "Talvez vocês não saibam, mas as conservas de frutos do mar da ração operacional da SRT intensificam o umami do peixe conforme envelhecem. Portanto, mesmo vencidas há semanas, elas continuam delicios――"
90100030-147 = "COMIDA VENCIDA SE JOGA NO LIXO, SUA MALUCA SEM NOÇÃO!"
90100030-148 = "Não tem jeito. Diante dessa tragédia, transfiro o poder de decisão dos pedidos para a única pessoa com discernimento gustativo intacto!"
90100030-149 = "Niko! O próximo pedido do cardápio tá nas suas mãos!"
90100030-150 = "Puxa... Eu também não sou nenhuma crítica gastronômica profissional, mas..."
90100030-151 = ""
90100030-153 = ""
90100030-154 = "Que tal pedirmos aquele caldo quente especial com tofu frito recomendado da cas――"
90100030-155 = "SOPA NÃO! Sopa enche a barriga de água e tira o espaço da picanha!"
90100030-157 = "（E assim o nosso jantar animado com as garotas do Esquadrão FOX se estendeu pela noite adentro.）"
90100030-159 = "Próximo Episódio;Uma Nova Base de Operações"
