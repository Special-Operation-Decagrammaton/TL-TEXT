[translation]
90100030-1 = "Эпизод 3;Отряд марширует на полном желудке"
90100030-2 = "Окраина D.U., премиальный ресторан якинику только по предварительной записи"
90100030-5 = ""
90100030-6 = "[ns1] «...Давайте начнём с диафрагмы.»\n[ns2] «И кувшин холодного улуна, пожалуйста.»"
90100030-9 = "Будет сделано, босс!"
90100030-10 = ""
90100030-12 = ""
90100030-13 = "Эм..."
90100030-14 = "Да. Значит..."
90100030-15 = "Даже не знаю, что тут сказать..."
90100030-16 = ""
90100030-17 = "[ns3] «А, и ещё говяжий язык!»\n[ns4] «И как насчёт салата из ростков фасоли?»"
90100030-20 = "Обязательно!"
90100030-21 = ""
90100030-23 = ""
90100030-24 = "...[USERNAME] Сенсей."
90100030-25 = "Прежде чем вы сделаете ещё один заказ, у меня есть вопрос."
90100030-26 = "[s5] «А, особая просьба?»\n[s6] «Заказывай что хочешь!»"
90100030-29 = "Нет. Дело не в меню."
90100030-30 = "Это должна была быть встреча для инструктажа с Шале."
90100030-32 = "Так почему мы в премиальном ресторане якинику...?"
90100030-33 = "[s7] «Сначала поедим, потом поговорим.»\n[s8] «...Диафрагма выглядит отлично. Вот, попробуй.»"
90100030-36 = "А, спасибо..."
90100030-37 = "Ну, раз предлагаете..."
90100030-38 = ""
90100030-39 = ""
90100030-40 = ""
90100030-41 = "...Погодите, что это за мясо?"
90100030-42 = "Оно настолько нежное, что буквально тает во рту, и при этом такое сочное... Как это вообще возможно?"
90100030-43 = "Хм. Не думала, что в SRT была плохая еда. Но ничего подобного я раньше не пробовала."
90100030-44 = "[s] «Теперь говяжий язык.»"
90100030-45 = "Ого. Насыщенный вкус говяжьего языка отлично сочетается со сладко-кислым соусом тарэ."
90100030-46 = "Можно мелко нарезать его и добавить в инаризуси. Какая потрясающая текстура!"
90100030-47 = "Не думала, что говяжий язык окажется таким вкусным, но вкус у него невероятно глубокий. Передай соус."
90100030-48 = ""
90100030-50 = ""
90100030-51 = "Если задуматься: раз это язык коровы, то есть говяжий язык — это почти как целоваться с коровой?"
90100030-52 = "Отоги, мы вообще-то едим! И это ПРИЛИЧНОЕ заведение!"
90100030-53 = ""
90100030-55 = ""
90100030-56 = ""
90100030-57 = "[ns9] «Ты почти ничего не ела, Юкино.»\n[ns10] «Может, предпочитаешь субпродукты?»"
90100030-60 = "Нет, субпродукты мне не особенно нравятся."
90100030-61 = "Повторяю: я пришла сюда не ради бесплатной еды."
90100030-62 = ""
90100030-64 = ""
90100030-65 = "Итак, для этой миссии, связанной с «Преданиями», постоянный надзор нам не нужен. Цели мы определим сами, так что об этом можете не беспокоиться."
90100030-66 = "...Проблема в том, что президент Генерального ученического совета сказала мне, что вы хотите лично руководить этой миссией."
90100030-67 = "[s11] «Раз вы действуете под началом моего отдела, ответственность лежит на мне.»\n[s12] «Можете считать меня назойливым, но мне придётся вмешиваться.»"
90100030-70 = "«Вмешиваться»..."
90100030-71 = "Вы так говорите, но наверняка понимаете: эта миссия — наш шанс искупить вину. Для нас на кону слишком многое, и это слишком лично."
90100030-72 = "В конечном счёте ваше «вмешательство» означает, что вы берёте на себя часть нашего долга."
90100030-73 = ""
90100030-75 = ""
90100030-76 = "...Сенсей."
90100030-77 = "Почему вы нам помогаете?"
90100030-78 = "Одно дело, если бы вы просто оказывали профессиональную помощь, но вы буквально заваливаете нас такой чрезмерной добротой..."
90100030-79 = "...Если честно, меня это немного пугает."
90100030-80 = "[s] «Не переживай об этом. Мы просто вместе ужинаем.»"
90100030-81 = ""
90100030-85 = "[ns] «О, ты боишься, что я отравил мясо?»"
90100030-86 = "...Отравили? О чём вы—"
90100030-87 = ""
90100030-89 = ""
90100030-90 = "*кашляет* *хрипит*"
90100030-91 = "Спокойнее, Куруми."
90100030-92 = "Если перестанешь так жадно набивать рот, не будешь давиться!"
90100030-93 = "Н-Не поэтому я подавилась...!"
90100030-94 = "Ахаха... Если подумать, это ощущается знакомо."
90100030-95 = "...Я вообще не понимаю, о чём вы все говорите."
90100030-97 = "Прошу прощения! Позвольте протиснуться и заменить решётку гриля!"
90100030-98 = "[s] «А, и ещё три порции рёбрышек, пожалуйста.»"
90100030-99 = "Безусловно!"
90100030-100 = ""
90100030-102 = ""
90100030-104 = ""
90100030-105 = "...Когда я сказала, что мне «страшно», я не имела в виду реальную угрозу нашей безопасности."
90100030-106 = "Мы уже получили от вас куда больше доброты, чем заслуживаем."
90100030-107 = "Вы вытащили нас со дна пропасти и не дали совершить страшную ошибку. Вы спасли и наши жизни, и жизни наших младших товарищей."
90100030-108 = "Один только этот долг настолько велик, что мы никогда не сможем его вернуть. Но вы всё равно продолжаете проявлять к нам доброту и предлагать помощь..."
90100030-109 = "Я пыталась понять ваши мотивы. Что вы хотите получить взамен?"
90100030-110 = "[s] «Меня уже спрашивали об этом...»"
90100030-111 = ""
90100030-114 = "[ns14] «Я ничего от вас не жду.»\n[ns15] «Я просто ваш учитель.»"
90100030-117 = "Я всё ещё не понимаю. Не до конца."
90100030-118 = "Как то, что вы учитель, связано с тем, что вы покупаете нам изысканный ужин?"
90100030-119 = "[s16] «Разве не очевидно?»\n[s17] «Задача взрослого — следить, чтобы дети хорошо питались.»"
90100030-122 = ""
90100030-124 = "[ns18] «Им нужно хорошо есть, чтобы были силы...»\n[ns19] «Хорошая еда помогает расти...»\n[ns20] «...А всё это помогает им стать хорошими взрослыми.»"
90100030-128 = "..."
90100030-129 = "Я не стану отрицать... пользу правильного питания."
90100030-130 = "Есть такая поговорка, вы наверняка знаете: «Война войной, а обед по расписанию.»"
90100030-131 = ""
90100030-134 = "[ns] «Рёбрышки готовы.»"
90100030-135 = ""
90100030-136 = "...Качественное мясо."
90100030-137 = "Ну пожалуйста! И это всё, что ты можешь сказать?!"
90100030-138 = "...А что не так с моим замечанием?"
90100030-139 = "Это ДЕЙСТВИТЕЛЬНО качественное мясо. Без неприятного запаха и легко жуётся."
90100030-140 = "Ну серьёзно! Берёшь премиальные рёбрышки — и всё, что можешь сказать, это «без неприятного запаха»?!"
90100030-141 = "Это просто возмутительно! У тебя совершенно безнадёжный вкус!"
90100030-142 = "Сенсей, не давайте Юкино ничего дорогого! Она наверняка с тем же удовольствием съест жареную грудинку! Или куриный наггетс!"
90100030-143 = "Куруми, давай помягче..."
90100030-144 = "Я думала, она такая суровая, потому что раньше жила на боевых пайках, но, может, у неё просто совсем нет вкуса..."
90100030-145 = "Пусть я и не гурман, но такое заявление пропустить не могу. Я умею различать вкус еды."
90100030-146 = "Большинство студентов этого не знает, но стандартные рыбные консервы SRT со временем приобретают более зрелый и глубокий вкус. Ими можно ПРЕКРАСНО наслаждаться даже после истечения срока годности..."
90100030-147 = "Пожалуйста, выбрасывай просроченную еду!"
90100030-148 = "Всё, я больше не могу. Пусть следующий заказ делает наш заместитель командира — у неё хотя бы язык работает нормально..."
90100030-149 = "Ладно, Нико. Заказывай следующую порцию!"
90100030-150 = "Эм. Я и сама не особо «гурман», но..."
90100030-151 = ""
90100030-153 = ""
90100030-154 = "Я всё поглядываю на мисо-суп с инари в десертном меню..."
90100030-155 = "Хватит набивать живот дорогущими гарнирами! Мы в ресторане якинику! Смотри на главное!"
90100030-157 = "Так и продолжился мой довольно шумный ужин с отрядом FOX..."
90100030-159 = "Следующий эпизод;Новая база"
