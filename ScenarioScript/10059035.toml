[translation]
10059035-8 = "G-gah...! Th-this guy...!"
10059035-9 = "Why is it so tough...?"
10059035-10 = "Alright, that's enough. There's no point in continuing this."
10059035-11 = "So, why don't we have a little chat?"
10059035-12 = "Come on, sit down, sit down."
10059035-13 = "Huh?"
10059035-14 = "Wh-what are you suddenly saying!"
10059035-15 = "Sit down?"
10059035-22 = "How did you all end up doing this kind of work?"
10059035-23 = "Why do you want to know that?!"
10059035-24 = "I don't really. I was just curious why you'd take on such a dangerous job."
10059035-25 = "Is there something you want?"
10059035-26 = "Well... I wanted to try eating that 'Frederica Semla' thing."
10059035-27 = "It's a legendary dessert that's impossible to get your hands on."
10059035-28 = "But if you have enough money, you can make anything happen. #nThere's nothing in this world that can't be solved with money. Hehehe."
10059035-29 = "Frederica Semla... I see."
10059035-30 = "I heard there was a kid who tried to raid the Trinity Carnival Organizing Committee at night just to get their hands on one."
10059035-31 = "I was curious, so I looked into it myself... and you're right, it really is hard to find."
10059035-32 = "But instead, I did find a shop that serves a sweet similar to Semla."
10059035-33 = "Oh, for real? Where is it?"
10059035-39 = "[ns] \"Is this... small talk?\""
10059035-40 = "...Well, we are just chatting, after all."
10059035-41 = "Our Captain, despite how she looks, is an incredibly talkative person."
10059035-42 = "And she doesn't choose who she talks to, either."
10059035-43 = "...Anyway, give me your contact info! Let's go together sometime!"
10059035-44 = "Yeah! #nOh, and it's your treat, of course! Don't try to back out of it later!"
10059035-45 = "...In addition, she has excellent communication skills."
10059035-46 = "[s1] \"I thought 'chat' was a code word for something dangerous...\"\n[s2] \"She really was just a girl who loves to talk...\""
10059035-49 = "The role of the Dormitory Guard is to guide students onto the right path."
10059035-50 = "And that doesn't just mean using force."
10059035-51 = "Strength and words—conflict and harmony."
10059035-52 = "Only when these polar opposites mesh beautifully can one truly guide others."
10059035-53 = "Of course, there are exceptions to everything. #n...Sometimes, there is no choice but to suppress by force."
10059035-54 = "[s] \"Sometimes...?\""
10059035-55 = "Yes, sometimes."
10059035-61 = "...Well, that's how I ended up working here."
10059035-62 = "So? #nWhy are you guys looking for your own art pieces in a place like this?"
10059035-63 = "It seems someone has been taking the students' work, but we don't know who."
10059035-64 = "Do you have any leads?"
10059035-65 = "If it's hard to talk about, you don't have to."
10059035-66 = "We're just security, so we don't know the details."
10059035-67 = "If you're curious, why not check out that underground auction over there? #nThere seems to be an unusually high volume of goods moving through there lately."
10059035-68 = "Are you sure you should be telling us something so important?"
10059035-69 = "Like I said, we're just security."
10059035-70 = "I only took this job because I wanted to eat fancy sweets. #nI figured it'd be fine if you were the one paying."
10059035-71 = "Sooooo, don't forget your promise, okay?"
10059035-72 = "...That's what they said."
10059035-73 = "As expected of Dormitory Guard Captain Sayo. #nShe found a perfect way to handle the enemy."
10059035-74 = "Everyone, we're heading to the underground auction venue."
10059035-75 = "Hmm..."
10059035-76 = "I'm sorry. Would you mind passing out for a little bit?"
10059035-77 = "Otherwise, the others will get suspicious, won't they?"
10059035-78 = "Damn it. I know that, but still..."
10059035-79 = "I-if you're gonna do it, be gentle..."
10059035-90 = "Come, let's move."
10059035-94 = "W-well then, everyone! Next up, we have this piece of ar—"
10059035-100 = "Wh-what is this!? What on earth is—!!"
10059035-112 = "Oh my. It was true. #nEvery piece here has the Wild Hunt's seal on it."
10059035-113 = "So it really was their doing...!"
10059035-114 = "Y-you people...!!"
10059035-115 = "Security! What is security doing!? Hurry up and take them down!!"
10059035-123 = "Sigh... I didn't intend to work this hard."
10059035-127 = "This is getting tedious. Will you all just be quiet now?"
10059035-137 = "Hah, hah... Damn it, they caught on faster than I thought...!"
10059035-138 = "I won't let you catch me! #nDo you have any idea how hard I worked to climb this high—!!"
10059035-139 = "—Hm!?"
10059035-145 = "To think you'd try to run away alone. #nI don't sense any dignity in you as someone in a position of power."
10059035-146 = "You're likely just a low-level pawn anyway... but you don't know nothing, do you?"
10059035-147 = "Would you mind telling me everything you know?"
10059035-148 = "While I'm still in a kind mood."
10059035-149 = "Ha, I won't talk even if it kills me...!"
10059035-150 = "If I betray them, I'll be erased forever...!!"
10059035-151 = "I see. You have a certain level of loyalty, then."
10059035-152 = "I don't dislike people like that."
10059035-153 = "In honor of that loyalty... I shall make it quick for you."
10059035-154 = "Eek! I-I won't let you...!!"
10059035-163 = "Guh...!"
10059035-167 = "...A futile struggle."
10059035-169 = "Take them away."
10059035-178 = "M-Manami-sama. The suppression inside... is finished."
10059035-179 = "However, there's... a very ominous scent here."
10059035-180 = "Kanon-sama is checking the ledgers... #nIt seems it's true that the students' work was being used for illegal transactions..."
10059035-181 = "I am so sorry... If only I had noticed sooner, this wouldn't have happened..."
10059035-182 = "This is an illegal organization's hideout. Now is not the time to ask whose fault it is."
10059035-183 = "Let's prioritize recovering the art and documents, then withdraw."
10059035-184 = "...Yes! #nI'll go assist Kanon-sama."
10059035-185 = "Manami-sama... please, take a short rest here..."
10059035-191 = "Normally, this is no time for resting..."
10059035-192 = "As expected of Vice President Urara. You saw right through me."
10059035-193 = "I intended to hide my fatigue, but I suppose I pushed myself too hard... #nI will graciously accept your offer."
10059035-194 = "[s] \"Are you really okay?\""
10059035-195 = "Yes. A short rest is all I need."
10059035-196 = "If you are still worried, however—"
10059035-197 = "I shall grant you the honor of lending me your shoulder."
10059035-198 = "[s] Nod silently."
10059035-199 = "Hehe. You're accepting it without running away, I see."
10059035-205 = "...Thank you for your kindness."
10059035-206 = "Leaning on someone like this is... something I haven't done in a very long time."
10059035-207 = "Normally, I would want to commemorate this as a 'special moment'... #nbut I don't feel like it right now."
10059035-211 = "This is the worst-case scenario I could have imagined."
10059035-212 = "To think that the students' work was being used for crime."
10059035-213 = "This incident will surely stay with me for a long time."
10059035-214 = "So there is such a thing as 'art of sensation' that is not only beautiful, but bitter as well."
10059035-215 = "..."
10059035-216 = "There is no room for leniency. We will be thorough."
10059035-217 = "—To those who defile art, I bring the hammer of justice."
