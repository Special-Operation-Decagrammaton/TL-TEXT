[translation]
2000603-1 = "Выходной гения"
2000603-2 = "Последнее сообщение Саи меня обеспокоило, поэтому я решил пойти за ней."
2000603-4 = "Променад Чёрной Черепахи, Шаньхайцзин"
2000603-5 = "Угх. Почему мне никто не верит?!"
2000603-6 = "Я ведь постоянно говорю, что мы просто идём поесть обычного чизкейка, а они все убегают, заявляя, что тут наверняка что-то подозрительное."
2000603-7 = "Но ничего! Незусукэ будет моей парой. Теперь-то нам точно не откажут."
2000603-8 = "Правда, Незусукэ?"
2000603-9 = "*пиик* *пиик*..."
2000603-10 = "Пойдём. Заходим."
2000603-11 = ""
2000603-13 = ""
2000603-14 = "[ns] Следовать за Саей."
2000603-16 = "Кафе сладостей на Променаде"
2000603-18 = "Добро пожаловать. Сколько вас будет?"
2000603-19 = "Столик на одного вполне подойдёт!"
2000603-20 = "Сегодня я одинокий гений..."
2000603-22 = "Нет, одинокий гурман!"
2000603-24 = ""
2000603-25 = "П-Понятно. Позвольте проводить вас к столику."
2000603-27 = "Что будете заказывать?"
2000603-28 = "Мне очень большой чизкейк с голубым сыром для пар, пожалуйста!"
2000603-29 = "Эм... Мне очень жаль, мисс. Как вы сами сказали, это блюдо предназначено только для пар. Одному посетителю мы его не подаём."
2000603-30 = "Почему? Боитесь, что я одна не справлюсь?"
2000603-31 = "А вот тут вы ошибаетесь. Пусть я и выгляжу маленькой, я настоящий гурман и никогда не оставляю еду."
2000603-32 = "Однажды я даже за один присест съела целое ведро сыра!"
2000603-33 = "Нет, дело не в этом. Просто такова политика заведения. Мне очень жаль."
2000603-34 = "Хмпф. Какие жадины."
2000603-35 = "Я так и думала, что такое может случиться, поэтому я КОГО-ТО привела."
2000603-36 = "Выходи, Незусукэ!"
2000603-37 = "*пиик* *пиик*..."
2000603-38 = "Знакомьтесь, мой лабораторный партнёр Незусукэ!"
2000603-39 = "Теперь нас двое. Можно заказать очень большой чизкейк для пар?"
2000603-40 = "Эм... Простите, но домашних животных мы не считаем посетителями."
2000603-41 = "Что вы сказали?! Незусукэ не питомец — он семья!"
2000603-42 = "[s1] «Извините...»\n[s2] «Вообще-то мы с ней вместе.»"
2000603-43 = "О! Вы не сказали, что к вам кто-то присоединится."
2000603-44 = "О! Вы не сказали, что к вам кто-то присоединится."
2000603-45 = "Что вы здесь делаете, Сенсей?"
2000603-46 = "[s] «Вы слышали. Чизкейк для пар, пожалуйста.»"
2000603-47 = "Да, заказ принят. Сейчас принесу."
2000603-48 = ""
2000603-49 = "Не ожидала увидеть вас здесь."
2000603-50 = "[s] «Я пошёл за тобой, потому что волновался.»"
2000603-52 = "Что? Вы про то сообщение в MomoTalk?"
2000603-53 = "Не стоило ради этого идти..."
2000603-54 = "Но всё равно я рада, что вы здесь. Благодаря вам я наконец попробую тот чизкейк, который давно хотела."
2000603-55 = "Они здесь жутко цепляются за правила, так что заказать его было настоящей мукой."
2000603-56 = "[s3] «Почему ты не позвала кого-нибудь из клуба?»\n[s4] «Друзей нет, да?»"
2000603-57 = "Я звала! Дважды!"
2000603-58 = "Э-Эй, не обязательно так грубо. У меня есть друзья..."
2000603-59 = "Просто каждый раз, когда я предлагаю остальным что-нибудь поесть, они внезапно убегают, говоря, что у них другие планы."
2000603-60 = "Не то чтобы я КАЖДЫЙ день хотела кормить их едой, смешанной с моими эликсирами."
2000603-61 = "Почему они так меня подозревают?"
2000603-62 = "[s] «Что посеешь, то и пожнёшь.»"
2000603-63 = "Что?! Это клевета!"
2000603-64 = "Я никогда никого не заставляла пробовать мои эксперименты. Технически."
2000603-65 = "Они всегда принимают всё добровольно... после того как я подмешаю это им без предупреждения. Ну, вы понимаете."
2000603-66 = "В общем! Если они не хотят проводить со мной выходные, сами виноваты!"
2000603-67 = "У меня всегда есть Незусукэ. Что ещё мне нужно?"
2000603-68 = "Для такого гения, как я, одиночество совершенно естественно. Ха-ха-ха!"
2000603-69 = "[s] «В таком случае я пойду.»"
2000603-70 = "П-Постойте! Хотя бы дождитесь, пока нам принесут чизкейк!"
2000603-73 = "Спасибо за ожидание. Ваш очень большой чизкейк с голубым сыром для пар."
2000603-74 = "Вот он! Он и правда здесь!"
2000603-75 = "Хе-хе. Только здесь можно заказать чизкейк, приготовленный исключительно из голубого «мозгового» сыра. Это деликатес, знаете ли."
2000603-76 = "Я так давно хотела его попробовать."
2000603-77 = ""
2000603-79 = ""
2000603-80 = ""
2000603-81 = "Именно такой вкусный, как я и думала! ♪"
2000603-82 = "[s] «Выглядит так, будто у него срок годности вышел...»"
2000603-84 = "Не судите книгу по обложке! К выдержанному сыру нужно привыкнуть. Чтобы понять его настоящую ценность, надо попробовать самому!"
2000603-85 = "Просто доверьтесь мне и откусите."
2000603-88 = "[s5] «Не так плохо, как я ожидал.»\n[s6] «Выглядит мерзко, но насыщенный вкус действительно хорош.»"
2000603-89 = "Вот видите? Выдержанный сыр нужно оценивать языком, а не глазами."
2000603-90 = "Вот видите? Выдержанный сыр нужно оценивать языком, а не глазами."
2000603-91 = "Я знала, что вы оцените вкус."
2000603-92 = "И этот чизкейк гораздо вкуснее, когда ешь его вместе с кем-то. ♪"
2000603-93 = "[s] «А разве ты не говорила, что любишь проводить выходные одна?»"
2000603-94 = "Э-Это правда, но...!"
2000603-95 = "Ну, иногда..."
2000603-96 = "...провести не такой уж одинокий выходной тоже неплохо."
2000603-98 = "Мы с Саей вместе съели огромный торт и прекрасно провели день."
