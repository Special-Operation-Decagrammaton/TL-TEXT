[translation]
1600502-1 = "Летняя сирена"
1600502-2 = "Вскоре после прибытия на пляж я заметил Цуруги вдалеке."
1600502-3 = ""
1600502-4 = ""
1600502-5 = ""
1600502-6 = "Вокруг тихо и безлюдно. Похоже, Цуруги что-то ищет."
1600502-7 = "..."
