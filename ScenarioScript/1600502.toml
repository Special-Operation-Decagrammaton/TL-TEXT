1600502-35 = "...?"
1600502-36 = "Сирена?"
1600502-37 = "Тсс! Оно тебя услышит! Нам нужно убираться отсюда!"
1600502-38 = "Ты прав. Даже все торговцы закрывают лавки."
1600502-39 = "Не делайте резких движений. Давайте осторожно перейдём на другой пляж."
1600502-40 = "...?"
1600502-41 = "*гул голосов*"
1600502-44 = "..."
1600502-45 = ""
1600502-47 = "Почему...?"
1600502-49 = "Вот поэтому я теперь здесь совсем одна."
1600502-50 = "Похоже, мой первый раз на пляже этим летом прошёл совсем не так, как я ожидала..."
1600502-51 = "Так что теперь моя задача — найти и уничтожить то, что они называют «сиреной»."
1600502-52 = "[s] «...»"
1600502-54 = "[s] «...!»"
1600502-55 = "Почему-то я пока ничего не нашла. И вообще не похоже, чтобы здесь ещё кто-то был."
1600502-56 = "Есть идеи, как выманить её, Сенсей?"
1600502-57 = "[s] «Эта „сирена“, о которой ты говоришь, это...»"
1600502-58 = "Сенсей?"
1600502-59 = "[s] «...»"
1600502-61 = "[s5] «О, эм, да. Непростая у тебя ситуация...»\n[s6] «(У меня не хватает духу ей сказать!)»"
1600502-62 = "Почему ты так нервничаешь, Сенсей? Ты ведь не заметил сирену?"
1600502-63 = "Почему ты так нервничаешь, Сенсей? Ты ведь не заметил сирену?"
1600502-64 = "Уверен? Хорошо. Прости."
1600502-65 = "Ты выглядел так, будто что-то понял, поэтому я невольно обнадёжилась."
1600502-66 = "Хм. Так мы быстро ни к чему не придём."
1600502-67 = "На пляже приятно, но я ожидала чего-то куда более... оживлённого."
1600502-68 = "..."
1600502-69 = "Не знаю, что ещё можно сделать. Может, нам просто перейти на другой пляж?"
1600502-70 = "[s7] «Не думаю, что бегство что-нибудь решит...»\n[s8] Молча медленно покачать головой."
1600502-71 = "Наверное, ты прав. И что тогда мне делать...?"
1600502-72 = "Наверное, ты прав. И что тогда мне делать...?"
1600502-73 = "Эм..."
1600502-74 = "..."
1600502-75 = "Похоже, для такой, как я, было слишком многого хотеть... оказаться в подобной атмосфере."
1600502-76 = "А?"
1600502-77 = "Ты думаешь, что такой тихий отдалённый пляж — не так уж плохо? Правда?"
1600502-78 = "Ты хочешь сказать, что этот пляж... вполне нормальный?"
1600502-79 = "[s9] «Всё зависит от взгляда на вещи. Нам и вдвоём может быть весело.»\n[s10] «Всего двое? А что плохого в более уединённой обстановке?»"
1600502-80 = "Н-Неужели... Значит, ты так это видишь, Сенсей..."
1600502-81 = "Н-Неужели... Значит, ты так это видишь, Сенсей..."
1600502-82 = "Двое людей на пляже — это довольно..."
1600502-83 = "Довольно..."
1600502-84 = "...?"
1600502-85 = "Ро... ман..."
1600502-86 = "...!"
1600502-87 = "[s] «Цуруги?»"
1600502-88 = "Ке..."
1600502-89 = "[s] «Ке...?»"
1600502-90 = "Кррррррраааагххх!"
1600502-91 = ""
1600502-92 = ""
1600502-93 = "...?"
1600502-95 = "И вот на пляже снова остался всего один человек."
