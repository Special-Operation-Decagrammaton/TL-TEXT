1600502-10 = "...!"
1600502-11 = "О, С-Сенсей. Привет..."
1600502-12 = "Спасибо, что пришёл. Эм, причина, по которой я сегодня тебя позвала..."
1600502-13 = "Мне нужна твоя помощь. Есть кое-что, с чем мне одной немного трудно справиться..."
1600502-14 = "..."
1600502-15 = "[s3] «Какая помощь?»\n[s4] «Ты что-то ищешь?»"
1600502-16 = "О, эм, да. Вообще-то я как раз веду расследование."
1600502-17 = "О, эм, да. Вообще-то я как раз веду расследование."
1600502-18 = "Ну, дело в том..."
1600502-20 = "Часом ранее."
1600502-21 = ""
1600502-23 = ""
1600502-24 = "Ха-ха... Бвахахаха!"
1600502-25 = "Море! Песок! Солнце!"
1600502-26 = "Юность! ЛЕТО ЮНОСТИ!"
1600502-28 = "Кекекекеке!"
