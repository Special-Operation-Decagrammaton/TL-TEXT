212160-10 = ""
212160-12 = ""
212160-13 = "[ns] «?!»"
212160-14 = "Тревога! Всем подразделениям!"
212160-15 = "Что...?!"
212160-16 = "Повторяю! Всем свободным подразделениям!"
212160-17 = "!!!"
212160-18 = ""
212160-20 = ""
212160-21 = ""
212160-22 = "[ns] «Что же это...?»"
212160-24 = "[ns] «Хм? Почему земля трясётся...?!»"
212160-31 = "[ns] «Ого!»"
212160-33 = "[ns] «*кашель* *кашель*»"
212160-34 = ""
212160-36 = ""
212160-37 = "Ну что, глядите, кого собачки откопали!"
212160-38 = "[s] «Касуми!»"
212160-39 = "Ва-ха-ха! Я так и знала, что тебя держат в клетке именно здесь!"
212160-40 = "Председатель Касуми, задание по прокладке тоннеля к тюрьме Префектуры выполнено!"
212160-41 = "Сама вижу! Отличная работа! Молодцы все до единого."
212160-42 = "И даже встречать никто не вышел? Неужели они не ожидали такого? Это же надо так недооценивать Отдел горячих источников..."
212160-43 = "Думали, мы будем у них ручными собачонками? Зато мне было весело их перехитрить. Жаль, они всё пропустили."
212160-44 = "Кстати говоря..."
212160-45 = "Сенсей, пора на свободу!!!"
212160-46 = "[s] «Огромное вам всем спасибо!»"
212160-47 = "Ха-ха, ну не могли же мы упустить шанс тебя спасти?"
212160-48 = "И ещё..."
212160-49 = "Мне хотелось передать послание тем, кто посмел обидеть Мегу."
212160-50 = ""
212160-52 = ""
212160-53 = "Ну что же. Погнали, Сенсей. Надо уносить ноги, пока нас не схватили!"
212160-56 = ""
212160-57 = "Ч-что за?! Засада...?!"
212160-58 = "Где? И кто?!"
212160-59 = ""
212160-62 = ""
212160-64 = ""
212160-66 = "Уф!"
212160-67 = "Ай!!!"
212160-68 = ""
212160-70 = ""
212160-74 = ""
212160-75 = "Простите, но время пришло!"
212160-76 = "О... уже?"
212160-77 = "Хорошо. Поспешим к главному корпусу. Мы займёмся прикрытием штаба."
212160-78 = "Ага! Будем отвлекать внимание. Всех нас она не остановит."
212160-79 = "Немного страшно...! Но если не мы, то кто?"
212160-80 = "Да. Ведь именно мы охраняем границу дозволенного."
212160-81 = "И наша обязанность призывать к порядку тех, кто её переступает! Даже если это глава Префектуры!"
212160-83 = "За тридцать минут до этого..."
212160-84 = "Итак, вот наш план."
212160-85 = "Поскольку Иори, Чинацу и остальные из Префектуры будут вести боевые действия, назовём их «боевой группой»."
212160-86 = "Когда начнётся операция, боевая группа поднимет шум и отвлечёт внимание."
212160-88 = "Конечная цель боевой группы — добраться до главного корпуса Геенны, где находится штаб."
212160-89 = "Элитные силы Пандемониума и глава Префектуры уже там и ждут приказов."
212160-90 = "Главная задача боевой группы — не дать главе Префектуры заметить наши действия в радиорубке. Если она всё же узнает, группа должна помешать ей вмешаться."
212160-92 = "Иори. Чинацу. Справитесь?"
212160-93 = "Я не шучу. Я спрашиваю, сможете ли вы направить оружие на собственного руководителя."
212160-94 = "...Мы должны."
212160-95 = "Иначе нельзя."
212160-96 = "Даже если глава Префектуры нас не услышит, мы продолжим сражаться."
212160-97 = "Целиться, стрелять и не отступать. Даже если проиграем, мы сможем донести свою мысль."
212160-98 = "...Мы на вас рассчитываем."
212160-99 = "А пока боевая группа отвлекает внимание, техническая группа проникнет в радиорубку."
212160-100 = ""
212160-102 = ""
212160-103 = ""
212160-104 = "В техническую группу входят Сацуки, Эрика и Кирара."
212160-105 = "Эрика и Кирара изменят оборудование так, чтобы оно могло самостоятельно передавать радиоволны. Сацуки настроит частоту подавления и передаст сигнал на всю академию."
212160-106 = "Радиорубка по-прежнему будет под усиленной охраной. Боя не избежать."
212160-107 = "Вот тут и понадобятся Маюми, Карен и остальные из Лиги наследия."
212160-108 = "Предоставьте это нам."
212160-109 = "С Карен рядом мы справимся. И сами, конечно, выложимся по полной."
212160-110 = "И Чиаки."
212160-111 = "Да!"
212160-112 = "Твоё задание — сопровождать Сенсея, которого к тому времени освободят, до места боевых действий."
212160-113 = "Пока боевая группа отвлекает охрану, Отдел горячих источников вытащит Сенсея из заключения."
212160-114 = "Прошу безопасно доставить Сенсея туда, где потребуется его особое командование."
212160-115 = "Есть!"
212160-116 = "Это будет нелегко."
212160-117 = "Все в Геенне знают Сенсея в лицо. Вы можете столкнуться со студентами, которые захотят вернуть его под стражу."
212160-118 = "Вам придётся провести Сенсея через все эти опасности целым и невредимым."
212160-119 = "Не волнуйтесь! Я главный репортёр «Еженедельника Пандемониума» и настоящий мастер скрытности."
212160-120 = ""
212160-122 = ""
212160-123 = "...А ещё Эрика, Кирара и Сацуки."
212160-124 = ""
212160-126 = ""
212160-127 = "От вас зависит всё. Ваши задачи особенно важны."
212160-128 = "Успех зависит от того, успеете ли вы настроить нужную частоту и передать сигнал по всей академии."
212160-129 = "...Если включите неправильную частоту — провал. Если наша теория неверна — провал. Если сигнал не пройдёт — тоже провал."
212160-130 = "Чтобы мы победили, вы должны отменить промывание мозгов, пока боевая группа сдерживает противника."
212160-131 = ""
212160-133 = ""
212160-134 = "...Ох, когда всё так перечислишь, шансы кажутся УЖАСНО маленькими."
212160-135 = "Ироха."
212160-136 = ""
212160-138 = ""
212160-139 = "...Да."
212160-140 = ""
212160-142 = ""
212160-143 = "Не волнуйся, подруга. Я не подведу."
212160-144 = ""
212160-145 = "И эта операция не провалится. Мы не провалимся."
212160-146 = ""
212160-147 = "Мы сражаемся ради спасения друзей и тех, кто нам дорог. Мы обязательно победим."
212160-148 = ""
212160-149 = "...Сацуки, с каких пор ты стала такой решительной?"
212160-150 = "Ну что ты. Я всегда такой была, Ироха."
212160-151 = "Фу-фу. Не тревожься. Мы со всем справимся."
212160-152 = "Да-а! И ещё добавим немного блеска!"
212160-153 = ""
212160-155 = ""
212160-156 = ""
212160-157 = "...Да. Я в вас не сомневаюсь."
212160-158 = "Ироха, значит, общее руководство операцией на тебе. Ты будешь нашими глазами."
212160-159 = "Да. Поручите управление мне."
212160-160 = "Итак..."
212160-161 = ""
212160-163 = ""
212160-164 = "Начинаем операцию «Возвращение Геенны»!"
212160-167 = ""
212160-168 = ""
212160-169 = "Там! Предатели!"
212160-170 = "Все в атаку! Ни шагу назад!"
212160-171 = ""
212160-173 = ""
212160-180 = "А-а-а!!!"
212160-181 = ""
212160-184 = ""
212160-185 = ""
212160-186 = "Всё внимание теперь на нас..."
212160-187 = "Они стягивают подкрепления, но пока мы справляемся."
212160-188 = "...А что с главой Префектуры?"
212160-189 = "Подтверждаю: Хина всё ещё в главном корпусе!"
212160-190 = "...Поняла! Действуем по плану!"
212160-191 = "Пойдём, Иори."
212160-192 = "Глава...!"
