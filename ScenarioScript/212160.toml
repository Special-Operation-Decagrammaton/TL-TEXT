212160-13 = "[ns] \"!?!\""
212160-14 = "Alerta de emergência! Todos os pelotões, avançar imediatamente!"
212160-15 = "Como é que é......?!"
212160-16 = "Repetindo! Todas as tropas, assumir formação de combate e marchar!"
212160-17 = "!!"
212160-18 = ""
212160-20 = ""
212160-21 = ""
212160-22 = "[ns] \"O que...... tá acontecendo lá fora......?\""
212160-24 = "[ns] \"......Hum? Que tremor é esse no chão?!\""
212160-31 = "[ns] \"Uooou?!\""
212160-33 = "[ns] \"Cof, cof! Que poeira!\""
212160-34 = ""
212160-36 = ""
212160-37 = "Ora, ora! Pensei que fosse encontrar uma fonte termal, mas acabei desenterrando um tesouro ainda melhor!"
212160-38 = "[s] \"Kasumi!\""
212160-39 = "Hahahahaha! Exatamente como eu calculei! Sabia que estaria mofando aqui dentro!"
212160-40 = "Chefa, o túnel subterrâneo tá 100% aberto!"
212160-41 = "Trabalho impecável! Moças, vocês foram fantásticas!"
212160-42 = "Mas que incompetência gritante: as fundações desta cela não tinham blindagem subterrânea alguma.#nSubestimaram a nossa arte da escavação de forma vergonhosa, não acham?"
212160-43 = "Ou achavam que tínhamos virado marionetes obedientes para sempre?#nSeja como for, passar a perna naquelas arrogantes é um prazer indescritível!"
212160-44 = "Vamos, Sensei!"
212160-45 = "É hora da fuga da prisão!!"
212160-46 = "[s] \"Muito obrigado por vir me salvar!\""
212160-47 = "Hahahahaha! É claro que eu viria salvar o meu Sensei! Como eu poderia recusar?"
212160-48 = "Sem falar que――"
212160-49 = "Eu estava louca para enfiar uma banana de dinamite na empáfia daquelas que fizeram aquilo com a Megu."
212160-50 = ""
212160-52 = ""
212160-53 = "Mas chega de conversa fiada, deixemos o bate-papo pra depois. Vamos dar o fora antes que o alarme toque!"
212160-56 = ""
212160-57 = "Invasão inimiga......?!"
212160-58 = "De onde elas vieram?! Quem são essas atrevidas?!"
212160-59 = ""
212160-62 = ""
212160-64 = ""
212160-66 = "Argh!"
212160-67 = "Uoooh!!"
212160-68 = ""
212160-70 = ""
212160-74 = ""
212160-75 = "Desculpem, veteranas......!"
212160-76 = "Tirem um cochilinho aí no chão por enquanto!"
212160-77 = "Nosso alvo é a sala de comando! Vamos rasgar o caminho até o prédio central de Gehenna!"
212160-78 = "Temos que fazer o maior escarcéu do mundo pra chamar a atenção de todas, né?!"
212160-79 = "Dá um pavor danado...... mas nós somos as únicas que podem fazer isso!"
212160-80 = "Sim! Afinal, nós somos as guardiãs da linha ética!"
212160-81 = "Quem cruzar a linha será arrastada de volta na marra! É esse o nosso papel, não importa se é a nossa própria Presidente!!"
212160-83 = "(30 minutos antes......)"
212160-84 = "Passarei o plano operacional em detalhes agora."
212160-85 = "A ponta de lança do ataque frontal será liderada por Iori, Chinatsu e as integrantes rebeldes da Disciplina.#nPor conveniência tática, este grupo será a Força de Combate."
212160-86 = "A missão primordial da Força de Combate é não deixar a Presidente Hina suspeitar da operação na sala da rádio.#nAbram fogo no instante do início e atraiam todos os olhos do inimigo."
212160-88 = "O objetivo de avanço da Força de Combate é o prédio central de Gehenna, onde fica a sala de comando."
212160-89 = "Lá estão concentradas as tropas de choque da Sociedade Pandemônio e a própria Presidente Hina em pessoa."
212160-90 = "Caso percebam a manobra na rádio, segurem a Presidente Hina na marra pelo máximo de tempo possível."
212160-92 = "Iori-chan, Chinatsu-chan. Vocês aguentam o tranco?"
212160-93 = "Não tô tirando sarro não, tá?#nTô perguntando muito a sério se vocês têm coragem de apontar os fuzis pra chefe de vocês."
212160-94 = "......Não temos outra escolha."
212160-95 = "É o nosso dever."
212160-96 = "Mesmo que as nossas súplicas não alcancem os ouvidos da Presidente, resistiremos até o último cartucho."
212160-97 = "Mirar, disparar e lutar. Mesmo derrotadas, há sentimentos que precisam ser transmitidos a ela."
212160-98 = "......Contamos com vocês."
212160-99 = "Em seguida: a Equipe Técnica. Enquanto o combate distrai as atenções, vocês invadirão a rádio e farão o trabalho."
212160-100 = ""
212160-102 = ""
212160-103 = ""
212160-104 = "A Equipe Técnica é composta por Satsuki-senpai, Erika e Kirara."
212160-105 = "Erika e Kirara burlarão o bloqueio remoto na fiação da antena,#ne a Satsuki-senpai decifrará a frequência para transmiti-la por toda a academia."
212160-106 = "Mesmo com o grosso das tropas atraído pelo ataque frontal, a sala da rádio ainda terá sentinelas de guarda.#nConfrontos esparsos serão inevitáveis."
212160-107 = "E quem dará cobertura armada a essa equipe serão a Mayumi, a Karen e as alunas do Comitê de Restauração."
212160-108 = "Deixa com a gente!"
212160-109 = "Com a Karen junto não tem erro! Vamos lutar com toda a alma!"
212160-110 = "E você, Chiaki."
212160-111 = "Às ordensss!"
212160-112 = "Sua missão é guiar o Sensei em segurança."
212160-113 = "Enquanto a Força de Combate atrai os holofotes, o Departamento de Fontes Termais resgatará o Sensei pelo subterrâneo."
212160-114 = "Você fará o contato na saída do túnel e o escoltará até os postos de comando que exigirem a presença dele."
212160-115 = "Pode deixar comigo, vai ser mamão com açúcar!"
212160-116 = "Não trate isso com leviandade: é uma missão de altíssimo perigo."
212160-117 = "O rosto do Sensei é conhecido por toda Kivotos.#nNa pior das hipóteses, vocês trombarão com patrulhas inimigas repetidas vezes."
212160-118 = "Desviem de tudo e protejam o Sensei com a própria vida."
212160-119 = "Hahaha, não esquenta os miolos! Como jornalista experiente, infiltração furtiva é a minha maior especialidade!"
212160-120 = ""
212160-122 = ""
212160-123 = "......E Erika, Kirara, Satsuki-senpai."
212160-124 = ""
212160-126 = ""
212160-127 = "Vocês três são o coração pulsante de toda esta operação."
212160-128 = "Toda a vitória ou derrota depende exclusivamente de conseguirem sintonizar e irradiar a contra-frequência pelos alto-falantes."
212160-129 = "Se errarem a sintonia, fracassamos; se não conseguirem transmitir, fracassamos;#ne se a hipótese científica estiver furada, estaremos todas mortas."
212160-130 = "Nossa única condição de vitória é quebrar o transe mental antes que a Força de Combate seja trucidada."
212160-131 = ""
212160-133 = ""
212160-134 = "Falando em voz alta, soa como um desespero suicida......"
212160-135 = "Iroha-chan."
212160-136 = ""
212160-138 = ""
212160-139 = "......Sim?"
212160-140 = ""
212160-142 = ""
212160-143 = "Não há motivo para medo. Eu não cometo erros."
212160-144 = ""
212160-145 = "E não sou apenas eu: nenhuma das alunas envolvidas nesta missão falhará."
212160-146 = ""
212160-147 = "Estamos lutando por quem amamos e queremos proteger. Nós vamos vencer, sem sombra de dúvidas."
212160-148 = ""
212160-149 = "......Senpai, desde quando a senhorita virou uma figura tão inspiradora?"
212160-150 = "Ora, eu sempre fui admirável, você que demorou para notar!"
212160-151 = "Fufufu, não se preocupe! A gente vai dar um jeito em tudo com certeza!"
212160-152 = "Isso aí! Vamos fazer essa missão brilhar muito!"
212160-153 = ""
212160-155 = ""
212160-156 = ""
212160-157 = "......Certo. Conto com todas vocês."
212160-158 = "Iroha, coordene toda a operação da retaguarda. Você é os nossos olhos e ouvidos."
212160-159 = "Deixe o gerenciamento tático comigo."
212160-160 = "Sendo assim――"
212160-161 = ""
212160-163 = ""
212160-164 = "Iniciando a Operação Resgate de Gehenna!"
212160-167 = ""
212160-168 = ""
212160-169 = "Ali estão elas! As rebeldes!"
212160-170 = "Fogo em todas! Não recuem um passo sequer!"
212160-171 = ""
212160-173 = ""
212160-180 = "Uaaaaaargh!!"
212160-181 = ""
212160-184 = ""
212160-185 = ""
212160-186 = "Boa! Tão vindo todas pra cima da gente......!"
212160-187 = "O número de inimigas está crescendo, mas conseguimos sustentar a posição por enquanto."
212160-188 = "......E a Presidente? Ela ainda não deu as caras?"
212160-189 = "Confirmamos que ela ainda permanece no interior do prédio central!"
212160-190 = "......Entendido! Continuem conforme o plano estabelecido!"
212160-191 = "Vamos avançar, Iori!"
212160-192 = "Aguenta firme...... Presidente Hina......!!"
