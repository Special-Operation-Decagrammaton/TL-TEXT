[translation]
212160-1 = "Episode 16;Gehenna Reclamation Operation (1)"
212160-13 = "[ns] \"!?\""
212160-14 = "It's an emergency! All units, mobilize!"
212160-15 = "What was that...!!"
212160-16 = "I repeat! All units, move out and prepare for combat!"
212160-17 = "!!"
212160-22 = "[ns] \"What... just happened...?\""
212160-24 = "[ns] \"...Hm? What's this vibration!?\""
212160-31 = "[ns] \"Whoa!?\""
212160-33 = "[ns] \"*Cough*, *cough*!\""
212160-37 = "Oh my, I thought I was digging for a hot spring, but I seem to have struck something else entirely."
212160-38 = "[s] \"Kasumi!\""
212160-39 = "Hah-hah-hah-hah! Well, it went exactly as expected. I knew you'd be here!"
212160-40 = "Department Head, the tunnel is open!"
212160-41 = "Well done! Good work, everyone!"
212160-42 = "Though, they really didn't prepare for anything under the floorboards, did they?#nI guess they really underestimated us."
212160-43 = "Or perhaps they thought we had become complete puppets. #nRegardless, it feels good to pull the rug out from under them like this!"
212160-44 = "Now, Sensei!"
212160-45 = "It's time to break out!!"
212160-46 = "[s] \"Thank you for coming!\""
212160-47 = "Hah-hah-hah-hah. I'm here to save Sensei. How could I possibly refuse?"
212160-48 = "Besides—"
212160-49 = "I wanted to give those people who did that to Megu a taste of their own medicine."
212160-53 = "Come now, let's save the chatter for later. We need to slip away before we're found!"
212160-57 = "An attack...!?"
212160-58 = "Where did they come from? And who on earth is doing this!?"
212160-66 = "Ugh!"
212160-67 = "Aaaah!!"
212160-75 = "Sorry, Senior...!"
212160-76 = "Please, just rest for a moment!"
212160-77 = "Our target is the operation conference room! We're charging straight to the Gehenna main building!"
212160-78 = "We just need to make a big enough scene to draw their attention, right?"
212160-79 = "It's a little scary, but... we have to do this!"
212160-80 = "Yes. Because we are the ones who protect the line."
212160-81 = "We bring back those who cross the line! That's who we are! It doesn't matter if it's our own Prefect Team leader!!"
212160-83 = "(30 minutes ago...)"
212160-84 = "I will now explain the outline of the operation."
212160-85 = "Iori, Chinatsu, and the rest of the Prefect Team will serve as the main combat force. #nFor convenience, we will call this team the Combat Squad."
212160-86 = "The Combat Squad's primary role is to ensure the Prefect Team leader does not notice the anomaly in the broadcasting room. #nPlease cause a commotion as soon as the operation begins to draw the enemy's gaze."
212160-88 = "The Combat Squad is aiming for the Gehenna main building, where the operation conference room is located."
212160-89 = "In addition to the elite forces of Pandemonium Society, the Prefect Team leader is stationed there permanently."
212160-90 = "Even if she notices the anomaly in the broadcasting room, please stall her for as long as possible."
212160-92 = "Iori, Chinatsu. Can you really do this?"
212160-93 = "Oh, don't tease me. #nI'm asking if you can really point your guns at your own leader."
212160-94 = "...We have no choice."
212160-95 = "We must do it."
212160-96 = "Even if our cries don't reach the leader, we will continue to resist."
212160-97 = "Aim, shoot, and fight. Even if we lose, there are things we have to convey."
212160-98 = "...Please."
212160-99 = "Next, the Technical Squad. While the Combat Squad is drawing their attention, you will infiltrate the broadcasting room and proceed with the work."
212160-104 = "The Technical Squad consists of Satsuki, Erika, and Kirara."
212160-105 = "Erika and Kirara will tamper with the remote control system, #nand after Satsuki analyzes the jamming frequency, she will broadcast it to the entire academy."
212160-106 = "We expect the security around the broadcasting room to remain tight during that time. #nEven if the reserve forces are pulled away, sporadic combat is bound to occur."
212160-107 = "Mayumi, Karen, and the rest of the Gehenna Restoration Committee will handle that."
212160-108 = "Leave it to us."
212160-109 = "As long as Karen is here, I'm not worried, and we'll fight with everything we've got."
212160-110 = "And Chiaki."
212160-111 = "Yes!"
212160-112 = "Your role is to guide Sensei to the site."
212160-113 = "While the Combat Squad draws attention, the Hot Spring Development Department will help Sensei escape."
212160-114 = "Take over along the way and bring them safely to the location where they are needed for command."
212160-115 = "Leave it to me!"
212160-116 = "This is by no means an easy mission."
212160-117 = "Sensei's face is widely known. #nIn the worst-case scenario, you may have to engage in combat with students from the other side multiple times."
212160-118 = "Navigate through that and protect Sensei at all costs."
212160-119 = "Heh-heh-heh, no need to worry! As a budding journalist, stealth is my specialty!"
212160-123 = "...And Erika, Kirara, Satsuki."
212160-127 = "The three of you are the key to this operation."
212160-128 = "Victory depends on whether you can set the jamming frequency and broadcast it to the entire academy."
212160-129 = "If the frequency is off, we fail; if you can't broadcast, we fail; #nand if the hypothesis itself is wrong, we fail."
212160-130 = "Our condition for victory is to break the brainwashing while the Combat Squad holds the line."
212160-134 = "Hearing it put like that, it sounds hopeless..."
212160-135 = "Iroha."
212160-139 = "...Yes."
212160-143 = "Don't worry. I don't fail."
212160-145 = "No, it's not just me. No one involved in this operation will fail."
212160-147 = "Because this is a fight for the people we want to protect. We will win."
212160-149 = "...Senior, since when did you become so reliable?"
212160-150 = "Oh my, haven't I always been reliable?"
212160-151 = "Hehe, don't worry. I'll make sure we find a way."
212160-152 = "Yeah! We'll do it with a sparkle!"
212160-157 = "...Yes. I'm counting on you."
212160-158 = "Iroha, please handle the overall coordination. You are our eyes."
212160-159 = "Leave the operations to me."
212160-160 = "Then—"
212160-164 = "Operation Gehenna Reclamation begins."
212160-169 = "There they are! The rebels!"
212160-170 = "All units, attack! Don't back down!"
212160-180 = "Whoa!!"
212160-186 = "Alright, they're gathering just as planned...!"
212160-187 = "The number of enemies is increasing, but we can hold out against this much."
212160-188 = "...What about the leader? Has she not come out yet?"
212160-189 = "We have confirmed she is still inside the main building!"
212160-190 = "...Understood! Proceed as planned!"
212160-191 = "Let's go, Iori."
212160-192 = "Just you wait... Leader...!"