[translation]
2000620-1 = "Почему я катаюсь"
2000620-2 = "Следуя указаниям Саи, я отправился в ближайший парк."
2000620-3 = ""
2000620-7 = "Когда я пришёл, то сразу заметил Саю на широкой открытой дорожке. Похоже, она что-то готовила."
2000620-8 = ""
2000620-10 = ""
2000620-11 = ""
2000620-12 = ""
2000620-13 = ""
2000620-14 = ""
2000620-15 = "...О, Сенсей! Сюда! Сюда!"
2000620-16 = "Уверена, вы с нетерпением ждали моего новейшего изобретения!"
2000620-17 = "И вам повезло! Вам выпала честь присутствовать при его представлении!"
2000620-18 = "...Что? Для чего всё это?"
2000620-19 = "Что за изобретение? Как много вопросов, Сенсей!"
2000620-20 = "Хм, как бы объяснить попроще..."
2000620-21 = "Это своего рода... духи."
2000620-22 = "Да! Что-то вроде духов, только предназначенных для распыления на улице."
2000620-23 = "[s1] «Ты случайно не изобрела... освежитель воздуха?»\n[s2] «Круто! Что-то вроде уличного освежителя воздуха!»"
2000620-26 = "Нет! Это моё собственное уникальное изобретение! Не какой-то магазинный освежитель воздуха!"
2000620-27 = "Оно совершенно другое и куда эффективнее. Достаточно нескольких распылений на дорожках, и аромат распространится по всему парку!"
2000620-28 = "Это духи! Ну... духи для парка!"
2000620-29 = "Сегодня днём здесь пройдут мероприятия, но в этом году цветов распустилось гораздо меньше прогнозов."
2000620-30 = "Поэтому я взяла дело в свои руки и позаботилась о том, чтобы все сегодняшние посетители всё равно смогли насладиться приятным ароматом свежих цветов!"
2000620-31 = "Я даже добавила особые ингредиенты, чтобы гости чувствовали себя спокойно и расслабленно."
2000620-32 = "[s3] «На удивление безобидное изобретение...»\n[s4] «Вообще-то звучит как хорошая идея.»"
2000620-35 = "...Что вы сказали? Не понимаю."
2000620-36 = "В любом случае это не главное!"
2000620-37 = "Я позвала вас сюда ранним утром не только для того, чтобы вы созерцали мой безграничный гений!"
2000620-38 = "Сегодня вы будете моим помощником! Мне нужна помощь, чтобы равномерно распространить аромат по всему парку."
2000620-39 = "Я буду ездить и распылять духи, а вы просто передавайте мне следующую партию, как только я закончу участок!"
2000620-40 = "...А?"
2000620-41 = "Вас беспокоит не план, а моё снаряжение...? А что с ним не так?"
2000620-42 = ""
2000620-44 = ""
2000620-45 = "...А!"
2000620-46 = ""
2000620-48 = ""
2000620-49 = ""
2000620-51 = "Скейтборд!"
2000620-52 = "Почему я использую скейтборд? Почему не велосипед или самокат?"
2000620-53 = ""
2000620-55 = ""
2000620-56 = "...Ха-ха-ха! Иногда ваша научная любознательность меня удивляет, Сенсей!"
2000620-57 = ""
2000620-59 = ""
2000620-60 = ""
2000620-62 = "У скейтборда множество преимуществ, которых нет у велосипедов и самокатов!"
2000620-63 = "[s5] «Правда? Ты уверена...?»\n[s6] «Каких именно преимуществ?»"
2000620-66 = "*вздыхает*"
2000620-67 = "Вот поэтому до крайности обычным людям никогда не понять разум гения."
2000620-68 = "Подумайте сами: чтобы ехать на велосипеде или самокате, мне нужно держаться за руль, верно? Если отпущу руки, я больше не смогу управлять!"
2000620-69 = "А учитывая сегодняшнюю задачу, обе руки нужны мне, чтобы как следует распылять аромат."
2000620-70 = "Мне нужны свободными обе руки, чтобы держать по бутылке в каждой!"
2000620-71 = "На скейтборде руки свободны, и я могу делать ими что угодно. А ещё по узким парковым дорожкам на нём ездить намного проще, чем на велосипеде."
2000620-72 = "Конечно, есть нюанс: освоить скейтборд несколько сложнее."
2000620-73 = "Но я идеальна! Я гений и в разработке новых лекарств, и в скейтбординге!"
2000620-74 = "Так что не волнуйтесь, Сенсей. Это великолепное средство передвижения словно создано для меня и моего изобретения!"
2000620-75 = "А теперь хватит болтать!"
2000620-76 = "Времени мало! Нужно всё распылить до того, как люди начнут собираться на мероприятия!"
2000620-77 = "По бутылке в каждую руку..."
2000620-78 = ""
2000620-80 = ""
2000620-81 = "И... я поехала! Сенсей, готовьте мне новые бутылки!"
2000620-82 = ""
2000620-84 = ""
2000620-86 = "Фух!"
2000620-88 = ""
2000620-95 = "Хм... А...?"
2000620-96 = "Ч-Что это за чувство... Мне так..."
2000620-97 = "В жизни нет никаких забот... Зачем думать... когда так спокойно..."
2000620-98 = "Эм..."
2000620-99 = ""
2000620-102 = "...А-а-а-а?!"
2000620-103 = ""
2000620-115 = "Я услышал крик Саи и тут же побежал к ней. Вокруг неё всё ещё витал запах духов, от которого мне становилось спокойно... расслабленно... и немного... сонно..."
2000620-116 = "К счастью, она не пострадала, и остаток парка мы опрыскали уже пешком. Правда, с куда меньшей спешкой, чем начинали."
