[translation]
10005040-1 = "Эпизод 4;Всё как прежде"
10005040-2 = "Коридор у заднего входа в игровой зал"
10005040-4 = ""
10005040-5 = "...Здесь чисто."
10005040-6 = "Здесь тоже чисто."
10005040-7 = "Карин?"
10005040-9 = "Здесь тоже чисто. Пока нас никто не заметил."
10005040-10 = "Мне так жаль. Это всё моя вина."
10005040-11 = "Мы все ошибаемся, Карин. Не вини себя."
10005040-12 = "И даже если охранница потеряла сознание, мы всё равно получили зацепку."
10005040-13 = "Наверное... Пока была без сознания, она всё бормотала «игровой зал»."
10005040-14 = "Если подумать, возможно, она пыталась сказать мне это ещё тогда, когда я закрыла ей рот..."
10005040-15 = "Но что вообще такое игровой зал?"
10005040-16 = "Разве ты не видела его на карте? Так называется большая центральная комната."
10005040-17 = "Я-я не это имела в виду..."
10005040-18 = "Она хочет сказать, что само название «игровой зал» звучит немного подозрительно."
10005040-19 = "Если честно, я тоже не совсем понимаю. Чем вообще занимаются в игровом зале?"
10005040-20 = "Интересно, это связано с поддельными облигациями Белой Кролички?"
10005040-21 = "Сенсей, вы знаете, что такое игровой зал?"
10005040-22 = "[s1] «Эм, никогда о таком не слышал.»\n[s2] «Судя по названию, наверное, место для игр?»"
10005040-24 = "Вот это загадка."
10005040-26 = "Место для игр?"
10005040-28 = "Хахаха! Какая разница? Давайте просто устроим там хаос!"
10005040-29 = "Игровой зал, шмигровой зал! Неважно, что это, ворвёмся и всех отмутузим!"
10005040-30 = "Именно так C&C и работает, да?"
10005040-31 = "Хм. Хотя я не могу полностью согласиться..."
10005040-32 = "Учитывая всё произошедшее, она не совсем неправа."
10005040-33 = "Но должна подчеркнуть, президент: наша цель — только Белая Кроличка."
10005040-34 = "План такой: проникнуть в игровой зал, разделиться и найти Белую Кроличку."
10005040-35 = "Когда найдёте её, сообщите всем и обезвредьте так, чтобы никто не заметил."
10005040-36 = "Мы войдём с дымовыми и светошумовыми гранатами, чтобы минимизировать ущерб."
10005040-37 = "И самое главное — мы не хотим драться с охраной или причинять им вред."
10005040-38 = "Мы всё ещё об этом...?"
10005040-39 = "[s3] «Будет трудно, но я верю в тебя, Нэру.»\n[s4] «Раз это ты, Нэру, я уверен, что справишься.»"
