10005040-66 = "О! Хм, вы не знали?"
10005040-67 = "Все удобства на борту — каюты, питание, развлечения и даже туалеты — используют билеты розыгрыша для определения качества."
10005040-68 = "Можно вытянуть любой класс от D до S. Обычно, если выпадает A, вы получаете лучшее из лучшего на этом корабле!"
