10020040-16 = "Именно! У этой штуки потрясающие возможности!"
10020040-17 = "Итак, просто чтобы подтвердить... Если мы уничтожим Двигатель измерений Области 4, сможем активировать последовательность самоуничтожения Ковчега."
10020040-18 = "Запустится обратный отсчёт, который даст нам ровно столько времени, чтобы снова активировать Утнапиштим и сбежать."
