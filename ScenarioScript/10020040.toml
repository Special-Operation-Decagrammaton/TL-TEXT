10020040-20 = "Удачи!"
10020040-21 = ""
10020040-23 = ""
10020040-25 = "Какое облегчение, Рио. Похоже, твой механизм побега нам всё-таки не понадобится."
10020040-26 = "...Ах."
10020040-28 = ""
