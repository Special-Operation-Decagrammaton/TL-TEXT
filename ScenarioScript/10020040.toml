[translation]
10020040-5 = "В отличие от прошлых битв, другая Широко так и не появилась."
10020040-6 = "Думаете, она сдалась?"
10020040-7 = "Не знаю, но... Не теряйте бдительность!"
10020040-9 = "Хорошие новости! Корабль Утнапиштима почти отремонтирован."
10020040-10 = "Правда?! Отличная новость! Все молодцы!"
10020040-11 = "Фух! Какое облегчение. Честно говоря, я немного переживала."
10020040-12 = ""
10020040-14 = ""
