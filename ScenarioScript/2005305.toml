[translation]
2005305-1 = "Девушке-ниндзя нужен план!"
2005305-2 = "Комната для презентаций"
2005305-3 = "Я не мог не переживать за Мичиру."
2005305-4 = "Поэтому решил присоединиться к ней на презентации."
2005305-5 = "Почтенный Сенсей! Сюда, сюда!"
2005305-6 = "Хм?"
2005305-7 = "Нет-нет, я бы ни за что не пришла заранее... и не сидела здесь одна, знаете ли?"
2005305-8 = "И ещё... Хм?"
2005305-9 = "Почему я в платье?"
2005305-10 = "Почтенный Сенсей, посмотрите на эту атмосферу."
2005305-11 = "Эта презентация — тайная встреча, на которой избранные поделятся своими сокровенными секретами...!"
2005305-12 = "Значит, и одеться нужно соответствующим образом, верно?"
2005305-13 = "Вот поэтому я решила надеть платье и сделать причёску! Няха-ха!"
2005305-14 = "Смотрите, другие тоже пришли в костюмах и платьях!"
2005305-15 = "[s] «Атмосфера и правда такая...»"
2005305-17 = "Я подумал спросить её, часто ли на тайных встречах развешивают вывески и раздают буклеты..."
2005305-18 = "...Но решил просто пойти вместе и увидеть всё своими глазами."
2005305-19 = ""
2005305-20 = "[ns] «И как ты узнала об этой презентации?»"
2005305-21 = "Ну, я смотрела видео... как обычно."
2005305-22 = "И мне попалась реклама... которую нельзя было пропустить."
2005305-23 = "Именно этой презентации!"
2005305-24 = "[s] «То есть ты пришла сюда из-за рекламы...?»"
2005305-25 = "Нет-нет, Почтенный Сенсей, выслушайте меня!"
2005305-26 = "Как обычно, я искала способы развить свой канал. Мне нужна была помощь! Знак!"
2005305-27 = "И именно тогда..."
2005305-28 = "...эта реклама появилась прямо перед моими глазами!"
2005305-29 = "Будто сама давала ответ на все мои тревоги!"
2005305-30 = "И тогда я поняла: это судьба! Или всемогущий алгоритм!"
2005305-31 = "[s] «Эм... Ну да, конечно...»"
2005305-32 = "Ч-Что?! Что это за прохладная реакция?!"
2005305-33 = "В любом случае презентация скоро начнётся, так что давайте займём места!"
2005305-34 = ""
2005305-36 = ""
2005305-38 = "Внутри комнаты для презентаций"
2005305-40 = "Здравствуйте, все."
2005305-41 = "Я знаю, вы все думаете об одном и том же!"
2005305-42 = "«Как получить больше подписчиков? Как набрать больше просмотров и развить канал?»"
2005305-43 = "Разве не поэтому вы все здесь?!"
2005305-44 = "Я так и знала...!"
2005305-45 = "Именно как я думала! Как я и ЗНАЛА!"
2005305-46 = "[s] «...»"
2005305-47 = "Но не волнуйтесь."
2005305-48 = "Желаемые просмотры, такие долгожданные подписчики."
2005305-49 = "Наша компания позаботится, чтобы вы их получили! Ваши мечты могут стать реальностью!"
2005305-50 = "...Что?"
2005305-51 = "Всего за один миллион иен мы гарантируем, что ваше видео взлетит до одного миллиона просмотров!"
2005305-52 = "Это выгодная сделка! Небольшая первоначальная инвестиция. Одна иена — один просмотр, навсегда... ну, почти!"
2005305-53 = "Э-э...?"
2005305-54 = "А, и не волнуйтесь насчёт наших фирменных эксклюзивных методов!"
2005305-55 = "Мы используем совершенно безопасную макро-программу с заявкой на патент, сертифицированную Ассоциацией крякеров Кивотоса! Ням!"
2005305-56 = ""
2005305-58 = ""
2005305-59 = "Так цифры ВСЁ-ТАКИ подделывают...!"
2005305-60 = "Простите, Почтенный Сенсей. Похоже, я совсем неправильно всё поняла."
2005305-61 = "Я пришла сюда в надежде честно узнать, как увеличить просмотры и число подписчиков..."
2005305-62 = "Но, кажется... это просто мошенничество."
2005305-63 = "Уходим, Почтенный Сенсей. Я услышала достаточно."
2005305-64 = ""
2005305-69 = "Хм?"
2005305-70 = "Куда ты идёшь?"
2005305-71 = "Презентация ещё не закончена. У нас осталось много захватывающих подробностей, которыми мы хотим с вами поделиться."
2005305-72 = "А, кажется, суть я уже поняла. Мы уходим."
2005305-73 = "Хм, не думаю, что ваша «суть» особенно хороша, юная леди."
2005305-74 = "Покидать такую важную презентацию посреди выступления против наших—"
2005305-75 = ""
2005305-76 = "[ns] «Прошу прощения. Можно вас на пару слов?»"
2005305-77 = "Хм? Что вы..."
2005305-78 = ""
2005305-80 = ""
2005305-81 = "Погодите, вы же из Шале—"
2005305-82 = "Прошу прощения! Моя ошибка! Пожалуйста... хорошего вам дня, вам обоим."
2005305-83 = ""
2005305-85 = ""
2005305-86 = "[ns] «Пойдём, Мичиру.»"
2005305-87 = "Д-Да, Почтенный Сенсей."
2005305-89 = "Так мы с Мичиру покинули презентацию."
2005305-91 = "Парк неподалёку"
2005305-92 = "Ух... Как стыдно..."
2005305-93 = "Не могу поверить, что меня чуть не обманули эти мошенники..."
2005305-94 = "Кстати, Почтенный Сенсей..."
2005305-95 = "Вы подозревали, что всё так закончится?"
2005305-96 = "[s] «Было такое предчувствие...»"
2005305-97 = "Ух... Вы такой злой, Почтенный Сенсей."
2005305-98 = "[s] «А?!»"
2005305-99 = "Конечно! Это моя вина, что я повелась на подобное...!"
2005305-100 = "Н-Но вы могли хотя бы предупредить меня! Или намекнуть!"
2005305-101 = "[s] «Некоторые неудачи стоит пережить самостоятельно.»"
2005305-102 = "Хм...? Что вы имеете в виду?"
2005305-103 = "[s1] «Если бы мы не пошли, ты могла бы потом пожалеть.»\n[s2] «А сходив туда, ты теперь точно всё знаешь.»"
2005305-106 = ""
2005305-108 = ""
2005305-109 = "М-м, пожалуй, в этом есть смысл."
2005305-110 = "Я могу использовать сегодняшний опыт, чтобы в будущем больше не попадаться на подобные уловки..."
2005305-111 = "Если подумать... Спасибо, Почтенный Сенсей."
2005305-112 = "И после всего, что только что произошло, я решила."
2005305-113 = "...Я больше не попадусь на такое мошенничество. Буду развивать свой канал честно, собственными силами и сохраняя достоинство!"
2005305-114 = "Так что продолжайте смотреть!"
2005305-116 = "Я проводил Мичиру и вернулся в офис."
2005305-117 = "...А затем, разумеется, сообщил о подозрительной организации Валькирии."
