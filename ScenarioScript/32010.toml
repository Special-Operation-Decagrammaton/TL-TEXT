[translation]
32010-1 = "Эпизод 1;Великий Левиафан"
32010-2 = ""
32010-3 = "[ns] «Азуса — предатель?»"
32010-4 = "Да. И я хочу, чтобы вы её защитили."
32010-5 = "Наверное, переходить сразу к сути без подробностей странно. Похоже, вредные привычки Наги на меня влияют."
32010-6 = "Давайте расскажу всё с самого начала."
32010-7 = "Я не так хороша в подобных объяснениях, как Наги или Сэя..."
32010-8 = "...но постараюсь!"
32010-9 = "[s] «Л-Ладно.»"
32010-10 = "Начнём с того, что определяет Тринити General School. Как Наги наверняка сказала, история нашей академии построена на объединении нескольких фракций."
32010-12 = "Как следует из названия, в её центре три главные фракции: Pater, Filius и Sanctus."
32010-13 = "Но существовало и множество меньших фракций, например Рыцари госпиталя и Сестринство."
32010-14 = "В те времена эти фракции враждовали друг с другом не меньше, чем Тринити и Геенна сегодня."
32010-15 = "Столкновения происходили ежедневно и становились всё хуже."
32010-16 = "Пока наконец все не собрались и не заключили мирный договор."
32010-17 = "Так состоялся Первый собор, где договорились прекратить кровопролитие и объединиться в одну академию."
32010-18 = "[s] «Звучит знакомо.»"
32010-19 = ""
32010-20 = "Правда ведь?"
32010-21 = "Именно из Первого собора родилась Тринити General School в нынешнем виде."
32010-22 = "Следы старых фракций сохранились и сегодня, хотя большинство этого не замечает. Со временем история тускнеет."
32010-23 = "Но одна академия отказалась участвовать в соборе."
32010-24 = "Фракция Ариус."
32010-26 = "Я говорю «фракция», но уже давно это организованная академия, похожая на нашу."
32010-27 = "У обеих сторон было много общего, но различия в толковании древних писаний развели их."
32010-28 = "В их академии тоже проходили занятия в часовне, сохранялась строгая консервативная форма и сильное презрение к Геенна."
32010-29 = "Но Ариус яростно выступил против объединения... и вражда в итоге переросла в конфликт."
32010-30 = "После объединения Тринити подавила Ариус. Тот просто не мог противостоять объединённой мощи новой академии."
32010-31 = "Такие истории обычны для истории. Обладатели большой силы часто хотят её испытать, и Ариус оказался удобной целью."
32010-32 = "Академия Ариус пришла в упадок."
32010-33 = "Её изгнали из района Тринити, но слухи говорят, что академия всё ещё существует, скрываясь где-то в подземной части Кивотоса."
32010-34 = "Они держат местоположение своего района в секрете, чтобы избежать наблюдения Тринити. Даже Генеральный студсовет не знает, где сейчас действует Ариус."
32010-35 = "Не удивлюсь, если знающие эту историю считают её городской легендой. Как такая академия вообще может существовать? Хотя большинство наших студентов, думаю, вовсе не знает этой истории."
32010-36 = "Таков Ариус сегодня. Тень, забытая историей."
32010-37 = "[s] «И ты говоришь, Азуса оттуда?»"
32010-38 = ""
32010-39 = "Верно."
32010-40 = "Вы сказали, что история звучит знакомо. Как вы и подозреваете, Эдемский договор Наги — дань Первому собору."
32010-41 = "Это шанс для двух великих академий примириться и объединиться в мире."
32010-42 = "Если звучит слишком хорошо, чтобы быть правдой, то так и есть. Настоящая цель — создать Организацию Эдемского договора, сокращённо ETO."
32010-43 = "Эдемский договор — вовсе не просто мирное соглашение, а начало формального военного союза."
32010-44 = ""
32010-46 = ""
32010-47 = ""
32010-48 = "Создание единой вооружённой организации из объединённых сил Тринити и Геенна."
32010-50 = ""
32010-51 = "Мы живём в неопределённые времена — президент Генерального студсовета всё ещё пропала. И теперь из тени поднимается новая подавляющая сила."
32010-52 = "И что Наги собирается с ней делать, интересно."
32010-53 = "Может, атаковать остатки Генерального студсовета и взять Кивотос под контроль?"
32010-54 = "Или она планирует искоренить Миллениум и остановить её внезапное превращение в новую восходящую академию Кивотоса?"
32010-55 = "Точно сказать её цель не могу, но одно знаю."
32010-56 = "Такая огромная сила способна заставить замолчать любого несогласного."
32010-57 = "Так же, как Тринити когда-то поступила с Ариус."
32010-58 = "Или как Сэя..."
32010-59 = ""
32010-61 = ""
32010-62 = "Эм, простите. Сделайте вид, что не слышали."
32010-63 = "[s] «С Сэей что-то случилось?»"
32010-64 = "..."
32010-65 = "Она... больна. Как я и говорила."
32010-66 = "[s] «Тогда где она?»"
32010-67 = "Хм-м."
32010-68 = "Вы правда хотите знать?"
32010-69 = "Рассказать вам — значит перейти черту, после которой назад дороги не будет."
32010-70 = "Так что если вы меня предадите, я действительно останусь совсем одна."
32010-71 = "Всё ещё хотите знать?"
32010-72 = "[s] «Предам тебя?»"
32010-73 = "Да, но уверена, всё будет нормально. Вы ведь сказали, что на моей стороне?"
32010-74 = "Если человек, который так сказал, потом меня предаст, то... может, мне будет уже не так больно. Хи-хи-хи."
32010-75 = "Правда в том, что Сэя не борется с болезнью."
32010-76 = ""
32010-78 = ""
32010-79 = ""
32010-80 = "Её нимб был уничтожен."
32010-81 = "[s] «...?!»"
32010-82 = "..."
32010-84 = "Знаю. Слишком ужасно, чтобы быть правдой, но это правда."
32010-85 = "И это скрывают с прошлого года. На Сэю напал неизвестный."
32010-86 = "Болезнь — лишь прикрытие. Сэя мертва."
32010-87 = "И никто, кроме Чаепития, об этом не знает."
32010-88 = "Хотя возможно, Сестринство в курсе... Их разведка всегда была впечатляющей."
32010-89 = "В любом случае это тайна, которую необходимо хранить."
32010-90 = ""
32010-91 = "[ns] «И никто не знает, кто виноват?»"
32010-92 = "Расследование продолжается, но всё ещё загадка. У Сэи было множество секретной информации, что только усложняет поиск подозреваемых."
32010-93 = "Вот и всё."
32010-94 = "[s] «...»"
32010-95 = "Лично у меня есть собственный список подозреваемых, но делиться им без уверенности было бы неразумно."
32010-96 = "Вернёмся к Ширасу Азусе."
32010-97 = "Именно я устроила её перевод в Тринити."
32010-98 = "[s] «Ты, Мика?»"
32010-99 = "Угу. Я скрыла это от Наги. Зарегистрировала Азусу как студента, возвращающегося после перерыва, подделав документы."
32010-100 = "Наверное, вы думаете зачем."
32010-101 = "Ариус всё ещё ненавидит нас."
32010-102 = "Пока наши студенты принимают привилегированную среду как должное, их студенты едва выживают в бедности и не знают, что значит получать настоящее образование."
32010-103 = "Они упрямо держатся за старую обиду и отвергают помощь любого, даже Генерального студсовета."
32010-104 = "Я хочу, чтобы Тринити примирилась с Ариус."
32010-105 = "Но ненависть между школами слишком велика, недопониманий слишком много. В одиночку мне такой конфликт не разрешить."
32010-106 = "Наги и Сэя возражали против моей позиции по политическим причинам, но я никогда их за это не винила. В этом и суть Чаепития."
32010-107 = "Я не сильна в политике... просто хочу, чтобы мы все могли ладить."
32010-108 = "Если бы только можно было, как раньше, разрешить недопонимания за чашкой чая."
32010-109 = ""
32010-111 = ""
32010-112 = "На самом деле я хочу, чтобы Азуса стала символом мира."
32010-113 = "Я плохо её знаю, но говорят, в Ариус она была выдающимся студентом, и я хочу помочь её потенциалу раскрыться."
32010-114 = "Может, стоило быть честнее и попробовать убедить Наги официально... но я сомневалась, что это возможно."
32010-115 = "Не думаю, что она когда-нибудь согласилась бы."
32010-116 = "После подписания Эдемского договора примирение с Ариус станет невозможным. Я хотела всё исправить до этого любой ценой."
32010-117 = "Я хочу показать на примере Азусы, что студент Ариус может быть счастлива и принята в Тринити."
32010-118 = "Но теперь Наги распустила слух о предателе в Тринити."
32010-119 = "Не знаю, как она к этому пришла. Возможно, во всём виновата я."
32010-120 = "Она настолько испугалась, что кто-то мешает её планам, что решила создать Клуб дополнительных занятий."
32010-121 = "Кстати, вы поняли, почему каждого студента заставили вступить?"
32010-122 = "Потому что Наги подозревает каждую из них."
32010-124 = ""
32010-125 = "Ханако немного эксцентрична, но была выдающимся студентом с отличными оценками. Когда-то её даже рассматривали как кандидата в Чаепитие."
32010-126 = "Сестринство тоже пыталось её завербовать, но ничего не вышло."
32010-128 = ""
32010-129 = ""
32010-130 = ""
32010-131 = "Однажды она пришла на занятие в часовне в одном купальнике, и сёстры её выволокли. Видели бы вы лица людей. Ха-ха-ха."
32010-133 = ""
32010-134 = "На первом курсе у Ханако был огромный потенциал, но в начале второго она вдруг стала получать самые низкие оценки в классе."
32010-135 = "Почему? Она делала это специально?"
32010-136 = ""
32010-137 = "Ещё до падения оценок она успела завести связи по всей Тринити и знала несколько секретов академии."
32010-138 = "Это вызвало подозрения Наги."
32010-140 = ""
32010-141 = "Что до Кохару... Она хорошая девочка и к политике отношения почти не имеет."
32010-142 = ""
32010-144 = ""
32010-145 = ""
32010-146 = "Её попадание в Клуб дополнительных занятий связано с Хасуми."
32010-147 = "[s] «С Хасуми?»"
32010-149 = ""
32010-150 = "Наги не нравится существование такого мощного клуба и столь влиятельного человека вне её прямого контроля."
32010-151 = "Поэтому Кохару — её страховка."
32010-152 = "Подошёл бы любой член Комитета правосудия. Просто плохие оценки Кохару сделали её удобной целью."
32010-153 = "Иными словами, она заложница, и, думаю, Хасуми это понимает. Один неверный шаг может привести к исключению."
32010-154 = "[s] «Но...»"
32010-155 = "Но что? Вас удивляет, что Хасуми считают опасным элементом?"
32010-156 = "Тогда есть один случай, который может вас заинтересовать."
32010-158 = "Клубная комната Комитета правосудия"
32010-163 = "..."
32010-164 = "..."
32010-165 = "В-Вице-президент Хасуми, пожалуйста, успокойтесь..."
32010-166 = ""
32010-168 = ""
32010-169 = "Как они смеют?! Общество Пандемониума! Геенна! Думают, им это сойдёт с рук?!"
32010-170 = "А-а-а-а-а!"
32010-171 = "*тяжело дышит* *тяжело дышит*..."
32010-172 = "Слушайте внимательно."
32010-173 = "Это ещё не конец..."
32010-174 = ""
32010-175 = "Хасуми — вице-президент Комитета правосудия, главной вооружённой силы Тринити, и презирает Геенна."
32010-176 = "Очевидно, она выступит против Эдемского договора, ведь он требует союза с её злейшими врагами."
32010-177 = "И наконец, Хифуми."
32010-179 = ""
32010-180 = "Она просто милая, добрая, очаровательная девочка, да? Даже Наги её обожает."
32010-181 = "Но именно это и поставило её прямо под прицел Наги."
32010-182 = ""
32010-183 = "Хифуми ловили на тайных выходах из района и посещении подозрительных мест, например запрещённого подземного Чёрного рынка."
32010-184 = "Есть даже данные, связывающие её с группой преступников в масках.#nМожете поверить? А казалась такой невинной."
32010-185 = "[s] «...»"
32010-186 = "Типично для Наги: держать друзей близко, а врагов ещё ближе. Очень предсказуемо."
32010-187 = "Вот и вся история о том, как паранойя Наги..."
32010-188 = "...превратилась в полноценный заговор о предателе, желающем разрушить Тринити."
32010-189 = "Наги абсолютно уверена, что среди них обязательно есть предатель."
32010-190 = "Знаю, объяснение вышло длинным, но это вся правда."
32010-191 = "[s] «Но ты сказала, что предатель действительно...»"
32010-192 = "Сказала. Но подумайте иначе: что вообще значит быть «предателем»?"
32010-193 = "Наги считает, что кто-то пытается обмануть её, а значит и Чаепитие Тринити. Она подозревает шпиона."
32010-194 = "В этом смысле Азуса, чья биография полностью подделана, ближе всех к такому определению."
32010-195 = "В отличие от остальных, она действительно переведена из академии-врага Тринити — Ариус."
32010-196 = "Теперь она оказалась в центре сложного политического шторма и даже не знает, что во всём виновата я."
32010-197 = "Поэтому я борюсь, чтобы не дать её исключить."
32010-198 = "Или, по крайней мере, пытаюсь, убеждая вас. Я хочу, чтобы вы не допустили её исключения. Только вы можете это сделать, Сенсей."
32010-199 = "В каком-то смысле можно сказать, что настоящий предатель — я. Ведь это я выступаю против Эдемского договора Наги."
32010-200 = "Но поскольку я не хозяйка, реальной власти у меня нет и остановить его я не могу."
32010-201 = "..."
32010-202 = "Хотя, возможно, и это не вся правда."
32010-203 = "С тем же успехом можно сказать, что если кто-то и предаёт Тринити..."
32010-205 = ""
32010-206 = "...то это Наги."
32010-207 = "Она пытается превратить Тринити со всеми её ценностями, гармонией и единством во что-то иное. Хочет пробудить Левиафана."
32010-208 = ""
32010-209 = "Так я вижу ситуацию. Верить мне или соглашаться со мной — решать вам."
32010-210 = "Теперь всё в ваших руках. Защитите ли вы Азусу или будете выкорчёвывать предателя... Поверите Наги или мне..."
32010-211 = "[s] «Это всё, что ты хотела сказать?»"
32010-212 = "В основном да. Я отвечаю за поступление Азусы в нашу академию, но это всё, чем могу ей помочь."
32010-213 = "Только не говорите, что переживаете обо мне, Сенсей."
32010-214 = "Ха-ха-ха. Как мило с вашей стороны. Я ведь и правда могу в вас влюбиться."
32010-215 = "Не переживайте. Я гораздо сильнее, чем выгляжу."
32010-216 = "Ладно, мне пора. Мне очень понравилось сегодня с вами разговаривать."
32010-217 = "Если мы слишком долго будем одни, люди могут распустить непристойные слухи... не то чтобы я возражала. Хи-хи."
32010-218 = "До встречи, Сенсей."
32010-220 = "Попрощавшись с Микой, я вернулся в класс, где все учились."
32010-222 = "Следующий эпизод;Сестринство"
