[translation]
32010-1 = "Episódio 1;Um Monstro Gigantesco"
32010-3 = "[ns] \"A Azusa é a traidora...?\""
32010-4 = "Sim. E por isso, quero que você a proteja."
32010-5 = "...Ah, desculpa. Será que fui direta demais? Acho que acabei pegando a mania ruim da Nagi-chan."
32010-6 = "Como parece que deixei você confuso, Sensei, que tal eu tentar explicar um pouquinho mais desde o começo?"
32010-7 = "Eu não sou tão inteligente quanto a Nagi-chan ou a Seia-chan, mas..."
32010-8 = "Vou dar o meu melhor para explicar direitinho!"
32010-9 = "[s] \"Sim, por favor.\""
32010-10 = "Primeiro, sobre esta \"Escola Geral Trinity\". Como a Nagi-chan disse outro dia, a maior característica dela é ser \"uma escola formada pela união de várias facções\"."
32010-12 = "Pater, Filius e Sanctus... Como já conversamos antes, essas três facções se tornaram o centro da Trinity."
32010-13 = "Mas, para ser mais exata, além delas também existem várias outras facções grandes e pequenas, incluindo a que deu origem às atuais \"Cavaleiras Socorristas\" e a \"Irmandade\"."
32010-14 = "Originalmente, todas essas várias facções se viam como inimigas umas das outras, quase como a Trinity e Gehenna hoje em dia."
32010-15 = "Dizem que houve uma época em que todo santo dia só havia conflitos."
32010-16 = "Então, decidiram fazer uma promessa de parar de lutar daquele jeito e passar a se dar bem."
32010-17 = "Não precisamos mais lutar, vamos nos tornar uma única academia... A reunião onde discutiram isso foi o chamado \"Primeiro Concílio\"."
32010-18 = "[s] \"Sim, já ouvi falar disso em algum lugar.\""
32010-20 = "Pois é. E então..."
32010-21 = "Foi a partir desse concílio que nasceu a \"Escola Geral Trinity\" onde estamos hoje."
32010-22 = "Seria mentira dizer que hoje em dia não restam resquícios da época em que éramos facções separadas, mas... acho que é o fluxo do tempo, sabe? Hoje, a maioria das vozes diz que já nem liga mais para isso."
32010-23 = "Só que esse concílio não terminou de forma totalmente pacífica... Naquela ocasião, houve uma escola que se opôs até o fim."
32010-24 = "E essa escola foi \"Arius\"."
32010-26 = "Uma facção que, originalmente, não deveria ser muito diferente de nós."
32010-27 = "Dizem que havia apenas pequenas diferenças na interpretação das escrituras, mas que, no geral, éramos bem parecidas em várias coisas."
32010-28 = "Elas também tinham aulas na capela direitinho, a aparência era quase idêntica... e, além de tudo, odiavam Gehenna do fundo do coração."
32010-29 = "Mas Arius se opôs ferozmente à criação de uma aliança... e, no fim, isso acabou levando a um conflito."
32010-30 = "A Escola Geral Trinity, que adquiriu um poder imenso ao se tornar uma união, começou a usar essa grande força para reprimir Arius impiedosamente."
32010-31 = "Quando se tem um poder grande demais, surge a vontade de testar essa força... é uma história bem comum. Em resumo, talvez se possa dizer que, infelizmente, Arius foi o alvo perfeito."
32010-32 = "E assim, Arius foi esmagada."
32010-33 = "Elas foram expulsas do distrito autônomo da Trinity e hoje... não sei os detalhes, mas parece que estão escondidas em algum lugar de Kivotos."
32010-34 = "Deve ter sido uma batalha muito intensa. Parece que depois disso elas se esconderam em um lugar impossível de encontrar, a ponto de provavelmente nem mesmo o Conselho Estudantil Geral saber até hoje onde fica o distrito autônomo delas."
32010-35 = "Para a maioria das alunas, a reação deve ser algo como \"Existia mesmo uma academia assim?\". Quase ninguém deve sequer saber que houve um conflito desses."
32010-36 = "Uma existência que parou de aparecer sob os holofotes e cuja própria sombra acabou se apagando com o tempo... Essa é a Filial Arius."
32010-37 = "[s] \"E a Azusa veio dessa Filial Arius...\""
32010-39 = "Sim."
32010-40 = "E bom... o \"Tratado do Éden\" que a Nagi-chan está promovendo é uma reprodução daquele \"Primeiro Concílio\" de que falei agora há pouco."
32010-41 = "O Tratado do Éden... uma promessa para que duas grandes academias passem a se dar bem daqui em diante."
32010-42 = "...Parece uma história bonita, não é? Mas como será que é na realidade? Afinal, a essência disso é juntar o poderio militar de Gehenna e da Trinity para criar um grupo armado totalmente novo chamado Organização do Tratado do Éden, mais conhecido como \"ETO\"."
32010-43 = "...Isso mesmo. O Tratado do Éden é, por assim dizer, uma espécie de aliança militar."
32010-48 = "O objetivo é o nascimento de uma única e gigantesca organização armada que une as forças da Trinity e de Gehenna..."
32010-51 = "Um grupo com um poder tão esmagador vai nascer... justo em uma época tão turbulenta quanto esta, em que a Presidente do Conselho Estudantil Geral está desaparecida."
32010-52 = "O que será que a Nagi-chan pretende fazer usando um poder tão grande assim?"
32010-53 = "Atacar o Conselho Estudantil Geral agora que a presidente está ausente e se tornar ela mesma a Presidente do Conselho Estudantil Geral?"
32010-54 = "Ou quem sabe cortar pela raiz essa nova força em ascensão que é a Millennium?"
32010-55 = "É claro que não sei os objetivos em detalhes... mas tem uma coisa que posso afirmar com toda a certeza."
32010-56 = "Quando ela colocar as mãos em um poder tão grande, com certeza vai eliminar tudo o que não lhe agrada..."
32010-57 = "Exatamente como a Trinity fez com Arius no passado."
32010-58 = "Ou quem sabe, assim como aconteceu com a Seia-chan..."
32010-62 = "...Não, desculpa. Acho que falei demais agora."
32010-63 = "[s] \"O que aconteceu com a Seia?\""
32010-64 = "..."
32010-65 = "...É como já foi dito antes. A Seia-chan está internada."
32010-66 = "[s] \"...Posso perguntar onde ela está agora?\""
32010-67 = "Hmm..."
32010-68 = "...Você quer mesmo saber, Sensei?"
32010-69 = "...Se eu contar isso, não haverá mais volta para mim."
32010-70 = "Se você descobrir a verdade daqui em diante e me trair, Sensei... com certeza será o meu fim."
32010-71 = "Mesmo assim, você quer saber?"
32010-72 = "[s] \"Eu nunca trairia você—\""
32010-73 = "...Não, mas tudo bem. Afinal, ainda agora você disse que estava do meu lado, Sensei."
32010-74 = "Mesmo se você acabar me traindo depois disso, como posso dizer... é, acho que até que não seria tão ruim assim. Ehehe."
32010-75 = "...A Seia-chan não está internada coisa nenhuma."
32010-80 = "O halo dela foi destruído."
32010-81 = "[s] \"...!?\""
32010-82 = "..."
32010-84 = "Não é brincadeira, é a verdade."
32010-85 = "No ano passado, a Seia-chan sofreu um ataque repentino pelas mãos de alguém."
32010-86 = "Para o público externo, a versão oficial é que ela está \"internada\"... mas a verdade é essa outra."
32010-87 = "Tirando nós da Tea Party, ninguém mais na Trinity sabe disso ainda."
32010-88 = "Talvez a \"Irmandade\" já tenha descoberto... já que a rede de informações delas não é brincadeira."
32010-89 = "Enfim, é um assunto confidencial nesse nível."
32010-91 = "[ns] \"E a culpada ainda não foi...?\""
32010-92 = "...Não, ainda não sabemos. Quer dizer, está sob investigação, ou melhor, não descobriram nada... Até porque a Seia-chan sempre foi uma garota cheia de segredos."
32010-93 = "...Sim, bom, a situação é essa."
32010-94 = "[s] \"...\""
32010-95 = "Dito isso, não é como se não tivéssemos nenhuma suspeita... mas não seria bom ficar falando meras suposições a esta altura."
32010-96 = "...Enfim, voltando ao assunto."
32010-97 = "\"Shirasu Azusa\"... Fui eu quem transferiu aquela garota para esta academia."
32010-98 = "[s] \"Você, Mika?\""
32010-99 = "Sim, em segredo da Nagi-chan. Falsifiquei o registro de alunas e todos os documentos necessários para matriculá-la aqui."
32010-100 = "...Você deve estar se perguntando o porquê, né?"
32010-101 = "A Filial Arius ainda nos odeia até hoje."
32010-102 = "Enquanto nós desfrutamos de um ambiente tão próspero, elas vivem em condições precárias, sem sequer saber o que significa \"aprender\"..."
32010-103 = "Elas continuam recusando tanto a mão que estendemos quanto a ajuda do Conselho Estudantil Geral. Tudo por causa do ódio do passado."
32010-104 = "...Eu queria me reconciliar com a Filial Arius."
32010-105 = "Mas esse ódio é grande demais para ser apagado facilmente... e os mal-entendidos e suspeitas acumulados durante todo esse tempo são muitos. Mais do que eu poderia dar conta sozinha."
32010-106 = "Só que tanto a Nagi-chan quanto a Seia-chan eram contra a minha opinião... por motivos políticos. Mas não é como se eu não entendesse o lado delas. Afinal, nós somos a Tea Party."
32010-107 = "Como sou meio desajeitada, não levo muito jeito para essas coisas de política... mas será que é tão difícil assim voltarmos a nos dar bem a partir de agora?"
32010-108 = "Será que não poderíamos desfazer os nossos mal-entendidos tomando um chá juntas como antigamente?"
32010-112 = "Eu queria que aquela garota... que a existência chamada \"Shirasu Azusa\" se tornasse um símbolo de reconciliação."
32010-113 = "Eu não sei tantos detalhes sobre ela, mas parece que era uma aluna bastante exemplar mesmo em Arius, então quis apostar nesse potencial."
32010-114 = "Talvez houvesse a opção de convencer a Nagi-chan e fazer tudo pelos meios oficiais, mas... digamos que eu duvidei um pouquinho que isso daria certo..."
32010-115 = "Achei que a Nagi-chan não fosse me dar ouvidos numa coisa dessas."
32010-116 = "Se o Tratado do Éden for assinado... aí sim, dessa vez uma reconciliação com Arius vai se tornar totalmente impossível de verdade. Por isso, eu queria dar um jeito de concretizar isso antes."
32010-117 = "Eu queria provar para todo mundo... que uma aluna de Arius também pode viver muito bem na Trinity e ser feliz."
32010-118 = "Mas, no meio disso tudo, a Nagi-chan começou a dizer que havia uma \"traidora\" na Trinity..."
32010-119 = "...Não sei por que a Nagi-chan começou a pensar isso. Pode ser que eu tenha cometido algum deslize enquanto me mexia nos bastidores."
32010-120 = "Então, para impedir que atrapalhassem o tratado, a Nagi-chan criou o \"Clube de Aulas de Reforço\"."
32010-121 = "No começo eu não entendi o que era esse \"Clube de Aulas de Reforço\", mas... ah, por falar nisso, Sensei. Você já ouviu o motivo de terem escolhido justamente aquelas garotas?"
32010-122 = "Quem está lá são as garotas de quem a Nagi-chan suspeitou."
32010-125 = "A Hanako-chan tem um jeito bem excêntrico, mas é uma aluna realmente, realmente brilhante. Inclusive nas notas, claro. Para você ter uma ideia, o nome dela chegou até a ser cogitado como candidata a presidente do conselho estudantil, ou seja, à Tea Party."
32010-126 = "Ouvi dizer que a \"Irmandade\" também se esforçou bastante para tentar recrutá-la. Embora pareça que não deu muito certo."
32010-131 = "Quando ela apareceu vestindo apenas um maiô no meio daquele clima todo devoto da aula na capela, foi incrível. Eu estava lá por acaso; ela foi expulsa pelas irmãs, e a cara que todo mundo fez foi impagável. Aha."
32010-134 = "...Mas, mesmo sendo tão brilhante e tendo um futuro tão promissor, aquela garota mudou de repente. A ponto de ficar à beira da reprovação."
32010-135 = "...Por que será, né?"
32010-137 = "De fato, dá para entender muito bem a vontade de investigar isso a fundo. Ainda mais porque ela já tinha contato com o alto escalão da Trinity e vários outros setores, e acabou descobrindo um bom número de segredos."
32010-138 = "Para a Nagi-chan, era impossível simplesmente ignorar."
32010-141 = "Já a Koharu-chan... ela é uma garota pura e boazinha, que não tem absolutamente nada a ver com toda essa política suja."
32010-146 = "Se formos falar do porquê de ela ter sido escolhida... ah, nesse sentido, acho que foi \"porque levantaram suspeitas\". Mas a causa direta disso não foi ela mesma, e sim a Hasumi-chan e as outras."
32010-147 = "[s] \"A Hasumi e as outras...?\""
32010-150 = "A insegurança de não ter sob seu próprio controle uma organização com um poderio militar gigantesco, especialmente alguém como a Hasumi-chan, que nutre um ódio tão intenso por Gehenna... A suspeita de que algo pudesse acontecer..."
32010-151 = "Acho que a Nagi-chan queria ter algum tipo de precaução contra isso."
32010-152 = "Qualquer uma do Comitê de Justiça provavelmente serviria. Aquela garota só foi a escolhida porque calhou de ter notas ruins."
32010-153 = "Ou seja, ela é uma refém. E sobre a questão da \"expulsão\", a Hasumi-chan provavelmente já devia estar sabendo."
32010-154 = "[s] \"...\""
32010-155 = "Essa sua cara é de quem acha que a Hasumi-chan jamais faria algo assim? Hmm, não sei o quão próximo você é da Hasumi-chan, Sensei, mas..."
32010-156 = "Ouvi dizer que aconteceu o seguinte um tempo atrás."
32010-158 = "Comitê de Justiça - Sala"
32010-163 = "..."
32010-164 = "..."
32010-165 = "H-Hasumi-senpai, por favor, acalme-se—"
32010-169 = "Eu jamais, jamais vou perdoá-las!! Pandemonium Society!! Gehenna!! Por que, por que foram tão longe...!!"
32010-170 = "Iih...!"
32010-171 = "Arf, arf..."
32010-172 = "...Ouçam, ouçam muito bem. Eu declaro aqui e agora."
32010-173 = "A partir de hoje, eu... eu vou...!"
32010-175 = "A Hasumi-chan é a vice-presidente do \"Comitê de Justiça\", a força armada da Trinity, e odeia Gehenna com todas as forças."
32010-176 = "Não é mais do que óbvio que ela se oporia ao Tratado do Éden com unhas e dentes? Algo como \"Uma aliança com aquela Gehenna, jamais!\"."
32010-177 = "E por último... a Hifumi-chan, né?"
32010-180 = "A Hifumi-chan é gentil, fofa e uma ótima garota, não é? A Nagi-chan também gosta demais dela."
32010-181 = "...Mas, mesmo assim, os olhos desconfiados da Nagi-chan acabaram se voltando para ela."
32010-183 = "Ao que parece, ela andou saindo escondida da academia e frequentando lugares suspeitos. Como o Mercado Negro, onde a entrada de alunas da Trinity é proibida, e vários outros cantos."
32010-184 = "Além disso, também correram informações de que ela tem envolvimento com alguma gangue criminosa. Mesmo parecendo uma garota tão bondosa e pura..."
32010-185 = "[s] \"...\""
32010-186 = "Mesmo gostando tanto da Hifumi-chan, a Nagi-chan ainda assim voltou seus olhos de suspeita para ela. Bom, se bem que isso também é bem a cara da Nagi-chan."
32010-187 = "E então, a suspeita que havia dentro da Nagi-chan de que \"talvez exista uma traidora na Trinity\", à medida que várias informações foram sendo reunidas e as coisas avançaram,"
32010-188 = "acabou se transformando na dúvida: \"Quem entre elas é a traidora da Trinity?\"."
32010-189 = "Já não se discute mais se existe ou não uma; para a Nagi-chan, a \"traidora\" já se tornou um problema real e dado como certo."
32010-190 = "...Essa é a situação atual. Ficou um pouquinho longo, mas acho que com isso consegui contar tudo o que eu sei no momento."
32010-191 = "[s] \"A traidora...\""
32010-192 = "...A que exatamente a palavra \"traidora\" se refere? Se esclarecermos isso um pouco, dá para chegar a uma resposta bem clara."
32010-193 = "Em primeiro lugar, a Nagi-chan agora com certeza pensa que \"há alguém tentando nos enganar, tentando enganar a Trinity\". Que alguém é uma espiã."
32010-194 = "Nesse sentido, a \"traidora\" de quem a Nagi-chan está falando agora é aquela garota que se infiltrou falsificando o próprio histórico: \"Shirasu Azusa\"."
32010-195 = "Porque, como falei antes, ela na verdade veio de Arius, que é hostil à Trinity."
32010-196 = "Por minha causa, sem saber de nada, aquela garota acabou sendo colocada bem no meio de uma disputa política tão complicada quanto essa..."
32010-197 = "Mas não podemos deixar que ela seja expulsa dessa maneira."
32010-198 = "Por isso, quero que você a proteja. Porque, agora, isso é algo que só você pode fazer, Sensei."
32010-199 = "Além disso, de certa forma... para a Nagi-chan, a \"traidora\" também sou eu. Já que não sou a favor do Tratado do Éden que a Nagi-chan está levando adiante."
32010-200 = "Embora, como não sou a anfitriã atual e não tenho poder nenhum, eu não consiga atrapalhar nem fazer nada."
32010-201 = "..."
32010-202 = "...Ah, e mais uma coisa. Sob outro ponto de vista, ao mesmo tempo, também podemos dizer o seguinte, não acha?"
32010-203 = "\"A traidora da Trinity\"..."
32010-206 = "Também é possível dizer que essa pessoa é a própria Nagi-chan. Não concorda?"
32010-207 = "Alguém que está tentando transformar a Trinity, que até hoje manteve a harmonia, em um monstro gigantesco... Não seria nada estranho enxergar as coisas por esse ângulo."
32010-209 = "...Bom, mas no fim das contas, tudo isso, absolutamente tudo, não passa da minha versão unilateral da história."
32010-210 = "Por isso, é claro que a decisão final cabe a você, Sensei. Se vai proteger a Shirasu Azusa, se vai encontrar a traidora... se vai acreditar na Nagi-chan. Ou se vai acreditar em mim."
32010-211 = "[s] \"E para você, só isso já basta, Mika?\""
32010-212 = "Eu tenho responsabilidade pelo que aconteceu com aquela garota... mas tudo o que posso fazer é pedir a sua ajuda."
32010-213 = "...Hm? Espera aí. Não era disso que você estava falando? Por acaso... está preocupado comigo?"
32010-214 = "Aha. Você é mesmo muito gentil, Sensei. Hmm, desse jeito quase acabo entendendo as coisas errado."
32010-215 = "Não precisa se preocupar comigo. Por mais que não pareça, eu sou bem forte♪"
32010-216 = "Bom, por hoje acho que é só. Foi muito divertido poder conversar assim com você de novo, Sensei."
32010-217 = "Além do mais, se ficarmos tempo demais sozinhos nós dois, vão acabar surgindo boatos estranhos, né? Fufu... bom, por mim eu não me importaria nem um pouco com isso."
32010-218 = "Então, até mais, Sensei."
32010-220 = "(Depois de me despedir da Mika, voltei para junto das meninas.)"
32010-222 = "Próximo;A Irmandade"
