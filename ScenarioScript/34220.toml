[translation]
34220-1 = "Эпизод 22;Agnus Dei"
34220-2 = "Пришли спасать своего драгоценного студента? Какая жалость. Уже поздно."
34220-3 = "...!"
34220-5 = "С помощью этого ритуала я подчиню силы, скрывающиеся за пределами Кивотоса, и возвышу собственное существование! Разумеется, без жертвы королевской крови это было бы невозможно."
34220-6 = ""
34220-7 = "Сенсей, Сенсей. Какой необычный противник."
34220-8 = "Я всё ещё верю, что мы способны понять друг друга."
34220-9 = "Мы не так уж различаемся. Каждый стремится к желаемому, используя знания, накопленные за жизнь."
34220-10 = "Разве не обязанность взрослого — спасать этот мир? Чем больше силы накопишь, тем лучше способен исполнять этот долг."
34220-11 = "Да! Этот ритуал превратит меня в нечто более великое, чем когда-либо видел Кивотос!"
34220-12 = "Я стану высшей властью этой земли и наконец спасу этот никчёмный мир! Таков мой долг взрослого!"
34220-13 = "Кому какое дело до жертвы одной маленькой девочки?"
34220-14 = "Перед лицом великого блага это ничто!"
34220-15 = "Вот возвышенная цель! Вот существование!"
34220-16 = "Сенсей, разве вы не похожи на меня? Как учитель, вы тоже обладаете абсолютной властью прощать или карать студентов."
34220-17 = "[s] «Ты ошибаешься.»"
34220-18 = "...?!"
34220-19 = "[s1] «Ты всё совершенно неправильно поняла.»\n[s2] «У меня нет такой власти.»"
34220-20 = "О чём ты?"
34220-21 = "О чём ты?"
34220-22 = ""
34220-24 = ""
34220-25 = ""
34220-26 = "[ns] «Я не судья. У меня никогда не было права судить кого-либо.»"
34220-27 = ""
34220-28 = ""
34220-29 = "[ns] «Я не спаситель. Я не могу оградить студентов от боли.»"
34220-30 = ""
34220-31 = ""
34220-32 = "[ns] «Я не абсолют. Я не могу стереть их грехи из этого мира.»"
34220-33 = ""
34220-34 = "...!"
34220-35 = "[s] «Я не какая-то высшая власть.»"
34220-36 = "Если нет... тогда кто вы?!"
34220-37 = "Как объяснить вашу силу? Влияние? Ценность, которую будто приносит одно ваше существование?"
34220-38 = "[s] «Я просто скромный учитель.»"
34220-39 = "...!"
34220-41 = "[ns] «У меня есть лишь сила верить в своих студентов, когда им это нужнее всего.»"
34220-42 = ""
34220-44 = ""
34220-45 = "Тогда докажите!"
34220-46 = ""
34220-49 = "...!"
34220-50 = "Что..."
34220-51 = "О... О нет..."
34220-52 = "Смотрите! Вот моё величие! Я — высшая власть!"
34220-53 = "Я — возвышенное существо, которому предназначено править этим миром!"
34220-54 = "[s] «Вот кто ты на самом деле, Беатриче?»"
34220-55 = "Настоящая сущность Мадам..."
34220-56 = "...просто чудовище..."
34220-57 = "Так вот чему... мы всё это время подчинялись..."
34220-58 = "[s] «Саори. Хиёри. Мисаки.»"
34220-59 = "Да."
34220-60 = "Ага!"
34220-61 = "...Хорошо."
34220-62 = "[s] «Не бойтесь. Я рядом.»"
34220-64 = "...Я её не боюсь."
34220-65 = "Я тоже. Идём."
34220-66 = "Д-Да! Мы спасём Химэ!"
34220-67 = "[ns] «Это наша последняя миссия, отряд!»"
