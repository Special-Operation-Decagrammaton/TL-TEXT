[translation]
34220-1 = "Episódio 22;Agnus dei"
34220-2 = "...Mas você chegou tarde demais.#nO ritual já está em andamento."
34220-3 = "...!!"
34220-5 = "Explorando o Misticismo do Sangue Real e tomando emprestado o poder que vem de fora de Kivotos... estou sublimando minha própria existência para algo de nível superior."
34220-7 = "Ora, Sensei.#n— Adulto incompreensível, meu adversário."
34220-8 = "Talvez você esteja me interpretando mal."
34220-9 = "Através deste mundo, cada um de nós busca aquilo que deseja.#nCom você é o mesmo. Pode se tornar qualquer coisa e conhecer tudo."
34220-10 = "Tornar-se uma existência superior — e, através disso, salvar a todos — é o dever de um adulto."
34220-11 = "Sim, este ritual foi preparado para usar o poder de fora de Kivotos e me tornar uma existência superior."
34220-12 = "Ascender ao topo dessa forma e salvar este mundo — esse é o patamar que um adulto deve alcançar!"
34220-13 = "Um pequeno sacrifício nesse processo é algo inevitável."
34220-14 = "Isso mesmo... esse sacrifício é algo necessário."
34220-15 = "Este é o verdadeiro caminho para alcançar o \"Sublime\"."
34220-16 = "Você entende o valor disso, não é?#nVocê, que possui o poder absoluto para tanto julgar quanto salvar todas as alunas...!!"
34220-17 = "[s] \"Não é bem assim.\""
34220-18 = "...!?"
34220-19 = "[s1] \"Você está me interpretando mal.\"\n[s2] \"Eu não sou nada demais.\""
34220-20 = "O quê...?"
34220-21 = "O quê...?"
34220-26 = "[ns] \"Eu não sou um juiz. Não tenho o direito de julgar ninguém.\""
34220-29 = "[ns] \"Eu não sou um salvador. Não posso apagar a dor deste mundo.\""
34220-32 = "[ns] \"Eu não sou um ser absoluto. Não posso eliminar os pecados deste mundo.\""
34220-34 = "...!!"
34220-35 = "[s] \"Eu não sou esse tipo de existência.\""
34220-36 = "Então... o que diabos você está dizendo que é?!"
34220-37 = "Qual é a sua habilidade, qual é o valor da sua existência?!"
34220-38 = "[s] \"Sou um Sensei para as alunas.\""
34220-39 = "...!!"
34220-41 = "[ns] \"Só quero estar ao lado das alunas que foram esquecidas e estão sofrendo.\""
34220-45 = "Então prove isso para mim...!!"
34220-49 = "...!!"
34220-50 = "O qu—..."
34220-51 = "A-Auuu..."
34220-52 = "Vamos, grave bem nos seus olhos!#nEsta sou eu... na forma de uma existência superior!"
34220-53 = "Esta é a minha verdadeira forma — a forma de um grande adulto...!!"
34220-54 = "[s] \"Então essa é a sua verdadeira natureza, Beatrice.\""
34220-55 = "Aquela é... a verdadeira Madame..."
34220-56 = "Para mim só parece um simples monstro..."
34220-57 = "É... nós ficamos esse tempo todo nas mãos de uma coisa dessas..."
34220-58 = "[s] \"— Saori, Hiyori, Misaki.\""
34220-59 = "...Sim."
34220-60 = "...Sim!"
34220-61 = "...Uhum."
34220-62 = "[s] \"Não tenham medo... eu estou aqui com vocês. Vamos dar o nosso melhor juntos.\""
34220-64 = "...Certo."
34220-65 = "Uhum — vamos derrotar aquele monstro."
34220-66 = "Sim!! Vamos salvar a Princesa...!!"
34220-67 = "[ns] \"Vamos!!!\""
