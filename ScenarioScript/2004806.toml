[translation]
2004806-1 = "Рыбацкое настроение"
2004806-2 = "Эксклюзивный бассейн Чаепития"
2004806-4 = "Я направился к бассейну, где находилась Нагиса."
2004806-5 = "Я никак не мог понять, какая связь между бассейном и рыбалкой."
2004806-6 = "А, Сенсей. Сюда."
2004806-7 = ""
2004806-9 = ""
2004806-10 = "Спасибо, что пришёл так быстро."
2004806-11 = "Ну, я позвала тебя сюда, потому что... эм..."
2004806-12 = "Пожалуй, лучше показать. Не мог бы ты заглянуть в бассейн?"
2004806-13 = ""
2004806-15 = ""
2004806-16 = "[ns] Заглянуть в бассейн."
2004806-18 = "[ns] «...Это что, рыбы?!»"
2004806-19 = "В бассейне плавали десятки рыб."
2004806-20 = ""
2004806-22 = ""
2004806-23 = "Нам нужно выловить рыбу..."
2004806-24 = "...по одной, вот этой удочкой."
2004806-25 = "Однако их слишком много, чтобы я справилась одна."
2004806-26 = "Поэтому я и позвала тебя."
2004806-27 = "[s] «Кто вообще мог такое устроить...»"
2004806-28 = "Фу-фу. Отличный вопрос, Сенсей."
2004806-29 = "Это была я."
2004806-30 = ""
2004806-33 = "[ns] «...Что?»"
2004806-34 = "Да. Это я выпустила рыбу в бассейн."
2004806-35 = "Точнее, попросила помощника сделать это..."
2004806-36 = "[s] «П-Почему...?»"
2004806-37 = "Разумеется, чтобы воссоздать атмосферу пляжа."
2004806-38 = "Но сейчас рыба не самое важное."
2004806-39 = "Для начала посмотри сюда, Сенсей."
2004806-40 = "У тебя острый глаз, поэтому я знала, что ты сразу заметишь."
2004806-41 = "[s] «Эм... Что именно я должен „заметить“?»"
2004806-42 = "Сколько размышлений и стараний я вложила в выбор этого купальника."
2004806-43 = "Но мысль о том, что тщательно выбранный купальник после всего нескольких дней использования будет пылиться в шкафу до следующего лета..."
2004806-44 = "Разве это не ужасное обращение с таким купальником?"
2004806-45 = "[s] «...Ты ведь можешь плавать когда захочешь.»"
2004806-46 = "Нет, Сенсей. Я не могу одновременно плавать и работать."
2004806-47 = "Ты способен ставить печати на документы, находясь под водой?"
2004806-48 = "Да и двигаться под водой довольно утомительно."
2004806-49 = "[s] «П-Понятно?»"
2004806-50 = "Зато я МОГУ одновременно рыбачить и работать."
2004806-51 = "Так и возникла ситуация, которую ты сейчас видишь."
2004806-52 = "Но, как я уже говорила, похоже, мой помощник немного перестарался и выпустил больше рыбы, чем я ожидала."
2004806-53 = "Я изучала способ рыбалки, при котором автомобильным аккумулятором можно разом выловить большое количество рыбы..."
2004806-54 = "...но сама я такого раньше не пробовала."
2004806-55 = "[s] «Давай не будем использовать этот способ!!»"
2004806-56 = "Понятно. Значит, мы думаем одинаково."
2004806-57 = "Что скажете, Сенсей?"
2004806-58 = ""
2004806-60 = ""
2004806-61 = ""
2004806-62 = "Не хочешь порыбачить вместе?"
2004806-64 = "Так мы и рыбачили вместе в самом роскошном искусственном рыбном месте, какое я когда-либо видел."
2004806-65 = "После этого я проследил, чтобы пойманную рыбу вернули туда, откуда её привезли."
