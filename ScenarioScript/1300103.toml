[translation]
1300103-1 = "Суперзвезда Клуба Инь-Ян"
1300103-4 = ""
1300103-5 = "Мы с Чисэ шли в книжный магазин, когда..."
1300103-6 = "Вы Чисэ?!"
1300103-7 = "А...?"
1300103-8 = "Это правда она! Сама Чисэ!"
1300103-9 = "Что? Чисэ?"
1300103-10 = "Принцесса Чисэ здесь?! Где?! Где она?!"
1300103-12 = ""
1300103-13 = "[ns] «Ч-Что вообще происходит?»"
1300103-14 = "(наклоняет голову) Хм?"
1300103-15 = "А-а-а! Чисэ! Посмотри сюда, пожалуйста!"
1300103-16 = ""
1300103-18 = "Улыбнись нам, Чисэ!"
1300103-19 = "Ну..."
1300103-20 = ""
1300103-21 = "(улыбается) Вот так...?"
1300103-23 = "*ах* Она ангел! Чисэ! Настоящий ангел!"
1300103-25 = "Чисэ! Хайку! Прочитай нам хайку!"
1300103-26 = "Хайку..."
1300103-27 = "Здравствуйте, все."
1300103-28 = "Чистите зубы трижды."
1300103-29 = "Как у вас дела?"
1300103-31 = "А-а-а-а! Настоящее хайку Чисэ!"
1300103-32 = "А-а-а... Я сейчас в обморок упаду...!"
1300103-33 = "Чисэ! Чисэ! Т-И-С-Э! Я люблю принцессу Чисэ!"
1300103-34 = "Эм, Сенсей. Мы не можем пройти. Что делать?"
1300103-35 = "[s] «Подождите, все немного успокойтесь...»"
1300103-36 = "А? А ты кто такой? Почему ты стоишь так близко к Чисэ?!"
1300103-37 = "Ты её менеджер?"
1300103-38 = "Нет! Наверняка сталкер!"
1300103-39 = "Точно, он!"
1300103-40 = "[s] «Это неправда!»"
1300103-42 = "[s1] «Очевидно, я менеджер Чисэ!»\n[s2] «Очевидно, я учитель Чисэ!»"
1300103-43 = "Правда? Не похож."
1300103-44 = "Правда? Не похож."
1300103-46 = "[s3] «Эх. Нельзя просто стоять здесь.»\n[s4] «Идём, Чисэ!»"
1300103-47 = "А? Хорошо, иду!"
1300103-48 = "А? Хорошо, иду!"
1300103-49 = "Эй, они убегают!"
1300103-52 = "[ns] *тяжело дышит* *тяжело дышит* «Мы могли влипнуть.»"
1300103-53 = "Эм, Сенсей? Это было опасно."
1300103-54 = "[s] «Нет, в опасности была ты, не я...»"
1300103-55 = "А?"
1300103-56 = "[s] «С тобой такое часто бывает?»"
1300103-57 = "Иногда, когда я гуляю."
1300103-58 = "Может, все считают меня особенной, потому что я из Клуба Инь-Ян?"
1300103-59 = "[s5] «Если подумать, клуб Инь-Ян много занимается рекламой.»\n[s6] «Они многое делают для продвижения Хяккияко.»"
1300103-60 = "Но все болели за меня."
1300103-61 = "Но все болели за меня."
1300103-62 = "И всё равно мне постоянно кажется, что нужно стараться ещё больше."
1300103-63 = "[s7] «Понятно...»\n[s8] «Чисэ, ты стала очень популярной.»"
1300103-64 = "Популярной...?"
1300103-65 = "Популярной...?"
1300103-67 = "[s] «Да, ты всем нравишься.»"
1300103-68 = "Ну, ладно..."
1300103-69 = "Мне приятно знать, что я нравлюсь всё большему числу людей."
1300103-70 = "О! Вон она! Чисэ!"
1300103-71 = "[s] «Чёрт. Они догнали!»"
1300103-72 = "Чисэ! Можно пожать тебе руку?!"
1300103-73 = "[s9] «Выбора нет! Чисэ, беги!»\n[s10] «Я их задержу!»"
1300103-74 = "А? Хорошо!"
1300103-75 = "А? Хорошо!"
1300103-76 = ""
1300103-77 = ""
1300103-78 = "Эм."
1300103-79 = "[s] «А? Чисэ, что такое?!»"
1300103-80 = ""
1300103-81 = ""
1300103-82 = "Сенсей, смотри. Муравьи идут цепочкой."
1300103-83 = "[s] «Т-Чисэ! Сейчас не время...!»"
1300103-85 = "После небольшой возни нам всё-таки удалось уйти."
