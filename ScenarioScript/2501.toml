[translation]
2501-1 = "Манеры делают игру. Часть 1"
2501-2 = "Департамент Разработки Игр Милленниума"
2501-7 = "Ух... аргх!"
2501-8 = "Чем ты занимаешься, сестрёнка?"
2501-9 = "Не отвлекай меня, Мидори! Это критический момент!"
2501-10 = "Ещё один удар... Всего один удар — и победа моя!"
2501-11 = "О, Student Fighter 2! Ты в последнее время часто в неё играешь, да?"
2501-12 = "Ага, в последнем обновлении добавили онлайн-подбор соперников. Теперь я могу играть в реальном времени с людьми из аркады!"
2501-13 = "Мне уже становилось скучно, потому что попадались только слабые соперники..."
2501-14 = "Но спустя какое-то время я наконец встретила достойного противника!"
2501-20 = "Отлично, я загнала его в угол! Теперь нужно сделать командный захват и отменить его блок..."
2501-21 = ""
2501-22 = "Какого?! Он сделал уклонение из блока и сразу апперкот?!"
2501-23 = "А потом длинное комбо... ещё и финишер?!"
2501-29 = "<SYSTEM> Peach_Fighter проиграл!"
2501-30 = "Что, серьёзно?! Я допустила одну крошечную ошибку в самом конце — и всё перевернули против меня!"
2501-31 = "Так близко. Буквально на волоске!"
2501-32 = "Ничего не поделаешь. Матч есть матч."
2501-33 = "Надо отправить сообщение с благодарностью за хорошую игру..."
2501-35 = "«Peach_Fighter: Хорошая игра, Sukeban312. Давай как-нибудь реванш!»"
2501-36 = "Sukeban312: учись играть, нуб, лол."
2501-37 = "Ч-Что? Это вообще было ни к месту!"
2501-38 = ""
2501-39 = "«Peach_Fighter: Эй, что за отношение? Ведёшь себя как ребёнок!»"
2501-40 = "Sukeban312: Ребёнок здесь ты, а не я. Хотя, судя по тому, какие у тебя медленные движения, может, мне лучше звать тебя «бабулей»!"
2501-41 = "Б-Бабулей?!"
2501-42 = ""
2501-43 = "«Peach_Fighter: Я вообще-то чуть тебя не победила, помнишь?!»"
2501-44 = "Sukeban312: Кто-то плачет? Извини, я не понимаю язык неудачников!"
2501-45 = "Аргх! ...Ты где живёшь?! Адрес сюда, быстро!"
2501-46 = "SYSTEM: Пользователь заблокировал вас."
2501-47 = "..."
2501-48 = ""
2501-49 = "...Ох, жесть."
2501-50 = "Что за чёрт...?"
2501-52 = "Что за токсичный игрок вообще?!"
2501-54 = "Ну раз уж он так..."
2501-55 = "Идём искать его в реале!"
2501-57 = "Что? Мы тоже...?"
2501-58 = "Ты хочешь, чтобы мы пошли с тобой?"
2501-59 = "Конечно! Главное — задавить противника числом!"
2501-60 = "Я на сто процентов уверена, что это какой-нибудь задрот. Если заявимся всей толпой, он испугается и извинится!"
2501-61 = "Но разве мы сами не такие же задроты...?"
2501-62 = "Сестрёнка, обязательно так заводиться? Это всего лишь игра. Ты проиграла, а тебя затоксичили. Вот и всё."
2501-63 = "Всего лишь игра?! Это вопрос достоинства Отдела разработки игр!"
2501-64 = "Этот человек мало того что растоптал мой жест спортивного уважения, так ещё и назвал меня бабулей!"
2501-65 = "Бабулей... Ух!"
2501-66 = "Совершенно непростительно!"
2501-67 = "Тебя сильнее бесит, что тебя назвали бабулей, чем сам проигрыш?"
2501-68 = "Вообще-то токсичные игроки плохо влияют на сообщество файтингов."
2501-69 = "Если каждый матч будет превращаться в такой неприятный опыт, кто вообще захочет играть в файтинги?"
2501-70 = "Ради здоровой игровой среды мы обязаны проучить этого токсика!"
2501-71 = "Согласна. Пару дней назад я играла в MMORPG, и моего персонажа убил игрок максимального уровня. Было так обидно, что мне вообще захотелось бросить игру..."
2501-72 = "Но с тех пор я уже догнала его по уровню и отомстила!"
2501-73 = "Ты уже взяла максимальный уровень? Серьёзно, иногда твоя одержимость меня пугает..."
2501-74 = "Но ты ведь и сама иногда поддеваешь соперника после победы, сестрёнка?"
2501-75 = "Когда мы закончили играть в Fruitjellies, ты сразу начала меня дразнить! Сказала: «Я бы тебя даже ногами обыграла»!"
2501-76 = "Эм, ну... Это... э-э..."
2501-77 = "Знакомых подкалывать можно! Гораздо грубее говорить такое совершенно незнакомому человеку."
2501-78 = "Да неважно! В общем, я посмотрела историю матчей этого игрока и выяснила, что десять минут назад он заходил из ближайшей аркады."
2501-79 = "Значит, если пойдём туда прямо сейчас, сможем его найти. Выследим и заставим извиниться за свои слова!"
2501-80 = "Мне как раз самой нужно кое-что в аркаде... Думаю, я могу пойти с вами."
2501-81 = "Это словно квест на победу над генералом Владыки демонов! Рейд на четырёх игроков!"
2501-82 = "Эм... Мне в аркаде ничего не нужно, и драться я тоже не хочу..."
2501-83 = "...Можно я пропущу этот поход?"
2501-84 = "Нет! В групповом бою с боссом у каждого участника критически важная роль!"
2501-85 = "Контролировать территорию лучше всего вчетвером, когда каждый перекрывает свою сторону!"
2501-86 = "Но всё же..."
2501-87 = "О, точно! Там вроде выставили новую консоль, которую ты так ждала... Тебе разве не интересно, какие у неё новые функции?"
2501-88 = "...Новая консоль?!"
2501-89 = "Ты всё равно никогда не выходишь одна. Давай воспользуемся случаем и посмотрим её вместе. Ну как?"
2501-90 = "Ну ладно. Хорошо..."
2501-91 = "Но я вмешиваться не буду. Просто постою сзади и посмотрю."
2501-92 = "Этого достаточно!"
2501-93 = "Та-дам! Группа из четырёх игроков собрана!"
2501-94 = ""
2501-95 = ""
2501-96 = "Отлично, пошли проучим этого наглого тролля!"
