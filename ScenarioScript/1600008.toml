[translation]
1600008-1 = "Не то место"
1600008-2 = "Я следовал указаниям Харуки, но по какой-то причине они привели меня совсем не туда, куда я ожидал."
1600008-3 = "[s] «...?»"
1600008-4 = "Я совершенно точно никогда здесь не бывал. В этой части окраин Геенны не было никаких следов человеческой деятельности."
1600008-5 = "Из-за неприветливой местности даже хулиганов в этой заброшенной зоне не встретишь."
1600008-6 = "Я пришёл, потому что она так сказала, но Харуки нигде не было."
1600008-7 = "[ns1] Осмотреться.\n[ns2] Подождать ещё немного."
1600008-11 = "...?"
1600008-12 = "[ns] Пойти на звук."
1600008-15 = "Похоже, звук доносился из старого заброшенного здания."
1600008-16 = "Странный шорох не прекращался..."
1600008-17 = ""
1600008-19 = "..."
1600008-20 = "[ns] Подойти к звуку ещё ближе."
1600008-23 = "Следуя за звуком, я дошёл до двери заброшенного склада. Шорох не прекращался."
1600008-24 = "Когда я осторожно заглянул внутрь, человек внутри не услышал меня из-за шума дождя."
1600008-25 = "[ns] Осторожно открыть дверь и войти."
1600008-27 = "..."
1600008-31 = "А?!"
1600008-35 = "А? Э...?![wa:1900]"
1600008-37 = "― П-п-почему? А?![wa:2190]"
1600008-40 = "― П-почему вы здесь, Сенсей?[wa:1940]"
1600008-42 = "― К-как...? П-почему вы здесь, Сенсей...?![wa:490]"
1600008-45 = "― Я-я опять всё испортила...[wa:2420]"
1600008-47 = "А, м-может быть, я неправильно указала место...?[wa:2110]"
1600008-50 = "― Э-это... Здесь...[wa:1200]"
1600008-52 = "― Здесь я... Как бы сказать...[wa:920]"
1600008-55 = "― Ну, сорняки и всё такое...[wa:1230]"
1600008-57 = "― Здесь я выращиваю такие вещи... Вот...[wa:2150]"
1600008-60 = "― П-простите, Сенсей.[wa:1500]"
1600008-62 = "― Это из-за меня... такой человек, как вы, пришёл в такое грязное место...[wa:1760]"
1600008-65 = "― А? Ах...? Т-только что,[wa:1890]"
1600008-67 = "― мне послышалось н-нечто невероятное...!?[wa:770]"
1600008-70 = "― (Хочу умереть хочу умереть хочу умереть хочу умереть[wa:10]"
1600008-72 = "― хочу умереть хочу умереть хочу умереть хочу умереть хочу умереть...)[wa:10]"
1600008-75 = "Т-так... это место..."
1600008-76 = "Это... Ну, как бы сказать, эм... С-совершенно бесполезное место... но..."
1600008-77 = "Не знаю, помните ли вы сорняки, которые я однажды пыталась вам подарить, но... я-я выращиваю здесь такие вещи..."
1600008-78 = "[s3] «Значит, это вроде личного сада.»\n[s4] «Тогда это твой ботанический сад, верно?»"
1600008-79 = "Да... Что? Н-нет! Нет, ничего настолько грандиозного! Э-это...!"
1600008-80 = "Да... Что? Н-нет! Нет, ничего настолько грандиозного! Э-это...!"
1600008-81 = "А-ах! Э-это нельзя трогать! О-ой, не то чтобы нельзя! Просто этот малыш хищный и может вас укусить!"
1600008-82 = "О нет. Простите! Простите! Если хотите посмотреть, я дам ему укусить меня вместо вас. Правда, всё нормально!"
1600008-83 = "[s5] «Ты прекрасно их вырастила. Они очень красивые.»\n[s6] «Не знал, что ты так хороша в подобных вещах.»"
1600008-84 = "...Что? Я-я не понимаю, что вы говорите."
1600008-85 = "...Что? Я-я не понимаю, что вы говорите."
1600008-86 = "Эм..."
1600008-87 = "С-Сенсей только что... п-похвалил меня?"
1600008-88 = "...А?"
1600008-89 = "П-приводила ли я сюда кого-нибудь ещё? Н-ни за что!"
1600008-90 = "Я-я никогда бы так не сделала! В такое грязное, неприятное и мрачное место...!"
1600008-91 = "Никто не захотел бы видеть такое место... Ни за что! Я не могла бы так кого-то утруждать!"
1600008-92 = "Мне даже нет смысла кому-то об этом рассказывать... Да и если расскажу, сомневаюсь, что кому-то будет интересно..."
1600008-93 = "[s7] «Значит, теперь это наше тайное убежище?»\n[s8] «Для меня честь, что ты пригласила меня в такое тайное место.»"
1600008-94 = "...А?"
1600008-95 = "Что?"
1600008-96 = "Т-Тайное убежище... Наше?!"
1600008-97 = "Ты не ошибаешься, но... т-тайна между Сенсеем и мной... Р-Разве кому-то вроде меня можно иметь что-то такое с кем-то вроде тебя?"
1600008-98 = "Что? Т-Ты хочешь прийти сюда снова...?"
1600008-99 = "К-Конечно! Это же наше тайное убежище. Так что если захочешь, Сенсей..."
1600008-100 = "П-Просто скажи, когда придёшь, и я встречу тебя в любое время! А-Хотя можешь даже не говорить — я просто буду ждать тебя здесь целую вечность!"
1600008-101 = "Н-Но правда, зачем тебе вообще приходить в такое место? На эту свалку, где обитаем бесполезная я и мои бесполезные сорняки..."
1600008-102 = "Н-Нет! Если считать это цветами, тогда и мох на тротуаре придётся считать цветами!"
1600008-103 = "..."
1600008-104 = ""
1600008-106 = ""
1600008-107 = ""
1600008-108 = "...Да. Всё действительно... действительно так..."
