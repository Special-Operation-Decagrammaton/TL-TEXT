1005202-54 = "15:46:08 — Сенсея [USERNAME] отвлёк бездомный кот, постучавший в окно. Затем Сенсей 1 минуту 30 секунд пытался разговаривать с котом. Последние 30 секунд он пытался мяукать."
1005202-55 = "[s] «И чем вообще полезны такие записи?!»"
1005202-56 = "Как я уже говорила, не секретарю решать, насколько ценны записи."
1005202-57 = "Это записи твоих действий, увиденных непредвзятым разумом."
1005202-58 = "Но если смотреть моими глазами... Это выглядит как невероятно обычная повседневная рутина..."
1005202-59 = "Что, возможно, будет ценно для кого-то, кто хочет лучше понять тебя или твою работу."
1005202-60 = "...Возможно, настолько ценно, что это можно будет дорого продать?"
1005202-61 = "[s] «П-Прекрати...»"
1005202-62 = "Прости, но я не могу просто по своему желанию перестать вести записи."
1005202-63 = "Если я изменю сами записи или процесс их ведения, объективность отчёта будет нарушена."
1005202-64 = "Ах. Я чуть не забыла записать то, что ты сказал только что."
