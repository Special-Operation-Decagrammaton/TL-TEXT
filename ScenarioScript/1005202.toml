[translation]
1005202-1 = "Секретарь замечает детали"
1005202-2 = "Исполнительный офис Шале"
1005202-3 = "Здравствуйте, Сенсей."
1005202-4 = "Как я и говорила, сегодня я пришла поработать смену в Шале."
1005202-5 = "Я не знакома с вашими порядками, поэтому поначалу могу работать немного медленнее. Заранее благодарю за понимание."
1005202-6 = "[s] «Не переживай. Всё будет хорошо.»"
1005202-7 = ""
1005202-9 = ""
1005202-10 = "Хи-хи... Ты и правда именно такой, как мне рассказывали."
1005202-11 = "Теперь я понимаю, почему студенты всегда так стремятся тебе помочь."
1005202-12 = "[s] «Не знаю, что именно ты слышала...»"
1005202-13 = "Не волнуйся."
1005202-14 = "Я никогда не слышала о тебе ничего... слишком плохого."
1005202-15 = "Но это неважно. Итак, чем я могу тебе помочь?"
1005202-16 = "[s] «Прости, я не оставил тебе никакой работы.»"
1005202-17 = "О. Ты уже закончил работу, поэтому помощь не нужна? Ты здесь просто доделываешь личные дела?"
1005202-18 = "Вот неловко. Я ведь пришла сюда помогать тебе..."
1005202-19 = "И мне как-то не по себе просто ничего не делать в рабочее время..."
1005202-20 = "[s] «Почему бы тебе просто не заняться тем, чем обычно занимаешься?»"
1005202-21 = "Тем, чем я обычно занимаюсь?"
1005202-22 = "Ну, обычно я выполняю базовые административные задачи или веду протоколы заседаний «Семинара», где обсуждают..."
1005202-23 = "А, понятно. Ты хочешь, чтобы я что-нибудь записывала."
1005202-24 = "Тогда, как официально одолженный «Семинаром» секретарь, я приступаю к регистрации событий, происходящих в этом офисе."
1005202-25 = "[s1] «На твоём месте я бы многого не ждал...»\n[s2] «Просто располагайся поудобнее.»"
1005202-26 = "Угу."
1005202-27 = "Угу."
1005202-29 = ""
1005202-34 = "[s] «Эм...»"
1005202-35 = "...Сегодня я казалась другой?"
1005202-36 = "[s] «Что ты пишешь?»"
1005202-37 = "Ты про эту запись?"
1005202-38 = "Вот поэтому записи так важны. Мы только что обсуждали, что именно я буду записывать, а ты уже забыл."
1005202-39 = "[s] «Да, но ведь ничего достойного записи не произошло...»"
1005202-40 = "Насколько событие достойно записи — вопрос личной оценки."
1005202-41 = "Работа секретаря — объективно фиксировать все события, чтобы ничего не отсеивалось несправедливо из-за субъективных предубеждений."
1005202-42 = "Например..."
