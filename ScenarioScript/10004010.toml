[translation]
10004010-1 = "Эпизод 1;Печали инструктора Шун"
10004010-2 = "Сад Цветущей Сливы"
10004010-3 = ""
10004010-4 = ""
10004010-5 = ""
10004010-6 = "*вздох* Сегодняшняя экскурсия была тяжёлой..."
10004010-7 = "Обычно дети — ангелочки, но стоит им начать действовать самостоятельно, и они перестают слушать, что бы я ни говорила."
10004010-8 = "Когда смотрю на воспитанников Сада сливового цветка, иногда хочется бросить работу и просто закричать..."
10004010-9 = "Нет, нельзя срываться из-за такой мелочи."
10004010-10 = "Обязанность инструктора Шаньхайцзина — дисциплинировать юных студентов и помогать им вырасти хорошими людьми! Нельзя падать духом!"
10004010-11 = "К тому же хмуриться вредно для кожи."
10004010-12 = "Так... День был тяжёлым, пора себя побаловать!"
10004010-13 = "Мороженое Baagen-Razs со вкусом рома и изюма!"
10004010-14 = "Я берегла его, потому что такой вкус трудно найти в Шаньхайцзине, но сегодня вечером наконец расслаблюсь и съем его."
10004010-15 = "Не могу дождаться!"
10004010-16 = ""
10004010-17 = ""
10004010-18 = "А? Куда делось мороженое, которое я положила в морозилку?"
10004010-20 = "Эй, что ты ищешь?"
10004010-21 = "О, Кокона."
10004010-22 = "Мороженое, которое я положила в морозилку, пропало. Ты его не видела?"
10004010-23 = "С ромом и изюмом? Я съела."
10004010-24 = "Что?! Как ты могла съесть его, ничего мне не сказав?!"
10004010-25 = "Его очень трудно достать, я берегла для особого случая..."
10004010-26 = "Но разве на прошлой неделе ты не говорила, что сокращаешь молочные продукты ради диеты?"
10004010-27 = "Я решила, что мороженое тоже считается..."
10004010-28 = "Угх..."
10004010-29 = "П-Прости... Хочешь Моримори-кун со вкусом кукурузного супа, который я купила?"
10004010-30 = "Нет, всё нормально. Я сама виновата, что заранее не сказала."
10004010-31 = "О, кстати... Не могла бы ты после обеда подготовить перекус для учеников класса Подсолнуха?"
10004010-32 = "А? Я думала, это сделаешь ты!"
10004010-33 = "Но... я слышала, сегодня на перекус морковный пирог. А я не люблю морковь."
10004010-34 = "Кокона, я уже говорила: в жизни не добьёшься успеха, если будешь есть только то, что нравится."
10004010-35 = "Уф, опять начинаешь читать нотации. Не надо мне это говорить! Я и так знаю!"
10004010-36 = "В общем, я потом компенсирую. Спасибо!"
10004010-37 = ""
10004010-39 = ""
10004010-40 = "П-Подожди, Кокона!"
10004010-41 = ""
10004010-42 = "*вздыхает*"
10004010-43 = "Почему все ведут себя как дети?"
10004010-44 = "Студенты, Кокона... все просто делают что хотят."
10004010-46 = "Хотела бы я снова стать маленьким ребёнком!"
10004010-47 = "Нет, в таких ситуациях нужно сохранять спокойствие."
10004010-48 = "Стресс — враг молодости и красоты! Если раздражаться по каждому поводу, кожа испортится."
10004010-49 = "Уф, наверное, из-за усталости, но в последнее время кожа такая сухая и шершавая. Нужно найти новый уход."
10004010-50 = "Кстати, Сая из Общества восточной алхимии говорила, что исследует эликсир бессмертия, верно?"
10004010-51 = "Жить вечно мне не нужно, но Сая наверняка много знает о средствах против старения."
10004010-52 = "Стоит заглянуть в Общество восточной алхимии, прежде чем готовить дневной перекус..."
10004010-54 = "Лаборатория Саи"
10004010-55 = "Хе-хе-хе... Какой эксперимент провести сегодня? Уже не терпится начать."
10004010-57 = "Прошу прощения."
10004010-58 = "О, это Шун из Сада сливового цветка? Добро пожаловать в мою лабораторию!"
10004010-59 = "Ух ты, Сая. У тебя сегодня такой красивый наряд."
10004010-60 = "Ты куда-то идёшь?"
10004010-61 = "Ага, сегодня днём встречаюсь в городе с Сенсеем [USERNAME]."
10004010-62 = "Сенсею нужна моя помощь купить аптечку для Шале."
10004010-63 = "Что?! Ты идёшь гулять с Сенсеем [USERNAME]?"
10004010-64 = "Да. Есть проблема?"
10004010-65 = "Н-Нет, проблем нет, но..."
10004010-66 = "(Когда я раньше просила Сенсея сходить со мной, он отказался и сказал, что занят. Оказывается, у Сенсея уже были планы с Саей...)"
10004010-67 = "(Я знаю, это просто по делам Шале, но всё равно обидно.)"
10004010-68 = "В любом случае, зачем ты пришла в мою лабораторию? Сомневаюсь, что по делам Сада сливового цветка."
10004010-69 = "Надеюсь, ты не пришла просить меня быть посредником между Генрюмон и Променадом Чёрной Черепахи! Я, конечно, гений, но даже мне не всё под силу!"
10004010-70 = "Ха-ха. Конечно нет. Все знают, что эти две стороны будут воевать до конца времён."
10004010-71 = "Я не настолько глупа, чтобы вмешиваться."
10004010-72 = "Я хотела спросить, нет ли у тебя какого-нибудь лекарства..."
10004010-73 = "Лекарства? Ты заболела?"
10004010-74 = "Нет, я здорова."
10004010-75 = "Но в последнее время кожа стала очень грубой, может, из-за усталости или стресса."
10004010-76 = "У тебя есть что-нибудь для ухода за кожей?"
10004010-77 = "Хе-хе. Ты пришла по адресу. Я как раз тестирую новый эликсир!"
10004010-78 = "Я называю это..."
10004010-80 = "Эликсир омоложения!"
10004010-82 = "Эликсир омоложения?"
10004010-83 = ""
10004010-85 = ""
10004010-87 = "Моё секретное изобретение. Всего один глоток — и кожа станет гладкой, как у младенца, сколько бы тебе ни было лет!"
10004010-88 = "Конечно, он ещё на стадии испытаний, поэтому возможны побочные эффекты — но эффективность я гарантирую!"
10004010-89 = "Ну что! Хочешь попробовать?"
10004010-90 = "Да, дай мне немного!"
10004010-91 = "Хорошо."
10004010-92 = ""
10004010-93 = ""
10004010-94 = "Хорошо, рассказывай мне обо всех эффектах, которые почувствуешь."
10004010-95 = ""
10004010-97 = ""
10004010-98 = ""
10004010-100 = "(Неужели от этого кожа и правда станет гладкой, как у младенца?)"
10004010-101 = "(В детстве у меня никогда не было проблем с кожей. И усталости такой не чувствовала.)"
10004010-102 = "(Когда я была маленькой, жить было легче. Чем старше становишься, тем больше проблем накапливается...)"
10004010-103 = "(Ненавижу стареть.)"
10004010-113 = ""
10004010-114 = "Ну как? Чувствуешь изменения в коже?"
10004010-115 = "Не знаю насчёт кожи, но всё тело ощущается странно. Мне... жарче."
10004010-116 = "А? Странно. Я не добавляла ничего, что должно повышать температуру тела."
10004010-117 = "Ч-что за...?"
10004010-118 = "Ч-Что такое, Сая?"
10004010-119 = "Т-так… Эм…"
10004010-120 = "Сая, ты что, стала выше? Такое чувство, будто ты смотришь на меня сверху."
10004010-121 = "Не я стала выше. Это ты уменьшилась! Посмотри в зеркало!"
10004010-122 = "В зеркало?"
10004010-123 = ""
10004010-125 = ""
10004010-127 = ""
10004010-128 = ""
10004010-129 = ""
10004010-130 = ""
10004010-132 = "А?! К-Как я стала такой?!"
10004010-133 = "Я-я не знаю! Я не ожидала такого побочного эффекта!"
10004010-134 = "Я ожидала чего-нибудь вроде растягивания тела как резины или кошачьих усов. Но не уменьшения..."
10004010-135 = "Сая, зачем ты вообще дала мне такое?!"
10004010-136 = "Н-Не волнуйся! Я гений, так что быстро сварю противоядие!"
10004010-137 = "П-Подожди немного. Я схожу на склад Общества восточной алхимии и возьму всё нужное!"
10004010-138 = ""
10004010-140 = ""
10004010-141 = ""
10004010-142 = "*вздох* Катастрофа. Я говорила, что хочу снова стать ребёнком, но не ожидала, что действительно превращусь в одного..."
10004010-143 = "Хотя должна признать, кожа и правда стала очень гладкой. И даже пахнет как мягкая кожа младенца."
10004010-144 = ""
10004010-146 = ""
10004010-148 = ""
10004010-150 = "И не только это — теперь я могу двигаться, и плечи не болят. Чувствую себя намного легче!"
10004010-151 = "Может, такое крошечное тело не самое худшее, что могло случиться."
10004010-152 = ""
10004010-154 = "[ns] «Привет.»"
10004010-155 = "Сенсей [USERNAME]? Ч-Что вы здесь делаете...?"
10004010-156 = "Я-я могу всё объяснить..."
10004010-157 = "[s] «Ты из Сада сливового цветка?»"
10004010-158 = "А?"
10004010-159 = "Т-так… Эм…"
10004010-160 = ""
10004010-162 = "(Стой. Сенсей меня больше не узнаёт?)"
10004010-163 = "(Я внезапно превратилась в ребёнка даже меньше Коконы. Наверное, странно было бы, если бы Сенсей узнал во мне того же человека.)"
10004010-164 = "(Если упомянуть эликсир Саи, всё станет сложнее, так что просто что-нибудь придумаю.)"
10004010-165 = ""
10004010-167 = "Д-Да! Я-я новый студент Сада сливового цветка. Мне девять лет, и меня зовут Шу... Шунлинь!"
10004010-168 = "Я приехала в Шаньхайцзин с инструктором Шун и потерялась..."
10004010-169 = "[s1] «Я просто пришёл встретиться с Саей.»\n[s2] «Ты не видела Саю?»"
10004010-170 = "О... Саю я не видела. Может, она куда-то вышла?"
10004010-171 = "О... Саю я не видела. Может, она куда-то вышла?"
10004010-172 = "[s3] «Тогда, может, стоит поискать Шун.»\n[s4] «Я отведу тебя в Сад сливового цветка, пока Сая не вернулась.»"
10004010-173 = "А? Н-Не обязательно..."
10004010-174 = "А? Н-Не обязательно..."
10004010-175 = ""
10004010-177 = "(Уф. Похоже, я помешала Сае и Сенсею сходить вместе. Неловко.)"
10004010-178 = "(И вдобавок я соврала Сенсею...)"
10004010-179 = "(Но если честно, Сая тоже виновата, что я оказалась в такой ситуации, верно?)"
10004010-180 = "(Мне не пришлось бы врать Сенсею, если бы у эликсира изначально не было побочных эффектов. Я просто пыталась защитить себя!)"
10004010-181 = ""
10004010-183 = "Ладно, если вы не против... Спасибо, Сенсей."
10004010-184 = "[s] «Кстати, куда ушла Шун?»"
10004010-185 = "Не знаю, здесь ли она ещё. Может, ушла на Променад Чёрной Черепахи?"
10004010-186 = "Раньше Шун говорила, что в её любимой лавке танхулу выходит новинка."
10004010-187 = "К-Конечно, это не значит, что Шун безответственный инструктор, который оставляет младших студентов одних ради сладостей!"
10004010-188 = "[s] «Шунлинь, а почему ты защищаешь Шун?»"
10004010-189 = "Я-я просто думаю... что Шун сказала бы именно так, будь она здесь. Ха-ха..."
10004010-190 = "Ладно-ладно, забудьте. Пойдём, Сенсей!"
