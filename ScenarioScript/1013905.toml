[translation]
1013905-1 = "Консультация Нико"
1013905-2 = "В тот день мне не везло с самого момента пробуждения."
1013905-4 = "Комната ночной смены Шале"
1013905-6 = "[ns] «Ммм... Ух...»"
1013905-7 = "Но-о-о! Вперёд, вперёд!"
1013905-8 = "Врум-врум! Поехали!"
1013905-9 = "Хи-хи. Еда была та-а-акой вкусной!"
1013905-10 = "[ns] «Почему именно сегодня так шумно...»"
1013905-11 = "Никаких тормозов, только кайф! Кажется, сегодня уложились меньше чем в три минуты! И это по обычной дороге."
1013905-12 = "Гоночная ассоциация «Врум-врум» тоже была огонь. Сегодняшний заезд будет шикарным."
1013905-13 = "Капитан, погнали всю ночь!"
1013905-14 = "Я же сказала звать меня «Президент»!"
1013905-15 = "[ns] «Я не могу уснуть...»"
1013905-18 = "Из-за шума байкерской банды, гонявшей вокруг Шале всю ночь, я так и не сомкнул глаз..."
1013905-20 = ""
1013905-21 = "[ns] «Простите, вы уронили платок.»"
1013905-22 = ""
1013905-23 = "[ns1] «Может, не услышала...?»\n[ns2] Побежать за ней, чтобы вернуть платок."
1013905-29 = ""
1013905-30 = "Офицер, вот этот человек!"
1013905-31 = "В последнее время мне казалось, будто за мной кто-то наблюдает..."
1013905-32 = "И я уверена на сто процентов! Это сталкер!"
1013905-33 = ""
1013905-34 = "[ns] «Нет, стойте, я просто хотел вернуть это—»"
1013905-35 = "«Вернуть» что-то? А ты вообще думал, что чувствует жертва твоего преследования?"
1013905-36 = ""
1013905-38 = ""
1013905-39 = "Если подумать, лицо знакомое... Я тебя не видела на плакате «разыскивается»?"
1013905-40 = "Ты. Пойдём пока в участок. Оправдания выслушаем там."
1013905-41 = "[s] «Это огромное недоразумение!»"
1013905-43 = "На это «недоразумение» ушло довольно много времени."
1013905-44 = ""
1013905-45 = "...Значит, она решила, что я плохо о ней говорила, просто поверив слухам."
1013905-46 = "Я думала, мы подруги... а она просто поверила слухам, даже не спросив меня?"
1013905-47 = "Нашим отношениям конец. Всё кончено!"
1013905-48 = "[s] «Ладно, давай успокоимся и ещё раз всё обдумаем.»"
1013905-49 = ""
1013905-50 = ""
1013905-52 = "[ns3] «Может, у неё тоже есть своя сторона истории.»\n[ns4] «Попробуй с ней поговорить—»"
1013905-55 = "Сенсей, вы сейчас встаёте на её сторону?!"
1013905-56 = "Как ещё это можно понимать? Другого объяснения НЕТ!"
1013905-57 = "[s] «Нет, я не это имел в виду...»"
1013905-58 = "...Ух. Конечно, вы тоже думаете, что я веду себя неразумно."
1013905-59 = "Вы даже не смотрели на меня, пока я говорила!"
1013905-60 = "Мне нужно идти."
1013905-61 = ""
1013905-63 = ""
1013905-64 = "[ns] «П-Подожди...!»"
1013905-67 = "Наверное, сказалась усталость, но я умудрился всё испортить даже на консультации со студентом."
1013905-68 = "День и без того состоял из одной неудачи за другой. Казалось, я уже вообще не способен нормально думать."
1013905-69 = "Все проблемы либо были моей виной, либо не зависели от меня, но мне казалось, что пожаловаться на это некому."
1013905-75 = "Позже в тот же день..."
1013905-78 = ""
1013905-79 = "Здравствуйте, Сенсей. Я пришла помочь вам с оставшейся работой."
1013905-80 = "Во время недавней операции мне удалось достать хорошие чайные листья, так что я принесла поделиться—"
1013905-81 = "О, Сенсей. Вы в порядке?"
1013905-82 = "Вы выглядите очень уставшим."
1013905-83 = "[s5] «Ничего.»\n[s6] «Я в порядке, давай просто начнём работать.»"
1013905-86 = "Вы так говорите, но выглядите действительно уставшим."
1013905-87 = "Сегодня что-то случилось?"
1013905-88 = "[ns] «Всё нормально. К тому же...»"
1013905-90 = "[ns] «Это вообще не связано с тобой, Нико.»"
1013905-91 = ""
1013905-92 = "[ns] «Прости, я не это имел в виду.»"
1013905-93 = ""
1013905-94 = ""
1013905-95 = "Я так и не восприняла! И раз я сторонний человек, кому ещё лучше всё рассказать?"
1013905-96 = "Хорошо, Сенсей. Вторую половину рабочего дня откладываем. Идите за мной!"
1013905-100 = "Нико взяла меня за руку и потащила по коридору в комнату ночной смены."
1013905-102 = ""
1013905-103 = "Так, Сенсей. Пожалуйста, ложитесь на кровать."
1013905-104 = "[s7] «Я ценю твою заботу, Нико, но...»\n[s8] «Ещё рано, я всё равно не усну.»"
1013905-107 = "Я и не говорю, что нужно спать."
1013905-108 = "Ложитесь, закройте глаза и расскажите, что сегодня произошло."
1013905-109 = "Говорите всё, что приходит в голову, даже если кажется неважной мелочью."
1013905-110 = "Можете рассказывать подробно или очень расплывчато."
1013905-111 = "Просто расслабьтесь и немного снимите с себя груз."
1013905-112 = "[s] «Не могу же я сваливать такое на студента...»"
1013905-113 = "Тогда я свяжу вас в этой кровати, пока не ответите!"
1013905-114 = "В SRT нас учат МНОЖЕСТВУ способов обездвиживания. Хотите живую демонстрацию?"
1013905-115 = "[s9] «Л-Ладно!»\n[s10] «Тогда совсем немного...»"
1013905-119 = "Я лёг и, следуя указаниям Нико, рассказал обо всём, что произошло за день."
1013905-120 = "Она позволяла мне говорить сколько угодно, время от времени кивая и вставляя короткие реплики, показывая, что слушает."
1013905-122 = ""
1013905-123 = "...Теперь понимаю."
1013905-124 = "У всех бывают такие дни."
1013905-125 = "Каждое событие само по себе пустяк, но вместе это смерть от тысячи порезов."
1013905-126 = "Жаловаться на такое кажется глупым, но держать всё внутри ещё тяжелее."
1013905-127 = "[s11] «Именно. Скоро я просто отойду.»\n[s12] «Не хотел заставлять тебя волноваться из-за такой ерунды.»"
1013905-130 = "Пожалуйста, не говорите так."
1013905-131 = "Как я уже сказала, чем незначительнее проблема, тем проще её проигнорировать и дать ей загнить внутри."
1013905-132 = "Какой бы глупой она ни казалась, полезно выговориться."
1013905-133 = "Ну как вам теперь, после того как всё сказали вслух?"
1013905-134 = "[s13] «Да. Стало немного легче.»\n[s14] «Спасибо, Нико.»"
1013905-137 = "Не за что."
1013905-138 = "Мне кажется, взрослым бывает ещё сложнее честно говорить о своих чувствах."
1013905-139 = "Так что, как вы постоянно говорите нам, иногда нормально немного опираться на других. Даже на нас, студентов."
1013905-140 = "[s] «По-моему, я стараюсь быть честным со своими студентами.»"
1013905-141 = "Я не говорю, что вы лжёте."
1013905-142 = "Но умолчание тоже бывает ложью."
1013905-143 = "Поэтому моя просьба — говорите свободно то, что думаете, а не выбирайте только удобные кусочки, которыми готовы поделиться."
1013905-144 = "[s] «...Я постараюсь.»"
1013905-145 = "...Какой же вы хлопотный."
1013905-146 = ""
1013905-148 = ""
1013905-149 = ""
1013905-150 = "Наверное, поэтому рядом и есть такие сообразительные студенты, как я, чтобы помогать проблемным старым взрослым вроде вас."
1013905-152 = "Я ещё немного полежал, болтая с Нико, а затем вернулся в офис, чувствуя себя гораздо спокойнее."
