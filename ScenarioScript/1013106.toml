[translation]
1013106-1 = "Принцесса под ночным небом"
1013106-3 = "[ns] «Не могу поверить, что вижу северное сияние...»"
1013106-4 = "Да, иногда оно появляется над Красной Зимой."
1013106-5 = "У нас даже есть приложение с прогнозом северного сияния."
1013106-6 = "[s] «Вижу, тебе нравится фотографировать.»"
1013106-7 = "Н-Наверное?"
1013106-8 = "...Хотя мне больше нравится снимать красивые пейзажи, чем портреты."
1013106-9 = "Мне кажется, фотография и составление критических отзывов в чём-то имеют много общего."
1013106-10 = "[s] «Никогда об этом не задумывался.»"
1013106-11 = "Кхм. Позвольте развить мою мысль, Сенсей."
1013106-12 = "Цель критики — наблюдать культурное произведение, а затем при помощи собственной логики и слов..."
1013106-13 = "...перенести свои чувства на бумагу посредством письма."
1013106-14 = "В каком-то смысле вы пытаетесь запечатлеть чувства и впечатления определённого момента и передать их другому человеку."
1013106-15 = "А ваше впечатление, или «критика», затем читается другими, переосмысливается и редактируется так, чтобы создать ощущение объективности."
1013106-16 = "Стремление к «объективности» — возможно, бесплодная попытка выразить универсальную точку зрения."
1013106-17 = "Так я вижу связь между фотографией и критикой."
1013106-18 = "[s] «То есть фотография передаёт объективность?»"
1013106-19 = "В определённой степени. Ничто не бывает по-настоящему «объективным». Фотограф ведь принимает десятки решений: выбор объектива, кадра, выдержки..."
1013106-20 = "Все эти мелкие решения влияют на итоговую фотографию и на то, как её будут воспринимать."
1013106-21 = "Любая попытка добиться объективности неизбежно включает множество субъективных решений."
1013106-22 = "Отпечаток создателя естественным образом остаётся на любом произведении."
1013106-23 = "Разве это переплетение противоположностей не кажется вам интересным?"
1013106-24 = "По крайней мере... мне кажется, что да."
1013106-25 = "Думаю, то же самое можно сказать и об отношениях между творческими работами и критикой."
1013106-26 = "[s] «Творческими работами...?»"
1013106-27 = "Что? Думала ли я когда-нибудь создать собственные... более «творческие» работы?"
1013106-28 = "Эм... Ну..."
1013106-29 = "Я..."
1013106-30 = "А...!"
1013106-34 = "Сенсей! Северное сияние!"
1013106-35 = ""
1013106-37 = ""
1013106-38 = ""
1013106-39 = ""
1013106-40 = ""
1013106-41 = "...Природа удивительна, не правда ли?"
1013106-42 = "Каждый раз, когда я вижу величие природы, невольно думаю, что мы, люди, всего лишь пылинки в бескрайней огромной вселенной."
1013106-43 = "Иногда я даже задаюсь вопросом, зачем вообще пишу критические отзывы или думаю о собственном творчестве..."
1013106-44 = "И всё же одновременно я верю, что творческое самовыражение — одно из самых прекрасных стремлений, на которые способен человек."
1013106-45 = "Знаете, как говорят: «люди могут быть не прекрасны, но прекрасным может быть то, что они создают»."
1013106-46 = "...Если что-то не захватывает дух по-настоящему, человек никогда не вдохновится настолько, чтобы попытаться творить самому."
1013106-47 = "Возможно, «критика» — это моя форма творческого самовыражения..."
1013106-48 = "...Мой собственный уникальный способ воспевать красоту."
1013106-49 = "[s1] «В таком случае...»\n[s2] «Я хотел бы сфотографировать тебя. Не возражаешь?»"
1013106-52 = "Ч-Что?! Вы хотите сфотографировать меня...? Я-я, конечно, была бы благодарна и рада, но... почему так внезапно?"
1013106-53 = "Что-о-о?! Вы хотите, чтобы я придумала «тему» для позы? К-Какую именно тему вы имеете в виду...?"
1013106-54 = "Я-Я должна придумать её сама? Вот так, на месте? Это слишком ВНЕЗАПНО, Сенсей!"
1013106-55 = "[s3] «Но посмотри!»\n[s4] «Северное сияние прекрасно, как и сам акт творчества!»"
1013106-58 = "Что? Если добавить что-то красивое к чему-то ещё красивому, это получится просто сумма красоты, а не гармония!"
1013106-59 = "Вы что, любите поливать горячие такояки мятно-шоколадным сиропом?"
1013106-60 = ""
1013106-62 = ""
1013106-63 = "К тому же творчество... не входит в... обязанности критика..."
1013106-64 = "Д-Да, конечно, я читаю и ценю множество разных произведений! Но всё равно! Мне кажется, будто я вторгаюсь в чужой мир..."
1013106-65 = "Я не хочу обесценивать труд тех, кто достаточно смел, чтобы творить..."
1013106-66 = "...Я видела немало случаев, когда кто-то творил спустя рукава, и это оборачивалось массовой болью и страданиями."
1013106-67 = "Что? Вы правда считаете, что это допустимо? Если я с вами? И это останется секретом?"
1013106-68 = "...Запечатлеть один-единственный волшебный миг... только для себя. Как вдохновляюще."
1013106-69 = "[s] «Да. Позволь мне стать твоим критиком, Таканэ.»"
1013106-70 = "...!"
1013106-71 = "Т-Тогда..."
1013106-72 = "Не могли бы вы вдохновить меня какими-нибудь... ключевыми словами... или чем-то подобным...?"
1013106-73 = "[s5] «Ты опальная принцесса, скрывающаяся от преследователей!»\n[s6] «И несмотря на весь хаос, ты заворожена чистой красотой северного сияния!»"
1013106-76 = "...Почему люди всё время говорят мне подобные вещи...?"
1013106-77 = "Хорошо. Если это придумали вы, Сенсей..."
1013106-78 = "Кхм."
1013106-79 = "У меня было три старшие сестры, так что я была младшей дочерью в весьма уважаемой семье."
1013106-80 = "Народ любил меня, но с самого детства... меня преследовала трагическая слабость здоровья."
1013106-81 = "Мне никогда не разрешали играть на улице, поэтому вместо этого я постоянно разыгрывала окружающих..."
1013106-82 = "Из-за этого сёстры называли меня «маленькой бедой», а особенно близка я была с третьей сестрой."
1013106-83 = "Когда я не болела, мы делили одну подушку на кровати. А по утрам вместе купались в холодной воде."
1013106-84 = "Я терпеть не могла холодные ванны, но сестра настаивала, что это укрепит моё здоровье..."
1013106-85 = "Но... из-за череды несчастливых событий наш дом пришёл в упадок..."
1013106-87 = "И мы, четыре сестры, разошлись каждая своей дорогой, даже не зная, увидимся ли когда-нибудь снова."
1013106-88 = ""
1013106-94 = "― [log=타카네]Сенсей, посмотрите... [/log][wa:1450]"
1013106-96 = "― [log=타카네]Северное сияние.[/log][wa:10]"
1013106-99 = "― [log=타카네]Старые предания гласят,[/log]"
1013106-101 = "― [log=타카네]что этот свет — это...[/log]"
1013106-104 = "― [log=타카네]хранители небес,[/log]"
1013106-106 = "― [log=타카네]устроившие пир. [/log][wa:590]"
1013106-109 = "― [log=타카네]Те, кто, как мне казалось, всегда будут рядом...[/log][wa:120]"
1013106-111 = "― [log=타카네]...теперь уже не рядом.[/log][wa:1540]"
1013106-114 = "― [log=타카네]А мир[/log][wa:2030]"
1013106-116 = "― [log=타카네]по-прежнему кажется холодным и далёким.[/log][wa:1580]"
1013106-119 = "― [log=타카네]Но я всё ещё могу смотреть на северное сияние[/log][wa:50]"
1013106-121 = "― [log=타카네]и сохранять надежду, потому что...[/log]"
1013106-124 = "― [log=타카네]Мой «напарник», который останется со мной до самого конца...[/log][wa:1950]"
1013106-126 = "― [log=타카네]...сейчас прямо здесь.[/log][wa:600]"
1013106-129 = "[ns] «О, тогда получается, что напарник — это я?»"
1013106-131 = "― [log=타카네]Фуфу. Да...[/log][wa:1610]"
1013106-133 = "― [log=타카네]Это пролог к этой истории.[/log][wa:1630]"
1013106-136 = "― [log=타카네]Сфотографируйте меня хорошо, ладно?[/log][wa:1240]"
1013106-139 = "..."
1013106-140 = "[s] «П-Почему вы так на меня смотрите, миледи...?»"
1013106-141 = "Я вам не миледи! Мы с этим закончили! Я просто Миёси Таканэ и всегда ею останусь!"
1013106-142 = "Серьёзно... Если бы эту историю написал кто-то другой, мне хватило бы одной страницы, чтобы вынести вердикт..."
1013106-143 = "«Настолько вторичная и избитая история, что уже первая строка заставила меня... с рекордной скоростью... захлопнуть книгу и выбросить её в мусор!»"
1013106-144 = "[s] «Но ведь ты сама её написала.»"
1013106-145 = "Только потому, что вы заставили меня! Я не была готова!"
1013106-146 = "Ух... Просто покажите мне фотографию, пожалуйста."
1013106-147 = "[s] «Ну как?»"
1013106-148 = "..."
1013106-149 = "Получилось замечательно..."
1013106-150 = "Спасибо, Сенсей."
1013106-151 = "Я хотела бы попросить вас об одной вещи."
1013106-152 = "Эта фотография и всё остальное, что... здесь произошло..."
1013106-153 = "Пожалуйста, никому об этом не рассказывайте."
1013106-154 = "[s] «Тебе правда настолько неловко?»"
1013106-155 = "Ну, это определённо одна из причин."
1013106-156 = ""
1013106-158 = ""
1013106-159 = ""
1013106-160 = "Есть вещи, которые я хочу оставить только между нами, Сенсей."
