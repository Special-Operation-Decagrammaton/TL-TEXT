1013805-76 = ""
1013805-80 = "...Я поскользнулся и упал на банановой кожуре, которую кто-то оставил на тротуаре!"
1013805-81 = ""
1013805-82 = "Что происходит...? Почему со мной одно за другим случается плохое?"
1013805-83 = ""
1013805-85 = ""
1013805-86 = ""
1013805-87 = "Сенсей. Дайте мне омамори, который я вам подарила. Тут что-то не так."
1013805-88 = ""
1013805-90 = ""
1013805-91 = ""
1013805-92 = "А-Ах...!!!"
