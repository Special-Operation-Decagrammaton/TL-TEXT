1013805-4 = ""
1013805-5 = "А, Сенсей."
1013805-6 = "Вы правда пришли."
1013805-7 = "Ну... Вы нормально спите? Не бывает внезапной дрожи или... ночных кошмаров?"
1013805-8 = "Ну... Вы нормально спите? Не бывает внезапной дрожи или... ночных кошмаров?"
1013805-9 = "[s] «Ничего такого. А что?»"
1013805-10 = "Ничего... Просто стало интересно."
1013805-11 = "Мои соседки постоянно трещат о «последствиях» встречи с призраком, признаках одержимости и тому подобном."
1013805-12 = "Вот."
1013805-13 = "Вот."
1013805-14 = ""
1013805-16 = ""
1013805-17 = ""
1013805-19 = "Это омамори, который я сделала. Ну, защитный амулет."
1013805-20 = "Я сначала хотела просто купить, но старшекурсницы настояли, чтобы я сделала сама."
1013805-21 = "Не знаю, защитит ли он хоть от чего-нибудь, раз делала я и я, РАЗУМЕЕТСЯ, не верю в оккультизм, но хуже не будет, правда?"
1013805-22 = "Возьмите."
1013805-23 = "[s] «О, как всё аккуратно сделано. Ты сама вышивала?»"
1013805-24 = "Конечно. Это было легко."
1013805-25 = "[s] «Мне очень нравится! Буду хранить его вечно!»"
1013805-26 = ""
1013805-28 = ""
1013805-29 = "[ns] «Мне неловко просто забирать такой подарок. Может, хочешь... угощение?»"
1013805-30 = "Вы угощаете? Ха..."
1013805-31 = "Да! Вообще-то есть одна сладость, которую я давно хотела попробовать."
1013805-32 = "[s] «Типа... крепа с шоколадом и бананом?»"
1013805-33 = "...О-Откуда вы узнали?"
1013805-34 = "Не то чтобы мне постоянно его хочется, понятно?"
1013805-35 = "П-Просто сегодня случайно захотелось!"
1013805-36 = "[s1] «Хорошо. Пойдём.»\n[s2] «Я бы тоже такой съел.»"
1013805-39 = "Правда, Сенсей? Вы тоже любите крепы с шоколадом и бананом?"
1013805-40 = "[s] «Да! Как и ты!»"
1013805-41 = ""
1013805-43 = ""
1013805-44 = ""
1013805-45 = "У-Ух... Я-я так и знала. Вы меня дразните..."
1013805-46 = "Ладно, неважно. Пойдём."
1013805-47 = ""
1013805-49 = ""
1013805-50 = ""
1013805-51 = "И как раз когда я собирался войти в магазин..."
1013805-52 = ""
1013805-54 = ""
1013805-55 = ""
1013805-56 = ""
1013805-57 = "...Я на что-то наступил. Поднял ногу и увидел огромный кусок жвачки."
1013805-58 = "Фу... Здоровенная."
1013805-60 = "Я быстро соскрёб липкую гадость."
1013805-61 = "[ns] «П-Пойдём внутрь.»"
1013805-65 = "Ч-что это было?!"
1013805-66 = "[ns5] «(Стеклянная дверь разбилась...)»\n[ns6] «(Но я почти не толкнул её...?)»"
1013805-69 = "Сенсей... Здесь написано «ТЯНИ»."
1013805-70 = "Простите, но замену придётся оплатить вам."
1013805-71 = "[s] «Я-я очень извиняюсь!»"
1013805-73 = "Оплатив ущерб, мы попытались купить крепы с шоколадом и бананом."
1013805-74 = "...Но прямо перед нашим приходом их раскупили."
