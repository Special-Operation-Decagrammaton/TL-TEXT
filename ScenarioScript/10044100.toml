[translation]
10044100-1 = "Эпизод 10;Девушка улыбается в незнакомом мире"
10044100-2 = ""
10044100-3 = "Тц! В-Вы, чёртовы мелкие...!!"
10044100-4 = "П-Президент... кажется, нам конец!"
10044100-5 = "М-Мы были всего в одном шаге от осуществления наших амбиций!!"
10044100-7 = "Ха-ха-ха... *медленно хлопает* Боже мой. Значит, вы довели дело до конца..."
10044100-8 = ""
10044100-10 = "Э-Это...?"
10044100-11 = ""
10044100-13 = ""
10044100-15 = ""
10044100-16 = "Вы хорошо поработали, Железнодорожная академия Хайлендер."
10044100-17 = "Даже несмотря на... неожиданные осложнения, скажем так?"
10044100-18 = "Хм. Клиент. Значит, вы уже здесь..."
10044100-19 = ""
10044100-20 = "[ns] «А...»"
10044100-22 = "Э-Это клиент?"
10044100-23 = "Ну, ладно, наверное, теперь можно просто передать груз."
10044100-24 = "Погодите-ка, нет. На этом парне прямо написано «злодей.» Мы точно уверены насчёт этого?"
10044100-25 = "Сначала доводим работу до конца."
10044100-27 = "Прошу прощения, что заставил вас ждать. Я всего лишь осматривал груз."
10044100-28 = "Поезд, мягко говоря, пережил лучшие времена... но груз на удивление цел."
10044100-29 = "Я определённо не ошибся, доверив его вам, Хайлендер."
10044100-30 = "Мы всегда выкладываемся на работе. Это само собой."
10044100-31 = "Ха-ха, разумеется."
10044100-32 = "А теперь, если вы любезно подпишете подтверждение доставки, на этом всё."
10044100-33 = "Вы займётесь своей работой, а я займусь грузом."
10044100-34 = "Давайте. Подписывайте. Ха-ха..."
10044100-36 = "Нам точно стоит это делать? Мы ТОЧНО хотим это сделать??"
10044100-37 = ""
10044100-40 = ""
10044100-41 = "Готово."
10044100-42 = "Миссия выполнена!"
10044100-44 = "Хи-хи. Хи-хи-хи... Ахахаха!!"
10044100-45 = "Прекрасно. Я так долго ждал этого момента..."
10044100-46 = "Эм... С-Сенсей..."
10044100-47 = "Опять это плохое предчувствие..."
10044100-48 = "А, Сенсей. Прошу прощения, я вас не заметил."
10044100-49 = "Похоже, я также в долгу перед Шале. Как же мне вас отблагодарить...?"
10044100-50 = "Э-Эм..."
10044100-51 = "[ns] «О, вот так встреча.»"
10044100-52 = ""
10044100-54 = ""
10044100-55 = "...А?"
10044100-57 = "С-Сенсей? Вы знаете этого человека?"
10044100-58 = "[s1] «Да, он известный филантроп.»\n[s2] «Он предоставляет много стипендий.»"
10044100-61 = ""
10044100-63 = ""
10044100-64 = "...Правда??"
10044100-66 = "Ха-ха, вы мне льстите. Я всего лишь... простой бизнесмен."
10044100-67 = "Но долгие годы труда привели меня сюда. К состоянию, способному помогать ученикам по ВСЕМУ KIVOTOS. Ха-ха!!"
10044100-68 = "П-Погодите! Тогда почему вы говорите как злодей?! Я запуталась!"
10044100-69 = "...Ха. За долгие годы многие задавали мне тот же вопрос..."
10044100-70 = "...и по сей день я понятия не имею почему."
10044100-71 = "Ч-Что...?!!"
10044100-72 = "Но это неважно. Я восхищаюсь вами троими."
10044100-73 = "Несмотря на все невзгоды, вы выложились полностью и доставили груз. Ха-ха."
10044100-74 = "Благодаря ВАШЕЙ преданности делу наши приготовления скоро будут завершены!"
10044100-75 = "А, мне как раз было интересно. Что вы вообще собираетесь делать со всеми этими ценностями?"
10044100-76 = "Ха-ха, смелое новое начинание, о котором я давно мечтал."
10044100-77 = "Знающие люди назвали бы это... «благотворительным аукционом.»"
10044100-78 = "Что?"
10044100-79 = "Мы выставим эти ценности на обозрение и продадим тому, кто предложит больше всех."
10044100-80 = "Такие ценности привлекают богачей, которые черпают чувство собственной значимости из драгоценного имущества."
10044100-81 = "Иными словами... тех, кому есть что отдать."
10044100-82 = "Каждая заработанная иена пойдёт прямо в фонды достойных благотворительных организаций, выбранных честным и равным способом."
10044100-83 = "Общество получит пользу. А я, как организатор всего этого... сокращу свой годовой налог до НУЛЯ!!"
10044100-84 = "Всё по плану... Ха-ха-ха!!"
10044100-86 = "Звучит отлично! Пожалуйста, сделайте что-нибудь со своей манерой речи!"
10044100-88 = "А вы, Национальная ассоциация перевозчиков... сокращённо Гоночная ассоциация Vroom Vroom."
10044100-89 = "Ого, он правда произнёс всё целиком."
10044100-90 = "Угх..."
10044100-91 = "Я доверял вам многое, но на этот раз вы устроили слишком много проблем."
10044100-92 = "Возможно, нам придётся пересмотреть наше маленькое... сотрудничество. Ха-ха."
10044100-93 = "Н-Но... эти проблемы вообще-то по вашей вине!"
10044100-94 = "Всё это должно было быть НАШЕЙ работой! Почему вы за нашей спиной отдали её Хайлендер?"
10044100-95 = "ПОЧЕМУ?! Всего за день до этого я заказал роскошные суши. А то, что вы мне ДОСТАВИЛИ, было непростительным месивом!"
10044100-96 = "Если бы я хотел кайсэндон, я бы его и заказал!"
10044100-98 = "Ого, это довольно плохо."
10044100-100 = "Тц... Э-Это..."
10044100-101 = "Кто в здравом уме доверит таким людям что-нибудь ценное?"
10044100-102 = "Н-Но мы быстрые! Невероятно быстрые!"
10044100-103 = "Я прекрасно это знаю."
10044100-104 = "И, возможно, со временем у меня найдётся работа, которая вам подойдёт."
10044100-105 = "П-Правда?"
10044100-106 = "ОДНАКО! Сначала вы возместите материальный И нематериальный ущерб, причинённый Хайлендер, Сенсею из Шале И-И-И МНЕ."
10044100-107 = "Т-То есть если мы всё это компенсируем, вы дадите нам ещё один шанс?"
10044100-108 = ""
10044100-110 = ""
10044100-111 = "...Поняла. Сделаем всё, что сможем."
10044100-112 = "А потом начнём с самого начала."
10044100-113 = "Мы... постараемся относиться к доставкам профессиональнее."
10044100-115 = "П-Президент..."
10044100-117 = "...Мы не отказываемся от мечты. Просто будем идти к ней медленно."
10044100-118 = "Пока вы все со мной, я верю, что мы справимся."
10044100-120 = "Ох, Президент..."
10044100-122 = "Н-Не надо сейчас разводить сантименты! Нам ещё убирать весь этот бардак!"
10044100-123 = "Ц...!"
10044100-124 = "Д-Да. В качестве компенсации дам вам купон на неделю бесплатных доставок."
10044100-125 = "Н-Нам это не нужно!"
10044100-126 = "Две! Дам две..."
10044100-128 = "...А, работа наконец закончилась."
10044100-129 = "Спать... Устала."
10044100-130 = ""
10044100-131 = "[ns] «Отличная работа, все.»"
10044100-132 = "И вы тоже, Сенсей."
10044100-133 = "Пахяхя! Ну и огромный комок хаоса это был! Но благодаря вам мне было весело, Сенсей!"
10044100-134 = "Можно позвонить вам в следующий раз, когда вы понадобитесь?"
10044100-136 = "Т-Ты хочешь ЕЩЁ РАЗ заставить их пройти через это? Тебе совсем не стыдно?"
10044100-137 = "[ns3] «Я примчусь в любое время.»\n[ns4] «Когда ученики зовут, я отвечаю.»"
10044100-140 = "...Эм..."
10044100-141 = ""
10044100-143 = ""
10044100-144 = "Т-Тогда..."
10044100-145 = "Если бы вам позвонила я... в-вы бы пришли ко мне?"
10044100-146 = "[s] «Конечно, Аоба.»"
10044100-147 = "..."
10044100-148 = "*вздох* Знаете, я никогда не встречала никого похожего на вас, Сенсей."
10044100-149 = "...Погодите, нет, не заставляйте меня снова чего-то ждать."
10044100-150 = "Эй, мне надо идти писать отчёт."
10044100-151 = "Бумажная работа? Скукота. Поможете, Сенсей?"
10044100-152 = "[s] «Пощадите меня...»"
10044100-153 = "Может, воспользуемся случаем и получим помощь в Шале. Что думаешь?"
10044100-154 = "Пахяхя! Звучит весело, да? Пошли, Хикари!"
10044100-155 = "Выдвигаемся."
10044100-157 = "З-Значит... на этом всё?"
10044100-158 = "Всё! Мы доставили груз вовремя, целым и невредимым."
10044100-159 = ""
10044100-160 = "Фух... ну и денёк."
10044100-161 = "...Не думала, что когда-нибудь это скажу, но спасибо за вашу работу, офицеры."
10044100-162 = "Вы... ответственнее, чем я думала."
10044100-163 = "Что? Скажи громче."
10044100-164 = "Ух! Ты меня слышала!"
10044100-165 = "В общем, наверное, не стоит всегда судить об офицерах по... первому впечатлению."
10044100-166 = "Это был комплимент или оскорбление?"
10044100-167 = "Э-Это был комплимент...! В каком-то смысле!"
10044100-168 = "Пахяхя, ну, раз ты так говоришь!"
10044100-169 = "И тебе комплимент в ответ, Аоба!"
10044100-170 = "Манёвр «Перегрузка коэффициента трения»! В следующий раз повторим!"
10044100-171 = "Я-я бы очень не хотела."
10044100-172 = "Кстати, мне пора возвращаться в общежитие. Офицеры, Сенсей, счастливого пути домой."
10044100-173 = ""
10044100-176 = ""
10044100-177 = "Ты о чём? Нам надо уйти отсюда вместе."
10044100-179 = "Э-Э?"
10044100-181 = "Командная штука. Ты тоже, Сенсей."
10044100-183 = "Я думала, мы уже выяснили, что работа закончена. Что ещё делать, кроме как идти домой?"
10044100-184 = "Работа закончена. Это не значит, что мы закончили."
10044100-185 = "О-о чём вы говорите...?"
10044100-188 = "[ns] «Может, все вместе поужинаем?»"
10044100-189 = "А мне... м-можно присоединиться?"
10044100-190 = "ВМЕ-СТЕ."
10044100-191 = "Пахяхя! Пойдём! Можно заказать всё, что захочу? Потому что я ОЧЕНЬ много ем."
10044100-192 = "Всё такая же бесстыжая. Сенсей уже оплатил автобус, помнишь? И метро ТОЖЕ."
10044100-193 = "Никогда не отказывайся от открытого кошелька Сенсея."
10044100-194 = "Я-я беру назад всё, что только что сказала об офицерах...!"
10044100-195 = "[ns] «Ах, какой чудесный закат...»"
10044100-198 = "Инцидент с неуправляемым поездом Хайлендер"
