[translation]
901010800360-6 = ""
901010800360-7 = "Итак, подведём итог тому, что выяснили..."
901010800360-8 = "Семья Карпаччо намеренно катала бочки и закупила огромное количество крабов, чтобы распространять пугающие слухи."
901010800360-9 = "Кроме того, на них давит предстоящее продление контракта на охрану."
901010800360-10 = "Похоже, семья Карпаччо действительно глубоко замешана в распространении слуха о крабах в бочке."
901010800360-11 = "Ага. Семья Карпаччо потратила немало сил, чтобы слух выглядел правдоподобно, даже несмотря на расходы."
901010800360-12 = "Они делали это ради преимущества для своей организации. Устрашающая репутация помогла бы убрать конкурентов на торгах за продление контракта."
901010800360-13 = "Да. Для их незаконного бизнеса жестокая и беспощадная репутация очень полезна."
901010800360-14 = "При контрактной работе в порту Канэсаки, где победителя определяет аукцион, чем меньше конкурентов, тем лучше."
901010800360-15 = "Как бы привлекательно ни выглядел контракт, ты ведь не захочешь злить людей, которые якобы мучают других крабами, верно?"
901010800360-16 = "А поскольку эти преступления на самом деле никогда не происходили, Валькирии и вмешиваться не пришлось."
901010800360-17 = "[s1] «В этом есть смысл...»\n[s2] «Но что, если они будут строить из себя невинных?»"
901010800360-20 = "Технически они не сделали ничего незаконного. Мы не можем давить на них, если всё, что они сделали, — потратили деньги и время."
901010800360-21 = "Даже если доказательства крепкие, их мотив мы всё равно лишь предполагаем."
901010800360-23 = "Об этом не беспокойтесь."
901010800360-24 = "Раз доказать мотив уликами нельзя, можно просто проверить его напрямую."
901010800360-25 = "[s] «Напрямую...?»"
