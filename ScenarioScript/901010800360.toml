[translation]
901010800360-6 = ""
901010800360-7 = "Então, resumindo todos os pontos levantados até aqui..."
901010800360-8 = "\"A Família Carpaccio rolava os tambores e comprava caranguejos aos montes de propósito para alimentar o boato do Caranguejo de Tambor de Óleo.\""
901010800360-9 = "\"A Família Carpaccio estava sob forte pressão financeira com a aproximação da renovação do contrato.\""
901010800360-10 = "Pelo visto, por trás da lenda urbana do 'Caranguejo de Tambor de Óleo', havia o dedo direto da Família Carpaccio."
901010800360-11 = "Sim. Eles gastaram recursos desnecessários para aumentar o impacto e a credibilidade do boato usando todos os artifícios."
901010800360-12 = "E a razão disso era defender os interesses comerciais da organização — garantindo vantagem absoluta na licitação de renovação."
901010800360-13 = "Sim. Uma fama de crueldade e violência afasta pessoas comuns, mas para um bando de delinquentes, pode servir de escudo intimidatório."
901010800360-14 = "Além disso, numa licitação pública com disputa de lances, quanto menos concorrentes se candidatarem, mais fácil e barato é vencer."
901010800360-15 = "Por mais lucrativo que o porto seja, nenhuma empresa comum de segurança gostaria de arrumar encrenca com um bando de monstros que joga pessoas para caranguejos, certo?"
901010800360-16 = "E como nada daquilo realmente aconteceu, a polícia da Valkyrie nem tinha como enquadrá-los penalmente."
901010800360-17 = "[s1] \"O raciocínio faz todo o sentido, mas...\"\n[s2] \"E se eles simplesmente negarem tudo de pés juntos?\""
901010800360-20 = "É verdade... Se eles baterem o pé e disserem que só estavam jogando dinheiro fora e rolando latas por capricho, não temos como rebater juridicamente."
901010800360-21 = "Temos as evidências circunstanciais, mas provar a intenção oculta é algo totalmente subjetivo..."
901010800360-23 = "Quanto a isso, não há motivo para preocupação, Sensei."
901010800360-24 = "A parte que os papéis não puderem provar... nós confirmaremos [ruby=・]d[/ruby][ruby=・]i[/ruby][ruby=・]r[/ruby][ruby=・]e[/ruby][ruby=・]t[/ruby][ruby=・]a[/ruby][ruby=・]m[/ruby][ruby=・]e[/ruby][ruby=・]n[/ruby][ruby=・]t[/ruby][ruby=・]e[/ruby] com os responsáveis."
901010800360-25 = "[s] \"Diretamente...?!\""
