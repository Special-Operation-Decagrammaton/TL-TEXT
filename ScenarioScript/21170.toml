[translation]
21170-1 = "Эпизод 17;Мы только разогреваемся"
21170-2 = "Главный коридор Милленниума"
21170-3 = "..."
21170-4 = "..."
21170-5 = "..."
21170-6 = ""
21170-7 = "..."
21170-8 = "Итак, давайте проясним..."
21170-9 = "Всё это устроил какой-то клуб, о котором я даже не слышала, — \"Департамент Разработки Игр\"."
21170-10 = "И эта кучка мелюзги вас всех нагнула. Так?"
21170-11 = "Мне нечем оправдаться."
21170-12 = "Именно я приняла поручение и провела подготовления."
21170-13 = "Моя неудача запятнала репутацию Клуба Горничных. Простите."
21170-14 = "Вся эта херня ваще не имеет значения."
21170-15 = "Что, простите?"
21170-16 = "Когда я приехала, мне позвонила Рио."
21170-17 = "Президент Семинара — то есть студсовета?"
21170-18 = "О ней самой."
21170-19 = "Она сказала, что поручение отозвано."
21170-20 = "...?!"
21170-21 = "Но почему?"
21170-22 = "Хм. Могу только предположить, что Рио или Химари хотели что-то проверить."
21170-23 = "Они испытывали нас?"
21170-24 = "Не-а."
21170-25 = "Наверняка хотели посмотреть, на что способна эта Алиса."
21170-26 = "Ну ладно."
21170-27 = "Это уже не имеет отношения к поручению, но, Акане..."
21170-28 = "...хочу, чтобы ты кое-что разузнала."
21170-29 = "Прости? И что именно?"
21170-30 = "О Департаменте Разработки игр."
21170-31 = "Хм? Зачем? Ох— ради мести?"
21170-32 = "Обычно меня не интересует такая грязная работёнка, но раз уж мы здесь, можно и разобраться."
21170-33 = "Как только закончим расследование, я собираюсь лично навестить этих придурков."
21170-34 = "Отличная идея. Наверняка они сейчас празднуют, как ловко обвели вокруг пальца Клуб Горничных."
21170-35 = "Хи-хи. Не могу дождаться, чтобы увидеть их лица, когда мы нанесём им визит."
21170-37 = ""
21170-38 = "Департамент Разработки Игр Милленниума"
21170-39 = "..."
21170-40 = "..."
21170-41 = "..."
21170-42 = "Я так не грустила со времён альфа-обновления Tales Saga Chronicle..."
21170-43 = ""
21170-45 = ""
21170-46 = "Э-Эй... Момои."
21170-47 = "Ха-ха. АХАХАХА! Всё кончено! Нам конец!"
21170-48 = ""
21170-49 = ""
21170-50 = "Мидори, ты в порядке?"
21170-51 = "Прости, Алис... Мне сейчас совсем не хочется разговаривать..."
21170-52 = ""
21170-53 = ""
21170-54 = "Эй, Юз—"
21170-55 = "Ярость. Разрушение. Опустошение. Отчаяние. Пустота. Весь мир неумолимо несётся к неизбежной гибели..."
21170-56 = ""
21170-57 = "В-Все! Я не понимаю, почему..."
21170-58 = "Неужели..."
21170-59 = ""
21170-60 = "...это из-за Г.БИБЛИИ?"
21170-62 = "..."
21170-63 = "..."
21170-65 = "Но... я не думаю, что Г.БИБЛИЯ солгала."
21170-67 = "Это же бред!"
21170-69 = ""
21170-70 = "А?"
21170-71 = "Лучше бы она соврала! Я бы даже не злилась!"
21170-72 = "А-а-ах! Нам конец! Клубу точно хана!"
21170-73 = "???"
21170-75 = "Департамент Разработки Игр Милленниума"
21170-76 = "(Два часа назад...)"
21170-77 = "Привет-привет, девчули Департамента Разработки Игр. У мисс Маки для вас кое-что особенное."
21170-79 = "О! Наконец-то готово!"
21170-80 = "Та-дам!"
21170-82 = "Г.БИБЛИЯ.exe: готово к запуску."
21170-83 = "Она правда здесь... Г.БИБЛИЯ!"
21170-84 = "Сорян за ожидание. После разблокировки Г.БИБЛИИ мы вернули Зеркало в Студсовет."
21170-85 = "А? Вы вернули Зеркало?"
21170-86 = "Химари и так всё знала. Сказала, что ничего страшного и больше оно нам не понадобится."
21170-87 = "А, да, когда я расшифровывала Г.БИБЛИЮ, нашла папку под названием \"Ключ\"."
21170-88 = "Кей? Но я думала, ты уже её разблокировала?"
21170-89 = "Кей?"
21170-90 = "Она сказала, что нашли её ПОСЛЕ разблокировки. Сис, как ты вообще вступительные сдала...?"
21170-93 = "Хмм. Вот это меня поставило в тупик. Файл вроде не повреждён, но он точно написан не на языке программирования нашей эпохи."
21170-94 = "Короче, Г.БИБЛИЮ я открыла, как вы и просили, а папку с ключом — нет. Есть идеи, что это?"
21170-95 = "К сожалению, мы тоже не знаем."
21170-96 = "Хм..."
21170-97 = "Интересно. Может, ключ — это...?"
21170-100 = "[56cd7b]Проверка личности: вы AL-1S?"
21170-103 = "Департамент Разработки Игр Милленниума"
21170-104 = "Эм. Ты ведь искала Алису, да?"
21170-105 = "Искала? Неважно, сейчас главное — Г.БИБЛИЯ."
21170-106 = "Загляните позже, когда будет свободное время! Вместе проанализируем папку с ключом."
21170-107 = "Хорошо! Я всё вам доставила, так что увидимся!"
21170-109 = "Хорошая работа, Маки!"
21170-110 = "В следующий раз встречу со мной придётся назначать через секретаря! Потому что с TSC 2 мы станем знаменитыми!"
21170-111 = "Хех. Не терпится её вскрыть."
21170-113 = "Алиса! Юзу! Мидори! Все сюда!"
21170-114 = "Пора взглянуть на Г.БИБЛИЮ."
21170-115 = "Никто не знает, что внутри. Один известный разработчик, который, как говорят, однажды прочитал Г.БИБЛИЮ, сказал:"
21170-116 = "\"Истинный секрет разработки игр — это чудо, которое все считали знакомым, но на самом деле никто по-настоящему не понимал его смысла\"."
21170-117 = "Я хочу узнать правду, чтобы мы смогли..."
21170-118 = "...создать лучшую игру на свете."
21170-119 = "Это наш единственный шанс остаться здесь вместе."
21170-120 = "Если мы провалимся, Юзу придётся вернуться в общежитие к людям, которые ей не нравятся, а Алисе..."
21170-121 = "Я даже думать об этом не хочу. Но хотя бы Сенсей сказал, что Шале поможет нам, если до этого дойдёт."
21170-122 = ""
21170-124 = "Шале? Мне нравится быть вместе с Сенсеем."
21170-125 = "Но ты хочешь сказать, что я больше не смогу быть с вами?"
21170-126 = "Ах!"
21170-127 = "Такого не будет! Мы точно сделаем лучшую игру на свете!"
21170-128 = "Алиса, скоро ты сама будешь спрашивать людей: \"Вы играли в TSC2? Это шедевр\"."
21170-129 = "И чтобы этого добиться..."
21170-130 = "Ладно, Алис. Запускай!"
21170-131 = "Поняла."
21170-132 = "Г.БИБЛИЯ..."
21170-133 = "...активирована!"
21170-135 = "Следующий эпизод;Г.БИБЛИЯ"
