21170-5 = "..."
21170-7 = "..."
21170-8 = "Entendi..."
21170-9 = "Clube de Desenvolvimento de Jogos, é? Nunca tinha ouvido falar desse clube..."
21170-10 = "Então vocês levaram uma surra deles, é isso?"
21170-11 = "...Peço perdão."
21170-12 = "Fui eu quem aceitou este pedido e preparou a operação."
21170-13 = "Acabei manchando o nome do Clube das Empregadas..."
21170-14 = "Que se dane isso aí."
21170-15 = "...Hã?"
21170-16 = "Além disso, a Rio entrou em contato comigo quando eu voltei pra cá."
21170-17 = "Do Seminar... A presidente do conselho estudantil de Millennium?"
21170-18 = "É."
21170-19 = "O pedido foi cancelado. Ela disse pra fingir que nunca aconteceu."
21170-20 = "!?"
21170-21 = "Mas por que motivo...?"
21170-22 = "E eu lá vou saber... Mas acho que tanto a Rio quanto a Himari só queriam testar uma coisa, não?"
21170-23 = "Testar... a nossa força?"
21170-24 = "O contrário."
21170-25 = "Daquela tal de Aris."
21170-26 = "Bem, os detalhes disso aí não são da minha conta."
21170-27 = "Isso não tem mais nada a ver com o pedido, mas..."
21170-28 = "Akane, dá uma investigada pra mim."
21170-29 = "Sim? Investigar o quê?"
21170-30 = "O Clube de Desenvolvimento de Jogos. E todo mundo envolvido com eles também."
21170-31 = "Por que isso de repente... É uma revanche?"
21170-32 = "Não gosto muito de chamar assim, mas... bem, digamos que fiquei um pouco interessada."
21170-33 = "Assim que você levantar todas as informações, a gente vai fazer uma visita pra eles."
21170-34 = "Sim, será um prazer. A essa altura, aquelas garotas devem estar comemorando por terem dado um susto no Clube das Empregadas."
21170-35 = "Hehe, mal posso esperar para ver a expressão delas na próxima vez que nos encontrarmos..."
21170-38 = "Millennium - Clube de Desenvolvimento de Jogos"
21170-39 = "..."
21170-40 = "..."
21170-41 = "..."
21170-42 = "Não ficava tão deprimida assim desde... que subimos o protótipo de \"Tales Saga Chronicle\"..."
21170-46 = "H-Hum, Momoi...?"
21170-47 = "Hehe, hehehehe, acabou tudo! É o fim!!!"
21170-50 = "M-Midori? Hum, você está bem?"
21170-51 = "Desculpa, Aris-chan... Agora eu não estou com cabeça pra falar de nada..."
21170-54 = "Hum, Yuzu—"
21170-55 = "Raiva, ruína, corrosão, desespero, exaustão... O mundo agora caminha para a destruição..."
21170-57 = "C-Com licença! Hum, eu não estou entendendo muito bem, mas..."
21170-58 = "Por acaso essa situação..."
21170-60 = "É por causa do G.Bible?"
21170-62 = "..."
21170-63 = "..."
21170-65 = "Hum, mas eu acho que o G.Bible não disse nenhuma mentira..."
21170-67 = "N Ã O   É   E S S E   O   P R O B L E M A ! !"
21170-70 = "!?"
21170-71 = "Antes tivesse sido mentira, teria sido bem melhor!"
21170-72 = "Buaaaá, acabou! O nosso clube já era, vai ser fechado! Snif, buaaaá!"
21170-73 = "???"
21170-75 = "Millennium - Clube de Desenvolvimento de Jogos"
21170-76 = "(2 horas antes...)"
21170-77 = "Oooi, baixinhas do Clube de Desenvolvimento de Jogos! A Maki-chan trouxe um presentinho pra vocês!"
21170-79 = "Finalmente!"
21170-80 = "Tcharam!"
21170-82 = "G.Bible.exe... Pronto para execução"
21170-83 = "Finalmente o G.Bible está nas nossas mãos...!"
21170-84 = "Desculpa a demora! Tivemos que devolver o \"Espelho\" pro Seminar, então fiquei meio enrolada com isso."
21170-85 = "O quê?! Vocês devolveram o \"Espelho\"?!"
21170-86 = "Na verdade, parece que a Himari-senpai já sabia de tudo desde o começo. Ela disse que tudo bem entregar aquilo, mas que é pra gente não se esforçar demais daqui pra frente. Ehehe."
21170-87 = "Ah, e tem mais. Quando eu abri o G.Bible, encontrei essa pasta chamada <Key>."
21170-88 = "O que é isso... Será que se lê \"Kei\"?"
21170-89 = "...Kei?"
21170-90 = "É \"Ki\", né! Mana, você passou mesmo na prova do ensino médio?!"
21170-93 = "Pra falar a verdade, eu não entendi absolutamente nada disso aqui. O arquivo não parece corrompido, mas... ele tem uma estrutura inacreditável que não dá pra decodificar com nenhuma linguagem de máquina que a gente conhece."
21170-94 = "O G.Bible eu consegui abrir direitinho, mas dando uma olhada por cima nessa pasta não deu pra entender nada. Vocês sabem alguma coisa sobre essa <Key>?"
21170-95 = "Não, a gente também não faz ideia..."
21170-96 = "..."
21170-97 = "Será que <Key> é..."
21170-100 = "[56cd7b]Você é AL-1S?"
21170-103 = "Millennium - Clube de Desenvolvimento de Jogos"
21170-104 = "Será que é aquilo daquela vez...?"
21170-105 = "Hmm, aconteceu alguma coisa? Bom, de qualquer forma, agora o foco é o G.Bible, né?"
21170-106 = "A gente vê essa <Key> depois. Quando eu tiver tempo, vou tentar analisar direitinho."
21170-107 = "Bom, entrega feita! Até mais!"
21170-109 = "Obrigada, Maki-chan!"
21170-110 = "Da próxima vez que quiser falar com a gente, agende com a nossa secretária! Afinal, nós vamos estourar com o sucesso de \"TSC2\"!"
21170-111 = "Ahaha, vou ficar esperando!"
21170-113 = "Pessoal, juntem-se aqui!"
21170-114 = "Então, agora sim... vamos ver o G.Bible."
21170-115 = "Como todo mundo sabe, quase ninguém faz ideia do que tem aqui dentro. Mas, segundo um desenvolvedor carismático que dizem ter sido o último a ver o G.Bible..."
21170-116 = "Dizem que é \"a técnica secreta do desenvolvimento de jogos. Um milagre que todos acham que conhecem, mas ninguém realmente conhece\"."
21170-117 = "Eu quero descobrir o que é isso."
21170-118 = "Sim... para fazermos o melhor jogo de todos."
21170-119 = "Exato. Se conseguirmos, vamos poder continuar juntas neste lugar."
21170-120 = "Se a gente falhar... a Yuzu vai ter que voltar pro dormitório e encarar gente que ela nem quer ver. E a Aris..."
21170-121 = "...Não quero nem pensar nessa hipótese. Mas se acontecer, tenho certeza de que o Sensei e a Schale vão ajudar."
21170-124 = "Schale...? Ficar com o Sensei deixaria a Aris muito feliz, mas..."
21170-125 = "A Aris não poderia mais ficar aqui... junto com todo mundo?"
21170-126 = "...!"
21170-127 = "De jeito nenhum! Porque nós vamos fazer o melhor jogo de todos, custe o que custar!"
21170-128 = "Vai ficar tudo bem. \"TSC2\" também vai ser um \"jogaço\" pra você, Aris."
21170-129 = "Bom, então..."
21170-130 = "Vamos começar, Aris!"
21170-131 = "Sim."
21170-132 = "G.Bible..."
21170-133 = "Iniciar!"
21170-135 = "Próximo;G.Bible"
