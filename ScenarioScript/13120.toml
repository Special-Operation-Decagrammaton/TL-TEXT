[translation]
13120-1 = "Эпизод 12;Начало Комитета по выплате долга"
13120-4 = "Велопарковка старшей школы Абидоса"
13120-7 = "Хех. Кажется, я немного переборщила..."
13120-8 = "Как тебя зовут, мелкая воришка?"
13120-9 = ""
13120-12 = "...Широко. Сунаоками Широко."
13120-14 = "Хм, хорошее имя. Итак, Широко, что ты делаешь так далеко от дома?"
13120-15 = "..."
13120-16 = "Пусть это место и лежит в руинах, но всё ещё считается филиалом Абидоса... точнее, старшей школой Абидоса."
13120-17 = "Я раньше не видела такую форму."
13120-18 = "Вот именно. И для зимней она слишком тонкая."
13120-21 = "Эй, из какой ты школы, Широко?"
13120-22 = "...Не знаю."
13120-23 = "...?"
13120-24 = "Я просто... очнулась здесь. Ничего не помню. Кроме своего имени."
13120-25 = "Ч-Что за историю ты мне рассказываешь? Амнезия теперь в моде у молодёжи? Старушка совсем отстала от жизни."
13120-26 = "(Старушка...?)"
13120-27 = "Т-То есть имя — единственное, что ты о себе знаешь? Ни академии? Ни номера телефона? Вообще ничего?"
13120-28 = ""
13120-31 = "*кивает*"
13120-33 = "Ч-Что нам делать, Хошино?"
13120-34 = "Хм... Вот морока."
13120-35 = ""
13120-38 = "Давай зайдём внутрь и продолжим разговор, Широко. Здесь не самое подходящее место для чаепития."
13120-39 = "А?! М-Мы берём её с собой?"
13120-40 = ""
13120-42 = ""
13120-45 = "Вот, холодно. Надень это."
13120-46 = "Шарф...?"
13120-47 = "Ничего особенного, но хоть немного согреет."
13120-48 = "..."
13120-49 = "Вот. Так лучше?"
13120-50 = "...Угу."
13120-51 = ""
13120-54 = "...Тепло..."
13120-56 = ""
13120-57 = "Хех-хех. Тебе идёт, Широко. Эта старушка купила шарф на распродаже, но всё равно береги его."
13120-58 = "Да. Буду."
13120-59 = ""
13120-61 = ""
13120-62 = ""
13120-64 = "..."
13120-65 = "Почему ты так на меня смотришь, Нономи?"
13120-66 = "Ты всё время называешь себя «старушкой»..."
13120-67 = "Правда? Я...?"
13120-68 = "И ещё ты только что засмеялась «хех», я раньше от тебя такого не слышала."
13120-69 = "П-Правда? Тебе показалось. Это просто мой старушечий смех."
13120-70 = "Ты опять сказала «старушка»..."
13120-71 = "Ах!"
13120-72 = ""
13120-74 = ""
13120-76 = "А-Апчхи!"
13120-77 = ""
13120-79 = ""
13120-80 = "Н-Нам нужно внутрь! У Широко уже нос потёк!"
13120-81 = "А, точно! Быстрее, Широко, сюда!"
13120-82 = ""
13120-91 = ""
13120-92 = "Хех. Села идеально. Какая-то студент оставил эту форму, почти не носил. Практически новая."
13120-93 = "Эм."
13120-94 = "Надеюсь, пока тебя это устроит, Широко. Я куплю тебе новую одежду, как только смогу."
13120-95 = "Нет. Всё нормально."
13120-96 = "Просто... это форма Абидоса..."
13120-97 = "*качает головой*"
13120-99 = "Хех. Ей нравится."
13120-100 = "Я хотя бы могла купить ей новую форму. Эта старого образца... Хотя, если ей нравится..."
13120-106 = ""
13120-107 = ""
13120-108 = "Нужно прорываться силой."
13120-109 = "Опять к этому вернулись? Как нас пятеро прорвутся через сотни бойцов?"
13120-110 = "С правильной подготовкой сможем. Нужна информация о численности, линиях снабжения, маршрутах патрулей и расположении камер."
13120-111 = "Ни за что! Знаю, ты хорошо грабишь банки, но это совсем другое!"
13120-112 = "Да... Но если с нами Хошино..."
13120-113 = ""
13120-115 = ""
13120-116 = ""
13120-118 = ""
13120-119 = "...Хошино?"
13120-120 = "Хех. Простите. Просто вспомнила старые добрые времена."
13120-121 = "Подумать только, всего год назад Широко была милой маленькой девочкой с насморком. А теперь взрослая старшеклассница и выдаёт страшные фразы так буднично, будто читает новости."
13120-123 = "Ага-ага! Когда-то так и было! ♧"
13120-125 = "Э-Эм... Почему мы вдруг говорим о прошлом...?"
13120-126 = "Когда смотрю на Широко, иногда становится немного грустно. Куда делся тот милый ребёнок...?"
13120-127 = "У вас даже разница в возрасте небольшая! И это было всего год назад!"
13120-128 = ""
13120-130 = ""
13120-132 = "Ты всё ещё очень милая, Широко, так что всё нормально!"
13120-133 = "Хм..."
13120-135 = "Да, уже год прошёл с тех пор, как мы создали Комитет по выплате долга."
13120-136 = ""
13120-139 = ""
13120-140 = "..."
13120-141 = "...Угу."
13120-148 = ""
13120-149 = ""
13120-150 = ""
13120-151 = "А...? Широко?"
13120-152 = ""
13120-154 = ""
13120-155 = "Давай. Решим это боем."
13120-156 = ""
13120-158 = ""
13120-160 = "С-Широко?! Боем?!"
13120-162 = "Я не слушаю тех, кто слабее меня."
13120-163 = "Так что давай сразимся, Хошино."
13120-164 = "Хех. Это пылкий вызов юности...?"
13120-165 = "Хорошо, поняла. Принимаю."
13120-166 = ""
13120-169 = ""
13120-170 = "Что?! Хошино?!"
13120-172 = "Но чтобы ты знала: я ни разу в жизни не проигрывала один на один. Может, вообще сильнейшая во всём Кивотосе. Всё ещё хочешь драться, Широко?"
13120-173 = "Да. Я уже один раз с тобой дралась, так что теперь не проиграю."
13120-174 = "Хм... А если проиграешь? Тогда я могу делать с тобой всё что захочу?"
13120-175 = "Хорошо. Что хочешь."
13120-176 = "Хех. Назад слова не забирай, ладно? Если проиграешь, останешься в Абидосе навсегда. И признаешь эту старушку своей старшекурсницей."
13120-177 = "Я же сказала. Что угодно."
13120-179 = "Х-Хошино?!"
13120-180 = ""
13120-183 = ""
13120-184 = ""
13120-185 = ""
13120-189 = ""
13120-194 = ""
13120-195 = ""
13120-196 = ""
13120-199 = ""
13120-200 = "Прошу прощения! Что это всё такое, Широко?!"
13120-201 = "Похоже, вся эта куча — металлолом. Винты, болты, пустые гильзы... Откуда ты это взяла?"
13120-203 = "Мм. Украла."
13120-205 = ""
13120-206 = "Что?!"
13120-207 = "У-Украла?! Откуда?"
13120-209 = "У городского скупщика металлолома. Если продам ему обратно, заработаю деньги. И помогу выплачивать долг школы."
13120-210 = "Продать обратно туда, откуда украла?! Это... по-своему изобретательно?!"
13120-211 = "Звони им, Нономи! Прямо сейчас!"
13120-212 = ""
13120-215 = ""
13120-216 = "Да! Хорошо!"
13120-218 = "Широко!! Так нельзя делать!"
13120-219 = ""
13120-221 = ""
13120-222 = "А почему нет?"
13120-223 = "Почему...? Ну потому что..."
13120-224 = ""
13120-228 = "Так вот куда ты удрала! Ты украла мой грузовик!"
13120-229 = ""
13120-231 = ""
13120-233 = ""
13120-234 = "Ч-что?!"
13120-236 = "Грузовик?! Какой ещё грузовик? Широко?! Ты ещё и грузовик украла?"
13120-237 = "Да. Целиком. Убила двух зайцев одним выстрелом."
13120-238 = "Простите! Простите! Наша Широко просто ещё не понимает, что делает!"
13120-239 = "П-Простите... У меня есть кредитная карта, я оплачу любой ущерб!"
13120-240 = "Нет-нет. Сначала главное! Нужно нормально раскаяться, Нономи!"
13120-241 = "А?! Да-да!! Простите! Нам правда очень, очень жаль!"
13120-242 = "И ты тоже, Широко!"
13120-244 = "Хорошо... Простите."
13120-245 = "Думаете, я вот так это спущу? А?!"
13120-247 = ""
13120-248 = "Ладно, только в этот раз. Больше чтобы я вас не ловил!"
13120-250 = "Д-Да..."
13120-251 = "Слава богу, он нас отпустил."
13120-252 = "Правда, Широко?"
13120-253 = "Да. В следующий раз меня не поймают."
13120-254 = "Нет, вывод должен быть совсем не таким!"
13120-255 = ""
13120-258 = ""
13120-259 = "...Ладно, ничего."
13120-260 = "Я думал, все студенты Абидоса уже сбежали. Значит, кто-то всё-таки остался."
13120-262 = "..."
13120-263 = "Ну, заходите, если будет металлолом на продажу."
13120-264 = ""
13120-266 = ""
13120-269 = "Ещё увидимся, студенты Абидоса."
13120-270 = ""
13120-275 = "..."
13120-276 = ""
13120-279 = ""
13120-280 = ""
13120-281 = "...О?"
13120-285 = "Хошино! Широко! Идите сюда, смотрите! На сакуре появляются почки!"
13120-286 = ""
13120-289 = ""
13120-290 = "Хех. И правда, посмотрите-ка."
13120-291 = "...Зима наконец заканчивается."
13120-292 = "Да... а мы и не заметили..."
13120-293 = "Угу. Хотя когда-то казалось, что она никогда не закончится..."
13120-294 = ""
13120-296 = ""
13120-297 = "Что будешь делать, Нономи? Тебе ведь уже пора возвращаться? Ты должна поступать в другую школу..."
13120-298 = ""
13120-300 = ""
13120-301 = "..."
13120-302 = "Их вступительная церемония, наверное, скоро начнётся. Ты точно останешься здесь?"
13120-303 = ""
13120-306 = ""
13120-318 = "Широко, Нономи, улыбайтесь!"
13120-319 = "Мм. Сыр."
13120-320 = "Н-Нам правда обязательно это делать?"
13120-321 = "Конечно! Если есть что праздновать, нужно обязательно сохранить момент на фото!"
13120-322 = ""
13120-337 = "Но, Широко, тебе не жарко? Может, снимешь шарф?"
13120-338 = "Нет. Всё нормально."
13120-348 = "Ну вот. Теперь это официальная клубная комната Комитета по выплате долга Абидоса!"
13120-350 = ""
13120-351 = "Да!"
13120-352 = "Ага. Можете на меня рассчитывать. Я придумала восемь разных планов."
13120-353 = "П-Планов...? Каких именно...?"
13120-355 = "Отказ."
13120-356 = ""
13120-359 = ""
13120-360 = "Ага-ага! Теперь, пожалуйста, выслушайте мой план. ☆"
13120-361 = "Я использую эту золотую карту, чтобы—"
13120-363 = "Двойной отказ."
13120-364 = ""
13120-367 = ""
13120-368 = "А?!"
13120-370 = ""
13120-371 = "..."
13120-372 = "..."
13120-374 = "Ч-Что с вами?! Вы что, включили режим воспоминаний?"
13120-375 = "Аяне! Вытащи их из него как-нибудь!"
13120-376 = "Ха-ха... Немного обидно, что вы вспоминаете времена, когда нас ещё не было... но понимаю, это своего рода привилегия старших."
13120-378 = "Хех. Можно и так сказать. Хотя я помню и когда Аяне с Серикой впервые пришли."
13120-379 = "Ага-ага! Они были такими милыми!"
13120-380 = "Ага."
13120-384 = "П-Простите! Вы все студенты Абидоса?"
13120-385 = "Мы тоже хотим поступить в старшую школу Абидоса!"
13120-386 = "Да! Мы хотим помочь будущему Абидоса!"
13120-387 = "Точно! Как там называлось? Комитет возрождения?"
13120-388 = "Сэрика... Комитет по выплате долга."
13120-389 = "Ну вот это! Мы вступаем, хорошо? Так что рассчитываем на вас!"
13120-390 = "Да! Будем рады работать вместе!"
13120-392 = "Ч-Что вы делаете?! Не затягивайте нас в свой режим воспоминаний!"
13120-393 = "Ха-ха... Ну, это действительно было..."
13120-395 = "Да! Теперь начинается наш план айдол-группы Абидоса из пяти участниц! ♧"
13120-396 = "Оставьте старушку в стороне. Это работа для молодёжи."
13120-397 = ""
13120-399 = ""
13120-400 = "Тогда, может, дуэт из свежих первогодок?"
13120-401 = ""
13120-404 = ""
13120-406 = "Ага. Мне нравится."
13120-407 = "Хех. Вот это уже звучит интересно!"
13120-409 = "Вы что замышляете?! Хватит говорить о нас как о свежих овощах!"
13120-410 = "Согласна. Если делать — то всем вместе."
13120-411 = ""
13120-413 = ""
13120-415 = ""
13120-416 = ""
13120-417 = ""
13120-419 = ""
13120-421 = ""
13120-423 = "...Я совершенно не хочу, чтобы Комитет по выплате долга исчез."
13120-424 = ""
13120-427 = ""
13120-428 = "Нономи?"
13120-430 = "Думаю, реально у нас только один вариант... Нужно найти способ успешно попасть на общее собрание кредиторов."
13120-431 = "Тогда придётся отказаться либо от студсовета Абидоса, либо от Комитета по выплате долга. Знаю, это всего лишь название и в конечном счёте не так важно, но..."
13120-432 = "Мне всё равно... не нравится мысль, что Комитета по выплате долга больше не будет."
13120-433 = "Я нашла силы остаться в Абидосе благодаря Широко. И благодаря ей и всем остальным Хошино теперь может каждый день смеяться и улыбаться."
13120-434 = "Комитет по выплате долга... для меня это гораздо больше, чем просто название..."
13120-435 = "Нономи..."
13120-437 = "..."
13120-438 = "А ты что думаешь, Широко?"
13120-439 = "Я? Я..."
13120-440 = "Для меня... Комитет по выплате долга — это... эм..."
13120-441 = "...самое важное место в мире. Я знаю это, даже если ты не говоришь вслух. Комитет по выплате долга для тебя — всё, правда?"
13120-442 = "...Ну, эм..."
13120-444 = "Но если посмотреть с другой стороны, разве для тебя не то же самое, Хошино?"
13120-445 = "Э-Эм... Для меня?"
13120-446 = "Студсовет Абидоса... Он наверняка полон воспоминаний о тебе и председателе Юмэ... воспоминаний, которых мы даже не можем знать или понять..."
13120-447 = "Слишком тяжело... думать, что всё это исчезнет..."
13120-448 = "Н-Нет. Не переживай. Я не из тех, кто цепляется за подобные вещи."
13120-449 = "Это неправда. Ты так и не отказалась от связи со студсоветом Абидоса даже после создания Комитета по выплате долга."
13120-450 = "Ты всегда была частью Комитета по выплате долга... и одновременно студсовета Абидоса."
13120-451 = "Ты правда готова отпустить последнюю связь с председателем Юмэ, Хошино?"
13120-452 = "Я бы соврала, если бы сказала, что для меня всё это ничего не значит, но..."
13120-453 = "Разве ты не отказывалась стать председателем после Юмэ?"
13120-454 = ""
13120-456 = ""
13120-457 = "Ах, чёрт. Да. Казалось, если стану председателем, то тем самым признаю смерть Юмэ..."
13120-458 = "Так что... тут ты права."
13120-459 = "Но одно я могу сказать точно..."
13120-460 = "Не дать Железнодорожной пушке попасть в руки злодеев важнее, чем сохранить название."
13120-462 = "..."
13120-463 = "..."
13120-464 = ""
13120-468 = "Возможно, я никогда не узнаю, зачем Юмэ подписала тот договор и что вообще произошло, но..."
13120-470 = "Хошино, нельзя прожить жизнь, подозревая каждого встречного. Считать насилие и ложь нормой... принимать их как должное..."
13120-471 = "Если так делать, однажды мы проснёмся и поймём, что сами стали теми, кого ненавидим больше всего."
13120-472 = "Ты права. Может, твоими методами мы и спасём Абидос. Но это уже будет не наш Абидос."
13120-473 = "Я не вынесу мысли, что Абидос станет синонимом лжи и насилия."
13120-474 = "Мне от этого... грустно."
13120-477 = "Эта Железнодорожная пушка... прямо противоречит тому Абидосу, который пыталась построить Юмэ."
13120-478 = "Поэтому я должна найти пушку и уничтожить её."
13120-479 = "Ради этого я готова отказаться от названия."
13120-480 = ""
13120-482 = ""
13120-484 = "..."
13120-485 = "..."
13120-486 = "..."
13120-487 = "..."
13120-489 = "И если уж выбирать одно, думаю, Комитет по выплате долга лучше."
13120-490 = "Потому что студсовет Абидоса теперь — это только я. А Комитет Контрмер... это Широко, Нономи, Аяне и Серика. Так будет правильнее."
13120-491 = "Но... всё же..."
13120-492 = "Нужно сосредоточиться на текущей проблеме, Нономи."
13120-493 = "А проблема в том, что независимо от того, будем мы Комитетом по выплате долга или студсоветом Абидоса, нам всё равно нужно попасть на общее собрание кредиторов."
13120-494 = "Сейчас важнее не названия, а понять, как пройти через сотни бойцов и попасть внутрь."
13120-495 = "...Ты права."
13120-497 = "Да, поняла..."
13120-498 = "Все согласны?"
13120-500 = "Да! Решено."
13120-501 = ""
13120-503 = ""
13120-504 = "Завтра в полдень мы прорвёмся через силы фонда прямых инвестиций, охраняющие районный офис Центральной станции Абидоса, и заверим продолжение договора купли-продажи!"
13120-505 = "Но как именно мы это сделаем?"
13120-506 = "Вот это и будет следующим шагом..."
13120-507 = "Для начала без помощи Сенсея ничего не получится. И даже с Сенсеем, если честно, будет трудно."
