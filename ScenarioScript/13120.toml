[translation]
13120-1 = "Episódio 12;O Início do Comitê de Contramedidas"
13120-4 = "Colégio Abydos - Bicicletário"
13120-7 = "Nossa, será que peguei um pouco pesado...?"
13120-8 = "Qual é o seu nome?"
13120-12 = "...Shiroko. Sunaookami Shiroko."
13120-14 = "Olha só... Então você se chama Shiroko-chan.#nE o que você estava fazendo aqui, Shiroko-chan?"
13120-15 = "..."
13120-16 = "Aqui parece uma ruína, né... mas tecnicamente é o campus anexo de Abydos —#nquer dizer, o prédio principal de Abydos."
13120-17 = "Esse uniforme... É a primeira vez que vejo."
13120-18 = "Né? E você vai passar frio com uma roupa tão fina assim."
13120-21 = "Então, Shiroko-chan, de qual academia você é?"
13120-22 = "...Não sei."
13120-23 = "...?"
13120-24 = "Quando dei por mim, estava aqui.#nAlém do meu nome... não sei de nada..."
13120-25 = "I-Isso é... por acaso, amnésia?!#nÉ aquilo que anda na moda hoje em dia? O velhote aqui é meio por fora dessas coisas~"
13120-26 = "(Velhote...?)"
13120-27 = "Quer dizer que... você não lembra de nada além do seu nome, Shiroko-chan...?#nNem da academia onde estuda, nem do telefone, nem do e-mail...?"
13120-31 = "(Acena com a cabeça)"
13120-33 = "H-Hoshino-senpai, o que a gente faz?"
13120-34 = "Hmm~ Complicado, hein."
13120-38 = "Por enquanto... vamos entrar, Shiroko-chan."
13120-39 = "Quê?! E-Ela vai com a gente?"
13120-45 = "Toma, enrola isso aí~"
13120-46 = "Um cachecol...?"
13120-47 = "É. Melhor do que nada, né?"
13120-48 = "..."
13120-49 = "E aí? Melhorou um pouquinho, né?"
13120-50 = "...Sim."
13120-54 = "Quentinho."
13120-57 = "Uhe~. Ficou ótimo em você, Shiroko-chan.#nO velhote aqui comprou esse cachecol na promoção, então cuide bem dele, tá?"
13120-58 = "Nn, entendi."
13120-64 = "..."
13120-65 = "O que foi, Nonomi-chan?"
13120-66 = "Hoshino-senpai, você acabou de se chamar de 'velhote'...?"
13120-67 = "...Hã?"
13120-68 = "E esse 'uhe~'..."
13120-69 = "...Do que você tá falando? É o velhote de sempre."
13120-70 = "De novo..."
13120-71 = "Ah~..."
13120-76 = "Atchim."
13120-80 = "E-Enfim, vamos entrar logo.#nA Shiroko-chan já tá com o nariz escorrendo."
13120-81 = "A-Ah, sim!#nVamos, Shiroko-chan."
13120-92 = "Uhe~, serviu certinho.#nAinda bem que tinha sobrado um uniforme reserva."
13120-93 = "Nn."
13120-94 = "Por enquanto, vai ter que servir.#nDepois eu providencio roupas novas para você."
13120-95 = "Tudo bem."
13120-96 = "Mas esse é o uniforme antigo de Abydos..."
13120-97 = "(Balança a cabeça)"
13120-99 = "Você gostou dele?"
13120-100 = "Hmm, se a Shiroko-chan não se importa, por mim tudo bem, mas..."
13120-108 = "Não tem jeito, vamos ter que invadir à força."
13120-109 = "Não, não, aí já é loucura demais!"
13120-110 = "Se eu for fazer o reconhecimento#ne levantar o número de soldados, a posição, as rotas de suprimento e as câmeras de segurança..."
13120-111 = "A escala disso é totalmente diferente de um banco, né?!"
13120-112 = "...Se a Hoshino-senpai estiver com a gente, nós vencemos."
13120-119 = "...Senpai?"
13120-120 = "Uhe~, foi mal, foi mal.#nAcabei viajando aqui lembrando dos velhos tempos."
13120-121 = "A Shiroko-chan de nariz escorrendo era tão fofa~.#nMas sem nem perceber, começou a soltar umas frases assustadoras dessas."
13120-123 = "É verdade, teve essa época mesmo ☆"
13120-125 = "Isso dá vergonha, não fala disso..."
13120-126 = "Para onde será que foi a Shiroko-chan daquela época...?"
13120-127 = "Vocês nem se conheceram há tanto tempo assim, senpais!"
13120-132 = "Não se preocupe, Shiroko-chan, você continua fofa hoje em dia também."
13120-133 = "...Nn."
13120-135 = "Passou num piscar de olhos, mas#nfaz só um ano desde que o Comitê de Contramedidas foi criado, né?"
13120-140 = "..."
13120-141 = "...Sim."
13120-151 = "Ué, Shiroko-chan?"
13120-155 = "Hoshino, vamos duelar."
13120-160 = "D-Duelar?!"
13120-162 = "Eu só obedeço a quem for mais forte do que eu."
13120-163 = "Por isso, um duelo."
13120-164 = "...Quanta energia, hein."
13120-165 = "Bom, vou entrar na sua."
13120-170 = "Tem certeza disso, Hoshino-senpai?!"
13120-172 = "Como eu já disse antes, o velhote aqui nunca perdeu uma luta um contra um.#nMesmo assim, quer tentar de novo?"
13120-173 = "Nn, dessa vez eu não vou perder."
13120-174 = "Olha só, e se você perder?#nO que você vai fazer por mim, Shiroko-chan?"
13120-175 = "Vou fazer tudo o que você mandar."
13120-176 = "Então, se perder, vai se matricular em Abydos e chamar o velhote aqui de senpai, combinado?"
13120-177 = "Nn, combinado."
13120-179 = "H-Hoshino-senpai!"
13120-200 = "Shiroko-chan, o que é isso?!"
13120-201 = "Parafusos, porcas, até cápsulas de bala... De onde você tirou tudo isso?"
13120-203 = "Nn, roubei."
13120-206 = "Como é?!"
13120-207 = "R-Roubou de onde?!"
13120-209 = "Do ferro-velho da cidade.#nAgora vou vender de volta para eles e pagar a dívida da escola."
13120-210 = "Vender, roubar,"
13120-211 = "e vender de novo...?"
13120-216 = "...Quê?!"
13120-218 = "Shiroko-chan, não pode fazer isso."
13120-222 = "Por quê?"
13120-223 = "Como assim por quê? Bom..."
13120-228 = "Então era aqui que você tava!#nComo ousa roubar o meu caminhão?!"
13120-234 = "Quê?!"
13120-236 = "Shiroko-chan, você roubou até o caminhão?!"
13120-237 = "Nn, aproveitei o embalo."
13120-238 = "Desculpa mesmo.#nEssa garota ainda não entende muito bem como as coisas funcionam..."
13120-239 = "Eu pago o prejuízo...!"
13120-240 = "Nonomi-chan, vamos pedir desculpas primeiro!"
13120-241 = "S-Sim! Sinto muitíssimo..."
13120-242 = "Você também, Shiroko-chan!"
13120-244 = "...Nn, desculpa."
13120-245 = "Acha que só pedir desculpa resolve?!"
13120-248 = "...Tsc, mas só dessa vez, ouviu?"
13120-250 = "Sim..."
13120-251 = "Ainda bem que deu tudo certo,"
13120-252 = "Shiroko-chan."
13120-253 = "Nn, da próxima vez eu não deixo me pegarem."
13120-254 = "Shiroko-chan?!"
13120-259 = "Você tá mesmo arrependida?!"
13120-260 = "Bom, dessa vez eu deixo passar porque vocês são alunas de Abydos.#nMesmo assim, não achei que ainda tivesse gente por aqui."
13120-262 = "..."
13120-263 = "Se tiverem sucata sobrando, podem me chamar quando quiserem."
13120-269 = "Então, até mais."
13120-275 = "..."
13120-281 = "...Ué?"
13120-285 = "Olhem só, Hoshino-senpai, Shiroko-chan!#nOs botões de cerejeira estão desabrochando!"
13120-290 = "...É verdade."
13120-291 = "O inverno passou num piscar de olhos, né?"
13120-292 = "...É."
13120-293 = "E foram momentos tão divertidos..."
13120-297 = "...Então chegou a hora de nos despedirmos, Nonomi-chan."
13120-301 = "..."
13120-302 = "Você vai se matricular em Highlander, então deve ter um monte de preparativos para fazer, né?"
13120-318 = "Vamos, vamos, Shiroko-chan, Nonomi-chan! Sorriam~!"
13120-319 = "Nn."
13120-320 = "P-Precisa mesmo tirar foto...?"
13120-321 = "Que pergunta é essa? Claro que sim!#nQuando a gente comemora, tem que tirar foto de recordação!"
13120-337 = "Shiroko-chan, não tá com calor com esse cachecol?#nJá não tá na hora de tirar?"
13120-338 = "Não, tá tudo bem."
13120-348 = "A partir de hoje, esta é a sala do Comitê de Contramedidas contra o Fechamento de Abydos."
13120-351 = "Sim!"
13120-352 = "Deixa comigo, planos é o que não falta."
13120-353 = "Não me diga que..."
13120-355 = "Assalto a banco tá vetado."
13120-360 = "Eu também tenho uma ótima ideia!"
13120-361 = "Com este cartão gold—"
13120-363 = "Isso também não pode."
13120-368 = "...Imaginei."
13120-371 = "..."
13120-372 = "..."
13120-374 = "Por que vocês ficaram quietas de repente, senpais?!"
13120-375 = "Ayane-chan, fala alguma coisa também!"
13120-376 = "Ahaha... É que as senpais têm tantas lembranças juntas."
13120-378 = "Uhehe, desculpa.#nO dia em que a Ayane-chan e a Serika-chan chegaram#ntambém é uma lembrança preciosa para o velhote aqui."
13120-379 = "Sim, sim! Vocês duas eram super fofas."
13120-380 = "Nn."
13120-384 = "C-Com licença!#nVocês são mesmo alunas do Colégio Abydos?"
13120-385 = "Nós também queremos nos matricular aqui."
13120-386 = "Queremos fazer alguma coisa por Abydos...!"
13120-387 = "É o Comitê de Restauração, né?"
13120-388 = "É Comitê de Contramedidas, Serika-chan."
13120-389 = "Isso, isso!#nEnfim, contamos com vocês a partir de agora, senpais!"
13120-390 = "Muito prazer em trabalhar com vocês!"
13120-392 = "E-Esquece a nossa história...!"
13120-393 = "Ahaha... Bom, aconteceram tantas coisas, né?"
13120-395 = "Graças à Ayane-chan e à Serika-chan,#no plano das idols do Colégio Abydos não é mais só um sonho...!"
13120-396 = "Para o velhote aqui já não dá~.#nDeixo essas coisas para as mais novas."
13120-400 = "Então, que tal uma dupla com a Ayane-chan e a Serika-chan...?"
13120-406 = "Sim, acho uma boa ideia."
13120-407 = "Eu adoraria ver isso~."
13120-409 = "Por que vocês estão decidindo isso sozinhas?!"
13120-410 = "I-Isso mesmo!#nSe formos fazer, tem que ser todas juntas..."
13120-423 = "...Eu não quero que o \"Comitê de Contramedidas\" desapareça."
13120-428 = "Nonomi-senpai?"
13120-430 = "Mesmo que o nome desapareça, sei que isso não vai apagar as nossas lembranças, mas..."
13120-431 = "Mesmo assim, eu não quero isso."
13120-432 = "Graças à Shiroko-chan, eu tomei a decisão de ficar em Abydos."
13120-433 = "Graças à Shiroko-chan, a Hoshino-senpai voltou a sorrir."
13120-434 = "E agora, nos dissolvermos desse jeito..."
13120-435 = "...Nonomi-senpai."
13120-437 = "..."
13120-438 = "O que você acha, Shiroko-chan?"
13120-439 = "...Eu..."
13120-440 = "Para mim, o Comitê de Contramedidas é..."
13120-441 = "Nem precisa dizer, eu sei.#nPara você também, Shiroko-chan, aqui é onde tudo começou."
13120-442 = "...Nn."
13120-444 = "E para você também, Hoshino-senpai, não é?"
13120-445 = "Claro que é, mas...?"
13120-446 = "O \"Conselho Estudantil de Abydos\" guarda as lembranças da presidente e da Hoshino-senpai..."
13120-447 = "Não podemos deixar só a Hoshino-senpai carregar essa tristeza."
13120-448 = "...Uhehe, o velhote aqui tá bem."
13120-449 = "Hoshino-senpai, você ainda mantém o nome do Conselho Estudantil de Abydos até hoje."
13120-450 = "É para não perder o vínculo com a presidente, né?"
13120-451 = "Tem certeza de que quer desistir disso?"
13120-452 = "Se eu dissesse que não me importo, talvez fosse mentira, mas..."
13120-453 = "Você não quis virar presidente do conselho estudantil#nporque a antiga presidente ainda tem esse lugar, não é?"
13120-457 = "Você quer dizer que, se eu virar presidente,#nvai significar que eu aceitei a morte da Yume-senpai, né?"
13120-458 = "...Bom, não vou negar isso."
13120-459 = "Mas..."
13120-460 = "Para o velhote aqui, agora... descobrir o paradeiro do Canhão Ferroviário é muito mais importante."
13120-462 = "..."
13120-463 = "..."
13120-468 = "Eu não sei o motivo pelo qual a Yume-senpai tentou recuperar a ferrovia, mas..."
13120-470 = "Desconfiança, suspeita, violência, mentiras...#nSe começarmos a achar esse tipo de coisa normal,"
13120-471 = "um dia nós também vamos perder a nós mesmas."
13120-472 = "Mesmo que recuperemos Abydos desse jeito,#nnão vai ser a Abydos com a qual sonhamos."
13120-473 = "E se as pessoas acabarem voltando para Abydos...#ne encontrarem uma cidade assim..."
13120-474 = "...Eu ficaria triste."
13120-477 = "O Canhão Ferroviário não pode existir em Abydos."
13120-478 = "Eu vou encontrá-lo e destruí-lo custe o que custar."
13120-479 = "Por isso, tá tudo bem agora.#nNão precisamos mais nos apegar a um nome."
13120-484 = "..."
13120-485 = "..."
13120-486 = "..."
13120-487 = "..."
13120-489 = "Além disso, o Comitê de Contramedidas também é uma lembrança preciosa."
13120-490 = "Nonomi-chan, Shiroko-chan, Ayane-chan, Serika-chan...#nO velhote aqui se diverte muito passando o tempo com vocês agora."
13120-491 = "Mas..."
13120-492 = "Se o velhote aqui tá dizendo que tá tudo bem, então tá tudo bem."
13120-493 = "Aliás, antes de tudo, a gente precisa conseguir chegar ao local."
13120-494 = "Temos que pensar em como passar pela segurança."
13120-495 = "...Sim, senpai."
13120-497 = "Nn, entendi."
13120-498 = "Então o nosso rumo está decidido, né?"
13120-500 = "Sim, até o meio-dia de amanhã, vamos ao antigo prédio da Estação Central de Abydos e passaremos pela segurança."
13120-504 = "Depois disso, declararemos nossa intenção de manter o contrato."
13120-505 = "Mas como é que só nós cinco vamos..."
13120-506 = "Vamos pensar nisso agora."
13120-507 = "Só que já faz um tempo que não consigo falar com o Sensei de jeito nenhum."
13120-508 = "E olha que ontem o Sensei disse que viria..."
13120-509 = "Como está sempre ocupado, essas coisas acontecem, mas..."
13120-511 = "Hmm..."
13120-512 = "Será que se meteu em algum problema...?"
13120-521 = "Quê?!"
13120-525 = "O-O que aconteceu, Ayane-chan?"
13120-526 = "O-O que houve?!"
13120-527 = "...É uma notícia?"
13120-532 = "...Hoje de manhã, ocorreu uma explosão de causa desconhecida em Schale, no D.U."
13120-536 = "Quêê?!"
13120-537 = "!!"
13120-539 = "Parece que [USERNAME]-sensei ficou ferido e foi levado às pressas para o hospital.#nA causa da explosão ainda está sendo investigada..."
13120-541 = "Próximo;Refém"
