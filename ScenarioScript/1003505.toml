[translation]
1003505-1 = "Внезапное предложение"
1003505-2 = "Внутри старой библиотеки"
1003505-3 = "Я снова пришёл в старую библиотеку, чтобы встретиться с Уи."
1003505-4 = "Как обычно, внутри библиотека одновременно казалась старинной и по-своему живой."
1003505-5 = "Вот вы где, Сенсей. Я ждала."
1003505-6 = "Вот они."
1003505-7 = "Вот эта."
1003505-8 = "П-Пожалуйста, посмотрите, Сенсей. Внутри она совершенно пустая..."
1003505-9 = "...н-но именно поэтому мы вместе создадим что-то драгоценное!"
1003505-10 = "[s1] «Погоди... Что...?»\n[s2] «О чём ты вообще говоришь?!»"
1003505-11 = "Ах!"
1003505-12 = "Ах!"
1003505-13 = "П-Простите. Мне следовало объяснить раньше. Я говорю о к-книгах,#nкак обычно."
1003505-14 = "Это для чего-то вроде отношений д-друзей по переписке."
1003505-15 = "Мы будем по очереди писать друг другу... обо всём... например, о своих мыслях."
1003505-16 = "Э-Это слишком? Может, это плохая идея..."
1003505-17 = "Я... просто хочу узнать больше..."
1003505-18 = "...о вас, Сенсей!"
1003505-19 = "П-Поэтому я подумала, что мы можем стать... друзьями по переписке и обмениваться письмами!"
1003505-20 = "А?"
1003505-21 = "Я опять что-то испортила?"
1003505-22 = "О."
1003505-23 = "В-Вы правы. Такую большую книгу будет довольно неудобно всё время носить с собой."
1003505-24 = "В-Вообще-то не могу поверить, что я об этом не подумала. Это же очевидно."
1003505-25 = "Наверное, на меня что-то нашло, и я решила: чем больше книга,#nтем лучше. Тогда её хватит надолго и мы сможем снова и снова обмениваться сообщениями..."
1003505-26 = "По крайней мере, в моей голове это звучало логично."
1003505-27 = "Простите..."
1003505-28 = "[s] «...»"
1003505-29 = "Т-Тогда я возьму что-нибудь поменьше. Например, размером с блокнот..."
1003505-30 = "Что? Не нужно?"
1003505-31 = "Н-Но вы сказали, что эта книга слишком большая, чтобы носить её с собой."
1003505-32 = "Меньше всего я хочу быть для вас обузой."
1003505-33 = "А?"
1003505-34 = "Вы знаете способ использовать её, не таская туда-сюда?#nА как ещё у вас будет возможность писать свои записи?"
1003505-35 = "О, понимаю. Вместо переписки..."
1003505-36 = "...мы можем использовать её как гостевую книгу."
1003505-37 = "Кажется, я поняла."
1003505-38 = "Значит, вы будете писать новую запись... каждый раз, когда приходите ко мне?"
1003505-39 = "Нет-нет. Я не против, если вы не против, но... в-вы уверены?#nВы не обязаны использовать именно эту книгу, если не хотите."
1003505-40 = "[s3] «Но я бы предпочёл использовать именно её.»\n[s4] «Ты ведь выбрала её не просто так.»"
1003505-41 = "...!"
1003505-42 = "...!"
1003505-43 = "..."
1003505-44 = "Я... *шмыг* *хнык*"
1003505-45 = "[s5] «Уи?!»\n[s6] «Почему ты плачешь?!»"
1003505-46 = "Ох, простите, Сенсей. Я просто..."
1003505-47 = "Ох, простите, Сенсей. Я просто..."
1003505-48 = "Я так счастлива."
1003505-49 = "Никто раньше не понимал меня и не заботился обо мне вот так..."
1003505-50 = "Большое вам спасибо, Сенсей. Когда эта гостевая книга будет заполнена, я буду беречь её как сокровище."
1003505-51 = "Я-Я знаю, что не обязана, но... я хочу. Огромное спасибо."
1003505-52 = "*шмыг* *шмыг*"
1003505-54 = "Я утешал плачущую Уи, и мы обсуждали, что будем писать в гостевой книге."
1003505-55 = "Поскольку мы и так регулярно разговариваем в MomoTalk, решили использовать гостевую книгу как журнал отзывов о прочитанных книгах."
