[translation]
10008055-2 = "Уф. Не могу поверить, что Сенсей это одобряет."
10008055-3 = "Ты правда решил встать на сторону этих негодяек?!"
10008055-4 = "[s1] «Я не пытаюсь занять чью-то сторону.»\n[s2] «Это долгая история.»"
10008055-8 = "Я постарался как можно лучше объяснить Иори ситуацию."
10008055-11 = ""
10008055-12 = "Ты хочешь сказать, что вы, Решалы 68 и этот студент Абидоса охотитесь не за деньгами из ящика..."
10008055-13 = "...а пытаетесь вернуть его из добрых побуждений?"
10008055-14 = "Ты серьёзно ждёшь, что я в это поверю?"
10008055-15 = "[s] «Пожалуйста, поверь мне!»"
10008055-16 = "Бесполезно что-то объяснять дисциплинарному комитету. Они слишком упёртые, чтобы слушать."
10008055-17 = "Ч-Что вы только что сказали?!"
10008055-18 = ""
10008055-22 = ""
10008055-23 = ""
10008055-25 = ""
10008055-26 = "Как обстановка, Иори? Вы задержали нарушителей, охотящихся за ящиком?"
10008055-27 = "А-Ако! Нет, ещё нет... Ещё немного. Я немного отвлеклась."
10008055-28 = "Отвлеклась? Вам помешала банда Курокамэ?"
10008055-29 = "(Банда Курокамэ?)"
10008055-30 = "Не совсем. Это были Решалы 68 и Сенсей."
10008055-31 = "Это ты нам мешаешь. Мы вообще ничего не сделали!"
10008055-32 = "Ты сказала Решалы 68 и Сенсей?"
10008055-33 = "[s] «Привет, Ако.»"
10008055-34 = "О? С Новым годом... Что ты здесь делаешь, Сенсей?"
10008055-35 = "Подождите. Кто-нибудь объяснит, что происходит?"
10008055-37 = ""
10008055-38 = "Значит, Решалы 68 втянули Сенсея в свои дела и пытается вернуть ящик."
10008055-39 = "Даже не знаю, назвать это хитростью или коварством."
10008055-40 = "К-Коварством?"
10008055-41 = "У вас, похоже, слишком много свободного времени, раз в Новый год нечем заняться кроме издевательств над невинными прохожими."
10008055-42 = "Ну-ну. Ты определённо умеешь добавлять яда в слова,#nне так ли, Каёко?"
10008055-43 = "Прости. Моё терпение уже заканчивается."
10008055-44 = "Могу сказать то же самое..."
10008055-45 = "..."
10008055-46 = ""
10008055-48 = ""
10008055-49 = "О-о-о! Чувствуете, как искры летят?"
10008055-50 = "А-А?"
10008055-51 = "[s] «Так, эм...»"
10008055-53 = "*вздыхает*"
10008055-54 = "Что ж, хорошо."
10008055-55 = "Иори, тебе приказали задерживать нарушителей. Я не говорила вступать в конфликт с Шале."
10008055-56 = "Не понимаю, зачем ты решила тратить время на подобное."
10008055-57 = "Может, тебе так нравится работа дисциплинарного комитета, что ты не хочешь идти домой даже в Новый год?"
10008055-58 = "Ты издеваешься? Вот такая благодарность за работу в праздник?!"
10008055-59 = "Ты сама свалила всю эту работу на меня, а теперь это МОЯ вина?! А ты чем всё это время занималась?"
10008055-60 = "Очевидно, собирала информацию об этом происшествии."
10008055-61 = "Кража ящика Кайтенджерами — лишь одна часть головоломки."
10008055-62 = "Здесь происходит нечто более серьёзное."
10008055-63 = "[s] «К чему ты ведёшь?»"
10008055-64 = "Позволь объяснить. Само мероприятие Дайкичидэна — мошенническая схема, связанная с организацией под названием банда Курокамэ."
10008055-65 = "Что?!"
10008055-66 = "[s] «Кто такая эта банда Курокамэ?»"
10008055-67 = "Преступный синдикат. Дайкичидэн — их бизнес по отмыванию денег."
10008055-68 = "...?!"
10008055-69 = "Ящик для пожертвований использовался для отмывания незаконных средств банды Курокамэ."
10008055-70 = "Трюк на самом деле простой. Крупные суммы незаконно полученных денег переводятся через ящик для пожертвований. Так не остаётся бумажного следа, и деньги ускользают от внимания правоохранителей вроде полицейской школы «Валькирия»."
10008055-71 = "Они ещё и воспользовались праздником. На Новый год люди чаще всего делают денежные пожертвования, причём немаленькие."
10008055-72 = "Хотя у этого метода есть пределы. Если собрать слишком много денег, это всё равно привлечёт нежелательное внимание. Поэтому они придумали контрмеру."
10008055-73 = "[s] «Какую контрмеру?»"
10008055-74 = "Вирусный маркетинг через СМИ и интернет."
10008055-75 = "«Пожелаешь — получишь!» Какой дурацкий слоган."
10008055-76 = "Но стоит отдать им должное: он действительно прижился, особенно в соцсетях."
10008055-77 = "Такие вещи всегда умудряются заманить пустоголовых идиотов."
10008055-79 = "Аргх!"
10008055-80 = "И благодаря этому число людей, приходящих делать крупные пожертвования, выросло в разы."
10008055-81 = "Сколько денег они успели собрать к этому моменту — неизвестно."
10008055-82 = "Заодно это скрывает, какая часть суммы изначально была отмыта."
10008055-83 = "[s] «Как спрятать дерево в лесу.»"
10008055-84 = "Отлично, Каёко. Я знала, что ты догадаешься."
10008055-85 = "*вздыхает* Будто мне нужна твоя похвала."
10008055-86 = "Если подумать, даже название «Дайкичидэн» странное. Оно означает «история большого успеха». Не говоря уже о безвкусном слогане. Они с самого начала играли на слухах. Это было частью стратегии вирусного маркетинга."
10008055-87 = ""
10008055-90 = ""
10008055-91 = "П-Подожди! Значит, история про злых духов, которые переворачивают судьбу желаний, тоже была ложью?"
10008055-92 = "Злых духов? Ты о чём?"
10008055-93 = "Я-Я и говорю, конечно. С самого начала это было мошенничество. Я так и знала!"
10008055-94 = "Но управляющий сказал, что тот, кто вернёт ящик, сможет оставить деньги себе. А это тогда что?"
10008055-95 = "Скорее всего, уловка, чтобы полиция не вмешивалась."
10008055-96 = "Если превратить погоню в часть самого мероприятия, потенциальное уголовное дело превращается в рекламный трюк."
10008055-98 = "Ахахаха! Да вы издеваетесь!"
10008055-99 = "Они даже такое предусмотрели? Вот это действительно подстраховались со всех сторон!"
10008055-100 = "Тогда, возможно, деньги были не единственной целью банды Курокамэ..."
10008055-102 = "То есть я устроилась мико к чёртовому преступному синдикату?! Вы издеваетесь?!"
10008055-103 = "Кто вообще заставляет мико отмывать деньги?! Это же совсем неправильно."
10008055-104 = "До того как банда Курокамэ захватила место, это была обычная святыня, так что нанимать мико, вероятно, было стандартной практикой."
10008055-105 = "[s3] «Но я всё равно рад, что увидел тебя в наряде мико!»\n[s4] «Я горжусь, что ты такая увлечённая мико!»"
10008055-106 = "П-Перестань уже! Не то чтобы мне настолько важна эта работа!"
10008055-107 = "П-Перестань уже! Не то чтобы мне настолько важна эта работа!"
10008055-108 = "Мне всё равно, лишь бы в конце дня заплатили."
10008055-109 = "Хотя комплимент, пожалуй, приму..."
10008055-110 = "[s5] «Значит, Кайтенджеры всё это время знали?»\n[s6] «Получается, Кайтенджеры с самого начала были правы? Кто бы мог подумать.»"
10008055-111 = "Можно посмотреть и так, но всё зависит от того, как определять справедливость."
10008055-112 = "Можно посмотреть и так, но всё зависит от того, как определять справедливость."
10008055-113 = "Возможно, они хотели украсть у богатых и отдать бедным."
10008055-114 = "Кайтенджеры — загадка внутри загадки. Пытаться понять их мотивы бессмысленно."
10008055-115 = "Важно только разобраться с хаосом вокруг академии Геенна."
10008055-116 = "[s] «Вот тут и появляется дисциплинарный комитет.»"
10008055-117 = "Именно. Президент сейчас отсутствует, поэтому разбираться с любыми нарушителями — наша обязанность: будь то Кайтенджеры, банда Курокамэ или другие... негодяи."
10008055-118 = "Мы и так потратили на них достаточно времени, Иори. Сосредоточься на остальных нарушителях. А ты, Сенсей..."
10008055-119 = "Ты вообще ничему не учишься? Вот снова самоотверженно влезаешь в очередное происшествие. Ты слишком добрый для собственного же блага."
10008055-120 = "Что ж. До следующей встречи."
10008055-121 = ""
10008055-123 = ""
10008055-126 = "*вздыхает* Кто бы говорил. Ако вечно всех гоняет."
10008055-127 = "Эй, «Решатель проблем». Слышали?"
10008055-128 = "Мы за вами следим. Не создавайте проблем, если не хотите стать следующими!"
10008055-129 = ""
10008055-131 = ""
10008055-132 = "Пошли, все — мы уходим. С Новым годом, Сенсей."
10008055-134 = ""
10008055-135 = "Да!"
10008055-136 = ""
10008055-138 = ""
10008055-140 = "Дисциплинарный комитет исчез так же внезапно, как появился."
