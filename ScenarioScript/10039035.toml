[translation]
10039035-2 = "Прекрасно исполнено, сестра!"
10039035-3 = "Даже не знаю, как вас благодарить...!"
10039035-4 = "Хех, я просто рада, что получилось."
10039035-5 = "Ты идеально справилась. Мы сами отвлеклись почти так же сильно, как они."
10039035-6 = "[s1] «Ты двигалась совсем как Кирино.»\n[s2] «Может, у тебя талант учиться, просто наблюдая.»"
10039035-9 = "П-Правда...? Я просто как-то увлеклась... Хаха..."
10039035-10 = "О, кстати, точно. Сестра, Сенсей, вы ведь говорили о том, чтобы стать поп-идолами?"
10039035-11 = "Не то чтобы одного урока танца хватило, чтобы отблагодарить вас, но..."
10039035-12 = "А-А? Нет, пожалуйста, не чувствуйте себя обязанными..."
10039035-13 = "Не переживайте. Мы с радостью поможем. Хотя есть один нюанс..."
10039035-14 = "Какой нюанс, спрашиваете?"
10039035-15 = "Ну, танец лучше учить у профессионального преподавателя, а не у таких новичков, как мы."
10039035-16 = "...И студия для тренировок тоже помогает."
10039035-17 = "Почему бы вам не присоединиться к нашему следующему занятию? Мы всё для вас устроим."
10039035-19 = "Фубуки, я слышу мотивацию?"
10039035-20 = "...Ну, если у преподавателя будет больше студентов, она будет меньше следить за мной."
10039035-21 = "[s3] «(Очень в духе Фубуки, но ладно.)»\n[s4] «Тебе это отлично подойдёт, Мари.»"
10039035-24 = "Ох, спасибо всем..."
10039035-25 = "Фубукиии! Киринооо!"
10039035-27 = ""
10039035-28 = "...Ух."
10039035-29 = ""
10039035-31 = ""
10039035-32 = "Большое спасибо вам обеим. Лучшие клиенты на свете!"
10039035-33 = "Не могу дождаться вашего выступления! Возьму выходной, чтобы посмотреть. Может, даже уговорю управляющего закрыть магазин на этот день!"
10039035-34 = "Э-Эм..."
10039035-35 = ""
10039035-36 = ""
10039035-39 = "[ns5] «Вы двое и правда очень популярны.»\n[ns6] «Ещё одна победа Бюро общественной безопасности.»"
10039035-43 = ""
10039035-44 = "...Понятно."
10039035-45 = "Вот каково это — быть поп-идолом..."
10039035-46 = "Хи-хи..."
10039035-47 = "...Наверное, это чудесно."
