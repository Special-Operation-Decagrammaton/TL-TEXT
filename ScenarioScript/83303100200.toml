83303100200-5 = ""
83303100200-6 = ""
83303100200-7 = "...Фух. На сегодня достаточно."
83303100200-8 = "Даже если очень стараться... спешка хорошей репетиции не способствует."
83303100200-9 = "Нужно успокоиться..."
83303100200-10 = ""
83303100200-14 = ""
83303100200-16 = "[ns] «...Поэтому я и решил предупредить. Я не могу просто стоять в стороне, когда здесь явно нечестная игра»."
83303100200-17 = "Понятно... А я-то думала, почему они так притихли."
83303100200-18 = "Председатель Общества Пандемониума всегда что-нибудь вытворяет, стоит мне отвернуться."
83303100200-19 = "Я уже привыкла этого ожидать."
83303100200-20 = "[ns] «Они правда так часто делают что-то подобное?»"
83303100200-21 = "Спасибо, что предупредили меня, Сенсей."
83303100200-22 = "Дальше Префектурная команда разберётся сама."
83303100200-23 = "[ns] «Хорошо, Хина. И... удачи с репетицией на пианино»."
83303100200-25 = "Спасибо."
