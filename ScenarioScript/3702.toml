[translation]
3702-1 = "Suspicious Liminal Space (1)"
3702-3 = "On a certain peaceful afternoon—"
3702-7 = "Everyone, I have something important to discuss."
3702-12 = "Hehe. It looks like today is going to be an interesting day."
3702-13 = "Are you familiar with the term \"liminal space\"?"
3702-14 = "What's that?"
3702-15 = "A place where the boundary between private and public space has blurred..."
3702-16 = "It looks like reality, yet it isn't... an unknown space."
3702-17 = "The story about wandering into a supermarket in another world is pretty famous."
3702-18 = "Wandering through an empty supermarket, finally meeting a clerk...#nBut it wasn't a clerk—"
3702-19 = "It was a monster... that's how the story goes."
3702-20 = "...I've heard that one too."
3702-21 = "But that's just a rumor, right?"
3702-22 = "Nyu-fufu... I wonder about that?"
3702-23 = "According to my information, it actually exists."
3702-24 = "And it's right here in Wild Hunt!"
3702-27 = "Heh... I've heard that story too."
3702-28 = "I'd like to go there once."
3702-29 = "Are you serious!?"
3702-30 = "Masterpieces are born from diverse experiences."
3702-31 = "Unseen experiences will help elevate our art."
3702-32 = "Endless challenges are—"
3702-36 = "—'Innovation'."
3702-37 = "...And that is why."
3702-38 = "You're just saying random things again! I won't be fooled this time!!"
3702-39 = "Hehe. But doesn't it sound fun?#nIf we're all together, I'm sure it won't be scary."
3702-40 = "Horror movies aren't scary if you watch them with friends... right?"
3702-41 = "If we all go together, it'll be fine!"
3702-45 = "...*Sigh*, fine, I'll go. But there's no way a place like that actually exists."
3702-46 = "Then it's settled."
3702-49 = "Let's go! On an occult research expedition!"
3702-51 = "A while later—"
3702-53 = "Suspicious Building - 1st Floor"
3702-56 = "Excuse me..."
3702-57 = "We're coming in, okay?"
3702-60 = "..."
3702-61 = "...The lights aren't even on, it really seems like there's no one here."
3702-65 = "This is the rumored liminal space..."
3702-66 = "There must be an entrance to another world somewhere!"
3702-67 = "No, isn't this just a normal building?#nExcept for the fact that you can't see outside the windows."
3702-70 = "...Hm?#nWait, you can't see outside...?"
3702-71 = "Everything is covered so you can't see the outside."
3702-72 = "Hehe, this is getting interesting."
3702-73 = "W-why would they do something like that?"
3702-74 = "There's only one thing I know for sure right now..."
3702-75 = "This place... must have some kind of 'special purpose'."
3702-76 = "A-a special purpose?"
3702-77 = "Oh! It must be the place that connects to another world!#nLet's start exploring right away!"
3702-88 = "We looked around the first floor of the building together."
3702-89 = "And then—"
3702-91 = "This place has a more interesting structure than I thought."
3702-92 = "You can't see the outside from within, and for some reason, all the stairs are blocked off."
3702-93 = "It is indeed a space where the 'boundaries' have thinned, cut off from the outside world."
3702-94 = "It's no wonder it's called a liminal space."
3702-95 = "But it looks like the elevator works just fine."
3702-100 = "Look, it's working perfectly!"
3702-101 = "Want to go up?"
3702-102 = "U-uuh..."
3702-103 = "Or... should we go home?"
3702-104 = "N-no. If we go home now, we'd be admitting that liminal spaces exist!"
3702-105 = "I'm going to prove that there's no such thing as the occult in this world!"
3702-106 = "Heh, then let's go..."
3702-108 = "There are 8 floors."
3702-109 = "Let's start with the 7th floor! 7 is a lucky number."
3702-110 = "Hehe. I thought you didn't believe in superstitions?"
3702-111 = "This much is normal! Let's go!"
3702-118 = "Suspicious Building - 4th Floor"
3702-121 = "Why did it stop on the 4th floor? You pressed 7, right?"
3702-128 = "It's not responding!?"
3702-131 = "We can't stay in the elevator forever, so let's just get off for now."
3702-132 = "Nyu-fufu... I'm excited to see what's here."
3702-133 = "4th floor... that feels ominous..."
3702-134 = "Don't worry, we'll protect you."
3702-140 = "Suspicious Building - 4th Floor Hallway"
3702-141 = "...It's a clean hallway."
3702-142 = "Where do these doors lead?"
3702-143 = "Hey, don't just open them! What if something comes out!?"
3702-144 = "Oh? Look at this. Something is posted here."
3702-145 = "Let's read it..."
3702-148 = "Do you know the saying, 'Curiosity killed the cat'?"
3702-150 = "You have stepped into a place you should not have entered."
3702-151 = "This is the flip side of reality. A space of boundaries, a labyrinth."
3702-152 = "To leave this place, you must investigate the anomalous phenomena."
3702-154 = "If you discover an anomaly, take the elevator one floor up."
3702-155 = "If there is no anomaly, go one floor down."
3702-156 = "If you truly wish to 'get out'—you must follow these rules."
3702-157 = "If you violate the rules, you will be led to the 8th floor."
3702-158 = "And you will wander the 8th floor forever... like a Mobius strip."
3702-159 = "Hehe, hehehehehe..."
3702-164 = "—That's what it says."
3702-167 = "..."
3702-168 = "W-what...?"
3702-169 = "Uuuu..."
3702-170 = "Who set up this prank!?"
