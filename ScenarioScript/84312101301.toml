[translation]
84312101301-5 = "Если подумать, мы так и не попрощались как следует."
84312101301-6 = "Попрощались? Мне как-то не хочется..."
84312101301-7 = "К тому же уверена, ты сможешь проникнуть в мою комнату, когда захочешь."
84312101301-8 = "Ого, это приглашение? Член Чаепития может такое позволить?"
84312101301-9 = "Конечно нет. Поэтому я и сказала «проникнуть». Если поймают — я ничего не знаю."
84312101301-10 = "Но я верю, что могучий президент C&C ни за что не попадётся."
84312101301-11 = "Ха... Ты меня доконаешь."
84312101301-12 = "Ты наглая, но мне это в тебе даже нравится."
84312101301-13 = "Спасибо за комплимент."
84312101301-14 = "Это не комплимент."
84312101301-15 = "В любом случае, да. Звони, если что-нибудь понадобится. Как ты и сказала, пробраться туда мне будет несложно."
84312101301-16 = "...Фуфу. Замечательно."
84312101301-17 = "Именно это я и хотела услышать."
