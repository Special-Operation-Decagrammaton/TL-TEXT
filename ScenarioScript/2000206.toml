[translation]
2000206-1 = "Сыр в ловушке"
2000206-2 = "Лаборатория Саи"
2000206-3 = "Хочешь увидеть настольную игру, о которой я говорила в прошлый раз? Хахаха! Сейчас принесу."
2000206-4 = ""
2000206-5 = ""
2000206-6 = "Та-да! Настольная игра моей собственной разработки! Я назвала её «Сыр в ловушке»!"
2000206-7 = "Правила простые. Кладёшь несколько кусочков сыра на пластиковую ловушку, а потом осторожно вытаскиваешь их, не попавшись. Звучит легко, да?"
2000206-8 = "Давай сыграем! Проигравшему — костяшками по голове!"
2000206-9 = "[s] «Договорились.»"
2000206-10 = ""
2000206-11 = "Хорошо! Сначала вот твой сыр."
2000206-12 = ""
2000206-13 = ""
2000206-14 = ""
2000206-15 = "Хм... Я никогда не замечала, насколько твои руки больше и теплее моих. Наверное, потому что ты здесь старше, да?"
2000206-16 = "Такие мягкие и тёплые, прямо как животик Незусукэ..."
2000206-17 = "[s] «Щекотно.»"
2000206-18 = "Ой, прости! Я на секунду отвлеклась."
2000206-19 = "Ну всё, начинаем игру!"
2000206-21 = "Давай ты первый?"
2000206-22 = "[s] Вытащить один кусочек сыра из ловушки."
2000206-24 = "Эй, неплохо! Теперь моя очередь."
2000206-25 = ""
2000206-26 = "Знаешь... этот сыр выглядит чертовски аппетитно..."
2000206-27 = ""
2000206-28 = "Победить, вытаскивая по одному? Может, незаметно взять сразу два..."
2000206-29 = "(хлоп!)"
2000206-30 = "Чёрт."
2000206-31 = "[s] «Я победил, Сая.»"
2000206-32 = "Угх... Я потеряла концентрацию. Сыр выглядел слишком вкусно..."
2000206-33 = "В следующем раунде я точно выиграю!"
2000206-35 = "Следующий раунд. Ход Саи."
2000206-36 = ""
2000206-37 = "Хм... Снова встретились, ловушка. Ты и весь твой вкусный сыр..."
2000206-38 = ""
2000206-39 = ""
2000206-40 = "(хлоп!)"
2000206-41 = "Нет..."
2000206-42 = "[s] «Похоже, ты снова проиграла, Сая.»"
2000206-43 = "Так нечестно! Кому вообще пришла в голову идея сделать сыр настолько аппетитным?!"
2000206-44 = "Ну да, мне, потому что игру делала я, но всё равно... Как прошлая я могла ожидать, что нынешняя я устоит перед этим сыром?! Он слишком соблазнительный!"
2000206-45 = "Чего смотришь? Намекаешь, что гений должен уметь сопротивляться искушению?"
2000206-46 = "Хахаха! Ну конечно. Смотри внимательно! Больше никаких поблажек. Ещё одна партия!"
2000206-48 = "Следующий раунд. Ход Саи."
2000206-49 = ""
2000206-50 = "Это не настоящий сыр... Это не настоящий сыр..."
2000206-51 = ""
2000206-52 = "Но он такой жёлтый... и такой гладкий. Выглядит вкусно..."
2000206-53 = "(хлоп!)"
2000206-54 = "Аргх!"
