[translation]
101040-1 = "Эпизод 4; Трещина в повседневности 2"
101040-2 = "Где-то в районе Ариуса"
101040-3 = ""
101040-5 = ""
101040-7 = "Сюда! Я нашла это здесь!"
101040-8 = ""
101040-10 = ""
101040-11 = "Сакурако, оно здесь."
101040-12 = "Какое облегчение. Всё именно так, как мы надеялись."
101040-13 = "Церемониальное облачение Совета Святой Юстины, оставленное здесь последней председательницей совета..."
101040-14 = "Последняя председательница совета, возможно, была деспотичным лидером, но именно она сыграла ключевую роль в организации безопасного исхода в их район и последующем возрождении Ариуса."
101040-15 = "Облачение должны были передать её преемнице, но вместо этого она спрятала его здесь, в районе Ариус."
101040-16 = "Почему из всех мест вы оставили его именно здесь, председательница совета?"
101040-17 = "Этот район пропитан трагедией, которую ему пришлось пережить. Было ли это решение проявлением вашей вины? Сожаления?"
101040-18 = "...Домыслы ни к чему меня не приведут."
101040-19 = ""
101040-24 = "Как представитель Сестринства, я приму последнюю волю Совета Святой Юстины по праву преемственности."
101040-25 = "Да... Я больше не могу бездействовать, пока достоинство Совета Святой Юстины попирают."
101040-26 = ""
101040-28 = ""
101040-32 = "С-Сакурако! Не могли бы вы, пожалуйста, взглянуть на это?"
101040-33 = "Конечно. Показывай."
101040-35 = "В-вот здесь."
101040-36 = "Это..."
101040-39 = "...Немедленно позовите учёных Сестринства."
101040-40 = "Е-Есть, госпожа!"
101040-41 = ""
101040-46 = ""
101040-47 = "..."
101040-48 = "Если в районе Ариус произошло что-то связанное с этим..."
101040-49 = "Проблема может быть куда серьёзнее, чем мы думали..."
101040-51 = "Зал слушаний Тринити"
101040-54 = ""
101040-55 = ""
101040-57 = ""
101040-58 = ""
101040-61 = "После трёх слушаний мы вынесли следующие решения в отношении Мисоно Мики из Чаепития."
101040-62 = "..."
101040-63 = "Во-первых, все привилегии Мисоно Мики как члена Чаепития официально аннулируются."
101040-64 = "Все льготы Чаепития — личная резиденция, отдельный бюджет и индивидуальные занятия с особыми преподавателями — более предоставляться не будут."
101040-65 = "Во-вторых, хотя мы приняли решение фракции Pater, возник вопрос о том, может ли Мисоно Мика и дальше представлять эту фракцию."
101040-66 = "Фракция Pater изберёт нового представителя согласно собственному уставу. Однако до избрания этого представителя полномочия Мики сохраняются."
101040-67 = "..."
101040-68 = "Наконец, содержание Мисоно Мики под стражей приостанавливается, и с этого момента ей разрешается вернуться к учёбе."
101040-69 = "Тем не менее напоминаем вам помнить о серьёзности своего положения и не выходить за рамки дозволенного."
101040-70 = "Это решение принято после рассмотрения мнений и опасений студентов и руководства Тринити, высказанных на протяжении слушаний."
101040-71 = ""
101040-74 = ""
101040-75 = "Есть ли у вас возражения, Мисоно Мика?"
101040-76 = "Нет, госпожа."
101040-77 = ""
101040-78 = "Хотите сказать что-нибудь напоследок?"
101040-79 = "..."
101040-80 = "...Спасибо, что дали мне второй шанс. Я подчинюсь вашему решению."
101040-81 = ""
101040-83 = "Хорошо. Слушание окончено."
101040-84 = ""
101040-90 = "Класс Клуба дополнительных занятий"
101040-91 = "У меня важное объявление."
101040-92 = "А? Азуса?"
101040-93 = "Важное объявление?"
101040-94 = "Ч-Что такое? Почему ты такая серьёзная...?"
101040-95 = ""
101040-97 = ""
101040-98 = "Слушайте внимательно. Недавно через торговца информацией я получила совершенно секретные засекреченные сведения. Никогда прежде у нас не было настолько важной миссии."
101040-99 = "С-Совершенно секретные...?"
101040-100 = "...Торговца информацией?"
101040-101 = "*глоток* З-засекреченные...?"
101040-102 = ""
101040-104 = ""
101040-105 = ""
101040-106 = "Да. Это легендарный предмет, который прежде существовал лишь в записях. Я подтвердила существование и местонахождение плюшевой игрушки Перородзиллы."
101040-107 = "..."
101040-108 = "Перо... родзиллы...?"
101040-109 = "Внимание! Перородзилла — это не кто иной..."
101040-110 = "ПЕРОРОДЗИЛЛА?!"
101040-111 = "Азуса, ты уверена? Ты не шутишь? В истории всего мерча нет игрушки легендарнее этой! Грузовое судно с основной партией затонуло, и она так и не поступила в обычную продажу!"
101040-112 = "Более того, подрядчик, изготовивший игрушку, обанкротился из-за этой трагедии и закрылся! Новых экземпляров больше не сделали, поэтому они стали легендарными артефактами!"
101040-113 = "Как будто слушаешь справочник по истории Перородзиллы."
101040-114 = "Да, Хифуми. Ты понимаешь."
101040-115 = "Весь товар на том корабле действительно был потерян, но в сообществе поползли слухи, что несколько прототипов исходного дизайна всё же сохранились."
101040-116 = "К сожалению, они попали в руки зла — тёмных коллекционеров. Но недавно, наконец, ровно одна плюшевая Перородзилла появилась на рынке."
101040-117 = "Я-я об этом не подумала. Но звучит вполне логично."
101040-118 = "Н-Но такой предмет — роскошь за гранью наших самых смелых мечтаний... Даже если мы вчетвером сложим все деньги... Нет, всё равно не хватит."
101040-119 = "А меня почему сюда приплели?!"
101040-120 = "Так, думай, Хифуми... Что можно... Единственный вариант — это... Угх, нам бы понадобился специалист..."
101040-121 = "Да о чём ты вообще думаешь? Какой ещё специалист?! ...Нет! Хифуми, нельзя!"
101040-122 = "Хифуми, должна признать, этот блеск в твоих глазах сейчас немного пугает."
101040-123 = "Вы не понимаете... Когда речь идёт о добыче легендарного мерча, мораль и здравый смысл не имеют значения."
101040-124 = "Без морали?! Хватит сходить с ума, Хифуми!"
101040-125 = ""
101040-127 = ""
101040-128 = "Я... Я просто хотела посмотреть на неё."
101040-129 = "Ч-Ч-Что?! Ну, э-э, я это и имела в виду! Очевидно же!"
101040-130 = "То есть обладать плюшевой игрушкой тоже крайне важно?"
101040-131 = "...Ладно, Хифуми. Если ты этого хочешь, так и сделаем."
101040-132 = "Что?!"
101040-133 = "Я не проходила официальной подготовки, поэтому не настолько умела, как специалисты, к которым ты хотела обратиться. Но если всё тщательно спланировать и предусмотреть любые исходы, миссия завершится успешно."
101040-134 = "Погоди, Азуса! У меня просто на секунду помутился рассудок. Оно того не стоит!"
101040-135 = "П-Понятно..."
101040-136 = "Обещаю! Я просто счастлива, что смогу увидеть легендарную плюшевую Перородзиллу своими глазами!"
101040-137 = "Тогда не будем терять ни минуты. Идём."
101040-138 = ""
101040-140 = ""
101040-144 = "Да! Вперёд!"
101040-145 = ""
101040-147 = ""
101040-151 = "..."
101040-152 = "Хи-хи. Как здорово. Снова можно прогулять дополнительные занятия!"
101040-153 = ""
101040-155 = ""
101040-157 = "Ч-Что... здесь вообще происходит?"
101040-158 = "Погодите! Только меня не бросайте!"
101040-159 = ""
101040-161 = ""
101040-166 = "Подозрительный магазин"
101040-167 = "Вот он."
101040-168 = "Подумать только, так близко к Тринити существуют такие места..."
101040-169 = "Я-я здесь не по своей воле! Ясно?!"
101040-170 = ""
101040-172 = ""
101040-173 = ""
101040-174 = "Здравствуйте, хозяин. Я слышала, предмет у вас."
101040-175 = ""
101040-177 = ""
101040-178 = ""
101040-179 = "Хи-хи. Вы пришли за легендарным предметом. Как мотыльки на пламя."
101040-180 = "Конечно, такое мы не показываем кому попало... но ради потенциальных покупателей возможно всё."
101040-182 = "*тук-тук*"
101040-183 = "*глоть*"
101040-184 = ""
101040-186 = ""
101040-188 = "...?!"
101040-189 = "Н-Но... Это..."
101040-190 = "Хи-хи. Да, знаю! Вы наверняка поражены! Вот она — единственная и неповторимая легендарная плюшевая Перородзилла, в одну тысячную размера настоящей!"
101040-191 = "Это... не Перородзилла."
101040-192 = "Она права. Это Перорозавр."
101040-193 = "Ч-что?!"
101040-194 = "Эм... Разве это не почти одно и то же?"
101040-195 = "Нет! Совсем, совершенно другое!"
101040-196 = "Слова дилетанта."
101040-197 = "Перородзилла чуть пухлее и с длинным языком."
101040-198 = ""
101040-200 = ""
101040-201 = "Очевидно же, это Перорозавр. Видно по форме лица и костюму."
101040-202 = "Это как сравнивать яблоки с апельсинами! Они совершенно разные!"
101040-204 = "Ч-Что вы такое говорите?! Вы знаете, сколько я за это заплатил?! То есть это не оригинал...?"
101040-206 = "Главные ворота Тринити №5"
101040-207 = "Я правда думала... что мы увидим Перородзиллу..."
101040-208 = "Всё хорошо, Азуса... По крайней мере, Перородзилла всегда будет жить в наших сердцах..."
101040-209 = "Ха-ха-ха. Всё будет хорошо, вы двое."
101040-210 = "Ч-Что там происходит?"
101040-213 = "Отменить решение!"
101040-214 = "Никакой пощады злодейке!"
101040-215 = "Повесить ведьму!"
101040-216 = ""
101040-219 = "Н-Не стреляйте в воздух... Нет, в соседку тоже стрелять нельзя..."
101040-220 = ""
101040-221 = ""
101040-223 = "Это ведь...?"
101040-224 = "Протест против решения по итогам слушаний..."
101040-225 = "Понятно. Они недовольны решением о судьбе Мисоно Мики."
101040-226 = "Прошло уже несколько дней! Несколько! Им больше заняться нечем?! Зачем они всё это делают?"
101040-227 = "Ну... у них есть право на свободу собраний..."
101040-228 = "Фракция Pater фактически осталась без лидера, и противоборствующие силы пытаются воспользоваться политической неразберихой."
101040-229 = ""
101040-231 = ""
101040-232 = "К тому же Чаепитие потеряло слишком много власти над школой, и жадные политики тянутся к освободившемуся влиянию."
101040-233 = ""
101040-235 = ""
101040-236 = "Ну и, конечно, некоторые просто бросают камни ради забавы — посмотреть, куда они попадут..."
101040-237 = "Ханако...?"
101040-238 = "Короче говоря, Тринити — гниющее змеиное логово. ♡"
101040-239 = "У-ух..."
101040-240 = "Жизнь Мисоно Мики отныне лёгкой не будет."
101040-242 = "О-Она выглядит страшновато... но плохим человеком вроде не казалась..."
101040-243 = ""
101040-245 = ""
101040-246 = "А ты что думаешь, Азуса?"
101040-247 = "Я? Я..."
101040-248 = "Я слышала, Мика помогла Сенсею спасти Ацуко."
101040-249 = "И не только Ацуко. Саори, Хиёри, Мисаки... Она спасла всех."
101040-250 = "Я не знаю, кто такая Мисоно Мика, но уже только за это не могу её ненавидеть."
101040-251 = ""
101040-252 = "И несправедливо, когда целая толпа издевается над одним человеком."
101040-253 = "П-пожалуйста, только не нападай на них, Азуса..."
101040-254 = "Как скажешь."
101040-255 = "Но сердце у тебя на правильном месте. Если бы эти люди только могли посмотреть на всё твоими глазами."
101040-256 = "Могут ли обрести спасение те, кто отказывается принять прощение и милосердие, Азуса?"
101040-257 = "У меня нет ответа."
101040-258 = "Но даже если результат не гарантирован..."
101040-259 = ""
101040-260 = "«Надо стараться изо всех сил!» Да?!"
101040-261 = "О? Кохару, ты буквально сняла слова у неё с языка."
101040-262 = "Ну да! Азуса всегда говорит всякие скучные вещи вроде этого!"
101040-263 = "Хи-хи. Как мило, Кохару. Ты всегда внимательно слушаешь своих друзей."
101040-264 = "Ч-Что?! Я вообще не это имела в виду!"
101040-265 = "Спасибо, Кохару. Я тоже внимательно слушаю, когда говоришь ты."
101040-266 = "Чтобы ещё больше укрепить нашу связь, нам стоит снова вместе принять ванну."
101040-267 = "Что ты такое говоришь...?!"
101040-268 = "У меня аж на душе теплеет. Я тоже хочу присоединиться!"
101040-269 = "Н-Нет! Ты всегда всё делаешь странным! Держись подальше, развратница!"
101040-270 = "О-Ой..."
101040-271 = ""
101040-273 = ""
101040-274 = ""
101040-276 = ""
101040-277 = "Нет решению слушаний!"
101040-278 = "Наказать предательницу!"
101040-279 = ""
101040-281 = ""
101040-284 = "Что здесь происходит?"
101040-285 = "Это ещё что?! Айри, ты точно правильно выбрала место?"
101040-286 = "Д-Должно быть правильно! Три часа, пятый задний вход Тринити... Да! Именно здесь должны продавать сто порций лимитированного шоколадного мороженого. Мы даже пришли пораньше, ведь продают в порядке живой очереди."
101040-287 = "Если только мороженым не торгуют сами протестующие, не думаю, что оно здесь."
101040-288 = "Эй, вы там. Сердитые дамы. Можно вопрос?"
101040-289 = "А?! Мы тут заняты!"
101040-290 = "Погодите! Вы сторонницы Мики?"
101040-292 = "Мики...?"
101040-293 = "Сторонницы...?"
101040-294 = "...Что?"
101040-295 = "Значит, не сторонницы... Тогда присоединяйтесь к нам! Разве вы не хотите увидеть, как Мисоно Мика ответит за свои поступки?"
101040-296 = "Наконец-то она получит по заслугам!"
101040-297 = "...Вы вообще понимаете, о чём они?"
101040-298 = "Не-а."
101040-299 = "Нет."
101040-300 = "О! Я поняла. Мисоно Мика из Чаепития!"
101040-301 = "О? А где вечеринка?"
101040-302 = "Сосредоточься, Айри. Мы пришли за лимитированным шоколадным мороженым, а не на чаепитие."
101040-303 = "Нет-нет! Не на чаепитие, а в Чаепитие!"
101040-304 = "О, кажется, я это знаю. Так называется студсовет нашей академии, да?"
101040-305 = "А? Серьёзно?!"
101040-306 = "А ты, Казуса? Ты о них знала?"
101040-307 = "...А должна была?"
101040-308 = "Ц-ц-ц. Ты даже информационную брошюру академии не открывала, да? Дамы и господа — мрачное будущее Тринити."
101040-309 = "Слишком громкие слова от той, кто решила, что Айри говорит о настоящей вечеринке! Ты же думала, это встреча Клуба сладостей, да?!"
101040-310 = "..."
101040-311 = "Тут она тебя поймала."
101040-312 = "Н-Ну, в любом случае...!"
101040-313 = "Я слышала, в Чаепитии есть прекрасная принцесса по имени Мика, но с ней случилось что-то ужасное...!"
101040-314 = "Так вот о чём были все эти протесты по кампусу!"
101040-315 = "Были протесты...?"
101040-316 = "Если честно, я их особо и не замечала."
101040-317 = "Так пристально следить за политикой и всей этой верхушкой совсем не романтично. Спорю, половина людей здесь даже не знает, из-за чего протестует."
101040-318 = "Именно поэтому надо кричать ещё громче, чтобы больше студентов услышали нашу позицию и присоединились!"
101040-319 = "Вот именно! Я даже ни разу не встречала Мисоно Мику, но протестовать против неё весело! Ха-ха-ха!"
101040-320 = ""
101040-322 = ""
101040-323 = ""
101040-324 = ""
101040-325 = "...Важнее другое: вы не видели фургончик с мороженым? Там должны были продавать лимитированное шоколадное мороженое."
101040-327 = "А, мы их выгнали, потому что они мешали протесту."
101040-328 = "Выгнали?!"
101040-329 = "Вы случайно не знаете, куда они уехали?"
101040-330 = "А мне какое дело! Слушайте, если не собираетесь присоединяться, проваливайте! Эти разговоры только мешают протестовать!"
101040-331 = ""
101040-333 = ""
101040-334 = "А-Ай?!"
101040-335 = ""
101040-337 = ""
101040-338 = ""
101040-339 = "..."
101040-340 = "Ах! Спасибо, Казуса."
101040-341 = "Эй! Какого чёрта ты творишь?"
101040-342 = "...Ты сейчас правда толкнула Айри? Нашу Айри?"
101040-344 = "И что? Что ты мне сделаешь?"
101040-345 = "..."
101040-346 = "..."
101040-347 = "П-Погодите! Смотрите, со мной всё хорошо! Ни царапины! Казуса...! Нацу, Ёшими, пожалуйста...!"
101040-348 = "Казуса."
101040-349 = "Да."
101040-350 = "Когда у человека падает сахар в крови, это может вызывать агрессию, верно?"
101040-351 = "Может."
101040-352 = "Шоколад, в котором сосуществуют сладость и горечь, подобен метафоре жизни... Поэтому всё, что произойдёт дальше, будет во имя шоколада."
101040-353 = "Ты опять несёшь какую-то чушь. Но с тем, что «всё из-за шоколада», я согласна. Звучит разумно."
101040-354 = "Раз уж мы все согласны..."
101040-355 = ""
101040-357 = ""
101040-359 = ""
101040-360 = ""
