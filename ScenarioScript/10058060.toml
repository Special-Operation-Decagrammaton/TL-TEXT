[translation]
10058060-1 = "Episode 6;Run and You'll Get 3, Fight and You'll Get 1"
10058060-3 = "Uhm, err... I have so many things I want to ask..."
10058060-4 = "Where should I even start asking..."
10058060-7 = "Phew—!!"
10058060-8 = "It's super sweet and delicious! Is there sugar in this water?"
10058060-9 = "Th-Thank you... Thank you so much for the ride!"
10058060-10 = "Uhm, where should we start asking..."
10058060-11 = "It looks like they have some questions for us!"
10058060-12 = "Just in case something like this happened, our club president wrote down the questions and answers!"
10058060-13 = "We were asked all sorts of things leading up to the race day, after all..."
10058060-16 = "Uhm..."
10058060-17 = "\"Number one. Yes, it's a tank. Because it has a barrel and a hull, #nmanagement recognized it as a tank. Even I'm not entirely convinced.\""
10058060-18 = "\"Number two. We made it out of cardboard to film a joke video themed around the Gehenna Cup... but #nwe accidentally submitted a joke participation form and ended up in the main tournament.\""
10058060-19 = "Sorry, I'm so sorry... #nWe turned it in thinking we'd actually get to participate..."
10058060-20 = "Don't worry about it! I was the one who said if we're going to participate, we're going to fight instead of running away!"
10058060-21 = "Ah, is that so..."
10058060-22 = "It looks super tough, why did you switch..."
10058060-23 = "The answer to that is number seven. Ugh... I'm exhausted and sleepy..."
10058060-24 = "\"Number seven. We originally planned to take turns, but #nmanagement told us it would count as modifying the component configuration during the race, #nso we've been stuck like this ever since.\""
10058060-25 = "Ah~ So it's classified as a component, huh."
10058060-26 = "I even inhaled some helium gas to make the turret a bit lighter, #nbut it had no effect!"
10058060-27 = "At least the direction of your approach isn't wrong."
10058060-28 = "Ah! Come to think of it, we haven't introduced ourselves yet! And that's basic ninja etiquette!"
10058060-29 = "Greetings, a pleasure to meet you for the first time, enemy tank. #nThis humble one is Michiru, president of the Hyakkiyako Allied Academy Ninjutsu Research Club."
10058060-30 = "O-Oono Tsukuyo. I'm a member of the Ninjutsu Research Club!"
10058060-31 = "Kuda Izuna! #nI'm a Ninjutsu Research Club member in charge of the turret! Nin..."
10058060-32 = "Ah! I gotta act more like a turret!"
10058060-33 = "Bang bang!!"
10058060-34 = "Eh!? There was a rule like that!?"
10058060-35 = "V-Vroom vroom!"
10058060-36 = "Vroom vroom."
10058060-37 = "Do we have to do it too!?"
10058060-38 = "No way in hell! We're not parts!"
10058060-39 = "Uhm, let us introduce ourselves too. #nWe're Red Winter Federal Academy's Class 183. #nThe one making all that noisy racket is Anna, and I'm Erina."
10058060-40 = "Who's making a noisy racket! #nYou're just jealous because I'm the only one with a medal!"
10058060-41 = "Yeah, yeah, sure. And in the driver's seat is Rana."
10058060-42 = "Vroom vroom."
10058060-43 = "U-Uhm... Once again, thank you for the ride."
10058060-44 = "Thanks for helping us out, even though we're enemies!"
10058060-45 = "Don't mention it! Once you're in a tank, everyone's a friend!"
10058060-46 = "How far do you need a lift?"
10058060-47 = "If you could take us up to the top of the hill... #nThat slope is so steep, there's just no way we can climb it on foot..."
10058060-48 = "Still, we'll manage the rest on our own!"
10058060-49 = "Are you really going to be okay? It's dangerous, and I imagine it's super tough."
10058060-50 = "Wouldn't it be better to rest a bit longer before heading out?"
10058060-51 = "We appreciate the sentiment, but a ninja never stays in one place and never relies needlessly on others!"
10058060-52 = "I-If we've come this far... we want to do our best until the very end...!"
10058060-53 = "Izuna feels the same way!"
10058060-54 = "Even so... Class 183's tank has a really mysterious shape! #nNot that we're one to talk."
10058060-55 = "Things like this must be expensive, right?"
10058060-56 = "We even saved up our allowance to buy loads of tape!"
10058060-57 = "Actually... since we made it out of scrap parts, it didn't cost anything in materials."
10058060-58 = "Amazing! You made a tank out of scrap!? And we barely manage with just our ninjutsu tools!"
10058060-59 = "...I've been wondering for a while now, what is \"ninjutsu\"?"
10058060-60 = "Enyaah!? You don't know what ninjutsu is?"
10058060-61 = "Ninjutsu is! In other words!"
10058060-62 = "Uhm... It's something super complicated..."
10058060-63 = "You hide to scout, and then you appear like, shubabababatt!"
10058060-64 = "Yeah, yeah! Exactly!"
10058060-65 = "Hide to scout, and then suddenly appear?"
10058060-66 = "Ah~ I get it, I get it!"
10058060-67 = "You mean the people from Hyakkiyako's Student Council!"
10058060-68 = "The Student Council, you say?"
10058060-69 = "Probably that!"
10058060-70 = "I don't really get it... but if there's something similar, then I guess so!"
10058060-73 = "Once again, thank you for helping us!"
10058060-74 = "We will never forget this favor!"
10058060-75 = "Thanks to you, we can keep going...!"
10058060-77 = "Make sure you finish the race! We're rooting for you!"
10058060-78 = "Don't get hurt~!"
10058060-79 = "Farewell. Such a cool tank."
10058060-81 = "Let's go!"
10058060-82 = "Y-Yes!"
10058060-83 = "Bang bang!!"
10058060-86 = "...We thought we were trying our hardest."
10058060-87 = "Building a tank, and somehow making it through the preliminaries."
10058060-88 = "But those people made it all the way here in a cardboard tank."
10058060-89 = "How cool... I have to learn from that indomitable fighting spirit!"
10058060-90 = "A tank that never gives up is cool."
10058060-91 = "..."
10058060-92 = "Erina? What's with the deep thought?"
10058060-95 = "N-No. Nothing. More importantly, let's get going."
10058060-96 = "Rana, let's head for the third target!"
10058060-97 = "Not right now."
10058060-98 = "Down the hill, it's a free-for-all."
10058060-99 = "Whoa~ Guess we were late after all~"
10058060-101 = "Abydos Team - Horus No. 1"
10058060-104 = "Missed! Ayane-chan, keep going straight ahead!"
10058060-105 = "O-Ongoing straight—!"
10058060-106 = "Reload complete~"
10058060-109 = "Can you hear me, Faust? Also known as Ajitani Hifumi."
10058060-110 = "I'm not going to hand over the title of Swimsuit Tank Squad."
10058060-111 = "Shiroko-senpai!! What are you doing provoking them over the radio!"
10058060-112 = "We're firing!"
10058060-113 = "Recoil distance secured~"
10058060-120 = "Remedial Class Team - Crusader-chan"
10058060-122 = "Hyaa!! We've been hit!!"
10058060-123 = "W-We gotta get out of here!!"
10058060-124 = "My, fleeing before the enemy without orders from Captain Hifumi is unacceptable."
10058060-125 = "Don't worry, we have proper airbags too♡"
10058060-130 = "Capital punishment!! Don't do stuff like that in a swimsuit!!"
10058060-131 = "The air conditioning in the tank is broken, so wearing a swimsuit can't be helped."
10058060-132 = "Is it still too hot even in a swimsuit?"
10058060-137 = "Oh jeez!! Don't come closer!! Get out of here!!"
10058060-141 = "Ahaha... The shell bounced off the armor, so we're fine, Koharu-chan."
10058060-142 = "Azusa-chan, could you aim at the left side of the target? #nI'll give the signal and we'll turn right immediately."
10058060-143 = "Understood, Faust."
10058060-144 = "Y-You don't need to memorize stuff like that!"
10058060-145 = "It sounds cool. It fits Hifumi."
10058060-146 = "What are you so relaxed about! Concentrate!"
10058060-147 = "Azusa-chan, here we go. 3, 2..."
10058060-148 = "...1, fire!"
10058060-152 = "Direct hit to the tip of the barrel. Let's take another shot, Hifumi."
10058060-153 = "No, there's no need for that. As long as we can neutralize them for a while."
10058060-156 = "Everyone from Abydos, can you hear me! Are you hurt?"
10058060-159 = "Yes, we're fine! Everyone is safe..."
10058060-160 = "Faust, it's not over yet. Let's go as far as we can."
10058060-161 = "Ahaha... I'm glad you're all safe."
10058060-163 = "Senpai!! Ayane-chan is still talking!"
10058060-164 = "Hand that radio over here! Confiscated, it's confiscated!"
10058060-165 = "The tip of the barrel is bent, so shelling is impossible now... Well then..."
10058060-169 = "Faust! Let us engage in a fair and honorable duel!"
10058060-174 = "Shiroko-chan, you're faster than a tank☆"
10058060-175 = "This is no time to be impressed! Senpai, hurry! We gotta do something about this opening!"
10058060-178 = "What is with that person!? She's been calling someone's name since earlier—"
10058060-181 = "I mean, fast! She's dodging all the bullets too!"
10058060-182 = "Are you allowed to get out of the tank and fight!? Isn't this a tank race?"
10058060-183 = "It seems that anything not explicitly forbidden by the competition rules is not grounds for disqualification."
10058060-184 = "And... biting the ear of someone on your own team isn't grounds for disqualification either, you know?"
10058060-188 = "Hi, hiyaaaahn..."
10058060-189 = "Wait, what are you doing!!"
10058060-190 = "Ehehe. It kind of looked like a gyoza, so I couldn't resist♡"
10058060-191 = "Pervert! Capital punishment!!!"
10058060-196 = "Wh-What!? Where did she go!? I had her in the sight just a second ago!!"
10058060-206 = "Where did you go...?"
10058060-211 = "Kyaaah!!"
10058060-213 = "Won't let you escape."
10058060-214 = "Come out, let's all fight..."
10058060-217 = "Whoa!! Sorry!! Shiroko-senpai!!"
10058060-218 = "Uhe~ Serika-chan, were you holding back that much frustration toward senpai?"
10058060-219 = "When I cut off the tip of the broken barrel, this happened! #nI didn't mean to!!"
10058060-220 = "Shiroko-senpai, are you okay!?"
10058060-224 = "She's giving a thumbs up! Looks like she's fine!"
10058060-225 = "By the way, what is Shiroko-chan looking at...? #nShe's smiling while looking off into space..."
10058060-226 = "Reminds me of when I fell from the persimmon tree in the school's backyard~"
10058060-227 = "We gotta get through this crisis first! Reloading next round!!"
10058060-229 = "Haa... Haa... I thought my heart stopped!"
10058060-230 = "What are we gonna do!? Over there, they're still trying to fight! Didn't we defeat them!?"
10058060-231 = "An unyielding fighting spirit. I like it."
10058060-232 = "This is no time to be impressed!"
10058060-233 = "Uhm... If we keep fighting like this, it's never going to end."
10058060-234 = "Even if we both shoot until we're completely out of ammo, there won't be a resolution."
10058060-235 = "Really? I thought we had the advantage."
10058060-236 = "Their barrel has been shortened, which reduced their muzzle velocity. #nThat's why they missed."
10058060-237 = "In that case, they should use chemical energy shells whose penetration power remains constant regardless of speed, #nbut the sound when it hit our armor sounded like AP rounds."
10058060-238 = "M-Muzzle velocity?"
10058060-239 = "I see. So this is what they call ballistics."
10058060-240 = "Then their penetration power must have dropped significantly."
10058060-241 = "Probably, right about now..."
10058060-244 = "Hyaa!?"
10058060-245 = "As expected, their gunfire can't pierce our armor."
10058060-246 = "Being able to tell the type of shell just by the sound makes Hifumi sound like a real warrior."
10058060-247 = "Ah, ahaha... It's just a hobby of mine, really..."
10058060-248 = "Oh jeez! In other words, it means we win, right!?"
10058060-249 = "No, that's not it. #nWe were also planning to disable their mobility and escape since we can't pierce their armor either."
10058060-250 = "Meaning, it's a draw. No matter how much we shoot at each other, it's a waste of time."
10058060-251 = "Indeed. Settling for a draw might be our best option."
10058060-252 = "(I feel like Hifumi becomes a slightly different person when she gets in a tank...)"
10058060-253 = "I'm not sure if the radio is working in this state, so I'll go talk to them directly."
10058060-257 = "Uh, excuse me! Everyone from Abydos~!"
10058060-259 = "Hifumi-san is leaning out and waving a handkerchief!"
10058060-260 = "But her outfit... Is that a swimsuit...?"
10058060-261 = "I don't know why she's dressed like that... but going any further is pointless anyway~. #nHifumi-chan seems to realize it too."
10058060-262 = "Why? They're still full of energy, aren't they?"
10058060-263 = "Because—"
10058060-264 = "Fuaa—"
10058060-267 = ".........Funya."
10058060-268 = "Don't fall asleep halfway through, finish what you were saying properly!!"
10058060-269 = "Is this... a request for negotiations? #nWe'll have to bring Shiroko-chan along too, so it's actually helpful for us."
10058060-270 = "I wonder if Shiroko-senpai is okay...? She's been doing flower fortune-telling with a serene expression for a while now..."
10058060-271 = "Well then, let's rendezvous with Shiroko-senpai and go propose a truce."
10058060-276 = "Pardon us!"
10058060-277 = "Let's call a truce for now—"
10058060-280 = "Funya... Uah!?"
10058060-281 = "Everyone hold on tight!! Incoming shell!!"
10058060-282 = "Eeeh!?"
10058060-283 = "Kaboom!!"
10058060-284 = "Distance 8,500 meters, one enemy tank destroyed!"
10058060-285 = "Secondary target, Crusader! Disengaging after deploying smoke screens! Lost visual!"
10058060-286 = "Hmph, quite the speed. #nPerhaps I should have captured Trinity's \"Titania\" first."
10058060-287 = "Is it over, Tomoe?"
10058060-290 = "No, Secretary-General."
10058060-291 = "This is just the beginning."
10058060-294 = "What is that thing!?"
10058060-295 = "Is everyone alright? The Abydos members suddenly exploded..."
10058060-296 = "I'm fine. #nLooks like we were shelled from the highlands 7,000 meters to the southeast."
10058060-297 = "Let's stay put here for a bit. #nHidden by the grass, they shouldn't know our position."
10058060-298 = "But this position is overwhelmingly disadvantageous. #nWe won't be able to move an inch from here unless the enemy gives us an opening."
10058060-299 = "Indeed, Azusa-chan. #nEven if we deploy smoke screens, they predicted our position and fired, so running away will be impossible."
10058060-300 = "I'll observe through the telescope for a bit. #nJudging by the sound and power, what they're firing is likely a 56-caliber 100mm HE shell. #nThough it's rare to see anyone use that."
10058060-301 = "How do you know stuff like that...?"
10058060-302 = "Ahaha, I just happened to know. #n...Ah! That tank from earlier, it's started firing at the other side! Uhm, that's..."
10058060-303 = "Hifumi?"
10058060-304 = "...!"
