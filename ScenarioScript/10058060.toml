[translation]
10058060-1 = "Episode 6; If You Run, You Gain 3; If You Participate, You Gain 1"
10058060-3 = "Um, so... Uh... Honestly, there's a ton I wanna ask, but..."
10058060-4 = "Where do we even begin...?"
10058060-7 = "Pwaaah!"
10058060-8 = "How incredibly sweet and tasty! Did you add sugar to this water?"
10058060-9 = "T-Thank goodness for your help... Thank you so much for giving us a ride!"
10058060-10 = "Let's see, what would be a good question to ask first...?"
10058060-11 = "It seems you have something you'd like to ask!"
10058060-12 = "Luckily, our director has written down a list of frequently asked questions just for#nthis!"
10058060-13 = "That's because we were getting swamped with all sorts of questions right up until the day before the race..."
10058060-16 = "Let's see then..."
10058060-17 = "\"1. Yes, this is a tank. Not only does it have a hull and a gun, but it has also been#napproved as a tank by management. I don't know how either.\""
10058060-18 = "\"2. We originally made this cardboard tank for a Gehenna Cup themed comedy skit... #nBut we accidentally submitted the participation form we filled out as a joke, and now we're a part of the actual race.\""
10058060-19 = "I'm really, really sorry... #nI submitted it because I thought we were actually going to participate..."
10058060-20 = "It's fine! I'm the one who said we shouldn't run away and participate anyway!"
10058060-21 = "Ah, speaking of which..."
10058060-22 = "Isn't that setup really tiring? Why don't you take turns for each position...?"
10058060-23 = "The answer to that is in number seven. Ugh... I'm so tired that I'm starting to fall#nasleep..."
10058060-24 = "\"7. We originally planned on taking turns with each role, but management#ntold us that it would count as part swapping mid-race, so we've been stuck like this#never since.\""
10058060-25 = "Ahhh, so you're all considered as individual parts."
10058060-26 = "Izuna's even tried breathing in helium to make the turret a little lighter, but it#nhasn't helped at all!"
10058060-27 = "Well at least your approach was on the right track."
10058060-28 = "Ahhh! I just realized we haven't introduced ourselves yet, even though it's a#nfundamental part of being a ninja!"
10058060-29 = "It is a great pleasure to meet you, lords of this enemy tank. #nI humbly greet you as director of Hyakkiyako Alliance Academy's Ninjutsu#nResearch Department, Michiru."
10058060-30 = "I-I'm Oono Tsukuyo. I'm a member of the Ninjutsu Research Department!"
10058060-31 = "Kuda Izuna! Izuna is also a member of the Ninjutsu Research Department, as well as the turret of this tank! Nin..."
10058060-32 = "Ah! That's not the sound a turret makes!"
10058060-33 = "Bang bang!"
10058060-34 = "Eh!? That's a thing now!?"
10058060-35 = "V-Vroom vroom!"
10058060-36 = "Vroom vroom."
10058060-37 = "We have to do it too!?"
10058060-38 = "Heck no! Do you think we're tank parts too!?"
10058060-39 = "Well, I guess we introduce ourselves too. #nWe're Spec Ops No. 183 from Red Winter Federal Academy. #nThe noisy won't-shut-her-mouth here is Anna, and I'm Erina."
10058060-40 = "Who are you calling a noisy won't-shut-her-mouth!? #nI bet you're just jealous because I'm the only one who has medals!"
10058060-41 = "Yep yep, whatever you say. Anyway, the one in the driver's seat is Rana."
10058060-42 = "Vroom vroom."
10058060-43 = "U-Umm... Once again, thank you so much for giving us a ride."
10058060-44 = "Thank you for helping us, even though we're enemies!"
10058060-45 = "Don't worry about it! We're all friends when we're on this tank!"
10058060-46 = "Where should we drop you off?"
10058060-47 = "Just up this hill is fine... #nThis slope's so steep that there's no way we could ever climb it..."
10058060-48 = "But we'll try seeing the rest of it through ourselves!"
10058060-49 = "Are you sure? It's gonna be dangerous and probably really hard."
10058060-50 = "You could rest a little longer before you head off."
10058060-51 = "Thank you for the offer. However, a ninja never stays in one place, nor do they rely too much on others!"
10058060-52 = "W-We've already come this far... So I'll keep trying my best until the end...!"
10058060-53 = "Izuna's the same!"
10058060-54 = "I have to say though... Your tank has a very intriguing shape to it! #nThough I guess we shouldn't be one to judge."
10058060-55 = "Isn't something like this expensive?"
10058060-56 = "We also saved up our allowance and bought a ton of tape!"
10058060-57 = "Actually... We made this tank out of scrap, so the materials didn't cost us anything."
10058060-58 = "That's incredible! You made an entire tank out of scrap!? We can barely even#nmake the tools for our ninjutsu!"
10058060-59 = "...I've been wondering this for a whole now, but what exactly is \"ninjutsu?\""
10058060-60 = "Unyaah!? You don't know what ninjutsu is!?"
10058060-61 = "In essence! Ninjutsu is—!"
10058060-62 = "Um... It's complicated..."
10058060-63 = "You hide yourself and scout around. Then, you appear with a shubababa!"
10058060-64 = "Yeah! That's exactly it!"
10058060-65 = "Hiding and scouting, then suddenly appearing?"
10058060-66 = "Ah! I got it! I get it now!"
10058060-67 = "So you're basically people from Hyakkiyako's Office (huh) !"
10058060-68 = "Office?"
10058060-69 = "It's probably as you say!"
10058060-70 = "Izuna's not entirely sure... But if it's similar to what we described, then that's#nprobably it!"
10058060-73 = "Once again, thanks a lot for the help!"
10058060-74 = "We'll never forget this favor!"
10058060-75 = "Now that you've helped us, we'll be able to do our best again...!"
10058060-77 = "You HAVE to finish this race! We'll be rooting for you!"
10058060-78 = "Don't get hurt, you hear!?"
10058060-79 = "Farewell, you splendid tank."
10058060-81 = "Let's go!"
10058060-82 = "Y-Yes!"
10058060-83 = "Bang bang!"
10058060-86 = "...And here, I thought WE had been working really hard."
10058060-87 = "Sure, we made a tank and somehow passed the qualifiers."
10058060-88 = "But those three made it this far with a cardboard tank."
10058060-89 = "In a way, that's really cool...! I should learn from their indomitable spirit."
10058060-90 = "A tank that never gives up— very cool."
10058060-91 = "..."
10058060-92 = "Erina? What are you thinking about?"
10058060-95 = "N-zno. It's nothing. Nevermind that, let's hurry up and get moving."
10058060-96 = "Rana, take us to the third target!"
10058060-97 = "Not now."
10058060-98 = "A chaotic battle has broken out. Down the hill."
10058060-99 = "Oops, looks like we were late after all."
10058060-101 = "Team Abydos - Horus-1"
10058060-104 = "Miss! Ayane-chan, keep driving straight!"
10058060-105 = "A-Advancing!"
10058060-106 = "Neeext round loaded!"
10058060-109 = "Do you hear me, Faust? Alias, Ajitani Hifumi."
10058060-110 = "We aren't giving up the name \"Swimsuit Tank Crew.\""
10058060-111 = "Shiroko-senpai! Why're you provoking them over the radio!?"
10058060-112 = "Firing now!"
10058060-113 = "Recoil length, cleeear!"
10058060-120 = "Team Make-up Work Club - Crusader-chan"
10058060-122 = "Hyaaah! We've been hit!"
10058060-123 = "W-We need to get out of here!"
10058060-124 = "Oh dear, and without commander Hifumi's order?#nThere'll be no deserting under enemy fire here."
10058060-125 = "But no need to worry. We have proper airbags in here. ♡"
10058060-130 = "I SENTENCE YOU TO DEATH! Do NOT do that in your swimsuit!"
10058060-131 = "But the air conditioning in this tank is broken. What choice do I have but to wear#nthis swimsuit?"
10058060-132 = "Or perhaps is it still too hot, even with the swimsuit on?"
10058060-137 = "Get AWAY from me! Stop getting closer! Get OUT!"
10058060-141 = "Ahaha... The shell bounced off our turret armor, so we're all right, Koharu-chan."
10058060-142 = "Azusa-chan, could you aim for their left side? #nWe'll make a sharp right on my signal."
10058060-143 = "Understood, Faust."
10058060-144 = "Y-You don't have to remember that name!"
10058060-145 = "But it sounds good. It fits you perfectly."
10058060-146 = "Stop having a casual conversation over there! Focus!"
10058060-147 = "Azusa-chan, get ready. 3, 2..."
10058060-148 = "...1! Fire now!"
10058060-152 = "Direct hit on their muzzle. Let's fire another one."
10058060-153 = "There's no need for that. For now, all I needed was to knock them out of the fight."
10058060-156 = "Team Abydos, can you hear me? Is anyone hurt?"
10058060-159 = "We can hear you! We're all fine..."
10058060-160 = "It's not over just yet, Faust. We either live or we die here."
10058060-161 = "Ahaha... I'm glad to hear you're all safe."
10058060-163 = "Senpai! Ayane-chan was still talking!"
10058060-164 = "Give the radio back! I'm confiscating this, you hear!?"
10058060-165 = "The tip of our barrel has been bent, so we can't fire anymore... I guess we'll..."
10058060-169 = "Faust! Honorable duel! Now!"
10058060-174 = "Wow! Shiroko-chan's even faster than a tank! ☆"
10058060-175 = "Now's not the time to be impressed! Senpai, quick! Let's take advantage of this#nopportunity!"
10058060-178 = "What's with her!? Who's this person she keeps talking about?"
10058060-181 = "Nevermind that— she's so fast! How is she dodging every single bullet!?"
10058060-182 = "Are you really allowed to fight on foot!? I thought this was a tank race!"
10058060-183 = "If it's not written in the rules, then anything that doesn't result in a disqualification#nis fair game."
10058060-184 = "And by that logic... Biting your teammate's ears is not grounds for disqualification either."
10058060-188 = "H-Hyaaan..."
10058060-189 = "Eh—!? What do you think you're doing!"
10058060-190 = "Eheheh. You looked so much like a dumpling that I couldn't help myself. ♡"
10058060-191 = "YOU'RE SUCH A FREAK! DEATH SENTENCE FOR YOU!!"
10058060-196 = "W-Wait! Where did that girl go!? I just saw her in the sights a minute ago!"
10058060-206 = "Where did she go...?"
10058060-211 = "KyaaAAH!"
10058060-213 = "You aren't getting away."
10058060-214 = "Get out of the tank. Let's have a fair matc—"
10058060-217 = "Oh shoot! I'm SO sorry, Shiroko-senpai!!"
10058060-218 = "Uhee. Serika-chan, how much frustration did you bottle up against her?"
10058060-219 = "This is just what happened after I cut off the damaged part of the barrel, okay!? #nIt wasn't on purpose!"
10058060-220 = "Shiroko-senpai, are you all right!?"
10058060-224 = "She's giving a thumbs up! Looks like she's fine!"
10058060-225 = "By the way, where is she looking at...? #nShe's laughing while facing the complete wrong direction..."
10058060-226 = "It reminds me of that time she fell off of the persimmon tree behind the school."
10058060-227 = "Anyways, let's get outselves out of this bind first! Load the next shell!"
10058060-229 = "Haah... Haa... I thought my heart was about to stop!"
10058060-230 = "What should we do!? They're trying to fight again!#nI thought we took them out already!"
10058060-231 = "An unbreakable spirit. I like that."
10058060-232 = "This is NOT the time to be admiring that!"
10058060-233 = "Umm... I don't think this battle will end if we keep fighting it out like this."
10058060-234 = "Even if we both fire all of our shells, neither side will win."
10058060-235 = "Really? I thought we had the upper hand here."
10058060-236 = "Because they shortened their barrel, their muzzle velocity has decreased. #nThat's also why they missed just now."
10058060-237 = "In that case, they should be using chemical energy rounds that don't rely on sheer#nvelocity for penetration. However, judging from the sound their shell made#nbouncing off of our armor, they're using AP rounds."
10058060-238 = "Mu-muzzle velocity?"
10058060-239 = "I see. So it's all about the ballistics."
10058060-240 = "Then their penetration should've dropped sharply."
10058060-241 = "Right about now..."
10058060-244 = "Hyaah!?"
10058060-245 = "I was right. Their gun is currently unable to pierce through our armor."
10058060-246 = "You're just like a soldier, Hifumi—being able to differentiate between shell types#njust by sound."
10058060-247 = "A-Ahaha... I think any hobbyist could do it..."
10058060-248 = "Agh, enough already! So does this mean we win!?"
10058060-249 = "No it doesn't. #nWe can't penetrate their armor either, so our plan was to disable them and run."
10058060-250 = "To put it bluntly, it's a draw. No matter how many shots we trade, it's just a waste of time."
10058060-251 = "Exactly. Our best course of action is to call a draw."
10058060-252 = "(Hifumi feels like a completely different person once she's in a tank...)"
10058060-253 = "I'm not sure if their radio is still working in this situation, so I'll talk to them#ndirectly."
10058060-257 = "E-Excuse me! Team Abydos!"
10058060-259 = "Hifumi-san's leaning out of the tank while waving a handkerchief!"
10058060-260 = "But what is she wearing? Is that... a swimsuit...?"
10058060-261 = "I don't know why she's wearing that... but seems it's pointless to continue after all.Looks like Hifumi-chan's also come to that conclusion."
10058060-262 = "Why? Aren't we still in good shape?"
10058060-263 = "Well—"
10058060-264 = "Fwaah..."
10058060-267 = "...Funya."
10058060-268 = "Don't just fall asleep halfway! At least finish what you were saying!"
10058060-269 = "Are they asking to negotiate...? We need to bring Shiroko-chan back over here too, so this actually works out for us."
10058060-270 = "Is Shiroko-senpai really okay...? She's been plucking flower petals with a face that#nlooks like she's at peace..."
10058060-271 = "Now then, shall we group back up with Shiroko-senpai and propose a ceasefire?"
10058060-276 = "Excuse us!"
10058060-277 = "First things first, we'd like to propose a ceasefire—"
10058060-280 = "Funya... Uwah!?"
10058060-281 = "Everyone hold on tight! We've got incoming!!"
10058060-282 = "Eehh!?"
10058060-283 = "KABOOM!!"
10058060-284 = "Range, 8,500 meters. One enemy tank destroyed!"
10058060-285 = "Second target—Crusader—has deployed smoke and withdrawn! We've lost sight#nof them!"
10058060-286 = "Hmph, that was quick. #nPerhaps it'd have been wise to eliminate Trinity's Fairy Queen—Titania—first."
10058060-287 = "Is that it, Tomoe?"
10058060-290 = "Not yet, Great Leader."
10058060-291 = "This is only the beginning."
10058060-294 = "What is that!?"
10058060-295 = "Is everyone all right? The Abydos team have suddenly exploded."
10058060-296 = "I'm fine. #nLooks like that shell came from a high point southeast of us, 7,000 meters away."
10058060-297 = "Let's stop here for now. #nWith the grass covering us, they shouldn't know our position."
10058060-298 = "But we're at an overwhelming disadvantage here. #nUntil the enemy drops their guard, we're stuck in this position."
10058060-299 = "You're right, Azusa-chan. They were able to predict our position and fire at us even#nwith the smoke. Running isn't an option."
10058060-300 = "For now, we'll keep track of the situation through the scope. #nJudging from the sound and power of the shot, they're likely firing HE out of a 100mm/56 gun. #nIt's a rather unconventional choice."
10058060-301 = "How do you even know this...?"
10058060-302 = "Ahaha, I just happen to know. #n...Ah! They're beginning to fire over there! But, that's where..."
10058060-303 = "Hifumi?"
10058060-304 = "Oh no...!"