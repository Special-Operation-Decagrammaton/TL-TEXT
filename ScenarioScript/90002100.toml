[translation]
90002100-1 = "Эпизод 10;000, 00, 0"
90002100-2 = "План операции!"
90002100-3 = "С-С-Стальной континент...! Ах..."
90002100-4 = "Давай, Юзу! Ты уже полностью экипирована! Громче и увереннее!"
90002100-5 = "Н-Но..."
90002100-6 = "Не обязательно так её подбадривать, Юзу. Ты только разбалуешь её.#nИ сестрёнка! Оставь Юзу в покое!"
90002100-7 = "Ну же! Ты моя любимая сестра. Не будь такой злой! Я просто пыталась придать Юзу смелости!"
90002100-8 = ""
90002100-10 = ""
90002100-11 = "Именно! Мужество — важнейшее оружие героя!"
90002100-12 = "Почему и ты поддалась настроению, Арис...?"
90002100-13 = ""
90002100-14 = "[ns] «Так-так. Сначала мы направляемся в область Бины, верно?»"
90002100-15 = "Когда мы захватим область Бины, станет проще: сам транспортный корабль можно будет использовать как базу."
90002100-16 = "Как только мы извлечём ядро Бины и получим доступ к сети Стального континента... дальше всё будет за Сенсеем."
90002100-17 = "Для каждой области мы будем делиться на две команды, но состав будет меняться в зависимости от необходимости."
90002100-18 = "Именно ради этого мы и используем транспортный корабль как базу."
90002100-19 = "После захвата области пророка Кей тоже должна будет находиться там."
90002100-20 = "Да. Кей поглотит данные ядра пророка и преобразует их."
90002100-21 = "...Не описывай меня так, будто я то круглое существо, которое глотает врагов и копирует их способности."
90002100-22 = "А, так ты тоже знаешь эту игру, Кей! Это шедевр!"
90002100-23 = ""
90002100-24 = "[ns] «Просто из любопытства: тебе тоже нравятся игры, Кей?»"
90002100-25 = "Н-н-н-н-нет конечно! Это просто мои воспоминания и опыт тех времён, когда я была синхронизирована с Арис!"
90002100-26 = "Понятно... Значит, то время, что мы провели вместе... для Кей теперь лишь неприятные воспоминания..."
90002100-27 = "Нет! Совсем нет, Арис! Ни за что! Я не это имела в виду, я хотела сказать...!"
90002100-28 = "Всё хорошо... Что бы ты обо мне ни думала... Я всегда буду дорожить тем, что у нас было, Кей..."
90002100-29 = "Нет, всё не так! Я никогда бы так не подумала! ТЫ ДОЛЖНА МНЕ ПОВЕРИТЬ!!"
90002100-30 = "Всё хорошо, Кей. Я в порядке..."
90002100-31 = "АРИС!!"
90002100-32 = ""
90002100-34 = ""
90002100-35 = ""
90002100-36 = ""
90002100-37 = "И именно в этот момент...!"
90002100-38 = "Арис взглянула на меня с озорной улыбкой...!"
90002100-39 = ""
90002100-40 = "[ns] «Хватит её дразнить, Арис...»"
90002100-41 = "Хи-хи. Простите, Сенсей. И ты тоже, Кей."
90002100-42 = "Что? Дразнить...? Что? То есть... а?!"
90002100-43 = "[ns] «Но дразнить Кей весело...»"
90002100-44 = "Это правда! Значит, и вы это знаете, Сенсей!"
90002100-45 = "..."
90002100-46 = "..."
90002100-47 = "..."
90002100-48 = "Вы просто ужасны, Сенсей!"
90002100-49 = ""
90002100-50 = "Что ж, Сенсей, идёмте. Я, Асума Токи, буду поддерживать вас как идеальная горничная."
90002100-51 = "Разве в таком наряде ты ещё можешь называть себя горничной...?"
90002100-52 = "Я буду поддерживать вас как идеальный специальный агент."
90002100-53 = "Как быстро ты приспосабливаешься, Токи."
90002100-54 = "Однако разве способность мгновенно адаптироваться к любым условиям..."
90002100-55 = "...не является основой для выдающегося спецагента? V — значит победа."
90002100-56 = "[s] «Да-да...»"
90002100-57 = "Ух. Может, уже начнём?"
90002100-58 = "Все по местам."
90002100-59 = "Тогда мы под вашим командованием, Сенсей."
90002100-60 = "[s] «Фух! Какая ответственность!»"
90002100-61 = "О боже. Но разве для вас это не самый обычный вторник?"
90002100-62 = "[s] «Можно и так сказать.»"
90002100-63 = ""
90002100-65 = ""
90002100-67 = "[ns] «Что ж, начинаем операцию „Бина“!»"
