[translation]
1014702-1 = "Satsuki's Safety Measures"
1014702-2 = "(A while after receiving a message from Satsuki...)"
1014702-7 = "Kept you waiting, Sensei."
1014702-8 = "[s] \"Hello, Satsuki.\""
1014702-9 = "Good. It looks like you haven't gone into the water yet."
1014702-10 = "As you surely know, Sensei, the ocean is full of hidden dangers."
1014702-11 = "One wrong step could lead to an irreversible situation..."
1014702-12 = "But, as expected of you, Sensei. #nNot rushing into the water and calmly observing the situation instead."
1014702-13 = "[s] \"Actually, I just got here.\""
1014702-14 = "Hmm, is that so—"
1014702-18 = "Sensei, you are in a very dangerous state right now. We must do something about it quickly."
1014702-19 = "Come here."
1014702-21 = "(Guided by Satsuki, you walked over to the parasol.)"
1014702-23 = "Now, lie down on this mat."
1014702-24 = "That's it. Yes, just like that..."
1014702-25 = "Hehe, I am about to perform a procedure that will significantly increase your survival rate, Sensei."
1014702-32 = "[ns1] \"Is this—\"\n[ns2] \"Sunscreen?\""
1014702-35 = "Yes, that's right."
1014702-36 = "At the beach, there is glare reflecting off the sand and the water's surface, #nso you are exposed to more UV rays than usual."
1014702-40 = "UV rays cause significant damage to the skin. You must take proper precautions. #nEspecially when the sun is as strong as it is now."
1014702-44 = "Besides, this is a custom-made product from the Pandemonium Society..."
1014702-48 = "As long as you apply this, you can block most UV rays."
1014702-49 = "[s3] \"Thank you, Satsuki.\"\n[s4] \"But, I feel like you're applying a bit too much...\""
1014702-55 = "The more you use, the more effective it is. #nI'll apply another bottle for you."
1014702-56 = "[s] \"Oh, thank you...\""
1014702-58 = "(Satsuki applied two whole bottles of sunscreen on you.)"
1014702-60 = "There, that should do it. Hehe, I managed to apply it quite thoroughly. #nYou're glowing, Sensei."
1014702-61 = "You can go and play to your heart's content now."
1014702-62 = "I'll set a timer for you."
1014702-63 = "[s] \"A timer?\""
1014702-64 = "Playing in the water for too long is dangerous, you know? #nYour body temperature will drop, and the probability of an accident increases."
1014702-65 = "But don't worry. I will be monitoring you closely."
1014702-66 = "According to the Pandemonium Society's Intelligence Department... #n25 minutes of playing in the water and 10 minutes of rest is the ideal cycle."
1014702-67 = "I'll call out to you when the time is up, so please go and play without a care in the world, Sensei."
1014702-69 = "(You hadn't intended to swim, but you were pushed into the ocean by Satsuki...)"
1014702-73 = "(While playing, you started having fun and enjoyed yourself more than expected.)"
1014702-74 = "Sensei, 25 minutes have passed~ #nCome back quickly."
1014702-75 = "[ns] \"Eh~, but I was just getting to the good part!\""
1014702-78 = "Hehe, I'm sorry to interrupt while you're having fun. #nBut your health is my top priority, Sensei."
1014702-79 = "If you push yourself and get sick, it would all be for nothing, wouldn't it?"
1014702-80 = "Now, sit down. Let's hydrate."
1014702-81 = "[s5] \"You're really taking care of everything.\"\n[s6] \"Thank you for looking out for me, Satsuki.\""
1014702-84 = "Sensei is a talent that the Pandemonium Society must secure above all else."
1014702-85 = "This much is only natural."
1014702-89 = "Oh, that's right... could you apply sunscreen on me now?"
1014702-90 = "Even under a parasol, UV rays still get in. #nBecause the sand and the ocean reflect them..."
1014702-91 = "I applied it where I could reach, but... I can't reach my back."
1014702-97 = "[ns] \"Um...\""
1014702-98 = "Come on, please."
1014702-99 = "[s] \"A-alright.\""
1014702-106 = "Hehehe♪"
1014702-107 = "Sensei, your hands are a bit rough. #n...But, it's not bad."
1014702-108 = "Oh, please untie the straps. Otherwise, there will be spots I can't get covered, right?"
1014702-110 = "(After finishing applying the sunscreen, you sat under the parasol with Satsuki and watched the ocean.)"