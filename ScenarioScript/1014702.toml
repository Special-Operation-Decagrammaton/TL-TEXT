[translation]
1014702-1 = "План безопасности Сацуки"
1014702-2 = "Вскоре после того, как я получил сообщение от Сацуки..."
1014702-3 = ""
1014702-6 = ""
1014702-7 = "Сенсей!"
1014702-8 = "[s] «Привет, Сацуки»."
1014702-9 = "Фу-фу. Какое облегчение. Вы ещё не вошли в воду."
1014702-10 = "Как вы, вероятно, знаете, Сенсей, на пляже таится немало опасностей."
1014702-11 = "Всего одна ошибка может привести к непоправимым последствиям..."
1014702-12 = "Поэтому в такой ситуации разумно сначала осмотреться, а не бросаться в воду сломя голову."
1014702-13 = "[s] «Нет, я только что пришёл...»"
1014702-14 = "Хм, пока что..."
1014702-15 = ""
1014702-17 = ""
1014702-18 = "Так не годится. Сенсей, вы совершенно не подготовлены к грядущим опасностям."
1014702-19 = "Скорее, идите сюда."
1014702-21 = "Сацуки подвела меня к пляжному зонтику."
1014702-23 = "Пожалуйста, ложитесь на коврик."
1014702-24 = "Превосходно, да, ложитесь. Вот так."
1014702-25 = "Фу-фу, сейчас я приму меры, которые значительно повысят ваши шансы на выживание."
1014702-26 = ""
1014702-28 = ""
1014702-29 = ""
1014702-30 = ""
1014702-31 = ""
1014702-32 = "[ns1] «Это...»\n[ns2] «Солнцезащитный крем?»"
1014702-35 = "Фу-фу. Совершенно верно."
1014702-36 = "Сенсей наверняка и сам знает, что на пляже воздействие ультрафиолетовых лучей гораздо сильнее, а это очень опасно для кожи."
1014702-37 = ""
1014702-39 = ""
1014702-40 = "В это время особенно опасно. Чтобы предотвратить солнечные ожоги и старение кожи, солнцезащитный крем просто необходим."
1014702-41 = ""
1014702-43 = ""
1014702-44 = "Радуйтесь, Сенсей. Крем, который я сейчас на вас наношу, изготовлен по специальной формуле по заказу Общества Пандемониума."
1014702-45 = ""
1014702-47 = ""
1014702-48 = "С ним об ультрафиолете можно больше не беспокоиться."
1014702-49 = "[s3] «Спасибо, Сацуки».\n[s4] «Но не слишком ли много крема?»"
1014702-52 = ""
1014702-54 = ""
1014702-55 = "Чем больше, тем лучше. После этого понадобится ещё один флакон."
1014702-56 = "[s] «Ладно...»"
1014702-58 = "Так Сацуки вымазала на меня целых два флакона солнцезащитного крема."
1014702-60 = "Идеально. Блеск такой, что можно отражать даже видимый свет, не говоря уже об ультрафиолете."
1014702-61 = "Ну а теперь отправляйтесь развлекаться, Сенсей."
1014702-62 = "А я поставлю таймер."
1014702-63 = "[s] «Таймер?»"
1014702-64 = "Игры в воде быстрее истощают силы, повышая риск несчастных случаев и заболеваний."
1014702-65 = "Фу-фу, звучит ужасно, правда? Но я буду внимательно следить за временем."
1014702-66 = "Согласно исследованиям разведывательного комитета Общества Пандемониума, чередование двадцати пяти минут игр в воде и десяти минут отдыха меньше всего утомляет организм."
1014702-67 = "Сенсей, можете наслаждаться купанием следующие двадцать пять минут."
1014702-69 = "Вообще-то я даже не собирался заходить в воду, но всё-таки послушался Сацуки."
1014702-73 = "В итоге я замечательно провёл время в море."
1014702-74 = "Сенсей, прошло двадцать пять минут. Пора возвращаться!"
1014702-75 = "[ns] «А, я только разыгрался!»"
1014702-78 = "Фу-фу, это было заметно. Но ваше здоровье важнее всего."
1014702-79 = "Если вы подорвёте здоровье, это станет сокрушительным ударом для Геенны."
1014702-80 = "А теперь садитесь сюда и потихоньку пейте этот напиток."
1014702-81 = "[s5] «Настоящий курортный отдых».\n[s6] «Спасибо, что заботишься обо мне, Сацуки»."
1014702-84 = "Сенсей — человек, которого Общество Пандемониума просто обязано привлечь на свою сторону."
1014702-85 = "С точки зрения защиты и контроля такие меры совершенно естественны."
1014702-86 = ""
1014702-88 = ""
1014702-89 = "А, Сенсей. Не могли бы вы и мне нанести солнцезащитный крем?"
1014702-90 = "Даже под зонтиком отражённые водой и песком ультрафиолетовые лучи могут попасть на кожу."
1014702-91 = "А до своей спины я сама не дотянусь."
1014702-92 = ""
1014702-94 = ""
1014702-97 = "[ns] «Ох...»"
1014702-98 = "Ну же."
1014702-99 = "[s] «П-понял...»"
1014702-106 = "Хи-хи..."
1014702-107 = "У Сенсея руки немного шершавые, но в то же время нежные."
1014702-108 = "Можете развязать завязки, чтобы ничего не пропустить."
1014702-110 = "Я старательно нанёс крем Сацуки, а затем мы вместе улеглись под зонтиком и стали смотреть на волны."
