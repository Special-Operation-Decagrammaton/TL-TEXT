[translation]
10020015-5 = "Мы уничтожили Двигатель измерений Области 1!"
10020015-6 = ""
10020015-8 = ""
10020015-9 = ""
10020015-13 = "[ns] «П-Погодите!»"
10020015-14 = "Широко отступила. Её нигде не видно..."
10020015-15 = "[ns] «...»"
10020015-17 = "Широко убежала..."
10020015-18 = "Да, ещё до того, как Сенсей вообще успел что-либо сделать."
10020015-20 = "Ну... Ничего страшного."
10020015-21 = "Если Широко вмешивается, нам просто нужно ещё решительнее уничтожить этот Ковчег."
10020015-22 = "Рано или поздно ей придётся появиться."
10020015-23 = "И тогда у нас будет шанс нормально поговорить."
10020015-24 = "Это место изолировано. Ей некуда будет бежать. Широко окажется как крыса в ловушке."
10020015-25 = "Э-Это правда, но... Зачем сравнивать её с животным?"
10020015-27 = ""
10020015-33 = "Сейчас наша операция идёт довольно хорошо."
10020015-34 = "Мы успешно захватили Область 1 и уничтожили Двигатель измерений. Неплохое начало."
10020015-35 = "А главное — мы захватили четверть Ковчега. Эта часть его вычислительных возможностей теперь наша."
10020015-36 = "Да. Это значительно упрощает ситуацию."
10020015-37 = "Во-первых, теперь отсюда будет проще защищаться от атак. Врагам придётся прорываться через нашу новую систему обороны."
10020015-39 = "То есть можно немного перевести дух? Фух! Какое облегчение!"
10020015-40 = "И теперь мы можем войти в следующую область Ковчега."
10020015-41 = "Область 2, верно? Мы хорошо продвигаемся."
10020015-43 = "...Но расслабляться всё равно нельзя."
10020015-44 = "Сенсей, мы входим в Область 2 Ковчега Атрахасиса."
10020015-45 = "Продолжайте давать нам тактические указания."
