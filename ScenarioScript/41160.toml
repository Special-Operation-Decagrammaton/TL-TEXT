[translation]
41160-1 = "Эпизод 16;Скидка"
41160-2 = ""
41160-3 = ""
41160-5 = "Какое неприятное лицо."
41160-6 = "Разве ты не Бешеная гончая Полицейской школы Валькирии?"
41160-8 = "Огата Канна. А для тебя — директор."
41160-9 = "Не думаю, что мы с тобой настолько близки, чтобы переходить на прозвища."
41160-10 = "Прошу прощения, директор. Что вас сюда привело?"
41160-11 = "Странный вопрос для банды преступников, обращённый к офицеру Валькирии, не находишь?"
41160-12 = "Мы слишком долго позволяли вам, бродягам, творить что хотите. Вы арестованы за незаконную оккупацию общественного парка и терроризирование окрестностей."
41160-13 = "Эй, дурочка. Именно глава обороны сказала, что мы можем здесь жить."
41160-14 = "Хотите сказать, госпожа директор, что собираетесь пойти против распоряжения начальства?"
41160-15 = "Какая глупость."
41160-16 = "Скажи мне, когда именно глава разрешила вам здесь оставаться?"
41160-17 = "Она могла приостановить наказание, но никогда прямо не одобряла вашу оккупацию."
41160-18 = ""
41160-20 = ""
41160-21 = ""
41160-23 = "Она права. Управление парком относится к ведению Культурного отдела, а не Оборонного."
41160-24 = "Нам лишь приостановили исключение. Технически находиться здесь мы не имеем права."
41160-25 = "Значит, они просто выгонят кучку бездомных детей из парка?"
41160-26 = "Это вообще ничего не решает! Вы игнорируете настоящие проблемы."
41160-27 = "Н-Но почему нас арестовывает Бюро общественного порядка?"
41160-28 = "Р-Разве этим не должно заниматься Бюро безопасности?"
41160-29 = ""
41160-31 = ""
41160-33 = "Да, выселение бездомных входит в их обязанности. Если только мы, Бюро общественного порядка, не определим наличие террористической угрозы безопасности Кивотоса."
41160-34 = "Как в нынешней ситуации."
41160-36 = "Ладно, хорошо! Может, разрешения у нас и нет, но уходить мы не собираемся. Вы что, силой нас потащите?"
41160-37 = "Хи-хи-хи. Может, память у тебя плохая, но я помню, как в прошлый раз вы все сделали БА-БАХ и убежали, поджав хвост."
41160-38 = "Следи за языком, Казэкура Моэ. У Валькирии глаза и уши повсюду."
41160-39 = "Разве вы не потеряли почти всё оборудование во время ливня на прошлой неделе?"
41160-40 = "Уф."
41160-41 = "Я также знаю, что вы продали повреждённое снаряжение и купили новое, но этого всё равно недостаточно для защиты такого огромного парка."
41160-42 = "Почему бы не попробовать нас? Бюро общественного порядка недавно получило огневую мощь, о которой вам и не снилось, благодаря нашим спонсорам."
41160-43 = "Вас меньше, и оружие у вас хуже. Никакие элитные навыки боя из этой ситуации не вытащат."
41160-44 = ""
41160-46 = ""
41160-48 = ""
41160-50 = "У нас есть два варианта."
41160-51 = "Либо вы подчиняетесь и решаете всё тихо, либо вступаете в заведомо проигранный бой со своими бесполезными игрушечными пушками."
41160-53 = "Что? Вы бросаете вызов академии SRT?"
41160-54 = "Пушки вообще не моё любимое оружие. Может, познакомить вас с парочкой моих зажигательных малышей."
41160-55 = "Э-Этого хватит, чтобы п-победить? У нас даже боеприпасов нет..."
41160-56 = "Мияко, п-помоги..."
41160-57 = ""
41160-59 = ""
41160-61 = ""
41160-62 = "Отряд RABBIT, мы—"
41160-63 = "[s] «Подождите минуту.»"
41160-64 = ""
41160-66 = ""
41160-67 = "Сенсей? Что вы здесь делаете?"
41160-68 = "Ах, я забыла. Глава отдела действительно оставила судьбу отряда RABBIT на усмотрение Шале."
41160-69 = "Но вынуждена вас огорчить — даже вы тут ничего не решаете."
41160-70 = "Люди куда выше вашего уровня уже отдали приказ о перепланировке города Коусаги."
41160-71 = "[s1] «Нельзя просто выгнать их без предупреждения.»\n[s2] «Дайте им время всё обдумать.»"
41160-72 = "У них было более чем достаточно времени."
41160-73 = "У них было более чем достаточно времени."
41160-74 = ""
41160-76 = ""
41160-77 = "...Понятно."
41160-78 = "Считайте это выплатой долга. Сегодня я отступлю."
41160-79 = "Но мы не можем сидеть сложа руки вечно."
41160-80 = "Либо отряд RABBIT покидает парк до конца месяца, либо мы их выселим."
41160-81 = "...Даже мне приходится «держать строй», в конце концов."
41160-82 = ""
41160-84 = ""
41160-85 = "Отступаем! Операция отложена."
41160-86 = ""
41160-88 = ""
41160-90 = ""
41160-91 = ""
41160-95 = "Какая наглость! В прошлый раз мы вытирали ею пол, пока Сенсей не вмешался."
41160-96 = "Это не меняет того, что с тех пор Бюро общественного порядка значительно усилилось."
41160-97 = "Моэ. Ты смогла подтвердить, что их оружие произведено Кайзер Индастриз?"
41160-99 = "Ну да. Очевидно же — это именно то оружие, которое мы пытались купить у Кайзер."
41160-100 = "Как эти сопливые скряги из Валькирии смогли позволить себе настолько дорогое оружие? Не понимаю."
41160-101 = "Директор упомянула спонсора..."
41160-102 = "[s] «...Может, им дали скидку.»"
41160-103 = "Скидку?"
41160-104 = "Это стратегия продаж. Покупаешь у нас оптом — мы возвращаем тебе процент. Взаимная выгода."
41160-105 = "Но я вижу выгоду только для Валькирии. Что получает Кайзер?"
41160-107 = "(Я поделился своей теорией с отрядом RABBIT.)"
41160-110 = "...Понятно."
41160-111 = "Кайзер Construction отвечает за перепланировку города Коусаги и, как и Кайзер Индастриз, входит в одну группу. Перемещение средств между ними проблем не создаст."
41160-112 = "Единственное, что стоит между Кайзер Construction и прибылью, — бездомные Коусаги. Поэтому они снабжают Валькирию оружием от Кайзер Индастриз, а взамен..."
41160-114 = "Значит, эти грязные копы получают оружие за то, что выгоняют для Кайзер всех бездомных!"
41160-115 = "Разве это не незаконно?"
41160-116 = "Определённо незаконно."
41160-117 = "Если теория Сенсея верна, Полицейская школа Валькирии, которая должна служить людям, действует как наёмная организация ради частной выгоды."
41160-118 = "Полиция сговаривается с корпорациями ради денег? За счёт граждан?"
41160-119 = "Это несправедливо."
41160-120 = "М-Может, сейчас мы и не лучшие, но до такого не опустились."
41160-121 = "[s] «Конечно, это всего лишь моя теория.»"
41160-122 = "Всего лишь теория..."
41160-123 = "Пока у нас нет способа ни подтвердить, ни опровергнуть, как Бюро общественного порядка получило оружие."
41160-125 = "Все записи о транзакциях Валькирии хранятся на локальном сервере, так что даже взломать их не могу. А я точно пыталась."
41160-126 = "Если бы только удалось добыть доказательства..."
41160-127 = "М-Мы обречены?"
41160-128 = ""
41160-130 = ""
41160-132 = ""
41160-133 = "Можно проникнуть в главное здание Полицейской школы Валькирии и достать записи о транзакциях."
41160-135 = ""
41160-137 = ""
41160-138 = "Ты реально тупая?"
41160-139 = "В их школе как МИНИМУМ сотни вооружённых до зубов силовиков. Это крепость!"
41160-140 = "Д-Даже с припасами и поддержкой, думаю, это невозможно..."
41160-141 = "Сами мы п-провалимся..."
41160-142 = "Ненавижу это признавать, но нам остаётся лишь написать доклад и сидеть сложа руки."
41160-143 = "[s] «А куда вообще отправляют жалобу на полицейскую школу?»"
41160-144 = "...Хм. А правда, куда идти, если сама полиция переходит черту?"
41160-145 = "Если Полицейская школа Валькирии нарушает правила, единственная вторая силовая структура, способная её расследовать, — это..."
41160-146 = ""
41160-148 = ""
41160-150 = ""
41160-151 = "...Мы. Академия SRT."
41160-153 = "А кто ещё?"
41160-154 = "Именно для таких ситуаций мы и существовали."
41160-155 = "Н-Но... У нас есть полномочия?"
41160-156 = "У нас даже настоящей школы больше нет."
41160-157 = "[s] «Вы верите, что поступаете правильно?»"
41160-159 = "Сенсей?"
41160-160 = ""
41160-162 = ""
41160-163 = ""
41160-165 = "[ns3] «Действуйте. Последствия я возьму на себя.»\n[ns4] «Будьте осторожны. Вернитесь целыми.»"
41160-166 = ""
41160-167 = ""
41160-169 = ""
41160-170 = "...Вы и правда самый странный."
41160-171 = "Эй, Сенсей. Слово «ответственность» вообще есть в вашем словаре?"
41160-172 = "Вы тупой или что?"
41160-173 = "Т-Такой тупой... Хи-хи."
41160-174 = ""
41160-176 = ""
41160-178 = "Но вы кое о чём мне напомнили."
41160-179 = "Мы — SRT. Самое быстроразворачиваемое подразделение спецназа во всём Кивотосе."
41160-180 = ""
41160-182 = ""
41160-184 = "Мы подавляем любых преступников, нарушающих общественный порядок..."
41160-185 = "Караем их всей доступной огневой мощью..."
41160-186 = "...И-и бесшумно ликвидируем до того, как кто-нибудь поймёт, что произошло."
41160-188 = "Если руководство Валькирии действительно сговорилось с корпорацией, найти доказательства будет непросто."
41160-189 = "Цель этой миссии полностью соответствует задачам и справедливости, которые всегда защищала академия SRT."
41160-190 = ""
41160-192 = ""
41160-193 = "Отряд RABBIT! Начать подготовку к операции по проникновению!"
41160-194 = "С этого момента..."
41160-196 = "Начинаем операцию «Клевер» по добыче доказательств незаконной скидочной сделки Бюро общественного порядка Валькирии!"
41160-198 = "Следующий эпизод;Операция «Клевер», часть 1"
