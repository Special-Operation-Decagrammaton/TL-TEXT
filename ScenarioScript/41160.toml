[translation]
41160-1 = "Episódio 16;Propina"
41160-5 = "Você é..."
41160-6 = "O \"Cão Feroz\" da Academia de Polícia Valkyrie..."
41160-8 = "...É Kanna. Pelo menos me chame de Diretora do Departamento de Segurança Interna."
41160-9 = "Não que eu odeie o apelido, mas não temos intimidade para ficarmos nos chamando por apelidos, certo?"
41160-10 = "Diretora do Departamento de Segurança Interna, o que a traz aqui?"
41160-11 = "Está fazendo essa pergunta tendo plena consciência do que vocês andam fazendo?"
41160-12 = "Ouvi dizer que há indivíduos ocupando ilegalmente um parque público e causando inquietação na comunidade local... Só vim fazer a fiscalização."
41160-13 = "Mas quem disse que a gente podia ficar aqui foi a Chefe do Gabinete de Defesa, tá? Bem, por intermédio da Schale, mas ainda assim."
41160-14 = "A Diretora do Departamento de Segurança Interna da Valkyrie pode simplesmente desobedecer às ordens de uma superior?"
41160-15 = "Parece que houve algum mal-entendido."
41160-16 = "A Chefe do Gabinete de Defesa nunca disse \"vocês podem permanecer neste parque\"."
41160-17 = "Ela disse apenas que \"a punição de vocês seria suspensa\"."
41160-23 = "...Além disso, a administração do parque não é de jurisdição do Gabinete de Defesa."
41160-24 = "Ou seja, exigir nossa desocupação é legítimo... É isso que está dizendo?"
41160-25 = "...Mesmo sabendo que a gente não tem para onde ir."
41160-26 = "Que belo caráter você tem, hein, Diretora?"
41160-27 = "M-Mas o Departamento de Segurança Interna vindo pessoalmente...?"
41160-28 = "Se for uma questão de ordem pública, não seria jurisdição do Departamento de Segurança...?"
41160-33 = "Sim, em princípio."
41160-34 = "...Se fosse uma situação comum."
41160-36 = "Não entendi muito bem, mas você veio nos expulsar à força, então?"
41160-37 = "Por mim tudo bem, mas já esqueceu o fiasco que foi da última vez?"
41160-38 = "Kazekura, é melhor escolher suas palavras com cuidado."
41160-39 = "Pelo que ouvi dizer, quase todo o equipamento do Esquadrão RABBIT ficou encharcado na chuva forte de outro dia, não é?"
41160-40 = "..."
41160-41 = "Também soube que venderam itens usados para comprar novos equipamentos. Mas não é meio precário para cobrir o parque inteiro?"
41160-42 = "Desta vez, o Departamento de Segurança Interna garantiu uma grande quantidade de armas de fogo com o apoio de um patrocinador."
41160-43 = "Sei que vocês são a elite, mas conseguir reverter a vantagem numérica já é outra história."
41160-50 = "Vamos, decidam logo."
41160-51 = "Vão deixar este parque pacificamente ou querem tentar nos enfrentar com essas armas de má qualidade?"
41160-53 = "Hah, parece que ela está falando sério mesmo."
41160-54 = "Mesmo com poucas armas, ainda podemos dar uma bela lição em vocês, sabia?"
41160-55 = "M-Mas será que a gente consegue mesmo vencer...?"
41160-56 = "O-O que a gente faz, Miyako-chan...?"
41160-62 = "Nós..."
41160-63 = "[s] \"Podem esperar um pouco?\""
41160-67 = "...O Sensei da Schale? O que faz aqui...?"
41160-68 = "...Ouvi da Chefe do Gabinete de Defesa que o destino do Esquadrão RABBIT foi deixado inteiramente a cargo da Schale."
41160-69 = "No entanto, este é um assunto à parte. Mesmo sendo uma instrução do Sensei, não posso reverter a decisão."
41160-70 = "A revitalização de Kousagi Town já é um assunto decidido."
41160-71 = "[s1] \"Mas mandar elas saírem assim, de repente, complica um pouco.\"\n[s2] \"Pode dar só um tempinho para elas pensarem?\""
41160-72 = "Acredito que já tiveram tempo mais do que suficiente até agora..."
41160-73 = "Acredito que já tiveram tempo mais do que suficiente até agora..."
41160-77 = "...Muito bem."
41160-78 = "Estou em dívida com o Sensei... então vamos recuar por hoje."
41160-79 = "Contudo, não podemos deixar isso de lado para sempre."
41160-80 = "Por cima, acredito que o prazo seja até o fim deste mês. Se ainda estiverem neste parque nessa data, não teremos escolha a não ser usar a força."
41160-81 = "...Nós também temos uma \"linha que precisamos proteger\"."
41160-85 = "...Retirada!"
41160-95 = "Da última vez só conseguiram alguma coisa por causa da Schale e ainda vem posar de importante."
41160-96 = "Porém, é fato que o armamento delas foi reforçado."
41160-97 = "Moe, tem certeza de que aquelas eram armas da \"Kaiser Industry\"?"
41160-99 = "Aham."
41160-100 = "Mas falando sério, como é que aquela Valkyrie mão de vaca conseguiu comprar armas da Kaiser? Não consigo entender."
41160-101 = "Pensando bem, ela falou de um \"patrocinador\" agora há pouco..."
41160-102 = "[s] \"...Talvez propina.\""
41160-103 = "...\"Propina\"?"
41160-104 = "Tipo um \"retorno\"? Aquele esquema em que parte do valor pago volta?"
41160-105 = "Mesmo que seja isso, o que a \"Kaiser Industry\" ganharia fazendo uma coisa dessas pela Valkyrie...?"
41160-107 = "(Compartilhei o que eu estava pensando com todas do Esquadrão RABBIT)"
41160-110 = "...Entendi."
41160-111 = "A \"Kaiser Construction\", responsável pelo desenvolvimento de Kousagi Town, pertence ao mesmo conglomerado que a \"Kaiser Industry\", que fabrica armas."
41160-112 = "Movimentar recursos entre elas é relativamente simples. Se a \"Kaiser Industry\" estiver repassando antecipadamente, na forma de armas para o Departamento de Segurança Interna, o lucro que a \"Kaiser Construction\" espera obter com o desenvolvimento de Kousagi Town..."
41160-114 = "Em troca dessas armas, bastaria ao Departamento de Segurança Interna expulsar os desabrigados."
41160-115 = "...Isso não é ilegal?"
41160-116 = "Sim, é claro que é ilegal."
41160-117 = "Afinal, uma academia de polícia que deveria servir aos cidadãos está trabalhando para uma empresa privada."
41160-118 = "A polícia e uma empresa em conluio para atacar cidadãos..."
41160-119 = "Não faz o menor sentido."
41160-120 = "B-Bem, nós também não estamos numa posição muito boa para falar..."
41160-121 = "[s] \"Claro, tudo isso ainda é só especulação...\""
41160-122 = "É verdade."
41160-123 = "Nem sabemos ao certo se o Departamento de Segurança Interna realmente fez um acordo com a Kaiser Industry."
41160-125 = "Se são registros da Valkyrie, provavelmente estão num servidor local. Invadir de fora parece impossível."
41160-126 = "Tsc, se ao menos tivéssemos alguma prova decisiva..."
41160-127 = "Será que existe algum jeito...?"
41160-133 = "...Se nos infiltrarmos na Valkyrie, não deve haver registros da transação lá?"
41160-138 = "Miyako, você perdeu o juízo?"
41160-139 = "Você está falando do prédio principal da Valkyrie, né? Quantas centenas de pessoas você acha que tem naquela fortaleza?"
41160-140 = "Mesmo com apoio adequado, não seria difícil...?"
41160-141 = "Com a nossa força atual, provavelmente..."
41160-142 = "Não daria só para fazer uma denúncia normal?"
41160-143 = "[s] \"Denunciar um problema da polícia para a polícia?\""
41160-144 = "...Verdade. As duas são a Valkyrie."
41160-145 = "A instituição superior encarregada de investigar quando há algum problema na Valkyrie..."
41160-151 = "Deveria ser a SRT."
41160-153 = "É mesmo, pensando bem, é verdade."
41160-154 = "Então não temos escolha a não ser fazer isso... Caso contrário, ninguém mais vai resolver."
41160-155 = "Mas será que tudo bem...?"
41160-156 = "Agora nem escola nós temos..."
41160-157 = "[s] \"...Se é nisso que vocês acreditam.\""
41160-159 = "...Sensei?"
41160-165 = "[ns3] \"Podem ir, se acontecer alguma coisa, eu assumo a responsabilidade.\"\n[ns4] \"Tentem não se machucar, tá?\""
41160-170 = "...Você é mesmo uma pessoa estranha."
41160-171 = "Sensei, você sabe mesmo o que significa a palavra \"responsabilidade\"?"
41160-172 = "Hah, sabia que era um idiota mesmo."
41160-173 = "Hehe..."
41160-178 = "Mas, graças a você, nossa determinação está firmada."
41160-179 = "...Nós somos a SRT. A força especial enviada na linha de frente contra crimes complexos em Kivotos."
41160-184 = "Para manter a ordem, neutralizamos os criminosos rapidamente..."
41160-185 = "Descarregamos todo o poder de fogo possível num piscar de olhos..."
41160-186 = "...E deixamos o local antes de sermos notadas."
41160-188 = "A Valkyrie está em conluio com uma empresa privada para cometer atos ilícitos... Por mais alta que seja essa probabilidade, não será possível esclarecer isso pelos trâmites normais."
41160-189 = "Esta é exatamente a missão em que devemos intervir como SRT."
41160-193 = "Todas, preparem-se para a operação."
41160-194 = "A partir de agora, para assegurar as provas da propina ilegal do Departamento de Segurança Interna da Valkyrie..."
41160-196 = "Iniciamos a \"Operação Trevo\"!"
41160-198 = "Próximo;Operação Trevo (1)"
