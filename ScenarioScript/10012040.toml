[translation]
10012040-1 = "Эпизод 4; Я пришла спасти Сенсея"
10012040-2 = "Да что с тобой, чёрт возьми, не так?! Мы не об этом договаривались!"
10012040-4 = "Что ты скажешь в своё оправдание? Лучше начинай говорить, и быстро!"
10012040-5 = "Так все слухи о твоей силе — просто развод?!"
10012040-6 = ""
10012040-9 = ""
10012040-11 = "Не думаю, что она нас слушает..."
10012040-12 = "Похоже, придётся самим с ней разобраться..."
10012040-13 = ""
10012040-16 = "......"
10012040-17 = "Сенсей... Почему Сенсей здесь?"
10012040-18 = "Разве это не ожесточённое поле боя, где группировки сражаются за право владения землёй?"
10012040-19 = "У тебя уши есть, Вакамо? Хватит нас игнорировать!"
10012040-20 = "Сенсей никогда не стал бы участвовать в таком жестоком деле..."
10012040-21 = "Значит, Сенсея... похитили?"
10012040-23 = "Ты собираешься объяснить нам, что происходит, или продолжишь бормотать чушь?"
10012040-25 = "...!"
10012040-26 = "Эти хитрые лисицы наверняка обманули Сенсея! Ах, мой дорогой Сенсей слишком доверчив!"
10012040-27 = "...Ва-ка-мо!"
10012040-28 = "Нам нужно идти..."
10012040-29 = "А?"
10012040-30 = "...Нам нужно... Сенсея..."
10012040-31 = "Нам нужно идти спасать Сенсея!"
10012040-33 = "Сенсей? О чём ты вообще?"
10012040-34 = "Наверное, она говорит про того взрослого, который там был."
10012040-35 = "Что за чушь теперь? С какой стати нам спасать нашего врага?"
10012040-37 = "Простите?"
10012040-38 = "Кого это вы называете нашим врагом?"
10012040-39 = "Вы ведь не можете иметь в виду Сенсея."
10012040-40 = "Конечно, его. А кого ещё?"
10012040-41 = ""
10012040-43 = ""
10012040-45 = ""
10012040-46 = "У кого-нибудь ещё сейчас мурашки по спине пробежали?"
10012040-47 = "Д-Да... Она как будто внезапно стала совсем другой..."
10012040-48 = "Вы вообще о чём?"
10012040-49 = "Э-Эй! Что это за взгляд такой?!"
10012040-51 = "Хи-хи-хи!"
10012040-52 = "Вам следует знать... так говорить о Сенсее незаконно."
10012040-53 = "Позвольте мне дать вам немного... наставлений."
10012040-55 = "Наставлений?"
10012040-56 = "Единственное, в чём ты должна нас наставлять, — это как победить."
10012040-58 = "Хи-хи."
10012040-59 = ""
10012040-61 = ""
10012040-62 = "Начиная с этого момента..."
10012040-63 = ""
10012040-65 = ""
10012040-67 = ""
10012040-68 = ""
10012040-69 = ""
10012040-71 = ""
10012040-72 = "Добро пожаловать на учение Вакамо."
10012040-73 = ""
10012040-83 = ""
10012040-85 = "*шум прибоя*"
10012040-86 = ""
10012040-90 = ""
10012040-91 = "Вот мой улов. Рапаны, морские ушки и немного водорослей."
10012040-92 = "Ого. Это где-то вдвое больше, чем собрала я."
10012040-93 = "Отличная работа. Пожалуйста, сложи всё в этот контейнер."
10012040-94 = "Хорошо... Спасибо."
10012040-95 = ""
10012040-97 = ""
10012040-98 = ""
10012040-99 = "Каким-то образом мы снова оказались прямо здесь, да?"
10012040-100 = "До сих пор видны следы нашей прошлой драки..."
10012040-102 = "Ага, ага. Я правда не ожидала, что на этом острове будет кто-то ещё."
10012040-103 = "Ну, по крайней мере, мы все вместе. Теперь они не смогут устроить нам засаду."
10012040-104 = "Хотя было бы лучше разделиться на две команды. Если бы не эти бандиты в шлемах..."
10012040-105 = "Серьёзно, крушение вертолёта, восстановление курорта и драка... С момента приземления нас швыряет как на американских горках."
10012040-106 = "Я понимаю, что нам нужна еда, но точно ли безопасно снова сюда возвращаться?"
10012040-108 = "..."
10012040-109 = "Меня тоже это немного беспокоит. Одно присутствие Вакамо уже было слегка пугающим."
10012040-110 = "Не волнуйся. Будем придерживаться плана."
10012040-111 = "Если она вернётся, просто разберёмся с ней. Всё просто."
10012040-112 = "Не уверена, что я бы назвала это простым..."
10012040-113 = "...Хм. Я скоро вернусь."
10012040-114 = ""
10012040-116 = ""
10012040-117 = ""
10012040-120 = ""
10012040-122 = "...Х-Хорошо."
10012040-123 = "Ну ты и паникёрша, Аяне! С Широко всё будет хорошо!"
10012040-124 = "[s1] «Мне кажется, Широко считает, что избегать боя — значит проиграть.»\n[s2] «Да мы всё равно не смогли бы её остановить.»"
10012040-127 = "С ней всё будет нормально! Молодёжь вроде неё всегда выкладывается на полную."
10012040-128 = "Точно не смогли бы! Отбери у неё удочку — она просто прыгнет в океан."
10012040-129 = "Благодаря ей мы и правда здорово продвинулись по списку дел."
10012040-130 = "Кто знает? Может, с этими бандитами получится просто договориться!"
10012040-131 = "О! У меня идея! Курорт такой большой, давайте просто проведём линию посередине и поделим его!"
10012040-132 = "Знаешь, их «Ты заплатишь, когда я увижу тебя в следующий раз!» заставляет меня думать, что не выйдет."
10012040-133 = "Вообще-то, возможно, Нономи права."
10012040-134 = "Мы не станем друзьями за одну ночь, но, может быть, сумеем прийти к компромиссу."
10012040-135 = "Единственное, что меня по-настоящему беспокоит, — это... Вакамо."
10012040-136 = "[s3] «Вакамо?»\n[s4] «Почему она тебя беспокоит?»"
10012040-137 = "М-Может, я просто слишком много думаю об этом, но..."
10012040-138 = "М-Может, я просто слишком много думаю об этом, но..."
10012040-139 = "У меня просто плохое предчувствие насчёт того, если Широко и Вакамо начнут драться."
10012040-140 = "Нашли тебя!"
10012040-141 = "...О боже."
10012040-142 = "[s5] «Как вовремя.»\n[s6] «Легко вспомнить...»"
10012040-143 = "Ты серьёзно снова пришла?! Третий раз точно не будет счастливым!"
10012040-144 = "Ты серьёзно снова пришла?! Третий раз точно не будет счастливым!"
10012040-145 = "Так это... Вакамо?"
10012040-146 = "Сенсей! Я пришла! Я здесь, чтобы спасти вас!"
10012040-147 = "...Да. Это она."
10012040-148 = "...А?"
10012040-149 = "Она только что сказала «спасти»?"
10012040-150 = "И от чего, по-твоему, ты собираешься спасать Сенсея, а?!"
10012040-151 = ""
10012040-153 = ""
10012040-155 = ""
10012040-156 = "Подумать только, моего дорогого Сенсея похитили и держат в заложниках в таком ужасном месте!"
10012040-157 = "Я бы никогда не позволила этому случиться, будь я рядом с вами."
10012040-158 = "Простите, что опоздала."
10012040-159 = "Но я ещё не слишком поздно пришла, чтобы вас спасти!"
10012040-160 = "Я иду, Сенсей!"
10012040-161 = ""
10012040-163 = ""
10012040-165 = ""
10012040-167 = ""
10012040-168 = "...Она серьёзно?"
10012040-169 = "Ого! Как круто! Сначала грабители банков, а теперь мы ещё и похитители!"
10012040-170 = "Хех! А я и не знала."
10012040-171 = "Ага, ага! На самом деле мы очень страшные люди! ☆"
10012040-172 = "Хватит подыгрывать! Они же ещё поверят!"
10012040-174 = "В-Все, пожалуйста, подождите! Я хотела бы договориться!"
10012040-175 = "А, точно! Да! Здесь столько места, почему бы нам не поделиться?"
10012040-177 = "...Договориться?"
10012040-178 = "Хи-хи-хи... Договориться... Как смешно..."
10012040-179 = "Все, в атаку! Я сама спасу Сенсея!"
10012040-180 = "...Я так понимаю, это «нет»?"
10012040-182 = "Ого... Эм! В атаку! В ата-а-аку!"
10012040-183 = "В-Вперёд, все!"
10012040-184 = "Капитан, как вообще до этого дошло?!"
10012040-185 = "Неважно! Просто заткнись и делай, что я говорю."
10012040-186 = "В атаку! В ата-а-аку!"
