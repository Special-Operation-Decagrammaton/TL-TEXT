83303600200-7 = "(Макото поставила все эти статуи... да ещё и за счёт бюджета Префектурной команды.)"
83303600200-8 = "(И умудрилась полностью скрывать свои планы, пока они не зашли слишком далеко, чтобы их было легко остановить...)"
