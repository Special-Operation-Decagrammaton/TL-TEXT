[translation]
51260-1 = "Эпизод 26;Несущие желания"
51260-2 = "И вот, наконец, эта глава истории Хяккияко подошла к концу."
51260-5 = "Нам нужно больше досок и гвоздей сюда!"
51260-6 = "Разве кто-то раньше не просил молоток?"
51260-7 = ""
51260-10 = "Да! Сюда, пожалуйста!"
51260-13 = "Заявки на выдачу материалов можно сдавать здесь!"
51260-14 = "Помните: если вам нужно оборудование, сначала заполните заявку!"
51260-15 = "Пожалуйста, встаньте в одну очередь!"
51260-16 = "[s] «Слишком много энергии. Их даже утро боится...»"
51260-17 = ""
51260-19 = ""
51260-20 = "Сенсей! Сенсей!"
51260-21 = "Добро пожаловать, Сенсей!"
51260-22 = ""
51260-23 = "Фестивальный отдел изо всех сил старается всё починить к повторному фестивалю!"
51260-24 = "[s1] «Наверное, чинить придётся очень многое.»\n[s2] «Вы снова проводите фестиваль?»"
51260-27 = "Да! То, что случилось, конечно, печально..."
51260-28 = "Но после обсуждения и благодаря помощи множества людей было решено, что фестиваль всё равно должен продолжиться!"
51260-29 = "Хотя мне ужасно стыдно... Не могу поверить, что во время всего этого хаоса мы были без сознания..."
51260-30 = "Я никогда не прощу этих призраков!"
51260-32 = "Я тоже! Хотелось сражаться вместе со всеми."
51260-33 = "Вот именно! Срывать фестиваль непростительно!"
51260-34 = "[s] «Но вы все очень старались.»"
51260-36 = "Спасибо..."
51260-37 = "Нас всё ещё гложет, что мы ничего не смогли сделать. Так что спасибо вам за то, что защитили всех во время происшествия."
51260-38 = "А Фестивальный отдел отблагодарит всех, устроив лучший повторный фестиваль на свете!"
51260-39 = "После всего случившегося людям нужен повод для праздника..."
51260-41 = "Как всегда, вы правы, президент!"
51260-42 = "Здания сгорели, декорации уничтожены, еда пропала — но это не значит, что фестиваль закончился!"
51260-44 = "Стоит приложить немного усилий — и всё сломанное можно починить."
51260-45 = "Правда ведь, Сенсей?"
51260-46 = "[s] «Именно так, Шизуко.»"
51260-47 = "Хи-хи-хи!"
51260-48 = ""
51260-50 = ""
51260-51 = "Хорошо! У нас полно работы, Фестивальный отдел!"
51260-53 = ""
51260-54 = "За дело!"
51260-56 = "О, Сенсей."
51260-57 = ""
51260-60 = ""
51260-61 = ""
51260-63 = ""
51260-64 = "Как всегда, спасибо за всё, что вы делаете."
51260-65 = "[s] «Да ничего особенного.»"
51260-66 = ""
51260-68 = ""
51260-71 = ""
51260-72 = ""
51260-73 = ""
51260-74 = ""
51260-75 = ""
51260-76 = ""
51260-77 = ""
51260-79 = ""
51260-80 = ""
51260-81 = ""
51260-82 = ""
51260-84 = ""
51260-86 = ""
51260-87 = ""
51260-89 = "Люди усердно разбирали последствия пожаров."
51260-90 = "Они восстанавливают всё из пепла после сражения... стараются вернуть место, с которым связано столько дорогих им воспоминаний."
51260-93 = "И ещё..."
51260-99 = "[ns] «Да, алло?»"
51260-106 = "Добро пожаловать, Сенсей."
51260-107 = "Я позвала вас довольно внезапно. Спасибо, что пришли."
51260-108 = "[s] «Если Ния зовёт, я всегда прибегу.»"
51260-109 = "Ня-ха-ха. Я запомню ваши слова."
51260-110 = "Перейдём к делу."
51260-111 = "Я хотела доложить вам о последствиях происшествия."
51260-112 = "Начнём с Хяккарёран."
51260-113 = ""
51260-115 = ""
51260-116 = "Его расформирование пока приостановлено."
51260-117 = "[s] «Приостановлено? Не отменено совсем?»"
51260-118 = "К сожалению, да. Как вы прекрасно знаете, ключевые руководители действительно вернулись в Хяккарёран."
51260-119 = "Но одной из главных причин упадка клуба стал массовый уход участников после исчезновения Нагусы. Такое за одну ночь не исправить."
51260-120 = "[s] «А что будет, если это не исправить?»"
51260-121 = "Ну, как минимум они не смогут получать финансирование."
51260-122 = "[s] «Это довольно серьёзная проблема.»"
51260-123 = "Ня-ха-ха! Вот именно!"
51260-124 = "Но со временем они обязательно снова встанут на ноги."
51260-125 = "Ещё я хотела поговорить с вами о Кузунохе."
51260-126 = "[s] «В другой раз. Будем решать всё по очереди.»"
51260-127 = "Если вы так считаете..."
51260-128 = "Что ещё... Шизуко руководит восстановительными работами и одновременно готовит фестиваль к повторному открытию."
51260-129 = "А. И ещё кое-что."
51260-130 = "Теперь о более серьёзном вопросе..."
51260-131 = "Та участница «Красоты природы», с которой сражались Сенсей и члены Хяккарёран..."
51260-132 = "Ябуки Сюро."
51260-135 = ""
51260-136 = "Клуб Инь-Ян сделал всё возможное, чтобы выследить её после побега."
51260-137 = "Но мы потеряли её прямо у границы района Хяккияко."
51260-138 = "До сих пор ломаем голову. Она просто растворилась в воздухе."
51260-139 = "Будто наложила на нас какое-то заклинание."
51260-140 = "[s] «Она и не выглядела человеком, который сдастся без сопротивления.»"
51260-141 = ""
51260-143 = "[ns] «Ты отлично справилась, Ния. Сейчас просто сосредоточься на фестивале.»"
51260-144 = "...Во всём виновата я."
51260-145 = "[s] «Хм?»"
51260-146 = "Я проявила беспечность, даже излишнюю самоуверенность."
51260-147 = "Если бы я серьёзнее отнеслась к тому первому письму, ничего этого бы не случилось."
51260-148 = "Я приняла его за шутку, и из-за этого пострадал весь Хяккияко."
51260-149 = "Мне трудно смотреть в глаза другим ученикам... и вам."
51260-150 = "[s] «Тебе всё-таки стоит держать голову выше.»"
51260-151 = ""
51260-153 = ""
51260-154 = "...Что?"
51260-155 = "[s3] «Ния, разве не ты сама это говорила?»\n[s4] «Что „Красота природы“ была слухом о слухе.»"
51260-158 = "[ns5] «Нельзя гоняться за каждым слухом или шёпотом, который услышишь.»\n[ns6] «Ты приняла разумное решение, исходя из информации, которая у тебя была.»"
51260-159 = "Если бы я была осторожнее..."
51260-160 = "Мне всё равно так не кажется..."
51260-163 = "[ns7] «И ты не проигнорировала это. Ты позвонила мне.»\n[ns8] «Ты сделала всё, что могла, чтобы защитить учеников.»"
51260-166 = "[ns9] «Без тебя я бы не успел вовремя.»\n[ns10] «И за это я тобой очень горжусь, Ния.»"
51260-167 = ""
51260-168 = ""
51260-170 = ""
51260-171 = "Сенсей..."
51260-172 = "Весь этот фестиваль обернулся катастрофой."
51260-173 = "Почему вы... именно сейчас мной гордитесь?"
51260-174 = "[s11] «Моя обязанность — похвалить хорошо выполненную работу.»\n[s12] «И поддержать ученика, когда он всё же ошибается.»"
51260-177 = "Ня-ха. Наверное, вы правы."
51260-178 = "Я не могу вечно гадать, что могла сделать иначе, или мечтать изменить прошлое."
51260-179 = "Теперь, когда я знаю о существовании «Красоты природы», придётся узнать о ней больше. Я сделаю всё, что смогу."
51260-180 = "В следующий раз, когда Шале понадобится помощь, зовите. Я тут же прибегу. Ня-ха-ха!"
51260-181 = "[s] «И ещё одно. Моя награда?»"
51260-182 = "...Награда?"
51260-183 = "Ох, прошу прощения. Конечно."
51260-184 = "Я могу посмотреть расчёты. Без вас мы бы не справились, поэтому крупное..."
51260-185 = ""
51260-187 = ""
51260-188 = "...Хм? Вы хотите другую награду?"
51260-189 = "...Вы хотели погладить Чисэ? Ч-Что это вообще значит..."
51260-190 = "[s] «Но раз Чисэ занята делами Клуба Инь-Ян...»"
51260-193 = "[ns] «Тогда я поглажу Нию!»"
51260-194 = ""
51260-196 = ""
51260-197 = "Сенсей... Вы ведь шутите, правда?"
51260-198 = "Э-Эм..."
51260-199 = ""
51260-201 = ""
51260-202 = ""
51260-203 = "П-П-Подождите! Вы серьёзно?! Сенсей!"
51260-204 = ""
51260-209 = "А-а-а-а?!"
51260-214 = "Во время фестиваля, призванного чествовать Хяккияко, всем пришлось пережить немало трудностей."
51260-215 = "Шрамы от происшествия навсегда останутся на достопримечательностях и в сердцах учеников."
51260-218 = "Но Хяккияко не из тех, кого чудовища заставят отказаться от фестиваля."
51260-221 = ""
51260-222 = "Вы пришли, Сенсей!"
51260-223 = "Мы вас заждались."
51260-225 = "...Здравствуйте."
51260-226 = "[s] «Привет всем! Вы на патруле?»"
51260-228 = "Ага! Это первое задание нового и улучшенного Хяккарёран!"
51260-229 = "Исторический момент, Сенсей. Даже не вздумайте его забыть!"
51260-230 = "Обычный патруль. Таких у нас ещё тысяча будет."
51260-231 = ""
51260-233 = ""
51260-234 = "Что?!"
51260-235 = "[s] «Ну-ну. Давайте спокойно всё обсудим.»"
51260-236 = "Да как мне это оплачивать, если они постоянно устраивают фестиваль заново?"
51260-237 = "[s] «Проблема была в деньгах?!»"
51260-238 = "Не преуменьшайте серьёзность вопроса, Сенсей!"
51260-239 = "Президент Фестивального отдела — страшная женщина. На этих фестивалях она выжмет из вашего кошелька последнюю монету!"
51260-241 = "...Просто не попадитесь."
51260-242 = "[s] «Не думаю, что Кикё это особо волнует... Но где Юкари?»"
51260-244 = "О, она..."
51260-245 = ""
51260-249 = "Здесь! Я, Юкари, уже здесь!"
51260-251 = "Ты благополучно вернулась!"
51260-252 = "...Юкари."
51260-253 = "Задание прошло успешно?"
51260-255 = "Ещё как! Я поднялась прямо по ступеням особняка и высказала семье всё, что думаю!"
51260-256 = "[s] «Семье? Что случилось?»"
51260-257 = "Сегодня утром я навестила семью Кадэнокодзи!"
51260-258 = "И сказала им, что они больше не смогут заставлять меня быть мико!"
51260-260 = "Решительный подход. Мне нравится."
51260-261 = "Это... правда нормально?"
51260-262 = "...Действовать безрассудно — вполне в её характере."
51260-263 = "Эй! Вы двое! Сейчас вы должны замолчать и сказать Юкари: «Делай что хочешь!»"
51260-264 = "Но..."
51260-266 = "Я ничего не делала сгоряча! Я действительно всё как следует обдумала. Даже составила список плюсов и минусов."
51260-267 = "В итоге выбор оказался простым. Моё место — в Хяккарёран!"
51260-268 = ""
51260-271 = ""
51260-272 = "...Да. Именно там."
51260-274 = "И знаете что? Они всплеснули руками и сказали, что ничего не могут поделать, раз я так решительно настроена!"
51260-275 = "[s] «Рад за тебя.»"
51260-276 = "Спасибо, Сенсей! Пусть сегодняшний день станет первым официальным днём нового Хяккарёран. И первым официальным днём создания легенды о Юкари из Хяккарёран."
51260-277 = ""
51260-279 = ""
51260-280 = "Раз с делами покончено, идём!"
51260-281 = "[s] «Идём? Куда?»"
51260-283 = "Ой, мы вам не сказали."
51260-284 = "Перед началом патруля Юкари попросила нас присутствовать на одном фестивальном мероприятии."
51260-285 = "Мы запустим в небо фонари в знак нашего нового начала."
51260-286 = "[s] «А! Главное событие фестиваля!»"
51260-288 = "Именно! Скорее, все!"
51260-293 = "Фестиваль снова начался в полную силу."
51260-298 = ""
51260-299 = ""
51260-301 = ""
51260-303 = "Для учеников Хяккияко это стало доказательством, что, приложив немного усилий, можно исправить что угодно."
51260-304 = "А четыре студенты, запустившие свои фонари в небо, уверенно двигались вперёд к своим целям."
51260-308 = ""
51260-309 = ""
51260-311 = ""
51260-312 = ""
51260-316 = ""
51260-317 = "Моя правая рука, возможно, никогда полностью не восстановится."
51260-318 = "Но теперь всё хорошо, Аямэ. Вместе с новым Хяккарёран я—"
51260-325 = "Каждый студент отправил в небо своё искреннее желание."
51260-326 = "Фонари унесли чувства, долго скрывавшиеся в их сердцах."
51260-327 = "Их надежды на будущее сияли высоко над ними."
51260-328 = "Во веки веков."
51260-342 = ""
51260-343 = "Уа-а-а! Кокурико! Уа-а-а-а-а!"
51260-344 = ""
51260-349 = "С возвращением, Сюро."
51260-350 = "Я... Я правда, правда старалась изо всех сил! Я всё сделала правильно!"
51260-351 = "Но я не смогла создать для тебя новое Фантомное сказание! Моя история о призраках пошла не по плану!"
51260-352 = "Прости-и-и!!!"
51260-353 = "Я хотела принести тебе идеального призрака!"
51260-354 = "Хи-хи. Сюро всегда такая милая."
51260-355 = "Вытри слёзы, малышка."
51260-356 = "В одном ты, может, и потерпела неудачу, зато успешно воссоздала Фестиваль фонарей прошлого."
51260-358 = "*шмыг* Я... Я достаточно хорошо справилась?"
51260-359 = "Конечно..."
51260-360 = "Фестиваль завершён. Семена посеяны, и однажды из них расцветёт новая история."
51260-361 = "Этого более чем достаточно."
51260-363 = "А в следующий раз мы сможем написать концовку так, как захотим сами."
51260-364 = ""
51260-366 = ""
51260-367 = "Будь терпелива и жди своего часа. Шаг за шагом, вместе."
51260-368 = "Мы создадим красоту, способную сжечь весь мир."
51260-373 = "[log=코쿠리코][ff4444]Наши собственные сто историй о призраках.[-][/log]"
51260-378 = "Хяккарёран;Продолжение в главе 2"
