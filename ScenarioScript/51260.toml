[translation]
51260-1 = "Episódio 26;Com um Desejo no Coração"
51260-2 = "(A situação que mergulhou Hyakkiyako no caos finalmente se acalmou —)"
51260-5 = "Traz os materiais pra cá!"
51260-6 = "Onde precisam de um martelo?"
51260-10 = "Ah, aqui, por favor!"
51260-13 = "Sim, estamos recebendo os formulários de inscrição aqui!"
51260-14 = "Se precisarem de equipamentos ou materiais, preencham o formulário aqui, por favooor!"
51260-15 = "Ainda temos tempo, então sem pressa, podem ir com calma!"
51260-16 = "[s] \"Bom trabalho, pessoal, já na ativa tão cedo.\""
51260-20 = "Ah, Sensei!"
51260-21 = "Olá, Sensei!"
51260-23 = "Hehe! O Comitê de Organização de Festivais está unindo forças e dando tudo de si para reviver o festival!"
51260-24 = "[s1] \"Ainda mais depois de tudo o que acabou de acontecer, né.\"\n[s2] \"Então decidiram mesmo realizar o festival de novo?\""
51260-27 = "Sim. Foi uma situação que ninguém poderia prever..."
51260-28 = "Com a compreensão de muita gente, conseguimos organizar tudo para retomar o evento."
51260-29 = "Mesmo assim... pensar que o Comitê de Organização de Festivais inteiro desmaiou bem no meio daquela confusão..."
51260-30 = "É frustrante e imperdoável!!!"
51260-32 = "Isso mesmo! Se aquilo não tivesse acontecido, nós também teríamos lutado com força total!"
51260-33 = "Sim, porque aquilo de jeito nenhum pode ser chamado de festival!"
51260-34 = "[s] \"Mas eu sei o quanto o pessoal do Comitê de Organização de Festivais se esforçou.\""
51260-36 = "Muito obrigada..."
51260-37 = "Mas somos eternamente gratas a você, Sensei, e a todos de Hyakkiyako por terem resolvido a situação."
51260-38 = "Bom, e é justamente por isso que vamos dar o nosso máximo para reabrir o festival!"
51260-39 = "Mas... que bom que a questão do Hyakkaryouran foi resolvida em segurança."
51260-41 = "Sim, Presidente!"
51260-42 = "As instalações foram destruídas e o local do festival virou uma bagunça... mas o festival ainda não acabou!"
51260-44 = "Isso mesmo! Se quebrou, é só consertar."
51260-45 = "Não é verdade, Sensei?"
51260-46 = "[s] \"Sim, a Shizuko tem toda razão.\""
51260-47 = "Ehehe."
51260-51 = "Muito bem, Comitê de Organização de Festivais! Vamos à ação!"
51260-54 = "Isso aí!!"
51260-56 = "Ah! E mais uma coisa, Sensei."
51260-64 = "Muito obrigada pelo seu trabalho duro desta vez também."
51260-65 = "[s] \"De nada.\""
51260-89 = "(Mesmo após a tragédia, as pessoas seguem trabalhando sem parar.)"
51260-90 = "(Se quebrou, é só consertar — unindo forças com todos para recuperar o dia a dia.)"
51260-93 = "(E então —)"
51260-99 = "[ns] \"Alô, pois não?\""
51260-106 = "Ah, você chegou, Sensei~"
51260-107 = "Obrigada por vir, mesmo sendo um chamado tão repentino."
51260-108 = "[s] \"Como era um chamado da Niya, vim correndo o mais rápido que pude.\""
51260-109 = "Nyaha. Essa sua lábia afiada... já chega a ser até refrescante, sabia?"
51260-110 = "O motivo de eu ter entrado em contato hoje é..."
51260-111 = "Queria fazer um relatório sobre o assunto de uns dias atrás."
51260-112 = "Sobre o Comitê de Mediação de Conflitos Hyakkaryouran..."
51260-116 = "A dissolução foi suspensa♪"
51260-117 = "[s] \"Suspensa? Não cancelada?\""
51260-118 = "Pois é. O fato de os membros principais terem se reunido a partir do caso da Yukari-san é admirável, eu diria~"
51260-119 = "Nyaha. Mas houve uma saída atrás da outra no comitê, né? Enquanto não resolverem esse problema, o futuro do Hyakkaryouran continua incerto~"
51260-120 = "[s] \"Futuro incerto, como assim...?\""
51260-121 = "Por exemplo, não receberem a verba de atividades... quem sabe~?"
51260-122 = "[s] \"Com certeza isso é bem preocupante?!\""
51260-123 = "Nyahaha~ Mas, pelo ritmo atual..."
51260-124 = "Pode levar um tempo, mas acho que elas vão se reerguer rapidinho."
51260-125 = "Ah, é verdade... quanto às pistas sobre a Kuzunoha —"
51260-126 = "[s] \"Quanto a isso, tudo bem. Podemos ir com calma.\""
51260-127 = "...Entendo."
51260-128 = "De qualquer forma, a Shizuko-san e o pessoal continuam na restauração, e tanto os envolvidos quanto as associações comerciais estão se esforçando, então o festival deve reabrir em breve."
51260-129 = "E também —"
51260-130 = "Mais uma coisa — falando sério agora."
51260-131 = "A aluna do Clube Beleza da Natureza contra quem você e o Hyakkaryouran lutaram até o fim..."
51260-132 = "Yabuki Shuro, não era?"
51260-136 = "O Clube Yin-Yang tentou rastrear ela depois que desapareceu, mas..."
51260-137 = "Infelizmente, os rastros dela sumiram assim que saiu do Distrito Autônomo de Hyakkiyako."
51260-138 = "Não sei que método ela usou, mas ao cruzar a fronteira do distrito, foi como se tivesse virado fumaça..."
51260-139 = "É como se tivéssemos sido enfeitiçados por uma raposa, não acha?"
51260-140 = "[s] \"Entendo... não ia ser fácil capturar ela, né.\""
51260-143 = "[ns] \"Bom trabalho, Niya. Por enquanto, vamos cuidar da preparação do local...\""
51260-144 = "...A falha foi minha."
51260-145 = "[s] \"Hum?\""
51260-146 = "Eu subestimei a situação."
51260-147 = "Eu não devia ter ignorado o aviso do Clube Beleza da Natureza.#nO resultado foi uma tragédia dessa proporção."
51260-148 = "Por causa do meu descuido, Hyakkiyako ficou com cicatrizes profundas..."
51260-149 = "Não tenho nem cara para olhar para você, Sensei, muito menos para o pessoal de Hyakkiyako —"
51260-150 = "[s] \"Não é verdade.\""
51260-154 = "...Hã?"
51260-155 = "[s3] \"Você mesma disse. O Clube Beleza da Natureza era só uma lenda...\"\n[s4] \"Normalmente nem valeria a pena se preocupar.\""
51260-158 = "[ns5] \"Se a gente fosse ter medo de cada rumor ou lenda, não faria nada.\"\n[ns6] \"Você tomou a decisão com base nas informações que tinha em mãos, Niya.\""
51260-159 = "Mas..."
51260-160 = "Mas..."
51260-163 = "[ns7] \"Além disso, você me chamou para Hyakkiyako, Niya.\"\n[ns8] \"Foi porque estava preocupada com todo mundo, não foi?\""
51260-166 = "[ns9] \"Graças a isso eu pude estar lá...\"\n[ns10] \"Na verdade, eu tenho muito orgulho desse seu lado, Niya.\""
51260-171 = "Sensei..."
51260-172 = "Mesmo tendo se envolvido numa confusão dessas..."
51260-173 = "Você diz que eu fiz um bom trabalho... que tem orgulho de mim."
51260-174 = "[s11] \"Elogiar quando é preciso...\"\n[s12] \"E encorajar quando algo dá errado — é isso que um Sensei faz.\""
51260-177 = "...Em vez de ficar remoendo os erros, devo olhar para frente, é isso?"
51260-178 = "Nyaha... se você insiste tanto assim."
51260-179 = "Agora que a existência do Clube Beleza da Natureza foi confirmada, vou vasculhar os registros antigos do Clube Yin-Yang para conseguirmos rastreá-los no futuro."
51260-180 = "Vou levar suas palavras muito a sério e dar total apoio à Schale. Nyahaha~"
51260-181 = "[s] \"Ah, a propósito, ainda não recebi minha recompensa, viu!\""
51260-182 = "...Recompensa?"
51260-183 = "Hum, claro..."
51260-184 = "Já que contamos com a ajuda da Schale desta vez, uma recompensa à altura é mais do que justa, mas..."
51260-188 = "...Hã? Não é disso que você está falando...?"
51260-189 = "Fazer cafuné na Chise-nyan...?#nErr, do que exatamente você está falando —"
51260-190 = "[s] \"Mas a Chise está ocupada com o trabalho do Clube Yin-Yang, então...\""
51260-193 = "[ns] \"Vou fazer cafuné na Niya no lugar dela!\""
51260-197 = "Err, sobre esse assunto... meio que era brincadeira, sabe~"
51260-198 = "Err, olha..."
51260-203 = "E-Espera, Sensei?!"
51260-209 = "Que cara assustadora...?!"
51260-214 = "(O ataque de monstros bizarros que surgiram no exato instante em que o festival começou.)"
51260-215 = "(As marcas daquele incidente certamente ainda estão espalhadas por toda parte.)"
51260-218 = "(Mesmo assim... o festival não vai acabar.)"
51260-222 = "Ah, Sensei. Olá!"
51260-223 = "Estávamos esperando. Pontual como sempre."
51260-225 = "...Olá."
51260-226 = "[s] \"Hoje é a patrulha como Hyakkaryouran, né?\""
51260-228 = "Isso aí! A primeira missão memorável do novo Hyakkaryouran! Dá pra dizer isso, né?"
51260-229 = "Você vai presenciar esse momento histórico, Sensei, então mostra mais empolgação!"
51260-230 = "Vamos repetir isso centenas de vezes daqui pra frente e você já está toda animada assim, Renge."
51260-234 = "Hã?!"
51260-235 = "[s] \"Ahaha, calma vocês duas...\""
51260-236 = "Se a gente for ao festival centenas de vezes... o que vou fazer com a minha mesada? Que problema..."
51260-237 = "[s] \"É com isso que você está preocupada?!\""
51260-238 = "Ei, isso é assunto sério, viu?!#nNão subestime os festivais de Hyakkiyako!"
51260-239 = "Especialmente os organizados pelo Comitê de Organização de Festivais — são cheios de armadilhas pra esvaziar a nossa carteira!"
51260-241 = "Ah... entendi."
51260-242 = "[s] \"Err... e a Yukari...?\""
51260-244 = "Ah, a Yukari..."
51260-249 = "Kadenokouji Yukari! Chegando em grande estilo!"
51260-251 = "Ah, Yukari! Até que enfim chegou!"
51260-252 = "...Bom dia, Yukari."
51260-253 = "E então, resolveu as coisas em casa?"
51260-255 = "Sim. Passei em casa e comuniquei aos serviçais."
51260-256 = "[s] \"Hum? Comunicou o quê...?\""
51260-257 = "Pois bem, eu declarei solenemente!"
51260-258 = "Que vou deixar de ser sacerdotisa!"
51260-260 = "Uau, que decisão corajosa!"
51260-261 = "Tem certeza... de que está tudo bem?"
51260-262 = "...Não decidiu isso no impulso?"
51260-263 = "Ei, vocês duas ainda estão com esse papo?!#nNuma hora dessas, a gente tem que respeitar a decisão da Yukari!"
51260-264 = "Mas..."
51260-266 = "Não foi no impulso. Eu refleti e me angustiei muitas vezes... mas a resposta foi sempre a mesma."
51260-267 = "Eu amo o Hyakkaryouran.#nPor isso, decidi que quero continuar me esforçando daqui em diante como membro do Hyakkaryouran!"
51260-272 = "...Entendi."
51260-274 = "Todos os serviçais também compreenderam, dizendo que respeitariam a minha decisão."
51260-275 = "[s] \"Entendo, que bom.\""
51260-276 = "Sim! Portanto, hoje marca o verdadeiro renascimento do Hyakkaryouran!#nÉ o começo da lenda da Yukari!"
51260-280 = "Sendo assim, vamos logo! Senpais, Sensei!"
51260-281 = "[s] \"Hum? Para onde?\""
51260-283 = "Ah, sobre isso..."
51260-284 = "A Yukari disse que, antes da patrulha, queria que nós do Hyakkaryouran participássemos juntas do maior evento deste festival."
51260-285 = "É a cerimônia das lanternas flutuantes, para despedir o velho e acolher o novo."
51260-286 = "[s] \"O Festival das Lanternas, né.\""
51260-288 = "Sim, então vamos! Todos juntos!"
51260-293 = "(O festival que havia sido interrompido volta a seguir adiante.)"
51260-303 = "(O que quebrou a gente conserta, e então seguimos caminhando.)"
51260-304 = "(E lá estavam as quatro, avançando devagar, mas com firmeza.)"
51260-317 = "Meu braço direito continua igual... mas..."
51260-318 = "Ayame... eu, junto com estas garotas —"
51260-325 = "(Lanternas lançadas à água, cada uma carregando seus próprios sentimentos.)"
51260-326 = "(Guardando o que cada uma traz no peito, enquanto desenham o futuro.)"
51260-327 = "(As luzes com os desejos de todos seguem flutuando rio abaixo.)"
51260-328 = "(Sim, para todo o sempre —)"
51260-343 = "Buááááá! Kokuriko-samaaaaa~!"
51260-349 = "Shuro, você voltou, minha cara."
51260-350 = "Eu... eu me esforcei tanto!#nMe esforcei muito, muito mesmo...!"
51260-351 = "Mas no fim, não consegui criar o Hyakumonogatari...!"
51260-352 = "Me desculpaaaaa!!!"
51260-353 = "E a Kokuriko-sama estava tão ansiosa por isso..."
51260-354 = "Fufu... mas que criança adorável."
51260-355 = "Quanto a isso, não precisa se preocupar."
51260-356 = "Mesmo sem criar o Hyakumonogatari... você conseguiu com sucesso \"recriar o festival de 20 anos atrás\", não é verdade?"
51260-358 = "Sniff... tem certeza de que assim já está bom?"
51260-359 = "Sim, é mais do que suficiente."
51260-360 = "Um festival concluído ganha significado próprio e se torna a semente de uma nova história."
51260-361 = "Por isso mesmo, desta vez, isso já basta e sobra."
51260-363 = "Podemos voltar a completá-la mais adiante."
51260-367 = "Aos poucos, bem aos poucos... vamos construí-la juntas."
51260-368 = "A nossa \"história\", aquela que há de incendiar o mundo."
51260-373 = "[log=코쿠리코][ff4444]<O nosso próprio \"Hyakumonogatari\" —>[-][/log]"
51260-378 = "Arco Hyakkaryouran;Continua no Capítulo 2"
