[translation]
2002003-1 = "Испытание гениального хакера"
2002003-3 = ""
2002003-7 = "Спасибо за помощь сегодня!"
2002003-8 = "Вы потрясающий, Сенсей! Благодаря вам мы закончили без проблем!"
2002003-9 = "[s] «Не стоит...»"
2002003-10 = ""
2002003-12 = ""
2002003-13 = "Я пойду!"
2002003-14 = "До встречи!"
2002003-15 = ""
2002003-17 = ""
2002003-18 = "Закончив работу в Миллениуме, я посмотрел на часы — было чуть больше часа."
2002003-19 = "[ns] «До встречи с Химари ещё два часа... Пора идти.»"
2002003-20 = ""
2002003-25 = "После короткой прогулки я почти дошёл до автобусной остановки..."
2002003-26 = ""
2002003-30 = "Как раз вовремя, чтобы увидеть нужный мне автобус, подъезжающий к остановке."
2002003-31 = "[ns] «П-Погодите!»"
2002003-32 = ""
2002003-43 = "[ns] *тяжело дышит* *тяжело дышит* «...Успел...»"
2002003-44 = ""
2002003-48 = "Я едва успел в автобус и переводил дыхание, когда внезапно..."
2002003-49 = ""
2002003-52 = "Приветствуем пассажиров. Следующая остановка — клубный корпус Миллениума..."
2002003-53 = ""
2002003-56 = "...О, простите. На самом деле пункт назначения — восточный порт Миллениума. Восточный порт!"
2002003-57 = ""
2002003-60 = "[ns] «...А? Восточный порт находится на противоположной стороне Миллениума от клубного корпуса...»"
2002003-61 = "Приятного путешествия на восток!"
2002003-62 = ""
2002003-64 = "[ns] «П-Погодите!»"
2002003-65 = ""
2002003-72 = "Пункт назначения достигнут. Восточный порт Миллениума."
2002003-73 = "Пассажиры обязаны выйти здесь. Согласие подразумевается. Аварийное катапультирование через три, два..."
2002003-74 = "[s] «Ч-Что...?!»"
2002003-75 = ""
2002003-78 = "Я не успел отреагировать на объявление, как меня вышвырнуло из автобуса."
2002003-79 = "Спасибо, что выбрали нас! Надеемся, сегодня вы встретите кого-то особенного!"
2002003-80 = "[ns] «П-Подождите секунду! Или хотя бы дольше секунды!»"
2002003-81 = ""
2002003-87 = "[ns] «Ч-Что это вообще было?»"
2002003-88 = "Каким-то образом автобус похитил меня и высадил в незнакомом месте."
2002003-89 = ""
2002003-92 = "[ns] «Похищение автобусом — не оправдание. Нужно возвращаться, иначе опоздаю...»"
2002003-93 = ""
2002003-102 = "Я направился в клубный корпус на встречу с Химари."
2002003-103 = "Тогда я ещё не представлял..."
2002003-104 = ""
2002003-107 = "...что похищение автобусом было лишь предвестником грядущего..."
2002003-116 = "Пока я бежал к клубному корпусу, пытаясь наверстать потерянное время, мне захотелось пить, и я остановился за напитком."
2002003-117 = "[ns] «Возьму что-нибудь из автомата...»"
2002003-123 = "Я выбрал в автомате прохладную газировку и сразу забрал банку..."
2002003-124 = ""
2002003-129 = "[ns] «Ай, горячо! Ч-Что за...»"
2002003-130 = ""
2002003-133 = "[ns] «...„Огненно-бомбовый взрыв супа из красной фасоли“?»"
2002003-134 = "Вместо освежающей газировки автомат выдал горячий суп из красной фасоли с агрессивным названием."
2002003-135 = "Затем из автомата начал доноситься странный голос..."
2002003-136 = "Отринь холод и держи тепло рядом."
2002003-137 = "Этот суп из красной фасоли — для тебя! Наслаждайся!"
2002003-138 = "[ns] «Я-я просто хочу холодный напиток!»"
2002003-141 = "Я отказался подчиняться требованиям автомата и нажал другие кнопки... Напрасная надежда. Мне ничего не досталось, кроме новых «Огненно-бомбовых взрывов супа из красной фасоли»."
2002003-150 = "[ns] «Я уже слишком долго проигрываю этому автомату. Придётся сдаться, пока не опоздал.»"
2002003-151 = "Я направился прямо к клубному корпусу, решив ни на что не отвлекаться. Но едва я собрался перейти мост..."
2002003-152 = ""
2002003-155 = "Внимание всем жителям. Пожалуйста, отойдите и найдите обходной путь."
2002003-156 = "[s] «Что?! Почему именно сейчас?!»"
2002003-157 = "Внимание всем жителям. Пожалуйста, отойдите и найдите обходной путь."
2002003-158 = ""
2002003-161 = "Внимание всем жителям. Пожалуйста, отойдите и найдите обходной путь."
2002003-162 = "Помните: держитесь подальше от воды, и удача улучшится."
2002003-163 = "[s] «...Удача?»"
2002003-164 = "Пожалуйста, отойдите и найдите обходной путь. Если не подчинитесь, вскоре к вам прибудет наш рой дронов — представитель службы удовлетворённости клиентов."
2002003-165 = ""
2002003-168 = "[ns] «Ч-Что?! Что вообще происходит?!»"
2002003-175 = "Уворачиваясь от внезапно налетевших дронов, я поспешно ушёл."
2002003-176 = "После этого странные вещи продолжали происходить одна за другой."
2002003-186 = "Отправляйся на восток и встретишь особенного человека."
2002003-187 = "Держись подальше от холода и держи тепло рядом..."
2002003-188 = "Держись подальше от воды ради удачи..."
2002003-189 = "На восток..."
2002003-190 = "Холод..."
2002003-191 = "Вода..."
2002003-192 = ""
2002003-199 = "[ns] «...Вот что произошло. Наверное. Я до сих пор толком не понимаю.»"
2002003-200 = "Хм. Интересно. Очень интересно."
2002003-201 = ""
2002003-203 = ""
2002003-204 = "...Хи-хи-хи-хи."
2002003-205 = "[s] «...Эм, Химари?»"
2002003-206 = "Ну как вам, Сенсей? Как вам те впечатления?"
2002003-207 = "Теперь чувствуете, что удача на вашей стороне?"
2002003-208 = "«Вы сейчас думаете: „Ух ты, какой потрясающий день! Хотелось бы, чтобы такое происходило каждый день!“?»"
2002003-209 = "[s] «...Что? С чего бы мне хотеть каждый день проигрывать автомату с напитками?»"
2002003-210 = "Хе-хе. Теперь уже нечего скрывать."
2002003-211 = "Вот, взгляните на это."
2002003-212 = ""
2002003-214 = ""
2002003-215 = ""
2002003-218 = "С безграничной уверенностью Химари развернула журнал и положила его передо мной."
2002003-219 = "[s] «Спецвыпуск Школы журналистики „Кронос“... Колонка гороскопов?»"
2002003-220 = ""
2002003-223 = "Химари перелистнула страницу и указала пальцем. Я начал читать..."
2002003-224 = "«Специально для родившихся в декабре! Сегодняшнее испытание удачи — вверх, вверх и вперёд!» И дальше..."
2002003-225 = "«Идите на восток. Там вы встретите особенного человека, и ваша удача улучшится.»"
2002003-226 = "«Избегайте холода и ищите тепло — и ваша удача улучшится.»"
2002003-227 = "«Держитесь подальше от воды — и ваша удача улучшится.»"
2002003-228 = "«Не спешите, иначе расстроите окружающих. Хорошее приходит к тем, кто умеет ждать.» И так далее."
2002003-229 = "По версии Школы журналистики «Кронос», люди, родившиеся в декабре, сегодня могут повысить свою удачу, если будут делать всё это!"
2002003-230 = ""
2002003-233 = "[ns] «Постой... То есть... Погоди... Секунду... Всё, что произошло...»"
2002003-234 = "Да! Всё было частью большого эксперимента, который я провела с помощью пары безобидных взломов тут и там."
2002003-235 = "Я родилась в декабре, поэтому решила, что это отличная возможность проверить свою удачу."
2002003-236 = "...Но, к сожалению, как вы знаете, я не могу безрассудно подвергать своё тело воздействию стихии."
2002003-237 = "Поэтому, раз экспериментировать на себе нельзя, я использовала вас."
2002003-238 = "[s] «В какой момент всё это вообще показалось тебе логичным?! Как я мог быть твоей заменой?!»"
2002003-239 = "Конечно, я учла, что мы разные люди."
2002003-240 = "Но, если честно, это просто... казалось мне логичным. Мы ведь так похожи, что..."
2002003-241 = ""
2002003-244 = "[ns] «...Химари.»"
2002003-245 = "Что?"
2002003-246 = ""
2002003-249 = "[ns] «Сейчас я буду серьёзен.»"
2002003-250 = ""
2002003-252 = ""
2002003-253 = "...О, т-тогда..."
2002003-254 = ""
2002003-256 = ""
2002003-257 = ""
2002003-259 = "[ns] «Слушай.»"
2002003-260 = "Эм, э-э..."
2002003-261 = "«В спецвыпуске „Кронос“ написано: „Не спешите, иначе расстроите окружающих. Хорошее приходит к тем, кто умеет ждать.“»"
2002003-262 = "Я всё поняла... Вы хотите сказать... что предсказание оказалось совершенно точным. Даже страшно, на что способна астрология..."
2002003-263 = "[ns] «Теперь тебя зовут „астрология“?!»"
2002003-265 = "После этого около часа я отчитывал девушку, которая слишком увлеклась оккультизмом."
