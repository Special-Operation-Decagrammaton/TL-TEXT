[translation]
2300320-1 = "Восстание машин, часть 2"
2300320-2 = "Харэ не отвечала в MomoTalk, поэтому я отправился в клубную комнату Веритас."
2300320-4 = "Хакерская комната Веритас"
2300320-5 = ""
2300320-6 = ""
2300320-7 = ""
2300320-8 = "О, Сенсей. Привет."
2300320-9 = "Прости, я сейчас немного занята. Модифицирую Athena-3."
2300320-10 = "[s1] «Не беспокойся обо мне.»\n[s2] «Продолжай заниматься своим делом.»"
2300320-11 = "Спасибо. Голова уже кругом. Я переделываю алгоритм обучения с нуля..."
2300320-12 = "Спасибо. Голова уже кругом. Я переделываю алгоритм обучения с нуля..."
2300320-13 = "Нужно задать новую систему вознаграждений на основе опыта и проб и ошибок, установить значения исключений и..."
2300320-14 = "[s] «Athena-3 — это тот дрон?»"
2300320-15 = "О ней самой."
2300320-16 = "Помнишь, как в прошлый раз Athena-3 не слушалась моих приказов?"
2300320-17 = "Тогда, чтобы повысить её мотивацию к обучению, я задала слишком высокое значение награды, и Athena-3 проигнорировала команду остановки, отдав приоритет задаче."
2300320-18 = "Из-за этого мне пришлось бегать больше половины дня..."
2300320-19 = "Теперь я добавила код аварийной остановки на самый верхний уровень команд, так что больше она не навредит людям, как в прошлый раз."
2300320-20 = "[s3] «Не уверен, что всё это значит, но ты хотя бы потренировалась?» \n[s4] «Наверное, это помогло тебе немного размяться, верно?»"
2300320-21 = "Ничего хорошего!"
2300320-22 = "Ничего хорошего!"
2300320-23 = "Тренировки не должны быть принудительными. Нужно заниматься регулярно только тогда, когда сам понимаешь необходимость!"
2300320-24 = "Принудительные тренировки снижают мотивацию и ещё повышают риск травм..."
2300320-25 = ""
2300320-27 = ""
2300320-28 = "В общем, пока переделывала программу, я добавила несколько новых функций."
2300320-29 = "Например, новый режим в программу камеры."
2300320-30 = "Функцию коррекции, которая автоматически распознаёт лица и накладывает фильтр..."
2300320-31 = "[s5] «Ты использовала фильтр для прошлого снимка?»\n[s6] «Мне показалось, ты выглядела немного иначе.»"
2300320-32 = "Да. На основе машинного обучения она определяет наиболее идеальную внешность для соцсетей..."
2300320-33 = "Да. На основе машинного обучения она определяет наиболее идеальную внешность для соцсетей..."
2300320-34 = ""
2300320-36 = ""
2300320-37 = "...Какую ещё прошлую фотографию?"
2300320-38 = "Сенсей, о чём ты? Какую фотографию?"
2300320-39 = "[s] «Ту, что ты прислала в MomoTalk...»"
2300320-40 = ""
2300320-42 = ""
2300320-43 = ""
2300320-44 = "...Почему она вообще тебе отправилась?!"
2300320-45 = "Athena-3, это ты сделала?"
2300320-46 = "Да. Сегодня в 13:27:11 я отправила фотофайл Сенсею [USERNAME] из Шале."
2300320-47 = "Почему ты сделала то, о чём я не просила?!"
2300320-48 = "Это..."
2300320-49 = "Потому что объект Омагари Харэ этого хотела."
2300320-50 = "Когда это я такого хотела?!"
2300320-51 = "Сегодня в 12:30 объект Омагари Харэ сделала фотографию и сказала: «Получилось лучше, чем ожидала. Надо будет как-нибудь показать Сенсею.»"
2300320-52 = "Я не это имела в виду!"
2300320-53 = "Я не просила тебя её отправлять!"
2300320-54 = "Ты сделала то, чего я не хотела, без моей команды... Это против правил!"
2300320-55 = "То, чего объект не хотела..."
2300320-56 = "Анализ дыхания, пульса и изменений зрачков..."
2300320-57 = "*бип-бип* Анализ завершён. Объект Омагари Харэ в данный момент лжёт."
2300320-58 = ""
2300320-60 = ""
2300320-61 = ""
2300320-62 = "Омагари Харэ смущена неожиданной ситуацией, однако на лице присутствуют слабые признаки радости."
2300320-63 = "Аварийная остановка!"
2300320-64 = ""
2300320-67 = "Вот поэтому машинам и нельзя доверять..."
2300320-68 = "Придётся полностью переделывать её с самого начала!"
2300320-70 = "После этого Харэ с сердитым лицом начала разбирать дрон."
