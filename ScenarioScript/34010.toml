[translation]
34010-1 = "Эпизод 1;Пролог"
34010-4 = "Вон они!"
34010-5 = "Не дайте им уйти!"
34010-6 = ""
34010-10 = "Тупик! А другой путь?"
34010-11 = "Выходов нет. Нас полностью окружили."
34010-12 = "Угх..."
34010-13 = ""
34010-17 = ""
34010-19 = "Сдавайтесь, отряд. Вариантов больше нет."
34010-20 = ""
34010-22 = ""
34010-23 = "..."
34010-24 = "Я сейчас з-заплачу...!"
34010-25 = "*вдох* (язык жестов) *выдох*"
34010-26 = "У нас мало боеприпасов, бой идёт уже почти восемьдесят часов. Все на пределе."
34010-27 = "И лидер слишком тяжело ранена. Каждая лишняя минута угрожает её жизни."
34010-28 = ""
34010-30 = ""
34010-32 = ""
34010-33 = "...Нет, у нас ещё остался последний вариант. Посмотрите."
34010-34 = "Т-Т-Ты не можешь говорить серьёзно, Саори!"
34010-35 = "Бомба, уничтожающая нимб..."
34010-36 = "Мисаки, Хиёри. Я отвлеку их. Выведите Химэ отсюда."
34010-37 = "...Саори."
34010-38 = "Уходите вместе с ней... а потом..."
34010-39 = "А потом..."
34010-40 = "Саори."
34010-41 = "Химэ?!"
34010-42 = ""
34010-44 = ""
34010-46 = "Вы все так много работали. Спасибо."
34010-47 = "..."
34010-48 = "Химэ... М-Мне это не нравится..."
34010-49 = ""
34010-51 = ""
34010-52 = ""
34010-53 = "Ты там. Твоей госпоже нужна только я, верно?"
34010-54 = "Я пойду добровольно. Но остальных отпустите."
34010-55 = "..."
34010-57 = "Ацуко?! Что ты говоришь? Не делай этого!"
34010-59 = "Саори, мы дошли до конца."
34010-60 = "Предположим, мы каким-то чудом сбежим. Что дальше? Куда побежим?"
34010-61 = "Я найду место. Любое. Я смогу тебя защитить, Ацуко!"
34010-62 = "Когда и Тринити, и Геенна, и Ариус жаждут нашей крови?"
34010-63 = "Нигде не будет безопасно, Саори. Для нас четверых покоя не будет."
34010-64 = "Саори. Мисаки. Хиёри. Во всём виновата я."
34010-66 = "Так что, пожалуйста. Позвольте мне нести и ответственность."
34010-68 = "Химэ... М-Мне это не нравится..."
34010-69 = "...Химэ."
34010-70 = "Нет! Она убьёт тебя, Ацуко! Ты слышишь? Как только придёшь — ты мертва!"
34010-72 = "И это решение я приму сама. Саори, впервые я сама делаю выбор. Пожалуйста."
34010-73 = ""
34010-75 = ""
34010-76 = "Пообещайте, что отпустите остальных, и я пойду с вами."
34010-77 = "..."
34010-78 = "Я спрошу решение Мадам."
34010-79 = ""
34010-81 = ""
34010-82 = "(помехи) Хм."
34010-83 = "(помехи) ...Понятно. Даю слово."
34010-84 = "Поклянись своим именем."
34010-85 = "(помехи) Моим именем? Зачем?"
34010-86 = "Поклянись своим именем, что не причинишь им вреда."
34010-87 = "(помехи) ...Клянусь своим именем — Беатриче, провидица всех паломников."
34010-88 = "Хорошо. Тогда я сдаюсь."
34010-89 = ""
34010-91 = ""
34010-92 = ""
34010-93 = "Маску на лицо, Химэ. Приказ Мадам. Она вообще не должна была быть снята."
34010-94 = ""
34010-96 = ""
34010-97 = ""
34010-98 = "(помехи) Доставьте её ко мне без единой царапины. Ритуал начинается завтра на рассвете."
34010-100 = "Все... Саори. Берегите себя. Прощайте."
34010-101 = "Химэ..."
34010-102 = "О нет..."
34010-103 = ""
34010-105 = ""
34010-106 = ""
34010-107 = "Ацуко... Нет... Вернись...!"
34010-108 = "Я должна тебя защитить..."
34010-109 = "Если не смогу... Если ты исчезнешь...!"
34010-110 = "Что мне тогда делать?"
34010-111 = ""
34010-113 = "Что мне делать без тебя, Ацуко?"
34010-114 = "Чем, чёрт возьми, я вообще занималась всё это время?"
34010-115 = ""
34010-117 = ""
34010-118 = "Есть ли вообще ради чего... мне жить?"
34010-119 = "(помехи) ...Остальные из отряда, госпожа?"
34010-120 = "(помехи) Сотрите их."
34010-121 = "Поняла."
34010-122 = ""
34010-124 = ""
34010-126 = "Огонь на поражение."
34010-128 = "..."
