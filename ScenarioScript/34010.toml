[translation]
34010-1 = "Episódio 1;Prólogo"
34010-4 = "Elas estão aqui!!"
34010-5 = "Por ali! Atrás delas!!"
34010-10 = "J-Já era, é o nosso fim... Aqui é um beco sem saída..."
34010-11 = "...Do outro lado também. Estamos completamente cercadas."
34010-12 = "Tsc..."
34010-19 = "Desistam.#nVocês não têm mais para onde fugir."
34010-23 = "..."
34010-24 = "H-Hii..."
34010-25 = "(Fungada, fungada...)"
34010-26 = "...Quase não temos mais munição, e nossas forças já chegaram ao limite..."
34010-27 = "Os ferimentos da líder também são graves. Desse jeito, que dirá fugir, a vida da líder corre perigo."
34010-33 = "...Ainda nos resta um último recurso. Com isto..."
34010-34 = "N-Não pode ser."
34010-35 = "...A bomba que destrói auréolas."
34010-36 = "Misaki, Hiyori. Enquanto eu ganho tempo, levem a Princesa... e saiam daqui."
34010-37 = "...Saori."
34010-38 = "Saiam daqui... e depois... o próximo passo..."
34010-39 = "O... próximo passo..."
34010-40 = "Saori."
34010-41 = "...Princesa?"
34010-46 = "Já chega. Nós demos o nosso melhor."
34010-47 = "..."
34010-48 = "P-Princesinha... O que houve...?"
34010-53 = "Quem \"ela\" quer sou eu... não é?"
34010-54 = "Eu vou com vocês. Então, quero que deixem as outras integrantes irem."
34010-55 = "..."
34010-57 = "Atsuko!? ...O que pensa que está fazendo!?"
34010-59 = "...Já chega, Saori. Tudo isso não tem sentido."
34010-60 = "E se escaparmos daqui, o que vem depois? Para onde vamos, afinal?"
34010-61 = "..."
34010-62 = "Trinity e Gehenna — e até mesmo Arius estão nos caçando."
34010-63 = "Não há nenhum lugar em Kivotos onde possamos ficar em paz.#nAté que nossas vidas se esgotem, só nos restará viver escondidas, fugindo e prendendo a respiração."
34010-64 = "Mas isso só acontece porque eu estou aqui. Você, Saori, a Misaki e a Hiyori... Todas acabaram assim por minha causa..."
34010-66 = "Por isso, eu vou pôr um fim nisso."
34010-68 = "P-Princesinha..."
34010-69 = "...Princesa."
34010-70 = "...Não faça isso, Atsuko. Se você voltar, vai ser morta... Você sabe muito bem disso, não sabe?"
34010-72 = "...Até hoje, eu nunca tomei nenhuma decisão nem fiz nenhuma escolha. Então, pelo menos desta vez, eu posso decidir por conta própria, não acha?"
34010-76 = "Vocês me prometem que vão deixar todas livres?"
34010-77 = "..."
34010-78 = "...Espere um pouco, vou confirmar com a Madame."
34010-82 = "Ora..."
34010-83 = "...Entendo, compreendo. Eu lhe dou a minha palavra."
34010-84 = "Jure pelo seu próprio nome."
34010-85 = "Pelo meu nome...? E que valor isso teria?"
34010-86 = "Porque eu quero ter certeza de que vai cumprir a promessa."
34010-87 = "Pois bem... Em meu nome, \"Beatrice\", a ilusão de todos os peregrinos, eu prometo."
34010-88 = "...Sim, é uma promessa."
34010-93 = "Princesa, coloque isto. São ordens da Madame. Seria um problema se tirasse a máscara por conta própria."
34010-98 = "Tratem-na com todo o cuidado para que não sofra um único arranhão. O ritual começará amanhã cedo, ao nascer do sol."
34010-100 = "...Fiquem bem. Saori, pessoal — adeus."
34010-101 = "Princesa..."
34010-102 = "Princesinha..."
34010-107 = "Não... Atsuko..."
34010-108 = "Se eu... não puder proteger nem mesmo você..."
34010-109 = "Se minhas convicções... e tudo o que devo proteger... desaparecerem por completo..."
34010-110 = "Eu..."
34010-113 = "Atsuko, eu..."
34010-114 = "Para que eu estive lutando até agora, afinal...?"
34010-118 = "Para que... eu estou vivendo...?"
34010-119 = "...O que faremos com o restante do Esquadrão?"
34010-120 = "Eliminem todas."
34010-121 = "Sim, senhora."
34010-126 = "Fogo."
34010-128 = "..."
34010-129 = "..."
34010-130 = "..."
34010-135 = "Próximo;Uma Tea Party Desigual"
