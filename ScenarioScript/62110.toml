[translation]
62110-1 = "Эпизод 11;Студенты"
62110-2 = ""
62110-3 = "А-Ангелы!"
62110-4 = "Ангелы Откровения! Да ещё сразу двое...!"
62110-5 = "Сколько раз прозвучала труба?"
62110-6 = "Погоди... пять... шесть, кажется?"
62110-7 = "Тогда остался только..."
62110-8 = "..."
62110-9 = "П-Погодите! Почему ангелы идут сюда?!"
62110-10 = ""
62110-13 = "Аааааа?!"
62110-14 = ""
62110-16 = ""
62110-17 = ""
62110-18 = ""
62110-19 = "!!!"
62110-20 = "А-Ангелы нападают на наших студентов...?"
62110-21 = "З-Значит, это правда?"
62110-22 = "То, что сказали Уи и Шимико...?"
62110-24 = ""
62110-25 = "Я нашла один общий фактор у каждой из двух групп."
62110-26 = "Их участие в занятиях Сенсея."
62110-27 = ""
62110-28 = "Насколько я понимаю, студенты, услышавшие звук трубы — знамение конца света..."
62110-29 = "...Иными словами, студенты, которые меньше сопротивлялись новым взглядам, приходящим в Ариус извне."
62110-30 = ""
62110-31 = "Рано или поздно эти студенты могут закончить так же, как она..."
62110-32 = "В любой момент студенты, которые не хотят перемен в Ариусе, могут объявить их «врагами»."
62110-33 = ""
62110-34 = "Об этом подумаем потом! Мы не можем просто стоять и смотреть!"
62110-35 = "Всё-таки они наши товарищи по школе."
62110-36 = ""
62110-38 = ""
62110-39 = ""
62110-40 = "М-Мы справимся...? Эти штуки были очень сильными..."
62110-41 = "Она права... Рыцарей исправительного курса здесь тоже нет, чтобы нас защищать..."
62110-42 = "...Но теперь их хотя бы вдвое меньше. Остаётся только попробовать."
