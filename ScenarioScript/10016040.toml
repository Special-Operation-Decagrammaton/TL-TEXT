[translation]
10016040-1 = "Эпизод 4;Поздний обед"
10016040-2 = "Когда Юке стало лучше, я вышел со стадиона поискать что-нибудь на обед."
10016040-3 = ""
10016040-6 = "Моё внимание привлекла большая толпа возле одной из зон отдыха."
10016040-7 = "Спасибо всем за усердие на утренних соревнованиях!"
10016040-8 = "Исполнительный комитет бесплатно раздаёт напитки, так что угощайтесь!"
10016040-9 = "Спасибо, сестра!"
10016040-10 = "Я... я не студент, но очень хочу пить. Можно мне тоже?"
10016040-11 = "Мы никогда не откажем нуждающемуся. Обязательно пейте достаточно воды!"
10016040-12 = "Сестра! Напитки почти закончились."
10016040-13 = "О боже. Уже?"
10016040-14 = "Ничего страшного. Я свяжусь со штабом и попрошу ещё."
10016040-15 = "Уа-а-а... Где моя сестра...?"
10016040-16 = "Почему ты плачешь, малышка? Потерялась?"
10016040-17 = "Вытри слёзы, я помогу найти сестру. Закрой глаза и сосчитай до десяти — и всё станет хорошо!"
10016040-18 = "Сестра, где ближайший торговый автомат?"
10016040-19 = "На первом этаже восточного крыла. Ой, подождите, кажется, я слышала, что он сломан. Тогда придётся идти к автомату в западном крыле."
10016040-20 = "Если не против немного подождать, я могу вас туда проводить!"
10016040-21 = "Сестра, как лучше набрать хороший результат в дневной эстафете?"
10016040-22 = "Как лучше набрать хороший результат...?"
10016040-23 = "Эм... Я больше умею болеть за спортсменов, чем заниматься спортом, так что не совсем уверена... Но думаю, чтобы показать лучший результат, тело должно хорошо отдохнуть!"
10016040-24 = "Пожалуйста, выпейте этого холодного спортивного напитка! Он восстановит электролиты и придаст сил. Удачи в эстафете! А мне теперь нужно помочь этой девочке найти сестру..."
10016040-25 = "Сестра! В чём смысл справедливости?"
10016040-26 = "...На этот вопрос сложно ответить."
10016040-27 = "[s] «...Ты выглядишь занятой.»"
10016040-28 = "О! Здравствуйте, [USERNAME]-сенсей!"
10016040-29 = "Как невежливо с моей стороны... Я даже не заметила, как вы пришли! Простите, я немного занята работой Исполнительного комитета."
10016040-30 = "Я могу чем-нибудь помочь вам, Сенсей?"
10016040-31 = "[s] «Нет, вовсе нет. Ты и так делаешь слишком много.»"
10016040-33 = "[ns] «Ты уже обедала?»"
10016040-34 = "Обед...?"
10016040-35 = ""
10016040-37 = ""
10016040-38 = "Ух ты. Уже так поздно."
10016040-39 = "Я потеряла счёт времени, потому что стольким людям требовалась помощь."
10016040-40 = "Очередь просьб всё ещё длинная, так что поем позже, когда появится свободная минутка."
10016040-41 = "[s] «Дай мне работу, сестра.»"
10016040-42 = "О нет. Я не могу просить вас об этом."
10016040-43 = "И если кому-то из нас приходится пропустить обед, это не значит, что и вам нужно страдать."
10016040-44 = "Тогда хотите попросить меня о помощи? Где здесь лучшая палатка с едой?"
10016040-45 = "Все советуют разное, но говорят, что китайская рисовая миска из «Променада Чёрной Черепахи» потрясающая!"
10016040-46 = "Их палатка очень заметная, прямо спереди. Найти будет легко."
10016040-47 = "[s1] «Я ужасно ориентируюсь, могу потеряться.»\n[s2] «Проводишь меня туда, пожалуйста, Мари?»"
10016040-48 = ""
10016040-49 = ""
10016040-51 = ""
10016040-52 = "Хм-м... Видимо, ничего не поделаешь."
10016040-53 = "Я закончу здесь, а потом пойдём к палаткам с едой."
10016040-55 = "Я присоединился к Мари и помогал многочисленным посетителям фестиваля и студентам, которым требовалась помощь."
10016040-57 = "Вы были великолепны, Сенсей!"
10016040-58 = "Без вас я бы не смогла помочь каждому так, как получилось сегодня!"
10016040-59 = "[s3] «Ты тоже отлично справилась, Мари. Ты помогла очень многим.»\n[s4] «Ты из тех людей, к кому другие обращаются за помощью.»"
10016040-60 = "Долг сестры — выслушивать проблемы каждого."
10016040-61 = "Долг сестры — выслушивать проблемы каждого."
10016040-62 = "Для меня большая честь, что люди чувствуют себя достаточно спокойно, чтобы делиться со мной трудностями и переживаниями. В этом есть своя красота."
10016040-63 = "Хотя поздний обед, пожалуй, не так уж романтичен. Хи-хи."
10016040-64 = "[s5] «Раз ты так старалась, обед за мой счёт!»\n[s6] «Две китайские рисовые миски, пожалуйста!»"
10016040-65 = "Сенсей! Вы уверены?"
10016040-66 = "Сенсей! Вы уверены?"
10016040-67 = "Две китайские рисовые миски? Будет сделано!"
10016040-71 = ""
10016040-72 = "Заказ готов! Вот ваши миски."
10016040-73 = "Как быстро...!"
10016040-74 = "И какое качество. Даже бумажные тарелки необычные."
10016040-75 = "Ресторан должен не только подавать лучшую еду, но и делать это быстрее всех! Особенно здесь, где люди хотят поскорее вернуться на стадион."
10016040-76 = "А поскольку мы знали, что люди будут есть прямо во время просмотра соревнований, мы сами сделали специальные бумажные тарелки! Их удобно держать и есть на ходу."
10016040-77 = "Но моими глупыми речами сыт не будешь! Ешьте, пока не остыло."
10016040-78 = "Какой необычный опыт! Мы едим жирную фестивальную еду прямо здесь, посреди суетящейся толпы."
10016040-79 = "Хи-хи. Почему-то ощущается немного неприлично."
10016040-80 = "Что ж, спасибо за еду!"
10016040-81 = ""
10016040-83 = ""
10016040-84 = "О боже! Сенсей, это очень вкусно!"
10016040-85 = "Приправлено экзотическими специями, которых я никогда раньше не пробовала..."
10016040-86 = "Вкус непривычный, но очень затягивает."
10016040-87 = "Ха-ха-ха! Рада слышать! Наш секретный соус — рецепт, который мы годами совершенствовали на «Променаде Чёрной Черепахи»."
10016040-88 = "Правда, президент Руми куда-то ушла сразу после кулинарного конкурса, бормоча что-то об улучшении рецептов..."
10016040-89 = "Думаю, ей не стоит так близко принимать к сердцу мнение каких-то студентов «Геенны»..."
10016040-90 = "[s] «Можно мне ещё одну миску?»"
10016040-91 = "Конечно! Минутку."
10016040-95 = "...Ого! Горячо!"
10016040-97 = "В-Вы в порядке?"
10016040-98 = "Ничего страшного, профессиональные риски. Не первый раз на меня попадает горячее масло. Ай-ай-ай..."
10016040-99 = "Это как раз повод волноваться! При ожогах ранняя помощь очень важна."
10016040-100 = "Но я не могу оставить палатку без присмотра, и я не знаю, куда ушла президент Руми..."
10016040-101 = "Ничего! Я присмотрю за палаткой, а вы идите с Сенсеем в Объединённый медицинский штаб."
10016040-102 = "[s7] «Если не быть осторожной, может остаться шрам.»\n[s8] «Я могу прямо сейчас тебя туда проводить.»"
10016040-103 = "Эм... Наверное, можно, раз обеденный наплыв почти закончился..."
10016040-104 = "Эм... Наверное, можно, раз обеденный наплыв почти закончился..."
10016040-105 = "Хорошо! Простите, но можно оставить палатку на вас?"
10016040-106 = "Конечно! Главное, чтобы вы получили необходимую помощь."
10016040-109 = "В последнем соревновании было много травм..."
10016040-110 = "Сэна, можешь обработать лёгкие царапины и раны? А если кому-то понадобится более серьёзное лечение, перенесём их на койки."
10016040-111 = "Могу. Мне только нужно взять ещё стерильной марли из ящика с припасами, одну минуту."
10016040-112 = "[s] «Здесь немного суматошно...»"
10016040-113 = "Сенсей? Что привело вас в медицинскую палатку?"
10016040-114 = "О нет! Вы где-то ранены?"
10016040-115 = "[s] «Нет, не я. Вот этот студент.»"
10016040-116 = "Мне ужасно неловко добавлять вам работы. Я немного стесняюсь, но... обожглась маслом."
10016040-117 = "Не извиняйтесь! Ожоги очень важно обработать сразу."
10016040-118 = "Особенно от горячего масла. Оно может прилипнуть к коже и оставить глубокие шрамы."
10016040-119 = "Сэна, ты занята? Можешь ещё подготовить повязки для ожогов?"
10016040-120 = "Могу. Мне только нужно обрезать шину для фиксации трещины в кости."
10016040-121 = "Сразу после этого займусь вашим ожогом."
10016040-122 = "[s9] «...Вам нужна помощь? Я могу принести материалы первой помощи.»\n[s10] «Может, я помогу разобрать аптечные припасы...»"
10016040-125 = ""
10016040-126 = "Нет! (Ни в коем случае!)"
10016040-127 = "Вам нельзя заходить в зону первой помощи! Ни при каких обстоятельствах!"
10016040-128 = "[s] «Т-там что-то не так?»"
10016040-129 = "Ну, видите ли…"
10016040-130 = "Мы лечим пациентов с тяжёлыми ранениями от артиллерийских снарядов."
10016040-131 = "Раны выглядят крайне жутко, и без опыта это тяжело выдержать."
10016040-132 = "Вам потом могут сниться кошмары!"
10016040-133 = "[s11] «Звучит ужасно... Они в порядке?»\n[s12] «Но тогда им ведь нужно ещё больше помощи?»"
10016040-134 = "Ранения тяжёлые, но вполне поддаются лечению."
10016040-135 = "Ранения тяжёлые, но вполне поддаются лечению."
10016040-136 = "А когда дежурят медики из двух академий, уже через час они снова будут на ногах."
10016040-137 = "[s] «Всего через час?!»"
10016040-138 = "Да, всего через час. Поэтому, пожалуйста, оставьте пациентов нам и наслаждайтесь фестивалем за всех нас!"
10016040-139 = "Хорошо, всё готово. Пожалуйста, принесите труп..."
10016040-140 = "Эм, то есть пациента с ожогом сюда."
10016040-141 = ""
10016040-143 = ""
10016040-144 = "Т-труп? Эм... Хорошо, спасибо."
10016040-146 = "Я покинул медицинскую палатку — Сэна и Сэрина буквально вытолкали меня за дверь."
