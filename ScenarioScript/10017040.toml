[translation]
10017040-1 = "Эпизод 4;Экспресс спасения"
10017040-6 = "Центр Кивотоса"
10017040-7 = "Тихо и спокойно."
10017040-8 = "Во время патруля ничего примечательного не обнаружено. Похоже, нас ждёт по-настоящему святая ночь."
10017040-9 = "..."
10017040-10 = "Иногда я боюсь, что те, кому помощь нужна больше всего, находятся вне моего поля зрения."
10017040-11 = "Сколько криков о помощи остаётся без ответа просто потому, что я их даже не услышала?"
10017040-12 = "Вперёд с верой и честью в сердце! Медицина не знает границ!"
10017040-14 = "О, капитан! Добро пожаловать."
10017040-15 = "Я считала минуты! Серьёзно, считала."
10017040-17 = "Сэрина, Ханаэ. Уверена, вы обе много потрудились. Я рада, что теперь могу присоединиться."
10017040-18 = "И спасибо вам, Сенсей."
10017040-19 = "Но, несмотря на всё это, вы обе выглядите подавленными."
10017040-20 = "Что-то случилось?"
10017040-22 = "Ну..."
10017040-23 = "Мы думали о том, сколько людей вокруг, которым мы даже не успеваем помочь..."
10017040-24 = "[s] «Я хочу сказать, что всё в порядке, но не знаю, как вас убедить.»"
10017040-26 = "...Медицина не знает границ. Эта вера лежит в основе Рыцарей скорой помощи."
10017040-27 = "Пожалуйста, расскажите всё, не упуская деталей."
10017040-29 = ""
10017040-31 = ""
10017040-32 = "Это правда, Сенсей?"
10017040-33 = "Что Боевая группа Правосудия забрала у них курицу и оставила их совсем без средств?"
10017040-34 = "И они пришли к Рыцарям скорой помощи, чтобы их историю услышали?"
10017040-35 = "[s1] «Эм, наверное?»\n[s2] «Они точно выглядели грустными, и мне тоже стало грустно...»"
10017040-39 = "Мы спросили, можем ли ещё чем-нибудь помочь..."
10017040-40 = "Наверное, им действительно было очень больно. Они попросили нас помнить о них и их страданиях..."
10017040-42 = "Я полностью понимаю. Многие больше всего хотят лишь того, чтобы о них помнили."
10017040-43 = "У их историй нет завершения, нет облегчения, нет финальной трогательной точки... Эти люди просто хотят, чтобы их кто-нибудь выслушал."
10017040-44 = "Как я могла допустить такое? Я должна была быть рядом и действовать! Вся вина лежит на мне."
10017040-45 = "Э-это неправда, капитан!"
10017040-46 = "Я всё ещё не понимаю, зачем Боевая группа Правосудия сделала что-то подобное."
10017040-47 = "Они даже сказали, что там были президент Цуруги, вице-президент Хасуми и Маширо."
10017040-48 = "[s3] «У них наверняка была причина.»\n[s4] «Не думаю, что эти трое стали бы кого-то притеснять без причины...»"
10017040-51 = "Хм? Сенсей, когда вы так говорите, я только ещё больше запутываюсь."
10017040-52 = "Я просто не могу не сочувствовать им из-за потерянной курицы..."
10017040-54 = "Сэрина, Ханаэ, и вы тоже, Сенсей. Важно, чтобы вы все это услышали."
10017040-55 = "Опасно верить, что защитники справедливости всегда принимают правильные решения."
10017040-56 = "Так можно начать оправдывать чужие несчастья."
10017040-57 = "Понимаете? Спасение предназначено всем, везде и всегда!"
10017040-59 = "Д-да, капитан!"
10017040-60 = "Поняла, капитан!"
10017040-61 = "[s] «Какие у Майн твёрдые принципы...»"
10017040-63 = "Дело не в этом. Принципы тоже могут быть формой зацикленности на себе, Сенсей."
10017040-64 = "Но помощь всегда должна быть направлена наружу!"
10017040-65 = "Мы должны найти тех, кому нужна помощь, а затем набраться смелости и принести её им!"
10017040-66 = ""
10017040-68 = ""
10017040-69 = "А больше всего наша помощь сейчас нужна..."
10017040-70 = "...Боевой группе Правосудия!"
10017040-72 = "Что?!"
10017040-73 = "Боевой группе Правосудия?"
10017040-74 = "[s] «Эм... Кажется, я пропустила шаг в твоих рассуждениях.»"
10017040-76 = "Помощь не ограничивается материальными вещами!"
10017040-77 = "Когда близкие и единомышленники сбиваются с пути..."
10017040-78 = "...мы должны понять их и вернуть на путь праведности."
10017040-79 = "Ведь какая помощь может быть лучше, чем устранить источник беды?"
10017040-80 = "Сэрина, Ханаэ, Сенсей."
10017040-81 = "Я собираюсь поговорить с Боевой группой Правосудия."
10017040-83 = "К-Капитан?!"
10017040-84 = "Э-э-эм..."
10017040-85 = "[s5] «П-погодите!»\n[s6] «Что вы собираетесь делать?!»"
10017040-89 = "Разумеется, я собираюсь выяснить правду."
10017040-90 = "Вы боитесь того, что я сделаю, когда узнаю её?"
10017040-91 = "Я напомню Боевой группе Правосудия, что означает её название."
10017040-92 = "Они наши товарищи — правы они или нет. Если правы, пусть остаются на правильном пути. Если неправы — их нужно исправить."
10017040-93 = "Н-но Боевая группа Правосудия прямо сейчас празднует конец года!"
10017040-94 = "..."
10017040-95 = "Тем хуже."
10017040-96 = "Наслаждаться Рождеством, не отвечая за свои поступки?"
10017040-97 = "Они буквально празднуют саму несправедливость!"
10017040-98 = "Эм, капитан? Капитан?!"
10017040-99 = "Слушайте, Сэрина, Ханаэ."
10017040-100 = "Вы можете остаться здесь или пойти со мной."
10017040-101 = "Что бы вы ни выбрали, я знаю, что вы постараетесь помочь настолько хорошо, насколько сможете. Решать вам."
10017040-102 = "Но я в любом случае прямо сейчас иду к Боевой группе Правосудия."
10017040-103 = "Вперёд с верой и честью в сердце! Медицина не знает границ!"
10017040-104 = ""
10017040-107 = ""
10017040-109 = "[ns] «Ч-что нам делать?!»"
10017040-110 = "Серьёзно, что делать? Капитан уже ушла..."
10017040-111 = "[s] «Нужно идти за ней!»"
10017040-112 = "Д-Да!"
