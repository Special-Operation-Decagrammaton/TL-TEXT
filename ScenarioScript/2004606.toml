[translation]
2004606-1 = "Девушка бросает кости"
2004606-2 = "По пути в Клуб Инь-Ян я заметил, что улица стала намного чище, чем раньше."
2004606-3 = "И не просто чище — красивее. Даже красивее, чем до фестиваля."
2004606-4 = ""
2004606-7 = "[ns] «Это... украшения из оригами?»"
2004606-8 = "Эй, здесь мы уже закончили устанавливать. Так оставить можно, да?"
2004606-9 = ""
2004606-10 = "Д-Да! Если вы уверены, что всё нормально!"
2004606-11 = "Размещать наши работы прямо на улице, где ходят люди... Надеюсь, они никому не будут мешать..."
2004606-12 = "Нет-нет, всё прекрасно! Мы как раз ломали голову, как снова сделать эту улицу красивой."
2004606-13 = "С сегодняшнего дня она перерождается как Улица оригами! Если о ней пойдёт молва и она станет знаменитой, когда-нибудь даже сможем провести фестиваль оригами!"
2004606-14 = "Фестиваль оригами... Хи-хи, надо же, впервые чувствую, что нас действительно заметили."
2004606-15 = ""
2004606-17 = ""
2004606-18 = "Простите, что вмешиваюсь, ребята, но насчёт нашей оплаты..."
2004606-19 = "Да, конечно, мы всё выплатим. И за нынешнюю уборку, И за всю работу на фестивале."
2004606-20 = "Простите, что наши сотрудники так грубо с вами обошлись. Они приняли вас за обычных Моурё. Не знали, что вы состоите в официальном клубе."
2004606-21 = "Ну, они не совсем ошиблись, ведь раньше мы и были «обычными Моурё»."
2004606-22 = "Но теперь мы, конечно, Клуб массовки! И спасибо, что признаёте всю нашу тяжёлую работу."
2004606-23 = "Это меньшее, что мы можем сделать, чтобы компенсировать задержку зарплаты!"
2004606-24 = "Будем рады поработать с вами и в следующий раз!"
2004606-25 = "Конечно!"
2004606-27 = "Я пошёл дальше по мирной улице..."
2004606-29 = "Эм, вы точно хотите поменяться с нами клубными комнатами?"
2004606-30 = "Наша находится ужасно далеко, и ещё ходят слухи, что там появляются призраки..."
2004606-31 = "Пф, такие Моурё, как мы, призраков не боятся! ...Погодите, мы ведь уже не Моурё, да? Неважно!"
2004606-32 = "Мы ищем место, где можно шуметь и буянить, не получая жалоб каждый раз, когда тренируемся!"
2004606-34 = "...и я прошёл мимо комнаты Клуба оригами..."
2004606-36 = "Так вот что произошло..."
2004606-37 = "Видите? Всё прекрасно разрешилось."
2004606-38 = "[s] «Полагаю, за всем этим стояла ты.»"
2004606-39 = "Нет. Я же говорила, я не умею видеть будущее или что-то такое."
2004606-40 = "Вы сами видели: я не сделала ровным счётом ничего."
2004606-41 = "Так что если всё разрешилось, это просто... как там говорится? Счастливая случайность."
2004606-42 = "Всё оказалось в нужном месте в нужное время, вот и сложилось само собой."
2004606-43 = "Можно сказать, это гармония инь и ян, ньяхаха..."
2004606-44 = "Хм, вы как будто... не удовлетворены этим ответом."
2004606-45 = ""
2004606-47 = ""
2004606-48 = "Позвольте снова спросить, Сенсей: что вы думаете о Хяккияко?"
2004606-49 = "[s1] «Это красивое место...»\n[s2] «...хотя „мирным“ я бы его по-прежнему не назвал.»"
2004606-52 = "Правда? Вот именно — очаровательное."
2004606-53 = "Красивая природа во все четыре сезона, весёлые фестивали один за другим, студенты, сосредоточенные на том, чем хотят заниматься..."
2004606-54 = "Как, по-вашему, всё это вообще сложилось вместе?"
2004606-55 = "Благодаря огромному везению, ньяхаха!"
2004606-56 = "Прямо как в этот раз: удивительные совпадения одно за другим складывались в нашу пользу."
2004606-57 = "...Вы всё ещё не совсем мне верите, да?"
2004606-58 = "Ладно. Если вам так хочется отдать КОМУ-ТО должное..."
2004606-59 = "Скажем, всё благодаря тому, что каждый незаметно делает свою часть работы."
2004606-60 = "[ns] «...»"
2004606-61 = "...Всё хорошо, что хорошо кончается, верно?"
2004606-62 = "Ньяхаха... Ну-у-у, в общем..."
2004606-63 = "Раз уж всё как-то само уладилось и все теперь довольны..."
2004606-64 = "...может, сегодня обойдёмся без нотации...?"
2004606-65 = "[ns] «Ния.»"
2004606-66 = ""
2004606-67 = ""
2004606-68 = "Ньяха...?"
2004606-69 = "[ns] «Сегодня тебе достанутся... поглаживания по голове.»"
2004606-70 = "Ньяха?!"
2004606-71 = ""
2004606-73 = ""
2004606-74 = ""
2004606-75 = ""
2004606-76 = ""
2004606-78 = "После этого я долго гладил её по голове."
