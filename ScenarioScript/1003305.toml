[translation]
1003305-1 = "Свидание, которое слегка пошло наперекосяк"
1003305-2 = "На всякий случай я заранее пришёл к месту встречи с Вакамо, чтобы предотвратить любые возможные неприятности."
1003305-3 = "[ns] «Мы вроде должны встретиться где-то здесь...»"
1003305-4 = "Хи-хи. Вы пришли рано, Сенсей."
1003305-5 = "[s] «Что за...?»"
1003305-6 = ""
1003305-9 = ""
1003305-10 = ""
1003305-11 = "Почему такой растерянный взгляд? Будто вы меня совсем не узнаёте."
1003305-12 = ""
1003305-13 = "*вздох* Пожалуй, мне уже пора привыкнуть, но каждый раз, когда я вижу вас впервые после долгой разлуки, моё сердце охватывает неописуемая боль."
1003305-14 = ""
1003305-15 = "Кажется, оно вот-вот выпрыгнет из груди, а в животе порхают бабочки."
1003305-16 = ""
1003305-17 = "Я едва могу себя контролировать и больше ни секунды не в силах оставаться вне ваших объятий."
1003305-18 = ""
1003305-21 = "[ns] «Это ты... Вакамо?!»"
1003305-22 = "Хи-хи. Да, мой дорогой. Это я — ваша единственная. ♥"
1003305-23 = "[s] «Ты выглядишь совсем иначе...»"
1003305-24 = "Правда?"
1003305-25 = "Полагаю, это действительно отличается от моей обычной одежды."
1003305-26 = "Мне хотелось надеть что-нибудь особенное на наше второе свидание."
1003305-27 = "К тому же я боялась, что мой обычный наряд привлечёт слишком много нежелательного внимания."
1003305-28 = "Если бы я, как в прошлый раз, просто шла за вами, это не было бы проблемой."
1003305-29 = "Но если сегодня мы везде будем ходить под руку, вполне естественно, что рядом с вами мне хочется выглядеть как можно лучше."
1003305-30 = "[s] «Как предусмотрительно...»"
1003305-31 = "Разумеется. Вы мне дороже всех на свете. ♥"
1003305-32 = "А теперь не будем терять ни минуты, Сенсей.#nЯ хочу, чтобы сегодня всё было идеально!"
1003305-33 = ""
1003305-35 = ""
1003305-36 = ""
1003305-38 = "Пойдёмте? Я так долго этого ждала."
1003305-39 = "[s] «Ага. Я тоже.»"
1003305-42 = "Я взял Вакамо под руку, и она повела нас в ресторан, где заранее забронировала столик на обед."
1003305-45 = "Вот мы и пришли. Я забронировала столик на двоих специально для нас."
1003305-46 = "[s] «Не ожидал настолько роскошного места.»"
1003305-47 = "Вы удивлены?"
1003305-48 = "Возможно, вы ожидали чего-нибудь более традиционного."
1003305-49 = "Тогда такая атмосфера подойдёт для нашего следующего свидания..."
1003305-50 = "Идею забронировать столик здесь я взяла из книги с советами о свиданиях, которую читаю. Там сказано, что если привести возлюбленного в такое первоклассное заведение, это показывает, насколько он вам дорог."
1003305-51 = "[s] «Ты ради такого книги читаешь?»"
1003305-52 = "Неважно, Сенсей. Давайте найдём наш столик."
1003305-53 = ""
1003305-55 = ""
1003305-56 = ""
1003305-57 = "Ах! Мне ужасно жаль!"
1003305-58 = "Что, простите?"
1003305-59 = "С сожалением вынужден сообщить, что из-за непредвиденных обстоятельств сегодня нам пришлось закрыться раньше."
1003305-60 = "Но... я же уже забронировала столик."
1003305-61 = "П-Прошу прощения. Нам в последний момент сообщили, что сегодня нас посетит особый гость, и..."
1003305-62 = "[s] «Особый гость?»"
1003305-63 = "Да. Наше заведение посетит Meat & Potatoes, знаменитый ресторанный критик, ставший вирусным в сети."
1003305-64 = "Руководство приказало нам подать идеальное блюдо, чтобы укрепить репутацию ресторана в интернете."
1003305-65 = "Это и наш шанс завируситься!"
1003305-66 = "Мне ужасно жаль, но, надеюсь, вы понимаете, почему нам пришлось закрыться раньше и отменить все бронирования."
1003305-67 = ""
1003305-69 = ""
1003305-71 = ""
1003305-72 = "[ns] «В-Вакамо?»"
1003305-73 = "Р-Разумеется, мы не собираемся отпускать вас с пустыми руками."
1003305-74 = "Пожалуйста, примите этот ваучер на ужин!"
1003305-75 = "Предъявите его при следующем посещении, и мы бесплатно устроим вам лучший ужин, который только можем предложить!"
1003305-76 = ""
1003305-78 = ""
1003305-79 = "[ns] «В-Вакамо? Всё в порядке. Просто пойдём в следующее место из списка!»"
1003305-82 = "День начался неудачно, и меня стало тревожить настроение Вакамо."
1003305-85 = "Следующим местом было выбранное ею кафе с десертами."
1003305-86 = "К-Кхм."
1003305-87 = "Пусть с бронью ресторана всё пошло не по плану..."
1003305-88 = "...не бойтесь, Сенсей."
1003305-89 = "Я тщательно изучила весь сегодняшний маршрут и нашла самые лучшие десерты, которыми мы сможем насладиться вместе."
1003305-90 = "В местном путеводителе, который я держу, написано, что в этом кафе есть особое десертное меню только для пар."
1003305-91 = "Разве это не чудесно звучит?"
1003305-92 = "Простите, я случайно услышал.#nВы сказали «десертное меню только для пар»?"
1003305-93 = "Мне очень жаль, но мы перестали подавать это меню ещё в прошлом году.#nМожно взглянуть на ваш путеводитель?"
1003305-94 = ""
1003305-96 = ""
1003305-97 = ""
1003305-98 = "Ах, вот этот. Кажется, наш владелец написал его в прошлом году ради забавы."
1003305-99 = "Ха-ха-ха!"
1003305-100 = "Х-Хаха... ха. П-Прошу меня извинить."
1003305-101 = "Не думал, что кто-то до сих пор читает путеводители, чтобы выбирать места для свиданий.#nКакой странный— то есть... интересный способ. Хаха."
1003305-102 = "В любом случае этого меню больше нет. Простите за путаницу."
1003305-103 = ""
1003305-106 = ""
1003305-107 = "[ns] «В-Всё нормально, Вакамо! Пойдём в следующее место!»"
1003305-111 = "Мы прибыли к следующему месту в списке."
1003305-112 = "Хорошо. Поспешим, Сенсей."
1003305-113 = "Уверена, на этот раз..."
1003305-114 = "...НИЧТО не помешает нам как следует провести время!"
1003305-115 = "Нужно лишь сесть на поезд, который придёт через две минуты, доехать до ближайшего парка развлечений и там успеть на представление—"
1003305-116 = ""
1003305-121 = "...?"
1003305-122 = ""
1003305-124 = ""
1003305-125 = ""
1003305-126 = "Смотри, куда прёшь!"
1003305-127 = "Ты вообще кто такая, принцесса?#nДраки ищешь?!"
1003305-128 = "Может, стоит преподать тебе урок!"
1003305-129 = ""
1003305-131 = ""
1003305-133 = ""
1003305-134 = "[ns] «Д-Давайте все успокоимся!»"
1003305-136 = ""
1003305-137 = "А? Как мне успокоиться, если она чуть плечо мне не вывихнула?!"
1003305-138 = "Ещё чуть-чуть — и всё!"
1003305-139 = "Совсем чуть-чуть!"
1003305-141 = ""
1003305-143 = ""
1003305-144 = "[ns] «Дыши, Вакамо! Дыши!»"
1003305-146 = ""
1003305-147 = "А?"
1003305-148 = ""
1003305-151 = ""
1003305-152 = "Прошу прощения. Мне следовало внимательнее смотреть, куда я иду."
1003305-153 = ""
1003305-155 = ""
1003305-156 = ""
1003305-158 = "Я ОЧЕНЬ НАДЕЮСЬ, что вы сможете меня простить..."
1003305-160 = ""
1003305-162 = ""
1003305-163 = "И-и!"
1003305-164 = "Д-Да, всё нормально...! Просто в следующий раз будь осторожнее!"
1003305-165 = "П-Пошли отсюда!"
1003305-166 = ""
1003305-168 = ""
1003305-170 = "Фух."
1003305-171 = "*ах* Наш поезд...!"
1003305-174 = "Мы опоздали на поезд и уже не успевали в парк развлечений к началу представления."
1003305-177 = "Н-Неважно. Вместо этого можем сходить в кино."
1003305-178 = "В-Вообще-то, кажется, недавно вышел новый, эм... романтический фильм!"
1003305-179 = ""
1003305-181 = ""
1003305-182 = "Ч-Что?! Все билеты распроданы...?"
1003305-183 = "Я не позволю этому закончиться вот так."
1003305-185 = "Только не снова..."
1003305-187 = "Уверена, следующее всё-таки пойдёт по плану!"
1003305-190 = "Одно за другим все занятия, которые запланировала Вакамо, срывались, пока день не подошёл к концу."
1003305-191 = ""
1003305-194 = "[ns] «Вот. Выпей это.»"
1003305-195 = "Ох... Спасибо, Сенсей."
1003305-196 = "Это очень мило с вашей стороны..."
1003305-197 = "[s] «Не грусти так. Такое бывает.»"
1003305-199 = "Я не могу не расстраиваться. Я изо всех сил старалась спланировать идеальный день с вами, но ничего не вышло так, как я надеялась..."
1003305-200 = "Это должен был быть лучший день в моей жизни, а всё пошло наперекосяк."
1003305-201 = "Мне так стыдно, что я едва могу смотреть вам в глаза.#nМне очень жаль, Сенсей. Я даже не знаю, что ещё сказать."
1003305-202 = "[s1] «Меня больше всего волнуешь ты.»\n[s2] «Сегодня ты была совсем не похожа на себя.»"
1003305-203 = "Вы беспокоитесь обо мне...?"
1003305-204 = "Вы беспокоитесь обо мне...?"
1003305-205 = "Ах, понятно. Вы хотите сказать, что для меня необычно было не срываться каждый раз, когда сегодня что-то шло не по плану."
1003305-206 = "Причина должна быть очевидна."
1003305-207 = "[s] «Разве?»"
1003305-208 = "Я дала вам обещание. Вы специально нашли для меня время.#nЭто был мой шанс побыть с вами и узнать вас лучше."
1003305-209 = "Меньше всего мне хотелось всё испортить."
1003305-210 = "Я знала, что если люди узнают, кто я на самом деле, это только создаст вам проблемы."
1003305-211 = "Поэтому я сдерживалась, чтобы не привлекать лишнего внимания."
1003305-212 = "Особенно потому, что... простите, если это прозвучит слишком самонадеянно..."
1003305-213 = "...я знаю, что сегодня не последний раз, когда мы сможем вот так побыть вместе."
1003305-214 = "Меньше всего мне хотелось терять терпение.#nУверена, у нас будет ещё бесчисленное множество возможностей."
1003305-215 = "Но всё равно было приятно видеть, как вы обо мне беспокоились.#nВсё ваше внимание действительно было приковано ко мне, правда?"
1003305-216 = "[s] «Д-Да. Наверное...»"
1003305-217 = "К сожалению, день уже почти закончился."
1003305-218 = ""
1003305-220 = ""
1003305-221 = ""
1003305-223 = "Можно попросить вас немного меня побаловать и проводить домой?"
1003305-224 = "[s] «Конечно. С удовольствием.»"
1003305-225 = "Хи-хи-хи!"
1003305-227 = "На следующее утро, как раз когда я собирался начать рабочий день..."
1003305-233 = ""
1003305-234 = "Я готова, Сенсей. Пойдёмте!"
1003305-235 = "[s] «В-Вакамо?! Что ты здесь делаешь?»"
1003305-236 = "Что я здесь делаю?"
1003305-237 = "Я пришла продолжить то, о чём мы говорили вчера вечером."
1003305-238 = "Как я и сказала: я смирилась со вчерашними неудачами, потому что знаю, что впереди у нас ещё бесчисленное количество дней вместе."
1003305-239 = "Так почему бы не начать прямо сейчас?"
1003305-240 = "На этот раз я идеально распланировала весь сегодняшний день! ♥"
1003305-241 = ""
1003305-244 = "[ns] «...»"
1003305-246 = "И так я отправился проводить с Вакамо ещё один день."
