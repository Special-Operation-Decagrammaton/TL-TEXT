[translation]
33100-1 = "Эпизод 10;Сладкая ложь"
33100-2 = ""
33100-3 = "Сенсей, вы чужак в Кивотосе, поэтому наверняка понимаете важность обещаний — договоров, сделок... и прочих подобных обязательств, верно?"
33100-4 = "Вы когда-нибудь слышали выражение «заключить сделку с дьяволом»?"
33100-5 = "История полна рассказов о трансцендентных сущностях, побеждённых теми самыми обещаниями, которые они дали."
33100-6 = "Заставляет задуматься, правда?"
33100-7 = "Обещание может связать вас, контролировать — даже определить, кем вы являетесь. Будь оно произнесено вслух или записано на клочке бумаги."
33100-8 = "Договоры, заповеди, обещания... Всё это фундаментально важно для основ Кивотоса, как и в древних сказаниях."
33100-9 = "Например, писания Тринити рассказывают о десяти заповедях, которые наши предки обещали соблюдать перед божественным."
33100-10 = "В текстах также сказано, что давным-давно нас изгнали из рая за нарушение этого обещания."
33100-12 = "Но вы уже знакомы с силой обещания.#nС его помощью вы спасли человека."
33100-14 = "Вспомните, что Гематрия требовала от студентов Абидоса — контракт..."
33100-15 = "Но как только этот контракт признали недействительным, Гематрии не оставалось ничего, кроме как отступить."
33100-16 = ""
33100-17 = "..."
33100-18 = "Этот инцидент похож."
33100-19 = "По своей сути Эдемский договор — соглашение между двумя академиями."
33100-20 = "Однако учтите особое место, где его должны были заключить."
33100-21 = "А также полномочия представителей, собравшихся для окончательного утверждения договора."
33100-22 = "Отряд Ариуса использовал эти элементы, чтобы исказить Эдемский договор и воссоздать условия Первого совета."
33100-23 = "Даже хранители первоначальных заповедей, Совет Святой Юстины, были вызваны через Мимесис."
33100-24 = "Иными словами, они исказили контракт и изменили его результат в свою пользу."
33100-25 = "Очень похоже на то, как, по словам Гематрии, должны действовать взрослые, не так ли?"
33100-26 = "..."
33100-27 = "Скажу прямо. Я знаю об этом, потому что наблюдала за ними через ваши сны."
33100-28 = "Боюсь, они за пределами моего понимания. Непостижимы."
33100-29 = "Но да. Именно Гематрия поддерживает Ариус."
33100-30 = "Теперь в распоряжении Ариуса грозная армия, которая не отступает и не может умереть."
33100-32 = "И всё это они сделали во имя того самого рая, из которого нас изгнали: Эдема."
33100-33 = ""
33100-35 = "А-А-А-А-А!"
33100-36 = ""
33100-44 = "..."
33100-45 = "..."
33100-46 = "Уф. Похоже, это было больно."
33100-47 = ""
33100-49 = ""
33100-50 = ""
33100-51 = "Какая наивность."
33100-52 = "Атаковать, не думая. Ты растеряла навыки, Азуса?"
33100-53 = "Партизанская война — твоя специальность. Перехитрить и ударить по врагу, когда он наиболее уязвим. Неужели ты настолько глупа, что решила атаковать меня в лоб?"
33100-54 = ""
33100-57 = "Г-Гх..."
33100-58 = "Саори... Что ты сделала? Чего ты надеешься... добиться...?"
33100-59 = "Сколько у нас времени?"
33100-60 = "Около пяти минут. К этому времени резервные силы обеих академий уже поймут ситуацию и прибудут."
33100-61 = "Этого хватит. Поднимите её."
33100-62 = ""
33100-64 = ""
33100-65 = ""
33100-66 = ""
33100-67 = ""
33100-68 = "Ты избавила меня от необходимости тебя искать, Азуса."
33100-69 = "..."
33100-70 = "Твоё предательство заставило нас немного изменить планы, но в конечном счёте мы всё смогли учесть."
33100-71 = "Я ожидала, что сегодня к нам присоединится Мика, но эта глупая девчонка нам всё равно больше не нужна."
33100-72 = "Нагиса была угрозой, но даже она не подозревала, что произойдёт от одного лишь присутствия на церемонии подписания."
33100-73 = "Даже Сестринство устранено — приятный бонус."
33100-74 = "Тогда позволь мне ответить на твои вопросы."
33100-75 = "Мы украли Эдемский договор."
33100-76 = "..."
33100-77 = "Мы сбросили крылатую ракету на собор, где проходила церемония, уничтожили фанатиков и забрали договор себе."
33100-78 = ""
33100-80 = ""
33100-81 = "Ты выглядишь растерянной."
33100-82 = "Забыла, Азуса? Мы имеем право представлять Тринити."
33100-83 = "..."
33100-84 = "Считай этот договор возрождением Первого совета — времени, когда собрались все фракции, которые должны были составить Тринити. Все, кроме Ариуса."
33100-85 = "Воссоздав тот день, мы всё ещё обладаем полномочиями."
33100-86 = "В договоре сказано: «При возникновении спора между Тринити и Геенной он разрешается через Организацию Эдемского договора...»"
33100-87 = "Мы лишь дополнили этот пункт. Теперь он продолжается так: «...а отряд филиала Ариуса выступает указанной Организацией Эдемского договора»."
33100-88 = "С-Само по себе это мало что значило бы. Если бы не заповеди."
33100-89 = ""
33100-91 = ""
33100-95 = ""
33100-96 = ""
33100-97 = ""
33100-99 = "Совет Святой Юстины."
33100-100 = "Хранители заповедей и легендарные вооружённые силы Тринити."
33100-101 = "Если точнее, те, кого ты видела, лишь Мимесисы, но священный долг они выполнят так же."
33100-102 = "Любые враждебные действия между Тринити и Геенной будут считаться нарушением божественных заповедей и караться соответствующим образом."
33100-104 = "Теперь я понимаю."
33100-105 = "Это нападение было не ради устранения лидеров обеих академий и не ради хаоса."
33100-106 = "Всё было ради изменения Эдемского договора и получения этих загадочных солдат."
33100-107 = "(язык жестов)"
33100-108 = "Нет, Ацуко. Я не могу вернуться."
33100-109 = "Бесполезно пытаться её переубедить, Химэ. У этой слишком упрямая воля, её так просто не сломать."
33100-110 = "Верно. Всё это время рядом с ней был кто-то, кто поощрял это упрямство, да?"
33100-111 = "Порочный взрослый, который искажает истину этого мира и забил тебе голову ложью."
33100-112 = "Но теперь с ним покончено. Мы можем не спеша начать твоё перевоспитание с самого начала. Торопиться некуда."
33100-113 = "Что вы сделали с Сенсеем?!"
33100-114 = "Похоже, в Тринити тебе было весело."
33100-115 = "Ты наслаждалась? Полюбила этих людей и решила, что они тебя понимают?"
33100-116 = "Как тщетно."
33100-117 = "Только мы когда-либо могли тебя понять. Только мы примем настоящую тебя. Твоё место здесь."
33100-118 = "Ты отвела взгляд от истины и ослепла от сладкой лжи. Именно твоя слабость стала причиной поражения."
33100-119 = "Хочешь нас остановить?"
33100-120 = "Тогда уничтожь мой нимб, Азуса."
33100-121 = "...!"
33100-122 = "Заповеди будут действовать вечно, пока существуем мы — арбитры этого договора."
33100-123 = "Другого способа нас остановить нет."
33100-124 = "Но спроси себя: действительно ли ты на это способна? Ты провалила миссию по уничтожению нимба Сэи."
33100-125 = "...!"
33100-126 = "Ты изо всех сил пыталась умыть руки. Даже пыталась нас обмануть. Но в итоге тебе просто не хватает решимости."
33100-127 = "Лишь вопрос времени, когда мы снова найдём Сэю и закончим то, чего ты не смогла."
33100-128 = ""
33100-130 = ""
33100-132 = "Что это? Мягкая игрушка?"
33100-133 = ""
33100-138 = "...!"
33100-139 = ""
33100-141 = ""
33100-142 = "Азуса! Всё ещё пытаешься сбежать?!"
33100-143 = "Это артиллерия одного из подразделений поддержки Чаепития, лидер. Они отреагировали быстрее, чем ожидалось."
33100-144 = ""
33100-148 = "С другого направления по нам также ведут огонь 50-мм миномёты. Должно быть, гранатомётчики Дисциплинарного комитета."
33100-149 = "Они тоже отреагировали быстрее ожидаемого, даже несмотря на состояние Хины."
33100-153 = "Геенна предала нас! Разбейте их и спасайте раненых!"
33100-154 = "Видимость улучшается!"
33100-155 = "Впереди замечены гранатомётчики Геенны!"
33100-157 = "Как они посмели тронуть главу Дисциплинарного комитета. Они заплатят. Уничтожьте силы Тринити и спасите председателя!"
33100-158 = "Подразделения поддержки, ищите раненых и оказывайте помощь!"
33100-159 = "А вы, старший администратор? Вы ранены."
33100-161 = "Забудьте обо мне! Главное — найти и обеспечить безопасность главы!"
33100-162 = ""
33100-169 = "Я-Я подтверждаю: резервные силы Геенны и Чаепития, находившиеся снаружи собора, тоже начали движение!"
33100-170 = "Бронетанковые подразделения обеих академий скоро будут здесь."
33100-171 = "Азуса..."
33100-172 = "С ней разберёмся позже, лидер. Ваши приказы?"
33100-173 = "..."
33100-174 = "Совет у нас."
33100-175 = "Следующая цель — Тринити. Через подземные ходы проникнем в их кампус."
33100-177 = "Пусть и ненадолго, но Азуса начала называть это место своим домом. Она попыталась заменить место, откуда пришла, этими иллюзиями. Поэтому я сотру его — не останется ни следа."
33100-178 = "В-Вот что она получает за предательство, да?"
33100-179 = "..."
33100-180 = "Мы уже проникали во внутренние территории Тринити во время атак на Сэю и Нагису. Это будет достаточно просто."
33100-181 = "С Геенной разберёмся позже. Без Хины они не угроза. Возражений нет, лидер."
33100-182 = "Предлагаю подождать здесь, пока та деревянная кукла не добудет обещанное нам тактическое оружие. А пока разберёмся с танками и резервами."
33100-183 = ""
33100-185 = ""
33100-187 = "Пожалуй, так будет лучше. Покажем им, с кем они связались."
33100-188 = "Добро пожаловать, Тринити — источник наших страданий, — и презренные отступники из бездн Геенны!"
33100-189 = "Ч-Что...? Мы всё-таки будем сражаться с ними здесь?"
33100-190 = "Ох. Б-Будет тяжело — очень тяжело... но, похоже, иначе никак, да? Хе..."
33100-191 = ""
33100-193 = ""
33100-197 = ""
33100-198 = ""
33100-199 = ""
33100-200 = "Внемли моим словам, Совет! Следуй приказам ОЭД и уничтожь этих еретиков!"
33100-201 = ""
33100-207 = "К-Кто они такие?!"
33100-208 = "Э-Это призраки?! А-а-а-а-а!"
33100-209 = ""
33100-216 = "Следующий эпизод;Усугублённая неразбериха, часть 1"
