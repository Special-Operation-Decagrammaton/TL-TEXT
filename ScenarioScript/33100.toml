[translation]
33100-1 = "Episódio 10;Doce Mentira"
33100-3 = "Sensei, você é um adulto que veio de fora de Kivotos. Sendo assim, deve conhecer muito bem a importância que contratos, acordos... e outros tipos de \"promessas\" carregam."
33100-4 = "Por exemplo, existe aquela expressão \"fazer um pacto com o demônio\", não é?"
33100-5 = "Nos contos antigos, também há várias histórias em que \"um ser extraordinário é derrotado por ter feito uma promessa descuidada\", ou, pelo contrário, \"triunfa justamente por meio de uma promessa dessas\"."
33100-6 = "A partir disso, não podemos interpretar as coisas da seguinte forma?"
33100-7 = "Mesmo que não passe de um simples pedaço de papel ou de um acordo verbal... uma \"promessa\" às vezes tem o poder de restringir e definir algo com muita força."
33100-8 = "Contratos, preceitos, promessas... Assim como nesses contos antigos, esses conceitos também têm uma importância fundamental em Kivotos."
33100-9 = "Nas escrituras de Trinity, por exemplo, estão descritos a \"Divindade\" dos primórdios e os dez mandamentos firmados com ela."
33100-10 = "Além disso, também foi transmitido por escrito que fomos expulsas do paraíso porque quebramos uma \"promessa\" no princípio de tudo..."
33100-12 = "...Talvez seja redundante falar disso a essa altura. Afinal, você mesmo já usou esse tipo de conceito na prática para salvar alguém."
33100-14 = "Lembre-se. A \"Gematria\" não podia forçar as alunas de Abydos a nada; eles apenas exigiam um \"contrato\"."
33100-15 = "Se esse contrato não fosse firmado, a Gematria não teria escolha a não ser recuar."
33100-17 = "..."
33100-18 = "Em resumo, este incidente segue essa exata mesma lógica."
33100-19 = "O \"Tratado do Éden\", por si só, certamente é uma promessa firmada entre academias."
33100-20 = "Contudo, o \"lugar especial\" onde esse tratado é realizado..."
33100-21 = "E a qualificação das representantes que se reuniram para a sua assinatura."
33100-22 = "Por conta desses elementos, ele se tornou uma \"promessa\" de enorme significado. Mesmo distorcida, trata-se claramente de uma recriação do \"Concílio\"."
33100-23 = "E, por meio de um método especial, fizeram o Concílio das Santas de Justina, que protege os \"preceitos\" dessa promessa, se manifestar como \"Réplicas\"."
33100-24 = "No fim das contas, deturparam e distorceram o contrato para forjar o resultado que desejavam... Podemos resumir assim."
33100-25 = "Esse é o tal \"jeito dos adultos\" de que a Gematria tanto fala..."
33100-26 = "..."
33100-27 = "...Ah. Só por precaução, deixe-me esclarecer que eu não sabia de tudo isso de antemão. Eu apenas observei através dos seus sonhos."
33100-28 = "Afinal, aqueles seres são incompreensíveis e ultrapassam o meu entendimento básico."
33100-29 = "Deixando as formalidades de lado, o resumo da ópera é que... por trás de Arius, está a \"Gematria\"."
33100-30 = "E Arius obteve um exército poderoso que não cai nem morre. Essa é a situação atual e o fato concreto."
33100-32 = "Tudo sob o tratado que leva o nome do paraíso do qual fomos expulsas no passado... o \"Éden\"."
33100-35 = "Aaaaaaaaah!!"
33100-44 = "Ufa..."
33100-45 = "..."
33100-46 = "A-Aah... I-Isso parece doer tanto..."
33100-51 = "...Imatura como sempre."
33100-52 = "Avançar sem pensar em nada... Você perdeu o juízo, Azusa?"
33100-53 = "Sua especialidade é a guerra de guerrilha, aproveitando as brechas do inimigo. Você sabe muito bem disso, então por acaso achou que poderia me vencer num confronto direto?"
33100-57 = "Guh, ugh...!"
33100-58 = "Saori... Essa situação... Qual é o seu objetivo...?"
33100-59 = "...Misaki, quanto tempo nos resta?"
33100-60 = "Uns 5 minutos. Acho que já devem estar entendendo a situação, então as forças de reserva de ambas as academias devem chegar a qualquer momento."
33100-61 = "É o suficiente... Levante-a."
33100-68 = "Você ter se dado ao trabalho de vir até aqui nos poupou tempo."
33100-69 = "..."
33100-70 = "A sua traição causou um pequeno desvio no plano, mas... está dentro da margem de erro."
33100-71 = "Originalmente, minha leitura era de que a Mika viria até aqui. Mas aquela idiota já não tem mais utilidade."
33100-72 = "Sendo assim, o elemento perigoso era a Nagisa, mas, felizmente, ela participou da cerimônia de assinatura sem levantar nenhuma suspeita."
33100-73 = "Conseguir eliminar até a Irmandade de uma só vez foi um resultado inesperado, mas bem-vindo."
33100-74 = "...Vou te contar o que está acontecendo."
33100-75 = "Nós roubamos o \"Tratado do Éden\"."
33100-76 = "..."
33100-77 = "Cravamos um míssil de cruzeiro na Antiga Catedral onde o tratado seria assinado, limpamos os estorvos do caminho e distorcemos o conteúdo do tratado."
33100-81 = "Sua cara diz que \"não consegue entender\"."
33100-82 = "...Esqueceu, Azusa? Nós temos a qualificação como parte de \"Trinity\"."
33100-83 = "..."
33100-84 = "Este tratado é uma recriação do \"Primeiro Concílio\". Até aquela época, cada facção detinha o seu próprio poder. E, no dia do Concílio, todas as facções se reuniram e se tornaram a nova Trinity... exceto nós, \"Arius\"."
33100-85 = "Por isso, nada mudou para nós. Formalmente, ainda detemos a nossa autoridade."
33100-86 = "\"Quando ocorrer um conflito entre Trinity e Gehenna, a 'Organização do Tratado do Éden' deverá intervir e resolver o conflito\"..."
33100-87 = "Esse é o Tratado do Éden. Nós apenas acrescentamos uma linha dizendo: \"A Organização do Tratado do Éden ficará a cargo do Esquadrão Arius\". Simples assim."
33100-88 = "S-Só isso pode parecer não ter muito significado, mas... como os preceitos são verdadeiros, se pudermos replicá-los..."
33100-99 = "O \"Concílio das Santas de Justina\"."
33100-100 = "As guardiãs dos preceitos e a lendária força militar de Trinity."
33100-101 = "Para ser exata, são réplicas delas, mas continuam sendo entidades que protegem os preceitos. Ou seja, elas vão ajudar a nós, a \"ETO\"."
33100-102 = "Atos hostis entre Trinity e Gehenna são uma violação aos preceitos sagrados. Em outras palavras, são a causa do conflito e alvos de supressão."
33100-104 = "...Finalmente entendi."
33100-105 = "Este ataque não tinha como único objetivo atingir a liderança de cada academia, nem apenas instaurar o caos."
33100-106 = "Reescrever o Tratado do Éden... O objetivo de vocês era garantir essa força militar misteriosa através disso..."
33100-107 = "(Passo, passo...)"
33100-108 = "...Atsuko, não pode fazer isso."
33100-109 = "Deixe pra lá, Princesa. Agora é inútil. Quebrar a teimosia dela não é tão fácil assim... Sempre foi desse jeito, não é?"
33100-110 = "...Deve ter havido alguém bem ao lado dela atiçando essa teimosia e esses sentimentos."
33100-111 = "Um adulto mau... que esconde a verdade deste mundo, distorce os fatos e ensina mentiras."
33100-112 = "Bom, já demos um jeito nesse tal Sensei também. Então, agora só precisamos reeducá-la com calma."
33100-113 = "...!!"
33100-114 = "...Você parecia estar se divertindo em Trinity."
33100-115 = "Aquela vida foi divertida? Estar junto das pessoas de quem você gosta, estar junto de pessoas que te entendem..."
33100-116 = "...Que vazio."
33100-117 = "Lembre-se. As únicas que te entendem e te aceitam somos nós. Aqui é o seu lugar."
33100-118 = "Você desviou os olhos dessa verdade e ficou cega por uma doce mentira. E é essa fraqueza que está te fazendo ser derrotada assim."
33100-119 = "...Quer nos impedir?"
33100-120 = "Então tente destruir o meu halo, Shirasu Azusa."
33100-121 = "...!"
33100-122 = "Enquanto nós, os sujeitos do tratado, existirmos, esses preceitos continuarão vigentes para sempre."
33100-123 = "A menos, é claro, que você destrua os nossos halos."
33100-124 = "O que falta em você agora é intenção de matar... Mas será que você é capaz de algo assim? Você, que fugiu até mesmo daquela missão da Seia."
33100-125 = "...!?"
33100-126 = "Tentar nos enganar só para continuar em um lugar limpo... Alguém como você jamais conseguiria fazer isso."
33100-127 = "...Vamos encontrar a Seia logo depois disto também. Nós mesmas vamos limpar a bagunça que você deixou para trás."
33100-132 = "...Uma pelúcia?"
33100-138 = "!?"
33100-142 = "Vai fugir de novo, Azusa?!"
33100-143 = "Líder, parece ser a unidade de artilharia subordinada à Tea Party. Chegaram mais rápido do que o previsto."
33100-148 = "Morteiros de 50mm vindos do lado oposto... Deve ser a tropa de reserva do Comitê Disciplinar."
33100-149 = "Eles também foram mais rápidos do que eu imaginava, mesmo sem aquela Hina..."
33100-153 = "Acabamos de receber um relato de que fomos apunhaladas pelas costas por Gehenna! Precisamos acabar com elas o mais rápido possível...!!"
33100-154 = "Disparar um míssil contra o local da cerimônia de assinatura... Essa corja de Gehenna não tem limites...!"
33100-155 = "...! Unidade de granadeiras de Gehenna avistada à frente!"
33100-157 = "Como ousam... Como ousam fazer aquilo com a Chefe...! Eu jamais vou perdoá-las! Temos que esmagar Trinity e encontrar a Chefe o quanto antes...!"
33100-158 = "Unidades da retaguarda, encarreguem-se da busca e do resgate das outras feridas! Eu vou imediatamente...!"
33100-159 = "Oficial Executiva, os seus ferimentos..."
33100-161 = "Meus ferimentos não importam agora! Vamos logo procurá-la!! Rápido!!"
33100-169 = "C-Confirmado que as forças de reserva de Gehenna e da Tea Party que aguardavam do lado de fora da Antiga Catedral também começaram a se mover...!"
33100-170 = "As divisões de tanques padrão de ambas as academias devem passar por esta área a qualquer momento..."
33100-171 = "Azusa..."
33100-172 = "Líder, deixe a Azusa para depois. O que faremos agora?"
33100-173 = "..."
33100-174 = "Já garantimos o \"Concílio das Santas de Justina\"."
33100-175 = "A próxima é Trinity. Vamos contornar pela passagem subterrânea até a retaguarda do distrito autônomo de Trinity e esmagá-las a partir de lá."
33100-177 = "O lugar onde aquela lá passou nem que fosse um único instante... Vou apagar tudo, sem deixar uma única árvore ou um único galho de pé..."
33100-178 = "O-O preço da traição, é...?"
33100-179 = "..."
33100-180 = "...Bom, Gehenna sem a Hina pode ficar para depois. Não tenho objeções, líder."
33100-181 = "Já nos infiltramos em Trinity várias vezes durante os ataques à Seia e à Nagisa. E Gehenna, tendo perdido a Chefe do Comitê Disciplinar, não passa de um bando desorganizado."
33100-182 = "...Sendo assim, vamos aguardar por enquanto até garantirmos a \"arma tática\" que aquele boneco de madeira prometeu. Por ora, basta lidarmos na medida certa com os tanques e as forças de reserva das duas academias aqui mesmo."
33100-187 = "...Tem razão. Bom, vamos dar as boas-vindas a quem se deu ao trabalho de vir até aqui."
33100-188 = "Às odiadas Trinity e Gehenna, que nos empurraram até os confins do sofrimento..."
33100-189 = "E-Então vamos mesmo lutar, não é?"
33100-190 = "P-Parece que vai ser tão difícil... Vai ser muito duro, mas n-não tem outro jeito, né... Hehe."
33100-200 = "Venha, \"Concílio das Santas de Justina\". Auxilie a nós, a \"Organização do Tratado do Éden\", e subjugue os \"alvos de supressão\"."
33100-207 = "O-O que é aquilo...?!"
33100-208 = "Uaaaaah?! F-Fantasmas?!"
33100-216 = "Próximo;Caos Acelerado (1)"
