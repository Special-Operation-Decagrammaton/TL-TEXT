[translation]
70007010-1 = "Случайная встреча 1"
70007010-2 = ""
70007010-3 = "Наверное, это здесь..."
70007010-4 = "Кто бы мог подумать, что это единственный фитнес-центр, открытый в шесть утра? Невероятно."
70007010-5 = "Почти так же невероятно, как то, что мои однокурсницы взорвали туалет в нашем спортзале пластиковой взрывчаткой..."
70007010-6 = "А потом вышвырнули эллиптический тренажёр через окно, когда я попросила их убрать блины со штанги на место..."
70007010-7 = "Из-за них мне целую неделю придётся ездить в другой зал, пока всё ремонтируют."
70007010-8 = "Хотя будет приятно получить взрывостойкие двери, пуленепробиваемые стёкла и... более мягкое освещение в туалете."
70007010-9 = ""
70007010-11 = ""
70007010-13 = ""
70007010-14 = ""
70007010-15 = ""
70007010-16 = "Мм!"
70007010-17 = "А здесь лучше, чем я думала!"
70007010-18 = "По крайней мере, свободных кардиотренажёров полно. Обычно их быстро занимают."
70007010-19 = ""
70007010-21 = ""
70007010-23 = ""
70007010-24 = ""
70007010-25 = ""
70007010-26 = ""
70007010-27 = "Ч-Что...?"
70007010-29 = "?!"
70007010-30 = "(О-о боже!)"
70007010-31 = "(Я едва не вскрикнула. Не закричала!)"
70007010-32 = "(Увидеть такую женщину! Богиню!)"
70007010-33 = "(Такая сепарация, рельеф и... венозность! В этом скромном зале?)"
70007010-34 = "(Я просто стою и пялюсь. Надо что-нибудь сказать!)"
70007010-35 = ""
70007010-36 = "Простите. Вам что-то нужно?"
70007010-37 = "Я немного заблудилась. В-вы не знаете, где раздевалка?"
70007010-38 = "Ох, милая. Так это и ЕСТЬ раздевалка."
70007010-39 = "Эм... Простите! Я здесь впервые."
70007010-40 = "Не нужно извиняться. Мы все когда-то... начинали."
70007010-41 = "Не страдай молча, милая. Если понадобится помощь — найди меня!"
70007010-42 = ""
70007010-44 = ""
70007010-45 = "(Она такая добрая... Какая гостеприимная женщина!)"
70007010-47 = ""
70007010-48 = "Так! Утреннее протеиновое чаепитие окончено, пора начинать."
70007010-49 = ""
70007010-51 = ""
70007010-52 = ""
70007010-53 = "(Протеиновый чай... и даже изящная чашка к нему? Поразительно.)"
70007010-54 = "(А ещё куриная грудка, батат и бананы, сложенные слоями. Как эффективно!)"
70007010-55 = "(Я знаю, что в зале неприлично пялиться. Не хочу показаться грубой, но...)"
70007010-56 = "(Я никогда даже не слышала о такой программе тренировок, не то что видела её!)"
70007010-57 = "(Такой образец физической формы необходимо изучить! Я обязана раскрыть её секреты!)"
70007010-58 = "(И хотя сегодня у меня кардио, может, получится... добавить несколько НОВЫХ упражнений...)"
70007010-59 = ""
70007010-61 = ""
70007010-62 = ""
70007010-64 = ""
70007010-65 = "Хорошо, начнём мягко — с нескольких приседаний со штангой."
70007010-66 = "Эм, милая! Да, ты!"
70007010-67 = "Да... мэм?"
70007010-68 = "Мне немного опасно самой навешивать блины на эту стойку для приседаний."
70007010-69 = "Не поможешь мне... если не сложно? Думаю взять лёгенькие 100 кг."
70007010-70 = "(Это довольно тяжело... Погодите, она сказала «лёгенькие»...?)"
70007010-71 = "К-конечно. Я люблю помогать кому-то... растить мышцы."
70007010-72 = "Большое спасибо!"
70007010-73 = ""
70007010-75 = ""
70007010-76 = ""
70007010-77 = ""
70007010-78 = ""
70007010-79 = ""
70007010-80 = "Так правильно?"
70007010-81 = ""
70007010-83 = ""
70007010-84 = "...Почему ты повесила только два блина по 20 кг?"
70007010-85 = "Простите?"
70007010-86 = "По 40 кг с каждой стороны — это 80 кг. Плюс 20 кг весит сам гриф. Итого... 100 кг?"
70007010-87 = "Хе-хе-хе! Какая же ты забавная!"
70007010-88 = "Если нужно 100 кг, значит, надо повесить по 50 кг с каждой стороны!"
70007010-89 = "Н-но гриф весит 20 кг?!"
70007010-90 = "Гриф — всего лишь аксессуар, дорогая. Ха! Считать вес грифа... как мило!"
70007010-91 = "Если бы гриф имел значение, на нём бы изящно выгравировали «20 кг», разве нет?"
70007010-93 = ""
70007010-95 = ""
70007010-96 = ""
70007010-97 = "(Она... совершенно необыкновенная!)"
70007010-98 = "(Все вокруг пытаются добавить к рабочему весу хотя бы килограмм, а она обращается с двадцатью так, будто их вообще нет!)"
70007010-99 = "(Какой настрой... настоящий... максимально ориентированный на рост грайндсет!)"
70007010-100 = "(Так вот что значит... «истинная сила»...!)"
70007010-101 = ""
70007010-102 = ""
70007010-104 = ""
70007010-105 = "Для разминки достаточно. Пора на тягу верхнего блока!"
70007010-106 = "..."
70007010-107 = "(Она смотрит на меня. Она знает, что я за ней наблюдала...)"
70007010-108 = "(Просто я так давно не видела присед на 120 кг — нет, на 100 кг. Да ещё с такой техникой!)"
70007010-109 = "(Надо вести себя естественно. Точно... будто я просто случайно решила делать то же упражнение.)"
70007010-110 = "Хм, сегодня работаем налегке, так что просить её садиться сверху на груз я не стану..."
70007010-111 = "Ну что же, начинаем!"
70007010-112 = "Раз... Два... Три... Четыре..."
70007010-113 = "(Несмотря на огромный вес, она сохраняет идеальную технику и контролирует дыхание.)"
70007010-114 = "Пять... Шесть..."
