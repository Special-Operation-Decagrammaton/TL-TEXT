[translation]
1008605-1 = "Хина и пианино"
1008605-3 = "Когда я прибыл, в зале для вечеринок стояла зловещая тишина."
1008605-4 = "[ns] «Я пришёл куда надо, но где Хина?»"
1008605-5 = "А, Сенсей. Вы точно вовремя."
1008605-6 = "[s] «Хина, ты—»"
1008605-12 = "[ns1] «Ты снова играешь на пианино?»\n[ns2] «Ты позвала меня сюда потому что—?»"
1008605-13 = "― [log=히나 드레스]Сейчас...[/log][wa:440]"
1008605-14 = "― [log=히나 드레스]Сейчас...[/log][wa:440]"
1008605-15 = "― [log=히나 드레스]Я сыграю для вас.[/log][wa:2500]"
1008605-18 = "[ns] «Разве ты уже не играла на вечеринке Геенны?»"
1008605-19 = "― [log=히나 드레스]Н-Нет. Тогда...[/log][wa:2340]"
1008605-20 = "― [log=히나 드레스]Тогда мы были не вдвоём...[/log][wa:3090]"
1008605-23 = "― [log=히나 드레스]Я... продолжала тренироваться потому что...[/log][wa:2160]"
1008605-24 = "― [log=히나 드레스]Хотела сыграть для вас...[/log][wa:2360]"
1008605-27 = "― [log=히나 드레스]Если я брошу, прежде чем вы услышите мою песню...[/log][wa:420]"
1008605-28 = "― [log=히나 드레스]Не думаю, что смогу себя простить.[/log][wa:2620]"
1008605-31 = "[ns] «Раз ты так говоришь, я понимаю. Всё моё внимание твоё.»"
1008605-32 = "― [log=히나 드레스]А-А?[/log][wa:760]"
1008605-33 = "― [log=히나 드레스]То есть, это—это не настолько серьёзно...[/log][wa:3200]"
1008605-36 = "― [log=히나 드레스]А если ваши ожидания слишком высоки...[/log][wa:10]"
1008605-37 = "― [log=히나 드레스]Мне может быть трудно доиграть до конца.[/log][wa:1620]"
1008605-40 = "[ns] «Ничего страшного, если будут ошибки. Это всё равно будет твоя песня. И я всё равно хочу её услышать.»"
1008605-41 = "― [log=히나 드레스]Эм... Х-Хорошо...[/log][wa:3720]"
1008605-42 = "― [log=히나 드레스]Да... Вы всегда были таким.[/log][wa:4160]"
1008605-45 = "― [log=히나 드레스]Хорошо...[/log][wa:140]"
1008605-46 = "― [log=히나 드레스]Пожалуйста, слушайте внимательно.[/log][wa:2560]"
1008605-49 = "― [log=히나 드레스]...Это мой выход на бис. Только для вас.[/log][wa:1220]"
1008605-56 = "Я слушал, как Хина играет на пианино. Это был концерт, который случается лишь раз в жизни. Только для нас двоих."
