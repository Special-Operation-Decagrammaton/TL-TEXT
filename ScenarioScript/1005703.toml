[translation]
1005703-1 = "Средства и цели"
1005703-3 = "Сюда! Низкие цены! Новогодняя скидка! Новогоднее предложение!"
1005703-4 = "Смотрите сюда! Посмотрите прямо сейчас и получите бонус!"
1005703-5 = "Что ищете? Что бы это ни было, у нас есть! И всё свежее!"
1005703-6 = "[s] «Что это за место?»"
1005703-7 = ""
1005703-8 = "Хи-хи."
1005703-9 = "Это открытый рынок."
1005703-10 = "В такие дни здесь шумно и оживлённо. Хотя, если честно, ещё шумнее и оживлённее, чем обычно."
1005703-11 = "[s] «Да, это я понял, но что мы здесь делаем?»"
1005703-12 = "Ну..."
1005703-13 = "Поле боя!"
1005703-14 = "Поле боя, заляпанное едой! Вот почему."
1005703-15 = "Продавцы пытаются продать хорошие продукты подороже."
1005703-16 = "Повара, владельцы ресторанов и обычные люди пытаются выжить, купив их подешевле."
1005703-17 = "Каждому нужна своя лучшая цена, и за неё идёт жестокая борьба!"
1005703-18 = "Сейчас мы, по сути, военные корреспонденты."
1005703-19 = "Я паломница на пути гастрономии."
1005703-20 = "Я должна стать свидетелем не только самой гастрономии..."
1005703-21 = "Но и того, как она рождается."
1005703-22 = ""
1005703-26 = ""
1005703-28 = "Эй! Эй! Смотрите сюда! Первый лот сегодня — трёхкилограммовый морской лещ!"
1005703-29 = "Посмотрите на этот блеск! На этот цвет!"
1005703-30 = "Такого больше нигде не найдёте!"
1005703-32 = "Хм... Лещ и правда хороший..."
1005703-33 = "И сколько же он будет стоить? Не хочу тратить слишком много на одну рыбу."
1005703-34 = "Начальник сказал купить хорошего леща любой ценой, но неужели он имел это в виду буквально?"
1005703-35 = ""
1005703-36 = "Начинаем с шести тысяч пятисот!"
1005703-37 = "Семь тысяч!"
1005703-38 = "Семь тысяч двести!"
1005703-39 = "С-Семь тысяч триста!"
1005703-40 = "Ха-ха. С самого начала жарко! Семь тысяч пятьсот!"
1005703-41 = "Я не... Не могу... Семь тысяч семьсот!"
1005703-42 = "Надеюсь, начальник поймёт... Семь тысяч семьсот пятьдесят!"
1005703-44 = "Смотрите, Сенсей. Всё становится по-настоящему жарко."
1005703-45 = "Именно ради такой напряжённой битвы мы сюда и пришли."
1005703-46 = "И эта страсть, которой наполнен воздух..."
1005703-47 = "Она вдохновляет."
1005703-48 = "[s] «Похоже, тебе весело, Харуна.»"
1005703-49 = "Да. Для них это повседневность, а для меня — редкое зрелище."
1005703-50 = "Когда я на них смотрю, мне самой хочется..."
1005703-51 = "[s] «А?»"
1005703-52 = "Девять тысяч!"
1005703-53 = "[s] «Харуна?!»"
1005703-55 = "Хм, а это кто? Сразу пошла ва-банк!"
1005703-56 = "Клянусь честью повара, я не отступлю."
1005703-57 = "*вздох* ...Может, просто позвонить начальнику?"
1005703-58 = "Девять тысяч пятьсот!"
1005703-59 = "Девять тысяч восемьсот!"
1005703-60 = "Десять тысяч!"
1005703-61 = ""
1005703-65 = "После этого торги становились всё жарче."
1005703-66 = "И, как ни странно, победительницей вышла Харуна."
1005703-67 = "Давайте просто не будем говорить об итоговой цене..."
1005703-68 = ""
1005703-70 = ""
1005703-71 = ""
1005703-72 = "Хе-хе-хе... Ха-ха-ха!"
1005703-73 = "[s] «...Ты в порядке?»"
1005703-74 = "Не о чем беспокоиться."
1005703-75 = "Это небольшая цена за возможность глубже погрузиться в мир гастрономии."
1005703-76 = "Хотя теперь нужно решить, что делать с этим лещом..."
1005703-77 = "Есть ресторан, где готовят блюда на усмотрение шефа из продуктов клиента."
1005703-78 = "Хотите пойти со мной?"
1005703-79 = ""
1005703-85 = ""
1005703-86 = "Спасибо за ожидание. Это каша с морским лещом."
1005703-87 = "А это..."
1005703-88 = ""
1005703-90 = ""
1005703-92 = "Суши и сашими из морского леща."
1005703-93 = "Мы лишь слегка ошпарили кожу горячей водой."
1005703-94 = "Угу, угу."
1005703-95 = ""
1005703-96 = "Это тэмпура из леща и роллы с лещом."
1005703-97 = "Угу."
1005703-98 = ""
1005703-99 = "Прозрачный удон на бульоне из костей и мяса щёк морского леща."
1005703-100 = "Спасибо за угощение."
1005703-102 = "А это ваш десерт. Мороженое с молотыми сухофруктами."
1005703-103 = ""
1005703-105 = ""
1005703-106 = "Большое спасибо."
1005703-109 = "Ну как вам, Сенсей?"
1005703-110 = "[s1] «Не представляю, как они всё это приготовили...»\n[s2] «Всё было потрясающе.»"
1005703-113 = "Серьёзно?"
1005703-114 = "Для блюда из настолько разрекламированного аукционного лота..."
1005703-115 = "...на мой взгляд, получилось довольно посредственно."
1005703-116 = "[s3] «Т-Ты теперь вернёшься и взорвёшь тот ларёк?»\n[s4] «Т-Ты собираешься терроризировать владельца?»"
1005703-119 = "Не говорите глупостей, Сенсей. По обычным меркам всё было довольно хорошо."
1005703-120 = "К тому же сам аукцион был весёлым."
1005703-121 = "И я смогла угостить вас."
1005703-122 = "[s] «Рад это слышать.»"
1005703-123 = "Да, но..."
1005703-125 = "Этот мой путь, поиск высшего вкуса, совсем не прост."
