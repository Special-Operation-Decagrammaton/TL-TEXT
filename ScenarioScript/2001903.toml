[translation]
2001903-1 = "Случай 2. Лучше отдохнуть"
2001903-3 = "После нескольких часов сражения с армией документов день закончился моим стратегическим отступлением."
2001903-4 = "Я знал, что на следующий день битва возобновится."
2001903-5 = ""
2001903-8 = ""
2001903-9 = "Гостиная Шале"
2001903-11 = "Я ждала вас, Господин! Прыг-прыг!"
2001903-12 = ""
2001903-15 = "У меня снова начались видения."
2001903-16 = "Но в этот раз я знал, что это не иллюзия."
2001903-17 = "[s1] «Рад тебя видеть, Аканэ. Хотя видеть тебя так — странно.»\n[s2] «...Как ты вообще сюда попала?»"
2001903-18 = "Я отключила замок, глупыш!"
2001903-19 = "Я отключила замок, глупыш!"
2001903-20 = "Как?"
2001903-21 = "Виноваты мы обе. В конце концов, я ничего не сказала..."
2001903-22 = ""
2001903-24 = ""
2001903-25 = ""
2001903-27 = "Мне немного помогли."
2001903-28 = "Всё-таки это была чрезвычайная ситуация. Хи-хи..."
2001903-29 = "Конечно, я могла просто уничтожить замок бомбой..."
2001903-30 = "Но решила, что это создаст лишние проблемы."
2001903-31 = "И ты просил меня больше так не делать..."
2001903-32 = "Думаешь, я зашла слишком далеко?"
2001903-33 = "Невозможно!"
2001903-34 = "Проверить состояние Господина — мой главный приоритет."
2001903-35 = "Ты выглядел настолько уставшим, что твою переработку было видно за километр..."
2001903-36 = "Мне больно видеть тебя таким..."
2001903-37 = "[s] «Спасибо за заботу.»"
2001903-38 = "Ну что, могу я чем-нибудь помочь?"
2001903-39 = "Неважно, какая на мне одежда, я всё равно твоя горничная."
2001903-40 = "[s] «Как насчёт убраться вместе?»"
2001903-41 = ""
2001903-43 = ""
2001903-44 = "Уборка... Ты уверен, что это всё?"
2001903-45 = "У тебя такое доброе сердце, Господин."
2001903-46 = "Хи-хи... Всегда такой добрый."
2001903-47 = "Хорошо! Пора постараться как следует."
2001903-49 = "После этого мы сосредоточились на уборке... теоретически."
2001903-50 = ""
2001903-53 = "На деле Аканэ практически закончила всё ещё до того, как я успел помочь."
2001903-56 = "Хе-хе. Это напоминает мне нашу первую встречу."
2001903-57 = "Даже тогда всё крутилось вокруг уборки."
2001903-58 = "Ну как? Ни пылинки, правда?"
2001903-59 = "[s3] «Ты тогда была такой милой, Аканэ.»\n[s4] «Ты и сейчас такая же милая, как тогда.»"
2001903-60 = ""
2001903-61 = ""
2001903-63 = ""
2001903-64 = "Г-Господин, что вы вдруг такое говорите..."
2001903-65 = "П-Подождите минутку. Я принесла для вас особый чай. Сейчас подам!"
2001903-66 = ""
2001903-68 = ""
2001903-72 = ""
2001903-73 = ""
2001903-74 = "Это сегодняшняя особая смесь. Попробуйте, пожалуйста."
2001903-75 = ""
2001903-80 = "Хи-хи, мне тоже нравится его аромат. Рада, что тебе понравилось."
2001903-81 = "Я довольно долго его искала... и едва успела найти вовремя."
2001903-82 = "Я так счастлива..."
2001903-83 = "что могу выпить его вместе с вами, Господин."
2001903-84 = "[s] «Похоже, тебе очень нравится этот наряд, Аканэ.»"
2001903-85 = "Мой костюм девушки-кролика?"
2001903-86 = "Хи-хи... Носить что-то настолько необычное довольно освежает."
2001903-87 = "И двигаться в нём, к удивлению, очень удобно."
2001903-88 = "Но прежде всего я горничная, поэтому форма горничной мне всё равно особенно дорога."
2001903-89 = "А вы что думаете, Господин?"
2001903-90 = "[s] «А? Я?»"
2001903-91 = "Да! Я хочу услышать ваше мнение."
2001903-92 = "Вообще-то я давно хотела его услышать..."
2001903-93 = "ещё с тех пор, как вы пришли ко мне в прошлый раз!"
2001903-94 = ""
2001903-96 = ""
2001903-97 = ""
2001903-99 = "Ну так что вы думаете?"
2001903-100 = "Что вам нравится больше? Горничная Аканэ или Аканэ-девушка-кролик?"
2001903-101 = ""
2001903-103 = ""
2001903-104 = "Ну же, отвечайте честно."
2001903-105 = "М-Мне приятно это слышать, но..."
2001903-106 = "Господин, мне нужно убедиться."
2001903-107 = "Какой наряд лучше всего подходит для служения вам?"
2001903-108 = "Я хочу услышать это от вас! Прыг-прыг!"
2001903-109 = "[s] «...Опять „прыг-прыг“?»"
2001903-110 = "Да, потому что сейчас я кролик."
2001903-111 = "Ну так что? Горничная или кролик?"
2001903-112 = ""
2001903-115 = "Аканэ стояла прямо передо мной."
2001903-116 = ""
2001903-118 = ""
2001903-119 = ""
2001903-121 = "Веки налились тяжестью, будто сами хотели закрыться..."
2001903-122 = ""
2001903-124 = ""
2001903-126 = ""
2001903-130 = "Алло? Господин?"
2001903-131 = ""
2001903-134 = "Хи-хи... Я так и знала. Вы, должно быть, ужасно устали."
2001903-135 = ""
2001903-138 = "Отдохните немного, Господин."
2001903-139 = "А теперь я оставлю вас в покое."
