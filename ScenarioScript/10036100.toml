[translation]
10036100-98 = "#video;11009"
10036100-1 = "Эпизод 10;Эй, диджей, раскачай эту вечеринку"
10036100-2 = "Ну вот, сцену восстановили из всего запасного оборудования."
10036100-3 = "Просто чудо, что ни одна пуля не попала в диджейские вертушки."
10036100-4 = "М-Места тоже готовы!"
10036100-5 = ""
10036100-7 = ""
10036100-8 = "Тебе правда не обязательно было мне помогать..."
10036100-9 = "Но, с другой стороны, это ведь для всех, и лишняя помощь никогда не помешает."
10036100-10 = ""
10036100-12 = ""
10036100-13 = "Остальную часть фестиваля тоже уже привели в порядок!"
10036100-14 = "Жаль только, что нарушителей поймать не удалось."
10036100-15 = "Но как бы то ни было, давайте закончим этот вечер как следует!"
10036100-16 = "Эм, насчёт этого..."
10036100-17 = "...Похоже, нам придётся придумать новый финал."
10036100-18 = ""
10036100-21 = ""
10036100-22 = "Почему...?"
10036100-24 = "Ну... во время перестрелки я видела, как DJ B.o.B убежал."
10036100-25 = "Кажется, он сказал, что не хочет, чтобы его похитили."
10036100-26 = "Я бы его остановила, но возможности не было."
10036100-27 = "Но ведь все ждали именно диджейского концерта!"
10036100-28 = "А теперь он накрылся — и это не шутка про стрельбу."
10036100-29 = "Наверное, спокойный летний вечер — слишком большая роскошь."
10036100-30 = "Ну, значит, сегодня спим на песке. Музыки диджея нет, зато волны есть, да?"
10036100-31 = "А потом эти волны наверняка унесут нас на какой-нибудь необитаемый остров..."
10036100-32 = "Забавно, в журнале, который я читала, в этом месяце была статья «что взять на необитаемый остров», а я её сразу пролистала!"
10036100-33 = "[s] «Так, спокойно.»"
10036100-34 = ""
10036100-36 = ""
10036100-37 = ""
10036100-38 = "О, вы ведь... Сенсей из Шале?"
10036100-39 = "Есть какие-нибудь хорошие идеи?"
10036100-40 = "[s] «Не думаю, что концерт диджея нужно отменять.»"
10036100-41 = "Да мы и не ХОТИМ его отменять. Всё оборудование прямо здесь..."
10036100-42 = "...но у нас ведь нет диджея, который умеет им пользоваться?"
10036100-43 = "[s] «Ха-ха, не переживайте!»"
10036100-44 = ""
10036100-46 = ""
10036100-47 = "С-Сенсей, почему вы на меня так смотрите?"
10036100-48 = "[s] «Лучший ученик DJ B.o.B прямо здесь!»"
10036100-49 = "Сенсей, вы что—?!"
10036100-50 = "В-Вы хотите, чтобы Я провела концерт...?!"
10036100-51 = ""
10036100-53 = ""
10036100-54 = ""
10036100-55 = "[ns1] Слегка подтолкнуть троих вперёд.\n[ns2] Подмигнуть."
10036100-58 = "Wait..."
10036100-59 = "Да! Да, я бы очень хотела увидеть Сао-Сао за диджейским пультом."
10036100-60 = "П-Правда? Мы так долго ждали концерта. Будет обидно, если его отменят... Хи-хи."
10036100-61 = "...Меня тоже втягиваете?"
10036100-62 = "[s] «Что такое, Мисаки? Ты ведь тоже хочешь, чтобы концерт состоялся?»"
10036100-63 = "Да, хочу, но..."
10036100-64 = "П-Просто... А, ладно, шоу должно продолжаться."
10036100-66 = "Но я не диджей."
10036100-67 = "У меня нет навыков, чтобы поднять всех и заставить танцевать."
10036100-68 = "[s] «Навыки тут ни при чём. Вопрос в другом: ты сама хочешь это сделать или нет?»"
10036100-69 = "..."
10036100-70 = "Вот что ты имеешь в виду, Сенсей."
10036100-71 = "Чего я хочу... Что мне нужно сделать..."
10036100-72 = ""
10036100-74 = ""
10036100-75 = "...Не знаю."
10036100-76 = "[s] «Эх, а звучало так, будто тебя вот-вот осенит.»"
10036100-77 = "Ладно, кое-что я всё-таки знаю."
10036100-78 = "Я хочу..."
10036100-79 = "...ещё раз почувствовать ту незнакомую эмоцию, которую ощутила на сцене. Только это."
10036100-80 = "Я попробую, Сенсей."
10036100-81 = "Нет, не просто попробую. Я ХОЧУ попробовать."
10036100-82 = ""
10036100-83 = "Знаешь, Сенсей, я заговорила только потому, что ты сказал, что стоит, но теперь, когда я представляю Лидера за диджейским пультом..."
10036100-84 = "А что, если..."
10036100-85 = "...всё пойдёт плохо, и она в итоге продырявит вертушку пулями или что-нибудь такое?"
10036100-86 = "О, с Сао-Сао всё будет в порядке."
10036100-88 = "Похоже, по крайней мере свой ответ она нашла."
10036100-89 = ""
10036100-92 = "Эй, не толкайтесь, не толкайтесь!"
10036100-93 = "Проблемы закончились. Пляж Изгоев снова наш, и вечеринка продолжается!"
10036100-94 = "Все, давайте сегодня оторвёмся!"
10036100-95 = "Музыку!"
10036100-96 = ""