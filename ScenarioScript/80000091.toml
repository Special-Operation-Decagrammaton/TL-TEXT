[translation]
80000091-1 = "Сладости для сладкоежки"
80000091-2 = "О, кстати, Сенсей."
80000091-3 = "У меня появилось новое хобби!"
80000091-4 = "[s1] «Иметь увлечения — хорошо.»\n[s2] «Что это?»"
80000091-5 = "Это..."
80000091-6 = "Это..."
80000091-7 = "Готовить коктейли!"
80000091-8 = "[s] «Нет! Это плохое хобби!»"
80000091-9 = "А? Что вас беспокоит?"
80000091-10 = "Конечно же я делаю безалкогольные коктейли."
80000091-11 = "Даже если я сейчас отстранена, я всё ещё студент. Я бы не стала пить алкоголь. Хи-хи..."
80000091-12 = "[s] «...»"
80000091-13 = "Хм? Вы мне не верите?"
80000091-14 = "Я приготовлю вам бокал своего любимого коктейля. Вообще-то рецепт я придумала совсем недавно!"
80000091-15 = "Попробуете сами и убедитесь, что там нет ничего подозрительного."
80000091-16 = "Хорошо! Начинаем."
80000091-18 = "Уверенными движениями Шигурэ начала готовить коктейль."
80000091-19 = ""
80000091-25 = "Вот. Бокал моего самого изысканного творения..."
80000091-26 = ""
80000091-28 = ""
80000091-30 = "«Горько-сладкий фирменный от Шигурэ»."
80000091-31 = "[s] «Звучит немного зловеще...»"
80000091-32 = "У коктейлей всегда такие названия. Не переживайте."
80000091-33 = "Просто попробуйте и скажите, что думаете."
80000091-34 = ""
80000091-37 = "[ns] «Ну, алкоголя там точно нет.»"
80000091-39 = "[ns3] «Он в меру сладкий, а послевкусие лёгкое и нежное.»\n[ns4] «Очень вкусно!»"
80000091-40 = "Правда?"
80000091-41 = "Правда?"
80000091-42 = "Я хотела сбалансировать ингредиенты на шоколадной основе, но сделать вкус сладким и освежающим, чтобы он не был слишком тяжёлым."
80000091-43 = "Пришлось много экспериментировать, но, думаю, в итоге получилось отлично!"
80000091-44 = "Я так рада, что вам тоже понравилось, Сенсей."
80000091-45 = "[s] «Вкус очень хорошо сбалансирован. В чём секрет?»"
80000091-46 = "...Не кажется ли вам немного грубым вот так просить рецепт, над которым я столько работала?"
80000091-47 = "Я не собиралась никому рассказывать, но..."
80000091-48 = "Хи-хи. Вам расскажу, Сенсей, если обещаете сохранить секрет."
80000091-49 = "На самом деле «Горько-сладкий фирменный от Шигурэ» почти не отличается от других шоколадных коктейлей, кроме одного..."
80000091-50 = "В самом конце нужно добавить один кусочек несладкого шоколада, чтобы уравновесить вкус."
80000091-51 = "Сам по себе несладкий шоколад довольно горький, но в коктейле он не даёт сладости остальных ингредиентов стать приторной."
80000091-52 = "Отличный коктейль получается, когда понимаешь свойства ингредиентов и используешь их в нужный момент."
80000091-53 = "[s] «Ты неплохо разбираешься в миксологии, Шигурэ.»"
80000091-54 = "Правда? Не знаю. Честно говоря, считаю себя довольно обычной."
80000091-55 = ""
80000091-57 = ""
80000091-58 = "А вот у вас, кажется, есть задатки отличного бармена."
80000091-59 = "[s] «У меня? Почему?»"
80000091-60 = "Потому что вы отлично видите сильные и слабые стороны каждого студента и ставите его туда, где она сможет добиться успеха."
80000091-61 = "Когда я смотрю, как благодаря вашим советам студенты раскрывают свои сильные стороны и работают вместе, создавая что-то замечательное..."
80000091-62 = "...не могу не думать о хорошо приготовленном коктейле."
80000091-63 = "Вы даже такому плохо смешивающемуся несладкому шоколаду, как я, позволяете чувствовать себя полезной."
80000091-64 = ""
80000091-66 = ""
80000091-68 = "Поэтому примите этот коктейль как подарок и знак моей благодарности."
80000091-69 = "Буду ждать ещё одного года вместе, Сенсей."
