[translation]
10011060-1 = "Эпизод 6;Третье препятствие: Читающая мысли"
10011060-2 = ""
10011060-4 = "Погоня становится всё жарче! И всё идёт именно как предсказывалось!"
10011060-5 = "Исследовательский клуб ниндзюцу всё ещё впереди после блестящего прохождения испытания Спящей красавицы!"
10011060-6 = "Так выглядит выступление ниндзя?"
10011060-7 = "Присутствие Сенсея из Шале в команде кажется небольшим нарушением и, вероятно, заслуживает разбирательства..."
10011060-8 = "Но фестиваль — место для веселья! И иногда закрыть глаза на небольшое нарушение правил — тоже часть развлечения!"
10011060-9 = "Хе-хе! ♪ Продолжайте сражаться, все!"
10011060-11 = "[ns] «Ого, она буквально выносит всё наше грязное бельё в эфир.»"
10011060-12 = "Не думаю, что она вообще пытается что-то скрывать. Благодаря ей мы—"
10011060-14 = ""
10011060-16 = "Слышали? Они прошли Спящую красавицу за рекордное время!"
10011060-17 = "Сразиться на равных с президентом Клуба внутренней дисциплины? Что вообще за Исследовательский клуб ниндзюцу?"
10011060-18 = "Они вообще настоящий клуб...?"
10011060-19 = "Что за дурацкое название «Исследовательский клуб ниндзюцу»? Пф."
10011060-21 = "Дурацкое?! Как грубо!"
10011060-22 = "[s] «Все просто растеряны, потому что раньше о вас не слышали...»"
10011060-23 = "М-Может быть, но..."
10011060-24 = "Это... слишком много внимания..."
10011060-25 = "Тогда нам просто нужно показать всем, что на самом деле значит быть ниндзя!"
10011060-26 = "Мы справимся, Президент!"
10011060-27 = ""
10011060-31 = "(Но при таком внимании, если всплывут какие-нибудь... нелицеприятные подробности о клубе...)"
10011060-32 = "Нет! Никогда! Сейчас не время! Если мы поймаем Морё и наконец закончим эту нелепую погоню, всё будет хорошо!"
10011060-33 = ""
10011060-35 = ""
10011060-37 = ""
10011060-38 = ""
10011060-39 = "О! Добро пожаловать, участники!"
10011060-40 = "Я Мизуха Мимори, хранитель третьего препятствия — Страшная читающая мысли! Чтобы пройти, вам нужно победить меня!"
10011060-41 = "[s1] «Сначала Цубаки, теперь Мимори?»\n[s2] «...Что она имеет в виду под „Страшной читающей мысли“?»"
10011060-44 = "О! Господин, я об этом слышала!"
10011060-45 = "В Клубе внутренней дисциплины тоже хватает странных людей! Одна из них благословлена ужасающей способностью читать мысли!"
10011060-46 = "[s] «Ты умеешь читать мысли, Мимори?!»"
10011060-47 = "Думаю, это всего лишь слух..."
10011060-48 = "О боже! Эм, то есть..."
10011060-49 = "Да! Вы меня нашли!"
10011060-50 = "Одна из самых могущественных союзниц заговора, похитившего принцессу... это я, Читающая мысли!"
10011060-51 = "Ч-Читающая мысли... Это я!"
10011060-52 = "Такова роль..."
10011060-53 = "[s] «Необязательно играть роль, если тебе так неловко.»"
10011060-54 = "Хм, довольно профессиональный подход. Наверное, от туристического центра вроде Хяккияко другого и не ждёшь..."
10011060-55 = "Эм, ух... В общем! Ни одна мысль или идея от меня не скроется, так что готовьтесь к моим способностям чтения разума!"
10011060-56 = ""
10011060-59 = ""
10011060-60 = ""
10011060-62 = "С-Сначала Изуна!"
10011060-63 = "Ик!"
10011060-64 = "Изуна отчаянно хочет победить меня, чтобы продолжить путь!"
10011060-65 = "А?! Как ты узнала?!"
10011060-66 = "А Цукуё... Она хочет и дальше стараться изо всех сил, лишь бы быть полезной друзьям!"
10011060-67 = "О-Ого! Она права! Она действительно умеет читать мысли..."
10011060-68 = "А теперь Мичиру!"
10011060-69 = ""
10011060-71 = ""
10011060-72 = "У неё... У неё очень много мыслей! Она разрывается. Всем сердцем хочет идти вперёд, но часть её говорит вернуться домой!"
10011060-73 = "Б-Боже, это так тонко! Она права... Но вроде и нет?"
10011060-74 = "Хе-хе. Теперь, когда вы знаете силу моих способностей, вы всё ещё думаете, что сможете меня победить?"
10011060-75 = "[s] «Ладно. Я возьму это на себя.»"
10011060-76 = ""
10011060-77 = "Д-Достопочтенный Сенсей? Вы?"
10011060-79 = "С-Сенсей?!"
10011060-80 = "Х-Хорошо! Приготовьтесь, Сенсей!"
10011060-81 = ""
10011060-83 = "Хммммм!"
10011060-84 = ""
10011060-86 = ""
10011060-87 = "...!"
10011060-88 = "Ах!"
10011060-89 = "С-Сенсей... Не могу поверить!"
10011060-90 = "[s] «...А?»"
10011060-91 = "Как вы могли, Сенсей? Какая непристойность..."
10011060-92 = "...Как вам не стыдно!"
10011060-93 = "Наверное, я не удивлена, но вы правда думаете об этом каждый день?"
10011060-94 = "[s] «Я вообще ни о чём не думал! Меня ложно обвиняют!»"
10011060-95 = ""
10011060-96 = "И вот так она одним махом посеяла раздор внутри группы?!"
10011060-97 = "Наверное, в этом и секрет силы Читающей мысли!"
10011060-98 = "Изуна, Президент! Кажется, я знаю, как победить Читающую мысли...!"
10011060-99 = "А, Цукуё? Что ты придумала?"
10011060-100 = "Я-я читала об этом в одном из ваших комиксов, Президент... Главные герои использовали эту стратегию против мастера ниндзюцу, который умел читать мысли!"
10011060-101 = "Н-Называется техника Пустой головы!"
10011060-102 = ""
10011060-105 = ""
10011060-106 = "Ох."
10011060-107 = "Е-Если мы все отключим мысли и будем сражаться... никто не сможет читать наши р-разумы!"
10011060-108 = "Мы можем отключиться все вместе! Х-Хорошо, все...?"
10011060-109 = "Я всегда с тобой, Цукуё!"
10011060-110 = "...!"
10011060-111 = "*отключает мысли*"
10011060-112 = "Эм, ну!"
10011060-113 = "*отключает мысли*"
10011060-115 = "...Они правда думают, что это сработает?"
10011060-116 = "Значит, вот как вы решили противостоять моему чтению мыслей!"
10011060-117 = "Я принимаю вашу силу! Теперь я буду читать ваши мысли ещё усерднее! Хия!"
10011060-118 = ""
10011060-119 = "*отключает мысли*"
10011060-120 = "*отключает мысли*!"
10011060-121 = "*отключает мысли*?"
10011060-122 = ""
10011060-125 = "Н-н-н-н!"
10011060-126 = ""
10011060-129 = ""
10011060-130 = "[ns] «В-Вот это и называют равной борьбой!»"
10011060-132 = "...В каком смысле?"
10011060-133 = "Я ничего не имею против здоровой конкуренции."
10011060-134 = "Но вы собираетесь сидеть здесь вечно? Как нам пройти препятствие?"
10011060-135 = "Я вообще не понимаю, какая здесь цель."
10011060-136 = "[s] «А. Ну, вообще-то это должно быть каким-то аттракционом...»"
10011060-137 = "О! Я забыла дать вам небольшую подсказку."
10011060-138 = "Чтобы пройти испытание, нужно победить его хранителя!"
10011060-139 = "...?!"
10011060-140 = "К-Конечно!"
10011060-141 = "Да, конечно, именно так."
10011060-142 = "Я одна не понимаю сюжет?"
10011060-143 = "[s] «Конечно. По сути, нам остаётся только победить хранителя.»"
10011060-144 = "Да! Вы наконец поняли, как противостоять моему чтению мыслей."
10011060-145 = "Что ж! Я, Мимори, третий хранитель, с радостью приму бой!"
