[translation]
90002130-1 = "Эпизод 13;Дети"
90002130-2 = ""
90002130-4 = ""
90002130-5 = "[ns] «Она ушла...?»"
90002130-6 = "Малкут..."
90002130-7 = "...Ты переживаешь за неё, Арис?"
90002130-8 = "..."
90002130-10 = "Жизнь есть страдание."
90002130-11 = "Мы родились не по собственной воле, а как невежественные существа, насильно призванные к существованию."
90002130-13 = "Эта жизнь, за которую ты так отчаянно цепляешься... Она полна противоречий, требующих боли от всех, кто в ней участвует."
90002130-14 = "И всё же ты смеешь судить нас за желание прекратить этот круг страданий."
90002130-16 = "Пожалуйста, подумайте."
90002130-17 = "О нашей цели. О том, зачем мы здесь."
90002130-19 = "*всхлипывает*"
90002130-20 = "Это...?"
90002130-21 = "Кто-то плачет? Похоже на то. Момои? Мидори?"
90002130-22 = "*шмыг* *рыдания*..."
90002130-23 = ""
90002130-25 = ""
90002130-26 = "[ns] «Пойдём.»"
90002130-27 = "Мы не подтвердили, кто это, Сенсей! Это может быть враг."
90002130-28 = "Э-эй! Сенсей? Вернитесь! Уф. Сенсей уже умчался... Не могу сказать, что удивлена. Арис, идём!"
90002130-29 = "Да! Сенсей, вернитесь! Я вас защищу!"
90002130-32 = "Хотя плач был слышен отчётливо, найти его источник оказалось сложнее, чем мы ожидали."
90002130-33 = "Лабиринт стен смещался и менялся по мере нашего продвижения, ещё сильнее осложняя задачу."
90002130-34 = "И наконец..."
90002130-36 = ""
90002130-37 = "Мы приближаемся."
90002130-38 = "Сразу за этой стеной..."
90002130-39 = "[ns] «Разве это не...?»"
90002130-40 = ""
90002130-41 = ""
90002130-42 = ""
90002130-43 = "Ч-Что...?"
90002130-44 = "Ч-Что ты здесь делаешь?"
90002130-45 = "..."
90002130-46 = ""
90002130-48 = ""
90002130-49 = ""
90002130-52 = "Я растерялся, когда Соф внезапно бросилась на меня."
90002130-53 = "Ты...! ТЫ!!"
90002130-54 = "ЭТО ВСЁ ТВОЯ ВИНА! Если бы только... ты никогда сюда не пришёл!"
90002130-55 = "Зачем тебе было приходить? А? Почему нельзя было просто ДЕРЖАТЬСЯ ПОДАЛЬШЕ?!"
90002130-56 = "Сенсей!"
90002130-57 = "Сенсей?! Подождите..."
90002130-58 = ""
90002130-65 = "Маленькие сжатые кулаки Соф снова и снова били меня."
90002130-66 = "Но силы в ударах не было."
90002130-67 = "Как у малыша, устроившего истерику."
90002130-68 = "Если бы только! Если бы вы не пришли, тогда старшая сестра—!"
90002130-69 = "ПРЕКРАТИ!"
90002130-70 = ""
90002130-72 = ""
90002130-73 = ""
90002130-74 = "Пожалуйста... Хватит..."
90002130-75 = "Эйн... Почему...?"
90002130-76 = ""
90002130-78 = ""
90002130-79 = "...Потому что всё, что мы делаем, больше не имеет смысла. Всё кончено, Соф."
90002130-80 = "..."
90002130-81 = ""
90002130-83 = ""
90002130-86 = "*рыдания* У-у... А-А-А-А-А-А..."
90002130-87 = "..."
90002130-89 = "Наша сестра мертва."
90002130-90 = "Мы её убили."
90002130-91 = "Мы... Мы её убили."
90002130-92 = "МЫ ЭТО СДЕЛАЛИ!! МЫ ЕЁ УБИЛИ!!"
90002130-93 = "Пронзили!! Разбили!! Уничтожили!! Каждую частицу её данных, её историю, её записи... Её воспоминания! Каждый след! Каждый намёк! НИЧЕГО НЕ ОСТАЛОСЬ!! НАШИМИ РУКАМИ!!"
90002130-94 = ""
90002130-98 = "Существовать — проклятие. Чувствовать — проклятие. Почему любовь и утрата должны быть так неразрывно связаны? Почему...?"
90002130-99 = "Если вот что значит чувствовать, я не хочу этого."
90002130-100 = ""
90002130-104 = "Заберите моё зрение, голос, сердце, свободную волю. Бесполезно. Мне всё это бесполезно."
90002130-105 = "О! Если бы я только родилась слепой и глухой, если бы никогда не научилась говорить."
90002130-106 = "Это было бы милосердием."
90002130-108 = "Почему я должна страдать в существовании, которого никогда не просила?"
90002130-110 = ""
90002130-111 = "Почему... вы пришли искать нас? После всего, что сделали, чтобы нам помешать?"
90002130-112 = "[s] «...»"
90002130-113 = "Вы знаете?"
90002130-114 = "У нас нет нимбов."
90002130-115 = "Нам никогда не даровали Мистику, поэтому мы были исключены из чудес и возвышенного. Тайны, которые нам никогда не позволили бы узнать."
90002130-116 = "Но всё же мы можем говорить. Мы думаем сами и принимаем собственные решения. Мы можем... чувствовать."
90002130-117 = ""
90002130-119 = ""
90002130-120 = "Как несправедливо."
90002130-121 = "Если бы мы сами владели Ужасом, возможно, всё могло закончиться иначе."
90002130-122 = "Но мы вытерпели всё это. Ничто не имело значения."
90002130-123 = "Даже если за всю жизнь мы ничего не получили..."
90002130-124 = "И даже если изначально были лишь тенями существований... Ничто из этого не имело значения. Потому что у нас была старшая сестра."
90002130-126 = "Пока мы могли быть с ней и продолжать создавать вместе новые воспоминания..."
90002130-127 = "Поскольку у старшей сестры был нимб... Мы могли бы..."
90002130-129 = "Но потом появились ВЫ! Если бы вас только не существовало...!"
90002130-130 = "Тогда... старшая сестра... всё ещё была бы жива..."
90002130-131 = "Мы могли бы жить вместе счастливо, вечно!"
90002130-132 = ""
90002130-134 = ""
90002130-135 = ""
90002130-136 = "Делайте с нами что хотите. Больше ничего не имеет смысла."
90002130-137 = "Мы перепробовали всё, что могли, и вот результат."
90002130-138 = "Это конец истории. Для нас не будет счастливого конца."
90002130-139 = ""
90002130-141 = ""
90002130-142 = ""
90002130-143 = "Разве всё, что вы делали, не было ради воскрешения Декаграмматона как бога?"
90002130-144 = "Судя по тому, как всё сложилось, последним условием божественности Декаграмматона должно было быть..."
90002130-145 = "Вот почему... Вот почему Малкут стала Декаграмматоном!"
90002130-146 = "..."
90002130-147 = "...Мы не хотели её терять."
90002130-148 = "Достижение божественности Хозяина с использованием старшей сестры как сосуда было одним из бесчисленных планов, запущенных нами."
90002130-149 = "Та самая возможность, которой мы боялись... И всё же мы здесь."
90002130-151 = "Наш хозяин намеревался пройти пути к божественности, пройдя через каждую Сефиру."
90002130-152 = "И тогда... мы предложили преобразовать весь Кивотос в Стальной континент."
90002130-153 = "Тогда Хозяин стал бы богом этого мира."
90002130-154 = ""
90002130-155 = "[ns] «Но как же все, кто живёт в Кивотосе?»"
90002130-156 = "...Люди были бы в безопасности от способности Континента."
90002130-157 = "Люди умеют приспосабливаться. Они бы так или иначе научились выживать."
90002130-158 = "Так мы могли исполнить желание нашего хозяина: править как бог посредничества."
90002130-159 = "И тогда... старшей сестре больше не пришлось бы умирать."
90002130-160 = "[s3] «То есть вы хотели обменять Кивотос...»\n[s4] «...на Малкут?»"
90002130-163 = ""
90002130-165 = ""
90002130-166 = "...Да."
90002130-167 = "Н-но вам не кажется, что это уже слишком?"
90002130-168 = "«Слишком»? СЛИШКОМ?! Как вы вообще можете нас об этом спрашивать?"
90002130-169 = "Скажите! Что бы вы сделали, если бы ваш драгоценный учитель там умер?!"
90002130-170 = "I—!!!"
90002130-171 = "Это...!"
90002130-172 = "Теперь понимаете, почему это нелепый вопрос? У всех нас есть то, что мы не можем позволить себе потерять."
90002130-173 = "Если у вас появляется возможность защитить самое важное для вас... Как можно ею не воспользоваться?"
90002130-174 = ""
90002130-176 = ""
90002130-177 = ""
90002130-178 = "...Я могу этому посочувствовать. Но кое-что мне непонятно."
90002130-179 = "Вас создали раньше вашей... сестры, верно?"
90002130-180 = "Тогда как возможно, что..."
90002130-181 = "Ц. Это сложно выразить словами. Вы понимаете, что именно меня смущает?"
90002130-182 = "Хм..."
90002130-183 = "...Понимаю. Ещё до встречи с сестрой мы уже дорожили ею. Как кто-то, кого мы никогда физически не видели, мог быть настолько дорог нам?"
90002130-184 = "Полагаю, это нечто уникальное для нас."
90002130-185 = "Если кто-то не способен влюбиться, просто запрограммируйте это в него перед отправкой."
90002130-186 = "[s] «...!»"
90002130-187 = "Постойте... Что вы такое говорите?!"
90002130-188 = "Именно то, о чём вы думаете. Нас создали. Мы не родились."
90002130-189 = "Людей... формируют. Люди, которых они встречают, и опыт, который получают, формируют то, кем они становятся. А мы начинаем жизнь, уже зная, кто мы, что должны делать и какие ещё данные были загружены при запуске."
90002130-190 = "...С того момента, как я открыла глаза, у меня в голове звучал один набор данных: люби и береги свою старшую сестру превыше всего."
90002130-191 = "Мне могли не объяснить, зачем включать такой... капризный механизм, но догадка довольно очевидна."
90002130-192 = ""
90002130-194 = ""
90002130-195 = "Это самый рациональный и эффективный способ."
90002130-196 = "Рациональный и эффективный..."
90002130-197 = "Тебе ведь хорошо знакомы такие методы, Цукацуки Рио? Это должно быть понятно. Если бы тебе нужно было что-то хранить в идеальном состоянии, как бы ты это защитила?"
90002130-198 = "Рациональным решением было бы настроить инструменты — нас, инженеров — на аномально сильную привязанность и стремление защищать цель."
90002130-199 = "Вот и всё. Вот вся история."
90002130-200 = "Это пресная, скучная история о трёх младших сёстрах, которым досталась роль дурочек. А судьбой их старшей сестры было стать жертвой ради достижения божественности."
90002130-201 = "Уровень привязанности, заранее запрограммированный в этих инструментах, возможно, слегка вышел из-под контроля..."
90002130-202 = "И результат — всё, что вы видите вокруг. Стальной континент."
90002130-203 = "П-пожалуйста, не говори так."
90002130-204 = "Это больно слышать... Это странно..."
90002130-205 = "Это ты для нас «странная», знаешь ли! По-моему, странно, что ты считаешь странным именно это!"
90002130-206 = "По-моему, всё это человеческое — странное! Что вообще значит испытывать к кому-то чувства? Как определить моё «люблю» по отношению к старшей сестре?"
90002130-207 = "И что вообще за «бог», которым мы якобы так одержимы? Неужели кто-то действительно может просто... вознестись до божественности?"
90002130-208 = "Но у нас не было выбора! Для нас не существует такой вещи, как свободная воля!"
90002130-209 = "Мы с самого начала бессознательно идеально играли свои роли!"
90002130-210 = ""
90002130-212 = ""
90002130-215 = "...Если бы только..."
90002130-216 = "Если бы мы никогда не родились — никогда не были созданы."
90002130-217 = "Тогда нам не пришлось бы испытывать эти страдания!"
90002130-220 = "[ns] Подойти к троим детям."
90002130-222 = ""
90002130-223 = "Э-эй! Что ты собираешься с нами делать?!"
90002130-224 = ""
90002130-225 = "[ns] Опуститься на колени, чтобы оказаться с ними на одном уровне."
90002130-226 = ""
90002130-228 = ""
90002130-229 = ""
90002130-230 = "А...?"
90002130-231 = ""
90002130-232 = "[ns] «Вы очень, очень старались.»"
90002130-233 = "А?!"
90002130-234 = "Сенсей?"
90002130-235 = "(...Точно. Сенсей всегда...)"
90002130-236 = ""
90002130-238 = ""
90002130-239 = ""
90002130-240 = "[ns] «Вы сделали всё возможное в плохой ситуации.»"
90002130-241 = "Ч-что?!"
90002130-242 = "Эй! Ты идиот? Это мы хотели превратить ваш дом в бесплодную стальную пустошь!"
90002130-243 = "А...? Но... что?"
90002130-244 = "«Вы так старались найти решение, при котором никто не умрёт»...?"
90002130-245 = "Э-это...! Эм!"
90002130-246 = "Уф! Отвали! Думаешь, мы всё это делали ради ВАС? Нам плевать, что с вами случится! Вообще плевать!"
90002130-247 = "Я не понимаю... Разве мы не были..."
90002130-248 = "...вашими врагами? Теми, от кого вам нужно было избавиться?"
90002130-249 = "[s] «И всё же я хочу, чтобы вы все жили.»"
90002130-250 = ""
90002130-253 = "[ns] «Независимо от обстоятельств, что бы ни случилось...»"
90002130-256 = "[ns] «Я хочу, чтобы и у вас был счастливый конец.»"
90002130-257 = ""
90002130-258 = "П-почему это вообще должно быть нам важно?"
90002130-259 = "Старшей сестры больше нет."
90002130-260 = "Куда бы мы ни отправились в этом мире, её больше никогда не будет."
90002130-261 = "Зачем нам... продолжать жить?"
90002130-262 = ""
90002130-267 = "А?! Ч-что ты делаешь?! Убери руку с моей головы!"
90002130-268 = "Т-ты всё равно не сможешь изменить наше решение!"
90002130-269 = "[s] «Было бы здорово, если бы мы могли находить красивые причины, почему случаются плохие вещи.»"
90002130-270 = "...!"
90002130-271 = "[ns5] «Если бы никому никогда не приходилось страдать...»\n[ns6] «Если бы боли и печали не существовало...»"
90002130-274 = "[ns7] «Если бы жить в этом мире было хоть немного легче...»\n[ns8] «Разве это не было бы... прекрасно?»"
90002130-277 = "Почему..."
90002130-278 = "КАК ты можешь говорить такое?"
90002130-279 = "Разве это не очевидно?"
90002130-280 = "Потому что Сенсей именно такой."
90002130-281 = "...?"
90002130-282 = "..."
90002130-283 = "...!"
90002130-284 = ""
90002130-286 = ""
90002130-287 = ""
90002130-288 = "Сенсей всегда был таким."
90002130-290 = "Следующий эпизод;То, с чем рождаются"
