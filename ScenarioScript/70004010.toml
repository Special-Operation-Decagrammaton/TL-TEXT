[translation]
70004010-1 = "Потерянный подарок 1"
70004010-4 = ""
70004010-5 = "О, Сенсей. Я уже в Шале."
70004010-6 = "...Да. Сегодня много детей создавали проблемы. Пока бегала за ними, совсем пересохло в горле, так что перед подъёмом куплю напиток."
70004010-7 = "Тебе тоже взять что-нибудь, Сенсей?"
70004010-8 = ""
70004010-10 = ""
70004010-11 = "...Хаха. Я так и думала, что ты это скажешь."
70004010-12 = "Поняла. Скоро поднимусь. Жду сегодняшних обязанностей представителя студентов."
70004010-13 = ""
70004010-15 = ""
70004010-16 = "Две бутылки энергетика и одна банка кофе? С вас 420 иен."
70004010-17 = "Хорошо. Карты принимаете?"
70004010-18 = ""
70004010-20 = ""
70004010-21 = "...Спасибо.#nО, пакет не нужен. Я выпью их сразу."
70004010-22 = ""
70004010-24 = ""
70004010-25 = ""
70004010-26 = "(Как подозрительно...)"
70004010-29 = ""
70004010-30 = "А, Сенсей. Ты уже заказала рождественский торт?"
70004010-31 = "...А? Ты не взяла торт? Тогда собираешься есть курицу?"
70004010-32 = "...Ты будешь слишком занята для нормального рождественского ужина? Грустно."
70004010-33 = ""
70004010-35 = ""
70004010-36 = ""
70004010-37 = "Сенсей, я только что отправила тебе адрес в MomoTalk.#nЭто магазин порционных тортов с доставкой. Я пробовала в прошлый раз, довольно вкусно."
70004010-38 = "Как бы занята ты ни была, время на один сладкий десерт найдётся, правда? Всё-таки Рождество."
70004010-39 = "Один дакуаз, два пудинга и один шоколадный торт-полено?"
70004010-40 = "А, простите. Подождите. Добавьте ещё молоко."
70004010-41 = "Итого 780 иен. Пакет нужен?"
70004010-42 = "Да, пожалуйста. Спасибо!"
70004010-43 = ""
70004010-45 = ""
70004010-46 = ""
70004010-47 = "(Как ни посмотри...)"
70004010-49 = ""
70004010-50 = "Сэн! Сэй! Что это за чек?!"
70004010-51 = "Не делай вид, что не понимаешь! Вчера среди расходов, которые ты отправила в Семинар, я нашла чек на игрушечного робота!"
70004010-52 = "Я ещё не забыла чек на видеоигру, который ты тайком подсунула в прошлый раз!"
70004010-53 = ""
70004010-55 = ""
70004010-56 = "А? Это был рождественский подарок самой себе?"
70004010-57 = "Какое это имеет отношение к отчёту о расходах?! Это личная трата!"
70004010-58 = "...Всё. Я прямо сейчас поднимусь и проверю твою бухгалтерию. Ни с места!"
70004010-59 = "Эм... Это 30 патронов 9 мм для пистолета и один ускоритель заряжания?"
70004010-60 = "А, простите. Я так шумлю."
70004010-61 = "Да. Это всё, что мне нужно. Итого 1810 иен, верно?"
70004010-62 = "Да. Вам пак—"
70004010-63 = ""
70004010-65 = ""
70004010-66 = ""
70004010-68 = "...Она ушла."
70004010-69 = ""
70004010-71 = ""
70004010-72 = "(Подозрительно...!)"
70004010-74 = ""
70004010-75 = "Сегодня десять наших покупателей были студентами, пришедшими в Шале."
70004010-76 = "Если считать тех, кто не заходил в магазин, их наверняка было не меньше двадцати!"
70004010-77 = "Я понимаю тех, у кого обязанности представителя студентов и кто приходит помогать Сенсею, но посещать Шале вне графика... Подозрительно."
70004010-78 = "Ходят слухи, что Сенсей из Шале — добрый взрослый, который выслушивает проблемы студентов и никогда не бросит нуждающегося."
70004010-79 = "Но с другой стороны, ходят и ужасающие слухи, будто Сенсей плавает голышом в бассейне и даже лижет студентам ноги..."
70004010-80 = "Учитывая всю подозрительную деятельность Сенсея, почему студенты всё равно приходят к ней?"
70004010-81 = "...Может, Сенсей из Шале использует какой-то грязный способ соблазнять студентов."
70004010-82 = "В Шале полно всяких странных вещей, может, у них есть устройство гипноза, способное контролировать разум..."
70004010-83 = "[s] «Какое устройство гипноза?»"
70004010-84 = "С-Сенсей?! Когда вы пришли?"
70004010-85 = "Д-Добро пожаловать в Ангел 24!"
70004010-86 = "[s1] «Привет, Сора.»\n[s2] «О чём задумалась?»"
70004010-87 = "Н-Ни о чём! Просто о слухах, которые ходят в соцсетях..."
70004010-88 = "Н-Ни о чём! Просто о слухах, которые ходят в соцсетях..."
70004010-89 = "[s3] «В соцсетях ходит много забавных слухов.»\n[s4] «Но встречаются и выдумки, так что не верь всему подряд.»"
70004010-90 = "П-Поняла! Буду осторожна."
70004010-91 = "П-Поняла! Буду осторожна."
70004010-92 = "[ns] «В любом случае, в последнее время ты выглядишь занятой.»"
70004010-93 = "Да. Особенно на этой неделе. Немного хаотично."
70004010-94 = "...Сейчас Рождество, а потом конец года, поэтому люди обычно покупают больше тортов и закусок, вроде куриных наггетсов."
70004010-95 = "[s] «Ага, не верится, что год почти закончился.»"
70004010-96 = ""
70004010-98 = ""
70004010-99 = "Сенсей, вы берёте одну мятную жвачку и одно лимонное желе?"
70004010-100 = "На это лимонное желе действует акция: при покупке дают один витаминный напиток. Сейчас принесу."
70004010-101 = "[s] «Можешь забрать его себе, Сора.»"
70004010-102 = "А-А? Мне...?"
70004010-103 = "[s5] «Да. Возьми себе — ты сегодня хорошо потрудилась, Сора.»\n[s6] «Мы работаем в одном здании, так что должны помогать друг другу.»"
70004010-104 = "А, да... С-Спасибо."
70004010-105 = "А, да... С-Спасибо."
70004010-106 = "(...Как я и думала. [USERNAME] Сенсей — подозрительный взрослый, но...)"
70004010-107 = "Эм, Сенсей, я вообще-то хотела кое-что спросить—"
70004010-108 = ""
70004010-110 = ""
70004010-111 = ""
70004010-112 = "Эм, простите, у вас остался Frenzy MAX Coffee?"
70004010-113 = "А-А? Frenzy MAX Coffee...?"
70004010-114 = "Кажется, да... Сейчас проверю на складе..."
70004010-115 = ""
70004010-117 = ""
70004010-118 = ""
70004010-119 = "[ns] «Иди. Клиенты важнее.»"
70004010-120 = "Да...! Т-Тогда прошу прощения!"
70004010-121 = ""
70004010-123 = ""
70004010-125 = "После этого в Ангел 24 пошёл нескончаемый поток покупателей."
70004010-126 = ""
70004010-127 = "*вздох*... Наконец-то можно передохнуть."
70004010-128 = "Тяжёлый день. Не помню, когда в последний раз была настолько занята, что даже не могла прибраться в магазине."
70004010-129 = "Я так и не успела спросить Сенсея, почему к ней приходит столько студентов."
70004010-130 = "Ладно, это проблема на потом. Пока просто займусь уборкой."
70004010-132 = ""
70004010-133 = ""
70004010-134 = ""
70004010-135 = ""
70004010-136 = ""
70004010-137 = ""
70004010-138 = "Всегда доставляем счастье! Счастливый, счастливый Ангел 24! ♪"
70004010-139 = ""
70004010-141 = ""
70004010-142 = ""
70004010-143 = ""
70004010-144 = ""
70004010-145 = "А? Это..."
70004010-146 = "...подарок? Кто его здесь оставил?"
70004010-147 = "Может, кто-то из студентов, приходивших к Сенсею?"
70004010-148 = "Просто повешу у входа объявление «Найдена вещь»..."
70004010-149 = ""
70004010-151 = ""
70004010-152 = "...Нет. Это может вызвать огромный инцидент."
70004010-153 = "Большинство студентов Кивотос так или иначе испытывают чувства к Сенсею. Если все узнают о таком проявлении привязанности со стороны другого студента..."
70004010-154 = "П-Представить только, если это студент с властью в одной из академий! Это... Это может даже привести к войне!"
70004010-155 = "Ч-Что же делать...? Я не могу просто сделать вид, что ничего не видела... А подарок оставили в слепой зоне камер, так что я не знаю, как выяснить, чей он."
70004010-156 = ""
70004010-158 = ""
70004010-159 = "Придётся спрашивать их по одной."
70004010-160 = "Я примерно помню лица студентов, заходивших сегодня в магазин. Буду расспрашивать осторожно, чтобы никто другой не узнал."
70004010-161 = ""
70004010-162 = "Ради мира в Кивотос я обязана найти владельца этого подарка!"
