[translation]
21040-1 = "Episódio 4;Naquele Dia, Encontramos uma Garota"
21040-2 = "???"
21040-3 = "Ué...?"
21040-4 = "Aqueles robôs pararam de nos perseguir de repente...?"
21040-5 = "Eles estavam vindo com tudo atrás da gente até entrarmos nessa fábrica."
21040-6 = "Não sei por quê, mas que sorte, né? Tudo certo então?"
21040-7 = "Não tá nada certo! Buááá! Eu não aguento mais! Por que a gente tem que ser perseguida por robôs num lugar desses?!"
21040-8 = "Calma, Midori. Enquanto a gente estiver viva, dias melhores virão."
21040-9 = "Eu tô falando de hoje! E pra começar, a culpa é toda sua, mana!!"
21040-10 = "Enfim... o que será que é esse lugar, afinal?"
21040-11 = "Será que o Conselho Estudantil Geral restringiu o acesso por causa daqueles robôs?"
21040-12 = "Eu até pensei que aqueles robôs fossem armas secretas do Conselho Estudantil Geral pra usar em emergências..."
21040-13 = "Mas não parece ser isso... O que será que são?"
21040-14 = "Hmm, tem alguma coisa me incomodando... Parece que estamos deixando passar algo importante, e além disso..."
21040-15 = "Aproximação detectada."
21040-16 = "E-Eh? O-O quê?"
21040-17 = "O som tá ecoando pela sala inteira...?"
21040-18 = "Verificando identidade do alvo. Saiba Momoi: sem autorização."
21040-19 = "O-O quê?! Como isso sabe quem eu sou?!"
21040-20 = "Verificando identidade do alvo. Saiba Midori: sem autorização."
21040-21 = "Sabe quem eu sou também... Mas o que tá acontecendo...?"
21040-22 = "Verificando identidade do alvo... \"Sensei [USERNAME]\"."
21040-23 = "..."
21040-24 = "Ué?"
21040-25 = "Autorização confirmada. Concedendo permissão de entrada."
21040-26 = "Quêêê?!"
21040-27 = "Hã, como assim?! Quando foi que você ficou amigo desse prédio, Sensei?!"
21040-28 = "O próprio Sensei parece confuso também..."
21040-29 = "Reconhecendo Saiba Momoi e Saiba Midori como \"alunas\" do Sensei. Concedendo autorização às \"alunas\" acompanhantes. Aprovado."
21040-30 = "Abrindo a porta inferior."
21040-31 = "...Porta inferior? Não é essa porta bem na nossa frente?"
21040-32 = "Espera, será que \"inferior\" quer dizer..."
21040-33 = "Claro que não, né? Olhando de qualquer ângulo, isso é só o chão—"
21040-34 = "(Clang!)"
21040-35 = "O-O chão sumiu... Estamos caindo?!"
21040-36 = "Uaaahhh!"
21040-39 = "Mana! Sensei! Kyaaaah!"
21040-41 = "..."
21040-44 = "Ugh..."
21040-45 = "Hã? Mana? Sensei?!"
21040-46 = "Nossa, achei mesmo que eu ia morrer..."
21040-47 = "Você tá bem, mana? Ué, cadê o Sensei...?"
21040-48 = "[s] \"A-Aqfui...\""
21040-49 = "Hyaah?! P-P-Por quê?! Por que o Sensei tá embaixo da gente?!"
21040-50 = "Como assim por quê... Foi porque o Sensei se jogou pra servir de colchão pra gente na hora que caímos, né?"
21040-51 = "Ah, d-desculpa... É que eu levei um susto e achei que o Sensei tivesse \"esse tipo de gosto\"..."
21040-52 = "Olha, acho que você devia pedir desculpas de novo pelo que acabou de dizer..."
21040-53 = "Enfim, você tá bem, Sensei?"
21040-54 = "[s1] \"Claro, que bom que vocês duas estão bem.\"\n[s2] \"Sabe como é, às vezes é preciso perder pra ganhar...\""
21040-55 = "E-Enfim... muito obrigada por nos salvar."
21040-56 = "E-Enfim... muito obrigada por nos salvar."
21040-57 = "Parece que a queda não foi tão funda assim... Hmm?"
21040-58 = "..."
21040-59 = "...Quê?!"
21040-60 = "Hmm...? O que foi, mana...?"
21040-62 = "Quê...?!"
21040-69 = "U-Uma garota?"
21040-70 = "Será que ela... tá dormindo?"
21040-72 = "...Sem resposta. Parece ser apenas um cadáver."
21040-73 = "Não faz piada de mau gosto! E de qualquer forma, não parece um cadáver... Ei, olha."
21040-74 = "Ela não tá machucada nem nada... Não dá a impressão de que ela tá \"desligada\"?"
21040-75 = "Será? Pensando bem, ela lembra mesmo um manequim. Deixa eu ver..."
21040-78 = "Uau, a pele dela é macia e suave... Ué? Tem alguma coisa escrita aqui."
21040-79 = "...AL-IS..."
21040-80 = "...Al, is... A, L, I, S? Não sei como se lê, será que é o nome dela?"
21040-81 = "...Aris?"
21040-82 = "Espera aí, olhando de perto não são tudo letras... Não tá escrito AL-1S?"
21040-83 = "Hã, sério?"
21040-85 = "Quem será ela... E que lugar é esse, afinal?"
21040-86 = "Não é mais rápido perguntar pra ela?"
21040-87 = "Seria ótimo se ela acordasse e respondesse... Por enquanto, dá pena deixar ela assim, vamos vestir alguma roupa nela."
21040-88 = "Nossa, você trouxe roupa reserva... Espera, essa calcinha é minha!"
21040-89 = "Não é não, essa é minha. Olha a carinha do gatinho, é diferente."
21040-94 = "...Pronto. Acho que assim tá bom."
21040-95 = "(Bip, bi-bip!)"
21040-96 = "Hmm?"
21040-97 = "O-O que é esse som?!"
21040-98 = "Parece um alarme... Será que tem algum robô por perto?"
21040-99 = "Não... Acho que veio \"dela\"."
21040-100 = "Quê? N-Não pode ser..."
21040-102 = "Alteração de estado e alvo autorizado para contato detectados. Desativando modo de hibernação."
21040-106 = "..."
21040-107 = "E-Ela acordou...?"
21040-109 = "..."
21040-111 = "Análise da situação: inconclusiva."
21040-113 = "Tentando comunicação... Poderiam fornecer uma explicação?"
21040-114 = "E-Eh? E-Explicação? Sobre o quê?"
21040-115 = "Q-Quem quer uma explicação somos nós! Quem é você? E que lugar é esse?!"
21040-117 = "Confirmado: ego, memórias e propósito desta unidade encontram-se ausentes. Sem dados."
21040-118 = "C-Como assim...? V-Você não vai atacar a gente do nada, né?"
21040-120 = "Afirmativo. Ao encontrar alvos autorizados para contato, o protocolo de hostilidade desta unidade não é ativado."
21040-121 = "Uau, incrível. Cidadãos robôs são comuns em Kivotos, mas é a primeira vez que vejo um tão parecido com a gente."
21040-124 = "Hmm... O que fazemos, Sensei?"
21040-125 = "[s3] \"Pode explicar o que significa 'alvo autorizado para contato'?\"\n[s4] \"Quem é você? Onde estamos?\""
21040-127 = "Impossível responder. Estima-se que tenha ocorrido uma reação primária no subconsciente desta unidade."
21040-129 = "Impossível responder. Estima-se que tenha ocorrido uma reação primária no subconsciente desta unidade."
21040-131 = "Subconsciente? Do que ela tá falando...?"
21040-132 = "Hmm..."
21040-133 = "No subsolo de uma fábrica, uma garota quase pelada e ainda por cima com amnésia..."
21040-134 = "Hehe, tive uma ótima ideia."
21040-135 = "Olha... dessa sequência de palavras que você acabou de falar, eu só consigo pensar em coisa ruim..."
21040-140 = "???"
21040-142 = "Millennium — Clube de Desenvolvimento de Jogos"
21040-145 = "???"
21040-147 = "Ei, espera aí?!"
21040-148 = "O que você pretende trazendo ela até a sala do clube?!"
21040-150 = "Urgh, não me enforca! Tá apertando... cof, cof!"
21040-151 = "N-Não tinha jeito, tá bom?! A gente não podia deixar ela num lugar cheio daqueles robôs assustadores..."
21040-153 = "(Nham, nham)"
21040-154 = "Aah, não coloca meu controle de Wee na boca! Cospe! Cospe isso!"
21040-155 = "...Viu? Não dava mesmo pra deixar ela sozinha."
21040-157 = "Isso é verdade, mas..."
21040-158 = "Não seria melhor entrar em contato com o Conselho Estudantil Geral ou com a Valkyrie agora mesmo?"
21040-159 = "Até seria... mas ainda não. Só depois que a gente terminar o que precisa fazer."
21040-160 = "O que precisa fazer?"
21040-161 = "Bom, pra começar, ela precisa de um nome, né? Que tal chamar ela de \"Aris\"?"
21040-164 = "...Designação desta unidade: \"Aris\". Por favor, confirmar."
21040-165 = "E-Espera aí! Esse foi o nome que você inventou lendo do seu jeito, mana! Não devia ser AL-1S-chan?"
21040-166 = "Comprido assim é difícil de chamar, né? E aí, Aris? Gostou?"
21040-168 = "..."
21040-170 = "...Afirmativo."
21040-171 = "Esta unidade: Aris."
21040-172 = "Ahaha! Viu só o meu talento pra dar nomes?!"
21040-173 = "Hmm... Se ela gostou, tudo bem."
21040-175 = "Muito bem, então vamos pro próximo passo!"
21040-177 = "Mana, o que você tá pensando...? Não é como se a gente tivesse achado um gatinho na rua, tá?!"
21040-178 = "Você que devia pensar direito, Midori."
21040-179 = "Pra começo de conversa, por que a gente tava correndo tanto risco procurando a G.Bible?"
21040-180 = "Isso é... pra fazer um bom jogo e impedir o clube de ser fechado, né?"
21040-181 = "Exato! Esse é o problema mais importante agora."
21040-182 = "Eu também quero fazer um bom jogo, mas manter o clube aberto é prioridade máxima. E pra isso, a gente precisa cumprir uma de duas condições."
21040-183 = "Ganhar um prêmio no Prêmio Millennium é só uma delas."
21040-184 = "Na prática só existe uma opção, né? Você mesma disse, mana, porque \"conseguir mais membros\" já é impossível..."
21040-185 = "...Espera."
21040-186 = "M-Mana, não me diga que..."
21040-187 = "Você tá pensando em disfarçar ela de aluna da Millennium e colocar no nosso clube...?!"
21040-189 = "Aris!"
21040-191 = "Junte-se ao nosso grupo!"
21040-193 = "(Crec, crec...)"
21040-194 = "Aah! Não come o meu \"Game Girls Advance SP\"! É o único console de 16 bits de Kivotos com CPU customizada de 8 núcleos e 16 threads e resolução 8K!!"
21040-197 = "Ai, meu Deus..."
21040-199 = "S-Será que isso vai dar certo...?"
21040-201 = "Próximo;Eu Sou Aris"
