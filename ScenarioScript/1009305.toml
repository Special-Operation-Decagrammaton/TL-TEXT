[translation]
1009305-1 = "Частные занятия"
1009305-2 = "Получив сообщение от Кирары, я отправился в класс Геенны, о котором она мне сказала."
1009305-3 = ""
1009305-8 = ""
1009305-9 = "А! Учитель! Спасибо, что пришли!"
1009305-10 = "Это наш класс! Ну как вам?"
1009305-11 = "[s] «Наш»? Но ты здесь одна..."
1009305-12 = "Ну, все ушли на клубные занятия или разбираются со взрывами и прочим!"
1009305-13 = "В Геенне такое каждый день! Не парьтесь!"
1009305-14 = "Некогда любезничать! Нам нужно заниматься!"
1009305-15 = ""
1009305-17 = ""
1009305-18 = "Вот! Садитесь рядом со мной!"
1009305-19 = "Мне нужно убедиться, что я выучу всё, что будет на тесте, так что включаю режим полной концентрации!"
1009305-21 = "Мы с Кирарой учились изо всех сил, и не успели оглянуться..."
1009305-22 = ""
1009305-28 = ""
1009305-30 = ""
1009305-31 = "А? Урок уже закончился?"
1009305-32 = "Я так сосредоточилась, что потеряла счёт времени. Может, я вообще настоящая отличница!"
1009305-33 = "[s] «Ты отлично справилась! Может, отдохнём?»"
1009305-34 = "А-А? Перерыв? У меня ещё полно энергии!"
1009305-35 = "...А? Перерывы — важная часть учёбы?"
1009305-36 = "Ну... вы не ошибаетесь..."
1009305-37 = ""
1009305-39 = ""
1009305-40 = "Ха-ха. Ладно, поймали. Я собиралась после этого встретиться с друзьями!"
1009305-41 = "Та-а-ак что... хотелось поскорее всё закончить и пойти тусоваться! Хи-хи."
1009305-42 = ""
1009305-45 = "[ns] «Ладно, звучит неплохо.»"
1009305-47 = "[ns1] «Но с учёбой нельзя халтурить.»\n[ns2] «Ты сама попросила меня помочь, помнишь?»"
1009305-50 = "Д-Да... Знаю, знаю."
1009305-51 = "Хорошо! Тогда сделаем нормальный перерыв!"
1009305-52 = "А, вообще-то... Есть кое-что, что я давно хотела сделать, но всё никак не доходили руки..."
1009305-53 = ""
1009305-55 = ""
1009305-56 = "У меня идея!"
1009305-57 = "Обещаю быть полностью, на сто процентов сосредоточенной, если поможете мне кое с чем, Учитель!"
1009305-58 = "[s] «С чем... конкретно?»"
1009305-59 = "Ладно, вот в чём дело."
1009305-60 = ""
1009305-62 = ""
1009305-63 = "Я закончила всю подготовку, но ещё даже не подала заявку!"
1009305-64 = "Это типа занимает кучу времени, но если вы поможете, всё пойдёт супербыстро, Учитель!"
1009305-65 = "Мы всё равно на перерыве, да? Что думаете?"
1009305-66 = "[s] «Я не против... но что именно мы подаём?»"
1009305-67 = "А? Разве не очевидно?"
1009305-68 = "Одолжите мне ваш стол на минутку, Учитель!"
1009305-69 = ""
1009305-71 = ""
1009305-80 = "― [log=키라라 반짝부]Что такое, Учитель? Вы как-то странно себя ведёте.[/log][wa:900]"
1009305-81 = "― [log=키라라 반짝부]Такими темпами наш перерыв закончится.[/log][wa:2360]"
1009305-84 = "― [log=키라라 반짝부]А! Может, вы... не умеете делать педикюр?[/log][wa:1720]"
1009305-85 = "― [log=키라라 반짝부]Это легко! Сначала нужно просто приблизиться к ногтю как следует...[/log][wa:5140]"
1009305-88 = "[ns5] «Дай посмотрю...»\n[ns6] «Вот так?»"
1009305-89 = "― [log=키라라 반짝부]Э-Эм... Д-Да! Именно так![/log][wa:2010]"
1009305-90 = "― [log=키라라 반짝부]Э-Эм... Д-Да! Именно так![/log][wa:2010]"
1009305-93 = "― [log=키라라 반짝부]Н-Но... ваше лицо не слишком близко...? Хи-хи-хи![/log][wa:3520]"
1009305-96 = "― [log=키라라 반짝부]Учитель...? Я чувствую ваше дыхание...[/log][wa:1170]"
1009305-99 = "― [log=키라라 반짝부]То, что вы делаете мне педикюр... немного смущает...[/log][wa:880]"
1009305-102 = "[ns] «Хм? Ты что-то сказала?»"
1009305-103 = "― [log=키라라 반짝부]Х-Ха-ха-ха! Ничего! С-Совсем ничего![/log][wa:1830]"
1009305-104 = "― [log=키라라 반짝부]Давайте просто закончим, чтобы вернуться к учёбе![/log][wa:2090]"
1009305-107 = ""
1009305-108 = "...Готово! Все десять нанесены! Миссия выполнена!"
1009305-109 = ""
1009305-111 = ""
1009305-112 = "В обмен за помощь, видимо, мне теперь придётся учиться по-настоящему усердно!"
1009305-113 = "А-А? У меня лицо красное? Н-Не понимаю, о чём вы, Учитель!"
1009305-114 = ""
1009305-116 = ""
1009305-117 = "А! Знаю! Наверное, я просто переборщила с румянами. Ха-ха-ха!"
1009305-118 = "Ладно! Время урока! Да, я обожаю учиться! Больше никаких отвлечений, Учитель!"
1009305-121 = "Но даже после того, как мы вернулись к учёбе, лицо Кирары оставалось странно красным."
