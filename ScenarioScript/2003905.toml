[translation]
2003905-1 = "Птица пролетает над гнездом"
2003905-2 = "Офис Шале"
2003905-4 = ""
2003905-5 = "[ns] «Тогда я рассчитываю на совместную работу сегодня.»"
2003905-6 = "Предоставьте это мне."
2003905-7 = ""
2003905-9 = ""
2003905-23 = ""
2003905-24 = "[ns] «МЫ ЗАКОНЧИЛИ!»"
2003905-25 = "Фу-фу. Вы довольны?"
2003905-26 = "Хм? Никто не любит работать? Пожалуй, с этим мнением я согласна..."
2003905-27 = "Как бы то ни было, ваша радость радует и меня, Сенсей."
2003905-28 = "Других запланированных дел нет, верно? Возможно, вам тоже стоит отдохнуть, Сенсей."
2003905-29 = "Хм? Кажется, будто начальник здесь я? Это было бы несколько затруднительно."
2003905-30 = "У каждого человека... есть своя роль и своё место."
2003905-32 = "Кисаки смотрела в окно, словно погрузившись в мысли."
2003905-34 = ""
2003905-35 = "Хм? Я любуюсь пейзажем? Здесь нет ничего особенно интересного..."
2003905-36 = "И ни о чём конкретном я не думаю. Просто... смотрю."
2003905-38 = "Несмотря на равнодушный тон Кисаки..."
2003905-39 = "...казалось, будто её заворожило нечто, чего она прежде никогда не видела."
2003905-40 = "Словно ребёнка, наблюдающего что-то новое."
2003905-42 = ""
2003905-43 = "[ns] «Кисаки.»"
2003905-44 = "Да? Что такое, Сенсей?"
2003905-45 = "[s] «Хочешь подняться на крышу?»"
2003905-46 = "А? Этого здания?"
2003905-47 = "Зачем? Там ведь ветрено и довольно опасно, разве нет?"
2003905-48 = "Вы хотите вместе посмотреть на город с крыши?"
2003905-49 = "..."
2003905-50 = "Х-хорошо. Если вы так хотите, не вижу причин отказываться, Сенсей..."
2003905-52 = "Мы с Кисаки поднялись на лифте на крышу."
2003905-57 = "Ай...!"
2003905-58 = "Как я и ожидала, ветер здесь довольно сильный. И солнце яркое."
2003905-59 = "Какова была ваша цель, Сенсей?"
2003905-60 = "[s1] «Просто погода такая замечательная!»\n[s2] «Но мы ведь не можем сбежать с работы на пикник!»"
2003905-63 = ""
2003905-65 = ""
2003905-66 = "Неужели...?"
2003905-67 = "Фу-фу. Пожалуй, это правда."
2003905-79 = "Странное ощущение."
2003905-80 = "Если бы захотели, мы могли бы увидеть такой пейзаж и в Шаньхайцзине."
2003905-81 = "Нужно лишь посмотреть. Вот так."
2003905-82 = ""
2003905-84 = "Вот так..."
2003905-85 = "..."
2003905-86 = "Если бы только мы могли выбраться чуть дальше..."
2003905-87 = "[s] «Тогда давай так и сделаем.»"
2003905-88 = "?!?!"
2003905-89 = "В-вы это услышали?!"
2003905-90 = "[s] «Раз уж здесь только мы вдвоём.»"
2003905-91 = "...!"
2003905-92 = "...Неожиданно у вас довольно скверные наклонности!"
2003905-93 = "[s] «Ты не хочешь?»"
2003905-94 = "*глубокий вдох*"
2003905-95 = "[s] «Лично я уже предвкушаю.»"
2003905-96 = "Я не позволю вам забыть это, Сенсей."
2003905-97 = "Хм..."
2003905-98 = "Пожалуй, я ведь ещё не сказала, что не хочу."
2003905-99 = "[s3] «Да. Сюда и туда, вместе.»\n[s4] «Давай отправимся куда-нибудь подальше.»"
2003905-102 = "..."
2003905-103 = "Можно мне... ждать этого с нетерпением, Сенсей?"
2003905-104 = "[s] «Разумеется»."
2003905-105 = ""
2003905-107 = ""
2003905-108 = ""
2003905-110 = "Кисаки молча подошла ближе."
2003905-111 = "Её взгляд был устремлён куда-то вдаль."
2003905-112 = "Но кончики наших пальцев соприкасались."
