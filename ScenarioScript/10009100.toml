[translation]
10009100-1 = "Послесловие;Идеальный оякодон?!"
10009100-2 = ""
10009100-4 = "Всю жизнь я отдавала себя оякодону, и к чему это привело?"
10009100-5 = "Я застряла. Достигла предела. Всё, что могу приготовить, — всё те же старые вкусы..."
10009100-6 = "Этого недостаточно. Да, мои вкусы мягкие и сбалансированные, но если на этом всё, следующее поколение оставит меня далеко позади."
10009100-7 = "Мне нужен новый вкус. Такой, чтобы действительно поражал."
10009100-8 = ""
10009100-11 = ""
10009100-12 = "Хорошо. Решено! Я возьму отпуск ради исследования новых вкусов."
10009100-13 = ""
10009100-19 = "Этот шоколадный батончик... Именно то, что я искала!"
10009100-21 = "«Шипучая карамель,» значит? Как она взрывается на языке одновременно текстурой и вкусом... Изысканно!"
10009100-22 = "Если суметь передать это ощущение и гармонично соединить его с моим оякодоном, получится идеальный вкус!"
10009100-23 = "Но я ещё не там. Какие ингредиенты использовать? Как их смешать?"
10009100-24 = "Придёт ли ко мне вдохновение? Я так давно не думала ни о чём, кроме оякодона, что мозг будто застрял в колее."
10009100-28 = ""
10009100-29 = "Свежий взгляд... Я могу спросить студента!"
10009100-30 = ""
10009100-33 = "А?"
10009100-34 = "Эй! Не поможешь мне немного?"
10009100-35 = "У меня всего один небольшой вопрос."
10009100-36 = "Эм, что? Конечно, помогу, но о чём речь?"
10009100-39 = "Тебе нужно... что-то яркое и бодрящее?"
10009100-40 = "Да, именно! Мне нужно нечто, отражающее дух времени!"
10009100-41 = "Понятно. Что-то свежее, взрывное..."
10009100-42 = "Да-да! Хочу, чтобы вкус буквально ударял!"
10009100-43 = ""
10009100-45 = ""
10009100-46 = ""
10009100-47 = "А, понятно. Тебе нужна приправа из светошумовой гранаты."
10009100-48 = "П-приправа из светошумовой гранаты? Ты серьёзно?!"
10009100-49 = "Да. Такая приправа будет взрываться во рту и создавать яркую вспышку."
10009100-50 = "Идеально подходит под вкус, который ты хочешь, разве нет?"
10009100-52 = ""
10009100-53 = "(Она говорит об этом так спокойно. Даже выражение лица не изменилось!)"
10009100-54 = "(Так вот она какая, молодёжь? Подумать только, мир дошёл до такого, а я и не знала...)"
10009100-56 = "Но это вообще можно использовать?"
10009100-57 = "О, конечно. Я бы не предлагала, если бы это было небезопасно."
10009100-58 = "Хм, понятно. Приправа из светошумовой гранаты..."
10009100-59 = ""
10009100-61 = ""
10009100-62 = "Это... невероятно! Совершенно ново! Настоящий символ времени!"
10009100-63 = "С этим я смогу не отставать от следующего поколения поваров. Не знаю, как вас благодарить."
10009100-64 = "О, эм... Я просто рада, что смогла помочь."
10009100-65 = "Вот, возьми. Это светошумовая граната."
10009100-66 = "Что? Почему?"
10009100-67 = "Из-за всех побегов из тюрьмы на улицах хаос. Нужно уметь защитить себя."
10009100-68 = "(Светошумовая граната... и оякодон с приправой из светошумовой гранаты... Вместе они могут стать идеальным комбо!)"
10009100-69 = "(Наверняка никто ещё не видел ничего подобного!)"
10009100-70 = "Ещё раз спасибо. Правда, если когда-нибудь смогу отплатить... Я этого не забуду!"
10009100-71 = "Эм, это считалось услугой...? Да всё нормально. Береги себя."
10009100-77 = ""
10009100-78 = "Здравствуйте? Мне как обычно, одну порцию оякодона."
10009100-79 = ""
10009100-81 = ""
10009100-83 = "Одна порция оякодона! С сегодняшнего дня у нас новый улучшенный рецепт."
10009100-84 = ""
10009100-86 = ""
10009100-87 = "Гарантирую, вы его не забудете!"
10009100-88 = ""
