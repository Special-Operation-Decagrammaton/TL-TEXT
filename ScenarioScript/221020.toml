#[!][Data: "20/09"]
[translation]
221020-1 = "Episódio 02;O Retorno do Olympos"
221020-3 = ""
221020-4 = "Entrada do Porto de Aohama, D.U."
221020-5 = "Olá a todos os espectadores do Canal Kronos!#nAqui quem fala é a repórter [ruby=Kazamaki]Mai[/ruby], do Clube de Jornalismo!"
221020-6 = "A edição de hoje do 'Análise de Fatos com Mai Kazamaki' está sendo transmitida ao vivo diretamente do Porto de Aohama!"
221020-7 = "O Colégio Marítimo Odisseia acaba de regressar de sua grande expedição oceânica!#nUma multidão de cidadãos já se amontoa no cais para testemunhar este retorno após quatro longos meses longe da terra firme!"
221020-8 = "Autoridades da Administração Portuária estão a postos... e olha só, membros do alto escalão do Conselho Estudantil Federal também marcam presença!"
221020-9 = ""
221020-11 = ""
221020-13 = ""
221020-14 = "Com licença! Somos do Canal Kronos!#nPodemos fazer uma breve entrevis――"
221020-15 = ""
221020-17 = ""
221020-18 = ""
221020-19 = "Tsc... não custava nada soltar uma palavrinha, né?"
221020-20 = "Cof, cof! Mas enfim!"
221020-21 = "Como todos sabem, o Colégio Marítimo Odisseia é uma instituição especializada em operações navais.#nFamosa por suas missões em alto-mar onde as alunas passam no mínimo um ano inteiro vivendo sob as ondas――"
221020-22 = "Porém, com menos de seis meses de viagem, fomos surpreendidos por este retorno relâmpago!#nAo que tudo indica, cancelaram o restante do cronograma de repente e voltaram voando para D.U.!"
221020-23 = "Qual terá sido a verdadeira razão para a Odisseia abortar a expedição e retornar às pressas para a terra firme?!"
221020-24 = "A escola ainda não emitiu nenhuma nota oficial e os detalhes seguem sob sigilo,#nmas correm boatos de que o próprio Sensei da Schale solicitou uma visita formal!"
221020-25 = "Isso quer dizer que... ocorreu um incidente tão grave a bordo da Odisseia que exigiu a intervenção direta da Schale?!"
221020-26 = "Ou será apenas mais um mero capricho do Sensei?!"
221020-27 = ""
221020-29 = ""
221020-30 = "Opa! Falando no rei de Roma, olha o Sensei ali!"
221020-31 = ""
221020-33 = ""
221020-34 = ""
221020-35 = "Olá, Sensei! É o Canal Kronos na área!"
221020-36 = "[s1] \"Olá.\"\n[s2] \"Seu faro jornalístico não falha nunca, né...?\""
221020-39 = "Mas é claro! Trazer as fofocas e notícias quentes de Kivotos antes de todo mundo!#nEsse é o dever de honra do Clube de Jornalismo da Kronos!"
221020-40 = "Mas mudando de assunto, Sensei!#nÉ verdade o boato de que você tá envolvido até o pescoço nessa história toda?"
221020-41 = "[s] \"Olha, dizer se estou envolvido ou não é meio relativo......\""
221020-42 = "Oho! Sinto cheiro de furo de reportagem no ar...!"
221020-43 = "Se o próprio Sensei da Schale veio pessoalmente até aqui, é porque tem caroço nesse angu da Odisseia, não tem?"
221020-44 = "É alguma consulta confidencial? Treta entre clubes rivais?#nOu quem sabe uma conferência ultra-secreta com o conselho estudantil 'Island'――"
221020-45 = "Não me diga que tem a ver com aquelas [ruby=lendas]lendas urbanas[/ruby] bizarras que tão bombando na internet?!"
221020-46 = "[s] \"Bem, é que na verdade......\""
221020-47 = "Poderia fazer a gentileza de não colocar o Sensei contra a parede, senhorita [ruby=Mai]Kazamaki[/ruby]?"
221020-48 = ""
221020-49 = ""
221020-50 = "O Sensei recebe consultas das mais diversas naturezas.#nÉ natural que haja muitos assuntos sob estrito sigilo que ele não possa revelar."
221020-51 = "Aprecio sua dedicação jornalística, mas constranger as pessoas dessa forma não seria passar do ponto?"
221020-52 = "P-Presidente do Conselho Estudantil Federal?!"
221020-53 = "Não é possível... A senhora também vai participar da cerimônia de boas-vindas?!"
221020-54 = "Sim. Há algum inconveniente nisso?"
221020-55 = "Não, de jeito nenhum, é só que... uma líder que mal sai do gabinete aparecer em pessoa para uma visita escolar――"
221020-56 = "Isso vai muito além de um mero furo jornalístico!"
221020-57 = "Fufufu. Parece que você tem uma infinidade de perguntas em mente."
221020-58 = "......Que tal reservarmos um momento após o evento para uma entrevista formal?"
221020-59 = "Dependendo do meu ânimo...#ntalvez eu até revele alguns detalhes da minha vida pessoal que nunca contei a ninguém."
221020-60 = "Sério mesmo?! Por favor, eu imploro, prometo que serei um anjo...!"
221020-61 = "Muito bem... por ora, como tenho um compromisso prévio com o Sensei, peço licença."
221020-62 = ""
221020-64 = ""
221020-65 = ""
221020-66 = "Mai-senpai, não é melhor a gente ir atrás deles?"
221020-67 = "Uma visita de campo da Presidente do Conselho Estudantil Federal é o maior escândalo do ano――"
221020-68 = "Cala a boca! Quer arruinar nossa chance de ouro, criatura?!#nSe a gente forçar a barra e irritar ela agora, perdemos tudo!"
221020-69 = "Uma entrevista exclusiva com a Presidente do Conselho Estudantil Federal...#nNem agendando com um ano de antecedência a gente consegue vaga!"
221020-70 = "Com essa matéria, o Canal Kronos vai quebrar todos os recordes históricos de audiência...!"
221020-72 = "......Pronto, agora podemos respirar em paz."
221020-73 = "[s3] \"Obrigado pela ajuda.\"\n[s4] \"Você me salvou de uma bela enrascada......\""
221020-76 = "De forma alguma.#nO entusiasmo do pessoal do Colégio Kronos frequentemente causa dores de cabeça até na nossa Chefe de Mediação."
221020-77 = "Aproveitando a oportunidade, poderemos conversar com calma."
221020-78 = "[ns5] \"Falando nisso, tudo bem você ter vindo junto?\"\n[ns6] \"Se era só pra tirar a dúvida sobre a bola, eu podia ter vindo sozinho.\""
221020-81 = "Ora... minha companhia por acaso lhe causa desconforto?"
221020-82 = "Talvez eu devesse ter considerado melhor minha posição formal...#nPeço desculpas se acabei sendo um fardo para você, Sensei――"
221020-83 = "[s] \"Não é isso, longe de mim pensar algo assim!\""
221020-84 = ""
221020-87 = "[ns7] \"É que sua agenda vive tão lotada...\"\n[ns8] \"Fiquei com receio de estar te obrigando a abrir mão do seu tempo.\""
221020-90 = "Não nego que esteja sempre ocupada, mas permanecer o dia todo presa a uma mesa não faz bem à saúde."
221020-91 = "Ter um bom 'pretexto' para sair e respirar o ar puro do mar é uma excelente forma de arejar a mente."
221020-92 = "Além disso, a Odisseia possui um charme muito peculiar, digno de uma verdadeira academia naval.#nÉ fascinante apenas observar o movimento delas, não acha?"
221020-93 = "[s] \"Você já esteve na Odisseia antes?\""
221020-94 = "Não, esta é a primeira vez que ponho os pés aqui――"
221020-95 = ""
221020-106 = "――Quer dizer, é a segunda vez."
221020-107 = ""
221020-108 = "[ns] （O que é isso...... essa sensação estranha de déjà vu......）"
221020-109 = ""
221020-111 = ""
221020-112 = "Sensei. Olhe naquela direção."
221020-113 = "Em instantes, o Olympos, nau capitânia do conselho estudantil 'Island' da Odisseia,#nestará atracando no cais."
221020-114 = "As equipes de terra já estão a postos na muralha do cais para auxiliar na amarração das amarras."
221020-115 = ""
221020-116 = "Atenção a todos para atracação! Compartimentação interna em fechamento contínuo!"
221020-117 = ""
221020-118 = "Confirmação do posicionamento da equipe de terra!"
221020-119 = "Alinhamento com o [ruby=portaló]portaló[/ruby], em frente, marche!"
221020-120 = ""
221020-121 = "Cabo de través de proa! Puxar e aguentar firme! Se afrouxar, o navio leva tudo!"
221020-122 = ""
221020-124 = ""
221020-125 = ""
221020-126 = "[ns] \"O clima tá bem tenso por aqui, né?\""
221020-127 = "Não seria este o procedimento mais seguro e otimizado?"
221020-128 = "Para manobrar uma embarcação dessas proporções, exige-se uma coordenação milimetricamente perfeita."
221020-129 = "Afinal, a tensão suportada pelos cabos de amarração atinge dezenas de toneladas.#nSe um deles se romper, a tragédia pode ser irreparável."
221020-130 = "[s] \"É, você tem toda razão......\""
221020-131 = "......Compreendo sua preocupação, Sensei.#nCom um contingente tão grande de tripulantes, é natural que nem todas se adaptem bem à rigidez do ambiente――"
221020-132 = "Porém, isso faz parte da jurisdição interna de cada escola.#nMesmo na posição de Presidente do Conselho Estudantil Federal, não me cabe intervir levianamente."
221020-133 = ""
221020-135 = ""
221020-136 = ""
221020-137 = "Embora... talvez para o Sensei da Schale isso seja possível."
221020-140 = ""
221020-141 = "Olympos, atracação concluída com sucesso!"
221020-142 = "Manobra finalizada. Equipe de terra, dispensar postos."
221020-143 = "Dispensados! Bom trabalho a todos!"
221020-145 = ""
221020-146 = ""
221020-147 = ""
221020-148 = "É-É uma honra conhecê-la, Presidente do Conselho Estudantil Federal!#nEu sou a aspirante [ruby=Komori]Sumika Komori[/ruby], da unidade Trident, responsável pela escolta de sua senhoria no dia de hoje!"
221020-149 = "A-Agradecemos imensamente pelo tremendo incômod――#nQuer dizer, é uma honra imensurável receber sua ilustre visita em nosso navio!"
221020-150 = "Até o momento do seu desembarque, a segurança de suas pessoas está nas mãos leais do Trident!"
221020-151 = "Muito obrigada, senhorita Komori."
221020-152 = "Poderia receber o Sensei também sob seus cuidados?"
221020-153 = "Eh? Ah, então este ao seu lado é... o Sensei da Schale!"
221020-154 = ""
221020-156 = ""
221020-157 = "......S-Sensei?!"
221020-158 = "[ns9] \"Nos encontramos de novo, né?\"\n[ns10] \"A gente se viu antes, quando eu tava com a Pandemônio, lembra?\""
221020-161 = "A-Ai, ai, meu Deus do céu......!"
221020-162 = "P-Por que o Sensei tá aqui na Odisseia......?!"
221020-163 = "N-Não me diga que...... é por causa daquele mal-entendido em que confundi o barco em que você tava com um navio pirata e abri fogo......?!#nVocê veio pessoalmente prestar queixa formal――"
221020-164 = "[s] \"Relaxa, eu já falei que tá tudo bem quanto àquilo......\""
221020-165 = "S-Sim, eu sei disso!#nEu sei muito bem, só que......"
221020-166 = ""
221020-168 = ""
221020-169 = ""
221020-170 = "......Tem certezinha absoluta de que não é por causa disso......?"
221020-171 = "[s] \"Juro de pés juntos, pode confiar.\""
221020-172 = ""
221020-174 = ""
221020-175 = ""
221020-176 = ""
221020-177 = "U-Ufa...... que alívio gigantesco......"
221020-178 = "Por causa daquele rolo, levei uma bronca homérica da vice-líder por disparar contra um alvo imaginário e gastar munição preciosa à toa."
221020-179 = "Se eu levar mais algum ponto negativo na ficha agora, meu futuro na marinha vai pro ralo――"
221020-180 = "――Opa! Espera aí, isso não é uma oportunidade de ouro......?"
221020-181 = "Esta humilde aspirante de plantão, Sumika Komori, dará a vida para escoltá-los com perfeição máxima!#nE-Então, sabe... não que eu esteja cobrando nada em troca, longe de mim, mas...#nse vocês pudessem comentar com a chefia na saída que 'o plantão de hoje foi super atencioso'... e-hehe!"
221020-182 = "Senhorita Komori, há alguma precaução necessária para subirmos a escada de embarque?"
221020-183 = "Nenhuma em especial! Podem subir tranquilamente!"
221020-184 = ""
221020-186 = ""
221020-187 = "Presidente do Conselho Estudantil Federal e Sensei da Schale embarcando!"
221020-193 = "（A primeira impressão que tive da Odisseia#nfoi a de uma metrópole flutuante colossal, e não de um simples navio.）"
221020-194 = "（Vários andares da torre de comando se erguiam como arranha-céus reluzentes.#nMesmo após meses de viagem rigorosa, tudo brilhava com uma alvura impecável.）"
221020-195 = ""
221020-196 = "[ns11] \"Isso tudo... é um navio só?\"\n[ns12] \"Daria tranquilamente pra morar milhares de pessoas aqui dentro......\""
221020-199 = "Mas é claro!#nApesar de não ser muito veloz, esta é a nau capitânia da Odisseia, desbravando os mares bravios de Kivotos desde épocas remotas!"
221020-200 = "Na verdade, é a primeira vez que eu subo a bordo também, mas abafa o caso......"
221020-201 = ""
221020-204 = ""
221020-205 = ""
221020-206 = ""
221020-207 = ""
221020-208 = "......Ué?"
221020-209 = "Ora, ora."
221020-210 = "Essa imponente [ruby=revista de tropas]formatura militar[/ruby] também faz parte dos ritos de boas-vindas?"
221020-211 = "E-Então...... como é minha primeira vez pisando no Olympos, eu também não manjo muito do protocolo......"
221020-212 = "Atenção, recuem!#nA escolta de honra de ambas as autoridades é atribuição exclusiva do Trident!"
221020-216 = "A Capitã entra a bordo."
221020-217 = ""
221020-220 = "Atenção para a Capitã!"
221020-222 = "[ns] \"Capitã......?\""
221020-227 = "[ns] \"Aquelas duas são......\""
221020-228 = "Devem ser a 'Capitã' e a 'Primeira-Tenente', equivalentes aos cargos de Presidente e Vice-Presidente do conselho."
221020-229 = "Fufufu... parecem ainda mais competentes do que imaginei."
221020-230 = ""
221020-233 = "Apresentar armas à frente!"
221020-234 = ""
221020-240 = ""
221020-241 = ""
221020-242 = "É uma honra inestimável conhecê-la, Presidente do Conselho Estudantil Federal.#n......E a você também, Sensei."
221020-243 = "Eu sou [ruby=Kairo]Minato[/ruby], e exerço a liderança do conselho estudantil 'Island'."
221020-244 = "Agradeço por terem se dado ao trabalho de vir até a nossa embarcação."
221020-245 = "Não há de quê, fomos nós que fizemos uma exigência repentina."
221020-246 = "É um grande prazer conhecê-la pessoalmente, Capitã Kairo."
221020-247 = "E ao seu lado está――"
221020-248 = "Sou [ruby=Tomoshita]Ami[/ruby], vice-líder do Island."
221020-249 = "Agradecemos profundamente por disponibilizarem seu valioso tempo, mesmo com uma agenda tão apertada."
221020-250 = "......Compreendo, muito bem."
221020-251 = "Prazer em conhecê-la, Vice-Capitã Tomoshita. Conto com sua cooperação no dia de hoje."
221020-252 = "E este aqui ao meu lado é――"
221020-253 = ""
221020-255 = ""
221020-256 = ""
221020-257 = "[ns13] \"Eu sou o Sensei da Schale.\"\n[ns14] \"Prazer em conhecê-las!\""
221020-260 = ""
221020-261 = "......Então é você."
221020-262 = "Ouvi bastante a seu respeito.#nO [ruby=・]adulto[/ruby] da Schale, organização com prerrogativas extraordinárias sob jurisdição direta da Presidente."
221020-263 = ""
221020-265 = ""
221020-266 = ""
221020-267 = "Seja muito bem-vindo, Sensei."
221020-268 = "Em nome de toda a tripulação, estendo as mais calorosas saudações à sua chegada ao Colégio Marítimo Odisseia."
221020-270 = "Próximo Episódio;Os Tabus do Mar"
