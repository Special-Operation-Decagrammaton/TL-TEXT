[translation]
221020-1 = "Episode 2;Return of the Olympus"
221020-4 = "D.U. Aohama Port Entrance"
221020-5 = "Hello to all viewers of Kronos Channel!#nI am Mai Kazamaki from the Kronos News Department!"
221020-6 = "Today's 'Mai Kazamaki's Current Events Analysis' is coming to you live from Aohama Port."
221020-7 = "Odyssey Marine High School has returned from its deep-sea voyage!#nMany citizens have already gathered to catch a glimpse of their return after four months!"
221020-8 = "Look at the bigwigs from the Port Authority... Oh, there are General Student Council officials too!"
221020-14 = "Excuse me! This is Kronos Channel!#nCould we get a brief interview..."
221020-19 = "Tsk... It is not like answering a single word is going to kill you."
221020-20 = "Ahem, anyway."
221020-21 = "As you all know, Odyssey Marine High School is an academy specializing in maritime activities.#nThey are famous for spending at least a year living out at sea once they set sail, but..."
221020-22 = "A surprise return less than half a year after setting sail!#nIt seems they suddenly called off the rest of their voyage schedule and returned to D.U.!"
221020-23 = "What on earth is the reason behind Odyssey interrupting their voyage and heading back to land?"
221020-24 = "The details remain unknown as the academy has yet to make an announcement,#nthough there are rumors that Sensei from Schale requested a visit!"
221020-25 = "Does this mean... an incident occurred at Odyssey serious enough to require an investigation by Schale!?"
221020-26 = "Or is it just another one of Sensei's whims!?"
221020-30 = "Ah, speaking of the devil, it is Sensei [USERNAME]!"
221020-35 = "Hello, Sensei! This is Kronos Channel!"
221020-36 = "[s1] \"Hello.\"\n[s2] \"You really have a good nose for news...\""
221020-39 = "Of course! Delivering news from all over Kivotos faster than anyone else!#nThat is what the Kronos School News Department does."
221020-40 = "Be that as it may, Sensei.#nIs the rumor true that you are involved in this matter?"
221020-41 = "[s] \"Should I say I am involved, or should I say I am not...\""
221020-42 = "Hoho? I smell a scoop..."
221020-43 = "If Schale's Sensei is stepping in personally,#nthat must mean something is going on at Odyssey, right?"
221020-44 = "Is it about counseling? Or a dispute between clubs?#nPerhaps a top-secret meeting with the Odyssey Student Council――"
221020-45 = "Could it be related to that urban legend recently trending online?"
221020-46 = "[s] \"Um, well...\""
221020-47 = "Would you mind not giving Sensei such a hard time, Ms. Kazamaki?"
221020-50 = "Sensei receives all sorts of consultations.#nThat means there are plenty of things they cannot talk about."
221020-51 = "Your enthusiasm for journalism is fine, but isn't harassing your interviewee missing the point?"
221020-52 = "Th-The General Student Council President!?"
221020-53 = "No way... Is the General Student Council President participating in the welcome ceremony too!?"
221020-54 = "Yes. Is there a problem?"
221020-55 = "No, it is just that... for the General Student Council President, who almost never goes outside,#nto visit an academy's event..."
221020-56 = "This is way beyond a mere scoop!"
221020-57 = "Fufu. You seem to have a lot of questions."
221020-58 = "...If you like, shall we set up an interview after the event?"
221020-59 = "Depending on my mood...#nI might even answer personal questions we haven't talked about yet."
221020-60 = "Are you serious!? Please, absolutely...!"
221020-61 = "Then... I have a prior engagement with Sensei right now, so if you will excuse us."
221020-66 = "Senior Mai, shouldn't we chase after them?"
221020-67 = "The General Student Council President doing an inspection is the ultimate scoop..."
221020-68 = "Shut up! Are you trying to ruin a golden opportunity!?#nIt would be much worse if we chased them clumsily and annoyed her!"
221020-69 = "Getting an exclusive interview with the General Student Council President is something that might not get approved even if you applied a year in advance!"
221020-70 = "Maybe we can break Kronos Channel's all-time view record with this case...!"
221020-72 = "...We can finally catch our breath."
221020-73 = "[s3] \"Thanks for saving me.\"\n[s4] \"You really helped me out of a tight spot...\""
221020-76 = "Not at all.#nEven the Arbitration Committee Director was pulling her hair out over the Kronos students' enthusiasm."
221020-77 = "This is a good opportunity, so we can finally talk at ease."
221020-78 = "[ns5] \"That aside, was it really okay for you to come with me?\"\n[ns6] \"If it was just about asking regarding the orb, I could have come alone.\""
221020-81 = "Oh, did you feel uncomfortable being with me?"
221020-82 = "I should have considered my position more carefully...#nCausing trouble for Sensei..."
221020-83 = "[s] \"That is not what I meant!\""
221020-87 = "[ns7] \"You are always so busy with work, right?\"\n[ns8] \"I was just worried I might have forced you to make time.\""
221020-90 = "I won't deny that I am always busy, but sitting down all the time is bad for your health."
221020-91 = "Having an 'excuse' to step outside and get some fresh air makes it much easier to refresh myself."
221020-92 = "Besides, Odyssey has a charm unique to a maritime academy.#nJust looking around is fun, you know?"
221020-93 = "[s] \"Have you been to Odyssey before?\""
221020-94 = "No, this is my first time coming to Odyssey..."
221020-106 = "...is what it would be the second time."
221020-108 = "[ns] (What is this... strange feeling, like I have been here before...)"
221020-112 = "Sensei. Please look over there."
221020-113 = "It looks like the flagship of the Odyssey Student Council Island,#nthe Olympus, is about to dock."
221020-114 = "Shore workers are standing by on the quay for the mooring operation."
221020-116 = "Prepare for docking! Seal all internal compartments!"
221020-118 = "Shore crew placement confirmed!"
221020-119 = "Gangway position, dress right dress!"
221020-121 = "Forward breast line! Heave and hold! If you let go now, it will snap!"
221020-126 = "[ns] \"There is a lot of tension here.\""
221020-127 = "Isn't that the optimized way to do it?"
221020-128 = "Moving a giant ship requires movements without a single inch of error."
221020-129 = "After all, the tension on the mooring lines holding the ship can reach dozens of tons.#nIf one snaps, it could lead to a major accident."
221020-130 = "[s] \"Right, of course...\""
221020-131 = "...I understand your concerns, Sensei.#nWith that many people, there might be students who cannot adjust to the atmosphere..."
221020-132 = "However, that is the academy's domain.#nEven the General Student Council President cannot easily intervene."
221020-137 = "Though Schale's Sensei might be able to."
221020-141 = "The Olympus has docked!"
221020-142 = "Operation complete. Shore crew, stand down."
221020-143 = "Standing down! Good work everyone!"
221020-148 = "P-Pleased to meet you, General Student Council President!#nI am Sumika Komori of Trident, assigned to guard the President today!"
221020-149 = "It is a tremendous burden--#nI mean, an honor for you to visit our school today!"
221020-150 = "Please leave your personal security to us at Trident until the moment you disembark!"
221020-151 = "Thank you, Ms. Komori."
221020-152 = "Is it alright if Sensei [USERNAME] joins us as well?"
221020-153 = "Ah, oh, that is... Schale's Sensei [USERNAME]!"
221020-157 = "...Sensei [USERNAME]!?"
221020-158 = "[ns9] \"We meet again.\"\n[ns10] \"We met back when you were with the Problem Solver 68? Wait, Pandemonium Society?\""
221020-161 = "Ah, au, ahhh...!"
221020-162 = "Wh-Why is Sensei at Odyssey...?"
221020-163 = "C-Could it be... about the time we mistook the ship Sensei was on for a pirate ship and attacked it...?#nAre you here to protest in person--"
221020-164 = "[s] \"It is fine about what happened back then...\""
221020-165 = "Yes, I am aware of that!#nI am aware, but..."
221020-170 = "...Are you rrr-really not here about that incident?"
221020-171 = "[s] \"Really, truly not.\""
221020-177 = "Th-Then I am glad..."
221020-178 = "As for that matter, I just got chewed out big time by the Vice-President for firing shells at a non-existent enemy ship and wasting ammunition."
221020-179 = "If I rack up any more demerits, it will be veeeery bad, and--"
221020-180 = "--Ah! Isn't this a great opportunity...?"
221020-181 = "As today's officer on duty, I, Sumika Komori! Will escort the two of you with all my might!#nS-So, um... It is not like I am expecting a reward or anything, but...#nBefore you leave, if you could just say 'The officer on duty today was very helpful'~... Ehehe!"
221020-182 = "Ms. Komori, is there anything we should watch out for when climbing the gangway?"
221020-183 = "Nothing in particular! Please go right ahead!"
221020-187 = "The General Student Council President and Schale's Sensei are coming aboard!"
221020-193 = "(The sight of Odyssey seen for the first time felt less like a ship and more like a giant floating city.)"
221020-194 = "(Layers of bridges soared like skyscrapers, and everything gleamed white despite having just finished a long-term voyage.)"
221020-196 = "[ns11] \"Is this... a ship?\"\n[ns12] \"It is big enough for several thousand people to live in...\""
221020-199 = "Of course it is!#nIt does not move very fast, but it is the flagship of Odyssey, which has sailed the vast oceans of Kivotos since long ago!"
221020-200 = "Actually, this is my first time riding it too, though..."
221020-208 = "...Huh?"
221020-209 = "Well, well."
221020-210 = "Is this grandiose review ceremony also part of the welcome events?"
221020-211 = "Th-That... This is my first time boarding the Olympus too, so I am not quite sure what is going on..."
221020-212 = "Everyone, step back!#nGuarding the two of them is the responsibility of us at Trident!"
221020-216 = "Captain, coming aboard."
221020-220 = "Captain, coming aboard!"
221020-222 = "[ns] \"Captain...?\""
221020-227 = "[ns] \"Those two...\""
221020-228 = "They must be the 'Captain' and 'First Officer' equivalent to the President and Vice-President roles."
221020-229 = "Fufu... They look even more competent than I imagined."
221020-233 = "Present arms to the front!"
221020-242 = "It is an honor to meet you, General Student Council President.#n...And Sensei [USERNAME]."
221020-243 = "My name is Minato Umiji,#nserving as the Captain of Island."
221020-244 = "Thank you for troubling yourself to come all the way to the ship."
221020-245 = "No, we are the ones who made an unreasonable request."
221020-246 = "I am happy to meet you, Captain Umiji."
221020-247 = "And that is--"
221020-248 = "Tomoshita Ami,#nserving as the Vice-Captain of Island."
221020-249 = "Thank you for taking time out of your busy schedule to visit us."
221020-250 = "...I see, so that is how it is."
221020-251 = "Pleased to meet you, Vice-Captain Tomoshita. Thank you for having us today."
221020-252 = "And this is--"
221020-257 = "[ns13] \"Schale's Sensei.\"\n[ns14] \"Looking forward to working with you!\""
221020-261 = "...So you are."
221020-262 = "I have heard the rumors.#nThe extra-judicial organization directly under the General Student Council--the Adult of Schale."
221020-267 = "Pleased to meet you, Sensei [USERNAME]."
221020-268 = "We sincerely welcome you to Odyssey Marine High School."
221020-270 = "Next Episode;Ocean's Taboo"
