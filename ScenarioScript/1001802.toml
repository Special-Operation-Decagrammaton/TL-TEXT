[translation]
1001802-1 = "Убежище в шкафу"
1001802-5 = "Клубная комната Отдела разработки игр"
1001802-7 = "Я слышал, что Отдел разработки игр готовится выпустить новую игру, но когда пришёл в клубную комнату, там никого не было."
1001802-8 = "Я решил терпеливо подождать возвращения участников."
1001802-9 = "[s] Открыть дверцу металлического шкафа, чтобы повесить верхнюю одежду."
1001802-10 = ""
1001802-13 = "А?!"
1001802-14 = "В-вы меня напугали, Сенсей! Пожалуйста, стучите, прежде чем открывать шкаф!"
1001802-15 = "...Ох, даже для меня это звучит странно."
1001802-16 = "Н-но важнее другое: почему вы здесь? В-вам что-то от меня нужно?"
1001802-17 = "О. Вы пришли посмотреть новую игру Отдела разработки игр?"
1001802-18 = "П-понятно... Но новая игра, над которой мы работаем, находится на ноутбуке Момои, так что сейчас я не могу её показать."
1001802-19 = "Пожалуйста, дождитесь возвращения остальных."
1001802-20 = "[s] «Так почему ты вообще сидишь в шкафу, Юзу?»"
1001802-21 = "Потому что..."
1001802-22 = "Здесь меня никто не замечает."
1001802-23 = "Когда я просто сижу в клубной комнате как обычно, люди постоянно подходят и разговаривают со мной."
1001802-24 = "Особенно Юука из Семинар — она всегда злится, смотрит страшно и говорит, чтобы я ходила на собрания президентов клубов... Когда Юука так ко мне подходит, мне хочется сбежать."
1001802-25 = "Но когда я здесь, меня никто не может найти."
1001802-26 = "По крайней мере пока этот шкаф — моё маленькое убежище. Хи-хи..."
1001802-27 = "[s] «Разве в шкафу не тесно?»"
1001802-28 = "Нет, вообще-то здесь довольно удобно. Он мне почти идеально подходит."
1001802-29 = "К тому же в такой жаркий день холодные металлические стенки приятно охлаждают."
1001802-30 = "Если прислониться к стене и слушать звуки снаружи... Ах, я могла бы оставаться здесь вечно."
1001802-31 = "[s] «Тогда можно я залезу к тебе?»"
1001802-32 = "Ч-что?!"
1001802-33 = "Н-но в шкаф помещается только один человек!"
1001802-34 = "К-конечно, официального ограничения по количеству людей внутри шкафа нет, но... разве для двоих он не слишком маленький?"
1001802-35 = "Вы думаете, из-за тесноты будет уютнее?"
1001802-36 = "Эм, раз вы так говорите. Может, и правда нормально..."
1001802-37 = ""
1001802-38 = ""
1001802-40 = "П-подождите, Сенсей! Не проталкивайтесь сюда силой!"
1001802-41 = "Эм, вы слишком близко. Э-э..."
1001802-42 = "Так не получится!"
1001802-46 = "Это невозможно! Два человека в один шкаф не помещаются!"
1001802-47 = "Что? Хотите, чтобы я вышла, а вы остались в шкафу один?"
1001802-48 = "Нет! Это моё убежище!"
1001802-50 = "После этого мы с Юзу спорили из-за шкафа, пока остальные не вернулись..."
