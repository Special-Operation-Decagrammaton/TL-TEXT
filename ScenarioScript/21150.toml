[translation]
21150-1 = "Эпизод 15;Распространяющаяся угроза"
21150-2 = "Главная диспетчерская Милленниума"
21150-3 = "Активировать всех конфискованных роботов!"
21150-4 = "Вообще-то я хотела переделать их в уборочные машины..."
21150-5 = "...но сейчас у нас есть куда более серьёзный беспорядок!"
21150-6 = "Передаю управление ими Акане и Клубу Горничных!"
21150-7 = "Принято. Использую этих роботов, чтобы вымести Департамент Разработки Игр."
21150-9 = "Главный коридор Милленниума"
21150-10 = "Аргх!"
21150-11 = "Чёрт, она такая сильная."
21150-12 = "Так вот на что способны агенты C&C..."
21150-15 = "Хе-хе."
21150-16 = ""
21150-18 = "(Хм. По отдельности они не так уж сильны, но кое в чём надо отдать им должное.)"
21150-19 = "(Их командной работе. Они двигаются синхронно, словно один человек в двух телах. На такое способны даже не все ветераны.)"
21150-20 = ""
21150-21 = "Так вот в чём преимущество близнецов? Восхитительно."
21150-23 = "*тяжело дышит* Не ожидала встретить здесь Асуну."
21150-24 = "Сис, я больше не могу. Давай пока отступим!"
21150-25 = "Похоже, выбора нет."
21150-26 = ""
21150-28 = "Сбежать решили? Не выйдет!"
21150-29 = "*бах*"
21150-30 = "Ик!"
21150-31 = "Э-Эти снаряды огромные! Н-Неужели...?"
21150-32 = "Карин? Не может быть. Н-Неужели она победила Утаху...?"
21150-34 = "Крыша 3-го института Милленниума"
21150-35 = "..."
21150-36 = "...Почему я лежу на спине? И чья задница прямо у меня над головой?"
21150-37 = "Моя."
21150-38 = "После такого удара ты очнулась гораздо быстрее, чем я ожидала."
21150-39 = "Прости, но шансов у тебя с самого начала не было."
21150-40 = "Понятно... Ты попала в меня сквозь дым от выстрела, а теперь намеренно держишься вплотную."
21150-41 = "Именно. Девушка с миномётом дважды подумает, прежде чем выпустить ещё один снаряд. Похоже, ты ей весьма дорога."
21150-42 = "Хех. Мои расчёты этого точно не учитывали. Как тебе вообще удалось попасть по мне сквозь весь этот дым?"
21150-43 = "Снайперы C&C полагаются не только на зрение."
21150-44 = "В любом случае держись рядом. Не думаю, что моё сердце или твоё тело выдержат ещё больше."
21150-45 = "..."
21150-46 = "Сделаешь одолжение? Честно говоря, я предпочту получить миномётным снарядом, так что убери уже свою задницу от моего лица."
21150-47 = "Тогда просто не смотри на неё!"
21150-49 = "Главный коридор Милленниума"
21150-50 = "Сообщение от Харе! Карин снова в строю, а Утаху схватили!"
21150-51 = "Мы и сами видим!"
21150-52 = "У Маки тоже новости! Акане пробила ставни и сбежала!"
21150-53 = "И ещё сюда направляется группа огромных роботов!"
21150-54 = "*ахает*"
21150-55 = ""
21150-57 = "Не уверена, но почему-то мне кажется, что мы побеждаем. И не только это..."
21150-58 = "...чувствую, у вас, девочки, неприятности."
21150-60 = "Уф!"
21150-61 = "Мы проиграли?"
21150-62 = "...Нет."
21150-63 = "Пока нет."
21150-65 = "Милленниум — Веритас"
21150-66 = "(Пятнадцатью минутами ранее...)"
21150-67 = "Гах. Каждый раз, когда мы доходим до этого этапа прогона, план разваливается."
21150-68 = "Привлечь внимание всех достаточно просто."
21150-69 = "Запереть Акане и Асуну. Изолировать Карин. Разобраться с охранными роботами студсовета. А после всего этого самое простое — попасть на склад."
21150-70 = "Но если хоть один этап сорвётся..."
21150-71 = "...это будет гейм овер. В Милленниуме нет никого, кто мог бы в лоб тягаться с настолько подготовленным оппонентом, как Клуб Горничных."
21150-72 = "Даже если использовать имя Химари, чтобы посеять путаницу, далеко мы не уедем. Немного времени выиграем, но в итоге нас всё равно загонят в угол."
21150-73 = "Итак, ко второй минуте запираем Акане и Асуну. К пятой изолируем Карин. На одиннадцатой уничтожаем автоматонов... На тринадцатой забираем Зеркало..."
21150-74 = "А к двадцатой минуте нас всех арестуют."
21150-75 = "..."
21150-76 = "...А что, если не ВСЕХ?"
21150-77 = "Что ты имеешь в виду?"
21150-78 = "Чтобы победить, кто-то из нас должен проиграть."
21150-79 = "А потом..."
21150-80 = "М-Мидори, о чём ты?"
21150-81 = "Я предлагаю превратить баг, из-за которого план проваливается... в фичу."
21150-83 = "Комната самоанализа студсовета Милленниума"
21150-84 = ""
21150-86 = "О."
21150-87 = "Света нет. А значит..."
21150-89 = "*клац*"
21150-90 = "ЭМИ сработал и Харе взломала настройки системы. Значит, двери и ставни в здании студсовета должны быть открыты."
21150-91 = "Ладно."
21150-92 = "Время побега."
21150-93 = "А следующая метка задания находится..."
21150-94 = "...на складе контрабанды студсовета."
21150-95 = ""
21150-96 = ""
21150-97 = ""
21150-100 = "Главный коридор Милленниума"
21150-101 = "Как бы они ни были настороже, об Алисе сейчас точно никто не думает."
21150-102 = "Даже если нас поймают — и если предположить, что мы получим испытательный срок — мы всё равно сможем использовать Г.БИБЛИЮ, чтобы тайно создать Tales Saga Chronicle 2 в клубной комнате."
21150-103 = "Не слышу, о чём вы шепчетесь, но это неважно."
21150-104 = "Вы уже не выглядите такими отчаявшимися, как раньше. Ещё не собираетесь сдаваться?"
21150-105 = "Лучше бы вам сдаться сейчас."
21150-106 = "Угх. Юука."
21150-107 = "Должна признать, до этого момента вам удавалось нас дурачить."
21150-108 = "Но в этот раз вы зашли слишком далеко."
21150-109 = "До сих пор не верится, что у вас хватило наглости атаковать студсовет с помощью террористов."
21150-110 = "И ведь я дала вам льготный период, чтобы вы попытались спасти клуб. Видимо, я была слишком мягкой."
21150-111 = "Даже не надейтесь избежать наказания. Готовьтесь к заключению или отстранению минимум на неделю."
21150-113 = "П-Погоди. Что?!"
21150-114 = "Н-Но через неделю Премия Милленниума уже закончится!"
21150-115 = "Вам повезло, что ваша подруга Алиска уже под стражей. Мне было неловко держать её взаперти одну, так что, уверена, она будет рада компании."
21150-116 = "Угх..."
21150-117 = "С-Сис!"
21150-118 = "Я думала, даже если нас поймают, всё ещё можно будет выкрутиться, но..."
21150-119 = "Но если нас поймают... всё кончено! Даже с Зеркалом Алиса и Юзу не смогут сделать игру вдвоём."
21150-120 = "Значит, выбора нет. Мы обязаны прорваться, во что бы то ни стало!"
21150-122 = "О? Хотите пройти сквозь нас?"
21150-123 = "*задыхается* ...Фух, еле успела. Почему я так запыхалась...? Ух, неужели это из-за веса...? Н-Нет! Н-Не может быть!"
21150-125 = "А?!"
21150-126 = "Э-Это Акане и боевые роботы!"
21150-127 = ""
21150-128 = "Ха. Вот и конец пути."
21150-129 = "Рада познакомиться, Момои, Мидори."
21150-130 = "Вы должны понимать: несмотря на наши сомнения, у Маки и Котори всё ещё есть шанс получить прощение."
21150-131 = "Но зашедшим так далеко прощенья нет."
21150-132 = "А ещё..."
21150-133 = "Вам, Сенсей, стоит ждать сурового письма в Шале."
21150-134 = ""
21150-136 = "Угх..."
21150-137 = "Неужели... вот так всё и закончится...?"
21150-138 = "Сестрёнка!"
21150-139 = "Простите, Сенсей. Вы так старались ради нас, а мы всё испортили! Даже всех наших сил оказалось недостаточно!"
21150-140 = "[s1] «Не сдавайся.»\n[s2] «Не извиняйся. Для меня это была честь.»"
21150-141 = "Спасибо, Сенсей, но... уже слишком поздно."
21150-142 = "Сильнейшие силы Милленниума — C&C и Студсовет — зажали нас с двух сторон."
21150-143 = "Как нам вообще надеяться на что-то в такой ситуации?!"
21150-144 = "Сенсей..."
21150-145 = "Спасибо..."
21150-146 = "...но теперь всё действительно кончено."
21150-148 = "Цель подтверждена."
21150-149 = "*вр-р-р-р*"
21150-150 = "Заряд маны... 100%."
21150-151 = "В-Вы это слышите?"
21150-152 = "Сестрёнка! Ложись!"
21150-154 = "Хм?"
21150-155 = "А?"
21150-156 = "...?"
21150-159 = "Слепящий Свет!"
21150-160 = "*БА-А-АХ*"
21150-161 = "Аргх!"
21150-162 = "Агх!"
21150-163 = "А-Асуна?! Ты в порядке?!"
21150-164 = "Конечно нет! Ого! Ч-Что это было?! Ахаха! В меня попали! И больно до чёртиков. Я вообще ни одной мышцей пошевелить не могу!"
21150-165 = "Уверена, с тобой всё будет нормально."
21150-166 = "Ух. Не только Асуна — половина роботов тоже выведена из строя! Не верится!"
21150-167 = "И всё одной атакой...?"
21150-168 = "Карин! Докладывай! Что это был за лазерный луч...?"
21150-169 = "...Карин? Карин?! Она уже давно не оказывает огневую поддержку!"
21150-170 = "*бум*"
21150-171 = "Свет? Он идёт с крыши!"
21150-173 = "Крыша 3-го института Милленниума"
21150-174 = "А-а-а! Мои глаза! Миномёт ещё и светошумовые гранаты запускает?!"
21150-175 = "Разумеется. Моя милая протеже ни за что не станет рисковать и взрывать дорогую ей Утаху."
21150-176 = "Она умная девочка."
21150-177 = "Чёрт! Я ничего не вижу, не говоря уже о том, чтобы поддержать Акане. Почему вы так из кожи вон лезете ради этого?!"
21150-178 = "Почему? Чтобы защитить тот клуб, конечно."
21150-179 = "Я не сплетница, но даже до меня дошли слухи."
21150-180 = "Я мало знаю об Инженерном Департаменте, но Департамент Разработки Игр — жалкое подобие клуба."
21150-181 = "Просто кучка эгоистичных соплячек. С какой стати так стараться именно ради них?"
21150-182 = "Они не эгоистичные."
21150-183 = "Эти дети изо всех сил сражаются против невозможных обстоятельств — и всё ради друг друга."
21150-184 = "Им ведь даже клуб не нужен, чтобы вместе делать игры!"
21150-185 = "Ты не ошибаешься."
21150-186 = "Но понимаешь, просто работать вместе как друзья — это замечательно..."
21150-187 = "...но иметь место, куда можно вернуться, и людей, которые будут там вместе с тобой, — это нечто особенное."
21150-188 = "Вот за что они сражаются."
21150-189 = "За место, где все они могут быть вместе."
21150-190 = "Но всё равно!"
21150-192 = "*ш-ш-ш*"
21150-193 = ""
21150-194 = "*бабах*"
21150-195 = "Опять?!"
21150-196 = "Ха-ха."
21150-197 = ""
21150-199 = "Этого не было в моих расчётах, но это было чертовски смешно."
21150-201 = "Главный коридор Милленниума"
21150-202 = "Момои! Мидори!"
21150-203 = "Сейчас!"
21150-204 = "Алиса?!"
21150-205 = "Что ты здесь делаешь?!"
21150-206 = "По пути на склад контрабанды я много думала."
21150-207 = "Final Fantasia, Dragon Crest, Tails of Destiny, Chrono Digger, The Fable of Heroes, Pyre Emblem и... Tales Saga Chronicle."
21150-208 = "Какую игру ни возьми..."
21150-209 = "Герои никогда, никогда не бросают своих друзей."
21150-210 = "И я тоже не брошу."
21150-212 = "Мы преодолеем эти испытания — вместе!"
21150-214 = "Алис..."
21150-215 = "Если бы нас поймали, всё равно всё было бы кончено."
21150-216 = "Ладно, Департамент Разработки Игр, выдвигаемся!"
21150-217 = "Да!"
21150-219 = "Ах! Нельзя дать им сбежать!"
21150-220 = "Ахаха! Мне так больно, но так весело! Вот это жизнь!"
21150-221 = "...Ты точно страдаешь от боли? Важнее другое: Карин перестала стрелять. Думаешь, что-то случилось?"
21150-222 = "М-Момои и Мидори уходят!"
21150-223 = "Никуда они не уйдут."
21150-224 = "Асуна, отойди."
21150-226 = "Вступаю в бой!"
