[translation]
21150-1 = "Episódio 15;Uma Crise à Espreita"
21150-2 = "Millennium - Sala de Operações"
21150-3 = "Tragam todos os robôs apreendidos!"
21150-4 = "Na verdade, eu pretendia repintá-los e usar como robôs de limpeza da escola, mas..."
21150-5 = "Não temos escolha. Agora, a prioridade é repelir as invasoras!"
21150-6 = "Alterei a programação de todas as unidades para obedecerem às ordens do Clube de Empregadas, Akane!"
21150-7 = "Entendido. Farei bom uso dos robôs para \"limpar\" o Clube de Desenvolvimento de Jogos de uma vez por todas."
21150-9 = "Millennium - Corredor do Prédio Escolar"
21150-10 = "Uaaah!"
21150-11 = "E-Ela é absurdamente forte...!"
21150-12 = "Então essa é uma agente da C&C...!"
21150-15 = "Hmm..."
21150-18 = "(Nada mal mesmo, bem melhor do que eu esperava. Não dá pra dizer que a capacidade de combate delas seja incrível, mas...)"
21150-19 = "(Trabalho em equipe... será que dá pra chamar assim? Elas se movem como se fossem uma só. Nesse quesito, são nível veterano sem dúvida...)"
21150-21 = "Deve ser o tal poder de gêmeas, né? Gostei, gostei!"
21150-23 = "Argh, quem diria que a gente ia dar de cara logo com a Asuna-senpai aqui..."
21150-24 = "Mana, vamos recuar por enquanto!"
21150-25 = "É, não tem jeito...!"
21150-28 = "Nem pensar que eu vou deixar!"
21150-29 = "(KABUUUM!)"
21150-30 = "Kyaaah?!"
21150-31 = "Munição de grosso calibre?! Por quê?!"
21150-32 = "Isso é da Karin-senpai... então quer dizer que a Utaha-senpai...?!"
21150-34 = "Millennium - Terraço do Prédio 3"
21150-35 = "..."
21150-36 = "Por que eu estou deitada... e afinal, de quem é essa bunda enorme...?"
21150-37 = "...Desculpe por ser grande."
21150-38 = "Acertei em um ponto bem forte... Você acordou mais rápido do que eu esperava."
21150-39 = "...Foi mal, não tive margem para pegar leve."
21150-40 = "Quem diria que você conseguiria me acertar com precisão mesmo no meio dos disparos da Hibiki. E o motivo de você estar tão colada em mim assim é..."
21150-41 = "Isso mesmo. Nessa posição, ela se importa demais com a senpai para arriscar atirar."
21150-42 = "Ah, isso saiu dos meus cálculos. Como você conseguiu mirar em mim com tanta precisão no meio de toda aquela fumaça de pólvora?"
21150-43 = "Na C&C, não existe nenhuma atiradora de elite que dependa só da visão para localizar um alvo."
21150-44 = "Mais importante, não tente se afastar. Se fizer alguma gracinha, só vai acabar se machucando. E isso também partiria meu coração."
21150-45 = "..."
21150-46 = "Será que você poderia se afastar só um pouquinho? Desse jeito, a sua bunda está perto demais e fica meio complicado."
21150-47 = "É só você virar de costas, ué?!"
21150-49 = "Millennium - Corredor do Prédio Escolar"
21150-50 = "Mensagem da Hare-senpai! Não conseguiram segurar a Karin-senpai, e a Utaha-senpai foi capturada!"
21150-51 = "Dá pra perceber só de olhar a situação!"
21150-52 = "Ah, mensagem da Maki também! Parece que a Akane-senpai explodiu a porta metálica e escapou!"
21150-53 = "E ao mesmo tempo, um monte de robôs está vindo para cá...!"
21150-54 = "Quêêê?!"
21150-57 = "Ahaha! Não sei direito o que tá rolando, mas parece que a vantagem é nossa, né?"
21150-58 = "Será que o plano de vocês já está por um fio?"
21150-60 = "Uugh...!"
21150-61 = "Fracassou..."
21150-62 = "...Não,"
21150-63 = "Ainda não fracassou...!"
21150-65 = "Millennium - Veritas"
21150-66 = "(15 minutos antes do início da operação)"
21150-67 = "Uugh, não importa como eu pense, sempre travamos aqui..."
21150-68 = "Destruir a porta e chamar a atenção de todo mundo com certeza vai dar certo."
21150-69 = "Depois, neutralizamos a Akane-senpai e a Asuna-senpai, barramos a Karin-senpai e enfrentamos os robôs de segurança do conselho estudantil. Se passarmos daí, invadir o depósito de apreensões não vai ser difícil, mas..."
21150-70 = "Se uma única dessas etapas falhar..."
21150-71 = "Aí o plano inteiro vai por água abaixo. Enfrentar o Clube de Empregadas em alerta máximo é impossível para qualquer grupo de Millennium."
21150-72 = "Mesmo usando o nome da Himari-senpai para causar confusão, só ganharíamos um pouco de tempo e acabaríamos cercadas do mesmo jeito."
21150-73 = "Em até 2 minutos após a invasão, neutralizamos a Akane-senpai e, se estiver junto, a Asuna-senpai também. Aos 5 minutos, barramos a Karin-senpai; aos 11, passamos pelos robôs; aos 13, pegamos o \"Espelho\"; e depois..."
21150-74 = "...Por mais que a gente se esforce, depois de 20 minutos todo mundo vai acabar preso."
21150-75 = "..."
21150-76 = "...E se não for todo mundo?"
21150-77 = "Hã?"
21150-78 = "Mesmo que algumas de nós percam, um jeito de vencer no final..."
21150-79 = "Se, naquele momento..."
21150-80 = "M-Midori, do que você está falando?"
21150-81 = "...A gente precisa planejar também o que fazer caso as coisas não saiam conforme o plano."
21150-83 = "Millennium - Sala de Detenção do Conselho Estudantil"
21150-86 = "...Ah."
21150-87 = "Corte de energia. Se esse evento foi ativado, quer dizer que..."
21150-89 = "(Clac)"
21150-90 = "EMP ativado... Alteração de configurações usando o hack da Hare-senpai...#nO mesmo método usado na porta metálica, para abrir livremente as portas eletrônicas da torre..."
21150-91 = "Entendido."
21150-92 = "Aris iniciará a fuga."
21150-93 = "A próxima missão da Aris é..."
21150-94 = "...Primeiro, ir até o depósito de apreensões do conselho estudantil."
21150-100 = "Millennium - Corredor do Prédio Escolar"
21150-101 = "Quanto mais chamarmos atenção, menos vigilância vão manter sobre a Aris, já que acham que ela está trancada..."
21150-102 = "Além disso, mesmo se formos pegas agora... se for só uma suspensão leve, ainda dá pra fazer \"Tales Saga Chronicle 2\" escondidas na sala do clube olhando a G.Bible."
21150-103 = "Hmm, o que será que estão cochichando?"
21150-104 = "Parece que vocês estão ficando menos desesperadas aos poucos... Não me digam que já desistiram?"
21150-105 = "Nessa situação, desistir seria mesmo a escolha mais sensata."
21150-106 = "Ugh, Yuuka!"
21150-107 = "Quanto tempo. Por ora, vou elogiar vocês por terem causado tamanha confusão. Confesso que fiquei realmente surpresa."
21150-108 = "Mas uma coisa é uma coisa, outra coisa é outra coisa..."
21150-109 = "Usar todo tipo de artimanha só para invadir o conselho estudantil já passou de todos os limites."
21150-110 = "Talvez eu tenha sido boazinha demais dando aquele prazo para vocês."
21150-111 = "Desta vez não vai passar como uma simples travessura. Preparem-se para uma suspensão imediata de uma semana ou até detenção."
21150-113 = "Suspensão?! Detenção?!"
21150-114 = "Não pode ser, se for uma semana... o Prêmio Millennium vai acabar!"
21150-115 = "A Aris-chan também está na sala de detenção agora. Dava pena deixá-la sozinha, então tenho certeza de que ela vai ficar feliz quando vocês chegarem."
21150-116 = "Uugh...!"
21150-117 = "M-Mana..."
21150-118 = "A gente achou que não teria problema se fosse pega, mas..."
21150-119 = "Desse jeito... mesmo que consigam pegar o \"Espelho\", só a Aris e a Yuzu não vão dar conta de fazer o jogo..."
21150-120 = "A gente tem que dar um jeito de abrir caminho!"
21150-122 = "Abrir caminho? Ora, passando por nós?"
21150-123 = "Ufa, finalmente cheguei... Ficar sem fôlego assim... será que eu ganhei peso mesmo...? Não, impossível..."
21150-125 = "Ueeeh?!"
21150-126 = "A-Akane-senpai, e até robôs de combate!"
21150-128 = "Hehe, desta vez parece que são as \"originais\" mesmo."
21150-129 = "Prazer em conhecê-las novamente, Momoi-chan e Midori-chan."
21150-130 = "Quanto à Maki-chan e à Kotori-chan, talvez ainda dê para relevar por um triz, mas..."
21150-131 = "Depois de invadirem tão fundo assim, vocês não têm mais nenhuma desculpa."
21150-132 = "E além disso..."
21150-133 = "Sensei, saiba que enviaremos pelo menos uma carta formal de protesto à Schale. Esteja ciente disso."
21150-136 = "Uugh..."
21150-137 = "É o fim mesmo...? Não quero...!"
21150-138 = "Mana...!"
21150-139 = "Desculpa, desculpa mesmo, Sensei... Você ajudou tanto a gente, e por falta de capacidade nossa... por nossa culpa...!!"
21150-140 = "[s1] \"Não desistam.\"\n[s2] \"Desculpem. Se eu tivesse mais poder...\""
21150-141 = "Eu queria, mas... não dá mais."
21150-142 = "Na frente a C&C, atrás o conselho estudantil de Millennium... as duas forças mais poderosas de toda a escola."
21150-143 = "Numa situação dessas, o que é que a gente pode fazer...?!"
21150-144 = "Sensei..."
21150-145 = "Não é culpa sua, Sensei. Fui eu, fomos nós que..."
21150-146 = "Mas, nessa situação, já não dá mais..."
21150-148 = "Alvos confirmados."
21150-149 = "(Zuuuuum...)"
21150-150 = "Carga de mana, 100%..."
21150-151 = "E-Esse som..."
21150-152 = "Mana, abaixa!"
21150-154 = "?"
21150-155 = "Hm?"
21150-156 = "...?"
21150-159 = "Ó luz!!"
21150-160 = "(KABUUUUM!)"
21150-161 = "Argh!!"
21150-162 = "Kyaaah!"
21150-163 = "A-Asuna-senpai?! Você está bem?!"
21150-164 = "Não tô nada bem! Ahaha, levei em cheio! Que troço é esse, dói demais! Não quero mexer nem um milímetro da cabeça aos pés agora!"
21150-165 = "...Parece que está bem, sim."
21150-166 = "Não pode ser, incapacitou a Asuna-senpai e quase metade dos robôs de uma só vez...?!"
21150-167 = "T-Todo esse poder de fogo em um único disparo...!"
21150-168 = "Karin, reporte a situação! De onde veio esse canhão de feixe...?!"
21150-169 = "Karin, Karin?! Pensando bem, o fogo de cobertura da Karin parou... desde quando?!"
21150-170 = "(Fuuush—!)"
21150-171 = "Aquela luz... veio do terraço?!"
21150-173 = "Millennium - Terraço do Prédio 3"
21150-174 = "Argh, meus olhos...! Uma granada de luz?!"
21150-175 = "A minha kouhai é mesmo gentil demais para jogar uma explosão em cima da senpai querida dela... nisso você acertou."
21150-176 = "E, além disso, ela é incrivelmente inteligente. O suficiente para prever essa situação e fazer a escolha exata."
21150-177 = "Tsc, assim não consigo dar suporte à Akane... Por que vocês vão tão longe...?!"
21150-178 = "Por quê...? Ora, porque queremos proteger o clube, não é óbvio?"
21150-179 = "...Mesmo eu, que não presto atenção em boatos, já ouvi falar."
21150-180 = "Não conheço bem o Clube de Engenharia, mas aquele Clube de Desenvolvimento de Jogos mal pode ser chamado de clube de verdade."
21150-181 = "Por que ajudar um bando de encrenqueiras egoístas como elas?"
21150-182 = "...Porque elas não são apenas egoístas, eu acho."
21150-183 = "Aquelas meninas estão dando tudo de si por causa de uma amiga."
21150-184 = "Não precisam de um clube para fazer jogos."
21150-185 = "...Nisso você tem razão."
21150-186 = "Porém, sabe... Claro que ser apenas \"amigas\" já tem seu valor, mas ainda assim..."
21150-187 = "Serem companheiras do mesmo clube cria um laço ainda mais forte entre elas."
21150-188 = "É porque elas têm essa vontade de fazer isso juntas naquele clube que..."
21150-189 = "Estão se esforçando tanto assim."
21150-190 = "Tsc, mas...!"
21150-192 = "(Fiuuu...)"
21150-194 = "(KABUUUUUM!)"
21150-195 = "Droga?!"
21150-196 = "...Hehe."
21150-199 = "Não foi exatamente conforme os cálculos, mas... as coisas estão ficando interessantes."
21150-201 = "Millennium - Corredor do Prédio Escolar"
21150-202 = "Momoi, Midori!"
21150-203 = "Agora!"
21150-204 = "Aris-chan?!"
21150-205 = "O que você está fazendo aqui?!"
21150-206 = "A caminho do depósito de apreensões do conselho estudantil, eu fiquei pensando."
21150-207 = "\"Final Fantasia\", \"Dragon Test\", \"Talls of Fate\", \"Tradição dos Cavaleiros Dragão\", \"Mito dos Heróis\", \"Eyes Eternal\"... e \"Tales Saga Chronicle\"..."
21150-208 = "Em absolutamente todos os jogos, os protagonistas..."
21150-209 = "Nunca desistiram de seus companheiros."
21150-210 = "Por isso, a Aris também fará o mesmo."
21150-212 = "As provações devem ser superadas juntos!"
21150-214 = "Aris-chan..."
21150-215 = "...É, se formos pegas agora acaba tudo mesmo."
21150-216 = "Vamos lá, Clube de Desenvolvimento de Jogos!"
21150-217 = "Sim!"
21150-219 = "Argh, isso é péssimo...!"
21150-220 = "Ahaha, agora ficou divertido! Só que meu corpo ainda tá todo tremendo e nem consigo ficar de pé direito!"
21150-221 = "Asuna-senpai, você está mesmo sentindo dor...? Mais importante, se os disparos da Karin pararam, então lá também..."
21150-222 = "Tsc, elas vão fugir!"
21150-223 = "Não, eu não vou permitir...!"
21150-224 = "Asuna-senpai, recue o máximo que puder, por favor."
21150-226 = "Akane, iniciando combate!"
