[translation]
84302100200-5 = "Прежде чем начнёшь, я вкратце объясню план."
84302100200-6 = "Когда попадёшь в Центр данных, тебе понадобится инструмент для взлома. Я оставила USB-накопитель на столе. Возьми его."
84302100200-7 = "Хм? USB?"
84302100200-8 = "Я сама его сделала. Он позволит мне в определённой степени удалённо управлять другими компьютерами."
84302100200-9 = "Подключи его к компьютеру управления данными. Остальное я сделаю сама."
84302100200-10 = "Хорошо. Не хочу возиться с компьютерами, ПОКА слушаю тебя."
84302100200-11 = ""
84302100200-13 = ""
84302100200-14 = "...Не то чтобы я НЕ СМОГЛА, если бы пришлось."
84302100200-15 = "Понимаю. Это просто ради эффективности."
84302100200-16 = "Кстати, судя по запланированному маршруту, добраться до цели за один заход, скорее всего, не получится. Примерно на середине пути придётся открыть дверь в закрытую комнату."
84302100200-17 = "Вон тот ключ безопасности поможет тебе пройти. Если что-то пойдёт не так, свяжись со мной."
84302100200-19 = "Столько времени прошло, а она всё такая же дотошная."
84302100200-20 = "Прямо как в старые добрые времена..."
84302100200-21 = "Тогда были только ты и Итиносэ Асуна. В ней было... слишком много переменных, чтобы считать её надёжным оперативником."
84302100200-22 = "Поэтому, естественно, все наши планы приходилось строить вокруг тебя, Нэру."
84302100200-23 = "Конечно. Я не говорю, что сейчас плохо. У нынешних времён тоже есть свои плюсы и минусы."
84302100200-24 = "Ладно, я экипируюсь и пойду. Ты просто продолжай отдавать приказы."
84302100200-25 = "Хорошо. Я оставила ключ безопасности на коробке, так что не забудь его."
