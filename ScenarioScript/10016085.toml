[translation]
10016085-2 = "После кавалерийской битвы останется только ещё одно крупное соревнование — школьная эстафета, верно?"
10016085-3 = "Ага, это последний шанс набрать много очков и забрать кубок!"
10016085-4 = "Не могу поверить, что у Миллениума реально есть шанс выиграть Фестиваль Хало! Мы всегда были последними... Этот спортивный фестиваль полон сюрпризов."
10016085-5 = "По слухам, тот преподаватель из Шале изменил программу так, чтобы даже студенты, не очень сильные в спорте, могли наслаждаться соревнованиями... Может, в этом всё дело?"
10016085-6 = "Ну, скорее всего кавалерийскую битву выиграет Геенна или Тринити, но они уже вымотались на предварительных этапах."
10016085-7 = "По крайней мере, Объединённую академию Хяккияко мы точно победим! Они лёгкая добыча."
10016085-8 = "Отлично! Победим их и закрепим победу Миллениума!"
10016085-9 = "...А? Ч-что это вообще такое?"
10016085-11 = ""
10016085-12 = ""
10016085-15 = ""
10016085-19 = "Та-дам! Подготовка завершена!"
10016085-20 = "С помощью Хасуми мы завершили ниндзюцу... то есть технику укрепления замка!"
10016085-21 = "Вы... вы правда думаете, что это сработает?"
10016085-22 = "Выглядит как-то... неустойчиво... Мы можем опрокинуться, даже если на нас просто подуют...!"
10016085-23 = "*трясётся*"
10016085-24 = "Не волнуйтесь. Левая и правая участницы не должны защищать наездницу."
10016085-25 = "Каэдэ и Изуна. Вам нужно лишь следить за флангами и тылом и сообщать Чисэ, где находится противник."
10016085-26 = "Операция по наблюдению за врагом! Поняла!"
10016085-27 = "Это куда проще, чем высматривать жука-геркулеса невооружённым глазом. Мы справимся!"
10016085-28 = "Вон там какая-то забавная «лошадь»..."
10016085-29 = "Кажется, они упадут даже без нашей помощи."
10016085-30 = "Может, сначала атакуем их?"
10016085-31 = "Ага! Сначала слабых!"
10016085-34 = ""
10016085-35 = "Чисэ! Вражеская наездница приближается с северо-востока!"
10016085-36 = "А-а-а! О-они уже идут за нами?!"
10016085-37 = ""
10016085-39 = ""
10016085-41 = ""
10016085-42 = "Погодите, они огромные!"
10016085-43 = "Вблизи они такие высокие! Я даже до её шапки не дотянусь!"
10016085-44 = ""
10016085-48 = "Не паникуйте! Они настолько неустойчивы, что мы можем просто врезаться в них и забрать шапку!"
10016085-49 = ""
10016085-50 = "Шапка..."
10016085-51 = "Моя."
10016085-52 = "А?! Где моя шапка?"
10016085-53 = "Они... Они меня достали!"
10016085-54 = ""
10016085-55 = "Чисэ! Это было ниндзюцу? Ты так быстро двигалась!"
10016085-56 = "Хи-хи. Чисэ — чемпионка турнира по каруте в Хяккияко."
10016085-57 = "В ловкости ей нет равных!"
10016085-59 = "Противник может считать наездницу слабым местом, но только наездница способна атаковать."
10016085-60 = "Пусть мы немного неустойчивы, зато у нашей наездницы быстрые руки."
10016085-61 = "Чисэ! Ещё один враг справа!"
10016085-62 = ""
10016085-64 = ""
10016085-65 = "Атакуй их из слепой зоны."
10016085-66 = ""
10016085-68 = ""
10016085-69 = ""
10016085-71 = "Теперь у меня две."
10016085-72 = "О-она меня достала...!"
10016085-74 = "Прямо сейчас идёт финал кавалерийской битвы между Миллениумом и Хяккияко! И соревнование приняло совершенно неожиданный оборот!"
10016085-75 = "Команда Хяккияко уже выбила двух наездниц за первую минуту, и всё благодаря Чисэ!"
10016085-76 = "Поначалу «лошади» Хяккияко выглядели забавно, но теперь выстроили мощную защиту, через которую остальные команды никак не могут пробиться."
10016085-77 = "Миллениум не может позволить себе проиграть этот матч, если хочет сохранить первое место... Кто же выйдет победителем?"
10016085-79 = "Такими темпами мы проиграем, даже не успев побороться..."
10016085-80 = "Маки! Помоги мне!"
10016085-81 = "...А? Ко мне?"
10016085-82 = "Я думала, что просто добираю количество, потому что Харэ слилась... Она вообще-то должна была быть наездницей!"
10016085-83 = "Да и физическая сила — не мой конёк."
10016085-84 = "Разве ты не самая известная хакерша Веритас или типа того?"
10016085-85 = "Неужели ты ничего не можешь сделать?!"
10016085-86 = ""
10016085-88 = ""
10016085-89 = "Ух... Чихиро меня убьёт, если узнает..."
10016085-90 = "Но раз уж я здесь, могу и помочь..."
10016085-91 = "Использую Athena-3, которую одолжила у Харэ!"
10016085-92 = ""
10016085-93 = "Мы остались единственными от Хяккияко..."
10016085-94 = "Сколько ещё врагов?"
10016085-95 = "М-мы сами выбили две команды, так что..."
10016085-96 = "Думаю... осталась только одна команда!"
10016085-97 = "Т-ты уверена?! Передо мной сейчас три команды!"
10016085-98 = ""
10016085-100 = ""
10016085-101 = ""
10016085-102 = "Хи-хи. Поздновато вы спохватились, а?"
10016085-103 = "Две команды, которые вы видите, — поддельные голограммы!"
10016085-104 = "Мы создали приманки с помощью функции голографической проекции, встроенной в Athena-3."
10016085-105 = "Ну как? Уже не кажется лёгкой прогулкой, да?"
10016085-107 = "Ч-что за?! Разве использование таких технологий — не жульничество?"
10016085-108 = "...К сожалению, правила слишком расплывчаты, чтобы считать это жульничеством."
10016085-109 = "В кавалерийской битве запрещено использовать оружие и взрывчатку, но про создание иллюзий с помощью голограмм ничего не сказано. Прямого запрета нет."
10016085-110 = "Никто не ожидал, что они применят такую технологию... Наверное, к следующему фестивалю придётся добавить правило против голограмм."
10016085-111 = "Ух! И они сделали сразу две! С Миллениумом сюрпризы никогда не заканчиваются!"
10016085-112 = "Скорее всего, они бросятся на вас. У нас нет времени выяснять, какая из них настоящая."
10016085-113 = "Изуна и Цукуё. Ваш выход!"
10016085-114 = "...А? Ч-что мне делать...?"
10016085-115 = "Ниндзюцу!"
10016085-116 = "Ниндзюцу!"
10016085-117 = "...Ниндзюцу? Это ведь что-то вроде магии? Что ж, будет интересно."
10016085-118 = "Итак, голографические технологии Миллениума против ниндзюцу Хяккияко... Посмотрим, что лучше!"
10016085-119 = "Сейчас! Вперёд!"
10016085-120 = ""
10016085-123 = "А-а-а-а!"
10016085-124 = "С-свиток ниндзя Цукуё!"
10016085-125 = ""
10016085-128 = ""
10016085-129 = "Хахаха! Я достала! Миллениум победил!"
10016085-130 = ""
10016085-132 = ""
10016085-133 = "А? Это... всего лишь кукла."
10016085-134 = "Тогда где вражеская наездница?"
10016085-135 = ""
10016085-138 = ""
10016085-139 = "Ты очень медленная."
10016085-140 = "Что? Как ты так быстро двигаешься?!"
10016085-141 = ""
10016085-143 = ""
10016085-147 = "О-она... достала меня...!"
10016085-148 = "...Теперь у меня три."
10016085-149 = "Вот это наша чемпионка! Я знала, что ты победишь, Чисэ!"
10016085-150 = "Ик! Я думала, нам конец!"
10016085-152 = "Но благодаря тебе нет, Цукуё! Ты так быстро исполнила это ниндзюцу! Потрясающе!"
10016085-153 = "Если бы ты хоть на секунду позже поменяла Чисэ и куклу местами, они бы забрали нашу шапку!"
10016085-155 = "Это было так: вжух! Я взлетела так высоко!"
10016085-156 = "Хахаха... Не думаю, что смогу повторить такое ещё раз..."
10016085-157 = "Эм... Чисэ... Можешь, пожалуйста... отпустить меня? Кажется, у меня волосы сейчас выпадут..."
10016085-159 = "Чисэ эффектным акробатическим ударом сорвала шапку с Маки!"
10016085-160 = "Все наездницы Миллениума теперь дисквалифицированы..."
10016085-161 = "А значит, команда Хяккияко победила!"
10016085-163 = "Отлично!"
10016085-164 = ""
10016085-166 = ""
10016085-167 = "Кхм. Я на мгновение слишком увлеклась."
10016085-168 = ""
10016085-170 = ""
10016085-171 = "Хасуми! Хасуми! Ты видела?"
10016085-172 = "Мы победили! И всё благодаря тебе, Хасуми!"
10016085-173 = "Да, я видела всё до последнего мгновения. Вы выступили превосходно."
10016085-174 = "Я думала... нам конец... когда президент потеряла сознание."
10016085-175 = "Вы... Вы даже позволили такой б-большой и бесполезному студенту, как я, сыграть важную роль..."
10016085-176 = "Огромное спасибо... *всхлип*"
10016085-177 = "Пожалуйста, эта победа целиком принадлежит вам. Я лишь рада, что смогла помочь."
10016085-178 = "Хи-хи! Это было так весело!"
10016085-179 = "Все работали вместе, невзирая на принадлежность, и использовали свои сильные стороны ради победы..."
10016085-180 = "Я чувствовала себя главной героиней фильма «Шиба Дог Ван Ван»!"
10016085-181 = "Надеюсь, мы ещё сможем сыграть с тобой, Хасуми!"
10016085-182 = "Но... я студент Тринити."
10016085-183 = "В следующий раз мы можем оказаться врагами..."
10016085-184 = "Ничего страшного!"
10016085-185 = "Неважно, союзники мы или враги. Пока мы можем играть с тобой, будет весело!"
10016085-186 = "Ага! Мне тоже было очень весело!"
10016085-187 = "Я... никогда не забуду этот опыт!"
10016085-188 = ""
10016085-190 = ""
10016085-191 = "Вот как..."
10016085-192 = "...Но не думайте, что я буду милосердна, если мы встретимся на поле."
10016085-193 = "Как студент Тринити, я всегда выкладываюсь на полную во всём, что делаю."
10016085-195 = "Другого я от тебя и не ожидала!"
10016085-196 = "До встречи!"
10016085-197 = "Увидимся!"
10016085-198 = ""
10016085-200 = ""
10016085-201 = ""
