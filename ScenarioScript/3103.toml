[translation]
3103-1 = "Проверка концепции 3"
3103-2 = ""
3103-4 = "Промышленная лаборатория Миллениум"
3103-9 = "Наконец-то готово..."
3103-10 = ""
3103-12 = ""
3103-13 = "Протокол пророчества, созданный по проекту президента Химари!"
3103-14 = "Мы и правда его закончили!"
3103-15 = "Хотя на завершение ушло куда больше времени, чем я думала."
3103-16 = "Поначалу создание устройства, способного обработать всю переживаемую нами реальность и на основе этих данных выдавать вероятные варианты будущего, казалось достаточно прямолинейной задачей..."
3103-17 = "Ну, без твоей помощи, думаю, мы бы не то что не закончили — даже не начали проект. Спасибо, Ноа."
3103-18 = "Всегда пожалуйста."
3103-19 = "Мне показалось, что это будет интересно..."
3103-20 = "Ой, то есть..."
3103-21 = "Как член Семинар, я, разумеется, должна участвовать в развитии потенциала Миллениум."
3103-22 = "Ноа... Иногда ты слишком уж официальная."
3103-23 = ""
3103-25 = ""
3103-27 = "В любом случае, включим?"
3103-28 = ""
3103-30 = ""
3103-32 = "Спасибо за активацию крупномасштабного устройства сбора и анализа переменных окружающей среды, также известного как Протокол пророчества."
3103-33 = "Протокол пророчества собирает, сопоставляет и обрабатывает данные, чтобы создавать прогностический анализ реальности, также известный как будущее."
3103-34 = "Пожалуйста, загляните в будущее!"
3103-35 = "Работает... Протокол пророчества президента Химари и правда работает!"
3103-36 = "Он даже предлагает нам спросить... Что спросим первым?"
3103-37 = "Согласно нашим знаниям квантовой механики, само наблюдение способно изменить будущее, так что вопрос нужно выбрать с умом."
3103-38 = "У меня уже тридцать четыре вопроса, но..."
3103-39 = "И все они про твои отношения с Сенсеем?"
3103-40 = ""
3103-42 = ""
3103-43 = "Я-Я не собираюсь спрашивать ничего настолько личного!!"
3103-44 = "Только подумай, сколько мы вложили в эту штуку... Нужно спросить что-нибудь важное для всех."
3103-45 = "...Ты ведь не отрицала, что у тебя есть вопросы про отношения с Сенсеем. Хи-хи."
3103-46 = "Послушай-ка..."
3103-47 = "В любом случае нельзя использовать машину в личных целях... Поэтому спросим что-нибудь, что принесёт нам деньги."
3103-48 = "Эй, как изменится цена редких металлов в следующем месяце?"
3103-49 = ""
3103-52 = "Запрос получен."
3103-53 = "Перед началом анализа введите дату рождения."
3103-54 = "А? Зачем машине, которая собирает все данные во вселенной, моя дата рождения?"
3103-55 = "Ну, наверное, ничего страшного. 14 марта..."
3103-56 = ""
3103-58 = ""
3103-60 = "Вычисление будущего. Пожалуйста, подождите..."
3103-61 = ""
3103-64 = "Вычисление завершено."
3103-65 = ""
3103-67 = ""
3103-71 = "Поздравляем! Вы Рыбы! Этот месяц будет для вас очень удачным!"
3103-72 = "Ваша планета-покровитель излучает хорошие вибрации, поэтому всё, что вы делаете, пойдёт по плану, даже если вы этого не ожидали. Вас ждёт много наград. Возможно. И ещё — да!"
3103-73 = "Счастливый редкий минерал этого месяца — прочный титан! Носите его с собой, и, возможно, случится что-нибудь хорошее!"
3103-74 = ""
3103-77 = "...Что."
3103-78 = "Ох..."
3103-79 = "...Ещё раз: что?"
3103-81 = "И это всё?!"
3103-84 = "Эй... Ты не видела книгу, которая лежала здесь?"
3103-85 = "Ты про ту огромную книгу по астрологии перед монитором?"
3103-86 = "Она целую неделю тут валялась. Срок возврата уже подходил, так что я отнесла её в библиотеку. А что?"
3103-87 = "...Плохо дело."
3103-88 = "О нет. Книга была важной?"
3103-89 = "Ну..."
3103-90 = "Я положила проект Протокола пророчества, моего продвинутого устройства обработки данных, в ту книгу."
3103-91 = "Это был всего лишь пробный проект, так что потерять его не страшно. Но..."
3103-92 = "Это опасное изобретение, которое позволяет заглянуть прямо в будущее! Кто знает, что случится, если оно попадёт не в те руки..."
3103-93 = "Протокол пророчества..."
3103-94 = "Ты про свой генератор гороскопов?"
3103-95 = "Это не генератор гороскопов! Протокол пророчества — технология, способная изменить мир, научно уловившая фундаментальную природу самого будущего!"
3103-96 = "Пожалуйста, не называй плод моего гения таким безвкусным именем."
3103-97 = "Верить, что людей ждёт одна судьба лишь потому, что они родились при определённом расположении звёзд..."
3103-98 = "Не очень научно с твоей стороны, правда? Тем более во Вселенной вообще нет абсолютных координат..."
3103-99 = "Не стоит свысока смотреть на астрологию, Чи."
3103-100 = "Астрология основана на данных, которые восходят ещё к древним астрологам, наблюдавшим двенадцать знаков зодиака и течение человеческих жизней на протяжении многих поколений..."
3103-101 = "Может, у неё и нет логического объяснения, но нельзя игнорировать её значение в истории человечества!"
3103-102 = ""
3103-104 = ""
3103-105 = "...К тому же так сказала моя планета-покровитель, Змееносец!"
3103-106 = ""
3103-108 = ""
3103-110 = ""
3103-111 = "Эм... Химари?"
3103-112 = "Змееносец не входит в знаки зодиака."
3103-113 = ""
3103-115 = ""
3103-116 = "...Чего-о-о?! Когда это поменяли?!"
3103-118 = "Значит, Протокол пророчества — не гиперсовременное устройство обработки данных, покорившее четвёртое измерение..."
3103-119 = "А просто генератор гороскопов?!"
3103-120 = "Нет... Нет, не может быть! Президент Химари не стала бы тратить время на настолько бесполезное изобретение..."
3103-121 = "Может, мы что-то сделали неправильно при сборке?"
3103-122 = "Не думаю... Если сравнить с чертежом..."
3103-123 = "И знаешь, если посмотреть библиотечные записи, президент Химари недавно брала целую кучу книг по астрологии..."
3103-124 = "Может, она просто ради развлечения набросала этот проект?"
3103-125 = "Ради развлечения... Мы потратили столько денег на штуку... которую сделали ради развлечения... Что я наделала..."
3103-126 = "Стой, но... Ты..."
3103-127 = "Ноа, ты уже знала, что Протокол пророчества может оказаться просто генератором гороскопов?!"
3103-128 = "Ну, я не могла знать наверняка... Всё-таки я не умею предсказывать будущее..."
3103-129 = "Почему ты ничего не сказала?!"
3103-130 = "Виноваты мы обе. В конце концов, я ничего не сказала..."
3103-131 = "...Но ты ведь и не спрашивала."
3103-132 = ""
3103-134 = ""
3103-136 = "Ноа! Ах ты...!!!"
3103-138 = "В итоге Юке пришлось оплатить создание Протокола пророчества из собственного кармана..."
3103-139 = "Но, к счастью, цены на титан резко выросли, и Юука хорошо заработала на торговле фьючерсами, так что смогла вернуть свои деньги."
3103-140 = "Проверка концепции"
