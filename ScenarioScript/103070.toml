[translation]
103070-1 = "Эпизод 7; Корабль Утнапиштима 2"
103070-4 = "Итак, эм... Есть мысли, Инженерный отдел?"
103070-5 = "Да. Я всё прекрасно понимаю."
103070-6 = "Э-Это замечательно!"
103070-7 = "Я понимаю, что мы никогда, ни в одной вселенной, не поймём устройство этого корабля."
103070-8 = "...Ч-Что?!"
103070-10 = "Я совершенно не понимаю его топливо, движители, принципы работы, конструкцию двигателя или дизайн."
103070-11 = "Н-Ну! Это артефакт, который нельзя понять с нашим нынешним уровнем технологий и инженерии! Логично, что мы его не понимаем!"
103070-12 = "*вздыхает* ...Я думала, его исследование поможет нашей давней мечте..."
103070-13 = "Не поможет ни на йоту."
103070-15 = "В-вот как...?"
103070-16 = "О, но не волнуйтесь!"
103070-17 = "Мы можем не понимать, как он работает, но можем выяснить, как им управлять!"
103070-18 = ""
103070-20 = ""
103070-21 = "Что я имею в виду? Если вы не знаете устройство автомобильного двигателя, это ведь не мешает вам водить машину, верно?"
103070-23 = "Если упростить, любую систему управления можно рассматривать как устройство, преобразующее входные данные в выходные."
103070-24 = "Если мы индуктивно поймём процесс преобразования, то сможем пользоваться функциями даже без понимания конструкции."
103070-26 = "Иными словами: нажал на газ — ускорился, нажал на тормоз — замедлился, повернул руль — изменил направление..."
103070-27 = "Если систематизировать эту информацию, можно составить руководство по пилотированию, вообще не понимая, как работает технология."
103070-28 = "Это... звучит логично!"
103070-29 = "Мы верим в вас, Инженерный отдел."
103070-30 = ""
103070-33 = ""
103070-34 = ""
103070-35 = ""
103070-38 = ""
103070-39 = "Хм..."
103070-40 = "Похоже, называть его межзвёздным боевым кораблём было немного преждевременно."
103070-41 = "Да. Оружия на нём нет, а максимальная высота полёта — около 100 000 метров... За пределами атмосферы он просто развалится, не говоря уже о космосе."
103070-42 = "И самое странное..."
103070-43 = ""
103070-45 = ""
103070-47 = "Более семидесяти пяти процентов общей массы этого корабля составляют арифметико-логические устройства."
103070-48 = "Другими словами, это не боевой корабль, а что-то вроде летающего размерно-топологического квантового компьютера... думаю."
103070-50 = "Придётся пропустить урок по происхождению корабля..."
103070-51 = "Но с его помощью можно победить Ковчег Атрахасис, верно?"
103070-52 = "Да. Хорошая новость в том, что многомерный анализ на нём возможен."
103070-53 = "И не только это. Если гениальный хакер вроде меня воспользуется вычислительным устройством такого уровня... я, вероятно, смогу взломать всё в мире. Хи-хи-хи..."
103070-54 = "Возможно, мне удастся взломать даже сам Ковчег Атрахасис..."
103070-55 = ""
103070-57 = ""
103070-58 = "Тогда мы сможем уронить Ковчег на землю или заставить его самоуничтожиться?"
103070-59 = "...Теоретически. Самоуничтожение может быть сложным, но если взломать двигательную систему, Ковчег можно уронить."
103070-60 = "Но для этого понадобится физический доступ к системам Ковчега."
103070-61 = ""
103070-63 = ""
103070-64 = ""
103070-66 = "Шахматные фигуры, которые понадобятся нам в этой битве... начинают складываться в картину."
103070-67 = "Эта битва — это..."
103070-68 = "Проще говоря, вместо пуль и оружия мы выиграем эту битву, столкнув размерно-топологический квантовый компьютер с противником, нарушающим правила многомерного анализа..."
103070-69 = "Короче говоря, битва дурного вкуса между двумя хакерами."
103070-71 = "Хм... Химари, похоже, тебе придётся вести атаку. У меня нет опыта работы с компьютерами или технологиями такого уровня."
103070-72 = "Хи-хи. А для чего ещё нужен гениальный хакер?"
103070-73 = "Тогда сначала мне нужно вывести теорию того, как работает их многомерный анализ."
103070-74 = "Звучит... сложно. Скажи, если понадобится помощь, а пока я проверю остальных."
103070-75 = ""
103070-77 = ""
103070-78 = ""
103070-79 = ""
103070-82 = "...А?"
103070-83 = ""
103070-85 = ""
103070-88 = ""
103070-90 = "AMAS...? Когда AMAS сюда пробрался?"
103070-91 = "...Это неверно."
103070-92 = "Он говорит...? Это модель с динамиками?"
103070-93 = "В вашей текущей формуле не исправляются ошибки квантовой информации. Нужно использовать ионную ловушку."
103070-94 = ""
103070-96 = ""
103070-98 = "...О! Т-Точно!"
103070-99 = "Не могу поверить, что гений вроде меня допустил такую базовую ошибку... *вздыхает*"
103070-100 = "...Ты уже несколько дней не отдыхала. Это естественно."
103070-101 = "Все здесь работают за пределами своих возможностей."
103070-102 = "Разница лишь в том, что я очень хрупкая красавица."
103070-103 = "Но что... Нет, кто ты?"
103070-104 = ""
103070-106 = "..."
103070-107 = ""
103070-109 = ""
103070-111 = "Я — ИИ вычислительной поддержки, отправленный президентом Рио."
103070-113 = "...Рио."
103070-114 = "...Неверно. Я не Рио. Я ИИ вычислительной поддержки."
103070-115 = ""
103070-117 = ""
103070-118 = "Полагаю, эта мерзкая девчонка не показалась бы здесь лично, если бы у неё совсем не осталось стыда."
103070-119 = "Насчёт Алисы..."
103070-120 = "Да, она похитила Алису. Но я хочу поговорить о том, что считаю по-настоящему отвратительным в её поступках. Ха. Придётся вам выслушать мой монолог."
103070-121 = "Токи."
103070-122 = ""
103070-124 = ""
103070-125 = "Рио дала Токи опасное оборудование и заставила выполнять свои приказы, зная о возможных последствиях использования такого оружия."
103070-126 = "И недавно я осознала, что у Токи нет друзей. Знаете почему?"
103070-127 = "Потому что Рио не позволяла ей ни с кем общаться из соображений безопасности."
103070-128 = "И Токи выполняла всё до последнего, что от неё просили, не жалуясь ни разу."
103070-129 = "Она даже согласилась похитить собственного младшего студента. Но объяснила ли Рио Токи, что на самом деле означает эта миссия?"
103070-130 = "Э-это..."
103070-132 = "Рио принудила Токи и манипулировала ею, заставляя убить человека."
103070-134 = "Алиса — не настоящий человек? Не смеши меня. Мне всё равно, как она смотрела на жизнь, то, что она сделала, непростительно."
103070-135 = "Знает ли Рио, великая всезнающая старшая сестра, что думала Токи, когда поняла, что её просят сделать? Что она чувствовала?"
103070-137 = "..."
103070-138 = "Она вообще не должна была втягивать Токи в свои бредовые схемы. Рио и её задача с вагонеткой... Она кичилась своим моральным превосходством, но рычаг пришлось дёргать Токи!"
103070-139 = "..."
103070-140 = "Какая трусиха! А когда её план развалился, знаете, что она сказала Токи?"
103070-141 = "«Делай что хочешь». И исчезла. Безответственно. Трусливо. Эгоистично."
103070-142 = "Ты вообще подумала, что будет чувствовать Токи, оставшись одна и лишившись единственного человека, с которым ей разрешали разговаривать? Знаешь, почему она не смогла вернуться в C&C? Почему Токи решила просто исчезнуть?"
103070-143 = "..."
103070-144 = "...Ха. Конечно, не знаешь. Одиночество или чувство вины других никогда не придут старшей сестре в голову. В твоих иллюзиях нет места эмпатии."
103070-146 = ""
103070-148 = "Знаешь, Токи пришла ко мне и спросила..."
103070-149 = "Она спросила, что может сделать. Чем может быть полезна. Она не знала другого способа почувствовать свою ценность, кроме как быть полезной, пусть даже совсем немного."
103070-152 = "Даже сейчас Токи сражается одна! Игнорирует раны, ищет и сражается в местах, где могут проявиться святилища. Одна!"
103070-153 = "Ты понимаешь её отчаяние? Её боль?"
103070-154 = "...Мерзкая ведьма. Ты не заслуживаешь такую преданную горничную. Подругу. А если C&C не нужна Токи — я заберу её к себе. Я её защищу."
103070-155 = "..."
103070-156 = "Вообще-то слова «мерзкая» недостаточно, чтобы описать, насколько ты отвратительна."
103070-157 = "...Ты права."
103070-158 = "Я знаю, что мне здесь не рады. И даже понимаю почему, Химари."
103070-159 = ""
103070-161 = ""
103070-162 = "Но разве вам не нужна моя помощь, чтобы управлять этим артефактом?"
103070-163 = "Я знаю о наследии Безымянных богов больше всех в Кивотос..."
103070-164 = "Нет. Ты мне не нужна."
103070-165 = "Если бы ты так хорошо знала их наследие, мир в прошлый раз не оказался бы на грани уничтожения. Из-за твоих действий."
103070-166 = "Ты ничего не сделала. Именно та, кого ты пыталась убить, остановила тебя и спасла мир."
103070-167 = ""
103070-169 = ""
103070-170 = "Так что нет. Ни одной душе в Кивотос твоя помощь не нужна."
103070-171 = "Сойди с этого корабля. У меня есть Алиса, Сенсей и Отдел разработки игр. Ты мне не нужна."
103070-172 = "...Понятно."
103070-173 = ""
103070-175 = ""
103070-176 = ""
103070-178 = ""
103070-179 = "Эм... Химари?"
103070-180 = ""
103070-182 = ""
103070-183 = "А, Ханако. Что такое?"
103070-184 = "О, беспилотный дрон. Я просто быстро тестировала голос..."
103070-185 = ""
103070-187 = ""
103070-188 = "Это была Цукацуки Рио, президент студсовета?"
103070-189 = "Я слышала, она исчезла. Похоже, с ней всё в порядке."
103070-190 = "..."
103070-191 = "Ханако, я..."
103070-192 = "Вспоминая её, я думаю об одной истории из древнего эпоса."
103070-193 = "Истории?"
103070-194 = "Да. Скорее, ироничной притче... Истории о короле, чьи отчаянные попытки избежать пророчества в итоге привели его к исполнению."
103070-195 = "Король услышал пророчество о гибели королевства и почти сошёл с ума, пытаясь избежать этой судьбы..."
103070-197 = "Но в конце концов именно его усилия стали причиной гибели королевства."
103070-199 = "Король сделал всё возможное, чтобы пророчество не исполнилось. Он изгнал пророка, разрушил храм, запечатал все врата и начал войну..."
103070-200 = "В конце его любимые братья, вся семья, вассалы, все дорогие ему люди погибли, а королевство превратилось в необитаемые руины."
103070-202 = "..."
103070-203 = "Над моралью этой притчи стоит задуматься. Неизбежна ли судьба? Имеют ли вообще значение усилия отдельного человека?"
103070-204 = "Я обсуждала это с Сэей, пророком Тринити."
103070-205 = "Что должен был сделать король, чтобы избежать судьбы? В чём он ошибся?"
103070-206 = "..."
103070-209 = "...Всё просто, Ханако."
103070-210 = "Самая большая ошибка короля — то, что он был королём."
103070-212 = "Его ошибка... была в том, что он был королём?"
103070-213 = "Быть королём, который изгоняет пророков и начинает войны, королём, верящим в пророчества. Это и была его главная ошибка."
103070-214 = "Но, Сэя... Тогда нельзя указать на конкретную ошибку короля. Он ничего не сделал неправильно."
103070-215 = "Если бы король отказался от власти... отказался от своих прав, никогда не слушал пророка, пророчество могло бы не сбыться."
103070-216 = "Хм... Это не слишком натянуто?"
103070-217 = "Да. Совершенно бессмысленно."
103070-218 = "Твой вопрос изначально неверен. У такой истории нет ответа."
103070-219 = ""
103070-221 = ""
103070-223 = ""
103070-225 = "О. Прошу прощения."
103070-226 = "Это не моё дело. Мне не следовало вмешиваться в ваши дела."
103070-227 = "Нет, я понимаю. Мы не знаем, чем всё закончится, так что давайте сделаем всё, что можем."
103070-228 = "...Осуждать её я смогу уже после того, как всё закончится."
103070-229 = "Рио... то есть, пока назовём это просто «AMAS вычислительной поддержки»."
103070-230 = ""
103070-232 = ""
103070-233 = "Можешь подойти сюда и помочь мне с расчётами?"
103070-234 = ""
103070-236 = ""
103070-237 = ""
103070-238 = "..."
103070-241 = ""
103070-244 = ""
103070-245 = "...Это похоже на второй коан."
103070-246 = "[s] «Спасибо за заботу, Ханако.»"
103070-247 = ""
103070-249 = ""
103070-250 = "О боже... Главный офицер и даже Сенсей? Э-Эм... Вы всё слышали?"
103070-251 = "Не волнуйся. Я немного знаю ситуацию. О присутствии президента Миллениум говорить не буду."
103070-252 = "Спасибо. Похоже, сейчас она в некотором роде изгой среди учеников."
103070-253 = "И для них, и для нас впереди гора проблем, которые нужно решить."
103070-254 = "Главный офицер, мне послышалось, вы упомянули коан?"
103070-255 = "О... Да."
103070-256 = "Ничего особенного. Я слышала о семи странных вопросах Кивотос от президента Генерального студсовета."
103070-257 = ""
103070-259 = ""
103070-260 = "Это было похоже на дзенский диалог, где непонятно, что именно спрашивается и существует ли вообще ответ. Президент Генерального студсовета любила такие вещи."
103070-261 = "[s] «Значит, президент Генерального студсовета интересовалась неизвестным.»"
103070-262 = "Да. Ей нравились загадочные истории, которым нет объяснения. Артефакты, оккультизм..."
103070-263 = "Например, Ящик Шиттим Сенсея. Это разновидность артефакта, который невозможно понять с нашими нынешними знаниями."
103070-264 = "[s] «Хм.»"
103070-265 = "Второй коан звучал так."
103070-266 = "«Можно ли понять посредством непостижимого?»"
103070-268 = "Я впервые слышу второй коан."
103070-269 = "«Можно ли понять посредством непостижимого?» Вот такой вопрос... Хм."
103070-270 = "Вообще-то больше всего её интересовал шестой коан... Но неважно. Во втором есть ловушка."
103070-271 = "...Это неполное предложение."
103070-272 = "Да. Понять «что» посредством непостижимого? Объект отсутствует."
103070-273 = "Следовательно, это предложение вообще не является вопросом."
103070-274 = "Но... президент говорила, что это неважно, потому что правильного ответа и не предполагается. Объект вы должны подставить сами."
103070-275 = "Хотя я сама не до конца это понимаю."
103070-276 = "Просто твоя притча напомнила мне этот коан."
103070-277 = "Это всего лишь светская беседа, так что не рви на себе волосы из-за неё."
103070-279 = "Хм. А мне это кажется любопытным."
103070-280 = "Например, если то, чего я не понимаю, — судьба, тогда то, что я понимаю через судьбу, это..."
103070-281 = "Что мы, люди, можем понять через судьбу? Хм... Забавный вопрос без настоящего смысла."
103070-282 = "[s1] «Сам вопрос изначально неполный.»\n[s2] «Что ж, дополнить его можно чем угодно.»"
103070-285 = "...Возможно, вы правы. У коанов не обязательно должен быть ответ. Как и у моего вопроса о короле."
103070-286 = "Ханако, можно тебя спросить?"
103070-287 = "Да, что такое, главный офицер?"
103070-288 = "Чем заканчивается та история? Что стало с королём?"
103070-289 = "О... Король..."
103070-290 = "Он понял, что именно его поступки стали причиной гибели королевства..."
103070-291 = "Он решил, что искупить свои грехи невозможно, и не смог вынести тяжесть собственной вины."
103070-292 = "И в конце концов, в отчаянии..."
103070-293 = ""
103070-295 = ""
103070-296 = "...Эм, пожалуй, эту историю лучше оставить на другой раз."
103070-297 = "[s] «...»"
103070-298 = ""
103070-301 = ""
103070-304 = ""
103070-305 = "Рин, Сенсей, мы закончили план операции."
103070-306 = "Вам двоим нужно окончательно всё утвердить, прежде чем мы проведём инструктаж. Быстрее приходите на мостик."
103070-308 = "Ох. Раз план готов..."
103070-309 = "...Да, пойдём."
103070-310 = ""
103070-312 = ""
103070-315 = "Следующий эпизод; Оперативный инструктаж"
