[translation]
1010402-1 = "Повседневные дела"
1010402-3 = "Рано утром я отправился туда, где Рэйдзё назначила встречу."
1010402-4 = "Когда я пришёл..."
1010402-9 = "― [log=레이죠]А. Вы пришли.[/log][wa:2130]"
1010402-10 = "― [log=레이죠]Я почти закончила утреннюю тренировку, пожалуйста, подождите.[/log][wa:4300]"
1010402-13 = "― [log=레이죠]Видите, это тоже часть непрерывного движения.[/log][wa:1160]"
1010402-14 = "― [log=레이죠]Останавливать поток, удерживать позы...[/log][wa:3380]"
1010402-17 = "― [log=레이죠]Это также помогает тренировать разум.[/log][wa:1900]"
1010402-20 = "― [log=레이죠]...Но почему вы просто стоите, Сенсей?[/log][wa:2830]"
1010402-23 = "― [log=레이죠]А? Если я тренируюсь...[/log][wa:740]"
1010402-24 = "― [log=레이죠]...то не должна отвлекаться? Нужно сохранять спокойствие?[/log][wa:1870]"
1010402-27 = "― [log=레이죠]Да, это правда, но...[/log][wa:2420]"
1010402-30 = "― [log=레이죠]...Н-Но это уже слишком![/log][wa:2610]"
1010402-33 = "Когда тренировка закончилась, я почувствовал на себе холодный взгляд Рэйдзё."
1010402-35 = "И правда неловко показывать кому-то своё кунг-фу."
1010402-36 = "...Хотя сегодня к смущению примешивалась совсем другая причина!"
1010402-37 = "[s1] «Р-Рэйдзё, ты такая старательная!»\n[s2] «Я вообще не способен делать утреннюю зарядку!»"
1010402-40 = "Почему мне кажется, что вы осторожно пытаетесь сменить тему?"
1010402-41 = "Что? Мне показалось? Так же как вы верите в меня, я должна верить в вас...?"
1010402-42 = "Хорошо, Сенсей. Раз вы так говорите."
1010402-43 = "Полагаю, это я сама рассказала вам про это место."
1010402-44 = "А? Нет. Даже я не тренируюсь каждое утро."
1010402-45 = "По выходным я даю телу отдых. А в дождь или снег мне поневоле приходится пропускать."
1010402-46 = "[s] «В любом случае приятно видеть то, чем ты так увлечена.»"
1010402-47 = "То, чем я увлечена..."
1010402-48 = "Н-Нет, ничего. Просто..."
1010402-49 = "Вам не кажется странным, что я занимаюсь кунг-фу."
1010402-50 = "Что? А... Вы ведь, технически, пришли извне Кивотоса..."
1010402-51 = ""
1010402-53 = ""
1010402-54 = "Да... Здесь стремление оттачивать боевые искусства считают немного эксцентричным."
1010402-55 = "В конце концов, в настоящем бою это почти не помогает. Обычно всё решают несколькими выстрелами."
1010402-56 = "Сейчас это уже скорее просто утренняя гимнастика."
1010402-57 = "[s] «Но ты всё равно продолжишь тренироваться, да, Рэйдзё?»"
1010402-58 = "Ну, если заставить меня выбирать, думаю, да."
1010402-59 = "Я занимаюсь кунг-фу по нескольким причинам..."
1010402-60 = "Во-первых, оно полезно и для тела, и для разума."
1010402-61 = "Движение помогает собраться, очистить голову и успокоить мысли. И, конечно, тренировки повышают выносливость."
1010402-62 = "Работа на Променаде сложнее, чем кажется. А ещё нужно успевать учиться, и экзамены словно никогда не заканчиваются..."
1010402-63 = "А? Мои оценки...?"
1010402-64 = ""
1010402-66 = ""
1010402-67 = "Вам обязательно спрашивать об этом именно сейчас?"
1010402-68 = "В общем, вот так. У кунг-фу много полезных сторон."
1010402-69 = "А ещё мне нравятся пословицы, которым оно учит!"
1010402-70 = "Например: «Терпение — не пассивность и не бездействие, а активность и напряжённость.»"
1010402-71 = "Понять это может только тот, чьё терпение по-настоящему испытывали. Например, когда мне приходится разбираться с членами Гэнрюмона, устраивающими истерики из-за пустяков!"
1010402-72 = "[s] «Д-Давай глубоко вдохнём.»"
1010402-73 = "Ещё одна отличная поговорка: «Посмотри своим ошибкам в лицо — и они потеряют над тобой власть.»"
1010402-75 = "Рэйдзё ещё некоторое время оживлённо рассказывала о кунг-фу и связанных с ним пословицах."
1010402-77 = "Эм. Простите, Сенсей. Я опять выставила себя глупо, заставляя вас слушать мою болтовню..."
1010402-78 = "[s3] «Ты действительно любишь кунг-фу.»\n[s4] «Почему бы тебе не вступить в клуб?»"
1010402-81 = "А? Вы имеете в виду Клуб исследования боевых искусств или Клуб современных боевых искусств? Кажется, я видела такие названия."
1010402-82 = "Но странно слышать это от вас, Сенсей."
1010402-83 = "Первое правило кунг-фу — его обязательно должен использовать официант или повар!"
1010402-84 = "[s5] «...!!»\n[s6] «Точно!»"
1010402-85 = ""
1010402-86 = ""
1010402-89 = "[ns] «И в центре ресторана обязательно должно быть большое открытое пространство!»"
1010402-90 = "Да! И второй этаж!"
1010402-91 = "[s] «А потом кто-нибудь ломает перила и падает вниз!»"
1010402-92 = "Именно, Сенсей! Огромная драка начинается, когда люди сбегают по лестнице!"
1010402-93 = "[s] «А главный герой тем временем невозмутимо доедает!»"
1010402-94 = "Но потом его провоцируют вмешаться в драку!"
1010402-95 = "Да! Идеально! Самый сильный повар со всеми разбирается!"
1010402-97 = "Глаза Рэйдзё буквально сияли, пока мы продолжали разговор..."
1010402-98 = "Мы идеально подхватывали реплики друг друга, одинаково увлёкшись сценарием."
1010402-99 = "Этот восторженный разговор продолжался почти до самого вечера..."
