[translation]
1002805-1 = "Жизнь девушек-кроликов"
1002805-3 = "Сегодня у меня был выходной, но по работе пришлось заглянуть в Миллениум."
1002805-4 = "На обратном пути я присел отдохнуть в лаунже кафе. Поскольку был выходной, учеников вокруг почти не было."
1002805-5 = "Это вы, Господин?"
1002805-6 = "Я как раз собиралась пойти к вам, а вы уже здесь!"
1002805-7 = "[s1] «...?»\n[s2] «Асуна?»"
1002805-8 = ""
1002805-9 = ""
1002805-12 = ""
1002805-13 = "Что привело вас сюда, Господин? Опять работа?"
1002805-14 = "Разве сегодня не ваш выходной? Вы работаете даже по выходным? Чудак!"
1002805-15 = "А?"
1002805-16 = "Не говорить такого? Вам больно? Где болит?"
1002805-17 = "Вы на самом деле не ранены?! Что? Так как понимать?"
1002805-18 = "Ха-ха-ха!"
1002805-19 = "Я? Вы хотите знать, почему я снова в этой одежде? И почему я здесь?"
1002805-20 = "Потому что я всё ещё ничего толком не узнала о девушках-кроликах! Разве вам не хотелось бы побольше узнать о том, что вам интересно?"
1002805-21 = "Если костюм девушки-кролика не делает меня кроликом..."
1002805-22 = "...тогда какой вообще смысл в этом костюме?"
1002805-23 = "Для чего он нужен?"
1002805-24 = "Мне всегда говорят: «Костюм девушки-кролика надевают, чтобы радовать людей.»"
1002805-25 = "Но что-то не сходится. Разве тогда костюм девушки-кролика не получается хорошей вещью? Значит, его должны носить все!"
1002805-26 = "Почему-то, когда я спрашивала, никто не отвечал прямо."
1002805-27 = "Поэтому я надела этот костюм, чтобы разобраться самой."
1002805-28 = "Раз никто не хочет дать мне ответ, придётся найти свой!"
1002805-29 = ""
1002805-32 = "Но вчера здесь точно было много людей..."
1002805-33 = "Почему-то все на меня смотрели. А потом вышел владелец кафе и сказал: «Простите, но приходите завтра.» Вот я и пришла!"
1002805-34 = "Но сегодня здесь никого нет. Интересно, куда все делись. Хахаха!"
1002805-35 = "[s] «...»"
1002805-36 = ""
1002805-38 = ""
1002805-39 = "Подождите."
1002805-40 = "Никто не хочет объяснить почему..."
1002805-41 = "Хм..."
1002805-42 = "Но вы ведь учитель, правда, Сенсей?"
1002805-43 = "[s3] «Ну, это правда, но...»\n[s4] «И к этому всё свелось?»"
1002805-44 = "Сенсей! Вы же учитель, так объясните мне!"
1002805-45 = "Сенсей! Вы же учитель, так объясните мне!"
1002805-46 = "Почему вообще существуют девушки-кролики? Костюмы девушек-кроликов и правда делают людей счастливыми?"
1002805-47 = "Я могу сделать других счастливыми, просто надев его? Или нужны ещё какие-то условия?"
1002805-48 = "А?"
1002805-49 = "Они не это имели в виду?"
1002805-50 = "Тогда что они имели в виду?"
1002805-51 = "Дело не в самом костюме, а в том, зачем я его ношу? Почему?"
1002805-52 = "Я уже это говорила?"
1002805-53 = "Это особый наряд, который надеваешь, чтобы сделать кого-то счастливым и самой от этого стать счастливее?"
1002805-54 = "Кажется, я понимаю, но в то же время будто бы и нет... Сложно."
1002805-55 = "Эй, подождите. А как же моя обычная форма горничной?"
1002805-56 = "Разве обычно я ношу её не для того, чтобы радовать вас, Господин? Есть какая-то разница?"
1002805-57 = "А?"
1002805-58 = "Это одно и то же? Правда?"
1002805-59 = "То же самое, что форма горничной?"
1002805-60 = "...Хм."
1002805-61 = "Как думаете, Господин? Я сейчас делаю вас счастливым?"
1002805-62 = "Тогда я ношу этот костюм девушки-кролика, чтобы радовать вас, Господин! Отныне буду думать именно так!"
1002805-63 = "Да! Я разобралась!"
1002805-64 = "Ну и как? Что вы чувствуете? Вы счастливы?"
1002805-65 = "А?"
1002805-66 = "Не узнаете, пока я не приготовлю вам чашку кофе?"
1002805-67 = "Правда? Это легко! Сейчас же приготовлю!"
1002805-68 = "После того как выпьете, обязательно скажите мне, хорошо?"
1002805-69 = "Одна чашка кофе уже в пути!"
1002805-70 = ""
1002805-72 = ""
1002805-74 = "После этого остаток выходного я провёл в кафе вместе с Асуной."
