[translation]
10033020-1 = "Эпизод 2;Переднее сиденье американских горок"
10033020-4 = "Угх. Почему нас делят на группы для экскурсии? Какая тупость."
10033020-5 = "Серьёзно! Я думала, мы хотя бы уйдём из школы, а теперь нам просто читают лекции в другом месте."
10033020-6 = "Может, просто свалим? Прогуляем денёк? Погоди, это сок? Дай сюда."
10033020-7 = "Ну ладно, но за каждый глоток пла—#nЭ-эй! Верни!"
10033020-8 = "Да ладно тебе, не жадничай. Я просто хочу попробовать."
10033020-9 = "Ты уже половину выпила!!!"
10033020-10 = ""
10033020-14 = ""
10033020-15 = "Не то чтобы я удивлена, но они уже устроили шум."
10033020-16 = "Ага. Ах. Смотри-смотри. Кто-то играет с бомбами."
10033020-17 = "Это фугасный противотанковый боеприпас, сокращённо HEAT... Они пытаются засунуть его в гранатомёт?"
10033020-18 = ""
10033020-22 = ""
10033020-23 = "Хахаха! Как БА-БАХНУЛО! Боже, поездка уже взрывная. ВЗРЫВНАЯ, поняла?"
10033020-24 = "То есть это всё происходило бы и без экскурсии. Но мне кажется, именно сейчас нам стоило бы вести себя приличнее..."
10033020-25 = "Да ладно, Префектурная команда вмешается, если всё выйдет из-под контроля. Наверное!"
10033020-26 = "Но я всё равно рада увидеть Хяккияко. Уверена, рассказы не передают и половины."
10033020-27 = "Ага! По крайней мере, скучно точно не будет!"
10033020-28 = "Ох блин. Они запускают трансляцию. Разбуди меня, когда всё закончится, ладно?"
10033020-29 = "Погоди-погоди. Я тоже хочу поспать! Эти трансляции всегда таки-и-ие скучные."
10033020-30 = ""
10033020-33 = ""
10033020-34 = "Кихехехе! Добро пожаловать, добро пожаловать, мои дорогие товарищи!"
10033020-35 = "Посмотрите на эти массы, собравшиеся послушать единственную и неповторимую Макото! Я должна навсегда запечатлеть этот вид в памяти! Кихехе!"
10033020-36 = "Созерцай моё величие, Ироха! Вот доказательство моей великости! Видишь, как они уважают моё лидерство."
10033020-37 = "*зевок*"
10033020-38 = "*вздыхает* Ага-ага. Если ты можешь делать вид, что не замечаешь, как все засыпают, то и я могу. Ура. Вперёд, Макото."
10033020-39 = "Как и ожидалось от нашего великого лидера. Хаха! Давайте увековечим этот момент фотографией!"
10033020-40 = ""
10033020-42 = ""
10033020-44 = "Ибуки тоже, Ибуки тоже! Чиаки! Сфотографируй, пожалуйста!"
10033020-45 = "Ты такая фотогеничная, Ибуки! Ты будешь главной героиней этой грандиозной экскурсии... ну и Макото где-нибудь сбоку, наверное..."
10033020-46 = "Так называемый «организатор» всего этого — всего лишь украшение..."
10033020-47 = "Ахаха! Ироха! В этом-то весь смысл!"
10033020-48 = "Да! Точно, как она сказала!"
10033020-49 = "Я дарую тебе честь увековечить нашу экскурсию в Хяккияко."
10033020-50 = ""
10033020-52 = ""
10033020-53 = "Приготовься восхвалять достижения великой Макото!"
10033020-54 = "Кто сделал эту экскурсию возможной?! Я! Только я! Ни крупицы заслуг этой мерзкой, отвратительной Префектурной команде!"
10033020-55 = "Мы войдём в историю, пока эти неудачники возятся с какой-то мелочёвкой вроде встречи с Хяккарёран! Всем плевать на это! Я даже не понимаю, зачем она нужна!"
10033020-56 = "Ага-ага. Как скажешь, Макото."
10033020-57 = ""
10033020-60 = ""
10033020-61 = ""
10033020-63 = ""
10033020-64 = ""
10033020-65 = ""
10033020-67 = ""
10033020-68 = ""
10033020-69 = ""
10033020-71 = ""
10033020-72 = ""
10033020-73 = ""
10033020-76 = ""
10033020-77 = "...И на этом всё от вашей великой председательницы! Вы все должны благодарить меня за возможность увидеть, насколько я великолепна! Кихехехе!"
10033020-78 = "Мы приведём Геенну в новую эпоху!"
10033020-79 = "Пора, Ироха! Подай корабельный гудок отправления!"
10033020-80 = ""
10033020-83 = ""
10033020-85 = "Перевод: пора отправляться на экскурсию. На автобусе. Для ясности: никто не садится на корабль. Между нами и Хяккияко даже воды нет."
10033020-86 = "Ибуки?"
10033020-87 = "Все! Ибуки желает вам супер-пупер безопасной поездки!"
10033020-88 = ""
10033020-91 = ""
10033020-92 = "И-Ибуки!"
10033020-93 = "Мы вернёмся раньше, чем ты успеешь соскучиться, Ибуки!"
10033020-95 = "Ибуки не это имела в виду! Не оставляйте Ибуки..."
10033020-97 = "Виноваты, виноваты. Конечно, мы тебя не оставим."
10033020-98 = "Я уже начинаю входить во вкус. Может, это и правда будет весело?"
10033020-99 = "Ладно, мисс «я в предвкушении». Автобус вон там."
10033020-100 = ""
10033020-102 = ""
10033020-104 = "Я не слишком много вещей взяла? Надеюсь, сумка не превышает лимит веса..."
10033020-105 = "Хяккияко очень известна своим туризмом. Интересно, какие места мы увидим!"
10033020-106 = "Для нас наверняка подготовили супер-крутой маршрут... да?"
10033020-107 = ""
10033020-110 = ""
10033020-111 = "Неужели этот день уже настал? Студенты Геенны уже едут сюда прямо сейчас!"
10033020-112 = "Ох-ох. Где мой ежедневник? Ежедневник! Без него нам конец!"
10033020-113 = ""
10033020-115 = ""
10033020-116 = ""
10033020-117 = "[ns] «Успокойся, Умика! Он вот здесь!»"
10033020-118 = ""
10033020-119 = "С-спасибо, Сенсей. Остальные уже вернулись?"
10033020-120 = "[s1] «Они переодеваются в форму экскурсоводов.»\n[s2] «Умика, ведь их форму сшила ты, верно?»"
10033020-123 = "Да! Я сделала её специально для этого фестиваля!"
10033020-124 = "[s] «(Я правда не знаю, как сказать ей, что экскурсия — не фестиваль...)»"
10033020-125 = "...Хм? Почему я не переодеваюсь?"
10033020-126 = "Ну... Думаю, мне это просто не очень подойдёт... Работа экскурсовода — не моя сильная сторона."
10033020-127 = "Обычно именно босс общается с клиентами..."
10033020-128 = "В-в любом случае!"
10033020-129 = "Они будут выглядеть потрясающе. Я сама придумала дизайн, сняла мерки и всё сшила!"
10033020-130 = "[s] «Не терпится увидеть твою работу!»"
10033020-131 = "Мы вернулись!"
10033020-132 = ""
10033020-134 = ""
10033020-135 = ""
10033020-136 = ""
10033020-137 = "Ну как, Умика, Сенсей? Мы вернулись и полностью готовы к работе!"
10033020-138 = "[s] «Вы выглядите совершенно иначе!»"
10033020-139 = "Спасибо! В новой форме я исполню свою роль наилучшим образом."
10033020-140 = ""
10033020-142 = ""
10033020-143 = ""
10033020-144 = "А я, Сенсей? Разве теперь я не выгляжу как настоящая леди? Хи-хи!"
10033020-145 = "[s] «Так вот что значит „одежда красит человека“!»"
10033020-146 = "Знаю! Представляю, как удивится Мимори, увидев, какой леди и бойцом я стала!"
10033020-147 = "...Для этого мне необязательно быть бойцом? О-ой. Наверное, да."
10033020-148 = ""
10033020-150 = ""
10033020-151 = ""
10033020-152 = "*зевает* Я... полностью готова... вести экскурсию..."
10033020-153 = "[s] «Цубаки умеет тренировать сон даже в форме экскурсовода!»"
10033020-154 = "Сон... экскурсия... Всё тренировка."
10033020-156 = "[ns3] «Ладно. В любом случае, все выглядят идеально!»\n[ns4] «Начнём финальную проверку!»"
10033020-159 = ""
10033020-161 = ""
10033020-163 = "Да, Сенсей!"
10033020-164 = "Автобус должен прибыть в 15:00, и они заложили около двадцати минут на то, чтобы все студенты вышли и забрали вещи."
10033020-165 = "Но нельзя рассчитывать, что всё пойдёт точно по плану! Автобус может задержаться, а студентам может понадобиться время, чтобы найти весь багаж."
10033020-166 = "Если учесть задержку от трёх до семи минут, можно ожидать, что все будут готовы к 15:27!"
10033020-167 = "Люди очень непредсказуемы, поэтому я бы заложила хотя бы до 15:30!"
10033020-168 = "О-отличная мысль! После этого мы перейдём к первому пункту маршрута: поездке на рикше."
10033020-169 = "Учитывая ограниченное число людей, которые могут одновременно ехать в рикше, и необходимое время—"
10033020-170 = "Давайте оставим это персоналу рикш! Они всё-таки настоящие специалисты!"
10033020-171 = "Н-но мы должны тщательно контролировать каждую минуту дня..."
10033020-172 = "[ns5] «Давай доверимся нашим товарищам из Хяккияко, Умика.»\n[ns6] «Поверь в Хяккияко, которая верит в тебя!»"
10033020-175 = "Э-это звучит не совсем логично, но я соглашусь. Дальше..."
10033020-176 = ""
10033020-178 = ""
10033020-179 = "Первой большой достопримечательностью нашего тура будет... А?! Мы что-то поменяли в маршруте, Цубаки?"
10033020-180 = "*зевает* Ага, пришлось. Следующее место попросило больше времени, поэтому..."
10033020-181 = "Т-тогда нужно исправить все документы и перепечатать...!"
10033020-182 = "Не волнуйся... Уже сделано..."
10033020-183 = "Уже?!"
10033020-184 = "Хр-р..."
10033020-185 = "Вот такая она, Цубаки! Хи-хи. Не позволяй тренировкам сна тебя обмануть. Она всегда доводит дело до конца."
10033020-186 = "Понятно! Истинные мастера скрывают свои способности под спокойной внешностью!"
10033020-188 = "Э-это замечательно. Идём дальше...!"
10033020-192 = ""
10033020-193 = "Перерыв на обед? Что в меню?"
10033020-194 = "Так... Хахаха! Железнодорожное бэнто! Зачем вообще раздавать железнодорожные бэнто в автобусе?"
10033020-195 = "Создаёт настроение, тебе не кажется? Что внутри?"
10033020-196 = "Тушёные ростки бамбука, жареный лосось, рулет из омлета, приправленные овощи и рисовые шарики. Вообще-то неплохо."
10033020-197 = "Можем назвать его автобусным бэнто."
10033020-198 = "Хахаха! Название такое же нелепое, как и сама идея."
10033020-199 = ""
10033020-203 = ""
10033020-204 = "И что теперь? Они дерутся из-за еды, да?"
10033020-205 = "Ну, пока они не ломают автобус, что тут вообще сделаешь, верно?"
10033020-206 = "Нужно радоваться тому, что есть."
10033020-207 = "Именно! Уверена, в какой-то момент им надоест и они успокоятся."
10033020-210 = ""
10033020-211 = "Не думаю, что «успокоиться» вообще есть в их словаре."
10033020-212 = "Может, тоже присоединимся к веселью?"
10033020-213 = "Я пас. Не хочу испортить причёску."
10033020-214 = "Боже мой, какая прелесть. Противотанковая ракета, но переносная!"
10033020-218 = ""
10033020-219 = "Я пойду проведу финальную проверку всех мест. Пина, пожалуйста, возьми всё на себя, пока меня нет!"
10033020-220 = "Да! Я буду трудиться до последней косточки и защищу честь Хяккияко!"
10033020-221 = "[s] «Давай совсем чуть-чуть сбавим энтузиазм.»"
10033020-223 = ""
10033020-224 = "Сейчас, может, и нет активного фестиваля, но никогда не знаешь, что может произойти, Каэдэ!"
10033020-225 = "Я в полной боевой готовности!"
10033020-226 = "[s] «Почему-то эта финальная проверка заставляет меня нервничать ещё сильнее...»"
10033020-228 = ""
10033020-229 = "Я рассчитываю на вас, президент Цубаки!"
10033020-230 = "М...гм... Хр-р... *храпит*"
10033020-231 = "Президент?!"
10033020-232 = "[s] «Не паникуй! Она всегда просыпается в самый последний момент!»"
10033020-234 = "Воздух был наполнен волнением и предвкушением..."
10033020-235 = ""
10033020-237 = ""
10033020-238 = ""
10033020-239 = ""
10033020-240 = "...А ещё тревогого одного конкретного студента."
10033020-241 = ""
10033020-244 = ""
10033020-245 = ""
10033020-247 = ""
10033020-248 = ""
10033020-249 = ""
10033020-250 = ""
10033020-253 = "Но экскурсия академии Геенны наконец началась!"
10033020-256 = ""
10033020-257 = "Ого. Так вот какая она, Хяккияко."
10033020-258 = "Атмосфера тут просто безупречная!"
10033020-259 = "Что... это вообще значит?"
10033020-260 = "Ну то и это! Кто знает, тот знает, понимаешь?"
10033020-262 = "*вдох* *выдох* *вдох* *выдох*"
10033020-263 = "[s] «Пожалуйста, не падай в обморок, Умика.»"
10033020-264 = "К-конечно нет, Сенсей! Я... готова!"
10033020-265 = ""
10033020-267 = ""
10033020-269 = "Добро пожаловать, студенты академии Геенны! Добро пожаловать в Хяккияко!"
10033020-270 = "Мы очень рады вас видеть!"
10033020-271 = ""
10033020-273 = ""
10033020-276 = ""
10033020-277 = "Наверное, стоило ожидать встречающую делегацию."
10033020-278 = "Хи-хи. Смотри на сестричек-экскурсоводов! Какие милые!"
10033020-280 = "М-милые?! Сестрички...?"
10033020-281 = "Очень приятно это слышать! Спасибо!"
10033020-283 = "Не может быть! Это Сенсей?!"
10033020-284 = "Мне мерещится? Хахаха! Привет, учитель!"
10033020-285 = "[s] «Кирара! Эрика! Привет вам обеим!»"
10033020-286 = ""
10033020-287 = "Вы тоже участвуете в экскурсии? Теперь она стала, типа, в сто раз веселее."
10033020-288 = "Привет, Сенсей! Рукопожатие в честь встречи?"
10033020-289 = "[s] «Конечно. Рад вас обеих видеть.»"
10033020-290 = "Ого! Учитель, у вас такие тёплые руки!"
10033020-291 = "Теперь я и правда жду эту поездку. Надеюсь, мы, студенты Геенны, не доставим вам слишком много проблем..."
10033020-292 = "Да не будь ты такой занудой! Учитель справится с чем угодно."
10033020-293 = "[s] «Здравствуйте. Я временно исполняю обязанности главного экскурсовода, [USERNAME].»"
10033020-294 = "Ура! После поездки обязательно надо встретиться."
10033020-295 = "Всё по очереди, Кирара."
10033020-296 = "Чего-о? Не притворяйся, будто сама не хочешь, Эрика!"
10033020-297 = "Д-дело не в этом, просто..."
10033020-298 = "Я же говорила! Нам нужно забрать вещи, так что скоро увидимся, учитель!"
10033020-300 = "А? Не могу найти свой багаж... Ты не видела зелёный чемодан?"
10033020-301 = "Ты про этот? Ага! Очень удобный стул. Не хотела пачкать форму, сидя на земле."
10033020-302 = "Какого чёрта! У тебя свой есть!"
10033020-303 = ""
10033020-304 = "Пожалуйста, послушайте все! Я хотела бы ещё раз пройтись по сегодняшнему расписанию—"
10033020-306 = "Твой намного удобнее! С чего бы мне сидеть на своём?"
10033020-307 = "Верни! Вставай!"
10033020-308 = "Пусть хоть конец света сейчас наступит, я не встану!"
10033020-309 = "Эй? Я понимаю, сейчас много всего происходит, но можно, пожалуйста, немного внимания!"
10033020-311 = "Я взорву и багаж, и тебя вместе с ним, если ты сейчас же не слезешь!"
10033020-312 = "Меня устраивает! Всё равно это твой багаж взорвётся!"
10033020-313 = "(Нельзя позволять этому выбить меня из колеи. Пока босса нет, я должна взять всё на себя. Не ошибайся... Не ошибайся!)"
10033020-314 = "Объединённая академия Хяккияко — район, который изначально развивался с упором на туризм..."
10033020-315 = "Мы проводим разные сезонные мероприятия: любование сакурой весной, фейерверки летними вечерами и отдых в горячих источниках зимой..."
10033020-316 = "Наша задача — обеспечивать всем посетителям первоклассное гостеприимство..."
10033020-317 = "Все наши клубы работают вместе ради этой цели..."
10033020-318 = "Ну, по крайней мере, теперь... Раньше было много конфликтов... из-за территорий и прочего, но м-мы всё исправили! Так что, то есть... Поэтому!"
10033020-319 = "(У-Умика?! )"
10033020-321 = "Под конец я её уже потеряла."
10033020-322 = "Не надо нас так бояться, госпожа экскурсовод! Хахаха!"
10033020-324 = "Итак, нашим уважаемым гостям из академии Геенны!"
10033020-325 = "Мы надеемся, что эта экскурсия станет по-настоящему незабываемым опытом для каждой из вас! На этом приветственная церемония окончена!"
10033020-326 = "Пожалуйста, наслаждайтесь пребыванием в Хяккияко на полную! Спасибо!"
10033020-327 = "[ns] «Умика, Умика! Первый пункт маршрута!»"
10033020-328 = "А...?! Да! Т-тогда начнём!"
10033020-329 = ""
10033020-331 = ""
10033020-332 = "Чтобы открыть экскурсию, начнём со знаменитой поездки по Хяккияко на рикше!"
10033020-333 = ""
10033020-335 = ""
10033020-336 = "Эй-эй! Запрыгивайте, и мы устроим вам лучшую экскурсию во всём Хяккияко!"
10033020-338 = "Рикша. Хм, как старомодно и мило!"
