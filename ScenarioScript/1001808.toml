[translation]
1001808-1 = "Обещание в парке аттракционов"
1001808-2 = "Главный вход в парк развлечений"
1001808-3 = ""
1001808-4 = ""
1001808-5 = "Сенсей, сюда. Вот сюда."
1001808-6 = "Хи-хи. Так странно гулять с тобой по парку без моего костюма..."
1001808-7 = "Точно ничего, что сегодня я не работаю?"
1001808-8 = "Да, сегодня у меня выходной."
1001808-9 = "Парк дал мне два бесплатных билета, чтобы я могла воспользоваться ими в выходной... Я хотела показать тебе место, где работаю, Сенсей."
1001808-10 = "Я-я тебе не мешаю?"
1001808-11 = "[s] «Нет, мне тоже нравятся парки аттракционов.»"
1001808-12 = "Я рада. Ты ведь так занят, поэтому я переживала, что буду тебе мешать."
1001808-13 = "Т-Тогда давай вместе покатаемся на аттракционах...!"
1001808-14 = "[s] «Какие аттракционы тебе нравятся, Юзу?»"
1001808-15 = "Мне подойдёт любой, если я смогу кататься вместе с тобой, но... я-я всё ещё боюсь людей..."
1001808-16 = "Если можно, я бы предпочла аттракционы, где не слишком много народу..."
1001808-17 = "[s1] «Тогда давай прокатимся на колесе обозрения.»\n[s2] «Тогда давай прокатимся на американских горках.»"
1001808-18 = "Хорошо! На колесе обозрения не так много людей, а ещё с высоты можно увидеть весь парк..."
1001808-19 = ""
1001808-20 = "Сюда, Сенсей. Я покажу дорогу!"
1001808-21 = "А-Американские горки? Туда же огромная очередь, да и сам аттракцион ужасно страшный..."
1001808-22 = "С-Сенсей, подожди меня! Не оставляй меня здесь одну..."
1001808-24 = "Так мы с Юзу прокатились на нескольких весёлых аттракционах..."
1001808-26 = "Фух... Сегодня было весело."
1001808-27 = "В парках аттракционов всегда весело, но с тобой мне было ещё веселее."
1001808-28 = "[s] «Мне тоже было весело.»"
1001808-29 = "Ну..."
1001808-30 = "П-Прежде чем мы попрощаемся... у меня есть для тебя подарок, Сенсей."
1001808-31 = "Ты спрашиваешь, были ли бесплатные билеты моим подарком?"
1001808-32 = "Н-Нет, не они!"
1001808-33 = "Э-Это... я просто попросила их, потому что хотела провести время с тобой."
1001808-34 = "Остальным я купила подарки, которые им нравятся, но мне казалось, что любой подарок для тебя будет недостаточно хорош. Поэтому после долгих раздумий я придумала вот это..."
1001808-35 = ""
1001808-37 = ""
1001808-38 = ""
1001808-39 = ""
1001808-40 = "Это то, чем ты сможешь воспользоваться в любой момент, когда понадобится, Сенсей..."
1001808-41 = "Это сезонный пропуск Юзу."
1001808-45 = "― Сенсей, если бы не ты... я бы не смогла этого сделать.[wa:2670]"
1001808-48 = "― Благодаря тебе, Сенсей, я смогла подарить всем подарки.[wa:3190]"
1001808-51 = "― Сенсей, так же, как ты помог мне...[wa:1110]"
1001808-53 = "― Если ты когда-нибудь попадёшь в беду и я тебе понадоблюсь, просто скажи.[wa:3010]"
1001808-56 = "― Я обязательно отплачу тебе.[wa:2310]"
1001808-59 = "Я рада, что тебе понравилось."
1001808-60 = "Можешь ли ты попросить меня о чём угодно, если воспользуешься пропуском? Да, конечно..."
1001808-61 = "Ч-Что угодно..."
1001808-62 = "О-О чём ты думаешь?! Я-я не для ТАКОГО тебе его дала!"
1001808-63 = "П-Пусть это и свободный пропуск, но я-я никогда не позволю ничего странного! Никогда!"
1001808-64 = ""
1001808-65 = "..."
1001808-66 = "Никогда... не позволю... такого..."
