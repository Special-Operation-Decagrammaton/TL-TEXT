[translation]
10009015-2 = "Все объединили силы, чтобы во второй раз обезвредить Вакамо."
10009015-3 = "Фух!"
10009015-4 = "Благодаря вам, Сенсей, мы снова поймали Вакамо и избежали катастрофы."
10009015-5 = "Спасибо за сотрудничество!"
10009015-6 = "[s] «Не стоит...»"
10009015-8 = "Разве они не использовали снаряжение Полицейской академии Валькирии?"
10009015-9 = "Как оно вообще попало к ним?"
10009015-10 = "Ну, эм... его вроде как украли в суматохе."
10009015-11 = "Как полицейская академия могла позволить так легко украсть столь ценное оборудование? Это недопустимо."
10009015-12 = "Что у вас с системой безопасности? Есть автоматическая блокировка и проверка пользователя?"
10009015-13 = "Систему проверки какой компании вы используете?"
10009015-14 = "Если скажете название программы, я смогу выяснить, как они обошли проверку."
10009015-15 = "Ну, что касается системы безопасности..."
10009015-16 = "...кажется, там используется пароль. Наверное?"
10009015-17 = "То есть у вас была всего одноэтапная проверка?"
10009015-18 = "Ага. Кажется, это день рождения капитана Бюро безопасности."
10009015-19 = "Его все постоянно забывают, поэтому обычно в бардачках патрульных машин оставляют записку с паролем."
10009015-20 = ""
10009015-22 = ""
10009015-23 = "Как Валькирия может настолько халатно относиться к безопасности?!"
10009015-24 = "*вздыхает* Придётся взять дело в свои руки."
10009015-25 = "Да ладно! Было тяжеловато, но мы же снова её поймали.#nВсё хорошо, что хорошо кончается!"
10009015-26 = "И это ты называешь счастливым концом...?"
10009015-28 = "Прости за неё. Я постоянно говорю Фубуки относиться ко всему серьёзнее..."
10009015-29 = "А я постоянно говорю тебе не переживать по мелочам!"
10009015-30 = "Кстати, мне кажется или после побега она сразу направилась к Сенсею?"
10009015-31 = "Думаешь, это могло быть не совпадение?#nЗачем Лисе Бедствий охотиться на Сенсея?"
10009015-32 = "Без понятия. Знаю, что она держит зуб на Генеральный студенческий совет.#nМожет, Шале она тоже ненавидит?"
10009015-33 = "Ну и ладно. Главное, мы её остановили!"
10009015-34 = "[s] «Наверное...»"
10009015-35 = "Нам пора снова сопровождать Вакамо туда, где ей место."
10009015-36 = "На этот раз мы будем следить за ней как следует!"
10009015-37 = "[s] «Хорошо. Удачи.»"
10009015-38 = ""
10009015-40 = ""
10009015-43 = "*вздыхает* Голова болит."
10009015-44 = "По крайней мере, нам удалось не дать ситуации ухудшиться."
10009015-45 = "Ага. Мне пора возвращаться к работе."
10009015-46 = "Тогда увидимся позже."
10009015-47 = "Надо будет потом высказать всё, что я думаю, ответственным за безопасность Валькирии..."
10009015-48 = "[s] «Удачи и спасибо за помощь.»"
10009015-49 = "Разумеется. До встречи, Сенсей."
10009015-50 = ""
10009015-52 = ""
10009015-53 = "Продолжим патруль?"
10009015-54 = "[s] «Ага. Хотя мне всё ещё кажется, что что-то не так...»"
10009015-56 = "После произошедшего мы с Сэной снова продолжили патрулирование."
