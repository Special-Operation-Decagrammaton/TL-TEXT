[translation]
2300105-1 = "Снова в супермаркет!"
2300105-2 = "Прости, что в прошлый раз перестаралась."
2300105-3 = "[s] «Не переживай. Ты хотела как лучше.»"
2300105-4 = "Хи-хи. Весь ты, Сенсей."
2300105-5 = "Говори что хочешь, но я решила загладить вину и приготовить тебе кое-что особенное."
2300105-6 = "Не сходишь со мной снова за продуктами, Сенсей?"
2300105-8 = "Рынок на Третьей авеню"
2300105-10 = "[ns] «Что сегодня покупаем?»"
2300105-11 = "После той истории я кое-что поняла."
2300105-12 = "Готовить для тебя гору еды — неправильный подход."
2300105-13 = "Вместо этого я хочу приготовить что-то особенное."
2300105-14 = "Поэтому мне и нужны ингредиенты."
2300105-15 = "[s] «То есть „особенные“ ингредиенты?»"
2300105-16 = "Хи-хи. Придётся подождать и увидеть!"
2300105-19 = "[ns] «Рыбный рынок?»"
2300105-20 = "Добро пожаловать! Сегодня полно свежей рыбы!"
2300105-21 = "Ух ты. Скумбрия выглядит такой свежей, и ставрида тоже хороша!"
2300105-22 = "Сенсей! Сенсей! Посмотри на икру морского ежа!"
2300105-23 = "Она такая свежая, что можно прямо на рис насыпать и есть!"
2300105-24 = "[s] «Спокойнее, Фуука.»"
2300105-25 = "П-Прости. Увлеклась."
2300105-26 = "Свежие ингредиенты меня слишком заводят."
2300105-27 = "Стоит представить, в какие блюда они превратятся, и сердце начинает трепетать..."
2300105-28 = "Хаха... Наверное, я звучу странно, да?"
2300105-29 = "[s] «Нет. Это та Фуука, которую я знаю.»"
2300105-30 = "Хи-хи..."
2300105-31 = ""
2300105-32 = "О-о, эту атку-скумбрию было бы отлично пожарить на гриле."
2300105-33 = "Ого-го. У тебя хороший глаз, юная леди!"
2300105-34 = "Хахаха! Для жены это очень важное качество!"
2300105-35 = "Я? Ж-жены?"
2300105-36 = "[s1] «Мы не женаты. Она одна из моих студентов.»\n[s2] «Не стану отрицать, что из Фууки вышла бы отличная хозяйка.»"
2300105-37 = "Ахахаха! Пока что! Это детали, вы двое, детали."
2300105-38 = "Хорошо, когда рядом есть человек, на которого можно положиться, правда?"
2300105-39 = "С-Сенсей! Ты меня смущаешь!"
2300105-40 = "Так что привело вас сегодня, юная леди?"
2300105-41 = "Точно. У вас есть угорь?"
2300105-42 = "Угорь? Конечно!"
2300105-43 = "У нас лучший угорь во всём Кивотосе!"
2300105-44 = "[s] «Почему угорь...?»"
2300105-45 = "Говорят, угорь отлично восстанавливает силы."
2300105-46 = "Тебе ведь приходится работать столько ночей, Сенсей..."
2300105-47 = "...поэтому я подумала, что угорь идеально подойдёт для блюда специально для тебя!"
2300105-48 = "Так я лучше всего смогу тебя поддержать."
2300105-49 = "Какая заботливая юная леди. Не упускай такую."
2300105-50 = "Вот! Лучший угорь, который у нас есть!"
2300105-51 = "Большое спасибо!"
2300105-52 = "Но не думайте, что я переплачу только потому, что вы дали мне лучший товар."
2300105-53 = "Ого, а ты умеешь за себя постоять."
2300105-54 = "[s] «Подожди, Фуука. Что ты там говорила про восстановление сил...?»"
2300105-55 = "Посмотри на этого угря! Наверняка будет потрясающе вкусно!"
2300105-56 = "Хи-хи. Как бы его приготовить?"
2300105-57 = "Можно классически — подать на рисе. Или просто пожарить с солью!"
2300105-58 = "Глянь, как она загорелась. Что-то мне подсказывает, сегодня ночью тебе будет не до сна! Хахаха!"
2300105-59 = "Ой, нет-нет-нет. Сенсею тоже нужно нормально выспаться!"
2300105-60 = "Твоё здоровье на первом И на втором месте. Я ясно выразилась, Сенсей?"
2300105-61 = "Ха! Слышишь, как она предана тебе? Вот это настоящая любовь!"
2300105-62 = "Л-Любовь? Ох..."
2300105-64 = "На этом я решил промолчать, и вскоре мы ушли из магазина с несколькими угрями."
