[translation]
10024020-1 = "Эпизод 2;С сегодняшнего дня всё начинается"
10024020-2 = ""
10024020-6 = "Улица Риккагаку"
10024020-7 = "[ns] «Это здесь?»"
10024020-8 = ""
10024020-9 = "Да. Риккагаку — место, где находится штаб Генрюмон."
10024020-10 = "Я давно здесь не была, но мало что изменилось..."
10024020-11 = "А. Сейчас станет шумно..."
10024020-12 = ""
10024020-16 = ""
10024020-17 = "Кто идёт? Стоять!"
10024020-18 = "Мы Президент Руми и Рэйдзё с Променада Чёрной Черепахи. Мы привели Сенсея из Шале."
10024020-19 = "Сенсей хотел встретиться с Кисаки. Уверена, это можно устроить, верно?"
10024020-20 = "Не тебе ставить условия, черепаха! Н-но... это ТОТ Сенсей...?"
10024020-21 = "Без Сенсея, за которым можно спрятаться, сюда прийти духу не хватило? Так?"
10024020-22 = "Если ты так ставишь вопрос, наверное, да."
10024020-23 = "И что с того? Вы собираетесь отказать Сенсею?"
10024020-24 = "Представьте заголовки, Президент. «Генрюмон Шаньхайцзина выставила Сенсея из Шале за дверь!»"
10024020-25 = "Генрюмон прославится на весь Кивотос!"
10024020-26 = "[s] «Это хорошо или...?»"
10024020-27 = "Без понятия."
10024020-28 = "Но это же ты сказала!"
10024020-29 = "Ой, это была моя реплика. Я здесь вообще-то должна быть «нормальной» в дуэте с Рэйдзё!"
10024020-30 = "Это не комедийный номер!!"
10024020-31 = "[s] «В лю-ю-юбом случае... Пожалуйста, сообщите вашему президенту, что я здесь.»"
10024020-32 = "К-кхм. Ждите здесь. Я передам сообщение."
10024020-33 = ""
10024020-35 = ""
10024020-36 = ""
10024020-37 = "По-моему, всё прошло неплохо."
10024020-38 = "Ага! Сенсей умеет добиваться своего."
10024020-39 = "[s] «В Шаньхайцзине и правда интересно...»"
10024020-40 = "Привыкаешь. Приходится, если хочешь вести здесь бизнес."
10024020-42 = ""
10024020-48 = ""
10024020-49 = "Ну как вам пока, Сенсей?"
10024020-50 = "[s1] «Тут чуть больше тайных интриг, чем я привык...»\n[s2] «У меня чувство, будто я попал в фильм про мафию.»"
10024020-53 = "Не так уж вы и далеки от истины."
10024020-54 = "Кисаки... Она совсем не изменилась."
10024020-55 = ""
10024020-57 = ""
10024020-58 = ""
10024020-61 = ""
10024020-62 = "Президент идёт!"
10024020-63 = "Президент идёт!"
10024020-64 = ""
10024020-66 = ""
10024020-68 = ""
10024020-69 = "..."
10024020-70 = "Я слышала о вас, Сенсей."
10024020-71 = "Рада наконец встретиться. Жаль лишь, что обстоятельства такие."
10024020-72 = "[s] «А... Как мне вас называть? Просто „Кисаки“?»"
10024020-73 = "Следите за языком! Мне всё равно, что вы из Шале!"
10024020-74 = "Да! Следите за манерами!"
10024020-75 = "Довольно. Сенсей проделал долгий путь, чтобы встретиться с нами. Можно сделать исключение."
10024020-76 = "Д-да, госпожа!"
10024020-77 = "Простите нас! Мы забыли своё место!"
10024020-78 = "Говорят, Сенсей из Шале — непредсказуемая пушка. Хитрый кукловод..."
10024020-79 = "...который сокрушает всё... ВСЁ... что встаёт у него на пути."
10024020-80 = ""
10024020-83 = "[ns] «Кто вообще вам это наговорил?!»"
10024020-84 = "Не волнуйтесь. Теперь, когда мы встретились, ясно, что эти истории были преувеличением."
10024020-85 = "Вы больше похожи на человека, которого постоянно обманом заставляют делать чужую работу."
10024020-86 = "[s] «Мне больше нравилось, когда вы считали меня кукловодом...»"
10024020-87 = "Возможно, я ошибаюсь. Никогда не знаешь, что происходит у человека в голове."
10024020-88 = "Буду рада узнать, какой вы человек на самом деле."
10024020-89 = ""
10024020-91 = ""
10024020-93 = ""
10024020-94 = "Позвольте представить моего исполнительного офицера, Мину. Она возглавляет операции Генрюмон и служит моей личной охраной."
10024020-95 = "..."
10024020-97 = "..."
10024020-99 = "Пожалуй, нам стоит перейти к делу."
10024020-100 = "Вы здесь из-за десятитысячелетнего женьшеня, который контрабандой вывозят за пределы Шаньхайцзина."
10024020-101 = "[s] «Променад Чёрной Черепахи обвиняют, но мне интересно, есть ли у вас реальные доказательства.»"
10024020-102 = "Покажите им."
10024020-103 = ""
10024020-105 = ""
10024020-107 = ""
10024020-111 = "Это...?"
10024020-112 = "Разумеется, вы это узнаёте."
10024020-113 = "Да... Все ингредиенты Променада Чёрной Черепахи доставляют в таких коробках."
10024020-114 = "Президент...!"
10024020-115 = "Вы просили доказательства. Я с удовольствием их предоставлю."
10024020-116 = "Десятитысячелетний женьшень редок даже в Шаньхайцзине. Никто не может собирать его без нашего разрешения."
10024020-117 = "Чтобы столь редкий продукт отправляли за пределы Шаньхайцзина без нашего прямого разрешения... Немыслимо."
10024020-118 = "Генрюмон не может оставить это безнаказанным. Променад Чёрной Черепахи должен ответить."
10024020-120 = ""
10024020-122 = ""
10024020-123 = "Послушайте — и я не пытаюсь хвастаться — на Променаде Чёрной Черепахи ничего не происходит без моего ведома."
10024020-124 = "И я не слышала ни единого намёка, что кто-то имеет дело с десятитысячелетним женьшенем."
10024020-125 = "Клянусь, если кто-то на Променаде занимался чем-то незаконным..."
10024020-126 = "...я сама бы их собрала и сдала властям."
10024020-127 = ""
10024020-129 = ""
10024020-130 = "Это всё, что вы можете сказать в своё оправдание? Какая жалость."
10024020-131 = "Генрюмон представила конкретные доказательства. В ответ вы предложили лишь пустые слова."
10024020-132 = "[s3] «Если честно, вы немного загнали их в угол.»\n[s4] «В ваших словах есть смысл, но, может, стоит дать им немного времени?»"
10024020-135 = ""
10024020-137 = ""
10024020-138 = ""
10024020-140 = ""
10024020-141 = "Разве мы уже не наслушались, госпожа?"
10024020-142 = "Да! Променад Чёрной Черепахи и так печально известен тем, что плюёт на традиции своей кухней!"
10024020-143 = "Нет сомнений, они использовали десятитысячелетний женьшень в своих блюдах!"
10024020-144 = "Они угрожают самому нашему образу жизни!"
10024020-145 = "У них нет таких ценностей, как у нас. Они вполне способны на такое!"
10024020-146 = "На колени и просите пощады, Променад Чёрной Черепахи!"
10024020-147 = ""
10024020-149 = ""
10024020-150 = ""
10024020-151 = "Ха-ха-ха... Не стану отрицать, наш подход к кухне может быть... нестандартным..."
10024020-152 = "Но без небольшого риска успеха не добиться."
10024020-153 = "Если никогда не выходить за рамки, в итоге станешь тупицей, неспособной думать самостоятельно."
10024020-154 = "Довольно. Я не потерплю здесь бессмысленных насмешек."
10024020-155 = "Мы выдвинули обвинение против Променада Чёрной Черепахи. Будет справедливо выслушать их возражения."
10024020-157 = "Вы слишком снисходительны, госпожа!"
10024020-158 = "Мы знаем, что это они! Они контрабандой вывезли десятитысячелетний женьшень!"
10024020-160 = "Каждый студент Шаньхайцзина может свободно высказываться здесь... пока это не вредит нашей академии."
10024020-161 = "Но Променад Чёрной Черепахи прямо сейчас вредит Шаньхайцзину!"
10024020-162 = "Есть разница между бездумными насмешками и реальным вредом."
10024020-163 = ""
10024020-165 = ""
10024020-167 = "Мы не можем игнорировать доказательства против вашей организации, Президент Руми. Знайте, мы следим за вами."
10024020-168 = "Однако требовать от вас доказательств невиновности, не дав времени подготовить дело, было бы бессмысленно."
10024020-170 = "Поэтому я дам Променаду Чёрной Черепахи короткий льготный срок."
10024020-171 = "Если найдёте доказательства, способные убедить меня в вашей невиновности, я пересмотрю санкции против вас."
10024020-173 = "Но помните одно. Если ситуация ухудшится..."
10024020-174 = "Генрюмон без колебаний прекратит деятельность Променада Чёрной Черепахи."
10024020-175 = "Такова воля Рюгэ Кисаки, Президента Генрюмон."
10024020-177 = "Не так быстро, госпожа! Это несправедливо...!"
10024020-178 = "Хватит, Рэйдзё. Что бы мы ни говорили, это действительно коробки Променада Чёрной Черепахи."
10024020-179 = "Мы обе знаем, что Променад невиновен, значит, нам просто придётся это доказать... поймав настоящего виновника."
10024020-181 = "Вас это устроит, госпожа Кисаки?"
10024020-182 = "Не возражаю, Президент Руми."
10024020-184 = ""
10024020-187 = "[ns] «С чего начнём?»"
10024020-188 = ""
10024020-189 = "Первым делом нам нужно узнать больше о десятитысячелетнем женьшене..."
10024020-190 = ""
10024020-194 = ""
10024020-195 = "Стоять, черепаха!"
10024020-196 = "Сенсей, за мной!"
10024020-197 = "Не думайте, что мы просто позволим вам уйти!"
10024020-198 = "Госпожа Кисаки слишком снисходительна...!"
10024020-199 = "Но я точно не позволю главному подозреваемому просто взять и уйти отсюда!"
10024020-200 = "Я арестую вас, пока мы ищем более весомые доказательства!"
10024020-201 = "Основания для ареста звучат довольно шатко."
10024020-202 = "Мне не нужны основания, чтобы разобраться с преступниками вроде вас!"
10024020-204 = "Все, в атаку!"
10024020-205 = ""
10024020-209 = ""
10024020-210 = ""
10024020-212 = "Пригнитесь, Сенсей!"
10024020-213 = "Сенсей, правда, что вы тактический гений, который всегда приводит своих студентов к победе?"
10024020-214 = "[s] «Кто продолжает рассказывать обо мне эти истории...?»"
10024020-215 = "Ха-ха-ха! Забавно, какие странные слухи начинают ходить о тебе, когда занимаешь влиятельное положение..."
10024020-216 = "Слухи это или нет, я с нетерпением жду, что вы покажете, Сенсей."
