[translation]
2300602-1 = "Идол Момоёдо!"
2300602-2 = "Я направлялся в Момоёдо, чайный домик в районе Хяккияко, когда получил сообщение от Шизуко."
2300602-4 = ""
2300602-5 = "О, Сенсей!"
2300602-6 = "Хи-хи. Ой! То есть...!"
2300602-7 = ""
2300602-8 = "Добро пожаловать, господин!"
2300602-9 = "[s] «Эм, ага... Я уже здесь.»"
2300602-10 = "Вы выглядите удивлённым. По традиции нашего заведения мы обращаемся к посетителям «господин»."
2300602-11 = "Почему бы вам не заказать что-нибудь из меню?"
2300602-12 = "Я рекомендую клубничный анмицу."
2300602-13 = "Но и все остальные наши традиционные десерты ничуть не менее вкусные!"
2300602-14 = "[s1] «Тогда я возьму клубничные моти...»\n[s2] «Последую твоему совету. Один клубничный анмицу.»"
2300602-15 = "Хорошо! Сейчас принесу!"
2300602-16 = "Хорошо! Сейчас принесу!"
2300602-17 = ""
2300602-19 = "(В заведении много людей, возможно, из-за мероприятия Момоёдо.)"
2300602-20 = "(Но Шизуко всё равно умудряется сиять среди толпы.)"
2300602-21 = "Вот ваш заказанный набор с клубничной булочкой с красной фасолью!"
2300602-22 = "Как ты рекомендуешь это есть, Шизуко?"
2300602-23 = "О! Я знаю особый способ!"
2300602-24 = "Если сделать глоток чая одновременно с кусочком булочки с красной фасолью..."
2300602-25 = "...горечь чая и сладость фасоли образуют великолепное сочетание! Хи-хи."
2300602-26 = "У-Уа!"
2300602-27 = "Шизуко такая милая!"
2300602-29 = "Вот ваш заказанный набор клубничных моти!"
2300602-30 = "А? Это не то, что я заказывал."
2300602-31 = "Да, я заказывал рисовые сладости, но это яцухаси..."
2300602-32 = "А?"
2300602-33 = "Ой...! П-простите меня, господин!"
2300602-34 = "Должно быть, я ошиблась."
2300602-35 = "Сейчас всё принесу!"
2300602-36 = "Хе-хе."
2300602-37 = "Вот оно! Один из знаменитых рассеянных моментов Шизуко!"
2300602-38 = "Этот обеспокоенный взгляд, щёки, покрасневшие от смущения..."
2300602-39 = "Ты такая очаровательная."
2300602-40 = "П-перестань. Не дразни меня..."
2300602-42 = "(Похоже, маленькие ошибки Шизуко очень нравятся публике.)"
2300602-43 = "(Должно быть, гости пришли сюда ради Шизуко, а не ради сладостей.)"
2300602-44 = "[s] «Дела явно идут в гору.»"
2300602-45 = "(Спустя неопределённое количество времени...)"
2300602-46 = ""
2300602-47 = "Спасибо за ожидание, господин!"
2300602-48 = "Вот ваш заказ!"
2300602-49 = "Клубничный мандзю! Роскошная версия!"
2300602-50 = "[s3] «А? Но я заказывал клубничные моти.»\n[s4] «А? Но я заказывал клубничный анмицу.»"
2300602-51 = "А, я снова ошиблась!"
2300602-52 = "А, я снова ошиблась!"
2300602-53 = "П-простите меня, господин! Я принесу именно то, что вы заказывали..."
2300602-54 = ""
2300602-55 = "[s] «Всё нормально. Я тоже люблю мандзю.»"
2300602-56 = "...!"
2300602-57 = "Это все данные, которые удалось получить."
2300602-58 = "[s] Кивнуть."
2300602-59 = "Х-хорошо, тогда я сейчас вернусь со следующей частью вашего заказа!"
2300602-61 = "О, господин! П-пожалуйста, отойдите с дороги! Я иду!"
2300602-62 = ""
2300602-63 = "Т-так быстро!"
2300602-64 = "[s] «Ты в порядке, Шизуко?»"
2300602-65 = "Д-да, я в порядке!"
2300602-66 = "Я-я принесу ваш следующий заказ..."
2300602-68 = "Ах! Глупая Шизуко! Хватит всё портить!"
2300602-69 = "Сенсей — то есть, Господин, — я случайно добавила острый соус в напиток, который приготовила для вас!"
2300602-70 = "[s] «Как вообще можно сделать такое случайно?!»"
2300602-71 = "В-вы всё ещё хотите его, Сенсей? (подглядывает)"
2300602-72 = "[s5] «Даже у меня есть предел.»\n[s6] «Без остроты нельзя!»"
2300602-73 = "Ах! Шизуко, ну и растяпа же ты!"
2300602-74 = "Я такая неуклюжая. Не могу поверить, что так облажалась!"
2300602-75 = "[s7] «Ничего страшного. Я просто закажу ещё раз.»"
2300602-76 = "И всё?!"
2300602-77 = ""
2300602-78 = "Вы выпили всё залпом?!"
2300602-79 = "[s8] «Ух, вот это жжёт! Давай ещё один!»"
2300602-80 = "Вы хотите ещё один?!"
2300602-81 = "..."
2300602-82 = "А-а-а. Я больше не могу!"
2300602-83 = "Идёмте со мной, Сенсей!"
2300602-86 = "(Шизуко утащила меня в тихий уголок Момоёдо.)"
2300602-87 = "Что вы вообще творите, Сенсей?!"
2300602-88 = "[s9] «Я как раз хотел спросить тебя о том же.»\n[s10] «Что ТЫ творишь, Шизуко?»"
2300602-89 = "В каком смысле? Я просто..."
2300602-90 = "В каком смысле? Я просто..."
2300602-91 = "Я же растяпа из Момоёдо! Все это знают."
2300602-92 = "Я ведь уже говорила вам об этом в MomoTalk."
2300602-93 = "Помните? Обслуживание высшего класса?"
2300602-94 = "[s] «Ты имела в виду изображать растяпу?»"
2300602-95 = "Именно! Посетителям это ужасно нравится."
2300602-96 = "Это мой образ, и они его обожают."
2300602-97 = "[s11] «Теперь понятно.»\n[s12] «...»"
2300602-98 = "Что это ещё за реакция?!"
2300602-99 = "Вам больше нечего сказать?!"
2300602-100 = "В любом случае! Посетители называют меня идолом Момоёдо!"
2300602-101 = "Им кажутся очаровательными мои ошибки, а мне нравится видеть их улыбки."
2300602-102 = "Выгодно всем!"
2300602-103 = "Так почему на вас это не действует?!"
2300602-104 = ""
2300602-105 = "Я всю ночь репетировала, чтобы сегодня вас рассмешить! Я так старалась!"
2300602-106 = "[s] «Так всё это было отрепетировано...?»"
2300602-108 = "[s13] «Не нужно так стараться. Ты и без того очаровательная.»\n[s14] «Куда уж милее, чем ты есть.»"
2300602-109 = ""
2300602-110 = ""
2300602-111 = ""
2300602-112 = "..."
2300602-113 = "А-а-а! К-как вы можете говорить такое настолько невозмутимо?!"
2300602-114 = "Вы просто хотите, чтобы я вела себя естественно, Сенсей?!"
2300602-115 = "Чтобы я просто была собой?!"
2300602-116 = "*вздох* Рядом с вами моя настоящая натура и правда проявляется сильнее."
2300602-117 = "Сейчас я точно не притворяюсь..."
2300602-118 = "[s] «Мне нравятся все твои стороны.»"
2300602-119 = "Вы правда так думаете...?"
2300602-120 = "Я даже не знаю, что сказать."
2300602-122 = "(После этого настроение Шизуко улучшилось, и она угостила меня множеством традиционных сладостей за счёт заведения.)"
