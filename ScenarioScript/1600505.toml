[translation]
1600505-1 = "Летняя лестница к океану"
1600505-3 = ""
1600505-4 = "Я пришёл на пляж и увидел Цуруги, сидящую на песке."
1600505-5 = "В отличие от прошлого раза, она почти не двигалась и не оглядывалась, просто смотрела на воду."
1600505-6 = "[s1] «Цуруги?»\n[s2] «На что ты смотришь?»"
1600505-7 = "...?"
1600505-8 = "...?"
1600505-9 = "*вздрогнула*?!"
1600505-10 = "С-Сенсей. Что ты здесь делаешь?"
1600505-11 = "Мой MomoTalk? Ты пришёл, потому что переживал?"
1600505-12 = "Я-Я имею в виду... ничего больше за моими словами не было."
1600505-13 = "Прости, если заставила тебя волноваться."
1600505-14 = "Даже если ты говоришь, что всё в порядке, я всё равно..."
1600505-15 = "А? Что я здесь делаю?"
1600505-16 = "Эм..."
1600505-17 = "..."
1600505-18 = "Я и сама толком не знаю. Я ничем особенным не занималась."
1600505-19 = "Я просто..."
1600505-20 = "Я просто сидела здесь и смотрела на воду. Не знаю почему."
1600505-21 = "Интересно, почему..."
1600505-22 = "Может, потому что всё не такое, как я себе представляла."
1600505-23 = "Вокруг нет отдыхающих, нигде ни веселья, ни какой-то суеты. Только я совсем одна."
1600505-24 = "Может, то, что я чувствую, это... тоскливое сожаление?"
1600505-25 = "А?"
1600505-26 = "Ты ожидал не этого?"
1600505-27 = "Ну, наверное, я сама не могу понять, какое впечатление произвожу на других, так что... Кехехе."
1600505-28 = "Кеке, кехехе..."
1600505-29 = "[s3] «Может, неважно, что твой отдых на пляже не такой, как у других.»\n[s4] «По-моему, тебе всё равно было весело.»"
1600505-30 = "Правда? Не уверена, что это так, но... хорошо."
1600505-31 = "Правда? Не уверена, что это так, но... хорошо."
1600505-32 = "Я хочу сказать, что с тех пор, как приехала сюда, я точно чувствовала себя иначе, чем в Тринити."
1600505-33 = "Но всё равно очень многое не оправдало моих ожиданий."
1600505-34 = "И я начала сомневаться. Всё ли было нормально? Может, я что-то делала неправильно?"
1600505-35 = "[s5] «В первый раз всё никогда не бывает именно таким, как люди себе представляют.»\n[s6] «Но, по-моему, ты выглядишь вполне довольной, Цуруги.»"
1600505-36 = "О. Хорошо..."
1600505-37 = "О. Хорошо..."
1600505-38 = "Может, ты и прав."
1600505-39 = "Поначалу всё и правда казалось таким непривычным..."
1600505-40 = "...но теперь, когда я об этом думаю, наверное, было ещё и весело."
1600505-41 = "..."
1600505-42 = "Кеке, хи-хи..."
1600505-43 = "Значит, так и есть. Да, думаю, ты был прав."
1600505-44 = "Кажется, ты всегда всё знаешь, Сенсей. Сама я бы никогда до этого не додумалась."
1600505-45 = "Похоже, я зря переживала. Наверное, я всё делала нормально."
1600505-46 = "Я ведь сделала много такого, чего не смогла бы сделать где-нибудь ещё, например поиграла с тобой..."
1600505-47 = "[s7] «Было довольно весело.»\n[s8] «(Наверное, веселье зависит от того, как к нему относиться.)»"
1600505-48 = "Кеке..."
1600505-49 = "Кеке..."
1600505-50 = "Точно."
1600505-51 = "От всего сердца..."
1600505-52 = ""
1600505-53 = ""
1600505-54 = "...спасибо тебе, Сенсей."
1600505-56 = "Спасибо, что привёл меня сюда."
1600505-57 = "На пляж."
