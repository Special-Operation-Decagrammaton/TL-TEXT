[translation]
31130-1 = "Episódio 13;O Simulado do Clube de Aulas de Reforço"
31130-3 = "Bom dia!"
31130-4 = "Bom dia, Azusa-chan. Cheia de energia logo cedo, hein? ♡"
31130-5 = "Sim, porque é o começo de um novo dia."
31130-6 = "Vamos, levantem logo. Escovar os dentes, tomar banho e depois trocar de roupa. Vamos executar tudo em ordem."
31130-7 = "Auuh... Azusa-chan... Dez minutos... Só mais dez minutinhos..."
31130-8 = "Hmm... Já é de manhã...?"
31130-9 = "Hifumi, Koharu, acordem. Vocês precisam levantar logo."
31130-10 = "Hmmmm..."
31130-15 = "Hm... Eu já tô acordada..."
31130-16 = "Parece que a Hifumi-chan vai demorar mais um pouquinho. Pelo visto, ela ficou acordada até tarde ontem..."
31130-17 = "...Como ela é a presidente do Clube de Aulas de Reforço, deve estar sofrendo pressão psicológica também. Vamos deixá-la descansar só mais um pouco."
31130-18 = "Hm... Ué, onde... Por que eu tô..."
31130-19 = "Bom dia, Koharu. Vamos começar os preparativos matinais."
31130-20 = "...? Hm, quê...?"
31130-21 = "Os chuveiros ficam por aqui. Vem."
31130-22 = "...Quê? Como assim, por quê...?"
31130-27 = "Ora, ora, as duas vão lavar as costas uma da outra bem juntinhas?"
31130-28 = "Uaaaah!? P-Por quê!? Ei, espera, não tira a minha roupa!? Hyaah, uééé!?"
31130-29 = "Tá gelada...!? Ah, qual é, espera aí...! Nngh, entrou xampu no meu olho...!!"
31130-30 = "Que maravilha, hein? Amizade sem roupas ♡"
31130-32 = "Alojamento - Sala de Aula"
31130-33 = "Desculpem a demora! Bom, vamos começar?"
31130-34 = "Siiim~ ♡"
31130-35 = "Sim."
31130-36 = "Uuh... Ela viu tudo... Não dá mais pra mim..."
31130-37 = "Você também me viu pelada, Koharu, então não há problema algum."
31130-38 = "O problema não é esse! Tirar a roupa de alguém à força daquele jeito... Fazer essas coisas à força é proibido!"
31130-39 = "Então, da próxima vez, que tal eu lavar o corpinho da Koharu-chan?"
31130-40 = "Hãã!? N-Não! Você é a única que eu não quero de jeito nenhum!"
31130-45 = "É-Ér..."
31130-46 = "[s] \"Hifumi, seu cabelo está meio arrepiado aqui.\""
31130-47 = "A-Ah, muito obrigada. É que eu acabei dormindo um pouco demais..."
31130-48 = "D-Digo, não é isso!"
31130-49 = "Pessoal, atenção aqui, por favor!"
31130-51 = "...?"
31130-53 = "...Hoje é o primeiro e importantíssimo dia do nosso acampamento de estudos do Clube de Aulas de Reforço!"
31130-54 = "Estamos em uma situação bem difícil e é fácil acabar entrando em pânico, mas..."
31130-55 = "Não precisamos complicar as coisas!"
31130-56 = "Passar na 2ª Prova Especial de Aptidão Acadêmica daqui a uma semana: é só isso que importa!"
31130-57 = "Isso mesmo."
31130-58 = "Pois é."
31130-59 = "..."
31130-61 = "Sendo assim..."
31130-66 = "Vamos fazer um simulado agora mesmo!"
31130-67 = "...Um simulado?"
31130-68 = "Entendo...?"
31130-69 = "U-Uma prova assim do nada!? Por quê!?"
31130-70 = "Estudar às cegas não é nada eficiente."
31130-71 = "Para alcançarmos nosso objetivo com firmeza, primeiro precisamos entender o que já sabemos fazer, o que não sabemos e em que nível estamos agora!"
31130-72 = "Por isso, ontem à noite eu preparei isto aqui!"
31130-76 = "São as questões das provas aplicadas em Trinity no ano passado, junto com o gabarito! Ainda está meio incompleto, quer dizer, só consegui reunir uma parte, mas..."
31130-77 = "O Sensei também me ajudou até tarde ontem... e conseguimos montar um pequeno simulado pensando na 2ª Prova Especial de Aptidão Acadêmica!"
31130-78 = "O tempo de prova é de 60 minutos, e a nota de corte é de 60 pontos de um total de 100. Ou seja, igualzinho à prova de verdade."
31130-79 = "Vamos lá, primeiro tentem resolver isto!"
31130-81 = "1º Simulado do Clube de Aulas de Reforço"
31130-82 = "[s] \"Todo mundo pronto?\""
31130-85 = "[ns] \"Então... podem começar a prova!\""
31130-89 = "..."
31130-92 = "Ora, essa questão... ♡"
31130-95 = "Sinto que já vi isso em algum lugar... ou talvez não tenha visto..."
31130-99 = "(Vamos dar o nosso melhor, pessoal...!)"
31130-105 = "O simulado terminou e todas as provas foram corrigidas."
31130-106 = "Bom, Sensei, anuncie os resultados, por favor!"
31130-108 = "Resultados do 1º Simulado do Clube de Aulas de Reforço —"
31130-110 = "Hanako — 4 pontos [FF6666](Reprovada)[-]"
31130-112 = "Azusa — 33 pontos [FF6666](Reprovada)[-]"
31130-114 = "Koharu — 15 pontos [FF6666](Reprovada)[-]"
31130-116 = "Hifumi — 68 pontos [007eff](Aprovada)[-]"
31130-118 = "...Entendo."
31130-119 = "...Hã?"
31130-120 = "Ora, veja só."
31130-121 = "..."
31130-125 = "Essa é a nossa realidade atual. Se continuarmos assim, não haverá um futuro brilhante pela frente..."
31130-130 = "Para que todas nós consigamos passar dos 60 pontos daqui a uma semana, precisamos usar o tempo restante de forma eficiente!"
31130-131 = "Por isso! Primeiro, como tanto a Koharu-chan quanto a Azusa-chan farão a prova do 1º ano..."
31130-136 = "Eu e a Hanako-chan vamos ajudar vocês duas com a matéria! Hanako-chan, não sei o que aconteceu recentemente, mas você tirava notas altas nas provas quando estava no 1º ano, não é?"
31130-137 = "Ora...? Ér, bom, sim..."
31130-138 = "Na verdade, ér... eu acabei encontrando as suas folhas de respostas do 1º ano, Hanako-chan... Então, quanto ao seu caso, mais tarde eu e o Sensei vamos entender direitinho o motivo de você ter chegado a essa situação atual e buscar uma solução juntos!"
31130-142 = "Ainda estão pela metade, mas estou preparando outras provas também, então pretendo aplicar simulados regularmente a partir de hoje para acompanharmos o nosso progresso."
31130-143 = "..."
31130-144 = "Essa provavelmente é a melhor escolha que podemos fazer agora..."
31130-145 = "Vamos dar o nosso melhor! Tenho certeza de que, se nos esforçarmos, daremos um jeito de passar todas juntas...!"
31130-146 = "[s] (Hifumi...!)"
31130-149 = "(Já que o Sensei me disse aquilo, eu também não posso ficar só me preocupando de braços cruzados. Vou fazer tudo o que estiver ao meu alcance...!)"
31130-151 = "...Sim, entendido. Seguirei as instruções."
31130-152 = "E-Entendi..."
31130-153 = "Hifumi-chan... você é incrível. Preparou tudo isso só na noite passada..."
31130-154 = "A-Ah, que nada, o Sensei também me ajudou..."
31130-155 = "Entendo, o Sensei ajudou."
31130-156 = "[s] \"Eu não fiz nada de mais, isso é fruto do esforço da Hifumi.\""
31130-157 = "E não é só isso! Eu até preparei uma recompensa!"
31130-158 = "Deixa eu ver..."
31130-160 = "(Mexe, remexe...)"
31130-164 = "Aqui está! Quem conseguir tirar boas notas vai ganhar de presente estes produtos dos \"Momo Friends\"!"
31130-165 = "Momo Friends...?"
31130-166 = "...Que isso?"
31130-167 = "...!!"
31130-168 = "U-Ué...? São os famosos \"Momo Friends\", que estão super na moda ultimamente... Por acaso vocês não conhecem...?"
31130-169 = "É a primeira vez que vejo... quer dizer, acho que já vi de relance em algum lugar...?"
31130-170 = "Quêêê!?"
31130-171 = "O que é isso, que bicho esquisito... É um porco? Ou um hipopótamo...?"
31130-172 = "N-Não é nada disso! O Peroro-sama é um pássaro! Olhem só estas asas magníficas! E este bico imponente!"
31130-173 = "...Os olhos dele dão medo. Além disso, o nome também soa meio indecente..."
31130-174 = "Quêêê...!? B-Bom, é verdade que algumas pessoas dizem isso, mas... o-olhem bem de pertinho. Quando você observa com calma, ele fica meio fofo—"
31130-175 = "Ah, lembrei. Agora que você falou, a bolsa e a capinha de celular da Hifumi-chan são desse personagem, né?"
31130-176 = "Se não me engano, é aquele personagem que fica com a língua de fora babando enquanto chora e implora \"Me perdoa, não aguento mais...!\", não é...?"
31130-177 = "Q-Quê!? Não, essa segunda parte está completamente errada em vários sentidos!?"
31130-178 = "...E-Eu não quero."
31130-179 = "Auuh..."
31130-180 = "..."
31130-181 = "A-Azusa-chan...?"
31130-182 = "...Fo..."
31130-183 = "...Fo?"
31130-185 = "Que fofo...!!!"
31130-186 = "!!?"
31130-187 = "!?"
31130-188 = "Ora...?"
31130-190 = "É-É fofo demais...! O que é isto? Que criatura redonda e fofinha é esta...!!"
31130-191 = "Esses olhos, uma expressão indecifrável... Não dá para saber o que ele está pensando de jeito nenhum...!"
31130-192 = "A-Azusa-chan...?"
31130-193 = "Não esperava menos de você, Azusa-chan! Você percebeu a fofura do Peroro-sama! Isso mesmo! É exatamente esse o charme dele!"
31130-194 = "Mentira...!?"
31130-195 = "E-E este aqui? Este comprido? É uma salamandra... não, uma girafa? Parece que se enrolar no pescoço deve ficar bem quentinho...!"
31130-196 = "Esse é o Wave Cat-san! Ele é um gato que está sempre dançando e fazendo a onda com o corpo, e como você bem disse, recentemente lançaram um travesseiro de pescoço dele..."
31130-197 = "E este? Quem é este pequenininho?"
31130-198 = "Esse é o Mr. Nicolai-san! Ele vive dizendo coisas filosóficas e todo mundo acaba olhando para ele com uma cara estranha!"
31130-199 = "Inclusive, como uma das recompensas desta vez, também trouxe a primeira edição do livro \"Além do Bem e do Mal\", escrito pelo próprio Nicolai-san!"
31130-200 = "Incrível, incrível...!! Eu posso mesmo ganhar isso? N-Não me diga que eu posso até escolher?"
31130-201 = "Sim! Pode levar o que você mais quiser, Azusa-chan!"
31130-206 = "Ora, ora..."
31130-207 = "Q-Que loucura é essa..."
31130-209 = "...Não há outra escolha. Vou dar tudo de mim."
31130-213 = "Excelente gestão de motivação, Hifumi. Eu prometo: cumprirei a missão custe o que custar e conquistarei aquele animal misterioso e fofinho!"
31130-218 = "S-Sim! Vamos com tudo!"
31130-222 = "Ehe, ehehehehehe..."
31130-226 = "Ora, a Hifumi-chan parece tão feliz... quer dizer, ela está até com a mesma expressão do bonequinho... ♡"
31130-227 = "[s] \"Será que ela está feliz por ter conseguido uma colega fã de Momo Friends...?\""
31130-228 = "Hããã..."
31130-230 = "Próximo;A Vice-Presidente do Comitê de Justiça (1)"
