[translation]
31130-1 = "Эпизод 13;Первый пробный экзамен"
31130-3 = "Доброе утро!"
31130-4 = "Доброе утро, Азуса! Сегодня ты бодренькая. ♥"
31130-5 = "Конечно. Важно хорошо начать день."
31130-6 = "Не будем тратить время. Нужно почистить зубы, принять душ и переодеться в свежую форму."
31130-7 = "Ух, Азуса... Ещё десять минут."
31130-8 = "М-м-м... Уже утро?"
31130-9 = "Давайте, Хифуми. Кохару. Пора вставать."
31130-10 = "Ух... Ладно."
31130-11 = ""
31130-13 = ""
31130-15 = "Я уже встала..."
31130-16 = "Кажется, у нашей маленькой Хифуми была долгая ночь. Ей, возможно, понадобится время, чтобы встать."
31130-17 = "Это может быть умственная усталость из-за обязанностей президента клуба. Может, дадим ей поспать подольше?"
31130-18 = "П-Подождите. Где я? Как я сюда попала?"
31130-19 = "Доброе утро, Кохару. Сегодня мы отвечаем за завтрак, так что нужно поспешить."
31130-20 = "Погодите, что?"
31130-21 = "Душевые здесь. Я помогу тебе помыться, так что иди за мной."
31130-22 = "П-Погоди секунду. Почему...?"
31130-23 = ""
31130-25 = ""
31130-27 = "Ох. Похоже, они всё-таки станут банными подружками."
31130-28 = "Ч-Чего-о-о?! П-Подожди. Я сама могу! Не надо меня раздевать!"
31130-29 = "Х-Холодно! А-а-а! Шампунь в глаза попал!"
31130-30 = "Ах, сладкая близость. ♥"
31130-32 = "Класс дополнительного корпуса"
31130-33 = "Простите за ожидание. Все готовы начинать?"
31130-34 = "Я готова! ♥"
31130-35 = "Хм-м."
31130-36 = "*шмыг* Она всё увидела... Я раскрыта..."
31130-37 = "Я тоже была без одежды. Это стандартная процедура. В чём проблема?"
31130-38 = "Н-Не в этом дело! Ты неисправима! Ты вообще понимаешь, как обращаться с человеком помягче...?"
31130-39 = "Хочешь, в следующий раз я тебя помою, Кохару?"
31130-40 = "Это ещё хуже! Кто угодно, только не ты!"
31130-41 = ""
31130-43 = ""
31130-45 = "Девочки, успокойтесь..."
31130-46 = "[s] «У тебя ещё немного растрёпаны волосы, Хифуми.»"
31130-47 = "П-Пожалуйста, не напоминайте, как сильно я проспала."
31130-48 = "Неважно! Сейчас не это главное!"
31130-49 = "Мне нужно ваше внимание!"
31130-50 = ""
31130-51 = "..."
31130-53 = "Сегодня официально начинается учебный лагерь Клуба дополнительных занятий."
31130-54 = "Впереди долгий путь, и будет легко пасть духом..."
31130-55 = "...но подумайте! Мы знаем, что должны сделать!"
31130-56 = "Единственное решение — каждой из нас сдать экзамен на следующей неделе."
31130-57 = "Хм-м."
31130-58 = "Точно."
31130-59 = "Л-Ладно."
31130-61 = "..."
31130-62 = ""
31130-64 = ""
31130-65 = ""
31130-66 = "Поэтому прямо сейчас мы проведём пробный экзамен!"
31130-67 = "Пробный экзамен?"
31130-68 = "Ну, внезапно."
31130-69 = "Ещё бы! Зачем нам вообще это делать?!"
31130-70 = "Потому что на кону наше будущее."
31130-71 = "Нам нужно понять, на каком уровне каждая из нас, прежде чем начинать подготовку ко второму экзамену!"
31130-72 = "Поэтому прошлой ночью я подготовила вот это."
31130-73 = ""
31130-75 = ""
31130-76 = "Я составила собственный экзамен на основе прошлогодних вопросов и ключей ответов!"
31130-77 = "Сенсей помог достать их и вчера вечером подготовиться. Так мы поймём, сколько каждая набрала бы на настоящем экзамене прямо сейчас."
31130-78 = "У каждой один час. Максимум 100 баллов, проходной — 60. Всё как на настоящем экзамене."
31130-79 = "И я, конечно, буду писать вместе со всеми."
31130-81 = "Первый пробный экзамен Клуба дополнительных занятий"
31130-82 = "[s] «Все готовы? Кто закончит, может выйти.»"
31130-85 = "[ns] Начали!"
31130-89 = "..."
31130-92 = "О, это вызывает воспоминания. ♥"
31130-95 = "Гх... Я точно это уже видела."
31130-96 = ""
31130-99 = "(Вот так, девочки! Вы справитесь!)"
31130-100 = ""
31130-105 = "После экзамена я проверил все работы."
31130-106 = "Ладно, Сенсей, мы готовы. Объявляйте оценки."
31130-108 = "Результаты первого пробного экзамена Клуба дополнительных занятий"
31130-110 = "Ханако: 4 балла [FF6666](Провал)[-]"
31130-112 = "Азуса: 33 балла [FF6666](Провал)[-]"
31130-114 = "Кохару: 15 баллов [FF6666](Провал)[-]"
31130-116 = "Хифуми: 68 баллов [007eff](Сдано)[-]"
31130-118 = "Хм-м."
31130-119 = "..."
31130-120 = "Ну что ж."
31130-121 = "..."
31130-122 = ""
31130-124 = ""
31130-125 = "Я этого и боялась. Если ничего не изменить, всё выглядит плохо."
31130-126 = ""
31130-128 = ""
31130-130 = "Нам придётся учиться без остановки, если хотим, чтобы на следующей неделе каждая набрала хотя бы 60!"
31130-131 = "Кохару и Азуса сдают экзамен первого курса, поэтому я объединяю вас в пару."
31130-132 = ""
31130-134 = ""
31130-135 = ""
31130-136 = "Мы с Ханако будем вам помогать. У тебя ведь были хорошие оценки на первом курсе, Ханако?"
31130-137 = "Ну, были, но..."
31130-138 = "Не переживай. Мы с Сенсеем будем отслеживать оценки и разберёмся, почему у тебя трудности. Справимся вместе!"
31130-139 = ""
31130-141 = ""
31130-142 = "Хочу, чтобы дальше мы время от времени проводили такие пробные экзамены."
31130-143 = "..."
31130-144 = "Я не позволю нам провалиться. Мы сдадим."
31130-145 = "Цель у нас есть, так что продолжим стараться ради неё!"
31130-146 = "[s] «(Так держать, Хифуми!)»"
31130-147 = ""
31130-149 = "(Некогда сидеть и жалеть себя. Я должна это сделать! Вот как я могу помочь!)"
31130-151 = "Хорошо. Я последую твоему плану."
31130-152 = "Е-Если придётся."
31130-153 = "Удивительно, как быстро ты всё это для нас подготовила."
31130-154 = "Спасибо, но без Сенсея я бы не справилась."
31130-155 = "А, так и знала, что тут была ваша рука."
31130-156 = "[s] «Я не так уж много сделал.»"
31130-157 = "О, и я подготовила не только тяжёлую работу. За хорошие оценки на внезапных тестах будут призы."
31130-158 = "Посмотрим..."
31130-159 = ""
31130-160 = "*шуршание* *шуршание*"
31130-161 = ""
31130-164 = "Та-дам! Кто наберёт больше всех, получит мерч Momo Friends!"
31130-165 = "Друзья... Момо?"
31130-166 = "Плюшевые игрушки?"
31130-167 = "...!"
31130-168 = "Д-Да, сейчас они очень популярны. Наверняка вы их видели."
31130-169 = "Нет. Кажется, впервые."
31130-170 = "Что?!"
31130-171 = "А это кто вообще? Свинья? Бегемот?"
31130-172 = "Н-Нет! Пероро — птица! Смотри, вот крылья! И клюв!"
31130-173 = "Глаза у него раздражающие. И имя странное."
31130-174 = "Что?! Ну да, не всем обязан нравиться Пероро, но посмотри, сколько в нём милого..."
31130-175 = "О, теперь вспомнила. У тебя Пероро на сумке и чехле телефона, да?"
31130-176 = "Это тот, у которого язык наружу и слюни текут, будто он чего-то выпрашивает?"
31130-177 = "Что?! Пероро никогда такого не делал!"
31130-178 = "Тем более нужно запретить."
31130-179 = "Ну хватит так..."
31130-180 = "(Спокойно...)"
31130-181 = "Азуса?"
31130-182 = "Ми..."
31130-183 = "«Ми»?"
31130-185 = "Как мило!"
31130-186 = "...?!"
31130-187 = "...?!"
31130-188 = "Ну что ж!"
31130-190 = "Я никогда не видела ничего настолько милого! Что это за круглое и пушистое существо? Ты сказала, птица?"
31130-191 = "Его глаза... Я вообще не могу понять выражение! Неясно, о чём он думает, если вообще думает!"
31130-192 = "Азуса...? Ты начинаешь меня пугать."
31130-193 = "Бояться нечего! Она понимает, насколько Пероро милый! Это надо праздновать!"
31130-194 = "Что?!"
31130-195 = "А этого длинного как зовут? Саламандра...? Нет, может, жираф. Его будто можно носить как шарф!"
31130-196 = "Это Wavecat. Он всегда танцует волну. И недавно, кстати, появилась версия в виде подушки для шеи..."
31130-197 = "А это? Этот маленький?"
31130-198 = "Это мистер Николай! Его постоянно травят за философские речи!"
31130-199 = "У меня даже есть первое издание «По ту сторону добра и зла» Николая! Скажи, если захочешь потом почитать."
31130-200 = "Звучит потрясающе! И ты правда их отдаёшь? Можно выбирать?"
31130-201 = "Эм... да! Сможешь выбрать любую!"
31130-202 = ""
31130-204 = ""
31130-206 = "..."
31130-207 = "..."
31130-209 = "*вздох* Вы не оставляете мне выбора. С такими стимулами остаётся только получать высокие баллы."
31130-210 = ""
31130-212 = ""
31130-213 = "Поздравляю, Хифуми. Ты успешно мотивировала своего солдата. Я выполню миссию любой ценой, и эти странные пушистые существа перейдут под мою опеку."
31130-215 = ""
31130-217 = ""
31130-218 = "Буду болеть за тебя. Удачи!"
31130-219 = ""
31130-221 = ""
31130-222 = "Хи-хи."
31130-223 = ""
31130-225 = ""
31130-226 = "Не могу понять, кому сейчас веселее: Азусе или Хифуми. ♥"
31130-227 = "[s] «Похоже, Хифуми нашла новую лучшую подругу. Мило.»"
31130-228 = "Жутковато..."
31130-230 = "Следующий эпизод;Вице-президент Комитета правосудия, часть 1"
