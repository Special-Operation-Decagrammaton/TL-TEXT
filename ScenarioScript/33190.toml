[translation]
33190-1 = "Episódio 19;A Nossa História"
33190-4 = "Haa, haa..."
33190-5 = "Kuh..."
33190-10 = "...Por quê, Azusa?"
33190-11 = "Por que se debate até esse ponto? Que sentido há nisso? O que está tentando provar?"
33190-12 = "Lembre-se, tudo é—"
33190-16 = "...Mesmo que tudo seja em vão, eu decidi continuar lutando."
33190-17 = "Que sentido há nisso?!!"
33190-24 = "Guh...!!"
33190-30 = "...!?"
33190-31 = "..."
33190-32 = "Hifu... mi...?"
33190-34 = "Reforços, é...? São quatro... Não, tem ainda mais atrás..."
33190-35 = "Aquela é..."
33190-43 = "...Quem é você?"
33190-44 = "Sou apenas uma aluna comum de Trinity."
33190-45 = "Hifumi, não... Por que você veio para um lugar desses...?"
33190-46 = "Este não é um lugar onde uma pessoa comum como você deveria estar, Hifumi..."
33190-47 = "..."
33190-48 = "...Sim, é verdade que eu sou uma garota comum e sem nada de especial."
33190-49 = "Eu também entendi que aquela figura de máscara de gás que você me mostrou outro dia é a verdadeira Azusa-chan."
33190-50 = "E também entendi o que você queria dizer... que, na verdade, você vive em um mundo fora do alcance de alguém como eu."
33190-51 = "Hifumi...?"
33190-52 = "Mas!!!"
33190-53 = "Você está cometendo um grande engano, Azusa-chan!!!"
33190-54 = "...!?"
33190-55 = "Aqui e agora, vou mostrar a minha verdadeira face!!!"
33190-56 = "A minha verdadeira identidade é..."
33190-60 = "Faust, a líder da \"Gangue dos Maiôs Mascarados\"!!"
33190-62 = "...Hã?"
33190-63 = "Olhe só que aterrorizante! Mesmo ao seu lado, Azusa-chan, eu sou tão sinistra que não fico nem um pouco atrás, não é?! Aposto que tem gente que diria que eu sou ainda mais assustadora e temível!"
33190-64 = "H-Hifumi...?"
33190-66 = "..."
33190-67 = "...!?"
33190-68 = "..."
33190-70 = "Hifumi, o que diabos você está—"
33190-71 = "Por isso!!"
33190-75 = "Por isso, essa história de vivermos em mundos diferentes não existe!"
33190-76 = "..."
33190-77 = "Somos iguais! Podemos muito bem ficar lado a lado!"
33190-78 = "Então, por favor... não diga que vivemos em mundos diferentes ou que não podemos ficar juntas!"
33190-79 = "Mesmo que você me rejeite, eu vou correr para bem pertinho de você! Eu...!"
33190-80 = "...Eu vou ficar ao seu lado, Azusa-chan!"
33190-81 = "Bem assim, onde eu possa te alcançar na mesma hora...!"
33190-82 = "Hifumi..."
33190-83 = "Mas, mesmo que você conte uma mentira dessas por minha causa..."
33190-84 = "Quem disse que é mentira?!"
33190-91 = "Olha só~, parece que chegamos num momento bem importante, né?"
33190-93 = "Essas máscaras... não pode ser...?!"
33190-94 = "!?"
33190-95 = "...!?"
33190-99 = "Olho por olho, dente por dente. Impiedosas e soberanas,#ntrilhamos o nosso próprio caminho pelas terras sombrias..."
33190-100 = "Hum, esse é o nosso lema."
33190-101 = "Normalmente atuamos como idols, mas à noite fazemos bico como um grupo que derrota vilões ♧"
33190-102 = "Esse não é o nosso lema coisa nenhuma?! E parem de inventar histórias estranhas pra gente!"
33190-103 = "Nós nos reunimos sob as ordens da Faust-san, a líder da Gangue dos Maiôs Mascarados!"
33190-104 = "...!?"
33190-105 = "H-Hã?!"
33190-106 = "E-Elas existem de verdade...?"
33190-107 = "Quem são elas...?"
33190-108 = "...Não sei. Não há dados detalhados."
33190-109 = "A-A Gangue dos Maiôs Mascarados... Eu achava que não passava de um boato, mas elas existem mesmo..."
33190-110 = "...Líder, elas estão aí rindo à toa, mas é melhor tomarmos cuidado. Se as subestimarmos, vamos acabar nos dando mal."
33190-111 = "..."
33190-116 = "Por que será que estão tentando fazer a nossa líder chorar, hein~? Ei, vocês aí!"
33190-117 = "Não sei quem são vocês nem de onde vieram, mas depois não digam que eu não avisei, viu? A nossa Faust-san fica assustadora quando se irrita."
33190-118 = "Afinal de contas, a Faust-chan praticamente derrotou um executivo da Corporação Kaiser no fim das contas ♧"
33190-119 = "Ela consegue até assaltar um banco do Mercado Negro. Como se fosse fichinha."
33190-120 = "Além disso, outro dia mesmo ela mandou a Kaiser PMC pelos ares com um bombardeio!"
33190-121 = "Pois é, ela é terrível, viu~? Não é exagero chamá-la de uma calamidade ambulante, quase como uma chefona que governa o submundo."
33190-122 = "Sim, essa é a Faust."
33190-128 = "Faust! Faust!! Faust!!!"
33190-133 = "..."
33190-134 = "Aaah, a Faust-chan tirou o saco de papel?!"
33190-138 = "Ah~, será que ela ficou com vergonha mesmo...?"
33190-142 = "E-E a gente entrou na onda só para ajudar!"
33190-143 = "Eu não estou com vergonha nenhuma."
33190-144 = "Shiroko-senpai, pare de fazer pose e tire logo isso também!"
33190-148 = "Hum..."
33190-149 = "B-Bom, de qualquer forma, mais uma vez..."
33190-150 = "O Comitê de Contramedidas veio retribuir o favor e ajudar a Hifumi-san desta vez!!"
33190-152 = "Muito obrigada, pessoal do Comitê de Contramedidas..."
33190-164 = "Hihihihihihi..."
33190-165 = "O Comitê de Justiça veio prestar auxílio."
33190-166 = "P-Presidente, e os seus ferimentos...?"
33190-167 = "Já sararam completamente."
33190-168 = "C-Como esperado da presidente!"
33190-169 = "Eu não sou tão resistente quanto a Tsurugi, então ainda não me recuperei totalmente... mas devo conseguir ajudar pelo menos um pouco. Afinal, prometi que daria a minha força."
33190-174 = "Vocês me pagam pelo que fizeram outro dia...! Não pensem que vão voltar inteiras para casa!"
33190-175 = "...E a Chefe?"
33190-176 = "..."
33190-182 = "...! Sensei..."
33190-183 = "Você está a salvo, né... Que bom..."
33190-184 = "Como encontrou este lugar...? Bom, tratando-se de você, Sensei, nem adianta perguntar a essa altura..."
33190-185 = "[s] \"Hina...\""
33190-186 = "Eu... não consigo mais..."
33190-187 = "Desculpa, Sensei... Para mim, não dá mais."
33190-188 = "Eu não sirvo mais para isso... então... desculpa te decepcionar, mas..."
33190-189 = "Agora, quero que você volte... Faça de conta que eu já me aposentei..."
33190-190 = "[ns] \"...Hina.\""
33190-192 = "[ns] \"Não é isso. Eu vim aqui para te agradecer.\""
33190-193 = "A-Agradecer...? Por quê...?"
33190-194 = "Se for por ter te salvado, Sensei, não precisa se preocupar com isso..."
33190-195 = "Aquilo era apenas o meu dever, e além do mais, naquela hora eu..."
33190-196 = "[s1] \"Não é só isso. Queria agradecer por você sempre se esforçar tanto.\"\n[s2] \"Eu queria ter te dito antes que você não precisa mais se cobrar tanto.\""
33190-197 = "...!"
33190-198 = "...!"
33190-199 = "[s] \"Porque você sempre deu o seu melhor, Hina.\""
33190-200 = "..."
33190-201 = "[s] \"Era isso que eu queria dizer. Então descanse, que eu dou um jeito no resto.\""
33190-202 = "E-Espera, como assim dar um jeito...?"
33190-203 = "Mas eu..."
33190-204 = "Eu..."
33190-205 = "..."
33190-206 = "Eu... não consigo ser como a Takanashi Hoshino..."
33190-207 = "[s] \"...A Hoshino?\""
33190-208 = "Eu não sou uma pessoa forte... como aquela vice-presidente de Abydos..."
33190-209 = "A presidente do conselho estudantil de Abydos... Quem encontrou o corpo dela foi a Takanashi Hoshino. Mesmo ela sendo uma pessoa importante, tão incrivelmente importante para ela..."
33190-210 = "Mesmo tendo passado por tanta dor, ela ainda continua lutando em Abydos... Eu não consigo fazer algo assim..."
33190-211 = "Eu não consigo ser forte até esse ponto... Naquele instante, eu já..."
33190-212 = "[s] \"Hina...\""
33190-213 = "Eu também me esforcei!!"
33190-214 = "Sempre me esforcei, tentando dar um jeito nas coisas..."
33190-215 = "Mesmo quando ninguém me compreendia, ainda assim..."
33190-216 = "Mas, no momento mais importante, eu..."
33190-217 = "Isso é covardia, Sensei... Naquele instante eu já não aguentava mais... e mesmo assim você vem me dizer uma coisa dessas..."
33190-218 = "Assim como a Takanashi Hoshino e o Clube de Aulas de Reforço, eu também..."
33190-219 = "Eu também queria a sua atenção, Sensei! Queria que você me elogiasse!!"
33190-220 = "[s] \"...\""
33190-221 = "...Ah."
33190-222 = "D-Desculpa... Isso de agora foi, é..."
33190-223 = "[s] \"Hina, me desculpa mesmo!\""
33190-224 = "!?"
33190-225 = "[s3] \"Vamos fazer aulas de reforço com você também da próxima vez, Hina!\"\n[s4] \"E quando você tirar uma nota boa, é claro que vou te elogiar um montão!\""
33190-226 = "..."
33190-227 = "..."
33190-228 = "Hã? Não, minhas notas já são boas... Na verdade, quase sempre tiro nota máxima..."
33190-229 = "[s] \"Ou prefere fazer uma festa de maiô?! Eu preparo tudo agora mesmo!\""
33190-230 = "Ér, isso também não precisa..."
33190-231 = "..."
33190-232 = "...Haa."
33190-233 = "Fufu..."
33190-234 = "...Por sinal, Sensei, na verdade você tem um favor para me pedir, não tem?"
33190-235 = "[s] \"Mas, considerando que você se aposentou, Hina...\""
33190-236 = "...Eu falei aquilo da boca para fora. Só queria ser um pouquinho mimada por todo mundo."
33190-238 = "Vamos, Sensei."
33190-242 = "Chefe...!"
33190-243 = "...Desculpe a demora, Ako. Que bom que todas vocês também estão bem."
33190-244 = "Imagina... Sim!!"
33190-248 = "Estamos prontas. Vamos aguardar as instruções do Sensei."
33190-250 = "Fomos cercadas, não é mesmo...?"
33190-251 = "As coisas ficaram meio complicadas para o nosso lado, não acha, líder?"
33190-252 = "E o que isso importa? Diante do \"Concílio das Santas de Justina\", que se multiplica infinitamente, tudo isso é igualmente inútil."
33190-253 = "...Na verdade, isso é até conveniente. Mostrem não apenas para a Azusa, mas para todas as presentes neste lugar."
33190-254 = "Mostrem a verdade deste mundo... Que, neste mundo repleto de ódio e intenção assassina, todo e qualquer esforço é em vão."
33190-255 = "Que não há sentido algum em se debater, e que tudo é inútil!!"
33190-259 = "..."
33190-260 = "[s] Assentir."
33190-261 = "Hifumi..."
33190-262 = "Azusa-chan, eu estou muito brava agora. Muito brava mesmo."
33190-263 = "..."
33190-264 = "Mas... acima de tudo, que bom que você está a salvo."
33190-265 = "Eu estava muito brava, mas, pensando bem, a culpa disso não é sua, Azusa-chan. Por isso, já não estou mais brava com você."
33190-266 = "Hifumi..."
33190-270 = "Porém, eu ainda estou brava com aquelas pessoas ali."
33190-271 = "Essa conversa de intenção assassina, de ódio... de que essa é a verdade deste mundo..."
33190-272 = "Elas tentaram nos impor isso à força e ficaram repetindo que tudo é em vão, mas..."
33190-273 = "Mesmo assim, eu...!"
33190-276 = "Hifumi"
33190-277 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-278 = "Eu não quero que a Azusa-chan se torne uma assassina..."
33190-281 = "Hifumi"
33190-282 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-283 = "Uma história tão sombria e melancólica assim...[wa:2300] eu detesto isso."
33190-286 = "Hifumi"
33190-287 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-288 = "Mesmo que digam que essa é a verdade,[wa:2000] que essa é a essência deste mundo,[wa:2300] eu não gosto disso!"
33190-291 = "Hifumi"
33190-292 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-293 = "Eu tenho as coisas de que eu gosto!"
33190-297 = "Hifumi"
33190-298 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-299 = "Posso ser uma garota comum e sem grandes talentos... mas, quando se trata das coisas que eu amo, eu não abro mão de jeito nenhum!"
33190-303 = "Hifumi"
33190-304 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-305 = "Superar as dificuldades com a força da amizade,"
33190-309 = "Hifumi"
33190-310 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-311 = "ver todo o esforço ser devidamente recompensado,"
33190-315 = "Hifumi"
33190-316 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-317 = "consolar umas às outras nos momentos difíceis, apoiando as amigas...!"
33190-321 = "Hifumi"
33190-322 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-323 = "E que, mesmo passando por provações dolorosas... no final, todas possam terminar com um sorriso no rosto!"
33190-327 = "Hifumi"
33190-328 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-329 = "É desse tipo de final feliz[wa:1200] que eu gosto!!"
33190-333 = "Hifumi"
33190-334 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-335 = "Não importa quem diga o contrário,[wa:1200] eu vou continuar repetindo isso quantas vezes for preciso!"
33190-338 = "Hifumi"
33190-339 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-340 = "Quem decide a história que vamos escrever somos nós mesmas!"
33190-345 = "Hifumi"
33190-346 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-347 = "Não vou deixar que ela acabe aqui,[wa:1500] nós ainda vamos continuar escrevendo muito mais!"
33190-350 = "Hifumi"
33190-351 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-352 = "A nossa história..."
33190-355 = "Hifumi"
33190-356 = "[7cd0ff]Clube de Aulas de Reforço[-]"
33190-357 = "A nossa,"
33190-361 = "A história da nossa juventude!!"
33190-364 = "Blue Archive"
33190-371 = "A-As nuvens de chuva..."
33190-372 = "Manipulação climática...? Não, isso é..."
33190-373 = "U-Um milagre...?"
33190-374 = "Urgh, milagres não existem! O que é isso...?!"
33190-375 = "Não me diga que os preceitos...?"
33190-378 = "[ns] \"Eu declaro aqui e agora.\""
33190-380 = "[ns] \"Nós somos a nova Organização do Tratado do Éden.\""
33190-381 = "O quê...?!"
33190-383 = "Não pode ser..."
33190-384 = "Este é o Tratado do Éden... Sensei, você..."
33190-385 = "Originalmente, era um tratado que deveria ter sido criado pela Presidente do Conselho Estudantil Geral..."
33190-386 = "E a \"Schale\", a organização extralegal fundada por essa mesma Presidente do Conselho Estudantil Geral..."
33190-387 = "Não me diga que a \"Schale\" está atuando como representante da Presidente do Conselho Estudantil Geral? Não, você distorceu as regras para que pudesse ser interpretado assim...?"
33190-388 = "Igualzinho a Arius..."
33190-389 = "Com Gehenna, a Tea Party, o Comitê de Justiça e o Comitê Disciplinar, que são as partes principais do tratado, reunidos..."
33190-390 = "Nas ruínas onde outrora ficava a Antiga Catedral..."
33190-391 = "No lugar da Presidente do Conselho Estudantil Geral, a idealizadora do tratado, o Sensei..."
33190-392 = "Recriou a promessa que carrega o nome do paraíso...?"
33190-393 = "..."
33190-394 = "Desvirtuar o contrato, distorcê-lo e forjar o resultado desejado..."
33190-395 = "Contra os métodos de um \"adulto\", responde-se com os métodos de outro \"adulto\", é...?"
33190-397 = "...Líder, o controle sobre Justina está saindo do normal."
33190-398 = "!!"
33190-411 = "E-Elas estão confusas, né... O preceito ordena que auxiliem a Organização do Tratado do Éden, mas agora existem duas ETOs..."
33190-412 = "Urgh, e o que isso importa?!!!"
33190-413 = "Um final feliz?! Não me faça rir! Acham mesmo que palavras como essas podem mudar o mundo?!"
33190-414 = "Vão me dizer que só isso basta para mudar este mundo de ódio e desconfiança?! Que conversa mais iludida é essa...?!"
33190-415 = "[s] \"Porque ajudar a realizar os sonhos das alunas... é o dever de um adulto.\""
33190-416 = "...!"
33190-417 = "[s5] \"Eu acredito nos sonhos que as alunas desejam e vou apoiá-los.\"\n[s6] \"Nos sonhos que elas mesmas desejam do fundo do coração.\""
