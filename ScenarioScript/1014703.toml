[translation]
1014703-1 = "Satsuki's Ocean Countermeasures"
1014703-13 = "[ns] \"You look like you're having fun, Satsuki.\""
1014703-14 = "Oh, Sensei."
1014703-15 = "Hehe, are you curious about what I was doing?"
1014703-16 = "Very well, I'll tell you."
1014703-17 = "I am currently—"
1014703-18 = "Training to overcome the ocean!"
1014703-19 = "[s] \"Training to overcome the ocean?\""
1014703-20 = "I'll teach you one of the ocean's secrets."
1014703-21 = "Just watch."
1014703-22 = "See those waves coming in?"
1014703-24 = "I noticed this while observing the shore earlier."
1014703-25 = "If you observe the waves, you can predict their scale to a certain extent."
1014703-27 = "For example... waves that break heavily in the distance lose their momentum before they reach us, but..."
1014703-28 = "Quiet waves are different."
1014703-29 = "...Ah! One is coming right now, watch closely."
1014703-33 = "Hup!"
1014703-39 = "Hehe, what do you think?"
1014703-40 = "Watching me gracefully dodge the incoming waves."
1014703-41 = "This method of identifying them is actually quite accurate. It should be useful for increasing your survival rate in dangerous waters."
1014703-42 = "Don't you want to try it, Sensei?"
1014703-43 = "[s1] \"It certainly looks interesting, but—\"\n[s2] \"Don't you think it would be fine to go a little deeper into the water?\""
1014703-46 = "Into the water...?"
1014703-47 = "N-no way. That's dangerous."
1014703-48 = "[s3] \"It's shallow around here, so it's fine.\"\n[s4] \"We did come all the way to the beach, after all.\""
1014703-51 = "...Don't come crying to me when that carelessness costs you your life."
1014703-52 = "The ocean is a veeery dangerous and terrifying place!"
1014703-53 = "..."
1014703-54 = "Looking at me with those sparkling eyes won't change my mind!"
1014703-58 = "But... Sensei is a collaborator of Pandemonium Society, after all..."
1014703-59 = "And going into the water with Sensei might actually be a little fun..."
1014703-60 = "...Hmm."
1014703-64 = "Sigh... I surrender. I'll go along with your suggestion just this once."
1014703-65 = "[s] \"Yay!\""
1014703-69 = "Ugh... the waves..."
1014703-70 = "...Fine. I'm going to make you take responsibility for inviting me, Sensei."
1014703-71 = "I'll have to hypnotize you to protect me in any emergency."
1014703-75 = "There, there... round and round... round and round..."
1014703-76 = "Sensei will protect me, Sensei will protect me..."
1014703-77 = "[ns5] \"W-wait a second, Satsuki...!\"\n[ns6] \"Isn't that wave a bit too big...?\""
1014703-81 = "Kyaaaaah!!"
1014703-88 = "T-that was close... Thank you, Sensei."
1014703-89 = "Oh? Come to think of it... why did you protect me? The hypnosis wasn't even complete yet..."
1014703-90 = "Could it be..."
1014703-91 = "Did my abilities level up!? Can I cast hypnosis just with my words now!?"
1014703-92 = "[s] \"...I'd protect you even without any hypnosis, Satsuki.\""
1014703-93 = "Eh? You weren't hypnotized? Then why..."
1014703-94 = "..."
1014703-95 = "I-I see. You mean as a collaborator of the Pandemonium Society, right?"
1014703-96 = "[s7] \"No. Satsuki, you hate getting hurt, don't you?\"\n[s8] \"And you're scared, too.\""
1014703-99 = "..."
1014703-100 = "I suppose so. Sensei is one of the few people who knows the secret of Kyogoku Satsuki..."
1014703-101 = "Are you planning to use this secret to blackmail me someday?"
1014703-105 = "...No, I already know the answer. Sensei would never do such a thing."
1014703-106 = "[s] \"Yeah, I never would.\""
1014703-107 = "...Yes, I know."
1014703-108 = "Hey Sensei, will you... keep protecting me from now on?"
1014703-109 = "[s] Nods."
1014703-110 = "...Very well."
1014703-114 = "Ack! Another big wave...!"
1014703-120 = "I'm counting on you, Sensei!"
1014703-123 = "(I spent time with Satsuki until she was no longer afraid of the shallows.)"