[translation]
1014703-1 = "Приморский план Сацуки"
1014703-2 = ""
1014703-3 = ""
1014703-4 = ""
1014703-6 = ""
1014703-7 = ""
1014703-8 = ""
1014703-9 = ""
1014703-11 = ""
1014703-12 = ""
1014703-13 = "[ns] «Выглядит интересно, Сацуки»."
1014703-14 = "А, Сенсей."
1014703-15 = "Фу-фу. Как же вам любопытно."
1014703-16 = "Раз уж вы так настаиваете, расскажу."
1014703-17 = "Я..."
1014703-18 = "Я тренируюсь противостоять бушующим морским волнам."
1014703-19 = "[s] «Тренируешься?»"
1014703-20 = "Да. Позвольте поделиться с вами тайнами моря."
1014703-21 = "Смотрите внимательно."
1014703-22 = "Видите, как волны разбиваются о берег?"
1014703-24 = "Долго и пристально наблюдая за морем, я раскрыла его секреты."
1014703-25 = "Если следить за тем, как поднимается волна, можно предсказать её размер."
1014703-26 = ""
1014703-27 = "Волны, разбивающиеся далеко от нас, сюда никогда не доберутся, ведь им изначально не хватает силы."
1014703-28 = "А вот взгляните на ту. С тихими волнами всё иначе."
1014703-29 = "Она приближается... Всё ближе, ближе..."
1014703-30 = ""
1014703-32 = ""
1014703-33 = "Хия!"
1014703-34 = ""
1014703-38 = ""
1014703-39 = "Ну как? Что скажете?"
1014703-40 = "Видели, как ловко я уклонилась от волны, докатившейся до самого берега? Фу-фу!"
1014703-41 = "Уверяю вас, такое наблюдение за волнами значительно повысит ваши шансы выжить среди морских опасностей."
1014703-42 = "Ну что, Сенсей? Хотите попробовать?"
1014703-43 = "[s1] «Выглядит весело...»\n[s2] «Но если зайти немного глубже, всё равно будет безопасно»."
1014703-46 = "Немного глубже...?"
1014703-47 = "Нет-нет. Я не намерена совершать подобную безрассудную глупость."
1014703-48 = "[s3] «Здесь совсем мелко, так что ничего страшного».\n[s4] «Всё-таки мы не зря приехали на пляж»."
1014703-51 = "Хмф, именно такая беспечность и приводит к несчастным случаям."
1014703-52 = "Море — очень опасное и страшное место."
1014703-53 = "..."
1014703-54 = "Не смотрите на меня такими умоляющими глазами."
1014703-55 = ""
1014703-57 = ""
1014703-58 = "Впрочем... вы один из наших важнейших союзников..."
1014703-59 = "И играть в воде, похоже, действительно весело..."
1014703-60 = "...Хм."
1014703-61 = ""
1014703-63 = ""
1014703-64 = "Ладно-ладно. На этот раз последую вашему совету."
1014703-65 = "[s] «Ура!»"
1014703-68 = ""
1014703-69 = "Ух... Эти волны..."
1014703-70 = "Так, хорошо. Раз уж вы меня сюда заманили, придётся принять собственные меры безопасности."
1014703-71 = "Я загипнотизирую вас, чтобы в случае опасности вы меня защитили."
1014703-72 = ""
1014703-74 = ""
1014703-75 = "А теперь смотрите на мой палец. Круг за кругом... Круг за кругом..."
1014703-76 = "Сенсей будет меня защищать, Сенсей будет меня защищать..."
1014703-77 = "[ns5] «О, эта волна... довольно большая!»\n[ns6] «Сацуки...!»"
1014703-80 = ""
1014703-81 = "КЯ-А-А!!"
1014703-82 = ""
1014703-87 = ""
1014703-88 = "Это было опасно... Спасибо, Сенсей."
1014703-89 = "Но я ведь даже не закончила... а вы всё равно меня защитили."
1014703-90 = "Только не говорите..."
1014703-91 = "Мой дар гипноза стал сильнее! Теперь достаточно одних слов, чтобы вас загипнотизировать!"
1014703-92 = "[s] «Я всегда буду защищать тебя, Сацуки, и без всякого гипноза»."
1014703-93 = "П-погодите? То есть вы действовали не по моему внушению?"
1014703-94 = "Тогда почему вы...?"
1014703-95 = "А. Потому что я важный член Общества Пандемониума?"
1014703-96 = "[s7] «Нет. Ты ведь не любишь боль».\n[s8] «И всё страшное»."
1014703-99 = "..."
1014703-100 = "Я и забыла, что вам известен мой секрет."
1014703-101 = "Неужели вы всё это время хранили его, дожидаясь удобного случая, чтобы воспользоваться моей слабостью?"
1014703-102 = ""
1014703-104 = ""
1014703-105 = "Нет. Вы не такой человек."
1014703-106 = "[s] «Нет. Никогда»."
1014703-107 = "...Фу-фу. Верно. Такого бы не случилось."
1014703-108 = "Тогда... вы намерены защищать меня и дальше?"
1014703-109 = "[s] Кивнуть."
1014703-110 = "...Хорошо."
1014703-111 = ""
1014703-113 = ""
1014703-114 = "А, приближается ещё одна большая волна."
1014703-115 = ""
1014703-117 = ""
1014703-118 = ""
1014703-119 = ""
1014703-120 = "Полагаюсь на вас, Сенсей!"
1014703-123 = "Я оставался рядом с Сацуки, пока она понемногу привыкала к мелководью."
