[translation]
1008802-1 = "Время побездельничать"
1008802-3 = "Местом, о котором говорила Каёко, оказался небольшой переулок рядом с Оперным театром."
1008802-4 = "Место было довольно уединённым. Не зная, что искать, найти его было почти невозможно."
1008802-5 = ""
1008802-9 = "...А, Сенсей."
1008802-10 = "Вы пришли раньше, чем я ожидала. Сюда."
1008802-11 = ""
1008802-16 = ""
1008802-17 = "[ns1] «Каёко?»\n[ns2] «Ты специально пришла аж сюда?»"
1008802-20 = "Эм, ну... да."
1008802-21 = "Вокруг Оперного театра постоянно ходит столько людей, что трудно найти тихое место, где можно посидеть и подумать."
1008802-22 = "И пока я работаю, слишком далеко уходить тоже нельзя..."
1008802-23 = ""
1008802-25 = ""
1008802-26 = "Поэтому я нашла это место."
1008802-27 = "Вы ведь тоже такое делали, да? Как это называется?"
1008802-28 = "Хм..."
1008802-29 = "...Отлынивать от работы?"
1008802-30 = "[s3] «Я воспользуюсь правом хранить молчание.»\n[s4] «Как преподаватель, думаю, мне не следует отвечать.»"
1008802-33 = "...Хи-хи."
1008802-34 = "Не продолжайте, Сенсей."
1008802-35 = "И не переживайте об этом так сильно."
1008802-36 = "После этого короткого перерыва я вернусь."
1008802-37 = ""
1008802-39 = ""
1008802-40 = "...А?"
1008802-41 = "О, вы боитесь, что мешаете мне отдыхать."
1008802-42 = ""
1008802-44 = ""
1008802-45 = "Забудьте."
1008802-46 = "Если бы это было так, я бы вообще не сказала вам, где нахожусь."
1008802-47 = "С кем угодно другим я бы просто избежала этой темы."
1008802-48 = "Так что не переживайте. Вы мне не мешаете."
1008802-49 = "К тому же мне нравится вот так бездельничать и болтать."
1008802-50 = "...Точнее, мне нравятся люди, которые УМЕЮТ так делать."
1008802-51 = "Однако..."
1008802-52 = ""
1008802-54 = ""
1008802-55 = "Хи-хи..."
1008802-56 = "Простите. Сегодня я немного разговорчивая. Я не собиралась."
1008802-57 = "Вы, наверное, тоже пришли сюда отдохнуть, и если я буду всё время болтать, никакого отдыха не получится."
1008802-58 = "В таком случае..."
1008802-59 = ""
1008802-61 = ""
1008802-62 = "...Как насчёт того, чтобы отдохнуть вместе?"
1008802-69 = "Мы с Каёко молча сидели вместе, наблюдая за вечерним небом."
1008802-70 = "Эти десять минут тишины пролетели в одно мгновение."
1008802-72 = ""
1008802-73 = ""
1008802-75 = ""
1008802-76 = "О. Уже пора..."
1008802-77 = "[s5] «Пойдём обратно?»\n[s6] «Мы ведь и правда не сказали ни слова, да?»"
1008802-78 = ""
1008802-80 = ""
1008802-81 = "...Хи-хи."
1008802-82 = ""
1008802-84 = ""
1008802-85 = "...Пожалуй."
1008802-86 = ""
1008802-88 = ""
1008802-89 = "...Хи-хи."
1008802-90 = ""
1008802-92 = ""
1008802-93 = "...Ага."
1008802-96 = "― [log=카요코 드레스]...Хорошо.[/log][wa:710]"
1008802-99 = "― [log=카요코 드레스]Просто вот так[/log]"
1008802-101 = "― [log=카요코 드레스]бездельно проводить с кем-то время...[/log][wa:2260]"
1008802-104 = "― [log=카요코 드레스]...Мне редко выпадает возможность делать что-то подобное.[/log][wa:10]"
1008802-107 = "― [log=카요코 드레스]...И раньше я всегда была одна.[/log][wa:100]"
1008802-109 = "― [log=카요코 드레스]Я думала, что так лучше всего.[/log]"
1008802-112 = "[ns7] «Иногда приятно вот так отключить голову.»\n[ns8] «Хотелось бы делать такое почаще.»"
1008802-113 = "― [log=카요코 드레스]...Правда?[/log][wa:850]"
1008802-114 = "― [log=카요코 드레스]...Правда?[/log][wa:850]"
1008802-117 = "― [log=카요코 드레스]Хи-хи. Я рада, что вам тоже нравится, Сенсей.[/log][wa:1520]"
1008802-120 = "― [log=카요코 드레스]Приятно, когда бывают такие тихие моменты.[/log][wa:2800]"
1008802-123 = "― [log=카요코 드레스]То есть... не то чтобы мне не нравилось, как всё обычно бывает.[/log][wa:1460]"
1008802-125 = "― [log=카요코 드레스]...Вы понимаете, о чём я, Сенсей.[/log][wa:350]"
1008802-128 = "― [log=카요코 드레스]*вздох*... Эй...[/log][wa:2700]"
1008802-131 = "― [log=카요코 드레스]...Может...[/log]"
1008802-133 = "― [log=카요코 드레스]Может, мы... останемся здесь ещё ненадолго.[/log][wa:1300]"
1008802-136 = "Спасибо, что провели со мной время. Это был самый приятный перерыв за последнее время."
1008802-137 = "Гораздо лучше, чем сидеть одной..."
1008802-138 = "...А?"
1008802-139 = "Почему вы так ухмыляетесь?"
1008802-140 = "[ns9] «Иногда слова не нужны».\n[ns10] «Вы ведь именно это подумали, да?»"
1008802-141 = ""
1008802-142 = ""
1008802-144 = ""
1008802-145 = "...Ах."
1008802-146 = "Хи-хи..."
1008802-147 = "Не представляю, как я вообще могла забыть..."
1008802-148 = ""
1008802-150 = ""
1008802-151 = ""
1008802-152 = "...но вы интересный человек, Сенсей."
