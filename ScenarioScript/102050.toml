[translation]
102050-1 = "Эпизод 5; Планирование операции 3"
102050-2 = "Все команды святилищ теперь в полной готовности."
102050-3 = "Сейчас я подведу итог оперативного плана: Вершина Нисира."
102050-4 = "Сначала подразделения, штурмующие святилища, приблизятся к каждому хранителю на дистанцию прямой атаки."
102050-5 = "Другими словами, нужно обеспечить шесть маршрутов атаки — по одному на каждое святилище. Малые мобильные группы короткими боями прорвут оборону противника. Не ввязывайтесь в затяжные столкновения."
102050-6 = "Да! Затем оборонительные подразделения каждого района должны удерживать район, пока святилище не будет захвачено."
102050-7 = "Как только штурм начнётся, святилища призовут врагов, и те начнут атаковать нас по всему Кивотос."
102050-8 = "Оборонительные подразделения Геенны, Миллениум, Хяккияко, Красная Зима, Шаньхайцзин, Тринити и D.U. должны подготовиться к атакам со всех сторон."
102050-9 = "Если оборона каждого района устоит и маршруты атаки ко всем святилищам будут обеспечены, начнётся обратный отсчёт до общего штурма хранителей."
102050-10 = "По нашему сигналу все команды одновременно атакуют всех хранителей. Самое важное здесь — синхронность, все!"
102050-11 = "Когда первые пять святилищ будут очищены, мы вместе атакуем шестое — самое мощное!"
102050-12 = "Так мы уничтожим все шесть Ложных святилищ в Кивотос. После этого оперативный план «Вершина Нисира» будет считаться успешным."
102050-13 = "С этого момента Шале придётся действовать активнее... Сенсей, вы должны координировать все оборонительные и наступательные действия через операторов каждой группы..."
102050-14 = "Работы будет просто тонна, но без тебя ничего из этого не получится. Так что давай, Сенсей, ты справишься!"
102050-15 = "Есть вопросы, Сенсей?"
102050-16 = "[s] «Нет. Спасибо за тяжёлую работу, Рин, Момока и Аюму.»"
102050-17 = "Это только начало."
102050-18 = "[ns] «А теперь, все в Шале... Вы готовы?»"
102050-36 = "Мы готовы!"
102050-38 = "[ns] «Тогда...»"
102050-40 = "[ns] «Начинаем оперативный план: Вершина Нисира!»"
102050-43 = "Следующий эпизод; Первое святилище — Пустынный Район Абидос"
