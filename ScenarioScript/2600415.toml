[translation]
2600415-1 = "Habits and Time"
2600415-3 = "Sensei..."
2600415-4 = "You look exhausted."
2600415-5 = "[s1] \"I shouldn't be showing you such a pathetic side of myself...!\"\n[s2] \"I let my true feelings slip out...\""
2600415-8 = "No, no, I am glad you spoke to me honestly."
2600415-9 = "Please relax and rest here."
2600415-13 = "I have prepared a special seat for you!"
2600415-14 = "[s] \"I will take you up on that offer.\""
2600415-18 = "...Ah. The cushion for guests is torn."
2600415-19 = "I need to sew it back up..."
2600415-20 = "[s] \"I don't mind, you know?\""
2600415-21 = "No way! A good environment is important for both reading and resting."
2600415-22 = "That said, I cannot fix it immediately, so instead――"
2600415-27 = "Please use mine!"
2600415-28 = "Like this... and if I place it here... There!#nSensei, please come over here. It should not hurt to sit on for a long time."
2600415-29 = "[s3] \"Oh... It is so fluffy...!\"\n[s4] \"It is like a cloud...\""
2600415-32 = "Hehe, it was worth preparing."
2600415-33 = "Actually, I tried arranging it in the most optimal way for resting.#nAccording to an anatomy book I read recently, this is supposed to be an effective seating posture."
2600415-34 = "Still..."
2600415-35 = "I am glad. It seems you are satisfied with my cushion."
2600415-36 = "It is a bit old, and there are traces of repairs here and there, so it looks a bit shabby..."
2600415-37 = "[s] \"You can feel the attachment, and it is wonderful!\""
2600415-41 = "Hehe, thank you."
2600415-42 = "I like to use things for as long as possible... Though because of that, I end up using them until they are too battered to fix."
2600415-43 = "This cushion has a wonderful fluffiness to it, and I also love how soft the fabric is."
2600415-44 = "Even when it tore, I just sewed it back up each time and kept using it."
2600415-45 = "Plus, when you use something for a long time, the stuffing compresses and shapes itself to fit your body."
2600415-46 = "In other words, you could say that everyday habits and the time spent using it are soaked right into it."
2600415-47 = "That is why it feels just right, whether you use it as a backrest or a body pillow."
2600415-48 = "Now, enough of my explanation. Please rest to your heart is content!"
2600415-49 = "[s5] \"Are you sure it is okay for me to borrow it?\"\n[s6] \"It is not right to make Shimiko sit on the floor.\""
2600415-52 = "You do not need to worry about that."
2600415-53 = "I have one more secret plan for you."
2600415-58 = "Now, close your eyes and relax your body."
2600415-59 = "I will read to you right beside you until you fall asleep."
2600415-60 = "You are not going to hold back... right?"
2600415-67 = "Ahem, ahem."
2600415-68 = "Once upon a time, in a certain place."
2600415-73 = "There lived a lonely auxiliary verb that could not become an attributive modifier――"
2600415-74 = "[s] \"This is not a fairy tale!?\""
2600415-76 = "(Surrounded by the fluffy cushion and Shimiko is gentle voice, I drifted off to sleep)"
2600415-80 = "(I slept soundly and regained my energy)"
