[translation]
10013055-2 = "Матч, который последовал, был невероятно ожесточённым."
10013055-3 = "Бойцы Mushiqueen использовали весь свой опыт, чтобы провести бой всей жизни."
10013055-4 = "Президент! Самая важная позиционная карта в Mushiqueen — Магическая карта!"
10013055-6 = "Нет-нет, Пина! На самом деле важнее партнёр, которому можно глубоко доверять и на которого можно положиться! Я называю это Монстром-тузом!"
10013055-8 = "Даже в кризис они не унывали, а доверяли и поддерживали друг друга."
10013055-10 = ""
10013055-16 = "Мои HP почти на нуле...! Я-я в опасности!"
10013055-17 = "Не паникуй! У тебя ещё есть шанс! На следующем ходу ты можешь всё перевернуть, Шизуко!"
10013055-18 = "Твоё милое выражение лица в опасности может сыграть тебе на руку! Не волнуйся, я всё это запишу! Ты сможешь!"
10013055-19 = "Я понимаю, что сказала Мимори, но Умика вообще пыталась подбодрить?!"
10013055-20 = ""
10013055-28 = "После множества боёв мы наконец дошли до финала турнира Mushiqueen."
10013055-31 = ""
10013055-32 = "Хи-хи-хи. Это просто везение новичка или вы неожиданная тёмная лошадка?"
10013055-33 = "Лошадка или везение — против моей безупречной колоды у вас нет шансов."
10013055-34 = "Я призову свою козырную карту... Алмазного радужного муравья!"
10013055-35 = ""
10013055-39 = "Э-Это..."
10013055-40 = "...одна из сильнейших карт в Mushiqueen!"
10013055-42 = "Ха-ха-ха! Атака! Алмазный разрез челюстью!"
10013055-43 = ""
10013055-55 = "Аргх! Т-Так мощно! Э-Это... конец..."
10013055-56 = ""
10013055-58 = ""
10013055-59 = ""
10013055-60 = ""
10013055-61 = ""
10013055-62 = "Настоящая леди никогда не сдаётся! Шизуко, доверься своим картам! Себе! Своим товарищам!"
10013055-63 = "М-Мимори!"
10013055-65 = "Эта сцена! Каэдэ!"
10013055-67 = "Знаю, Пина! Прямо как легендарная сцена из 378-й серии Mushiqueen! Когда они почти проиграли, партнёры объединились и вырвали победу!"
10013055-68 = ""
10013055-70 = ""
10013055-71 = ""
10013055-72 = ""
10013055-73 = ""
10013055-74 = "Тяну!"
10013055-76 = "Нам нужно чудо!"
10013055-77 = ""
10013055-80 = ""
10013055-81 = ""
10013055-82 = ""
10013055-83 = ""
10013055-84 = "О, нужная карта не пришла."
10013055-85 = "Ч-Что?! Я так увлеклась моментом!"
10013055-86 = "А-а-а! Дух карт не ответил на наши молитвы!"
10013055-88 = "Ха-ха-ха! Чудеса сами в руки не падают! Похоже, вам просто повезло как новичкам!"
10013055-89 = "Хороший был бой, претенденты! Но победа моя!"
10013055-90 = ""
10013055-96 = ""
10013055-97 = "Что?! Ты ещё кто такая?!"
10013055-98 = ""
10013055-99 = ""
10013055-100 = "Теперь мой ход."
10013055-101 = "[s] «Ч-Чисэ? Ты внезапно врываешься в игру?!»"
10013055-103 = "О! Нет, Сенсей! Это совсем не внезапно. В Mushiqueen есть особое правило!"
10013055-104 = "Его можно активировать в критический момент. Оно называется правилом «Другой я»!"
10013055-106 = "Так что всё безопасно!"
10013055-107 = "[s] «Эти правила кажутся очень произвольными!»"
10013055-108 = ""
10013055-110 = ""
10013055-111 = ""
10013055-113 = "Вот... давайте используем эту карту."
10013055-114 = ""
10013055-117 = "Хорошо... Я призову этого монстра."
10013055-118 = ""
10013055-126 = "Что? Поле перевернулось всего за три карты?!"
10013055-127 = "Я забыла! Чисэ потрясающе играет в карточные игры! Она очень хороша в каруте!"
10013055-128 = "[s] «Не думаю, что это так работает...»"
10013055-129 = "Сейчас я закончу. Абсолютное оружие."
10013055-130 = ""
10013055-132 = ""
10013055-141 = "Н-Не может быть!"
10013055-142 = ""
10013055-144 = ""
10013055-145 = ""
10013055-146 = "Финальный победитель соревнования Mushiqueen...!"
10013055-147 = ""
10013055-150 = ""
10013055-151 = "Претендент Кавава Шизуко..."
10013055-152 = ""
10013055-154 = ""
10013055-155 = "И замена Шизуко!"
10013055-156 = ""
10013055-158 = ""
10013055-159 = "Вараку Чисэ!"
10013055-160 = "Она прервала серию чемпиона из ста побед подряд! Родилась новая легенда!"
10013055-161 = ""
10013055-163 = ""
10013055-166 = "[ns] «В-Всё закончилось...»"
10013055-167 = "Шизуко! Чисэ! Вы обе невероятны!"
10013055-168 = "Изуна была так тронута, когда Чисэ спасла положение! Совсем как в фильмах про ниндзя!"
10013055-170 = "Д-Да! Я не совсем поняла, что произошло, но мы победили...!"
10013055-171 = "Вот она — сила Хяккияко!"
10013055-172 = "Вы получите приз турнира Mushiqueen! Я завидую! Потом обязательно покажите мне карты!"
10013055-174 = "У нас новый чемпион!"
10013055-175 = "Бывший чемпион! С дороги!"
10013055-176 = "Аргх. Вы, придурки! Как вы можете так просто отшвырнуть меня в сторону?"
10013055-177 = "То есть, таковы правила, но всё равно! Я и за миллион лет не ожидала проиграть!"
10013055-179 = "Хорошо! Тогда вручим приз новому чемпиону от «Золотого руна»!"
10013055-181 = "Погодите, у меня к вам вопрос."
10013055-182 = "А? Чего тебе надо?"
10013055-183 = "Я понимаю, что вы не ожидали проиграть, но..."
10013055-184 = "Зачем вы устроили соревнование, поставив на кон такую ценную вещь, как курортный контракт?"
10013055-185 = "Почему...? Никакой особой причины... Просто..."
10013055-186 = "Мы любим игры с высокими ставками!"
10013055-187 = "Мы пересечём любой океан ради азарта игры!"
10013055-189 = "Видите ли, мы купили дешёвый курортный контракт на соседний остров в интернете."
10013055-190 = "[s] «На каком сайте все это покупают?!»"
10013055-191 = "Мы поставили корабль на якорь у этого острова для удобного доступа. Просто подумали, что будет весело устроить здесь турнир Mushiqueen."
10013055-192 = "Если честно, даже если потеряем курортный контракт, просто уйдём на корабле куда-нибудь ещё!"
10013055-193 = "О, бывший чемпион! Какая вы хитрая!"
10013055-194 = "У нас ещё много турниров запланировано! Почему бы не попробовать снова?"
10013055-195 = "Отвали!"
10013055-196 = "[s] «Так вот зачем вы сюда приехали.»"
10013055-197 = "Вы устроили этот турнир просто потому, что любите его. В каком-то смысле вы оказываете услугу."
10013055-198 = "Теперь всё понятно."
10013055-199 = "У меня есть для тебя предложение."
10013055-200 = "Почему бы вам не продолжить проводить соревнования здесь?"
10013055-201 = "Что?"
10013055-202 = "[s] «Шизуко? Снова?»"
10013055-203 = "В конце концов, ваш турнир действительно очень популярен."
10013055-204 = "Пина постоянно говорит о Mushiqueen, так что мне всегда было немного интересно."
10013055-205 = "И, ну... участвуя, я кое-чему научилась."
10013055-206 = "О-о! Президент! Я тронута!"
10013055-207 = "Вы начнёте играть? Я могу научить вас искусству Mushiqueen!"
10013055-209 = "Хи-хи. Мне так нравится видеть, как все счастливы."
10013055-210 = "Кхм! Я просто подумала, что бизнесу Момоёдо пригодится такая услуга! Вот и всё!"
10013055-211 = "Значит, вы хотите заключить с нами контракт?"
10013055-212 = "Я ни к чему вас не принуждаю. Но если хотите — да."
10013055-213 = "О! Но с этого момента нельзя забирать карты у проигравшего! Правила изменим для развлекательного формата!"
10013055-215 = "Ну, наверное, не помешает..."
10013055-216 = "...поиграть ещё. Верно?"
10013055-217 = "Ладно, договорились!"
10013055-218 = "О, но это значит, новый чемпион больше не чемпион?"
10013055-219 = "Точно... Д-Добро пожаловать обратно, бывший чемпион!"
10013055-220 = "Для нас бывший чемпион — единственный настоящий чемпион."
10013055-221 = "Ну вы даёте!"
10013055-222 = ""
10013055-224 = ""
10013055-226 = "[ns] «Отличная работа, Шизуко. Ещё один счастливый конец.»"
10013055-227 = "Не смотри на меня так!"
10013055-228 = "Я просто выбрала лучший вариант для бизнеса!"
10013055-229 = "[ns] «У нас ещё одна франшиза по контракту.»"
10013055-231 = "Ага! Продолжим в том же духе!"
10013055-232 = "Следующий пункт..."
