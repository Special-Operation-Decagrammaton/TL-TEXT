[translation]
52170-1 = "Episódio 17;O Retorno da Presidente"
52170-4 = "...Proposta de orçamento adicional para a montagem do local."
52170-5 = "...Termo de nomeação do responsável pela segurança do festival."
52170-6 = "Relatório de auditoria do subsídio do Clube Yin-Yang..."
52170-10 = "Ugh... ughhh...!"
52170-11 = "Por que estou lutando contra essa pilha de papelada logo na véspera do \"Festival Waraku\"...?"
52170-12 = "Meu plano de jogar todo o trabalho burocrático para a Kaho e sair para me divertir... quer dizer, inspecionar a cidade—"
52170-15 = "Pois bem, estamos indo para o ensaio.#nEnquanto isso, conto com você para despachar as solicitações acumuladas."
52170-16 = "Tô indo, tá~"
52170-17 = "Hã?! Eu também vou junto...!"
52170-18 = "Claro, não me importo se quiser nos acompanhar."
52170-19 = "Isto é, desde que termine toda a papelada atrasada do Festival Waraku, as solicitações e o resto do trabalho burocrático..."
52170-20 = "Augh...!"
52170-21 = "Até hoje, fiz vista grossa para as suas inúmeras negligências no trabalho, mas..."
52170-22 = "Se a negligência da Niya-sama acabar prejudicando o Festival Waraku..."
52170-23 = "Desta vez — não vou deixar barato, entendeu?"
52170-24 = "A Kaho tá com uma cara assustadora~"
52170-25 = "T-Tá bom, entendi..."
52170-28 = "A Kaho anda com a intuição mais afiada do que antes..."
52170-29 = "Ahh, eu também queria assistir ao ensaio da Chise-nyan..."
52170-30 = "Será que não tem por aí alguma desculpa boa para adiar essa papelada...?"
52170-31 = "Tipo uma visita inesperada, ou algo assim..."
52170-37 = "Niya-sama, desculpe interromper enquanto está ocupada."
52170-38 = "Temos uma visita. Diz ser um assunto urgente..."
52170-39 = "Ora, a desculpa...!"
52170-40 = "Desculpa?"
52170-41 = "N-Não, não é nada. Falando sozinha."
52170-42 = "Mas uma visita justo agora... Quem seria?"
52170-43 = "Alguém de outra academia querendo conhecer o \"Festival Waraku\"?"
52170-44 = "Não, na verdade..."
52170-45 = "É a Presidente do Comitê de Mediação de Conflitos Hyakkaryouran, Nanakado Ayame-san."
52170-46 = "A Presidente Ayame...?"
52170-51 = "Quanto tempo, Niya-sama."
52170-52 = "Tem passado bem?"
52170-53 = "Nyaha... bem eu estou, mas não dá para dizer que tudo anda às mil maravilhas."
52170-54 = "Durante a sua ausência, aconteceram muitas coisas em Hyakkiyako."
52170-55 = "Abandonar minhas responsabilidades como Presidente e me ausentar por tanto tempo... Sinto muito mesmo.#nPeço desculpas por todo o transtorno."
52170-56 = "Que nada, demos um jeito de manter tudo funcionando. Hehe."
52170-60 = "Então... você sabia que o pessoal do Hyakkaryouran foi até a Filial Ebisu à procura da \"Presidente Ayame\"?"
52170-61 = "Sim. Eu me encontrei com a Nagusa e as outras lá."
52170-62 = "Então por que voltou sozinha...?"
52170-63 = "E onde está o Sensei da Schale, que deveria estar com elas?"
52170-64 = "O assunto urgente é justamente esse..."
52170-65 = "Enquanto procurávamos o esconderijo do Clube Beleza da Natureza na Grande Planície Nevada, fomos atingidos por uma avalanche repentina."
52170-66 = "Por sorte eu saí ilesa, mas todas as outras ainda estão soterradas sob a neve.#nPreciso que enviem uma equipe de resgate o quanto antes—"
52170-67 = "...Hmm. Não há tempo a perder, então."
52170-68 = "Você ouviu?"
52170-72 = "Chamou, Niya-sama?"
52170-73 = "Envie imediatamente alunas de alta mobilidade para a Grande Planície Nevada no Distrito Autônomo do Norte.#nO pessoal do Hyakkaryouran e o Sensei [USERNAME] sofreram um acidente lá."
52170-74 = "S-Sim, senhora!"
52170-81 = "...Agradeço pela resposta rápida. Como esperado da Niya-sama."
52170-82 = "Imagina~ É apenas o meu dever como líder do Clube Yin-Yang."
52170-83 = "Bem, vou retornar à sala do clube—"
52170-91 = "Com licença."
52170-92 = "Desculpe incomodar quando deve estar cansada, mas posso fazer uma pergunta?"
52170-95 = "Sim, claro."
52170-98 = "Quem sofreu o acidente... foram todas as integrantes do Hyakkaryouran e o Sensei?"
52170-99 = "...?#nO que quer dizer com isso?"
52170-100 = "Ah, se está falando da Nagusa e da Kikyou—"
52170-101 = "Não, estou falando da Presidente do Hyakkaryouran, Nanakado Ayame-san."
52170-102 = "Você está apenas imitando ela — não passa de uma \"sombra\", não é?"
52170-103 = "O que está..."
52170-104 = "Achou mesmo que conseguiria esconder?#n— Exalando toda essa aura maligna?"
52170-105 = "Além disso... uma \"Nanakado Ayame que abandona suas companheiras em perigo de morte\"—#nNão dá nem para rir de uma piada dessas."
52170-110 = "Pois bem, onde está a Ayame-san?#n...Hyakumonogatari-san."
52170-111 = "...Como esperado da Presidente Niya, hein?#nPerceber tão rápido assim."
52170-116 = "...!"
52170-117 = "Mas... que problemão."
52170-123 = "Eu não me importo nem um pouco com companheiras, sabe?"
52170-125 = "Próximo;Mesma Cama, Sonhos Diferentes"
