[translation]
52170-1 = "Эпизод 17;Возвращение президента"
52170-4 = "...«Дополнительная заявка на услуги по установке сцены на площадке»."
52170-5 = "...«Запрос на назначение ответственного за безопасность фестиваля»..."
52170-6 = "«Аудиторский отчёт по субсидии клуба Инь-Ян»..."
52170-7 = ""
52170-9 = ""
52170-10 = "Угххх..."
52170-11 = "До радостного Фестиваля Вараку всего один день! Почему именно Я должна бороться со всей этой бумажной работой?"
52170-12 = "Что стало с моим прекрасным планом свалить всю скучную работу на Кахо и отправиться гулять по улицам под видом «инспекции»...?"
52170-14 = ""
52170-15 = "Ния, мы сейчас идём на репетицию, поэтому, пожалуйста, разберись с накопившимися документами, пока нас не будет."
52170-16 = "Пока-пока!"
52170-17 = "А? Что?! А я?!"
52170-18 = "Разумеется, Ния, тебя всегда рады видеть на репетициях."
52170-19 = "При условии, что ты сначала закончишь все просроченные документы и согласования по Фестивалю Вараку."
52170-20 = "У-ух..."
52170-21 = "Ния, я уже более чем привыкла к твоим маленьким уловкам и схемам, лишь бы не работать."
52170-22 = "Но если твоя лень создаст ХОТЬ ОДНУ проблему с Фестивалем Вараку..."
52170-23 = "...в этот раз ты ОБЯЗАТЕЛЬНО понесёшь последствия."
52170-24 = "Страшно... Кахо, ты страшная!"
52170-25 = "Поняла... Возражений нет..."
52170-27 = ""
52170-28 = "Кахо стала слишком проницательной... Пресекла мою лень прямо у источника..."
52170-29 = "Не могу поверить, что заполняю бумаги... пока Чисэ репетирует на сцене... Бу-ху."
52170-30 = "Хм... где бы найти срочный повод бросить всё это?"
52170-31 = "Может, какой-нибудь важный гость волшебным образом появится из ниоткуда..."
52170-32 = ""
52170-35 = ""
52170-37 = "Ния, прости, что отвлекаю, пока ты занята..."
52170-38 = "У нас гость. Дело... довольно срочное, можешь выйти встретить её?"
52170-39 = "Мой повод! Как вовремя!"
52170-40 = "Твой... повод?"
52170-41 = "А, ничего!"
52170-42 = "Но странное время для важного гостя..."
52170-43 = "Другая академия услышала о Фестивале Вараку и хочет увидеть Чисэ во всей её славе?"
52170-44 = "Нет, не совсем..."
52170-45 = "Пришла президент Совета урегулирования Хяккарёран, Нанакадо Аямэ."
52170-46 = "Президент Аямэ...?"
52170-50 = ""
52170-51 = "Давно не виделись, Ния."
52170-52 = "Как поживаешь?"
52170-53 = "Нья-ха-ха... Более-менее! Но воды были немного бурными."
52170-54 = "В Хяккияко хватало драматических событий, мягко говоря."
52170-55 = "...Верю. Мне не хватит слов, чтобы извиниться за то, что так долго пренебрегала обязанностями президента."
52170-56 = "Фу-фу. Уже одно это облегчает боль в моей душе."
52170-57 = ""
52170-59 = ""
52170-60 = "Так участницы Хяккарёран тебя нашли? Они отправились в дочернюю школу Эбису в надежде вернуть тебя."
52170-61 = "Да, вообще-то. Я только что была с ними."
52170-62 = "Ты вернулась одна? Они всё ещё в Эбису?"
52170-63 = "И разве Сенсей Шале не был с ними?"
52170-64 = "Да, именно. Поэтому я и поспешила найти тебя."
52170-65 = "Мы искали базу «Красоты природы» на Великом снежном поле, когда внезапно сошла лавина."
52170-66 = "Я чудом не оказалась под ней, но остальные застряли в снегу и находятся в серьёзной опасности. Нужно немедленно отправить спасательный отряд."
52170-67 = "...Если так, нельзя терять ни секунды."
52170-68 = "Есть кто-нибудь?"
52170-69 = ""
52170-72 = "Да, президент Ния?"
52170-73 = "Немедленно отправьте самых быстрых студентов в северный район. Похоже, участницы Хяккарёран и Сенсей [USERNAME] попали под лавину."
52170-74 = "Д-Да, госпожа! Сейчас же отправлю спасательный отряд!"
52170-75 = ""
52170-77 = ""
52170-81 = "...Спасибо за быструю реакцию."
52170-82 = "В конце концов, это моя обязанность как главы клуба Инь-Ян."
52170-83 = "Раз с этим разобрались, я вернусь в клубную комнату Хяккарёран и—"
52170-84 = ""
52170-86 = ""
52170-91 = "Стой."
52170-92 = "Ты наверняка устала после долгой дороги, но у меня всего один вопрос."
52170-94 = ""
52170-95 = "Конечно, спрашивай."
52170-98 = "Президент Аямэ среди тех, кто застрял?"
52170-99 = "...Что? Что ты имеешь в виду?"
52170-100 = "Если ты про Нагусу или Кикё..."
52170-101 = "Возможно, я выразилась неясно. Я спросила: президент Хяккарёран Нанакадо Аямэ находится среди тех, кто застрял в твоей лавине?"
52170-102 = "Думала, такая тень ускользнёт от моего внимания?"
52170-103 = "Что ты...?"
52170-104 = "Подумать только, ты решила, что сможешь обмануть меня этой мерзкой, искажённой аурой."
52170-105 = "Кроме того, Аямэ никогда не бросила бы человека в беде, тем более друга. Есть предел даже добровольной приостановке недоверия."
52170-106 = ""
52170-110 = "Так где настоящая Аямэ, Фантомное сказание?"
52170-111 = "...Ты раскусила меня быстрее, чем я ожидала, Ния. Но, наверное, удивляться нечему."
52170-112 = ""
52170-115 = ""
52170-116 = "...!"
52170-117 = "Но... что теперь?"
52170-118 = ""
52170-122 = ""
52170-123 = "В конце концов, Аямэ не так уж заботится о своих участницах, как тебе кажется."
52170-125 = "Следующий эпизод;На разных страницах"
