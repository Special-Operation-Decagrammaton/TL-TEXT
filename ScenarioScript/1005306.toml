[translation]
1005306-1 = "Спортивная карточка"
1005306-2 = "Офис Шале"
1005306-5 = "Сенсей, я пришла. По поводу отчёта, о котором говорила..."
1005306-6 = "О, Сенсея нет?"
1005306-7 = "На столе беспорядок. Он просто всё так и оставил..."
1005306-8 = "Вот именно поэтому я не могу оставлять Сенсея одного..."
1005306-9 = ""
1005306-11 = ""
1005306-12 = ""
1005306-13 = ""
1005306-14 = ""
1005306-15 = ""
1005306-16 = ""
1005306-17 = "А? Это..."
1005306-18 = ""
1005306-20 = ""
1005306-22 = "Моя фотография?!"
1005306-23 = "К-Когда вообще сделали этот снимок...? И почему он у Сенсея...?"
1005306-24 = "Неужели Сенсей тайком сфотографировал меня, чтобы каждый день видеть моё лицо?"
1005306-25 = "Я бы сама дала Сенсею фотографии, стоило только попросить..."
1005306-26 = "И это даже не обычная фотография. Тут я вся вспотевшая и растрёпанная во время матча."
1005306-27 = "Не могу точно понять почему, но то, что Сенсей хранит у себя этот случайный снимок меня, вспотевшей после матча, вызывает странное чувство..."
1005306-28 = ""
1005306-32 = "[ns] «О. Ты здесь, Юука.»"
1005306-33 = "С-Сенсей? Где ты был?"
1005306-34 = "[s1] «Я ходил проверить оборудование на складе.»\n[s2] «Кстати, что это у тебя...?»"
1005306-35 = "Э-Это..."
1005306-36 = "Э-Это..."
1005306-37 = "Это я должна спрашивать! Почему у тебя эта фотография?!"
1005306-38 = "Педагог должен уважать учеников, а не тайно хранить их фотографии!"
1005306-39 = "Э-Это аморально!"
1005306-40 = "[s3] «Ты про спортивную карточку?»\n[s4] «Мне её дал студент „Кроноса“.»"
1005306-41 = "Спортивная... карточка?"
1005306-42 = "Спортивная... карточка?"
1005306-44 = "...А. То есть коллекционная карточка со спортсменом..."
1005306-45 = "Я знала, что такие карточки существуют, но не думала, что сама когда-нибудь на такую попаду."
1005306-46 = "Я действительно разрешила школе «Кронос» использовать мои фотографии с соревнований, но не думала, что они вот так начнут на мне зарабатывать..."
1005306-47 = "Если бы знала об их планах, внимательнее изучила бы договор."
1005306-48 = "[s5] «Раз разрешение уже было, значит с фотографией всё нормально, да?»\n[s6] «Ну, фотография хорошая.»"
1005306-49 = "В любом случае интересно, что такие обычные с виду карточки могут продаваться за такие большие деньги..."
1005306-50 = "Т-Ты так говоришь, но..."
1005306-51 = "В любом случае интересно, что такие обычные с виду карточки могут продаваться за такие большие деньги..."
1005306-52 = "Я слышала об этом, работая казначеем, но всё равно не понимаю мир коллекционных карточек."
1005306-53 = "Говорят, стоимость таких спортивных карточек растёт вместе с успехами спортсмена..."
1005306-54 = "Может, когда-нибудь и моя карточка будет стоить дорого, хе-хе."
1005306-55 = "Сейчас я всего лишь казначей, но если буду усердно работать, возможно, однажды стану президентом Миллениума."
1005306-56 = "Слышала, что спортивные карточки с автографом продаются ещё дороже..."
1005306-57 = "Так что, Сенсей, хочешь мой автограф?"
1005306-58 = "[s] «Хорошо.»"
1005306-60 = "[ns] «Но эта карточка никогда не станет дорогой.»"
1005306-61 = "...Почему?"
1005306-62 = "Ты не веришь, что я смогу стать президентом?"
1005306-63 = "[ns] «Ничего подобного...»"
1005306-65 = "[ns] «Я просто никогда не продам эту карточку. Оставлю её себе навсегда.»"
1005306-66 = ""
1005306-68 = ""
1005306-69 = ""
1005306-70 = ""
1005306-72 = "...К-Как неприлично."
