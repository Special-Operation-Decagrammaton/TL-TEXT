[translation]
83300100500-5 = ""
83300100500-6 = "Я застала тебя за мечтами?"
83300100500-7 = "Ах!"
83300100500-8 = "Да — то есть нет, глава префектов! Я готова выполнить любой приказ!"
83300100500-9 = "Я пришла не отдавать тебе приказы."
83300100500-10 = "Просто проверяю обстановку. Эта атмосфера, нависшая над Геенной, меня беспокоит."
83300100500-11 = "П-п-прошу прощения! Обещаю, такого больше не повторится!"
83300100500-12 = "Хм? Такого...?"
83300100500-13 = "Я просто разволновалась после возвращения с зимней тренировки, когда все заговорили о вечеринке Геенны!"
83300100500-14 = "И позволила этому отвлечь меня от обязанностей члена Префектурной команды! Простите меня!"
83300100500-15 = "...Вечеринка Геенны?"
83300100500-16 = "Прошу прощения, глава префектов!"
83300100500-17 = "Ако? Что такое?"
83300100500-18 = "Я поспрашивала вокруг и выяснила, что пока мы были на зимней тренировке..."
83300100500-19 = "Объявили о специальной «Вечеринке Геенны» в честь Дня святого Валентина!"
83300100500-20 = "...Я тоже только что об этом узнала."
83300100500-21 = "Если подумать, примерно в это время года в Геенне традиционно проводили праздник. Видимо, некоторые студенты решили возродить традицию."
83300100500-22 = "Но подготовка выглядит куда суматошнее, чем я помню. У тебя есть ещё какие-нибудь подробности?"
83300100500-23 = "А-а, ну... я слышала, что первым к подготовке вечеринки приступил Клуб школьных обедов!"
83300100500-24 = "Клуб школьных обедов?"
83300100500-25 = "Хорошо. Возможно, я узнаю больше, если схожу к ним."
83300100500-26 = "Ако, продолжай собирать информацию здесь."
83300100500-27 = "Есть! Положитесь на меня!"
