[translation]
1011102-1 = "Удивительная обыденность"
1011102-2 = "Парк района Миллениум"
1011102-3 = ""
1011102-5 = "[ns] «Привет, Нэру.»"
1011102-6 = "А, Сенсей."
1011102-7 = "Я и не знала, что вы уже здесь. Чуть не уснула."
1011102-8 = "[s] «Это твоя школьная форма?»"
1011102-9 = "А, вы ведь раньше не видели меня в таком виде, да?"
1011102-10 = "Похоже, что нет."
1011102-11 = "Казначей Семинара попросила меня надеть её хотя бы на время мероприятия."
1011102-12 = "Обычно я бы её проигнорировала..."
1011102-13 = "Я и сама почти ничего не знаю об этом мероприятии и о том, насколько оно важно, но она была чертовски серьёзна, и я не смогла отказать."
1011102-14 = "Вообще-то... из-за формы я вас и позвала."
1011102-15 = "Без бомбера такое чувство, будто чего-то не хватает."
1011102-16 = "Так что... я хотела... попросить у вас совета..."
1011102-17 = "..."
1011102-18 = ""
1011102-20 = ""
1011102-21 = "А-а-а-а!"
1011102-22 = "[s] «Т-ты в порядке?!»"
1011102-23 = "Дело не только в куртке. Такое чувство, будто часть меня самой исчезла!"
1011102-24 = "Так неловко! Так странно! Будто я голая!"
1011102-25 = "Как вам? В одной форме я ведь выгляжу нелепо, да? Мне стоит сделать всё возможное, чтобы снова надеть куртку, да?"
1011102-26 = "[s] «...Вообще-то, по-моему, ты выглядишь мило.»"
1011102-27 = "Ч-что?!"
1011102-28 = "Не шутите со мной! Я сейчас серьёзно!"
1011102-29 = "[s] «...Тебе идёт.»"
1011102-30 = "Я-я вам не верю."
1011102-31 = "*кхм* В-в любом случае!"
1011102-32 = "Вот зачем я вам написала."
1011102-33 = "То есть, по крайней мере, вы не думаете, что я выгляжу странно..."
1011102-34 = "Это, конечно, радует, но «мило» на мне это точно не выглядит."
1011102-35 = "[s] «Всё нормально...»"
1011102-37 = "[ns] «...что бы на тебе ни было, ты всё равно остаёшься Нэру.»"
1011102-38 = "А?! Ну да, это само собой!"
1011102-39 = "Я и без куртки могу уложить одну-две шайки отморозков!"
1011102-40 = "...Почему вы улыбаетесь? Рады, что я снова веду себя как обычно?"
1011102-41 = "...Хаха!"
1011102-42 = "Хорошо, что вы здесь. После разговора с вами мне всегда легче."
1011102-43 = "В общем, дело, ради которого я вас звала, закончено, но, эм, нам ведь необязательно сразу расходиться. Может, присядете со мной?"
1011102-44 = ""
1011102-46 = ""
1011102-47 = ""
1011102-48 = "Сюда, вот здесь."
1011102-50 = "Хм-м, мне кажется или сегодня вокруг как-то слишком тихо?"
1011102-51 = "Может, из-за мероприятия. Или не знаю, может, мне просто кажется."
1011102-52 = "[s] «По-моему, всё как обычно.»"
1011102-53 = "Нет-нет. Что-то определённо не так."
1011102-54 = "Может, в Миллениуме что-то происходит, а я просто всё пропустила."
1011102-55 = "А, вон кто-то идёт. Давайте просто посмотрим."
1011102-56 = ""
1011102-58 = ""
1011102-60 = ""
1011102-61 = ""
1011102-62 = ""
1011102-63 = ""
1011102-64 = ""
1011102-65 = "[ns] «Не понимаю...»"
1011102-66 = "Я и раньше сидела на этой скамейке, и люди просто проходили прямо передо мной."
1011102-67 = "А? В смысле «что тут странного»? Обычно люди говорят: «Что здесь делает президент C&C?» или «О нет, она меня увидела! Бежим!»"
1011102-68 = "Ну, что-то в таком духе."
1011102-69 = "[ns] «(Может, тебя просто не узнают в обычной одежде...)»"
1011102-70 = "Но сегодня вообще ничего такого."
1011102-71 = "Не то чтобы я ХОТЕЛА внимания, и мне всё равно, что они говорят. Просто странно, насколько всё иначе."
1011102-72 = "Будто происходит что-то важное, а я одна не в курсе."
1011102-73 = "Уф, без этой куртки я СОВСЕМ не в своей тарелке!"
1011102-74 = "[s3] «Эй-эй. Успокойся.»\n[s4] «Давай просто глубоко вдохнём...»"
1011102-77 = "*вздыхает*"
1011102-78 = "Как вы думаете, Сенсей? Как ни посмотри, всё это странно."
1011102-79 = "[s] «Интересно...»"
1011102-80 = ""
1011102-82 = ""
1011102-85 = ""
1011102-86 = "Ну надо же, кого я вижу. Кто её сюда позвал?"
1011102-87 = ""
1011102-89 = ""
1011102-90 = "Ке-ке-ке, это наша территория, мелкая. Хочешь здесь сидеть — плати, поняла?"
1011102-91 = "Ага, это будет стоить... Сколько там стоят те крепы в ларьке дальше по улице?"
1011102-92 = "Хм?"
1011102-93 = "Это вы мне?"
1011102-94 = "Ну да, а кому ещё он—"
1011102-95 = ""
1011102-97 = ""
1011102-98 = ""
1011102-99 = "...А? Ты разве не...?"
1011102-100 = "Лицо знакомое... Чёрт, это же Микамо Нэру!"
1011102-101 = ""
1011102-103 = ""
1011102-104 = "А мне и твоё лицо знакомо. Кажется, я уже преподала тебе этот урок раньше."
1011102-105 = "Я-я не знала! Почему на тебе нет бомбера?!"
1011102-106 = "Это вообще-то против правил! Ты нас обманула! Нечестно!"
1011102-107 = "Хотя бы надевай куртку, чтобы мы могли убежать, как только её увидим!"
1011102-108 = "У меня есть причины сегодня её не надевать."
1011102-109 = "Но раз уж встретились, давайте вспомним, о чём мы говорили в прошлый раз."
1011102-110 = "Ик!"
1011102-111 = "Кажется, я сказала: «Если ещё раз увижу, как вы творите какую-нибудь хрень, получите по башке». Примерно так, да?"
1011102-112 = ""
1011102-119 = ""
1011102-120 = ""
1011102-121 = ""
1011102-122 = ""
1011102-123 = "Угх..."
1011102-124 = "М-мы ещё доберёмся до тебя!"
1011102-125 = ""
1011102-131 = "[ns] «Э-это быстро закончилось...»"
1011102-132 = "Ага, я специально быстро закончила. Полегче с ними обошлась за то, что у них хватило смелости полезть на меня."
1011102-133 = "Меня раньше никто не пытался ограбить. Даже непривычно."
1011102-134 = "[s] «Ну, сначала они не знали, кто ты.»"
1011102-135 = "Наверное. То есть да, если бы знали, скорее всего, держались бы подальше."
1011102-136 = "А причина, почему они не знали..."
1011102-137 = "[s] «...снова в куртке?»"
1011102-138 = "Ага, куртка сильно бросается в глаза. Её легко заметить издалека."
1011102-139 = "О, погодите-ка. Может, именно поэтому сегодня всё кажется таким другим. Не потому, что что-то произошло..."
1011102-140 = "...а потому что меня никто не узнаёт."
1011102-141 = "[s] «Вполне возможно.»"
1011102-142 = "Сегодня люди даже второй раз на меня не смотрят. Это..."
1011102-143 = ""
1011102-145 = ""
1011102-146 = "...даже приятно?"
1011102-147 = "По крайней мере, интересно. Хорошая смена обстановки."
1011102-148 = "Как я и говорила, у меня тоже всё новые впечатления. Ахаха!"
1011102-149 = "[s] «Т-тебе нравится?»"
1011102-150 = "Ну, если бы у меня был ВЫБОР, я бы, конечно, надела куртку..."
1011102-151 = "...но так и правда становится довольно весело."
1011102-152 = "О, знаете что?"
1011102-153 = "А если я просто пойду в школу в таком виде? Как думаете, там меня кто-нибудь узнает?"
1011102-154 = ""
1011102-156 = ""
1011102-157 = ""
1011102-158 = "Надо выяснить! Пойдёмте, Сенсей! Вперёд!"
1011102-160 = "После этого я гулял по Миллениуму вместе с воодушевлённой Нэру."
