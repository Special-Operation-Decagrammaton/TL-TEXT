[translation]
1010203-1 = "Защитимся от ультрафиолета"
1010203-2 = "Я отправился искать Хиёри на пляже."
1010203-4 = "Ай-ай-ай... Больно... Щиплет!"
1010203-5 = "А!! Сенсей?! Ч-Что вы здесь делаете?"
1010203-6 = "Ай, ай, ай-ай-ай!"
1010203-7 = "[s1] «Ты в порядке, Хиёри?»\n[s2] «Иди сюда, дай посмотреть.»"
1010203-10 = "Ува-а-а... Смотрите, Сенсей! Посмотрите! Кожа совсем красная."
1010203-11 = "Я пыталась смыть это морской водой... но соль так сильно щиплет!"
1010203-12 = "УА-А-А! Не верю, что моё лето закончится вот так! Если я даже ногой в воду зайти не могу, зачем мне вообще этот купальник?"
1010203-13 = "Неужели мне суждено вечно кочевать из одного тёмного убежища в другое?"
1010203-14 = "[s] «Так-так. Успокойся и присядь в тени.»"
1010203-15 = "*шмыгает носом* Ладно..."
1010203-17 = ""
1010203-18 = "...А? Вы чувствуете какой-то ореховый запах?"
1010203-19 = "А, у вас хороший нюх, Сенсей."
1010203-20 = "[s] «Это... кунжутное масло?»"
1010203-21 = "Именно. На солнцезащитный крем денег не было, поэтому я взяла кунжутное масло в ближайшем магазине и намазалась им."
1010203-22 = "В журнале была статья, где говорилось, что на пляже люди пользуются маслом. Хи-хи."
1010203-23 = "Но кунжутного масла мне не хватило. Я смогла намазать только грудь и живот."
1010203-24 = "Но я решила, что и этого хватит, и всё равно пошла загорать."
1010203-25 = "[s] «Кунжутное масло не защищает от ультрафиолета!»"
1010203-26 = "Т-Теперь я знаю! Всё пропало! Я так сильно обгорела, что не смогу насладиться ни одной секундой на пляже."
1010203-27 = "Мне придётся жить в тёмной пещере с летучими мышами! Просто ждать, пока лето наконец закончится..."
1010203-28 = "Всё пропало! УА-А-А-А!"
1010203-30 = "Мне удалось немного успокоить истерящую Хиёри и отвести её в ближайший пляжный домик."
1010203-32 = "*шмыгает носом* *шмыгает носом* Наверное... лёд немного... помогает..."
1010203-33 = "Всё ещё больно, но кожа уже выглядит более нормально..."
1010203-34 = "Хи... хи-хи... Сенсей, можете приложить и спереди, пожалуйста?"
1010203-35 = "А... Как приятно."
1010203-36 = "[s] «С этого момента обязательно пользуйся нормальным солнцезащитным кремом. Поняла?»"
1010203-37 = "Хи... хи-хи... Хорошо."
1010203-38 = "Особое лечение пакетом со льдом от самого Сенсея... Может, всё это даже стоило того? Хи-хи-хи..."
1010203-39 = ""
1010203-41 = ""
1010203-42 = ""
1010203-43 = ""
1010203-44 = "Одно моримори-мороженое!"
1010203-45 = "Мне со вкусом кукурузного супа!"
1010203-46 = "Вот!"
1010203-48 = "..."
1010203-49 = "Хи... хи-хи... Раз вы уже помогаете мне охладиться, можно мне ещё мороженое?"
1010203-50 = "Снаружи моё тело уже остывает, но изнутри его тоже нужно лечить!"
1010203-51 = "[s] «Ладно, давай.»"
1010203-52 = "Хи-хи. Спасибо!"
1010203-53 = ""
1010203-55 = ""
1010203-56 = "В-Вкусно! Чувствую, как жара тает!"
1010203-57 = "Теперь я полностью восстановилась!"
1010203-58 = "[s] «Но всё равно не переусердствуй!»"
1010203-59 = "Д-Да!"
1010203-60 = "Я только быстренько выйду наружу...!"
1010203-61 = ""
1010203-63 = ""
1010203-64 = ""
1010203-66 = "А-Ай?!"
1010203-67 = ""
1010203-72 = "― [log=히요리 수영복]Ай... Больно... [/log][wa:3310]"
1010203-75 = "― [log=히요리 수영복]Ик! Моё мороженое...[/log][wa:1500]"
1010203-78 = "― [log=히요리 수영복]Всё пропало! Совсем пропало![/log][wa:990]"
1010203-79 = "― [log=히요리 수영복]Я откусила всего один раз, а теперь оно всё в песке! [/log][wa:2990]"
1010203-82 = "― [log=히요리 수영복]Похоже, даже мороженое — роскошь, которой я не заслуживаю![/log][wa:3880]"
1010203-83 = "― [log=히요리 수영복]Жизнь отвернулась от меня!![/log][wa:2060]"
1010203-86 = "― [log=히요리 수영복]Почему моя жизнь полна таких испытаний?[/log][wa:2240]"
1010203-87 = "― [log=히요리 수영복]Все остальные могут наслаждаться летом...[/log][wa:2300]"
1010203-90 = "― [log=히요리 수영복]Как бы я ни старалась,[/log][wa:130]"
1010203-91 = "― [log=히요리 수영복]это мечта, до которой мне никогда не дотянуться...[/log][wa:3070]"
1010203-94 = "― [log=히요리 수영복]...Что? Вы купите мне ещё одно? [/log][wa:1610]"
1010203-97 = "― [log=히요리 수영복]То есть если бы я не уронила первое мороженое,[/log][wa:3060]"
1010203-98 = "― [log=히요리 수영복]у меня было бы ДВА мороженых?![/log][wa:620]"
1010203-101 = "― [log=히요리 수영복]УА-А-А! Всё и правда ужасно![/log][wa:1140]"
1010203-104 = "...*шмыгает носом*"
1010203-105 = "Спасибо, Сенсей. Вы в итоге даже купили мне какигори..."
1010203-106 = "Всё было так вкусно. Хи-хи. Спасибо."
1010203-107 = "[s] «Теперь тебе лучше?»"
1010203-108 = "Д-Да..."
1010203-109 = "Вы всё время что-то мне даёте, Сенсей... Я и благодарна... и чувствую вину..."
1010203-110 = "Ч-Что это за выражение лица?! Я-я вообще-то способна хоть немного анализировать свои поступки!"
1010203-111 = "В следующий раз я сама что-нибудь для вас сделаю..."
1010203-112 = "Может, найду вам журналы в контейнерах для макулатуры?"
1010203-113 = "Какие журналы вам нравятся? Н-Наверное, такие... п-пошленькие?"
1010203-114 = "[s3] «Нет-нет. Не нужно.»\n[s4] «Я ничего не ждал взамен.»"
1010203-117 = "П-Правда?"
1010203-118 = "Но... меня учили, что за доброту всегда нужно отплачивать..."
1010203-119 = "Т-Так что в следующий раз ждите чего-нибудь невероятного! Хи-хи."
