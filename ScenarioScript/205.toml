[translation]
205-1 = "Налёт на Кайтенгер!"
205-3 = "Давно не виделись, Сенсей."
205-4 = "Что за кислое лицо? Удивлены увидеть меня здесь?"
205-5 = "Ждали, что я устрою из этого больше шума? Не повезло. Моего милого личика вам должно быть более чем достаточно. *хрум*"
205-6 = "Ладно. Вот вам ещё немного рутины."
205-7 = "Это Кайтенгер, самые разыскиваемые злодеи Кивотос. Мы выяснили, где эти идиоты устроили базу."
205-8 = "Наверняка задумали что-то плохое."
205-9 = "Иначе зачем им красть кучу денег, чтобы раздобыть нелегальное оружие?"
205-10 = "Ещё они безжалостно воруют чертежи оружия и материалы для крафта."
205-11 = "И что они собираются делать со всеми этими деньгами и снаряжением?"
205-12 = "Ха-ха-ха. Кто знает? Но уверена, для Кивотос ничего хорошего."
205-13 = "Пора Шале снова стать полезн— То есть... любезно помочь."
205-14 = "Хочу, чтобы вы отправились на их базу и разнесли в клочья всё, что они там замышляют. *хрум*"
205-15 = ""
205-16 = ""
205-18 = ""
205-19 = "До встречи, Сенсей. Жду хороших новостей."
