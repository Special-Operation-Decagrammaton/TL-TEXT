[translation]
84304200200-5 = "Теперь, когда всё более-менее уладилось..."
84304200200-7 = "Угх..."
84304200200-8 = "Ч-Что... Кто ты...?!"
84304200200-9 = "Кто...?!"
84304200200-10 = ""
84304200200-13 = ""
84304200200-14 = ""
84304200200-16 = ""
84304200200-17 = "...Ик!"
84304200200-19 = "Ничего себе, какое клише. Вас всем этим фразочкам в школе бандитов учат, что ли?"
84304200200-20 = "И вообще, Я победила ВАС! С чего это ВЫ задаёте вопросы?"
84304200200-21 = "Так, кто вы? Почему вы здесь и зачем портите школьное мероприятие?"
84304200200-22 = ""
84304200200-24 = ""
84304200200-26 = ""
84304200200-27 = "И хорошенько подумайте, что ответить."
84304200200-28 = ""
84304200200-31 = ""
84304200200-32 = "Мы ничего плохого не хотели! У нас нет никаких претензий к этой школе!"
84304200200-33 = "Ага. Это просто... Просто подработка...!!"
84304200200-35 = "...Подработка, значит?"
84304200200-36 = "Кто вас нанял? Что вы об этом знаете?"
84304200200-38 = "А... Не могу сказать. Нехорошо будет, если я сразу начну всё выбалтывать—"
84304200200-39 = ""
84304200200-43 = ""
84304200200-44 = ""
84304200200-46 = "Следующая. Ты."
84304200200-47 = "Ииик!!"
84304200200-48 = "Мы не знаем! Правда не знаем!! Мы не знаем, кто она!"
84304200200-49 = "Она просто позвонила нам и сказала, что заплатит, если мы сделаем, как она велит...!!"
84304200200-50 = ""
84304200200-54 = ""
84304200200-55 = "О, телефон звонит..."
84304200200-56 = "...Мне ответить?"
84304200200-57 = "На громкой связи."
84304200200-58 = ""
84304200200-60 = ""
84304200200-63 = ""
84304200200-64 = "А. Алло? Вы меня слышите?"
84304200200-65 = "Может, связь не проходит... Как там дела? Всё по расписанию?"
84304200200-66 = "Эм, д-да. Мы разобрались с фитнес-центром, как вы сказали. Теперь вы переведёте деньги?"
84304200200-67 = "Конечно! Похоже, работа была непростой. Но вы молодцы! Я отправлю оплату..."
84304200200-68 = "...А!"
84304200200-69 = "О, есть ещё одно дело. Не могли бы вы заняться и им?"
84304200200-70 = "Я сразу же заплачу и за него."
84304200200-71 = "А?! Ещё одно дело...? Ч-Что? Разве всё уже не закончилось?"
84304200200-72 = "Когда работаешь над большими проектами, тут и там всплывают мелкие проблемы."
84304200200-73 = "Эм, н-нет. Мы закончили! Мы сделали достаточно, так что просто быстрее платите. Прямо сейчас!!"
84304200200-74 = "Хм?"
84304200200-75 = "Хм? Странная реакция. Я думала, вы обрадуетесь."
84304200200-76 = "Задание оказалось напряжённее, чем вы ожидали? Или у вас внезапно появилась важная встреча в другом месте?"
84304200200-77 = "Или, если дело не в этом..."
84304200200-79 = "...может, вы просто не хотите добавлять новые преступления к уже имеющимся, раз вас поймал враг."
84304200200-80 = "...!!"
84304200200-81 = "..."
84304200200-82 = "Ой, какая реакция... Я просто предположила, а, похоже, попала точно в цель."
84304200200-83 = "Мои соболезнования... но, если помните, в нашем контракте сказано: если вас поймают во время работы..."
84304200200-84 = "...и вы нарушите соглашение о неразглашении, контракт аннулируется. Включая оплату, к сожалению."
84304200200-85 = "Ч-Что?! Нет, не может быть...! Вы знаете, как тяжело мы работали??"
84304200200-86 = "Мне ли не знать. И правда жаль. Хотя стоило подумать об этом до того, как вас поймали."
84304200200-87 = "Не переживайте. Я не чудовище. И раз вы так старались, готова дать вам ещё один шанс."
84304200200-88 = "Заметьте, в контракте этого нет. Это личная услуга от меня вам, в знак признания всего, что вы сделали."
84304200200-89 = "Что ты...?"
84304200200-90 = "Должна предупредить: это будет трудно. Совсем не просто."
84304200200-91 = "Почему? Ну, если я не ошибаюсь, вас удерживает никто иная, как Микамо Нэру из C&C."
84304200200-93 = "...!!"
84304200200-94 = "Откуда ты знаешь?"
84304200200-95 = "Хаха. Когда занимаешься этим столько же, сколько я, не знать невозможно. Ты очень известна."
84304200200-96 = "Знаешь, забавно. В последнее время ты была такой независимой. Не думала, что ты и правда снова станешь правой рукой президента Цукацуки Рио."
84304200200-97 = "Ты... что?"
84304200200-98 = "О чём ты вообще? Я никогда не была её правой рукой."
84304200200-99 = "О? Вот как? А, тогда это было просто партнёрство."
84304200200-100 = "Прошу прощения за недоразумение. Я думала, вы подруги."
84304200200-101 = "Хаха, ну конечно. Всё логично. Кто вообще..."
84304200200-102 = "...ЗАХОТЕЛ БЫ работать с такой, как она? Я права?"
84304200200-103 = "Это ты сказала, не я."
84304200200-104 = "В любом случае, сейчас важно не это! Вернёмся к делу: люди, которых вы поймали, мои союзники. Мы все вместе работали над этим проектом."
84304200200-105 = "И даже если их схватили, у нас есть контракт, по которому мы должны сделать всё вместе."
84304200200-106 = "Бросить их на произвол судьбы было бы плохим бизнесом. В отличие от НЕКОТОРЫХ, кого я могла бы назвать, я это понимаю."
84304200200-107 = ""
84304200200-110 = "...Что это было...?"
84304200200-111 = "Что за звук? Что-то пищит..."
84304200200-112 = ""
84304200200-115 = ""
84304200200-116 = "*вздох* Бомба!!"
84304200200-117 = ""
84304200200-121 = ""
84304200200-122 = "*кашель* *кашель*...!! Когда она успела заложить здесь бомбу?!"
84304200200-123 = "Сейчас ваш шанс!! Все! Отступаем!!"
84304200200-124 = ""
84304200200-126 = ""
84304200200-128 = "*вздох* Эй!! Вставай, вставай!! Нам надо бежать!!"
84304200200-129 = ""
84304200200-131 = ""
84304200200-132 = "Х-Хм?! А...?! Взрыв?!"
84304200200-133 = "Напугало...!! А? Я потеряла сознание?"
84304200200-134 = "Забудь! Беги!!"
84304200200-135 = ""
84304200200-137 = ""
84304200200-138 = ""
84304200200-139 = "Они играют грязно...!!"
84304200200-140 = "Стоять!!"
