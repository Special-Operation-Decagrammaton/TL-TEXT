[translation]
52195-9 = "Já faz meio dia que estamos andando..."
52195-10 = "Só tem neve e pedra aqui! É mesmo por esse caminho?!"
52195-11 = "...Sim, está certo."
52195-12 = "A neve está mais funda do que daquela vez, mas eu me lembro deste tronco e do caminho que leva ao templo."
52195-13 = "Este é o Templo do Crepúsculo."
52195-14 = "Chegamos?"
52195-15 = "Senpai, mas este lugar... não parece ter ninguém aqui..."
52195-16 = "...Parece que já está em ruínas há muito tempo."
52195-17 = "Haha... Ahahaha!"
52195-18 = "O que exatamente você está tentando fazer, Nagusa-chan?"
52195-19 = "Me trazer pra umas ruínas dessas..."
52195-20 = "Você tava se divertindo me vendo seguir vocês feito boba?"
52195-21 = "Ou será que... acha que tem alguma chance de vencer lutando aqui?"
52195-22 = "Que decepção... que grande decepção!"
52195-23 = "Não sei que truquezinho barato você planejou, mas é tudo, tudinho em vão, sabia?"
52195-24 = "Porque vocês vão dormir o sono eterno bem aqui...!"
52195-25 = "Finalmente mostrou a verdadeira face...!"
52195-26 = "Acha mesmo que a gente vai cair sem lutar?!"
52195-30 = "Não, é aqui mesmo. Eu não estou mentindo."
52195-35 = "Foi aqui que eu recebi a carta endereçada ao Sensei de uma garota que se chamava Kuzunoha."
52195-36 = "Quando vim aqui antes, as cerejeiras estavam em plena floração... e um caminho lindo se estendia à frente."
52195-37 = "Que história absurda—"
52195-38 = "Nas palavras dela, o Crepúsculo é o lugar onde tudo na realidade perde o sentido."
52195-39 = "Lá dentro, é um mundo onde as cerejeiras da primavera e os lírios-aranha do outono florescem ao mesmo tempo.#nNão seria estranho se o passado e o presente se cruzassem ali."
52195-41 = "Quando o crepúsculo difuso tinge o céu..."
52195-43 = "Trocando palavras entre o sol poente e a escuridão da noite..."
52195-45 = "Seu nome é—"
52195-51 = "Comitê de Mediação de Conflitos Hyakkaryouran... a primeira Presidente, Kuzunoha."
52195-54 = "Ué? Até agora há pouco isso aqui era só uma ruína caindo aos pedaços..."
52195-55 = "As flores de cerejeira estão desabrochando..."
52195-63 = "Estranhei tamanha algazarra, e eis que são visitantes...?#nEspero que não sejam convidados indesejados."
52195-64 = "E o seu nome é—"
52195-65 = "...Comitê de Mediação de Conflitos Hyakkaryouran, Presidente Interina, Goryou Nagusa."
52195-66 = "Conforme o seu desejo, eu trouxe o Sensei da Schale."
52195-73 = "Hehe... Não esperava revê-la tão cedo, minha querida caloura."
52195-75 = "Próximo;A Verdadeira Forma"
