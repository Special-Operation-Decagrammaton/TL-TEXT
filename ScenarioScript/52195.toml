[translation]
52195-9 = "Мы идём уже полдня..."
52195-10 = "Везде один и тот же снег и камни! Ты уверена, что мы идём правильно?!"
52195-11 = "...Да."
52195-12 = "Снега стало больше, но этот пень сакуры и каменная тропа отмечают путь."
52195-13 = "Сумеречный храм. Мы пришли."
52195-14 = "Это... и есть знаменитый храм?"
52195-15 = "Но он выглядит совершенно заброшенным..."
52195-16 = "...В нём есть какая-то застойность, словно человеческое дыхание не касалось этого воздуха сотни лет."
52195-17 = "Ха-ха, ха-ха-ха...!"
52195-18 = "Ты серьёзно, Нагуса? На что ты надеялась, устраивая этот спектакль?"
52195-19 = "Сказала, что приведёшь меня к Кузунохе, а сама притащила в развалины, куда веками никто не ступал?"
52195-20 = "Надеешься посмеяться надо мной, когда я пойму?"
52195-21 = "Или думала, что сможешь подраться и сбежать, раз я одна?"
52195-22 = "Не повезло!"
52195-23 = "Какую бы тупую схему ты ни придумала, всё зря!"
52195-24 = "Потому что теперь эти руины станут вашей могилой!"
52195-25 = "Вот ты и показала истинное лицо, Ябуки Сюро!"
52195-26 = "Думаешь, мы просто ляжем и сдадимся?!"
52195-27 = ""
52195-29 = ""
52195-30 = "Нет. Я не лгала."
52195-31 = ""
52195-33 = ""
52195-34 = ""
52195-35 = "Я действительно встретила здесь девушку, назвавшую себя Кузунохой, и она передала мне письмо для Сенсея."
52195-36 = "Когда я была здесь в прошлый раз, этот пень цвёл сакурой, а каменная тропа сияла."
52195-37 = "О чём ты вообще...?"
52195-38 = "По её словам, Сумеречный храм — место, где течение времени ведёт себя по собственному желанию."
52195-39 = "Прошлое существует между настоящим и будущим, а весенние цветы сакуры напевают свои мелодии рядом с осенними хиганбанами."
52195-41 = "Когда когти ночи схватят небо, а тьма настолько глубокая, что скрывает человеческий взор..."
52195-43 = "...повернись к заходящему солнцу и обменяйся именами за пределами сумерек."
52195-45 = "...Кто здесь?"
52195-46 = ""
52195-49 = ""
52195-51 = "...Я Кузуноха, первый президент Совета урегулирования Хяккарёран."
52195-54 = "А? Секунду назад здесь были одни развалины..."
52195-55 = "Сакура... цветёт."
52195-62 = ""
52195-63 = "Гостей давно не видели эти врата храма... и сколько же шума вы с собой принесли."
52195-64 = "Очень надеюсь, что передо мной не любопытные незваные гости из прошлых веков... Итак, кто меня искал?"
52195-65 = "...Я Горё Нагуса, исполняющая обязанности президента Совета урегулирования Хяккарёран."
52195-66 = "Как вы и просили, я привела Сенсея из Шале."
52195-72 = ""
52195-73 = "Фу-фу. Вот это приятное лицо, моя дорогая младшая."
52195-75 = "Следующий эпизод;Истинная форма"
