[translation]
10057040-1 = "Episode 4;It is as you say, but I am right."
10057040-4 = "Th-th-that is a truly wonderful design. Elina, you are... s-so amazing...!"
10057040-9 = "Ugh... I suddenly got the chills... I feel like throwing up..."
10057040-10 = "You are just doing as Sensei told you to!"
10057040-11 = "Sensei, is this really okay!?"
10057040-12 = "[s] \"It feels good. Shall we try a little more?\""
10057040-14 = "As expected of you, Sensei. I never imagined there would be such an approach."
10057040-15 = "If our win rate is staying at fifty-fifty, we do not even need to go through the RWWE..."
10057040-16 = "We can just take turns agreeing with each other's opinions..."
10057040-17 = "What an efficient solution."
10057040-19 = "But do you really need to praise me this much!?"
10057040-20 = "Even if you force yourself to praise me, it just feels creepy--!!"
10057040-21 = "[s1] \"Politeness costs nothing, you know.\"\n[s2] \"There is no harm in being praised, after all.\""
10057040-27 = "We are not friends!"
10057040-34 = "Since both parties' opinions matched this time, the match is a draw."
10057040-35 = "...You two, please do as Sensei says."
10057040-36 = "I do not want the two of you to fight. #nBesides, this time I want the three of us to join forces and get results no matter what."
10057040-37 = "Everyone is capable, so I do not want to waste time arguing over who is right."
10057040-42 = "T-That is true. Sensei is busy, yet came all the way out here..."
10057040-43 = "Understood, it is a truce for now. From now on, we will take turns agreeing--"
10057040-44 = "[s] (Thinking they look admirable, a smile crosses your face.)"
10057040-45 = "Then, I will continue. I want to go without the engine room cover."
10057040-46 = "Whaaa!? W-Why? We have to protect the engine!"
10057040-47 = "That is true, but... #nSince there are no instruments to check the engine's status, I think it is better for the pilot to look directly."
10057040-48 = "We are using a rebuilt engine, so #nwe need to keep an eye on the engine vibrations either way."
10057040-49 = "Ugh... Well, I already agreed to it for now. Grrr..."
10057040-50 = "Well then, the engine will run on gasoline. #nManaging the octane rating is an issue, but it will be fine if I make an additive, right? #nLet us do this here..."
10057040-51 = "If that is the case, then if we attach a supercharger there..."
10057040-56 = "..."
10057040-57 = "Sensei, please come over here for a moment."
10057040-58 = "It seems both of them are lost in thought about the design."
10057040-64 = "[ns] \"The blizzard has stopped.\""
10057040-65 = "Yes. This is the foot of the highest mountain in Redwinter, so blizzards are an everyday occurrence."
10057040-66 = "However, yesterday's blizzard was more violent than expected... and put Sensei in danger."
10057040-67 = "Please accept my apologies. #nAnd, thank you."
10057040-68 = "[s3] \"If a student asks, I would rush over even from 75,000 meters above!\"\n[s4] \"If a student asks, minus 60 degrees is a breeze!\""
10057040-71 = "True to the rumors, Sensei is kind to a fault."
10057040-75 = "...As you can see, those two are always fighting."
10057040-76 = "Anna and Elina are my precious friends... so I really hated seeing them fight."
10057040-77 = "Still... thanks to Sensei, it looks like the fighting will decrease. #nThank you very much."
10057040-78 = "The blizzard seems like it will let up for a while, so I will see you off."
10057040-79 = "[s] \"Will you be okay heading back like this?\""
10057040-80 = "Yes. I believe both of them will follow Sensei's instructions."
10057040-81 = "It pains me to tie down a busy Sensei to such a remote place."
10057040-82 = "Thank you for coming."
10057040-83 = "[s5] \"I want to see the tank when it is finished!\"\n[s6] \"I want to see Lana and the others pass the preliminaries!\""
10057040-88 = "Then please look forward to it."
10057040-89 = "For the next four days, I will do my best not to waste Sensei's time."
10057040-91 = "Hey, Lana! Come over here!"
10057040-92 = "I do not understand this, so teach me."
10057040-96 = "[ns] \"Shall we head back?\""
10057040-97 = "...Yes!"
10057040-112 = "Good work today, Sensei."
10057040-113 = "Has this not progressed smoother than ever before!?"
10057040-114 = "Ugh... My shoulders hurt from being in that cramped space..."
10057040-115 = "Sensei's strategy is remarkably effective. #nToday alone, we made more progress than last month."
10057040-116 = "We are moving at about the same speed as when I was the vice director at the Applied Mechanical Engineering Research Institute."
10057040-117 = "At this pace, we might actually finish within the deadline."
10057040-118 = "[s7] \"Everyone, great job!\"\n[s8] \"I am glad to see things are going smoothly!\""
10057040-121 = "What are you talking about, it is all thanks to Sensei, right?"
10057040-122 = "Oh, that is right! #nClass 183's great leader who guides us, Niki Anna-class committee chair--?"
10057040-123 = "That sounds fishy, so rejected."
10057040-124 = "I have not even said anything yet!? At least listen to me!"
10057040-125 = "Listen, Sensei is the first VIP to arrive at No. 183, right?"
10057040-129 = "Are you saying the bear that broke through the window last month was not a VIP?"
10057040-130 = "There is no way a bear is a VIP!? #nIt ate all the pudding we were experimenting on and even broke the window! #nBecause of that, I ended up catching a cold!"
10057040-131 = "It was nice to me? It was very warm."
10057040-132 = "Enough about the bear! #nAnyway, since we have a VIP visiting us... #nWe have to show Sensei around Redwinter!"
10057040-133 = "What is your real motive?"
10057040-134 = "I want to go down the mountain with Sensei... and visit a cafe or an apparel shop!"
10057040-135 = "Naturally, rejected."
10057040-136 = "Whyyy!? As part of our fieldwork, actually experiencing it would help with our research!"
10057040-137 = "Sensei! Let us go to Znamya Cafe! #nIt is the pinnacle of Redwinter Food Chemistry! #nTheir three-tier blini are worth trying at least once!"
10057040-138 = "[s] \"If you recommend it that much, I am looking forward to it!\""
10057040-140 = "[ns] \"What else is delicious?\""
10057040-144 = "Eh? Ah... Um..."
10057040-145 = "Two-tier blini...?"
10057040-146 = "Anyway, absolutely not. If we get caught sneaking out without permission, we will get extra disciplinary action."
10057040-147 = "Besides, reading even one more line of a book is more useful than fieldwork."
10057040-148 = "No wayyy!! Books are for serious people, right~?!"
10057040-149 = "You are a capable girl, so read a book for once!"
10057040-150 = "Well then, let us decide by majority vote! #nLook, Lana wants to go too, right? Let us go check out the latest electronics!"
10057040-152 = "I am not interested in the latest things that cannot read punch cards."
10057040-154 = "Hiiiiin..."
10057040-155 = "[s] \"But Lana goes out freely, right?\""
10057040-159 = "Th-That is... um... It is a secret between us! #nPlease never tell the administration office."
10057040-160 = "Lana looks young, so she does not get caught in the administration office's spot checks."
10057040-161 = "The younger kids often forget or lose their ID cards, #nso the administration office does not bother checking them."
10057040-162 = "I suppose she just has a baby face."
10057040-163 = "No way, at that age, baby face or not..."
10057040-164 = "I am so jealouuuus... I wish I was as small as Lana... #nThen I could go out freely..."
10057040-165 = "Why don't you disguise yourself as a sled-pulling puppy?"
10057040-166 = "Do you want me to weld that noisy mouth of yours shut?"
10057040-167 = "...Anyway, Lana goes down the mountain to buy the things we need in our place."
10057040-168 = "I was really surprised when she went out on an errand and brought Sensei back..."
10057040-169 = "I want to go too..."
10057040-170 = "Senseeeeii..."
10057040-171 = "Do not drag Sensei into this!"
10057040-172 = "Honorary cheapskate, chief scaredy-cat, lecture committee chair."
10057040-173 = "Elina, cut it out already...!"
10057040-174 = "[s11] \"Then, will you make a promise with me?\"\n[s12] \"If you can keep it, let us go together!\""
10057040-179 = "Yay! Sensei, you are the best!!"
10057040-180 = "Would it not be a bother...?"
10057040-181 = "[s13] \"It will be fine if we apply for a field trip!\"\n[s14] \"The promise is that you two must get along!\""
10057040-184 = "With this nagging person? It is a pain, but I will try!"
10057040-185 = "Why do you always have to add unnecessary remarks like that!"
10057040-189 = "...Ah, it is already this late."
10057040-190 = "Let us head back soon. Sensei needs to get some rest, too."
