[translation]
10057040-1 = "Episode 4; It's As You Say, But I'm Still Right"
10057040-4 = "Wh-what an excellent design, Erina. Y-you're the... the best...!"
10057040-9 = "Urgh... You're giving me the heebie-jeebies... I feel like I'm gonna puke..."
10057040-10 = "I'm just doing what Sensei said to do!"
10057040-11 = "Sensei, are you really sure this is it!?"
10057040-12 = "[s] \"Looks good to me. Keep it up a bit longer.\""
10057040-14 = "It seems I was right to ask for your help, Sensei. I never would've thought to#nhandle it like this."
10057040-15 = "If both of them win about fifty percent of the time, then it's possible to skip over#nRWWE entirely..."
10057040-16 = "And instead, simply have them take turns agreeing with the other's standpoint."
10057040-17 = "What an efficient solution."
10057040-19 = "Do we really have to compliment each other like this though!?"
10057040-20 = "Even if I know that she's just forcing herself to say it, it still makes my stomach#nchurn!!"
10057040-21 = "[s1] \"Good fences make good neighbors, as they say.\"\n[s2] \"Plus, there's no harm in accepting someone's compliments.\""
10057040-27 = "We are not friends!!"
10057040-34 = "As both parties have come to a mutual agreement, this match is forfeit."
10057040-35 = "...Please, you two. Just do as Sensei says."
10057040-36 = "I don't want you two to fight. #nAnd besides, I'd like for us to work together this time and get some kind of result, no matter what it is."
10057040-37 = "You're both talented, so it hurts watching you two waste time fighting to see#nwho's right."
10057040-42 = "Y-you're right. Sensei took time out of their schedule to come here too..."
10057040-43 = "Alright, we'll call a truce for now. Guess we're takin' turns with the ideas."
10057040-44 = "[s] （Seeing how admirable they are, a smile surfaces.）"
10057040-45 = "All right, let's keep working then. I was thinking of not having a cover over the#nengine bay."
10057040-46 = "Uweegh!? B-but why? You're really gonna leave the engine unprotected!?"
10057040-47 = "It certainly will be unprotected, but... #nWe don't have any guages for monitoring the engine's conditions, so I think it#nwould be better if the driver could examine it directly."
10057040-48 = "Plus, we're using a rebuilt engine, #nso regardless of whether it's covered or not, we're still going to need a way to#nwatch over the engine balance."
10057040-49 = "Hmmm... Guess I have to agree anyway this time. Ugh..."
10057040-50 = "Fine, but I say we're using a gas engine. #nThe octane rating might be a problem, buuuut I could just make an additive to fix that. #nIf I just do this here..."
10057040-51 = "If you're doing that, then a supercharger here would..."
10057040-56 = "..."
10057040-57 = "Sensei, could you come with me for a second?"
10057040-58 = "It's a perfect time now that the two of them are currently engrossed with#ndesigning the tank."
10057040-64 = "[ns] \"The blizzard stopped.\""
10057040-65 = "Yes. We live at the foot of Red Winter's tallest mountain, so blizzards are#n an everyday occurance here."
10057040-66 = "However, yesterday's blizzard was more intense than I had expected... I nearly put you in grave danger."
10057040-67 = "Please accept my apologies. #nAnd furthermore, my thanks as well."
10057040-68 = "[s3] \"I'd gladly soar 75,000 meters into the air to fulfill a student's wish!\"\n[s4] \"I'd gladly brave -60 degree temperatures to fulfill a student's wish!\""
10057040-71 = "You truly are every bit as kind as the rumors say."
10057040-75 = "...As you have seen, the two of them are always fighting."
10057040-76 = "However, Anna and Erina both are my dear friends... So I've always hated it when they fought."
10057040-77 = "But thanks to you... They're fighting less now. #nSincerely, I thank you for this."
10057040-78 = "It would seem the blizzard has abated for the time being, so I'll see you off now."
10057040-79 = "[s] \"Is it fine for me to head back just like that?\""
10057040-80 = "Yes. I think the two of them will continue to do as you said."
10057040-81 = "I'd feel sorry keeping you around in such a remote place for any longer, especially with how busy you are."
10057040-82 = "Thank you very much for coming."
10057040-83 = "[s5] \"But I want to see the tank when it's done!\"\n[s6] \"But I want to see the three of you smash the qualifiers!\""
10057040-88 = "In that case, feel free to continue watching over us."
10057040-89 = "We'll do our best over the next four days to make sure your time isn't squandered."
10057040-91 = "Heeey! Ranaaa! C'mere for a sec!"
10057040-92 = "We don't know what this is, so could you teach us?"
10057040-96 = "[ns] \"Shall we go back?\""
10057040-97 = "...Sure!"
10057040-112 = "Good work, Sensei."
10057040-113 = "Dare I say it, this is the SMOOTHEST things have ever been!"
10057040-114 = "Urgh... My shoulders hurt from being stuck in such a cramped space..."
10057040-115 = "Sensei, your strategy ended up working immediately. #nWe got more done today than we have over the entire past month."
10057040-116 = "We were working about as fast as I had been during my time as an associate supervisor for the Applied Mechanical Engineering Laboratory."
10057040-117 = "At this rate, we might actually finish the tank in time."
10057040-118 = "[s7] \"Good work, everyone!\"\n[s8] \"I'm glad to see everything's been going well!\""
10057040-121 = "What're you saying, Sensei? This is all thanks to you!"
10057040-122 = "Ah, right! #nOh great leader of 183! Miss Class President, Niki Anna!"
10057040-123 = "Sounds sketchy. Denied."
10057040-124 = "I haven't even gotten to the meat of it yet! At least let me speak first!"
10057040-125 = "Anyway, y'knoow. Sensei's the first VIP that 183 has ever welcomed."
10057040-129 = "Are you implying that the bear who broke the windows last month wasn't a VIP?"
10057040-130 = "There is no way you're calling that bear a VIP! #nIt ate all of the pudding I was in the middle of experimenting with AND smashed the window! #nThanks to that, little ol' me over here came down with a case of the cold!"
10057040-131 = "But it was nice to me. It was very warm."
10057040-132 = "Alright that's enough about the bear! #nAnyway, as I was saying, since Sensei's here as our VIP... #nWe should totally show them around Red Winter!"
10057040-133 = "And what's your true intention for this?"
10057040-134 = "I wanna come down from this mountain with Sensei... and hit up some cafes, clothing shops, whatever!"
10057040-135 = "Naturally, denied."
10057040-136 = "Whyyy!? If I experienced these things firsthand as part of my fieldwork, it could really help with my research!"
10057040-137 = "Sensei! We gotta hit up Znamya Cafe! #nThey're Red Winter's number one food chemistry spot! #nTheir triple stack blini is absolutely to die for!"
10057040-138 = "[s] \"If you're rating them so highly, I can't help but to look forward to it too!\""
10057040-140 = "[ns] \"What else do they have that's good?\""
10057040-144 = "Huh? Ah... Uhhh...."
10057040-145 = "The double stack blini...?"
10057040-146 = "Anyway, absolutely not. If we get caught slipping out without permission, then we'll be slapped with additional disciplinary actions."
10057040-147 = "And besides, reading even just one extra line in a book would give far better yields than any sort of fieldwork."
10057040-148 = "Nooo freaking waaay!! Books are something only those straight-laced people read!"
10057040-149 = "You are a perfectly capable girl! Please read a book or two!"
10057040-150 = "'Kay, let's decide this based on majority then! #nRanaaaa, you wanna go too, right? You can go check out those brand spanking new electronics!"
10057040-152 = "I have no interest in those newfangled devices that can't even read a punched card."
10057040-154 = "Weeeeeh..."
10057040-155 = "[s] \"Wait, but didn't Rana go out without asking?\""
10057040-159 = "W-well... Umm... That's a secret between us! #nYou absolutely cannot tell the Office about this, okay?"
10057040-160 = "Rana looks really young, so she doesn't get flagged down by the Office's surprise inspections."
10057040-161 = "Little kids often forget to bring their IDs or they lose them. Because of that, the Office doesn't bother to inspect them."
10057040-162 = "I suppose I do have a baby face."
10057040-163 = "No no no. Considering your age, I think it has a little more to do than just a baby face..."
10057040-164 = "I'm soooo jealous though. If only I could be just as small as Rana. #nIf I was, then I could come out of this place without being stopped..."
10057040-165 = "I think you could do the same if you tried disguising yourself as a sled dog though."
10057040-166 = "Want me to weld your trap shut?"
10057040-167 = "...Anyway, the main point of the matter is that Rana helps us buy what we need from down the mountain."
10057040-168 = "Imagine how shocked I was when we sent her out for another errand and she came back here with you..."
10057040-169 = "I wanna go tooo..."
10057040-170 = "Seenseeiii..."
10057040-171 = "Could you not drag Sensei into this!?"
10057040-172 = "Honorary cheapskate. Head of chickening out. President of nagging."
10057040-173 = "Erina, I swear if you don't stop...!"
10057040-174 = "[s11] \"Alright, but promise me one thing.\"\n[s12] \"If you can keep it, then we'll all go together!\""
10057040-179 = "Yahoo! Sensei, you're the best!!"
10057040-180 = "Won't it be tedious to get us out though...?"
10057040-181 = "[s13] \"I just have to say it's for experiential learning and we should be good!\"\n[s14] \"Now, promise me that you two will get along!\""
10057040-184 = "Just gotta get along with this grouch? Sounds like a pain buuut, I'll try!"
10057040-185 = "Did you really have to add that extra comment!?"
10057040-189 = "...Ah, it's already this late."
