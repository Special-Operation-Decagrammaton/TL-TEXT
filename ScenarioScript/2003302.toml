[translation]
2003302-1 = "Великий председатель Общества Пандемониума!"
2003302-2 = "Я пришёл заранее на встречу с Обществом Пандемониума."
2003302-3 = ""
2003302-5 = ""
2003302-6 = ""
2003302-7 = "[ns] «Хм...? Что-то происходит?»"
2003302-9 = ""
2003302-10 = "Хорошо! До срока, установленного председателем, осталось совсем немного! Ускоряемся! Что со статуей председателя?!"
2003302-11 = "Уже в пути! Отдел снабжения подтвердил, что её отправили ранее!"
2003302-12 = ""
2003302-13 = "Отлично! Как обстоят дела с церемониальной стражей для встречи нашего почётного гостя?"
2003302-14 = ""
2003302-15 = "Они собираются за Залом собраний сразу после финальной проверки!"
2003302-16 = ""
2003302-17 = "Хорошо... Похоже, всё идёт по плану. Но именно на последнем этапе планы чаще всего и рушатся!"
2003302-18 = "Все, не смейте забывать то, что председатель Макото говорила нам бесчисленное количество раз!"
2003302-19 = "Мы не можем допустить ни малейшей халатности, которая запятнает наше знаменитое гостеприимство — гость, который сегодня посетит Общество Пандемониума, чрезвычайно важен!"
2003302-20 = "Наша работа отражает власть и харизму председателя Макото! Покажем свою преданность, встретив гостя безупречно!"
2003302-21 = "А теперь! Пора показать миру, чего стоит Общество Пандемониума!"
2003302-23 = ""
2003302-24 = "Поняли!!!"
2003302-25 = ""
2003302-27 = ""
2003302-29 = ""
2003302-30 = "[ns] «Похоже, вы очень заняты.»"
2003302-31 = "А, [USERNAME] Сенсей. Давненько вы к нам не заходили."
2003302-32 = "Прошу прощения, что после всей дороги вы попали прямо в эту суматоху."
2003302-33 = "[s] «Что-то происходит?»"
2003302-34 = "А, да... Мы получили от председателя сообщение, что сегодня в тринадцать ноль-ноль нас посетит чрезвычайно важный гость."
2003302-35 = "Личность гостя?"
2003302-36 = "Эм, к сожалению, мне не удалось это выяснить: председатель сказала, что личность гостя совершенно секретна."
2003302-37 = "Но она сказала, что это одна из «ведущих фигур нашей эпохи», способная одним щелчком пальцев перевернуть Кивотос вверх дном."
2003302-38 = "[s] «О... В-Вот как? Ну... удачи.»"
2003302-41 = "Перед исполнительным офисом Общества Пандемониума"
2003302-42 = "После долгих минут, проведённых в коридорах Общества Пандемониума, подбадривая всех усердно работающих студентов, которых я встречал, я наконец добрался до места назначения."
2003302-43 = ""
2003302-47 = "[ns] «Простите...»"
2003302-48 = "Хм! И эта тоже не подходит!"
2003302-49 = ""
2003302-52 = "[ns] «...А?»"
2003302-54 = "Хмм... Нет, не это... И то совершенно не подходит..."
2003302-55 = "Почему это занимает столько времени?!"
2003302-56 = "Подумать только, сама Великая Макото — и та осталась без идей!"
2003302-57 = ""
2003302-60 = "А?! Уже так поздно?"
2003302-61 = "Гах! Что же делать...? Должен же быть какой-то выход..."
2003302-62 = "[s] «(Макото? Судя по выражению лица, проблема у неё серьёзная...)»"
2003302-63 = ""
2003302-65 = ""
2003302-66 = ""
2003302-67 = "Я должна найти идеальное выражение и позу, чтобы обрушить всю мощь харизмы Великой Ханумы Макото... на Сенсея из Шале!"
2003302-68 = "[ns] «Я уже подумал, что ты столкнулась с ужасной проблемой... а дело всего лишь в этом?!»"
2003302-69 = "Ч-что?!"
2003302-70 = ""
2003302-72 = ""
2003302-73 = "*кашель* *кашель* *кашель*"
2003302-74 = "[s] «М-Макото, дыши! Ты в порядке?!»"
2003302-75 = "*кашель* *кашель* *задыхается* *задыхается*"
2003302-76 = "... *вздох*"
2003302-77 = "Фух..."
2003302-78 = "А, Сенсей. Я всё гадала, кто посмел меня прервать."
2003302-79 = "Идеальное время. Я как раз ожидала вашего прибытия."
2003302-80 = "[s] «(Похоже, её всё-таки выбило из колеи...)»"
2003302-81 = "Хм? Постойте. Если Сенсей уже здесь..."
2003302-82 = "Что случилось с церемонией встречи, которую я приказала подготовить своим подчинённым?"
2003302-83 = "[s1] «(Так та суматоха и правда была из-за меня.)»\n[s2] «(Не хотелось вмешиваться и ставить кого-то в неловкое положение.)»"
2003302-86 = "Кихехехех, ответ у вас прямо на лице написан! Значит, вот как всё было."
2003302-87 = "Зачем связывать себя затхлым притворством какой-то бессмысленной церемонии, пусть даже и богатой традициями..."
2003302-88 = "Куда лучше обезглавить змею до того, как она укусит — и сразу направиться к Великой Хануме Макото! Вот что вы хотите сказать, Сенсей из Шале!!!"
2003302-89 = "[s] «Я-я бы не заходил так далеко...»"
2003302-90 = "Кихехехех! Как и ожидалось от человека, который разжёг огонь в моём сердце!"
2003302-91 = "Вот каким духом должен обладать союзник Ханумы Макото!"
2003302-92 = "Я знала, что верно вас оценила!"
2003302-93 = "[s] «Н-Не кажется, что это уже немного перебор?»"
2003302-94 = "Хорошо! Я решила!"
2003302-95 = "Я прикажу Обществу Пандемониума прекратить все приготовления к церемонии, Сенсей."
2003302-96 = "А значит, остаётся только наша беседа тет-а-тет — встреча лидеров двух могущественных организаций, которые силой воли выкуют соглашение!"
2003302-97 = "...Не могли бы вы подождать снаружи минутку?"
2003302-98 = "Я скоро буду готова к нашему разговору по душам. Тогда и перейдём к сути."
2003302-99 = "[s] «О, к-конечно.»"
2003302-101 = "Я вылетел из исполнительного офиса так, будто Макото гналась за мной с мечом."
2003302-102 = "Спрячу эту упаковку в ящик стола. А это переставлю сюда, чтобы закрыть пятно. И..."
2003302-103 = ""
2003302-108 = "Хмф! Кис-кис-кис-кис! Его Величество, Император Лайонмару-младший III! Требую аудиенции!"
2003302-109 = ""
2003302-118 = "Ц! Ты! Когда ты успел стать таким проворным?!"
2003302-119 = "Прекрати бегство, коварный кот!"
2003302-120 = "Попался!"
2003302-121 = "[ns] «...»"
2003302-122 = "И наконец..."
2003302-123 = "*вдох* *выдох* Я готова! Можете войти."
2003302-124 = "[s] «Ну, спасибо за пригла—»"
2003302-125 = ""
2003302-130 = "― [log=마코토]Кихехехех! Сенсей... Я внимательно следила за вашими достижениями.[/log][wa:1340]"
2003302-133 = "― [log=마코토]Вы помогали другим, решали проблемы...[/log][wa:500]"
2003302-134 = "― [log=마코토]И подняли репутацию Шале на новые высоты![/log][wa:10]"
2003302-137 = "― [log=마코토]Кихехех, я уверена,[/log][wa:1580]"
2003302-138 = "― [log=마코토]вы и сами не можете отрицать правду──[/log][wa:1090]"
2003302-141 = "― [log=마코토]Да, вы элита, чья сила[/log][wa:2230]"
2003302-142 = "― [log=마코토]равна силе Великой Макото![/log][wa:80]"
2003302-145 = "[ns] «Э-Элита...?»"
2003302-146 = "― [log=마코토]В знак признания столь великой способности...[/log][wa:10]"
2003302-147 = "― [log=마코토]я готова сделать вам столь же великое предложение.[/log][wa:2200]"
2003302-150 = "― [log=마코토]Сенсей из Шале! Объедините силы с Обществом Пандемониума...[/log][wa:1240]"
2003302-151 = "― [log=마코토]Нет... Объедините силы со мной, Ханумой Макото![/log][wa:4300]"
2003302-154 = "[ns] «Э-Эм...»"
2003302-155 = "― [log=마코토]Когда наши сердца будут едины,[/log][wa:1080]"
2003302-156 = "― [log=마코토]завоевание Кивотоса станет неизбежным![/log][wa:1580]"
2003302-159 = "― [log=마코토]В тот великий день[/log]"
2003302-160 = "― [log=마코토]мы разделим Кивотос между собой! Половина города отойдёт Шале![/log][wa:10]"
2003302-163 = "― [log=마코토]Разве это не договор, достойный великих?[/log][wa:10]"
2003302-166 = "― [log=마코토]Возьмите мою руку, Сенсей! Давайте бок о бок воплотим нашу великую мечту![/log][wa:2610]"
2003302-167 = "― [log=마코토]Кихехехех-эхехехех![/log][wa:3030]"
2003302-169 = ""
2003302-170 = "Кихехех. Ну и каков ваш ответ?"
2003302-171 = "Я вижу, великодушие моего предложения вас ошеломило, [USERNAME] Сенсей! Я—"
2003302-172 = ""
2003302-175 = "Вах?! Его Величество, Император Лайонмару — маленький мерзавец! Монархи не кусают других монархов!"
2003302-176 = "А-А-Апчхи!!!"
2003302-177 = ""
2003302-179 = ""
2003302-180 = ""
2003302-181 = "[ns3] «Эм... Спасибо за предложение, но я откажусь.»\n[ns4] «Боюсь, я не могу обязать Шале вступить в такой союз.»"
2003302-184 = "Ч-что?!"
2003302-185 = "Вы отвергаете протянутую руку Ханумы Макото, едва подумав?!"
2003302-186 = "...Хех. Как и ожидалось от учителя, которого не могут поколебать ни богатство, ни слава."
2003302-187 = "Чиаки была убеждена, что даже честь работать бок о бок со мной не заставит вас согласиться сразу! Похоже, она была права!"
2003302-188 = "[s5] «(...Я отказывался от богатства?)»\n[s6] «(...Я отказывался от славы?)»"
2003302-191 = "Кихехехех... хехехех..."
2003302-192 = "Кихехехех!!!"
2003302-193 = "[s] «Эм, Макото...?»"
2003302-194 = "Вы меня не разочаровали, Сенсей! Совсем наоборот!"
2003302-195 = "Ханума Макото прекрасно знает: настоящее лидерство — это понимать, когда нужно стоять на своём... а когда идти в атаку!"
2003302-196 = "Я вполне понимаю, что вы бережёте власть Шале. Для лидера естественно прежде всего заботиться о собственной опоре силы."
2003302-197 = "Хорошо! Я удовлетворюсь тем, что состоялась наша первая встреча как равных!"
2003302-198 = "К тому же... лишь вопрос времени, когда вы прозреете и объедините силы с Обществом Пандемониума!"
2003302-199 = "Кихехехех!!!"
2003302-200 = "С нетерпением жду нашего сотрудничества, [USERNAME] Сенсей из Шале!"
2003302-201 = "[s] «К-Конечно... Я тоже жду сотрудничества, Макото.»"
2003302-203 = "Так завершилась моя монументальная первая встреча с Макото — с такой же суматохой, с какой и началась."
