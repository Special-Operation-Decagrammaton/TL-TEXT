[translation]
90001120-1 = "Эпизод 12;Предложение"
90001120-2 = ""
90001120-3 = "Я не присутствовала на месте, но слышала, что Алиса сыграла ключевую роль в успехе операции."
90001120-4 = "Помню, после того как всё закончилось, участницы Отдела разработки игр навещали нас в комнате Отряда Исследования Сверхъестественного."
90001120-5 = "Я помню всё: предложение устроить вечеринку, два килобайта данных, брелок в форме робота, приятную атмосферу, трогательную фоновую музыку и, наконец, моё возведение на трон главной героини."
90001120-6 = "Много всего произошло."
90001120-7 = "...Ха."
90001120-8 = "Первая часть и правда была, но всё остальное звучит как фантазия..."
90001120-9 = "Я просто решила это сказать."
90001120-10 = ""
90001120-12 = ""
90001120-14 = ""
90001120-15 = ""
90001120-16 = "(Токи всё чаще пытается незаметно продвигать собственные желания...)"
90001120-17 = "В любом случае, тогда Корабль Утнапиштима, который реконструировала Алиса... был её «Доказательством Героя»."
90001120-18 = "Хи-хи. Я до сих пор помню название, которое придумала. Это был Меч Света: Атрахасис Супернова."
90001120-19 = "...Тогда было не до этого, но названия ты придумываешь не очень, правда?"
90001120-20 = "Не хочу слышать это от тебя!"
90001120-21 = "(Они обе...)"
90001120-22 = "К-Кхм."
90001120-23 = "Но мы не знаем, что именно Алиса тогда сделала. В этом и заключается основная проблема."
90001120-24 = "Мы никак не можем определить метод или механизм, с помощью которого она смогла реконструировать такое."
90001120-25 = "Да... Откуда бралась энергия, как происходила реконструкция материи..."
90001120-26 = "...как она её собирала и высвобождала... Всё это для нас загадка."
90001120-27 = "С нашей точки зрения, она проделала всё это в одно мгновение."
90001120-28 = "Из-за всех этих вопросов повторить её действия почти невозможно."
90001120-29 = "Это было чудо, рождённое самым странным сном."
90001120-30 = "И именно поэтому оно является полной противоположностью науке и теории!"
90001120-31 = "Именно. Наука — это системный процесс."
90001120-32 = "Она устроена так, чтобы любой знакомый с процессом мог воспроизвести те же результаты."
90001120-33 = "..."
90001120-34 = "Я... думаю, нам стоит обратиться к Алисе."
90001120-35 = "Ты хочешь вызвать Алису сюда, в это место?"
90001120-36 = "Да. Именно. Нужно попросить Алису проанализировать и объяснить, что она сделала—"
90001120-37 = "Рио. Ты абсолютно уверена?"
90001120-38 = "М? Ты о чём?"
90001120-39 = ""
90001120-41 = ""
90001120-43 = "Разве тогда ты не... просто используешь Алису как «инструмент» для решения своих проблем?"
90001120-44 = "...!"
90001120-45 = "..."
90001120-46 = "Президент..."
90001120-47 = ""
90001120-49 = ""
90001120-50 = ""
90001120-51 = "Рио. Мне не нужно повторяться. Мы уже обсуждали это на Корабле Утнапиштима."
90001120-52 = "Разница лишь в том, что объект сменился с Токи на Алису."
90001120-53 = "Конечно, как нежному цветку, распустившемуся на утёсе, мне совершенно безразличны твои ошибки и сожаления, но..."
90001120-54 = "Наблюдать за человеком, который снова и снова повторяет одни и те же ошибки, довольно некрасиво и скучно... даже тому, кто вынужден это видеть."
90001120-55 = "Д-Да. Верно. Мне нечего возразить."
90001120-56 = "[s] «...»"
90001120-57 = ""
90001120-60 = "[ns] «Эй, Рио.»"
90001120-61 = "Хм...?"
90001120-77 = ""
90001120-78 = "[ns] «Нам нужна Алиса? Чтобы решить это?»"
90001120-79 = "Я... я прошу прощения, Сенсей. Пожалуйста, забудьте эту гипотезу. Это лишь одна из множества возможностей, и я никак не могу гарантировать, что её присутствие даст нам необходимый результат."
90001120-80 = "Можете забыть, что я вообще это предлагала... Мой подход был неправильным..."
90001120-81 = "[s] «Тогда я попробую поговорить с Алисой и Отделом разработки игр.»"
90001120-82 = "С-Сенсей?!"
90001120-83 = "Сенсей?!"
90001120-84 = "Что это за поведение, Сенсей? С вами что-то не так?"
90001120-85 = "Вы точно уверены, Сенсей? В худшем случае..."
90001120-86 = ""
90001120-88 = ""
90001120-89 = ""
90001120-90 = "...Ситуация кажется критической? Ну... понимаю, почему можно прийти к такому выводу."
90001120-91 = "...И если кто-то и должен поговорить с Алисой, то это вы?"
90001120-92 = "[s] «Взамен у меня есть просьба к тебе, Рио.»"
90001120-93 = "М-Мне?!"
90001120-94 = "[s] «Я хочу, чтобы ты лично приехала на базу в Ледниковом море.»"
90001120-95 = "?!"
90001120-96 = "Г-Госпожа Рио?!"
90001120-97 = "Сенсей, это значит...?"
90001120-99 = "..."
90001120-100 = "Так называемая концепция... совместной ответственности?"
90001120-101 = "[s] «Окончательное решение оставлю за тобой, Рио.»"
90001120-102 = ""
90001120-105 = "[ns] «Точно так же, как ты сама предложила свой вариант.»"
90001120-106 = ""
90001120-109 = "[ns] «Я тоже предлагаю вариант.»"
90001120-110 = "..."
90001120-111 = "Не знаю, Сенсей. Я..."
90001120-112 = "Я не знаю, есть ли у меня право..."
90001120-113 = ""
90001120-115 = ""
90001120-116 = "Госпожа Рио. Именно вы спасли нас."
90001120-118 = "..."
90001120-119 = ""
90001120-121 = ""
90001120-122 = ""
90001120-123 = "Я не знаю, что правильно, а что неправильно. И не уверена, возможно ли вообще всегда делать правильный выбор."
90001120-124 = "Но я... хотела бы увидеть вас снова."
90001120-125 = "Разве этого недостаточно?"
90001120-126 = "Токи..."
90001120-127 = ""
90001120-129 = ""
90001120-131 = ""
90001120-132 = "Рио. Решение за тобой."
90001120-133 = "Я знаю, что тобой движет. Рациональность."
90001120-134 = "Так к какому решению на этот раз приведут тебя твои рациональность и логика?"
90001120-135 = ""
90001120-137 = ""
90001120-138 = "..."
90001120-139 = "С точки зрения логики... радиосвязь имеет ограничения и по безопасности, и по надёжности."
90001120-140 = "Любые радиопомехи, вроде тех, что возникли в этом бою, могут нарушить целостность всей операции."
90001120-141 = "Поэтому я..."
90001120-142 = "Отлично. Решено."
90001120-143 = "Увидимся на базе в Ледниковом море."
90001120-144 = "...Хорошо."
90001120-146 = "Что-то не так, госпожа Рио? Вас что-то не устраивает?"
90001120-147 = "Не совсем..."
90001120-148 = "Но это правда... нормально?"
90001120-149 = "..."
90001120-150 = "Я отправлю тебе координаты базы в Ледниковом море. Полагаю, транспорт у тебя уже есть?"
90001120-151 = "...Да."
90001120-152 = "Это будет наша первая встреча за долгое время, госпожа Рио. Я буду ждать."
90001120-153 = "Токи."
90001120-154 = "Да. Чем я могу помочь?"
90001120-155 = ""
90001120-157 = ""
90001120-158 = ""
90001120-159 = ""
90001120-160 = "Спасибо за вашу работу. И за... всё..."
90001120-161 = "Не стоит благодарности."
90001120-164 = "Пока все были заняты подготовкой, я ненадолго остался один."
90001120-165 = "Что ж..."
90001120-171 = "А? Сенсей?"
90001120-172 = "Добро пожаловать, Сенсей. Что привело вас сюда?"
90001120-173 = "Что? Вы просто хотели увидеть наши лица?"
90001120-174 = "Я-я и рада, и благодарна это слышать, но... э... хе-хе..."
90001120-175 = "Но не пытайтесь отделаться этим, Сенсей!"
90001120-176 = "Подтверждаю. У вас серьёзное выражение лица. Поэтому повторю: что вас сюда привело?"
90001120-177 = "[s] «Меня так легко читать? Понятно...»"
90001120-178 = "Вы удивлены?! Конечно, мы вас видим насквозь!"
90001120-179 = "Мы так долго вместе, понимаете? Достаточно просто на вас посмотреть!"
90001120-180 = "Согласна. Возможно, вы сами этого не осознаёте."
90001120-181 = "Но «Сенсей» моего мира тоже был таким человеком."
90001120-182 = "Что у вас на уме? Расскажите Ароне!"
90001120-183 = "И мне."
90001120-184 = "Ах, да. И Плане тоже!"
90001120-185 = ""
90001120-187 = ""
90001120-188 = "[ns1] «...Меня беспокоит, что я не могу решить это за них.»\n[ns2] «Я отправляю студентов прямо в опасность.»"
90001120-191 = "Сенсей..."
90001120-192 = "..."
90001120-193 = "Но если подумать, Сенсей...!"
90001120-194 = "До сих пор... вы ведь блестяще справлялись со множеством подобных ситуаций? Ну, или как-то так... Хи-хи-хи."
90001120-209 = "[ns] «В этот раз всё немного иначе.»"
90001120-210 = ""
90001120-211 = "Хм? Вы хотите сказать, что тогда помогали решать уже возникшие проблемы? Убирали последствия..."
90001120-212 = "Но в этот раз вам кажется, будто вы сами ведёте студентов в опасность?"
90001120-213 = "Понятно. Но разве нет вероятности, что если ничего не делать, произойдёт нечто ещё хуже?"
90001120-216 = "[ns3] «Это тоже правда.»\n[ns4] «Но я подвергаю студентов опасности... из-за вероятности.»"
90001120-221 = "[ns] «И я начинаю думать, чем вообще отличаюсь от тех людей.»"
90001120-222 = ""
90001120-223 = ""
90001120-224 = "..."
90001120-225 = "..."
90001120-227 = "[ns] «Эх! Вот бы мне просто стать суперсильным!»"
90001120-228 = "С-Сенсей?!"
90001120-229 = "Не понимаю. Что с вами, Сенсей?"
90001120-230 = "[s5] «Ну, типа! Вот так! Понимаете?»\n[s6] «Уметь летать! Пробивать барьеры!»"
90001120-234 = "[ns7] «Безымянные боги, Декаграмматон — кто угодно!»\n[ns8] «Вот бы я мог решить всё одним махом!»"
90001120-237 = ""
90001120-238 = "П-Почему вы так себя ведёте...?"
90001120-239 = "Смущение. Я не понимаю. Запрос: Сенсей должен дать более подробное объяснение."
90001120-240 = ""
90001120-242 = ""
90001120-243 = "[ns] «Нет. Всё нормально. Я просто глупил.»"
90001120-253 = "[log]Пожалуйста, позаботьтесь о моих студентах.[/log]"
90001120-255 = ""
90001120-259 = "[ns] «Я должен это сделать! Да!»"
90001120-261 = "[ns9] «Я попробую всё, что смогу! И буду бороться до самого конца!»\n[ns10] «А если и этого окажется мало...!»"
90001120-264 = "А-А если этого окажется мало?"
90001120-265 = ""
90001120-267 = ""
90001120-268 = "[ns11] «Ну! Будем решать проблему, когда до неё дойдём!»\n[ns12] «Я ведь не знаю, как всё сложится! Ахаха!»"
90001120-271 = "С-Сенсей? Вы уверены, что... всё нормально?"
90001120-272 = "Сомнение. И смущение. Запрос: Сенсею следует проверить психическое состояние."
90001120-273 = "[s] «Всё хорошо! Всё хорошо!»"
90001120-274 = ""
90001120-276 = ""
90001120-277 = ""
90001120-278 = "С-Сенсей?! Спасибо, что гладите по голове, но... Ва-а..."
90001120-279 = "Смущение усилилось. Намерения Сенсея непонятны."
90001120-281 = "Я некоторое время гладил их обеих."
90001120-282 = "Когда они уснули, я вернулся на поле боя."
90001120-284 = "Следующий эпизод;Отправление"
