[translation]
11001-2 = "Эта битва оказалась гораздо легче, чем я ожидала."
11001-3 = "...Да, ты права."
11001-4 = "Благодаря указаниям Сенсея мы смогли сражаться гораздо эффективнее."
11001-5 = "Наверное, поэтому Генеральный ученический совет так высоко ценит Сенсея. У президента явно были причины выбрать именно вас."
11001-6 = ""
11001-7 = "Я бы не отказалась когда-нибудь снова выйти с вами на одно поле боя."
