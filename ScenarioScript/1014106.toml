[translation]
1014106-1 = "Как сорняк"
1014106-2 = "Лобби художественной галереи"
1014106-3 = "Я пришёл в лобби художественной галереи, где договорился встретиться с Харукой."
1014106-4 = "П-Привет, Сенсей...!"
1014106-5 = ""
1014106-7 = ""
1014106-8 = "[ns1] «Привет, Харука!»\n[ns2] «Ты снова такая красивая!»"
1014106-11 = "У-у-у... Уа-а-а..."
1014106-12 = "Э-Эм, я подумала, что для художественной галереи нужно одеться официально..."
1014106-13 = "Поэтому надела это..."
1014106-14 = "И-и вы говорили, что я красивая в этом платье, Сенсей... Поэтому..."
1014106-15 = ""
1014106-17 = ""
1014106-18 = "М-Может, нет? Я опять что-то неправильно поняла?! Слишком увлеклась?!"
1014106-19 = "[s3] «Нет.»\n[s4] «Конечно нет.»\n[s5] «Идеально.»"
1014106-23 = "У-Уаа-а..."
1014106-24 = "С-Сказать слово «идеально» про т-такую, как я... У-у-у..."
1014106-25 = "[s] «Кстати, что это за выставка?»"
1014106-26 = "А, я забыла сказать самое важное!"
1014106-27 = "Т-Тема выставки — «сорняки»."
1014106-28 = "Здесь представлены разные работы десяти художников, каждая так или иначе посвящена сорнякам."
1014106-29 = "И среди этих художников есть студенты Вайлдхант..."
1014106-30 = "...Во всяком случае, так написано в буклете."
1014106-31 = "[s] «Эта выставка прямо создана для тебя, Харука.»"
1014106-32 = "К-Когда вы так говорите..."
1014106-33 = "Конечно, только мне может нравиться такое! Зачем вам смотреть искусство про СОРНЯКИ?"
1014106-34 = "П-Простите! Я сейчас же верну ваш билет!"
1014106-35 = "[s] «С-Стой! Просто пойдём внутрь!»"
1014106-36 = "А? А, хорошо!!"
1014106-38 = "Несмотря на шаткое начало, мы с Харукой вошли в выставочный зал."
1014106-40 = "Внутри выставочного зала"
1014106-41 = ""
1014106-42 = "Ого..."
1014106-43 = "[s6] «Посмотри сюда, Харука.»\n[s7] «Здесь даже настоящие сорняки выставлены.»"
1014106-46 = "Правда?!"
1014106-47 = ""
1014106-49 = ""
1014106-50 = ""
1014106-51 = ""
1014106-52 = "Сенсей, я-я не думаю, что это настоящие сорняки."
1014106-53 = "Они очень похожи, но... это подделка."
1014106-54 = "[s8] «...О, ты права!»\n[s9] «Они сделаны из металла!»"
1014106-57 = "В-Вон там есть работа, которая действительно сделана из настоящих сорняков."
1014106-58 = "Их прикрепили к холсту."
1014106-59 = "О, а вон там..."
1014106-60 = ""
1014106-62 = ""
1014106-64 = "Мы с Харукой неспешно осматривали тихий выставочный зал."
1014106-65 = "Перешёптываясь в тихих комнатах, мы делились впечатлениями от разных работ."
1014106-67 = "Все работы такие разные. Потрясающе."
1014106-68 = "И... выставочный зал больше, чем я ожидала."
1014106-69 = "[s] «Может, немного передохнём?»"
1014106-70 = "А? А, конечно!"
1014106-72 = "Мы с Харукой вышли в коридор немного перевести дух."
1014106-73 = ""
1014106-74 = "[ns] «Ну как тебе, Харука?»"
1014106-75 = "Б-Было хорошо."
1014106-76 = "Я не знала, что из сорняков можно создать столько разных и красивых произведений."
1014106-77 = "Н-Но..."
1014106-78 = "Ну... Эм..."
1014106-79 = "[s] «Тебя что-то беспокоит.»"
1014106-80 = "...Да."
1014106-81 = "Но... мне вообще можно так чувствовать?"
1014106-82 = "Все художники, создавшие эти работы, в миллион раз умнее и талантливее меня... И мне, такой как я, их критиковать..."
1014106-83 = "А если я ещё и ошибусь..."
1014106-84 = "[s] «Ошибаться нормально.»"
1014106-85 = "...Что?"
1014106-86 = "[s10] «Все ошибаются.»\n[s11] «Я, ты и даже люди, которые создали эти работы.»"
1014106-89 = "..."
1014106-90 = "...Я правда считаю их все очень красивыми."
1014106-91 = "Я удивилась, что сорняки можно изображать вот так."
1014106-92 = "И всё же..."
1014106-95 = "― [log=하루카 드레스]...Мне нравятся сорняки не из-за внешности.[/log][wa:5600]"
1014106-97 = "― [log=하루카 드레스]Мне нравится их живучесть.[/log][wa:2169]"
1014106-100 = "― [log=하루카 드레스]То, с каким упорством они укореняются даже в самых бесплодных местах...[/log][wa:1750]"
1014106-102 = "― [log=하루카 드레스]Для меня это, наверное, идеал.[/log][wa:1086]"
1014106-105 = "― [log=하루카 드레스]Не обязательно быть красивой.[/log][wa:133]"
1014106-107 = "― [log=하루카 드레스]И не обязательно сиять.[/log][wa:745]"
1014106-110 = "― [log=하루카 드레스]Главное, чтобы я могла быть рядом с дорогими мне людьми...[/log][wa:2198]"
1014106-112 = "― [log=하루카 드레스]П-Пока я могу быть рядом с Сенсеем...[/log][wa:2091]"
1014106-115 = "― [log=하루카 드레스]Для меня...[/log][wa:5324]"
1014106-117 = "― [log=하루카 드레스]...вот что мне нравится.[/log][wa:1395]"
1014106-121 = "После этого мы вернулись внутрь. Мы с Харукой осмотрели оставшуюся выставку и отправились домой."
