[translation]
2004205-1 = "Радости кемпинга"
2004205-2 = "Кемпинг возле Миллениума"
2004205-6 = "Фух, с палаткой вроде всё..."
2004205-7 = "Теперь остаётся только расслабиться и наслаждаться отдыхом на природе!"
2004205-8 = "Спасибо за помощь, Сенсей. Я совсем не привыкла возиться с туристическим снаряжением..."
2004205-9 = "[s] «Всё нормально. Работа была несложная.»"
2004205-11 = "[ns] «Кстати, что нужно сделать, чтобы получить тот игровой предмет?»"
2004205-12 = "Согласно лору, особого монстра — Ворона Бессонницы, который сейчас доступен, — можно получить только вечером, потому что днём он спит."
2004205-13 = "В некоторых интернет-сообществах пишут, что его можно получить, если примерно в семь вечера включить систему связи в определённых местах..."
2004205-14 = "[s] «Вечером?! Но сейчас только два часа дня!»"
2004205-15 = "Ну да! Поэтому мы и пошли в кемпинг!"
2004205-16 = "Этот кемпинг расположен на крутом горном склоне, так что подниматься сюда после наступления темноты довольно опасно."
2004205-17 = "Поэтому я решила заранее разбить лагерь и поймать Ворона Бессонницы, как только наступит нужное время."
2004205-18 = "Хи-хи, ну как вам? Идеальный план, правда?"
2004205-19 = "[s1] «План не самый плохой...»\n[s2] «А что ты собираешься делать до семи?»"
2004205-22 = "Всё нормально. Пока у меня есть телефон, я могу убить сколько угодно времени."
2004205-23 = "Хм, может, пока подождём, посмотрим фильм? Я один скачала—"
2004205-24 = ""
2004205-26 = ""
2004205-28 = "А? Мало заряда?!"
2004205-29 = "Странно... Клянусь, вчера вечером я его заряжала!"
2004205-30 = "Может, штекер был вставлен не до конца... Осталось всего 5%."
2004205-31 = ""
2004205-33 = ""
2004205-34 = "С-Сенсей. Вы случайно не взяли с собой пауэрбанк?"
2004205-35 = "[s] «Нет. Я не подумал его взять...»"
2004205-36 = ""
2004205-38 = ""
2004205-39 = "А-а! Не могу поверить, что допустила такую критическую ошибку в такой важный день!"
2004205-40 = "Ладно, пока просто выключу телефон и включу его снова около семи. Так я всё ещё смогу получить предмет."
2004205-41 = "Но чем мне развлекаться до тех пор?!"
2004205-42 = "[s3] «Может, хоть раз попробуем просто насладиться природой?»\n[s4] «Хочешь что-нибудь порисовать?»"
2004205-45 = "...Не особо. Я так зациклилась на игре, что вообще нет желания рисовать."
2004205-46 = "Уф, ничего не поделаешь."
2004205-47 = "Может, проведу выходные в медитации, как всегда делает Чихиро..."
2004205-49 = "Через несколько мгновений."
2004205-51 = "МНЕ! СКУЧНО!"
2004205-52 = "Сенсей, мне ску-у-учно. Ску-у-учно."
2004205-53 = "Прошло всего десять минут?! Клянусь, я будто вечность сидела в прострации."
2004205-54 = "Вы взяли с собой хоть что-нибудь интересное, Сенсей? Такими темпами я реально умру от скуки!"
2004205-55 = "[s] «Вообще-то я взял только книгу...»"
2004205-57 = "[ns] «Всё остальное — просто снаряжение и вещи первой необходимости.»"
2004205-58 = "Так, посмотрим..."
2004205-59 = "Фонарик с ручным генератором... Крутить его весь день точно не будет весело."
2004205-60 = "Bluetooth-колонка, которую можно подключить к телефону... бесполезна, если я не могу включить телефон."
2004205-61 = "Этот портативный телевизор... здесь всё равно не поймает сигнал."
2004205-62 = ""
2004205-64 = ""
2004205-65 = "...Хм? Почему этот телевизор кажется знакомым?"
2004205-66 = "[s] «Ты однажды забрала его, когда дежурила в Студсовете.»"
2004205-68 = "[ns] «Тогда тебе тоже было скучно, и ты начала в нём копаться.»"
2004205-69 = "А... Точно, вспомнила!"
2004205-70 = "О-о-о, придумала!"
2004205-71 = ""
2004205-73 = ""
2004205-74 = ""
2004205-75 = "Если включить кастомную прошивку, которую я установила в прошлый раз, и перенастроить терминал... Получилось!"
2004205-76 = ""
2004205-79 = "[ns] «Это космический монстр на экране...?!»"
2004205-80 = "Верно! Сенсей, помните?"
2004205-81 = "Помните, когда я сильно увлеклась челленджем BOOM и установила игру на кучу электронных устройств в Шале?"
2004205-82 = "[s] «А, ты про ту классическую игру.»"
2004205-84 = "[ns] «В тот день я узнал, что играть можно даже на экране холодильника.»"
2004205-85 = "М-м, возможно, тогда я чу-уточку перестаралась..."
2004205-86 = "В общем, одним из устройств, на которые я установила «BOOM», был этот портативный телевизор."
2004205-87 = "Иными словами, сейчас этот портативный телевизор ничем не отличается от игровой консоли исключительно для «BOOM»!"
2004205-88 = "[s] «Так ты собираешься играть в BOOM до вечера?»"
2004205-89 = "Ни за что. Я уже не смогла бы играть в «BOOM» несколько часов подряд."
2004205-90 = "Я проходила её много раз, да и это классическая игра с простой графикой."
2004205-91 = "Просто сыграю минут тридцать или около того..."
2004205-92 = ""
2004205-94 = ""
2004205-95 = "Маки скрылась в палатке вместе с портативным телевизором."
2004205-96 = "Несмотря на свои слова, из палатки она больше не вышла."
2004205-98 = "Примерно пять часов спустя..."
2004205-101 = "[ns] Зайти в палатку и проверить Маки."
2004205-107 = "― [log=마키 캠핑]У-у-уф...[/log][wa:1400]"
2004205-109 = "― [log=마키 캠핑]Я опять умерла в том же месте...[/log]"
2004205-112 = "[ns] «Маки, ты всё ещё играешь?»"
2004205-114 = "[ns] «Уже почти пора—»"
2004205-116 = "― [log=마키 캠핑]Угу. Играть на этом контроллере оказалось сложнее, чем я думала...[/log][wa:340]"
2004205-119 = "― [log=마키 캠핑]Я уже на финальном боссе... [/log][wa:440]"
2004205-121 = "― [log=마키 캠핑]...но снова и снова совершаю одни и те же ошибки.[/log]"
2004205-124 = "[ns] «Разве ты не говорила, что быстро заскучаешь, потому что уже много раз проходила её?»"
2004205-126 = "― [log=마키 캠핑]Да, но с этим управлением игра стала жутко сложной... [/log][wa:2100]"
2004205-128 = "― [log=마키 캠핑]И теперь во мне проснулся азарт.[/log]"
2004205-131 = "― [log=마키 캠핑]А поскольку здесь ничего не отвлекает...[/log][wa:10]"
2004205-133 = "― [log=마키 캠핑]...кажется, я могу по-настоящему сосредоточиться только на игре.[/log]"
2004205-136 = "― [log=마키 캠핑]Неужели это и есть та самая «радость» кемпинга, о которой все говорят?[/log][wa:10]"
2004205-139 = "[ns] «Но уже почти время. Ты уверена, что всё будет нормально?»"
2004205-141 = "― [log=마키 캠핑]А, уже так поздно? Что же делать...?[/log][wa:10]"
2004205-144 = "― [log=마키 캠핑]Сенсей, правда, правда, это моя последняя попытка...[/log][wa:2920]"
2004205-146 = "― [log=마키 캠핑]Поэтому подождите ещё совсем чуть-чуть![/log]"
2004205-154 = "Получилось! Я наконец прошла, Сенсей!"
2004205-155 = "Так давно я не погружалась в «BOOM» настолько сильно... Пожалуй, есть вещи, которыми можно по-настоящему насладиться только в кемпинге."
2004205-156 = "Но кажется, я забываю что-то важное..."
2004205-157 = "А, чёрт! Надо было включить телефон!"
2004205-158 = "Сенсей! Который час?!"
2004205-159 = "[s] «Семь тридцать...?»"
2004205-160 = "Я опоздала на тридцать минут? Уже слишком поздно...?"
2004205-161 = "Пожалуйста, появись, Ворон Бессонницы!"
2004205-162 = "<SYSTEM> «Ворон Бессонницы» куда-то улетел..."
2004205-163 = "А-а-а, я реально его упустила!"
2004205-164 = "Я специально приехала в этот кемпинг, да ещё и в выходной, чтобы поймать особого монстра. Как я могла заиграться, потерять счёт времени и пропустить его?"
2004205-165 = "Вот почему нельзя расслабляться во время кемпинга!"
2004205-166 = "Я не могу вернуться с пустыми руками после всего этого!"
2004205-167 = "Сенсей. С этого момента ваша задача — засекать мне время."
2004205-168 = "Раз уж всё так вышло, я попробую побить рекорд скоростного прохождения «BOOM» на этом портативном телевизоре!"
2004205-170 = "После этого мы с Маки до поздней ночи вместе наслаждались видеоиграми."
