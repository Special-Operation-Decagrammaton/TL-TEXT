[translation]
90100010-1 = "Episódio 01;Kunekune, a Sombra Ondulante"
90100010-6 = ""
90100010-7 = "Ei... você já ouviu falar daquele boato?"
90100010-8 = "Ué, de qual boato?"
90100010-9 = "Sabe aquele calçadão que fica logo na saída sul da estação Shirounagi?"
90100010-10 = "Aquele que beira o rio? Nossa, lá não tem uma sombra sequer, no verão é um sol de rachar a mamona."
90100010-12 = "Exatamente. Como não tem árvore nenhuma por perto, quase ninguém passa caminhando por ali..."
90100010-13 = "Mas dizem que ultimamente, bem no meio-dia, tem uma figura fazendo ginástica estranha por lá."
90100010-14 = "Ué, vai ver é só alguém se exercitando, não tem nada demais nisso."
90100010-15 = "Não, menina, a bizarrice não para por aí..."
90100010-16 = ""
90100010-17 = "Dizem que a pessoa usa um macacão colante branco dos pés à cabeça.#nDe longe, parece um autêntico 'espantalho branco' tremeluzindo no asfalto."
90100010-18 = "Tá... é bem esquisito, mas ainda não vejo motivo pra tanto pavor."
90100010-19 = "É que quem tenta se aproximar pra falar com a figura diz que ela evapora num piscar de olhos!#nQuando você percebe, ela já tá longe feito uma miragem no calor, então quase ninguém conseguiu ver a cara da coisa."
90100010-20 = "Nossa... aí já começou a ficar bizarro de verdade."
90100010-21 = ""
90100010-22 = "......Peraí. Se você disse 'quase ninguém'... quer dizer que alguém chegou a ver o rosto daquela coisa?"
90100010-23 = "Uhum. Uma garota do Clube de Atletismo que tava treinando corrida por perto."
90100010-24 = "Como a figura se afastava toda vez que ela tentava chegar perto, o espírito competitivo da garota falou mais alto...#ne ela correu com tudo até alcançar. E quando finalmente olhou cara a cara pro tal espantalho――"
90100010-25 = ""
90100010-28 = "――Dizem que daquele dia em diante, ela perdeu completamente a fala."
90100010-29 = "C-Como assim?! O que aconteceu com ela?!"
90100010-30 = "Assim que encarou o rosto do espantalho de perto, ela caiu dura desmaiada no chão."
90100010-31 = "E desde aquele dia... parece que ela vive presa num pesadelo eterno, balançando o corpo de um lado pro outro sem parar."
90100010-32 = "――Ondulando... tipo assim, 'kunekune'..."
90100010-33 = "Kunekune......?"
90100010-34 = "É... ondulando sem parar."
90100010-35 = ""
90100010-39 = "Próximo Episódio;Entre a Raposa e a Prodígio"
