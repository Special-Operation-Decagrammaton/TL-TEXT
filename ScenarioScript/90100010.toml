[translation]
90100010-1 = "Эпизод 1;Извивайся-извивайся-извивайся"
90100010-6 = ""
90100010-7 = "Эй, ты слышала слух?"
90100010-8 = "Какой слух?"
90100010-9 = "Знаешь мост к югу от станции Широ Унаги?"
90100010-10 = "Тот, что идёт через реку и там вообще нет тени? Жуть какая."
90100010-12 = "Ага. Настоящая пытка. Поэтому там никто и не ходит."
90100010-13 = "Но слушай. Говорят, какой-то чудак каждый день ровно в полдень приходит прямо на середину моста. И тренируется!"
90100010-14 = "Ну и что? Может, человек тренируется в обеденный перерыв."
90100010-15 = "Подожди. Я ещё не закончила. Дальше страннее."
90100010-16 = ""
90100010-17 = "Говорят, этот человек каждый день приходит туда в белом комбинезоне. Это не спортивный костюм и не форма для физры — почти водолазный костюм. Так часто, что местные прозвали его «белым пугалом»."
90100010-18 = "Хмм... Может, пытается согнать воду? Ну, как перед боксёрским боем?"
90100010-19 = "Знаю только, что этот человек ужасно дёрганый. Стоит кому-нибудь приблизиться — практически растворяется в воздухе. Лица почти никто не видел."
90100010-20 = "...Это довольно странно."
90100010-21 = ""
90100010-22 = "Подожди. Что значит «почти никто»? То есть кто-то всё-таки встретился взглядом с этим «пугалом»?"
90100010-23 = "Ага. Одна девушка из команды по лёгкой атлетике видела его лицо."
90100010-24 = "Кажется, когда белое пугало убежало, в ней проснулся азарт, и она погналась следом — даже догнала! Но когда увидела лицо пугала..."
90100010-25 = ""
90100010-28 = "...Она потеряла дар речи."
90100010-29 = "О чём ты?"
90100010-30 = "Как только бегунья заглянула пугалу в глаза, её прошиб холодный пот от ужаса. Потом она потеряла сознание!"
90100010-31 = "С тех пор она непрерывно дрожит. Настоящий живой кошмар."
90100010-32 = "И вот ещё что. Она начала... извиваться."
90100010-33 = "Извиваться...?"
90100010-34 = "Ты не ослышалась. Извиваться."
90100010-35 = ""
90100010-39 = "Следующий эпизод;Между сверхчеловеком и лисой"
