[translation]
90002210-1 = "Эпизод 21;Борьба"
90002210-2 = "Не испытывай моё терпение, ФАЛЬШИВЫЙ БОГ!"
90002210-4 = ""
90002210-7 = "Ты убил их."
90002210-8 = "ТЫ ИХ УБИЛ!"
90002210-9 = "НЕ СМЕЙ НАЗЫВАТЬ СЕБЯ «БОГОМ»!"
90002210-10 = ""
90002210-12 = ""
90002210-13 = "Мне не нужна твоя грёбаная обрезка."
90002210-14 = "И я... никогда не приму, что так называемые «противоречия» нужно вырезать так, будто их никогда не существовало! БУДТО ОНИ НИКОГДА НЕ ИМЕЛИ ЗНАЧЕНИЯ!"
90002210-15 = ""
90002210-30 = "Стремиться к счастью."
90002210-31 = "Неважно что случится — совершенно точно, я отдам ради этого всё, что у меня есть!"
90002210-32 = "Даже если я потеряюсь в ПРОТИВОРЕЧИЯХ, даже если кто-то попытается ВСТАТЬ У МЕНЯ НА ПУТИ!"
90002210-33 = "Глупо."
90002210-34 = "Цена греха — смерть. Исход абсолютен."
90002210-35 = "Если это единственный исход, в который ты веришь..."
90002210-36 = ""
90002210-38 = ""
90002210-40 = "[log] «Я не уважаю тех, кто...»[/log]"
90002210-43 = "[log]«...уничтожает себя, цепляясь за собственные недостатки.»[/log]"
90002210-46 = "Мне всё равно, чем это закончится, пока финал пишу я сама!"
90002210-47 = "?!"
90002210-48 = "Невозможно. Как... ты двигаешься?"
90002210-49 = "У-Ух...!"
90002210-50 = ""
90002210-52 = ""
90002210-53 = ""
90002210-56 = "Сенсей...?"
90002210-57 = "[ns1] «...Всё, что мы можем сделать для тех, кого потеряли, — скорбеть.»\n[ns2] «Это печально, но большего мы не можем.»"
90002210-60 = "Я же сказала, это опасно... Пожалуйста... отойдите назад!"
90002210-61 = "[s] «Пожалуйста, простите мне это хотя бы один раз.»"
90002210-62 = "...Ладно. Ты всё равно никогда не делал того, что тебе говорят."
90002210-63 = "Почему ты так упорно испытываешь пределы собственных возможностей?"
90002210-64 = "Сенсей...!"
90002210-65 = "Бороться — значит страдать, а страдание в конце концов породит грех."
90002210-66 = "[s3] «Я знаю. Но не пытайся отнять это у нас.»\n[s4] «Не пытайся лишить нас возможности.»"
90002210-69 = "...!"
90002210-70 = "[s5] «Пока мы живы, нам не избежать страданий.»\n[s6] «Но я не позволю кому-то другому нести это бремя вместо меня.»"
90002210-73 = "Даже если ради этого придётся извиваться и ползать по земле, как жалкому насекомому?"
90002210-75 = ""
90002210-77 = "[log] «Да. Возможно, так и будет.»[/log]"
90002210-80 = "[log] «И всё же это путь, который я выбираю.»[/log]"
90002210-83 = "[log] «Даже если всё, что мы можем, — падать, бороться и барахтаться в грязи.»[/log]"
90002210-86 = "[log] «В конце концов мы поднимемся вместе.»[/log]"
90002210-89 = "[ns] «Разве не так, Арис?»"
90002210-90 = "..."
90002210-91 = "Да. Всё верно, Сенсей."
90002210-92 = "Помнишь, Кей? Я говорила, что «герой — это тот, кто постоянно идёт вперёд вместе со своими товарищами»?"
90002210-93 = "Арис, конечно я помню."
90002210-95 = "Герой может попасть во все те места..."
90002210-96 = "...куда невозможно добраться одной лишь собственной силой."
90002210-98 = ""
90002210-100 = ""
90002210-101 = ""
90002210-102 = "...Какое богохульство."
