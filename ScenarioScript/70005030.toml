[translation]
70005030-1 = "Запись от 19 февраля (2)"
70005030-2 = "Так что здесь происходит?"
70005030-3 = "Как вы и просили, я пришла в D.U. без лишних вопросов."
70005030-4 = "Н-Ну, главный префект..."
70005030-5 = "Мы получили сообщение от Променада Чёрной Черепахи из Шаньхайцзин..."
70005030-6 = "Шаньхайцзин? Променад Чёрной Черепахи?"
70005030-7 = "Тогда... Это обмен между академиями, Ако?"
70005030-8 = "Внешняя дипломатия не входит в полномочия нашей Префектурной команды."
70005030-9 = "Н-Н-Ну, эм. Главный префект! Я имела в виду не совсем это!"
70005030-10 = "Я... э-эм... лично... знакома с кое-кем из Променада Чёрной Черепахи!"
70005030-11 = "И они спросили, не хотим ли мы вместе провести время в D.U.!"
70005030-12 = "У тебя... есть подруга... в Променаде Чёрной Черепахи?"
70005030-13 = "..."
70005030-14 = "Прости, Ако. В последнее время я слишком сильно тебя загружала, да?"
70005030-15 = "Настолько отчаянно хотела сменить обстановку, что пришлось соврать о наличии подруги?"
70005030-16 = "Что это вообще значит?!"
70005030-17 = "Я понимаю, почему она так подумала..."
70005030-18 = "*вздыхает*"
70005030-19 = "Вы двое, тихо!"
70005030-20 = "И-и, пожалуйста, поверьте мне, главный префект...! Эм... Это, ну..."
70005030-21 = "..."
70005030-22 = "В любом случае это обязательно должно остаться личным делом!"
70005030-23 = ""
70005030-25 = ""
70005030-26 = "(ОБЯЗАТЕЛЬНО личным делом...?)"
70005030-27 = ""
70005030-28 = "О! Вы наконец пришли! Добро пожаловать!"
70005030-29 = "Тогда... «Давно не виделись», да, Ако?"
70005030-30 = "Д-Да! Руми! Именно... так...?"
70005030-31 = ""
70005030-33 = "...!"
70005030-34 = "(Она не врала? Серьёзно? У Ако есть подруга из Шаньхайцзин?)"
70005030-35 = "(А? Но эта компания... Президент Променада Чёрной Черепахи, его управляющая и исполнительный офицер Генрюмон, ученического совета Шаньхайцзин...)"
70005030-36 = "Привет, Ако. Мы... много о тебе слышали от президента."
70005030-37 = "Эм, э-эм... Здравствуйте, Префектурная команда Геенна... То есть, эм, здравствуйте, вы четверо обычных людей! Я Коноэ Мина. А это..."
70005030-38 = ""
70005030-40 = ""
70005030-41 = ""
70005030-42 = "Хм. Рюугэ Кисаки. Думаю, этого имени достаточно, раз встреча носит личный характер."
70005030-43 = "Но прежде... Прошу простить. Думаю, разумно заранее зажечь это."
70005030-44 = ""
70005030-46 = ""
70005030-48 = "А? Интересный запах..."
70005030-49 = "Да. Но он кажется... успокаивающим...?"
70005030-50 = "..."
70005030-51 = "(Это она. Рюугэ Кисаки, президент ученического совета Шаньхайцзин и лидер Генрюмон! Тёмный Монарх!)"
70005030-52 = "Ако."
70005030-53 = "Д-Д-Д-Да, главный префект?!"
70005030-54 = "Можно узнать, что именно здесь происходит?"
70005030-55 = "Я-я-я же сказала, я здесь со своей подругой Руми...!"
70005030-57 = "Так-так. Стоп. Раз уж мы все собрались, больше нет смысла что-то скрывать."
70005030-58 = "Я сейчас всё объясню. Тебя устраивает, Кисаки?"
70005030-59 = "Разумеется. Я доверяю тебе, особенно в подобных обстоятельствах."
70005030-60 = "В любом случае... рада познакомиться, Сорасаки Хина. Можешь называть меня Кисаки."
70005030-61 = "Х-Хорошо... Ты тоже... можешь звать меня Хиной."
70005030-63 = "..."
70005030-64 = "Такова ситуация."
70005030-65 = "Ошибки доставки случаются часто, но в этот раз совпадение свело наши пути здесь."
70005030-66 = "И хотя Мина сделала всё возможное, как и Префектурная команда, вы все стали жертвами шутки судьбы."
70005030-67 = "Что ж, может, теперь отпразднуем наши дни рождения? Вот. Думаю, это ваш торт."
70005030-68 = ""
70005030-70 = ""
70005030-71 = ""
70005030-72 = ""
70005030-73 = "Фуфу. Похоже, это драгоценный подарок, несущий глубокую благодарность тех, кто следует за вами."
70005030-74 = ""
70005030-76 = ""
70005030-77 = ""
70005030-78 = "Понятно... Спасибо всем. И тебе тоже, Кисаки. Тогда можно считать это своего рода обменом тортами?"
70005030-79 = "А этот торт для тебя. Все вокруг тебя действительно вложили много заботы, чтобы достать его."
70005030-80 = ""
70005030-82 = ""
70005030-83 = ""
70005030-84 = ""
70005030-85 = ""
70005030-86 = ""
70005030-88 = "Как неожиданно, что у нас один день рождения."
70005030-89 = "На первый взгляд так и кажется, но в общем масштабе это не настолько невероятное совпадение."
70005030-90 = "Наверняка мы не единственные студенты во всём Кивотос, родившиеся в один день."
70005030-91 = "Это... правда. Особенно учитывая, сколько здесь студентов."
70005030-92 = "Но именно этот день рождения станет для меня особенным воспоминанием. Спасибо, Ако. Иори. Чинацу."
70005030-93 = "Не за что. Е-Если я могу отпраздновать ваш день рождения вместе с вами..."
70005030-94 = "Эм... Всё было как сюжет фильма, но я рада, что всё благополучно закончилось и мы доставили вам торт, госпожа!"
70005030-95 = "Хотя большую часть работы для этого проделала я..."
70005030-96 = "Ну-ну. Иногда жизнь просто такая."
70005030-97 = "Вот, это мои особые персиковые моти. Я приготовила их с персиковым джемом и мякотью."
70005030-98 = "Спасибо всем. Давайте поделим этот десерт после торта."
70005030-99 = "Если наши желудки всё это выдержат."
70005030-100 = ""
70005030-101 = "Не вижу проблемы. Говорят же, для десертов и тортов у людей есть отдельный желудок."
70005030-102 = "Фуфу. Это определённо правда. Моя ошибка. Просто я сама не могу съесть много."
70005030-104 = "Тогда с днём рождения, главный префект, госпожа!"
70005030-105 = "С днём рождения, госпожа, главный префект."
70005030-106 = ""
70005030-107 = "Да. Рада познакомиться со всеми из Шаньхайцзин."
70005030-108 = "Это могло бы стать началом отношений Шаньхайцзин и Геенна... Прошу прощения. Я оговорилась."
70005030-109 = "Но даже если мы не можем считать это обменом между школами, хотя бы среди тех, кто собрался сегодня..."
70005030-110 = "...надеюсь, мы и дальше будем расширять кругозор и своё представление о мире, в котором все живём."
70005030-111 = "У меня всё-таки есть вопрос. Почему... мы в комнате караоке? Причём платим за неё мы."
70005030-112 = "Ну, всё просто. Променад Чёрной Черепахи обычно пользуется преимуществами хороших резервных средств..."
70005030-113 = "А караоке на день рождения обязательно! Правда же?"
70005030-115 = "А, точно. Кажется, я такое слышала."
70005030-116 = "Н-неужели?"
70005030-117 = "Тогда кто начнёт? Желающих нет? Я первая!"
70005030-119 = ""
70005030-121 = ""
70005030-122 = ""
70005030-123 = ""
70005030-124 = ""
70005030-125 = ""
70005030-126 = ""
70005030-128 = "Тогда... я следующая!"
70005030-129 = ""
70005030-131 = ""
70005030-132 = ""
70005030-133 = ""
70005030-134 = ""
70005030-135 = ""
70005030-136 = ""
70005030-137 = ""
70005030-139 = "Хм-м-м! Поэзия... В голову пришла мелодия! Я чувствую, как нарастает возбуждение!"
70005030-140 = ""
70005030-142 = ""
70005030-143 = ""
70005030-144 = ""
70005030-145 = ""
70005030-146 = ""
70005030-148 = ""
70005030-149 = ""
70005030-150 = ""
70005030-151 = ""
70005030-152 = "Эй, что ты собираешься делать с этой атмосферой?!"
70005030-153 = "Ну, эм... Даже если попросить меня что-то сделать..."
70005030-154 = ""
70005030-155 = "Х-Хиномия Чинацу, докладывает! Я переломлю эту атмосферу!"
70005030-156 = ""
70005030-158 = ""
70005030-159 = ""
70005030-160 = ""
70005030-161 = ""
70005030-162 = ""
70005030-164 = ""
70005030-166 = ""
70005030-177 = "Получив приглашение, я пришла в караоке-комнату и открыла дверь!"
70005030-179 = "[ns] «Всем привет!»"
70005030-181 = "С-Сенсей...?!"
70005030-183 = "Сенсей...?!"
70005030-184 = ""
70005030-186 = ""
70005030-187 = "[ns] «С днём рождения, Хина! Кисаки!»"
70005030-188 = ""
70005030-189 = "Х-Хмф! Я совершенно не хотела приглашать сюда Сенсея, но решила, что на всякий случай это будет разумно!"
70005030-190 = "Я думала о тебе! Не хотела, чтобы ты чувствовала себя забытой! Будь благодарна, Сенсей!"
70005030-191 = "Это ты позвала Сенсея, Ако...?"
70005030-192 = "Хм? Вы тоже так сделали, старший администратор Ако? Потому что я тоже подумала, что будет хорошо, если Сенсей придёт..."
70005030-193 = "Н-Ну... Значит...!"
70005030-194 = "...Понятно. Вы обе отдельно пригласили Сенсея."
70005030-195 = "Моя глубочайшая благодарность. Мина, Ако. И тебе, Сенсей, за то, что проделала такой путь сюда."
70005030-196 = "[s1] «Что ты такое говоришь! Конечно, я приду!»\n[s2] «Мина, Ако, спасибо, что сообщили мне!»"
70005030-199 = "Мм. Разумеется. Хех."
70005030-200 = "...Правда, только в этот раз."
70005030-201 = "[ns3] «Тогда позвольте этому взрослому взять на себя ответственность за испорченное настроение!»\n[ns4] «Давайте как следует повеселимся на празднике Хины и Кисаки!»"
70005030-204 = "А? Э-Эм, вообще-то Сенсей не была той, кто испортил настроение..."
70005030-205 = "Ну-ну. Просто подыграй, Рэйдзё."
70005030-206 = "...Понятно."
70005030-207 = ""
70005030-209 = ""
70005030-210 = "[ns] «Хина, Кисаки, пора петь втроём!»"
70005030-211 = "Эм, что...? Но я почти не знаю песен...?"
70005030-212 = "Я тоже..."
70005030-213 = ""
70005030-215 = ""
70005030-216 = "Хм? Чтобы наслаждаться праздником, не обязательно хорошо петь? Нужно просто веселиться?"
70005030-217 = "Кажется, я понимаю. Дарить смех — величайший подарок из всех."
70005030-218 = "А. Да. Понимаю. Эм..."
70005030-219 = ""
70005030-221 = ""
70005030-231 = "[ns] «А теперь ОТОРВЁМСЯ!!!»"
70005030-232 = ""
70005030-233 = ""
70005030-234 = ""
70005030-235 = ""
70005030-237 = "Так день рождения 19 февраля наполнился весельем, смехом и незабываемыми воспоминаниями."
70005030-238 = "Однако в одном я просчиталась. Выносливость старшеклассниц..."
70005030-239 = "...взрослому человеку ни в коем случае нельзя недооценивать."
70005030-240 = "Запись от 19 февраля"
