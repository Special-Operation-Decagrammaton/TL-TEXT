901010800210-11 = "FOX2, encontrou alguma coisa?"
901010800210-12 = "Achei um manual de procedimentos que os capangas leem antes de sair em patrulha. Analisando o conteúdo."
901010800210-13 = "'Mapa da rota de ronda', 'Pontos críticos de inspeção', 'Rede de contatos de emergência'..."
