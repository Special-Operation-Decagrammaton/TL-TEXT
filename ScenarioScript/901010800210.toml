901010800210-26 = "Нет. Только приказ."
901010800210-27 = "Звучит как неаполитанская крипипаста. Что-то вроде ни при каких обстоятельствах не входите в комнату 302."
901010800210-28 = "А почему нельзя входить в комнату 302?"
901010800210-29 = "Без понятия. Если бы было объяснение, это уже не была бы крипипаста."
