901010800210-19 = ""
901010800210-21 = ""
901010800210-22 = ""
901010800210-23 = "'Uma vez por semana, o vigilante do plantão noturno deve rolar um tambor de óleo e dar uma volta completa no porto à meia-noite'...?"
901010800210-24 = "Que tipo de instrução sem pé nem cabeça é essa?"
901010800210-25 = "Não explica a razão ou o objetivo de ter que fazer um troço desses?"
901010800210-26 = "Nada. Nenhuma explicação, só a ordem nua e crua."
901010800210-27 = "Que instrução esquisita. #nLembra aquelas lendas urbanas de terror: 'Aconteça o que acontecer, nunca entre no quarto 302'."
901010800210-28 = "E por que não pode entrar no quarto 302?"
901010800210-29 = "Sei lá! Se desse pra explicar tim-tim por tim-tim, não seria lenda urbana, né?!"
901010800210-31 = "Lendas inventadas à parte, no mundo real todo manual tem uma intenção por trás."
901010800210-32 = "Debateremos esse propósito depois. FOX2, prossiga na varredura do galpão."
