[translation]
211090-1 = "Episódio 09;Uma Chance"
211090-2 = "Comitê de Restauração de Gehenna"
211090-3 = ""
211090-4 = "Sensei! E aeee!"
211090-5 = "Oieee!"
211090-6 = "[s] \"Olá, pessoal!\""
211090-7 = "Agradeço sinceramente pela sua pontualidade."
211090-8 = "Sem mais delongas, o objetivo da nossa diligência de hoje é――"
211090-9 = ""
211090-11 = ""
211090-12 = "Fechar parceria com um novo 'Estabelecimento Conveniado de Pontos'!"
211090-13 = "[s] \"A empolgação de vocês tá em outro nível...!\""
211090-14 = "É um restaurante de soba que tá estourando nas redes sociais agora.#nNo horário de almoço a fila de espera bate duas horas fácil!"
211090-15 = "[s] \"Duas horas de fila... no intervalo de almoço?!\""
211090-16 = "Consta que as alunas matam aula antes do intervalo para garantir lugar, ou simplesmente gazetam a aula seguinte."
211090-17 = "Uma conduta deploravelmente fidedigna aos padrões de Gehenna."
211090-18 = "Se há alunas burlando a disciplina, nosso dever é estruturar um ambiente onde isso não seja necessário."
211090-19 = "Daí decorre a justificativa de termos selecionado este local para o novo convênio."
211090-20 = "Feitas as considerações preliminares, dirijamo-nos até lá."
211090-24 = ""
211090-25 = "É aqui."
211090-26 = "Fazia tanto tempo que eu não comia soba de verdade!#nCom a correria do comitê, eu só vivia engolindo lanche de cantina."
211090-27 = "Comer soba é ótimo, mas vem cá... tem certeza de que tudo bem você pagar a conta pra todo mundo, Sensei?"
211090-28 = "[s] \"Claro, sem problemas!\""
211090-29 = ""
211090-31 = ""
211090-32 = "Oportunidades de expressar generosidade a jovens alunas são raras na vida. Por favor, sinta-se grato a nós pelo ensejo."
211090-33 = "[s] \"Espera... EU que tenho que agradecer?!\""
211090-34 = "Que papo furado é esse de quem tá ganhando almoço de graça?!"
211090-35 = "Para mim isto basta. Sou apenas uma mera secretária, afinal."
211090-36 = "O conceito de secretária na cabeça da Shoko é meio distorcido..."
211090-37 = "Enfim! Muito obrigada pelo almoço, Sensei!"
211090-38 = "Ora? Há um cartaz anunciando um desafio deveras peculiar."
211090-39 = "'Desafio Wanko-soba: devore cem tigelas e ganhe a conta inteiramente de graça'..."
211090-40 = "Cem tigelas é loucura pura! Ninguém aguenta isso tudo não!"
211090-41 = "Só competidor profissional ou quem tiver um buraco negro no lugar do estômago pra encarar isso."
211090-42 = "Tomara que a nossa vez chegue logo!"
211090-43 = ""
211090-45 = ""
211090-49 = ""
211090-50 = ""
211090-51 = "Voltem sempre, queridas clientes!"
211090-52 = "......"
211090-53 = "...Nunca mais piso aqui na vida."
211090-54 = "Nem me fale. Duas horas mofando na fila pra engolir aquilo... Que perda de tempo."
211090-55 = ""
211090-57 = ""
211090-58 = ""
211090-59 = "[ns] \"......\""
211090-61 = "(Ninguém saía dali com cara de quem tinha feito uma boa refeição)"
211090-62 = "(Esperamos por uma quantidade colossal de tempo na fila)"
211090-64 = "(Quando finalmente nos sentamos e fizemos o pedido...)"
211090-65 = ""
211090-67 = ""
211090-68 = "Saindo no capricho! Quatro combos de Zaru Soba especiais!"
211090-69 = ""
211090-71 = ""
211090-72 = ""
211090-73 = "Nossa, saiu voando de tão rápido! Mas eu tava morrendo de fome, então tá valendo!"
211090-74 = "A aparência até que tá bem bonita."
211090-75 = "Bom apetite pra nós!"
211090-76 = "[s] \"Bom apetite!\""
211090-77 = ""
211090-79 = ""
211090-80 = "......"
211090-81 = "......"
211090-82 = "......"
211090-83 = "Ué..."
211090-84 = "...O gosto tá meio... sem sal?"
211090-85 = "A minha porção está assustadoramente salgada.#nA ponto de parecer que todo o sódio do seu prato migrou para a minha tigela."
211090-86 = "O equilíbrio de tempero tá todo esquisito..."
211090-87 = "[s] \"Gostoso... definitivamente não tá.\""
211090-88 = "Pois é, tá bizarro de ruim."
211090-89 = "Se mesmo atenuado pela fome voraz o sabor recebe tal veredito, a gravidade é calamitosa."
211090-90 = "Como é que esse lugar bomba tanto nas redes...?"
211090-91 = "O Sensei pagou do bolso dele, eu queria tanto que fosse gostoso..."
211090-92 = "Fomos ludibriadas com maestria cirúrgica."
211090-93 = "Pela lenda urbana do desafio das cem tigelas de soba!!"
211090-94 = "Só você que tava ligando pra essa história de cem tigelas, Shoko!"
211090-95 = ""
211090-98 = "Esta abominação... não pode passar impune."
211090-99 = ""
211090-101 = ""
211090-102 = "[ns] \"Essa voz...!!\""
211090-103 = ""
211090-104 = ""
211090-105 = "Ao ouvir o clamor das redes sociais, peregrinei até aqui no intuito de expandir os horizontes da alta gastronomia――"
211090-106 = "E deparo-me com um ultraje de tempo e paladar desta magnitude."
211090-107 = ""
211090-109 = ""
211090-110 = ""
211090-111 = ""
211090-112 = ""
211090-113 = "Hiiik...! V-Vocês são...!"
211090-114 = "A alma do soba reside na máxima das 'três frescuras': moagem fresca, massa fresca e fervura fresca.#nNo entanto... o que temos diante de nós?"
211090-115 = "O aroma sutil do trigo sarraceno inexiste por completo.#nO amido mal enxaguado remete à sensação execrável de mastigar lamaçal pútrido."
211090-116 = "E acima de tudo, o descalabro do caldo!#nO molho de soja e o caldo dashi guerreiam caoticamente, emitindo berros de dor!"
211090-117 = "Olha só pra isso! A massa empapou e grudou feito uma bola de cola!#nComo é que enfia um negócio desses pra dentro?!"
211090-118 = "Estávamos tão ansiosas... que grande lástima★#nA única coisa digna de menção aqui é o excesso grotesco de [ruby=volume]quantidade[/ruby]."
211090-119 = "E se a gente jogar pasta de amendoim com pimenta tabasco por cima?#nCapaz de descer melhor!"
211090-120 = ""
211090-122 = ""
211090-123 = "Um estabelecimento que renega os fundamentos mais primários da culinária não possui qualquer direito à existência."
211090-124 = "P-Parem, por favor...!! Nós prometemos reformar a receita, tenham misericórdia...!"
211090-125 = "Negativo... Um lugar como este é uma blasfêmia viva contra a santidade dos alimentos! Sendo assim――!!"
211090-126 = ""
211090-129 = ""
211090-130 = "[ns] \"Esperem um pouco...!\""
211090-131 = ""
211090-132 = "Ora... vejo que o Sensei também honra este recinto com sua presença. Um mui respeitoso bom dia."
211090-133 = "Oláaa～"
211090-134 = "Opa, o Sensei tá aqui!"
211090-135 = ""
211090-137 = ""
211090-138 = "Peraí... você também comeu essa gororoba, Sensei...?"
211090-139 = "......"
211090-140 = "Compreendo. Ousaram servir esse pasto degradante até mesmo ao ilustre Sensei.#nNão resta mais a menor brecha para condescendência."
211090-141 = "[s] \"Calma, vamos repensar isso com carinho?!\""
211090-142 = "......"
211090-143 = "Por qual razão busca interceder?#nNão me diga que... o prato agradou ao seu paladar?!"
211090-144 = "[s] \"Não, que a comida tá horrível é um fato inegável...\""
211090-145 = "Guh, que tiro no peito...!!"
211090-146 = ""
211090-147 = "Os atentados explosivos do Clube de Pesquisa Gourmet mancham severamente a reputação de Gehenna."
211090-148 = "Se conseguirmos colocar rédeas nelas, nosso ideal dará um salto colossal."
211090-149 = "...Muito bem, vamos fazer uma aposta!"
211090-150 = ""
211090-152 = ""
211090-153 = ""
211090-154 = ""
211090-155 = ""
211090-156 = "Com licença!"
211090-157 = "Quem são as senhoritas...?"
211090-158 = "Nós somos o Comitê de Restauração de Gehenna!"
211090-159 = "Estou a par. Dizem que almejam transformar a escola."
211090-160 = "Exatamente!#nEntão que tal negociarmos? Que tal apostar na 'recuperação' deste restaurante?!"
211090-161 = ""
211090-163 = ""
211090-164 = "Recuperação? Um disparate totalmente inconcebível."
211090-165 = ""
211090-167 = ""
211090-170 = ""
211090-171 = "Ainda assim, a detonação imediata é um recurso tacanho que extirpa o gérmen do aprimoramento."
211090-172 = "Eu entendo a frustração de vocês, mas explodir tudo na hora é passar do ponto, não acham?"
211090-173 = "Por isso, façam uma aposta com a gente!"
211090-174 = ""
211090-176 = ""
211090-177 = "Dem um prazo pro restaurante trabalhar! Tipo uma semana!"
211090-178 = "Até lá, a detonação fica suspensa em compasso de espera!"
211090-179 = "......?"
211090-180 = "Se o restaurante melhorar a receita e tirar nota máxima, a esperança de redenção estará provada, não é?!"
211090-181 = "......?"
211090-182 = "E quem sabe esse lugar até não vire um templo sagrado da gastronomia?!"
211090-183 = "......"
211090-184 = "......"
211090-185 = "É... gente? Alguém podia me dar uma resposta...?"
211090-186 = ""
211090-188 = ""
211090-189 = ""
211090-191 = "[ns] \"NÃO, ESPEREM――!!\""
211090-193 = "CABUUUUUM!!"
211090-195 = "NÃÃÃO! O MEU RESTAURANTE FOI PROS ARES!!"
211090-196 = "[ns] \"HARUNAAA～!!\""
211090-198 = "Cof, cof, cof...!"
211090-199 = ""
211090-201 = ""
211090-202 = "No fim sempre acaba em explosão, que novidade..."
211090-203 = "Ai, ai..."
211090-204 = ""
211090-206 = ""
211090-207 = "Constitui o desfecho natural."
211090-208 = "Compreendi perfeitamente o teor dos vossos argumentos."
211090-209 = "Então por que você explodiu tudo logo em seguida?!"
211090-210 = "Pois o pleito colide frontalmente com as nossas convicções sagradas."
211090-211 = "Este estabelecimento já profanou a trilha imaculada da culinária.#nPor qual motivo conceder-lhe o privilégio luxuoso de uma 'segunda chance'?"
211090-212 = "Ademais, conferir tratamento preferencial a este comércio seria uma ofensa imperdoável à memória de todos os outros restaurantes que reduzimos a poeira."
211090-213 = "Falou e disse★"
211090-214 = "Eca, cuspi farpa de madeira! Entrou na minha boca!"
211090-215 = "E eu nem cheguei a provar uma garfada do meu prato..."
211090-216 = "Vocês... pretendem continuar com essa insanidade pra sempre?!"
211090-217 = "Vão sair explodindo cada restaurante que não for perfeito?!"
211090-218 = "Rogo que não incorram em equívocos. Não detonamos edifícios por puro capricho indiscriminado."
211090-219 = "Exijo que não tratem a nossa reverência à arte culinária com leviandade."
211090-220 = "É por causa de loucuras assim que Gehenna tem fama de esgoto terrorista!"
211090-221 = "Porventura a culpa primordial não recai sobre o comerciante incapaz de entregar um serviço condizente com a contraprestação exigida?"
211090-222 = "O cliente quita o valor estipulado, e o recinto serve comida digna de consumo. Mecânica elementar."
211090-223 = "Acreditam sinceramente que um estabelecimento inapto a cumprir o mínimo basilar mereça continuar de portas abertas?"
211090-224 = "Pior que a lógica dela é irrefutável...!"
211090-225 = ""
211090-227 = ""
211090-228 = "Gravem bem em vossas memórias: nós somos o Clube de Pesquisa Gourmet."
211090-229 = "Para saborear o ápice do paladar gastronômico..."
211090-230 = "Superaremos qualquer intempérie ou obstáculo――"
211090-231 = "――Qual era o nosso lema de encerramento mesmo?"
211090-232 = "EAT OR DIE～!!"
211090-233 = ""
211090-235 = ""
211090-236 = ""
211090-237 = "Até um próximo encontro fortuito, Sensei... E prezadas integrantes da――"
211090-238 = "Comissão de Conservação de Resquícios de Molho de Ostra!"
211090-239 = "NÃO É ESSE O NOME!! É COMITÊ DE RESTAURAÇÃO DE GEHENNA!!"
211090-240 = ""
211090-242 = ""
211090-243 = ""
211090-244 = ""
211090-245 = ""
211090-246 = "[ns] \"No final das contas, o destino foi o mesmo...\""
211090-247 = ""
211090-248 = "Comprovou-se empiricamente que dobrá-las pela persuasão convencional é inviável."
211090-249 = "Pra começo de conversa, tem como deter aquelas malucas?#nSó se descer o sarrafo com poder militar bruto, mas..."
211090-250 = "Seja como for, a perseverança é mandatória.#nPara salvar Gehenna, precisamos mitigar a atuação de elementos incontroláveis."
211090-251 = "...Custe o que custar."
211090-252 = "Da próxima vez nós vamos convencer aquelas garotas, vocês vão ver!"
211090-253 = "Ainda assim... há um ponto na linha de raciocínio do Clube Gourmet que me suscita certa concordância."
211090-254 = "Qual ponto?"
211090-255 = "A premissa de que, em um ecossistema impiedoso de predadores e presas, conceder uma 'segunda oportunidade' constitui um luxo desmedido."
211090-256 = ""
211090-258 = ""
211090-259 = ""
211090-260 = "Você solta umas pedradas bem frias de vez em quando, né, Shoko?"
211090-261 = "Apenas enuncio fatos objetivos."
211090-262 = "[s] \"Mas seria tão bom se todos tivessem uma chance de recomeçar, não acha?\""
211090-263 = ""
211090-265 = ""
211090-266 = "...Assim pensa o senhor."
211090-267 = "Se fosse um benefício outorgado de forma equânime a todos os indivíduos, talvez não se revelasse de todo funesto."
211090-268 = "Bom, bola pra frente! O plano de hoje furou, mas não tem crise!"
211090-269 = "A nossa marcha rumo ao topo não vai parar por isso!"
211090-270 = "Gente, mas vamos comer alguma coisa primeiro? Meu estômago tá roncando que nem motor de trator..."
211090-271 = "Sugiro que busquemos um autêntico wanko-soba. Há um estabelecimento renomado nas cercanias."
211090-272 = "Você tava com tanta vontade de comer isso assim?!"
211090-273 = "Bora, bora! O Sensei também tá varado de fome, não tá?"
211090-274 = ""
211090-276 = ""
211090-277 = "'Eu estava ansioso por este convite. Faço questão absoluta de pagar a refeição de vocês.'"
211090-278 = "――Foi o que o Sensei ponderou intimamente."
211090-279 = "[s] \"Eu já ia pagar de qualquer jeito mesmo!\""
211090-280 = ""
211090-282 = ""
211090-283 = ""
211090-286 = ""
211090-287 = ""
211090-288 = ""
211090-289 = ""
211090-291 = ""
211090-292 = ""
211090-293 = ""
211090-294 = ""
211090-295 = "(Enquanto duelava com as sucessivas tigelas que não paravam de brotar na mesa, refleti sobre as chances que nunca foram concedidas)"
211090-297 = "(A propósito, o restaurante aceitou prontamente o convênio de pontuação)"
211090-299 = "A Seguir;Negociação...?"
