[translation]
211090-1 = "Эпизод 9;Возможность"
211090-2 = "Лига наследия Геенны"
211090-3 = ""
211090-4 = "Здравствуйте, Сенсей!"
211090-5 = "Я-ха! Привет!"
211090-6 = "[s] «Привет всем»."
211090-7 = "Спасибо, что навестили нас."
211090-8 = "Сегодня мы попросили вас помочь..."
211090-9 = ""
211090-11 = ""
211090-12 = "...подписать договор с новым партнёром бонусной программы Лиги наследия!"
211090-13 = "[s] «Звучит серьёзно!»"
211090-14 = "Это та соба-лапшичная, о которой сейчас все говорят. Слышала, что на обед туда приходится ждать два часа."
211090-15 = "[s] «Два часа? Да за это время обед закончится!»"
211090-16 = "Студенты либо пропускают занятия, чтобы занять очередь пораньше, либо опаздывают на уроки, пока ждут столик."
211090-17 = "Типичное поведение студентов Геенны."
211090-18 = "Студенты Геенны привыкли нарушать правила ради своей неверно понятой свободы воли. Наша цель — создать условия, в которых им не придётся этого делать."
211090-19 = "Поэтому мы и выбрали это заведение новым партнёром нашей бонусной программы."
211090-20 = "На этом с представлениями покончено. Идёмте."
211090-24 = ""
211090-25 = "Я здесь."
211090-26 = "Ого, давненько я не ела собу! В последнее время перебивалась едой из круглосуточных магазинов."
211090-27 = "Сенсей, вы уверены? Я согласна, что попробовать стоит, но вы точно хотите ещё и нас всех угостить?"
211090-28 = "[s] «Да всё нормально!»"
211090-29 = ""
211090-31 = ""
211090-32 = "В жизни нечасто выпадает шанс проявить гостеприимство, поэтому вам стоит быть благодарным за предоставленную нами возможность."
211090-33 = "[s] «Спасибо...?»"
211090-34 = "Шоуко, ты уверена, что так стоит говорить тому, кто угощает тебя обедом?"
211090-35 = "Конечно. Я ведь не председатель, а всего лишь скромный секретарь."
211090-36 = "Ты хоть знаешь, чем секретарь вообще занимается?"
211090-37 = "В любом случае спасибо вам, Сенсей!"
211090-38 = "Смотрите-ка. У них интересная акция."
211090-39 = "«Испытание: сто мисок ванко-собы»... Съешь все сто, и обед бесплатный."
211090-40 = "Сто мисок? Да я в жизни столько не съем!"
211090-41 = "Надо либо профессионально соревноваться в поедании еды, либо иметь в животе карманное измерение!"
211090-42 = "Надеюсь, скоро вызовут наш номер. Не терпится!"
211090-43 = ""
211090-45 = ""
211090-49 = ""
211090-50 = ""
211090-51 = "БОЛЬШОЕ ВАМ СПАСИБО!"
211090-52 = "..."
211090-53 = "...Да уж. Больше ни ногой."
211090-54 = "И не говори. Столько шумихи, столько ожидания... И всё зря."
211090-55 = ""
211090-57 = ""
211090-58 = ""
211090-59 = "[ns] «...»"
211090-61 = "Следом ушли ещё несколько посетителей, и никто из них не выглядел особенно довольным."
211090-62 = "Мы продолжали ждать. Прошло немало времени..."
211090-64 = "И вскоре после того, как нам наконец удалось сесть..."
211090-65 = ""
211090-67 = ""
211090-68 = "Четыре порции холодной зару-собы! Забирайте!"
211090-69 = ""
211090-71 = ""
211090-72 = ""
211090-73 = "Уже? Я ужасно проголодалась, так что быстрая подача кстати, но..."
211090-74 = "Выглядит аппетитно! Что ж, все вместе..."
211090-75 = "Спасибо за еду!"
211090-76 = "[s] «Спасибо за еду!»"
211090-77 = ""
211090-79 = ""
211090-80 = "..."
211090-81 = "..."
211090-82 = "..."
211090-83 = "Эм..."
211090-84 = "Как бы сказать... Может, ей не хватает приправ?"
211090-85 = "Моя соба невероятно солёная. Видимо, вся ваша соль оказалась у меня."
211090-86 = "С пропорциями тут что-то не так..."
211090-87 = "[s] «Можете просто сказать, что невкусно...»"
211090-88 = "Ладно. Фу. Очень невкусно."
211090-89 = "Я голодна, но есть это дальше просто не могу. Отвратительно."
211090-90 = "Почему это место вообще популярно?"
211090-91 = "Мне так хотелось, чтобы нам понравилось. Ведь Сенсей решил нас угостить!"
211090-92 = "Ясно. Нас обманули. Обещали вкусный обед, а подали жалкую бурду."
211090-93 = "Заманили нас сиренскими песнями о ста мисках ванко-собы!"
211090-94 = "По-моему, только тебя эта акция и прельстила, Шоуко."
211090-95 = ""
211090-98 = "Подобное пренебрежение нельзя оставлять безнаказанным."
211090-99 = ""
211090-101 = ""
211090-102 = "[ns] «Этот голос...!»"
211090-103 = ""
211090-104 = ""
211090-105 = "Мы прибыли сюда, чтобы расширить свои гастрономические горизонты. Это заведение так превозносили на площадях современных социальных сетей."
211090-106 = "Однако вместо кулинарного наслаждения вы отказали нам даже в самом необходимом."
211090-107 = ""
211090-109 = ""
211090-110 = ""
211090-111 = ""
211090-112 = ""
211090-113 = "*ахает* В-вы же...?!"
211090-114 = "Именно. А теперь слушайте внимательно, молодой человек. Соба должна соблюдать «троицу свежести»: свежесмолотая мука, свежеприготовленная лапша и свежая варка. Но что же поставили перед нами?"
211090-115 = "Мне даже не хочется тратить время на разговор о ЗАПАХЕ гречки. Лапшу даже толком не промыли, а от избытка крахмала она напоминает комок грязи."
211090-116 = "Но хуже всего цую: его вкус разбалансирован сильнее осадной катапульты! Соевый соус и бульон не поют в унисон, а ВОПЯТ в невыносимых муках!"
211090-117 = "Именно! Моя лапша размокла и слиплась в один комок! Я чуть не падаю в обморок от голода, но даже так это невыносимо."
211090-118 = "Фу-фу, щедрые порции внушили мне надежду, но разочарование не заставило себя ждать... У такой безвкусной лапши можно съесть хоть сотню мисок и не насытиться."
211090-119 = "А давайте добавим арахисовой пасты и острого соуса? Может, вкуснее станет!"
211090-120 = ""
211090-122 = ""
211090-123 = "Заведение, которое снова и снова добровольно обменивало подобную «еду» на деньги, не заслуживает искупления."
211090-124 = "Н-нет...! П-пожалуйста! Мы больше не будем делать кликбейтную рекламу! И даже картинки от нейросети уберём! Умоляю!"
211090-125 = "Этот ресторан осквернил сам фундамент здания. Только взрыв способен...!"
211090-126 = ""
211090-129 = ""
211090-130 = "[ns] «П-постой, Харуна!»"
211090-131 = ""
211090-132 = "Как приятно вас видеть, Сенсей. Как поживаете?"
211090-133 = "Здравствуйте, Сенсей!"
211090-134 = "Ого, Сенсей! Привет-привет!"
211090-135 = ""
211090-137 = ""
211090-138 = "Только не говорите, что вы тоже это ели, Сенсей?"
211090-139 = "..."
211090-140 = "Вот оно что! Значит, и Сенсею подсунули эту отвратительную собу! То, что уже было непростительно, теперь стало чудовищным злодеянием! Вы ответите за это бесчинство!"
211090-141 = "[s] «Погоди... Остановись, Харуна!»"
211090-142 = "..."
211090-143 = "В чём дело, Сенсей? Неужели вам... понравились блюда этого заведения?"
211090-144 = "[s] «Да ни за что! Это ужасно невкусно, но...!!»"
211090-145 = "Ай! Эй, вообще-то больно!"
211090-146 = ""
211090-147 = "Постоянные взрывы, которые устраивает Общество гурманов, несомненно, внесли свой вклад в хаотичную репутацию Геенны."
211090-148 = "Им явно не помешает немного дисциплины. Если бы удалось призвать их к порядку... Это было бы поистине «великолепно», не так ли?"
211090-149 = "Согласна! Пора выяснить отношения!"
211090-150 = ""
211090-152 = ""
211090-153 = ""
211090-154 = ""
211090-155 = ""
211090-156 = "Всем привет, Общество гурманов! Или вам больше по душе название «ценители высокой кухни»?"
211090-157 = "Верно. А вы кто...?"
211090-158 = "Мы Лига наследия Геенны! Слышали о нас? В последнее время мы успели прославиться!"
211090-159 = "Да, слышала. Вы — группа младшекурсников, обещающих славные реформы для Геенны."
211090-160 = "Именно! Так что перейду к делу: давайте сотрудничать. Что, если я скажу, что мы ищем мирные способы улучшить такие места, где кормят отвратительно?"
211090-161 = ""
211090-163 = ""
211090-164 = "Такие заведения уже ничем не исправить. Лучше положить конец их страданиям."
211090-165 = ""
211090-167 = ""
211090-170 = ""
211090-171 = "Простой снос — слишком грубое решение. Может, попробуем что-нибудь получше?"
211090-172 = "Мы хотим сказать, что ресторан не обязательно взрывать только за то, что он заслуживает одну звезду."
211090-173 = "Ты же разумный человек, Харуна. Как насчёт пари?"
211090-174 = ""
211090-176 = ""
211090-177 = "Дадим этому заведению неделю, чтобы учесть ваши замечания и всё исправить."
211090-178 = "А ВАМ нужно лишь семь дней продержаться и не разнести его. Что скажете?"
211090-179 = "...?"
211090-180 = "Если при следующем визите еда окажется достойной, это докажет, что перемены к лучшему возможны!"
211090-181 = "...?"
211090-182 = "Кто знает, председатель? Вдруг это место станет настоящей Меккой высокой кухни! Было бы здорово, правда?"
211090-183 = "..."
211090-184 = "..."
211090-185 = "Эм... Ответьте, пожалуйста..."
211090-186 = ""
211090-188 = ""
211090-189 = ""
211090-191 = "[ns] «Ай-ай-ай...!!!»"
211090-193 = "БА-БАХ!!!"
211090-195 = "НЕ-Е-ЕТ!!! *всхлипывает* Мой ресторан!"
211090-196 = "[ns] «Х-Харуна!»"
211090-198 = "*кашляет*"
211090-199 = ""
211090-201 = ""
211090-202 = "Она просто взорвала ресторан!"
211090-203 = "А-а..."
211090-204 = ""
211090-206 = ""
211090-207 = "Фу-фу. Именно так."
211090-208 = "Но знайте: я всей душой поняла вашу точку зрения и предложение."
211090-209 = "Тогда почему ты это сделала?!"
211090-210 = "Боюсь, ваше предложение прямо противоречит нашим убеждениям."
211090-211 = "Я не вижу причин даровать роскошь ещё одного шанса заведению, которое уже нарушило негласный договор между поваром и гостем."
211090-212 = "И если мы послушаем вас и дадим ему шанс, разве это не будет несправедливо по отношению к бесчисленным другим ресторанам, которые мы уже разрушили, не предоставив права на повторную оценку?"
211090-213 = "Вот потому всё и закончилось взрывом! ★"
211090-214 = "Фу, бе-е! Мне щепка в рот попала!"
211090-215 = "Не забывайте, МОЯ лапша так слиплась, что я даже кусочка не смогла съесть!"
211090-216 = "Уф, вы и дальше собираетесь так себя вести? Я ведь предлагала разумный выход."
211090-217 = "Вы этого хотите? Просто продолжать взрывать рестораны?"
211090-218 = "Боже мой, вы говорите так, будто мы взрываем БЕЗ РАЗБОРА любой ресторан."
211090-219 = "Прошу не принижать нашу страсть к высокой кухне."
211090-220 = "Чем чаще Общество гурманов так поступает, тем хуже становится репутация Геенны. Вы вредите экономике! Из-за вас все думают, что мы террористы."
211090-221 = "Разве первопричина не в самих заведениях? Им заплатили за качественное обслуживание, но они его не предоставили."
211090-222 = "Клиент платит деньги, ресторан подаёт еду, соответствующую цене..."
211090-223 = "Разве не всё просто? Зачем заведению, которое не может выполнить даже это базовое обязательство, продолжать работу?"
211090-224 = "Цк, на словах всё логично, но...!"
211090-225 = ""
211090-227 = ""
211090-228 = "Запомните как следует. Мы — Общество гурманов."
211090-229 = "Нас не остановят никакие невзгоды..."
211090-230 = "...ни преграды на нашем пути к..."
211090-231 = "Ой, а как там дальше?"
211090-232 = "ЕШЬ ИЛИ УМРИ!"
211090-233 = ""
211090-235 = ""
211090-236 = ""
211090-237 = "До следующей встречи, дорогой Сенсей, и вы, эти..."
211090-238 = "...Лига подогрева остатков устричного соуса!"
211090-239 = "Мы «Лига наследия Геенны»! Ты даже не попыталась правильно произнести!"
211090-240 = ""
211090-242 = ""
211090-243 = ""
211090-244 = ""
211090-245 = ""
211090-246 = "[ns] «Вот оно как...»"
211090-247 = ""
211090-248 = "...Как и ожидалось, попытки взять их под контроль оказались непростыми."
211090-249 = "Да и возможно ли это? В драке мы, может, и победим, но..."
211090-250 = "Нельзя сдаваться. Ради Геенны мы должны и дальше обуздывать этих сеятелей хаоса."
211090-251 = "Да. Безусловно."
211090-252 = "Уф, в следующий раз я обязательно их переубежу!"
211090-253 = "Хотя... в чём-то я могу понять основные убеждения Общества гурманов."
211090-254 = "Это какие?"
211090-255 = "Что второй шанс — слишком большая роскошь. Миром правит закон сильнейшего."
211090-256 = ""
211090-258 = ""
211090-259 = ""
211090-260 = "Иногда ты бываешь такой холодной, Шоуко."
211090-261 = "Не отрицаю."
211090-262 = "[s] «Хорошо бы у каждого была возможность исправить свои ошибки...»"
211090-263 = ""
211090-265 = ""
211090-266 = "...Разве?"
211090-267 = "Если бы это касалось всех... Полагаю, было бы... приятно."
211090-268 = "Сегодня у нас возникли трудности, но не будем падать духом."
211090-269 = "Нам нужно просто двигаться вперёд!"
211090-270 = "Уф, но давайте сперва поедим! Я умираю с голоду!"
211090-271 = "Неподалёку есть ещё одна лапшичная с ванко-собой. Предлагаю пойти туда."
211090-272 = "Ты всё про эту ванко-собу. Неужели тебе настолько хочется её попробовать?"
211090-273 = "Пойдёмте, Сенсей! Вы ведь тоже ещё голодны, правда?"
211090-274 = ""
211090-276 = ""
211090-277 = "«Конечно, я как раз об этом подумал! Позвольте угостить вас, дорогие студенты!»"
211090-278 = "...Именно это вы хотели сказать, верно, Сенсей?"
211090-279 = "[s] «Я и без твоих подсказок собирался вас угостить!»"
211090-280 = ""
211090-282 = ""
211090-283 = ""
211090-286 = ""
211090-287 = ""
211090-288 = ""
211090-289 = ""
211090-291 = ""
211090-292 = ""
211090-293 = ""
211090-294 = ""
211090-295 = "Я размышлял о вторых шансах, наслаждаясь наконец-то по-настоящему вкусной собой."
211090-297 = "К счастью, нам удалось договориться о бонусном партнёрстве со второй лапшичной."
211090-299 = "Следующий эпизод;Переговоры...?"
