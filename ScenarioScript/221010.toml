[translation]
221010-1 = "Episode 1;S.O.S."
221010-2 = "(Due to work, I booked a ticket for a contact ship leaving from the D.U. port.)"
221010-3 = "(Since it was my first time, I asked Arona to guide me so I would not be late, but...)"
221010-6 = "(--when I arrived at the pier, the boarding reception had already closed.)"
221010-7 = "[ns] \"Arona...\""
221010-9 = "Th-This time is not a mistake!"
221010-10 = "According to Super Arona's calculations, we should have arrived with plenty of time to spare...#nIn fact, it is still before the departure time!"
221010-11 = "Affirmative. Indeed, Senpai's calculations were correct."
221010-12 = "However, since ships take time to prepare for departure, they sometimes raise the anchor 15 minutes before departure and pull up the gangway, making boarding impossible."
221010-13 = "Therefore, we should have allowed for more margin."
221010-14 = "First of all! The ship that left ahead of the promised time is at fault!"
221010-15 = "Arona's calculations were perfect...!"
221010-19 = "Uu... I am sorry."
221010-20 = "If I had checked properly, we would not have missed it..."
221010-22 = "[ns1] \"It is fine. Don't worry about it.\"\n[ns2] \"I didn't keep track of it either, after all.\""
221010-26 = "[ns] \"Since we have some time... want to go treasure hunting?\""
221010-27 = "Treasure hunting...?"
221010-28 = "Perplexity. I have never heard any information about treasure being buried around here."
221010-30 = "[ns3] \"Pretty shells, round pebbles. things like that.\"\n[ns4] \"Those are wonderful treasures too.\""
221010-34 = "[ns] \"I will treat the discoverer of the treasure to strawberry milk.\""
221010-36 = "Yay!"
221010-41 = "Sensei! Over there!"
221010-42 = "Under that rock! There is a pretty shell!"
221010-43 = "This is a type of snail shell."
221010-44 = "It is a common shell on the beach, and its color and pattern change depending on the environment."
221010-45 = "It should not turn into a deep coral color in this vicinity, though...#nIt was probably carried over from another place."
221010-47 = "[ns5] \"It is a very pretty color.\"\n[ns6] \"Good find, Arona!\""
221010-50 = "Fufun, with Super Arona's eyes, this is a piece of cake!"
221010-51 = "Isn't there a message in a bottle or something lying around somewhere~#nIf we are lucky, it might contain a map showing the location of buried treasure!"
221010-52 = "...Negative. This beach is regularly cleaned by the Port Authority.#nThere is a high possibility that flotsam like a message in a bottle has already been cleared away."
221010-53 = "In addition, message in a bottle items in perfect condition have a low recovery rate and are not found so easily."
221010-54 = "Even if there was a bottle, it is probably just trash thrown away by tourists."
221010-55 = "Geez, why is Plana-chan so negative?#nYou lack romance!"
221010-56 = "A message in a bottle that has washed ashore is supposed to contain a letter packed tightly with dreams!"
221010-57 = "Like a rescue request from a princess trapped on a deserted island, or a letter addressed to the future~"
221010-61 = "...Huh?"
221010-62 = "Sensei! Please look, over there!#nA small ball has washed ashore!"
221010-63 = "It looks like it was made by braiding rope, though..."
221010-64 = "[ns] \"Let's see...?\""
221010-68 = "What is being used is high-strength polyester rope.#nI do not find any notable points in the structure."
221010-69 = "...Attention. Something is written on the other side."
221010-70 = "S, O, S...?"
221010-71 = "Could this be..."
221010-72 = "It is a distress signal!"
221010-73 = "Someone must have thrown this orb asking for help!#nQuickly, a rescue ship--"
221010-74 = "[s7] \"Arona, calm down.\"\n[s8] \"I understand how you feel, but let's check a bit more.\""
221010-77 = "Uutt... You are right..."
221010-78 = "Other than 'S.O.S.', there is nothing else on this orb..."
221010-79 = "With this, we do not know who is asking for help."
221010-83 = "Found on the coast of D.U.... If this drifted from the open ocean..."
221010-84 = "[s] \"Do you have any idea?\""
221010-85 = "I am not certain yet."
221010-87 = "...Perhaps she might know.#nThough I am reluctant."
221010-90 = "This is--"
221010-91 = "It was made at Odyssea Marine High School."
221010-92 = "[s9] \"Instant reply?\"\n[s10] \"You can tell just by looking?\""
221010-95 = "No way. Even me, I am not all-knowing and all-powerful."
221010-96 = "However, I can make guesses from the material and traces."
221010-97 = "The rope used is a polyester material resistant to sunlight and humidity."
221010-98 = "It is mainly used when pulling heavy objects at construction sites or piers."
221010-99 = "And this blue braided rope is a custom-made product supplied exclusively to Odyssea.#nIt would be difficult to obtain at other workplaces."
221010-100 = "Also, this ball is made with a monkey fist knot.#nSince this is a tying method favored by sailors."
221010-101 = "[s] \"Then, is this distress signal from Odyssea?\""
221010-102 = "I cannot state for certain that it is a distress signal, but#nit is highly likely that it drifted from Odyssea."
221010-103 = "If you would like, shall I investigate this in detail?"
221010-104 = "[s] \"Could you please?\""
221010-108 = "[ns11] \"Come to think of it, where is Odyssea?\"\n[ns12] \"I hear rumors, but I haven't been there yet.\""
221010-111 = "...Since they are currently out in the open ocean, visiting might be difficult."
221010-112 = "Odyssea's main fleet is currently sailing in waters 1,500 nautical miles--#nmeaning about 2,700 km away from D.U."
221010-113 = "Even if we ran a fast ship without resting, I think it would take more than two days to arrive."
221010-114 = "[s13] \"They are that far away!?\"\n[s14] \"Always that far away?\""
221010-117 = "No, basically they stay in the coastal waters of D.U.,#ninteracting with other academies and assisting with port operations, but--"
221010-118 = "Just a few months before Sensei arrived in Kivotos, Odyssea went out on a voyage to the open ocean."
221010-119 = "[s] \"Do they often do voyages like this?\""
221010-120 = "Let's see, at a pace of about once every two years, I suppose."
221010-121 = "It is a regular event to go out to the open ocean to hone navigation skills and strengthen the bonds among students."
221010-122 = "It is a tradition that has continued before modern warships were developed,#nand it can be said to be a rite of passage for Odyssea students."
221010-123 = "That being said, some students seem to dislike it, saying it feels like being sent to a correctional facility.#nDuring the voyage, resupply from land is impossible, and contact cannot be made with other academies."
221010-124 = "[s15] \"That is troublesome...\n[s16] \"Does that mean there is no way to know Odyssea's current situation?\""
221010-127 = "It is not entirely impossible."
221010-128 = "It is only normal lines that cannot get through. The General Student Council has a means of communication."
221010-132 = "Head of the Mediation Office. Could you please send a telegram to 'Island' right now?"
221010-133 = "I would like the contents to be as follows."
221010-135 = "All fleets of Odyssea, return to D.U. immediately--"
221010-137 = "Next Episode;Return of the Olympus"
