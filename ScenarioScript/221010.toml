#[!][Build: "1"]
#[!][Data: "20/09"]
[translation]
221010-1 = "Episódio 01;S.O.S."
221010-2 = "（A trabalho, reservei passagens para a balsa que parte do porto de D.U.）"
221010-3 = "（Como era minha primeira vez, pedi para a Arona me guiar para não me atrasar, mas...）"
221010-6 = "（――Quando chegamos ao cais, o embarque já havia sido encerrado.）"
221010-7 = "[ns] \"Arona......\""
221010-8 = ""
221010-9 = "D-Desta vez eu não errei nada, juro!"
221010-10 = "Pelos cálculos da Super Arona, a gente devia ter chegado com bastante folga...#nAliás, nem deu o horário oficial da partida ainda!"
221010-11 = "Confirmação. De fato, o [ruby=・]cálculo[/ruby] da veterana estava correto."
221010-12 = "Contudo, embarcações exigem procedimentos demorados de pré-partida. As âncoras são recolhidas 15 minutos antes da saída,#ne as passarelas de embarque são içadas, impedindo o acesso."
221010-13 = "Portanto, deveríamos ter previsto uma margem de segurança maior."
221010-14 = "Pra começo de conversa! A culpa é do navio que resolveu vazar antes do horário combinado!"
221010-15 = "Os cálculos da Arona foram perfeitos, poxa vida...!"
221010-16 = ""
221010-18 = ""
221010-19 = "Uuu... me desculpa, Sensei."
221010-20 = "Se eu tivesse checado direito as regrinhas, você não teria perdido a balsa, né...?"
221010-21 = ""
221010-22 = "[ns1] \"Relaxa, não precisa se culpar.\"\n[ns2] \"Eu também devia ter conferido isso antes.\""
221010-26 = "[ns] \"Já que sobrou um tempinho... que tal uma caça ao tesouro?\""
221010-27 = "Caça ao... tesouro?"
221010-28 = "Dúvida. Não constam registros de bens de valor enterrados nas imediações."
221010-29 = ""
221010-30 = "[ns3] \"Umas conchinhas bonitas, pedrinhas redondas...\"\n[ns4] \"Coisas assim também são verdadeiros tesouros.\""
221010-34 = "[ns] \"Quem achar a coisa mais legal ganha um leite de morango por minha conta!\""
221010-35 = ""
221010-36 = "Ebaaa!"
221010-40 = ""
221010-41 = "Sensei! É por ali, ó!"
221010-42 = "Embaixo daquela pedra! Tem uma concha linda brilhando ali!"
221010-43 = "Trata-se de um exemplar da família dos caracóis-marinhos."
221010-44 = "Bastante comuns em praias arenosas. Sua coloração e padrões se adaptam conforme o ambiente marítimo."
221010-45 = "No entanto, nesta região não costumam atingir um tom de coral tão vibrante...#nCom certeza foi trazida pela maré de alguma outra parte."
221010-46 = ""
221010-47 = "[ns5] \"A cor é bonita demais mesmo.\"\n[ns6] \"Mandou muito bem, Arona!\""
221010-50 = "Hehehe, pros olhos de águia da Super Arona, isso aqui é fichinha!"
221010-51 = "Será que a gente não acha uma mensagem na garrafa por aí?#nCom sorte, vai ter um mapa apontando prum tesouro pirata enterrado!"
221010-52 = "......Negação. Esta orla passa por limpeza regular da Autoridade Portuária.#nDetritos à deriva, como garrafas de vidro, costumam ser recolhidos e descartados com frequência."
221010-53 = "Além disso, a taxa de preservação de garrafas intactas em correntezas é ínfima. A probabilidade de encontrar uma é quase nula."
221010-54 = "Mesmo se avistarmos uma, com certeza será mero lixo abandonado por banhistas."
221010-55 = "Ai, Plana-chan, por que você tem que ser tão estraga-prazeres?!#nCadê o espírito romântico da coisa?!"
221010-56 = "Garrafas trazidas pelo mar são cheias de sonhos, esperanças e recados misteriosos!"
221010-57 = "Pode ser um pedido de socorro de uma princesa numa ilha deserta, ou uma cartinha enviada pro futuro...!"
221010-58 = ""
221010-60 = ""
221010-61 = "......Ué?"
221010-62 = "Sensei! Olha lá, rápido!#nTem uma bolinha boiando e vindo na nossa direção!"
221010-63 = "Parece feita de corda trançada, ou coisa parecida..."
221010-64 = "[ns] \"Deixa eu dar uma olhada......\""
221010-65 = ""
221010-66 = ""
221010-67 = ""
221010-68 = "O material utilizado é cabo de poliéster de alta resistência.#nA estrutura do trançado não apresenta anomalias notáveis."
221010-69 = "......Atenção. Há uma inscrição gravada no lado oposto."
221010-70 = "S, O, S......?"
221010-71 = "Não me diga que......"
221010-72 = "É um sinal de socorro!"
221010-73 = "Alguém jogou essa bola no mar pedindo socorro desesperado!#nSensei, precisamos mandar um navio de resgate agora me――"
221010-74 = "[s7] \"Calma, Arona, respira fundo.\"\n[s8] \"Entendo sua aflição, mas vamos analisar melhor antes.\""
221010-77 = "Uuu... é verdade... tem razão..."
221010-78 = "Além desse 'S.O.S.', não tem mais nada escrito..."
221010-79 = "Assim a gente nem tem como saber quem é que tá em apuros."
221010-80 = ""
221010-82 = ""
221010-83 = "Foi parar na costa de D.U....... Se isso veio boiando lá de alto-mar......"
221010-84 = "[s] \"Tem algum palpite de onde veio?\""
221010-85 = "Ainda não tenho plena certeza."
221010-87 = "......Talvez [ruby=・]ela[/ruby] saiba de algo.#nEmbora não me agrade muito ter que recorrer a isso."
221010-89 = ""
221010-90 = "Isto aqui é――"
221010-91 = "Uma peça manufaturada no Colégio Marítimo Odisseia."
221010-92 = "[s9] \"Assim de primeira?\"\n[s10] \"Bateu o olho e já matou a charada?\""
221010-95 = "Imagina. Por mais capacitada que eu seja, não sou onisciente."
221010-96 = "No entanto, é perfeitamente viável deduzir pela matéria-prima e pelos vestígios de confecção."
221010-97 = "O cabo empregado é de poliéster náutico, especialmente resistente à umidade e à radiação solar."
221010-98 = "Geralmente utilizado em canteiros navais e atracadouros para manobras de tração pesada."
221010-99 = "Além disso, esta padronagem [ruby=trançada]trançada em azul[/ruby] é exclusividade absoluta encomendada pela Odisseia.#nSeria praticamente impossível encontrá-la em outras oficinas de Kivotos."
221010-100 = "E esta esfera foi tecida no nó punho-de-macaco.#nUm clássico favorito entre os marinheiros."
221010-101 = "[s] \"Então esse pedido de socorro veio mesmo da Odisseia?\""
221010-102 = "Ainda não posso atestar com certeza se é um pedido de socorro genuíno,#nmas a probabilidade de ter se originado na Odisseia é altíssima."
221010-103 = "Se desejar, gostaria que eu fizesse um levantamento mais aprofundado a respeito?"
221010-104 = "[s] \"Por favor, agradeço muito.\""
221010-105 = ""
221010-108 = "[ns11] \"Falando nisso, onde é que fica a Odisseia exatamente?\"\n[ns12] \"Ouço falar por aí, mas nunca cheguei a visitar.\""
221010-111 = "......Como estão navegando em mar aberto, uma visita presencial no momento seria inviável."
221010-112 = "A frota principal da Odisseia encontra-se atualmente a cerca de 1.500 milhas náuticas de D.U.――#nou seja, aproximadamente 2.700 quilômetros de distância."
221010-113 = "Mesmo despachando uma lancha rápida a toda velocidade sem parar, levaria mais de dois dias de navegação."
221010-114 = "[s13] \"Tudo isso de distância?\"\n[s14] \"Elas vivem longe assim sempre?\""
221010-117 = "Não, geralmente permanecem ancoradas perto da costa de D.U.,#nauxiliando na logística portuária e interagindo com outras academias――"
221010-118 = "Mas, justamente alguns meses antes da chegada do Sensei a Kivotos, a Odisseia zarpou para alto-mar."
221010-119 = "[s] \"Essas expedições longas são comuns por lá?\""
221010-120 = "Sim, costumam realizá-las em um ritmo bienal, a cada dois anos."
221010-121 = "É um evento tradicional para aprimorar técnicas de navegação oceânica e fortalecer o espírito de união entre a tripulação."
221010-122 = "Uma tradição que remonta aos tempos anteriores aos navios de guerra modernos,#nquase um rito de passagem sagrado para as alunas da Odisseia."
221010-123 = "Embora algumas alunas reclamem dizendo que parece quase uma sentença de prisão.#nAfinal, durante a viagem, não há reabastecimento em terra nem comunicação direta com as outras escolas."
221010-124 = "[s15] \"Aí fica complicado......\"\n[s16] \"Quer dizer que não tem como saber o que tá rolando por lá?\""
221010-127 = "Não diria que é completamente impossível."
221010-128 = "O isolamento se aplica às linhas civis convencionais. O Conselho Estudantil Federal possui seus próprios canais de comunicação com elas."
221010-129 = ""
221010-131 = ""
221010-132 = "Chefe da Mediação. Poderia telegrafar imediatamente para o conselho 'Island'?"
221010-133 = "Com as seguintes instruções, por gentileza:"
221010-135 = "Toda a frota do Colégio Marítimo Odisseia deve retornar imediatamente ao porto de D.U.――"
221010-137 = "Próximo Episódio;O Retorno do Olympos"
