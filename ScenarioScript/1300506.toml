[translation]
1300506-1 = "Переулок в дождливый день"
1300506-2 = "Вход в Шале"
1300506-4 = "Когда я уходил с работы, внезапно хлынул сильный дождь."
1300506-5 = "[s] «Ещё пару минут назад было солнечно...»"
1300506-8 = ""
1300506-9 = ""
1300506-10 = ""
1300506-11 = "Сенсей? Что-то случилось?"
1300506-12 = "Что? Ты забыл зонт?"
1300506-13 = "Я же писала об этом утром в MomoTalk, но ты всё равно забыл..."
1300506-14 = ""
1300506-15 = ""
1300506-16 = "Вот. Твой зонт."
1300506-17 = "Почему у меня запасной?"
1300506-18 = "Потому что я работаю с кучей неуклюжих людей. Такие вещи постоянно пригождаются."
1300506-19 = "Клянусь, меня окружают одни растяпы..."
1300506-20 = "Куда я иду?"
1300506-21 = "Ну... есть кое-кто ещё, кому нужна моя помощь в такие дождливые дни."
1300506-22 = "Ничего важного. Не переживай."
1300506-23 = "[s1] Может, Кайоко влюблена в кого-то другого?\n[s2] Сказать, что пойдёшь следом из любопытства."
1300506-24 = "Что...? Хочешь пойти со мной?"
1300506-25 = "Что...? Хочешь пойти со мной?"
1300506-26 = "Ну, не то чтобы я была против."
1300506-27 = "Только не вини меня, если решишь, что зря потратил время..."
1300506-28 = "Особенно под таким дождём. Везде будет грязь."
1300506-29 = "*вздох* Ты правда не отстанешь, да?"
1300506-30 = "Ладно. Делай что хочешь."
1300506-31 = ""
1300506-32 = ""
1300506-33 = ""
1300506-34 = "[ns] Пойти за Кайоко."
1300506-39 = "[ns3] «Это домик для кошки?»\n[ns4] «Так кому нужна твоя помощь...?»"
1300506-42 = "― Тебе правда не нужно было идти за мной так далеко, Сенсей.[wa:10]"
1300506-45 = "― Похоже, её нет...[wa:1480]"
1300506-48 = "[ns5] «Наверное, сейчас её нет.»\n[ns6] «Подождём?»"
1300506-51 = "― Я пришла сюда только из-за дождя.[wa:4100]"
1300506-53 = "― Всё будет хорошо. Кошки умеют заботиться о себе.[wa:1820]"
1300506-56 = "― Не быть ни к кому привязанной, не позволять другим причинить боль... иногда это хорошо...[wa:1300]"
1300506-59 = "― Но всё же, когда совсем не на кого положиться, бывает немного одиноко...[wa:10]"
1300506-62 = "[ns7] «...»\n[ns8] «Ты добрый человек, Кайоко.»"
1300506-65 = "― Просто часть меня не может оставить её одну. Вот и всё.[wa:7120]"
1300506-67 = "― Только это и ничего больше. Понял, Сенсей?[wa:3580]"
1300506-70 = ""
1300506-71 = "...Дождь закончился."
1300506-72 = "Уже возвращаешь зонт?"
1300506-73 = "Не забывай, внезапные ливни бывают в любой момент. Пока оставь его у себя."
1300506-74 = "К тому же мы достаточно часто видимся. Вернёшь потом."
1300506-75 = "Знаю, раньше я возражала против такого... но быть кому-то должной не самое худшее в мире."
1300506-76 = "Увидимся завтра, Сенсей."
