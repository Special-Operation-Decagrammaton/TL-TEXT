[translation]
10044020-1 = "Эпизод 2;В поисках пропавшего поезда"
10044020-2 = "Ты говоришь, система автоматического отправления сама отправила поезд?"
10044020-3 = "Д-Да... В каждом поезде есть переключатель ручного управления в кабине машиниста, но..."
10044020-4 = "...похоже, в тот момент все были здесь, в служебном помещении станции..."
10044020-5 = ""
10044020-7 = ""
10044020-8 = ""
10044020-9 = "Что? Почему вы так на меня смотрите?"
10044020-10 = "Если бы только кто-то был в той кабине и делал свою работу..."
10044020-11 = "Заткнись! В любом случае он ушёл на другую станцию, так что нам просто нужно его найти."
10044020-13 = "Жутко бесит."
10044020-14 = "Д-Давайте посмотрим, по каким линиям можно его догнать..."
10044020-15 = "Думаю, сейчас быстрее всего будет на метро."
10044020-16 = "*вздох* Ладно, пошли. Надо разобраться быстро, если хотим доставить груз вовремя."
10044020-17 = "Бу. Метро отстой."
10044020-19 = ""
10044020-20 = "...Вот такие у нас дела."
10044020-21 = "[ns1] «Понятно.»\n[ns2] «Спасибо, что позвонили мне.»"
10044020-24 = "П-Погодите...! Вы позвонили Сенсею из Шале?!"
10044020-25 = "З-Зачем вы их сюда втягиваете? Что вообще происходит??"
10044020-27 = "Нозоми не звонить. Хикари звонить."
10044020-28 = "Т-Так почему?!"
10044020-29 = "Потому что... Сенсей сказал позвонить, если нам когда-нибудь понадобится помощь."
10044020-30 = "Так люди просто говорят из вежливости. Это ничего не значит!!"
10044020-31 = ""
10044020-34 = ""
10044020-35 = "И-Ик... Они хотят поговорить со МНОЙ...? А...!"
10044020-36 = "П-Привет, я Уцуми Аоба. ...Второй курс факультета грузовой логистики."
10044020-37 = "[s] «Привет, Аоба. Приятно познакомиться.»"
10044020-38 = "М-Мне тоже... приятно познакомиться?"
10044020-40 = "А? Ты второкурсница?"
10044020-41 = "Д-Да... А вы, офицеры, первокурсницы, верно?"
10044020-42 = "Эх, это всё просто цифры."
10044020-43 = "Я-я не пыталась давить на вас старшинством..."
10044020-44 = "Я вообще не ожидала какого-то особого отношения..."
10044020-45 = ""
10044020-49 = "А, нашла! Пошли!"
10044020-50 = "Лады!"
10044020-51 = ""
10044020-53 = ""
10044020-55 = "Серьёзно, КАК я вообще оказалась в компании этих людей...?"
10044020-59 = ""
10044020-60 = ""
10044020-61 = ""
10044020-62 = "О-о. Кач-кач."
10044020-63 = "В поезде нас бы ТАК не качало. Хотя вагоны метро меньше, так что, наверное, это нормально..."
10044020-64 = "О-Офицеры... можете, пожалуйста, вести себя немного тише...?"
10044020-65 = "Почему?"
10044020-66 = "Ну... принижать метро, находясь В метро и ЕЩЁ в школьной форме — не лучший образ для школы."
10044020-67 = "Принижать? Я просто говорю как есть."
10044020-68 = "Это правда, но не значит, что это надо говорить вслух."
10044020-69 = "Погоди, ты что... вообще не знакома с таким понятием? Ты знаешь, что значит слово «такт»?"
10044020-70 = "Без понятия. А смысл так себя сдерживать?"
10044020-71 = "...И вас обеих сделали офицерами."
10044020-72 = "Ладно, знаете что... начальство ведь сказало отнестись к этой миссии серьёзно."
10044020-73 = "И-и-и хорошего оправдания для потери поезда у нас нет."
10044020-74 = "Не поймают — не нужно оправдание!"
10044020-75 = "Пахяхя, точно! Ладно, давайте уже разберёмся с этим."
10044020-76 = ""
10044020-78 = ""
10044020-79 = ""
10044020-80 = ""
10044020-81 = "Эй, смотрите туда."
10044020-82 = "Хм? А. Хайлендер."
10044020-83 = "Подняли цены на метро, а теперь ещё пришли тут над нами возвышаться. Сильный ход."
10044020-84 = "Хотя нас это не касается, мы ведь едем бесплатно."
10044020-85 = "Я не знала, что люди из Хайлендер управляют метро."
10044020-86 = "Может быть? Поезда, метро — разница не такая уж большая."
10044020-88 = "Ну, раз уж они здесь, может, преподадим им урок."
10044020-90 = "Ручка... растягивание. Бесконечность... спираль... вращение."
10044020-91 = "Пахяхя, а ручки-то классные! Может, и в поезда такие поставим!"
10044020-92 = ""
10044020-93 = "[ns3] «Хикари, может, хватит.»\n[ns4] «И ты тоже, Нозоми.»"
10044020-96 = "Как скажете, Сенсей."
10044020-97 = "Я слишком шумела? Ладно."
10044020-99 = "Хм. Сенсея они слушают."
10044020-100 = "Сенсей, послушайте, не все наши офицеры такие. Пожалуйста, не судите по ним обо всей академии."
10044020-101 = "[s] «Всё нормально. Я здесь, чтобы помочь и присмотреть за вами троими.»"
10044020-102 = "И всё же стыдно здесь только мне..."
10044020-104 = "Эй, Хайлендер!"
10044020-105 = ""
10044020-108 = ""
10044020-110 = "Как вы посмели поднять цену на метро!"
10044020-111 = "Как таким студентам, как мы, вообще это оплачивать, а?"
10044020-112 = "Но... мы не управляем метро."
10044020-114 = "А, вот как? Узнала что-то новое. Хи-хи!"
10044020-115 = "О нет, так просто вы не отделаетесь."
10044020-116 = "Рельсы есть рельсы. Вы зарабатываете на рельсах, значит, вы ответственны."
10044020-118 = "(Что это вообще за логика...?)"
10044020-119 = "Ага, вы должны нам заплатить... как там это называется? Компенсацию за моральный ущерб! Вот!"
10044020-120 = "Компенсацию за моральный ущерб?"
10044020-121 = "Ты меня слышала! Вы виноваты не меньше остальных!"
10044020-122 = "Думаешь, ты лучше нас, да? Думаешь, мы просто кучка хулиганов, которые не умеют учиться?"
10044020-123 = "Больно. О-о-очень больно. Мне понадобится что-нибудь, чтобы мне стало НАМНОГО лучше."
10044020-125 = "Нозоми, у тебя деньги есть?"
10044020-126 = "Не-а. Сенсей заплатил за наши билеты."
10044020-127 = "Денег нет. Мы супербедные."
10044020-129 = "О, вы серьёзно думаете, что мы в это поверим? А?"
10044020-130 = "Ладно, если вы без денег, расплатитесь боеприпасами!"
10044020-131 = ""
10044020-132 = "[ns] «Все, давайте немного успокоимся...»"
10044020-134 = "Это ещё кто? Взрослый?"
10044020-135 = "О-о, у взрослых есть деньги. Может, залезешь в свой большой толстый кошелёк и пожертвуешь бедным студентам, а?"
10044020-136 = "[s5] «Мой кошелёк, наверное, тоньше, чем вы думаете...»\n[s6] «Для начала давайте все успокоимся.»"
10044020-139 = "Ты предлагаешь нам успокоиться СЕЙЧАС?!"
10044020-140 = "У нас плохие оценки, учиться скучно, кошельки пустые..."
10044020-141 = "Докапываться до случайных людей в метро — единственный способ выразить накопившееся раздражение от всех наших разбитых мечт и разочарований!"
10044020-142 = "Плохие оценки И плохое поведение."
10044020-144 = "Ах ты...! Подраться захотела?"
10044020-145 = "Я-я понимаю, что вы чувствуете..."
10044020-146 = "Что?"
10044020-147 = "Я-я получила 25 процентов по классике... Я знаю, что значит провалиться..."
10044020-149 = "Ладно, значит, ты тоже плохо учишься. И что?"
10044020-150 = "Н-Но... если вы САМИ решили не учиться, потому что не хотели..."
10044020-151 = "Разве вы не должны принять и последствия этого...?"
10044020-152 = "Не хочу!"
10044020-153 = "Нельзя просто расслабиться и быть счастливыми? Почему мир всё время должен быть таким, ну... холодным?"
10044020-154 = ""
10044020-156 = ""
10044020-157 = "П-Почему вы вообще думаете, что мир должен быть к вам добр...?"
10044020-158 = ""
10044020-161 = ""
10044020-162 = "В смысле «почему»? Потому что было бы приятно!"
10044020-164 = "Это... наивно. М-Мир — холодное и жестокое место. Никто не ждёт снаружи, чтобы взять за вас ответственность."
10044020-165 = "Если честно, даже удивительно, что вы всё ещё такие невинные и полные надежд."
10044020-166 = "А-А что, теперь уже и желать чего-то нельзя? Я тоже хочу, чтобы меня любили!"
10044020-167 = "Ф-Фуфу... Такие бессмысленные желания и ожидания лишь готовят почву для новых разочарований. Вам ещё столько предстоит узнать..."
10044020-168 = "Если ничего не ждать, тебя не так легко ранить. И больше никогда не разочаруешься... Фуфуфу..."
10044020-169 = "Вот почему я никогда ничего не жду с нетерпением. Фуфу."
10044020-170 = ""
10044020-173 = ""
10044020-174 = "Т-Ты..."
10044020-175 = "О, она типа... испорченная... Серьёзно..."
10044020-176 = "П-Пойдём... как можно дальше от неё."
10044020-177 = ""
10044020-179 = ""
10044020-181 = "Ого, ты прогнала их одной своей негативной аурой! Неплохо!"
10044020-182 = "Я-я бы не называла это «негативом.» Просто «нейтральностью.» Даже нормой... правда?"
10044020-183 = "Вообще ничего не ждёшь? А ждать весело!"
10044020-184 = "Хм? Веселье... мне не необходимо."
10044020-185 = ""
10044020-187 = ""
10044020-188 = ""
10044020-189 = "А должно быть! Всё должно быть весёлым! Не думаешь?"
10044020-190 = "Думаю, да!"
10044020-191 = ""
10044020-192 = "[ns7] «Есть много разных подходов к жизни.»\n[ns8] «Надеюсь, ты найдёшь что-то, чего будешь ждать каждый день, Аоба.»"
10044020-195 = "Н-Не знаю... Хи-хи... Ну, даже если никогда не найду, это не особо важно."
10044020-196 = ""
10044020-200 = ""
10044020-201 = "А, это наша остановка."
10044020-202 = "Поезд ведь должен быть здесь, да? Он ОБЯЗАН быть здесь. Он БУДЕТ здесь!"
10044020-203 = "Ага, тут будет бюро находок для поездов."
10044020-204 = ""
10044020-208 = ""
10044020-209 = ""
10044020-210 = "[ns] «Пойдём, Аоба.»"
10044020-211 = "Т-Точно."
