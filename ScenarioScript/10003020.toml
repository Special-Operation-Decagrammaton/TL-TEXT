[translation]
10003020-1 = "Эпизод 2;Планам суждено идти наперекосяк"
10003020-3 = "Приём."
10003020-4 = ""
10003020-5 = "Комната Хины"
10003020-6 = ""
10003020-7 = "О, это ты, Сенсей."
10003020-8 = "[s] «Хина, ты не в форме?!»"
10003020-9 = "П-Почему я должна быть в ней? Если кто и должен удивляться, так это я."
10003020-10 = "Мы всё-таки приехали тренироваться на пляже. Купальник подходит случаю."
10003020-11 = "Ако приготовила мне другой купальник для этой поездки, но я его вернула."
10003020-12 = "[s] «Можно спросить почему?»"
10003020-13 = "Потому что того, что у меня уже есть, более чем достаточно."
10003020-14 = "Какой смысл покупать новый, если старый вполне подходит?"
10003020-15 = "Я просто подошла к вопросу практично."
10003020-16 = "[s1] «Но судя по этой бирке с именем...»\n[s2] «Это твой школьный купальник ещё с начальной школы, да?»"
10003020-17 = "Есть какая-то проблема? Какая разница, если он всё ещё мне подходит."
10003020-18 = "Есть какая-то проблема? Какая разница, если он всё ещё мне подходит."
10003020-19 = "Ты считаешь это странным?"
10003020-20 = "[s3] «Другими словами, ты с тех пор не...»\n[s4] «С начальной школы не выросла, да?»"
10003020-21 = "К-Какая тебе разница?! Если собираешься грубить, разговор окончен."
10003020-22 = "К-Какая тебе разница?! Если собираешься грубить, разговор окончен."
10003020-23 = ""
10003020-24 = ""
10003020-25 = "В любом случае, что там происходит снаружи? Я слышала какой-то шум."
10003020-26 = "[s] «Ничего важного. Думаю, они просто готовились к тренировке.»"
10003020-27 = "...Понятно. Возможно, именно это я и слышала."
10003020-28 = "[s] «А ты чем занималась, Хина?»"
10003020-29 = "Ждала, полагаю. В моём расписании написано, что я должна готовиться к дневной пробежке, терпеливо ожидая."
10003020-30 = "То есть четыре часа мне совершенно нечего делать."
10003020-31 = "[s] «Да уж, интересное расписание.»"
10003020-32 = "Это решение Ако. Я полностью передала ей планирование этой поездки."
10003020-33 = "Я не возражаю против решений своего старшего администратора."
10003020-34 = "Это хоть какое-то разнообразие после того, как я всегда решала всё сама."
10003020-35 = "[s] «Ты ей доверяешь.»"
10003020-36 = "Да. Она не раз доказала свою компетентность, выполняя множество задач для Дисциплинарного комитета."
10003020-37 = "Ако сказала, что хочет взять эту ответственность, поэтому я оставила всё ей. Странно произносить это вслух, но ты прав. Я ей доверяю."
10003020-38 = "Просто я настолько привыкла быть занятой, что не знаю, что делать, когда мне приказывают просто ждать."
10003020-39 = "Мне никогда раньше не приходилось делать ничего подобного."
10003020-40 = "Так что, если у тебя есть время, не мог бы ты оказать мне услугу, Сенсей?"
10003020-41 = "Не мог бы ты... составить мне компанию?"
10003020-42 = "Иначе я сойду с ума от скуки за эти четыре часа."
10003020-43 = "Конечно, ты не обязан, если не хочешь."
10003020-44 = "Мне и так неловко, что тебя втянули в тренировки Дисциплинарного комитета. Я не хочу отнимать у тебя больше времени, чем ты готов дать."
10003020-45 = "[s] «Ты шутишь? Я с удовольствием останусь и поболтаю!»"
10003020-46 = "Спасибо."
10003020-47 = ""
10003020-49 = "Хм? Это твой телефон?"
10003020-50 = ""
10003020-51 = ""
10003020-53 = "[ns] «Да. Я только что сменил его.»"
10003020-60 = "Сенсей? Вы меня слышите?"
10003020-61 = "Ух. Запрашиваем экстренную поддержку, Сенсей."
10003020-62 = "Ситуация на пляже хуже, чем мы думали. Нам нужна ваша помощь, Сенсей!"
10003020-63 = "Пожалуйста, отдайте нам приказы, но Хина ничего не должна узнать!"
10003020-66 = "Сенсей? Кто это был?"
10003020-67 = "[s5] «У-Ух! Это врач! Сказал, что я заболел!»\n[s6] «Это, эм... туалет! Ему срочно нужно меня увидеть!»"
10003020-68 = "П-Правда? Хм."
10003020-69 = "П-Правда? Хм."
