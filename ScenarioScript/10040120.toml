[translation]
10040120-1 = "Послесловие;Правда или действие"
10040120-2 = ""
10040120-3 = "Ну..."
10040120-4 = "Если я всё правильно поняла, Коюки и Маки намешали целый чан этой подозрительной жидкости из напитков, которые у нас были?"
10040120-5 = "Именно! Мы всего на пять минут ушли в магазин, а она даже столько не смогла спокойно посидеть!"
10040120-6 = "О чём она вообще думала, так переводя продукты?"
10040120-7 = "...Что? Переводить??"
10040120-8 = "Да плевать на всё остальное, что ты там наговорила, но вот слово «переводить» я так не оставлю!"
10040120-9 = "Мы не просто дурачились! Мы раздвигали границы гастрономии, создавая новые вкусы—"
10040120-10 = ""
10040120-12 = ""
10040120-13 = ""
10040120-14 = ""
10040120-15 = "Руки вверх и держать!"
10040120-16 = "Да, мэм..."
10040120-18 = "И что тогда делать с этим напитком?"
10040120-19 = "Жалко так переводить продукты, но, похоже, придётся всё вылить."
10040120-20 = ""
10040120-22 = ""
10040120-23 = ""
10040120-24 = "Вообще-то, Юука, у меня есть идея."
10040120-25 = "Смесь Коюки и Маки выглядит странно, но, учитывая, что она состоит из пригодных для питья жидкостей, вредной быть не должна..."
10040120-26 = "Что, если использовать её как штрафной напиток в «Правде или действии»?"
10040120-27 = "«Правда или действие»?"
10040120-28 = "Да. Кто-то задаёт тебе вопрос, а ты должна ответить честно."
10040120-29 = "Вместо действия, если кто-то не захочет отвечать на вопрос, ему придётся в качестве штрафа выпить этот напиток. Так мы и повеселимся, и заодно найдём применение этой смеси. Что думаете?"
10040120-30 = "О-о-о, мне нравится! Я столько всего хочу спросить у Юки!"
10040120-31 = "Коюки."
10040120-32 = "Да, мэм..."
10040120-33 = "Хах... В «Правду или действие» сыграть весело, но вот насчёт этого напитка я не уверена."
10040120-34 = "Лично мне совсем не хочется его пить, но важнее то, что Коюки может решить, будто такое поведение вполне допустимо."
10040120-36 = "С другой стороны, ты ведь больше всего на свете ненавидишь тратить припасы впустую, разве нет?"
10040120-37 = "Почему бы пока не закрыть на это глаза, а с наказанием Коюки я разберусь позже?"
10040120-38 = "Эм... Знаете что, может, просто дадим Юке на меня накричать? Я лучше это выберу!"
10040120-39 = "Не вариант."
10040120-40 = "Ах... Прощай, жестокий мир..."
10040120-42 = "Ну, с этим не поспоришь..."
10040120-43 = "Я и правда хотела сыграть в «Правду или действие» на пижамной вечеринке. А раз Сенсея здесь нет, можем спрашивать что угодно..."
10040120-44 = "Тогда давайте все сядем в круг."
10040120-45 = "Правила простые. Если тебе задают вопрос, можно либо ответить честно, либо выпить штрафной напиток. После этого ты получаешь право задать следующий вопрос."
10040120-46 = "Первую спрашивающую выберем жребием!"
10040120-47 = ""
10040120-52 = "О, я выиграла?"
10040120-53 = "Да, выбирай кого хочешь. Постарайся задать сложный вопрос."
10040120-54 = "Сложный вопрос..."
10040120-55 = ""
10040120-57 = ""
10040120-58 = "Мне это пришло в голову, когда я смотрела, как вы раньше взламывали телевизор... Коюки."
10040120-59 = "А-а? Я?!"
10040120-60 = "Сколько раз ты взламывала серверы Миллениум? Недавно я нашла в серверных данных несколько подозрительных записей."
10040120-61 = "Эм. Ну. Я вообще-то не знаю."
10040120-63 = "Хорошо. Ей штрафной напиток."
10040120-65 = "Э-э-э?! Подождите, я правда не вру! Я действительно, честно-честно не помню!"
10040120-66 = "Я захожу туда каждый раз, когда мне нужно что-нибудь новенькое... Как я должна всё это считать?"
10040120-67 = "Ты даже не можешь сосчитать... сколько раз это делала?"
10040120-68 = "Ноа, пожалуйста, назначь на завтра встречу для меня и Коюки. Похоже, мне придётся серьёзно поговорить с ней о безопасности серверов."
10040120-70 = "Разумеется. Я немедленно забронирую для вас звукоизолированный конференц-зал."
10040120-71 = "П-погодите! Я сказала правду! За что меня наказывают?!"
10040120-72 = "Это совершенно отдельный вопрос, не связанный с нашей игрой."
10040120-73 = "А теперь, Коюки. Выбери, кому задать вопрос."
10040120-74 = "Угх... Тогда Ноа!"
10040120-76 = "Какого цвета на тебе сейчас трусики?! Отвечай за три секунды, иначе пьёшь штрафной напиток—"
10040120-77 = "Белые, кружевные. Они очень удобные, поэтому это моя любимая пара."
10040120-78 = "Это было слишком быстро... Ты могла бы хотя бы са-а-амую капельку смутиться?"
10040120-79 = "Ты правда думала, что Ноа смутит такой вопрос?"
10040120-80 = "Тогда теперь моя очередь..."
10040120-81 = "Юука?"
10040120-82 = "Я-я? Ты хочешь что-то спросить у меня?"
10040120-83 = "Да. Есть кое-что, что мне всегда было интересно."
10040120-84 = ""
10040120-86 = ""
10040120-87 = "Что ты думаешь о... Сенсее [USERNAME]?"
10040120-88 = ""
10040120-90 = ""
10040120-92 = ""
10040120-94 = "И-из всего возможного?!"
10040120-95 = ""
10040120-97 = ""
10040120-98 = "Э-это очень сложный вопрос..."
10040120-99 = "Не то чтобы мне не нравился Сенсей или что-то такое, но говорить об этом перед столькими людьми немного..."
10040120-100 = "Понятно. Тогда пей штрафной напиток!"
10040120-101 = "Угх... Ладно, выбора нет..."
10040120-102 = ""
10040120-106 = "Ч-что это такое? Оно такое липкое... и горькое, и кислое... У меня язык немеет?!"
10040120-107 = "Не могу поверить, что ты задала мне такой вопрос, Ноа. Я тебе ещё отомщу!"
10040120-108 = "Фуфу, это всего лишь игра, разве нет?"
10040120-109 = "Ну что же, Юука? Выбирай следующую."
10040120-110 = "Маки, где ты в последний раз рисовала граффити?"
10040120-111 = "А? А, тот огромный рисунок молнии, который я сделала на северной стене электростанции на прошлой неделе—"
10040120-112 = "Что?! Я думала, последнее было то, что я нашла в библиотеке!"
10040120-113 = "Чёрт! Ответила, не подумав!"
10040120-115 = "*вздыхает*"
10040120-120 = "«Правда или действие» продолжалась до глубокой ночи."
10040120-121 = "Но почему-то..."
10040120-123 = "Юука, когда ты в прошлый раз дежурила представителем в Шале, ты вернулась только после рассвета... Что ты делала с Сенсеем?"
10040120-124 = "Ну, это... Дела Шале! Я не могу об этом говорить!"
10040120-125 = ""
10040120-129 = "Мне любопытно, о чём ты разговаривала с Сенсеем [USERNAME] перед Corgi Town в прошлые выходные."
10040120-130 = "А-а? Откуда ты об этом знаешь?!"
10040120-131 = ""
10040120-135 = "Юука. Я слышала, что, когда ты обрабатываешь расходы Шале, тебе попадаются и личные чеки Сенсея. Это правда?"
10040120-136 = "П-погодите. Опять я?!"
10040120-137 = ""
10040120-141 = "Юука-а-а!"
10040120-142 = "Юука."
10040120-143 = "Юука, дорогая?"
10040120-144 = ""
10040120-148 = "Почему все..."
10040120-149 = "...задают вопросы только мне?!"
10040120-151 = "...В итоге Юука сделала больше всех глотков штрафного напитка."
