[translation]
10049050-1 = "Эпизод 5;В поисках Банды шлемов"
10049050-2 = "..."
10049050-3 = "*тяжело дышит* *тяжело дышит*"
10049050-4 = ""
10049050-7 = "Группа на месте, видите направление на два часа от зрителей?"
10049050-8 = "Я заметила троих, похожих на Комаказэ Рабу и двух бандитов Банды шлемов Всплеска."
10049050-10 = "!!"
10049050-11 = "Мне нужно, чтобы вы подтвердили их личности и оценили угрозу."
10049050-12 = "Они тянут с собой тележку..."
10049050-13 = "Похоже, она набита ведёрками с попкорном... и гранатами!!"
10049050-15 = "[ns] «Гранатами?!»"
10049050-16 = "Отсюда они выглядят именно так."
10049050-17 = "Но я слишком далеко, чтобы подтвердить. Нужно, чтобы вы посмотрели поближе."
10049050-18 = ""
10049050-19 = ""
10049050-20 = ""
10049050-21 = "Этого достаточно, капитан?"
10049050-22 = "Ни за что! Мы идём ва-банк!"
10049050-23 = "Сейчас сорвём джекпот! Я это чувствую!"
10049050-24 = "Должно быть где-то здесь... Уф, почему тут внезапно столько народу?"
10049050-25 = "Точно? ...Эй, ты! С дороги!"
10049050-26 = ""
10049050-28 = ""
10049050-30 = "Эм..."
10049050-31 = "Э...?"
10049050-32 = "Капитан? Что случилось?"
10049050-33 = "Там..."
10049050-34 = "Та девушка на сцене в розовом костюме."
10049050-35 = "А что с ней? Разве она не просто актриса из детского шоу или типа того?"
10049050-36 = "Не знаю. Я её не узнаю..."
10049050-37 = "Но у меня мурашки от одного взгляда на неё."
10049050-38 = "Она выглядит сильной."
10049050-39 = ""
10049050-41 = ""
10049050-42 = ""
10049050-43 = ""
10049050-45 = "Сваливаем! Уходим отсюда!"
10049050-46 = ""
10049050-48 = ""
10049050-49 = "Что?!"
10049050-50 = ""
10049050-52 = ""
10049050-53 = ""
10049050-55 = ""
10049050-56 = ""
10049050-58 = ""
10049050-59 = "Подтверждаю. Трое бандитов в шлемах, включая Комаказэ Рабу!"
10049050-60 = "Они бегут в сторону Геенны. Начинаю преследование!"
10049050-61 = ""
10049050-63 = ""
10049050-64 = "Сузу... Термитовая Белая! Куда ты?!"
10049050-66 = "Эм, а почему она спрыгнула со сцены?"
10049050-67 = "Что происходит?"
10049050-69 = "Термитовая Белая!!"
10049050-70 = "Это какой-то дубль вне сценария, или... как это называют на сцене?"
10049050-71 = ""
10049050-73 = ""
10049050-74 = ""
10049050-75 = "[ns] «Лучше пойдём за ней.»"
10049050-76 = "Безусловно!"
10049050-78 = "Сузуми, стой! Тебе нужно было только подтвердить их личности!"
10049050-79 = "Если погонитесь за ними в Геенну, я не смогу вас поддержать!"
10049050-80 = "Нет времени спорить."
10049050-81 = "У них взрывчатка. Очень много. Гранаты и всё остальное."
10049050-82 = "Нам не нужна поддержка."
10049050-83 = "Нам просто нужно разобраться с этим. Как-нибудь."
10049050-84 = "Розовая с тобой!"
10049050-87 = ""
10049050-88 = "*тяжело дышит* *тяжело дышит*"
10049050-89 = "Капитан, КТО они вообще такие?!"
10049050-90 = "Откуда мне, чёрт возьми, знать? Они враги, ясно?"
10049050-91 = "Ага, они прямо со сцены спрыгнули и понеслись на нас."
10049050-92 = "Думаешь, это могло быть частью шоу?"
10049050-93 = "Это похоже тебе на рок-концерт? Ты их костюмы ВИДЕЛА?"
10049050-94 = "Стоять."
10049050-95 = ""
10049050-98 = ""
10049050-100 = "Как она оказалась перед нами?!"
10049050-101 = "Ух ты, сильная И быстрая..."
10049050-103 = "Я, Термитовая Розовая, перекрыла вам путь к отступлению! Сдавайтесь Тяжёлому Калибру!"
10049050-105 = "Тяжёлому... чему? Тяжёлому Калибру?"
10049050-106 = "А, типа тех детских игрушек."
10049050-107 = "Ты что, их суперфанатка?"
10049050-109 = "У них фанаты и правда бывают довольно безумными..."
10049050-110 = "А почему тебя вообще зовут «Розовой»? Ты фиолетовая!"
10049050-112 = "Всё сложно и со спойлерами. Посмотри шоу! Тебе понравится!"
10049050-113 = "(По крайней мере, они не знают, кто мы на самом деле...)"
10049050-114 = ""
10049050-117 = "О, я поняла. Это как одно из тех парадных шоу!"
10049050-118 = "Что ты имеешь в виду?"
10049050-119 = "Кажется, так их называют, да? Эти интерактивные шоу, которые одновременно идут по всему парку?"
10049050-120 = "Вот они! Розовая и Белая!"
10049050-121 = "Они сражаются со злодеями!"
10049050-122 = ""
10049050-124 = ""
10049050-125 = "(И вот теперь у нас зрители.)"
10049050-126 = "(Бросать светошумовую гранату опасно, когда вокруг столько детей...)"
10049050-127 = "(Ради безопасности всех лучше попробовать договориться."
10049050-128 = "У нас есть к вам вопросы. Пожалуйста, сотрудничайте."
10049050-129 = "[s] «Верно, девочки! Давайте всё обсудим!»"
10049050-131 = "Сенсей из Шале здесь?"
10049050-132 = "Не знаю, кто вы, но если у вас Сенсей на связи..."
10049050-133 = "Вы двое идите. Я разберусь с ними."
10049050-135 = "Не пойдёт, капитан!"
10049050-136 = "Мы все ради этой возможности старались!"
10049050-138 = "Хорошо, тогда..."
10049050-139 = "Разнесём их!"
