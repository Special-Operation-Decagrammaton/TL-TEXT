[translation]
10036120-1 = "Как Отряд наслаждается фестивалем"
10036120-2 = "(После диджейского концерта Саори...)"
10036120-4 = ""
10036120-5 = "Хи-хи, ты отлично справилась, Саори."
10036120-6 = "Ты бы идеально смотрелась на обложке журнала!"
10036120-7 = ""
10036120-9 = ""
10036120-10 = ""
10036120-11 = "В-Вы мне льстите."
10036120-12 = "Я даже не осознавала, что делаю там, на сцене. Не думаю, что смогла бы повторить это, если бы меня попросили."
10036120-13 = "Но я рада, что вам всем было весело."
10036120-14 = ""
10036120-16 = ""
10036120-17 = ""
10036120-18 = "Ещё как."
10036120-19 = "Мы с Хиёри и Мисаки все прыгали и кричали."
10036120-20 = "Даже Мисаки?"
10036120-21 = ""
10036120-23 = ""
10036120-24 = "Я-Я вообще-то не собиралась это упоминать."
10036120-25 = "Я просто... поддалась общему настроению. Не хотелось быть единственной, кто просто стоит."
10036120-26 = "Хи-хи, ну давай, будь хоть немного честнее с собой."
10036120-27 = "Теперь, когда у тебя появилось свободное время, Сао-Сао, нам всем стоит вместе погулять и насладиться фестивалем."
10036120-28 = "Похоже, он продлится почти всю ночь. И уверена, атмосфера будет совсем не такой, как днём."
10036120-29 = "Тем более что весь день ты работала вместо того, чтобы отдыхать."
10036120-30 = "Будет обидно всё пропустить, особенно раз мы проделали такой путь до пляжа."
10036120-32 = "Я-я в порядке..."
10036120-33 = "О нет, так не пойдёт."
10036120-34 = "Ты просто ОБЯЗАНА повеселиться, Сао-Сао. Иначе я очень на тебя рассержусь."
10036120-35 = "П-поняла."
10036120-36 = "Ладно, как насчёт «Песочных развлечений» или вон того аквариума с медузами?"
10036120-37 = "...Ты серьёзно? Я вообще не понимаю, зачем они здесь."
10036120-38 = "К-Как насчёт того?"
10036120-39 = ""
10036120-42 = ""
10036120-43 = "«Полный залп!»"
10036120-44 = "«Не подпускайте милых врагов»..."
10036120-45 = "«...и выигрывайте призы!»"
10036120-46 = "Это игровой киоск. Народу много, но выглядит забавно. Неплохой вариант."
10036120-47 = "...Меня не убедило."
10036120-48 = "Как ты и сказала, здесь толпа, повсюду мигают огни... слишком уж суетно."
10036120-50 = "..."
10036120-51 = "Т-Ты права... Нам просто не суждено так развлекаться."
10036120-52 = "Наверное, надо просто всю ночь смотреть на аквариум с медузами или что-то такое... Мы обречены..."
10036120-54 = "У-Успокойся, Хиёри. Мисаки просто ворчит."
10036120-56 = "Чего?"
10036120-57 = "Игровой киоск, да? Вполне подходит."
10036120-58 = "И правда, давайте все попробуем."
10036120-59 = ""
10036120-61 = ""
10036120-62 = ""
10036120-63 = "*вздыхает*"
10036120-64 = "Ладно, похоже, мы всё-таки играем. Идите. Я следом."
10036120-65 = "Х-Хи-хи-хи...!"
