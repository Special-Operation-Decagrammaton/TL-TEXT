[translation]
90001250-1 = "Эпизод 25;Непредсказуемое"
90001250-2 = "Что ЭТИ ДВОЕ здесь делают?!?!"
90001250-3 = "В-Все успокойтесь! Сначала нужно убедиться, что это действительно правда!"
90001250-4 = "О-Одна из них не подтверждена, но другая!"
90001250-5 = ""
90001250-7 = ""
90001250-8 = ""
90001250-9 = ""
90001250-10 = "Серьёзно...?"
90001250-11 = "Принцесса Безымянных богов, AL-1S... или «Арис», как они её называют."
90001250-12 = "Э-Эм... «Принцесса Безымянных богов» звучит очень с-страшно и опасно, так что..."
90001250-13 = "Ах, да. Прошу прощения, Эйн."
90001250-15 = "Как бы мы её ни называли, это совершенно точно она, разве нет?"
90001250-16 = "Н-Н-Н-Но как...? Всё это время... н-никто из нас не заметил?"
90001250-17 = "М-Мы уже знали о... С-Сайбе Момой, Сайбе Мидори и Ханаоке Юзу... но не о ней?"
90001250-19 = "Это лишь предположение, но вполне достойное рассмотрения."
90001250-20 = ""
90001250-22 = ""
90001250-23 = ""
90001250-24 = ""
90001250-26 = "...Согласна. Это должно быть «оно», верно?"
90001250-27 = "...Точно?"
90001250-28 = "Ключ Безымянных богов..."
90001250-29 = "Но... почему она так выглядит?"
90001250-30 = "Пусть это и выглядит наспех собранным, я согласна. Какой ужасный дизайн!"
90001250-32 = "Э-Э-Э-Э-Это...! Н-Непростительно...!"
90001250-33 = "В-в-варвар, который это сделал, должен пасть ниц и извиниться перед металлами и всеми прочими материалами, из которых он создал эту... эту... э-эту штуку!"
90001250-34 = "Успокойся, Эйн. Твои чувства полностью оправданы, но всё же тебе следует успокоиться."
90001250-36 = "Их присутствие..."
90001250-37 = ""
90001250-43 = ""
90001250-44 = "Это недостающий кусочек головоломки, который мы искали, ответ на загадку их силы."
90001250-45 = "Но как им удавалось скрываться всё это время?"
90001250-46 = "И-Из-за того... ключа?"
90001250-47 = "Н-Насколько я понимаю, принцесса о-отказалась от своей судьбы..."
90001250-49 = ""
90001250-50 = ""
90001250-58 = ""
90001250-59 = ""
90001250-61 = "Именно. Поэтому можно было бы предположить, что «принцесса» совершенно не способна пользоваться Запретной силой."
90001250-62 = "Однако если ключ способен разблокировать её для неё... Что ж, это уже совсем другое дело."
90001250-63 = "Единственный рациональный вывод — ключ помнит, как использовать Запретную силу."
90001250-65 = "Д-Да... потому что иначе они не смогли бы от нас скрываться... если бы не знали как..."
90001250-66 = "...Полагаю, нам нужен новый план?"
90001250-67 = "Н-Нужен... правда?"
90001250-68 = "С-Чего вообще начинать?"
90001250-69 = ""
90001250-71 = ""
90001250-74 = "Эйн? Соф? Ор? Тиферет требуется помощь. Она просит совета."
90001250-75 = "Ч-Что?! Тифи...?"
90001250-76 = "Какая головная боль. Обычно нам следовало бы сосредоточиться на управлении полевыми операциями, но..."
90001250-77 = "Нет-нет. Тиферет не нужны наши приказы. Скорее всего, у неё уже есть план, которому она намерена следовать."
90001250-78 = "Т-Тогда что...?"
90001250-79 = "...! Ты имеешь в виду...?!"
90001250-80 = "Да-да. Разумеется."
90001250-81 = "Тиферет искала не приказа, а одобрения. Вернее... решимости. Смелости."
90001250-83 = "[ns] «Мы наконец-то прошли.»"
90001250-84 = "Серьёзно... и прямо в комнату, заросшую мхом."
90001250-85 = "Здесь... даже приятно... Пахнет травой."
90001250-86 = ""
90001250-88 = ""
90001250-89 = "Полагаю, ожидать, что всё это место идеально обслуживали столько лет, было слишком оптимистично."
90001250-90 = "Попадание любой внешней растительности или влаги внутрь отрицательно сказалось бы на сохранности хранящихся здесь семян."
90001250-91 = "Или, возможно... такой уровень переменных был предусмотрен ещё при проектировании."
90001250-93 = "Эта дверь тоже заперта? Может, это хранилище самых важных семян."
90001250-94 = "Узнаем только после проверки. Однако думаю, сейчас нам стоит немного передохнуть."
90001250-95 = "Полностью поддерживаю! У меня ноги болят!"
90001250-97 = "Я знаю, что это! Перед финальным боссом всегда есть точка сохранения!"
90001250-102 = "Я помог расчистить часть мха, чтобы всем было где отдохнуть."
90001250-103 = ""
90001250-104 = ""
90001250-105 = "Уставшие участницы Отдела разработки игр довольно быстро задремали."
90001250-106 = ""
90001250-108 = ""
90001250-109 = "..."
90001250-110 = "[ns] «Что случилось, Кей? Ты просто смотришь на мох.»"
90001250-111 = "А? Ничего. Всё нормально."
90001250-112 = "..."
90001250-113 = "Ну... Эм. Тема, возможно, неожиданная, но я всё думаю: что такое жизнь?"
90001250-114 = "Ох. С чего вдруг такие мысли, Кей?"
90001250-115 = "Ничего особенного."
90001250-116 = "Я просто наблюдала, с каким упорством он растёт в суровых условиях этого объекта."
90001250-117 = "Ты про мох?"
90001250-118 = "Да. Мох — древнее растение, появившееся примерно 400 миллионов лет назад."
90001250-119 = "Но если отойти от фактов, я начинаю ощущать, что жизнь... совершенно несовершенна."
90001250-120 = "Она хрупкая, эгоистичная и непредсказуемая."
90001250-122 = "В каком-то смысле хаотичная, да?"
90001250-123 = "...Пожалуй."
90001250-124 = "Точное наблюдение, Кей. На самом деле эта хаотичность и есть сама сущность жизни."
90001250-125 = "Ведь логическая схема не может инстинктивно выбрать случайное число, верно?"
90001250-126 = "...Тц."
90001250-127 = ""
90001250-128 = "[ns] «Что ты имеешь в виду, Химари?»"
90001250-129 = "Случайность — гораздо более сложное понятие, чем можно подумать. На самом деле компьютер не способен выдать абсолютно случайное число."
90001250-130 = "Любая «случайность», которую вы видите в обществе, далеко не так произвольна, как кажется."
90001250-131 = "Как она и сказала. Компьютеру всё равно приходится выполнять строго определённые вычисления или использовать значения, меняющиеся каждую миллисекунду, чтобы выбрать случайное число."
90001250-132 = "Поэтому чаще это называют «псевдослучайным» числом. Потому что на деле это лишь цепочка точных вычислений, создающая впечатление случайности."
90001250-133 = "Чтобы получить действительно случайное число, компьютеру нужен внешний источник данных."
90001250-134 = "Но если заставить людей вручную вводить случайные числа, весь смысл теряется. Поэтому мы используем методы, измеряющие естественную случайность, а затем преобразуем её в «случайное» число."
90001250-135 = "[s] «Понятно...?»"
90001250-136 = "И я считаю, что именно эти вероятности, совпадения и нелинейности воплощают потенциал жизни."
90001250-137 = "Если точнее — её хаотичность."
90001250-138 = "...Вот именно это мне и не нравится. Этим в принципе невозможно управлять или предсказывать."
90001250-139 = "Но знаешь что, Кей? Если бы в жизни всё идеально контролировалось и предсказывалось, ты бы никогда не воскресла."
90001250-140 = "Вот как?"
90001250-141 = "Подумай. Если бы ты обнаружила потенциально опасную переменную, что бы сделала? Оставила бы её просто потому, что тебе так хочется?"
90001250-142 = "Желание здесь ни при чём. Нечто подобное пришлось бы уничтожить—"
90001250-143 = ""
90001250-145 = ""
90001250-146 = "Ах."
90001250-147 = "Вот видишь. Жизнь может быть хаотичной и неопределённой..."
90001250-148 = "...но именно эти качества порождают множество ответвлений возможностей, которыми она обладает."
90001250-149 = "И даже не осознавая этого, жизнь таким образом ещё и разнообразит свой генофонд."
90001250-150 = "...А значит, создаёт всё больше и больше возможностей."
90001250-151 = "Ты хочешь сказать, что точные расчёты и прогнозы на самом деле вредны для выживания?"
90001250-152 = "Да. В зависимости от точки зрения."
90001250-153 = "Думаю, более важный вопрос — возможны ли вообще такие расчёты. Если учесть квантовое туннелирование..."
90001250-155 = "..."
90001250-156 = "История из микромира..."
90001250-157 = "Но этот мир ведь совершенно точно существует, нет?"
90001250-158 = "И если отложить расчёты и науку в сторону, разве эти милые комочки мха не заслуживают похвалы просто за то, что они здесь?"
90001250-159 = "..."
90001250-160 = "В конце концов, Кей, каждое семя хранит в себе возможность расцвести в растение или дерево, верно?"
90001250-161 = "...Не стоило мне этого говорить..."
90001250-162 = "[ns1] «Одно я знаю точно!»\n[ns2] «А именно — Кей-Кей стесняшка!»"
90001250-165 = "Х-Хватит надо мной издеваться!"
90001250-167 = "Подведу итог."
90001250-168 = "Они живые существа. Мы — нет. Тиферет тоже нет."
90001250-169 = "Очевидная истина в том, что у всех живых существ есть предел."
90001250-170 = "Значит, нужно воспользоваться этими пределами!"
90001250-171 = "К-Как...?"
90001250-172 = "Например...!"
90001250-174 = "...Хм."
90001250-175 = "Э-Э-Э-Это уже немного...!"
90001250-176 = "Немного! Но ведь очень эффективно, правда?"
90001250-177 = "Э-Это правда, но всё равно...!"
90001250-178 = "Д-Даже если мы попробуем, разве ключ не останется невредим?"
90001250-179 = "Ключ бесполезен без замка, который он должен открыть!"
90001250-180 = "Н-Но принцесса... Принцесса ведь тоже может остаться невредимой?"
90001250-182 = "...Нет. Не останется. Из-за того, кем она стала."
90001250-183 = "По сравнению с обычным состоянием... Проще говоря, её мощность, скорее всего, снизится."
90001250-184 = "Такого снижения будет достаточно для наших целей, верно? Я поддерживаю этот план."
90001250-186 = "А-А вы, Старшая сестра... Что думаете?"
90001250-187 = ""
90001250-189 = ""
90001250-190 = "..."
90001250-191 = "Эйн, Соф и Ор. Могу сказать лишь одно: порой в зле скрывается рациональная необходимость."
90001250-192 = "Если подробнее, в этом мире существуют существа, которых называют «хищниками»."
90001250-193 = "Для поглощаемой добычи это выглядит жестоко. Ненормально."
90001250-194 = "Однако без такого «хищника» сама система рассыпается в прах."
90001250-196 = "А, я про это знаю! Если оленей много, а волков, которые их едят, нет, вся растительность и земля погибнут!"
90001250-197 = "И вот Соф снова демонстрирует свои... неожиданные знания по теме."
90001250-198 = "Что ты имеешь в виду? Хочешь сказать, что это плохо?"
90001250-199 = "Нет-нет-нет. Это просто воплощение моего отвращения к живым существам."
90001250-200 = "Система, которой для существования обязательно нужны противоречия. Совершенно отвратительно."
90001250-201 = "Угх..."
90001250-203 = "Поэтому, Эйн, Соф и Ор. Если это решение, которого вы желаете, давайте передадим его Тиферет."
90001250-204 = "Разумеется, у Тиферет есть собственная воля, и она лишь хочет услышать мнение и получить одобрение других узлов."
90001250-205 = "О? По-моему, она просто пытается разделить ответственность! Ха! Наша Тиферет та ещё хитрюга!"
90001250-206 = "Что у тебя в голове происходит, раз ты так искажённо истолковываешь чужие намерения...?"
90001250-207 = "М-Меня это устраивает. В конце концов, это з-значит, что мы можем помочь Тифи, да?"
90001250-209 = "Ты права. Ведь во имя нашего владыки..."
90001250-210 = ""
90001250-212 = ""
90001250-213 = "...мы уже едины."
90001250-215 = "Следующий эпизод;То, что было скрыто"
