[translation]
10039130-1 = "Послесловие;Справедливость☆Ревю"
10039130-2 = "Отряд правосудия проводил генеральную репетицию своего спектакля, и я пришёл их поддержать."
10039130-6 = ""
10039130-7 = "А, Сенсей. Добро пожаловать."
10039130-8 = "[s] «Ичика?! Потрясающий костюм!»"
10039130-9 = "Ха-ха, правда? Догадываетесь, кого я играю?"
10039130-10 = "[s] «Принца, да?»"
10039130-11 = "Да, так уж вышло. Похоже, больше некому настолько бесстыдно изображать принца, как мне."
10039130-12 = "Теперь, после репетиций, я уже чувствую себя довольно уверенно."
10039130-13 = "Раз уж вы пришли, не хотите посидеть и посмотреть нашу репетицию?"
10039130-14 = "[s1] «С удовольствием.»\n[s2] «А что за пьеса?»"
10039130-17 = "О, это классическая пьеса под названием «Парализованная красавица.»"
10039130-18 = "Возможно, вы знаете этот сюжет, Сенсей. Там принц преодолевает трудности, чтобы спасти парализованную принцессу."
10039130-19 = ""
10039130-21 = ""
10039130-22 = "Думаю, всем будет интересно. Заходите."
10039130-26 = ""
10039130-27 = "Я нашёл Цуруги сидящей в зрительном зале."
10039130-28 = ""
10039130-30 = ""
10039130-31 = "Сенсей?!"
10039130-32 = "[s3] «Привет, Цуруги.»\n[s4] «Можно я сяду рядом?»"
10039130-33 = ""
10039130-34 = ""
10039130-36 = ""
10039130-37 = "У-Угх... Кра-а-агх..."
10039130-38 = ""
10039130-40 = ""
10039130-41 = "А... нет, только не здесь. Не пока все репетируют..."
10039130-42 = "...Да, да. Пожалуйста, садитесь."
10039130-44 = "Когда я устроился на месте, началась репетиция."
10039130-47 = ""
10039130-48 = "Ах, принцесса родилась!"
10039130-49 = ""
10039130-51 = ""
10039130-53 = ""
10039130-54 = "Затем... появляются феи... и реплика..."
10039130-55 = "«Мы приготовили подарок для принцессы...»"
10039130-57 = "Мы приготовили подарок для принцессы!"
10039130-58 = "«Принцесса... мой дар — красота...»"
10039130-59 = "Принцесса, мой дар — красота."
10039130-60 = ""
10039130-62 = ""
10039130-63 = "[ns] «Цуруги, ты весь сценарий наизусть выучила?»"
10039130-64 = ""
10039130-66 = ""
10039130-67 = "А... ну... так уж получилось..."
10039130-68 = "Как член Отряда правосудия, я настолько втянулась, что сама не заметила..."
10039130-69 = "[s] «Это же потрясающе! А кого ты играешь?»"
10039130-70 = "Никого... Я адаптировала сценарий и помогала делать реквизит. Я не актриса..."
10039130-71 = "Но мне нравятся романтические истории, так что... это сильно помогло..."
10039130-72 = "И здесь полно студентов, которые подходят для актёрской игры куда лучше меня..."
10039130-73 = "Если бы на сцену вышла я, то только всех бы распугала..."
10039130-74 = "[s] «Но ты столько сил потратила, чтобы выучить сценарий. Наверное, тебе обидно.»"
10039130-75 = "Всё нормально. Для меня уже сам факт, что я смогла поучаствовать..."
10039130-76 = ""
10039130-78 = ""
10039130-79 = "...этого достаточно."
10039130-80 = "[s5] «Если ты так считаешь.»\n[s6] «Что ж, тогда буду ждать вашего спектакля завтра.»"
10039130-83 = "Хе-хе... Да, я очень им горжусь."
10039130-85 = "Я наблюдал, как Цуруги помогала остальным студентам во время репетиции."
10039130-89 = "На следующий день я отправился посмотреть спектакль на карнавале."
10039130-90 = ""
10039130-95 = "[ns7] «Здесь столько народу!»\n[ns8] «Отряд правосудия настолько популярен...?»"
10039130-98 = ""
10039130-99 = "О, господин!"
10039130-101 = "О, Сенсей!"
10039130-102 = "А, здравствуйте... Рада вас здесь видеть..."
10039130-103 = "[s9] «Всем привет!»\n[s10] «Вы тоже пришли посмотреть спектакль?»"
10039130-106 = "Хи-хи, ещё бы!"
10039130-107 = "Спектакли воплощают вымышленные истории и эмоции в реальность, используя лишь актёрские техники и сценические средства!"
10039130-108 = "Так что в каком-то смысле актёрское мастерство пересекается с ниндзюцу!"
10039130-109 = "Ну а раз уж мне выпала возможность посетить огромный фестиваль в другой школе, я решила заодно расширить свои познания в театре!"
10039130-110 = "Это тоже часть нашего пути ниндзя! Нин-нин!"
10039130-111 = "О-о, если мы снимем реакцию людей на спектакль и выложим её, просмотры «Мичиручи: Свиток девушки-ниндзя» могут немного вырасти..."
10039130-113 = "Д-Думаю, так и будет... Карнавал Тринити огромный. Сюда съезжаются люди со всего Кивотоса..."
10039130-114 = "Для таких случаев есть одна поговорка..."
10039130-115 = "«Ловить рыбку в мутной воде...» нет, не то."
10039130-116 = "«Лиса, одолжившая силу тигра...» Вот, кажется, эта, хи-хи."
10039130-117 = "Что-то вроде того!"
10039130-118 = "[s11] «А-а, так вот в чём ваш план.»\n[s12] «Члены Клуба исследования ниндзюцу страшные люди!»"
10039130-121 = "Вы тоже пришли посмотреть спектакль, мой господин?"
10039130-122 = "Если да, почему бы вам не посмотреть вместе с нами?"
10039130-123 = "Да, мы всегда рады вам, Сенсей. Заодно сможем снять и вашу реакцию."
10039130-124 = "[s] «Кажется, сначала мне нужно кое с чем разобраться.»"
10039130-125 = ""
10039130-127 = ""
10039130-128 = "[ns] «Там какая-то суматоха. Я скоро вернусь.»"
10039130-129 = "Вечно вы заняты, куда бы ни пошли. Тогда Изуна будет за вас болеть! Если что-нибудь понадобится, просто позовите."
10039130-130 = "Вы так круто выглядите, когда ходите и решаете чужие проблемы..."
10039130-131 = "Ладно, идите решать. А я останусь здесь, держа палец на кнопке записи!"
10039130-133 = "Я мысленно отметил, что нужно рассказать ей о необходимости получать разрешение людей перед съёмкой."
10039130-137 = ""
10039130-138 = "[ns] «Это же...»"
10039130-139 = ""
10039130-144 = "...Вот как? Ситуация действительно сложная."
10039130-145 = "Д-Да..."
10039130-147 = "Придётся искать замену..."
10039130-148 = ""
10039130-150 = ""
10039130-152 = ""
10039130-153 = "А, Сенсей. Вы про нас не забыли. Спасибо."
10039130-155 = "Сенсей!"
10039130-156 = "С-Сенсей..."
10039130-157 = "[s] «Что-то случилось?»"
10039130-159 = "А... Дело в том..."
10039130-160 = "Да... У нас небольшая проблема..."
10039130-161 = "Наша принцесса ехала сюда на велосипеде, и в неё попала ракета."
10039130-162 = "[s] «О нет...»"
10039130-163 = "Не волнуйтесь, с ней всё будет хорошо. Но сегодня никаких трюков она уже не выполнит."
10039130-164 = "*вздыхает*"
10039130-165 = "Вы ведь видели на репетиции: принцесса прыгает через горящее кольцо, кувырком уворачивается от пуль и делает ещё много чего."
10039130-166 = "Найти студента, который умеет И играть, И заниматься гимнастикой, было непросто."
10039130-167 = "[s] «Не знал, что быть принцессой настолько тяжёлая работа.»"
10039130-168 = "Ну, мы хотели максимально точно следовать оригиналу."
10039130-169 = "Но я не представляю, где в последний момент найти замену."
10039130-170 = "Все так старались, а теперь, возможно, придётся всё отменить..."
10039130-171 = ""
10039130-173 = ""
10039130-175 = "А-а-а-ах..."
10039130-176 = ""
10039130-179 = "[ns13] «Кажется, я знаю одну замену...»\n[ns14] «А что, если принцессу сыграет Цуруги?»"
10039130-182 = ""
10039130-184 = ""
10039130-186 = "Га-а?!"
10039130-187 = ""
10039130-189 = ""
10039130-191 = "*кхе-кхе* *кхе-кхе*"
10039130-192 = "Сенсей... это..."
10039130-193 = "[s15] «Она знает весь сценарий наизусть.»\n[s16] «И с физической подготовкой у неё точно никаких проблем.»"
10039130-196 = "[ns] «В сложившихся обстоятельствах она определённо лучший вариант.»"
10039130-197 = "С-Сенсей...?!"
10039130-198 = "...Ладно."
10039130-199 = "Хасуми...?!"
10039130-200 = "Вы правы, Сенсей. Цуруги действительно идеально подходит на роль принцессы."
10039130-201 = "Я-Я вообще не принцесса..."
10039130-202 = ""
10039130-206 = "Я тоже думаю, что Сенсей прав."
10039130-207 = "И-Ичика...?"
10039130-208 = "С самого начала Цуруги относилась к этому спектаклю серьёзнее всех."
10039130-209 = "Она всегда приходила заранее готовить сцену, адаптировала историю, подготовила сценарий, следит за всеми костюмами..."
10039130-210 = "Она знает каждое движение, каждую реплику, понимает все сцены... Кто справится лучше?"
10039130-211 = "А-Актёрам нужно уметь играть... Я-Я не думаю, что смогу..."
10039130-212 = "Я-Я не могу... Это для меня слишком..."
10039130-213 = "Цуруги, тебе ведь нравятся романтические фильмы?"
10039130-214 = "Да, но..."
10039130-215 = "Я видела, как ты повторяешь реплики за героями во время просмотра."
10039130-216 = "Э-Это...!"
10039130-217 = "Это просто стыдно..."
10039130-218 = "Тут нечего стесняться. Я хочу сказать, что у тебя уже есть опыт, который поможет стать актрисой."
10039130-219 = "..."
10039130-220 = ""
10039130-222 = ""
10039130-224 = "Я думаю так же. Ты справишься. Я в тебя верю."
10039130-225 = "[s] «Я тоже в тебя верю, Цуруги.»"
10039130-227 = "Н-Ну..."
10039130-228 = ""
10039130-230 = ""
10039130-231 = "У-угх..."
10039130-232 = "Л-Ладно... Я попробую."
10039130-234 = "Хе-хе, я рада, Цуруги."
10039130-235 = "Отлично! Времени мало, так что давай прямо сейчас переоденем тебя в костюм!"
10039130-237 = "Кррааагх..."
10039130-238 = ""
10039130-240 = ""
10039130-241 = ""
10039130-244 = "Фух... Ну, по крайней мере проблему с принцессой мы решили..."
10039130-245 = "[s] «Есть ещё какая-то проблема?»"
10039130-246 = ""
10039130-248 = ""
10039130-249 = "Ну... У нас были студенты, которые должны были играть в спектакле деревья, но..."
10039130-250 = "...в них всех попала та же ракета."
10039130-251 = "Мне нужны две замены на роли деревьев, а где их найти — понятия не имею."
10039130-252 = ""
10039130-255 = ""
10039130-256 = "[ns17] «Есть у меня пара кандидатур.»\n[ns18] «Схожу спрошу.»"
10039130-257 = ""
10039130-258 = ""
10039130-260 = ""
10039130-261 = "П-Правда?"
10039130-262 = ""
10039130-265 = "[ns] Связаться с Клубом исследования ниндзюцу."
10039130-270 = ""
10039130-272 = ""
10039130-273 = "А, если подумать..."
10039130-274 = "...обратиться к Клубу исследования ниндзюцу — всегда хорошая идея!"
10039130-276 = "Изуна рада быть полезной вам, мой господин!"
10039130-277 = "Я, Древо Божеств Хяккияко, идеально подхожу на роль дерева!"
10039130-278 = "[s19] «Я и правда попросил, но...»\n[s20] «Ты точно не против играть всего лишь дерево?»"
10039130-281 = "С моим ростом я много раз играла деревья на школьных фестивалях."
10039130-282 = "Если честно, когда-нибудь мне хотелось бы сыграть роль покрупнее..."
10039130-283 = "Но Клуб исследования ниндзюцу научил меня, что у каждого есть своя роль."
10039130-285 = "Цукуё..."
10039130-286 = "Цукуё..."
10039130-288 = "Каждая роль важна по-своему. Я-Я довольна тем, как всё есть, и тем, какая я есть..."
10039130-289 = "К тому же это постановка Отряда правосудия. Мы лишь немного поучаствуем со стороны зрителей, не более."
10039130-290 = "Поэтому, если мы можем помочь хотя бы небольшой ролью... для нас это большая честь!"
10039130-292 = "Да-да! Изуна чувствует то же самое!"
10039130-293 = "Хорошо сказано, Цукуё!"
10039130-295 = "А ещё, если одна из нас участвует В спектакле, мы сможем сделать как минимум два видео по одной постановке!"
10039130-296 = "[s21] «Так вот в чём всё-таки была цель?»\n[s22] «Спасибо, но... Ладно, неважно, мы все вам очень благодарны!»"
10039130-304 = "Все поспешили подготовиться к выступлению."
10039130-312 = "Отряд правосудия ставит пьесу. На это стоит посмотреть."
10039130-313 = "К тому же они ставят «Парализованную красавицу,» старый классический шедевр. Интересно, как они его интерпретируют."
10039130-314 = "Похоже, это интересно многим. Здесь яблоку негде упасть."
10039130-315 = "О, а вон там форма «Дикой охоты»."
10039130-316 = "[s] «Надеюсь, никто не начнёт нервничать...»"
10039130-317 = ""
10039130-322 = "А, кажется, начинается!"
10039130-325 = "Давным-давно..."
10039130-326 = "...жила прекрасная принцесса."
10039130-327 = ""
10039130-332 = ""
10039130-334 = ""
10039130-335 = "[ns] «Какая она красивая!»"
10039130-336 = "Кто ИГРАЕТ принцессу? Она такая милая!"
10039130-337 = "От неё прямо веет чистотой. Не знала, что в Отряде правосудия есть такая девушка."
10039130-338 = ""
10039130-340 = ""
10039130-341 = "[ns] «Цуруги... Не нервничай, просто дыши...»"
10039130-342 = "..."
10039130-343 = ""
10039130-345 = ""
10039130-346 = "Прекрасно расцвели незабудки."
10039130-347 = "[s] «Ох...!»"
10039130-348 = ""
10039130-351 = "И голос у неё прекрасный!"
10039130-352 = "Как изящно. Отличный выбор актрисы!"
10039130-354 = "Несмотря на все переживания, принцесса Цуруги играла превосходно."
10039130-357 = ""
10039130-358 = "Внезапно принцесса уколола палец иглой водяной мельницы...!"
10039130-359 = ""
10039130-361 = ""
10039130-362 = "О!"
10039130-363 = ""
10039130-365 = ""
10039130-367 = "Так принцессу парализовало..."
10039130-368 = "И проклятие исполнилось..."
10039130-369 = "О нет! Наша принцесса...!"
10039130-370 = "Даже когда знаешь, что случится дальше, всё равно приятно смотреть такой шедевр."
10039130-371 = "Правда? Я уже знаю всю историю, но погружение просто невероятное!"
10039130-372 = ""
10039130-376 = ""
10039130-377 = "О, прекрасная принцесса...!"
10039130-378 = "Чёрные, как ночное небо, волосы, губы настолько алые, что розы рядом с ними бледнеют."
10039130-379 = "Моя принцесса, я прискакал вместе с рассветом!"
10039130-380 = "Ого, кто играет принца? Это потрясающе!"
10039130-381 = "У меня аж бабочки в животе! Может ли быть что-то романтичнее?!"
10039130-383 = "Спектакль плавно приближался к кульминации."
