10039130-398 = ""
10039130-399 = ""
10039130-401 = ""
10039130-402 = "(Сенсей меня поддерживает...!)"
10039130-403 = ""
10039130-405 = ""
10039130-406 = ""
10039130-407 = "(Агх, нет... От одной мысли, что Сенсей на меня смотрит, я вся напрягаюсь...)"
10039130-408 = ""
10039130-410 = ""
10039130-411 = ""
10039130-412 = "Г-Га-а-а... Аргх!"
10039130-413 = ""
10039130-415 = ""
10039130-417 = ""
10039130-418 = "П-Принцесса...?!"
10039130-419 = ""
10039130-423 = "*кашель* Принцесса!"
10039130-424 = ""
10039130-427 = "Ты больше не будешь парализована!"
10039130-428 = "Сердцем, искренним, как свет звёзд, я пробужу тебя."
10039130-429 = ""
10039130-432 = "Кррааагх..."
10039130-433 = "Даже если меня самого поразит паралич, моя любовь к тебе никогда не угаснет!"
10039130-434 = "Гра-а-а-гх...!"
10039130-437 = "Почему принцесса вдруг так себя ведёт?"
10039130-438 = "О-Она что, НА САМОМ ДЕЛЕ парализована, или...?"
10039130-439 = "[s] «(Ох, а ведь всё шло так хорошо...)»"
10039130-440 = ""
10039130-443 = "Ч-что за...?"
10039130-444 = "О, должно быть, это тот новый экспрессионистский стиль актёрской игры."
10039130-445 = "А?"
10039130-446 = "Он максимально подчёркивает характерную преувеличенную манеру сценического спектакля."
10039130-447 = "Полностью погрузиться в роль, не полагаясь на талант или вдохновение... Невероятно!"
10039130-448 = "Я всегда гордилась «Дикой охотой» как родиной искусства, но визит в Тринити расширил мой кругозор. Я поражена!"
10039130-449 = ""
10039130-454 = "Ого, студенты «Дикой охоты» аплодируют стоя...!"
10039130-455 = "Ч-Что? Что сейчас произошло?"
