[translation]
32030-1 = "Эпизод 3;Тайное общество"
32030-2 = "Теперь понятно. Ты приходила сюда обсуждать с Сенсеем наши учебные планы."
32030-3 = "И тебе просто нужен был совет...?"
32030-4 = "Но почему ты продолжаешь называть купальник пижамой?!"
32030-5 = "Ты говоришь с девушкой, которая однажды пришла на занятие в часовне в купальнике. Не понимаю, почему все так напрягаются из-за таких вещей."
32030-6 = "Э-Э-э..."
32030-7 = "[s] «Ты хотела поговорить со мной об Азусе?»"
32030-8 = "Да, верно."
32030-9 = "..."
32030-10 = "Всё нормально, Хифуми. Ты тоже можешь послушать."
32030-11 = "Дело в том, что последние две ночи она куда-то уходила и возвращалась почти на рассвете."
32030-12 = "Азуса..."
32030-13 = "Сначала я думала, ей просто трудно спать не в своей кровати, но, похоже, дело не в этом."
32030-14 = "Вообще-то я ни разу не видела, чтобы она спала."
32030-15 = "Если подумать, я тоже. Азуса обычно засыпает последней, но встаёт первой..."
32030-16 = "Не знаю, чем она занята, но начинаю думать, что ради неё самой нам придётся вмешаться и заставить её отдохнуть."
32030-17 = "Не могу избавиться от ощущения, что она... о чём-то тревожится."
32030-18 = "..."
32030-19 = "Не моё дело лезть в её личную жизнь, но мы обязаны помочь. Каждой девушке нужен нормальный сон."
32030-20 = "Боюсь, рано или поздно она просто свалится."
32030-21 = "И вас двоих это тоже касается. Хватит сидеть допоздна и лучше следите за собой."
32030-22 = "Работа клуба важна, но не должна быть важнее здоровья. Худшее, что может случиться, — мы провалимся. Ради этого не стоит жертвовать здоровьем."
32030-23 = "[s] «Это...»"
32030-24 = ""
32030-26 = ""
32030-27 = "..."
32030-28 = "Всё не так просто..."
32030-29 = "Хифуми?"
32030-30 = "Провал — не худшее, что может случиться! Если мы провалим последние два экзамена..."
32030-31 = "...нас исключат! Нас заставят покинуть Тринити!"
32030-32 = ""
32030-34 = ""
32030-35 = "Исключат...? О чём ты?"
32030-36 = "Нас не могут так легко исключить. Это долгий и сложный процесс, и нужны куда более серьёзные основания, чем просто оценки."
32030-37 = "[s] «Она говорит правду, Ханако.»"
32030-38 = "Сенсей?"
32030-39 = "..."
32030-40 = ""
32030-42 = ""
32030-43 = ""
32030-44 = "[ns] Рассказать правду о Клубе дополнительных занятий."
32030-46 = ""
32030-47 = "..."
32030-48 = "..."
32030-49 = "Понятно... Вот как. Если к третьему экзамену не сдадут все, нас исключат."
32030-50 = "В обычной ситуации такая схема и коллективное наказание были бы невозможны, но если учесть внесудебные полномочия Шале... всё сходится."
32030-51 = "Разве? По-моему, вообще не сходится."
32030-52 = "И тебя это тоже касается! Разве твои оценки раньше не были лучшими в классе?! Ты получала максимальные баллы по сложным предметам третьего курса, будучи первокурсницей!"
32030-53 = "..."
32030-54 = "Я... узнала, когда смотрела прошлогодние тесты, готовя наши пробники. Простите, что вторглась в твою личную жизнь."
32030-55 = "Но почему? Почему ты решила в этом году начать проваливаться? Если так продолжится, остальные из нас..."
32030-56 = "Прости. Я и представить не могла, что если провалится хотя бы одна участница Клуба дополнительных занятий, мы все... Это немыслимо."
32030-57 = "..."
32030-58 = "Нет. Мне не стоило быть такой наивной."
32030-59 = "Я должна перед каждой из вас извиниться за все неприятности, которые причинила."
32030-60 = "Простите, Сенсей."
32030-61 = "Прости, Хифуми."
32030-62 = "Х-Ханако. Всё хорошо — я уже тебя простила."
32030-63 = ""
32030-65 = ""
32030-66 = ""
32030-67 = "Ты права. Я намеренно получала низкие оценки."
32030-68 = "Но почему?! Что заставило тебя делать такое?"
32030-69 = "Боюсь, я не могу сказать."
32030-70 = "...?!"
32030-71 = "У меня есть причины... но я не хочу, чтобы вы страдали из-за моего выбора."
32030-72 = "Так что не переживайте. Сегодня всё закончится."
32030-73 = "Я сдам экзамены и уберегу остальных участниц Клуба дополнительных занятий."
32030-74 = "[s] «Спасибо, Ханако.»"
32030-75 = "Не нужно благодарить меня, Сенсей."
32030-76 = "Скорее это мне надо загладить вину перед вами. Может, устроить небольшой стриптиз? Подойдёт?"
32030-77 = "Н-Нет, ты и так достаточно сделала! Просто серьёзно относись к экзаменам — этого более чем хватит."
32030-78 = "О, у меня вопрос. Обо всём этом знаете только вы двое?"
32030-79 = "Думаю, да. До сих пор я говорила об этом только с Сенсеем."
32030-80 = "Если так, значит, Азуса тревожится не из-за исключения. Эта загадка всё ещё не решена..."
32030-81 = "Вообще после вашего рассказа основание Клуба дополнительных занятий кажется мне ещё страннее."
32030-82 = "..."
32030-83 = "Не думаю, что Мика могла всё это устроить. Это наверняка работа Нагисы."
32030-84 = "[s] «...!»"
32030-85 = "Но почему сейчас? Зачем ей заниматься подобным за несколько дней до подписания Эдемского договора?"
32030-86 = "Или именно поэтому она это и делает?"
32030-87 = "..."
32030-88 = "..."
32030-89 = "Теперь понятно. Цель Клуба дополнительных занятий — собрать вместе все потенциальные угрозы Эдемскому договору."
32030-90 = "[s] «...?!»"
32030-91 = "Что?!"
32030-92 = "Очень в духе Нагисы. Когда хочет, она может быть настоящей коварной ведьмой."
32030-93 = "Т-Ты только что назвала её ведьмой?"
32030-94 = "Нагиса хочет одним махом отстирать все проблемные элементы. По сути, мы вчерашнее грязное бельё."
32030-95 = "[s] «По её словам, скорее гнилые яблоки.»"
32030-96 = "В её план входите и вы, да, Сенсей?"
32030-97 = "Наверное, вы приняли эту работу с добрым намерением спасти отстающих студентов, но на деле были пешкой, чтобы использовать внесудебные полномочия Шале."
32030-98 = "И всё же это не помешало вам делать для нас всё возможное."
32030-99 = "Вы действительно замечательный человек, Сенсей. ♥"
32030-100 = "А ты скорее детектив, Ханако. Я поражена."
32030-101 = "Нагиса велела мне выяснить, кто может быть «предателем Тринити»."
32030-102 = "Как в духе Нагисы — какая драматичность. Хотя уверена, в её глазах предатель — любой, кто не согласен с её планами."
32030-103 = "Я понимаю, почему Азуса подозреваемая, учитывая её происхождение."
32030-104 = "Могу ошибаться, но не удивлюсь, если Кохару по сути заложница от Комитета правосудия."
32030-105 = "Но как насчёт тебя, Хифуми? Я думала, вы с Нагисой близки."
32030-106 = "Я?! Н-Неужели и я подозреваемая?"
32030-107 = "Наверное, раз она поместила меня сюда... Ч-Что я вообще сделала, чтобы попасть под подозрение?"
32030-108 = "[s] «...»"
32030-111 = "Об Азусе потом нужно поговорить подробнее. Я попробую выяснить, что происходит."
32030-112 = "Было бы здорово. Пожалуйста, держи нас в курсе, если что-то узнаешь."
32030-113 = "Конечно. Ну что? Значит, я официально стала частью ваших тайных полуночных свиданий?"
32030-114 = "Мы втроём, поздней ночью, одни, в волнующем ménage à trois! ♥"
32030-115 = "Ничего такого не происходит!"
32030-116 = "[s] «Уже правда поздно. На сегодня хватит.»"
32030-117 = "Вы правы. Пора спать."
32030-118 = "Спокойной ночи."
32030-121 = "М-м... В туалет..."
32030-122 = ""
32030-124 = ""
32030-125 = "Это свет из комнаты Сенсея? Что они делают так поздно?"
32030-126 = ""
32030-129 = "До завтра, Сэнс— а?"
32030-130 = "...?!"
32030-131 = "Ч-Что вы делали в комнате Сенсея?!"
32030-132 = "Пока, Сенсей. Жду завтрашнего ménage à trois!"
32030-133 = "О?"
32030-134 = "..."
32030-135 = ""
32030-137 = ""
32030-139 = "Тройничок?! Разврат! Грязь! СМЕРТНАЯ КАЗНЬ!"
32030-141 = "Так закончился ещё один день учебного лагеря."
32030-143 = "Следующий эпизод;Симпозиум купальников"
