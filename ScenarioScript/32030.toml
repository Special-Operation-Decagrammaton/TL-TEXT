[translation]
32030-1 = "Episódio 3;Encontro Secreto na Madrugada"
32030-2 = "...Entendo. Então estava conversando com o Sensei sobre o que fazer daqui para frente..."
32030-3 = "E a Hanako-chan também tinha algo sobre o que queria conversar com o Sensei..."
32030-4 = "M-Mas por que você veio de maiô?! Como assim o seu pijama é um maiô...?!"
32030-5 = "É que isso acalma o meu coração. Por isso mesmo participei até da aula na capela de maiô, lembra? Vamos tentar pensar nas coisas com a mente um pouco mais aberta♪"
32030-6 = "Auuu..."
32030-7 = "[s] \"Hanako, é melhor deixarmos a continuação daquela conversa para depois?\""
32030-8 = "...É sobre a Azusa-chan, não é?"
32030-9 = "..."
32030-10 = "...Não, tudo bem. Acho até bom que a Hifumi-chan ouça junto conosco."
32030-11 = "Na verdade, a Azusa-chan... quase toda noite, tem saído para algum lugar e só volta ao amanhecer."
32030-12 = "Então era isso..."
32030-13 = "No começo, achei que ela só não estava conseguindo dormir por estar em um lugar diferente, mas parece que não é o caso."
32030-14 = "...Eu quase nunca vi a Azusa-chan dormindo direito à noite."
32030-15 = "Agora que você falou, eu também não... A Azusa-chan está sempre acordada antes de mim, e acho que nunca a vi ir dormir mais cedo do que eu..."
32030-16 = "...Não sei o que exatamente a Azusa-chan anda fazendo. Mas acho que já está na hora de fazermos ela descansar, nem que seja um pouquinho à força."
32030-17 = "É que a Azusa-chan parece... de algum jeito, muito aflita com alguma coisa."
32030-18 = "..."
32030-19 = "Não sei quais são as circunstâncias dela, mas eu queria dar um jeito de aliviar nem que fosse um pouco dessa aflição..."
32030-20 = "Se continuar assim, uma hora ela vai acabar desmaiando."
32030-21 = "...E isso vale para o Sensei e para a Hifumi-chan também, viu? Vocês precisam dormir direito."
32030-22 = "Tudo bem que a prova é importante, mas o máximo que pode acontecer é reprovar. Não acham que isso nem se compara à saúde do corpo?"
32030-23 = "[s] \"Sobre isso...\""
32030-27 = "..."
32030-28 = "...Em uma situação normal, talvez fosse assim. Mas..."
32030-29 = "Hifumi-chan...?"
32030-30 = "Não... não é algo que termina só em \"reprovação\"...! Se não passarmos em nenhuma das próximas duas provas..."
32030-31 = "Seremos expulsas! Nós teremos que ir embora da Trinity...!!"
32030-35 = "...Expulsas? Hifumi-chan, como assim...?"
32030-36 = "I-Isso não tem cabimento pelas regras da escola. Uma expulsão exige vários procedimentos e justificativas, não pode ser tão simples assim..."
32030-37 = "[s] \"...\""
32030-38 = "...Sensei?"
32030-39 = "..."
32030-44 = "[ns] Contar o que sabe sobre o que está por trás do Clube de Aulas de Reforço."
32030-47 = "..."
32030-48 = "..."
32030-49 = "...Entendo, então era isso. Se reprovarmos em todas, todas seremos expulsas..."
32030-50 = "Esse sistema por si só já é absurdo desde o princípio, mas... entendo, a autoridade extralegal da Schale..."
32030-51 = "Hanako-chan..."
32030-52 = "Ah, p-por falar nisso, Hanako-chan, na verdade você tem notas ótimas, não tem? Quando estava no 1º ano, você gabaritou até as provas difíceis do 3º ano, não foi...?!"
32030-53 = "..."
32030-54 = "Hã, desculpa... Enquanto eu procurava provas antigas para o simulado, acabei encontrando sem querer..."
32030-55 = "P-Por que você está tirando aquelas notas agora...? É de propósito, não é...?"
32030-56 = "...Me desculpem, eu não sabia. Jamais imaginei que, se falhássemos, \"todas seriam expulsas\"..."
32030-57 = "..."
32030-58 = "Não, mesmo que eu não soubesse, isso não é algo que tenha desculpa..."
32030-59 = "Acabei fazendo algo terrível com o Sensei, com a Hifumi-chan... e também com a Azusa-chan e a Koharu-chan."
32030-60 = "Me desculpe, Sensei."
32030-61 = "Me desculpe também, Hifumi-chan."
32030-62 = "N-Não, imagina..."
32030-67 = "...Como a Hifumi-chan disse, aquelas minhas notas foram de propósito."
32030-68 = "E-Eu sabia...?! Hanako-chan, por que você fez uma coisa dessas...?"
32030-69 = "...Me desculpe, não posso contar."
32030-70 = "...!?"
32030-71 = "É por um motivo muito pessoal meu... Mas não é meu desejo que todas vocês saiam prejudicadas por causa disso."
32030-72 = "Por isso, podem ficar tranquilos."
32030-73 = "Vou me esforçar nas próximas provas, no mínimo para garantir que ninguém seja expulsa."
32030-74 = "[s] \"...Obrigado, Hanako.\""
32030-75 = "N-Não, imagina...?! Isso não é nada pelo qual o Sensei precise me agradecer tanto assim..."
32030-76 = "Pelo contrário, sou eu quem deveria pedir perdão. Será que basta eu me ajoelhar no chão completamente nua para me desculpar...?"
32030-77 = "Não, pelo contrário, por favor não faça isso...?! Só de ouvir que você vai se esforçar daqui para frente, eu já fico aliviada."
32030-78 = "Muito obrigada. A propósito... apenas a Hifumi-chan e o Sensei sabem desse fato?"
32030-79 = "Sim, além de nós, ninguém mais sabe ainda..."
32030-80 = "Entendo... Sendo assim, a aflição da Azusa-chan não parece vir das provas. Quer dizer que há algo que eu ainda não sei..."
32030-81 = "...Não. Mais do que isso, agora o que me intriga é a própria existência deste Clube de Aulas de Reforço."
32030-82 = "..."
32030-83 = "A Mika-san... jamais conseguiria bolar algo assim, então quem está por trás disso deve ser a Nagisa-san."
32030-84 = "[s] \"...!\""
32030-85 = "Mas por que fazer algo assim bem às vésperas do Tratado do Éden..."
32030-86 = "Não, será que é justamente por estarmos às vésperas dele...?"
32030-87 = "..."
32030-88 = "......"
32030-89 = "...Entendo. Então este Clube de Aulas de Reforço seria uma reunião de suspeitas sob desconfiança de tentarem sabotar o Tratado do Éden?"
32030-90 = "[s] \"...!?\""
32030-91 = "H-Hã?!"
32030-92 = "Digamos que é bem a cara da Nagisa-san... Ela continua sendo uma gatinha astuta como sempre."
32030-93 = "G-Gatinha...?"
32030-94 = "A lógica deve ser que, já que vai ter que lidar com isso mesmo, é mais eficiente resolver tudo de uma vez só. De repente parece até que estamos sendo tratadas como roupa suja."
32030-95 = "[s] \"(Tenho a impressão de ter ouvido uma palavra pior do que 'roupa suja'...)\""
32030-96 = "...O Sensei também acabou sendo passado para trás pela Nagisa-san, não foi?"
32030-97 = "Sob o pretexto de \"ajudar alunas com notas baixas\", ela se aproveitou da sua boa vontade para lhe dar esse papel, quando na verdade está usando a autoridade extralegal da Schale..."
32030-98 = "Mas, olhando por outro lado, o Sensei estava se esforçando puramente pelo nosso bem, não é...?"
32030-99 = "...Muito obrigada, Sensei. O Sensei é mesmo uma ótima pessoa, fufu♡"
32030-100 = "Hanako-chan, incrível... Você parece uma detetive."
32030-101 = "\"A traidora da Trinity\"... A Nagisa-sama me pediu para descobrir quem ela é."
32030-102 = "...Fufu, entendo. \"A traidora da Trinity\", é...? Uma expressão bem típica da Nagisa-san. Até porque, pela lógica dela, qualquer um que atrapalhe os planos da anfitriã da Tea Party se enquadraria nisso."
32030-103 = "...A Azusa-chan já parecia suspeita desde a documentação, então não é de se estranhar que desconfiem dela."
32030-104 = "Mas por que a Koharu-chan...? Forçando um pouco, se pensarmos nela como uma refém do Comitê de Justiça, por mais absurdo que seja, até dá para entender..."
32030-105 = "...Ora, pensando bem, por que a Hifumi-chan virou uma suspeita? Você não era próxima da Nagisa-san?"
32030-106 = "Quê?! E-Eu também sou mesmo uma suspeita...?!"
32030-107 = "É-É verdade que parecia que tínhamos uma boa amizade, mas... p-por que logo eu...?"
32030-108 = "[s] \"......\""
32030-111 = "...De qualquer forma, talvez seja melhor eu conversar um pouco mais com a Azusa-chan depois. Também vou verificar algumas outras coisas por minha conta."
32030-112 = "Sim. Se descobrir alguma coisa, eu ficaria muito feliz se pudesse nos contar."
32030-113 = "Combinado. Quer dizer então que eu também tenho permissão para participar destes encontros secretos na madrugada? Ufufu, que alegria♡"
32030-114 = "Três pessoas juntinhas em um quarto fechado no meio da madrugada para uma brincadeira secreta... Meu coração não para de palpitar♡"
32030-115 = "E-Esse jeito de falar é meio..."
32030-116 = "[s] \"Bom, já está tarde, que tal irmos dormir?\""
32030-117 = "Sim, então até amanhã."
32030-118 = "Tem razão, boa noite."
32030-121 = "Hmm... banheiro..."
32030-125 = "Ué... o quarto do Sensei? Acordado até uma hora dessas..."
32030-129 = "Bom, Sensei, muito obriga... Ué?"
32030-130 = "...!?"
32030-131 = "H-Hifumi?! O-O que você está fazendo no quarto do Sensei...?!"
32030-132 = "Fufu. Bom, já estou ansiosa pelo nosso próximo encontro secreto noturno..."
32030-133 = "...Ora?"
32030-134 = "...?!"
32030-139 = "A-A três...?! Idiotas, tarados! Bando de depravados!!"
32030-141 = "(E assim, mais um novo dia estava prestes a começar.)"
32030-143 = "Próximo;Festa de Maiô"
