[translation]
10018080-1 = "Эпизод 8; Я же велела избавиться от проблемы..."
10018080-2 = ""
10018080-3 = ""
10018080-4 = "Как вы умудрились вернуться ещё с большим количеством проблем?!"
10018080-5 = ""
10018080-7 = ""
10018080-8 = "Пожалуйста, не нужно кричать, Фуука."
10018080-9 = "И не вздумай говорить мне успокоиться!"
10018080-10 = "К... кулинарное соревнование?"
10018080-11 = "Против Няо Фудс? А судить будут члены Гильдии торговцев?"
10018080-12 = "...Сколько нам нужно приготовить?"
10018080-13 = "Сто наборов."
10018080-14 = "Как вы знаете, осэти подают в нескольких коробочках с гарнирами, сложенных друг на друга."
10018080-15 = "Обычно один такой набор делят три-четыре человека."
10018080-16 = "Так что это всего лишь простой заказ еды на четыреста человек. ★"
10018080-18 = "Кажется, я пойду вон туда и немного полежу без сознания."
10018080-19 = "Прости, Фуука, потерять сознание придётся потом."
10018080-20 = "Соревнование уже началось. Мы уже ввязались."
10018080-21 = "Нет, это вы уже ввязались!"
10018080-22 = "Это ты приняла вызов, Харуна!"
10018080-23 = "А теперь заставляешь меня со всем этим разбираться!"
10018080-24 = ""
10018080-26 = ""
10018080-27 = "..."
10018080-28 = "Прости, Фуука."
10018080-29 = ""
10018080-31 = ""
10018080-32 = "А-А?"
10018080-33 = "[ns] «Харуна извинилась?!»"
10018080-34 = "Я не просто люблю есть вкусную еду — я люблю делиться ею. Хорошую еду ценят все без исключения."
10018080-35 = "Именно поэтому я не могу оставить Няо Фудс в покое."
10018080-36 = "Если всё будет по-ихнему, кроме их безвкусных продуктов есть будет нечего."
10018080-38 = "Я этого не хочу. Не хочу видеть, как исчезает «Воробей»."
10018080-39 = "И не хочу бездействовать, пока людей лишают одного из универсальных удовольствий жизни — вкусной еды."
10018080-40 = "То есть ты приняла вызов ради людей здесь?"
10018080-41 = "Именно."
10018080-42 = "И хочешь, чтобы я помогла?"
10018080-43 = "Да, это я тоже говорю."
10018080-44 = "...А если я откажусь? Что тогда?"
10018080-45 = ""
10018080-47 = ""
10018080-48 = "Как я уже сказала, я не стану бездействовать. Что-нибудь придумаем."
10018080-49 = "[s] «Это вообще возможно?»"
10018080-50 = "То, буду я что-то делать или нет, не зависит от того, возможно это или нет."
10018080-51 = "Принимая вызов Няо Фудс, я знала о рисках."
10018080-52 = "Вероятность провала и насмешек высока."
10018080-53 = "Но никто не знает будущего, а страх перед ним не подавит мою любовь к гастрономии."
10018080-54 = "...Говоришь так, но если реально проиграешь, будешь хандрить неделями."
10018080-55 = ""
10018080-57 = ""
10018080-58 = "?!"
10018080-59 = ""
10018080-61 = ""
10018080-63 = "Ладно, я помогу."
10018080-65 = "Фуука?!"
10018080-66 = "Я и так чувствовала, что ты во что-нибудь меня втянeшь. К тому же ты не единственная, кто не хочет исчезновения «Воробья»."
10018080-67 = "[s] «...Знаю, для альтернатив уже поздновато, но разве правда нет другого способа?»"
10018080-68 = "Скажу честно, Сенсей."
10018080-69 = "Готовка в какой-то мере — битва капиталов."
10018080-70 = "В домашней еде главное — вкус, а ресторану приходится балансировать между вкусом и бизнесом."
10018080-71 = "Конечно, есть рестораны, которые вообще не пытаются соблюдать баланс и думают только о бизнесе."
10018080-72 = "Каждый раз, когда вижу такое заведение, мне хочется перекрыть кран."
10018080-73 = "Кран?"
10018080-74 = "Если бы вы увидели переполненную раковину, а вода всё ещё текла, что бы вы сделали?"
10018080-75 = "Эм, перекрыл бы воду?"
10018080-76 = "Вот такое желание у меня появляется, когда я вижу ресторан, где цена выше качества еды."
10018080-77 = "...Краны обычно перекрывать проще..."
10018080-78 = "В любом случае."
10018080-79 = "В обычных условиях «Воробью» почти невозможно конкурировать с Няо Фудс."
10018080-80 = "Лишь благодаря условиям соревнования он временно может выступать на равных."
10018080-82 = "Разве не с этого объяснения стоило начать?"
10018080-83 = "Как бы то ни было, кризис — это просто возможность, поставленная задом наперёд."
10018080-84 = "Так что давайте просто включим заднюю, победим и получим всё, чего хотим."
10018080-85 = "Я ни секунды не сомневаюсь в нашей предстоящей победе."
10018080-86 = "Пожалуйста, никогда не начинай играть в азартные игры, Харуна."
10018080-87 = "С чего бы мне вообще этим заниматься?"
10018080-88 = "Азартные игры только отвлекали бы от гастрономии."
10018080-89 = "Это успокаивает..."
10018080-90 = ""
10018080-92 = ""
10018080-94 = "Четыреста человек..."
10018080-95 = "Я никогда не готовила столько за один раз..."
10018080-96 = "Вот для этого здесь и Фуука. ★"
10018080-97 = "Ты думаешь, я какой-то волшебный автомат желаний?!"
10018080-98 = "К тому же каждый раз, когда я готовлю большими объёмами, обязательно случается какая-нибудь авария..."
10018080-99 = "Не переживай, именно тут в дело вступает Общество гурманов."
10018080-100 = "Как?"
10018080-101 = "Мы заметим разницу даже между лишней чайной ложкой сахара и недостающей каплей соевого соуса. Дегустацию берём на себя."
10018080-102 = ""
10018080-104 = ""
10018080-106 = "Так вы просто будете есть!"
10018080-109 = "Значит, это Няо Фудс выкупила все овощи..."
10018080-110 = "Простите. Надеюсь, вы понимаете."
10018080-111 = "У вас не было выбора. Не переживайте."
10018080-112 = "Ингредиенты, которые купила Няо Фудс, вернули, так что теперь они доступны."
10018080-113 = "Соревнование между «Воробьём» и Няо Фудс на одинаковых ингредиентах..."
10018080-114 = "Жду с нетерпением. Удачи."
10018080-115 = ""
10018080-117 = ""
10018080-118 = ""
10018080-119 = "Эм, с ингредиентами проблема..."
10018080-120 = "Что случилось?"
10018080-121 = ""
10018080-124 = "Вот как."
10018080-125 = "Они раздавлены. Примерно треть придётся выбросить."
10018080-126 = "Это катастрофа. Их никак не должны были настолько плохо упаковать..."
10018080-127 = ""
10018080-129 = ""
10018080-130 = "Но по правилам соревнования мы не можем использовать другие ингредиенты..."
10018080-131 = ""
10018080-133 = ""
10018080-135 = ""
10018080-136 = "Похоже, операция «Испортить ингредиенты, специально доставив их небезопасным способом» прошла успешно."
10018080-137 = "Хорошо. Оставайтесь на связи. И ещё надо бы поработать над названиями этих операций."
10018080-138 = ""
10018080-140 = ""
10018080-144 = "Что с этими ингредиентами?!"
10018080-145 = "Они всего несколько дней пролежали в штаб-квартире Няо Фудс."
10018080-146 = "Выглядят так, будто провели там месяц!"
10018080-147 = "Не могу поверить. Они практически испортились..."
10018080-148 = "Что будем делать?!"
10018080-149 = "Если Няо Фудс использует те же ингредиенты, соревнование останется честным..."
10018080-150 = "Но у меня есть чувство, что они этого не сделают."
10018080-151 = ""
10018080-153 = ""
10018080-155 = "Сработало. Доложите начальству."
10018080-156 = "Операция «Ускорить порчу ингредиентов неисправным хранилищем» успешно завершена."
10018080-159 = ""
10018080-160 = "Я думала, что хотя бы приправы будут в порядке..."
10018080-161 = "Я хотела бы извиниться."
10018080-162 = "После того как я отправляю товар, он уже мне не принадлежит, но..."
10018080-163 = ""
10018080-166 = "И всё же я не ожидала, что все бутылки окажутся треснутыми..."
10018080-167 = "Компания по поставкам продуктов, которая не умеет нормально их перевозить... Возмутительно."
10018080-168 = "Спасибо, что говорите это..."
10018080-171 = "Похоже, ингредиенты мы всё-таки собрали..."
10018080-172 = "Ага..."
10018080-173 = "По условиям соревнования можно использовать только ингредиенты, полученные на этой улице..."
10018080-174 = ""
10018080-176 = ""
10018080-178 = ""
10018080-179 = "Но так саботировать поставки..."
10018080-180 = "Понятия не имею, о чём думает Няо Фудс..."
10018080-181 = ""
10018080-183 = ""
10018080-184 = "...а я думаю, как заставить их за это заплатить. ★"
