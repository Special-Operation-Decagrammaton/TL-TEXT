[translation]
2004903-1 = "Замки из песка — это совсем не весело"
2004903-3 = ""
2004903-4 = "...А, Сенсей."
2004903-5 = "Хм? Знала ли я, что ты будешь здесь?"
2004903-6 = "Ну, об этом и было сообщение в MomoTalk."
2004903-7 = "Только не пытайся снова уговорить меня плавать."
2004903-8 = "[s1] «А как насчёт замков из песка? Это весело.»\n[s2] «Давай вместе построим песчаный замок. Ты и я.»"
2004903-10 = "Ух, теперь ты хочешь уговорить меня на что-то другое."
2004903-11 = "В этот раз не получится."
2004903-12 = "Какой вообще смысл в замке из песка?"
2004903-13 = "Зачем строить что-то, если заранее знаешь, что оно всё равно развалится?"
2004903-14 = "Но если ТЫ хочешь построить — пожалуйста."
2004903-15 = "Делай что хочешь."
2004903-16 = "[ns] Начать строить песчаный замок рядом с ней."
2004903-18 = "..."
2004903-19 = "..."
2004903-20 = "[s] «Хм-м, он всё время разваливается...»"
2004903-21 = "Это не песчаный замок, а куча песка! Нужно полить его водой, чтобы придать форму и чтобы он держался."
2004903-22 = ""
2004903-24 = ""
2004903-25 = "Дай сюда."
2004903-26 = "Сначала намочи песок водой, сложи его в ведёрко и переверни..."
2004903-27 = "Видишь, теперь есть форма."
2004903-28 = "Теперь воткни сюда палочку, а потом можно выкопать ров..."
2004903-31 = "― [log=미사키 수영복]Хм...[/log][wa:510]"
2004903-33 = "― [log=미사키 수영복]Ещё немного... И здесь тоже выкопать...[/log][wa:1080]"
2004903-36 = "― [log=미사키 수영복]А эту палочку... можно поставить вот сюда...[/log][wa:3040]"
2004903-38 = "― [log=미사키 수영복]...Хм, думаю, так сойдёт.[/log][wa:2060]"
2004903-41 = "― [log=미사키 수영복]Погоди...[/log][wa:1800]"
2004903-43 = "― [log=미사키 수영복]Почему это Я его строю...?[/log][wa:2250]"
2004903-46 = "― [log=미사키 수영복]...Ух! Сенсей...![/log][wa:1770]"
2004903-49 = "[ns] «Не обращай на меня внимания. Я просто смотрю.»"
2004903-50 = "― [log=미사키 수영복]Так вот каким был твой план с самого начала...! [/log][wa:840]"
2004903-53 = "― [log=미사키 수영복]...И не думай, что мне это нравится. Совсем нет![/log][wa:3060]"
2004903-56 = ""
2004903-57 = "[ns3] «Но всё же, что скажешь?»\n[ns4] «Ну, у тебя отлично получается.»"
2004903-60 = "О, мне всё равно. В итоге всё это бессмысленно."
2004903-61 = "И не то чтобы я вложила в него много сил."
2004903-62 = ""
2004903-64 = ""
2004903-65 = "Ну, НЕМНОГО сил. И, наверное, это всё-таки стоило того, чт..."
2004903-66 = ""
2004903-68 = "[ns] «А вот и всё, его смыло в море.»"
2004903-69 = "..."
2004903-70 = "[s] «Ничего не осталось.»"
2004903-71 = "...Как я и говорила, бессмысленно."
2004903-72 = "Любые вложенные усилия просто пропадают зря."
2004903-73 = "Из песка в песок — вот и всё."
2004903-74 = "Как в истории о человеке, который снова и снова толкает валун в гору."
2004903-75 = "[s5] «Но кое-что мы всё-таки получили.»\n[s6] «У нас осталась фотография...»"
2004903-78 = "Фотография? Какая фотография?"
2004903-79 = "Посмотреть самой? Что?"
2004903-80 = "*ахает*"
2004903-81 = "Когда ты успел это снять...?"
2004903-82 = "[s] «Твои старания заслуживают того, чтобы их запомнили!»"
2004903-83 = ""
2004903-85 = ""
2004903-86 = "Удали."
2004903-87 = "Сейчас же."
