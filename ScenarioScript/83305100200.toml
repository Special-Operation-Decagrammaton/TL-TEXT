[translation]
83305100200-5 = "Здравствуйте, глава префектов!"
83305100200-6 = "Ако. Я попросила тебя прийти, потому что хочу кое о чём попросить."
83305100200-7 = "Попросить...?"
83305100200-8 = "Я хочу полностью сосредоточиться на своём выступлении на пианино."
83305100200-9 = "Хочу вложить в него все силы. Поэтому..."
83305100200-10 = "Конечно, глава префектов. Сегодня утром я возьму ваши обязанности на себя."
83305100200-11 = "Ако..."
83305100200-12 = "Старший администратор должна изо всех сил поддерживать главу префектов."
83305100200-13 = "Именно так я, Амау Ако, приношу пользу. Поэтому оставьте всё мне."
83305100200-14 = "...Спасибо, Ако."
83305100200-15 = "Как и Сенсей, я тоже... В общем, я тоже буду там."
83305100200-16 = "...Спасибо. Скоро увидимся."
