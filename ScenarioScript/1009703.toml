[translation]
1009703-1 = "Опасность совсем рядом"
1009703-2 = "Получив сообщение Моэ, я прибежал, чтобы остановить взрыв."
1009703-3 = ""
1009703-6 = ""
1009703-7 = "[ns] «Моэ, ты в порядке?!»"
1009703-8 = "Сенсей. Не думала, что вы доберётесь так быстро."
1009703-9 = "Вы всю дорогу бежали? Совсем запыхались..."
1009703-10 = "[s1] «Конечно! Могло случиться что-то опасное!»\n[s2] «Неважно, что со мной. Что со взрывом?»"
1009703-13 = "Взрыв...?"
1009703-14 = "А, вы меня неправильно поняли."
1009703-15 = "Взрыв ещё не начался. Точнее... он сейчас в процессе."
1009703-16 = "[s] «В процессе? Где...?»"
1009703-17 = ""
1009703-20 = "[ns] «Что взрывается?!»"
1009703-21 = "А, этот звук..."
1009703-22 = "Моллюски вкуснее всего, если жарить их на сильном огне!"
1009703-23 = "[s] «Моллюски...?»"
1009703-24 = "Ага, я жарила моллюсков на углях."
1009703-25 = "Днём я сходила к причалу и помогла местным очистить его от ракушек. В «благодарность» они дали мне целую кучу моллюсков."
1009703-26 = "Свежие моллюски вкусны и варёными, и в супе, но для любых морепродуктов лучше всего сильный огонь!"
1009703-27 = "К тому же, если готовить их так, иногда они с громким «хлоп» взрываются..."
1009703-28 = "Готовить из ингредиентов, которые могут взорваться в любой момент? Вот это азарт! *тяжело дышит* *тяжело дышит*"
1009703-29 = "[s] «Так вот о каком взрыве ты говорила...»"
1009703-30 = ""
1009703-33 = "[ns3] «Вообще-то их можно приготовить и без взрыва.»\n[ns4] «Если уменьшить огонь, они медленно раскроются!»"
1009703-36 = "Пф, о чём вы вообще говорите?"
1009703-37 = "Готовить моллюсков на слабом огне? Кто так делает, Сенсей?"
1009703-38 = "Да, если они будут раскрываться медленно, то не взорвутся, но вся влага испарится, и мясо станет ужасно жёстким!"
1009703-39 = "Если бояться маленького взрыва, настоящего впечатления не получишь."
1009703-40 = "Без «бум» это уже невкусно!"
1009703-41 = "[s5] «Как ни странно, звучит убедительно...»\n[s6] «(Как будто я уже слышал нечто похожее, но смысл совсем другой...)»"
1009703-44 = "Пока мы разговаривали, моллюски доготовились."
1009703-45 = "Вот, Сенсей, попробуйте. Даже приправы не нужны — внутрь уже попала морская вода."
1009703-46 = "[s7] «Ого, ты права!»\n[s8] «Свежие, соли ровно сколько надо... Идеально!»"
1009703-49 = "Хи-хи, правда?"
1009703-50 = "Они настолько свежие, что лучше вообще ничего не добавлять и просто наслаждаться естественным вкусом."
1009703-51 = "[s9] «Но одни моллюски — немного скучновато...»\n[s10] «У тебя есть ещё что-нибудь?»"
1009703-54 = "Вообще-то я принесла кое-что ещё на десерт..."
1009703-55 = "Это... замороженные моти!"
1009703-56 = "[s] «Замороженные моти...?»"
1009703-57 = "Ага, местные заморозили моти и отдали мне остатки..."
1009703-58 = "Ого, они все покрыты инеем. Наверное, их заморозили ещё влажными."
1009703-59 = ""
1009703-61 = ""
1009703-62 = "Но если положить их на сильный огонь..."
1009703-63 = "[s] «Стой, Моэ! Не надо!»"
1009703-65 = ""
1009703-70 = "О-о... О-о-о..."
1009703-71 = "Замороженные моти раздуваются... и лопаются, разбрасывая кусочки будто осколки гранаты..."
1009703-72 = ""
1009703-75 = "А вместе со взрывающимися моллюсками..."
1009703-76 = "*тяжело дышит* *тяжело дышит* Вот оно...!"
1009703-77 = "Аромат разрушения, поднимающийся над углями...!"
1009703-78 = "[s] «Это запах моллюсков и моти!»"
1009703-80 = "После этого мы с Моэ устроили довольно хаотичную трапезу, всё время уворачиваясь от взрывающихся моллюсков и моти."
