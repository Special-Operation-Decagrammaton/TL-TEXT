[translation]
90101030-1 = "Эпизод 3;Краб и бочка"
90101030-2 = "Исполнительный офис Генерального ученического совета"
90101030-3 = ""
90101030-4 = "...Краб, говорите?"
90101030-5 = ""
90101030-7 = ""
90101030-8 = ""
90101030-9 = "Да. Крабы. Те самые, с твёрдым панцирем, широко посаженными глазами и щёлкающими клешнями?"
90101030-10 = "Ты когда-нибудь видела живого краба, Юкино?"
90101030-11 = "Видела."
90101030-12 = "Во время летних тренировок мы проходили через илистые отмели. Я часто видела, как крабы группами сновали по грязи."
90101030-13 = "Илистые отмели? Звучит интересно."
90101030-14 = "Я так занята Генеральным студенческим советом... даже не помню, когда в последний раз была на пляже."
90101030-15 = "Звучит тяжело."
90101030-16 = "Но почему вы вдруг заговорили о крабах? Я думала, мы обсуждаем дела о пропавших людях."
90101030-17 = ""
90101030-19 = ""
90101030-20 = "Ну, Юкино... они связаны. Эти ракообразные — главные подозреваемые в исчезновениях."
90101030-21 = "Не понимаю..."
90101030-23 = "В районе порта Канэсаки пропадает всё больше людей."
90101030-24 = "Мы не можем понять, обычные ли это несчастные случаи с падением в воду, сознательное исчезновение людей или... что-то ещё."
90101030-25 = "Несколько человек написали в сети, что видели в порту печально известных крабов из бочки."
90101030-26 = ""
90101030-27 = "Юкино."
90101030-28 = "Отряд FOX сможет это расследовать? Я хочу знать всё, что вы сможете найти о крабах из бочки."
90101030-30 = "[ns] «...'Крабы из бочки'?»"
90101030-31 = "Да. Всё началось с жуткой городской легенды. Представь нефтяную бочку, набитую сотнями копошащихся крабов."
90101030-32 = "Говорят, крабы внутри настолько свирепые и голодные, что способны обглодать мясо с костей... а потом разгрызть и САМИ кости."
90101030-33 = "...Большинство слухов, связанных с крабами из бочки, тоже довольно просты."
90101030-34 = "Чаще всего говорят, что недовольные рыбаки порта Канэсаки, затаив обиду, набивают бочку крабами."
90101030-35 = "Затем тащат кого-нибудь в укромное место и бросают в бочку, кишащую щёлкающими крабами..."
90101030-36 = "И жертва исчезает без следа."
90101030-37 = "[s1] «Какая жуткая городская легенда...»\n[s2] «Эти крабы правда существуют?»"
90101030-40 = "Сенсей, вы серьёзно?"
90101030-41 = "Обычный краб даже поцарапать человека толком не может, не то что серьёзно навредить."
90101030-42 = "Крабы не охотники, а падальщики. Клешнями они рвут мёртвую рыбу и собирают водоросли."
90101030-43 = "К тому же панцири крабов тоньше и хрупче, чем кажется!"
90101030-44 = "Их панцирь просто не может стать слишком толстым, потому что им нужно линять. Он буквально не рассчитан на вечность!"
90101030-45 = "Это было бы мерзко, но краба можно раздавить обычным ударом. Если человек в бочке начнёт вырываться, первыми расплющит именно крабов, как каких-нибудь жуков."
90101030-46 = "Их клешни относительно твёрдые, но человеческие кости прочнее."
90101030-47 = "Обычный краб вырастает максимум примерно до 25 см. Если нужен краб с клешнями, способными дробить кости..."
90101030-48 = "Я бы сказала, он должен быть хотя бы метров пять длиной."
90101030-49 = "Нет, и это сомнительно. Скорее, минимум метров двадцать в ширину."
90101030-50 = "[s] «Это, конечно, успокаивает...»"
90101030-51 = ""
90101030-52 = ""
90101030-53 = ""
90101030-54 = "[ns] «Откуда ты столько знаешь о крабах?»"
90101030-55 = "На одной морской спасательной операции я познакомилась с человеком. У нас было много времени поговорить."
90101030-56 = "А у меня знания из практики. В конце концов, краб — очень вкусный ингредиент!"
90101030-57 = "Я работала под прикрытием в суши-ресторане. Шеф с радостью делился знаниями."
90101030-58 = "Даже если мы не имеем дело с гигантским крабом, нападающим на людей, очевидно, что кто-то распространяет эти слухи."
90101030-59 = "Также ясно, что в порту Канэсаки действительно пропадали люди. Общественность узнала об этом, связала два события и поверила в историю с крабами."
90101030-60 = "И что? Зачем кому-то распространять настолько халтурную городскую легенду? Стоит подумать пару секунд — и ясно, что это невозможно."
90101030-61 = "Они пытаются свалить свои преступления на краба или что?"
90101030-62 = "Никому не хочется иметь дело с крабом-монстром, который нападает на людей. Если кто-то решит воспользоваться этим страхом..."
90101030-63 = ""
90101030-65 = ""
90101030-66 = "А что, если кто-то манипулирует рынком? Пытается обвалить цены на крабов, выставив их страшными и неаппетитными?"
90101030-67 = "Начнём расследование с торговцев, которые выигрывают от падения цен."
90101030-68 = ""
90101030-70 = "Ну, заметных недавних колебаний цен на крабов я не вижу..."
90101030-71 = "Может, потому что слух ещё не успел широко разойтись."
90101030-72 = "Уф... Слабая версия."
90101030-73 = "[s] «...Для вывода этого точно недостаточно.»"
90101030-74 = "Да. Сидя в кресле, многого не выведешь."
90101030-75 = "В таких обстоятельствах вместо диких догадок..."
90101030-76 = "Нужно тщательно собирать информацию. Вы это имели в виду?"
90101030-77 = ""
90101030-79 = ""
90101030-80 = "...Да."
90101030-81 = "Наша цель: D.U., город Ширатори, 4-я авеню, порт Канэсаки."
90101030-82 = "Подозреваемые: все, кто связан с крабовым промыслом."
90101030-83 = "Сначала эстакада, теперь расследуем порт..."
90101030-84 = "По крайней мере, здесь должно быть достаточно тени. Мне надоело переживать о тепловом ударе."
90101030-85 = ""
90101030-87 = ""
90101030-88 = ""
90101030-89 = ""
90101030-90 = "Приготовьтесь, отряд FOX. Расследование начинается."
90101030-92 = "Следующий эпизод;Люди порта 1"
