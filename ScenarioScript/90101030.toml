[translation]
90101030-1 = "Episódio 3;Caranguejos e Tambores de Óleo"
90101030-2 = "Gabinete da Presidente do Conselho Estudantil Federal"
90101030-3 = ""
90101030-4 = "...Caranguejo, a senhora disse?"
90101030-5 = ""
90101030-7 = ""
90101030-8 = ""
90101030-9 = "Sim, caranguejos."
90101030-10 = "Você já viu um caranguejo vivo de perto?"
90101030-11 = "Já, sim."
90101030-12 = "Durante o treinamento tático de verão, nos manguezais e bancos de areia da costa."
90101030-13 = "Manguezais... que agradável."
90101030-14 = "Faz tanto tempo que não vou à praia no verão que... já nem consigo recordar a sensação."
90101030-15 = "Sua rotina deve ser bastante atarefada."
90101030-16 = "Mas perdoe a pergunta... que relação caranguejos teriam com os casos de desaparecimento?"
90101030-17 = ""
90101030-19 = ""
90101030-20 = "Há rumores de que o autor dos sumiços... seria um caranguejo."
90101030-21 = "...Como?"
90101030-23 = "Recentemente, várias pessoas desapareceram sem deixar rastro nos arredores do Porto de Kanezaki."
90101030-24 = "Se foram fugas voluntárias, acidentes ou sequestros... até o momento não conseguimos determinar as causas."
90101030-25 = "Contudo, certos depoimentos começaram a circular com força nas redes sociais: #nrelatam ter avistado um \"Caranguejo de Tambor de Óleo\" perto dos locais dos sumiços."
90101030-26 = ""
90101030-27 = "Yukino."
90101030-28 = "Poderia assumir a investigação sobre esse \"Caranguejo de Tambor de Óleo\"?"
90101030-30 = "[ns] \"...Caranguejo de Tambor de Óleo?\""
90101030-31 = "Sim. Dizem que há tambores de óleo imensos abarrotados de caranguejos até a boca."
90101030-32 = "Os bichos seriam extremamente agressivos e famintos... Ao jogar um peixe lá dentro, devoram a carcaça em segundos."
90101030-33 = "...E os boatos que surgiram a partir disso são ainda mais macabros."
90101030-34 = "Dizem que quando alguém no Porto de Kanezaki quer se vingar de um desafeto, encomenda um \"tambor com caranguejos\"."
90101030-35 = "Atraem o alvo para um galpão deserto, jogam a pessoa dentro do tambor para ser [ruby=・]d[/ruby][ruby=・]e[/ruby][ruby=・]v[/ruby][ruby=・]o[/ruby][ruby=・]r[/ruby][ruby=・]a[/ruby][ruby=・]d[/ruby][ruby=・]a[/ruby]—"
90101030-36 = "E assim se livram do corpo sem sujar as próprias mãos, tratando o caso como mero desaparecimento."
90101030-37 = "[s1] \"...Que história sinistra.\"\n[s2] \"Será que existe mesmo um caranguejo tão feroz assim?\""
90101030-40 = "Qual é, não dá pra levar uma palhaçada dessas a sério!"
90101030-41 = "Estamos falando de caranguejo, gente! Mal conseguem beliscar um dedo direito."
90101030-42 = "Pra começar, caranguejos são animais [ruby=necrófagos]saprófagos[/ruby]. #nEles se alimentam de peixe morto e algas marinhas em decomposição."
90101030-43 = "Além disso, a carapaça de um caranguejo é extremamente fina e frágil..."
90101030-44 = "Como eles trocam de casca periodicamente pela ecdise, a espessura da carapaça tem um limite biológico."
90101030-45 = "Se alguém se debatesse dentro de um tambor de óleo, quem seria esmagado primeiro seriam os próprios caranguejos."
90101030-46 = "As pinças deles são até durinhas, mas daquele tamanho não têm força nenhuma."
90101030-47 = "Pra ter uma pinça capaz de estraçalhar ossos humanos—"
90101030-48 = "O bicho precisaria ter no mínimo uns 5 metros de comprimento, né?"
90101030-49 = "...Não, muito mais. Menos de 20 metros nem faria cócegas."
90101030-50 = "[s] \"Fico um pouco mais aliviado ouvindo isso, mas...\""
90101030-51 = ""
90101030-52 = ""
90101030-53 = ""
90101030-54 = "[ns] \"Como é que vocês entendem tanto de caranguejo?\""
90101030-55 = "Eu aprendi com uma colega que participou de missões de resgate costeiro."
90101030-56 = "Eu cozinhava frutos do mar de vez em quando no QG..."
90101030-57 = "E eu aprendi quando me infiltrei disfarçada num restaurante de sushi!"
90101030-58 = "Mesmo que não passe de lenda urbana, é fato que alguém está se aproveitando desse conto."
90101030-59 = "Afinal, os sumiços no Porto de Kanezaki são reais e a população está em pânico."
90101030-60 = "Mas bastaria uma pesquisa de dois minutos pra desmascarar a mentira. #nQuem ganharia o que espalhando um boato tão tosco?"
90101030-61 = "Como cortina de fumaça pra encobrir crimes é uma ideia convoluta demais..."
90101030-62 = "Mas a frase \"caranguejo monstro comedor de gente\" soa bem aterrorizante. #nSe alguém quisesse tirar proveito disso—"
90101030-63 = ""
90101030-65 = ""
90101030-66 = "Não seria pra queimar o filme do caranguejo e forçar o preço de mercado lá pra baixo?"
90101030-67 = "Se investigarmos os atravessadores que tão comprando a preço de banana quando o preço despenca—"
90101030-68 = ""
90101030-70 = "...Pelo que consultei nos registros de bolsa de alimentos, o preço e o volume de circulação de caranguejo continuam estáveis."
90101030-71 = "Talvez o boato ainda não tenha chegado ao grande público."
90101030-72 = "Hum... não faz sentido nenhum."
90101030-73 = "[s] \"...Ainda nos faltam dados concretos.\""
90101030-74 = "Exato. Fazer deduções na prancheta tem seus limites."
90101030-75 = "Num momento desses, em vez de acumular suposições—"
90101030-76 = "O melhor é meter a mão na massa e coletar informações em campo, não é?"
90101030-77 = ""
90101030-79 = ""
90101030-80 = "...Correto."
90101030-81 = "Nosso destino é o Porto de Kanezaki, localizado na 4ª Avenida do Distrito Shiratori do D.U."
90101030-82 = "Alvo da investigação: todos os trabalhadores envolvidos na pesca de caranguejos."
90101030-83 = "Depois da rodovia expressa, agora vamos patrulhar as docas~"
90101030-84 = "Pelo menos lá tem bastante sombra de galpão, não vamos ter risco de insolação."
90101030-85 = ""
90101030-87 = ""
90101030-88 = ""
90101030-89 = ""
90101030-90 = "Esquadrão FOX. A partir deste momento, iniciamos a ronda de interrogatórios."
90101030-92 = "A Seguir;Gente do Porto (1)"
