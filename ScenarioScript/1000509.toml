[translation]
1000509-1 = "День в аквариуме!"
1000509-2 = "Вход в аквариум"
1000509-3 = "Ух ты! Так вот какой он, аквариум."
1000509-4 = "Для такой старомодной деревенщины, как я, подобные места совершенно непривычны."
1000509-5 = "Смотрите, я взяла буклет."
1000509-6 = "Здесь есть выставка тропических рыб, глубоководных рыб и даже кормление вживую!"
1000509-7 = "Хм, ещё шоу дельфинов... и вольер с пингвинами. Наверное, там поддерживают холод, да?"
1000509-8 = "Смотрите, Сенсей! Подводный тоннель!"
1000509-9 = "У них даже китовая акула! Подождите, технически она кит или акула?"
1000509-10 = "Как думаете, мы успеем сегодня посмотреть всё? Я хотя бы хочу попробовать."
1000509-11 = "Куда пойдём сначала?"
1000509-13 = "Мы осмотрели выставки тропических и глубоководных рыб, а затем добрались до подводного тоннеля."
1000509-16 = "— Это кит?"
1000509-20 = "― Ух ты... Невероятно. Я никогда раньше не бывала в таком месте.[wa:2280]"
1000509-23 = "— Смотрите! Рыбка! Ха-ха-ха, какая милая![wa:1940]"
1000509-26 = "― ..."
1000509-29 = "— Ничего, что только я так сильно радуюсь...?[wa:400]"
1000509-32 = "— Не стоит об этом переживать? Хорошо.[wa:3720]"
1000509-35 = "После этого мы обошли весь аквариум: кормление, выставку медуз, морских черепах и магазин сувениров. День вышел действительно весёлым."
1000509-37 = "Фух. Это было так весело."
1000509-38 = "Кормить удильщиков было ужасно забавно. Ха-ха. У них такие огромные рты."
1000509-39 = "И то, как медузы светятся в темноте, тоже очень красиво. От их неонового свечения у меня даже немного закружилась голова."
1000509-40 = "О, а ещё подводный тоннель! Он был просто...! *вздох*"
1000509-41 = "Я ещё и кучу сувениров купила. Хе-хе."
1000509-42 = "После всего этого я совсем вымоталась. Наверное, отключусь сразу, как только доберусь домой."
1000509-43 = "[s1] «Только не проспи.»\n[s2] «Не забывай, завтра в школу.»"
1000509-44 = "Хех. Я приду вовремя. Не переживайте, Сенсей!"
1000509-45 = "Хех. Я приду вовремя. Не переживайте, Сенсей!"
1000509-46 = "Готовы возвращаться? Жалко, что сегодня мы так и не успели посмотреть абсолютно всё."
1000509-47 = "Но всегда будет следующий раз, правда?"
1000509-48 = "[s3] «Конечно.»\n[s4] «Мы обязательно вернёмся.»"
1000509-49 = ""
1000509-50 = ""
1000509-51 = "Хех, в следующий раз уже я вас приглашу. Вот увидите, Сенсей!"
1000509-53 = "После этого я проводил Хошино домой. Она устала, но была счастлива."
