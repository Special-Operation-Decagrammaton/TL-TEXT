[translation]
12190-1 = "Эпизод 19;Не отпуская. Часть 2"
12190-2 = "Я подтвердила местоположение Хошино!"
12190-3 = "Вон там! Она в том бункере!"
12190-4 = "Там..."
12190-5 = "Вперёд!"
12190-6 = ""
12190-7 = ""
12190-9 = ""
12190-10 = "Это директор Кайзер!"
12190-11 = "Кто-то очень настойчивый."
12190-12 = "Серьёзно... Сколько ещё раз ты собираешься вставать у нас на пути?!"
12190-13 = "Пожалуйста, отойдите! Иначе...!"
12190-14 = ""
12190-15 = "Вы стали настоящей занозой в моём боку, Комиссия по взысканию долгов."
12190-16 = "Что бы я ни делал, чтобы стереть остатки этой школы!"
12190-17 = "И всё же вы отказались уйти. Цеплялись за это тонущую развалину и отчаянно отгрызали долг по кусочку!"
12190-18 = "Я мучил вас всеми мыслимыми способами, а вы всё равно проводите дни, смеясь и улыбаясь так, будто вас ничего не волнует!"
12190-19 = "*цок* Из-за вас... мои планы...!"
12190-20 = ""
12190-22 = "Ты всерьёз пытался запугать кучку девчонок, чтобы они отказались от своей школы... Насколько же низко может пасть такой слизняк, как ты?!"
12190-23 = "Ты обманул Хошино. Обманул всех нас. Но второй раз мы на это не попадёмся."
12190-24 = "Точно! Мы не проиграем такому жалкому подобию взрослого. Ни сейчас, ни когда-либо!"
12190-25 = ""
12190-26 = ""
12190-27 = ""
12190-28 = "Сенсей! Пожалуйста, ведите нас в последний бой!"
