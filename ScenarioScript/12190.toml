[translation]
12190-1 = "Episódio 19;O Que Mesmo Assim Não Deixamos Ir (2)"
12190-2 = "Consegui confirmar a posição da Hoshino-senpai!"
12190-3 = "É ali, no subsolo daquele bunker!"
12190-4 = "...Vamos."
12190-5 = "Sim, vamos nos apressar...!"
12190-10 = "O diretor da Kaiser...!!"
12190-11 = "Que persistente..."
12190-12 = "Ah, qual é! Até quando você vai ficar atrapalhando a gente?!"
12190-13 = "Saia da frente! Caso contrário...!"
12190-15 = "Comitê de Contramedidas... Vocês sempre foram um estorvo para mim."
12190-16 = "Até hoje, eu recorri a todo e qualquer meio possível..."
12190-17 = "Mesmo assim, vocês ficaram até o fim nessa escola à beira da ruína, insistindo teimosamente em tentar pagar a dívida de qualquer jeito!"
12190-18 = "Mesmo depois de castigá-las tanto, de fazê-las sofrer sem piedade, vocês continuavam parecendo se divertir todos os santos dias!!!"
12190-19 = "Por culpa de vocês, o plano!!! O meu planoooo!!!!"
12190-22 = "Hmph, não importa o que um sujeito baixo e mesquinho como você faça, você nunca vai quebrar o nosso espírito!!!"
12190-23 = "Vamos levar a Hoshino-senpai de volta."
12190-24 = "Sim! Nós não vamos perder para um adulto patético como você! De jeito nenhum!"
12190-28 = "Estamos entrando em combate... Sensei, contamos com você!"
