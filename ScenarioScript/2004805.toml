[translation]
2004805-1 = "Тайная встреча на закате"
2004805-2 = "Частный пляж"
2004805-3 = "Её сообщение в MomoTalk не давало мне покоя, поэтому я отправился искать Нагису."
2004805-4 = "Но её нигде не было."
2004805-5 = "На мои звонки и сообщения она тоже не отвечала."
2004805-6 = ""
2004805-9 = "[ns] «...Там я ещё не проверял.»"
2004805-12 = "Я пошёл по пляжной дорожке, внимательно высматривая Нагису."
2004805-13 = "Я шёл уже довольно долго..."
2004805-14 = "[ns] «А...?»"
2004805-15 = "Наконец я заметил Нагису со спины."
2004805-17 = "Дорога вдоль пляжа"
2004805-18 = "[ns] «...Нагиса?»"
2004805-19 = ""
2004805-20 = "С-Сенсей?"
2004805-21 = "Что привело тебя так далеко?"
2004805-22 = "Что? Ты всё это время искал меня?"
2004805-23 = "Я ценю это, но... я как раз думала вернуться."
2004805-24 = "[s] «Куда ты хочешь пойти?»"
2004805-25 = "...Что?"
2004805-26 = "[s] «Если ты хочешь куда-нибудь пойти, я пойду с тобой.»"
2004805-27 = "..."
2004805-28 = "Ха-ха. Ты всегда умеешь меня удивить, Сенсей."
2004805-29 = "Я думала, ты пришёл забрать сбежавшего студента, а вместо этого поможешь мне сбежать?"
2004805-30 = "Но не волнуйся."
2004805-31 = "У меня не было какого-то конкретного места на примете. Просто хотелось куда-нибудь подальше."
2004805-32 = ""
2004805-34 = ""
2004805-35 = "...Сейчас я и правда звучу как сбежавший из дома подросток, не так ли?"
2004805-36 = "[s] «Ну... В этом ты не ошибаешься.»"
2004805-37 = "Фу-фу, пожалуй, да."
2004805-38 = "..."
2004805-39 = "Сегодня последний день наших каникул."
2004805-40 = "Завтра мне придётся вернуться."
2004805-41 = "Мне придётся оставить «Наги», которая беззаботно лежит на шезлонге, и снова стать «Кирифуджи Нагисой», хозяйкой Чаепития. Вернуться к той обыденной жизни."
2004805-42 = "Наверное, именно эта неприятная мысль и заставила меня убежать."
2004805-43 = "Я просто продолжала идти на запад вслед за заходящим солнцем."
2004805-44 = "Конечно, я не могу убегать вечно. Я не могу бросить своё положение."
2004805-45 = "Все привилегии, которыми я пользуюсь, — это цена за обязанности, которые я несу."
2004805-46 = "Поэтому я и пыталась тебя успокоить."
2004805-47 = "Однако..."
2004805-48 = "Хм..."
2004805-49 = "...Неважно. Я вернусь."
2004805-50 = "Даже солнце в конце каждого дня возвращается домой."
2004805-51 = "И нам тоже пора."
2004805-52 = "[s1] «Но даже такие обыденные дни...»\n[s2] «...каждый раз приносят что-то новое, разве нет?»"
2004805-55 = ""
2004805-57 = ""
2004805-58 = "Да, ты прав."
2004805-59 = "Пожалуй, это я сама решила, что каждый день одинаков."
2004805-60 = "И если в эти обыденные дни..."
2004805-61 = "Сенсей будет время от времени навещать меня."
2004805-62 = "Одного этого уже будет..."
2004805-63 = "Фу-фу."
2004805-64 = "Пойдём домой, Сенсей."
2004805-65 = "Чтобы однажды мы смогли снова сюда вернуться."
