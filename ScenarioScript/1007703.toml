[translation]
1007703-1 = "Ничего особенного"
1007703-2 = "Разъезжая по делам, я решил сократить путь через торговый центр."
1007703-3 = ""
1007703-5 = ""
1007703-6 = "Там Ичика любовалась инструментом на витрине музыкального магазина."
1007703-7 = "...А?"
1007703-8 = "О, здравствуйте, Сенсей! Какими судьбами в наших краях?"
1007703-9 = "Вас больше интересует, что я сама здесь делаю?"
1007703-10 = "Неважно. Я просто рада снова вас видеть."
1007703-11 = "...А?"
1007703-12 = "Вы правда хотите знать, на что я смотрела?"
1007703-13 = "Ничего важного... всего лишь гитара..."
1007703-14 = "Раньше я вообще не задумывалась о том, чтобы играть. Во всяком случае, до сегодняшнего утра."
1007703-15 = "Я даже никогда не держала гитару в руках, не то что играла на ней."
1007703-16 = ""
1007703-19 = "Ахаха! Да, именно такую реакцию я и ожидала."
1007703-20 = "Я знаю, для меня это необычно, но... По дороге сюда я услышала, как кто-то играл на гитаре."
1007703-21 = "Толпу они не собирали и всё такое."
1007703-22 = "Но разве это не круто? Они нашли то, чем искренне увлечены, что любят независимо от чужого мнения."
1007703-23 = "Мне тоже захотелось понять, чем я могу по-настоящему увлечься. Поэтому я пришла сюда."
1007703-24 = "Но теперь, когда смотрю на неё..."
1007703-25 = "...Хаха."
1007703-26 = "Не уверена, что это моё. А если мне не понравится настолько, чтобы действительно тренироваться? Тогда я никогда не научусь хорошо играть."
1007703-27 = "С другой стороны, пока не попробуешь — не узнаешь, правда? Может, мне очень понравится!"
1007703-28 = "..."
1007703-29 = "Ах, кого я обманываю? Вдохновение никогда раньше меня не поражало. Почему сейчас должно?"
1007703-30 = "Кроме того..."
1007703-31 = "Для такого, наверное, нужен скорее талант, чем навык."
1007703-32 = ""
1007703-35 = "...Хм?"
1007703-36 = "Вы правда думаете, что мне стоит попробовать?"
1007703-37 = "А что именно вы хотите услышать?"
1007703-38 = "Как я играю на гитаре?"
1007703-39 = "Я?"
1007703-40 = "Для вас, Сенсей?"
1007703-41 = "Эм..."
1007703-42 = ""
1007703-44 = ""
1007703-45 = "Да что вы вообще такое говорите? Я-Я не смогу! Я—"
1007703-46 = "Я же только что сказала, что ни разу даже не держала гитару! Вы меня смутить пытаетесь?"
1007703-47 = "[s1] «Я просто говорю, что тебе стоит попробовать.»\n[s2] «Может, мы могли бы учиться вместе.»"
1007703-50 = "Но всё равно... я..."
1007703-51 = "Даже если вы именно это имели в виду... Это слишком. Я-Я не могу."
1007703-52 = "Я знаю, что сама сказала, будто хочу найти то, чем смогу увлечься, но..."
1007703-53 = "Ну... Это..."
1007703-54 = "Эм... Ммм..."
1007703-55 = "*вздыхает*"
1007703-56 = "Ладно! Я просто... как-нибудь разберусь! Если вы правда хотите меня услышать."
1007703-57 = "Но если будет ужасно, не говорите потом, что я не предупреждала! Слышите?!"
1007703-58 = "[s3] «Я бы никогда не стал так тебя критиковать.»\n[s4] «Не переживай. Тебе не о чем волноваться.»"
1007703-61 = "Ну, хорошо... Возьму самую дешёвую модель для новичков."
1007703-62 = ""
1007703-64 = ""
1007703-67 = "Ичика зашла в магазин и купила одну из выставленных акустических гитар."
1007703-68 = "Потом мы дошли до набережной и сели."
1007703-70 = "Настоящая гитара... И она моя..."
1007703-71 = "Я только думала о покупке, а теперь мы уже сидим здесь с ней."
1007703-72 = "Пусть она и для новичков, но для любого прохожего я выгляжу профессионалом. Хаха!"
1007703-73 = "А теперь, когда у меня есть ноты и инструкции, остаётся только играть."
1007703-74 = "Если буду следовать инструкции, может, будет звучать нормально. Как думаете?"
1007703-75 = "[s5] «Наверное, всё немного сложнее...»\n[s6] «Может, начни с чего-нибудь простого.»"
1007703-78 = "Ладно, да. Посмотрим... Держать её нужно вот так."
1007703-79 = "А аккорды... здесь. Да. Хм..."
1007703-80 = "А потом, кажется, провести по струнам."
1007703-81 = ""
1007703-83 = ""
1007703-84 = "Вот так? Как звучит?"
1007703-85 = ""
1007703-88 = "[ns7] «Ты уверена, что играешь впервые?»\n[ns8] «Ты так быстро схватываешь...?»"
1007703-91 = "Ну... да? Наверное, да."
1007703-92 = "Но она ведь предназначена для новичков."
1007703-93 = "Готовка, программирование, рисование — когда следуешь простым инструкциям, обычно всё так и работает, разве нет?"
1007703-94 = "Не вижу причин, почему музыкальные инструменты должны чем-то отличаться. Их создали, чтобы на них играли..."
1007703-95 = "Просто делай, как сказано, и всё получится. Вот и всё."
1007703-96 = "Даже к основам можно добавить что-нибудь своё, чтобы сделать их более личными."
1007703-97 = "Ничего особенного."
1007703-98 = "...Хм?"
1007703-99 = "Вы правда впечатлены, да?"
1007703-100 = "И думаете, мне уже говорили, что я быстро учусь."
1007703-101 = "Ну... Не могу сказать, что слышу это впервые..."
1007703-102 = "Хаха. Ладно, ладно. Можете говорить это сколько угодно, но одной лестью моё доверие не завоевать."
1007703-103 = "Давайте просто ещё немного потренируемся, если вы не против?"
1007703-104 = ""
1007703-106 = ""
1007703-107 = "Выберите несколько песен из книги, а я сыграю."
1007703-110 = "Мы провели там ещё какое-то время. Ичика играла, а я слушал."
1007703-111 = "Я всё ещё не верю, что она играла впервые. Это было очень впечатляюще."
