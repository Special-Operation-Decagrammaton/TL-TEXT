[translation]
33120-1 = "Episódio 12;Caos Acelerado (2)"
33120-2 = "Como está o estado do Sensei!?"
33120-3 = "No momento ele está na sala das Cavaleiras Socorristas! Segundo informações das integrantes, ele perdeu muito sangue, mas os primeiros socorros foram feitos adequadamente..."
33120-4 = "Então ele está fora de perigo...!?"
33120-5 = "S-Sim. Felizmente não parece correr risco de vida, mas disseram que ele ainda não recobrou a consciência..."
33120-6 = "Inconsciente... Sensei..."
33120-10 = "Saíram os resultados da análise! O que foi disparado contra a Antiga Catedral não veio de um motor ramjet!"
33120-11 = "!!"
33120-12 = "Não foi um ramjet... Sendo assim, como Gehenna colocou as mãos em uma tecnologia de um nível tão absurdo?"
33120-13 = "Também estamos verificando o local do disparo neste exato momento...!"
33120-14 = "Qual grupo de Gehenna foi? Se ao menos descobrirmos a localização...!"
33120-15 = "N-Não, é que..."
33120-16 = "Não conseguimos identificar a posição exata, mas... o ponto de lançamento fica \"dentro do distrito autônomo de Trinity\"!"
33120-17 = "...!!"
33120-18 = "As imagens das câmeras foram recuperadas! São do momento em que a Antiga Catedral foi bombardeada! Elas batem com os relatos das Irmãs que estão atualmente em combate contra Gehenna na Antiga Catedral!!"
33120-20 = "Reproduzindo o vídeo!"
33120-35 = "Isso é..."
33120-36 = "Aquilo contra o que o Sensei e as outras estavam lutando, não me diga que...?"
33120-37 = "A-Aquilo é..."
33120-38 = "...É o \"Concílio das Santas de Justina\"."
33120-39 = "H-Hã...!?"
33120-40 = "..."
33120-41 = "H-Hanako-san..."
33120-42 = "..."
33120-48 = "..."
33120-53 = "Concílio das Santas de Justina, Tratado do Éden, aquele ataque..."
33120-61 = "Esquadrão Arius, Primeiro Concílio, Antiga Catedral, ponto e momento do lançamento..."
33120-67 = "Catacumbas, a história de fantasma do parque de diversões, a localização do distrito autônomo de Arius..."
33120-77 = "Guardiãs dos preceitos... Tratado do Éden... \"Éden\"..."
33120-80 = "..."
33120-81 = "H-Hanako-san...!? Você está bem!?"
33120-82 = "..."
33120-83 = "...Não passa de uma hipótese."
33120-84 = "Ela parte de dezenas de saltos lógicos como premissa, mas, se por um acaso isso for verdade..."
33120-85 = "Não existe... nenhuma forma de resolver isso...?"
33120-86 = "...Hã?"
33120-87 = "Se continuar assim... Trinity e Gehenna vão literalmente desaparecer do mapa de Kivotos."
33120-89 = "...Assim como aconteceu com Arius no passado, após o \"Primeiro Concílio\"."
33120-91 = "Próximo;O Outro Lado Inalcançável"
