[translation]
63080-1 = "Эпизод 8;Чаепитие"
63080-2 = "Прежде всего я хотела бы ещё раз искренне поблагодарить вас за вашу роль во всём, что касается этих пробных экзаменов."
63080-3 = "[s] «Ты тоже очень старалась, Нагиса»."
63080-4 = "Нет, вовсе нет..."
63080-5 = "Прошу прощения, Сенсей. Я должна с благодарностью принять ваши слова."
63080-6 = "Я уже решила вопрос с местом, где студенты Ариуса будут заниматься и сдавать экзамены."
63080-7 = "Есть несколько старых школьных корпусов, которые принадлежат Тринити, но сейчас не используются."
63080-8 = "Мы хотели бы бесплатно предоставить их студентам Ариуса, чтобы они пользовались ими как пожелают."
63080-9 = "[s1] «Неиспользуемые старые школьные здания...»\n[s2] «Совершенно бесплатно...»"
63080-10 = ""
63080-11 = ""
63080-13 = ""
63080-14 = "П-Почему такая реакция, Сенсей? Я опять сказала что-то не то...?"
63080-15 = "Хм? Масштаб моей щедрости настолько велик, что за ним трудно поспеть?"
63080-16 = "Фуфу. Вот что вы имели в виду. И всё же любая вещь по-настоящему сияет лишь тогда, когда выполняет своё предназначение."
63080-17 = "О? Вы спрашиваете, сдаём ли мы, члены Чаепития, экзамены?"
63080-18 = "Разумеется. Более того, если бы у нас были плохие оценки, люди начали бы сомневаться, заслуживаем ли мы места в Чаепитии."
63080-19 = "Но Мика и Сейя обе прекрасные студенты, поэтому я не беспокоюсь."
63080-20 = "Хм? Насчёт Сейи всё понятно, но вам любопытны оценки Мики?"
63080-21 = ""
63080-23 = ""
63080-24 = "..."
63080-25 = "Сенсей."
63080-26 = "Когда речь идёт о Мике... Вы когда-нибудь слышали такую фразу?"
63080-27 = "«У моего ребёнка столько способностей, просто она их не использует»."
63080-28 = ""
63080-30 = "Возможно, вы и сами уже заметили, но Мика на самом деле довольно умна."
63080-31 = "Просто... у неё совершенно нет желания этим пользоваться."
63080-32 = "Если предположить... думаю, ей просто утомительно размышлять именно так, как от неё требует школа."
63080-35 = "На экзаменах она выступит хорошо, как и всегда."
63080-36 = "Вы же понимаете, что при плохих оценках её никогда бы не выбрали в Чаепитие?"
63080-37 = "[s] «Тебе и правда хватает забот, Нагиса...»"
63080-38 = "Спасибо, что понимаете..."
63080-39 = "..."
63080-40 = "В итоге и тогда, и сейчас в корне всех наших проблем лежит долгая история между Тринити и Ариусом."
63080-41 = "Тринити и Ариус разделяют одну и ту же историю, но толкуют её совершенно по-разному."
63080-42 = "История должна быть точной записью событий, но люди, которые её записывают, способны ошибаться."
63080-43 = "..."
63080-44 = "Поэтому, Сенсей. Когда эти экзамены закончатся..."
63080-45 = "Я планирую построчно сравнить записанную историю Тринити с историей, сохранённой в Porta Pacis, и создать нечто вроде архива или музея."
63080-46 = "[s] «Это... правда будет нормально?»"
63080-47 = "Разумеется, две версии будут сильно различаться. Пока мы будем их сравнивать, неизбежно возникнут конфликты и споры — по крайней мере некоторое время."
63080-48 = "И всё же, если потребуется, мы привлечём третьи стороны ради объективного взгляда и консультаций."
63080-49 = "Мы никогда не преодолеем прошлое, если сначала не посмотрим ему прямо в глаза."
63080-50 = "Что касается пересмотра, сравнения и исследования записей... Я уже знаю человека, который с радостью возьмётся за эту работу."
63080-51 = ""
63080-55 = "Я искренне верю, что Тринити сможет преодолеть все эти потрясения."
63080-56 = "Та Тринити, которую я знаю, не настолько хрупка."
63080-57 = "Разумеется, я ожидаю, что в процессе всплывёт множество политических проблем и старых долгов..."
63080-58 = "..."
63080-59 = "Но в каком-то смысле именно такие вещи и являются «специализацией» хозяйки Чаепития, не так ли?"
63080-60 = "[s] «...»"
63080-61 = "Такова сама природа политики."
63080-62 = "Это процесс, в котором ты отдаёшь что-то своё, чтобы получить то, что есть у другого и нужно тебе."
63080-63 = "И даже повторяя подобные компромиссы и обмены снова и снова..."
63080-64 = "...нельзя отпускать одну главную ценность, которую ты хочешь защитить."
63080-65 = "Первый компромисс, первая уступка на удивление легки. На второй многие и спотыкаются."
63080-66 = "Не успевают они заметить, как забывают, кто они и к чему стремились."
63080-67 = "[s] «Так что именно ты хочешь защитить, Нагиса?»"
63080-68 = ""
63080-70 = ""
63080-71 = "Я..."
63080-72 = "Я хочу, чтобы Тринити стала лучшей академией из всех когда-либо существовавших."
63080-73 = "Я хочу, чтобы учёба в Тринити была знаком чести и гордости."
63080-74 = "И спустя годы, когда студенты будут вспоминать школьные дни в Тринити..."
63080-75 = "...я надеюсь, они будут вспоминать их с теплом — как по-настоящему драгоценное, незаменимое время."
63080-84 = "Я хочу, чтобы каждый опыт, полученный здесь, становился маленьким, но дорогим сокровищем, которое помогает им вырасти лучшими людьми."
63080-85 = "Конечно, нам ещё предстоит очень долгий путь."
63080-86 = "И, если возможно, я тоже хотела бы получить такой опыт для себя."
63080-87 = "Чтобы воплотить мою мечту в реальность..."
63080-88 = "Мы должны смотреть на окружающий мир гораздо более проницательно и незамутнённо."
63080-89 = "Знаете, всему этому я научилась у вас, Сенсей."
63080-90 = "[s] «Эй, Нагиса»."
63080-91 = "Да?"
63080-92 = "[s] «Насчёт того раза... Прости»."
63080-93 = "За что?"
63080-94 = "[s] «За то, что не доверял тебе»."
63080-97 = "[ns] «И... за то, что был так суров с тобой»."
63080-99 = "[ns3] «Это была лишь моя вина.»\n[ns4] «Мне не следовало говорить таких вещей.»"
63080-100 = ""
63080-101 = ""
63080-103 = "С-Сенсей...?"
63080-104 = "Почему вы говорите это сейчас? Так внезапно?"
63080-105 = "Потому что подумали: если не скажете сейчас, то, возможно, уже никогда не признаетесь?"
63080-106 = "Н-Нет! Пожалуйста, не нужно так кланяться...!"
63080-107 = ""
63080-111 = "А...?"
63080-112 = ""
63080-115 = ""
63080-116 = "П-Простите, Сенсей. Я..."
63080-117 = "[s5] «Нет. Твоя реакция совершенно нормальна, Нагиса.»\n[s6] «Виноват я. Пожалуйста, позволь мне на этот раз как следует извиниться.»"
63080-120 = ""
63080-123 = "[ns7] «Мне и правда нужно поскорее стать для всех вас достойным взрослым.»\n[ns8] «Простите, что я такой никудышный учитель.»"
63080-126 = "С-Сенсей..."
63080-127 = "Сенсей..."
63080-128 = "..."
63080-129 = "П-Простите, но..."
63080-130 = "Не могли бы вы... на минутку отвернуться...?"
63080-133 = "Я повернулся к Нагисе спиной, как она и попросила."
63080-134 = "Некоторое время я так и стоял..."
63080-135 = ""
63080-139 = "А затем почувствовал, как на мою спину очень осторожно опустилась едва заметная тяжесть."
63080-140 = ""
63080-143 = "Мне... Мне было так тяжело."
63080-144 = "[s] «...Прости»."
63080-145 = "Всё это время, правда, действительно..."
63080-146 = "[s] «Я знаю...»"
63080-147 = "Я снова и снова об этом думала."
63080-148 = "Я полностью принимаю ответственность за то, что произошло. Правда."
63080-149 = "Но... Но всё же..."
63080-150 = "Я всё время задавалась вопросом, почему ваши требования ко мне были намного строже, чем ко всем остальным."
63080-151 = "Я знаю, что я хозяйка Чаепития и что строгие требования — это само собой разумеется."
63080-152 = "И особенно в том, что касается Хифуми и Кохару, я знаю, что заслужила это."
63080-153 = "Но всё... равно..."
63080-154 = ""
63080-158 = "*всхлипывает*"
63080-159 = "Рука Нагисы снова и снова легко ударяла меня по спине, словно пытаясь показать, насколько сильно ей всё это время было больно."
63080-160 = "Это были безобидные удары маленького детского кулачка..."
63080-161 = "И всё же почему-то от них становилось ещё больнее."
63080-164 = "[ns] «Стало хоть немного легче?»"
63080-165 = "Да."
63080-166 = "Простите, что вам пришлось увидеть меня такой."
63080-167 = "[s] «Мне правда, правда очень жаль...»"
63080-168 = "Пожалуйста, не продолжайте винить себя, Сенсей. Если вы будете так делать, я... я начну..."
63080-169 = "..."
63080-170 = "Давайте лучше сделаем так, Сенсей."
63080-171 = "С этого момента мы оба будем немного осторожнее."
63080-172 = "И постараемся больше не возвращаться к тому случаю, если только обстоятельства не потребуют."
63080-173 = "А чтобы закрепить это обещание, как насчёт тоста с чаем?"
63080-174 = "[s] «Спасибо, Нагиса»."
63080-175 = "Не стоит благодарности."
63080-176 = "[s] «Ну тогда... За нас!»"
63080-177 = "За нас!"
63080-178 = ""
63080-182 = "[ns] «Приятно пахнет...»"
63080-185 = "Разумеется. Иначе и быть не должно."
63080-186 = ""
63080-188 = ""
63080-189 = "О? Теперь, когда я думаю об этом, вы ведь хотели рассказать мне ещё одну вещь о недавнем происшествии, верно?"
63080-190 = ""
63080-194 = "(То, что я рассказал Субару — точнее, то, чем с ней поделились из моей памяти...)"
63080-195 = "Я рассказал Нагисе о так называемой «коллективной воле» фракций Патер и Санктус сразу после инцидента с Эдемским договором..."
63080-198 = "..."
63080-199 = "..."
63080-200 = "........."
63080-201 = "[s] «Н-Нагиса...?»"
63080-202 = "Ха."
63080-203 = "[s] «„Ха“...?»"
63080-204 = "Хи-хи."
63080-205 = "Ха-ха-ха..."
63080-206 = "Понятно, понятно. Теперь я наконец всё понимаю."
63080-207 = "Я более-менее догадываюсь, кто эти двое. Они ведь тоже подали мне отчёт по этому вопросу."
63080-208 = "Воистину."
63080-209 = "Воистину, от всего сердца благодарю вас, Сенсей."
63080-210 = "Сегодня вы принесли мне очень, очень ценную информацию. Фуфуфуфу."
63080-211 = "[s] «Ага... ха-ха...»"
63080-212 = "Итак, они заверили вас, что сами обо всём позаботятся, а затем поступили так, как им захотелось."
63080-213 = "Они даже отредактировали части отчёта, чтобы подкрепить свои выдумки..."
63080-214 = "[s] «Нагиса...?»"
63080-215 = "О, не беспокойтесь, Сенсей."
63080-216 = "Всё будет улажено гладко и тихо."
63080-217 = "Правда, действительно."
63080-218 = "Если я сделаю всё правильно, вы вообще больше об этом не услышите. Для управления повествованием нужны лишь подходящий предлог и идеальный момент."
63080-219 = "Например, можно сказать, что этот маленький обман произошёл потому, что авторитет временных представителей каждой фракции навсегда подорван."
63080-220 = "Конечно, вернуть всё в прежнее состояние будет чрезвычайно трудно, особенно когда речь идёт о Мике и её положении."
63080-221 = "Но совсем нетрудно распространить внутреннюю записку о том, что многие как минимум рекомендуют повышение."
63080-222 = ""
63080-225 = "Зловещее воодушевление Нагисы только росло, пока она строила планы..."
63080-226 = "...Такого чистого ужаса я раньше не испытывал."
63080-227 = "Что ж, Сенсей. Почему бы нам на этом не закончить с тяжёлыми темами, от которых болит голова?"
63080-228 = "На оставшийся час или около того... не составите мне компанию за личным чаепитием, только вы и я?"
63080-229 = "[s] «Я не против, но почему так внезапно?»"
63080-230 = "Потому что..."
63080-231 = "Например, те ваши слова, Сенсей."
63080-232 = "Или едва заметная дистанция, которая существует между нами."
63080-233 = "Или множество мелочей, которые эту дистанцию создали."
63080-234 = "За всё это..."
63080-235 = "Я считаю, что заслуживаю компенсации."
63080-236 = "[s] «...!»"
63080-237 = ""
63080-241 = "[ns] «Эй, мы договорились больше об этом не говорить!»"
63080-242 = "Ох."
63080-243 = "А я уточнила, о каких именно словах... идёт речь?"
63080-244 = "[s] «Ты с самого начала именно этого и хотела, Нагиса!»"
63080-245 = "Фуфу. А если и так?"
63080-246 = "Что вы будете делать, Сенсей?"
63080-247 = "Ой."
63080-248 = "[s] «Что?!?!»"
63080-249 = "...Я вам настолько не нравлюсь...?"
63080-250 = "[s] «...Так вот чего ты действительно хотела... с самого начала, Нагиса...»"
63080-251 = "Да, именно."
63080-252 = "В каком-то смысле разве это тоже не форма политики?"
63080-254 = "Признав, что я идеально угодил в её ловушку..."
63080-255 = "...я уже собирался уступить избалованным требованиям Нагисы, когда..."
63080-256 = ""
63080-259 = ""
63080-260 = "Йо, Наги! Чем занята?"
63080-261 = ""
63080-263 = ""
63080-264 = ""
63080-266 = "М-Мика?! Сейя?!?!"
63080-267 = ""
63080-270 = "Ч-Что?! Сенсей??! Я не знала...! Если бы знала, что вы здесь, я бы хоть немного подготовилась..."
63080-271 = "О-хо. А я всего лишь последовала некоему... предчувствию, что здесь произойдёт что-то весёлое или, возможно, важное, и заглянула без предупреждения."
63080-272 = "И, похоже, моя интуиция оказалась верна."
63080-274 = "С-Сенсей, что нам делать?! Есть вещи... вещи, о которых я особенно не хочу, чтобы Мика узнала!"
63080-275 = "[s] (Успокойся, Нагиса! Мы уже сменили тему!)"
63080-276 = "Ах!!"
63080-277 = "Д-Да, верно. Спасибо, Сенсей."
63080-278 = ""
63080-280 = ""
63080-281 = "Кхм. Добро пожаловать, вы двое. Сенсей неожиданно заглянул к нам."
63080-282 = "Хм? Правда? А, теперь понятно. Конечно, Наги всё равно успела всё подготовить! Молодец!"
63080-283 = "Эм... и всё же я бы предпочла, чтобы вы предупредили заранее."
63080-284 = ""
63080-286 = ""
63080-287 = "Подмигивание Нагисы и её многозначительный взгляд были, вероятно, не настолько незаметными, как ей казалось."
63080-288 = "[ns9] «Да, ты права. Наверное, стоило так и сделать.»\n[ns10] «Просто... мне внезапно очень захотелось увидеть Мику, и я решила устроить ей сюрприз.»"
63080-289 = ""
63080-290 = ""
63080-292 = ""
63080-293 = "Ч-Что, п-правда?! Меня? Я-Я так рада это слышать."
63080-294 = "Хи-хи. Хи-хи-хи. Сенсей, ну вы даёте."
63080-295 = ""
63080-297 = ""
63080-299 = "..."
63080-300 = "Вы воистину тяжко грешный человек, Сенсей."
63080-301 = "[s11] «Я-я ничего не сделала!»\n[s12] «Я невиновна! Я просто старалась изо всех сил!»"
63080-302 = "Ты серьёзно...?"
63080-303 = "Мир был бы прекрасным местом, если бы намерения и последствия всегда совпадали."
63080-304 = "Что ж, раз всё сложилось так, может, устроим наконец давно назревшее чаепитие все вместе?"
63080-305 = "Тем более что Сенсей здесь с нами."
63080-306 = "Да, да! Я только за!"
63080-307 = "Хм? Если подумать... это наше первое чаепитие втроём плюс Сенсей? Или раньше уже было...?"
63080-308 = "Может, у меня память портится. Всё такое расплывчатое... Что мне делать, Сенсей?"
63080-309 = "До ТАКОГО ты пока ещё не дошла, Мика."
63080-310 = "Главное, что сейчас мы все здесь вместе."
63080-311 = "Конечно, для тебя почти всё в мире, наверное, всегда кажется свежим и новым."
63080-312 = "Сейя? Ты ведь только что, по сути, прямо в лицо сказала, что у меня плохая память, да?"
63080-313 = "Я спокойна. Даже если память под угрозой, по крайней мере инстинкты у тебя всё ещё острые."
63080-314 = "Если продолжишь так выворачивать чужие слова, однажды люди перестанут это терпеть!"
63080-315 = "Это ещё предстоит увидеть, не так ли?"
63080-316 = "И вообще, откуда мне знать? Я больше не вижу будущего."
63080-317 = "Тебе обязательно оставить последнее слово за собой, да? Каждый! Божий! Раз!"
63080-318 = "...Хмф."
63080-320 = "М-Мика? Сейя? Не забывайте, сейчас здесь Сенсей."
63080-321 = ""
63080-324 = ""
63080-331 = ""
63080-332 = "[ns13] «Действительно, конфликт между двумя людьми...»\n[ns14] «...нельзя разрешить с лёгкостью.»"
63080-335 = "Мне ужасно жаль, Сенсей..."
63080-337 = "Следующий эпизод;Подготовка к экзамену"
