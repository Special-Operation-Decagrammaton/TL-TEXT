[translation]
1001805-1 = "Подработка застенчивой девушки 1"
1001805-2 = "Клубная комната Отдела разработки игр"
1001805-3 = "*вздох* Я не могу и дальше полагаться на остальных. Это большая проблема."
1001805-4 = "[s] «Что тебя беспокоит?»"
1001805-5 = "О, Сенсей."
1001805-6 = "Отдел разработки игр делает новую игру, но нам не хватает денег на разработку..."
1001805-7 = "Вся команда подрабатывает, чтобы помочь покрыть расходы, а я даже не могу выйти поискать работу, потому что слишком боюсь людей..."
1001805-8 = "Я президент Отдела разработки игр, и меня очень расстраивает, что я не могу помочь больше."
1001805-9 = "Есть какой-нибудь хороший способ помочь остальным?"
1001805-10 = "[s] «Хочешь, расскажу о подработке, которую знаю?»"
1001805-11 = "...А? П-подработке?!"
1001805-12 = "Ни за что! Я даже с людьми нормально разговаривать не могу!"
1001805-13 = "..."
1001805-14 = "Мне страшно... выходить к людям, но..."
1001805-15 = "...Да, я не могу вечно убегать."
1001805-16 = "Если это подработка, которую рекомендуете вы... Наверное, всё будет хорошо!"
1001805-18 = "Ангел 24, центральный филиал Кивотоса"
1001805-19 = "На следующий день, в магазине Ангел 24 в центре Кивотоса..."
1001805-20 = ""
1001805-21 = "Ни за что..."
1001805-22 = "Я действительно сказала, что буду подрабатывать, но вы не говорили, что это работа с клиентами! Я не думаю, что справлюсь с работой в магазине!"
1001805-23 = "Сенсей, я вам доверяла... Я вам доверяла!"
1001805-24 = "[s] «Не волнуйся так. Я буду рядом и помогу тебе справиться.»"
1001805-25 = "П-правда? Вы останетесь со мной, пока я работаю?"
1001805-26 = "Думаю, если вы будете помогать, я выдержу..."
1001805-27 = "Угх, но что если придёт страшный покупатель?"
1001805-29 = ""
1001805-30 = "Юзу, можешь разложить снеки на пустой полке перед кассой?"
1001805-31 = "А-а? В-вы про напитки?"
1001805-32 = "Нет, снеки, не напитки. Напитки уже в холодильнике..."
1001805-33 = "Д-да! Я-я расставлю напитки на полке!"
1001805-35 = ""
1001805-36 = "*вздох* Она точно справится?"
1001805-38 = "Несколько мгновений спустя..."
1001805-39 = "Пожалуйста, разогрейте мне один бэнто с жареной курицей."
1001805-40 = "Мне один экземпляр нового номера журнала манги за этот месяц."
1001805-41 = "Да, да!"
1001805-42 = "Вот ваш разогретый журнал манги и бэнто с гамбургером!"
1001805-43 = "Я заказывал бэнто с жареной курицей..."
1001805-44 = "А журнал манги вообще-то не нужно разогревать..."
1001805-45 = "А-а?! П-простите! Я-я сейчас всё исправлю!"
1001805-46 = "Здравствуйте, я хотел бы заказать—"
1001805-48 = ""
1001805-50 = "(Угх, здесь слишком много людей... Мне страшно... Хочу сбежать!)"
1001805-51 = "(Но Сенсей мне помогает, и если я не хочу быть обузой для участников Отдела разработки игр, то не должна убегать!)"
1001805-52 = "(Ещё немного... совсем чуть-чуть...)"
1001805-53 = ""
1001805-55 = "О-одну минуту! Я-я сейчас вам помогу!"
1001805-57 = "С-спасибо за вашу работу..."
1001805-58 = "[s] «Ты тоже хорошо потрудилась.»"
1001805-59 = "Н-нет, это не так..."
1001805-60 = "Угх... Я весь день ошибалась... и, наверное, обидела некоторых покупателей... Ещё одно доказательство, что я одиночка и ходячая катастрофа, которая не умеет подрабатывать..."
1001805-61 = "[s] «Это не так. Ты старалась изо всех сил.»"
1001805-62 = "Но..."
1001805-64 = ""
1001805-65 = "Ты хорошо потрудилась, Юзу."
1001805-66 = "Сегодня покупателей было больше обычного... Ты даже не представляешь, как помогло появление нового работника."
1001805-67 = "П-Правда?"
1001805-68 = "Ну да, ошибок ты сделала много, но сразу извинялась и исправляла ситуацию."
1001805-69 = "Покупатели, похоже, остались довольны твоей искренностью."
1001805-70 = "Какое облегчение... Я рада, что хоть немного помогла."
1001805-71 = "Кстати... перед магазином на следующие выходные запланировано большое мероприятие."
1001805-72 = "Сможешь прийти и поработать тогда?"
1001805-73 = "...И-и-и! Я больше не могу!"
