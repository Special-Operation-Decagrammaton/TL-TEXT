[translation]
10028070-1 = "Эпизод 7;Объявление войны"
10028070-3 = "Мне так, так, так жаль!"
10028070-4 = "[ns1] «Простите! Мне ужасно стыдно!»\n[ns2] Поклониться в знак извинения."
10028070-7 = "Место проведения Чаепития"
10028070-8 = ""
10028070-9 = ""
10028070-10 = "О чём ты?"
10028070-11 = "За что именно вы сейчас пытаетесь извиниться?"
10028070-12 = ""
10028070-14 = ""
10028070-16 = ""
10028070-17 = "...?"
10028070-18 = "...Что?"
10028070-19 = "[s3] «Мы разбили чайный сервиз... вдребезги...»\n[s4] «В-Вы ещё не видели реликвию?»"
10028070-22 = "Ой, это..."
10028070-23 = "Это не... Ах. Кажется, теперь я понимаю ситуацию."
10028070-24 = "Видите ли..."
10028070-25 = ""
10028070-27 = ""
10028070-28 = "Я должна извиниться. Похоже, я могла оказать на вас обоих чрезмерное давление."
10028070-29 = "Если говорить проще, ничего страшного, если он разбит."
10028070-30 = ""
10028070-33 = "[ns5] «...Простите?»\n[ns6] «А если он... полностью разбит?»"
10028070-36 = "Меня беспокоила возможность утраты реликвии. Её нынешнее состояние не имеет значения."
10028070-37 = "Решение довольно простое. Пока реликвия у нас, любые повреждения можно восстановить."
10028070-38 = "С подходящим мастером можно вернуть в первоначальный вид даже древний фолиант, превращённый в пыль. С чем-то подобным справиться вообще легко."
10028070-39 = "Ваше присутствие на раскопках подтвердило подлинность наших поисков и самого чайного сервиза."
10028070-40 = "Ещё раз благодарю вас, Сенсей. И участницу Отряда справедливости..."
10028070-41 = "Д-Да. Меня зовут Ичика!"
10028070-42 = "Да. Ичика."
10028070-43 = "Хи-хи..."
10028070-44 = "Спасибо за помощь, Ичика."
10028070-46 = ""
10028070-47 = "Вообще-то вышло немного антиклимактично."
10028070-48 = "А я тут уже готовила драматическую речь о том, почему заслуживаю сохранить своё место в Отряде справедливости."
10028070-49 = "Из-за такой концовки я чувствую себя немного глупо. Всю поездку так переживала. И ради чего?"
10028070-50 = "[s7] «По-моему, всё это всё равно было очень важно.»\n[s8] «Мне было достаточно просто узнать тебя получше, Ичика.»"
10028070-53 = "Что я говорила о вашем умении подбирать слова?"
10028070-54 = "Нельзя вот так обезоруживать людей словами, Сенсей."
10028070-55 = "Забавно, рядом с вами я иногда чувствую себя маленьким ребёнком. Хотя, наверное, для вас я именно им и являюсь."
10028070-56 = ""
10028070-58 = ""
10028070-59 = "Ну и ладно! Сдаюсь. Всё окончательно вышло из-под контроля, и я сама уже ничего не понимаю..."
10028070-60 = "Я больше не собираюсь сдерживаться! Когда я начну вести себя как избалованная девчонка, не забывайте: это вы сами сказали, что всё нормально!"
10028070-61 = "Я же говорила, что не хочу быть обузой и писать вам по любому поводу."
10028070-62 = "Но теперь всё иначе! По вашей же просьбе!"
10028070-63 = "Считайте это моим объявлением войны! Теперь я буду связываться с вами, когда мне захочется."
10028070-64 = "Помните, вы сами напросились! Вы напали первым!"
10028070-65 = "Так что, думаю, это вполне подходящее наказание! И никаких жалоб!"
10028070-66 = "...Э-Это ведь правда нормально, да?"
10028070-67 = "[s9] «Конечно. Буду ждать твоих сообщений.»\n[s10] «Пиши в любое время и по любому поводу.»"
10028070-70 = "Хи-хи. Конечно."
10028070-71 = "Даже если вам это покажется хлопотным, пожалуйста, отвечайте за свои поступки."
10028070-72 = "...Хаха."
10028070-73 = "Я стану вашим самым хлопотным студентом номер один! Не могу дождаться!"
10028070-74 = "Что ж, думаю, после сегодняшнего нам обоим не помешает отдохнуть."
10028070-75 = "Ещё увидимся по личным делам, Сенсей."
10028070-76 = ""
10028070-78 = ""
10028070-80 = ""
10028070-81 = ""
10028070-82 = "...До следующего раза."
