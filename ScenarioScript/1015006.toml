[translation]
1015006-1 = "The Orca Who Wants to Convey"
1015006-2 = "(Not long after the Odyssey Fleet returned to D.U.)"
1015006-3 = "(I happened to spot Kotone in the shopping district near the port where the fleet was moored.)"
1015006-5 = "Hmm..."
1015006-9 = "(Kotone was staring at a mailbox, lost in thought.)"
1015006-10 = "(Seeing her looking more serious than usual, I decided to call out to her.)"
1015006-12 = "[ns] \"Kotone?\""
1015006-13 = "Ah, Sensei."
1015006-14 = "This is our first time running into each other in the shopping district."
1015006-15 = "Did you come to grab some lunch?"
1015006-16 = "[s] \"Yeah. I had some business nearby and stopped by on the way.\""
1015006-20 = "[ns1] \"More importantly, is something wrong with the mailbox?\"\n[ns2] \"Did you accidentally put something in there you shouldn't have?\""
1015006-23 = "It's not that..."
1015006-24 = "Actually... I was hesitating over whether to mail this letter."
1015006-25 = "I've already finished writing the letter itself, but#nwhen it actually comes to sending it, I get cold feet."
1015006-26 = "[s3] \"Is there a reason you're hesitant?\"\n[s4] \"And who are you planning to send it to?\""
1015006-29 = "Well... to my pen pal."
1015006-30 = "We met by chance during the voyage, but—"
1015006-31 = "We have a lot in common and get along really well."
1015006-32 = "Like our favorite scenery, games, and food."
1015006-33 = "...Though we've never actually met in person."
1015006-34 = "I used short-wave radio to get information about the mainland.#nWe just happened to match frequencies and got to know each other."
1015006-35 = "After that, we communicated many times and started sharing personal things—"
1015006-36 = "So... I thought we became close."
1015006-37 = "[s] \"You thought?\""
1015006-38 = "Yeah. Maybe it was just my imagination."
1015006-39 = "That friend of mine suddenly stopped contacting me a while ago."
1015006-40 = "Just before arriving at the port, I sent a message asking to meet up in D.U. once...#nand I haven't heard back since."
1015006-41 = "I guess meeting in person was asking for too much after all."
1015006-42 = "[s] \"That must be... pretty discouraging.\""
1015006-46 = "[ns] \"Though, maybe there's a reason for it.\""
1015006-47 = "Yeah. That's what I thought too."
1015006-48 = "So I thought about sending a letter to the address I got before, but..."
1015006-49 = "I suddenly started getting anxious."
1015006-50 = "What if she's trying to avoid me,#nand reaching out repeatedly would just be a bother... stuff like that."
1015006-51 = "I also wonder if it's silly to worry this much over someone whose face I don't even know..."
1015006-52 = "...My eyesight isn't great, so I have trouble remembering people's faces properly."
1015006-53 = "Even though there are people I see every day whose faces I can't remember,#nright now I'm super worried about that friend whose face I don't even know."
1015006-54 = "Is this... a bit weird?"
1015006-55 = "[s] \"No, not at all.\""
1015006-59 = "[ns5] \"There are many ways to convey your feelings, after all.\"\n[ns6] \"You can connect deeply with someone even if you don't know what they look like.\""
1015006-62 = "...Is that so?"
1015006-63 = "[s7] \"Besides, she's a friend who supported you through a long and difficult voyage, right?\"\n[s8] \"It's only natural that you wouldn't want to let that go.\""
1015006-66 = "..."
1015006-67 = "Yeah, I've decided."
1015006-72 = "I hope this letter reaches her safely."
1015006-73 = "Phew... once you make up your mind, it's easier than you'd think."
1015006-74 = "Thank you, Sensei.#nIf you hadn't been here... I probably would have hesitated forever and given up."
1015006-75 = "[s] \"You're welcome.\""
1015006-79 = "[ns9] \"Even so, pen pals in this day and age—\"\n[ns10] \"It has a nice romantic feel to it.\""
1015006-82 = "Really?"
1015006-83 = "Then next time, I'll write a letter to you too, Sensei."
1015006-84 = "[s] \"If you have something you want to tell me, MomoTalk is fine too, you know.\""
1015006-85 = "Of course, MomoTalk is fine, but..."
1015006-86 = "Sensei, you said it yourself earlier, didn't you?"
1015006-87 = "That there are many ways to convey your feelings."
1015006-88 = "Who knows, maybe I can get feelings across that MomoTalk can't?#nFufu."
