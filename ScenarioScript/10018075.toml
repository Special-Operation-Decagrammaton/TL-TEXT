[translation]
10018075-9 = ""
10018075-10 = "Где генеральный директор? Или президент? Как ты там себя называешь — выходи!"
10018075-11 = "Если будешь прятаться, мы просто станем ещё громче. ★"
10018075-12 = "Ого! Вся эта еда выглядит вкусно! Можно попробовать? А потом доесть?"
10018075-13 = ""
10018075-18 = ""
10018075-19 = "...Эм, думаю, вам лучше выйти к ним."
10018075-20 = "Кажется, мы вот-вот лишимся всего запаса еды."
10018075-21 = "Нееееет! Это же потенциальная прибыль! Убытки!"
10018075-23 = "Всё! Я принимаю управленческое решение! Пора с этим заканчивать!"
10018075-26 = ""
10018075-27 = "Прежде чем начнём, спасибо за тёплый приём."
10018075-28 = "Мва-ха-ха. Я стараюсь угодить."
10018075-29 = "Можем спросить, почему вы устроили нам такой торжественный приём?"
10018075-30 = "Как глава Няомото Фудс, здесь всем руковожу я."
10018075-31 = "Попытка войти без предварительного уведомления или записи вызовет автоматический ответ."
10018075-32 = "И этот ответ — весьма инициативная система безопасности."
10018075-33 = "То есть можно было просто назначить нормальную встречу?"
10018075-34 = "Мва-ха-ха. Всё зависит от случая."
10018075-35 = "Но процесс рассмотрения занимает примерно месяц-два..."
10018075-36 = "Тогда наш способ мне нравится гораздо больше."
10018075-37 = "Спасибо за объяснение."
10018075-38 = "Перейдём к делу."
10018075-39 = "Я только за. Эффективность и адаптивность — основы управления."
10018075-40 = "Эффективность в чём? В уничтожении самой идеи гастрономии путём заполнения рынка исключительно дешёвой низкокачественной едой?"
10018075-41 = "Эм, да? У вас проблемы с хорошим бизнесом?"
10018075-42 = "Я почти впечатлена тем, как вы умудряетесь игнорировать настолько очевидную проблему."
10018075-43 = "Вы слишком долго просидели в офисе. Вы потеряли из виду то, чем вообще должен быть ваш собственный продукт."
10018075-44 = "Будто потребители вообще обращают внимание на такие мелочи, как вкус еды."
10018075-45 = "Я прекрасно знаю, что мой продукт — больше еды по меньшей цене. Так люди счастливее."
10018075-46 = ""
10018075-48 = ""
10018075-50 = "Вы предлагаете мне просто выбрасывать ингредиенты и еду ниже определённого качества?"
10018075-51 = "С чего бы мне быть настолько расточительным?"
10018075-52 = ""
10018075-55 = ""
10018075-56 = ""
10018075-58 = "Я дам вам простой ответ."
10018075-59 = "Вы обманываете людей."
10018075-61 = ""
10018075-62 = "Даже рыба не сможет жить в слишком чистой воде."
10018075-63 = "Но важно поддерживать воду настолько чистой, насколько возможно."
10018075-64 = "Может, я слишком масштабно мыслящий начальник, чтобы понять, но разве не странно цепляться за такие мелочи?"
10018075-65 = "Странное здесь — название Няо Фудс. Вы, похоже, вообще не производите ничего, что можно назвать едой."
10018075-66 = "Я возмущён этим замечанием."
10018075-67 = "Ваш ответ такой же безвкусный, как ваши продукты."
10018075-68 = ""
10018075-70 = ""
10018075-71 = ""
10018075-74 = "...!"
10018075-75 = "...!"
10018075-76 = "Ладно. Тогда кулинарный поединок."
10018075-78 = "Что?"
10018075-80 = "Вы меня слышали, кулинарный поединок. Устроим соревнование по готовке."
10018075-81 = "Раз речь идёт о еде, значит и состязаться будем едой."
10018075-82 = "Всё будет честно, так что никто не сможет оспорить результат..."
10018075-83 = ""
10018075-85 = ""
10018075-87 = ""
10018075-88 = "Это же явно приманка для ловушки, да?"
10018075-89 = "Хм? Приманка? Она съедобная?"
10018075-90 = "Что думаешь, Харуна?"
10018075-92 = "Если это ловушка, Общество гурманов всё равно в неё войдёт и победит."
10018075-93 = ""
10018075-95 = ""
10018075-96 = "Я принимаю ваш вызов."
10018075-97 = "Сейчас Новый год. Праздничное настроение?"
10018075-98 = "Да. Только праздничные блюда?"
10018075-99 = "Будем соревноваться в... осэти."
10018075-100 = "Осэти?"
10018075-101 = "Много ручной работы, и удивительно трудно сделать действительно вкусно..."
10018075-102 = "Разве это не лучший способ проверить наше кулинарное мастерство?"
10018075-103 = "Как будет проходить соревнование?"
10018075-104 = "Мы приготовим осэти из одинакового качества и количества ингредиентов, а затем участники Гильдии торговцев попробуют их!"
10018075-105 = "И победит тот, кто получит больше положительных отзывов?"
10018075-106 = "Именно. Если победит Няо Фудс, вы откажетесь от «Воробья». Мва-ха-ха."
10018075-107 = "А если победим мы, вы уберёте свои грязные руки от «Воробья»."
10018075-108 = "Принимаю."
10018075-109 = "Мы тоже принимаем."
10018075-110 = "И, конечно же, глава крупной организации никогда не откажется от своего слова, правда?"
10018075-111 = "Мва-ха-ха. Готов поставить все продажи Няо Фудс на то, что такого не случится."
10018075-115 = ""
10018075-116 = "То есть я не хочу с ними драться, но ты уверена, что кулинарный поединок сработает?"
10018075-117 = "Глупец! Это бесплатный маркетинг!"
10018075-118 = "Маркетинг?"
10018075-119 = "Видишь ли, я немного изучил вопрос и узнал о дурной славе Общества гурманов."
10018075-120 = "(...И он только сейчас об этом говорит?)"
10018075-121 = "Что будет, если мы разгромим печально известное Общество гурманов прямо на глазах у Гильдии торговцев?"
10018075-123 = "Авторитет Няо Фудс среди студентов Кивотоса станет абсолютным!"
10018075-124 = "Запомни! Реклама на аудиторию студентов Кивотоса никогда не подводит!"
10018075-125 = "Эм, да, отличный бизнес-совет..."
10018075-126 = "Кстати, вы будете платить нам за сверхурочные?"
10018075-127 = "Сначала результат! Оплата потом!"
10018075-128 = "...Не думаю, что сверхурочные так работают..."
