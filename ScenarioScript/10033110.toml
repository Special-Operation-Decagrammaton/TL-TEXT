[translation]
10033110-1 = "Эпилог;Непобедимые воспоминания"
10033110-2 = "Я ожидала— Кхм... предполагала, что из-за участия Геенны всё выйдет из-под контроля, но на деле всё было довольно спокойно."
10033110-3 = "Но поздравляю вас всех с успешной экскурсией. Хотя от Сенсея я меньшего и не ожидала. И Умика тоже отлично справилась."
10033110-4 = "Это было занимательно— работа выполнена превосходно!"
10033110-5 = "[s] «Ты ведь довольно сильно переживала из-за этого, да?»"
10033110-6 = "Что ты имеешь в виду?"
10033110-7 = "[s1] «Иначе ты не организовала бы встречу с Префектурной командой.»\n[s2] «Я подозревал, что ты что-то задумала за кулисами.»"
10033110-10 = "Ты слишком высокого обо мне мнения. Всё было счастливым совпадением."
10033110-11 = "Я хотела увидеть интересную историю, которая была бы весёлой для всех."
10033110-12 = "А если так вышло, что результат оказался ещё и значимым, ну, я не жалуюсь."
10033110-13 = "Мгм. Всё просто счастливое совпадение..."
10033110-14 = "[s] «Ну, если ты так говоришь...»"
10033110-15 = "Именно так я и говорю."
10033110-17 = ""
10033110-18 = ""
10033110-19 = ""
10033110-20 = ""
10033110-21 = "Вааа! Как это вообще наша вина?"
10033110-22 = "Да, всё было немного драматично! Но мы не специально!"
10033110-24 = "Пожар ведь потушили?! Так в чём проблема?"
10033110-25 = "Ага, мы даже помогали! Мы были частью фестивального представления!"
10033110-26 = ""
10033110-28 = ""
10033110-32 = ""
10033110-33 = "Вы как следует размышляете над ошибочностью своих поступков, отрабатывая общественные часы, Моурё?"
10033110-34 = "Я ведь не услышала сейчас жалоб, правда?"
10033110-36 = "*ах!*"
10033110-38 = "М-мы?! Жаловаться? Да ни за что! Смотрите, как усердно мы убираем!"
10033110-39 = "С этого пола уже почти есть можно! И всю эту зону мы вычистили!"
10033110-40 = ""
10033110-42 = ""
10033110-43 = ""
10033110-44 = ""
10033110-45 = ""
10033110-46 = "Да-да. Отлично справляетесь."
10033110-47 = "У меня есть более важные дела. Пока!"
10033110-48 = ""
10033110-50 = ""
10033110-54 = "...Она ушла?"
10033110-55 = "Угх! Нечестно! Вообще нечестно! На следующем фестивале вы у нас ещё попляшете!"
10033110-57 = "О, круто. Начинается шествие в масках тэнгу."
10033110-58 = "Смотрите! Ямабуси! Обожаю их!"
10033110-59 = ""
10033110-62 = ""
10033110-64 = "Вы вообще работаете?! Мы должны отвечать за свои поступки!"
10033110-65 = "Да-да. Но сначала посмотри на это, лидер!"
10033110-66 = "Факел в руке, вверх по ступеням — и птица летит!"
10033110-67 = ""
10033110-69 = ""
10033110-70 = ""
10033110-71 = ""
10033110-73 = ""
10033110-75 = ""
10033110-77 = "Вот! Как! Значит?!"
10033110-78 = ""
10033110-81 = ""
10033110-82 = "Удивлена видеть, что вы помогаете Хяккияко, Сенсей."
10033110-83 = "[s] «Меня втянули... каким-то образом...»"
10033110-84 = "Как всегда усердны, Сенсей. Если бы я знала о ситуации раньше..."
10033110-85 = "[s] «Хина?»"
10033110-86 = ""
10033110-88 = ""
10033110-89 = ""
10033110-90 = "Ничего. Просто несбыточная мысль."
10033110-91 = "Я рада, что всё-таки встретила вас, пусть и немного поздно."
10033110-92 = "[s] «Знаю. Я тоже рад тебя видеть, Хина.»"
10033110-93 = "П-Правда...?"
10033110-94 = ""
10033110-96 = ""
10033110-97 = "Погодите. Вы про меня забыли?!"
10033110-98 = "Я думала, что сойду с ума на встрече с Хяккарёран! Мне пришлось разбираться со всеми формами вмешательства этих неблагодарных мерзавцев из Общества Пандемониума!"
10033110-99 = "Эти еноты! Разве на экскурсии не положено уйти и наслаждаться своей дурацкой поездкой?! Нет! Они решили мешать, упираться и вставлять палки в колёса на каждом шагу. Даже через онлайн-связь!"
10033110-100 = "И более того! Почему, просто ПОЧЕМУ именно Префектурная команда отвечала за организацию встречи с Хяккияко?"
10033110-102 = "Разве Общество Пандемониума не ученический совет? Разве не они должны были взять на себя хотя бы крупицу ответственности? Есть делегирование, а есть—"
10033110-104 = "Ако."
10033110-105 = "Что сделано, то сделано. Попробуй насладиться остатком праздника, пока мы ещё здесь."
10033110-106 = "Г-глава префектов?!"
10033110-107 = "[ns3] «Тогда я проведу для вас экскурсию по испытанию храбрости.»\n[ns4] «Я прошёл довольно интенсивную подготовку экскурсовода.»"
10033110-110 = "Сенсей?!"
10033110-111 = ""
10033110-113 = ""
10033110-114 = "Если... вы не против."
10033110-115 = "Х-хмф. Тебя отпускают только потому, что глава префектов столь великодушна! Не забывай!"
10033110-116 = "[s] «Да-да. Конечно.»"
10033110-118 = ""
10033110-119 = "Вам понравилась экскурсия? Надеюсь, все хорошо провели время в Хяккияко! Возвращайтесь в любое время!"
10033110-120 = "Вааа! Всё, что поднимается, должно опуститься, а нам приходится говорить печальные прощания!"
10033110-121 = "Но я не из тех, кто утопает в грусти! Я просто буду с нетерпением ждать дня, когда наши пути снова пересекутся!"
10033110-122 = "Пока-пока, друзья! В следующий раз сыграем в Mushiqueen!"
10033110-123 = ""
10033110-125 = ""
10033110-126 = "Хм? О... Уже пора. Пока, все."
10033110-127 = ""
10033110-130 = ""
10033110-131 = "Скоро посадка. Было приятно со всеми познакомиться, так что не теряйтесь."
10033110-132 = "До свидания, Умика, Пина, Каэдэ, Цубаки! И вы тоже, Сенсей!"
10033110-133 = "Хотя, Сенсей, уверена, мы пересечёмся скорее раньше, чем позже."
10033110-134 = "Хахахаха! Не порть момент!"
10033110-135 = "Пишите, если будете в Геенне! Пока!"
10033110-136 = ""
10033110-138 = ""
10033110-140 = "[ns] «До скорого!»"
10033110-142 = "Не успели мы и моргнуть, как экскурсия более-менее благополучно подошла к концу, оставив студентам множество воспоминаний."
10033110-143 = "Появились новые связи, а вместе с ними — истории на многие годы вперёд."
10033110-144 = ""
10033110-146 = ""
10033110-147 = ""
10033110-148 = "Кихихи-хи... Теперь моё влияние распространится за пределы Геенны и проникнет в Хяккияко... Хр-р... Хр-р..."
10033110-149 = ""
10033110-151 = ""
10033110-152 = "...Хотя у некоторых это породило лишь новые заблуждения."
10033110-153 = ""
10033110-156 = ""
10033110-157 = "Вечеринка после всего! В фильмах это всегда лучшая часть!"
10033110-158 = "За нас!"
10033110-160 = "Ура..."
10033110-161 = ""
10033110-164 = ""
10033110-165 = "Мне очень понравилась твоя история, Умика. Я впечатлена."
10033110-166 = "Н-ничего впечатляющего!"
10033110-167 = "Каэдэ, Цубаки, вы тоже проделали образцовую работу."
10033110-168 = "Правда? Хи-хи!"
10033110-169 = "Это ещё на шаг приближает меня к тому, чтобы стать настоящей леди!"
10033110-170 = "Жаль, тебя там не было! Я не могла поверить, когда она превратила всё это в фестиваль!"
10033110-172 = "«Огонь, который вы видите вокруг, — интерактивная часть фестиваля, требующая участия зрителей!» Вот это было просто сногсшибательно!"
10033110-174 = "Я бы не справилась без Эрики и Кирары..."
10033110-175 = "И поддержки Сенсея..."
10033110-176 = "Но именно Умика сделала шаг вперёд... и воспользовалась моментом."
10033110-177 = "Нет-нет. Всё получилось благодаря каждой из вас! Если бы не вы, я бы вообще не знала, что делать. Я почти сдалась!"
10033110-179 = "Умика! В такие моменты надо перестать спорить и просто принять комплимент!"
10033110-180 = "О!"
10033110-181 = "Р-разве это не...?"
10033110-182 = "Да! Президент Отдела фестивалей!"
10033110-183 = ""
10033110-185 = ""
10033110-187 = ""
10033110-188 = "Я уже слышала все сочные подробности."
10033110-189 = "Ты должна гордиться тем, чего добилась, Умика. Я и сама не справилась бы лучше."
10033110-190 = "..."
10033110-191 = "Серьёзно...?"
10033110-192 = "[s] «Я же говорил тебе, Умика.»"
10033110-193 = "Видишь? Все говорят одно и то же, так что держись немного увереннее!"
10033110-194 = "Выпяти грудь и скажи: «Это сделала я! Я могу принять любой вызов и превратить его в успешный фестиваль!»"
10033110-195 = "Всё ещё кажется каким-то сном, но..."
10033110-196 = "Мне и правда нравится идея превращать всё в фестиваль!"
10033110-197 = "В-всё, говоришь?"
10033110-198 = "Если оглянуться назад, всё ведь хорошо закончилось именно потому, что мы превратили это в фестиваль, да?"
10033110-199 = "[ns] «(В конце концов, получается, экскурсия И ЕСТЬ фестиваль.)»"
10033110-200 = "Когда один фестиваль заканчивается, что мы делаем дальше, Пина?"
10033110-201 = "Начинаем готовиться к следующему! Мы ведь Отдел организации фестивалей!"
10033110-202 = "Да! Я переполнена идеями! Устроим фестиваль торгового района и наймём танцевальную труппу с колокольчиками, флейтами, сямисэнами и барабанами и—"
10033110-203 = "Погоди-погоди-погоди! Я рада, что ты так загорелась, но—"
10033110-204 = "Я правильно услышала? Я уже готова к следующему событию!"
10033110-206 = "*зевает* Только обязательно... запланируйте время на сон."
10033110-207 = ""
10033110-210 = ""
10033110-211 = ""
10033110-212 = ""
10033110-213 = ""
10033110-215 = ""
10033110-216 = ""
10033110-217 = ""
10033110-218 = ""
10033110-219 = ""
10033110-220 = ""
10033110-227 = ""
10033110-228 = "Эм, Сенсей?"
10033110-229 = "[ns] «Хм?»"
10033110-230 = "Если честно, я даже не знаю, с чего начать."
10033110-231 = "Но прежде всего я хочу от всего сердца поблагодарить вас."
10033110-232 = "[s5] «Мне тоже очень многое хочется с тобой обсудить.»\n[s6] «Но прежде всего — поздравляю.»"
10033110-235 = "П-поздравляете? С чем?"
10033110-236 = ""
10033110-238 = ""
10033110-239 = "О, вы имеете в виду успешное завершение моего первого фестиваля?"
10033110-240 = "Хи-хи. Спасибо, Сенсей."
10033110-241 = "..."
10033110-242 = "Но, Сенсей?"
10033110-243 = ""
10033110-245 = ""
10033110-249 = "В следующий раз, когда будете в Хяккияко, пожалуйста, вспомните о нас."
10033110-250 = "Мы устроим фестиваль ещё больше и ещё ярче всего, что вы когда-либо видели!"
10033110-251 = ""
10033110-253 = ""
10033110-254 = "Шумно и весело"
