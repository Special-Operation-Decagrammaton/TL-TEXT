[translation]
10059100-1 = "Episode 10;The Comedy Stage"
10059100-2 = "(The day after visiting Manami's private museum)"
10059100-6 = "(I just couldn't get the tiara I saw there out of my head.)"
10059100-7 = "(That tiara was definitely—)"
10059100-11 = "[ns1] \"Collecting is an 'art of sensation' that transcends time...\"\n[ns2] \"Could it be...?\""
10059100-15 = "(Curious, I started looking into past ballet performances.)"
10059100-16 = "(And then...)"
10059100-17 = "[ns] \"...I knew it.\""
10059100-19 = "(I found it.)"
10059100-20 = "(A Wild Hunt Ballet production—The Steadfast Tin Soldier)"
10059100-23 = "(Wearing that tiara, dancing dazzlingly as the ballerina doll—)"
10059100-24 = "(It was Manami.)"
10059100-26 = "Among them, I am particularly fond of the piece 'The Steadfast Tin Soldier'."
10059100-27 = "The original is a sad story about a one-legged toy soldier and a ballerina doll."
10059100-28 = "However, it was once adapted and performed with a happy ending."
10059100-30 = "(But Manami only stood on that stage until last summer.)"
10059100-33 = "(After that summer, Manami could no longer stand on stage.)"
10059100-34 = "(Because...)"
10059100-37 = "[log]Wild Hunt's top ballerina[/log]"
10059100-39 = "[log][ff4444]Retirement unavoidable due to ankle injury![-][/log]"
10059100-44 = "(How she was injured, if there was any hope for recovery, what she would do next...)"
10059100-45 = "(Since Manami refused all interviews, I couldn't find out the details.)"
10059100-46 = "(Although she could manage daily life thanks to rehabilitation, there were articles saying #nher return was hopeless.)"
10059100-47 = "(Manami's story as a ballerina had come to an end all too abruptly.)"
10059100-50 = "Nothing in this world lasts forever."
10059100-51 = "Even the stars shining in the night sky will eventually lose their light..."
10059100-53 = "(...In the end, she lost her dream.)"
10059100-54 = "(The star that shone brighter than anyone else met its end in the way she least desired.)"
10059100-55 = "(Even so—)"
10059100-57 = "Someday, I want to build a museum much larger than this one."
10059100-58 = "A museum that houses not just my own memories, but the memories of all the students."
10059100-59 = "I hope the memories left there will become a pillar of support for students chasing their dreams."
10059100-60 = "What do you think? Don't you think it would be a wonderful museum?"
10059100-65 = "(—She kept moving forward for everyone's sake.)"
10059100-69 = "Hehe. Yes. I want to be a curator for everyone."
10059100-70 = "That is the reason I became the Council President."
10059100-72 = "(That girl who lost her dream is reaching out toward a new one.)"
10059100-77 = "[ns] (I can't let Manami's feelings)"
10059100-79 = "[ns] (be crushed in a place like this!!)"
10059100-82 = "...Your look has changed."
10059100-83 = "I'll have some expectations for you."
10059100-84 = "Don't disappoint me."
