[translation]
2601006-1 = "Смелый эксперимент"
2601006-2 = "Город Коусаги"
2601006-3 = "Получив тревожное сообщение от Мию в MomoTalk, я поспешил на улицы возле лагеря отряда RABBIT."
2601006-4 = "И найти её было совсем нетрудно..."
2601006-6 = "Сенсей..."
2601006-7 = "Т-Тут..."
2601006-8 = ""
2601006-9 = ""
2601006-10 = "Я знала, что вы придёте, но не думала, что так быстро..."
2601006-11 = "Может, мой новый образ и правда работает... Хи-хи..."
2601006-12 = "[s1] «М-М-М-М-Мию?!»\n[s2] «Что на тебе надето?!»"
2601006-15 = "Д-Да, насчёт этого..."
2601006-16 = "Я хотела изменить свой образ, как увидела в одном модном журнале."
2601006-17 = "[s3] «И ты называешь это „изменить образ“?»\n[s4] «Поэтому ты надела купальник?!»"
2601006-20 = "Да... Я решила попробовать этот купальник."
2601006-21 = "Если надеть купальник на пляже или у бассейна, никто особо не обратит внимания, если у тебя нет яркой внешности..."
2601006-22 = "Но если ходить в купальнике по городу, это отличный способ выделиться. Поэтому я подумала, что так смогу привлечь внимание..."
2601006-23 = "И ведь ничего плохого в этом нет. Одежду же носят, чтобы её видели, правда...?"
2601006-24 = "[s] «Конечно ты привлечёшь внимание!»"
2601006-25 = "В-Вы уверены...?"
2601006-26 = "Вы же знаете, меня никто никогда не замечает... Что бы я ни делала..."
2601006-27 = "Я весь день хожу в этом купальнике, и никто мне ни слова не сказал..."
2601006-28 = "[s] «Наверное, они просто не знают, с чего начать разговор, когда ты так одета...»"
2601006-30 = ""
2601006-32 = ""
2601006-33 = ""
2601006-34 = ""
2601006-36 = ""
2601006-38 = ""
2601006-39 = ""
2601006-40 = ""
2601006-41 = ""
2601006-42 = "В-Вы думаете, дело в этом...?"
2601006-43 = "Но... даже когда я в школьной форме, со мной почти никто не разговаривает..."
2601006-44 = "Может, со мной вообще никто никогда не знает, с чего начать..."
2601006-45 = "[s] «Об этом поговорим потом. Сначала нужно переодеть тебя обратно в школьную форму.»"
2601006-46 = "Вы хотите, чтобы я снова стала такой, как раньше...?"
2601006-47 = "Я наконец-то п-придумала способ выделиться, а вы говорите вернуться в мою скучную старую незаметную форму..."
2601006-48 = "Почему вы так со мной...?"
2601006-49 = ""
2601006-50 = "Эй, это разве не Сенсей из Шале? Почему он кричит на того студента? И почему она в купальнике...?"
2601006-51 = "Я раньше видела, как она ходила по городу в этом купальнике... Неужели Сенсей из Шале заставил её надеть его?"
2601006-52 = "Не могу поверить, что он так позорит бедного беззащитного студента прямо на людях..."
2601006-53 = "Я слышала, что Шале — страшное место, но такого даже не представляла..."
2601006-54 = "[ns] «Пожалуйста, пожалуйста, пожалуйста, можно мы уже уйдём?»"
2601006-56 = "Наконец мне удалось убедить Мию не ходить по улицам в купальнике..."
2601006-57 = "Но остановить распространение новых странных слухов о Шале было уже слишком поздно..."
