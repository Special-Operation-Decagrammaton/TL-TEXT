[translation]
10045110-1 = "Эпизод 11;Бой, от которого нельзя отступить"
10045110-2 = "Ты бросаешь мне вызов, Нагуса?"
10045110-3 = "Хи-хи. Принимаю! Как лидер Хяккарёран, ты достойный противник!"
10045110-4 = "Тогда начнём..."
10045110-5 = "Нет. Я не стану с тобой сражаться."
10045110-6 = "А? Тогда кто?"
10045110-7 = "Твоим противником будет..."
10045110-8 = ""
10045110-11 = ""
10045110-12 = "Кикё!"
10045110-13 = ""
10045110-15 = ""
10045110-16 = "Я никогда не сражалась на плавающей платформе, поэтому не уверена в победе."
10045110-17 = "Кикё, напротив, уже испытала это. Она даст тебе бой, достойный твоего времени."
10045110-18 = "Полностью согласна!"
10045110-19 = "Теперь Кикё может танцевать на ветру с силой тысячи львов!"
10045110-21 = "Смелое заявление. Ты его подтверждаешь?"
10045110-22 = "...Не могу отрицать её слов."
10045110-23 = "Изуна, Рэнгэ и Чисэ всё ещё восстанавливаются после своих матчей."
10045110-24 = "Среди полуфиналистов у меня наибольший запас выносливости."
10045110-25 = "Моё быстрое выбывание вызвало эффект бабочки, приведший меня сюда."
10045110-27 = "Вот наша Кикё! Крутая, уверенная и невозмутимая!"
10045110-28 = "Тогда мы будем за тебя болеть!"
10045110-29 = ""
10045110-32 = ""
10045110-33 = "Вас устраивает, если это буду я, Сенсей?"
10045110-34 = "[s1] «Конечно!»\n[s2] «Полагаюсь на тебя!»"
10045110-37 = "Тогда наш показательный матч — Кикё против Вакамо!"
10045110-38 = ""
10045110-39 = "Ого! Такой бой войдёт в историю!"
10045110-40 = "Эй, как думаете, кто победит?"
10045110-41 = "Эм... Ну, она ведь одна из Семи заключённых, да?"
10045110-42 = "Я-я думаю, Хяккарёран! Ставлю свои закуски!"
10045110-44 = "А? Мы теперь ставим закуски?! Эм... Э-э-эм..."
10045110-45 = "Тогда мои деньги (закуски) на девушку из Семи заключённых!"
10045110-46 = "Пожалуйста, победи! Умоляю! Мои закуски — моя жизнь!"
10045110-47 = "...Похоже, все этого ждут."
10045110-48 = "Я готова. Начнём."
10045110-49 = "Хи-хи. Какая уверенность."
10045110-50 = "«Уверенность» здесь ни при чём."
10045110-51 = "Я просто должна это сделать, значит, сделаю."
10045110-52 = "Ах. Я обязана признать твою решимость. Тогда иди."
10045110-53 = "Кто станет чемпионом Сенсея?"
10045110-55 = "Матч начинается!"
10045110-56 = "[ns] «Пусть это будет честный бой...!»"
10045110-60 = ""
10045110-61 = ""
10045110-62 = ""
10045110-64 = "(Как и ожидалось от Лисицы Бедствия. Она сильна!)"
10045110-65 = "Сенсей! Эта победа — для вас!"
10045110-66 = "Уф!"
10045110-67 = ""
10045110-70 = ""
10045110-72 = "Кикё уже загнали в угол? Неужели всё закончится быстрее, чем мы думали?"
10045110-73 = "...Сила Вакамо и правда пугает."
10045110-74 = "Но сейчас Кикё сильнее, чем когда-либо. Я верю в неё!"
10045110-75 = ""
10045110-76 = "(Какая подавляющая сила...)"
10045110-77 = "(Будто тебя подхватила огромная волна. Неудержимая стихия.)"
10045110-78 = ""
10045110-79 = "Больше работай руками и ногами! И расслабься! Иначе утонешь!"
10045110-80 = "Как именно ты предлагаешь мне одновременно расслабиться И двигать конечностями? Это, по-твоему, логично?!"
10045110-81 = "Разве ты не слышала о парадоксе непреодолимой силы? Нельзя быть неподвижным объектом! Плыви по течению!"
10045110-82 = "Как только начнёшь, быстро привыкнешь."
10045110-83 = ""
10045110-84 = "(Мне просто нужно почувствовать течение.)"
10045110-85 = "(Нет никакого давления. Я доверяю себе.)"
10045110-86 = ""
10045110-92 = "Несмотря на опасное положение, Кикё умудряется контратаковать! Она уклоняется от атаки Вакамо и вот-вот споткнётся—"
10045110-93 = "Нет, она вращается!"
10045110-94 = "Этот приём...!!"
10045110-98 = "[ns] «Она сделала это! Захват нитями Кикё!»"
10045110-99 = "А?! П-Почему я не могу выбраться?"
10045110-100 = "Это основы вязания."
10045110-101 = "Я никогда не слышала о таком вязании!"
10045110-102 = "Смысл похож: я «вяжу» свою цель."
10045110-103 = "А! Вакамо застали врасплох!"
10045110-105 = "Стиль Кикё — подавить противника минимальным количеством движений."
10045110-106 = "Н-Но Рэнгэ ведь вырвалась из этого приёма, разве нет?"
10045110-108 = "Если честно, только потому, что я примерно ожидала от неё чего-то такого."
10045110-109 = "А Кикё, которую мы видим сейчас, вся горит юношеским азартом!"
10045110-110 = "Угх! УГХХХ!"
10045110-111 = ""
10045110-114 = ""
10045110-115 = ""
10045110-116 = "...Похоже, я тебя недооценила."
10045110-118 = "О-о, Вакамо! У неё получилось! Она вырвалась из захвата Кикё!"
10045110-120 = "Давай. Я повалю тебя столько раз, сколько потребуется."
10045110-121 = "Тогда мне просто нужно действовать первой!"
10045110-123 = ""
10045110-125 = ""
10045110-126 = ""
10045110-129 = "...!!"
10045110-130 = "Упругость надувной платформы делает твои движения размашистее, поэтому тебя легко читать."
10045110-131 = "Ты так размахиваешься, будто сама просишь меня поймать тебя."
10045110-132 = "...!!"
10045110-133 = "И Кикё снова берёт Вакамо в захват!"
10045110-134 = "...Правда, в обычном бою шансы Кикё победить Вакамо невелики."
10045110-135 = "Но эту местность она знает! И она наш стратег!"
10045110-136 = "У Кикё всё это время было преимущество!"
10045110-138 = "Ого! Похоже, Кикё действительно может вырвать победу!"
10045110-139 = "И как раз когда бой достиг кульминации..."
10045110-140 = ""
10045110-143 = ""
10045110-144 = ""
10045110-146 = "...А? Что случилось?"
10045110-147 = "[s] «Похоже... платформа взорвалась.»"
10045110-148 = "А! Ч-Что ЭТО?!"
10045110-149 = "Кикё, сзади! Волна!"
10045110-150 = ""
10045110-153 = ""
10045110-157 = ""
10045110-158 = "Какой неожиданный поворот событий!"
10045110-159 = "Пожалуйста, подождите, пока мы просмотрим запись и определим победителя!"
10045110-163 = ""
10045110-164 = ""
10045110-165 = "Платформа взорвалась..."
10045110-166 = "Да. Но ты упала первой."
10045110-167 = "Ни за что."
10045110-168 = ""
10045110-170 = ""
10045110-171 = ""
10045110-172 = "О-о, а победителем становится! Кирю Кикё!!"
10045110-173 = ""
10045110-175 = ""
10045110-176 = ""
10045110-177 = "Это..."
10045110-178 = "Как бы это ни произошло, правило гласит: «Кто первым упадёт в океан — проиграл.»"
10045110-179 = "Тогда, как я и обещала Сенсею, я подчинюсь правилам и признаю поражение. Однако в следующий раз..."
10045110-181 = "Да. В следующий раз."
10045110-182 = "Хм. Кстати говоря..."
10045110-183 = "...ты странно плаваешь. Прямо как—"
10045110-184 = "Стой. Остановись. Не смей говорить ни слова."
10045110-185 = ""
10045110-186 = "Ну что ж, на этом показательный матч окончен! Давайте вернёмся к—"
10045110-187 = ""
10045110-190 = ""
10045110-191 = "Ч-Что теперь?!"
10045110-192 = "[s] «У нас тут... кое-где всё сломано.»"
10045110-193 = "А-Ах! Рабочие! Огонь! Тушите огонь!"
10045110-194 = "[ns3] «Для этого уже немного поздно...»\n[ns4] «...Всё всегда заканчивается взрывом, да?»"
10045110-197 = ""
