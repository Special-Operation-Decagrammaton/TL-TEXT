80000029-24 = ""
80000029-26 = ""
80000029-27 = ""
80000029-29 = "Это были конфеты с ромом!"
80000029-30 = "Я раньше никогда их не пробовала! И пахли они так вкусно!"
80000029-31 = "Неужели я опьянела от рома в конфетах?"
80000029-32 = "Я не знала, что так вообще можно..."
