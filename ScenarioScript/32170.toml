[translation]
32170-1 = "Эпизод 17;Так устроен мир, часть 1"
32170-2 = "А-а-а-а!"
32170-3 = ""
32170-5 = ""
32170-8 = "Всё закончилось?"
32170-9 = "Все подразделения противника выведены из строя."
32170-10 = "Команды Сенсея и правда впечатляют. Ничего себе..."
32170-11 = ""
32170-13 = ""
32170-14 = "Что ж, как минимум один кризис миновал."
32170-15 = "Скоро прибудут подкрепления Ариуса. Наша цель — продержаться до их прихода."
32170-16 = "Нужно продержаться до вмешательства Отряда правосудия, иначе все наши усилия пропадут зря."
32170-17 = "Я-Я уже связалась с Хасуми! Она скоро ответит!"
32170-18 = "Отлично. Отряд правосудия всё ещё под прямым командованием Чайной партии, поэтому это был единственный способ заставить их покинуть пост."
32170-19 = "Хасуми к этому моменту уже должна была заметить, что Нагиса пропала."
32170-20 = "То, что ты связалась с Хасуми, ускорит дело. Отряду правосудия осталось лишь подтвердить ситуацию."
32170-21 = "Надеюсь, они успеют..."
32170-22 = ""
32170-25 = "...?!"
32170-26 = "Подкрепления..."
32170-27 = ""
32170-29 = ""
32170-31 = ""
32170-32 = ""
32170-33 = ""
32170-35 = "Уже здесь?"
32170-36 = "К-Как?!"
32170-37 = ""
32170-40 = ""
32170-41 = ""
32170-42 = ""
32170-44 = "Это скорее целая армия, чем подкрепление. Наверное, пришла половина учеников школы-спутника..."
32170-45 = "Н-Неужели они направили столько сил на территорию Тринити?!"
32170-46 = "А Отряда правосудия всё ещё не видно."
32170-47 = "Конечно, не видно."
32170-48 = ""
32170-49 = "Т-Ты!"
32170-50 = ""
32170-52 = ""
32170-54 = "Вас окружила вооружённая сила, которая заменит официальный отряд Тринити."
32170-55 = "[s] «Мика?..»"
32170-56 = "Рада снова вас видеть, Сенсей."
32170-57 = "Как я и сказала, Отряд правосудия не сдвинется с места. Таков мой приказ."
32170-58 = "Вы ведь заметили, как опустел кампус сегодня утром?"
32170-59 = "Я устранила все помехи на своём пути и приказала всем, кто подчиняется Чайной партии, сложить оружие."
32170-60 = "Не хочу, чтобы кто-нибудь помешал нашему нападению на Наги."
32170-61 = "Мисоно Мика из Чайной партии..."
32170-62 = "Это я. И вот я здесь, собственной персоной, главный кукловод всего происходящего. ☆"
32170-63 = "Считайте меня настоящей предательницей Тринити."
32170-64 = "..."
32170-65 = "..."
32170-66 = "...?!"
32170-68 = "Не скажешь, где ты спрятала Наги? У меня мало времени."
32170-71 = "Или мы можем перебить вас всех и обыскать здание от чердака до подвала."
32170-73 = "[ns] «Почему, Мика? Зачем?..»"
32170-74 = "М? Хотите знать, почему я это делаю, Сенсей?"
32170-75 = "Потому что ненавижу Геенну."
32170-76 = "Я всей душой презираю академию Геенна."
32170-77 = "Значит, настоящая цель — сорвать подписание Эдемского договора? Поэтому ты напала на Нагису?"
32170-78 = "Эм... а вы кто? Простите, я всегда плохо запоминала лица."
32170-79 = "А, вспомнила. Ты Урава Ханако, да? Та, кого выгнали из часовни за то, что пришла туда в купальнике. Ха-ха-ха!"
32170-80 = "..."
32170-81 = "Что ж, отвечая на вопрос: именно так. Идея Эдемского договора Наги была просто нелепой. Абсурдной."
32170-82 = "Мирный договор с этими мерзавцами? От одной мысли о сосуществовании с ними меня воротит."
32170-83 = "И надолго бы его хватило? Сколько лет — недель — нет, дней пройдёт, прежде чем нас ударят ножом в спину?"
32170-84 = "Я просто не могу этого допустить."
32170-85 = "Наги так боится всех вокруг, а сама до ужаса наивна. Это не сказка. За её договором не будет счастливого конца."
32170-86 = "Пора ей смириться с окружающей действительностью."
32170-87 = "Так что выдайте её. Обещаю, я её не убью. Да, остаток школьных лет ей, возможно, придётся провести взаперти, но ничего страшного."
32170-88 = "[s] «Так Эдемский договор всё-таки был мирным договором.»"
32170-89 = "А, это. Да, простите, что обманула вас, Сенсей. В нашем разговоре была не вся правда."
32170-90 = "Такая наивная и несведущая, как Наги, ни за что бы не додумалась использовать Эдемский договор, чтобы создать военный союз под своим контролем."
32170-91 = "Но я не во всём лгала, Сенсей."
32170-92 = "Я говорила правду о примирении с Ариусом."
32170-93 = ""
32170-95 = ""
32170-96 = "Видите? Для тех, кто хочет начать войну с Геенной, они довольно верные союзники."
32170-97 = "Как я и говорила, Ариус когда-то был частью нас — академией, которая могла бы войти в союз Тринити. Конечно, они ненавидят Геенну. Ненавидели всегда. Их академию держит вместе одна лишь вражда."
32170-98 = "Вот почему я протянула им оливковую ветвь. Я предложила им остановить злодейку, которая хочет принять Геенну с распростёртыми объятиями."
32170-99 = "Я сказала: если нынешнюю главу, Кирифуджи Нагису, поддерживает Отряд правосудия, то следующую главу, Мисоно Мику, поддержит Ариус."
32170-100 = "Ну как вам такое предложение? Вот это миротворчество."
32170-101 = "Как говорится, враг моего врага — мой друг. Поэтому я тайно поддерживала Ариус."
32170-102 = "С самого начала ты использовала Ариус, чтобы совершить государственный переворот..."
32170-103 = "Можно назвать и так. Нагису свергнут, а я стану главой Чайной партии."
32170-104 = "Спасибо тебе, Азуса. Мы почти незнакомы, но ты для меня особенная. Я перед тобой в большом долгу..."
32170-105 = "...за то, что примешь вину как нападавшая на Наги."
32170-106 = "...!"
32170-107 = "Ты станешь козлом отпущения. Кто-то должен понести ответственность — иначе как общество успокоится, пока виновницу не привлекут к правосудию?"
32170-108 = "Знаю, не слишком оригинально, но ничего не поделать. Иногда мир просто так устроен."
32170-109 = "..."
32170-110 = "Но ты меня действительно удивила. Когда я впервые услышала, что на Наги напали, подумала, что все мои планы сейчас сорвутся. Ты вынудила меня действовать, и пришлось лично приехать разобраться."
32170-111 = "Не ожидала такого смелого хода от Клуба дополнительных занятий. Молодцы."
32170-112 = "[s] «Ты сделала всё это ради поста хозяйки Чаепития?»"
32170-113 = "Верно."
32170-114 = "О, но не пойми неправильно, Сенсей. Дело не в том, чтобы захватить власть ради самой власти."
32170-115 = "Я просто хочу стереть Геенну с лица Кивотоса. Вот и всё."
32170-116 = "[s] «...»"
32170-117 = "Я вычищу из Тринити всех умеренных и идеалистов, которые поддерживали Наги, и посажу на их места лидеров из Ариуса."
32170-118 = "Возможно, это станет началом нового союза. Мы даже можем провести новый совет в его честь. Не такая уж плохая идея, правда?"
32170-119 = "А затем! Обновлённая Тринити объявит Геенне тотальную войну! Вот такой план!"
32170-120 = "[ns] «Хватит!»"
32170-121 = "Э-Эй, не пугай меня так."
32170-122 = "Я никогда не слышала, чтобы ты так повышал голос. Похоже, моё объяснение тебе не понравилось, да?"
32170-123 = ""
32170-125 = ""
32170-126 = ""
32170-127 = "Ничего страшного. Обсудим это подробнее, когда я закончу с текущим делом."
32170-128 = ""
32170-130 = ""
32170-131 = "Осторожно, Сенсей."
32170-132 = "Я чувствую... Она сильная."
32170-133 = "Спасибо, что заметила! Видишь, я же говорила тебе в прошлый раз, Сенсей? Я гораздо крепче, чем выгляжу."
32170-134 = "Ладненько. Тогда избавимся от Клуба дополнительных занятий."
