[translation]
32170-1 = "Episódio 17;Mesmo um Mundo Assim (1)"
32170-2 = "Guh, ugh...!!"
32170-8 = "V-Vencemos...?"
32170-9 = "Todas incapacitadas para o combate."
32170-10 = "Auuh... Com o comando do Sensei, fomos mesmo salvas..."
32170-14 = "...Sim. Bom, agora que superamos um obstáculo difícil, vamos passar para a próxima fase?"
32170-15 = "Os reforços de Arius devem chegar logo em seguida, mas só precisamos ganhar tempo."
32170-16 = "Se conseguirmos ganhar tempo até que as tropas do Comitê de Justiça cheguem aqui..."
32170-17 = "Ah, eu já entrei em contato com a Hasumi-senpai! Ela deve responder logo!"
32170-18 = "Sim, muito obrigada♡... Se há um momento em que o Comitê de Justiça, que está sob as ordens da Tea Party, pode agir por conta própria, é apenas quando surge algum problema com a segurança da Tea Party."
32170-19 = "Deve haver contatos regulares e coisas do tipo, então a esta altura a Hasumi-san e as outras já devem ter percebido que aconteceu alguma coisa com a Nagisa-san."
32170-20 = "Somando isso ao contato da Koharu-chan... não deve demorar muito até que comecem a se mobilizar, pelo menos para verificar a situação."
32170-21 = "Agora, só nos resta torcer para que cheguem rápido..."
32170-25 = "!?"
32170-26 = "Isso é..."
32170-35 = "Os reforços chegaram tão rápido assim...!?"
32170-36 = "H-Hã...?"
32170-44 = "...São muitas, em escala de batalhão. Provavelmente quase metade do efetivo de Arius..."
32170-45 = "Auuh...! T-Tanta gente assim, entrando tão abertamente no território de Trinity...!?"
32170-46 = "Ainda não há nenhum sinal de movimentação do Comitê de Justiça...?"
32170-47 = "Não tem jeito quanto a isso."
32170-49 = "...!"
32170-54 = "Afinal, daqui pra frente, essas pessoas vão se tornar a força armada oficial de Trinity."
32170-55 = "[s] \"Mika...?\""
32170-56 = "Oii, quanto tempo, Sensei. Que bom te ver de novo."
32170-57 = "Ah, e o Comitê de Justiça não vai se mexer, viu? Porque eu emiti uma nova ordem para ficarem de prontidão."
32170-58 = "A escola estava bem silenciosa hoje, né? Além do Comitê de Justiça, eu já tinha dado um jeito com antecedência em tudo o que pudesse atrapalhar."
32170-59 = "Inventei vários motivos para manter todo mundo retido em todos os lugares onde as ordens da Tea Party chegam."
32170-60 = "Porque seria um problemão se alguém me atrapalhasse na hora de atacar a Nagi-chan, né?"
32170-61 = "Uma das integrantes da \"Tea Party\"... Misono Mika-san..."
32170-62 = "Bom, resumindo, acho que é a entrada da mente por trás de tudo☆?"
32170-63 = "Eu sou a verdadeira \"traidora de Trinity\"."
32170-64 = "..."
32170-65 = "..."
32170-66 = "...!?"
32170-68 = "Sendo assim, podem me contar onde esconderam a Nagi-chan? Eu também tô meio sem tempo."
32170-71 = "Bom, eu até poderia varrer todo mundo que tá aqui do mapa primeiro e depois procurar com calma. Mas isso daria trabalho demais, né?"
32170-73 = "[ns] \"Mika, por quê...?\""
32170-74 = "Hmm? Quer saber? Bom, se é o Sensei quem tá pedindo, não tenho como recusar, né~"
32170-75 = "É porque... eu odeio Gehenna."
32170-76 = "Eu realmente, de coração... do fundo do meu coração, odeio Gehenna."
32170-77 = "...E por isso você quer cancelar o Tratado do Éden? Foi para isso que atacou a Nagisa-san...?"
32170-78 = "Hmm... quem é você mesmo? Foi mal, eu não sou muito boa em lembrar de rostos."
32170-79 = "...Ah, lembrei. É a Urawa Hanako, né? Aquela que participou da aula na capela de maiô e foi expulsa. Ahaha, que nostalgia."
32170-80 = "..."
32170-81 = "Bom, respondendo à sua pergunta, é isso mesmo. Porque a Nagi-chan inventou de fazer uma coisa esquisita como o Tratado do Éden."
32170-82 = "Um tratado de paz com aquela gentalha chifruda de Gehenna? Não acha que até pra uma piada isso passa dos limites? Só de pensar já me dá calafrios."
32170-83 = "É óbvio que vão trair a gente, né? Se dermos as costas, vão nos apunhalar na mesma hora, sabia?"
32170-84 = "Eu não posso deixar uma coisa dessas acontecer."
32170-85 = "A Nagi-chan também, viu... não sei se digo que ela é gentil ou boazinha até demais... Isso aqui não é uma historinha escolar alegre de ficção. Uma história tão conveniente assim não existe na realidade."
32170-86 = "Já passou da hora de ela entender que nós vivemos num mundo muito mais sujo e turvo como este, não acha?"
32170-87 = "...Então é por isso. Podem me devolver a Nagi-chan? Relaxem, não vou machucar ela. Bom, talvez ela passe o resto da vida escolar inteira dentro de uma jaula, mas só isso."
32170-88 = "[s] \"Então o Tratado do Éden era mesmo um legítimo tratado de paz...\""
32170-89 = "Ah, desculpa ter te enganado naquela hora, Sensei. Aham, aquilo era mentira."
32170-90 = "Aquilo é um tratado de paz de verdade. Pra começo de conversa, a Nagi-chan, ingênua e bobinha do jeito que é, jamais conseguiria usar o Tratado do Éden como uma aliança militar."
32170-91 = "...Mas nem tudo o que eu te contei naquela ocasião era mentira, viu?"
32170-92 = "A parte sobre eu querer me reconciliar com Arius era a mais pura verdade."
32170-96 = "Essas meninas são companheiras que compartilham do mesmo ódio por Gehenna."
32170-97 = "Arius também fazia parte de Trinity originalmente. Como eu já tinha dito ao Sensei antes, o ódio que essas meninas sentem por Gehenna é imenso, não perde em nada para o nosso. Aliás, talvez dê até pra dizer que o ódio delas é ainda mais puro."
32170-98 = "Por isso estendi a mão para elas. Perguntei se não queriam unir forças por um ideal em comum e acabar com os vilões que estão tentando assinar um tratado de paz com Gehenna."
32170-99 = "Se a anfitriã da Tea Party, \"Kirifuji Nagisa\", tem o Comitê de Justiça, a próxima anfitriã da Tea Party, \"Misono Mika\", terá Arius ao seu lado."
32170-100 = "Esse é o acordo. Tipo um passo adiante rumo à reconciliação?"
32170-101 = "Em nome de um inimigo em comum, antigos inimigos dão as mãos temporariamente. É isso. E foi por isso que eu estive apoiando Arius em segredo."
32170-102 = "Arius foi, desde o início, apenas uma ferramenta para um golpe de Estado em Trinity...?"
32170-103 = "Hmm? ...É, de fato. Acho que dá pra chamar isso de golpe de Estado mesmo. Afinal, no fim das contas, vou depor a Nagi-chan e me tornar a anfitriã da Tea Party."
32170-104 = "Ah, de você eu lembro bem. Obrigada, Shirasu Azusa. Eu não sei muito sobre você, mas isso não muda o fato de que você é uma pessoa muito importante para mim. Tanto até agora quanto daqui pra frente."
32170-105 = "Afinal, a partir de agora, vou precisar que você seja a culpada pelo ataque à Nagi-chan."
32170-106 = "...!!"
32170-107 = "Seria melhor dizer bode expiatório? É justamente por existir um sacrifício para levar a culpa que todo mundo pode dormir profundamente e em paz."
32170-108 = "O mundo funciona assim, não é?"
32170-109 = "..."
32170-110 = "Mas eu levei um susto, viu? Quando ouvi que a Nagi-chan tinha sido atacada por alguém de identidade desconhecida, fiquei até meio nervosa achando que meu plano ia desmoronar..."
32170-111 = "Quem diria que era o Clube de Aulas de Reforço, né~? Essa foi totalmente inesperada. Aham."
32170-112 = "[s] \"...Tudo isso apenas para se tornar a anfitriã da Tea Party?\""
32170-113 = "Aham, isso mesmo."
32170-114 = "Ah, mas não quero que me entenda mal, Sensei. Não é como se eu quisesse poder nem nada do tipo."
32170-115 = "Eu só quero apagar Gehenna de Kivotos... É realmente só isso, e nada mais."
32170-116 = "[s] \"...\""
32170-117 = "Expulsar a ala moderada de Trinity e preencher as vagas vazias com Arius."
32170-118 = "Quem sabe não se torna até uma nova coalizão? Se for preciso, podemos até convocar um novo Concílio e... aham, não seria uma boa ideia?"
32170-119 = "E então, uma Trinity reorganizada e com uma nova força militar declarará guerra total contra Gehenna. Sim, esse é o meu plano!"
32170-120 = "[ns] \"...!\""
32170-121 = "Uau, que susto..."
32170-122 = "Sensei, você também sabe fazer uma cara bem assustadora, né...? Aham, deu pra entender direitinho que o Sensei tá muito bravo. Desculpa, viu? Acho que expliquei tudo meio na pressa e de qualquer jeito, né?"
32170-127 = "Eu bem que gostaria de conversar com mais calma... mas que tal a gente dar um jeito em tudo o que está atrapalhando primeiro?"
32170-131 = "...Cuidado, Sensei."
32170-132 = "Só de olhar para ela assim já dá para perceber... Ela é muito forte."
32170-133 = "Fufu, isso mesmo. Eu já tinha dito ao Sensei antes, mas eu sou bem fortinha, viu?"
32170-134 = "Pronto. Então, podem dar um jeito no Clube de Aulas de Reforço pra mim?"
