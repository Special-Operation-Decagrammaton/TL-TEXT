[translation]
13180-1 = "Episódio 18;Caos Total"
13180-13 = "Isso é tudo?"
13180-18 = "Todas as forças que preparamos..."
13180-19 = "Nunca imaginei que ela fosse tão forte..."
13180-20 = "Não, isso é impossível.#nA Nephthys se aliando à Kaiser?!"
13180-21 = "O que significa isso?!#nVocês não eram inimigos mortais?"
13180-23 = "Sim, tem toda razão."
13180-24 = "Contudo, achou mesmo que eles entregariam os créditos da Ferrovia Transdesértica#nsem pedir nada em troca?"
13180-25 = "Estávamos negociando por baixo dos panos."
13180-26 = "M-Mesmo assim, fazer a própria herdeira de refém!"
13180-27 = "Não houve escolha. Simples assim."
13180-28 = "Pedirei desculpas depois."
13180-29 = "Porém, considerando o prejuízo que a senhorita causou no passado...#nNem isso seria suficiente."
13180-30 = "Agora basta Hoshino Takanashi declarar a nulidade do contrato#ne a posse do Canhão Ferroviário passará para nós, da Nephthys."
13180-31 = "E a senhorita poderá viver dias felizes como aluna de Abydos#naté a formatura."
13180-33 = "Nephthys...?#nNão vai ficar com a Kaiser?"
13180-34 = "...A Kaiser não tem interesse no Canhão Ferroviário?"
13180-35 = "A propósito, de onde tirou a informação de que eu traí vocês?"
13180-36 = "I-Isso foi..."
13180-38 = "Fui eu."
13180-39 = "Suou-san...?!"
13180-45 = "O quê... V-Você mudou de lado?!"
13180-47 = "Não, não é bem assim."
13180-57 = "P-Presidente...?"
13180-63 = "Originalmente, ela pertencia à Kaiser PMC."
13180-64 = "...Isso é passado."
13180-66 = "Quem foi que acolheu você quando não tinha para onde ir?!#nE é assim que retribui o favor...?!"
13180-68 = "E quem foi que pediu a sua ajuda?"
13180-69 = "...General."
13180-70 = "Fique quietinho aí."
13180-95 = "Ugh..."
13180-96 = "Tsc..."
13180-98 = "Bom trabalho."
13180-99 = "Graças a vocês, obtivemos um lucro astronômico."
13180-100 = "Presidente, aqui estão aquelas informações."
13180-101 = "Ora, ora."
13180-105 = "Um Canhão Ferroviário... Parece bem interessante.#nQuem diria que algo tão magnífico estava em Abydos."
13180-106 = "...Por que não me contou sobre isso?"
13180-108 = "Guh..."
13180-114 = "É muito mais realista do que aquela ideia absurda#nde uma nave de guerra espacial."
13180-115 = "Segundo as análises, trata-se de uma arma de poder assimétrico sem precedentes."
13180-116 = "Já faz um bom tempo desde que perdemos contato com o \"Terno Preto\".#nJusto quando buscávamos um novo poder, encontramos o legado do Imperador do Trovão."
13180-117 = "Sim. Com isso, aquele plano também..."
13180-118 = "...Hmm."
13180-119 = "Muito bem. O Canhão Ferroviário será nosso."
13180-121 = "O quê?!"
13180-128 = "Localizem o Canhão Ferroviário imediatamente.#nDeve estar em algum ponto ao longo dos trilhos."
13180-129 = "Entendido."
13180-130 = "Vocês não têm direito de posse sobre o Canhão Ferroviário!"
13180-131 = "Ah, é?"
13180-132 = "A Kaiser vendeu os créditos para o fundo privado!"
13180-133 = "Os direitos sobre o Canhão Ferroviário dependem do contrato firmado com o Conselho Estudantil de Abydos!"
13180-134 = "Francamente, quem você pensa que eu sou?"
13180-135 = "Tentar negociar termos contratuais com o chefe da Kaiser Corporation..."
13180-136 = "I-Isso..."
13180-137 = "Por que o fundo privado convocou uma assembleia geral?"
13180-139 = "Tsc..."
13180-140 = "Deixe-me explicar."
13180-141 = "Há três futuros previsíveis."
13180-142 = "Primeiro: o Conselho Estudantil de Abydos comparece à assembleia e solicita a continuidade do contrato de compra e venda."
13180-143 = "Nesse caso, o Canhão Ferroviário passa para as mãos do Conselho Estudantil de Abydos."
13180-144 = "Era justamente isso que vocês estavam desesperados para evitar, não?"
13180-146 = "..."
13180-147 = "..."
13180-149 = "Segundo: alega-se que o \"Conselho Estudantil de Abydos\" não tinha autoridade legítima#ne pede-se a nulidade do contrato."
13180-150 = "Assim, os direitos sobre o Canhão Ferroviário retornam à antiga proprietária, a Nephthys."
13180-151 = "Era esse o futuro que você desejava, não era?"
13180-152 = "..."
13180-153 = "E, para isso, sequestrar a herdeira da Nephthys e ameaçar Hoshino Takanashi..."
13180-154 = "Hahaha.#nNossa, até eu fiquei surpreso ao ver que você iria tão longe."
13180-155 = "..."
13180-156 = "Realmente, não se pode subestimar quem veio de Abydos.#nA Nephthys também sabe jogar duro."
13180-157 = "...Guh."
13180-158 = "E terceiro: o Conselho Estudantil de Abydos não comparece à assembleia."
13180-159 = "Ou comparece e solicita a rescisão do contrato."
13180-160 = "Se a assembleia terminar sem imprevistos..."
13180-161 = "A posse da Ferrovia Transdesértica passa a ser do fundo privado."
13180-163 = "Junto com o Canhão Ferroviário, que está incluído nas instalações associadas à ferrovia."
13180-164 = "Esse era o objetivo original de vocês, não?"
13180-171 = "Mas não lhe resta uma dúvida?"
13180-172 = "Por que tiveram que gastar até o último centavo contratando mercenários#npara realizar essa assembleia?"
13180-173 = "O contrato de compra e venda perde a validade hoje, depois do meio-dia."
13180-174 = "Abydos nem sequer se lembrava da existência desse contrato."
13180-175 = "Ainda assim, por que envolveram aquelas garotas...?"
13180-176 = "O motivo provavelmente é este, certo?"
13180-181 = "— Para impedir que descobríssemos a existência do Canhão Ferroviário."
13180-183 = "Tsc..."
13180-185 = "Mas o plano de vocês teve falhas."
13180-186 = "A partir do momento em que se aliaram a nós, não há segredo que escape."
13180-192 = "Haha."
13180-193 = "Ha, hahahaha!"
13180-195 = "...Pois bem, agora que a situação está esclarecida,#nassinem estes documentos."
13180-201 = "O-O que é isso...?"
13180-202 = "Uma aquisição?!#nA-A nossa Indústrias Amo-Tanuki...?!"
13180-203 = "N-Não pode ser!"
13180-205 = "A partir de agora, vocês serão nossas subsidiárias."
13180-206 = "Claro, oferecerei uma quantia condizente.#nVejamos... Que tal 1.000 ienes?"
13180-208 = "O-O quê?!"
13180-209 = "Está tirando sarro da nossa cara...?!"
13180-216 = "Tsc...!"
13180-217 = "Ora, não precisam se preocupar.#nFusões e aquisições são a nossa especialidade. Daremos continuidade aos negócios com todo o cuidado."
13180-220 = "E, caso não saibam, deixe-me contar uma coisa."
13180-223 = "O motivo pelo qual o emblema da Kaiser é um \"polvo\" é justamente pela quantidade de empresas sob o nosso controle."
13180-224 = "Não é ótimo?#nA partir de hoje, vocês fazem parte do Grupo Kaiser."
13180-225 = "Andem logo e assinem aí."
13180-226 = "C-Como pode uma tirania dessas ser permitida...?!"
13180-227 = "Eu nunca devia ter me metido nisso..."
13180-235 = "Com isso, o fundo privado agora faz parte do Grupo Kaiser!#nAh, que notícia maravilhosa."
13180-236 = "Naturalmente, os poderes de representação também passam a ser meus. Alguma objeção?"
13180-238 = "...N-Nenhuma."
13180-240 = "Bom trabalho.#nEsperem por aí até o fim da assembleia."
13180-241 = "Afinal, ainda preciso da presença de vocês aqui."
13180-255 = "Agora só precisamos segurar até o meio-dia e o Canhão Ferroviário será meu."
13180-256 = "Embora eu tenha inúmeros outros meios à disposição,#nnão há por que desperdiçar uma oportunidade dessas."
13180-257 = "General, segure Abydos até o meio-dia."
13180-258 = "Entendido."
13180-260 = "Não baixe a guarda.#nEm especial, aquela Hoshino Takanashi era alguém que o Terno Preto cobiçava.#nO poder dela não deve ser comum."
13180-262 = "Não precisa se preocupar.#nCom certeza corresponderei às suas expectativas."
13180-264 = "Não é à toa que depositei minha confiança em você.#nPois bem, deixo em suas mãos."
13180-266 = "Sim, senhor!"
13180-271 = "Preparem-se, vamos partir imediatamente."
13180-275 = "Só falta a localização do Canhão Ferroviário.#nAssim que o encontrarem, reportem na hora."
13180-276 = "Sim, senhor!"
13180-280 = "Pois bem, vamos ver do que são capazes."
13180-286 = "P-Por que o chefe não dá notícias?"
13180-287 = "Que estranho...?"
13180-291 = "Ugh...!"
13180-302 = "Eliminem quem atrapalhar e assumam suas posições!"
13180-303 = "Não deixem ninguém passar daqui!"
13180-310 = "AM 10:4X"
13180-313 = "Novas forças detectadas!#nÉ-É a Kaiser PMC!"
13180-314 = "A Kaiser...?"
13180-315 = "E há um grande contingente indo em direção à estação...!#nPor algum motivo, eles estão em combate contra as forças do fundo privado!"
13180-316 = "O-O que está acontecendo?!"
13180-318 = "Briga interna?"
13180-319 = "Não, a Kaiser nem deveria estar participando disso."
13180-320 = "..."
13180-325 = "Hã?!"
13180-331 = "Uou, o que é isso?"
13180-332 = "Que confusão é essa?"
13180-333 = "A gente tá cercada?"
13180-335 = "Forças do fundo privado detectadas!"
13180-337 = "Iiih!"
13180-338 = "N-Nós não sabemos de nada!"
13180-340 = "Parece que a Highlander também foi cercada pela Kaiser."
13180-342 = "Hã? Por acaso são aquelas gêmeas?"
13180-343 = "E a Hoshino-senpai?"
13180-348 = "A Kaiser?"
13180-355 = "Hmph. Encontrei você, Hoshino Takanashi."
13180-361 = "...Sai da frente."
13180-368 = "A Hoshino-senpai está enfrentando as forças especiais da Kaiser PMC!"
13180-369 = "Sensei, o que a gente faz?"
13180-370 = "[s1] \"Tudo bem, se o oponente for o General, a Hoshino vence.\"\n[s2] \"Vamos ajudar a Highlander.\""
13180-375 = "AM 10:5X"
13180-377 = "Falta pouco mais de uma hora para a assembleia..."
13180-378 = "Vai dar tudo certo, nós vamos chegar a tempo."
13180-379 = "Aiai... Bom, não tem jeito, né.#nNão dá pra deixar aquelas lá na mão."
13180-381 = "...Entendido."
13180-382 = "Então, a partir de agora, vamos ajudar a Academia Ferroviária Highlander!"
