13180-312 = ""
13180-313 = "Обнаруживаю новые силы в районе... Это ЧВК Кайзер!"
13180-314 = "ЧВК Кайзер...?"
13180-315 = "Огромное количество сил PMC собирается у Центральной станции! Они вступили в бой с войсками фонда прямых инвестиций!"
13180-316 = "Ч-Что вообще происходит...?"
13180-318 = "Внутренний конфликт фонда прямых инвестиций?"
13180-319 = "Нет... Кайзер никогда в него не входила... Я не совсем понимаю, но ситуация меняется."
13180-320 = "И вдобавок..."
13180-321 = ""
13180-323 = ""
13180-324 = ""
13180-325 = "А?!"
13180-329 = ""
13180-331 = "Ого... Большая проблема..."
13180-332 = "Ч-Что происходит? Нам бежать? И бросить строительство железной дороги?"
13180-333 = "Хикари думает... сбежать... наверное, уже невозможно...?"
13180-335 = "Силы фонда прямых инвестиций обнаружены!"
13180-337 = "И-Ик!"
13180-338 = "Пожалуйста, пощадите нас! Мы ничего не знаем!"
13180-340 = "Академию Хайлендер... окружила Кайзер на ближайшей закрытой станции?"
13180-342 = "Что? Эти мелкие бедствия?"
