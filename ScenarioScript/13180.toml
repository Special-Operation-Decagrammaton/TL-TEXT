13180-9 = ""
13180-10 = ""
13180-13 = "Ха-ха-ха! Как же полегчало!"
13180-14 = ""
13180-16 = ""
13180-18 = "К-Как такое возможно...? Все наши бойцы..."
13180-19 = "ЧВК Кайзер и правда настолько сильны..."
13180-20 = "Не может быть! Нефтис объединилась с Кайзер?!"
13180-21 = "Что это за бред? Вы же вроде враги?!"
13180-23 = "Ты не ошибаешься. Когда-то были."
13180-24 = "Но вы правда думали, что Кайзер просто отдаст облигации Транс-пустынной железной дороги и ничего не потребует взамен?"
13180-25 = "Всё это произошло лишь потому, что мы с самого начала тайно вели переговоры."
13180-26 = "Даже если так, они держат наследницу Нефтис в заложниках и шантажируют Абидос!"
13180-27 = "Нет-нет. Для ясности: у нас нет особых претензий к госпоже."
13180-28 = "Нефтис продолжит служить госпоже Нономи."
13180-29 = "Однако так же, как компания служит ей, у неё есть обязанности перед компанией."
13180-30 = "Если Таканаши Хошино благополучно прибудет и объявит о расторжении договора, всё будет хорошо."
13180-31 = "Тогда Нономи сможет спокойно жить в Абидосе до выпуска, а мы получим Железнодорожную пушку."
13180-33 = "Нефтис...? Не Кайзер?"
13180-34 = "Хм? А. Кайзер не интересует Железнодорожная пушка. Поэтому мы и смогли договориться."
13180-35 = "Кстати, откуда вы узнали, что я собиралась вас предать?"
13180-36 = "Э-Это..."
13180-38 = "Я рассказал."
13180-39 = "Суо...?!"
13180-40 = ""
13180-42 = ""
13180-43 = ""
13180-45 = "Что это...? Т-Ты нас предала?"
13180-47 = "Нет-нет. Ничего подобного."
13180-48 = ""
13180-53 = ""
13180-55 = ""
13180-57 = "...П-Президент Кайзер?"
13180-58 = ""
13180-61 = ""
13180-62 = ""
13180-63 = "Моя подруга изначально состояла в ЧВК Кайзер."
13180-64 = "Бывшая PMC. Я ушла."
13180-66 = "Суо! Мы спасли такую бездомную хулиганку, как ты, которой даже академии было не назвать домом... и вот как ты нам отплатила?!"
13180-68 = "Спасли? Кого именно вы спасли?"
13180-69 = "Успокойтесь. Душевные разговоры оставьте на потом, у нас плотный график. Сейчас пора работать."
13180-70 = "Разберись с ними."
13180-71 = ""
13180-73 = ""
13180-76 = ""
13180-77 = ""
13180-78 = ""
13180-84 = ""
13180-85 = ""
13180-86 = ""
13180-93 = ""
13180-94 = ""
13180-95 = "Э-Эм..."
13180-96 = "У-Ух!"
13180-98 = "Отличная работа, все. Благодаря вам мы получили значительную прибыль от продажи облигаций."
13180-99 = "Я была рада этой неожиданной прибыли, но, похоже, бесплатного обеда не бывает."
13180-100 = "Вот данные, которые вы запрашивали, президент."
13180-101 = "Так, посмотрим..."
13180-102 = ""
13180-104 = ""
13180-105 = "Хи-хи. Железнодорожная пушка. Забавно."
13180-106 = "Нужно было раньше сказать мне, что в Абидосе спрятано нечто столь замечательное."
13180-108 = "Угх..."
13180-109 = ""
13180-112 = ""
13180-114 = "Железнодорожная пушка... Гораздо реалистичнее того нелепого космического линкора."
13180-115 = "По анализу Стратегического отдела её действительно можно использовать как оружие асимметричного превосходства."
13180-116 = "Понятно. Мы перестали получать сообщения от Чёрного Костюма, и я уже думала, что новых способов обрести силу не будет. Но это..."
13180-117 = "Да. С этим... мы сможем добиться того, чего не смогли раньше..."
13180-118 = "...Неужели ещё остались части наследия Тирана-Императора, которые не были уничтожены...?"
13180-119 = "Прекрасно. Кайзер заберёт Железнодорожную пушку."
13180-121 = "Что?!"
13180-122 = ""
13180-124 = ""
13180-127 = ""
13180-128 = "Отправьте разведывательную группу найти, где спрятана Железнодорожная пушка. Она должна быть где-то вдоль Транс-пустынной железной дороги."
13180-129 = "Поняла."
13180-130 = "Даже если вы каким-то образом найдёте пушку, у вас нет прав собственности!"
13180-131 = "О?"
13180-132 = "Кайзер продала облигации фонду прямых инвестиций!"
13180-133 = "Поэтому всё зависит от того, как студенты Абидоса решат поступить с договором, оставленным прежней председательницей. Кайзер тут ничего не решает!"
13180-134 = "Боже мой. За кого ты меня принимаешь?"
13180-135 = "Ты правда пытаешься читать лекцию по договорному праву главе Корпорация Кайзер?"
13180-136 = "В-В таком случае..."
13180-137 = "Ты правда думала, я не раскусила ваш маленький план? Зачем вы вообще создали фонд прямых инвестиций и созвали общее собрание кредиторов?"
13180-139 = "Э-Эм..."
13180-140 = "Позволь я сама объясню тебе ваш примитивный план."
13180-141 = "У этого собрания было три возможных исхода."
13180-142 = "Первый: представитель студсовета Абидоса, основная сторона договора, прибывает на собрание до полудня и заверяет договор."
13180-143 = "В таком случае договор купли-продажи признаётся действительным, а студсовет Абидоса сохраняет законные права на Железнодорожную пушку."
13180-144 = "Естественно, для вас это был самый нежелательный исход."
13180-146 = "..."
13180-147 = "..."
13180-149 = "Второй: представитель студсовета Абидоса, основная сторона договора, признаёт, что прежний студсовет был фиктивной организацией без полномочий заключать подобный договор. Тогда договор признаётся недействительным."
13180-150 = "Права на Железнодорожную пушку возвращаются Нефтис как первоначальному владельцу."
13180-151 = "Это и был ваш идеальный исход, верно?"
13180-152 = "..."
13180-153 = "И ради этого вы похитили Нономи и даже угрожали Хошино... Должна признать, меня это впечатлило."
13180-154 = "Вот это действия настоящего промышленника. Даже я бы не додумалась. Похитить наследницу собственной компании? Ха-ха-ха, великолепно."
13180-155 = "Э-Это..."
13180-156 = "Вы, люди Абидоса, и правда особая порода. Нефтис умеет добиваться своего. Спасибо за представление."
13180-157 = "...Ух."
13180-158 = "И наконец. Представитель студсовета Абидоса, основная сторона договора, не успевает на собрание до полудня, когда срок договора истекает..."
13180-159 = "...Или приходит, но заявляет, что не намерен исполнять договор."
13180-160 = "В таком случае договор купли-продажи юридически расторгается по воле основной стороны."
13180-161 = "Сразу после расторжения Железнодорожная пушка снова приобретает статус объекта Абидоса и повторно включается в залог по облигациям DLB."
13180-163 = "Права на Железнодорожную пушку тогда переходят фонду прямых инвестиций, которому принадлежат облигации DLB."
13180-164 = "Естественно, именно такого исхода хотел фонд прямых инвестиций."
13180-165 = ""
13180-168 = ""
13180-169 = ""
13180-171 = "...Поэтому вы и наняли наёмников охранять это место до полудня."
13180-172 = "Но тут возникает вопрос. Зачем вообще понадобилось общее собрание?"
13180-173 = "Договор купли-продажи всё равно стал бы недействительным после окончания двухлетнего льготного срока."
13180-174 = "Логичнее было бы тихо дождаться истечения договора в полдень, а не устраивать весь этот цирк с общим собранием кредиторов."
13180-175 = "Так зачем фонд всё же созвал общее собрание и даже сообщил о нём Абидосу?"
13180-176 = "Почему вы, мелкие инвесторы, так помешаны на всей этой сертификации?"
13180-177 = ""
13180-179 = ""
13180-181 = "...Потому что больше всего вы боялись, что мы, Кайзер, позже узнаем о существовании Железнодорожной пушки."
13180-183 = "Э-Это..."
13180-185 = "Поэтому вы и провели это собрание, надеясь защититься всеми этими заверениями."
13180-186 = "Разве не так? Участники фонда прямых инвестиций, вы всё это устроили, потому что боялись меня, верно?"
13180-187 = ""
13180-189 = ""
13180-191 = ""
13180-192 = "Ха-ха-ха, попала в точку?"
13180-193 = "Ха-ха-ха-ха-ха-ха-ха!"
13180-195 = "Отличная работа, мелкие инвесторы. Теперь посмотрите сюда."
13180-196 = ""
13180-198 = ""
13180-200 = ""
13180-201 = "Э-Это...? Этот документ...?"
13180-202 = "Договор о слиянии?! С моей ZYAKO Industries...?"
13180-203 = "Союз ломбардов будет поглощён как дочерняя компания Кайзер...?"
13180-205 = "Именно. С этого момента я забираю себе все ваши компании."
13180-206 = "Разумеется, заплачу щедрую цену. Как насчёт 1000 йен?"
13180-208 = "Ч-что?!"
13180-209 = "Что за нелепый бред вы несёте?!"
13180-210 = ""
13180-213 = ""
13180-216 = "Э-Эм..."
13180-217 = "Ну-ну, не волнуйтесь. Слияния и поглощения — моя специализация. Кайзер успешно проделывала такое бесчисленное множество раз."
13180-220 = "Знаете, почему на эмблеме Кайзер осьминог?"
13180-223 = "Потому что у нас столько дочерних компаний, сколько у осьминога щупалец. Ха-ха-ха!"
13180-224 = "Сделаем всё быстро и просто. Моргнуть не успеете — уже станете членами Кайзер Group."
13180-225 = "Ну что, получаю ваше одобрение? Ручка вот."
13180-226 = "Это возмутительно..."
13180-227 = "...Не могу поверить. Не стоило мне вообще во всё это ввязываться..."
13180-235 = "Прекрасно, прекрасно. Значит, решено. Вы, участники фонда прямых инвестиций, теперь входите в Кайзер Group! Поздравляю каждого!"
13180-236 = "Раз фонд прямых инвестиций теперь мой, полагаю, я стала представителем общего собрания кредиторов. Возражения есть — говорите сейчас!"
13180-238 = "У-Ух... Поняли..."
13180-240 = "Вот и славно. Хорошая работа, маленькие инвесторы."
13180-241 = "А теперь идите в свой уголок наказания. Сидеть там до конца собрания."
13180-242 = ""
13180-245 = ""
13180-246 = ""
13180-248 = ""
13180-251 = ""
13180-252 = ""
13180-255 = "...Подытожим: если мы удержим позицию до полудня, Железнодорожная пушка моя."
13180-256 = "Разумеется, есть и другие способы забрать её, но пока схема, подготовленная фондом прямых инвестиций, самая прямолинейная."
13180-257 = "Ваш звёздный час, Генерал. Сдерживайте любые попытки Абидоса прорваться до полудня."
13180-258 = "Поняла."
13180-260 = "Не расслабляйся. Сам Чёрный Костюм жаждал заполучить Таканаши Хошино. Она не обычный ребёнок."
13180-262 = "Не переживайте, президент. Я не из тех дур, что проигрывают из-за беспечности."
13180-264 = "Разумеется! В конце концов, ты мой доверенный генерал."
13180-266 = "Есть, сэр."
13180-267 = ""
13180-269 = ""
13180-270 = ""
13180-271 = "...Войска, готовиться к бою."
13180-272 = ""
13180-274 = ""
13180-275 = "Весь оставшийся персонал — на поиски Железнодорожной пушки. Это займёт время, но с нашей информационной сетью возможно."
13180-276 = "Есть! Поняли!"
13180-279 = ""
13180-280 = "Ну что же, насколько далеко заведут вас ваши способности, Абидос?"
13180-286 = "П-Почему босс не выходит на связь?"
13180-287 = "Происходит что-то странное."
13180-288 = ""
13180-290 = ""
13180-291 = "Т-Там...?!"
13180-292 = ""
13180-294 = ""
13180-295 = ""
13180-297 = ""
13180-302 = "Хорошо. Разберитесь с мелочью, а мы развернём здесь базу."
13180-303 = "Остановить продвижение Шале и Абидоса любой ценой!"
13180-304 = ""
13180-307 = ""
