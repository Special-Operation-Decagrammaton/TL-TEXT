13180-346 = ""
13180-348 = "Кайзер?"
13180-349 = ""
13180-353 = ""
13180-355 = "Ха-ха-ха. Наконец-то я тебя нашла, Таканаши Хошино."
13180-356 = ""
13180-358 = ""
13180-359 = ""
13180-360 = ""
13180-361 = "...С дороги!"
13180-362 = ""
13180-368 = "Это спецназ ЧВК Кайзер! Хошино...!"
13180-369 = "Что делать, Сенсей?"
13180-370 = "[s1] «Всё нормально. Хошино справится с Генералом.»\n[s2] «Пойдём спасать студентов Хайлендер.»"
