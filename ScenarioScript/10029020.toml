[translation]
10029020-1 = "Эпизод 2;Местные обычаи"
10029020-2 = "Так что..."
10029020-3 = "...Мы подготовили кое-что, чтобы помочь вашим гостям освоиться с нашими «местными обычаями.» Специально изготовленное оружие для трёх чужаков."
10029020-4 = "Запрос оказался довольно интересным. Я так увлеклась работой, что потеряла счёт времени."
10029020-5 = "Оружие для «эспера» из другого мира. Такие заказы редко выпадают, знаете ли?"
10029020-6 = "Хотя, если честно, я всё ещё не уверена насчёт всей этой идеи с «эсперами», но..."
10029020-7 = "Но если сама Мисс Всезнайка так говорит, сомневаться смысла нет."
10029020-8 = "В общем..."
10029020-9 = "Вот. Это тебе. Оружие для электрического эспера! Остальные два оставлю вам, Сенсей."
10029020-10 = "Эм-м... Подождите..."
10029020-11 = ""
10029020-13 = ""
10029020-14 = ""
10029020-16 = "Это настоящее оружие? И вы просто отдаёте его мне...?"
10029020-17 = "Это уже как-то слишком..."
10029020-19 = "Пожалуйста, возьми. Я понимаю, что ты сомневаешься, но это всего лишь одно из различий между нашими мирами."
10029020-20 = "Например, нимбы над нашими головами или то, что для нас не страшно, если в нас стреляют."
10029020-21 = "Судя по тому, что ты рассказала, там, откуда ты родом, такое невозможно, но для нас это совершенно обычно."
10029020-22 = "Да, я понимаю, но..."
10029020-23 = "Хм..."
10029020-24 = "Ладно. Видимо, ничего не поделаешь."
10029020-25 = "Вы уверены, что можно просто отдать это мне? Такое чувство, будто я вами пользуюсь..."
10029020-26 = "Особенно после такого подарка, учитывая, как я вела себя с вами раньше..."
10029020-27 = "...А?"
10029020-28 = "...? Этот свет на оружии..."
10029020-29 = ""
10029020-31 = ""
10029020-32 = ""
10029020-33 = "О? Сенсей, у вас вопрос?"
10029020-34 = "Хотите узнать, не встроили ли мы в оружие какие-нибудь странные функции...?"
10029020-35 = ""
10029020-37 = ""
10029020-38 = "...Конечно нет."
10029020-39 = "[s1] «Вы только что замялись!»\n[s2] «Я ведь прав, да?! С ним что-то не так!»"
10029020-42 = "Что-то не так?! Ничего подобного! Между прочим, это потрясающее оружие!"
10029020-43 = "Практичное огнестрельное оружие, которое раскрывает лучшие качества владельца! Единственная в своём роде рельсовая пушка!"
10029020-44 = "Рельсовая пушка...?"
10029020-45 = "Подождите. Вы назвали её рельсовой пушкой..."
10029020-46 = "Позвольте объяснить. Её можно использовать как обычное оружие, но внутри есть особая функция. Она может разгонять пули электромагнитной силой!"
10029020-48 = "Идеальное оружие для эспера с электрическими способностями!!"
10029020-49 = ""
10029020-51 = ""
10029020-52 = "Если, конечно, пользователь действительно способен вырабатывать электричество своим телом...!"
10029020-53 = "Н-Не то чтобы мы тебе не верили, но..."
10029020-54 = "Как инженеры, мы должны сами всё проверить. Простите, если обидели."
10029020-56 = "Нет, всё нормально. Вы далеко не первые, кто говорит мне что-то подобное."
10029020-57 = "И я правда благодарна за оружие, но... стрелять из него я не собираюсь. Просто буду носить с собой..."
10029020-58 = "Ты будешь им пользоваться и увидишь, что ничего страшного в этом нет."
10029020-59 = "Если рядом с тобой будет Сенсей, остальные студенты решат, что ты выполняешь официальное задание."
10029020-60 = "Вы говорите об этом так, будто это пустяк... Хотя по дороге сюда я и правда видела несколько перестрелок..."
10029020-61 = "...Наверное, я всё-таки сплю. Всё это из-за Индийского покера."
10029020-62 = "Мир, где перестрелки — обычное дело... Как в этом вообще может быть смысл...?"
10029020-63 = "Слышать такое от эспера — особенно забавно..."
10029020-64 = "Как бы то ни было, теперь, когда оружие у нас есть, нужно найти остальных двоих, пока президент исследует механизм в руинах."
10029020-65 = "О, кстати..."
10029020-66 = "Как выглядели те двое, которые появились вместе со мной? Вдруг я их знаю."
10029020-67 = "А может, они вообще из совершенно другого мира..."
10029020-68 = "Одна была девушкой с длинными светлыми волосами. На ней была такая же форма, как у тебя."
10029020-69 = "Вторая — темноволосая девушка. Её школьная форма отличалась."
10029020-71 = "У блондинки в руке было что-то похожее на пульт."
10029020-72 = "Длинные светлые волосы... Форма Токивадай..."
10029020-73 = "...И пульт...?"
10029020-74 = ""
10029020-76 = ""
10029020-77 = "О."
10029020-78 = "*вздыхает*"
10029020-79 = "Ну конечно. Из всех возможных людей это должна была быть именно она..."
10029020-80 = "Ты знаешь, кто это?"
10029020-81 = "Почти уверена, что да..."
10029020-82 = "И если это действительно та, о ком я думаю, нам лучше найти её побыстрее."
10029020-83 = "...Что я имею в виду?"
10029020-84 = "Её способность позволяет управлять людьми. Кто знает, чем она сейчас занимается...?"
10029020-85 = "Контроль разума...?! Такое действительно существует? Никогда ни о чём подобном не слышала!"
10029020-86 = "Если бы я знала, мы бы добавили в её оружие функции усиления мозговых волн...!"
10029020-87 = "[s3] «Нет-нет-нет. Не надо...»\n[s4] «Наверное, нам повезло, что вы не знали.»"
10029020-90 = "Хм. Когда я переносила вас троих, я не заметила её способности. Полагаю, с такой способностью это вполне ожидаемо."
10029020-91 = "Впрочем, найти её вряд ли будет слишком сложно."
10029020-92 = "...А. Вообще-то президент говорит, что уже её нашла."
10029020-93 = "О? Уже? Как...?"
10029020-94 = "По всему городу установлены камеры наблюдения. Как я и сказала, вы трое очень выделяетесь."
10029020-95 = "Студент, гуляющий по улице без оружия..."
10029020-96 = "Статистически куда вероятнее встретить студента, гуляющего голой, чем без оружия!"
10029020-97 = "Что это вообще за место такое? Серьёзно..."
10029020-98 = "В любом случае, теперь мы можем идти, да?"
10029020-99 = ""
10029020-101 = ""
10029020-102 = "Раз уж я освоила «местные обычаи»?"
10029020-103 = "[s5] «Ты приспосабливаешься быстрее, чем кажется.»\n[s6] «Отлично. Пойдём.»"
10029020-106 = "...Хм."
10029020-107 = "Пойдёмте."
