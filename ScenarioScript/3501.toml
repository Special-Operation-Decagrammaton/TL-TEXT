[translation]
3501-1 = "Горячие источники в снегу"
3501-4 = "И... готово!!"
3501-5 = "Отлично! Ещё одна работа выполнена на славу! Думаю, всем здесь понравится. Правда, Мэгу?"
3501-6 = "Ого!! Очень красиво!! Думаю, это самый красивый горячий источник, который мы построили за эту неделю!!"
3501-7 = "Ага, им понравится. Не могу дождаться, когда покажем его!"
3501-8 = "Ух... Хотя всё уже начинает болеть. Мы работаем с... какого времени, с заката вчерашнего дня?"
3501-9 = "Ага, тащить материалы сюда было нелегко."
3501-10 = "Точно. Кстати, раз уж это место ТАК далеко, думаете, сюда вообще сможет добраться достаточно людей?"
3501-11 = "Хм. Раз уж ты об этом сказала..."
3501-12 = "...и что нам теперь делать?"
3501-13 = ""
3501-16 = ""
3501-17 = "О!"
3501-18 = "А чего МЫ вообще переживаем? Можно же просто спросить президента Касуми, да?"
3501-19 = "Она знает, что делать. Наверняка УЖЕ всё придумала!"
3501-20 = ""
3501-23 = ""
3501-24 = "Хаха! Точно! Да, думать о таком — не наша работа."
3501-25 = "Серьёзно, пусть думает она. Чего нам переживать?"
3501-26 = "А где она вообще? Разве она не пришла сюда вместе с тобой, бригадир Мэгу?"
3501-27 = "Здесь, здесь. Раньше я видела её сзади."
3501-28 = "Давайте я схожу спрошу? А вы двое отдохните здесь."
3501-29 = "Эм... Только ты, Мэгу?"
3501-30 = "Мы все вместе старались и строили это место. Как-то неловко, если отдыхать пойдём только мы..."
3501-31 = "Да не переживайте! У меня ещё полно сил! Вообще не устала!"
3501-32 = "А вот вы двое реально вымотались, и это отличный повод насладиться горячими источниками!"
3501-33 = "Давайте, расслабьтесь! Я поговорю с президентом."
3501-34 = "Я пошла!"
3501-35 = ""
3501-37 = ""
3501-38 = ""
3501-40 = ""
3501-41 = ""
3501-42 = "У неё энергия вообще когда-нибудь заканчивается?"
3501-43 = "Хотя она работала больше всех. Я слышала, что она может одна построить целый горячий источник. Небольшой, по крайней мере."
3501-44 = "А?! Совсем одна...? Серьёзно? Да это шутка, наверное?"
3501-45 = "Кто знает? Но судя по тому, сколько она успела прошлой ночью..."
3501-46 = "...думаю, бригадир и правда способна."
3501-47 = "Ого, вот это она даёт."
3501-48 = "Правда? Правда? Не просто же так раньше именно она была президентом."
3501-49 = "...А?"
3501-50 = "...Погоди, она раньше была президентом?"
3501-51 = "О, ты не знала?"
3501-52 = "А, ну ты вступила не так давно. ...Хотя вообще-то многие могут не знать. Мы несколько раз распускались и собирались снова."
3501-53 = "Ну, раньше президентом здесь была Мэгу. Потом, знаешь, появилась нынешний президент Касуми, и Мэгу передала ей должность."
3501-54 = "А почему?"
3501-55 = "Не знаю. Подробностей я не спрашивала."
3501-56 = "Может, просто потому, что Касуми умная и очень подходит для этой работы? Да и Мэгу, похоже, власть вообще не волнует."
3501-57 = "...Ага, на нашего бригадира похоже."
3501-58 = "Хаха! Ну..."
3501-60 = "...наверное, сейчас это уже неважно. Хаха."
3501-61 = ""
3501-62 = ""
3501-63 = ""
3501-64 = "Президент!! Президент Касуми!!"
3501-65 = "...Хм?"
3501-66 = "Мэгу, ого!! Чего так громко-то?"
3501-67 = "Президент!!"
3501-68 = "О, ты уже залезла в воду? Я думала, обычно ты заходишь последней."
3501-69 = "Хаха, ну, просто захотелось. Никакой особой причины."
3501-70 = "Я вспоминала... ну, кое-что, что когда-то дало мне мотивацию. Скажем так."
3501-71 = "Так что случилось? И... где остальные? Обычно ты не приходишь поговорить со мной одна."
3501-72 = "Есть проблема?"
3501-73 = "Хм? Нет. Или... может, да..."
3501-74 = "Команда заметила, что это место очень далеко от цивилизации."
3501-75 = "То есть нам пришлось тащить материалы ОЧЕНЬ далеко. Другие вообще захотят проделывать такой путь?"
3501-76 = "Вахахаха!! А я всё гадала, что ты скажешь."
3501-77 = "Не переживай. Помни, им не придётся тащить материалы, как нам. Они просто приедут на автобусе."
3501-78 = "Да, вверх по извилистой дороге, но путь свободен. Пара автобусов — и проблема решена."
3501-80 = "О-о! У тебя всегда всё продумано, президент."
3501-81 = ""
3501-83 = ""
3501-84 = "...Погоди, у нас есть автобусы?"
3501-85 = "Вахахаха!"
3501-86 = "...Нет."
3501-87 = "Но можно раздобыть на Чёрном рынке пару больших фургонов или купить старые бронетранспортёры у ЧВК, а потом переделать их, чтобы они ВЫГЛЯДЕЛИ как автобусы."
3501-88 = "Главное, всё уже продумано. Вот в чём суть, поняла?"
3501-89 = "Так что скажи остальным: если у них есть время переживать, значит есть время отдохнуть и восстановить силы!"
3501-90 = "Горячие источники не становятся готовыми только потому, что ты закончила здания! Они не считаются горячими источниками, пока ими не воспользовались!"
3501-92 = "Понятно! Хорошо! Обязательно всем передам!"
3501-93 = ""
3501-96 = ""
3501-97 = "Скажу им: «Я не очень понимаю, но хорошо отдохните, и завтра всё как-нибудь само сложится!!»"
3501-98 = "Вахахаха!! Умно! Идеально, Мэгу! Ты и правда всё понимаешь!!"
3501-99 = "Хи-хи... «Умно», да? Странно слышать такое от тебя, президент..."
3501-100 = ""
3501-102 = ""
3501-103 = ""
3501-104 = ""
3501-105 = "Хм? Мэгу?"
3501-106 = "Хм. Не ожидала, что ты так сделаешь. Тебе этот источник нравится больше остальных? Они ведь и больше, и теплее..."
3501-107 = "Знаю, но ты сказала кое-что, что напомнило мне другое."
3501-108 = "Что я сказала?"
3501-109 = "...Про то, что что-то вспоминала?"
3501-110 = "Точно! Это напомнило мне, что ты любишь снег, а горячие источники в снегу любишь ещё больше!"
3501-111 = "Ха-ха..."
3501-112 = ""
3501-114 = ""
3501-115 = "...Погоди, что?"
3501-116 = "О чём ты? Не думаю, что когда-либо тебе это говорила."
3501-117 = "Ну, не говорила. Не напрямую."
3501-118 = "Но когда мы встретились впервые, ты ведь спала в снегу, помнишь?"
3501-119 = "А потом, когда я сделала горячий источник и посадила тебя туда, твоя хмурая гримаса превратилась в счастливую улыбку!"
3501-120 = "Я хмурилась во сне...? В снегу...?"
3501-121 = "...Ах."
3501-122 = "А-а-а..."
3501-123 = "Понятно. Хи-хи... Точно."
3501-124 = "«Спала»... Да, наверное, это можно так назвать."
3501-125 = "...Президент?"
3501-126 = "Хаха. Ничего. Не переживай."
3501-127 = "В любом случае, я, кажется, раньше не слышала эту историю! Так я выглядела очень счастливой в воде?"
3501-128 = "Ага! Поэтому я сразу подумала: «Наверное, этот человек очень любит горячие источники в снегу!»"
3501-129 = "Вот как..."
3501-130 = "...Фу-фу..."
3501-131 = "...Президент?"
3501-132 = "Вахахаха! Конечно! Снежные дни — лучшее время для горячих источников! Сверху прохладно, снизу тепло!"
3501-133 = "Для духа полезно! И настолько полезно для здоровья, что может буквально вытащить тебя с порога смерти!"
3501-134 = "Можно просто позволить всей этой тёплой воде смыть боль и страдания!"
3501-135 = "Правда? Горячие источники! Горячие источники в снегу! Они лучшие!"
3501-136 = "Больше людей должны узнать, каково это!"
3501-137 = "Ну-ну, узнают. Конечно узнают. Когда-нибудь."
3501-138 = "А пока просто отдохни, Мэгу! Завтра у нас будет ещё много работы."
3501-139 = "Ага, ага! ...Ой, погоди, ты сказала мне отдохнуть, и я вспомнила: я ведь сказала КОМАНДЕ отдыхать, пока сама пойду тебя спросить..."
3501-140 = "О-о, они, наверное, всё ещё ждут. Пойду назад и расскажу им, что ты сказала!"
3501-141 = "Так и сделай. Только не беги. Полы скользкие."
3501-142 = "Хаха! Ещё бы!!"
3501-143 = ""
3501-145 = ""
3501-146 = ""
3501-147 = "Горячие источники, горячие источники... Хи-хи."
3501-148 = ""
3501-150 = ""
3501-151 = "...Конечно, я люблю горячие источники."
3501-153 = "...Как я могу их не любить?"
3501-154 = "Горячие источники в снегу"
