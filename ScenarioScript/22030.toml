[translation]
22030-1 = "Episódio 3;~Aris Começa a Aventura!~"
22030-2 = "(Depois disso, conversei com o Clube de Desenvolvimento de Jogos sobre ideias para o novo jogo)"
22030-3 = "Como eu disse antes, o nosso próximo jogo vai ser..."
22030-8 = "\"Um RPG tranquilo de exploração de masmorras estilo slow-life\"!"
22030-9 = "Afinal, o mais importante é a masmorra principal, né!"
22030-10 = "Sim... A forma como projetamos a masmorra muda completamente o conteúdo do jogo..."
22030-11 = "Se vamos fazer uma masmorra fixa para explorar... ou se vamos fazer um roguelike..."
22030-12 = "A Aris prefere roguelike!"
22030-15 = "[ns] \"Você gosta de roguelikes, Aris?\""
22030-16 = "Sim! Como o layout da masmorra muda a cada partida,#nfico super empolgada pensando em que monstros e equipamentos raros vou encontrar!"
22030-17 = "Especialmente no último roguelike que fizemos juntas,#ncriamos um item único com o nome do Sensei."
22030-18 = "[s] \"...Hm?\""
22030-19 = "Batizamos de \"Adesivo de Estrelinha do Sensei\"!"
22030-20 = "A Aris ficava muito feliz quando conseguia o adesivo.#nQuando usado, ele deixa o personagem super forte!"
22030-21 = "[s] \"...O efeito do adesivo de estrelinha é incrível, hein!\""
22030-22 = "Ah, i-isso é!#nÉ tipo um toque de bom humor, sabe."
22030-23 = "Para a dificuldade do jogo ficar mais, e-ex... ex..."
22030-24 = "Eu queria que ficasse mais extreme!"
22030-25 = "Não era pra ser \"exciting\"?"
22030-27 = "No próximo jogo também, a Aris quer coletar muitos \"Adesivos de Estrelinha\"!"
22030-28 = "[s] \"Fico feliz com isso, Aris, mas já que é assim, eu preferia ser um membro do grupo...!\""
22030-29 = "Então, se a gente fizer um roguelike, qual formato a gente usa?"
22030-30 = "Ruínas subterrâneas... talvez?#nÉ o formato mais básico para uma masmorra..."
22030-31 = "Hmm, não é comum demais?"
22030-32 = "Já que vamos fazer... eu queria algo com um toque mais especial, mais grandioso..."
22030-34 = "E se fosse no formato de uma torre que você vai subindo?"
22030-35 = "Se a dificuldade aumentar cada vez que você subir as escadas para um andar superior, não fica bem intuitivo?"
22030-36 = "Assim não tem surpresa nenhuma! Escadas são clichê demais!"
22030-37 = "Você só reclama...#nEntão qual é a sua ideia, mana?"
22030-38 = "Ruínas subterrâneas... uma torre...#nEntão, em vez de escadas..."
22030-39 = "Um elevador!#nQue tal um elevador?"
22030-41 = "Descer nas ruínas subterrâneas de elevador?"
22030-42 = "Falando nisso, a Aris já jogou um jogo parecido com isso antes."
22030-54 = "É um jogo em que você é um espião e derrota inimigos no elevador de um prédio!"
22030-55 = "Ah, esse é bem popular entre os jogos retrô."
22030-56 = "Hmm, para uma ideia da mana, até que é bem sensata..."
22030-58 = "Pois é! Ainda falta muito! Não tem fator surpresa nenhum!"
22030-59 = "Hã...?"
22030-60 = "O que precisamos é de visuais deslumbrantes! Uma história épica e muita surpresa!"
22030-61 = "Em vez de descer nas ruínas subterrâneas, que tal subir uma torre?!#nDe elevador!"
22030-62 = "Uma torre?"
22030-67 = "Você vai subindo de elevador..."
22030-73 = "E no final, tudo explode no terraço!"
22030-74 = "Isso sim é um verdadeiro espetáculo!"
22030-76 = "Espera.#nE como você explora a masmorra desse jeito?"
22030-77 = "Primeiro, a gente foca nos visuais deslumbrantes..."
22030-78 = "Você sempre diz isso, mana!"
22030-80 = "Uau?!#nM-Midori...?"
22030-81 = "Da última vez você disse a mesma coisa."
22030-82 = "Você veio com aquela história de \"Para representar essa masmorra, precisamos desenhar o interior em detalhes!\", e acabamos passando o dia inteiro desenhando masmorras!"
22030-83 = "Urgh! I-Isso foi..."
22030-84 = "A Aris também desenhou bastante! Foi muito divertido desenhar várias coisas!"
22030-85 = "Olhe, Sensei! Estas são as ilustrações que a Aris fez!"
22030-86 = "A obra-prima da Aris é... o guardião mais forte da masmorra, o \"Guardião Sensei\"!#nA Aris deu esse nome pensando no Sensei, que sempre guia todas nós!"
22030-87 = "É um guardião invencível e super forte!"
22030-88 = "[s] \"Ao mesmo tempo que quero ver isso... acho que não quero!\""
22030-89 = "B-Bom... visuais deslumbrantes são,#na-afinal... uma escolha... feita conforme a necessidade."
22030-90 = "Eu não estou dizendo que odeio desenhar."
22030-91 = "Mas depois de todo o trabalho que tivemos para desenhar aquilo tudo...#nquase nada foi usado no jogo."
22030-92 = "Não faça a gente perder tempo.#nVamos falar de coisas que sejam realmente viáveis."
22030-93 = "M-Mas! Assim a gente nunca vai ver além do horizonte!#nNunca vamos superar nossos limites!"
22030-102 = "[ns] \"Calma, vocês duas...\""
22030-103 = "Já sei!"
22030-104 = "Qual é a sua opinião, Sensei?!"
22030-105 = "Sim. É justamente nessas horas que precisamos da opinião do Sensei!#nQuem você acha que tem razão?"
22030-106 = "[s] \"Espera aí, esse não foi o motivo pelo qual vocês me chamaram no começo...?\""
22030-108 = "Algo bem chamativo é muito melhor, né?!"
22030-109 = "É preciso encontrar um meio-termo que seja viável, não é?"
22030-112 = "Né?! Sensei!"
22030-116 = "[ns] (Sinto que qualquer escolha aqui vai ativar uma flag de final ruim...)"
22030-118 = "E-Espera! Parem, pessoal!"
22030-119 = "V-Vocês estão deixando o Sensei sem jeito...!"
22030-121 = "Ah..."
22030-122 = "D-Desculpa..."
22030-123 = "Continuar discutindo assim só vai incomodar o Sensei."
22030-124 = "Por isso... acho melhor decidirmos isso com \"aquilo\" que passa de geração em geração no Clube de Desenvolvimento de Jogos."
22030-126 = "Entendi! \"Aquilo\", né, Yuzu!"
22030-127 = "[s] \"\"Aquilo\" que passa de geração em geração...?\""
22030-128 = "Sim, é que... às vezes..."
22030-129 = "Na verdade... acontece bastante de não chegarmos a um acordo."
22030-130 = "[s] \"Acontece bastante, então...\""
22030-131 = "Então, decidimos que quando ninguém cede, resolvemos em um duelo.#nCom a regra de que \"a opinião da vencedora é absoluta\"."
22030-132 = "[s] \"O Clube de Desenvolvimento de Jogos é bem mais hardcore do que eu pensava...\""
22030-133 = "Tudo bem... se a Yuzu está dizendo..."
22030-134 = "Eu aceito esse desafio!"
22030-135 = "Midori! Não vou pegar leve mesmo se você chorar!"
22030-136 = "Eu que digo isso, mana!"
22030-137 = "[s1] \"M-Mas esse duelo... o que vocês vão fazer, exatamente?\"\n[s2] \"Acho que não é legal brigar por causa disso...\""
22030-144 = "Vamos resolver isso no \"Guerra Total das Geleias\"!"
22030-146 = "[s] \"...Ah, vocês vão duelar no videogame.\""
22030-148 = "Sim, afinal somos o Clube de Desenvolvimento de Jogos."
22030-150 = "Agora não tem mais volta, Midori!"
22030-151 = "Hmph! Digo o mesmo, mana!"
22030-160 = "(E assim, enquanto Momoi e Midori começavam a partida...)"
22030-162 = "As duas começaram a jogar..."
22030-163 = "O que a Aris deveria fazer?"
22030-164 = "Deixa eu ver... Aris-chan, você poderia sair por aí para procurar ideias novas?"
22030-165 = "Se você for com o Sensei, talvez consiga alguma inspiração especial."
22030-166 = "[s] \"Sinto toda a imponência da presidente do Clube de Desenvolvimento de Jogos...\""
22030-167 = "Hã? A-Ah, e-e-eu acho que não é para tanto...!"
22030-168 = "Entendi... É uma missão para criar um jogo divertido!"
22030-169 = "Sim! Pode deixar, Yuzu!"
22030-170 = "Pan-paka-paaan!#nAris aceitou a missão!"
22030-171 = "Vamos, Sensei! Parta em uma aventura com a Aris!"
22030-178 = "(E assim, saí para explorar o campus de Millennium junto com a Aris)"
22030-179 = "Pan-paka-paaan!#nAris e o Sensei saíram da vila!"
22030-180 = "A aventura da heroína aprendiz Aris e do Sensei começa aqui!"
22030-181 = "[s] \"Hoje você é uma heroína aprendiz, Aris?\""
22030-182 = "Sim! Hoje tanto a Aris quanto o Sensei são heróis aprendizes de nível 1!"
22030-183 = "Até agora, às vezes a gente começava a aventura já como heróis lendários, mas..."
22030-184 = "Naquela vez, a Momoi disse o seguinte:"
22030-185 = "[s] \"A Momoi?\""
22030-186 = "Sim. Ela disse: \"Não é meio estranho um herói lendário sair em uma aventura para derrotar um caracol de nível 1?\""
22030-187 = "Por isso, ela disse que ia colocar um dragão lendário logo nos arredores da cidade inicial!#nMas..."
22030-188 = "A Midori e a Yuzu tentaram impedi-la desesperadamente, dizendo que assim o jogo não avançaria."
22030-191 = "Que um jogo assim seria muito difícil de vender...?"
22030-192 = "E que, mesmo se vendesse, poderia acabar virando um jogo de nicho com um público muito limitado...?"
22030-193 = "[s] \"Entendi. É coisa de 'assuntos de adultos', né...\""
22030-196 = "A Aris não entendeu tudo o que elas disseram naquela hora, mas..."
22030-197 = "Mesmo assim... hoje, já que é uma aventura junto com o Sensei, vamos começar do nível 1."
22030-198 = "Vamos derrotando monstros aos poucos, subindo de nível...#ne mirando em nos tornar heróis lendários, Sensei!"
22030-199 = "[s] \"Sim, vamos dar o nosso melhor.\""
22030-200 = "...Porém, agora que vamos começar nossa aventura juntos,#na Aris está com um dilema."
22030-201 = "O que devemos fazer para completar a missão da Yuzu...?"
22030-202 = "[s] \"Hmm... que tal começarmos avançando?\""
22030-203 = "Avançando?"
22030-204 = "[s] \"Você mesma disse, Aris. Que a aventura de um herói começa avançando.\""
22030-205 = "...!"
22030-206 = "Sim! Encontros, batalhas... subir de nível e completar missões também!#nTudo começa avançando!"
22030-207 = "O Sensei possui um conhecimento maravilhoso!"
22030-208 = "[s] \"Tudo isso foi você quem me ensinou, Aris.\""
22030-209 = "Ehehe, sim! Então, Sensei! Vamos lá! Avante!"
22030-211 = "(E assim, começou a aventura com a Aris)"
22030-213 = "Próximo;~Aris e os Guiados~ (1)"
