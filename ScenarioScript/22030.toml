[translation]
22030-1 = "Эпизод 3; Алиса отправляется в приключение!"
22030-2 = "После этого я начал вместе с участницами Департамента Разработки Игр придумывать идеи для новой игры."
22030-3 = "Как я уже говорила, в следующем проекте мы хотим реализовать инновационную, совершенно новую идею."
22030-4 = ""
22030-8 = "«Терапевтическая стратегическая RPG про подземелья, где принимаешь задания, рыбачишь, занимаешься фермой и развиваешь персонажа»."
22030-9 = "Для такого жанра самое важное, конечно же, подземелья!"
22030-10 = "Да. В зависимости от структуры подземелий содержание игры можно менять множеством способов."
22030-11 = "Можно сделать подземелья с определённой тематикой... или добавить элементы рогалика..."
22030-12 = "Я предпочитаю элементы рогалика."
22030-14 = ""
22030-15 = "[ns] «Что тебе нравится в рогаликах, Алиса?»"
22030-16 = "Они очень захватывающие! Я всегда жду, какие монстры появятся и какое новое редкое снаряжение выпадет, когда структура подземелья меняется."
22030-17 = "В рогалике, который мы в прошлый раз делали все вместе, мы создали уникальный предмет, названный в вашу честь."
22030-18 = "[s] «...Правда?»"
22030-19 = "Да. Он называется «Наклейка Похвалы Сенсея»."
22030-20 = "Я очень радовалась, когда находила этот предмет. Мой персонаж становился невероятно сильным просто от его получения!"
22030-21 = "[s] «...П-Правда? Для меня честь попасть в игру!»"
22030-22 = "Э-Э-Это...! М-Мы просто хотели немного оживить игру!"
22030-23 = "М-Мы хотели сделать игру более з-за..."
22030-24 = "Более з-з... закаляющей! Вот!"
22030-25 = "Ты нервничаешь? Кажется, ты хотела сказать «захватывающей»."
22030-27 = "Я хочу, чтобы в следующей игре было ещё больше предметов с Сенсеем!"
22030-28 = "[s] «А что если я буду участником группы, а не предметом?»"
22030-29 = "Э-Это х-хорошая идея! Кхем! В общем! Если мы делаем рогаликовые подземелья, как они должны выглядеть?"
22030-30 = "Подземные руины...? Это самый базовый вариант подземелья."
22030-31 = "Хмм, не слишком ли предсказуемо?"
22030-32 = "Эта игра должна быть революционной! Уникальной и потрясающей!"
22030-34 = "А если, например, подниматься по башне?"
22030-35 = "С каждым этажом сложность будет расти."
22030-36 = "Подниматься по лестнице слишком скучно! Никаких инноваций!"
22030-37 = "Хмф. Говорить ты умеешь, а идей от тебя я что-то не слышу!"
22030-38 = "Подземные руины... и башня... вместо лестницы..."
22030-39 = "Лифт! Как насчёт лифта?"
22030-41 = "Вроде лифта, который спускается в подземные руины?"
22030-42 = "Я раньше играла в такую игру!"
22030-43 = ""
22030-54 = "Ты шпион, который ездит между этажами жилого дома на лифте и побеждает врагов."
22030-55 = "А, точно. Довольно популярная ретро-игра."
22030-56 = "Это не особо соответствует твоему \"революционному\" фактору."
22030-58 = "Н-Ну, я ещё не закончила! Ты права, чего-то не хватает! Нет элемента неожиданности!"
22030-59 = "Что ты имеешь в виду?"
22030-60 = "В наше время играм нужны яркие визуальные эффекты и мозговыносящий твист!"
22030-61 = "Так что вместо спуска в подземные руины ты едешь на лифте вверх по башне!"
22030-62 = "По башне?"
22030-63 = ""
22030-67 = "И не просто вверх... поднимаешься всё выше..."
22030-68 = ""
22030-73 = "А когда достигаешь крыши — огромный взрыв!"
22030-74 = "Грандиозное зрелище!"
22030-76 = "Погоди, а как тогда пройти подземелье?"
22030-77 = "Давайте сначала сосредоточимся на зрелищности..."
22030-78 = "Ты каждый раз так говоришь!"
22030-80 = "Ч-Что?! Что ты имеешь в виду, Мидори?"
22030-81 = "Я уже слышала от тебя такое."
22030-82 = "\"Чтобы показать крутость подземелья, нужно нарисовать много классных артов! Монстров, ловушки и так далее!\" Из-за тебя мы целый день рисовали внутренности тёмного подземелья!"
22030-83 = "Н-Ну...! Это...!"
22030-84 = "Я помню! Я тоже тогда много всего нарисовала!"
22030-85 = "Сенсей, можно показать вам мой рисунок?"
22030-86 = "Особенно мой шедевр... Страж Сенсея, сильнейший охранник подземелья!"
22030-87 = "Я назвала его в вашу честь, потому что вы всегда направляете нас."
22030-88 = "[s] «Почему-то мне немного страшно!»"
22030-89 = "Вот! Все делали это по собственной воле! Это было необходимо для процесса."
22030-90 = "Я ничего не имею против рисования для видеоигры!"
22030-91 = "Но мы столько старались — и ради чего? Ни один из этих ассетов в игру не попал!"
22030-92 = "У нас не было плана, поэтому мы потратили кучу времени! Надо быть немного реалистичнее!"
22030-93 = "Э-Это узколобо! Мы собираемся переопределить само понятие видеоигр! Для этого надо преодолеть такие ограничения!"
22030-94 = ""
22030-96 = ""
22030-97 = ""
22030-98 = ""
22030-99 = ""
22030-100 = ""
22030-101 = ""
22030-102 = "[ns] «Эм, девочки, успокойтесь, пожалуйста...»"
22030-103 = "Ух! Вы правы, спор ничего не даст."
22030-104 = "Что думаете, Сенсей?"
22030-105 = "Да! Нам нужно ваше мнение, Сенсей! Что нам делать?"
22030-106 = "[s] «Эм, вообще-то моя роль здесь была немного другой...»"
22030-108 = "Нужно сделать максимально зрелищно!"
22030-109 = "Но надо делать то, что реально выполнимо!"
22030-111 = ""
22030-112 = "Правда? Сенсей?!"
22030-113 = ""
22030-116 = "[ns] «(Что бы я ни выбрал, будет плохо...)»"
22030-118 = "П-Погодите! Все, остановитесь!"
22030-119 = "Вы ставите Сенсея в очень неудобное положение!"
22030-121 = "Ах!"
22030-122 = "П-Прости."
22030-123 = "Бесконечный спор никому не поможет!"
22030-124 = "Да. Думаю, надо решить методом, который передаётся в Департаменте Разработки Игр из поколения в поколение."
22030-126 = "Именно, Юзу! Вот оно!"
22030-127 = "[s] «Методом, который передаётся из поколения в поколение?»"
22030-128 = "Да... Н-Ну... Видите ли..."
22030-129 = "Довольно часто... мы не можем прийти к согласию."
22030-130 = "[s] «Похоже, такое у вас происходит часто.»"
22030-131 = "Когда наши мнения расходятся, мы проводим особый бой, и проигравшая принимает мнение победительницы."
22030-132 = "[s] «Довольно радикальный способ!»"
22030-133 = "Л-Ладно. Если Юзу так говорит..."
22030-134 = "Я принимаю вызов!"
22030-135 = "Мидори! Я не буду тебе поддаваться!"
22030-136 = "Это я собиралась сказать!"
22030-137 = "[s1] «Н-но что вы собираетесь делать?!»\n[s2] «Я понимаю ваши слова, но вам не следует драться...»"
22030-140 = ""
22030-142 = ""
22030-143 = ""
22030-144 = "Единственный вариант — Fruitjelly War!"
22030-146 = "[s] «...А, вы имели в виду бой в игре.»"
22030-148 = "Да, всё-таки мы Департамент Разработки Игр."
22030-150 = "Ладно! Не трусь, Мидори!"
22030-151 = "Хмф! Сама не трусь!"
22030-152 = ""
22030-160 = "Они начали напряжённый матч друг против друга."
22030-162 = "Момои и Мидори сейчас играют."
22030-163 = "А что тогда делать мне?"
22030-164 = "Алиса... Может, попробуешь придумать новые идеи?"
22030-165 = "Отправляйся в приключение с Сенсеем. Возможно, найдёте вдохновение."
22030-166 = "[s] «Президент Департамента Разработки Игр такая взрослая...»"
22030-167 = "О-О...! Я-я не хотела звучать так... Я просто подумала..."
22030-168 = "Понятно! Это квест, который поможет развить моего персонажа!"
22030-169 = "Да! Я сделаю, как ты говоришь, Юзу!"
22030-170 = "Пам-па-ка-пан! Квест принят!"
22030-171 = "Сенсей! Мы отправляемся в приключение за идеями!"
22030-172 = ""
22030-178 = "Мы начали с исследования кампуса Миллениума."
22030-179 = "Бум-бум-бум! Алиса и Сенсей исследуют город!"
22030-180 = "С этого момента начинается приключение Начинающего Героя Алисы и Сенсея!"
22030-181 = "[s] «Хм? Ты начинаешь как начинающий герой?»"
22030-182 = "Да! Мы с вами оба герои-новички первого уровня!"
22030-183 = "Когда я начинала прошлое приключение, я сразу была легендарным героем..."
22030-184 = "Но потом... Момои..."
22030-185 = "[s] «Что сказала Момои?»"
22030-186 = "Она сказала, что нельзя начинать приключение легендарным героем, потому что на первом уровне ты убиваешь только улиток и слизней."
22030-187 = "Тогда я предложила разместить легендарных драконов вокруг стартового города."
22030-188 = "Но Мидори и Юзу сказали, что игровой прогресс так не строится."
22030-190 = ""
22030-191 = "Они сказали, такую игру очень трудно продать."
22030-192 = "Нужно не повторять эту ошибку, потому что подобная игра понравится лишь очень малому числу игроков."
22030-193 = "[s] «Очень взрослая мысль!»"
22030-195 = ""
22030-196 = "Я не всё поняла, но..."
22030-197 = "Мне кажется, раз мы начинаем совершенно новое приключение, надо стартовать с первого уровня."
22030-198 = "Будем побеждать монстров по одному и выполнять квесты! Потом повысим уровень и станем легендарными героями, Сенсей!"
22030-199 = "[s] «Квест принят.»"
22030-200 = "Да! Но у меня есть опасение по поводу этого приключения."
22030-201 = "Какие шаги нужно выполнить, чтобы пройти квест Юзу?"
22030-202 = "[s] «Начать стоит с движения вперёд.»"
22030-203 = "Что это значит?"
22030-204 = "[s] «Ты ведь говорила, что приключение героя начинается с шага вперёд.»"
22030-205 = "...!"
22030-206 = "Да! Битвы, повышение уровня, выполнение квестов... всё начинается с движения вперёд!"
22030-207 = "Вы обладаете прекрасными знаниями, достойными участника группы героя, Сенсей!"
22030-208 = "[s] «Я всему этому научился у тебя, Алиса.»"
22030-209 = "Хорошо, Сенсей! Идём вперёд!"
22030-211 = "Так началось моё эпическое приключение с Алисой."
22030-213 = "Следующий Эпизод: Ведомые Алисой 1"
