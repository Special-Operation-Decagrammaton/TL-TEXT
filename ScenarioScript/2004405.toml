[translation]
2004405-1 = "Подозрительная тренировка"
2004405-3 = "Рада вас видеть, Тренер."
2004405-4 = "[s] «Ты хотела мне что-то показать?»"
2004405-5 = "Да... Вот это."
2004405-6 = ""
2004405-8 = ""
2004405-9 = ""
2004405-10 = "[ns] «Это...»"
2004405-11 = ""
2004405-12 = "Это от моего бывшего менеджера — того самого, со стадиона."
2004405-13 = "Написано очень официально... Первые несколько абзацев можете пропустить. Посмотрите сюда."
2004405-14 = "[s] «Они хотят, чтобы ты подписала с ними эксклюзивный контракт на подработку?»"
2004405-15 = "Да. И..."
2004405-16 = "Эта часть не так интересна, как предложение внизу."
2004405-17 = "Посмотрите."
2004405-18 = "Это «Протокол кардио с бочкой»! И я в роли консультанта?"
2004405-19 = "[s] «Прямо по твоей части!»"
2004405-20 = "Хм? Не совсем понимаю, что вы имеете в виду..."
2004405-21 = "Это правда, что я люблю тренировки... и вдохновлять людей..."
2004405-22 = "Что? Вам кажется, это подозрительно? Думаете, мне стоит отказаться?"
2004405-23 = "Не могу!"
2004405-24 = "Есть люди, которым отчаянно нужны МОИ знания и опыт!"
2004405-25 = "[s] «То есть ты уже решила согласиться?»"
2004405-26 = "О, вы подумали... Нет, я позвала вас не поэтому."
2004405-27 = "Простите, Тренер. Я не хотела вводить вас в заблуждение."
2004405-28 = "Я хотела спросить вас..."
2004405-29 = "Как думаете, мне стоит надеть полный рабочий костюм или нет? Не будет ли это перебором?"
2004405-31 = "Она выглядела по-настоящему обеспокоенной. Я сказал, что, пожалуй, стоит одеться соответственно роли."
2004405-32 = "Мы вместе отправились обратно на стадион."
2004405-33 = ""
2004405-38 = "Мисс Сумирэ! Как же приятно снова вас видеть!"
2004405-39 = "Спасибо! Рада вернуться. Но..."
2004405-40 = "Что-то не так?"
2004405-41 = "Вы случайно не задумывались об оптимизации своего рациона?"
2004405-42 = "Ч-что?! Мисс Сумирэ! Вы считаете, что я... толстая?"
2004405-43 = "О, вовсе нет! «Диета» — это гораздо больше, чем просто похудение."
2004405-44 = "В основе своей «диета» означает «управление рационом»! Это краеугольный камень здоровья!"
2004405-45 = "Вообще-то с такой стройной фигурой я бы скорее рекомендовала вам набрать массу!"
2004405-46 = "Мы могли бы оживить вашу «диету», добавив блюда с высоким содержанием белка и функциональные углеводы!"
2004405-47 = "Что, простите?!"
2004405-48 = "[s] «Сумирэ, притормози...»"
2004405-49 = "Простите, Тренер. Просто у моего бывшего менеджера такой потенциал!"
2004405-50 = "Ха! Приятно видеть, что вы всё ещё так увлечены своей работой!"
2004405-51 = "Так что насчёт того, чтобы подписать эксклюзивный контракт и вернуться на стадион?"
2004405-52 = "Насчёт этого... Мне искренне жаль."
2004405-53 = "Я никогда не смогла бы бросить свои обязанности в Клубе спортивных тренировок Миллениума."
2004405-54 = "Вот как? Очень жаль."
2004405-55 = "Не обязательно! Я хотела кое о чём вас спросить."
2004405-56 = "Вот, внизу контракта. Давайте разберём это."
2004405-57 = "«Протокол кардио с бочкой». Что это значит?"
2004405-58 = "Рада, что вы спросили!"
2004405-59 = "Дело в том, что кроме вас у нас здесь работает много других... разносчиков напитков."
2004405-60 = "А... Понятно. У них проблемы с бочками?"
2004405-61 = "И вы думаете, что я могла бы вмешаться и привести их в форму?"
2004405-62 = "Именно! Мы хотим, чтобы вы тренировала новичков! Для них вы... своего рода легенда, Сумирэ."
2004405-63 = "Что скажете? Хотя мне грустно слышать, что вы не возвращаетесь..."
2004405-64 = "Я верю, что вы всё ещё можете многое здесь изменить!"
2004405-65 = "[s] «Что будешь делать, Сумирэ?»"
2004405-66 = "..."
2004405-67 = "Всё просто, Тренер."
2004405-68 = "Если есть несчастная душа, желающая учиться и взять здоровье в свои руки..."
2004405-69 = "Тогда я отвечу на её отчаянный зов!"
2004405-70 = "Я буду рядом, направляя её и проходя вместе каждое приседание!"
2004405-71 = "А когда она дойдёт до последнего повторения, я заставлю сделать ещё одно, потому что 100% никогда не достаточно!"
2004405-72 = "[s] «Сумирэ! Это уже слишком!»"
2004405-73 = "Но сегодняшняя боль выращивает завтрашний прогресс..."
2004405-74 = "А этот последний, дополнительный, ПОТРЯСАЮЩИЙ финальный подход вдохновит их на настоящее величие!"
2004405-75 = "[s] «Это уже даже не повторение, а целый подход?!»"
2004405-76 = "То есть вы согласны?"
2004405-77 = "Конечно!"
2004405-78 = "Я уже составила идеальную программу: динамические нагрузки с бочками, тренировочные маршруты и достаточное потребление белка!"
2004405-79 = "Как вдохновляюще!"
2004405-80 = "Хотите присоединиться, Тренер?"
2004405-81 = "[s] «А-а! Ой... живот! Не могу...»"
2004405-82 = "Вот... как? Мне очень жаль."
2004405-84 = "Отличная работа, все! А теперь ещё одно глубокое приседание!"
2004405-85 = "Что?! Мы же только что закончили подход?! Вы сказали, что всё!"
2004405-86 = "По-моему, она просто не умеет считать!"
2004405-87 = "Пожалуйста, пощадите..."
2004405-88 = "Кроме полных бочек на руках и ногах у нас ещё и утяжелители!"
2004405-89 = "Да? У меня тоже. И мои тяжелее!"
2004405-90 = "Может и так, но..."
2004405-91 = "Хорошо! Ещё немного. Если вы всё ещё можете стоять — значит, всё ещё можете поднимать!"
2004405-92 = "Когда вы прорываетесь через собственные пределы и преодолеваете их..."
2004405-93 = "...тело и разум укрепляются как единое целое. А болельщикам становится веселее!"
2004405-94 = "А если мы будем работать вместе..."
2004405-95 = "...то ВСЕ станем легендами стадиона!"
2004405-96 = "Так что вперёд! Ещё один подход!"
2004405-97 = "Она добавила ЕЩЁ один?!"
2004405-99 = "Так тренировка продолжилась..."
2004405-100 = "...и в итоге мышцы болели у всех, кроме Сумирэ."
