[translation]
2006202-1 = "Cooking is chemistry!"
2006202-3 = "Welcome..."
2006202-4 = "--to Restaurant 183!"
2006202-5 = "[s] \"A sudden career change!?\""
2006202-6 = "Hey! Nice comeback!"
2006202-7 = "Honestly, cafeterias and labs are pretty much the same! Cooking is the darling of modern chemistry, after all!"
2006202-8 = "That means the kitchen is just another laboratory!"
2006202-9 = "[s] \"It just looks like a regular lab to me...\""
2006202-10 = "Well, you are not wrong... Things have blown up from gas leaks, and parts of it are frozen over..."
2006202-11 = "If a kitchen can double as a lab, then the reverse is true as well!"
2006202-12 = "Today I am going to introduce you to kitchen chemistry, so I would love for Sensei to be my taste tester!"
2006202-13 = "Prepare to witness the true skills of Restaurant 183 chef Erina Niki!"
2006202-14 = "[s] \"Restaurant 183 chef?\""
2006202-15 = "Yep, yep! I am in charge of cooking at District 183."
2006202-16 = "I am in charge of chemistry too, so I am super confident in my seasoning!"
2006202-17 = "Let us get right into it! It is Doctor Erina's... Cooking Time!"
2006202-18 = "Today I am going to make a wonderful dish using whatever we have left in the fridge!"
2006202-19 = "The ingredients in the fridge are...!"
2006202-20 = "Potatoes, meat, potatoes... and, oh my gosh~! A whole mountain of... frost!"
2006202-24 = "..."
2006202-25 = "W-Well, let us start by making some nikujaga!"
2006202-26 = "[s] \"Nikujaga...!?\""
2006202-27 = "We have had bad weather lately, so that is about all we can make... Ehehe."
2006202-28 = "Let us pull ourselves together and check the ingredients! Meat, check. Potatoes, check. Soy sauce, check. Sugar, check..."
2006202-29 = "Wait, huh!? We are out of salt... Soy sauce alone is not going to give it any depth of flavor!"
2006202-30 = "No problem, though! If we do not have any, we will just make some!"
2006202-31 = "Let us see here, hydrochloric acid and sodium hydroxide... Oh, found them!"
2006202-32 = "[s1] \"Hydrochloric acid...? Huh!?\"\n[s2] \"Sodium hydrox... Eeeeeh!?\""
2006202-35 = "W-What is with the panic!? What would you do if you spilled it?!"
2006202-36 = "Don't tell me, is this your first time seeing them? I did not think they were that rare of a chemical...#nAre things different outside of Redwinter?"
2006202-37 = "[s3] \"That is not what I mean...!\"\n[s4] \"Why are you using hydrochloric acid and sodium hydroxide?\""
2006202-40 = "Because we need salt! Come on, table salt is just sodium chloride, right?"
2006202-41 = "If you mix hydrochloric acid and a sodium hydroxide solution, a neutralization reaction produces sodium chloride."
2006202-42 = "Getting warmed up by the exothermic reaction is just a bonus!"
2006202-43 = "[s] \"Is it really okay to do this in a lab... I mean, a kitchen?\""
2006202-44 = "Normally, no! If you mess up the ratios, things get pretty disastrous!"
2006202-45 = "But I am a pro~? And this is a lab, not a kitchen, so no worries!"
2006202-46 = "Now then, let us whip this up real quick!"
2006202-47 = "[s] (Decided to trust the professional.)"
2006202-50 = "Mm~~! It actually tastes like salt! Smooth sailing so far~♪"
2006202-51 = "Next up is mirin, but... we are out of that too."
2006202-52 = "Can't be helped. Let us just make that too!"
2006202-53 = "[s] \"Can't you do something without making it from scratch!?\""
2006202-54 = "No way! Cooking beginners always say things like 'We don't have it, oh well' or 'Let us use a substitute,'#nwhich completely ruins the chemical reactions of cooking!"
2006202-55 = "Mirin helps the flavors soak into the meat while getting rid of grease and gamey smells.#nIt is suuuuper important chemically, you know?"
2006202-56 = "This will be ready in a jiffy, too!#nI will whip it up right away!"
2006202-57 = "[s] \"Are you really sure this is safe!?\""
2006202-58 = "Of course! Despite how I look, I always put Sensei's safety first, you know?"
2006202-59 = "With that said, let us get cooking!"
2006202-63 = "By the way, you are not wearing a sweater or anything, right?"
2006202-64 = "It rarely happens, but ethylene gas combined with static electricity and that...#nUh, what was it called again..."
2006202-65 = "Anyway! Sensei, just stay right there and don't move!"
2006202-66 = "[s] (Managed to suppress a scream.)"
2006202-67 = "Just wait a second~!#nI am going to use the power of chemistry to make the most insanely delicious nikujaga!"
2006202-69 = "(After that, Erina continued to make the missing seasonings on the spot.)"
2006202-70 = "(The finished nikujaga was absolute perfection. When I showered Erina with praise, she looked thrilled.)"
2006202-71 = "(My legs had gone weak from nervous tension, so I rested for a bit before heading back to Schale.)"
