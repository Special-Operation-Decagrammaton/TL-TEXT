[translation]
2006202-1 = "Cooking is Chemistry!"
2006202-3 = "Welcome—"
2006202-4 = "—to Restaurant 183!"
2006202-5 = "[s] \"An unexpected job change!?\""
2006202-6 = "Ayy! Your straightman game is on point!"
2006202-7 = "Actually, a restaurant and a lab are basically the same thing! After all, cooking's#njust the darling child of modern day chemistry!"
2006202-8 = "In other words: a kitchen's also a type of lab!"
2006202-9 = "[s] \"But all I see is an ordinary lab...\""
2006202-10 = "Can't argue against that... The gas incident kinda blew some stuff away, not to#nmention all the things here and there that've frozen over..."
2006202-11 = "BUT, if a kitchen can be a lab, then the opposite can be true as well!"
2006202-12 = "Today, I'll be showing you the chemistry that goes on in a kitchen, and I'd like#nyou to taste test it for me!"
2006202-13 = "Bear witness to the true prowess of 183's chef—to the skill of Niki Erina!"
2006202-14 = "[s] \"183's chef?\""
2006202-15 = "Yup! 'Cause I'm in charge of cooking for us at 183."
2006202-16 = "Since I'm also in charge of chemistry, I'm veeery confident in my flavoring!"
2006202-17 = "Let's get this show on the road! It's time fooor Dr. Erina's Cooking Tiiime!"
2006202-18 = "Today, I think I'll whip up something using whatever's in the fridge!"
2006202-19 = "Let's see what we've got...!"
2006202-20 = "Potatoes, meat, potatoes... and, would you look at that! A huuuge pile! Of! Iceee!"
2006202-24 = "..."
2006202-25 = "H-how 'bout we start with making some nikujaga!?"
2006202-26 = "[s] \"Nikujaga...!?\""
2006202-27 = "The weather's been pretty bad recently, so that's about all I can do... Ehehe."
2006202-28 = "Anyways, let's get those spirits back up and check our ingredients! Meat's#nall good, potatoes good, soy sauce yep, sugar..."
2006202-29 = "Eh, huh!? There's no salt... I can't create good flavor depth with just soy sauceee!"
2006202-30 = "But, that's no problem at all! If we don't have it, then we just gotta make it!"
2006202-31 = "Let's see, hydrochloric acid and sodium hydroxide... Ooh, we've got those!"
2006202-32 = "[s1] \"Hydrochloric...? Huuh!?\"\n[s2] \"Sodium hydrox... Whaaaat!?\""
2006202-35 = "Y-you scared the heck out of me! What'd you have done if I'd spilt them!?"
2006202-36 = "Wait, is this your first time seeing these? I'm pretty sure they're not exactly rare#nchemicals though... Are they actually hard to find outside of Red Winter?"
2006202-37 = "[s3] \"That's not what I meant...!\"\n[s4] \"I'm asking why you're using those two chemicals.\""
2006202-40 = "Cause we need salt! Salt is just sodium chloride, y'know?"
2006202-41 = "If you mix a hydrochloric acid with an aqueous solution of sodium hydroxide, #nthe resulting neutralization reaction gives you sodium chloride."
2006202-42 = "There's also the added bonus of producing heat from this exothermic reaction!"
2006202-43 = "[s] \"Is it really okay to do in a lab... sorry, a kitchen?\""
2006202-44 = "Usually not. If you messed up the ratios, you'd be in a real world of trouble!"
2006202-45 = "BUT, you're looking at a pro here. Plus, this is a lab, not a kitchen, so we're A-okay!"
2006202-46 = "Alright, haste makes waste. Let's get this going!"
2006202-47 = "[s] (I'll just trust that she's a pro here.)"
2006202-50 = "Mnnn! It tastes just like salt! So far, so good! ♪"
2006202-51 = "Next is mirin... but we don't have that either."
2006202-52 = "Oh well, guess we'll be making that too!"
2006202-53 = "[s] \"Can't you just make do without it!?\""
2006202-54 = "Absolutely not! Beginner cooks always say things like \"whatever, we don't have it\"#nor \"I'll just use something else,\" but these kinds of things completely mess up#nthe chemical reactions that make a dish work!"
2006202-55 = "The meat soaks up the flavors of the mirin and also helps get rid of the fattiness#nand raw odor. From a chemical standpoint, it's suuuper important."
2006202-56 = "I can make it in a jiffy, too! #nJust give me one small little quick second!"
2006202-57 = "[s] \"Is this really safe!?\""
2006202-58 = "Of course! You might think otherwise, but I am thinking of your safety first and#nforemost, y'know?"
2006202-59 = "With that said, let's get cookin'!"
2006202-63 = "By the way, you aren't wearing a sweater or anything right?"
2006202-64 = "It doesn't happen often, but when ethylene and static electricity mix... #nUhhh, how should I put it..."
2006202-65 = "Anyways! Don't move around too much, Sensei!"
2006202-66 = "[s] (I somehow held back my scream)"
2006202-67 = "Sit tight for mee! #nI'll make you a suuper tasty nikujaga with the power of chemistry!"
2006202-69 = "(Erina proceeded to make all of the missing seasonings on the spot.)"
2006202-70 = "(The finished nikujaga was perfect. Erina seemed to be overjoyed when I praised#nher like crazy.)"
2006202-71 = "(The nervousness from the whole ordeal made my knees go weak, so I took#na short rest before returning to Schale.)"