[translation]
10047100-1 = "Эпизод 10;Магия исполнения желаний"
10047100-3 = "Есть ведь такая поговорка: «В День погибели... колокол поёт в одиночестве.»"
10047100-4 = "Ты правда в это веришь? Это всего лишь школьная городская легенда!"
10047100-5 = "Легенда или нет, но он и правда звонит! Как-то жутко..."
10047100-6 = ""
10047100-8 = ""
10047100-9 = "Это... вовсе не зловещий знак."
10047100-10 = "Это звук искреннего сердца девушки. Звук того, кто дорожит всеми нами."
10047100-11 = "Это звук почтительного несогласия, звон тревоги и сожаления..."
10047100-12 = "И... звук вины и самообвинений, преодолевающих тяжесть бессилия."
10047100-13 = "Она по-своему рассказывает нам свою настоящую историю."
10047100-14 = "Хех, да. Мы слышим тебя... биение твоего прекрасного, тревожного сердца звучит над нами."
10047100-16 = "Вершина Безымянной колокольни"
10047100-18 = "Шья-а! Что я вообще здесь делаю?!"
10047100-19 = "Как они могли быть настолько тупыми? Как вообще умудрились попасться?"
10047100-20 = "Раз уж всё дошло до этого..."
10047100-21 = "Так уж доведите дело до конца, ясно?! Идиотки-старшекурсницы!"
10047100-24 = "Кар! Ка-кар!!!"
10047100-25 = "И-и-и! Тут ещё и целая стая ворон?!"
10047100-26 = ""
10047100-28 = ""
10047100-29 = "Они перепугались... Воспользуемся шансом."
10047100-30 = ""
10047100-32 = ""
10047100-33 = ""
10047100-35 = ""
10047100-37 = "Мастер! Возьмите меня за руку!"
10047100-38 = "Все, пора завершить заклинание! Магия исполнения желаний уже здесь!"
