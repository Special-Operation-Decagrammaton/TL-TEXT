[translation]
1013508-1 = "Здесь живут люди?"
1013508-2 = ""
1013508-3 = "А, вы пришли."
1013508-4 = "Серьёзно, как некоторые вообще могут так жить?"
1013508-5 = "[s] «Я помогу.»"
1013508-6 = "А?"
1013508-7 = "Да, ну... Спасибо. Вдвоём дело пойдёт быстрее."
1013508-8 = ""
1013508-10 = ""
1013508-11 = ""
1013508-12 = "...Момои скорее устроит новый беспорядок, чем действительно начнёт убираться."
1013508-13 = "Мидори убирается... если её заставить начать. Лучше всего она справляется с мелочами, но, может, это потому, что она художница."
1013508-14 = "Она не устраивает бардак специально, но и убирается не особенно часто."
1013508-15 = "Юзу... По крайней мере, она больше не прячется всё время, но постоянно играет или пишет код. А Арис..."
1013508-16 = ""
1013508-18 = ""
1013508-19 = "...Я переживаю за Арис..."
1013508-20 = "Из этих четырёх она как минимум вторая по аккуратности. Но мы перенимаем привычки окружающих, а компания у неё ЕЩЁ ТА..."
1013508-21 = "Нет, ну. Я не говорю, что остальные трое плохие. Все они мне вполне приятны. Однако..."
1013508-25 = ""
1013508-29 = ""
1013508-30 = "Фух. Теперь немного лучше."
1013508-31 = "Сделаем ставку? Я даю этому месту три дня, прежде чем здесь снова будет бардак."
1013508-32 = "[s] «Три дня... Понимаю... твою мысль...»"
1013508-33 = "Да."
1013508-34 = "..."
1013508-35 = "...?"
1013508-36 = "Фуфу. Вы же сказали, что сегодня хотите фирменное блюдо шефа?"
1013508-37 = "[s] «Что такое, Кей-Кей?»"
1013508-38 = "Ты только что отвела взгляд?"
1013508-39 = "[s] «Тебе показалось, госпожа Кей.»"
1013508-40 = "«Госпожа Кей»...?"
1013508-41 = "..."
1013508-42 = "Сенсей."
1013508-43 = "Посмотри мне в глаза."
1013508-44 = "[s] «Н-Нет! Я не сдамся!»"
1013508-45 = "Смотри мне прямо в лицо!"
1013508-46 = "[s] «Ух...!»"
1013508-47 = "Положи руку на сердце и ответь честно."
1013508-48 = "Ты обычно убираешь за собой?"
1013508-49 = "[s] «...!»"
1013508-50 = ""
1013508-54 = "Стоять! Не говори ни слова! Я уже знаю ответ!"
1013508-58 = "..."
1013508-59 = "[s] «...»"
1013508-60 = "Сенсей."
1013508-61 = "[s] «А-а?»"
1013508-62 = "Здесь живёт человек? Или ты разводишь свиней?"
1013508-63 = "Если скажешь, что здесь живёт человек, значит, у тебя нет совести; а если признаешь, что это нормальный свинарник, то тем самым объявишь, что сам ты не человек!"
1013508-64 = "Я дам тебе десять секунд. Оправдывайся."
1013508-65 = "[s1] «Послушай, Кей-Кей! Я могу всё объяснить!»\n[s2] «Уборка и домашние дела — это... бесконечный процесс!»"
1013508-68 = "И к чему ты клонишь?"
1013508-69 = "[s] «Всегда найдётся что ещё убрать! На сегодня с этим никогда не закончишь.»"
1013508-70 = "Продолжай."
1013508-71 = "[s3] «Поэтому я просто берусь за дело, когда есть настроение.»\n[s4] «Это придаёт сил! И вообще, если подумать, рационально!»"
1013508-72 = ""
1013508-73 = ""
1013508-75 = ""
1013508-76 = ""
1013508-77 = "ТЫ ДУМАЕШЬ, ЧТО МОЖЕШЬ ЧИТАТЬ МНЕ ЛЕКЦИИ О РАЦИОНАЛИЗМЕ?!"
1013508-78 = "Умри! Просто умри!! Если понадобится, я умру вместе с тобой. Но если ты считаешь, что так жить нормально — просто умри!"
1013508-79 = ""
1013508-80 = ""
1013508-82 = ""
1013508-84 = "Серьёзно, и зачем я вообще...?"
1013508-85 = ""
1013508-86 = ""
1013508-88 = ""
1013508-90 = "По крайней мере, здесь чуть лучше, чем в комнате Рио. И НЕТ, это не комплимент."
1013508-91 = ""
1013508-92 = ""
1013508-94 = "Столько пыли... Им вообще плевать на бронхи? На лёгкие? Если лёгкие угробить, обратно их уже не восстановишь..."
1013508-96 = ""
1013508-100 = ""
1013508-101 = "*вздыхает*..."
1013508-102 = "Ну что, Сенсей?"
1013508-103 = "[s] «Да?»"
1013508-104 = "Одно слово? И всё?"
1013508-105 = "[s5] «Прости. Спасибо.»\n[s6] «Мне ОЧЕНЬ жаль. Я ИСКРЕННЕ благодарен.»"
1013508-108 = "...Главное, что теперь ты понял."
1013508-109 = "А если в следующий раз снова устроишь бардак...!"
1013508-110 = ""
1013508-113 = "..."
1013508-114 = "Кого я обманываю? Конечно устроишь."
1013508-115 = "...Просто не барахтайся и не пытайся справиться один. Позови меня."
1013508-116 = "[s7] «...?!»\n[s8] «Ты готова помочь...?»"
1013508-119 = "Будем практичны."
1013508-120 = "Вдвоём работа идёт быстрее, разве нет?"
1013508-121 = ""
1013508-124 = "[ns] «Я так и знал, так и знал...!»"
1013508-125 = "Что именно ты знал...?"
1013508-126 = "Нет, погоди. Разве я не говорила тебе больше никогда не ухмыляться так довольно?"
1013508-127 = "Когда я с тобой говорю, слушай. И НЕ СМЕЙ говорить ничего раздражающего!"
1013508-128 = "[ns9] «Кей-Кей милая!»\n[ns10] «Кей-Кей милая!!»\n[ns11] «Кей-Кей милая!!!»"
1013508-132 = "А-а-а-а-а-а!!"
