[translation]
80000057-1 = "Знакомый вид"
80000057-2 = "Работая допоздна, я заглянул в комнату отдыха."
80000057-3 = ""
80000057-8 = "[ns1] «Кто здесь?»\n[ns2] Включить свет."
80000057-11 = ""
80000057-15 = "Я включил свет и увидел, что кто-то прячется."
80000057-16 = ""
80000057-25 = "[ns] «...»"
80000057-27 = "[ns3] «Выходи, Серина.»\n[ns4] «Я знаю, что это ты. Прятаться бессмысленно.»"
80000057-30 = "А-Ахаха... Здравствуйте, Сенсей!"
80000057-31 = "Я слышала, вы очень заняты, поэтому хотела оставить это для вас."
80000057-32 = "Э-Это помогает мозгу работать! Ну, раз вы трудитесь допоздна."
80000057-33 = "Н-Ну... и ещё потому, что сегодня День святого Валентина."
80000057-34 = "Наверное, это и есть настоящая причина... Хи-хи."
80000057-35 = "П-Простите! Наверное, я мешаю вам, заявившись так поздно."
80000057-36 = "А?"
80000057-37 = "Вы рады, что я принесла шоколад? И хотите, чтобы я присела?"
80000057-38 = "Н-Нет, всё хорошо! Не нужно ничего мне наливать!"
80000057-39 = "Сенсей... Сегодня вы расслабленнее обычного."
80000057-40 = "[s5] «Мне всё спокойнее рядом с тобой.»\n[s6] «Потому что мы стали ближе, Серина.»"
80000057-41 = "П-Понятно. Я рада, что вы так чувствуете."
80000057-42 = "П-Понятно. Я рада, что вы так чувствуете."
80000057-44 = "О, вы уже едите шоколад! Хи-хи."
80000057-45 = "Вам нужен был сахар? Я рада, что смогла помочь! Конечно, я выбрала для вас что-нибудь полезнее обычного шоколада."
80000057-46 = "Я так рада, что вам понравилось."
80000057-47 = ""
80000057-49 = ""
80000057-50 = "Тогда до встречи. Пожалуйста, зовите, если вам что-нибудь понадобится!"
80000057-51 = "[s] «Серина.»"
80000057-52 = "Д-Да?! Ч-Что такое, Сенсей?"
80000057-53 = "[s7] «На выходе можешь просто воспользоваться главным входом.»\n[s8] «Пожалуйста, больше не лезь через окно.»"
80000057-54 = "..."
80000057-55 = "..."
80000057-56 = "Х-Хи-хи... хи."
80000057-57 = "Спасибо, Сенсей. Берегите себя."
