[translation]
1010903-1 = "Без запаха"
1010903-2 = "Комната Ноа в общежитии Миллениума"
1010903-3 = ""
1010903-4 = "Добро пожаловать, Сенсей. Я вас ждала."
1010903-5 = "Немного непривычно так часто видеть вас в моей комнате."
1010903-6 = "[s1] «Как ты, Ноа?»\n[s2] «Тебе уже лучше?»"
1010903-9 = "Благодаря вам мне гораздо лучше. Температура всё ещё немного повышена, но для лёгких дел сил уже достаточно."
1010903-10 = "Несмотря на это, Юука велела мне соблюдать постельный режим до полного выздоровления."
1010903-11 = "Вот я и сижу здесь. Целыми днями сидеть в комнате и читать оказалось довольно утомительно."
1010903-12 = "Поэтому я и пригласила вас сюда в ваш выходной."
1010903-13 = "Простите, что побеспокоила вас. ...Не могли бы вы всего один раз простить мне эту маленькую детскую прихоть?"
1010903-14 = "[s3] «Не переживай.»\n[s4] «Ты всегда можешь на меня рассчитывать.»"
1010903-17 = "Хи-хи... Я знала, что вы так скажете."
1010903-18 = "Может, начнём с уборки?"
1010903-19 = "...Хотя, похоже, убирать здесь уже особо нечего."
1010903-20 = "Тогда перейдём к делу. Как наполнить эту безликую скучную комнату, не нарушив моего ощущения спокойствия?"
1010903-21 = "[s] «Я подготовил несколько вариантов!»"
1010903-22 = ""
1010903-26 = ""
1010903-27 = "Это... награды?"
1010903-28 = "[s] «По дороге сюда я забрал из Семинара все твои награды.»"
1010903-29 = "Это всё мои награды?"
1010903-30 = "О, точно. Этот кубок я получила на конкурсе слоганов на первом курсе... а этот — на школьном литературном конкурсе..."
1010903-31 = "А это награда за последнюю Премию Миллениума. Эх, вспоминаю то мероприятие... Фуфу."
1010903-32 = "Я хранила их в Семинаре, поэтому даже не замечала, сколько их накопилось."
1010903-33 = "Но какое отношение эти награды имеют к украшению комнаты?"
1010903-34 = "[s] «Я расставлю эти награды по всей твоей комнате!»"
1010903-35 = "Сами по себе награды выглядят вполне эстетично, а постоянные напоминания об успешных моментах моей жизни должны действовать позитивно..."
1010903-36 = "Похоже на хорошую идею."
1010903-37 = "Тогда давайте попробуем их расставить."
1010903-39 = "Немного позже..."
1010903-40 = ""
1010903-41 = "Хм."
1010903-42 = "[s] «Хмм...»"
1010903-43 = "Немного..."
1010903-44 = "[s] «Да, немного...»"
1010903-45 = "Помимо того, что их слишком много, награды на полу ещё и мешают нормально ходить по комнате."
1010903-46 = "К тому же комната, забитая наградами, неожиданно пробуждает во мне дух соперничества. Я вдруг чувствую себя... уставшей."
1010903-47 = "[s5] «Ничего страшного, я на всякий случай принёс и другие вещи.»\n[s6] «На этот раз тема... вот такая!»"
1010903-50 = ""
1010903-54 = "...Книги?"
1010903-55 = "[s7] «Да. Ты ведь очень любишь читать, верно?»\n[s8] «Если повсюду разложить стопки книг, получится отличная атмосфера!»"
1010903-58 = "Мне и правда нравится ощущение, когда заходишь в книжный или букинистический магазин и видишь стены, заставленные книгами."
1010903-59 = "А если книги всегда будут под рукой, мне будет удобно в любой момент взять что-нибудь почитать..."
1010903-60 = "Давайте попробуем ваш вариант."
1010903-62 = "Немного позже..."
1010903-63 = ""
1010903-64 = "А..."
1010903-65 = "[s] «Всё ещё немного...»"
1010903-66 = "Да, немного... При такой расстановке по комнате всё ещё трудно передвигаться."
1010903-67 = "Полагаю, в бою эти стопки могли бы послужить хорошим укрытием, но в моей комнате вряд ли случится перестрелка."
1010903-68 = "Простите, но и этот вариант не совсем подошёл."
1010903-69 = "[s] «В-всё нормально. У меня есть и другие вещи.»"
1010903-71 = "После этого я предлагал самые разные украшения, но..."
1010903-72 = ""
1010903-73 = "Эм... Эта огромная кукла Пероро действительно разбавляет унылость комнаты, но..."
1010903-74 = "...от её жуткого взгляда мне могут сниться кошмары."
1010903-76 = ""
1010903-77 = "Этот переносной бассейн освежает, но разве из-за него в комнате не станет слишком влажно?"
1010903-78 = "И ещё меня беспокоит нагрузка на пол, когда он будет заполнен водой."
1010903-80 = "...Она отвергала одну идею за другой."
1010903-81 = ""
1010903-82 = "...Задачка оказалась непростой."
1010903-83 = "Мне очень жаль, что я всё время отвергаю ваши продуманные предложения."
1010903-84 = "[s] «Нет, не извиняйся. Это мне жаль. Я совсем не помог.»"
1010903-85 = ""
1010903-87 = ""
1010903-88 = "Похоже, эта безликая эстетика просто лучше всего мне подходит."
1010903-89 = "У каждого есть свои естественные склонности, и насильно пытаться их изменить редко бывает эффективно."
1010903-90 = "Одного того, что вы сегодня мне помогали, уже достаточно, чтобы я была счастлива, Сенсей."
1010903-91 = "[s9] «Вообще-то у меня осталось ещё кое-что...»\n[s10] «Не возражаешь, если я оставлю хотя бы это?»"
1010903-94 = ""
1010903-98 = "Это... освежитель воздуха?"
1010903-99 = "Я совсем не против поставить в комнате освежитель, но почему...?"
1010903-100 = "[s] «На настроение человека часто влияют и невидимые вещи.»"
1010903-102 = "[ns11] «Пусть визуально твоя комната остаётся пустой...»\n[ns12] «...зато мы можем наполнить её приятным ароматом и изменить атмосферу.»"
1010903-105 = ""
1010903-106 = "...Мне нравится. Отличная идея."
1010903-107 = "Как вы и сказали, иногда самые важные проявления индивидуальности нельзя увидеть глазами."
1010903-108 = ""
1010903-110 = ""
1010903-111 = "Освежитель воздуха, который вы принесли... пахнет уютно и сладко, словно лилия после дождя."
1010903-112 = "Именно такой аромат напоминает вам обо мне?"
1010903-113 = "[s] «Вообще-то я об этом не думал, но...»"
1010903-114 = "Фуфу, не нужно оправдываться."
1010903-115 = "Я просто вас дразню..."
