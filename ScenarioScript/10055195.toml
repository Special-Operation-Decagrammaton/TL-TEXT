[translation]
10055195-2 = "Кихехе!"
10055195-3 = "Ки-хе-хе-хе! Наконец пала даже «Красная зима»!"
10055195-4 = "Тем самым доказано, что НИ ОДНА академия не превосходит Геенну!"
10055195-5 = "Жалкие жители Кивотоса! Я буду править вами всеми! Склонитесь перед мощью и мудростью Макото!"
10055195-6 = "Ибуки будет править вами!"
10055195-7 = "Макото, пожалуйста, перестань такое говорить. Ты учишь её плохому."
10055195-8 = "«Билет желания королевы»! Исполни моё желание!"
10055195-9 = "Что ты загадаешь?"
10055195-10 = "Неужели не знаешь? Конечно же, мировое господство!"
10055195-11 = "Я так и думала."
10055195-12 = "Итак, я желаю..."
10055195-13 = ""
10055195-15 = ""
10055195-16 = "..."
10055195-17 = "Макото?"
10055195-18 = "...Нет. Если подумать..."
10055195-19 = ""
10055195-21 = ""
10055195-22 = "Моё желание..."
10055195-27 = "А, она очнулась."
10055195-28 = "Вот видишь? Единственное, что у неё есть, — это выносливость."
10055195-29 = ""
10055195-31 = ""
10055195-32 = "Хм...?"
10055195-33 = "Что произошло...?"
10055195-34 = "Не помнишь? Ты... залезла на лодку, сказала, что поймаешь чайку, потом упала и ударилась головой."
10055195-35 = ""
10055195-37 = ""
10055195-38 = "А как же Тайгершаркмару?! Как же «Билет желания королевы»?! Моё желание?!"
10055195-39 = ""
10055195-41 = ""
10055195-42 = "А...?"
10055195-43 = "Ты вообще о чём...? Во сне ты, кажется, и то понятнее говорила."
10055195-44 = "Похоже, ей приснился необычный сон."
10055195-45 = "...Наверняка."
10055195-46 = "Это всё был сон?! Нет, нет!!"
10055195-47 = ""
10055195-49 = ""
10055195-50 = "Я хочу обратно!"
10055195-51 = ""
10055195-53 = ""
10055195-54 = "А?"
10055195-55 = "Ого! Какой милый рак-отшельник!"
10055195-58 = "Хошино!"
10055195-60 = ""
10055195-61 = "Ого!"
10055195-62 = "Да что такое! Ты опять спала?!"
10055195-63 = "Э-эм, ну... Понимаешь..."
10055195-64 = "Ты должна была УБРАТЬ кладовку, а не спать в ней!"
10055195-65 = "Да-да, помню. Я как раз собиралась это сделать..."
10055195-66 = "...И тут заснула! Какое у тебя оправдание?"
10055195-67 = "Никакого..."
10055195-68 = "Ладно, давай я помогу. Вместе мы управимся быстрее."
10055195-69 = "Хе... Старая добрая Серика. Как же приятно, когда рядом такие младшие товарищи."
10055195-70 = "З-заткнись, а то сейчас меня разозлишь!"
10055195-71 = ""
10055195-73 = ""
10055195-74 = "...Эй, Хошино?"
10055195-75 = "Ты какая-то рассеянная. Всё хорошо? Странный сон приснился, что ли...?"
10055195-76 = "А-А?"
10055195-77 = "Нет-нет. Обычная бессмыслица."
10055195-78 = "Только... на этот раз с крабами."
10055195-79 = "И всё же..."
10055195-80 = "Я увидела много милых морских созданий, так что, может, не зря приснилось."
10055195-81 = ""
