[translation]
10055195-2 = "Kikiki..."
10055195-3 = "Kishishishi! Red Winter has finally fallen!!"
10055195-4 = "This proves that there is no academy that can defeat Gehenna!"
10055195-5 = "You motley masses living in Kivotos! Kneel before the wisdom and power of Lord Makoto!"
10055195-6 = "I shall rule over all of you!"
10055195-7 = "Sigh... Ibuki is going to start imitating you, so please stop saying such strange things."
10055195-8 = "Oh, 'Queen's Anything Ticket'! Grant my wish!"
10055195-9 = "And? What are you actually going to wish for?"
10055195-10 = "A foolish question. World domination, obviously!"
10055195-11 = "I thought as much..."
10055195-12 = "Now, for my wish...!"
10055195-16 = "..."
10055195-17 = "Senior Makoto?"
10055195-18 = "No, on second thought..."
10055195-22 = "My wish is..."
10055195-27 = "Oh, she's awake."
10055195-28 = "Didn't I tell you? Being physically sturdy is the only thing Senior Makoto has going for her."
10055195-32 = "Hmm...?"
10055195-33 = "What is the meaning of this...?"
10055195-34 = "Don't you remember? You said you were going to catch a seagull, Makoto-chan, and tried to climb onto the boat, but then you fell straight down."
10055195-38 = "What happened to the Tiger Shark Maru!? And the 'Queen's Anything Ticket' that grants any wish!?"
10055195-42 = "Excuse me...?"
10055195-43 = "Um... could you at least say something sensible in your sleep?"
10055195-44 = "Isn't it not sensible precisely because it's sleep-talking?"
10055195-45 = "...I suppose that's true."
10055195-46 = "To think that was all a dream!? That's preposterous!"
10055195-50 = "I refuse to accept it! I refuse, I refuse, I refuse!!!"
10055195-54 = "Huh?"
10055195-55 = "Wow, a cute hermit crab!"
10055195-58 = "Senior Hoshino!"
10055195-61 = "Whoa!?"
10055195-62 = "Geez! Were you really sleeping!?"
10055195-63 = "Ah... uhhh..."
10055195-64 = "You were supposed to be organizing the warehouse! I asked you to, didn't I!?"
10055195-65 = "Yeah, yeah, that's true, but~"
10055195-66 = "It's true, but you were sleeping! What's your excuse?"
10055195-67 = "I have none..."
10055195-68 = "Honestly... I'll help you, so hurry up and get up! If we both do it, we'll be done in no time."
10055195-69 = "Uhe~ As expected of Serika-chan~ It's great to have a cute junior like you~"
10055195-70 = "Sh-shut up! If you keep teasing me, I'll get angry, you know!?"
10055195-74 = "...Senior Hoshino?"
10055195-75 = "You've been acting strange since you woke up, are you okay? Did you have a bad dream or something..."
10055195-76 = "Hmm...?"
10055195-77 = "Nah~? It was just a meaningless dream~"
10055195-78 = "Well... maybe a dream with a crab in it."
10055195-79 = "But still..."
10055195-80 = "I got to see lots of cute sea creatures, so I guess it was a win~"