10052010-77 = ""
10052010-78 = "С-Сенсей! Рио! Химари!"
10052010-79 = "На дне ямы что-то движется!"
10052010-80 = "Д-думаю, это Бина!"
10052010-81 = "Я так и знала... Я её разбудила... А-а..."
10052010-82 = "[s] «Ага. Похоже на то.»"
10052010-83 = "Я бы сказала, всё идёт по плану."
10052010-84 = "[ns] «Эта область... будет нашей!»"
10052010-85 = "...Для такой реплики ещё слишком рано."
