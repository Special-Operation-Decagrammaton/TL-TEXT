[translation]
10052010-1 = "Бина, Созерцатель Неравенства"
10052010-2 = "Момои на связи!"
10052010-3 = "Это было... довольно жёсткое приземление."
10052010-4 = "Ух, у меня всё ещё голова кружится... Минутку..."
10052010-5 = ""
10052010-6 = "[ns] «Где... мы?»"
10052010-9 = "Что значит где? Оглянись!"
10052010-10 = "Если глазами воспользоваться..."
10052010-11 = "Ох... Даже не знаю, С ЧЕГО начать объяснять..."
10052010-12 = "Хм? Разве это не просто огромная яма? Подземелье? Узел? Колодец? Впадина?"
10052010-13 = "Это ВСЁ грубейшие упрощения, Момои."
10052010-14 = "П-простые названия лучше всего, Кей! Ничего «грубого» в них нет!"
10052010-15 = ""
10052010-18 = ""
10052010-19 = "Это... было громко."
10052010-20 = "Звук механический, искусственный. Там внизу что-то движется. Работает."
10052010-21 = "[s] «Думаешь, это Бина?»"
10052010-22 = "...Вероятно, да."
10052010-23 = ""
10052010-25 = ""
10052010-27 = "Все благополучно приземлились? Я фиксирую сигнал Бины. Однако..."
10052010-28 = "Есть проблема, Химари?"
10052010-29 = "Её сигнал значительно слабее, чем у других пророков. Можно строить догадки почему, но..."
10052010-30 = "Я знаю почему! Она спит!"
10052010-31 = "...Это вполне возможно."
10052010-32 = "Или эта яма настолько глубокая, что заглушает сигнал Бины."
10052010-33 = "[s] «Но почему это происходит только здесь?»"
10052010-34 = "Пока мы не можем этого узнать, поэтому следует действовать осторожно."
10052010-35 = "Хм? Что ты имеешь в виду, Рио?"
10052010-36 = "Бина существовала ещё до появления Декаграмматона."
10052010-37 = "Говорят, Студенческий совет Абидоса исследовал Бину, но с тех пор вся соответствующая информация была утрачена."
10052010-38 = "На самом деле мы ДО СИХ ПОР не знаем, почему структура ИИ вроде Бины действовала в Пустыне Абидос."
10052010-39 = "То есть вы хотите сказать, что Бина немного... странная?"
10052010-40 = "Именно, но это лишь предположение. Должна быть причина, почему Бину поместили отдельно в таком месте."
10052010-41 = "Какой бы ни была причина, думаю, пора разбудить Бину."
10052010-42 = "«Разбудить»...? Мне нравится это слово. Я как раз думала сделать нечто подобное."
10052010-43 = "Юзу? Если я укажу угол и скорость, можешь выпустить одну из своих гранат соответственно расчёту?"
10052010-44 = "Ч-что?! Гранату...? Зачем...?"
10052010-45 = "При предсказуемой траектории и с учётом акустики мы сможем приблизительно оценить размер и глубину этой ямы."
10052010-46 = "Я уже тщательно проанализировала характеристики твоего оружия, Юзу."
10052010-47 = "Поскольку гранаты значительно медленнее пуль, мы сможем запустить её по дуге до состояния свободного падения."
10052010-48 = "При падении снаряд также взорвётся, что даст нам дополнительные данные."
10052010-49 = "Я отправила к вам наблюдательные дроны. Они должны прибыть прямо сейчас."
10052010-50 = ""
10052010-52 = ""
10052010-54 = ""
10052010-55 = ""
10052010-56 = "Тогда стреляю!"
10052010-57 = ""
10052010-59 = ""
10052010-62 = ""
10052010-63 = "[ns] «Эм... Вы что-нибудь узнали?»"
10052010-64 = "...Она глубже, чем я ожидала. Если грубо представить размер, ширина на дне составляет—"
10052010-65 = "Так-так. Давайте проще. Скажем лишь, что она больше, чем мы представляли?"
10052010-66 = ""
10052010-68 = ""
10052010-70 = ""
10052010-71 = "?! Все, осторожно! Зафиксирована сейсмическая активность!"
10052010-72 = ""
