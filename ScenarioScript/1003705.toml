[translation]
1003705-1 = "Уборка председателя Комитета безопасности"
1003705-2 = "Опоздала!"
1003705-3 = "Мы договаривались не на 7:10 и не на 7:05, верно? Ровно в 7:00!"
1003705-4 = "[s] «Прости. Я проспал...»"
1003705-5 = "Десять минут опоздания — всё равно опоздание! В Академии Красной Зимы ценят пунктуальность!"
1003705-6 = "За такие оправдания положена чистка!"
1003705-7 = "[s] «Но почему мы должны убираться так рано утром?»"
1003705-8 = "Сенсей, сегодня утром ваша глупость не знает границ.#nРазумеется, туалеты нужно убрать до начала дня."
1003705-9 = "В обычные учебные часы нас постоянно будут отвлекать, и мы не сможем закончить работу."
1003705-10 = "Поэтому мы должны всё оттереть, вымыть и дать достаточно времени высохнуть до прихода студентов."
1003705-11 = "А теперь мы уже потеряли десять драгоценных минут нашего строгого графика..."
1003705-12 = "Вы возьмёте на себя ответственность, если из-за потерянного времени мы не успеем выполнить обязанности?"
1003705-13 = "Что вы будете делать, если студент поскользнётся, потому что пол в туалете всё ещё мокрый?"
1003705-14 = "Мне придётся немедленно доложить на вас за саботаж против Академии Красной Зимы!"
1003705-15 = "[s] «Если всё настолько срочно, нам, наверное, стоит начинать.»"
1003705-16 = "К-Как бы мне ни было больно это признавать, я вынуждена согласиться."
1003705-17 = "Я отложу ваше наказание, пока мы не закончим уборку туалетов."
1003705-18 = "Постарайтесь искупить свою ошибку особенно усердной уборкой!"
1003705-19 = "Итак, да начнётся Революционная уборка туалетов!"
1003705-22 = "― Ц... Пятно в этой щели довольно стойкое.[wa:2940]"
1003705-25 = "― Но долго ли оно выдержит[wa:2310]"
1003705-27 = "― мою беспощадную атаку?"
1003705-30 = "― Хе-хе.[wa:380]"
1003705-32 = "― Никогда не недооценивайте мощь моего нового оружия.[wa:1100]"
1003705-35 = "― С этим новым чистящим средством, которое я купила,[wa:360]"
1003705-37 = "― нет такой щели, до которой не доберутся мои руки![wa:520]"
1003705-40 = "― Стойте, Сенсей! Нужно полностью убрать влагу.[wa:1360]"
1003705-42 = "― Смойте всю пену с зеркал и окон![wa:680]"
1003705-45 = "― А затем ещё раз протрите всё газетой.[wa:610]"
1003705-47 = "― Вот тогда блеск будет действительно без разводов![wa:190]"
1003705-50 = "― И ещё, такое чистящее средство[wa:500]"
1003705-52 = "― опасно использовать в закрытом помещении.[wa:10]"
1003705-55 = "― Не забывайте как следует проветривать![wa:10]"
1003705-58 = "― Безопасность прежде всего![wa:1200]"
1003705-60 = "― Не теряйте бдительности в битве с загрязнениями![wa:1330]"
1003705-63 = "― Защитим чистоту Академии Красной Зимы![wa:10]"
1003705-66 = "К счастью, мы закончили уборку вовремя."
1003705-67 = "Ваша работа была приемлемой. Поэтому за утренний проступок вы наказаны не будете. Будьте благодарны!"
1003705-68 = "Разве сама уборка не была просто... восхитительной?"
1003705-69 = "При виде идеально чистого туалета меня охватывает чувство покоя и умиротворения."
1003705-70 = "Что-то не так, Сенсей?"
1003705-71 = "[s1] «Ты отлично справляешься со своей работой.»\n[s2] «Я уважаю тебя, Марина.»"
1003705-72 = "Ха-ха. Разумеется!"
1003705-73 = "Ха-ха. Разумеется!"
1003705-74 = "Я — великий председатель Комитета безопасности Красной Зимы!"
1003705-75 = "По сравнению с устранением врагов Секретариата уборка туалета — сущая мелочь!"
1003705-76 = "[ns] «Похоже, тебе это и правда нравилось.»"
1003705-78 = "[ns] «Может, тебе стоит стать начальником санитарной службы.»"
1003705-79 = "Н-Начальником с-санитарной службы?!"
1003705-80 = "Как... Как вы СМЕЕТЕ?! Как вы смеете проявлять неуважение ко мне, председателю Комитета безопасности Красной Зимы!"
1003705-81 = "Я стану следующим президентом Студенческого совета! А не каким-то жалким начальником санитарной службы."
1003705-82 = "Хотя, признаюсь, уборка туалетов действительно приносит мне немало радости..."
1003705-83 = "Может, стоит подумать о том, чтобы совмещать должности председателя Комитета безопасности и начальника санитарной службы."
1003705-84 = "Но сейчас начальник санитарной службы — президент Черино. Если я захочу занять эту должность..."
1003705-85 = "...мне придётся устроить ещё один переворот?"
1003705-87 = "Я оставил Марину наедине с её разогнавшимися мыслями и вернулся в Шале."
