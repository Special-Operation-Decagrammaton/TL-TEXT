[translation]
10016130-1 = "Послесловие;Эпизод Префектской команды Геенны"
10016130-3 = ""
10016130-4 = ""
10016130-5 = ""
10016130-8 = ""
10016130-9 = ""
10016130-10 = "Президент Хина!"
10016130-11 = ""
10016130-13 = ""
10016130-15 = ""
10016130-17 = "Где вы всё это время были? Я вас искала!"
10016130-18 = "Вы хоть представляете, как я волновалась, когда поняла, что вы исчезли перед соревнованием?"
10016130-19 = "Ну, насчёт этого—"
10016130-20 = "Я никак не могла с вами связаться. А когда спрашивала других членов Префектской команды, они только мялись и уклонялись от ответа."
10016130-21 = "Я боялась, что эти еноты из Общества Пандемониума добрались до вас!"
10016130-22 = "Подожди, Ако. Всё совсем не так, успокой—"
10016130-23 = "Хотя даже если бы всё Общество Пандемониума напало разом, они бы, конечно, и близко к вам не подобрались..."
10016130-24 = "Разумеется, я ни на секунду в вас не сомневалась и не недооценивала вас! Никогда!"
10016130-25 = ""
10016130-27 = ""
10016130-28 = "Но если бы с вами что-нибудь случилось, я бы—"
10016130-29 = ""
10016130-31 = ""
10016130-32 = ""
10016130-34 = "...Ако."
10016130-35 = "...Д-да?!"
10016130-37 = "Успокойся. Я всё тебе объясню. Просто дай мне минуту."
10016130-38 = "Д-да, конечно. Простите."
10016130-40 = "Для начала прости, что ушла, ничего не сказав."
10016130-41 = "Извини, что свалила всю эту работу на тебя. Я вовсе не хотела, чтобы так вышло."
10016130-42 = "Свалила всю работу на меня..."
10016130-43 = "Мне даже немного неловко слышать, как вы это называете."
10016130-44 = "По сравнению с тяжёлой работой, которой обычно занимаетесь вы, мне достались сущие мелочи."
10016130-45 = "Найти нарушителей, мешавших фестивалю, скорректировать соревнование, в котором вы должны были участвовать..."
10016130-46 = "Похоже, я доставила тебе немало хлопот. Прости."
10016130-47 = "Но погодите, где вы были во время соревнования?"
10016130-48 = "Я проверила офис Исполнительного комитета и все остальные места, где вы могли быть..."
10016130-49 = "А. Я была в Объединённом медицинском штабе, которым руководят Рыцари помощи Тринити и Клуб экстренной медицинской помощи."
10016130-50 = "Я отвела туда пациента, которого нашла на стадионе—"
10016130-51 = "В Объединённом медицинском штабе?! Вы пострадали?!"
10016130-52 = "Если на вашей коже останется шрам — это будет трагедия! Катастрофа! Обязательно—"
10016130-53 = ""
10016130-55 = ""
10016130-56 = "Ако, успокойся."
10016130-58 = "Повторяю, я просто зашла в Объединённый медицинский штаб, чтобы оставить там другого человека. А потом внезапно объявили террористическую тревогу, и я задержалась ненадолго. Вот и всё."
10016130-59 = "У меня нет серьёзных травм, а нападения, как выяснилось, вообще не было, так что волноваться не о чем."
10016130-60 = "Террористическая тревога?"
10016130-61 = "Странно. Я весь день была с другими членами Исполнительного комитета, но мы ничего об этом не слышали."
10016130-62 = "Наверное, информация не дошла до Исполнительного комитета, потому что это больше относилось к юрисдикции Сэны."
10016130-63 = "В общем, я осталась в медицинском штабе, немного отдохнула и быстро прошла осмотр."
10016130-64 = "Если уж на то пошло, сейчас я чувствую себя лучше, чем когда-либо."
10016130-65 = "Рада слышать это…"
10016130-66 = "Кстати, были ли у Префектской команды проблемы, которые оказалось трудно решить без меня?"
10016130-67 = "Я слышала, на стадион ворвался танк? Ещё слышала, что Геенна победила в общем зачёте, да и наверняка произошло многое другое..."
10016130-68 = "Да. Пока вас не было, возникло несколько проблем, но не волнуйтесь — я сразу же ими занялась."
10016130-69 = "Что касается студентов-нарушительниц, я разобралась с ними при помощи других членов Исполнительного комитета."
10016130-70 = "А когда понадобилось заполнить свободные места участников, я привлекла студентов из Общества гурманов."
10016130-71 = "Ты... попросила помощи у других студентов?"
10016130-72 = "Да. Вы ведь помните Джунко из Общества гурманов? И как быстро она убегает от наших облав?"
10016130-73 = "Так вот, впервые эта скорость пошла на пользу, и она принесла Геенне победу в общем зачёте."
10016130-74 = "Мне очень не хочется быть в долгу у такого проблемного клуба, как Общество гурманов, но это всё же лучше, чем иметь дело с Обществом Пандемониума."
10016130-75 = "Нет, я не это имела в виду..."
10016130-76 = "Ако, ты хочешь сказать, что сотрудничала с другими студентами, чтобы решить эти проблемы?"
10016130-77 = "...Да? Что-то не так?"
10016130-78 = "А. Нет. Ничего."
10016130-79 = "Сколько бы работы ни было на тебе, прежняя ты попыталась бы сделать всё сама."
10016130-81 = "А теперь ты справилась с нагрузкой, попросив помощи у окружающих... Ты сильно изменилась, Ако."
10016130-82 = "Когда вы говорите такое, президент Хина, у меня внутри столько всего..."
10016130-83 = "...Что?"
10016130-84 = "Н-Неважно!"
10016130-85 = ""
10016130-87 = ""
10016130-88 = "Внимание. Через несколько минут мы зажжём костёр на вечеринке после Фестиваля Хало."
10016130-89 = "Студентов, желающих присоединиться к танцам вокруг костра, просим собраться в центре поля."
10016130-90 = "Повторяем, через несколько минут..."
10016130-91 = "В любом случае, прости, что сегодня так надолго оставила тебя одну."
10016130-92 = "Ако, может, ненадолго сходим к костру?"
10016130-93 = "П-Правда?"
10016130-94 = "Танцевать, пожалуй, будет уже слишком, но я подумала, что было бы приятно побыть на вечеринке вместе с тобой."
10016130-95 = ""
10016130-97 = ""
10016130-98 = ""
10016130-100 = "Ну что, пойдём?"
10016130-102 = ""
10016130-104 = ""
10016130-106 = "Поняла!"
