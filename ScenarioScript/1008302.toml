[translation]
1008302-1 = "Чересчур заботливая кошка"
1008302-5 = "...На этом мой отчёт о планах тренировок и операций Хяккарёран на этот год завершён."
1008302-6 = "Мы намерены тесно сотрудничать с Шале. Надеемся, что наша открытость поможет этому поспособствовать."
1008302-7 = ""
1008302-14 = "Это всё."
1008302-15 = "Есть вопросы?"
1008302-16 = "[s1] «Мм, пока ничего конкретного.»\n[s2] «Твоя презентация была подробной и очень понятной.»"
1008302-19 = "Хорошо."
1008302-20 = "[s] «Ты потрясающая, Кикё. Так быстро подготовить настолько подробный материал.»"
1008302-21 = "Прекратите мне льстить."
1008302-22 = "Я оперативный офицер Хяккарёран. От меня следует ожидать именно такого уровня."
1008302-23 = "Наконец-то мы начинаем понемногу вставать на ноги."
1008302-24 = "Чем больше у нас ресурсов, тем лучше. Сотрудничество с Шале — лишь один из многих методов, которые я использую."
1008302-25 = "Путь может быть долгим, а тени — густыми, но нам остаётся только двигаться вперёд."
1008302-26 = "[s] «С Кикё у руля Хяккарёран встанет на ноги в кратчайшие сроки.»"
1008302-27 = "...Я прямо заявила, что ваше существование для меня лишь средство достижения цели. Это совсем не вызывает подозрений у Шале?"
1008302-28 = "...Нет? Всё «нормально»?"
1008302-29 = "Вы говорите так, будто это вообще никак не влияет на ваши чувства."
1008302-30 = "Впрочем, неважно. Я пойду."
1008302-31 = "[s] «Доброй ночи. И отличная работа сегодня, Кикё.»"
1008302-32 = "..."
1008302-33 = "... ..."
1008302-34 = "Не придавайте этому больше значения, чем следует."
1008302-35 = "Но я хотела бы поблагодарить вас—"
1008302-36 = ""
1008302-41 = ""
1008302-42 = ""
1008302-43 = ""
1008302-44 = "...за то, что вы сегодня были здесь. Вот и всё. Можете идти."
1008302-45 = "[s] «...Эм, Кикё. Потолок только что обвалился.»"
1008302-46 = "Не беспокойтесь об этом."
1008302-47 = "Пустая болтовня — лишь трата времени. Выход в той стороне."
1008302-48 = ""
1008302-50 = ""
1008302-51 = "Только осторожнее с обломками."
1008302-52 = "Было бы... хлопотно, если бы вы поранились."
1008302-53 = ""
1008302-58 = ""
1008302-59 = "[ns] «Кикё?! Под тобой только что провалились доски пола?!»"
1008302-60 = "Сколько ещё разными словами мне повторить, что это не имеет значения?"
1008302-61 = "Не стоит беспокоиться. Правда."
1008302-62 = ""
1008302-67 = "[ns] «Да я беспокоюсь! Что здесь вообще происходит?!»"
1008302-68 = ""
1008302-70 = ""
1008302-71 = "... *вздох*"
1008302-73 = "[ns] «...Да тут всё здание разваливается?!»"
1008302-74 = "...Да. Оно обветшало из-за долгих лет без ухода."
1008302-75 = "Регуляторный офис существует с самого основания Хяккарёран."
1008302-76 = "Старые здания вроде этого быстро приходят в негодность без надлежащего обслуживания."
1008302-77 = "Так стоит ли удивляться его нынешнему состоянию? Скорее всего, всё даже хуже, чем кажется на первый взгляд."
1008302-78 = "Но, повторяю: не беспокойтесь. Проблемами Хяккарёран займётся сама Хяккарёран."
1008302-79 = "Вам пора возвращаться в Шале."
1008302-80 = "[s] «Нет, я не могу!»"
1008302-81 = ""
1008302-83 = ""
1008302-84 = "Простите?"
1008302-85 = "...Вы не можете просто закрыть на это глаза? Хотите помочь с ремонтом?"
1008302-86 = "...Почему?"
1008302-87 = "[s] «В смысле зачем?! Оно же разваливается!»"
1008302-88 = "Для вас здесь нет никакой выгоды."
1008302-89 = "Мы не можем предложить никакой награды. Вы посторонний человек, у которого нет причин заботиться о безопасности наших помещений."
1008302-90 = "Нет ни одной логичной причины, по которой вы должны нам помогать."
1008302-91 = "[s] «Я хочу помогать студентам, которым нужна помощь.»"
1008302-92 = ""
1008302-94 = ""
1008302-95 = "Ха. Ладно."
1008302-96 = "Суйте свой назойливый нос в наши дела. Мне всё равно."
1008302-97 = "Я занята собственной работой, так что помогать не стану."
1008302-98 = "...В конце концов, именно вы сами вызвались на эту роль."
1008302-99 = "Вы действительно всё ещё хотите этим заниматься?"
1008302-100 = "[s] «Если ты не против — оставь всё мне!»"
1008302-101 = ""
1008302-103 = ""
1008302-110 = ""
1008302-111 = ""
1008302-113 = "(Что за непостижимое поведение...)"
1008302-114 = "(Говорит о каких-то нелепых идеалах... оказании помощи... помощи студентам...)"
1008302-115 = "(Бессмысленные сентименты, которые ничего не значат.)"
1008302-116 = "(Должно быть, им движет жалость. Другой причины помогать нам я придумать не могу.)"
1008302-117 = "(Это здание давно заброшено. Сколько же сил потребуется, чтобы его восстановить...)"
1008302-118 = ""
1008302-120 = ""
1008302-121 = ""
1008302-123 = "...Хмф."
1008302-124 = "Сенсею быстро надоест это показное усердие, и он скоро сбежит."
1008302-129 = "После примерно пяти часов ремонта и работы в регуляторном офисе..."
1008302-132 = ""
1008302-135 = "[ns] «Наконец закончил с полом! Теперь пора браться за потолок.»"
1008302-136 = ""
1008302-137 = "...Вы всё ещё здесь?"
1008302-138 = "[s] «Ага! Как раз собираюсь взяться за потолок!»"
1008302-139 = "У вас совсем нет обязанностей? Никакой работы, к которой нужно вернуться?"
1008302-140 = "...То, что вы «дали обещание», ещё не значит..."
1008302-141 = "...Всё нормально? Закончите свою работу ещё за три часа?"
1008302-142 = "Это абсурд. Вы абсурдны."
1008302-143 = ""
1008302-145 = ""
1008302-146 = "..."
1008302-147 = "Ладно."
1008302-148 = ""
1008302-150 = ""
1008302-151 = ""
1008302-152 = "Вот. Возьмите этот инструмент. Я подержу лестницу."
1008302-153 = "Какой бы инструмент вам ни понадобился, попросите — я подам."
1008302-154 = "[s] «Эм, Кикё... Разве ты не была занята работой?»"
1008302-155 = "Вы очень сильно меня недооценили, если считаете, что мне требуется больше пяти часов на выполнение моих задач."
1008302-156 = "И меня всё сильнее раздражает ваша неэффективность."
1008302-157 = "Поэтому я помогу."
1008302-158 = "[s] «Ну, жаловаться я не буду! За дело!»"
1008302-159 = "...Хмф."
1008302-166 = "[ns] «Вот теперь вроде всё! Отличная работа, Кикё.»"
1008302-167 = "...Взаимно."
1008302-168 = "Надо же. Отремонтировать целое здание за один день..."
1008302-169 = "Похоже, мне придётся пересмотреть своё мнение о вас."
1008302-170 = "[s] «Перестань! Я краснею!»"
1008302-171 = ""
1008302-175 = "[ns] «Раз уж теперь здание соответствует нормам безопасности, я, пожалуй—»"
1008302-177 = ""
1008302-179 = "[ns] «К-Кикё? Мне сложновато уйти, пока ты держишь меня за рубашку...»"
1008302-180 = ""
1008302-182 = ""
1008302-183 = "Ах."
1008302-184 = ""
1008302-186 = ""
1008302-187 = "Я знаю."
1008302-188 = "Однако уже поздно. Вы ведь пропустили ужин, не так ли?"
1008302-189 = "Дорога отсюда до Шале долгая. Скорее всего, домой вы попадёте уже после полуночи."
1008302-190 = "Я не люблю оставаться перед кем-либо в долгу."
1008302-191 = "Я хотела бы угостить вас ужином в качестве платы за ремонт."
1008302-192 = "Сейчас я отпущу вашу рубашку."
1008302-193 = "Возможно, ужин — недостаточная компенсация за вашу работу. Не считайте себя обязанным принимать приглашение лишь из какого-то смутного чувства приличия."
1008302-195 = "[ns] «Ужин с Кикё? Съем всё до последней крошки!»"
1008302-196 = ""
1008302-198 = ""
1008302-199 = "Наверное, с моей стороны противоречиво сомневаться после вашего согласия, но... неужели это предложение настолько вас радует?"
1008302-200 = "Сенсей, я начинаю думать..."
1008302-201 = "Вы довольно странный человек."
1008302-202 = "[s] «А?! Почему я странный только потому, что рад ужину?»"
1008302-203 = "...Забудьте."
1008302-204 = "Вымойте руки."
1008302-205 = ""
1008302-207 = ""
1008302-209 = ""
1008302-210 = "Я приготовлю ужин, достойный этого вашего... воодушевления."
1008302-212 = "За едой мы с Кикё непринуждённо обсуждали дела Хяккарёран, работу Шале и многое другое. Ужин был восхитительным."
