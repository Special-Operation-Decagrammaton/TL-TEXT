[translation]
1001606-1 = "Сверкающее воспоминание, Сенсей"
1001606-3 = "Ух ты. Потрясающе! Столько игр собрано в одном месте!"
1001606-4 = "[s] «Хм, современные игры и правда очень яркие.»"
1001606-5 = "Знаю. Конечно, я всё ещё считаю классические игры лучшими, но есть столько других, в которые я никогда не играла..."
1001606-6 = "А?"
1001606-7 = "Сенсей, смотрите. В автомате плюшевые игрушки."
1001606-8 = "Погодите, эти игрушки..."
1001606-9 = "Это Джелли из классической игры Fruitjellies!"
1001606-10 = "Но почему они там? Они заперты?"
1001606-11 = "[s] «Интересный взгляд на вещи.»"
1001606-12 = "О, подождите. Кажется, я кое-что поняла."
1001606-13 = "В Отделе разработки игр из поколения в поколение передают одну историю."
1001606-14 = "Она рассказывает об игре, где ты становишься пилотом НЛО и нападаешь на множество невинных плюшевых игрушек..."
1001606-15 = "Может, эта история как-то связана с этим?"
1001606-16 = "[s1] «Очень драматичный взгляд.»\n[s2] «Не могу доказать, что ты неправа, но...»"
1001606-17 = "Ух ты... Потрясающе."
1001606-18 = "Ух ты... Потрясающе."
1001606-19 = "[s] «Не просто смотри. Попробуй сама!»"
1001606-20 = "А? Попробовать самой?"
1001606-21 = "В-вы правда думаете, что у меня получится?"
1001606-22 = "[s] «Не узнаешь, пока не попробуешь.»"
1001606-23 = ""
1001606-24 = "Т-тогда я попробую..."
1001606-25 = ""
1001606-26 = ""
1001606-30 = "― Раньше я никогда не интересовалась ничем, кроме ретро-игр...[wa:2160]"
1001606-33 = "― Похоже, в игровых залах много разных видов игр.[wa:60]"
1001606-36 = "— Чувствую, что расширяю кругозор. Это была хорошая возможность чему-то научиться.[wa:920]"
1001606-39 = "― Спасибо, Сенсей.[wa:2260]"
1001606-41 = "― За то, что привели меня сюда..."
1001606-44 = "― Благодаря вам мне так весело.[wa:2000]"
1001606-47 = "― О, точно...[wa:2300]"
1001606-49 = "― Можете сохранить в секрете от моей сестры то, что сегодня произошло?[wa:1800]"
1001606-52 = "― Серьёзно, только не рассказывайте ей![wa:240]"
1001606-56 = "О, С-Сенсей! Я достала её!"
1001606-57 = "Ч-что мне теперь с ней делать?!"
1001606-58 = "[s3] «Вот, ты честно её выиграла.»\n[s4] «Это трофей победителя.»"
1001606-59 = "А..."
1001606-60 = "А..."
1001606-61 = "Это плюшевая игрушка, которая хранит мои воспоминания с вами, Сенсей..."
1001606-62 = "Каждый раз, когда я буду приходить в игровой зал или видеть эту игрушку, я буду вспоминать о вас, Сенсей."
1001606-63 = "Спасибо, Сенсей."
1001606-64 = ""
1001606-65 = "Я буду беречь эту игрушку."
