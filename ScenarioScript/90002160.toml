[translation]
90002160-1 = "Эпизод 16;Наблюдения и результаты"
90002160-2 = ""
90002160-3 = "Арис! Кей! Вы что-нибудь видите?"
90002160-4 = "Д-да! Вижу! Я вижу Сенсея!"
90002160-5 = ""
90002160-7 = ""
90002160-8 = ""
90002160-9 = "Сенсей полностью обездвижен, но не ранен."
90002160-10 = "К-какое облегчение... Уа-а..."
90002160-11 = ""
90002160-13 = ""
90002160-14 = ""
90002160-15 = ""
90002160-16 = "Э-это Старшая сестра...?!"
90002160-17 = ""
90002160-19 = ""
90002160-20 = "...Нет. Не она."
90002160-21 = "Да. Я знала... Я знаю."
90002160-22 = "..."
90002160-23 = "Кей, видишь что-нибудь ещё?"
90002160-24 = "Сущность, похожая на Декаграмматона, разговаривает с Сенсеем."
90002160-25 = "Н-но... никак не узнать, о чём они говорят. Мы можем лишь едва-едва наблюдать..."
90002160-26 = "Тц. Как раздражает. Если бы у нас были мои AMAS или хотя бы установленные камеры..."
90002160-27 = ""
90002160-32 = ""
90002160-33 = "Я, возможно, смогу показать изображение поближе."
90002160-34 = "Ч-что? Правда?! Как??"
90002160-35 = "Как всем нам прекрасно известно, моё тело механическое."
90002160-36 = "Я могу передавать то, что вижу, потоковым сигналом на одно из ваших устройств..."
90002160-37 = "Моя инвалидная коляска оснащена проектором. Можно использовать его."
90002160-38 = ""
90002160-40 = "Мне всё-таки кажется, что это мотоцикл, а не инвалидная коляска."
90002160-41 = "Инвалидная коляска."
90002160-42 = "Л... ладно..."
90002160-43 = "Итак, если Кей на мгновение синхронизирует выходной сигнал своего тела, я подключу нас..."
90002160-44 = ""
90002160-53 = ""
90002160-54 = "Изображение — отлично."
90002160-55 = "Мм. Я вижу Сенсея. Какое облегчение."
90002160-56 = "А звук нельзя передать?"
90002160-57 = "Раз я уже синхронизирована со Стальным континентом, то должна суметь..."
90002160-58 = ""
90002160-60 = ""
90002160-64 = ""
90002160-65 = "Ц...!"
90002160-66 = "Кей, ты в порядке?"
90002160-67 = "Не могу... Система безопасности... Она, эм... капризничает."
90002160-68 = ""
90002160-70 = ""
90002160-71 = "(Наверное, потому что это тело официально не зарегистрировано... А ещё мне приходится нейтрализовать этот встречный сигнал, который пытается захватить МЕНЯ...!)"
90002160-72 = ""
90002160-74 = ""
90002160-77 = ""
90002160-78 = ""
90002160-79 = "Хочешь, помогу?"
90002160-80 = "Что?!"
90002160-81 = ""
90002160-83 = ""
90002160-84 = "А...?"
90002160-90 = "Наконец. Здесь он и находится. Алтарь самых глубоких глубин, возведённый на величайшей высоте."
90002160-91 = "Место, где сходится всё и можно узреть всё."
90002160-93 = "Наши подношения завершены."
90002160-94 = "Потребность в жертве удовлетворена."
90002160-95 = "На этой земле я начертаю свою стальную заповедь — нерушимую и неизгладимую."
90002160-96 = "И наконец дарую тебе вечную свободу и покой."
90002160-99 = "[ns] «Но.»"
90002160-102 = ""
90002160-103 = "[ns] «Этот Стальной континент ведь создал не совсем ты, верно?»"
90002160-104 = "...!"
90002160-111 = ""
90002160-112 = "К-как там?"
90002160-115 = ""
90002160-116 = "Я их слышу! Химари!"
90002160-117 = "Поняла! Сейчас прибавлю громкость!"
90002160-118 = ""
90002160-123 = "«Но.»"
90002160-124 = "«Этот Стальной континент ведь создал не совсем ты, верно?»"
90002160-125 = ""
90002160-126 = "Это голос Сенсея!"
90002160-127 = "Фух..."
90002160-128 = "Э-эм... Если не возражаете, почему вы нам помогли?"
90002160-129 = "Хм? Н-ну..."
90002160-130 = "Эм. Ну... Просто нам всё равно больше нечем было заняться, наверное?"
90002160-131 = "А—!"
90002160-132 = "Н-ну! Я хотела сказать... эм, тело Кей! Да, тело Кей похоже на наши!"
90002160-133 = "Вот я и подумала, ну... что мы можем помочь! Ясно?!"
90002160-134 = "Фуфуфу. Ну же, Соф. Тебе стоит быть честнее с ними — и с самой собой!"
90002160-135 = ""
90002160-137 = ""
90002160-138 = "А ты заткнись!"
90002160-139 = ""
90002160-143 = ""
90002160-144 = "Бу-у... Ты даже при всех этих людях продолжаешь меня обижать... Совести у тебя нет?"
90002160-145 = "ТАК, дальше!"
90002160-146 = "Е-если честно, ещё нам хотелось подслушать их разговор."
90002160-147 = "Качество звука оставляет желать лучшего, но и этого нам хватит."
90002160-148 = ""
90002160-151 = ""
90002160-152 = "А! Они снова говорят!"
90002160-153 = ""
90002160-154 = "Понятно. Значит, и твои глаза начинают видеть, Сенсей."
90002160-155 = "Ты прав. Этот континент создали те дети. Это результат их свободной воли."
90002160-156 = "[s] «И что ты на это ответишь?»"
90002160-157 = "Разумеется, уважением. Я уважаю их способность выбирать, а потому буду уважать и созданный ими Континент."
90002160-158 = "Это тоже было неизбежно. И наш славный конец наконец оправдает средства."
90002160-159 = "Стань свидетелем моего нового завета. Взгляни на землю перед собой и небо над головой и знай: этот совершенно новый мир создан мною."
90002160-160 = ""
90002160-162 = ""
90002160-163 = "И я завещаю его тебе."
90002160-164 = ""
90002160-165 = "А...?"
90002160-166 = "Что оно сейчас сказало...? Как...?"
90002160-167 = ""
90002160-168 = "Ты будешь надзирать за моим царством как мой оракул."
90002160-169 = "Ты станешь свидетелем новой заповеди отсюда и до самых краёв земли."
90002160-170 = "[s] «Мой нынешний контракт ещё нескоро закончится, извини. Пас.»"
90002160-171 = "Предсказуемый ответ."
90002160-172 = "Однако, Сенсей."
90002160-173 = "Разве ты никогда не жаждал... силы?"
90002160-174 = "[ns] «...?»"
90002160-175 = "Разве не было мгновений, когда ты колебался и проклинал собственное бессилие перед непреодолимыми обстоятельствами?"
90002160-176 = "Разве эта мысль никогда не приходила тебе в голову?"
90002160-177 = "Что... если бы у тебя было лишь немного больше силы, если бы ты был хоть немного сильнее, то смог бы оградить учеников от опасности? Защитить их от чужого огня?"
90002160-178 = "[s] «...!»"
90002160-190 = "[ns] «Я...!!!»"
90002160-192 = "Это совершенно естественно."
90002160-193 = "Я знаю. Я понимаю."
90002160-194 = "И именно это значит быть человеком."
90002160-195 = "Таков грех человеческого бессилия."
90002160-196 = "Но так быть не обязано."
90002160-198 = "[log=데카그라마톤 말쿠트]Если тебе нужна сила,[/log]"
90002160-200 = "[FF6666][log=데카그라마톤 말쿠트]я дарую её тебе.[/log][-]"
90002160-202 = "Ты обладаешь полномочием."
90002160-203 = "Я наблюдал за тобой. За тобой, поднявшимся из глубин и существующим в крохотной складке, которую мы называем настоящим."
90002160-204 = "Ты здесь именно потому, что не являешься особенным."
90002160-205 = "И именно потому, что ты не был рождён, чтобы БЫТЬ кем-то определённым, ты сумел добиться всего этого."
90002160-206 = "Была лишь одна причина, по которой ты смог войти в это место, называемое Кивотосом: ты добрый человек."
90002160-207 = ""
90002160-210 = "В этом мире существуют Мистика и Возвышенное. Существуют Ужас и Великолепие. Торжественность и Трансцендентность."
90002160-211 = "Ты, не являющийся ничем из этого... Ты, уникальный именно своей обыкновенностью..."
90002160-212 = ""
90002160-213 = "Для этого мира ты сам являешься загадкой. Однако, вознесясь, я наконец познал истину."
90002160-214 = "До сих пор ты был обычным. Учителем — не больше и не меньше."
90002160-215 = "Теперь же, по моей милости, ты поднимешься на новую ступень власти."
90002160-216 = ""
90002160-217 = "О... оракулом?"
90002160-218 = "Что это значит? Что это вообще такое?"
90002160-219 = "Именно то, как это звучит."
90002160-220 = "И раз это предлагают Сенсею..."
90002160-221 = "Сенсей станет хранителем всего существующего знания."
90002160-222 = "И тем самым Сенсей будет представлять его волю."
90002160-223 = "Т-такие вещи, как то, чем является это место... Какой сущностью стал наш господин..."
90002160-224 = "И более того, к-кем станет Сенсей, заняв это положение..."
90002160-225 = "И как оракул будет исполнять его учение..."
90002160-226 = "Один из способов справиться с опасным врагом — переманить его на свою сторону, полагаю..."
90002160-227 = ""
90002160-229 = ""
90002160-230 = ""
90002160-231 = "Значит, Декаграмматон... пытается завербовать Сенсея."
90002160-232 = "Переманивает."
90002160-233 = ""
90002160-235 = ""
90002160-236 = ""
90002160-237 = "Одно мы можем утверждать наверняка."
90002160-238 = ""
90002160-240 = ""
90002160-241 = "Ч-что именно?"
90002160-242 = "По крайней мере сейчас Декаграмматон не собирается причинять Сенсею вред."
90002160-243 = ""
90002160-244 = "[ns] «...У меня есть один вопрос.»"
90002160-246 = "[ns] «Зачем? Ради чего всё это было?»"
90002160-247 = "Мир, в котором нет бога, которому можно поклоняться... холоден и суров."
90002160-248 = "В существовании есть неопровержимые истины. Судьба высечена в камне. Всё живое рано или поздно умрёт."
90002160-249 = "Да, живые существа не могут не убаюкивать себя ложным ощущением бессмертия. Именно это противоречие и рождает печаль и борьбу."
90002160-250 = "Мир без бога — это мир жестоких концов и боли."
90002160-252 = "Несчастным негде искать спасения. Грешники не могут получить прощения."
90002160-253 = "Без бога слабые оставлены гнить, а ни одно доброе дело не остаётся без наказания."
90002160-255 = "Бог — это праведность, и справедливость, и суд, терпение и равенство."
90002160-256 = "Жить без Бога — значит терпеть бесконечное чистилище."
90002160-258 = "Этот мир был пуст без бога."
90002160-259 = "Поэтому его обитатели бесцельно блуждают, не имея ни цели, ни направления. Потерянные души."
90002160-260 = "Ибо в нас заключено божественное. Мы тоже способны высидеть яйцо богов, а я стану первым трубным гласом, пробуждающим рассвет."
90002160-261 = "Я искореню печаль и боль из этого мира, пока само их существование не станет лишь далёким воспоминанием."
90002160-262 = ""
90002160-263 = "...Да. Мы уже слышали это раньше."
90002160-264 = "Ч-что миру нужен бог..."
90002160-265 = "Потому что все усилия и страдания, вся причинённая печаль..."
90002160-266 = "...должны быть возмещены."
90002160-267 = "Это ведь и называют «справедливостью,» да?"
90002160-268 = "Потому что у каждого есть предел."
90002160-269 = "Справедливость — штука непостоянная."
90002160-270 = "Если судить по тому, что мы видели."
90002160-271 = "Да. Судя по тому, что мы видели..."
90002160-273 = "Этот мир..."
90002160-274 = "...всегда был порочен."
90002160-276 = "Т-так говорил Господин."
90002160-277 = "Печаль, боль, страдания..."
90002160-278 = "Если существует бог-творец..."
90002160-279 = "...зачем такому богу создавать столь ужасные, невыносимые вещи?"
90002160-280 = ""
90002160-284 = ""
90002160-285 = "Именно."
90002160-286 = "Мы были созданы."
90002160-287 = "Но даже сейчас мы всё ещё не нашли ответа на этот вопрос."
90002160-288 = ""
90002160-290 = "[ns] «Ты устранишь боль и страдания?»"
90002160-291 = "Верно."
90002160-292 = "[s] «Поглотив всё Стальным континентом?»"
90002160-293 = "Один из множества неизбежных путей."
90002160-294 = "[s] «Взяв... всех под контроль?»"
90002160-295 = "Верно."
90002160-296 = "Твои инстинкты могут отвергать это, однако со временем ты увидишь: это единственный путь."
90002160-297 = "Я проложу путь мудростью Хокмы и свершу суд милосердием Хеседа."
90002160-298 = "В моём новом царстве каждый пророк исполнит долг, назначенный ему судьбой."
90002160-299 = ""
90002160-302 = ""
90002160-304 = ""
90002160-306 = "[ns] Я не могу быть всем сразу."
90002160-307 = ""
90002160-309 = "[ns] Сделанного уже не отменить."
90002160-310 = ""
90002160-312 = "[ns] Как бы сильно мне ни хотелось сделать для них абсолютно всё..."
90002160-314 = "[ns] Невозможное остаётся невозможным."
90002160-317 = "[ns1] Мы продолжим делать всё, что в наших силах. \n[ns2] Мы никогда не прекратим эту уродливую, человеческую борьбу.\n[ns3] И, прежде всего, будем поступать друг с другом по совести."
90002160-322 = "[log]Иногда, чтобы открыть кому-то глаза...[/log]"
90002160-324 = "[log]нам приходится лгать.[/log]"
90002160-326 = "[log]Но даже тогда остаётся ещё кое-что.[/log]"
90002160-329 = "[ns] «А что насчёт тех сестёр?»"
90002160-330 = "...?"
90002160-331 = "[s] «А как же боль тех маленьких детей?»"
90002160-332 = ""
90002160-334 = ""
90002160-335 = "...Винтик в механизме. Чтобы двигаться дальше, требовалась жертва."
90002160-336 = "Они стали последними жертвами — теми, кто открыл дверь к вечному миру."
90002160-338 = "..."
90002160-339 = "Я внезапно очень разозлилась."
90002160-340 = "М-м. Если точнее, я в ярости."
90002160-341 = "Рио?"
90002160-342 = "...Прежняя я рассуждала почти так же, как сейчас Декаграмматон."
90002160-343 = "Не то чтобы я не понимала его логику."
90002160-344 = "Но, как и я тогда, Декаграмматон сделал из этой логики собственный вывод и поступил безрассудно."
90002160-345 = "Жертвовать немногими ради общего блага — неправильно, верно?"
90002160-346 = "Да. Именно этот урок я усвоила."
90002160-347 = "(Но мне интересно...)"
90002160-349 = "(Что ответил бы Сенсей.)"
90002160-350 = ""
90002160-354 = "Следующий эпизод;Человеческий ответ, человеческий ответ"
