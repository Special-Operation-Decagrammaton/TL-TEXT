[translation]
1003202-1 = "Новогодний подарок для Сенсея"
1003202-5 = "Гостиная Шале"
1003202-7 = "[ns] «Н-Наконец-то закончил...»"
1003202-8 = "(Наконец разобрав гору работы в Шале, я, пошатываясь, добрался до гостиной.)"
1003202-9 = "[s] «Надо хоть немного поспать... хотя бы чуть-чуть.»"
1003202-10 = ""
1003202-18 = "[ns] «А? Уже утро...?»"
1003202-19 = "Просыпайся! Сенсей!"
1003202-20 = ""
1003202-23 = ""
1003202-24 = ""
1003202-26 = "[s] «Ч-Что?!»"
1003202-27 = ""
1003202-29 = "Сенсей, что значит «уже утро»?"
1003202-30 = "Вы что, собираетесь спать вечно?"
1003202-31 = "[s] «М-Муцки? Когда ты пришла?»"
1003202-32 = "Ваш милый студент пришёл разбудить вас, Сенсей!"
1003202-33 = "Сенсей, вы опять не спали всю ночь? Вы выглядите ещё растеряннее обычного. Ха-ха-ха!"
1003202-34 = "[s1] «Всё настолько плохо?! Но важнее другое...»\n[s2] «Муцки, твой наряд...»"
1003202-35 = "Хи-хи! Как видите, это особый наряд для Нового года!"
1003202-36 = "Хи-хи! Как видите, это особый наряд для Нового года!"
1003202-37 = "Сенсей! Вы были так заняты работой, что даже не заметили наступления Нового года!"
1003202-38 = "Ой! Как грустно. Как жалко!"
1003202-39 = "Но ничего."
1003202-40 = "Потому что сегодня я приготовила особый подарок для моего бедного, несчастного Сенсея!"
1003202-41 = ""
1003202-43 = ""
1003202-44 = ""
1003202-45 = "[ns] «Это многоярусный бэнто?»"
1003202-46 = "Ага, точно. Это мой особый домашний новогодний осэти-бэнто, приготовленный специально для Сенсея!"
1003202-47 = "[s3] «Осэти, приготовленное тобой?»\n[s4] «Подарок, который ты сделала специально для меня?»"
1003202-48 = "Разве не потрясающе? Я встала особенно рано и вложила всю душу в его приготовление для вас, Сенсей."
1003202-49 = "Разве не потрясающе? Я встала особенно рано и вложила всю душу в его приготовление для вас, Сенсей."
1003202-50 = "Ну же! Если хотите расплакаться — самое время!"
1003202-51 = "Не стойте столбом. Ну же, Сенсей. Открывайте!"
1003202-52 = "[s5] «Ну, раз ты настаиваешь.»\n[s6] «Спасибо за еду.»"
1003202-53 = "Хи-хи-хи!"
1003202-54 = "Хи-хи-хи!"
1003202-55 = ""
1003202-59 = "[ns] «М-Муцки? Это не похоже на осэти.»"
1003202-60 = ""
1003202-62 = "Пф-ф. Ахаха! Попался, Сенсей!"
1003202-63 = "Ваш настоящий подарок — не новогоднее осэти, а моя особая бомба с таймером!"
1003202-64 = "Это первое задание нового года для моего дорогого невыспавшегося Сенсея!"
1003202-65 = "[s] «П-Подожди. Стой! Ты серьёзно?!»"
1003202-66 = "Итак, задание! У бомбы с таймером два провода.#nКакой нужно перерезать?"
1003202-67 = "Красный, словно прекрасный новогодний рассвет?"
1003202-68 = "Или синий — цвета вашего лица после очередной знаменитой бессонной ночи?"
1003202-69 = "Какой ответ правильный?!"
1003202-70 = "[s7] «В конце концов, шанс всего пятьдесят на пятьдесят...»\n[s8] «Эй, моё лицо ведь не настолько ужасно выглядит?!»"
1003202-71 = ""
1003202-72 = ""
1003202-78 = "Хи-хи, осталось всего 20 секунд!"
1003202-79 = "Время идёт, Сенсей! Что выберете?!"
1003202-80 = "[s] «Я выбираю...!»"
1003202-81 = ""
1003202-84 = "[ns9] Перерезать красный провод.\n[ns10] Перерезать синий провод."
1003202-87 = "(В последний момент, после долгих раздумий, я выбрал, какой провод перерезать.)"
1003202-88 = ""
1003202-91 = "Дзинь-дзинь-дзинь! Время вышло! Вы опоздали!"
1003202-92 = "*биииип*"
1003202-93 = "[s] «А-а?»"
1003202-94 = "Хи-хи-хи!"
1003202-95 = "Ахаха! Ваше лицо! Великолепно! Ахаха!"
1003202-96 = "Сенсей такой растерянный! О-о, вот это зрелище!"
1003202-97 = ""
1003202-99 = ""
1003202-100 = ""
1003202-101 = "Та-дам! Это всего лишь таймер, Сенсей!"
1003202-102 = "[s] «Т-Таймер?»"
1003202-103 = "Ага! Это таймер встроенного нагревателя, который сохраняет бэнто тёплым! Я нашла его на Чёрном рынке!"
1003202-104 = "Эта штука появилась совсем недавно и уже очень популярна! Разве не весело?"
1003202-105 = "О, точно! А под ним..."
1003202-106 = ""
1003202-108 = ""
1003202-109 = "...то самое осэти, которое вы и ожидали увидеть!"
1003202-110 = "Правда, всё это из ближайшего супермаркета!"
1003202-111 = "[s] «Муцки...»"
1003202-112 = "Ахаха! Сенсей такой забавный! Не зря я встала пораньше, чтобы всё подготовить!"
1003202-113 = "Ну вот, новогодний подарок я вручила, так что пока-пока, Сенсей!"
1003202-114 = "Хи-хи! Давайте ещё как-нибудь повеселимся!"
1003202-115 = ""
1003202-117 = ""
1003202-120 = "(Я покорно попробовал осэти, которое подарила мне Муцки.)"
1003202-121 = "(Оно оказалось настолько вкусным, что я невольно вздохнул.)"
