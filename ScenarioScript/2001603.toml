[translation]
2001603-1 = "Соблазняющая фройляйн"
2001603-2 = ""
2001603-3 = ""
2001603-4 = ""
2001603-5 = ""
2001603-6 = "Когда Ироха подошла ближе, я почувствовал сладкий цветочный аромат."
2001603-7 = "Ироха заговорила со мной мягким голосом."
2001603-8 = "Сенсей... Почему бы вам не отдохнуть? Разве вы не знаете, что работать весь день вредно?"
2001603-9 = "Я просто забочусь о вас. Зачем делать то, от чего вам плохо?"
2001603-10 = "Подойдите ближе, Сенсей. Сядьте рядом со мной."
2001603-11 = "Рука Ирохи медленно потянулась ко мне. Расстояние между нами всё сокращалось, пока она подходила всё ближе."
2001603-12 = "[ns1] «Ироха. Прекрати.»\n[ns2] «У меня такой завал с работой, что уже опасно!»"
2001603-13 = "Ц."
2001603-14 = "Ц."
2001603-15 = "[s3] «Ты сейчас цокнула на меня?»\n[s4] «Что ты вообще здесь делаешь, Ироха?»"
2001603-16 = "Я изо всех сил выполняю свою миссию."
2001603-17 = "Я изо всех сил выполняю свою миссию."
2001603-18 = "Разве я не говорила, что моя миссия — заманить вас в Общество Пандемониума? Ненавижу повторяться."
2001603-19 = "[s5] «Я это уже знаю, но какое отношение к этому имеет весь этот бред?!»\n[s6] «Общество Пандемониума надеется что-то получить, просто издеваясь надо мной?!»"
2001603-20 = "О? Ну..."
2001603-21 = "О? Ну..."
2001603-22 = "Если вы так это видите."
2001603-23 = "[s] «Так говорят люди, которые не могут придумать оправдание!»"
2001603-24 = "Как грубо! Вы правда думаете, что я стала бы мешать вам без причины?"
2001603-25 = "Почему я вас отвлекаю? Причина проста."
2001603-26 = "Я пытаюсь отлынивать от работы под видом того, что заманиваю вас в Общество Пандемониума!"
2001603-27 = "[s] «Я так и знал, что ты что-то задумала!»"
2001603-28 = "Моим нынешним местом отдыха случайно оказался чужой офис, а единственное, что мне нужно делать, — весь день смотреть, как его хозяин работает."
2001603-29 = "Разве вы не знаете, что даже у ленивых диванных овощей есть гордость ленивых диванных овощей?"
2001603-30 = "Проще говоря, я пытаюсь прогулять работу, а вы заставляете меня смотреть, как работаете."
2001603-31 = "Вы меня обманули!"
2001603-32 = "[s] «Ты сама себя в это положение поставила!»"
2001603-33 = "Сенсей, иногда правду лучше не произносить вслух."
2001603-34 = "[s7] «Прости, что разрушу мечту, но это не работает.»\n[s8] «Это прозвучало далеко не так круто, как тебе кажется.»"
2001603-35 = "Хмф. То есть вы хотите, чтобы я добросовестно выполняла поручение Общества Пандемониума?"
2001603-36 = "Хмф. То есть вы хотите, чтобы я добросовестно выполняла поручение Общества Пандемониума?"
2001603-37 = "Ну, раз настаиваете, наверное, могу."
2001603-38 = ""
2001603-40 = ""
2001603-43 = ""
2001603-44 = "Сенсей... Почему вы так усердно работаете? В этом нет необходимости."
2001603-45 = "Вам ведь так тяжело, правда?"
2001603-46 = "Вам приходится выполнять все эти абсурдные поручения Генерального студсовета, а студенты постоянно требуют от вас всё больше."
2001603-47 = "Вся тяжёлая работа сваливается на вас, верно?"
2001603-48 = "Никто по-настоящему не признаёт всего, что вы делаете."
2001603-49 = "Разве вам не хочется хоть немного отдохнуть?"
2001603-50 = "Забудьте всю работу и стресс, отбросьте срочные дела..."
2001603-51 = "От одной мысли мне становится так хорошо! Сенсей... Почему бы нам с вами..."
2001603-52 = "Не прогулять работу?"
2001603-53 = "[s] «Ого... А ты хороша.»"
2001603-54 = "Нет смысла об этом думать. Просто..."
2001603-55 = "Просто..."
2001603-56 = "[s] «Просто...?»"
2001603-57 = "Это утомительно."
2001603-58 = ""
2001603-59 = "И неловко. На мгновение я даже задумалась, что вообще делаю."
2001603-60 = "Когда адреналин проходит, остаётся только боль реальности..."
2001603-61 = "К чёрту Общество Пандемониума... Я просто хочу уютно устроиться и весь день читать."
2001603-62 = "Что я вообще делаю здесь в такой прекрасный день?"
2001603-63 = "*вздыхает*"
2001603-64 = "Это ведь ваша вина, да?"
2001603-65 = "[s] «Это нечестно!»"
2001603-66 = "Я просто так от всего устала, Сенсей. Может, пойдём поедим? Я знаю хорошее место неподалёку."
2001603-67 = "Может, еда поднимет мне настроение... Пожалуйста?"
2001603-68 = "[s] «Ну, если ты так просишь...»"
2001603-69 = ""
2001603-71 = ""
2001603-77 = "[ns] «Где хочешь поесть, Ироха?»"
2001603-78 = "..."
2001603-79 = "Хи-хи, хи-хи-хи."
2001603-80 = "[s] «Ироха?»"
2001603-81 = "Попались, Сенсей."
2001603-82 = "Если вы идёте есть со мной, то технически прогуливаете работу, да?"
2001603-83 = "[s] «...О!»"
2001603-84 = "Успех."
2001603-85 = "Раз цель достигнута, пойдёмте ужинать, Сенсей. Теперь мы одинаковые. Два человека, прогулявшие работу."
2001603-86 = "[s] «Ладно, признаю. Ты меня здорово провела.»"
2001603-88 = "Ироха отвела меня в ресторан рядом с Шале, где мы вкусно поужинали, после чего она вернулась назад."
