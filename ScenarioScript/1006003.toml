[translation]
1006003-1 = "Как расслабиться"
1006003-2 = "Я нашёл Мэгу в мрачном углу какого-то переулка."
1006003-3 = "Мэгу нервно ёрзала и оглядывалась по сторонам."
1006003-4 = ""
1006003-6 = ""
1006003-7 = ""
1006003-8 = ""
1006003-9 = ""
1006003-10 = ""
1006003-11 = ""
1006003-12 = "[ns1] «...Мэгу? Ты в порядке?»\n[ns2] «Мэгу! Что случилось? Что не так?»"
1006003-13 = ""
1006003-14 = ""
1006003-16 = ""
1006003-17 = ""
1006003-19 = ""
1006003-20 = "Сенсей! Ты пришёл. Хорошо. Я ждала!"
1006003-21 = "А? Думаешь, я выгляжу серьёзной?"
1006003-22 = "Так и есть! Всё очень-очень серьёзно!"
1006003-23 = "А, хочешь знать, что происходит?"
1006003-24 = "Эм... Ну..."
1006003-25 = ""
1006003-27 = ""
1006003-28 = "..."
1006003-29 = "...Ничего! Вообще ничего не происходит! И так будет вечно!"
1006003-30 = ""
1006003-33 = "[ns3] «...?»\n[ns4] «Так серьёзная проблема в том... что ничего не происходит?»"
1006003-36 = "Точно! Я знала, что на тебя можно положиться, Сенсей!"
1006003-37 = "Ты сразу понял!"
1006003-38 = "[ns] «...»"
1006003-40 = "[ns5] «А. Понял.»\n[ns6] «(Я вообще ничего не понимаю.)»"
1006003-43 = "В общем, до этого «ничего» мы пытались построить горячий источник на месте, которое нашла президент."
1006003-44 = "Но стоило нам начать взрывные работы, как со всех сторон набежала целая куча войск. Даже больше, чем обычно!"
1006003-45 = "Я уже решила, что опять придётся драться, но президент велела нам разбежаться и спрятаться."
1006003-46 = "Так что... теперь я прячусь. Вот так."
1006003-47 = ""
1006003-49 = ""
1006003-50 = "А потом... А потом..."
1006003-51 = "[s] «И... что было дальше?»"
1006003-52 = "Я осталась... прятаться вот так. Мне сказали не попадаться, поэтому..."
1006003-53 = "То есть я должна просто сидеть здесь и не двигаться... Но... это так тяжело! Правда тяжело!"
1006003-54 = ""
1006003-57 = "[ns] «...»"
1006003-58 = "Сенсей... Как вообще можно сидеть на месте? Я совсем не понимаю!"
1006003-59 = "[s7] «...Эм... То есть тебе просто не сидится на месте.»\n[s8] «Тебе тяжело, потому что у тебя слишком много энергии.»"
1006003-62 = "Хм-м... Правда?"
1006003-63 = "Наверное!"
1006003-64 = "Время тянется так медленно! Я будто в ловушке!"
1006003-65 = "Это даже хуже, чем когда нас иногда запирает Дисциплинарный комитет! Там хотя бы было чем заняться!"
1006003-66 = "И ещё рядом были другие участницы клуба."
1006003-67 = "А сейчас! Сейчас...!"
1006003-68 = ""
1006003-70 = ""
1006003-71 = "У-у-у-у-у!!"
1006003-72 = "...Что?"
1006003-73 = "Сенсей? Что ты сказал?"
1006003-74 = "...А, это?"
1006003-75 = ""
1006003-77 = ""
1006003-78 = "Эм, это просто украшение, которое мы хотели поставить у горячего источника, когда закончим..."
1006003-79 = "Как там оно называлось? Кэн... дама?"
1006003-80 = "Кажется, она называла это именно так..."
1006003-81 = "Я в этом не разбираюсь! Просто носила его с собой, чтобы потом использовать, когда закончим."
1006003-82 = "А почему спрашиваешь?"
1006003-83 = "Сенсей, ты что-то об этом знаешь?"
1006003-84 = "Что? ...А?"
1006003-85 = "Это игрушка? Я не знала! А как ей пользоваться?"
1006003-86 = ""
1006003-88 = ""
1006003-89 = ""
1006003-91 = "[ns9] Взять кэндаму.\n[ns10] «Хочешь, покажу?»"
1006003-94 = "О, было бы здорово! Покажи, пожалуйста!"
1006003-103 = ""
1006003-104 = "...!"
1006003-105 = ""
1006003-107 = ""
1006003-108 = "Ух ты! Ух ты, ух ты! Что это?!"
1006003-109 = "Потрясающе! Как ты это делаешь?"
1006003-110 = "Можно я попробую? Сенсей, я тоже хочу! Дай посмотреть!"
1006003-111 = "[s11] «Ну, вообще-то она твоя...»\n[s12] Вернуть кэндаму Мэгу."
1006003-112 = ""
1006003-113 = ""
1006003-118 = "Ладно, попробую!"
1006003-119 = ""
1006003-121 = ""
1006003-122 = ""
1006003-123 = ""
1006003-126 = ""
1006003-127 = "...Уф. Не получается... Почему у меня не выходит?"
1006003-128 = ""
1006003-130 = ""
1006003-131 = ""
1006003-132 = "Эй, Сенсей, почему у тебя получилось, а у меня нет? Тут есть какой-то секрет?"
1006003-133 = "Думаешь, если потренироваться, я стану лучше?"
1006003-134 = "Хм-м... Ну, раз ты так говоришь, Сенсей, я тебе поверю."
1006003-135 = "Хорошо!"
1006003-136 = "Смотри, Сенсей! Я обязательно разберусь!"
1006003-137 = "Дай ещё раз попробую!"
1006003-139 = "Следующие несколько часов Мэгу тренировалась, пока наконец не освоила кэндаму."
1006003-140 = "За это время её телефон звонил несколько раз, но Мэгу вообще не обращала на него внимания."
