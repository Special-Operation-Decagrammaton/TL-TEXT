83306105600-6 = "Вот. Я нашла твой талон."
83306105600-7 = "Правда?! Спасибо!"
83306105600-8 = "Я рада за тебя, Джунко."
83306105600-9 = "Спасибо за помощь, Хина."
83306105600-10 = "Хи-хи... Необычный опыт — хоть раз получить помощь от тебя."
83306105600-12 = "Да, для меня это тоже было необычно."
83306105600-13 = "Понятно, значит, это тоже разновидность дружбы между де—"
83306105600-14 = "Ладно, я голодная! Талоны у нас есть, так что налетаем!"
83306105600-15 = ""
83306105600-17 = ""
83306105600-18 = ""
83306105600-19 = "А! Изуми! Подожди меня!"
