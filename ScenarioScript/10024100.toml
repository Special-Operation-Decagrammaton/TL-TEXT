[translation]
10024100-1 = "Эпилог;Полный дом, счастливая семья"
10024100-2 = "Так дело о десятитысячелетнем женьшене подошло к концу."
10024100-3 = ""
10024100-9 = ""
10024100-10 = "Ч-что это вообще за блюдо...?"
10024100-11 = "Суп в стиле Красной Зимы с мясом на виноградном пару в стиле Вайлдхант! Попробуйте!"
10024100-12 = "Суп не должен быть розовым... Это вообще съедобно...?"
10024100-13 = "Не обращайте внимания на цвет! Он сладкий, кислый и пикантный. А мясо очень нежное!"
10024100-14 = ""
10024100-16 = ""
10024100-18 = "Эм, не уверена... насчёт всей этой иностранной еды..."
10024100-19 = "Да просто попробуй уже. А потом обязательно попробуй эти десерты в стиле Тринити!"
10024100-20 = "Ты знала, что молоко можно смешивать с чаем? Очень вкусно!"
10024100-22 = "Ч-что за безумие! Зачем добавлять молоко в чай?"
10024100-24 = "Как привыкнешь, назад уже не захочется."
10024100-26 = ""
10024100-33 = "Все, Генрюмон и Променад Чёрной Черепахи объединились, чтобы сегодня устроить для нас особенный праздник."
10024100-34 = "Ешьте и играйте сколько хотите, но не забывайте говорить потише."
10024100-35 = "Да, госпожа Шун!"
10024100-36 = "Не забудьте поблагодарить их после еды!"
10024100-37 = "И не забудьте почистить зубы, когда вернётесь домой!"
10024100-38 = "Ты тоже, Кокона! Почисти зубы!"
10024100-39 = "Не «Кокона». А «Инструктор Кокона»!"
10024100-40 = "Кокона, присмотри, пожалуйста, за детьми минутку."
10024100-41 = "О? Ты куда-то идёшь?"
10024100-42 = "Хи-хи-хи... Я просто проведу маленькую «встречу» с Сенсеем..."
10024100-43 = ""
10024100-45 = ""
10024100-46 = "Что? Но я тоже хочу...! Н-но дети..."
10024100-47 = "Я это запомню, Шун! И отомщу!"
10024100-49 = ""
10024100-52 = "Здесь так шумно... Хочу обратно в Общество восточной алхимии..."
10024100-53 = "Но и всю эту вкусную еду пропускать не хочется... Что делать...?"
10024100-54 = "О, придумала! Я гений!"
10024100-55 = "Создам эликсир, который меня клонирует!"
10024100-56 = "Одна копия будет пробовать всю еду, а вторая вернётся к исследованиям!"
10024100-57 = "Погоди... Всё моё оборудование в лаборатории, значит, чтобы сделать эликсир, мне придётся туда вернуться..."
10024100-58 = "Что делать?!"
10024100-59 = "Но это... так вкусно... Ням-ням-ням..."
10024100-60 = ""
10024100-62 = ""
10024100-63 = ""
10024100-65 = ""
10024100-68 = ""
10024100-69 = "Неплохой праздник, госпожа Кисаки."
10024100-70 = "Всё так, как вы надеялись?"
10024100-71 = "Важно только то, что в Шаньхайцзине царит гармония."
10024100-72 = "Какой мрачный ответ! Но улыбку от меня не спрячешь. А вы что думаете, Сенсей?"
10024100-73 = "[s] «Все отлично проводят время. Я бы назвал это успехом.»"
10024100-74 = ""
10024100-76 = ""
10024100-77 = "Правда?"
10024100-78 = "Может, дело во всей этой странной еде..."
10024100-79 = "Замороженное молоко, сгущёнка, виноград и паста из красной фасоли... Интересное сочетание."
10024100-81 = "Хотите ещё порцию, госпожа Кисаки?"
10024100-82 = "Нет, спасибо. Я хочу попробовать и остальное. Такая возможность выпадает нечасто."
10024100-83 = "Ты всегда клюёшь еду как птичка. Рада видеть, что хоть раз нормально ешь!"
10024100-84 = "...Не обращайся со мной как с младшей сестрой. Мы уже это обсуждали."
10024100-85 = "Ну же. Мы знакомы уже достаточно давно! Вот, попробуй этот рисовый пирожок с клубничным кремом!"
10024100-87 = "Или хочешь жареный сырный шарик? Что-нибудь солёное будет хорошей сменой вкуса..."
10024100-88 = "Интересно... Я попробую всё."
10024100-90 = "Одного праздника было недостаточно, чтобы полностью убрать напряжение между двумя клубами..."
10024100-91 = "Но было чудесно видеть, как хотя бы на один день они отложили разногласия и праздновали вместе."
10024100-92 = "Дракон и Черепаха: вместе ради лучшего будущего"
