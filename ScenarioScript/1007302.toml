[translation]
1007302-1 = "Что-то не так"
1007302-4 = "Я довольно долго бродил вокруг, пытаясь найти Уй."
1007302-5 = ""
1007302-11 = "Наконец я заметил её в дальнем углу пляжа, устроившуюся между валунами."
1007302-12 = ""
1007302-14 = ""
1007302-15 = "[ns1] «Вот ты где.»\n[ns2] «Всё в порядке, Уй?»"
1007302-16 = ""
1007302-17 = ""
1007302-19 = ""
1007302-20 = "Ах."
1007302-21 = "Сенсей? Почему вы здесь? Хотя нет, сначала другое..."
1007302-22 = "КАК вы вообще меня нашли? Я думала, что здесь совсем вне сети..."
1007302-23 = "...Простите?"
1007302-24 = "Вы просто продолжали меня искать...? К-Как долго?"
1007302-25 = ""
1007302-27 = ""
1007302-29 = "С-С-С тех сообщений в MomoTalk?!"
1007302-30 = "Не понимаю. Зачем вам было делать такое?"
1007302-31 = "Я же уверила вас, что всё нормально... Ну, что если проблема и есть, то только во мне..."
1007302-32 = "Вы не можете бросаться решать каждую проблему, Сенсей. И что мне теперь делать?"
1007302-33 = "[s3] «Я не мог просто оставить тебя одну.»\n[s4] «Я не делаю того, чего сам не хочу, Уй.»"
1007302-36 = "Д-Даже так... Эм..."
1007302-37 = "О... Почему я здесь?"
1007302-38 = "Ну..."
1007302-39 = "Если произнести это вслух, звучит ещё более нелепо..."
1007302-40 = ""
1007302-42 = ""
1007302-43 = "*вздыхает*"
1007302-44 = ""
1007302-46 = ""
1007302-47 = "Как лучше объяснить? Купальники, пляжные игры... Я просто не вписываюсь в такую обстановку."
1007302-48 = "Поэтому мне было неловко находиться здесь. Вот и всё. Простите, что причина такая банальная."
1007302-49 = "Я очевидно не такая жизнерадостная и обаятельная, как остальные, и на это лицо никто не станет смотреть второй раз..."
1007302-50 = "Я достаточно хорошо себя осознаю. Знаю, что обо мне говорят другие и как меняется атмосфера в комнате, когда я вхожу."
1007302-51 = "Мне лучше в библиотеке или хотя бы где-нибудь в помещении... Там мне было бы комфортнее... и без этого купальника..."
1007302-52 = "Как выразить это словами? Я чувствую... Ух."
1007302-53 = "Просто всё это слишком подавляет. Я не знаю, как вести себя в таком месте или в такой ситуации."
1007302-54 = "...О."
1007302-55 = "Подождите. Пожалуйста, не начинайте меня утешать."
1007302-56 = "«Ты такая милая в этом купальнике» или какой-нибудь похожий комплимент, да? Но всё нормально. Правда."
1007302-57 = "Я не искала человека, который будет говорить мне приятные пустые слова... Я не питаю иллюзий насчёт реальности."
1007302-58 = "Комплименты, в которые я не могу поверить, только заставят меня чувствовать себя хуже."
1007302-59 = "...Да..."
1007302-60 = "...Что?"
1007302-61 = "Что ты имеешь в виду? Что ты тогда собиралась сказать?"
1007302-62 = "[s5] «Разве это место не для того, чтобы люди могли здесь отдохнуть?»\n[s6] «Тебе не кажется, что ты слишком много внимания уделяешь самой себе?»"
1007302-65 = "Что... Что ты имеешь в виду?"
1007302-66 = "Хм... Погоди, дай мне секунду подумать..."
1007302-67 = ""
1007302-69 = ""
1007302-70 = "Эм..."
1007302-71 = "Я... думаю... да?"
1007302-72 = "Если посмотреть с этой стороны, здесь гораздо меньше людей, чем в Тринити."
1007302-73 = "Посетители здесь появляются редко..."
1007302-74 = "Не могу сказать, что эти редкие посетители меня прямо радуют, но увидеть одного-двух людей поблизости — не самое худшее."
1007302-75 = "[s7] «Наверное, многие здесь чувствуют то же самое.»\n[s8] «Именно поэтому люди и забираются в такие далёкие места.»"
1007302-78 = "Понятно... Мы все оказались здесь из-за похожих чувств..."
1007302-79 = "Кажется, я поняла."
1007302-82 = "Люди, которые ищут уединённые места, наверное, все просто пытаются... ну, избегать людей."
1007302-83 = "Так что прятаться здесь не так уж отличается от того, как я прячусь в библиотеке."
1007302-86 = "Это вполне... правдоподобно."
1007302-87 = "Но... могу ли я так делать, даже в такой одежде?"
1007302-88 = "[s9] «Неплохая смена обстановки, правда?»\n[s10] «Почему бы не считать это своего рода... побегом?»"
1007302-91 = "Хм..."
1007302-92 = "Словно побег... от моей обычной себя в Тринити..."
1007302-93 = "В этом есть логика. В конце концов, у того, кто каждый день ходит в таком виде, наверняка не все синапсы работают как надо."
1007302-94 = "[s11] «Ох. Эм. Хм.»\n[s12] «Н-Ну...»"
1007302-97 = "...Я шучу."
1007302-98 = "Я вовсе не в плохом смысле, но вы очень убедительны, Сенсей."
1007302-99 = "Разговор с вами и правда помогает мне почувствовать себя лучше. Ваши слова всегда звучат искренне."
1007302-100 = "...Я серьёзно."
1007302-101 = "Пустыми словами человека не убедишь."
1007302-102 = ""
1007302-104 = ""
1007302-105 = "Люди обычно приходят ко мне только потому, что им что-то нужно, так что я к этому привыкла. Пустые комплименты, любезности просто из вежливости."
1007302-106 = "Когда это повторяется снова и снова, начинаешь замечать закономерность, и разговоры кажутся пресными и бессмысленными."
1007302-107 = "Именно тогда я начала отдаляться от людей. Все мои отношения были поверхностными."
1007302-108 = "Кажется, когда я поняла, кем стала, возвращаться назад было уже поздно."
1007302-109 = "Я по-настоящему привыкла к одиночеству и разучилась общаться. Я слишком близко принимаю критику к сердцу и стараюсь избегать людей, насколько могу."
1007302-110 = "На самом деле мне даже нравится, что у меня есть младшие, которые говорят всё прямо и всегда готовы меня отчитывать... Я правда очень ими дорожу."
1007302-111 = "...Довольно жалко звучит, да? Уныло. Но такая уж я."
1007302-112 = "И всё же мне никак не удаётся избавиться от той настойчивой кучки людей, которые находят меня, где бы я ни пряталась."
1007302-113 = "Вы все такие странные..."
1007302-114 = "Почему-то мои младшие относятся ко мне как к настоящей старшей, на которую можно положиться, а некоторые даже идут за мной в такую даль, чтобы помочь с моими проблемами."
1007302-115 = "...Включая вас, Сенсей. Вообще-то, вы, наверное, хуже всех."
1007302-116 = "[s13] «Ах! Ну, это само собой!»\n[s14] «Рыбак рыбака видит издалека?»"
1007302-117 = ""
1007302-118 = ""
1007302-120 = ""
1007302-121 = "...Хе..."
1007302-122 = "...Хи-хи... Ох уж..."
1007302-123 = "...Да."
1007302-124 = "...Да. На этом и остановимся."
