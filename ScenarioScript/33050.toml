[translation]
33050-1 = "Episódio 5;Cerimônia de Assinatura do Tratado do Éden (1)"
33050-4 = "Olá a todos que estão assistindo a este vídeo agora!"
33050-5 = "Sou Kawaru Shinon, a repórter idol do Clube de Jornalismo da Escola Kronos!"
33050-6 = "Hoje finalmente será firmado o \"Tratado do Éden\" entre a Academia Gehenna e a Escola Geral Trinity. E estamos aqui, direto do local da cerimônia de assinatura!"
33050-7 = "Neste momento, estou em frente à \"Antiga Catedral da Comunhão\", mas..."
33050-17 = "O local já está fervendo e o clima é de pura tensão, com nenhum dos lados disposto a ceder!"
33050-18 = "A atmosfera é tão pesada que, se alguém der um passo em falso, este lugar pode virar uma verdadeira catástrofe! Vocês conseguem sentir essa tensão no ar?!"
33050-20 = "Digamos que são como cão e gato, ou inimigos mortais no mesmo barco! É a velha relação entre Trinity e Gehenna que todos nós conhecemos tão bem!"
33050-21 = "...Hã? Não falar besteira? Ir direto ao ponto? Fazer o quê, né! Antes que as broncas vindas de trás das câmeras virem socos hoje também, vamos avançar rapidinho com a matéria!"
33050-23 = "Que presença intimidadora incrível! Esta é a situação aqui na Antiga Catedral, o palco da cerimônia de assinatura!"
33050-25 = "Quanto ao motivo de \"por que este local foi escolhido\", segundo informações de certas fontes, parece que foi uma \"sugestão da cúpula de Gehenna\"! Essa é uma surpresa!"
33050-26 = "Seria porque este é o local histórico onde, no passado, foi realizado o \"Primeiro Concílio\" de Trinity?"
33050-27 = "Não, não, parece que não é nada disso. Ao que tudo indica, o motivo foi... \"Como é um evento tão grandioso, é melhor que seja em um lugar grande e imponente\"."
33050-28 = "Em resumo: \"Um lugar gigante é muito mais maneiro, pô!\", disseram! Entendo, bem fácil de compreender!"
33050-29 = "Mudando um pouco de assunto, dizem que o \"Primeiro Concílio\" que mencionei agora há pouco, assim como os preceitos estabelecidos nele, foram protegidos na época por um grupo poderoso chamado \"Conselho dos Santos de Justina\"."
33050-30 = "Não sabemos se há alguma relação com isso, mas foi confirmado que a \"Irmandade\" de Trinity também está participando da cerimônia de assinatura de hoje!"
33050-31 = "A \"Irmandade\", que por tanto tempo havia se abstido voluntariamente de atividades externas... Por que será que elas resolveram aparecer justo agora?"
33050-32 = "Seria uma forma de se afirmarem como as sucessoras daquele \"Conselho dos Santos de Justina\", uma organização que hoje já desapareceu nas páginas da história...?"
33050-33 = "Pois bem, qual será o rumo dessa tempestade política que sopra sobre a Escola Geral Trinity...? Hã? Chega de papo difícil? A audiência e os acessos estão caindo?"
33050-34 = "Política não é mole, mas a pressão da redação também não dá trégua! No entanto, nós temos a liberdade de expressão—"
33050-38 = "No momento, estamos enfrentando instabilidades na imagem devido a problemas na conexão. Por favor, aguardem um instante."
33050-40 = "...Uma vez que o Tratado do Éden for firmado, as lideranças de ambas as escolas concordarão, aqui na Antiga Catedral, com a criação da \"Organização do Tratado do Éden\"!"
33050-42 = "Com isso, Trinity e Gehenna... essas duas escolas que foram inimigas por tantos anos terão a obrigação de resolver juntas quaisquer conflitos que surjam entre elas!"
33050-43 = "E por ser firmado nesta Antiga Catedral, espera-se que cumpram esse dever com sinceridade, sob a proteção dos sagrados preceitos!"
33050-44 = "Meio complicado, né? Vamos simplificar! Essas duas escolas gigantescas de Kivotos, famosas por viverem às turras até hoje, finalmente estão prestes a dar as mãos pela paz!"
33050-45 = "Bom, e em um momento tão importante quanto este, o que será que o nosso Conselho Estudantil Geral está fazendo?"
33050-46 = "Confiram agora como foi a coletiva de imprensa de emergência realizada ontem pelo Conselho Estudantil Geral!"
33050-48 = "...Com isso, encerramos a coletiva."
33050-51 = "Espere um momento, Administradora! Isso quer dizer que o paradeiro da Presidente do Conselho Estudantil Geral ainda é desconhecido?"
33050-52 = "Em resumo, sim."
33050-53 = "Mas nem precisava resumir para significar exatamente isso?!"
33050-55 = "A opinião pública tem sido cada vez mais severa quanto à competência do Conselho Estudantil Geral. O que tem a dizer sobre esse ponto?"
33050-56 = "Bom, fazer o quê, né?"
33050-57 = "Momoka-chan...!"
33050-58 = "Absteremo-nos de comentar sobre informações não confirmadas neste momento."
33050-59 = "Como estão as medidas contra a gentrificação que vem ocorrendo em cada distrito autônomo?"
33050-60 = "A decisão de fechar a \"Academia Especial SRT\" tem alguma relação com o tumulto anterior na Torre Sanctum? Há informações de que parte da torre foi destruída pelo fogo, procede?"
33050-61 = "Qual é a posição do Conselho a respeito do \"Tratado do Éden\" entre Trinity e Gehenna?"
33050-62 = "Com relação aos incidentes ocorridos nos distritos autônomos de cada escola, basicamente deixamos a resposta a cargo das respectivas instituições. Consideramos que uma intervenção imprudente do Conselho Estudantil Geral seria, pelo contrário, uma irresponsabilidade."
33050-63 = "É, até porque não temos nem tempo nem pessoal pra intervir."
33050-64 = "Momoka-chan...!"
33050-65 = "Sendo assim, damos por encerrada a coletiva por aqui."
33050-70 = "Pois é! Em outras palavras, quer dizer que elas \"não estão muito interessadas\"!"
33050-71 = "Como esperado do Conselho Estudantil Geral! Tamanha despreocupação parece atravessar até os céus!"
33050-72 = "Agora, a seguir, vamos falar sobre as principais figuras de cada escola que participarão deste Tratado do Éden—"
33050-75 = "...Que barulheira."
33050-76 = "Afinal, hoje é o dia em que aquele Tratado do Éden finalmente será assinado! A escola até decretou feriado especial, e as ruas estão lotadas de gente!"
33050-77 = "O pessoal da transmissão de Kronos também estava por aqui agora há pouco, parece até clima de festival!"
33050-78 = "Pois é. Já que está essa festa toda, seria ótimo se o Sensei pudesse estar aqui com a gente... mas parece que ele está bem ocupado por causa do tratado."
33050-79 = "...Tá, mas por que eu fui chamada pra cá mesmo?"
33050-80 = "Ora, é claro que é porque ainda somos companheiras do Clube de Aulas de Reforço, Koharu-chan♡"
33050-81 = "Na prática, isso também conta como a nossa festa de formatura do Clube de Aulas de Reforço, então será que você não pode fazer companhia pra gente mais um pouquinho?"
33050-82 = "E-Eu não disse que não queria estar aqui! A-Afinal, todas nós nos esforçamos juntas e superamos tudo aquilo..."
33050-83 = "...Além do mais, não é como se tudo tivesse acabado por aqui. Eu vou continuar no Comitê de Justiça, então se vocês derem uma passada lá na sala de controle de itens confiscados, quase sempre..."
33050-84 = "Sim. Vou lá te visitar bem em breve, Koharu."
33050-85 = "Nesse caso, também farei uma visita qualquer dia desses. Afinal, preciso pedir que me devolvam o \"Kama Sutra\" que confiscaram de mim outro dia."
33050-86 = "Kama...? O que é isso?"
33050-87 = "É uma obra da literatura clássica. Eu estava lendo bem tranquila perto da fonte, mas por algum motivo o confiscaram de mim de repente..."
33050-88 = "Literatura clássica? Hmmm..."
33050-89 = "...Espera aí, até parece! Só de ser você lendo, com certeza é coisa pervertida! Coisas pervertidas são proibidas! Incineração!!"
33050-90 = "Hmmm, confiscar até vai, mas como eu peguei emprestado na Biblioteca Antiga, seria um problema se fosse queimado..."
33050-94 = "Ué, Azusa-chan. Por acaso você anda carregando essa pelúcia com você o tempo todo?"
33050-98 = "Sim. É algo muito importante pra mim, então tenho que levar sempre comigo."
33050-99 = "T-Tanto assim...? Não, quer dizer, fico muito feliz! O universo dos Momo Friends é enorme, então, já que gostou, que tal colecionar vários outros também? Na próxima, vamos juntas a uma loja..."
33050-100 = "Sim, vou adorar."
33050-101 = "Sim, vamos com certeza! Ainda mais agora que o anime de aventuras do Peroro-sama está prestes a estrear!"
33050-102 = "...Anime?"
33050-103 = "Isso mesmo! Ouvi dizer que o final, onde ele une forças com os amigos para derrotar o mal, supera as dificuldades junto com eles e todo mundo termina sorrindo, é super emocionante...!"
33050-104 = "Isso aí já não é um baita spoiler?"
33050-105 = "Eh, ah?! P-Por favor, esqueçam o que eu acabei de falar?!"
33050-106 = "Fufu, você gosta desse tipo de final feliz, Hifumi-chan?"
33050-107 = "S-Sim, gosto. Será que é um gosto comum demais...?"
33050-108 = "...Não digo que seja ruim, mas não é meio clichê? Essa coisa de no fim todo mundo ficar de bem em um grande final feliz."
33050-109 = "...Eu também não entendo muito bem essa coisa de final feliz. Por mais que a gente se esforce, o mundo não muda tão facilmente, e as feridas não desaparecem como se nunca tivessem existido. Porque essa é a verdade deste mundo."
33050-110 = "Auu... Vocês têm um gosto meio sombrio, né..."
33050-111 = "Eu acho esse tipo de coisa meio triste demais... No fim das contas, prefiro um final feliz onde todo mundo possa ser feliz junto."
33050-112 = "Ora, gosto cada um tem o seu, não é mesmo? Aliás, eu adoro aquele tipo de final em que a heroína fica com o olhar derretido, babando enquanto implora por perdão♡"
33050-113 = "V-Você é idiota por acaso?! Que tipo de final é esse?!"
33050-114 = "Hmmm, acho que tem vários assim por aí..."
33050-115 = "...Ainda assim, se é algo de que a Hifumi gosta, não acho que seja ruim. Acho que isso também tem o seu valor."
33050-119 = "Azusa-chaaaan!"
33050-125 = "Ora, ora♡"
33050-126 = "Hyaaaa...?!"
33050-128 = "Quando tudo isso acabar..."
33050-129 = "Quer dizer, quando a cerimônia de assinatura de hoje terminar, eu gostaria de conversar com calma com o Sensei."
33050-130 = "...Sim, eu também."
33050-131 = "...Bem que o Sensei podia estar aqui com a gente."
33050-132 = "Pois é... Será que o Sensei está lá na Antiga Catedral agora? Ele deve estar bem ocupado, né...?"
33050-134 = "Antiga Catedral - Salão"
33050-136 = "[ns] \"...Que tédio.\""
33050-139 = "Próximo;Cerimônia de Assinatura do Tratado do Éden (2)"
