[translation]
33050-1 = "Эпизод 5;Церемония подписания Эдемского договора, часть 1"
33050-4 = "Привет всем нашим зрителям у экранов!"
33050-5 = "С вами звёздный репортёр Школы журналистики «Кронос» — Кавару Шинон!"
33050-6 = "Мы в прямом эфире с места долгожданной церемонии подписания Эдемского договора!"
33050-7 = "Именно так — из Собора объединения, где академия Геенна и Общая школа Тринити должны официально подписать договор."
33050-17 = "Напряжение в воздухе можно резать ножом! Ни одна сторона не отступает в этой напряжённой битве нервов!"
33050-18 = "Кажется, один неверный шаг может привести к катастрофе! Чувствуете, как воздух искрит?"
33050-20 = "Исторически эти две академии ладят как кошка с собакой — как змея с мангустом! Даже сейчас давнее соперничество кипит. Сможет ли договор удержать его от взрыва?"
33050-21 = "Что? Хватит болтать и уже переходи к следующей сцене? Ладно, переходим к следующему кадру, пока продюсер совсем не разозлился!"
33050-23 = "Какой внушительный вид! Позже сегодня церемония подписания пройдёт именно в этом историческом соборе!"
33050-25 = "Почему именно здесь? По нашим источникам, это место предложило высшее руководство Геенны!"
33050-26 = "Может быть, потому что много лет назад здесь же проходил Первый совет Тринити?"
33050-27 = "По словам нашего источника — нет! Геенна просто хотела, чтобы событие такого масштаба прошло в столь же внушительном месте!"
33050-28 = "Вот и всё объяснение, и место действительно подходит. Мне нравится!"
33050-29 = "Кстати о Первом совете: знали ли вы, что принятые там заповеди поддерживала могущественная организация под названием Совет Святой Юстины?"
33050-30 = "Может ли это быть связано с тем, что на сегодняшней церемонии присутствует Сестринство Тринити?"
33050-31 = "Сестринство долго воздерживалось от участия в политике. Что заставило их сейчас выйти из тени?"
33050-32 = "Неужели они позиционируют себя преемниками Совета Святой Юстины — организации, давно растворившейся в истории?"
33050-33 = "И что станет с политическим штормом, захлестнувшим Общую школу Тринити...?! Что? Говорить короче и проще, иначе потеряем зрителей?"
33050-34 = "Ну, мой продюсер уж точно не умеет воздерживаться от сокращения моего эфирного времени! Вот тебе и свобода прессы!"
33050-35 = ""
33050-38 = "Минутку, дорогие зрители. Похоже, у нас технические неполадки."
33050-40 = "После подписания Эдемского договора высшее руководство двух академий прямо в соборе согласует создание Организации Эдемского договора!"
33050-42 = "Тогда две академии, которые всегда враждовали, официально начнут работать вместе, чтобы урегулировать свои разногласия!"
33050-43 = "Подписание в соборе показывает, что обе стороны намерены соблюдать договор и, возможно, даже священные заповеди!"
33050-44 = "Проще говоря, это момент, когда две крупнейшие и наиболее влиятельные академии Кивотоса наконец протянут друг другу руки в знак мира!"
33050-45 = "И возникает вопрос: какое отношение к столь знаменательному событию имеет Генеральный студенческий совет?"
33050-46 = "Давайте вспомним их пресс-конференцию, которая состоялась буквально вчера!"
33050-48 = "На этом мы завершим выступление и ответим на вопросы."
33050-49 = ""
33050-51 = "Простите, главный сотрудник! Это значит, что председатель Генерального студенческого совета всё ещё пропала?"
33050-52 = "Коротко говоря — да."
33050-53 = "Объяснитесь! Почему? Где она?!"
33050-55 = "Общественная поддержка Генерального студенческого совета стремительно падает. Что вы об этом думаете?"
33050-56 = "*жуёт* Ну, я их не виню."
33050-57 = "Момока..."
33050-58 = "Мы не будем комментировать мнение широкой общественности."
33050-59 = "Как вы планируете замедлить джентрификацию, происходящую в нескольких районах?"
33050-60 = "Есть ли связь между решением закрыть академию SRT и недавним бунтом у башни Санктум? Ходят слухи, что часть башни была разрушена!"
33050-61 = "Что вы думаете о договоре между Тринити и Геенной?"
33050-62 = "Академии, как и прежде, сами отвечают за управление своими районами. Генеральный студенческий совет продолжит придерживаться политики невмешательства в такие вопросы."
33050-63 = "*жуёт* Ага, потому что у нас нет ни времени, ни людей, чтобы лезть ещё и туда."
33050-64 = "Момока, тише..."
33050-65 = "Вопросов больше не принимаем."
33050-66 = ""
33050-70 = "Вот и всё! Генеральный студенческий совет вообще не собирается вмешиваться в договор!"
33050-71 = "Какая беспристрастность! Как всегда вне политики!"
33050-72 = "Далее рассмотрим ключевых представителей каждой академии, присутствующих на церемонии подписания."
33050-75 = "Здесь довольно людно."
33050-76 = "Конечно! Сегодня церемония подписания, а занятия отменили. Все празднуют!"
33050-77 = "«Кронос» освещает все гуляния. Такое ощущение, будто мы посреди фестиваля."
33050-78 = "И правда. Жаль только, Сенсей не может праздновать с нами — он занят Эдемским договором."
33050-79 = "Уф. А меня-то зачем сюда притащили?"
33050-80 = "Что ты такое говоришь? Мы ведь всё ещё одноклубницы."
33050-81 = "Это должна быть прощальная вечеринка Клуба дополнительных занятий. Без тебя всё было бы не то."
33050-82 = "Н-Ну естественно! Без меня вы бы со всем этим не справились, да и я тоже старалась, между прочим..."
33050-83 = "В общем, я же говорила: можете приходить ко мне в Отряд правосудия когда захотите. Обычно я нахожусь в комнате хранения конфискованных вещей..."
33050-84 = "Я обязательно навещу тебя, Кохару."
33050-85 = "Конечно. Я скоро зайду забрать свою конфискованную «Камасутру»."
33050-86 = "Кама... что? Что это?"
33050-87 = "О, просто скучное классическое произведение. Мне нравится читать его у фонтана — успокаивает, но почему-то его конфисковали."
33050-88 = "Почему классическую литературу вообще запрещать?"
33050-89 = "Стоп, нет! Если ЭТО читала ТЫ, значит, там точно что-то непристойное! Сжечь! Сжечь к чертям!"
33050-90 = "Но я взяла её в библиотеке... Если сожжёшь, уничтожишь школьную собственность."
33050-91 = ""
33050-93 = ""
33050-94 = "О, Азуса. Ты всё это время носишь с собой плюшевого доктора Пероро?"
33050-95 = ""
33050-98 = "Да, он мне очень дорог. Конечно, я беру его с собой повсюду."
33050-99 = "Э-Это очень мило, но он не обязан быть твоей единственной игрушкой. Во вселенной Momo Friends полно других милых персонажей, которых можно собирать."
33050-100 = "Верно. Это может быть неплохо."
33050-101 = "Кстати! Недавно вышла новая OVA аниме про Пероро!"
33050-102 = "Ани... ме?"
33050-103 = "Говорят, она очень вдохновляющая. Особенно трогательная сцена, где все друзья объединяются, чтобы победить злодея."
33050-104 = "Спойлеры..."
33050-105 = "А-а-а! Прости! Забудь всё, что я только что сказала!"
33050-106 = "Значит, тебе нравятся истории со счастливым концом, Хифуми?"
33050-107 = "Н-Ну да, наверное. Это звучит скучно?"
33050-108 = "Не то чтобы они плохие — просто немного клишированные. Вспомни, сколько историй ты видела, где все потом жили долго и счастливо."
33050-109 = "Я тоже считаю счастливые концовки чистой выдумкой. Как бы сильно ни старался, мир не меняется так быстро. Такова реальность."
33050-110 = "З-Значит, вы предпочитаете более взрослые истории..."
33050-111 = "Похоже, тогда и я немного банальная. Наверное, у меня слабость к концовкам, где все всё ещё могут смеяться и улыбаться."
33050-112 = "Ну, у всех свои вкусы. Моя любимая концовка — когда героиня бездумно пускает слюни и умоляет о прощении. ♥"
33050-113 = "Какого чёрта ты вообще несёшь?! Что это за концовка такая?!"
33050-114 = "Ты то-о-очно не знаешь?"
33050-115 = "Меня не смущает, что тебе нравятся счастливые концовки, Хифуми. Если они нравятся тебе, значит, нравятся и мне."
33050-116 = ""
33050-118 = ""
33050-119 = "*всхлип* Азуса!"
33050-120 = ""
33050-122 = ""
33050-125 = "Ну надо же!"
33050-126 = "...!"
33050-128 = "Я тут кое о чём думала..."
33050-129 = "Хочу, чтобы после церемонии подписания мы все встретились с Сенсеем и немного расслабились."
33050-130 = "Было бы здорово. Я уже давно не разговаривала с Сенсеем просто так."
33050-131 = "Да. Всё равно жаль, что сегодня он не смог к нам присоединиться."
33050-132 = "Сейчас он уже должен быть у собора. Представляю, какой там сегодня хаос."
33050-134 = "Центральный зал собора"
33050-136 = "[ns] «*зевает* Боже, как скучно.»"
33050-139 = "Следующий эпизод;Церемония подписания Эдемского договора, часть 2"
