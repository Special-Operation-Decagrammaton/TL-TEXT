[translation]
103080-1 = "Эпизод 8; Оперативный инструктаж"
103080-2 = ""
103080-3 = ""
103080-5 = ""
103080-6 = ""
103080-8 = ""
103080-9 = ""
103080-13 = ""
103080-14 = "Планы предстоящей операции завершены."
103080-15 = "Спасибо всем, кто помогал с подготовкой к этой операции."
103080-16 = "Название операции — «Захват Ковчега Атрахасис»."
103080-17 = "Если всё пройдёт успешно, это будет наша последняя совместная операция."
103080-19 = "П-Последняя..."
103080-21 = "Ну да. Если победим, все смогут вернуться домой. Если проиграем — Кивотос конец."
103080-22 = "Каким бы ни был результат, это наша последняя битва."
103080-24 = "М-Мы победим! Не заставляй всех нервничать, Каёко!"
103080-25 = ""
103080-27 = ""
103080-29 = "Всё получится. Лучшие специалисты самых разных областей совместно разработали этот план."
103080-30 = "Это максимально близко к идеальной операции, насколько вообще возможно."
103080-32 = "...Позвольте изложить план."
103080-35 = "Наша основная цель — уничтожить Ковчег Атрахасис в небе над Кивотос."
103080-36 = "Только уничтожив его, мы сможем помешать Ложным святилищам и дальше заражать Кивотос."
103080-39 = "Однако Ковчег защищён барьером состояния квантовой суперпозиции, из-за которого физический доступ снаружи невозможен."
103080-40 = "Пока этот барьер существует, физически добраться до Ковчега невозможно."
103080-42 = "Поэтому мы планируем пройти сквозь барьер, приведя Корабль Утнапиштима в то же состояние квантовой суперпозиции."
103080-44 = "Иными словами, сравняемся с ними по уровню и проскользнём внутрь."
103080-46 = "Расчёты многомерного анализа буду выполнять я, используя огромную вычислительную мощность этого корабля."
103080-48 = "Из любопытства, что случится, если ты ошибёшься в расчётах?"
103080-49 = ""
103080-52 = ""
103080-54 = "Разумный вопрос. Если войти в пространство состояния квантовой суперпозиции на основе ошибочного расчёта..."
103080-55 = "Если не повезёт — нас разорвёт на атомы. Если повезёт — выбросит с корабля, и мы упадём с высоты 75 000 метров."
103080-57 = "Н-На такой высоте... даже нимб может разрушиться."
103080-58 = "Мы умрём задолго до того, как ударимся о землю."
103080-59 = ""
103080-61 = ""
103080-62 = "На такой высоте температура ниже минус шестидесяти градусов. Один вдох — и лёгкие замёрзнут."
103080-63 = "Жидкости в теле закипят и испарятся раньше, чем вы успеете моргнуть. В такой экстремальной среде ваш нимб продержится максимум две минуты."
103080-64 = "Спасибо за чрезвычайно оптимистичный прогноз, Каёко. Я очень воодушевлена."
103080-65 = ""
103080-67 = ""
103080-69 = "Мы не провалимся. Не имеем права."
103080-70 = "Пройдя барьер, мы сможем физически воздействовать на Ковчег и войти внутрь."
103080-71 = "Нужно проникнуть в Ковчег, взломать его операционную систему и полностью уничтожить его, чтобы он больше никогда не заработал."
103080-72 = "Разумеется, мы не ожидаем, что враги внутри Ковчега спокойно на это посмотрят."
103080-73 = "Продвигаться придётся медленно и осторожно. Мы будем отбивать атаки и шаг за шагом захватывать участки Ковчега, пока не окажемся достаточно близко, чтобы перехватить управление."
103080-75 = "Если так захватим управление Ковчегом, сможем заставить его самоуничтожиться или рухнуть на землю."
103080-76 = "Иными словами, условия нашей победы — взломать и угнать Ковчег."
103080-78 = "Прямо и понятно. Одобряю."
103080-79 = "Но насчёт..."
103080-80 = ""
103080-83 = ""
103080-85 = "О. Я всего лишь скромный AMAS поддержки."
103080-86 = ""
103080-89 = ""
103080-90 = "Президент Рио?!"
103080-91 = ""
103080-94 = ""
103080-95 = "...Недолго же это заняло."
103080-96 = "Мы всё думали, куда вы исчезли! Что вы здесь делаете?!"
103080-97 = "Э-это..."
103080-98 = "Серьёзно... Алиса и Отдел разработки игр здесь. О чём вы думаете?"
103080-99 = "Рио помогает мне."
103080-100 = ""
103080-102 = ""
103080-103 = "У тебя появятся морщины на лбу, Юука. Я внимательно за ней слежу. Если попробует что-нибудь сделать, я с огромным удовольствием её уничтожу."
103080-104 = "*вздыхает*"
103080-105 = "Не знаю, что вы задумали, но даже не думайте приближаться к Отделу разработки игр! Я за вами слежу!"
103080-106 = "Но позже мы поговорим, президент. Мне с вами много чего нужно обсудить, начиная с растраты!"
103080-107 = ""
103080-110 = ""
103080-111 = "...Понятно."
103080-112 = "...Поняла."
103080-113 = "На всякий случай я найду способ вернуться на землю... с вашего разрешения, конечно."
103080-114 = "Разрешаю, пожалуйста, займись этим. Если Утнапиштим сломается, мы застрянем в Ковчеге."
103080-117 = "Аюму, сколько у нас осталось времени?"
103080-118 = ""
103080-120 = ""
103080-122 = "До повторного появления Ложных святилищ... примерно двенадцать часов."
103080-124 = "Ух... За это время нам нужно поднять этот корабль в небо и захватить Ковчег, да?"
103080-125 = "Эта операция вообще хоть немного осуществима?"
103080-127 = "Да. Я несколько раз прогнала симуляцию."
103080-128 = "Вероятность успеха — целых три процента."
103080-129 = "Три процента..."
103080-130 = "Хм... Нам понадобится чудо, чтобы всё получилось..."
103080-131 = "[s] «Три процента лучше, чем ноль.»"
103080-133 = "...Да. Вы правы, Сенсей."
103080-134 = "Это беспрецедентная ситуация в Кивотос... Мы добрались сюда, прокладывая путь сквозь совершенно непостижимые явления."
103080-136 = "С самого первого знака, пророчества Юризоно Сэи, мы всё время двигались по неизведанной территории..."
103080-137 = "Когда в Кивотос обнаружили шесть сгустков энергии, это были невидимые и непостижимые явления."
103080-139 = "Появившиеся затем Ложные святилища атаковали нас, используя все тайны, которые до сих пор возникали в Кивотос."
103080-140 = "Неконтролируемый ИИ Decagrammaton, Mimesis, воспроизводящий воспоминания, древние технологии вроде Безымянных богов..."
103080-141 = "...И Chroma, искажающая саму личность учеников Кивотос..."
103080-143 = "В ходе масштабной союзной операции мы успешно объединились, победили хранителей и уничтожили все святилища..."
103080-144 = "А теперь святилища вот-вот восстановятся."
103080-145 = "Все эти ситуации были пугающими и непостижимыми... Уверена, каждый из вас это понимает."
103080-146 = "Пророчество, Decagrammaton, Mimesis, Chroma, Безымянные боги, Divi:Sion, Ложные святилища, хранители, Проводник Chroma и Phrenapates..."
103080-147 = "Вероятность успеха всего три процента, но... это неважно. Нам придётся пробиться сквозь эти шансы, как мы делали всегда."
103080-148 = "[s] «Как сказала Рин. Ещё один раз — выложимся по полной и спасём Кивотос.»"
103080-150 = "Я с Сенсеем. Мы не можем повернуть назад, даже не попытавшись."
103080-151 = "Последняя битва."
103080-152 = "Мы вернём Широко, так или иначе."
103080-154 = "*вздыхает* Похоже, выбора нет."
103080-155 = "Мы уже дошли так далеко, остаётся только идти вперёд."
103080-157 = "Тогда подготовьте Корабль Утнапиштима. Через восемь часов мы должны быть готовы к вылету."
103080-158 = "Что?! В-Восемь часов?"
103080-159 = "У нас ведь есть руководство, верно? Просто придётся его выучить."
103080-160 = "Вы серьёзно ждёте, что кто-то запихнёт всю эту информацию в голову за несколько часов?"
103080-161 = "Неважно, возможно это или нет. Мы просто обязаны сделать. Освоим руководство и будем управлять Кораблём Утнапиштима."
103080-162 = "*вздыхает* ...Операторов... думаю, нужно как минимум десять... может, сто..."
103080-163 = "[s] «Операции оставьте мне.»"
103080-164 = "Сенсей будет этим заниматься?"
103080-165 = "[s] «Ящик Шиттим как-нибудь справится.»"
103080-166 = "Не могу так громко говорить и потом просто сидеть в стороне. Я помогу вам, Сенсей."
103080-168 = "Р-Рин?"
103080-170 = "Мы все здесь. Нет места осторожничать или колебаться. Я не оставлю Сенсея одного разбираться с самой опасной задачей."
103080-171 = "[s] «Ринни... Ты моя опора!»"
103080-172 = ""
103080-175 = ""
103080-176 = ""
103080-177 = "Если нужно только выучить руководство, я-я думаю, смогу..."
103080-179 = "Даже ты, Аюму?!"
103080-181 = "Ну, раз Сенсей так говорит, я, казначей Семинар, тоже не могу оставаться в стороне. Я тоже присоединюсь."
103080-182 = "Я тоже! Я хорошо запоминаю!"
103080-184 = "*вздыхает* Я, старший администратор Геенны, не позволю вам забрать всё внимание."
103080-185 = "И мне!"
103080-186 = "Да, я тоже присоединюсь!"
103080-187 = "И самое главное..."
103080-188 = "Я сделаю что угодно, чтобы спасти Широко!"
103080-190 = "Я сюда вообще не для такого пришла. *вздыхает* Но, похоже, выбора нет."
103080-192 = "Ого... Какие все энтузиасты."
103080-193 = "Просто чтобы вы знали: для меня это уже перебор."
103080-194 = "Момока... Ты проделала весь этот путь и теперь не будешь помогать?"
103080-195 = ""
103080-197 = ""
103080-198 = ""
103080-199 = ""
103080-201 = "Разве ты не говорила... что вместе со мной последуешь за Рин хоть на край вселенной...?"
103080-203 = "Ч-Что! Не делай такое лицо!"
103080-204 = "Ух! Ладно, ладно!"
103080-205 = "Почему бы и нет! Наверное, я тоже справлюсь."
103080-207 = "Хи-хи. Экипаж межзвёздного корабля. Звучит неплохо!"
103080-208 = "А форму нам тоже выдадут?"
103080-210 = "А? Форму...?"
103080-211 = "Ну, мы же экипаж межзвёздного корабля. Разве специальная форма не входит в комплект?"
103080-213 = "П-Подождите... Специальная форма?"
103080-214 = "Я могу этим заняться. Да. Смогу."
103080-215 = "Что?! Хибики, у тебя есть на это время?"
103080-216 = "Форма для экипажа межзвёздного корабля."
103080-217 = "Это будет вызов..."
103080-219 = "От которого я не откажусь."
103080-220 = ""
103080-223 = "Мы не можем разрушить мечты Инженерного отдела! Нельзя же в школьной форме кричать: «Взлёт!» или «Набрать высоту!»"
103080-224 = "...Это правда."
103080-225 = "Мне нравится! Начинаем!"
103080-226 = "Хорошо, отлично! Я найду референсы из аниме и манги!"
103080-228 = "Ага, а я сразу займусь изготовлением. Сначала нужны размеры всех."
103080-229 = "Ого... Я в предвкушении. Давайте подробно обсудим дизайн!"
103080-231 = "Звучит отлично. Тогда я добавлю некоторые функции и сделаю из неё скорее пилотный костюм, чем просто форму."
103080-232 = "Есть пожелания, Сенсей?"
103080-233 = "[s] «Да! Есть! Есть пожелания!»"
103080-235 = "У меня плохое предчувствие..."
103080-237 = "[ns1] «Оператор межгалактического линкора обязан носить пилотку!!»\n[ns2] «Это как быть бортпроводницей, поэтому шейный платок обязателен!!»\n[ns3] «Больше я мало что знаю, но главное — капитан обязан носить длинное пальто!!»"
103080-238 = ""
103080-239 = ""
103080-240 = ""
103080-243 = "Очень конкретно..."
103080-244 = "Хмм, хорошо. Учтём ваше мнение."
103080-246 = "(Что вообще происходит...?)"
103080-249 = ""
103080-250 = "*вздыхает* Тогда начинаем."
103080-251 = "Сейчас начнём подготовку к вылету и через восемь часов поднимемся к Ковчегу над небом."
103080-252 = "Нужно собрать операторов, диспетчеров воздушного движения, хакеров... и людей для питания и медицинской помощи..."
103080-253 = "Да. Нам также придётся привлечь больше студентов."
103080-254 = ""
103080-256 = ""
103080-258 = ""
103080-259 = "Рин..."
103080-260 = "Вы, Сенсей и остальные ученики всё это время работали без отдыха..."
103080-261 = "Не думаете, что всем нужен перерыв? Особенно тебе, Рин."
103080-262 = "...Да."
103080-263 = "Мы не сможем показать максимум, если будем невыспавшимися. Всем стоит немного отдохнуть."
103080-264 = "Все, вылетаем через восемь часов. Сразу после восхода солнца."
103080-265 = "А до тех пор отдыхайте, пока можете."
103080-266 = "Увидимся завтра утром — над небом!"
103080-268 = "Следующий эпизод; Последняя ночь на земле"
