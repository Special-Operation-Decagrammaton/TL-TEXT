[translation]
80000089-1 = "Сладкая шалость секретаря Семинара"
80000089-2 = "Здравствуйте, Сенсей."
80000089-3 = "У вас есть минутка?"
80000089-4 = "[s1] «Привет, Ноа.»\n[s2] «Что привело тебя сегодня в Шале?»"
80000089-5 = "Ну, я проходила неподалёку и случайно нашла кое-что, что давно хотела, и купила!"
80000089-6 = "Ну, я проходила неподалёку и случайно нашла кое-что, что давно хотела, и купила!"
80000089-7 = "Это большая редкость! Я просто не могла оставить находку при себе. Хотела показать вам, Сенсей."
80000089-8 = "[s] «Что же это может быть?»"
80000089-9 = ""
80000089-11 = ""
80000089-12 = "Это..."
80000089-13 = "Та-дам!"
80000089-15 = "Это флакон чернил."
80000089-16 = "Сейчас большинство людей, если пишут от руки, используют шариковые ручки. Стеклянный флакон чернил найти непросто."
80000089-17 = "Но как секретарю Семинар мне хотелось попробовать классическую каллиграфию пером и чернилами."
80000089-18 = "Конечно, в Миллениум никто такую классику не продаёт. Все наши документы цифровые."
80000089-19 = "Но я проходила через торговый район неподалёку и нашла этот чудесный флакон чернил!"
80000089-20 = "Мне не терпелось попробовать, но бумаги с собой нет..."
80000089-21 = "Поэтому я решила заглянуть в Шале. Ой, простите, что отвлекаю..."
80000089-22 = "[s] «Не за что. Заходи в любое время, если тебе что-нибудь понадобится.»"
80000089-23 = "Спасибо, Сенсей."
80000089-24 = "Тогда можно одолжить лист бумаги?"
80000089-25 = "[s] Дать Ноа лист бумаги."
80000089-26 = "Спасибо."
80000089-27 = "Так, посмотрим..."
80000089-28 = ""
80000089-30 = ""
80000089-32 = "Хм? Эти чернила плохо работают..."
80000089-33 = "Наверное, перо нужно намочить."
80000089-34 = ""
80000089-36 = ""
80000089-38 = ""
80000089-42 = ""
80000089-43 = "[ns3] «Ноа, эти чернила могут быть ядовитыми! Не бери их в рот!»\n[ns4] «Быстро выплюнь, выплюнь, выплюнь!»"
80000089-44 = ""
80000089-45 = ""
80000089-46 = "Хе... Хи-хи-хи..."
80000089-47 = "Улыбнитесь, вас снимает скрытая камера!"
80000089-48 = "[s] «...А? Камера? Где?»"
80000089-49 = "Сенсей, вы помните, какой сегодня день?"
80000089-50 = "[s] «День святого Валентина?»"
80000089-51 = "Да. Сегодня День святого Валентина. Время, когда влюблённые дарят друг другу шоколад..."
80000089-52 = "А ещё, что важнее в нашем случае, время, когда торговый район заполнен шоколадом самых необычных форм."
80000089-53 = "Я купила этот флакон чернил в специализированной кондитерской."
80000089-54 = "Внутри не чернила, а жидкий шоколад."
80000089-55 = "И, кстати, довольно вкусный!"
80000089-56 = "[s5] «Это хорошо, но я ужасно испугался...»\n[s6] «Я подумал, что ты и правда берёшь чернила в рот.»"
80000089-57 = "Хи-хи. В качестве извинения за розыгрыш можете забрать этот шоколад, Сенсей."
80000089-58 = "Хи-хи. В качестве извинения за розыгрыш можете забрать этот шоколад, Сенсей."
80000089-59 = "Для письма он не очень практичен: плохо набирается на перо и быстро портится, но..."
80000089-60 = "...идеально подойдёт, если вы захотите выразить кому-нибудь свои сладкие чувства."
80000089-61 = "Если когда-нибудь захотите передать такое послание..."
80000089-62 = "...используйте эти чернила."
