[translation]
70003010-1 = "Журнал Хайлендер 1"
70003010-5 = ""
70003010-6 = ""
70003010-7 = "Здравствуйте! Я машинист из Железнодорожной академии Хайлендер."
70003010-8 = "Сегодня у нас, как обычно, плановый рейс Внутренней кольцевой линии Кивотос!"
70003010-9 = "Как вам наверняка известно, на Внутренней кольцевой линии самый высокий уровень происшествий за весь год."
70003010-10 = "Во время рейса наша внутренняя бригада — единственные сотрудники на борту, способные разбираться с обычными происшествиями, так что я, естественно, немного нервничаю."
70003010-11 = "Если проблема становится серьёзной, мы просим подкрепление, но обычно ему требуется время, чтобы добраться..."
70003010-12 = "Поэтому со всем, с чем можем, разбираемся сами. Иногда это выматывает."
70003010-13 = "..."
70003010-14 = "Да... Такое... случается довольно часто..."
70003010-15 = ""
70003010-17 = ""
70003010-18 = "Хахаха, в общем!"
70003010-19 = "От общего контроля вагонов до реагирования на всевозможные происшествия — рабочие дни у нас обычно пролетают незаметно!"
70003010-20 = "Не уверена, что это хорошо, но ладно!"
70003010-21 = "Что ты делаешь? Видеозвонок?"
70003010-22 = "О, а..."
70003010-23 = "Ну..."
70003010-24 = ""
70003010-26 = ""
70003010-27 = "Я снимала влог..."
70003010-28 = "Влог?"
70003010-29 = "Ага...! Эм, чтобы, надеюсь, показать и хорошие стороны Железнодорожной академии Хайлендер..."
70003010-30 = "О...?"
70003010-31 = "И-и я подумала, пассажиры могут вести себя сговорчивее, если лучше поймут нашу работу...!"
70003010-32 = "Ты права. Некоторые думают, что мы просто катаемся на поезде кругами."
70003010-33 = "Не так давно одна пассажирка устроила скандал и крикнула мне: «Вы вообще чем занимаетесь?!»"
70003010-34 = "Да уж, не напоминай..."
70003010-35 = "Ну, это действительно постоянная проблема, так что ладно: если получится вдохновить хотя бы одного клиента быть чуть менее грубым, снимай."
70003010-36 = "В любом случае, скоро отправляемся, так что всем пора готовиться."
70003010-37 = "Т-Точно."
70003010-38 = ""
70003010-40 = ""
70003010-41 = "Фух..."
70003010-42 = "В общем, сегодня снова выложусь на полную! Я точно стану студентом месяца!"
70003010-45 = "Машинное отделение поезда"
70003010-46 = "Хм... К счастью, пока идём без проблем."
70003010-47 = "Как обстановка в вагонах?"
70003010-48 = "А... В вагонах ничего особенного."
70003010-49 = "В вагоне 3 одна пассажирка сидела не на своём месте, но когда мы ей сказали, спорить не стала."
70003010-50 = "Хорошо. Надеюсь, так и продолжится..."
70003010-51 = ""
70003010-54 = ""
70003010-55 = "А, сглазила."
70003010-56 = "Вагон 5 просит выключить кондиционер. Им слишком холодно."
70003010-57 = "Я просто немного подниму температуру."
70003010-59 = "Некоторое время спустя..."
70003010-60 = ""
70003010-62 = "А, снова жалоба из вагона 5..."
70003010-63 = "Теперь они просят сильнее включить кондиционер, потому что слишком жарко."
70003010-64 = "Это та же пассажирка?"
70003010-65 = "Нет, другая."
70003010-66 = "А. Худший возможный сценарий. Кому нам угождать?"
70003010-67 = "Ну а что поделаешь? Если бы им не было некомфортно, они бы не жаловались."
70003010-68 = ""
70003010-70 = ""
70003010-71 = ""
70003010-72 = "А, а...! Бригада вагонов, бригада вагонов, ответьте."
70003010-73 = "Что? Что случилось?"
70003010-74 = "У меня ещё одна жалоба из вагона 5... Говорят, там пассажирка раздевается, потому что ей слишком жарко..."
70003010-75 = "А... Я немедленно туда пойду."
70003010-76 = "Нужно найти какой-то компромисс с температурой. Может, дать замёрзшей пассажирке плед?"
70003010-77 = "Это точно лучше альтернативы в виде голой пассажирки?"
70003010-78 = "Пожалуйста, разберись..."
70003010-80 = "Вагон 7"
70003010-81 = ""
70003010-82 = ""
70003010-83 = ""
70003010-84 = "Ц-ц-ц... Молодёжь нынче."
70003010-85 = ""
70003010-87 = ""
70003010-88 = "У них даже уважения к старшим не хватает, чтобы уступить место."
70003010-89 = "А?"
70003010-90 = "Простите, это наши места по билетам."
70003010-91 = "А мне всё равно! Вставай сейчас же! У меня ноги болят!"
70003010-92 = "Что это у тебя? Палка?!"
70003010-93 = "Нет, это флейта! Ай, положите её, дедушка!"
70003010-95 = "Ах ты наглая соплячка!! Вот когда я был в твоём возрасте—!"
70003010-96 = "А этот хам вообще кто такой, а?!"
70003010-97 = ""
70003010-99 = ""
70003010-100 = ""
70003010-105 = ""
70003010-106 = "*вздох* Эм, сэр? Пожалуйста, опустите эту... штуку. Давайте все глубоко вдохнём."
70003010-107 = "А? Ты кто такая?"
70003010-108 = "Эй! Это дед первым начал!"
70003010-109 = "Независимо от того, кто виноват, такое поведение недопустимо. Пожалуйста, просто пройдите со мной из вагона..."
70003010-110 = "Ха, ещё чего! Клиент всегда прав! Кто ты такая, чтобы мне приказывать?"
70003010-111 = "Ну, вы мешаете другим пассажирам... поэтому прошу пройти..."
70003010-112 = "Мы честно купили эти места!"
70003010-113 = "Проблема в этом старике, так что мы никуда не сдвинемся!"
70003010-114 = "Ну, эм..."
70003010-115 = "Что? Старик?! Ах ты мелкая! Уважай старших!"
70003010-116 = ""
70003010-118 = ""
70003010-119 = "..."
70003010-120 = "Почему это всегда происходит...?"
70003010-121 = ""
70003010-123 = "Здравствуйте, вы из Хайлендер, да? Член поездной бригады?"
70003010-124 = "А, да."
70003010-125 = "Можете что-нибудь сделать с этими людьми? Они слишком шумят."
70003010-126 = "А, мы делаем всё возможное..."
70003010-127 = "Серьёзно? Вытащите их отсюда силой, если понадобится. Просто уберите. Что это вообще за порядки?"
70003010-128 = "Да, конечно..."
70003010-130 = "Приносим извинения за неудобства..."
70003010-131 = ""
70003010-133 = ""
70003010-134 = "Нарушение порядка в вагоне 7? Эм, поняла."
70003010-135 = "Сделайте сами всё, что сможете, но если станет слишком тяжело, я отправлю кого-нибудь на помощь."
70003010-136 = "Да-да. Пожалуйста, потерпите ещё немного."
70003010-137 = ""
70003010-139 = ""
70003010-140 = "*вздыхает*"
70003010-141 = "Я надеялась, что сегодня наконец будет тихий день, но увы..."
70003010-142 = ""
70003010-144 = ""
70003010-145 = "А? В вагонах 8 и 3 тоже?"
70003010-147 = "Вагон 8"
70003010-148 = ""
70003010-150 = ""
70003010-151 = ""
70003010-152 = ""
70003010-153 = ""
70003010-154 = "Эй! Ты не знаешь, что выходящие имеют преимущество?! Смотри куда прёшь!"
70003010-155 = "А?! Может, это тебе стоит смотреть, куда идёшь!"
70003010-156 = "Или вообще сначала пропускать входящих!"
70003010-157 = "Что? Ты издеваешься?!"
70003010-159 = "Вагон 3"
70003010-160 = ""
70003010-161 = "Здравствуйте, все! Пожалуйста, обратите внимание сюда всего на минутку!"
70003010-162 = ""
70003010-164 = ""
70003010-165 = "Кто я? Это неважно!"
70003010-166 = "Сейчас важно только одно..."
70003010-167 = "...что вам, мои счастливые попутчики, выпала раз в жизни возможность купить кое-что по-настоящему выгодно!"
70003010-168 = "«Что именно?» — спросите вы?"
70003010-169 = "Эй, это торговка. Кто-нибудь сообщите о ней."
70003010-170 = "Вот этот товар излучает инфракрасные лучи и отрицательные ионы, поэтому полезен для кровообращения! И это ещё не всё: он защищает ствол оружия от грязи, а если просто носить его с собой, пули будут реже заклинивать!"
70003010-171 = "Я говорю о модном украшении, которое покоряет весь Кивотос! ГЕР... гер... ГЕРМАНИЕВЫЕ БРАСЛЕТЫ!!"
70003010-172 = "Я приношу этот эксклюзивный товар прямо к вашим местам! Больше нигде такого не купить! Именно так. Как я сказала — шанс раз в жизни!"
70003010-173 = "Обычно я беру 5000 иен, но всем пассажирам этого поезда сегодня невероятно повезло! Только сегодня специальная! Шокирующая! Цена! Всего 1000 иен!!"
70003010-174 = "Ого... Так дёшево? Может, взять один?"
70003010-175 = "П-Правда? Особенно если он предотвращает заклинивание... Это довольно круто."
70003010-176 = ""
70003010-178 = ""
70003010-179 = "А, мэм! Потрогали — значит купили!"
70003010-180 = "Ч-Что? Я просто хотела понять, какой он на ощупь..."
70003010-181 = "Это особый продукт Клуба псевдонауки Миллениум! Он мгновенно привязывается к первому человеку, который его коснётся!"
70003010-182 = "Н-Но..."
70003010-183 = "*вздох* Ладно, похоже, выбора нет."
70003010-185 = "Обычно я такого не делаю, но специально для вас, хорошо? Сделаю очень-очень особую скидку!"
70003010-186 = "3000 иен за набор из пяти! Это же грабёж среди бела дня!!"
70003010-188 = "А... Тогда два я получу бесплатно, да?"
70003010-189 = "Я... я бы даже чувствовала себя глупо, если бы НЕ взяла."
70003010-190 = "А, чёрт с ним, почему бы и нет?!"
70003010-192 = "Только сегодня любой в этом вагоне может воспользоваться специальной ценой!!"
70003010-193 = "А вдобавок первые три покупателя получат особый счастливый амулет, который мне удалось раздобыть в Хяккияко!"
70003010-194 = "Я-я хочу один!"
70003010-195 = "Я тоже! Я тоже!!"
70003010-197 = "Вагон №6"
70003010-198 = "Простите!! Пожалуйста, не залезайте на багажную полку! Немедленно спускайтесь!"
70003010-199 = "А-а-а? Я просто пытаюсь найти удобное место полежать!"
70003010-200 = "Пожалуйста, спуститесь! Оставаться там опасно."
70003010-201 = ""
70003010-204 = "Эй-эй! Сесть негде! Разве это не ваша вина, что мест нет?"
70003010-205 = "А?"
70003010-206 = "Простите, можно посмотреть ваш билет?"
70003010-207 = "Что это? Зачем мне билет, чтобы ехать на поезде?"
70003010-208 = ""
70003010-210 = ""
70003010-212 = "Прошу прощения, но на следующей станции вам придётся выйти!!"
70003010-213 = "Что? Кто ты такая, чтобы мне это говорить?! Я хочу поговорить с начальством!"
70003010-215 = "Вагон №4"
70003010-216 = "*пых* *пых*... Это здесь?"
70003010-217 = "Это они! Они перекрыли проход и играют в маджонг! Остальным невозможно пройти!"
70003010-218 = "О, сотрудница! Как раз вовремя! Присоединяйся! Один игрок только что ушёл!"
70003010-219 = "А? Погодите, что...?"
70003010-220 = "Нам людей не хватает! Давай, садись!"
70003010-221 = "Я-я даже правил не знаю...! Погодите, важнее другое: здесь нельзя играть в маджонг!"
70003010-222 = "Хи-хи-хи. Мы тебя научим, так что садись!!"
70003010-224 = ""
70003010-225 = "Д-Да! Машинист Хайлендер на связи!"
70003010-226 = "Подкрепление?! Где...?"
70003010-227 = ""
70003010-229 = ""
70003010-230 = "А?! Во всех вагонах...?!"
