[translation]
1008005-1 = "Внимательность"
1008005-2 = "Мы с Шокухо прогуливались вдоль магазинов."
1008005-3 = ""
1008005-5 = ""
1008005-7 = ""
1008005-8 = "...?"
1008005-9 = ""
1008005-10 = ""
1008005-11 = ""
1008005-12 = ""
1008005-13 = ""
1008005-14 = "[ns1] ...Шокухо?\n[ns2] Что-то случилось?"
1008005-17 = "Нет. Ничего особенного."
1008005-18 = "Мне просто стало интересно, всегда ли девушки, где бы они ни были, сбиваются в компании."
1008005-19 = "Мне неловко это признавать, но я всегда оказывалась в центре подобных групп..."
1008005-20 = "Но теперь обстоятельства изменились, и я оказалась посторонней. Возможно, это хороший шанс взглянуть на всё объективно."
1008005-21 = "Интересно, так ли чувствуют себя другие, когда смотрят на меня в моём привычном окружении. Вот о чём я думала."
1008005-22 = "Впрочем, неважно. Нет ничего плохого в том, что девушки собираются вместе. Я бы даже сказала, что это вполне естественно."
1008005-23 = "Хм...? Много ли у меня друзей дома?"
1008005-24 = ""
1008005-26 = ""
1008005-27 = "Друзья..."
1008005-28 = "Я бы ни в коем случае не назвала себя одинокой, но сказать, что у меня очень много друзей, было бы не совсем честно."
1008005-29 = ""
1008005-31 = ""
1008005-32 = "Была одна дружба, которой я действительно дорожила, но на большинство моих друзей так или иначе повлияла моя способность."
1008005-33 = "Уверена, для тебя это звучит ужасно принудительно."
1008005-34 = "Хм? Ты так не считаешь? Думаешь, они всё поняли и всё равно решили остаться моими друзьями?"
1008005-35 = "Хм... Это искренние слова поддержки или ты просто мне льстишь?"
1008005-36 = "Впрочем, неважно. Оба варианта проще, чем спорить."
1008005-37 = "Хм?"
1008005-38 = "Ты спрашиваешь, хочу ли я сделать это здесь? Что именно ты имеешь в виду?"
1008005-39 = "...Контроль разума?"
1008005-40 = "Разве стоит спрашивать такое у человека с моей способностью? Скорее уж тебе следовало бы запретить мне даже думать об этом."
1008005-41 = "Здесь мне трудно сосредоточиться на способности, и в этом мире она наверняка слабее..."
1008005-42 = "Но если я постараюсь, моя способность всё ещё мне подвластна."
1008005-43 = ""
1008005-45 = ""
1008005-46 = "...Как неожиданно. Ты совсем не выглядишь нервным."
1008005-47 = "[s3] Я знаю, что ты не станешь контролировать мой разум.\n[s4] Если бы хотела, ты бы уже давно это сделала."
1008005-50 = "Именно. Если бы я хотела контролировать тебя, я бы сделала это задолго до этого разговора."
1008005-51 = "Но я не собираюсь этого делать, потому что здесь в этом нет необходимости."
1008005-52 = "В этом мире я посторонняя и всего лишь гостья. У меня нет желания вмешиваться в местные дела, и уж тем более я не хочу нести за это ответственность."
1008005-53 = "Контролировать других вовсе не так весело, как тебе может казаться..."
1008005-54 = "Если честно, я бы с радостью вообще отказалась от этого, будь такая возможность."
1008005-55 = "Не будет преувеличением назвать это бременем. И я точно не могу сказать, что скучаю по нему здесь."
1008005-56 = "Быть обычным человеком без каких-либо способностей... Возможно, именно в этом и есть секрет спокойной жизни."
1008005-57 = "Просто мысль."
1008005-58 = "Опять..."
1008005-59 = ""
1008005-61 = ""
1008005-63 = ""
1008005-64 = "...Что это за шум?"
1008005-65 = "Посетитель, пожалуйста... Я понимаю, что вы торопитесь, но здесь очередь..."
1008005-66 = "Да ладно тебе. Нельзя просто пропустить меня вперёд? Ты только сцену устраиваешь."
1008005-67 = "Видишь, люди уже смотрят. Просто пропусти меня незаметно, разве нельзя?"
1008005-68 = "Может и так, но... я должна соблюдать правила магазина..."
1008005-69 = "Правила созданы, чтобы их нарушать. Ну же, будь немного гибче..."
1008005-70 = ""
1008005-72 = ""
1008005-73 = "[ns5] Кто-то устроил неприятности.\n[ns6] Надо вмешаться."
1008005-76 = "...Ну надо же."
1008005-77 = ""
1008005-79 = ""
1008005-81 = "[ns7] ...?\n[ns8] Хм? Что это было...?"
1008005-84 = "Уф... Я больше не могу это терпеть...!"
1008005-85 = "Я сказала нет! Немедленно в конец очереди! Иначе я правда разозлюсь!"
1008005-86 = "Что?! Ладно, ладно... Не надо так кричать... Все смотрят...!"
1008005-87 = "В следующий раз я позову менеджера!!"
1008005-88 = "Хорошо, хорошо! Уже ухожу..."
1008005-89 = "[ns] «...?»"
1008005-91 = "[ns] ...Шокухо?"
1008005-94 = "― [log=쇼쿠호]...Хм?[/log][wa:180]"
1008005-96 = "― [log=쇼쿠호]Что такое?[/log][wa:180]"
1008005-99 = "― [log=쇼쿠호]Ты ведь знала,[/log][wa:1610]"
1008005-100 = "― [log=쇼쿠호]что рано или поздно это случится.[/log][wa:500]"
1008005-103 = "― [log=쇼쿠호]Правда?[/log][wa:60]"
1008005-106 = "― [log=쇼쿠호]Мой пульт?[/log][wa:1040]"
1008005-107 = "― [log=쇼쿠호]...Ты действительно хочешь знать?[/log][wa:490]"
1008005-110 = "― [log=쇼쿠호]Какой бестактный вопрос![/log][wa:170]"
1008005-113 = "― [log=쇼쿠호]Есть вопросы,[/log][wa:1450]"
1008005-115 = "― [log=쇼쿠호]которые даме просто нельзя задавать. ☆[/log][wa:740]"
1008005-118 = "― [log=쇼쿠호]Понятно? Ты ничего не видела.[/log][wa:2660]"
1008005-119 = "― [log=쇼쿠호]С самого начала ничего не произошло.[/log][wa:350]"
1008005-122 = "― [log=쇼쿠호]...Верно, Сенсей?[/log][wa:950]"
1008005-126 = "Я просто согласился, и мы пошли дальше."
