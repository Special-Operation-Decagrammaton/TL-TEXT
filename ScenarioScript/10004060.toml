[translation]
10004060-1 = "Эпизод 6;Безрассудная операция по захвату"
10004060-2 = "Самый простой способ заставить Шун принять противоядие — это..."
10004060-3 = "...операция «Сыр»!"
10004060-4 = "[s] «Операция „Сыр“?»"
10004060-5 = "Да. Как крыса не может устоять перед кусочком сыра, так маленький ребёнок не сможет отказаться от конфеты!"
10004060-6 = "Поэтому я приготовила специальную конфету, покрытую противоядием!"
10004060-7 = ""
10004060-9 = ""
10004060-10 = ""
10004060-11 = "Уверена, она сразу закинет её в рот, как только я протяну!"
10004060-12 = "[s] «Мне кажется, на такое попадёшься только ты.»"
10004060-13 = "Замолчи! Я не стану пихать в рот любой попавшийся сыр!"
10004060-14 = "В любом случае, если появишься как обычно, Шун тебе не поверит, поэтому я приготовила маску. Примерь!"
10004060-15 = ""
10004060-17 = ""
10004060-18 = ""
10004060-19 = ""
10004060-20 = "О, какая идеальная маскировка! Никто никогда не догадается, что вы Сенсей [USERNAME]!"
10004060-21 = "[s] «В этой маске как-то трудно дышать...»"
10004060-22 = "Не цепляйся к мелочам. Всё ради идеальной операции."
10004060-23 = "Ну, удачи!"
10004060-25 = ""
10004060-26 = ""
10004060-27 = ""
10004060-28 = "Уф. В итоге Сенсей всё узнал."
10004060-29 = "Наверное, он теперь ненавидит меня за то, что я притворялась ребёнком и устраивала истерики."
10004060-30 = "[s] «*тяжело дышит* Привет, юная леди.»"
10004060-32 = "А?"
10004060-33 = "К-Кто вы? И зачем носите маску среди бела дня?"
10004060-34 = "[s] «Хочешь конфетку?»"
10004060-35 = ""
10004060-37 = ""
10004060-39 = ""
10004060-40 = "Нет."
10004060-41 = "Вы буквально незнакомец с конфетами."
10004060-42 = "[s1] «Я не подозрительный! *тяжело дышит*»\n[s2] «Всё нормально. Просто возьми.»"
10004060-43 = "За кого вы меня держите?!"
10004060-44 = "За кого вы меня держите?!"
10004060-45 = "Если ещё раз увижу вас или вашу дурацкую конфету, попадёте в список подозрительных лиц!"
10004060-46 = ""
10004060-48 = ""
10004060-50 = "Провал."
10004060-51 = "[s] «Провал.»"
10004060-52 = "Ну ничего! Нельзя ожидать, что пробный запуск всегда сработает!"
10004060-53 = "Переходим к следующей операции!"
10004060-55 = "Второй способ заставить Шун принять противоядие — это..."
10004060-56 = "...операция «Ловушка»!"
10004060-57 = "[s] «Операция „Ловушка“?»"
10004060-58 = "Ага. В мышеловке же есть несколько механизмов, чтобы обездвижить мышь и поймать её, да?"
10004060-59 = "И это навело меня на мысль. Особая огромная ловушка, приготовленная лично мной!"
10004060-60 = ""
10004060-62 = ""
10004060-63 = ""
10004060-64 = "Когда цель наступает на неё, выпускается мощный паралитический газ и на короткое время лишает её возможности двигаться."
10004060-65 = "[s] «Это звучит невероятно незаконно.»"
10004060-66 = "Всё нормально, всё нормально. Уверяю, этот паралитический газ находится строго в серой зоне регулирования. И никаких побочных эффектов!"
10004060-67 = "...Наверное."
10004060-68 = "[s] «Наверное?!»"
10004060-69 = "Опять цепляешься к деталям. Сосредоточься!"
10004060-70 = "Расставим ловушки там, где может пройти Шун."
10004060-73 = ""
10004060-74 = ""
10004060-76 = "Установка завершена! Теперь просто ждём, когда появится Шун."
10004060-77 = "[s] «По-моему, это уже перебор...»"
10004060-78 = "Не будь ребёнком. Если Шун не хотела быть обездвиженной, надо было сотрудничать с самого начала."
