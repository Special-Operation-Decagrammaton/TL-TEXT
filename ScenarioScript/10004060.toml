10004060-112 = ""
10004060-115 = ""
10004060-121 = "Какой придурок бросает бутылки на улицу? Я чуть не пострадала!"
10004060-122 = "Серьёзно, когда вернусь, придётся снова напомнить студентам правила переработки."
