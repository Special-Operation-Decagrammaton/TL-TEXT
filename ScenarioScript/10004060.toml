10004060-128 = "Так, ну... ещё один провал."
10004060-129 = "[s] «Провал.»"
10004060-130 = "Лучше подготовить следующую операцию."
10004060-131 = "[s3] «Я не могу пошевелить ни одной мышцей.»\n[s4] «Я не чувствую рук и ног.»"
10004060-134 = "Ха-ха-ха..."
10004060-135 = "Признай, я делаю довольно мощные штуки!"
10004060-136 = "Ага! Я так впечатлена... что тоже не могу двигать руками и ногами!"
10004060-137 = "Новый план: подождём, пока паралич пройдёт."
10004060-139 = "Говорят, старый орёл лучше молодого ворона. Всё-таки она старший инструктор Сада сливового цветка."
10004060-140 = "Не ожидала, что она так быстро пройдёт через мои ловушки..."
10004060-141 = "У меня оставался один последний план. Я не собиралась его использовать... до сих пор."
10004060-142 = "[s5] «Ч-Что это?»\n[s6] Нервно сглотнуть и испуганно посмотреть."
10004060-145 = "Я..."
10004060-146 = "...сокрушу её силой взрослого!"
10004060-147 = "Какой бы молодой и ловкой Шун сейчас ни была, вы всё равно сильнее неё, Сенсей."
10004060-148 = "Я дам сигнал оттуда. Тогда вы схватите Шун, а я дам ей противоядие."
10004060-149 = "[s] «Это точно необходимо?»"
10004060-150 = "Что ты такое говоришь? Это всё ради моего исследования."
10004060-151 = "То есть, ради Шун!"
10004060-152 = "Мы должны быть решительными, иначе Шун может навсегда остаться в этой форме!"
10004060-153 = "[s] «Наверное, ты права, но...»"
10004060-154 = "Хорошо. Я пойду вперёд и буду наблюдать. Ты тихо спрячься, а когда дам сигнал — хватай Шун!"
10004060-156 = "Почему-то сегодня на улицах столько странных людей."
10004060-157 = "Например, тот полный псих в маске... Нужно быть осторожнее."
10004060-158 = "Сейчас, Сенсей. Хватайте Шун!"
