[translation]
2003102-1 = "С роскошью"
2003102-2 = "Я оказался неподалёку от академии Красная Зима и решил заглянуть в Бывший институт со сладостями и шоколадом."
2003102-3 = ""
2003102-7 = ""
2003102-8 = ""
2003102-9 = ""
2003102-10 = ""
2003102-11 = ""
2003102-12 = ""
2003102-15 = "А, Сенсей."
2003102-16 = "Прости. Я так зарылась носом в эти сухофрукты, что не заметила, как ты вошёл."
2003102-17 = "Ты ведь пришёл из-за татами, о которых мы говорили, да?"
2003102-18 = "Дай мне минутку прибраться, а потом всё тебе покажу."
2003102-19 = "[s] «Не торопись. Я никуда не спешу.»"
2003102-20 = ""
2003102-23 = "[ns1] «Вообще-то сначала возьми это.»\n[ns2] «Я ведь говорил, что принесу угощения.»"
2003102-26 = "Ого, ты и правда что-то принёс?"
2003102-27 = "Я сказала это просто между делом. Тронута, что ты запомнил."
2003102-28 = ""
2003102-30 = ""
2003102-31 = ""
2003102-32 = "Спасибо, Сенсей. Обязательно поделюсь с остальными."
2003102-33 = "[s] «Вижу, ты всё ещё в юкате.»"
2003102-34 = "Ага. Та самая из Курорта горячих источников №227..."
2003102-35 = "Пусть я больше и не управляю курортом, эта юката сделана из хорошего материала. Для дома вполне подходит."
2003102-36 = ""
2003102-38 = ""
2003102-39 = "Знаешь, горячих источников уже нет, но от них у нас осталось много вещей."
2003102-40 = "Полезных вещей. Например, татами и эта юката..."
2003102-41 = "И хотя этого недостаточно, чтобы открыть курорт, у нас всё ещё остался один из маленьких источников..."
2003102-42 = "Этой зимой мы даже сможем понежиться в приятной тёплой ванне. Хоть раз."
2003102-43 = ""
2003102-46 = "[ns3] «Погоди, что значит „хоть раз“?»\n[ns4] «А как вы мылись раньше?»"
2003102-49 = "Тебя интересуют привычки своих студентов в бане, Сенсей?"
2003102-50 = "Как неприлично с твоей стороны."
2003102-51 = ""
2003102-53 = ""
2003102-54 = "...Ну, раз это ты, наверное, могу рассказать."
2003102-55 = "В Бывшем институте нет нормальной бани, поэтому до появления горячих источников мы мылись в реке."
2003102-56 = "Зимой здесь настолько холодно, что река промерзает насквозь. Нам приходится разбивать лёд, чтобы залезть в воду."
2003102-57 = "[s5] «Разве купаться буквально в ледяной воде не опасно?!»\n[s6] «Вы всегда можете пользоваться душем в Шале.»"
2003102-60 = "Хи-хи. Очень мило, что ты переживаешь, Сенсей."
2003102-61 = "Спасибо за предложение, но я откажусь. Шале слишком далеко от академии Красная Зима. Слишком долго добираться только ради душа."
2003102-62 = "И, как я уже сказала, у нас всё ещё есть маленький горячий источник. Больше никаких ледяных речных ванн!"
2003102-63 = "К тому же я как раз заканчивала кое-какие улучшения..."
2003102-64 = "[s] «Что за улучшения...?»"
2003102-65 = "Когда я управляла горячими источниками, один посетитель рассказал, что в некоторых местах в воду добавляют фрукты и особые ароматы, создавая приятный запах."
2003102-66 = "Мало того что пахнет хорошо, говорят, кожа во время купания ещё и впитывает полезные вещества."
2003102-67 = "Я не знаю, что используют другие горячие источники, но на территории Бывшего института полно фруктов и благовоний. Вот я и решила попробовать."
2003102-68 = "Студентам спецотряда редко достаются сладости или развлечения..."
2003102-69 = ""
2003102-71 = ""
2003102-72 = ""
2003102-73 = "Если хотя бы ванна будет приятной, может, нам станет немного легче."
2003102-74 = "[s7] «Хорошая идея.»\n[s8] «Уверен, остальные студенты будут рады.»"
2003102-77 = "Хи-хи. Надеюсь."
2003102-78 = "Кстати, Сенсей... Не хотите сами окунуться?"
2003102-79 = "Мне ещё нужно время, чтобы здесь прибраться."
2003102-80 = "Почему бы вам не зайти первым и не сказать мне, как оно?"
2003102-81 = "[s] «Ты правда не против, если я воспользуюсь вашей особой ванной?»"
2003102-82 = "Конечно, не против. Вы уже столько раз нам помогали."
2003102-83 = "Надеюсь, вам понравится!"
2003102-85 = "Шигурэ проводила меня к своему недавно обновлённому горячему источнику."
2003102-86 = ""
2003102-89 = "Возможно, из-за добавленных ею особых ингредиентов вода приобрела рубиновый оттенок."
2003102-91 = ""
2003102-94 = "[ns9] «У неё лёгкий фруктовый аромат...»\n[ns10] «Кожу прямо... пощипывает...»"
2003102-98 = ""
2003102-99 = "Как температура, Сенсей?"
2003102-100 = "[s11] «Температура отличная, но...»\n[s12] «Что ты добавила в воду?»"
2003102-103 = "Ничего особенного. Думаю, главный ингредиент — виноград... наверное?"
2003102-104 = "...Если точнее, ферментированный виноград."
2003102-105 = ""
2003102-108 = "[ns] «Под ферментированным ты имеешь в виду...»"
2003102-109 = "Ага, я добавила в воду вино. Крепкое вино. С дистиллированным бренди."
2003102-110 = "Скажу тебе, достать его было ОЧЕНЬ непросто. Оно настолько крепкое, что даже в воде для ванны вызывает покалывание."
2003102-111 = "[s] «Но ЗАЧЕМ ты добавила его в воду?!»"
2003102-112 = "Что, не знаешь? Немного вина полезно для здоровья."
2003102-113 = "Бокал вина в день расширяет сосуды, снижает холестерин и выводит токсины, вызывающие старение клеток."
2003102-114 = "Но ты снова и снова говорил, что студентам нельзя пить алкоголь, поэтому..."
2003102-115 = "Я подумала: если алкоголь нельзя ПИТЬ, может, можно впитывать его через кожу—"
2003102-116 = "[s] «Это тоже совсем нельзя!»"
2003102-117 = "Ну-ну, не придирайся к мелочам."
2003102-118 = "Я уже закончила уборку, так что, думаю, пора мне залезть в ванну вместе с тобой и—"
2003102-119 = "[ns13] «Даже не думай!»\n[ns14] «Эта ванна запрещена! На неопределённый срок!»"
2003102-122 = ""
2003102-123 = "Что? Нельзя...?"
2003102-124 = "Но я так старалась всё подготовить..."
2003102-125 = "Можно мне... хотя бы палец ноги окунуть...?"
2003102-126 = "[s] «Неа.»"
2003102-127 = ""
2003102-129 = ""
2003102-130 = "...Я так и думала, что легко не получится."
2003102-132 = "Мы провели день, спуская воду из источника и оттирая его дочиста."
2003102-133 = "К сожалению — возможно, из-за крепости использованного вина — какое-то время я мучился от похмелья."
