[translation]
2300405-1 = "Идеальный анималоид"
2300405-2 = "Исполнительный офис Шале"
2300405-3 = "Сенсей, я пришла."
2300405-4 = "...Ах да, Сенсей в командировке."
2300405-5 = "Значит, сегодня в доме Шале я совсем одна."
2300405-7 = "Гав, гав-гав!"
2300405-8 = "Ого, откуда в Шале щенок?"
2300405-9 = "А. Это, должно быть, тот игрушечный щенок, о котором говорил Сенсей."
2300405-10 = "*тяжело дышит*"
2300405-11 = "Для игрушки он довольно сложный."
2300405-12 = ""
2300405-13 = "Сенсей сказал не разбирать его, но слегка заглянуть внутрь ведь можно..."
2300405-14 = ""
2300405-15 = ""
2300405-16 = "Утаха поднимает щенка и прижимает к себе."
2300405-17 = "Что это? Он такой мягкий и тёплый."
2300405-18 = "В отличие от искусственной кожи из уретана или желатина, пахнет настоящей шерстью."
2300405-19 = "И температура... Здесь встроена отдельная система теплоизоляции?"
2300405-20 = "Нужно рассмотреть внимательнее."
2300405-21 = ""
2300405-22 = "Утаха поднимает щенка и пристально смотрит ему в морду."
2300405-23 = "*тяжело дышит*"
2300405-24 = "Из носа и пасти выделяется влага."
2300405-25 = "Такое количество влаги должно быть опасно для робота. Как здесь реализована гидроизоляция?"
2300405-26 = "И его глаза следят за мной, будто он понимает мои движения."
2300405-27 = "Похоже, он оснащён продвинутым ИИ отслеживания движений."
2300405-28 = ""
2300405-29 = "Щенок пытается вырваться из рук Утахи."
2300405-30 = "*скулит* *скулит*"
2300405-31 = "Не двигайся, щенок. Мне нужно проверить твою двигательную систему."
2300405-32 = "Такие естественные движения... Сколько моторов помещается в одной этой маленькой лапе?"
2300405-33 = "Даже пальцы полностью подвижны, а при сжатии нет никакого искусственного шума!"
2300405-34 = "Это... не просто игрушка. Это чрезвычайно высокотехнологичный автоматон!"
2300405-35 = "Эта технология превосходит даже возможности Инженерного отдела..."
2300405-36 = "Как настолько высокотехнологичное творение могло существовать просто как игрушка, а мы о нём даже не знали? Насколько же мы отстаём технологически..."
2300405-39 = "...А, Сенсей."
2300405-40 = "[s] «Пока меня не было, всё было в порядке?»"
2300405-41 = "Да. Я смогла многое узнать о пределах собственных возможностей..."
2300405-42 = "[s] «За такое короткое время?»"
2300405-43 = "Этот игрушечный щенок, которого ты заказал... Поиграв с этой машиной, я совсем потеряла уверенность в себе."
2300405-44 = "Наверное, мне стоит перестать называть себя мейстером Миллениума и начать учиться заново с самого начала."
2300405-45 = "[s1] «Машина...?»\n[s2] «О чём ты говоришь...?»"
2300405-46 = "Не притворяйся, что не понимаешь. Посмотри на этого идеально сделанного анималоида!"
2300405-47 = "Не притворяйся, что не понимаешь. Посмотри на этого идеально сделанного анималоида!"
2300405-48 = "Создать анималоида, неотличимого от настоящей собаки, сложно даже с технологиями Миллениума!"
2300405-49 = "Гав, гав-гав!"
2300405-50 = "[s] «Откуда у тебя этот щенок?»"
2300405-51 = "А? Это не тот игрушечный щенок, которого ты заказал? Тогда..."
2300405-53 = "Это просто потерявшийся щенок, который забрёл в Шале..."
2300405-54 = "Меня ввели в заблуждение твои слова."
2300405-55 = "[s] «Тебе ни разу не пришло в голову, что это настоящий щенок?»"
2300405-56 = "В наши дни анималоидов почти невозможно отличить."
2300405-57 = "Пусть прикосновение и температуру настоящей собаки воспроизвести сложно, движения суставов современными технологиями уже можно сделать чрезвычайно реалистичными."
2300405-58 = "Даже если сейчас трудно, лет через десять мы наверняка сможем делать игрушечных собак, неотличимых от настоящих..."
2300405-60 = "После этого мне пришлось слушать длинную лекцию Утахи о последних технологиях."
