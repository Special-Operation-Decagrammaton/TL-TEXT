[translation]
80000101-1 = "Что-то очень важное"
80000101-2 = "Получив сообщение от Мины, я пришёл в Генрюмонт..."
80000101-3 = "...И тогда я подумала: что для меня важнее всего?!"
80000101-4 = "Мои очки? Полосатое пальто? Парные пистолеты? Они критически важны. Жизненно! Так что идут в список!"
80000101-5 = "Президент — само собой, как и мои подчинённые, не говоря уже обо всех обязанностях. Всё это для меня очень важно."
80000101-6 = "[s] «...То есть у тебя столько важных вещей, что ты не можешь выбрать?»"
80000101-7 = "Вчера — да. Но сегодняшняя я уже всё поняла."
80000101-8 = "После очень долгих размышлений я осознала, что для меня важнее всего!"
80000101-9 = "Заинтриговала, да? Отлично... Вы не отстаёте. Так что же мне дороже всего?"
80000101-10 = "Это..."
80000101-11 = "Вот это!"
80000101-12 = ""
80000101-15 = "[ns] «И это...??!»"
80000101-16 = "Я долго думала."
80000101-17 = "Размышляла, рассуждала, а потом снова вернулась к размышлениям. И вот мой ответ."
80000101-18 = "Нечто, стоящее среди по-настоящему важного. Это..."
80000101-19 = "...сам Генрюмонт!"
80000101-20 = "[s] «Так вот оно что!»"
80000101-21 = "Именно! А сегодня, согласно мировому консенсусу, День святого Валентина!"
80000101-22 = "Позволить такому важному дню пройти без празднования было бы вопиющей несправедливостью!"
80000101-23 = "[s] «(Не уверен, какое отношение День святого Валентина имеет к справедливости...)»"
80000101-24 = "Поэтому я, Коноэ Мина, создала для вас шоколад в форме герба Генрюмона, Сенсей!"
80000101-25 = "[s] «О-о, красиво. Спасибо. С удовольствием съем.»"
80000101-26 = "Стойте!!"
80000101-27 = "Что вы делаете? Нельзя просто взять и сломать эмблему Генрюмона!"
80000101-28 = "[s] «Но иначе её будет ужасно трудно есть...»"
80000101-29 = "Нет! Ни за что! Только через мой труп!"
80000101-30 = "Как тогда её есть? Просто проглотите целиком одним куском!"
80000101-31 = "Слишком большая? Ну! Эм. Хм..."
80000101-32 = "..."
80000101-33 = "(Вот же беда. Я не подумала, что это станет проблемой.)"
80000101-34 = "Давайте! Скажите «А-а-а»! Откройте рот пошире и проглотите за раз!"
80000101-35 = "[s] «Я же говорю, это невозможно...»"
80000101-36 = "Аргх, как же раздражает! Дайте сюда! Вот так нужно—!"
80000101-37 = "..."
80000101-38 = "Не получается?!"
80000101-39 = "[s] «Конечно нет!»"
80000101-40 = "Ннгх, я смогу! На моей стороне силы традиции, справедливости и товарищества!"
80000101-41 = ""
80000101-44 = "...О."
80000101-45 = "[s] «Шоколадная эмблема Генрюмона сломалась?!»"
80000101-46 = "А-А-а-а, что мне делать, Сенсей?"
80000101-47 = "Я исполнительный офицер Генрюмона! Если станет известно, что я прокусила шоколадную версию нашего логотипа...!"
80000101-48 = "Аааа! Простите меня, президент! Я не нарочно! Я знаю, что поступки важнее слов, но...!"
80000101-49 = "[s] «Успокойся, Мина. Дыши глубже.»"
80000101-50 = "Д-Да... *фух* *ха* *фух* *ха*"
80000101-51 = "И-и что теперь?"
80000101-52 = "[s1] «Слышала поговорку: нет тела — нет преступления?»\n[s2] «Нужно съесть весь шоколад и уничтожить любые следы его существования.»"
80000101-55 = "!"
80000101-56 = "Понятно... Мы можем использовать этот метод!"
80000101-57 = "Вы всегда находите выход, Сенсей!"
80000101-58 = "Итак, начинаем операцию «Съесть улики»!"
80000101-60 = "Фух... Сколько же шоколада."
80000101-61 = "[s] «Хорошая работа, Мина...»"
80000101-62 = "Нет, это всё ваша заслуга."
80000101-63 = "Поздравляю с помощью в совершении идеального преступления!"
80000101-64 = "В свете ваших достижений я хотела бы назначить вас почётным офицером Генрюмона. Что скажете?"
80000101-65 = "[s] «Нет, спасибо. Всё в порядке. Правда.»"
80000101-66 = "Нет, Сенсей. Подумайте. Это может быть взаимовыгодное партнёрство."
80000101-67 = "Генрюмонт получит сильного союзника, а вы — нашу защиту, куда бы ни отправились..."
80000101-68 = "А? Точно хотите пока отложить этот разговор? Хм... Я разочарована, но ладно."
80000101-69 = "Погодите... Разве мы не забыли что-то? Мне кажется, забыли."
80000101-70 = "День святого Валентина, шоколад... Шоколад... Кажется, я хотела сказать что-то важное по этому поводу..."
80000101-72 = "Мне едва удалось не дать Мине вспомнить, что именно она собиралась сказать, и быстро завершить разговор."
