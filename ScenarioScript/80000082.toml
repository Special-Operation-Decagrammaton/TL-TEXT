[translation]
80000082-1 = "Автопортрет прекрасной супергениальной хакерши"
80000082-2 = "Клубная комната «Произнеси число Пи на одном дыхании»"
80000082-3 = "Химари прислала мне сообщение, вежливое как всегда: «Я буду ждать вас в убежище». Я уже собирался открыть дверь клубной комнаты."
80000082-4 = "О, Сенсей. Добро пожаловать."
80000082-5 = "Вы точно вовремя. Впрочем, от образцового педагога другого и не ожидаешь."
80000082-6 = "[s] «Да, я получил твоё сообщение. Зачем позвала?»"
80000082-7 = "Ох, Сенсей."
80000082-8 = "Как озорно с вашей стороны притворяться, будто вы ничего не знаете, хотя причина совершенно очевидна. Хи-хи."
80000082-9 = "Разумеется, вы уже знаете..."
80000082-10 = "...какой важный праздник сегодня."
80000082-11 = "[s1] «Эм, я не хотел притворяться... Я знаю, что сегодня День святого Валентина.»\n[s2] «Конечно знаю. Это особый день, который нужно провести с Химари, верно?»"
80000082-12 = "Именно! Прекрасно сказано."
80000082-13 = "Именно поэтому я вас сюда и позвала."
80000082-14 = "Хи-хи. Как и ожидалось, вы уже знали—"
80000082-15 = "П-Простите? Особый день... со мной..."
80000082-16 = "...А?"
80000082-17 = "[s3] «Сегодня День Химари! День величайшей важности!»"
80000082-18 = "П-Понятно... У вас и правда впечатляющее каменное лицо, раз вы способны говорить такие вещи..."
80000082-19 = "*кхм* Вы действительно озорник, не так ли?"
80000082-20 = "В любом случае!"
80000082-21 = "Сегодня действительно День святого Валентина."
80000082-22 = "Уверена, мне не нужно объяснять вам его значение."
80000082-23 = "Итак, без лишних слов — вот шоколад, который я принесла вам, Сенсей."
80000082-24 = ""
80000082-26 = ""
80000082-28 = "[ns] «Химари... Это...»"
80000082-29 = "Именно. Это он."
80000082-30 = "Созданный по образу меня — хрупкой, но прекрасной сверхгениальной хакерши Акебоши Химари!"
80000082-31 = "Уникальный шоколадный тиби-персонаж в единственном экземпляре!"
80000082-32 = "Я вверяю его вам как особенный и значимый подарок."
80000082-33 = "...Ну? Что скажете?"
80000082-34 = "[s] «Прекрасно. Спасибо, Химари.»"
80000082-35 = "Я рада видеть, что вы оценили!"
80000082-36 = "Хи-хи. В конце концов я приложила немало усилий."
80000082-37 = "Я лично разработала дизайн, а изготовили его на высокотехнологичном 3D-принтере для шоколада, который смог передать мельчайшие детали."
80000082-38 = "[s] «Похоже, способов делать шоколад очень много.»"
80000082-39 = "Но это не какой-то обычный шоколад. Нет-нет-нет!"
80000082-40 = "Может показаться, что это простой тиби-дизайн..."
80000082-41 = "Но присмотритесь! Видите невероятное количество деталей, вплоть до мельчайшего аксессуара!"
80000082-42 = "Разве вы не чувствуете исходящее от него достоинство?"
80000082-43 = "То самое достоинство, которое исходит от меня — бывшего президента Веритас и нынешнего президента Отряда Исследования Сверхъестественного, Акэбоши Химари?"
80000082-44 = "Более того... я бы даже сказала, что этот шоколад — часть моей души!"
80000082-45 = "Получить шоколад в образе хрупкой, но прекрасной сверхгениальной хакерши от самой этой хрупкой, но прекрасной сверхгениальной хакерши..."
80000082-46 = "Вам невероятно повезло, Сенсей."
80000082-47 = "[s] «О, э-э, да. Определённо.»"
80000082-48 = "Если бы я решила показать вам каждую заслуживающую внимания деталь этого шоколада, думаю, нам понадобилось бы больше суток."
80000082-49 = "[s] «Ещё что-то?!»"
80000082-50 = "Разумеется. Видите ли, я вложила свой интеллект и внимание не только во внешний вид шоколада, но и во вкус."
80000082-51 = "Он изготовлен из специально отобранных какао-бобов, выращенных неподалёку от Геенны."
80000082-52 = "Это продукт высшего класса и по форме, и по ингредиентам! На вкус он будет не похож ни на один шоколад, который вы ели раньше."
80000082-53 = "[s4] «Что ж, теперь я жду ещё сильнее!»\n[s5] «После такой восторженной рекомендации хочется попробовать прямо сейчас.»"
80000082-54 = "Прошу, угощайтесь."
80000082-55 = "Прошу, угощайтесь."
80000082-56 = "И когда вы распробуете этот шоколад, который является продолжением меня..."
80000082-57 = "...пожалуйста, расскажите, что думаете о вкусе!"
80000082-58 = ""
80000082-61 = ""
80000082-63 = "(Хи-хи. Сейчас Сенсей съест шоколад и расскажет мне своё мнение...)"
80000082-64 = "(Я уже вижу это: глаза Сенсея распахиваются от шока, когда он пробует—)"
80000082-65 = "(Погоди, пробует... Сенсей будет пробовать... шоколад...)"
80000082-66 = "..."
80000082-67 = "(Шоколад, который выглядит как я... который является продолжением меня... И Сенсей съест его прямо у меня на глазах?!)"
80000082-68 = "Сенсей! Стойте! Остановитесь!"
80000082-69 = "[s] «Что случилось? Я ещё не успел попробовать—»"
80000082-70 = "Подождите! Просто подождите! Пока не ешьте шоколад!"
80000082-71 = "[s] «Но ты же сказала, что хочешь услышать моё мнение.»"
80000082-72 = "Я-я сказала, да. Сказала. Но..."
80000082-73 = "Я беру слова назад! Да! Беру назад!"
80000082-74 = "[s] «Назад? Ещё секунду назад ты—»"
80000082-75 = "Нет! Этого никогда не было, потому что я всё взяла назад!"
80000082-76 = "Вам это может показаться внезапным, но это совершенно ясное и логичное..."
80000082-77 = "...исключительно логичное и разумное решение!"
80000082-78 = "Шоколад вы можете съесть..."
80000082-79 = "Позже! Когда вернётесь в Шале!"
80000082-80 = "[s] «О, э-э, хорошо...»"
80000082-81 = "Ваши мысли я смогу услышать позже..."
80000082-82 = "Хотя нет. Забудьте. Я хочу получить их письменно!"
80000082-83 = "[s] «Постой. Так гораздо сложнее!»"
80000082-84 = "Да! И именно поэтому этого будет достаточно для моего превосходного шоколада!"
80000082-86 = "После этого я поспешил обратно в Шале."
80000082-87 = "Когда я наконец попробовал шоколад, он действительно оказался настолько хорош, как утверждала Химари."
