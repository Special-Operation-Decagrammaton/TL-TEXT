[translation]
2004505-1 = "Гангстер-гид"
2004505-2 = "Получив сообщение от Пины, я приехал в кинодеревню."
2004505-3 = "Найти её удалось быстро."
2004505-4 = ""
2004505-6 = ""
2004505-7 = "Меня зовут Пина, и сегодня я буду вашим гидом!"
2004505-8 = "Мы посмотрим сценическую версию «Жизни мафиозного кота» — культового шедевра гангстерского жанра."
2004505-9 = "Она по-новому переосмысляет высоко оценённый критиками фильм «Жизнь мафиозного кота», перенося его суровые и пронзительные темы на сцену."
2004505-10 = "Живые актёры и ограниченные декорации вынуждают идти на компромиссы, но режиссёр продуманно решил передать..."
2004505-11 = "У неё такой приятный голос!"
2004505-12 = "Столько изменений... Даже не представляла, что адаптация — это так сложно!"
2004505-13 = "Мы сейчас станем свидетелями истории театра!"
2004505-14 = "...Но не верьте мне на слово! Позвольте «Жизни мафиозного кота» увлечь вас! Приятного просмотра!"
2004505-15 = ""
2004505-17 = ""
2004505-18 = "[ns1] «Пина, это было так круто!»\n[ns2] «Я увидел тебя с новой стороны — такой спокойной и собранной!»"
2004505-21 = ""
2004505-22 = ""
2004505-23 = "А, Сенсей!"
2004505-24 = "Хи-хи. Ты меня раскусил."
2004505-25 = "Мне едва удаётся сдерживать безграничную страсть к драме, интригам, чести, трагедии и АЗАРТУ гангстерского жанра!"
2004505-26 = "Но для гида также крайне важно... держать эмоции под контролем, чтобы гости получили от экскурсии максимум!"
2004505-27 = "Поэтому, как настоящий гангстер, я сохраняю холодное спокойствие и сосредотачиваюсь на миссии."
2004505-28 = "[s] «Вот это босс!»"
2004505-29 = "Эхе... Приятно получить немного признания от Сенсея!"
2004505-30 = "А, представление вот-вот начнётся! Вам тоже стоит пойти, Сенсей."
2004505-32 = "Когда поднялся занавес, зрители затихли."
2004505-33 = "Спектакль начался в мрачной и серьёзной атмосфере."
2004505-35 = "Хм... Почему они всё время говорят о «разделении чаши»? А?"
2004505-36 = "«Разделение чаши» — это ритуал, скрепляющий связь между гангстерами. Так они заключают союз."
2004505-37 = "А-а, значит, они не просто вместе выпивали ради удовольствия!"
2004505-38 = "Спасибо, теперь всё понятно!"
2004505-39 = ""
2004505-41 = ""
2004505-42 = ""
2004505-43 = "Эм, девушка? А что они имеют в виду под «инструментами»?"
2004505-44 = "А, это..."
2004505-45 = ""
2004505-47 = ""
2004505-48 = ""
2004505-49 = "[ns3] («Впечатляет... Она говорит так тихо и уважительно.»)\n[ns4] («Пина, ты потрясающая!»)"
2004505-53 = "Брат... Я взял вину на себя ради тебя, как ты мог так со мной поступить...?"
2004505-54 = "А? «Взял вину на себя»?"
2004505-55 = "Это значит взять на себя чужую провинность. Стать «козлом отпущения»!"
2004505-56 = "А?!"
2004505-57 = "Нянсукэ бессердечно бросили, хотя он искупил вину и принял на себя столько чужих обвинений..."
2004505-58 = "...а в его банде нет ни капли морали!"
2004505-59 = "Э-Эм... Понятно. Спа...сибо?"
2004505-61 = "И вот спектакль достиг кульминации. Нянсукэ наконец столкнулся лицом к лицу со своей бандой..."
2004505-63 = "Ты... Ты..."
2004505-64 = "Позорище!!!"
2004505-65 = "?!"
2004505-66 = "Нянсукэ! Соберись с силами! Ты должен отомстить!"
2004505-67 = ""
2004505-69 = ""
2004505-70 = "[ns5] «Пина?!»\n[ns6] «Ты слишком громко!»"
2004505-73 = "Праведник должен победить! Не сдавайся!"
2004505-74 = ""
2004505-76 = ""
2004505-77 = "[ns] («Всё плохо... Люди смотрят...»)"
2004505-78 = "Ч-Что это?"
2004505-79 = "Я думала, тут надо сидеть тихо?"
2004505-80 = "О... Поняла!"
2004505-81 = "Это интерактивный театр! Как необычно!"
2004505-82 = ""
2004505-84 = ""
2004505-85 = "А-а, понятно. Гид показывает нам, как нужно участвовать зрителям!"
2004505-86 = "Я всегда мечтал стать актёром!"
2004505-87 = "Дерись! Победи! Укуси его!"
2004505-88 = "Да! Вы ведь даже делили... чай, что ли!"
2004505-89 = "Да! Покончи с этим, Нянсукэ!"
2004505-90 = ""
2004505-92 = ""
2004505-93 = ""
2004505-94 = ""
2004505-95 = ""
2004505-96 = "П-П-Простите!"
2004505-97 = "Мне нечем оправдаться! Вы так хорошо играли, а я обожаю «Жизнь мафиозного кота»! Я не хотела..."
2004505-98 = "Я провалилась как гид, как посланница искусства! Меня нужно... изгнать!"
2004505-99 = "Но нет, пожалуйста, позвольте мне искупить вину...! Э-Этот мизинец, вы можете...!"
2004505-100 = "[s7] «Пина, успокойся...»\n[s8] «Я хочу извиниться от её имени. Пожалуйста, позвольте мне оплатить возвраты за билеты...»"
2004505-103 = "Ха-ха-ха!!! А у тебя талант — даже таких старых профи, как мы, застала врасплох!"
2004505-104 = "Не волнуйся. Со сцены мы видели, что всем понравилось."
2004505-105 = "Однако это единственный путь, по которому мы можем следовать к нашему истинному «я»."
2004505-106 = "Пусть это и была не та атмосфера, к которой мы стремились..."
2004505-107 = "...зато получилась... бодрящая практика, не находишь?"
2004505-108 = "Напомнило мне молодость, когда я немного увлекался методом погружения в роль."
2004505-109 = "Не падай духом. В тебе столько... вдохновляющей энергии!"
2004505-110 = "Было... весьма познавательно увидеть живую реакцию публики!"
2004505-111 = "*шмыг* Спасибо..."
2004505-112 = ""
2004505-114 = ""
2004505-115 = ""
2004505-116 = "Э-Эм, это встреча с актёрами?"
2004505-117 = "Представление было потрясающим, и я хотела сфотографироваться с труппой!"
2004505-118 = "Конечно. И вы, девушка, тоже должны присоединиться! Всё это благодаря вам."
2004505-119 = "Я, вы про меня?!"
2004505-120 = ""
2004505-122 = ""
2004505-123 = "Ну же, не стесняйтесь!"
2004505-124 = ""
2004505-127 = ""
2004505-129 = "Так представление закончилось хорошо..."
2004505-130 = "...а Пина осталась смущённой, но облегчённой — и со всеми мизинцами на месте."
