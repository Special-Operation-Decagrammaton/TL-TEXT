[translation]
102110-1 = "Эпизод 11; Операция по обороне района — Геенна"
102110-2 = "Теперь наш черёд. Все готовы?"
102110-3 = ""
102110-7 = ""
102110-8 = ""
102110-9 = ""
102110-11 = "Ждём вашего приказа, руководитель операции."
102110-12 = "Ако, президент не будет сражаться вместе с нами?"
102110-13 = "Президент Хина присоединилась к штурмовой группе как представитель Префектурной команды."
102110-14 = "Представитель Префектурной команды? Но мы все здесь..."
102110-15 = "Мы слишком зависим от президента! Именно поэтому говорят, что Префектурная команда Геенны без Хины ничего не стоит!"
102110-17 = "Ч-Что? Я просто спросила, куда она ушла!"
102110-18 = "Президент не хочет, чтобы мы её беспокоили! Мы докажем, что справимся и без неё. Поняла, Иори?!"
102110-19 = "*вздыхает*"
102110-20 = "(...Люди так думают только потому, что президент до абсурда сильная, а не потому, что мы слабые.)"
102110-21 = "*вздыхает* ...И чем в такой ситуации занимается председатель Макото из Общества Пандемониума?"
102110-22 = ""
102110-24 = ""
102110-26 = ""
102110-28 = ""
102110-29 = "Хи-хи-хи. Стараетесь, Префектурная команда."
102110-30 = "В-Вы... Сацуки из Общества Пандемониума?"
102110-31 = "Ах вы ублюдки..."
102110-32 = "Тише-тише. Давайте все успокоимся."
102110-33 = "Если начнём драться здесь, только создадим всем ещё больше проблем, разве нет?"
102110-35 = "Тц."
102110-36 = "И где так долго носилось Общество Пандемониума? Где председатель Макото?"
102110-37 = "Макото отошла по очень важному делу. Не волнуйтесь за неё."
102110-38 = "...Что вы опять задумали? Что саботируете?!"
102110-39 = "Неужели вы правда так о нас думаете? Ну же, включите голову. Как думаете, что для Общества Пандемониума важнее всего?"
102110-40 = "Праздная жизнь...?"
102110-41 = "Избиратели! Мы изо всех сил работали, чтобы обеспечить безопасность учеников Геенны!"
102110-42 = "...Э-Это смешно."
102110-44 = "Это правда, администратор."
102110-45 = "Президент Сэна...?"
102110-46 = ""
102110-47 = "Сацуки и члены Общества Пандемониума вывели учеников в убежище. Благодаря им эвакуация прошла быстро."
102110-48 = "Но их методы были немного..."
102110-50 = "Кирара, ты видела меня раньше?"
102110-51 = "Ага! Монетка на нитке? Я впервые видела такое вживую. Так работает гипноз, да?"
102110-52 = "Ага, кажется. Было ещё смешнее от того, что он вообще не сработал."
102110-53 = "Хи-хи-хи. В любом случае, я пошла вместе со всеми, потому что было весело."
102110-55 = "...Гипноз? Ещё одно странное оккультное словечко..."
102110-56 = "Это не оккультизм! Мой проект NK Ultra — чистая наука!"
102110-57 = "Ну, думаю, вы пока не понимаете. Хи-хи. Но когда я его закончу, все, кто надо мной насмехался, ещё..."
102110-58 = "У нас нет времени на эту чушь!"
102110-59 = ""
102110-61 = ""
102110-62 = "Так зачем здесь Общество Пандемониума? Ищете драки?"
102110-63 = "Ха-ха-ха! Да ну. Мы просто проходили мимо и решили вас поддержать."
102110-64 = ""
102110-66 = ""
102110-67 = ""
102110-69 = ""
102110-70 = ""
102110-72 = "Ты чувствуешь, как растёт твоя сила... а вместе с ней — непреодолимое желание поклясться в верности Обществу Пандемониума."
102110-73 = ""
102110-76 = "А теперь — щёлк пальцами...!"
