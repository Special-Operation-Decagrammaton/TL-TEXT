[translation]
3002-1 = "Тень консервов, часть 2"
3002-2 = ""
3002-5 = "Вы все тоже это слышали?"
3002-6 = "Да. Это точно кричала Мию."
3002-7 = ""
3002-10 = "На неё, должно быть, напали! Вперёд!"
3002-11 = ""
3002-15 = "Мию! Ты в порядке?!"
3002-16 = "Т-Там... в х-хранилище еды..."
3002-17 = "Где? Здесь кто-то есть?"
3002-18 = "Н-Нет... Те консервы в-вон там..."
3002-19 = "Какие именно? Банка с соусом из морепродуктов?"
3002-20 = "Д-Да... О-Она двигалась сама!"
3002-22 = ""
3002-24 = ""
3002-25 = ""
3002-26 = "...Ты что, уснула?"
3002-27 = "Мы думали, тут нарушитель... а это разумные консервы?"
3002-28 = "Ты не слишком много работаешь, Мию?"
3002-30 = "Я-Я это не придумала! И мне не снилось!"
3002-31 = "О-Обещаю... Она издавала странные щ-щёлкающие звуки и д-двигалась."
3002-32 = "Ладно, я проверю."
3002-33 = ""
3002-35 = ""
3002-38 = "Точно не живая."
3002-39 = "Похоже, между операциями ты совсем не высыпаешься."
3002-41 = "Н-Нет, она правда т-тряслась и двигалась..."
3002-42 = "При недостатке сна у людей могут начаться галлюцинации. В таком состоянии тебе нельзя дежурить!"
3002-43 = ""
3002-44 = "Я возьму ночную смену на себя. Иди отдохни."
3002-45 = "Н-Но..."
3002-47 = "Не волнуйся, не волнуйся."
3002-48 = "Говорят, старушки никогда не спят после рассвета."
3002-49 = "Эй! Кого ты старушкой назвала?!"
3002-50 = "Ладно-ладно. Спасибо, что подменишь на дежурстве, Саки."
3002-51 = ""
3002-53 = ""
3002-54 = "Остальные немного отдохнут. Если что-нибудь понадобится — скажи."
3002-56 = "...С-Спасибо, Саки. У-Удачи."
3002-57 = ""
3002-59 = ""
3002-60 = ""
3002-62 = ""
3002-63 = ""
3002-64 = ""
3002-65 = ""
3002-68 = "... *щёлк*"
3002-69 = ""
3002-75 = "...Следующим утром."
3002-76 = "Хи-хи. После долгой ночной смены завтрак ещё вкуснее."
3002-77 = "И это ещё не всё — у нас столько вариантов!"
3002-78 = ""
3002-81 = ""
3002-82 = "Спасибо за помощь прошлой ночью, Саки."
3002-83 = "Выбирай первой."
3002-84 = "Ха-ха! Спасибо, Мияко. Я возьму консервированный куриный суп с лапшой."
3002-85 = "А мне рис с красной фасолью и скумбрию, тушённую в мисо~!"
3002-86 = "Я возьму йоркширский пудинг и вегетарианский омлет."
3002-87 = "Овсяная к-каша и шоколадное печенье..."
3002-88 = "Отлично, все получили, что хотели. Что-нибудь ещё хорошее осталось?"
3002-89 = ""
3002-92 = ""
3002-93 = ""
3002-96 = "Ну... Есть ещё смесь морепродуктов в соусе... Кто-нибудь хочет? Мию?"
3002-97 = "И-И-и..."
3002-98 = "Ладно, справедливо. Я бы тоже не стала есть банку, которую, как мне показалось, я видела двигающейся."
3002-99 = "Моэ? Да ладно, ты же всё подряд ешь. Пахнет не так уж плохо!"
3002-100 = "Морепродукты в банке звучат... небезопасно..."
3002-101 = "Скумбрия в твоей руке — тоже морепродукт, вообще-то."
3002-102 = "...Мияко?"
3002-103 = "Мне и моей еды достаточно..."
3002-104 = "Тогда просто... оставим её на потом."
3002-105 = ""
3002-107 = ""
3002-109 = "Ладно, пора есть!"
3002-111 = ""
3002-112 = "Спасибо за еду!"
3002-113 = ""
3002-119 = "Так банка со смесью морепродуктов в соусе осталась забытой, пока однажды..."
3002-120 = ""
3002-126 = "...у неё не истёк срок годности."
