[translation]
1300302-1 = "Большое недоразумение"
1300302-2 = "Дневная улица полна людей."
1300302-3 = "Вдалеке я вижу ожидающую Хасуми."
1300302-4 = "Благодаря большим крыльям её легко заметить в толпе."
1300302-6 = ""
1300302-7 = "[ns] «Эй.»"
1300302-8 = "..."
1300302-9 = "Кажется, она меня не заметила."
1300302-10 = "А...!"
1300302-11 = "Откуда ты взялся? Прости. Я задумалась."
1300302-12 = "Я никогда раньше не гуляла по улицам в выходной. Не ожидала, что вокруг будет столько людей."
1300302-13 = "Удивлена, что ты вообще смог меня заметить."
1300302-14 = "[s1] «Ты выделяешься из толпы.»\n[s2] «Тебя легко заметить издалека.»"
1300302-15 = "Я-Я правда настолько выделяюсь?"
1300302-16 = "Я-Я правда настолько выделяюсь?"
1300302-17 = "Не думаю, что выгляжу настолько необычно..."
1300302-18 = "[s] «Сложно не заметить, когда они такие большие.»"
1300302-19 = "...Прошу прощения?"
1300302-20 = "Ты думаешь, они слишком большие?"
1300302-21 = "[s] «По сравнению с другими студентами Тринити они огромные.»"
1300302-22 = "Н-Нет. То есть..."
1300302-23 = "Наверное... это правда. Не могу отрицать... н-но... у некоторых они больше моих."
1300302-24 = "[s] «Прости? Я задел чувствительную тему?»"
1300302-25 = "Нет, всё нормально. Просто я не привыкла к настолько... взрослым разговорам."
1300302-26 = "Меня просто поразило... насколько прямо ты об этом говоришь."
1300302-27 = "[s3] «Прости. Я не хотел тебя шокировать.»\n[s4] «Жители Кивотоса не замечают таких вещей?»"
1300302-28 = "Всё хорошо, Сенсей. Не нужно винить себя."
1300302-29 = "Всё хорошо, Сенсей. Не нужно винить себя."
1300302-30 = "[s] «(Но крылья у неё и правда большие.)»"
1300302-31 = "..."
1300302-32 = "[s] «Тяжело с такими большими?»"
1300302-33 = "Простите?"
1300302-34 = "Н-Ну, иногда они действительно мешают... Если долго стоять в одной позе, затекают плечи, а при беге они подпрыгивают и мешают..."
1300302-35 = "Я пытаюсь похудеть в надежде, что они немного уменьшатся и перестанут так мешать."
1300302-36 = "[s] «Что?! Они уменьшаются вместе с весом?!»"
1300302-37 = "Да? К-Конечно. Ну, у меня обычно так. У разных людей немного по-разному..."
1300302-38 = "[s] «Невероятно. Сегодня я узнал что-то новое.»"
1300302-39 = "Правда...? Я бы не назвала это чем-то невероятным..."
1300302-40 = "[s5] «Хочу их потрогать!»\n[s6] «Можно их потрогать?»"
1300302-41 = "..."
1300302-42 = "..."
1300302-43 = "По..."
1300302-44 = "П-Пот..."
1300302-45 = "П-П-Потрогать?"
1300302-46 = "Прямо здесь?"
1300302-47 = "Разве это... не немного неприлично? Хотя если я соглашусь... Но соглашусь ли? Не знаю..."
1300302-48 = "..."
1300302-49 = ""
1300302-50 = ""
1300302-51 = ""
1300302-52 = ""
1300302-53 = "*вздыхает*"
1300302-54 = "Если ты правда этого хочешь, т-тогда я разрешаю...!"
1300302-55 = "Н-Но никому не рассказывай! И давай найдём место, где нас никто не увидит."
1300302-56 = "..."
1300302-57 = "[s] «Для меня честь. Мне всегда было интересно потрогать твои крылья.»"
1300302-58 = "..."
1300302-59 = "..."
1300302-60 = "О, ты имел в виду мои... крылья."
1300302-61 = "[s] «Эм... да?»"
1300302-62 = "Всё это время ты говорил... о моих крыльях."
1300302-63 = "О моих крыльях..."
1300302-64 = "Конечно."
1300302-65 = "[s] «...А ты о чём подумала?»"
1300302-66 = "Н-Ни о чём."
1300302-67 = "..."
1300302-68 = "*вздыхает*"
1300302-69 = "..."
1300302-70 = "Я только что вспомнила об очень важном деле, Сенсей! Мне срочно нужно идти!"
1300302-71 = "[s] «Погоди! А как же дать мне потрогать твои крылья?!»"
1300302-72 = "Увидимся позже!"
1300302-73 = ""
1300302-75 = "Хасуми молнией вылетела за дверь."
