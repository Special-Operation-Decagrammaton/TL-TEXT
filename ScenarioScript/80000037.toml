[translation]
80000037-1 = "Чистая награда"
80000037-2 = "Мы с Ару как раз уходили после выполнения заказа для Решал 68."
80000037-3 = "Как всегда, отличная работа, Сенсей."
80000037-4 = "[s] «И тебе.»"
80000037-5 = "Сначала я немного переживала, но мы оказались отличным дуэтом."
80000037-6 = "Выражения лиц тех хулиганов, когда мы появились, были бесценны."
80000037-7 = "Я до сих пор не могу забыть! ♪"
80000037-8 = "Когда слухи о нашей последней работе разойдутся, наша репутация взлетит до небес!"
80000037-9 = "Такими темпами каждый студент Геенны — нет, всего Кивотоса — будет дрожать, услышав имя Решал 68!"
80000037-10 = "[s] «Решалы 68... на Луну?!»"
80000037-11 = "Ха-ха! Именно!"
80000037-12 = "Но и неконтролируемый рост может навредить."
80000037-13 = "Что, если наш бизнес вырастет настолько, что обычные люди перестанут решаться к нам обращаться?"
80000037-14 = "Мы идём туда, где есть деньги, и берёмся за любую работу. Мы прикроем вас,#nпока у вас есть наличные. Так работают Решалы 68."
80000037-15 = "Запугивать обычных людей или ставить для них неподъёмные цены означало бы предать нашу миссию!"
80000037-16 = "Какая дилемма. Путь вне закона и правда одинок."
80000037-17 = "Но другого мне и не надо!"
80000037-18 = "Хе-хе-хе."
80000037-19 = "Хех..."
80000037-20 = ""
80000037-21 = "(К-Как получилось? Я сейчас звучала очень круто?#nЯ правильно создала атмосферу?!)"
80000037-22 = "Ну, думаю, для одного дня хвастовства уже достаточно..."
80000037-23 = "[s] «По крайней мере, ты всё ещё способна это осознавать.»"
80000037-24 = "Н-Не обязательно было так говорить, Сенсей!#nЯ-Я тут вообще-то пыталась создать серьёзный момент!"
80000037-25 = "В-В любом случае. Я приготовила кое-что... особенное, раз уж вы такой ценный деловой партнёр Решал 68."
80000037-26 = ""
80000037-28 = ""
80000037-30 = "[ns1] «Какой дорогой на вид шоколад!»\n[ns2] «Это подарок на День святого Валентина?»"
80000037-31 = "Н-Не поймите неправильно. Я просто, эм..."
80000037-32 = "Н-Не поймите неправильно. Я просто, эм..."
80000037-33 = "...отплачиваю вам за всю вашу тяжёлую работу!"
80000037-34 = "Я специально для вас купила премиальный валентиновский шоколад Finest Brand, Сенсей.#nЗа вашу усердную работу. Да, именно поэтому."
80000037-35 = "Впечатляет? Даже на Чёрном рынке такой премиальный шоколад достать непросто. Обязательно насладитесь каждым кусочком."
80000037-36 = "[s] «Спасибо, Ару!»"
80000037-37 = "Н-Не за что. Я думала, вам понравится..."
80000037-38 = "(Сохранять спокойствие после благодарности Сенсея оказалось сложнее, чем я думала...)"
80000037-39 = "[s] «Кстати, насчёт этого шоколада Finest Brand...»"
80000037-40 = "Это какие?"
80000037-42 = "Подходите, не стесняйтесь! Шоколад высшего качества!#n\nПокупайте первоклассный шоколад Finest Brand ко Дню святого Валентина!"
80000037-44 = "Один взгляд на этот роскошный шоколад заставит вас захотеть немедленно развернуть упаковку! Обычно такой премиальный шоколад стоит 100 000 иен и больше."
80000037-45 = "Но что это? Компания-производитель ошиблась, и теперь у нас избыток премиального шоколада! В интернете коробки всё ещё продают по полной цене, но не дайте себя обмануть!"
80000037-46 = "У нас столько товара, что мы устраиваем щедрую скидку 95 процентов от исходной цены!"
80000037-47 = "Ваш шанс насладиться роскошным премиальным шоколадом почти за бесценок!"
80000037-48 = "Кто первый пришёл — того и шоколад! Сколько коробок вам?#nОдну? Две? Может, десять?!"
80000037-49 = "А вы? Сколько коробок?"
80000037-51 = "[ns] «Вот о чём я.»"
80000037-52 = "Ч-Что за...?! Что здесь происходит?"
80000037-53 = "Я набрала в интернете «какой шоколад лучше всего на День святого Валентина»,#nи первая ссылка привела меня на страницу с этим шоколадом."
80000037-54 = "Я подумала, что это будет идеальный подарок..."
80000037-55 = "...и не раздумывая купила его по полной цене!"
80000037-56 = "[s] «Первый результат поиска всегда реклама, Ару...»"
80000037-57 = "Откуда мне было знать?!"
80000037-58 = "[s3] «Успокойся. Все иногда попадаются на вирусную рекламу.»\n[s4] «В любом случае я рад, что ты что-то мне подарила.»"
80000037-59 = "В-Вы правы. Ценность всегда относительна..."
80000037-60 = "В-Вы правы. Ценность всегда относительна..."
80000037-61 = "Главное ведь внимание, как говорится."
80000037-62 = "Как я могла забыть такую простую вещь?"
80000037-63 = "Да, меня обманули и заставили зря потратить деньги, это неприятно, но жизнь продолжается."
80000037-64 = "Что сделано, то сделано. Нет смысла жить прошлым."
80000037-65 = "Да, нужно просто двигаться дальше..."
80000037-66 = "...и забыть..."
80000037-67 = "...все эти потраченные деньги."
80000037-68 = "НЕЕЕТ! Я НЕ СОБИРАЮСЬ ДВИГАТЬСЯ ДАЛЬШЕ!"
80000037-69 = "Я не могу просто оставить это так! Неприемлемо!"
80000037-70 = ""
80000037-72 = ""
80000037-73 = "Хех. Они сильно ошибаются, если думают, что им это сойдёт с рук!"
80000037-74 = "«На доверие отвечают доверием! А за преданное доверие придётся заплатить!»#nВот путь Решатели проблем 68!"
80000037-75 = "[s] «Первую половину я уже слышал, но вот вторую — нет...»"
80000037-76 = "Мне лишь нужно ввести в интернете «адрес Finest Brand Chocolate» и проверить первый результат. После этого можно начинать планировать контратаку..."
80000037-77 = "[s] «Эм, Ару?»"
80000037-78 = "Я всё решила, Сенсей! У нас ещё есть работа!"
80000037-79 = "В конце концов работа Решатели проблем 68 не заканчивается, пока ты не вернёшься в офис."
80000037-80 = "Вы же пойдёте со мной, правда, Сенсей?"
80000037-81 = "[s] «Если ты этого хочешь.»"
80000037-82 = "Хи-хи. Вот это мой надёжный деловой партнёр! ♪"
80000037-83 = "Ну что ж! Покажем им, на что способен настоящий преступник!"
80000037-85 = "И так мы с Ару снова ввязались в очередную крутую авантюру, но это уже история для другого раза."
