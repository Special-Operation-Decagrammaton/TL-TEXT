[translation]
2000003-1 = "Пламя в моём сердце"
2000003-2 = "Коридор Милленниума"
2000003-3 = "(Хибики попросила меня приехать в Миллениум.)"
2000003-4 = "*БА-А-АХ*"
2000003-5 = "[s1] «...?!»\n[s2] «Взрыв?»"
2000003-11 = "Инженерный отдел Миллениума"
2000003-12 = "*кашляет* *кашляет*"
2000003-13 = "Может, мы использовали слишком много пороха? Я никогда не говорила, что разбираюсь в химии..."
2000003-14 = "А?"
2000003-15 = "Сенсей...?"
2000003-16 = "[s3] «Что происходит?»\n[s4] «Я слышал взрыв.»"
2000003-20 = "Это...? Ничего страшного."
2000003-21 = "Вот об этом я тебе и писала. Я собираю машину для фейерверков!"
2000003-22 = "Хяккияко славится своими шоу фейерверков..."
2000003-23 = "...а Миллениум помогает готовить ночной фестиваль."
2000003-24 = "И вот тут появляюсь я. Я делаю устройство, благодаря которому это шоу никто не забудет."
2000003-25 = "А взрыв был... всего лишь небольшой неудачей."
2000003-26 = "В общем, я позвала тебя, потому что хочу кое-что показать."
2000003-27 = "Я работаю над устройством, которое создаёт фейерверки чисто с помощью науки и технологий, без старомодной химии."
2000003-28 = "Это совершенно новый тип машины! Я разработала проектор реалистичных голограмм!"
2000003-29 = "[s5] «Голограммы — это картинки, которые запускают в небо?»\n[s6] «Потрясающе... но разве это не лишает всё смысла?»"
2000003-30 = "Именно. Я называю это объёмным дисплеем."
2000003-31 = "Ну, нельзя сказать, что раньше такого совсем не существовало."
2000003-32 = "Голографические технологии используются уже давно."
2000003-33 = "Знаешь эти блестящие элементы на деньгах и банковских картах для защиты от подделок? Это тоже разновидность голограммы."
2000003-34 = "Короче говоря, этот проектор сможет показывать в ночном небе самые разные фейерверки."
2000003-35 = "И это будет намного безопаснее настоящих фейерверков с порохом. Если хватит ресурсов, можно запускать сколько угодно."
2000003-36 = "А? Думаешь, чего-то не хватает?"
2000003-37 = "Голографические фейерверки не произведут такого впечатления, как настоящие?"
2000003-38 = "Вот тут ты ошибаешься! Именно то, что они голографические, делает их уникальными."
2000003-39 = "Думаю, они могут быть ничуть не хуже, а то и лучше настоящих!"
2000003-40 = "Хотя... ты выглядишь не слишком убеждённым."
2000003-41 = "Может, ты знаешь о фейерверках больше меня."
2000003-42 = "Ладно. Тогда послушаю твоё мнение."
2000003-43 = "А как насчёт этого? На него я потратила не столько времени, сколько на голограммы..."
2000003-44 = "...но оно светится, выпускает цветной дым и умеет выдавать отличный финальный взрыв."
2000003-45 = "Это самое близкое к настоящему фейерверку решение, которое у меня есть."
2000003-46 = ""
2000003-48 = "[ns7] «Не знаю, что думать о том, что ты используешь такую вещь.»\n[ns8] «Ух ты, как здорово!»"
2000003-49 = "Ну, однажды оно сожгло убежище преступного синдиката."
2000003-50 = "Ну, однажды оно сожгло убежище преступного синдиката."
2000003-51 = "Тогда люди кричали во всё горло... Это ведь почти как шоу фейерверков, да?"
2000003-52 = "Что, и это не подойдёт? Ни за что на свете?"
2000003-53 = "Жаль. Я всегда могу просто повторить тот взрыв, что устроила раньше, и назвать его фейерверком."
2000003-54 = "Но это же слишком легко! Где тогда веселье?"
2000003-55 = "..."
2000003-56 = "*вздох* Как же неловко."
2000003-57 = "Я просто хотела впечатлить тебя чем-нибудь крутым."
2000003-58 = "[s] «Ты всегда меня впечатляешь, Хибики.»"
2000003-59 = "..."
2000003-60 = "Хи-хи. Спасибо."
2000003-61 = "Стой! Эти переключатели лучше не трогать."
2000003-62 = "Один из них запускает эту ракету."
2000003-63 = "[s9] *щёлк*\n[s10] «Рука соскользнула.»"
2000003-64 = "А..."
2000003-65 = "А..."
2000003-66 = ""
2000003-67 = "*вж-ж-ж*"
2000003-68 = "О нет... Она запустилась!"
2000003-70 = "*БА-А-АХ*"
2000003-71 = "..."
2000003-73 = "В итоге все студенты Миллениума получили внеплановое шоу фейерверков, когда ракета врезалась в башню Миллениума."
