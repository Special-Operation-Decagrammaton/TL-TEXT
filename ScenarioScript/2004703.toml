[translation]
2004703-1 = "Не отпускай"
2004703-2 = "На следующий день, на пляже."
2004703-6 = ""
2004703-7 = "[ns] «Эм, Кикё?»"
2004703-9 = "[ns] «Ты на меня злишься?»"
2004703-10 = "А?"
2004703-11 = "Я? С чего бы?"
2004703-12 = "Свежий морской бриз, шум разбивающихся передо мной волн, вид сияющего океана..."
2004703-13 = "...и вы, плавающий в воде."
2004703-14 = "Что в этой картине вообще может меня раздражать?"
2004703-15 = "[s] «Тогда хватит смотреть и иди сюда.»"
2004703-16 = "Э-Это..."
2004703-17 = "Перед любой физической нагрузкой необходимо правильно размяться."
2004703-18 = "Вот и всё."
2004703-19 = "[s] «Читать книгу под зонтиком — это разминка...?»"
2004703-20 = "Знания тоже своего рода разминка."
2004703-21 = "В этом пособии есть всё, что только можно пожелать знать о плавании: от основ до практического применения."
2004703-22 = "Его даже включили в список «Обязательного чтения на летних каникулах»."
2004703-23 = "Я должна провести надлежащее исследование, чтобы гарантированно не утонуть."
2004703-24 = "[s] «Говорят же, лучше один раз увидеть, чем сто раз услышать, верно?»"
2004703-25 = "А ещё говорят: не зная броду, не суйся в воду."
2004703-26 = "Я операционный офицер Хяккарёран. Моя работа — готовиться к любым возможным рискам."
2004703-27 = "[s] «По прогнозу сегодня море спокойное.»"
2004703-28 = "Вот как? А что вы будете делать, если гигантский кальмар решит воспользоваться хорошей погодой?"
2004703-29 = "Между прочим, в последнее время их часто замечают."
2004703-30 = "Вы не можете гарантировать, что один из них сегодня не появится."
2004703-31 = "[s] «Всё будет нормально! Совершенно нормально!»"
2004703-32 = "Вот как? И на каком исследовании основано ваше—"
2004703-33 = ""
2004703-35 = ""
2004703-36 = "*вздох* Вы правда настолько сильно хотели поплавать со мной?"
2004703-37 = "...Хорошо. Только не кивайте так яростно. Это смущает."
2004703-38 = "(Всё будет хорошо... Я запомнила пособие...)"
2004703-39 = "Я зайду только по пояс. Не дальше."
2004703-40 = "При любом происшествии немедленно отступаю на берег. Понятно?"
2004703-41 = "..."
2004703-42 = "...Какая странная мысль только что пришла вам в голову?"
2004703-43 = "Я не испытываю неприязни к воде."
2004703-44 = "[s3] «Что значит „странная“...?»\n[s4] «Ты прямо как кошка, такая милая!»"
2004703-47 = "...!"
2004703-48 = "Ч-Что за чепуху вы опять несёте?"
2004703-49 = "Вы действительно непредсказуемы. Во всех отношениях."
2004703-50 = "Ну..."
2004703-51 = ""
2004703-53 = ""
2004703-54 = "Тогда сопровождайте меня."
2004703-55 = "Известно, что кошки робеют на незнакомой территории."
2004703-56 = "Следовательно, сегодня ваша обязанность — сопровождать меня."
2004703-57 = "[s5] «Тогда можно надеть на тебя кошачью шлейку?»\n[s6] «Чтобы мы не потерялись!»"
2004703-60 = "Шлейку? И где вы вообще такую найдёте?"
2004703-61 = "[s] «Можно использовать нитку для игры в кошачью колыбель!»"
2004703-62 = "...Сенсей, вам стоит осторожнее с поддразниваниями."
2004703-63 = "Вы действительно верите, что сможете осуществить этот свой план?"
2004703-64 = "Я ведь не стану безучастно сидеть, пока вы связываете меня ниткой."
2004703-65 = "[s] «Тогда остановимся на том, что будем держаться за руки!»"
2004703-66 = "...Понятно."
2004703-67 = "Сначала выдвинуть более крупное требование, а затем перейти к меньшему, «настоящему»... Пожалуй, сегодня поставлю вам зачёт по переговорам."
2004703-68 = ""
2004703-70 = ""
2004703-71 = "...Хорошо.#nНо, что бы ни случилось, не отпускайте."
2004703-76 = "Прохладно и приятно... Хотя волны немного пугают."
2004703-77 = "Сама я, вероятно, никогда бы не зашла так далеко—"
2004703-78 = "...Стойте. Насколько далеко вы вообще собираетесь идти?"
2004703-79 = "Я совершенно ясно сказала, что не пойду глубже, чем по пояс."
2004703-80 = "...Вы видите черепаху дальше?"
2004703-81 = "Полагаю... это вызывает у меня интерес."
2004703-82 = "Нет. Категорически нет. Если вам любопытно, идите один. Я останусь ровно здесь."
2004703-83 = "...А?"
2004703-84 = "Простите. Я давала вам разрешение отпустить мою руку?"
2004703-85 = "Держите крепко."
2004703-86 = ""
2004703-90 = "Хм? Что вы пытаетесь...?"
2004703-91 = "Кья...!"
2004703-92 = ""
2004703-94 = ""
2004703-99 = "Я подхватил очень нервничающую Кикё на руки по-принцессиному и отнёс её к черепахе."
2004703-100 = "После этого мы вдвоём наслаждались мелководьем до самого заката."
