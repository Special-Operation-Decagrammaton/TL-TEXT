[translation]
52220-1 = "Эпизод 22;Фестиваль должен продолжаться"
52220-4 = ""
52220-5 = "Кахо, Кахо!"
52220-6 = "...Что теперь? Почему ты в такой панике?"
52220-7 = "До начала Фестиваля Вараку меньше часа. Надеюсь, дело настолько срочное, насколько ты показываешь. Иначе этим должна заниматься Ния в комнате клуба Инь-Ян."
52220-8 = "Или... только не говори, что Ния опять сбежала?"
52220-9 = "Да, Ния опять исчезла. Но важнее другое..."
52220-10 = "Сейчас?! Именно сейчас?! Я предупреждала её до посинения, что в этот раз её обычные уловки не пройдут."
52220-11 = "Но что может быть важнее безответственности нашей президентки?"
52220-12 = "Что может быть срочнее её исчезновения прямо перед началом Фестиваля Вараку?"
52220-13 = "Только не говори, что с моей милой богиней Чисэ что-то случилось..."
52220-14 = "Я здесь!"
52220-15 = "А, Чисэ. Какое облегчение."
52220-16 = "Ну, раз дело не связано с Чисэ, я вообще не вижу проблемы."
52220-17 = "...Думаю, будет проще, если ты сама придёшь и посмотришь."
52220-20 = ""
52220-21 = "Что за...?"
52220-22 = "Это... глаза? По всему району?"
52220-23 = "Глазные яблоки... катятся, катятся, катятся..."
52220-24 = "Да! Всего несколько минут назад они появились из ниоткуда — буквально везде!"
52220-25 = "Шизуко из Фестивального отдела понятия не имеет, откуда они взялись, поэтому мы подумали, может, это какой-то особый аттракцион, который вы подготовили для Фестиваля Вараку."
52220-26 = "Этот фестиваль создан, чтобы показать всем очаровательную милоту Чисэ! Ты думаешь, я стала бы украшать его этими... штуками?!"
52220-27 = "Но если даже Шизуко ничего не знает, эти глаза, должно быть..."
52220-32 = ""
52220-33 = "Этот тревожный взгляд... В нём есть что-то странно знакомое."
52220-34 = "Кахо, а можно устроить соревнование «кто кого пересмотрит» с тем большим глазом?"
52220-35 = "Ни в коем случае!"
52220-37 = ""
52220-38 = "Ух, что это вообще за глазные яблоки?"
52220-39 = "Жуткие... Смотрите! Оно моргает! Думаете, они живые?"
52220-40 = "Может, если выстрелить, они испугаются и... укатятся?"
52220-41 = "П-Подождите! Пока мы не знаем, с чем имеем дело, лучше вообще не вступать в контакт—"
52220-42 = ""
52220-44 = ""
52220-45 = "Пуля... прошла насквозь?"
52220-46 = "Какого чёрта?! Будто я стреляла в какую-то иллюзию!"
52220-47 = ""
52220-49 = ""
52220-50 = ""
52220-51 = ""
52220-52 = ""
52220-53 = ""
52220-54 = "А, их становится больше!"
52220-55 = "Это разве не тот монстр с прошлого пожара?!"
52220-56 = "Это уже не наш уровень... Бежим!"
52220-57 = ""
52220-59 = ""
52220-60 = "...Духи артефактов."
52220-61 = "Это работа «Красоты природы»."
52220-62 = "Именно сейчас, когда Хяккарёран отсутствует..."
52220-63 = "Или, возможно... именно поэтому они и выбрали этот момент. Как бы там ни было, ситуация плохая."
52220-64 = "Ч-Что делать, вице-президент?"
52220-65 = "Сначала передайте сообщение всем гостям и персоналу на территории фестиваля. Ни в коем случае не вступать в бой с монстрами!"
52220-66 = "Все доступные сотрудники должны сосредоточиться на безопасной эвакуации каждого гражданского!"
52220-67 = "Н-Но... эти глаза повсюду. Куда вообще вести людей?"
52220-68 = "Н-Ну..."
52220-70 = "Вице-президент Кахо! Помимо глаз появились те же монстры из старых предметов, что и в прошлый раз! Они атакуют всех подряд!"
52220-71 = "Будто они нас ждали... Перекрыли все пути отхода!"
52220-72 = "От их взгляда не скрыться!"
52220-73 = ""
52220-77 = "Нам придётся отменить фестиваль?"
52220-78 = "Что делать, вице-президент?"
52220-80 = "...Ния."
52220-81 = "Если бы Ния хотя бы была здесь..."
52220-82 = "Максимум, что я могу — оценить ситуацию и поддерживать безопасность и порядок..."
52220-83 = "Составить план контратаки выше моих возможностей..."
52220-84 = ""
52220-87 = "...Кахо."
52220-88 = "Прости, Чисэ."
52220-89 = "Вся твоя тяжёлая работа... и теперь нам придётся отменить Фестиваль Вараку—"
52220-90 = "Нет. Не это."
52220-91 = "Смотри. Ниндзя."
52220-92 = "Ниндзя...?"
52220-94 = ""
52220-97 = ""
52220-98 = "Исследовательский клуб ниндзюцу прибыл!"
52220-99 = "Кахо! Ты цела!"
52220-100 = "Мы задержались... из-за монстров... Пришлось от них оторваться!"
52220-102 = "Исследовательский клуб ниндзюцу? Как вы...?"
52220-103 = "Вы пришли помочь победить этих монстров?"
52220-104 = "Эм, да! Технически! Но на самом деле у нас срочное сообщение!"
52220-105 = "Да, Сенсей [USERNAME] поручил нам очень важную миссию...!"
52220-106 = "И ещё у нас сообщение от Нии! Нин-нин!"
52220-107 = "Сенсей [USERNAME]...? И сообщение от Нии...?"
52220-109 = "Примерно за тридцать минут до этого..."
52220-111 = ""
52220-112 = "Нья-ха-ха... Как неловко."
52220-113 = "Даже будучи тенью, сражаться с президентом Хяккарёран совсем не прогулка."
52220-114 = "Аямэ действительно оправдывает свою репутацию, правда?"
52220-115 = ""
52220-118 = ""
52220-119 = "Полагаю, её история о призраках примерно сейчас начнёт распускать щупальца по всему Хяккияко."
52220-120 = "Всё прошло ровно так, как я ожидала... кроме того, что сама оказалась здесь, внизу. Теперь остаётся лишь наблюдать финальные акты."
52220-121 = "Ай-яй. Надо было всё-таки приготовить хотя бы один козырь в рукаве."
52220-122 = ""
52220-125 = ""
52220-126 = ""
52220-128 = "Ния!"
52220-129 = "Президент Ния, мы пришли вас спасать!"
52220-130 = "В-Вы в порядке, президент Ния?"
52220-131 = "...Исследовательский клуб ниндзюцу? Как вы меня нашли...?"
52220-132 = "Мы втроём всё время следовали за вами!"
52220-133 = "Видите ли, перед отъездом Сенсей поручил нам особую миссию."
52220-134 = "Сенсей...?"
52220-135 = "Д-Да, госпожа! Он переживал... что пока Хяккарёран отсутствует, кто-то может напасть на клуб Инь-Ян. Поэтому попросил нас тайно охранять вас, президент Ния..."
52220-136 = "Фу-фу. А действовать из тени, обеспечивая незаметную защиту, — путь ниндзя!"
52220-137 = "...То есть вы хотите сказать, что просто стояли и смотрели, пока на меня нападала тень Аямэ?"
52220-138 = ""
52220-140 = ""
52220-141 = "Н-Ну... Это же произошло совершенно внезапно! Нас застали врасплох!"
52220-142 = "Да и если честно, мы всё равно ничего не могли бы сделать против неё..."
52220-143 = "Да... от одного взгляда на её движения... мне стало слишком страшно что-то предпринимать..."
52220-144 = "Иногда просто нужно понимать, какую битву выбирать!"
52220-145 = "Избегай невыгодной ситуации и бей врага, когда он меньше всего ожидает! Это тоже путь ниндзя!"
52220-146 = "Поэтому мы следовали за вами, пока вы не остались одна!"
52220-147 = "Ого, президент! Вот так мы работаем — хитренько!"
52220-148 = "Это идеальный шанс! Мы вытащим тебя отсюда, Ния!"
52220-149 = "...Нет. Время для бегства давно прошло."
52220-150 = "А...? Что... ты имеешь в виду?"
52220-151 = "Хитоцумэ и Духи артефактов уже распространились по всему Хяккияко."
52220-152 = "И от взгляда Хитоцумэ ничего не ускользает."
52220-153 = "Пока Хяккияко находится под его наблюдением, спрятаться негде."
52220-154 = "Попытаемся ли мы покинуть Хяккияко или войти обратно — Аямэ и Фантомное сказание будут там."
52220-155 = "На самом деле они могут наблюдать за нами даже сейчас, пока мы разговариваем."
52220-156 = "Наш план раскрыт? О-Откуда они смотрят?"
52220-157 = ""
52220-159 = ""
52220-160 = ""
52220-161 = "Оттуда?! Или вон оттуда?!"
52220-162 = "Ч-Что нам делать...? Если они видят все наши планы... нас всех поглотит мир духов..."
52220-163 = "Нет, Цукуё! Мы не можем сдаваться!"
52220-164 = "Ниндзя всегда исполняет приказ господина! Как бы ни было опасно и какой бы ни была цена!"
52220-165 = "Фу-фу. Мне нравится ваш стиль."
52220-166 = "Мы отрезаны и зажаты, но худший ответ — не делать ничего."
52220-167 = "Поэтому поступим как всегда. Будем сохранять равновесие."
52220-168 = "Участницы Исследовательского клуба ниндзюцу, вместо того чтобы спасать меня, передайте сообщение Кахо на Фестивале Вараку."
52220-169 = ""
52220-171 = ""
52220-172 = "...Фестиваль должен продолжаться."
52220-173 = ""
52220-174 = "Ния... так сказала?"
52220-175 = "Правда? Она хочет провести Фестиваль Вараку в таких условиях? О чём она вообще думает?"
52220-176 = "Н-Но раз она президент клуба Инь-Ян... у неё наверняка есть какой-то план, да?"
52220-177 = "Ния сказала что-нибудь ещё?"
52220-178 = "Эм... Она сказала, что клуб Инь-Ян должен делать то, что делал всегда: поддерживать равновесие в Хяккияко."
52220-179 = ""
52220-181 = ""
52220-182 = "...Хм."
52220-183 = "Участницы Исследовательского клуба ниндзюцу, простите, что прошу после такого пути, но можно ещё одну услугу?"
52220-184 = "Да! Оставьте это Изуне!"
52220-185 = "Пожалуйста, немедленно приведите сюда Шизуко из Фестивального отдела."
52220-186 = ""
52220-188 = ""
52220-190 = "Как только Шизуко прибудет, мы устроим фестиваль, который никто никогда не забудет!"
52220-192 = "Следующий эпизод;Праздничные песни для всех"
