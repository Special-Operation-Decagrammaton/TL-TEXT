[translation]
52220-1 = "Episódio 22;O Festival Continua"
52220-5 = "Kaho-sama... Kaho-sama!"
52220-6 = "...Qual é a pressa toda? O que aconteceu desta vez?"
52220-7 = "Falta menos de uma hora para o início do Festival Waraku.#nEu deveria ter deixado claro que, fora emergências, era para falar com a Niya-sama na sala do clube."
52220-8 = "Não me diga que a Niya-sama de novo...?"
52220-9 = "Sim. Ela sumiu de novo... Mas, mais importante do que isso..."
52220-10 = "A-Até numa hora dessas...?!#nE olha que eu implorei tanto para ela levar a sério desta vez...!"
52220-11 = "Ah, e o que seria esse \"mais importante\"...?"
52220-12 = "Há um problema mais grave do que a Niya-sama desaparecer logo antes do Festival Waraku?"
52220-13 = "Por acaso aconteceu algo com a nossa protagonista e idol suprema, a Chise-chan—"
52220-14 = "Tô bem aqui~"
52220-15 = "Ah, Chise-chan. Que alívio, você está bem."
52220-16 = "Nesse caso, o que exatamente aconteceu...?"
52220-17 = "Bem... acho que é mais rápido se a senhora for lá fora ver."
52220-21 = "M-Mas o que é isso...?"
52220-22 = "A academia inteira está coberta por globos oculares..."
52220-23 = "Tem um montão por todo lado~"
52220-24 = "...Agora há pouco, aqueles olhos surgiram de repente perto do local do festival."
52220-25 = "A Shizuko-san do Comitê de Organização de Festivais disse que não fazia ideia do que era, então achei que fosse alguma atração preparada pela Kaho-sama..."
52220-26 = "Eu jamais usaria algo tão medonho de decoração para destacar a fofura da Chise-chan!"
52220-27 = "Mas nem a Shizuko-san sabe do que se trata..."
52220-33 = "Espera, aquele olhar sinistro... eu já vi isso em algum lugar..."
52220-34 = "Kaho~, posso brincar de encarar com aquilo ali~?"
52220-35 = "De jeito nenhum!"
52220-38 = "Eca, que olho é esse?"
52220-39 = "Que nojo... ele tá piscando?!"
52220-40 = "Será que eu atiro? Vai que ele se assusta e foge."
52220-41 = "E-Espere! Não provoque sem pensar antes de sabermos o que é—"
52220-45 = "As balas... atravessaram?"
52220-46 = "Não fez nem cócegas..."
52220-54 = "Uau, se multiplicou?!"
52220-55 = "Aliás, isso aí... não é o monstro daquele incêndio da outra vez...?!"
52220-56 = "N-Não dá pra gente encarar isso! Fujam!"
52220-60 = "...Tsukumogami."
52220-61 = "Isso é obra do Clube Beleza da Natureza."
52220-62 = "Logo agora que o Hyakkaryouran não está aqui..."
52220-63 = "Não, provavelmente é justamente por isso... De qualquer forma, não poderia haver hora pior."
52220-64 = "K-Kaho-sama. O que nós fazemos...?"
52220-65 = "Primeiro, avise todos os visitantes e a equipe para evitarem qualquer confronto com aqueles \"olhos\"!"
52220-66 = "E evacue todo mundo para o mais longe possível!"
52220-67 = "M-Mas parece que aqueles olhos apareceram pela academia inteira. Para onde a gente vai fugir...?"
52220-68 = "I-Isso é...!"
52220-70 = "Vice-Presidente Kaho! Além daqueles olhos, os monstros que apareceram da última vez também surgiram! Eles estão atacando os cidadãos!"
52220-71 = "É como se estivessem de emboscada—"
52220-72 = "Não há para onde fugir!"
52220-77 = "Desse jeito, o Festival Waraku terá que ser cancelado..."
52220-78 = "Kaho-sama, o que fazemos...?!"
52220-80 = "...Niya-sama."
52220-81 = "Se ao menos a Niya-sama estivesse aqui."
52220-82 = "Tudo o que eu consigo fazer é analisar e organizar a situação atual..."
52220-83 = "Virar esse jogo é..."
52220-87 = "...Kaho."
52220-88 = "Sinto muito, Chise-chan."
52220-89 = "Você se dedicou tanto aos preparativos até hoje, mas desta vez o Festival Waraku—"
52220-90 = "Não, não é isso."
52220-91 = "Tem ninjas ali~"
52220-92 = "Ninjas...?"
52220-98 = "Clube de Pesquisa Ninjutsu, apresentando-se!"
52220-99 = "Kaho-dono, você está sã e salva!"
52220-100 = "O-Os monstros apareceram de repente... e acabamos nos atrasando!"
52220-102 = "Pessoal do Clube de Pesquisa Ninjutsu, o que fazem aqui...?"
52220-103 = "Por acaso vieram nos ajudar?"
52220-104 = "Com certeza!"
52220-105 = "Foi um pedido do Sensei [USERNAME]!"
52220-106 = "E trazemos aqui um recado da Niya-dono! Nin-nin!"
52220-107 = "Sensei [USERNAME]...?#nE da Niya-sama também...?"
52220-109 = "(Cerca de 30 minutos antes...)"
52220-112 = "Nyaha... Que estado lamentável o meu, hein."
52220-113 = "Mesmo sendo apenas uma sombra falsa, não dá para derrubá-la facilmente."
52220-114 = "Essa Presidente Ayame é dura na queda mesmo~"
52220-119 = "Então a história de terror começou."
52220-120 = "Até aqui estava dentro do previsto... mas, estando trancada aqui, fico sem ter o que fazer."
52220-121 = "Aaah~... Já não tenho mais nenhuma carta na manga..."
52220-128 = "Niya-dono!"
52220-129 = "Viemos te resgatar!"
52220-130 = "V-Você está ferida?"
52220-131 = "Pessoal do Clube de Pesquisa Ninjutsu...? O que fazem aqui...?"
52220-132 = "Na verdade, estávamos te seguindo há algum tempo!"
52220-133 = "O Sensei-dono nos pediu para fazer a sua escolta."
52220-134 = "O Sensei pediu a vocês...?"
52220-135 = "S-Sim! Ele disse que o Clube Yin-Yang poderia virar alvo enquanto o Hyakkaryouran estivesse ausente."
52220-136 = "Hehe, vigiar silenciosamente das sombras... é exatamente o dever de um ninja!"
52220-137 = "Ou seja... vocês também estavam só vigiando enquanto eu lutava contra a sombra da Presidente Ayame?"
52220-141 = "Bem... é que... digamos que a gente levou um susto e travou..."
52220-142 = "E meio que pareceu que, mesmo se a gente ajudasse, não íamos conseguir parar a Presidente Ayame..."
52220-143 = "Sim... ficamos tão intimidadas que não conseguimos dar nem um passo..."
52220-144 = "M-Mas! O forte de um ninja não é o confronto direto, né!"
52220-145 = "\"A pressa é inimiga da perfeição\"! Evitamos situações desfavoráveis e agimos furtivamente na hora certa!"
52220-146 = "Desde o começo, estávamos esperando exatamente o momento em que a Niya-dono ficasse sozinha!"
52220-147 = "Incrível como sempre, Presidente! É a arte dos passos silenciosos, né!"
52220-148 = "Vamos, Niya-dono! Vamos fugir daqui enquanto dá tempo!"
52220-149 = "...Agradeço a oferta, mas acho que vai ser difícil."
52220-150 = "Hein...?! P-Por quê?"
52220-151 = "Porque agora Hyakkiyako inteira está cheia de Hitotsume por todo lado."
52220-152 = "Os Hitotsume tudo observam e tudo enxergam."
52220-153 = "Enquanto aqueles olhos estiverem em Hyakkiyako, absolutamente tudo que acontecer aqui vai vazar."
52220-154 = "Seja para sair ou entrar em Hyakkiyako, eles vão perceber e nos interceptar antes."
52220-155 = "Talvez até esta conversa... eles estejam espiando agora mesmo, não é?"
52220-156 = "O-O quê?! Nosso plano foi totalmente descoberto?! O-Onde eles estão?!"
52220-161 = "A-Ali?! Ou será que é aqui?!"
52220-162 = "O-O que vamos fazer... se qualquer plano que fizermos for descoberto..."
52220-163 = "Tsukuyo-dono! Não podemos desistir!"
52220-164 = "Se é um pedido do Meu Senhor, dar tudo de si em qualquer missão perigosa é o dever de um ninja!"
52220-165 = "Hehe, muito bem dito."
52220-166 = "Isoladas, sem reforços e sem saída. Ainda assim, não fazer nada seria a maior tolice."
52220-167 = "Mesmo que estejam nos observando, basta fazermos tudo exatamente como sempre fizemos."
52220-168 = "Pessoal do Clube de Pesquisa Ninjutsu, posso pedir um favor... levem um recado para a Kaho lá no local do festival."
52220-172 = "—Digam que o festival deve continuar, aconteça o que acontecer."
52220-174 = "A Niya-sama... disse isso mesmo?"
52220-175 = "Disse sim! Ela tá falando sério que quer fazer o festival nessa situação?!"
52220-176 = "M-Mas se a Presidente do Clube Yin-Yang disse isso..."
52220-177 = "Por acaso ela não disse mais nada além disso?"
52220-178 = "Hum... ela disse que o Clube Yin-Yang é a organização que mantém o equilíbrio de Hyakkiyako, então basta manter a harmonia exatamente como sempre..."
52220-182 = "...Entendo."
52220-183 = "Pessoal do Clube de Pesquisa Ninjutsu, perdoem o incômodo...#nPoderiam atender a mais um pedido meu?"
52220-184 = "Sim, o que desejar!"
52220-185 = "Poderiam trazer a Shizuko-san do Comitê de Organização de Festivais até aqui imediatamente?"
52220-190 = "Assim que a Shizuko-san chegar... o Festival Waraku será realizado conforme o planejado!"
52220-192 = "Próximo;Canção de Harmonia nos Quatro Cantos"
