[translation]
1001706-1 = "Убийца снежных полей"
1001706-2 = "Спортивная площадка академии Красная Зима"
1001706-3 = "*бах*"
1001706-4 = "Я получил сообщение от Черино и отправился в академию Красная Зима. Как только пришёл, мне тут же прилетел снежок в спину."
1001706-5 = "Ха-ха-ха! Вас застали врасплох, Товарищ!"
1001706-6 = "Мир снежных битв жесток! Если ходить по снежному полю с опущенной защитой, промокнете насквозь ещё до того, как упадёте на землю!"
1001706-7 = "Любую заснеженную территорию следует считать полем боя! Ха-ха-ха!"
1001706-8 = "Так, во что сыграем теперь?"
1001706-9 = "[s1] «Давай устроим битву снежками.»\n[s2] «Давай слепим снеговика.»"
1001706-10 = "Хи-хи... Вы только что вызвали меня, Убийцу снежных полей, на битву снежками?"
1001706-11 = "Какой безрассудный выбор, Товарищ! Для начала разомнёмся и слепим снеговика."
1001706-12 = "Хорошая идея, Товарищ!"
1001706-13 = "Мы слепим самого крутого снеговика... такого, которым не смогут не восхищаться все в академии Красная Зима!"
1001706-14 = "Давайте устроим соревнование, кто слепит самого крутого снеговика!"
1001706-18 = "― Снеговик с усами![wa:440]"
1001706-20 = "― Ещё больше, чтобы он стал самым большим в мире! Товарищ![wa:1440]"
1001706-23 = "― Ай![wa:80]"
1001706-26 = "― А! Нападение?[wa:690]"
1001706-28 = "― Хорошо. Вызов принят, Товарищ![wa:1810]"
1001706-31 = "― Хи-хи-хи.[wa:290]"
1001706-34 = "― Этого будет мало.[wa:730]"
1001706-36 = "― Ещё немного больше. Надо сделать его больше.[wa:290]"
1001706-39 = "― А... А... Апчхи! *шмыгает носом*[wa:3790]"
1001706-42 = "― Ба, не мешайте мне! Не видите, я сейчас начеку?[wa:630]"
1001706-45 = "― Мне холодно? Это у вас хрупкое тело, Товарищ![wa:2310]"
1001706-48 = "― Пустяки![wa:820]"
1001706-50 = "― Я могла бы играть ещё три часа![wa:100]"
1001706-53 = "― Я кое-что придумала, Товарищ.[wa:730]"
1001706-55 = "― Вы слепите снеговика там![wa:350]"
1001706-58 = "― А то, что мы слепили здесь,"
1001706-60 = "― поставим рядом!"
1001706-63 = "― Хм? Почему? Разве так нельзя?[wa:1660]"
1001706-66 = "― Может,[wa:240]"
1001706-68 = "― слепим маленького снеговика между этими двумя?[wa:80]"
1001706-71 = "― А! Н-но[wa:740]"
1001706-73 = "― только если вы не против, Товарищ![wa:10]"
1001706-76 = "Готово! Смотрите, Товарищ. Мой снеговик закончен!"
1001706-77 = "Включая изысканные угловатые усы, уровень исполнения у моего снеговика, если позволите заметить, очень высокий. Я полностью довольна!"
1001706-78 = "А как выглядит ваш снеговик, Товарищ?"
1001706-79 = "Покажите. Г-где...?"
1001706-80 = ""
1001706-81 = ""
1001706-82 = "Ого!"
1001706-83 = ""
1001706-85 = ""
1001706-87 = "Что вы делаете, внезапно бросая в меня снежок?"
1001706-88 = "Что? Мир снежных битв жесток?"
1001706-89 = "Хи-хи-хи..."
1001706-90 = ""
1001706-91 = "Вы начали снежную битву, когда я потеряла бдительность. Впечатляет!"
1001706-92 = "На этот раз я не буду вас жалеть, Товарищ!"
1001706-94 = "После этого мы с Черино весело поиграли в снежки."
