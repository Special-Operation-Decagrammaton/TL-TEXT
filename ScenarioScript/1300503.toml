1300503-11 = "Хм...? Сенсей?"
1300503-12 = "Ты сегодня рано."
1300503-13 = "Если бы знала, что придёшь так рано, уже успела бы немного прибраться."
1300503-14 = "[s] «Где остальные?»"
1300503-15 = "Придут чуть позже. Вчера мы допоздна работали."
1300503-16 = "А я? Со мной всё нормально. Я вообще мало сплю."
1300503-17 = "Поэтому обычно прихожу первой и убираюсь в офисе."
1300503-18 = "Что, думаешь, было бы проще дождаться остальных и убираться вместе?"
1300503-19 = "Наверное, да..."
1300503-20 = "Не знаю. Если предложу всем вместе убираться, они ещё решат, что я командую. Да и возни много."
1300503-21 = "Ару и Харука сами за собой довольно неплохо убирают, так что становится легче."
1300503-22 = "Мне проще сделать всё самой, чем просить помощи."
1300503-23 = "[s] «Тогда я помогу с уборкой.»"
1300503-24 = "Ты вообще хоть слово из того, что я сказала, слышал, Сенсей?"
1300503-25 = "Это проблема Решатели проблем 68. Тебя она не касается."
1300503-26 = "Ты что, пытаешься оставить меня у себя в долгу?"
1300503-27 = "Нет? Ты правда просто хотел помочь?"
1300503-28 = "Но..."
1300503-29 = "Неважно. Спорить из-за такой ерунды глупо."
1300503-30 = "Я обычно не из тех, кто просит помощи, но понимаю, что отказываться, когда её предлагают, тоже бессмысленно."
1300503-31 = "Если подумать, не так уж это отличается от того, как сейчас работает Решатели проблем 68. Хе-хе."
1300503-32 = ""
1300503-33 = ""
1300503-34 = "Вот. Можешь заняться тяжёлой работой."
1300503-36 = "После этого я помог Кайоко убраться в офисе."
