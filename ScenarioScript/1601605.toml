[translation]
1601605-1 = "Позаботьтесь обо мне"
1601605-5 = "Я ждал в гостиной, и вскоре пришла Минэ."
1601605-6 = "Простите, Сенсей."
1601605-7 = ""
1601605-13 = ""
1601605-14 = "[ns1] «...Как и ожидалось.»\n[ns2] «У меня было чувство, что разговор будет именно об этом.»"
1601605-17 = "Значит, вы предполагали, что мне..."
1601605-18 = "...понадобится совет насчёт моего костюма."
1601605-19 = "Это несколько снимает с меня груз. Спасибо."
1601605-20 = "Тогда начну немедленно. Простите за прямоту, Сенсей."
1601605-21 = "Скажу прямо."
1601605-22 = "Сенсей, я..."
1601605-23 = ""
1601605-26 = ""
1601605-27 = "...размышляла о том, чтобы избавиться от этого костюма."
1601605-28 = "[ns] «...»"
1601605-30 = "[ns3] «...Что?! Избавиться?! Вот так внезапно?!»\n[ns4] «С костюмом что-то не так?!»"
1601605-32 = "Да. Избавиться."
1601605-34 = "Да. Есть проблема."
1601605-35 = "Как вы прекрасно знаете, я капитан Рыцарей исцеления Тринити."
1601605-36 = "Это правда, что мне нравится этот костюм. Мне даже нравятся связанные с ним занятия айдола. Однако я не могу отказаться от того, кем являюсь на самом деле. И не хочу, чтобы такое произошло."
1601605-37 = "В этом и заключается сложность. Могут ли эти две стороны сосуществовать?"
1601605-38 = ""
1601605-40 = "Я действительно хочу продолжать носить этот костюм... но чувствую, как моя личность капитана Рыцарей исцеления постепенно начинает стираться."
1601605-41 = "Проще говоря, чем дольше я ношу этот костюм, тем дальше отдаляюсь от настоящей себя. От Рыцарей исцеления."
1601605-44 = "Я пыталась оправдать его ношение продвижением организации и благотворительностью, но это были лишь временные меры. Они не устраняли саму суть проблемы."
1601605-45 = "Сенсей, такими темпами... я начну пренебрегать либо одной стороной, либо другой. И какой бы из них это ни оказалось, мне будет очень больно."
1601605-46 = "Рыцари пытались помочь мне найти компромисс. Они предлагали носить костюм как хобби, устраивать внезапные концерты, когда появится желание."
1601605-47 = "Я отвергла все варианты."
1601605-48 = "Потому что в конечном счёте это не меняет того факта, что граница между двумя сторонами постепенно размывается."
1601605-49 = "[s5] «Ты слишком жёстко на это смотришь.»\n[s6] «Ты решила, что эти две стороны не могут сосуществовать?»"
1601605-52 = "Да. После долгих и серьёзных размышлений я пришла именно к такому выводу."
1601605-53 = ""
1601605-55 = ""
1601605-56 = "Я старалась размышлять о будущем как можно более нейтрально. Не чрезмерно оптимистично и не негативно."
1601605-57 = "Идеально исполнять обе роли просто невозможно. Что бы я ни делала, одна рано или поздно начнёт влиять на другую. И я не могу этого допустить."
1601605-58 = "...Поэтому."
1601605-59 = ""
1601605-61 = ""
1601605-62 = ""
1601605-63 = "Я оставлю этот костюм... вам, Сенсей."
1601605-64 = ""
1601605-67 = "[ns7] «Мне?»\n[ns8] «Ты хочешь, чтобы я хранил его у себя?»"
1601605-70 = "Да. Можно считать это своего рода сейфом."
1601605-71 = "Мне тяжело думать о том, чтобы выбросить его. Но я и не могу держать его у себя, постоянно ощущая его присутствие где-то на краю сознания."
1601605-72 = "Я не могу отрицать, кто я есть на самом деле. С этим костюмом связано множество дорогих мне воспоминаний, и я не хочу, чтобы они со временем испортились."
1601605-73 = "Поэтому я решила, что оставить его у вас будет лучшим выбором. Так эти воспоминания всегда будут существовать в безопасном уголке моего сердца."
1601605-74 = ""
1601605-76 = ""
1601605-77 = "...Сенсей."
1601605-78 = "Сможете ли вы защитить этот костюм, с которым у меня связано столько дорогих воспоминаний?"
1601605-79 = "[s] «...»"
1601605-81 = "[ns] «...Минэ.»"
1601605-82 = ""
1601605-84 = ""
1601605-85 = "[ns9] «Прости, но я не могу выполнить эту просьбу.»\n[ns10] «Ты должна хранить его сама.»"
1601605-86 = ""
1601605-87 = ""
1601605-89 = ""
1601605-90 = "...Вот как?"
1601605-91 = "Понимаю. Если таков ваш совет, значит, ничего не поделать."
1601605-92 = ""
1601605-94 = ""
1601605-95 = "Я решу, каким способом избавиться от этого костюма."
1601605-96 = ""
1601605-98 = ""
1601605-99 = "...? Что? Не в этом дело?"
1601605-100 = "Если я просто... оставлю его у себя, это будет нормально? Более того, именно так мне и следует поступить?"
1601605-101 = "Почему...?"
1601605-102 = ""
1601605-104 = ""
1601605-105 = "...Погоди."
1601605-106 = "Сенсей. Если вы пытаетесь использовать это как возможность похвалить меня, вы совершенно меня неправильно поняли."
1601605-107 = "Я пытаюсь сказать, что не способна ответственно принимать решения, связанные с этим костюмом. Однако..."
1601605-108 = "Хм?"
1601605-109 = "Вы не это имеете в виду? Тогда..."
1601605-110 = "[s11] «А пока мы разберёмся с этим вместе.»\n[s12] «Пока ты сама не сможешь решить, я буду говорить тебе, когда его надевать.»"
1601605-113 = "...?"
1601605-114 = ""
1601605-116 = ""
1601605-117 = "...!"
1601605-118 = "Вы будете... решать, когда мне следует надевать этот костюм?"
1601605-119 = "Зачем вам заходить так далеко?"
1601605-120 = "Прошу прощения. Мне трудно понять ваши намерения."
1601605-121 = "Однако наверняка здесь есть точка зрения, которую я сейчас просто не способна осознать. Я вам доверюсь."
1601605-122 = "В конце концов, я прекрасно знаю, что бываю крайне негибкой в своём подходе."
1601605-123 = ""
1601605-125 = ""
1601605-126 = ""
1601605-127 = "М-м... Вот как? Понимаю..."
1601605-128 = "Вы будете выбирать, когда мне его носить... Любопытно."
1601605-129 = "В таком случае мне и правда больше не придётся мучиться, решая, как и когда его использовать."
1601605-130 = "...Хи-хи."
1601605-131 = "И правда, чтобы кто-то другой составлял тебе расписание костюмов. Какая оригинальная и интересная идея."
1601605-132 = "Полагаю, это допустимо. Всё-таки речь о вас."
1601605-133 = "Однако..."
1601605-134 = "Если подумать ещё раз, почему-то в этом есть нечто смущающее."
1601605-135 = ""
1601605-138 = "[ns13] «П-Погоди! Я просто пытался помочь с твоей проблемой!»\n[ns14] «Мы же серьёзно пытались решить серьёзную проблему, верно?!»"
1601605-139 = ""
1601605-140 = ""
1601605-142 = ""
1601605-143 = "Хи-хи-хи. Я пошутила, Сенсей."
1601605-144 = "Решено, Сенсей. Эту сторону себя я доверю вам, Сенсей."
1601605-145 = "Хотя лично я..."
1601605-146 = ""
1601605-148 = ""
1601605-149 = ""
1601605-150 = "...надеюсь, что у моего другого «я» будет возможность встречаться с вами почаще."
