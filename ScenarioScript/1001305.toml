[translation]
1001305-1 = "Взрослое свидание"
1001305-3 = "За отличный кредитный рейтинг мне прислали два ваучера в дорогой ресторан."
1001305-4 = "С Цуруги что-то не так. Хорошая возможность проверить, как она."
1001305-6 = "Я нашёл Цуруги, сидящую одну в парке."
1001305-7 = "(пристально смотрит)"
1001305-8 = "[s1] Поздороваться.\n[s2] Помахать ей."
1001305-9 = "С-Сенсей?!"
1001305-10 = "С-Сенсей?!"
1001305-11 = "К-Как ты меня нашёл...? То есть..."
1001305-12 = "[s3] «Что происходит?»\n[s4] «Что-то не даёт тебе покоя?»"
1001305-13 = "Н-Ну, просто..."
1001305-14 = "Н-Ну, просто..."
1001305-15 = "Я-я не могу этого отрицать."
1001305-16 = "[s] «Хочешь поговорить об этом?»"
1001305-17 = "..."
1001305-19 = "Задание Оперативной группы правосудия №32 — зачистка бандитов"
1001305-20 = "Кьяхахахаха!"
1001305-21 = "Путь к отступлению перекрыт! Бежать некуда!"
1001305-22 = "Прощайтесь с жизнью!"
1001305-23 = "*бах* *БА-А-А-АХ*"
1001305-25 = "Вооружённый патруль района Тринити, первая половина"
1001305-26 = "Кихехехехе!"
1001305-27 = "Я раздавлю вас как букашек!"
1001305-28 = "*бах* *бум* *бум*"
1001305-30 = "Экстренная эвакуация — защита школьного инспектора"
1001305-31 = "Кухеееееех!"
1001305-32 = "И это всё, на что вы способны?!"
1001305-33 = "Ещё, ещё! Хочу посмотреть, как вы будете корчиться!"
1001305-34 = "*БА-А-АХ* *бах* *БА-А-А-АХ*"
1001305-36 = "...Вот оно."
1001305-37 = "[s5] «Ты и правда слишком себя изнуряешь, Цуруги.»\n[s6] «Хочешь сказать, ты переработала?»"
1001305-38 = "Н-Нет, дело не в этом."
1001305-39 = "Н-Нет, дело не в этом."
1001305-40 = "Я-я..."
1001305-41 = "[s] «Ты...?»"
1001305-42 = "Я думаю... не трачу ли я молодость впустую."
1001305-43 = "[s7] «Юность...?!»\n[s8] «С чего это вдруг?!»"
1001305-44 = "Моя жизнь совсем не похожа на то, что показывают в журналах и книгах..."
1001305-45 = "Моя жизнь совсем не похожа на то, что показывают в журналах и книгах..."
1001305-46 = "Говорят, в молодости смотришь на мир через розовые очки. По-моему, мои окрашены кровью..."
1001305-47 = "[s9] «Потому что у тебя большие мечты.»\n[s10] «Хотя справедливости ради, оттенок действительно темнее.»"
1001305-48 = "Я-я хотела бы узнать, к-каково это... х-ходить на с-свидания."
1001305-49 = "Я-я хотела бы узнать, к-каково это... х-ходить на с-свидания."
1001305-50 = "...Прости. Тебе не обязательно это слушать."
1001305-51 = "[s11] Стоит использовать купоны, чтобы пригласить Цуруги куда-нибудь.\n[s12] Хочу воспользоваться шансом и порадовать Цуруги."
1001305-54 = ""
1001305-55 = ""
1001305-56 = "*шорох*"
1001305-57 = "А? Что это?!"
1001305-58 = "[s] «Я хочу пригласить тебя на особое тренировочное свидание, Цуруги!»"
1001305-59 = "...?!"
1001305-61 = "Добро пожаловать. Мы ждали вас, [USERNAME]."
1001305-62 = "Добро пожаловать в Luxus-Palast. Мы предлагаем изысканную кухню только самым привилегированным гостям."
1001305-63 = "...?!"
1001305-64 = "Расслабьтесь и наслаждайтесь ужином на высоте 550 метров с прекрасным видом на ночное небо Кивотоса."
1001305-65 = "Позвольте проводить вас к столику. Прошу за мной."
1001305-66 = ""
1001305-67 = "[s13] «Благодарю, добрый господин.»\n[s14] «Идём, Цуруги.»"
1001305-68 = "А? Э-Эм... ладно."
1001305-69 = "А? Э-Эм... ладно."
1001305-73 = "― (Может, сбежать? Я всегда могу просто выпрыгнуть из окна.)[wa:1260]"
1001305-75 = "― (Я умру? Наверное. Хочу умереть... Или, может, убить? Нет, это ничего не решит.)[wa:2920]"
1001305-78 = "[ns15] (Даже если это тренировочное свидание, нужно отнестись серьёзно.)\n[ns16] (Создать настроение.)"
1001305-81 = "― П-П...Почему ты привёл кого-то вроде меня в такое место?[wa:2580]"
1001305-83 = "― Мне здесь не место. Для таких, как я, это место не подходит...[wa:1560]"
1001305-86 = "[ns] «Цуруги, я хочу тебе кое-что сказать.»"
1001305-87 = "― Ох. Ух... Я ещё не готова...[wa:5140]"
1001305-90 = "― (А-а-а! Что я вообще сейчас делаю?!)[wa:3380]"
1001305-93 = "[ns] «Я просто хочу сказать... давай хорошо проведём время. Не напрягайся так.»"
1001305-94 = "А..."
1001305-95 = "..."
1001305-96 = "...Хорошо."
1001305-97 = "Цуруги отлично провела своё первое свидание."
