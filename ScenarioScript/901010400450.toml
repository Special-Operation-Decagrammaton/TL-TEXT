[translation]
901010400450-6 = "Я видела в порту туристов..."
901010400450-7 = "Они не были ни рыбаками, ни местными и при этом воспринимали эту городскую легенду очень серьёзно."
901010400450-8 = "Некоторых отталкивали клешни и панцири, а кто-то всерьёз верил, что крабы нападают на людей."
901010400450-9 = "Как такая нелепая городская легенда вообще могла так распространиться?"
901010400450-10 = "Если бы они следили за новостями... или хотя бы поискали информацию в сети, сразу увидели бы, что это наглая ложь."
901010400450-11 = "Люди не слишком интересуются слухами, которые напрямую не касаются их жизни."
901010400450-12 = "Серьёзная проблема для тех, кто рядом, для наблюдателей издалека превращается всего лишь в развлечение."
901010400450-13 = "И будем честны... Пикантная ложь гораздо интереснее скучной реальности."
901010400450-14 = "Один лайк способен разнести слух среди десятков или даже сотен людей раньше, чем кто-то успеет всё нормально объяснить."
901010400450-15 = "Как мрачно..."
901010400450-16 = ""
901010400450-18 = ""
901010400450-20 = "Итак, причина, по которой люди верят в реальность крабов-убийц, заключается в том, что..."
901010400450-21 = ""
901010400450-23 = ""
901010400450-24 = ""
901010400450-27 = ""
901010400450-28 = "#Q;유키노;Итак, причина, по которой люди верят в реальность крабов-убийц, заключается в том, что...\n[as1] «Это действительно происходит.»\n[as2] «Их гипнотизируют.»\n[as3] «Слух распространяют невежественные люди.»"
901010400450-29 = "...Возможно, моего объяснения было недостаточно."
901010400450-30 = "Судя по информации, которую мы собрали, крайне маловероятно, что краб действительно напал на человека."
901010400450-31 = ""
901010400450-33 = ""
901010400450-34 = ""
901010400450-37 = ""
901010400450-39 = ""
901010400450-40 = "Ох, ну серьёзно!"
901010400450-41 = "Нет... Давайте выслушаем. Я слышала, в Геенне кто-то работает над контролем разума."
901010400450-42 = "...Что-то вроде NK Mega?"
901010400450-43 = "Чертежи наверняка где-то есть. Кто-нибудь вполне может испытывать это здесь."
901010400450-45 = "Я не видела никаких доказательств, указывающих на Геенну. Давайте подумаем ещё."
901010400450-46 = ""
901010400450-48 = ""
901010400450-49 = ""
901010400450-50 = ""
901010400450-53 = "Верно. Слух связан с портом Канэсаки, но серьёзно его воспринимали только туристы. Они ничего не знали о крабовом промысле."
901010400450-54 = "И именно поэтому слух так разошёлся. Те, кто им делился, даже не понимали, что история не имеет смысла."
901010400450-56 = "Всегда перепроверяйте то, что читаете в интернете."
901010400450-57 = "У Кудзунoхи даже есть поговорка: Не верь цитате рядом с фотографией."
901010400450-58 = "Эта цитата кажется мне ОЧЕНЬ сомнительной."
