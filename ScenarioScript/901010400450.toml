901010400450-50 = ""
901010400450-53 = "Sim. Embora a lenda se passe no Porto de Kanezaki, quem mais a propaga são civis que nada entendem de pesca marítima."
901010400450-54 = "É justamente por isso que, mesmo com o caranguejo da lenda agindo contra todas as leis da natureza, a mentira colou sem ser questionada."
901010400450-56 = "Fica a lição: desconfiem de tudo o que leem na internet na primeira olhada."
901010400450-57 = "Até porque diz o famoso provérbio: #n\"Jamais acredite em citações bonitas coladas sobre fotos aleatórias. - Kuzunoha\"."
901010400450-58 = "Essa citação aí é a coisa mais fajuta e suspeita que eu já ouvi na vida."
