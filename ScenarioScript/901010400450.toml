901010400450-39 = ""
901010400450-40 = "Não viaja, Sensei! Hipnose coletiva?!"
901010400450-41 = "Olha... não é impossível. Já ouvi boatos de que a Academia Gehenna desenvolveu uma máquina de controle mental no passado."
901010400450-42 = "Acho que chamavam de projeto MK-Ultra... alguma coisa assim..."
901010400450-43 = "Se essa tecnologia vazou pro mercado clandestino, não dá pra descartar totalmente."
901010400450-45 = "Mas não temos indício nenhum de envolvimento de Gehenna neste caso. Vamos pensar com calma mais uma vez."
901010400450-46 = ""
