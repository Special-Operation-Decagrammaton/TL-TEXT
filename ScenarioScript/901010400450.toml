[translation]
901010400450-6 = "A propósito, conversei com alguns turistas que vieram passear no porto..."
901010400450-7 = "E parece que as pessoas da cidade realmente acreditam nessa história assustadora."
901010400450-8 = "Muitas tinham medo das pinças e da casca, e juravam de pé junto que existem caranguejos que atacam humanos..."
901010400450-9 = "Mas como é que uma conversa fiada dessas ganha tanta força?"
901010400450-10 = "Bastaria jogar no noticiário... ou fazer uma busca rápida na internet pra ver que é mentira."
901010400450-11 = "As pessoas raramente se dão ao trabalho de checar aquilo que não afeta diretamente seu cotidiano."
901010400450-12 = "O que é um drama terrível para quem vive a situação não passa de entretenimento passageiro para quem vê de fora."
901010400450-13 = "E além do mais... histórias sensacionalistas atiçam a curiosidade, não é?"
901010400450-14 = "Veracidade é o de menos. Se achar divertido e apertar no \"curtir\", o boato já se espalhou pelo mundo afora."
901010400450-15 = "...É bem por aí mesmo."
901010400450-16 = ""
901010400450-18 = ""
901010400450-20 = "Em outras palavras, a razão para acreditarem num caranguejo comedor de gente é—"
901010400450-21 = ""
901010400450-23 = ""
901010400450-24 = ""
901010400450-27 = ""
901010400450-28 = "Em outras palavras, a razão para acreditarem num caranguejo comedor de gente é—\n[as1] Porque realmente aconteceu.\n[as2] Porque alguém hipnotizou o povo para acreditar.\n[as3] Porque o boato viralizou sem checagem."
901010400450-29 = "...Talvez eu não tenha me expressado com clareza suficiente."
901010400450-30 = "Cruzando todas as evidências até agora, a probabilidade de caranguejos reais caçarem pessoas é quase nula."
901010400450-31 = ""
901010400450-33 = ""
