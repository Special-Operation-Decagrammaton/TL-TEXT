[translation]
10043080-1 = "Эпизод 8;Девятый иннинг, 2 аута, жизнь начинается"
10043080-2 = "Дай посмотреть. Я немного умею обрабатывать травмы после тренировок..."
10043080-3 = ""
10043080-5 = ""
10043080-6 = "Ух... Ух..."
10043080-8 = "К-Как там?"
10043080-9 = "Всё нормально. Уверен, всё нормально. Правда, Сумирэ?"
10043080-10 = ""
10043080-13 = ""
10043080-14 = "Ну..."
10043080-15 = "Ну и что? Как там? А?!"
10043080-16 = "Хорошая новость — думаю, кости не сломаны."
10043080-17 = "Но... махать битой сегодня рискованно. Я бы не нагружала это запястье как минимум три дня."
10043080-18 = "Иначе можно получить необратимое повреждение связок."
10043080-19 = "Необратимое повреждение? Ты серьёзно?"
10043080-21 = "Ему надо было лежать там, где лежал!"
10043080-22 = "..."
10043080-23 = "...Не стоило мне так говорить. Это наша вина..."
10043080-24 = "Если бы мы не затеяли этот дурацкий план... если бы просто смотрели игру..."
10043080-25 = "Но... всё же..."
10043080-26 = "Я хотела увидеть нашу победу! Или хотя бы увидеть ПРИЛИЧНУЮ игру!"
10043080-27 = "...Не бывает игр приличных или неприличных."
10043080-28 = "Тренировки — да, но не игры."
10043080-30 = "...Тренер?"
10043080-31 = "Хорошо сказано. Я это запишу."
10043080-36 = "И это четвёртый болл! Heroes получают базу!"
10043080-37 = "Низ девятого иннинга, два аута, базы загружены!"
10043080-38 = "Знаете, некоторые вещи лучше не говорить вслух, а то ещё сглазишь..."
10043080-39 = "Но я ОЧЕНЬ хочу увидеть, что будет дальше."
10043080-41 = "И к бите выходит четвёртый отбивающий Heroes!"
10043080-42 = "Кажется, вот он, решающий момент!"
10043080-45 = "[ns] «Низ девятого, два аута, базы загружены? Ого.»"
10043080-46 = "Шутят, что именно здесь и начинается настоящая игра."
10043080-47 = "Ну да, вот мы и здесь..."
10043080-48 = "Тренер, можем выпустить пинч-хиттера?"
10043080-49 = "Эм, кто у нас ещё остался? Какой у них процент отбивания?"
10043080-50 = "О, нам конец. Остались двое, а их средние показатели — ноль-шесть-девять и ноль-пять-три."
10043080-51 = "Можно взять кого угодно с трибун, заставить махнуть битой с закрытыми глазами — и шанс у него, наверное, будет выше."
10043080-52 = "Мы прошли весь этот путь, и вот так всё закончится?"
10043080-53 = ""
10043080-55 = ""
10043080-56 = "[ns] «Нет... Нет, у нас всё ещё есть один шанс.»"
10043080-57 = ""
10043080-59 = ""
10043080-61 = "Какой у вас план, Сенсей?"
10043080-62 = "Да, какой?!"
10043080-63 = "[s] «Рэй.»"
10043080-64 = "Д-Да? Что?"
10043080-65 = "[s] «Нет, я имею в виду, что план — это ты, Рэй.»"
10043080-66 = ""
10043080-68 = ""
10043080-69 = "...Что?"
10043080-70 = "Я??"
10043080-71 = "Что значит, «я здесь лучший отбивающий?»"
10043080-72 = "Что ЗНАЧИТ «пора показать им, чего стоит четвёртый отбивающий бейсбольного клуба Миллениум»?!"
10043080-73 = "Слушайте, ну... спасибо, конечно, но я знаю, на что способна, а на что нет."
10043080-74 = "Я студент Миллениум. В нашем бейсбольном клубе всё строится на данных и статистическом анализе."
10043080-75 = "...А мы любительская школьная команда. Мы не настолько хороши."
10043080-76 = ""
10043080-78 = ""
10043080-79 = ""
10043080-80 = "С-Сенсей?!"
10043080-81 = ""
10043080-83 = ""
10043080-84 = "Я положил обе руки Рэй на плечи."
10043080-85 = "Ай, Сенсей! То есть это не БОЛЬНО..."
10043080-86 = "...но вы ОЧЕНЬ близко..."
10043080-87 = "[s] Пристально посмотреть Рэй в глаза."
10043080-88 = "С-С-Сенсей?!"
10043080-89 = "[s] «Слушай внимательно, Рэй. Смотри мне в глаза. Ты справишься.»"
10043080-90 = "Откуда вы так уверены?"
10043080-91 = "[s1] «Твоя результативность отбивания — целых 0,08. Восемь процентов.»\n[s2] «Это намного выше, чем... шанс выпадения в большинстве мобильных гач!»"
10043080-94 = "...А?"
10043080-95 = "[ns3] «Верь в себя! Или верь в меня, который верит в тебя!»\n[ns4] «Всё равно в этой игре уже нечего терять!»"
10043080-99 = "[ns5] «Даже если у тебя не получится...»\n[ns6] «...для Heroes это будет всего лишь ещё одно поражение.»"
10043080-100 = ""
10043080-101 = ""
10043080-103 = ""
10043080-104 = "Знаете, в этом даже почти есть смысл..."
10043080-105 = "Ну, это не совсем НЕПРАВДА, но..."
10043080-106 = "Угу...!"
10043080-107 = "Знаете, в бейсбол играют люди. Для людей."
10043080-108 = "В последнее время всё больше сводится к цифрам и теории..."
10043080-109 = "...но людей не всегда можно так просчитать."
10043080-111 = "Он прав. Столько поражений, а люди всё равно приходят болеть за любимую команду."
10043080-112 = "В спорте есть вещи, которые не выразишь цифрами."
10043080-113 = "Иди туда. Ни о чём не жалей. Я тоже буду за тебя болеть."
10043080-114 = ""
10043080-116 = ""
10043080-118 = "Ох, Сумирэ..."
10043080-119 = ""
10043080-121 = ""
10043080-122 = ""
10043080-123 = ""
10043080-124 = "...Ладно. Я пошла."
10043080-135 = ""
10043080-137 = "Вы это видите, друзья? Они в последнюю минуту вызывают игрока... прямо с трибун!"
10043080-138 = "Невероятная развязка невероятного матча!"
10043080-141 = ""
10043080-142 = "Кто эта пинч-хиттер? Я никогда раньше её не видел..."
10043080-143 = "Низ девятого, два аута, базы загружены... откуда у них вообще ещё взялся новый отбивающий?"
10043080-144 = ""
10043080-146 = ""
10043080-148 = "Если мы проиграем, мир не рухнет. Если мы проиграем, я не умру. Но всё же... можно нам хоть раз победить?"
10043080-149 = "А-а... Ух... Я не могу смотреть. Не могу. Сердце сейчас взорвётся. А-а-а..."
10043080-150 = "Кто бы ни был там наверху, если вы меня слышите, пожалуйста, направьте взмах этой отбивающей...!"
10043080-153 = "Два страйка, три болла. Полный счёт. Базы загружены. Низ девятого иннинга."
10043080-154 = "Момент истины."
10043080-155 = ""
10043080-159 = "О! Питчер пытается сделать пик-офф на первую базу! Раннер успевает среагировать."
10043080-160 = "Похоже, питчер начинает нервничать."
10043080-161 = ""
10043080-163 = ""
10043080-164 = ""
10043080-166 = "(...Я ничего не слышу.)"
10043080-167 = "(Столько людей смотрит. Я их вижу — все на взводе.)"
10043080-168 = "(Но я ничего не слышу.)"
10043080-169 = ""
10043080-172 = "Ещё одна попытка пик-оффа! На этот раз на третью базу!"
10043080-173 = "(Сенсей сказал, что я должна верить в себя.)"
10043080-174 = "(А если не могу — должна верить в Сенсея, который верит в меня.)"
10043080-175 = "(Если честно, я всё ещё не совсем понимаю, что это значит...)"
10043080-178 = ""
10043080-179 = "Иди туда. Ни о чём не жалей. Я тоже буду за тебя болеть."
10043080-180 = "(Сумирэ тоже там.)"
10043080-181 = ""
10043080-183 = ""
10043080-185 = ""
10043080-186 = "Не бывает игр приличных или неприличных."
10043080-187 = "(Думаю, он прав. Особенно для этой команды... может, и для меня тоже.)"
10043080-188 = ""
10043080-190 = ""
10043080-192 = ""
10043080-193 = "Надеюсь, мои крики помогают им чувствовать себя лучше. Может, они продолжат стараться вместо того, чтобы сдаться."
10043080-194 = "(И...)"
10043080-197 = "[log] «Ну, если уж совсем честно...»[/log]"
10043080-199 = "[log]«Потому что мне нравится тебя видеть.»[/log]"
10043080-201 = ""
10043080-203 = "(Я, наверное, уже сдалась бы.)"
10043080-204 = "(Но, может быть, от некоторых вещей нельзя отказаться...)"
10043080-205 = "(...)"
10043080-206 = "(Вдох.)"
10043080-207 = "(Смотреть вперёд.)"
10043080-208 = ""
10043080-211 = "Питчер начинает замах. Подача!"
10043080-214 = "Без давления, Рэй! Ты справишься!"
10043080-215 = "Просто выложись по полной — это главное!"
10043080-216 = "У тебя отличный настрой! Используй его!"
10043080-217 = ""
10043080-221 = ""
10043080-222 = ""
10043080-223 = ""
10043080-224 = ""
10043080-225 = ""
10043080-228 = ""
10043080-229 = ""
10043080-230 = ""
10043080-234 = ""
10043080-235 = ""
10043080-236 = ""
10043080-237 = ""
10043080-240 = "Есть хит!"
10043080-241 = "О боже..."
10043080-242 = "Мяч летит влево, через аутфилд. Летит, летит..."
10043080-243 = "Вот это удар!"
10043080-244 = ""
10043080-248 = "УШЁЛ! И на этом игра окончена, друзья!"
10043080-249 = "Corgi Heroes возвращаются с ГРАНД-СЛЭМОМ!!"
10043080-250 = "Наконец-то!! Ох, я уже думала, что никогда этого не увижу!!"
10043080-251 = "Именно так, это первая победа Corgi Heroes в серии Ширатори!! Чудесная победа! Этот матч войдёт в историю!"
10043080-254 = "(Я почти не помню, что происходило и что слышала...)"
10043080-255 = "(Но я помню удар, когда бита встретилась с мячом...)"
10043080-258 = "(И я видела мяч, тот белый мяч, взлетающий дугой в небо...)"
10043080-261 = ""
10043080-263 = "Heroes победили! Heroes победили!"
10043080-264 = "А-а-а!! Heroes победили!!"
10043080-266 = "*рыдает* Мы победили... Мы наконец победили. Правда, по-настоящему, впервые — мы наконец победили...!"
10043080-267 = ""
10043080-269 = ""
10043080-271 = ""
10043080-272 = "И-и?! Что происходит...? А...? Мы победили? Мы правда победили? Правда? Corgis победили!!"
10043080-273 = "Я думала, это невозможно... Правда думала, что такого не случится... Я думала, у этой команды нет надежды...!!"
10043080-276 = ""
10043080-277 = "Спасибо... Огромное спасибо..."
10043080-278 = "Большое спасибо за нашу первую победу..."
10043080-279 = "Я хотела победить... Правда хотела... Пусть всего один раз, но я очень хотела победить...!"
10043080-280 = ""
10043080-282 = ""
10043080-283 = "Мы долго к этому шли... очень долго..."
10043080-284 = "Но одной победой довольствоваться нельзя. Heroes только начинают играть!"
10043080-287 = "Я не очень понимаю..."
10043080-288 = ""
10043080-290 = ""
10043080-291 = "...но я рада, что все остальные счастливы!"
