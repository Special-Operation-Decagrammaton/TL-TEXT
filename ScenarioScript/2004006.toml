[translation]
2004006-1 = "Сацуки терпит"
2004006-2 = "Едва получив сообщение от Сацуки, я поспешил в Общество Пандемониума."
2004006-3 = ""
2004006-7 = ""
2004006-8 = ""
2004006-9 = "Ах, Сенсей из Шале. Что привело вас сегодня сюда?"
2004006-10 = ""
2004006-13 = "А, Сацуки..."
2004006-14 = "Н-Ну..."
2004006-15 = "[s] «Что-то случилось?»"
2004006-16 = "Ну да, можно и так сказать..."
2004006-18 = ""
2004006-20 = "[ns] «То есть ты хочешь сказать...»"
2004006-22 = "[ns] «...она не любит прививки, поэтому прячется за дверью?»"
2004006-23 = "Что ж, кто знает, кто может бояться игл..."
2004006-24 = ""
2004006-26 = ""
2004006-27 = ""
2004006-28 = "Сацуки? Сацуки!"
2004006-29 = "Осталась только ты!"
2004006-30 = "Я сделаю всё быстро и безболезненно, так что выходи, пожалуйста!"
2004006-31 = "Не ври мне! В каком мире бывают «безболезненные» уколы? Со мной всё нормально! Просто уйди!"
2004006-32 = "Все ученики Геенны обязаны сделать эту прививку. Ты ведь это знаешь."
2004006-33 = "Хочешь потом лежать пластом с ужасной простудой?"
2004006-34 = "Этого не случится! Я вообще ни разу в жизни не простужалась!"
2004006-35 = "Это потому что ты..."
2004006-36 = "В-В любом случае! Не в этом дело!"
2004006-37 = ""
2004006-40 = ""
2004006-42 = "Ну вот, как видите... ага."
2004006-43 = "[s] «Тяжко ей приходится...»"
2004006-45 = ""
2004006-46 = "[ns] «Эм, привет. Хочешь, я попробую с ней поговорить?»"
2004006-47 = "О, Сенсей."
2004006-48 = "Пожалуйста. Меня она вообще не слушает..."
2004006-49 = "Тогда оставляю это вам."
2004006-50 = ""
2004006-52 = ""
2004006-54 = "[ns] «Сацуки? Это я.»"
2004006-56 = "...Сенсей? Это правда вы?"
2004006-57 = "...Нет. Сенсею незачем быть здесь."
2004006-58 = "Хи-хи, Сенсея вы изображаете неплохо, но меня не проведёшь. Я директор Разведывательного комитета Общества Пандемониума, мастер психологии..."
2004006-59 = "[s] «Это правда я, Сацуки. Откроешь дверь, пожалуйста?»"
2004006-60 = "..."
2004006-61 = "...Сенсей, вы правда там?"
2004006-66 = "...Это и правда вы. Тогда почему вы здесь...?"
2004006-67 = "А, вы увидели мой MomoTalk?"
2004006-68 = "Хи-хи, полагаю, вы раскусили мою «экстренную просьбу о спасении»."
2004006-69 = "Ну, проблему вы видите. Беспрецедентный кризис, как всегда..."
2004006-70 = "Теперь вытащите меня отсюда."
2004006-71 = "[s] «Только потому, что не хочешь прививку?»"
2004006-72 = "Я правда, правда, ПРАВДА не хочу эту прививку!"
2004006-73 = "Я не люблю, когда мне больно! А уколы особенно — это худшее!"
2004006-74 = "Эта маленькая острая игла, словно копьё, пронзающая мою бедную нежную кожу..."
2004006-75 = "Потом они нажимают на шприц, и какой-то неизвестный препарат проникает в мои вены, внутрь МЕНЯ..."
2004006-76 = "[s1] «В таком описании это и правда звучит ужасно, но...»\n[s2] «Всё быстро заканчивается. Можешь просто потерпеть?»"
2004006-79 = "Сенсей... всё не так просто."
2004006-80 = "А вы бы смогли это выдержать, Сенсей?"
2004006-81 = "Не только физическую боль, но и ужас от того, как игла всё приближается и приближается..."
2004006-82 = "А потом этот холодный спиртовой тампон трётся о кожу, словно ставит на тебе метку смерти!"
2004006-83 = "[s3] «Я слышал, ты здесь единственная, кто ещё не сделал прививку.»\n[s4] «Даже Ибуки уже сделала свою...»"
2004006-86 = "Ц, и всё же..."
2004006-87 = ""
2004006-90 = "...Что это за лицо?"
2004006-91 = "В любом случае, я просто не хочу! Как студент, я пользуюсь своим правом отказаться."
2004006-92 = "Нет у тебя такого права!"
2004006-93 = "Ой, разве нельзя просто отметить моё имя в списке и забыть об этом?"
2004006-94 = "Это будет подделкой медицинской документации, так что нет!"
2004006-95 = "[s] «Эм, случайно не осталось лишней дозы?»"
2004006-96 = "Хм, да. Есть несколько..."
2004006-97 = "[s] «Сацуки, а что если сделать прививку вместе со мной?»"
2004006-98 = "А...?"
2004006-99 = "[s] «Так тебе будет легче её перенести?»"
2004006-100 = "Но... разве вы сами не боитесь уколов, Сенсей? Это ведь очень больно!"
2004006-101 = "[s5] «Конечно, больно, но...»\n[s6] «Если мы встретим это вместе, будет не так страшно.»"
2004006-104 = "Знаешь, если Сенсей готов ради меня зайти так далеко, я бы просто сделала укол."
2004006-105 = "Да замолчи ты?! Я думаю..."
2004006-106 = "..."
2004006-107 = "...Вместе. Одновременно."
2004006-108 = "[s] «Да. Одновременно.»"
2004006-109 = ""
2004006-110 = "...Ц..."
2004006-111 = ""
2004006-112 = "Ладно."
2004006-113 = "Делайте прививку."
2004006-114 = "[s] «Вот это разговор!»"
2004006-115 = ""
2004006-118 = "Она дрожала всю процедуру, но в конце концов мы оба справились."
