[translation]
10032010-1 = "Эпизод 1;Здесь по работе"
10032010-5 = "[ns1] «Народу и правда битком...»\n[ns2] «(Я уже хочу уйти...)»"
10032010-8 = "Сенсей? Что вы здесь делаете?"
10032010-9 = ""
10032010-12 = ""
10032010-13 = "Кто бы мог подумать, что наши пути пересекутся именно в таком заведении. Вы всегда умеете удивлять, Сенсей."
10032010-14 = "Впрочем, похоже, это взаимно, так что я позволю."
10032010-15 = "[s3] «Ару...?»\n[s4] «А ТЫ что здесь делаешь...?»"
10032010-18 = "Как обычно, никакого чувства приличий, Сенсей. Вы даже не поздоровались."
10032010-19 = "Полагаю, ничего страшного, если расскажу."
10032010-20 = "Я здесь по делу."
10032010-21 = "...По какому делу? Простите, это конфиденциальная информация. Всё-таки клиент очень важный."
10032010-22 = "Учитывая деликатный характер задания, я не могу раскрывать подробности постороннему."
10032010-23 = "Даже как наш консультант по управлению вы здесь не того уровня допуска, Сенсей."
10032010-24 = ""
10032010-26 = ""
10032010-27 = "Н-Не то чтобы я вам не доверяла или что-то такое! Это вопрос безопасности! Безопасности!"
10032010-28 = "Кстати, а зачем вы здесь, Сенсей? Не похожи вы на любителя оперы."
10032010-29 = "...Вам и правда нравится хорошая опера? Но сегодня вы здесь не ради неё?"
10032010-30 = "...О. Вы тоже по работе?"
10032010-31 = "И какая именно работа?"
10032010-32 = "[s5] «Не знаю, могу ли раскрывать такую конфиденциальную информацию...»\n[s6] «Расскажу, если ты расскажешь, Ару.»"
10032010-35 = "...?"
10032010-36 = "...!!"
10032010-37 = "Т-То, что я сказала раньше...! Я не это имела в виду!"
10032010-38 = "...Это была просто шутка? Тогда расскажите."
10032010-39 = "...Вы проводите исследование?"
10032010-40 = "Пришли снять образовательное видео об Оперном театре и его постановках?"
10032010-41 = "Зачем вам вообще заниматься таким...?"
10032010-42 = "[s7] «...Ты ведь помнишь, что я учитель, да?»\n[s8] «Так велел Генеральный студсовет. Я просто выполняю поручение.»"
10032010-43 = "А, точно. Да. Я не хотела..."
10032010-44 = "Вы всегда были очень честны, Сенсей."
10032010-45 = "В любом случае, какое облегчение. Сегодня наши пути пересеклись при лучших обстоятельствах."
10032010-46 = "У меня есть немного времени для дорогого консультанта."
10032010-47 = "Если хотите, я проведу для вас экскурсию по Оперному театру."
10032010-48 = "Не смотрите так удивлённо. Естественно, я тщательно изучила и запомнила всю планировку, чтобы моя работа здесь прошла без заминок."
10032010-49 = "Провести для вас экскурсию — сущая мелочь по сравнению с этим, Сенсей."
10032010-50 = ""
10032010-52 = ""
10032010-53 = ""
10032010-54 = "Вы принимаете моё предложение, Сенсей? Или я для вас просто обуза?"
10032010-55 = ""
10032010-57 = ""
10032010-58 = ""
10032010-59 = "(Отлично. Всё идёт по плану.)"
10032010-60 = "(Нужно лишь отвлекать Сенсея, пока остальные успешно не вывезут цель из Оперного театра.)"
10032010-61 = "(Кто знает, что Сенсей подумает, если узнает, чем мы здесь занимаемся...)"
10032010-62 = "(И вдобавок ко всему—)"
10032010-63 = ""
10032010-65 = ""
10032010-66 = ""
10032010-67 = "[ns] «Ты сейчас зовёшь меня на свидание?»"
10032010-68 = ""
10032010-70 = ""
10032010-71 = ""
10032010-72 = "С-с-свидание?!"
10032010-73 = "Нет, нет, нет! Я вовсе не это имела в виду!"
10032010-74 = "Хотя, если подумать, наверное, прозвучало так, будто именно это я и хотела сказать...!"
10032010-75 = "Стоп! Нет!"
10032010-76 = "Не говорите глупостей! Это деловая встреча! Я помогаю своему консультанту по управлению!"
10032010-77 = "[s9] «Что ж, я ценю твою помощь.»\n[s10] «Похоже, я в надёжных руках, Ару!»"
10032010-78 = ""
10032010-79 = ""
10032010-81 = ""
10032010-82 = ""
10032010-83 = ""
10032010-84 = ""
10032010-85 = ""
10032010-86 = ""
10032010-87 = "Хи-хи. Правильный выбор."
10032010-88 = "Хотя надеюсь, вы понимаете, на что только что подписались. Быть должным такой преступнице, как я, — не мелочь."
10032010-89 = "Наслаждайтесь каждым мгновением, потому что однажды я заставлю вас вернуть долг с процентами."
10032010-90 = "Итак, куда сначала? Считайте меня местным экспертом по Оперному театру, Сенсей. Вся сцена перед вами."
10032010-91 = ""
10032010-93 = ""
10032010-94 = ""
10032010-95 = "(Теперь осталось только дождаться прибытия цели, а значит, я могу не торопиться и провести время с Сенсеем. Хи-хи!)"
10032010-96 = "(В последнее время так трудно найти свободную минутку с ним...)"
10032010-97 = ""
10032010-99 = ""
10032010-100 = ""
10032010-101 = ""
10032010-102 = ""
10032010-103 = "Хи-хи..."
10032010-104 = "Ну? Ваше желание — закон, Сенсей!"
10032010-106 = ""
10032010-107 = "...Вам интересно закулисье?"
10032010-108 = "Мудрый выбор. Хотите показать те части Оперного театра, куда обычному человеку доступа нет."
10032010-109 = "Обычно нас бы вышвырнули уже за один шаг за кулисы."
10032010-110 = "Но вы, конечно, VIP, Сенсей. Возможно, для вас даже проведут объяснения."
10032010-111 = "Можете кого-нибудь спросить. Просто поговорите с продюсером или сценическим менеджером."
10032010-112 = "...А?"
10032010-113 = "Ч-Что значит, откуда я знаю все эти мелочи? Н-Не так уж их много!"
10032010-114 = "Я просто... человек деталей! Я всегда слишком хорошо готовлюсь к работе!"
10032010-115 = ""
10032010-117 = ""
10032010-118 = "Почему мы вообще обсуждаем такие неважные вещи? Ха-ха-ха! Просто будьте благодарны, что я делюсь с вами своими безграничными знаниями!"
10032010-119 = "На самом деле я использую эти знания, чтобы найти вам продюсера... Хм. Сейчас они, должно быть, очень заняты, но..."
10032010-120 = "Где-то же должен быть..."
10032010-121 = ""
10032010-126 = "...кто-нибудь?"
10032010-127 = ""
10032010-132 = ""
10032010-133 = "...А?"
10032010-134 = "[s11] «Почему потолок трясётся?»\n[s12] «Он... вибрирует над нами?»"
10032010-137 = "...Сверху?"
10032010-138 = ""
10032010-140 = ""
10032010-146 = "Сенсей!"
10032010-147 = ""
10032010-153 = ""
10032010-154 = "Вы в порядке? Сенсей? Нигде не пострадали?!"
10032010-155 = "О? Вы в порядке... Травм вроде нет..."
10032010-156 = "*вздыхает* Вы меня ужасно напугали, Сенсей."
10032010-157 = "(Кто бы мог подумать, что потолок рухнет... и именно здесь.)"
10032010-158 = "Если бы я знала, что они сначала ударят сюда, отвела бы вас в другое место..."
10032010-159 = "...А?"
10032010-160 = "Что значит «ударят»? А? Эм, кто это сказал? Точно не я!"
10032010-161 = ""
10032010-163 = ""
10032010-164 = "Ха-ха! Хах! Вы наверняка просто ослышались, Сенсей!"
10032010-165 = "П-Потому что, конечно, вы же знаете...!"
10032010-166 = "Думаете, дешёвая засада нас возьмёт? Вы вообще знаете, кто мы такие?!"
10032010-167 = "ПопадитесьпопадитесьпопадитесьпопадитесьПОПАДИТЕСЬ!"
10032010-168 = "Раз это план Ару, просто попадитесь! Я СКАЗАЛА — СДАЙТЕСЬ!"
10032010-169 = "...Ах."
10032010-170 = ""
10032010-178 = "Харука, успокойся! Босс сказала, что надо разобраться со всем тихо! Тихо!"
10032010-180 = "Хи-хи. Наконец становится весело."
10032010-181 = "Но очень надеюсь, что Сенсей не поймёт, чем мы занимаемся. Вот это действительно всё испортит."
10032010-182 = ""
10032010-184 = "...Упс."
10032010-185 = ""
10032010-187 = ""
10032010-188 = ""
10032010-189 = "Ч-что?!"
10032010-190 = "Эм... Сэн..."
10032010-191 = ""
10032010-192 = ""
10032010-193 = "...сэй?"
10032010-194 = "[s13] «Ну, здравствуйте.»\n[s14] «Вот это эффектное появление!»"
10032010-197 = "А. Сенсей?"
10032010-198 = "Вы ведь случайно не слышали, ну, буквально всё, что мы сказали? Особенно часть про «разобраться со всем»."
10032010-199 = ""
10032010-201 = ""
10032010-202 = "Ну, похоже, кот уже выпрыгнул из мешка!"
10032010-203 = "Не думаю, что в этот раз его получится просто запихнуть обратно..."
10032010-204 = ""
10032010-205 = ""
10032010-206 = ""
10032010-207 = "*вздыхает* Хоть бы раз вы меня послушали."
10032010-208 = "...Ну что."
10032010-209 = "Как сказала Муцуки, просто отмахнуться от этого уже не получится. Что дальше, босс?"
10032010-210 = "...Босс?"
10032010-211 = ""
10032010-212 = ""
10032010-213 = "Не трать дыхание. Смотрите. Ару окаменела!"
10032010-214 = "Н-Нееет! Ару! Кто это с тобой сделал?!"
10032010-215 = "...Наверное, тот, кто взорвал потолок."
10032010-217 = "Ублюдки за это заплатят!"
10032010-218 = ""
10032010-220 = ""
10032010-221 = "Вы ещё смеете думать о похищении нашего босса?! Глупцы лезут туда, куда ангелы ступать боятся..."
10032010-222 = "К оружию, все! Скрутим каждого до последнего и будем бить, пока не заговорят!"
10032010-223 = ""
10032010-234 = ""
10032010-235 = "Г-Г-Г... ГЛУПЦОМ?! Ты только что назвал Ару глупой?!"
10032010-236 = "Хм..."
10032010-237 = "Простите за всё это, но можем поговорить чуть позже?"
10032010-238 = "Ага, ага. Похоже, у нас тут ситуация."
10032010-239 = "Не против отругать нас потом, Сенсей?"
10032010-240 = "[s15] «Я помогу вам, а потом поговорим.»\n[s16] «Просто следуйте моим указаниям.»"
10032010-243 = "Хи-хи. Договорились."
10032010-244 = "Спасибо, Сенсей. Раз так..."
10032010-245 = "...Разберёмся с этими ребятами."
10032010-246 = ""
10032010-249 = "Приготовьтесь УМЕРЕТЬ!!!"
