[translation]
1007205-1 = "Монстр на отмели"
1007205-2 = "Я отправился на илистую отмель к западу от города, чтобы встретиться с Саки."
1007205-3 = ""
1007205-6 = ""
1007205-7 = "А, Сенсей, вот вы где."
1007205-8 = ""
1007205-10 = ""
1007205-11 = ""
1007205-12 = "...Что на вас надето?"
1007205-13 = "[s] «А? Это моя обычная одежда...»"
1007205-14 = "Я говорю вам встретиться со мной на илистой отмели, а вы приходите в обычной одежде..."
1007205-15 = "Вы ведь не рассчитываете, что потом я буду это стирать?"
1007205-16 = "[s1] «По крайней мере, я не забыл надеть сапоги.»\n[s2] «Всё нормально. Я просто посмотрю со стороны.»"
1007205-19 = "Не недооценивайте отмели."
1007205-20 = "Люди приходят сюда, ожидая приятного дня у моря, а потом обнаруживают, что здесь не менее коварно, чем в болоте."
1007205-21 = "Если обе ноги засосёт в грязь, вас прижмёт так, что выбраться самостоятельно станет невозможно."
1007205-22 = "А если прилив начнётся, пока вы застряли в грязи? Будут серьёзные проблемы."
1007205-23 = "Поэтому держите центр тяжести пониже и следите за опорой под ногами, даже если ради этого придётся испачкать хорошую одежду."
1007205-24 = "По крайней мере, сегодня рядом есть жители деревни, так что в экстренной ситуации нам помогут, но..."
1007205-25 = "[s] «Буду смотреть под ноги.»"
1007205-26 = "Хорошо. Собирать буду я. Вы идите медленно следом и держитесь сбоку."
1007205-27 = ""
1007205-29 = ""
1007205-30 = "Думаю, начать можно здесь..."
1007205-34 = ""
1007205-35 = "Сенсей, смотрите! Я нашла черенка!"
1007205-36 = "Я заметила здесь норку, сунула туда кулак — и вот что вылезло."
1007205-37 = "Моллюсков ловить намного проще..."
1007205-39 = "О, ещё одна норка."
1007205-40 = "Так, посмотрим..."
1007205-41 = ""
1007205-43 = ""
1007205-44 = "А, в этот раз попался бычок."
1007205-45 = "Выглядят они страшненько, зато в горячем горшочке очень вкусные."
1007205-46 = "Хи-хи... Каждый раз, когда я засовываю руку в грязь, оттуда выскакивает крупный моллюск или рыба. Прямо как поиск сокровищ."
1007205-47 = "[s] «У тебя неплохо получается.»"
1007205-48 = "Конечно. Как студент Академии SRT я умею действовать на любой местности."
1007205-49 = "А как разведчику отряда RABBIT мне проще простого засечь спрятавшуюся цель!"
1007205-52 = ""
1007205-53 = "А, вот ещё одна норка."
1007205-54 = "Что там будет на этот раз...?"
1007205-55 = ""
1007205-59 = ""
1007205-61 = "Попались!"
1007205-62 = ""
1007205-67 = "Хмм...?"
1007205-68 = "Что ЭТО такое?"
1007205-69 = ""
1007205-71 = ""
1007205-72 = ""
1007205-73 = "Ух, оно какое-то скользкое... красное... как морской огурец..."
1007205-74 = "С-Сенсей, вы знаете, что это?"
1007205-75 = "[s] «Без понятия!»"
1007205-76 = ""
1007205-78 = ""
1007205-80 = ""
1007205-81 = ""
1007205-82 = "О, это толстый морской червь."
1007205-83 = "Т-толстый морской червь...?!"
1007205-84 = "Хм. Полагаю, городские редко такое видят."
1007205-85 = ""
1007205-87 = ""
1007205-89 = "Они вполне съедобны. Нарежьте и ешьте сырыми или замаринуйте для более насыщенного вкуса."
1007205-90 = "Выглядит не очень, зато вкус приятный, насыщенный, с лёгкой сладостью. Гурманы их обожают."
1007205-91 = "Неплохой улов. Наверное, новичкам везёт!"
1007205-92 = ""
1007205-94 = ""
1007205-96 = ""
1007205-97 = ""
1007205-98 = "Сенсей."
1007205-99 = "Заберите это у меня."
1007205-100 = "[s] «Чего такая спешка?»"
1007205-101 = "Это. Этот червь. Он извивается. И из него брызжет... что-то..."
1007205-102 = "Уберите его от меня. Сейчас же."
1007205-103 = "[s] «Тогда просто выбрось его.»"
1007205-104 = "Вы меня вообще слушали? Это деликатесный ингредиент!"
1007205-105 = "Я не могу просто выбросить хорошую еду..."
1007205-106 = "Не отойду!"
1007205-107 = ""
1007205-109 = ""
1007205-110 = "Так что, эм... ПОЖАЛУЙСТА, просто заберите его уже!"
1007205-111 = "[s] Сбежать."
1007205-112 = ""
1007205-115 = ""
1007205-116 = "Эй! Вернитесь!"
1007205-117 = ""
1007205-119 = ""
1007205-121 = "После довольно долгой погони Саки наконец догнала меня и всучила мне толстого морского червя."
1007205-122 = "Вернувшись в город, мы сделали из него сашими. И, как оказалось, есть это действительно было вкусно..."
