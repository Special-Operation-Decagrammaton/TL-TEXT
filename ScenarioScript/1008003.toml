[translation]
1008003-1 = "У каждого есть слабость"
1008003-2 = "Мы встретились с Шокухо на пустой детской площадке."
1008003-3 = ""
1008003-6 = ""
1008003-7 = "Мне было любопытно, что это за место... Но такого я точно не ожидала."
1008003-8 = "Ну? Зачем ты позвал меня сюда, Сенсей?"
1008003-9 = "...О?"
1008003-10 = "Потому что мне трудно сосредоточиться... Ты решил, что мне стоит подышать свежим воздухом?"
1008003-11 = "Если бы всё было так просто, я бы наверняка уже сделала это сама..."
1008003-12 = "Что ж, пожалуй, ненадолго выйти наружу — не худшая идея."
1008003-13 = "Хм?"
1008003-14 = "Раз уж мы здесь, ты предлагаешь немного пробежаться?"
1008003-15 = "Ах... Хм... Ну-ну. В этом совершенно нет необходимости."
1008003-16 = "Более того, не думаю, что это будет разумно..."
1008003-17 = "Такое занятие не слишком подходит интеллектуальной особе вроде меня, знаешь ли."
1008003-18 = ""
1008003-21 = "Сенсей?! Ты меня слушаешь? Похоже, ты уже готовишься бежать..."
1008003-22 = "[s1] Побежим не спеша!\n[s2] Это всего лишь лёгкая пробежка!"
1008003-25 = ""
1008003-28 = "Сенсей! Куда ты побежал один?!"
1008003-29 = "П-Подожди! Не так быстро...!"
1008003-30 = ""
1008003-32 = ""
1008003-33 = ""
1008003-34 = "Мы даже одного круга не закончили, а уже..."
1008003-35 = ""
1008003-40 = "[ns] «...?»"
1008003-42 = "[ns3] ...Шокухо?\n[ns4] Ты вдруг совсем притихла..."
1008003-48 = ""
1008003-49 = ""
1008003-50 = ""
1008003-51 = ""
1008003-52 = "*тяжело дышит* С-Стой... *тяжело дышит*"
1008003-53 = "Я... уже столько раз тебя звала... *тяжело дышит* *тяжело дышит*"
1008003-54 = "*тяжело дышит* *тяжело дышит*"
1008003-55 = "Угх..."
1008003-56 = ""
1008003-58 = ""
1008003-61 = "[ns5] Шокухо?!\n[ns6] Ты в порядке?! Шокухо!"
1008003-67 = "Я поднял Шокухо с земли и поспешил с ней в больницу."
1008003-68 = ""
1008003-69 = "..."
1008003-70 = "...Хм? Ох..."
1008003-71 = "Я потеряла сознание..."
1008003-72 = ""
1008003-75 = "...Сенсей?"
1008003-76 = "Ты всё это время ждал рядом со мной? ...Почему ты так на меня смотришь?"
1008003-77 = "...?"
1008003-78 = "Ты извиняешься...? А. Из-за того, что случилось в парке?"
1008003-79 = "Тебе не за что извиняться. Если уж на то пошло, мне самой немного неловко из-за случившегося."
1008003-80 = "Я знаю, что могу казаться высокомерной, но на самом деле всё совсем не так. Просто я осторожна."
1008003-81 = "Хм... Кстати... Я не очень хорошо помню, что было после того, как упала..."
1008003-82 = "Ты отвёз меня к врачу, верно? Полагаю, меня осмотрели."
1008003-83 = "Это не страшно. Они нашли что-нибудь, о чём стоило бы беспокоиться?"
1008003-84 = "Хм?"
1008003-85 = "Ты уходишь от ответа. Они нашли что-то тревожное?"
1008003-86 = "Если после моего появления здесь возникли какие-то странные симптомы..."
1008003-87 = "[s7] Нет, дело не совсем в этом...\n[s8] Просто..."
1008003-90 = ""
1008003-93 = "...?"
1008003-94 = "То есть ничего явно плохого нет. Разве это не хорошо?"
1008003-95 = "Врач... рассердился? Почему...?"
1008003-96 = "О."
1008003-97 = "То есть моё тело ослабло из-за недостатка физической нагрузки...?"
1008003-98 = ""
1008003-100 = ""
1008003-101 = "Х-Хм..."
1008003-102 = "Понятно... Что ж... Так уж вышло..."
1008003-103 = "Я из тех, кто привык полагаться на ум, а не на тело..."
1008003-104 = "..."
1008003-105 = "Сенсей?"
1008003-106 = "Мне едва ли нужно применять способность, чтобы понять, о чём ты думаешь..."
1008003-107 = "Даже если будешь так на меня смотреть..."
1008003-109 = "Я не стану этого делать."
