[translation]
32040-1 = "Episódio 4;Festa de Maiô"
32040-3 = "Auuu... Está chovendo bastante, né..."
32040-4 = "Pois é."
32040-5 = "Humm..."
32040-6 = "Ora, bom dia, Koharu-chan."
32040-7 = "Bom dia. A Azusa-chan... parece que ainda não vai conseguir acordar tão cedo."
32040-8 = "Hnn... humm..."
32040-9 = "O que deu nela? A Azusa costumava acordar bem cedo..."
32040-10 = "Será que ela não estava se forçando demais até agora? Acho melhor deixarmos ela dormir mais um pouquinho..."
32040-11 = "Humm... Não pode, coisas fofas são... tão macias... isso não é bom..."
32040-12 = "Além disso, parece que ela está tendo um sonho muito bom♡"
32040-13 = "[s] \"Talvez também seja por causa da chuva.\""
32040-19 = "A-Auuu... Parece que começou até a trovejar..."
32040-20 = "...Ora."
32040-21 = "O que foi?"
32040-22 = "Eu tinha me esquecido completamente, a roupa lavada ficou lá fora...!"
32040-27 = "I-Isso é ruim...?!"
32040-32 = "...?"
32040-42 = "(E então, cerca de uma hora depois...)"
32040-49 = "Muito bem, damos início agora à memorável 1ª Festa de Maiô do Clube de Aulas de Reforço♡"
32040-50 = "Auuu..."
32040-51 = "..."
32040-52 = "Por quê? Como as coisas foram acabar assim...?"
32040-58 = "[ns] \"Essa é uma situação incrível em vários sentidos...\""
32040-59 = "Ufufu, não tem outro jeito, não é mesmo?♡"
32040-61 = "(Voltando um pouco no tempo, cerca de 40 minutos atrás...)"
32040-63 = "Acho que isso é tudo."
32040-64 = "Isso aqui... foi perda total mesmo. Até respingou lama, parece que vamos ter que lavar tudo de novo."
32040-65 = "O uniforme de educação física também ficou num estado horrível... Uuu, está todo encharcado até por dentro...!"
32040-66 = "Isso foi porque a Koharu tropeçou e caiu no meio do caminho."
32040-67 = "Me desculpem, acabou me fugindo da cabeça... Foi culpa minha por ter sugerido de lavarmos as roupas de todo mundo juntas."
32040-68 = "Não, a culpa não é da Hanako. A roupa é só lavar mais uma vez, e nós só precisamos nos trocar. Não é motivo para ficar se culpando tanto."
32040-69 = "Sim, isso mesmo. Se continuarmos com essas roupas molhadas vamos acabar pegando um resfriado, então vamos logo nos trocar primeiro."
32040-70 = "...Muito obrigada. Tem razão, precisamos secar o cabelo também."
32040-74 = "...Ah."
32040-75 = "Koharu-chan? Aconteceu alguma coisa?"
32040-76 = "...Não tenho mais nada para vestir."
32040-77 = "...Hã?"
32040-78 = "Pensando bem, eu também não. Tanto o uniforme quanto esta roupa de educação física estão encharcados, e não tenho outras roupas reservas."
32040-79 = "A-Agora que falaram, eu também não, auuu..."
32040-80 = "...Ora, ora♡ Bom, acho que estudar só de roupa íntima também é uma ótima ideia, sabia?"
32040-81 = "O que você está dizendo?! Idiota! Uma indecência dessas não pode! Por que a conversa sempre vai para esse lado?!"
32040-82 = "Mas faz sentido. Eu trouxe peças íntimas de sobra e, se calçarmos as meias, manter a temperatura corporal não deve ser um problema."
32040-83 = "Não concorde com essas esquisitices! Ficar de roupa íntima na sala de aula é absurdo demais, né?!"
32040-84 = "Mas, Koharu-chan, tente imaginar..."
32040-86 = "Chega, você aí, fique calada!!"
32040-90 = "É só lavar rapidinho e secar na hora usando um secador de cabelo ou algo assim!"
32040-91 = "Enquanto isso, é só a gente se enrolar numa toalha de banho! E se acontecer alguma coisa, é só pedir para o Sensei resolver!"
32040-92 = "Além do mais, nessa situação não tem necessidade nenhuma de pensar em estudar com tanta pressa! Por que ficaram tão desesperadas para estudar assim do nada?!"
32040-94 = "Mesmo que seja assim, durante esse tempo não acabaríamos ficando só de roupa íntima de qualquer jeito?"
32040-95 = "Eu queria estudar logo, mas se não podemos ir para a sala de aula até a lavagem terminar, não tem jeito. Por enquanto, vamos tirar a roupa."
32040-96 = "Auuu, não temos escolha, né... Por ora, o jeito é tirar..."
32040-98 = "Por que todo mundo está tão ansioso para tirar a roupa?! Exibicionismo é crime, sabiam?!"
32040-100 = "Quarto do Sensei"
32040-101 = "(Decidimos ficar no quarto por enquanto, até a roupa terminar de lavar.)"
32040-106 = "Hã?! O-O quê?!"
32040-107 = "P-Parece que acabou a luz...?"
32040-108 = "Seria uma queda de energia causada por um raio?"
32040-112 = "Hã? Q-Que barulho foi esse agora...?!"
32040-113 = "...Surgiu um problema."
32040-114 = "A máquina de lavar parou, e a tampa também não abre. Que complicação."
32040-115 = "...!?"
32040-119 = "[ns] \"Bom, acho que não tinha muito como evitar...\""
32040-120 = "Pois é. Já que chegamos a esse ponto, não nos resta nada a fazer além de uma festa de maiô no lugar de uma festa do pijama♡"
32040-121 = "Auuu... E-Eu tenho a impressão de que haveria outras opções, mas..."
32040-122 = "Entendo, uma festa de roupa íntima também seria uma possibilidade, né?♡ Pensando bem, realmente existem algumas outras opções, mas têm certeza de que preferem isso...? Fufu."
32040-123 = "Desse jeito fica difícil até dar aula... O prédio inteiro parar de funcionar só por causa de um raio desses, que segurança horrível."
32040-124 = "Bom, é um prédio antigo, afinal..."
32040-125 = "Aliás, espera aí! Eu não vou me deixar levar nessa conversa! Que história é essa de festa de maiô?! Que indecência!!"
32040-126 = "Até concordo com a parte de não dar para ter aula e não termos roupa para vestir, mas nesse caso era só descansarmos quietas no quarto! Pensando normalmente!"
32040-127 = "Ora, mas não acham que momentos assim são justamente o ponto alto de um acampamento de estudos?"
32040-128 = "Todas juntinhas, revelando o lado mais profundo umas das outras... Ainda por cima está chovendo e não dá para ver nada por causa do apagão, o clima está perfeito!"
32040-133 = "Ufufufu...♡ Já que ganhamos esse tempo livre, que tal aproveitarmos de um jeito bem produtivo?"
32040-134 = "Ahaha... R-Realmente, tem mesmo aquela cara de tradição de acampamento."
32040-135 = "Entendo, então é isso que significa esta festa de maiô."
32040-136 = "Não, não, não, como assim você se convenceu?! Qual é o sentido de misturar isso com maiô?!"
32040-137 = "Auuu, realmente..."
32040-138 = "Ora, vamos lá, já que estamos aqui, vamos aproveitar."
32040-139 = "Dito isso, é só um bate-papo, então qualquer assunto está valendo♡"
32040-140 = "Fufu♡ Eu sempre quis muito fazer esse tipo de coisa. Por isso, digamos que estou um pouquinho empolgada..."
32040-141 = "[s] \"Você parece estar se divertindo mesmo, Hanako.\""
32040-142 = "Eu entendo esse sentimento. Para falar a verdade, eu me sinto assim o tempo todo desde que entrei para o Clube de Aulas de Reforço."
32040-143 = "Ora, é mesmo?"
32040-144 = "Sim. Aprender coisas novas, comer junto com todo mundo, lavar roupa e limpar... Cada uma dessas coisas é divertida."
32040-145 = "Ora...♡"
32040-146 = "Eu achava que maiô era algo para se vestir apenas ao nadar, então é a primeira vez que descubro que existe uma utilidade dessas. Poder aprender o que eu não sabia é algo divertido."
32040-147 = "S-Sobre a questão do maiô, acho que a ideia está um pouquinho errada, mas..."
32040-148 = "Mas é fácil de se movimentar e tem boa ventilação. Agora faz sentido a Hanako ter andado pela escola vestindo isso."
32040-149 = "Não é mesmo? Foi exatamente o que eu disse, Koharu-chan."
32040-150 = "Não, andar lá fora vestida assim é crime! Não se convença disso! É atentado ao pudor, sabia?!"
32040-151 = "Estudar junto com a Koharu também é divertido."
32040-152 = "Hã?! Q-Que isso assim do nada?! Por que está dizendo uma coisa vergonhosa dessas tão de repente?!"
32040-153 = "Ora, ora...♡"
32040-154 = "B-Bom, estudando junto com alguém da elite como eu, acho que você tem mesmo muito a aprender!"
32040-155 = "Sim, é verdade mesmo."
32040-160 = "Azusa-chan... No começo eu fiquei preocupada porque quase não conseguia ler suas mudanças de expressão, mas... que bom!"
32040-164 = "Claro que com a Hifumi também. Você sempre cuida tão bem de mim, obrigada."
32040-168 = "A-Azusa-chan!! Buááá!!"
32040-173 = "(Abraço apertado)"
32040-174 = "H-Hifumi, está difícil de respirar."
32040-176 = "(E assim, a conversa do Clube de Aulas de Reforço fluiu animadamente...)"
32040-178 = "Por falar nisso, ouvi dizer que o aquário da Trinity está exibindo um peixe raro chamado \"Atum Dourado\"."
32040-179 = "Ah, eu também vi isso no folheto! Ele é chamado de \"Peixe Lendário\", não é?"
32040-180 = "Sim, parece que foi descoberto no mar aqui perto. Eu queria ir ver, mas como o ingresso não é barato..."
32040-181 = "O mar, é...? Pensando bem, nunca fui lá nenhuma vez."
32040-182 = "É-É sério?! Nem uma vez...?!"
32040-184 = "E aí, apesar de ser um parque de diversões que já faliu há muito tempo, dizem que quando chega a noite dá para ouvir uns barulhos agitados vindo de lá..."
32040-185 = "C-Claro que isso não existe! Só podem ter ouvido errado!"
32040-186 = "Bom, eu também só ouvi falar disso como um boato..."
32040-187 = "Não quero nem saber! Com certeza é mentira! É tudo pegadinha de alguém!"
32040-188 = "A-Ahaha..."
32040-190 = "Andar de maiô pela cidade ou dentro da escola não é nada tão estranho assim, sabia?"
32040-191 = "Claro que é sim! Não saia alterando o bom senso por conta própria!"
32040-192 = "Mas, segundo uma história que ouvi das Irmãs... parece que em alguma zona sem lei de Kivotos existe uma gangue criminosa que anda de maiô e máscara no rosto, sabia?"
32040-193 = "D-De maiô e máscara...?! Que bando de pervertidos! O que é isso?!"
32040-194 = "Aliás, você mesma disse \"gangue criminosa\"! Uma coisa dessas, mesmo sem fazer nada, só pela aparência já é um crime!"
32040-195 = "Para existir um grupo assim, é porque em outras regiões isso é normal. Por isso, Koharu-chan, da próxima vez vamos juntas..."
32040-196 = "Não! Não sei o que você vai inventar de dizer, mas já digo que não quero!!"
32040-201 = "......"
32040-203 = "Azusa-chan, acho que seria melhor você dormir direito à noite, sabia?"
32040-204 = "...Sim. Hoje de manhã acabei dormindo demais e causando problemas."
32040-205 = "Dormir demais em um lugar ao qual não estou acostumada é algo que quase nunca me aconteceu até hoje..."
32040-206 = "...Talvez seja porque este aqui já não é mais um \"lugar ao qual não estou acostumada\"."
32040-207 = "...De qualquer forma, é melhor você dormir melhor. Reduzindo um pouco essas vigias de madrugada."
32040-208 = "Vigias...? O que é isso?"
32040-209 = "Ah, toda noite de madrugada eu faço uma pequena vigia..."
32040-210 = "[s] \"A Hanako estava muito preocupada com você, Azusa.\""
32040-211 = "É mesmo...?"
32040-212 = "...Desculpa."
32040-216 = "Na verdade, a vigia era só uma desculpa... Eu estava instalando armadilhas e coisas do tipo."
32040-218 = "Armadilhas...?"
32040-219 = "...?"
32040-220 = "Por que fez uma coisa dessas...?"
32040-222 = "Não se preocupem, só instalei nas rotas por onde alguém tentaria invadir este lugar com más intenções. Para a nossa rotina normal, não há nenhum risco à segurança."
32040-223 = "(Pensando no que aconteceu com a Mari-san ontem, tenho a impressão de que não é bem assim...)"
32040-224 = "Entendo... Mas, se era esse o caso, eu ficaria feliz se você nos avisasse. Afinal, não tem como não nos preocuparmos."
32040-225 = "...Entendi. Certo, vou tomar cuidado daqui para frente."
32040-226 = "Porque a última coisa que eu quero é que o Sensei e todas vocês saiam prejudicados por minha causa."
32040-227 = "[s] \"Você é muito gentil, Azusa.\""
32040-228 = "Quê... N-Não me trate como criança, Sensei."
32040-229 = "Eu não sou... nada disso."
32040-230 = "Até porque, neste mundo, tudo é sem sentido e vão. Por isso, quem sabe..."
32040-231 = "Talvez um dia eu acabe traindo... todas vocês, essa confiança e esses sentimentos."
32040-235 = "..."
32040-236 = "Azusa-chan...?"
32040-237 = "...?"
32040-241 = "Ah, a luz..."
32040-242 = "Parece que voltou."
32040-243 = "A-A chuva também parou sem a gente perceber...!"
32040-244 = "Verdade. Bom, que tal colocarmos a roupa para lavar de novo?"
32040-248 = "Sim. Então a 1ª Festa de Maiô se encerra por aqui. Estou ansiosa pela segunda edição."
32040-249 = "Não vai ter segunda rodada nenhuma! Essa foi a primeira e última!"
32040-251 = "(Depois de terminarmos de lavar a roupa, decidimos descansar pelo resto do dia.)"
32040-252 = "(E assim o dia passou...)"
32040-254 = "Não, ainda não! Deixar o dia terminar assim seria um desperdício enorme, e eu não vou permitir isso!"
32040-255 = "O-O quê...?!"
32040-259 = "O-O que foi?! Você pulou tão de repente que me deu um susto..."
32040-261 = "Foi algo inesperado, mas já que ganhamos essa folga, não é? Depois de todas nós termos nos relacionado nuas, simplesmente dar boa-noite e ir dormir assim..."
32040-262 = "Não saia fabricando memórias por conta própria! A gente não estava nua!"
32040-263 = "Deixando isso de lado, seria um desperdício irmos dormir assim. Digamos que meu corpo ainda está quente, ou que ainda quero mais..."
32040-264 = "Mais especificamente?"
32040-265 = "Ufufu♡ Falando em acampamento, escapar do alojamento... também é um dos maiores encantos, não acham?"
32040-266 = "Hã...?"
32040-267 = "Vamos lá! Vamos todas sair escondidas agora mesmo para dar um passeio♡"
32040-268 = "O distrito comercial da Trinity tem várias lojas que ficam abertas até tarde da noite, então podemos comer umas coisinhas pelo caminho e fazer compras!"
32040-270 = "I-Isso é violação das regras da escola! Não pode!"
32040-271 = "Não conheço as regras nos mínimos detalhes, mas acho que bastante gente faz isso escondido, viu? Por acaso não tem alguém assim perto de você, Hifumi-chan?"
32040-272 = "A-Ahaha... Pois é, né...?"
32040-273 = "M-Mas em dias normais até vai, só que agora estamos no meio do acampamento do Clube de Aulas de Reforço... Será que tudo bem mesmo...?"
32040-274 = "Não é como se fôssemos para longe, é logo ali. E você, Koharu-chan, o que acha? Não parece divertido?"
32040-275 = "É-É que... I-Interesse eu até tenho, mas..."
32040-276 = "Isso, vamos só dar uma passadinha lá e voltar, então não tem problema. Tudo bem por você, Sensei?"
32040-277 = "[s] \"Parece divertido, vamos lá.\""
32040-279 = "P-Pode mesmo?!"
32040-283 = "Estou pronta. Podemos partir imediatamente."
32040-284 = "Azusa-chan?! Quando foi que você se trocou...?!"
32040-285 = "Então está decidido♡"
32040-286 = "Vamos, preparem-se logo para irmos! Isso está ficando divertido, um passeio de madrugada completamente nuas...!"
32040-287 = "Não distorça as coisas na cara dura!! Vista uma roupa!!"
32040-289 = "(E assim, de repente, começou o nosso passeio noturno.)"
32040-291 = "Próximo;Confusão da Meia-Noite (1)"
