[translation]
32040-1 = "Эпизод 4;Симпозиум купальников"
32040-3 = "Льёт как из ведра."
32040-4 = "Ещё как."
32040-5 = "М-м... Доброе утро."
32040-6 = "Доброе утро, Кохару!"
32040-7 = "Утро. Похоже, сегодня Азуса встаёт последней."
32040-8 = "Хм-м... М-м..."
32040-9 = "Что случилось? Обычно она просыпается первой."
32040-10 = "Думаю, последние дни она слишком сильно себя загоняла. Пусть поспит ещё немного."
32040-11 = "Хм... нет. Милые существа... Такие круглые и пушистые... Нельзя."
32040-12 = "Похоже, кому-то снится хороший сон. ♥"
32040-13 = "[s] «Нет ничего лучше, чем поспать подольше в дождливый день.»"
32040-14 = ""
32040-17 = ""
32040-19 = "Х-Хотя гром может помешать."
32040-20 = "Ой-ой."
32040-21 = "Что такое?"
32040-22 = "Бельё, которое я вчера развесила сушиться! Я совсем про него забыла!"
32040-23 = ""
32040-25 = ""
32040-26 = ""
32040-27 = "Плохо дело!"
32040-28 = ""
32040-30 = ""
32040-32 = "Хм?"
32040-33 = ""
32040-35 = ""
32040-36 = ""
32040-37 = ""
32040-38 = ""
32040-39 = ""
32040-40 = ""
32040-42 = "Час спустя."
32040-45 = ""
32040-47 = ""
32040-49 = "Итак. Начинаем первый Симпозиум купальников Клуба дополнительных занятий! ♥"
32040-50 = "Не уверена насчёт этого..."
32040-51 = "Хм-м."
32040-52 = "И почему всё дошло до такого...?"
32040-53 = ""
32040-56 = ""
32040-57 = ""
32040-58 = "[ns] «Мы вступили в неизведанные воды.»"
32040-59 = "И, добавлю, одеты для случая идеально. ♥"
32040-61 = "40 минутами ранее."
32040-63 = "Вот и всё."
32040-64 = "Всё насквозь мокрое. И вдобавок в грязи. Единственный вариант — снова всё постирать."
32040-65 = "Даже спортивная форма теперь мокрая! Она липнет ко мне, будто её клеем намазали."
32040-66 = "Потому что ты споткнулась и облила всех нас."
32040-67 = "Нет, это моя вина. Я сама предложила заняться стиркой, а потом про неё забыла."
32040-68 = "Не вини себя. Мы всегда можем перестирать бельё, а пока надеть что-нибудь другое."
32040-69 = "Верно. Сначала переоденемся во что-нибудь сухое и тёплое. Если продолжим носить это, простудимся."
32040-70 = "А для верности давайте все вместе примем горячий душ, а потом высушим друг другу волосы."
32040-71 = ""
32040-73 = ""
32040-74 = "...!"
32040-75 = "Что-то не так?"
32040-76 = "У меня... не осталось чистой одежды."
32040-77 = "А?"
32040-78 = "У меня тоже. Форма и спортивная одежда промокли, а запасной одежды нет."
32040-79 = "У тебя тоже? Постой! У меня ведь тоже нет..."
32040-80 = "Разве не забавный поворот? Видимо, сегодня придётся заниматься в лифчиках и трусиках, девочки. ♥"
32040-81 = "Мечтай, извращенка! Мы не станем так делать!"
32040-82 = "В её словах есть смысл. У всех есть чистое бельё, а носки помогут не замёрзнуть."
32040-83 = "Не соглашайся с её безумием! Нельзя идти на занятия в одном белье!"
32040-84 = "Почему нет? У тебя совсем нет воображения—"
32040-86 = "Ни слова больше!!!"
32040-87 = ""
32040-89 = ""
32040-90 = "Придётся как можно быстрее постирать всё и высушить часть одежды феном или чем-нибудь ещё!"
32040-91 = "А пока придётся обойтись полотенцами! Сенсей подождёт нас в коридоре!"
32040-92 = "Можно отложить учёбу хотя бы на несколько часов. Почему тебе вдруг так не терпится взяться за книги?"
32040-94 = "Пожалуй, но мы всё равно на несколько часов застрянем в одном белье."
32040-95 = "Я предпочла бы начать занятия как можно скорее, но пока войти в класс нельзя. Остаётся лишь снять это."
32040-96 = "*вздыхает*..."
32040-98 = "Почему вы так разочарованы, что не получится учиться в белье?! Хотите казни за непристойное обнажение?!"
32040-100 = "Комната Сенсея"
32040-101 = "Я решил остаться в комнате, пока стирка не закончится."
32040-102 = ""
32040-106 = "А-а-а! Что случилось?!"
32040-107 = "Кажется, отключилось электричество."
32040-108 = "Похоже на то. Наверное, из-за грозы."
32040-109 = ""
32040-112 = "Ч-что это был за звук?!"
32040-113 = "У нас проблема."
32040-114 = "Это остановилась стиральная машина. И она заблокирована. Что делать?"
32040-115 = "...?!"
32040-119 = "[ns] «Так мы и прибегли к последнему средству.»"
32040-120 = "Именно. Единственный выход — провести симпозиум в купальниках. ♥"
32040-121 = "*вздох* Должен быть другой способ..."
32040-122 = "Пожалуй, ты права. Можно вместо этого устроить симпозиум в белье. Я совсем не против. ♥"
32040-123 = "В таких условиях проводить занятия будет трудно. К тому же из-за молнии отключились все системы здания. Наша оборона полностью открыта."
32040-124 = "Н-ну, со старыми зданиями во время грозы такое бывает."
32040-125 = "Кого это волнует?! Почему вы вообще соглашаетесь на этот нелепый симпозиум?!"
32040-126 = "Мы ведь решили, что без одежды заниматься нельзя! Может, вернёмся в общежитие и отдохнём, пока электричество не включат?!"
32040-127 = "Но что это за лагерь, если мы упустим шанс создать воспоминания?"
32040-128 = "Это наш шанс поделиться самым сокровенным. Внезапное отключение света, ливень... Атмосфера идеальна!"
32040-129 = ""
32040-131 = ""
32040-133 = "Можно побаловать себя, пока есть возможность. Живём один раз. ♥"
32040-134 = "Я-я не отрицаю, что воспоминания — часть хорошего лагеря..."
32040-135 = "Понятно. Значит, в этом цель симпозиума в купальниках."
32040-136 = "Вовсе нет! В занятиях в купальниках нет ничего образовательного!"
32040-137 = "Э-Э-э..."
32040-138 = "Ну-ну. Не нужно повышать голос, Кохару. Давайте плыть по течению и повеселимся, пока можем."
32040-139 = "Мы назвали это симпозиумом лишь для приличия. Обсуждать можно что угодно. Запретных тем нет. ♥"
32040-140 = "Я всегда хотела попробовать такое. Никогда ещё не была так рада вступлению в Клуб дополнительных занятий. ♥"
32040-141 = "[s] «Похоже, ты веселишься от души.»"
32040-142 = "Я её понимаю. Я тоже рада, что вступила в клуб."
32040-143 = "Правда?"
32040-144 = "Конечно. Мне нравится учиться, есть, убираться и даже стирать вместе со всеми вами. Мне понравилось абсолютно всё."
32040-145 = "Ой, как мило. ♥"
32040-146 = "Я всегда считала, что купальники нужны лишь для плавания, но теперь узнаю множество других полезных применений."
32040-147 = "Это больше похоже на развращение, чем на удовольствие..."
32040-148 = "Но в них удобно двигаться, и они хорошо пропускают воздух. Понимаю, почему Ханако так любит свой."
32040-149 = "Ты наконец прозрела. Видишь, Кохару? Я же говорила."
32040-150 = "Публичная непристойность всё ещё карается смертью! Достаточно знать это!"
32040-151 = "Мне тоже нравится учиться с тобой, Кохару."
32040-152 = "П-почему ты вдруг это говоришь?! Не выпаливай такие неловкие вещи!"
32040-153 = "Это ещё милее! ♥"
32040-154 = "Н-ну, разумеется, нужно ценить возможность учиться с такой элитой, как я."
32040-155 = "Хм-м."
32040-156 = ""
32040-158 = ""
32040-160 = "При первой встрече я совсем тебя не понимала, но рада слышать, что тебе было весело."
32040-161 = ""
32040-163 = ""
32040-164 = "Конечно. И я особенно благодарна за то, что ты всегда заботилась обо мне, Хифуми. Спасибо."
32040-165 = ""
32040-167 = ""
32040-168 = "Азуса-а-а! Так и хочется тебя обнять!"
32040-169 = ""
32040-171 = ""
32040-172 = ""
32040-173 = "*обнимает*"
32040-174 = "Хифуми. Я не могу дышать."
32040-176 = "Клуб дополнительных занятий продолжал коротать время за беседой."
32040-178 = "Я слышала, что сейчас в аквариуме Тринити выставлен редкий Золотой Магуро."
32040-179 = "Я видела в буклете! Это та самая фантастическая рыба, верно?"
32040-180 = "Да. Похоже, её нашли на соседнем пляже. Я хотела увидеть её сама, но вход очень дорогой."
32040-181 = "Пляж... Кстати, я никогда там не была."
32040-182 = "Ты никогда не была на пляже, Азуса?!"
32040-184 = "Ещё я слышала, что в давно заброшенном парке развлечений раздаются странные звуки."
32040-185 = "Э-этого не может быть! Это просто городская легенда!"
32040-186 = "Я сама слышала лишь слухи, так что не уверена... но разве не так начинаются все страшные истории?"
32040-187 = "Да, и все они выдуманы!"
32040-188 = "Х-ха-ха..."
32040-190 = "Я не считаю прогулки по кампусу или району в купальнике странными."
32040-191 = "Конечно, это странно! У тебя совсем нет здравого смысла?!"
32040-192 = "Кстати. Одна Сестра рассказывала, что где-то в беззаконном районе Кивотоса есть банда, которая носит лишь бикини и маски."
32040-193 = "З-зачем им носить только это?!"
32040-194 = "Ты сама сказала, что они банда, значит, преступники! Конечно, преступникам плевать на публичную непристойность!"
32040-195 = "Это показывает, насколько обычно носить один купальник. Почему бы тебе в следующий раз не присоединиться?"
32040-196 = "Нет! Неважно, что ты задумала, — без меня!"
32040-197 = ""
32040-199 = ""
32040-201 = "..."
32040-203 = "Тебе нужно лучше высыпаться, Азуса!"
32040-204 = "Знаю. Простите, что доставила всем неудобства, проспав утром."
32040-205 = "Такого никогда не бывает там, где мне неуютно."
32040-206 = "Может, я проспала, потому что больше не чувствую здесь дискомфорта..."
32040-207 = "Это не отменяет того, что тебе нужно больше отдыхать. Сократи свои ночные патрули!"
32040-208 = "Ты ходишь в патрули?"
32040-209 = "Да. Я каждую ночь стою на страже..."
32040-210 = "[s] «Ханако очень за тебя переживала.»"
32040-211 = "Правда?"
32040-212 = "Я не знала. Прости."
32040-213 = ""
32040-215 = ""
32040-216 = "Честно говоря, во время патрулей я устанавливаю ловушки и укрепляю оборону."
32040-218 = "Ловушки?"
32040-219 = "Оборону?"
32040-220 = "Зачем заходить так далеко?"
32040-222 = "Не волнуйтесь. Я ставлю их лишь на вероятных маршрутах нарушителей. Во время занятий они не должны представлять для нас угрозы."
32040-223 = "(Тогда как ты объяснишь то, что вчера случилось с Мари?)"
32040-224 = "О таких вещах нужно сообщать заранее. Если делать всё самостоятельно, люди заподозрят тебя в злых намерениях."
32040-225 = "Пожалуй, ты права. Впредь я буду осторожнее."
32040-226 = "Меньше всего я хочу навредить клубу или Сенсею."
32040-227 = "[s] «Ты очень добрая девушка, Азуса.»"
32040-228 = "А-а? Не обращайся со мной как с ребёнком."
32040-229 = "К тому же я бы себя так не описала."
32040-230 = "Истина в том, что всё бессмысленно, а суета — путь этого мира."
32040-231 = "Однажды я предам всё, что знала: всех вас, свою веру и собственное сердце."
32040-232 = ""
32040-234 = ""
32040-235 = "..."
32040-236 = "О."
32040-237 = "..."
32040-238 = ""
32040-240 = ""
32040-241 = "Электричество вернулось."
32040-242 = "Давно пора."
32040-243 = "И дождь закончился! На улице всё прояснилось!"
32040-244 = "Нужно снова запустить стирку и высушить всё."
32040-245 = ""
32040-247 = ""
32040-248 = "Полагаю, первый симпозиум Клуба дополнительных занятий в купальниках окончен. Жду второго."
32040-249 = "Второго не будет! Этот был первым и последним!"
32040-251 = "Закончив стирку, все решили отдохнуть."
32040-252 = "Так прошёл ещё один день..."
32040-254 = "Нет! Ещё нет! Нельзя позволить этому дню пропасть зря!"
32040-255 = "Ч-что?!"
32040-256 = ""
32040-258 = ""
32040-259 = "С кем ты говоришь? Не начинай вдруг кричать. Ты чуть не довела меня до сердечного приступа."
32040-261 = "Будем считать сегодняшний день незапланированным выходным. Мы даже сблизились, как настоящие сёстры, совершенно голышом."
32040-262 = "Этого не было! Хватит переписывать историю!"
32040-263 = "Но разве не жалко так рано ложиться? Не хочется воспользоваться ночью и закончить день с размахом?"
32040-264 = "Что ты задумала?"
32040-265 = "Разве не очевидно? Что это за лагерь, если мы хотя бы раз не попробуем тайком выйти ночью? ♥"
32040-266 = "Ты хочешь тайком выйти?"
32040-267 = "Конечно. Оставим академию и вместе прогуляемся!"
32040-268 = "В торговом районе Тринити много мест, открытых допоздна. Давайте поедим и немного пройдёмся по магазинам!"
32040-270 = "Э-это нарушение. Я не могу!"
32040-271 = "Ты знаешь правила лучше меня, но наверняка многие студенты тайком выходят и ходят куда нельзя. Верно, Хифуми?"
32040-272 = "Х-ха-ха... К-кто знает? Может быть..."
32040-273 = "Но Кохару права. Мы посреди обязательного учебного лагеря. Если нас поймают, последствия могут быть тяжёлыми."
32040-274 = "Мы не уйдём далеко — всё ещё в пределах района. Вернёмся очень быстро. Ну что, Кохару? Разве не весело?"
32040-275 = "Я-я не спорю, звучит весело, но..."
32040-276 = "Ну же! Одна прогулка тебя не убьёт. Верно, Сенсей?"
32040-277 = "[s] «Я с вами. Сделаем это.»"
32040-279 = "Ты не против?!"
32040-280 = ""
32040-282 = ""
32040-283 = "Я одета и готова. Только скажите, когда выдвигаться."
32040-284 = "Ты тоже, Азуса?! Когда ты успела переодеться?"
32040-285 = "Решено. ♥"
32040-286 = "Все, скорее раздевайтесь! Клуб дополнительных занятий отправляется на ночную пробежку нагишом!"
32040-287 = "Ты сказала, что мы пойдём гулять! Одежду не снимать!"
32040-289 = "Так мы и решили отправиться на ночную прогулку."
32040-291 = "Следующий Эпизод;Полуночный переполох, часть 1"
