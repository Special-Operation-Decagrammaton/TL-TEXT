[translation]
1003406-1 = "Вышивка от всего сердца"
1003406-2 = "Универмаг Хяккияко"
1003406-3 = ""
1003406-4 = ""
1003406-5 = ""
1003406-6 = "Ого, Сенсей! Это новая модель моего любимого пылесоса."
1003406-7 = "Он может работать пять часов после всего 30 минут зарядки!"
1003406-8 = "А самое лучшее? Он беспроводной!"
1003406-9 = "[s] «Здорово.»"
1003406-10 = ""
1003406-11 = "О, Сенсей. Посмотрите на это платье!"
1003406-12 = "Его можно стирать в машинке!"
1003406-13 = "Хи-хи. Как легко будет поддерживать его в чистоте!"
1003406-14 = "[s] «Здорово.»"
1003406-15 = "О? Вон тот прилавок..."
1003406-16 = "Там раздают билеты для лотереи!"
1003406-17 = "За третье место дают беспроводной пылесос!"
1003406-18 = "Какая замечательная возможность, Сенсей."
1003406-19 = "Давайте скорее встанем в очередь!"
1003406-20 = "[s1] «Притормози, Мимори.»\n[s2] «Разве мы сюда не за чем-то конкретным пришли?»"
1003406-21 = "А..."
1003406-22 = "А..."
1003406-23 = "Я немного слишком увлеклась."
1003406-24 = "Мне нужно было купить носовой платок."
1003406-25 = "[s] «Всего лишь носовой платок?»"
1003406-26 = "Да, его можно найти в отделе товаров общего назначения. Я заранее посмотрела."
1003406-27 = "Н-Но лотерейные билеты..."
1003406-28 = "[s] «Почему бы не взять их на обратном пути?»"
1003406-29 = "Хи-хи. Хорошая мысль."
1003406-31 = "Какой большой выбор носовых платков."
1003406-32 = "У меня немного ограниченный бюджет..."
1003406-33 = "...но качество и материал всё равно очень важны."
1003406-34 = ""
1003406-35 = "Какой сложный выбор..."
1003406-36 = "[s] «Хочешь, я выберу один?»"
1003406-37 = "Вы хотите выбрать за меня?"
1003406-38 = "Хм... Думаю, важно, чтобы я выбрала сама."
1003406-39 = "[s] «Ты права. У такого старого взрослого, как я, ужасный вкус.»"
1003406-40 = "Я вовсе так не думаю, Сенсей! П-Просто..."
1003406-41 = "[s] «Просто...?»"
1003406-42 = "Н-Неважно!"
1003406-43 = "В-В любом случае вернёмся к делу."
1003406-44 = ""
1003406-45 = ""
1003406-46 = ""
1003406-47 = ""
1003406-48 = "*блеск*"
1003406-49 = ""
1003406-50 = ""
1003406-51 = "Простите. Не могли бы вы упаковать вот этот?"
1003406-52 = "Потому что..."
1003406-53 = "Это подарок!"
1003406-55 = "Спасибо, что терпеливо ходили со мной сегодня, Сенсей."
1003406-56 = "[s3] «Я был рад пойти с тобой.»\n[s4] «Жаль, что ты не выиграла пылесос.»"
1003406-57 = "Хи-хи. Я тоже рада, что вы пришли."
1003406-58 = "Но есть одна проблема..."
1003406-59 = "Хи-хи. Всё в порядке. Я рада, что вы пришли."
1003406-60 = "Но есть одна проблема..."
1003406-61 = "[s5] «Боишься, что тому, кому ты его подаришь, он не понравится?»\n[s6] «Уверен, тот, кому ты его даришь, будет в восторге.»"
1003406-62 = "Признаюсь, я об этом переживала."
1003406-63 = "Признаюсь, я об этом переживала."
1003406-64 = "Иными словами, я не знаю, понравится ли вам ваш новый носовой платок."
1003406-65 = "[s] «Что?»"
1003406-66 = "Вот почему я пригласила вас сегодня, Сенсей."
1003406-67 = "Я хотела купить вам подарок."
1003406-68 = "Вы снова и снова поддерживали меня на протяжении тренировок."
1003406-69 = "Я подумала, что настоящая леди должна отплачивать за добро."
1003406-70 = "[s] «Тебе правда не нужно мне ничем отплачивать.»"
1003406-71 = "Я понимаю, но всё равно хотела выразить благодарность."
1003406-72 = "Это... слишком?"
1003406-73 = "[s7] «Нет, я очень тронут.»\n[s8] «В таком случае смиренно принимаю.»"
1003406-74 = "Хи-хи. Правда?"
1003406-75 = "Хи-хи. Правда?"
1003406-76 = "[s] «Конечно. Не против, если я открою его сейчас?»"
1003406-77 = "О-Одну минутку, Сенсей!"
1003406-78 = "Я благодарна, что смогла выбрать его вместе с вами..."
1003406-79 = "...и само это воспоминание уже делает его особенным."
1003406-80 = "Но можно попросить вас ещё об одной услуге?"
1003406-81 = "[s] «Разумеется»."
1003406-82 = "Это немного эгоистично с моей стороны, но..."
1003406-83 = "...я каждый день тренировалась вышивать вместе с Клубом внутренней дисциплины!"
1003406-84 = "Так что, ну..."
1003406-85 = "Я надеялась показать вам результаты своих тренировок..."
1003406-86 = "Можно мне ваш платок, пожалуйста?"
1003406-87 = "[s] «Платок?»"
1003406-88 = "Я-Я не собираюсь забирать его обратно или что-то такое, но...!"
1003406-89 = "Я хотела вышить на нём что-нибудь для вас, ведь я довольно сильно улучшила навык..."
1003406-90 = "Только если вы не против!"
1003406-91 = "Если это слишком, я просто уйду!"
1003406-92 = "[s] «Я совсем не против, Мимори. Мне бы понравилось.»"
1003406-93 = "П-Правда?"
1003406-94 = "Тогда у вас есть ещё немного свободного времени, Сенсей?"
1003406-95 = ""
1003406-96 = ""
1003406-97 = "Мне бы очень хотелось, чтобы вы посмотрели, как я это делаю."
1003406-100 = "― Хи-хи. Сенсей.[wa:1270]"
1003406-102 = "― Можете сесть немного ближе, знаете ли.[wa:1250]"
1003406-105 = "― Будь то моя подготовка к семейной жизни...[wa:120]"
1003406-107 = "― ...или моя мечта стать настоящей юной леди.[wa:1890]"
1003406-110 = "― Вы всегда рядом,[wa:20]"
1003406-112 = "― чтобы поддержать и приободрить меня.[wa:1060]"
1003406-115 = "[ns] «В этом и заключается работа Сенсея. Я хочу помогать.»"
1003406-116 = "― Большое вам спасибо.[wa:1300]"
1003406-118 = "― Поэтому... я надеюсь, что мы с вами всегда будем...[wa:3930]"
1003406-121 = "― Н-Неважно! Ничего![wa:240]"
1003406-124 = "― В-В любом случае! Теперь готово.[wa:2450]"
1003406-127 = "― Я старалась изо всех сил.[wa:360]"
1003406-129 = "― Вам... нравится?[wa:1360]"
1003406-132 = "Вот и всё. Один персональный носовой платок специально для вас."
1003406-133 = "Надеюсь, этот подарок вам запомнится. Хи-хи."
1003406-135 = "После этого мы с Мимори ещё немного прогулялись и поболтали."
