[translation]
70014010-1 = "Странствия аптекаря 1"
70014010-2 = "...Ну вот, я на месте."
70014010-3 = "В самой глубине Чёрного рынка... и совершенно в одиночку!"
70014010-4 = ""
70014010-12 = "Хотя решиться прийти сюда было нелегко..."
70014010-13 = "Было ясно: если со мной что-нибудь случится, студенты, особенно члены Генерального студенческого совета, устроят мне такую выволочку, что на всю жизнь запомнится."
70014010-14 = ""
70014010-18 = "[ns] «?!»"
70014010-19 = ""
70014010-20 = ""
70014010-21 = ""
70014010-23 = "Попались!"
70014010-25 = "Слышала, какой-то турист осмелился забраться в такую глушь. Значит, слухи не врали."
70014010-26 = "Надо же... Вы и правда пытались сойти за «местного», да?"
70014010-27 = "Умора! У НАСТОЯЩИХ местных особая атмосфера, настроение, этот... «же-нё-сэ»... Ну, вы поняли, ОСОБОЕ ЧУТЬЁ!"
70014010-28 = "Так что хватаем! А... эм... потом..."
70014010-29 = ""
70014010-31 = ""
70014010-32 = "Точно! Возьмём вас в заложники и потребуем целое состояние за выкуп."
70014010-33 = "За такого столичного чужака нам немало иен отвалят, а?"
70014010-34 = "И без глупостей, болван. Будете делать, что говорят, и никто не пострадает... Хе-хе..."
70014010-35 = ""
70014010-36 = "[ns1] «(Вроде бы всё было предусмотрено, но...!)»\n[ns2] «(...Теперь мне точно устроят легендарную выволочку!)»"
70014010-39 = ""
70014010-44 = "Ну всё, заложник у нас. Что теперь?"
70014010-45 = "Для начала... ну... выкуп! Нам нужно найти того, с кем связаться, понимаешь?"
70014010-47 = "Ага. Откройте телефон и найдите кого-нибудь, кто будет за него переживать... Хи-хи..."
70014010-48 = "А? Э-э...?"
70014010-49 = "Проблемы какие-то?"
70014010-50 = "Нет, ничего..."
70014010-51 = "Соберись."
70014010-52 = ""
70014010-54 = ""
70014010-55 = ""
70014010-57 = "(Странно, этот человек чем-то похож на «Сенсея» из Шале. А я думала, это всего лишь слухи...)"
70014010-58 = "(Да ну, не может быть. Зачем такому важному Сенсею приходить сюда, да ещё и в ТАКОМ виде?)"
70014010-59 = ""
70014010-61 = "Слушай, если всё выгорит... Мы озолотимся! Вот что главное."
70014010-62 = "Да, подруга! У-У-У! Гуляем! ДАВАЙ ШУМУ!"
70014010-63 = "Ну и гам."
70014010-64 = ""
70014010-66 = ""
70014010-67 = ""
70014010-69 = ""
70014010-71 = ""
70014010-73 = ""
70014010-74 = ""
70014010-75 = ""
70014010-76 = "Было невыносимо шумно, поэтому я решила разобраться. Оказалось, всего лишь кучка хулиганов."
70014010-77 = "[ns] «...?»"
70014010-78 = "...?"
70014010-79 = "[s] «Кай?»"
70014010-80 = "Сенсей?!"
70014010-81 = "[s] «Кай, что ты здесь делаешь?!»"
70014010-82 = "Что я делаю? Полагаю, это мне следует задавать вопросы. Что вы забыли в таком месте?"
70014010-87 = "...Общую картину я уловила. Вы не можете раскрыть причины, но ясно, что у вас были дела на Чёрном рынке."
70014010-88 = "Кхе-хе-хе... Что ж, Сенсей. Мне незачем знать ваши секреты. Я лишь пришла немного «прибраться» здесь."
70014010-89 = ""
70014010-91 = ""
70014010-92 = "Что это за лицо? Гадаете, почему я на Чёрном рынке, а не в Исправительном бюро? Стесняетесь спросить?"
70014010-93 = "Да... После моих... деяний меня действительно отправили в Исправительное бюро."
70014010-94 = "Вашими же стараниями, не забывайте."
70014010-95 = "Что ж... Полагаю, кое-кто назвал бы это прекрасной «возможностью отомстить», не так ли?"
70014010-96 = "[s] «...!»"
70014010-97 = "Ха-ха-ха! Пожалуй, пока забудем старые обиды. Особенно после того, как я увидела ваше испуганное лицо."
70014010-98 = "Надо же. Держать такого человека, как ВЫ, в своих руках даже приятно, Сенсей."
70014010-99 = "Пока что... лучше не провоцировать Кай..."
70014010-101 = "Сперва меня задержали, и я томилась в кузове машины Исправительного бюро."
70014010-102 = "...Но когда поездка закончилась, меня так и не передали в Исправительное бюро."
70014010-103 = ""
70014010-108 = ""
70014010-110 = ""
70014010-112 = "Мои милые «похитители» лишь выдавали себя за студентов Валькирии. А соответствующие документы по пути очень удачно... подменили."
70014010-113 = "...Девушка, которая мне помогла, вероятно, считает, что теперь я у неё в долгу. И не то чтобы она ошибалась."
70014010-114 = "...В конце концов, «обещания» очень важны."
70014010-115 = ""
70014010-116 = "[ns] «„Та девушка“...?»"
70014010-117 = "Кхе-хе... Любопытно, Сенсей? Пусть так и остаётся. Больше я о ней не скажу."
70014010-118 = "Ведь её личность тоже вполне может быть частью моего обещания."
70014010-119 = "Но кто знает... Если вы пообещаете мне нечто ещё более ценное, хм..."
70014010-120 = "При достаточно выгодном предложении и правильном подходе всё может измениться..."
70014010-121 = "Прямо как при разработке нового лекарства: стоит изменить соотношение действующих веществ, и результат будет совершенно другим. Кхе-хе-хе..."
70014010-122 = "[s] «Значит, всё это время ты была на Чёрном рынке?»"
70014010-123 = "Нет. Хотя Чёрный рынок можно считать самым безопасным для меня убежищем..."
70014010-124 = "Здесь трудно достать разнообразные ингредиенты и реактивы."
70014010-125 = "Проще говоря, чтобы продолжить исследования, я взяла псевдоним и... выдавала себя за странствующего врача."
70014010-126 = "По пути я оказалась в долгу перед одной семьёй из Хяккияко."
70014010-127 = "[s] «...По крайней мере, похоже, ты держалась подальше от „неприятностей“»."
70014010-128 = "Иначе и быть не могло."
70014010-129 = ""
70014010-131 = ""
70014010-132 = "Хм... Почти пришли. Это... «жилище», где я сейчас обитаю. Ну что, зайдём?"
70014010-134 = "Следом за Кай пришлось подняться по тёмной, обветшалой лестнице."
70014010-135 = ""
70014010-142 = "[ns] «...»"
70014010-144 = "[ns] «Ты всё это время жила здесь»."
70014010-145 = "Точнее сказать, «временно приютилась»."
70014010-147 = "Прежде чем удалось спросить, что это значит..."
70014010-148 = "Появилась пожилая женщина, заметно прихрамывая."
70014010-149 = ""
70014010-151 = ""
70014010-155 = "...О, дорогая. С возвращением, Кай."
70014010-156 = "*кашель* *кашель*..."
70014010-157 = "Хм? А кто это с тобой?"
70014010-158 = "А. Это, можно сказать, гость."
70014010-159 = "Особый гость! Какая редкость, Кай!"
70014010-160 = "И... именно поэтому я рада, что он здесь. Ты ведь никогда не пригласила бы опасного человека..."
70014010-161 = "*Кхе* *кхе* *кхе*...!"
70014010-162 = "...Прости меня. Похоже, я ещё не совсем оправилась. Но только благодаря тебе я до сих пор держусь..."
70014010-163 = "Знаю. Думаю, вам пора вернуться в комнату."
70014010-164 = "Да, пожалуй, так и сделаю..."
70014010-165 = "Домик у нас скромный, но беседуйте сколько душе угодно. Вы мне не помешаете!"
70014010-166 = "Простите за беспорядок, но располагайтесь поудобнее."
70014010-167 = ""
70014010-169 = ""
70014010-172 = "Старушка, прихрамывая, вернулась в свою комнату."
70014010-173 = "Вскоре оттуда послышался усталый храп."
70014010-174 = ""
70014010-176 = ""
70014010-177 = "[ns] «Кто это?»"
70014010-178 = "Ну, полагаю, её следует называть хозяйкой дома."
70014010-179 = "Вам кажется, что она «немного нездорова»? Это ещё мягко сказано. Сейчас она едва способна пройти через дверной проём."
70014010-180 = "У неё заболевание, похожее на ревматоидный артрит, с осложнениями на лёгкие и бронхи."
70014010-181 = "До моего появления здесь её состояние было несколько хуже."
70014010-182 = "Сейчас ей немного лучше, но... Скажем так, я лишь поддерживаю её состояние."
70014010-183 = ""
70014010-185 = ""
70014010-186 = "О. Вы выглядите с облегчением. Думаете, это «всего лишь» артрит, Сенсей?"
70014010-187 = "Возможно, вы не знаете, что ревматизм по своей природе является аутоиммунным заболеванием."
70014010-188 = "Это означает, что иммунная система атакует собственные здоровые клетки, а не чужеродные антигены."
70014010-189 = "Проще говоря, это болезнь, при которой организм разрушает сам себя."
70014010-190 = "Суставы лишь первыми проявляют симптомы. Кроме позвоночника, под угрозой всё: даже сердце, лёгкие и кровь."
70014010-191 = "При стремительном развитии и особом невезении дело может дойти до лимфомы."
70014010-192 = "[s] «Н-Настолько серьёзно?!?!»"
70014010-193 = "Ну, я говорила об особо редких случаях. Это самый худший из возможных сценариев."
70014010-194 = "[s3] «Не пугай меня так...»\n[s4] «Значит, вылечить её невозможно?»"
70014010-197 = "Нет, но..."
70014010-198 = "[s] «Что...?!»"
70014010-199 = "Лечение ревматизма, по сути, сводится к облегчению симптомов стероидами или противовоспалительными препаратами."
70014010-200 = "В некоторых случаях более сильные антибиотики применяют, чтобы перенаправить иммунную реакцию организма."
70014010-201 = "Но всё это объединяет одно: такие меры лишь временно сдерживают болезнь."
70014010-202 = "...Разумеется, это ограничения обычных методов лечения. Но ко мне слово «обычный» неприменимо, помните?"
70014010-203 = "Кхе-хе-хе... Я знаю, о чём вы хотите спросить, Сенсей. Научитесь скрывать эмоции."
70014010-204 = "Вы думаете: «Раз Кай лечит её, разве она не может устранить саму причину болезни?»"
70014010-205 = "Ответ: да. Да, могу."
70014010-206 = "[s] «Разве ты не говорила, что только поддерживаешь её состояние...?»"
70014010-207 = "Говорила. И постепенно обдумываю следующий шаг."
70014010-208 = "Не так давно мне удалось добиться от старушки одного обещания."
70014010-209 = ""
70014010-211 = ""
70014010-212 = "Какого, спрашиваете? Примерно такого..."
70014010-213 = "«Раз уж я так больна и никак не выздоравливаю, тебе стоит забрать этот дом, Кай»."
70014010-214 = "Вот почему я стала задумываться о будущем."
70014010-215 = "...В голове всплывают мысли вроде: «Теперь, когда дом почти мой, может, пора разорвать эти отношения?»"
70014010-216 = "[s] «Тогда зачем ты её лечила...?»"
70014010-217 = "Сенсей. Когда люди принимают более рациональные решения? Когда здоровы... или когда больны?"
70014010-218 = "Если сравнить два варианта: старушка поправится или останется немощной..."
70014010-219 = "...В каком из них она скорее отдаст мне свой дом?"
70014010-220 = "[s] «...!!»"
70014010-221 = "Вот и всё. Можно сказать, я добилась своей маленькой цели."
70014010-222 = "Хотите смотреть на меня свысока, Сенсей? Ваше право. Мне совершенно не нужно чужое одобрение."
70014010-223 = "Такова моя натура. Я не собираюсь этого скрывать, хотя и кричать об этом на каждом углу не стану."
70014010-224 = "В конце концов, откровенность с большой вероятностью может мне навредить."
70014010-225 = "[s] «Но ты ведь можешь её вылечить, верно?»"
70014010-226 = "Хмм...?"
70014010-227 = "Ну, если речь лишь о возможности... Конечно, вполне могу."
70014010-228 = ""
70014010-230 = ""
70014010-231 = "Хм? Хотите, чтобы я попробовала?"
