[translation]
84306100501-5 = ""
84306100501-6 = "Из личного любопытства: сколько времени им понадобится, чтобы закончить этот пистолет и нормально его продемонстрировать?"
84306100501-7 = "Хмм... Даже не знаю. Без какой-нибудь особой помощи извне это было бы очень трудно."
84306100501-8 = "Вот как? Судя по их описанию, казалось, что он почти готов."
84306100501-9 = "Обычно именно на этом этапе разработка по-настоящему и начинается. Устранение багов и неопределённостей — самая сложная часть, и она требует больше всего мастерства."
84306100501-10 = "К сожалению, насколько мне известно, технология стабилизации такого роста пока едва существует даже в теории."
84306100501-11 = "Тогда как они...?"
84306100501-12 = "Как я уже говорила, скорее всего, они ищут ранних инвесторов."
84306100501-13 = "То есть им просто хотелось ПОКАЗАТЬ хоть что-нибудь? Не такого я ожидала от учёных."
84306100501-14 = "А зря. Именно так учёные и поступают."
84306100501-15 = "...Пойми кое-что, Юризоно Сэя."
84306100501-16 = "Учёные стараются быть рациональными, но у них есть те же иррациональные желания, что и у всех нас, и они могут так же ими руководствоваться."
84306100501-18 = "Понятно... Я узнала кое-что новое."
