[translation]
1009005-1 = "Детей, которые портят фестивали, нужно ругать!"
1009005-2 = "Получив сообщение от Умики, я пришёл в Момоёдо."
1009005-3 = ""
1009005-7 = "[ns] «Извините.»"
1009005-8 = "А? Там кто-то есть?"
1009005-9 = "Какая разница! Сегодня мы посетители!"
1009005-10 = ""
1009005-13 = ""
1009005-14 = "Как захватывающе!"
1009005-16 = ""
1009005-17 = "Да-а-а!! Вот это круто!"
1009005-18 = ""
1009005-20 = ""
1009005-21 = "[ns] «Ч-Что происходит?!»"
1009005-22 = "С-Сенсей?! Почему вы пришли именно сейчас?!"
1009005-23 = "Я-Я знаю, что сама просила! И правда надеялась, что вы придёте, но...!"
1009005-24 = ""
1009005-27 = ""
1009005-29 = "Серьёзно?! Морё?! Вы меня уже выводите из себя!"
1009005-30 = ""
1009005-32 = ""
1009005-33 = "О чём ты вообще?! Мы пришли в Момоёдо как посетители, помнишь?"
1009005-34 = "Мы даже заранее заплатили!"
1009005-35 = "Угх... Я знаю, и знаю, что клиент всегда прав..."
1009005-36 = "Но с такими «посетителями» в это верится с трудом!"
1009005-37 = "Такими темпами репутация Момоёдо будет уничтожена..."
1009005-38 = "[s1] «Хм... Момоёдо действительно предоставляет ценную услугу.»\n[s2] «Но разве это не значит, что посетители должны уважать эту услугу?»"
1009005-41 = ""
1009005-43 = ""
1009005-44 = "То есть вы хотите сказать... что как официантка я обязана «направлять» неуважительных посетителей?"
1009005-45 = "Ведь если я этого не сделаю, это помешает нашей работе и нарушит спокойствие других посетителей?"
1009005-46 = ""
1009005-48 = ""
1009005-49 = "Этого нельзя допустить! В таком случае..."
1009005-50 = "Морё! Ради Момоёдо, его традиций... и всех будущих посетителей!"
1009005-51 = ""
1009005-53 = ""
1009005-54 = "От всего сердца позвольте мне «научить» вас всей мощи гостеприимства Момоёдо!"
1009005-56 = "А? Ч-Что ты несёшь?"
1009005-57 = "У меня плохое предчувствие..."
1009005-59 = ""
1009005-61 = ""
1009005-62 = "Пожалуйста, садитесь!"
1009005-64 = ""
1009005-66 = ""
1009005-67 = ""
1009005-68 = "Э-э, чего?!"
1009005-69 = "Эй! Ты не можешь силой усаживать меня на стул!"
1009005-71 = ""
1009005-73 = ""
1009005-74 = ""
1009005-75 = ""
1009005-76 = ""
1009005-77 = ""
1009005-80 = ""
1009005-81 = ""
1009005-82 = ""
1009005-83 = ""
1009005-84 = "Итак. Чайные чашки, зелёный чай, улун, блюдца, салфетки и бумажные платочки! Всё готово! Нужно что-нибудь ещё?!"
1009005-86 = ""
1009005-88 = ""
1009005-89 = "Так быстро! И каким-то образом всё идеально?!"
1009005-90 = "Хмпф! Тут нет влажных полотенец!"
1009005-92 = ""
1009005-94 = ""
1009005-95 = ""
1009005-96 = "Я так и думала, что вы о них скажете. Я как раз их готовила!"
1009005-97 = "Разве их не слишком много?!"
1009005-98 = "Д-Да. Двух ведь хватит?"
1009005-99 = "Раз вы лично их запросили, уверена, вы используете их все!"
1009005-100 = "И ещё: выносить вещи из Момоёдо запрещено."
1009005-101 = "Нужно что-нибудь ещё?"
1009005-102 = ""
1009005-104 = ""
1009005-105 = "Эм... нет, спасибо."
1009005-107 = "Тогда я приму ваш заказ! В меню Момоёдо входят—"
1009005-109 = ""
1009005-111 = "Умика на одном дыхании перечислила всё меню Момоёдо, подробно описав каждую позицию."
1009005-112 = "Поняли ли Морё — да и вообще кто-либо из посетителей — всё, что она сказала, это уже другой вопрос..."
1009005-113 = ""
1009005-114 = "Угх. Я ничего не понимаю. У меня уже голова болит..."
1009005-115 = "Я не могу сделать заказ, если не понимаю, что у них вообще есть..."
1009005-116 = "О-хо, вы всё ещё запутались? Тогда давайте я начну сначала—"
1009005-117 = ""
1009005-119 = ""
1009005-120 = "Нет-нет! Не надо! Мы просто уже сделаем заказ!"
1009005-121 = "И вообще— Эм... Простите... Мы больше не будем вам мешать..."
1009005-127 = "[ns] «Значит, вы научились уважать персонал и заведение?»"
1009005-128 = "Есть..."
1009005-129 = "Мы слишком разволновались из-за фестиваля, который здесь проходит, и немного увлеклись..."
1009005-130 = ""
1009005-133 = ""
1009005-134 = "[ns] «А? В Момоёдо проходит фестиваль?»"
1009005-135 = "Ага, фестивальные товары начали появляться ещё три дня назад, верно?"
1009005-136 = "Плюс торговая гильдия, ответственные за оборудование, уличные торговцы и организаторы мероприятий..."
1009005-137 = "Всех их видели здесь неподалёку."
1009005-138 = "Вы что, следили за ними?"
1009005-139 = "Нет. Мы Морё. Мы знаем почти всё, что связано с фестивалями Хяккияко."
1009005-140 = "В ближайшее время никаких фестивалей не планировалось. А потом мы услышали, что в Момоёдо что-то готовят..."
1009005-141 = "Н-Не может быть! Вы, Морё, наверняка получили неверную информацию!"
1009005-142 = "Не может быть! Это невозможно! Может, у нас и дурная репутация нарушителей порядка..."
1009005-143 = "Но фестивалями Хяккияко мы очень гордимся! Быть Морё — значит и это тоже!"
1009005-144 = ""
1009005-146 = ""
1009005-147 = "Угххх!"
1009005-148 = ""
1009005-150 = "..."
1009005-152 = "Если я говорю, что вы ошибаетесь, просто признайте, что ошибаетесь!"
1009005-154 = "А? Мы что, правда попали в больное место?"
1009005-155 = "Ты на её лицо посмотри, как думаешь?!"
1009005-156 = "...Может, уйдём?!"
1009005-157 = "Почему бы и нет?! По-моему, мы уже и поели, и повеселились!"
1009005-158 = ""
1009005-160 = ""
1009005-161 = ""
1009005-162 = ""
1009005-163 = ""
1009005-164 = "..."
1009005-165 = ""
1009005-167 = ""
1009005-168 = "Простите, Сенсей. Я не хотела показывать вам эту свою сторону..."
1009005-169 = "[s3] «Зато ты узнала кое-что новое.»\n[s4] «Морё — просто студенты, которые тоже любят фестивали.»"
1009005-172 = "Наверное, я была немного резка..."
1009005-173 = "Ладно, может, очень резка, но..."
1009005-174 = ""
1009005-176 = ""
1009005-178 = "Это всё равно неправильно!"
1009005-179 = "Моя подготовка к фестивалю не должна терпеть такие помехи!"
1009005-180 = "[ns5] «Разве они не сказали, что какое-то время фестивалей не будет?»\n[ns6] «Они правда устраивают ещё один фестиваль?»"
1009005-183 = "...!"
1009005-184 = "То есть... Это... эм...!"
1009005-185 = ""
1009005-187 = ""
1009005-188 = "Неважно! Забудьте!"
1009005-189 = "[ns] «Но Морё...»"
1009005-190 = "Всё хорошо, правда! Кстати, Сенсей! Вы хотите что-нибудь заказать?"
1009005-191 = "Сегодня я угощаю! Просто скажите, что вам хочется!"
1009005-192 = "[ns] «А что насчёт того фестиваля?»"
1009005-193 = "Можем мы сейчас не говорить о фестивале?!"
1009005-194 = "[s] «Никогда не слышал, чтобы ты так говорила о фестивале!»"
1009005-195 = "Даже я признаю, что это на меня совсем не похоже!"
1009005-197 = ""
1009005-199 = "После этого я несколько раз осторожно заводил с Умикой тему «фестивалей», но..."
1009005-200 = "...она каждый раз смущалась и начинала запинаться."
