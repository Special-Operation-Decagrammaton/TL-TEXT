103140-1 = "Эпизод 14;Рывок"
103140-2 = ""
103140-5 = "Нос Корабля Утнапиштима пробил внешнюю стену Ковчега Атрахасис и застрял в ней."
103140-6 = "Издалека это, наверное, похоже на яблоко с воткнутой зубочисткой..."
103140-7 = "*вздох* ...Э-Это было слишком жёстко..."
103140-8 = "Все в порядке? Доложите о текущем состоянии."
103140-9 = "Система многомерного анализа в порядке. Но, похоже, основная система была повреждена при столкновении с Ковчегом."
103140-11 = "Двигатели вышли из строя... Перезапустить их не удаётся."
103140-12 = "Главная система управления тоже не работает..."
103140-13 = "Система связи не работает по всему кораблю, а вычислительная система функционирует с ошибками..."
103140-14 = ""
103140-19 = "Ч-Что это?!"
103140-20 = "А-Аргх?! Враги! Враги стягиваются к нам!"
103140-22 = ""
103140-23 = ""
103140-24 = ""
103140-27 = ""
103140-28 = ""
103140-29 = ""
103140-31 = "С востока, запада, сверху... Они идут со всех сторон!"
103140-32 = "Не то чтобы мы этого не ожидали, но реакция была мгновенной. Они явно были готовы."
103140-33 = "Похоже, мы оказались прямо посреди вражеской крепости..."
103140-34 = "Нельзя позволить им уничтожить корабль, иначе нам конец! Все, кто способен сражаться, немедленно отправляйтесь на защиту корабля!"
103140-35 = "Те, кто может сражаться... Эм..."
103140-37 = "Хех! Наконец-то пришло наше время блистать!"
103140-38 = ""
103140-43 = ""
103140-45 = "Хошино!"
103140-46 = "Абидос на связи! Мы готовы в любой момент!"
103140-47 = "Да! Я прикрою! Нужно защитить восточный проход!"
103140-48 = "Отлично звучит. Пошли, детишки."
103140-49 = "Вперёд!"
103140-55 = "Хи-хи-хи. Здесь мы обо всём позаботимся."
103140-56 = "Это было безумие... Меня сейчас стошнит..."
103140-58 = "*вздох* ...Опять... Почему я вообще здесь...?"
103140-59 = "Общество исследования гурманов...! Когда вы...?"
103140-61 = "Хи-хи-хи. Деталей не знаю, но вам ведь нужны бойцы, да?"
103140-62 = "Вот мы и будем сражаться! Общество исследования гурманов никогда не отступает перед теми, кто мешает нашему поиску вершины вкуса."
103140-63 = "Ага! Наше путешествие за вкусом космической еды начинается прямо сейчас!"
103140-65 = "(...Вы здесь вообще ничего такого не попробуете.)"
103140-66 = "*вздох* ...Полагаю, больше нам и правда не на кого рассчитывать."
103140-67 = "Вступайте в бой! Я буду вас поддерживать!"
103140-68 = "Хи-хи. Спасибо, Ако."
103140-69 = "Ну что, начнём? ★"
103140-70 = ""
103140-75 = "М-Мы защитим это место во что бы то ни стало...!"
103140-76 = "Отдел разработки игр?! К-Когда вы...?!"
103140-77 = "Пока Арис спит, мы сделаем всё, что сможем!"
103140-78 = "Да. С нами и Сенсеем всё обязательно получится!"
103140-80 = "...Угх. Ладно! Я буду прикрывать вас сзади, так что не лезьте на рожон!"
103140-81 = "Хи-хи! Если нам помогает Юука, волноваться не о чем! Вперёд!"
103140-82 = "Рассчитываю на вас!"
103140-83 = "М-Мы справимся! Я в нас верю!"
103140-85 = "Сенсей, тогда прошу вас возглавить оборону Корабля Утнапиштима!"
