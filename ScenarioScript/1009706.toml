[translation]
1009706-1 = "Благоустройство территории"
1009706-2 = "Неиспользуемые пустующие дома? Конечно, здесь есть несколько таких."
1009706-3 = "Раньше эта деревня была полна людей. Но примерно десять лет назад многие жители начали уезжать в город."
1009706-4 = "Так что тут и там стоят пустые заброшенные дома."
1009706-5 = "Если вам нужно где-нибудь укрыться от дождя или ветра, можете воспользоваться одним из них."
1009706-6 = "[s] «Спасибо.»"
1009706-7 = "Да что вы. Это нам стоит благодарить вас за то, что заселитесь и присмотрите за домом."
1009706-8 = "Честно говоря, эти дома — сплошная головная боль. Даже с субсидиями никто не хочет сюда переезжать. Мы не можем их даже БЕСПЛАТНО раздать."
1009706-9 = "Дом старый и обветшалый, так что придётся хорошенько потрудиться, чтобы привести его в порядок."
1009706-10 = "Ну, всё лучше, чем спать под открытым небом."
1009706-11 = "С-Спать под открытым небом...?"
1009706-12 = "В любом случае, отдохните."
1009706-13 = ""
1009706-15 = ""
1009706-16 = "Фух. Похоже, благодаря вам я теперь могу спокойно отдохнуть, Сенсей."
1009706-17 = "Этот переносной генератор было непросто сюда доставить, а из-за погоды я уже думала, что придётся накрыть его и вообще не использовать."
1009706-18 = "Но в помещении это не проблема. Дождь до генератора вообще не доберётся."
1009706-19 = "[s] «Рад, что смог помочь.»"
1009706-20 = "Вы и жители деревни ОЧЕНЬ нам помогли."
1009706-21 = "Вода, еда, а теперь даже дом... Здесь намного комфортнее, чем в парке Коусаги."
1009706-22 = "Я уже почти готова оставить здесь базу операций и вообще не возвращаться, хи-хи..."
1009706-23 = "[s] «Серьёзно...?»"
1009706-24 = "...Шучу. Для меня это всего лишь оперативная база. А дом есть дом."
1009706-25 = "К тому же я уже как-то привязалась к парку."
1009706-26 = "И самое главное — весь наш отряд поклялся выкладываться там по полной, пока академия SRT не вернётся."
1009706-27 = ""
1009706-29 = ""
1009706-30 = "Уф, от всех этих серьёзных разговоров мне уже не по себе."
1009706-31 = "...В любом случае! Если мы хотим устроить здесь базу, пора начинать уборку!"
1009706-32 = "Как и сказал житель деревни, работы будет много..."
1009706-34 = "После этого мы с Моэ принялись убирать дом сверху донизу."
1009706-36 = "Уф... Работы тут куда больше, чем я думала."
1009706-37 = "Столько всего прогнило или сломано. Мы возимся весь день, а пока только вынесли непригодную мебель."
1009706-38 = "[s] «Отличная работа, Моэ.»"
1009706-39 = "Да ладно, но спасибо за помощь. И от меня, и от всего отряда."
1009706-40 = "Понадобится ещё несколько дней, чтобы здесь можно было нормально жить, но..."
1009706-41 = "По крайней мере сегодня ночью я смогу спокойно устроиться внутри и анализировать данные — без ветра и дождя."
1009706-42 = "...А?"
1009706-43 = ""
1009706-46 = "Это комар?"
1009706-47 = "И не один. Тут ещё мотыльки, слепни, даже подёнки..."
1009706-48 = "Да тут полно насекомых!"
1009706-49 = ""
1009706-52 = "А-а! Они летят сюда!"
1009706-53 = "[s1] «В доме что, гнездо?»\n[s2] «Их так много...»"
1009706-56 = "*вздыхает* Я очень не хотела это использовать."
1009706-57 = "Фосфорная дымовая граната — эффективна против летающих насекомых!"
1009706-58 = "[s3] «Нет, только не это!»\n[s4] «Она ведь и против людей эффективна!»"
1009706-61 = "А, точно... Если подумать, потом ещё замучаешься отмывать все следы..."
1009706-62 = "Ладно, использую гранату с CS. Для людей она безвредна."
1009706-63 = "[s] «Да ни черта она не безвредна!»"
1009706-64 = ""
1009706-67 = "[ns5] «Подожди секунду...»\n[ns6] «Я на всякий случай кое-что принёс.»"
1009706-71 = "Вы принесли... спираль от комаров?"
1009706-72 = "Пф, эта штука едва ли муху убьёт."
1009706-73 = "[s7] «...Разве не этого мы и добиваемся?»\n[s8] «Давай просто подожжём её и немного подождём.»"
1009706-81 = "― [log=모에 수영복]Хм... По-моему, нам всё-таки не хватает огневой мощи... [/log][wa:2100]"
1009706-82 = "― [log=모에 수영복]Ну, дым от неё идёт, так что, может, сработает.[/log][wa:1430]"
1009706-85 = "[ns9] «Дым ещё не означает огневую мощь, но...»\n[ns10] «Давай пока просто терпеливо подождём.»"
1009706-88 = "― [log=모에 수영복]Кстати, давненько я не чувствовала этот запах. [/log][wa:3160]"
1009706-91 = "― [log=모에 수영복]Когда я была в SRT...[/log]"
1009706-92 = "― [log=모에 수영복]Или... может, даже ещё раньше...[/log][wa:2820]"
1009706-95 = "― [log=모에 수영복]Каждый раз, когда я чувствую этот запах, [/log]"
1009706-96 = "― [log=모에 수영복]он напоминает мне об одном далёком лете.[/log][wa:270]"
1009706-99 = "― [log=모에 수영복]Знаете, это и правда удивительно.[/log][wa:830]"
1009706-102 = "― [log=모에 수영복]Для насекомых этот запах означает смерть, но...[/log][wa:290]"
1009706-103 = "― [log=모에 수영복]...а для некоторых людей — ностальгию. [/log][wa:2630]"
1009706-106 = "― [log=모에 수영복]Может, в каком-то смысле всех людей тянет к разрушению. Хи-хи-хи...[/log][wa:1860]"
1009706-109 = "― [log=모에 수영복]Сенсей, не подойдёте чуть ближе?[/log][wa:1250]"
1009706-112 = "― [log=모에 수영복]Просто не хочу, чтобы эти насекомые вам докучали...[/log][wa:760]"
1009706-113 = "― [log=모에 수영복]Давайте оба хорошенько пропитаемся этим дымом.[/log][wa:3540]"
1009706-116 = "Мы с Моэ наслаждались атмосферой летней ночи."
