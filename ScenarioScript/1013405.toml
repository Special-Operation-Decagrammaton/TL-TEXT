[translation]
1013405-1 = "Утраченное право героя"
1013405-2 = "Я отправился искать Арис."
1013405-11 = "Внимание. Непредвиденный инцидент в ангаре."
1013405-12 = "Тэндо Арис, пожалуйста, прекратите тренировку и немедленно вернитесь в каюту."
1013405-13 = "Сообщение об инциденте с Арис разнеслось по громкоговорителям."
1013405-14 = ""
1013405-15 = "А, Сенсей."
1013405-16 = "[s1] «Арис, ты в порядке?!»\n[s2] «Ты нигде не пострадала?!»"
1013405-19 = "Я в порядке."
1013405-20 = "Авария произошла не со мной, а с Аби-Эшухом."
1013405-21 = "Я не совсем понимаю, что случилось."
1013405-22 = "Но я знаю, почему это произошло."
1013405-23 = "Ему трудно приспособиться к новой форме, потому что она слишком сильно отличается от первоначальной."
1013405-24 = ""
1013405-26 = ""
1013405-27 = "Мне жаль Аби-Эшух."
1013405-28 = "[s3] «Тебе его жаль?»\n[s4] «Но Аби-Эшух...»"
1013405-31 = "Да, знаю."
1013405-32 = "Аби-Эшух был создан для сражений — оружие для битвы. Такова была его изначальная судьба."
1013405-33 = "Таких эмоций, как грусть или радость, для Аби-Эшуха не существует."
1013405-34 = "...Я слышала истории от остальных."
1013405-35 = "О том, каким страшным и мощным Аби-Эшух был в своей первой битве."
1013405-36 = "Он был настолько силён, что сражение с ним казалось боем против непобедимого читера."
1013405-37 = "Но он сражался, разрушался и снова ремонтировался — раз за разом."
1013405-38 = "Теперь он стал достаточно маленьким, чтобы подходить мне."
1013405-39 = "...Мне сказали, что, скорее всего, это его последняя битва."
1013405-40 = "Если его снова уничтожат, восстановить уже не получится."
1013405-41 = "Даже сейчас Аби-Эшух настраивают так, чтобы он был идеально подготовлен к следующему бою."
1013405-42 = "Неужели его судьба — сражаться, получать повреждения и снова сражаться до самого конца?"
1013405-43 = "Мне... это не нравится."
1013405-44 = "Я хочу забрать Аби-Эшух с собой в Отдел разработки игр. Показать его друзьям из Инженерного отдела."
1013405-45 = "Хочу, чтобы он встретил тех, кого встречаю я, и побывал там, где бываю я."
1013405-46 = "Хочу, чтобы Аби-Эшух почувствовал, каково это — быть любимым, как Меч Света."
1013405-47 = ""
1013405-49 = ""
1013405-50 = "Скажите, Сенсей."
1013405-51 = "Почему судьбы Аби-Эшуха и Меча Света сложились настолько по-разному?"
1013405-52 = "Это просто их судьба?"
1013405-53 = "Предопределённая судьба, высеченная в камне с самого момента создания..."
1013405-54 = "Я... решила в такое не верить."
1013405-55 = "Я решила сама создать собственную судьбу."
1013405-56 = "Но... Аби-Эшуху не дали права выбирать."
1013405-57 = "Поэтому я... Я..."
1013405-59 = ""
1013405-62 = "Сенсей?"
1013405-63 = ""
1013405-65 = "[ns] Обнять Арис."
1013405-66 = ""
1013405-67 = ""
1013405-68 = "[ns5] «То чувство, которое ты сейчас испытываешь... Никогда его не забывай.»\n[ns6] «Аби-Эшух тоже может его услышать и понять.»"
1013405-71 = "...Как странно."
1013405-72 = "Обычно ваши объятия делают меня очень счастливой."
1013405-73 = "Но сейчас я почему-то не могу перестать плакать."
1013405-74 = "Я не понимаю."
1013405-75 = "[s7] «Всё хорошо. Нам некуда спешить.»\n[s8] «Когда-нибудь ты поймёшь.»"
1013405-78 = "...Вы удивительный, Сенсей."
1013405-79 = "Я совсем не понимаю, что вы говорите."
1013405-80 = "Но я знаю, что могу доверять вашим словам. Я могу верить в это «когда-нибудь»."
1013405-81 = "Вы действительно поражаете меня, Сенсей."
1013405-83 = "...Я держал Арис в объятиях столько, сколько ей было нужно."
1013405-84 = "А когда обслуживание Аби-Эшуха завершилось, Арис сразу вернулась к тренировкам."
