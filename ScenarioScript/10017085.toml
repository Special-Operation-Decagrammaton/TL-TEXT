[translation]
10017085-1 = "Эпизод 8;Сон в зимнюю ночь"
10017085-2 = "Вход в White & Mason"
10017085-3 = ""
10017085-4 = "Акх!"
10017085-5 = "Мы снова проиграли!"
10017085-6 = "Я-я не понимаю!"
10017085-7 = "Разве силы этих людей ещё не должны были закончиться?!"
10017085-8 = "Я не могу это принять! Не могу поверить, что нас снова так легко победили!"
10017085-10 = "Кья-я-я-я!"
10017085-11 = "Похоже, вы никак не способны принять простую реальность, которая прямо перед вами."
10017085-13 = "Даже если мы ослаблены, это не делает вас сильнее."
10017085-15 = ""
10017085-17 = ""
10017085-18 = "Не хочу слышать это от тебя!"
10017085-19 = "Ага! Да кто ты такая, чтобы нас поучать?! Можешь сколько угодно называть себя капитаном, но ты всего лишь ещё одна жестокая головорезка!"
10017085-21 = "Послушайте. Рождество принято считать праздничным днём, полным радости. Именно этого люди ждут и именно так к нему относятся."
10017085-22 = "Но смысл этого дня — в щедрости и благодарности, в размышлении и памяти."
10017085-23 = "Он о том, чтобы быть здесь и сейчас, с добрым сердцем выходить в мир скромным шагом и стремиться стать лучше."
10017085-24 = "И всё же в такой день вы решили лишь злоупотребить чужой добротой и устроить конфликт!"
10017085-25 = "На какой ещё исход вы вообще рассчитывали?!"
10017085-27 = ""
10017085-29 = ""
10017085-30 = "Ой, бла-бла-бла! Ты дома эти речи репетируешь? Ну так продолжай! Потому что мы ещё вернёмся!"
10017085-31 = "Не наша вина, что вы были достаточно глупы, чтобы нам поверить! Чёрт, мы были так близко!"
10017085-33 = ""
10017085-35 = ""
10017085-36 = ""
10017085-38 = ""
10017085-40 = ""
10017085-43 = ""
10017085-44 = "Мы их упустили."
10017085-45 = "Как же бесит. Если бы мы только были в лучшей форме!"
10017085-46 = "Интересно, по чьей это вине..."
10017085-48 = "Все целы?"
10017085-49 = "Дайте я вас подлечу! Постойте спокойно секунду."
10017085-51 = "О. Спасибо, но сначала, пожалуйста, помогите остальным членам Оперативной группы правосудия."
10017085-53 = "Всё хорошо. Я уже оказала им помощь."
10017085-54 = "Рыцари спасения всегда готовы!"
10017085-56 = "Уже? Понятно."
10017085-57 = "Мы и так уже столько вам должны. Мне даже немного неловко."
10017085-59 = ""
10017085-61 = ""
10017085-62 = "Не переживайте. К тому же... сегодня ведь ошиблись именно мы..."
10017085-63 = "Прости, Хасуми. Я не знаю, как мы вообще сможем загладить вину, но мы постараемся..."
10017085-65 = ""
10017085-67 = ""
10017085-68 = ""
10017085-70 = "(Майн всё разрушает, а потом оставляет своим рыцарям разгребать последствия...)"
10017085-71 = "(Так давно этого не было, что я почти чувствую ностальгию. *вздох*)"
10017085-72 = ""
10017085-73 = "Ну и что ты можешь сказать в своё оправдание, капитан Майн?"
10017085-74 = "Я не стану прятаться за оправданиями."
10017085-75 = ""
10017085-77 = ""
10017085-79 = "Капитан? Почему вы опускаете щит? И снимаете пальто? И отдаёте мне оружие?"
10017085-80 = "Мой грех слишком велик! Искупить его можно лишь смертью!"
10017085-81 = "Я вверяю свою судьбу вице-президенту Хасуми!"
10017085-82 = "...Что?"
10017085-84 = ""
10017085-86 = ""
10017085-87 = "К-Капитан..."
10017085-88 = ""
10017085-90 = ""
10017085-91 = "Капита-а-ан! Я буду по вам скучать!"
10017085-93 = "Не плачьте, Серина, Ханаэ. Принять ответственность — это тоже форма помощи."
10017085-94 = "Когда человек избегает ответственности, он совершает сразу два зла — одно против пострадавшего, а другое против самого себя."
10017085-95 = "Поэтому я должна сложить оружие и предстать перед тобой беззащитной, Хасуми. Прошу, накажи меня!"
10017085-96 = "*вздыхает*"
10017085-97 = "Если недоразумение разрешилось, меня всё устраивает."
10017085-98 = "Я и остальные раненые члены Оперативной группы правосудия уже восстановились благодаря помощи Рыцарей спасения."
10017085-99 = "Цуруги? Тебя это устраивает?"
10017085-100 = "А-а-а-ах..."
10017085-101 = "Это значит «да». Тогда можно считать, что всё закончилось."
10017085-102 = "Спасибо вам за всё, Серина, Ханаэ."
10017085-104 = ""
10017085-106 = ""
10017085-107 = "А?! Н-Не за что. Мы просто выполняли свой долг как Рыцари спасения..."
10017085-108 = "Это нам следует поблагодарить вас за то, что вы так быстро нас простили."
10017085-110 = "Это..."
10017085-111 = "Ну, пока оставим всё как есть."
10017085-112 = "Капитан Майн, пожалуйста, встаньте. Я начну переживать, если вы продолжите в том же духе."
10017085-113 = "[s] «Думаю, вся Оперативная группа правосудия со мной согласна?»"
10017085-114 = "Но, Сенсей..."
10017085-115 = "[s1] «Хотя бандиты нас обманывали,»\n[s2] «Рыцари спасения всё равно поступили благородно, пытаясь защитить слабых.»"
10017085-118 = "..."
10017085-119 = "Мне стыдно, но спасибо, что сказали это, Сенсей."
10017085-121 = ""
10017085-123 = ""
10017085-124 = "Наверное... нам уже пора идти..."
10017085-125 = "Простите, что сорвали вашу вечеринку!"
10017085-127 = "Точно. Кстати, насчёт вечеринки..."
10017085-128 = "Почему бы Рыцарям спасения не присоединиться к нам?"
10017085-130 = "А? Мы?"
10017085-131 = "Правда?!"
10017085-133 = "Ну, раз вся эта суматоха уже закончилась, почему бы не отпраздновать вместе с друзьями?"
10017085-134 = "Что скажешь, Цуруги?"
10017085-135 = "Э? Угх... Гья-а-а-а..."
10017085-136 = ""
10017085-138 = ""
10017085-140 = "Как видите, она немного смущена, но ей бы этого хотелось."
10017085-141 = "А вы, Сенсей?"
10017085-142 = "[s3] «Я обеими руками за!»\n[s4] «Давайте начинать вечеринку!»"
