[translation]
2005503-1 = "Спад UZQueen"
2005503-2 = "По дороге в Клуб разработки игр"
2005503-3 = "Не мог поверить, что Юзу может испытывать трудности с какой-то игрой."
2005503-4 = "Озадаченный, я поспешил в Миллениум."
2005503-5 = ""
2005503-9 = "Эй, ты уже играла в ту новую игру? Ну, которая вышла в прошлом месяце?"
2005503-10 = ""
2005503-11 = "[ns] «(Хм? Игра?)»"
2005503-12 = "О, новый файтинг «Simulion Quest»?"
2005503-13 = "Да! Обожаю этот сеттинг недалёкого киберпанкового будущего. Мир очень захватывает, взаимодействия супердетальные, а анимации невероятно плавные."
2005503-14 = "Но разве в этом нет чего-то странного?"
2005503-15 = "Странного? А, если ты про проблемы с оптимизацией, разработчики недавно опубликовали объявление. Они готовят патч, и—"
2005503-16 = "Нет, я не об этом. Разве не странно, что UZQueen нет в рейтинге?"
2005503-17 = "Таблица открылась неделю назад, а её до сих пор там нет."
2005503-18 = ""
2005503-19 = "«(UZQueen...?)»"
2005503-20 = "О, точно! UZQueen всегда доминирует в рейтингах файтингов! Странно... Ого. Может, она в отпуске?"
2005503-21 = "Или заболела. Что с ней могло случиться? Надеюсь, она в порядке."
2005503-22 = ""
2005503-23 = "Подслушав разговор, я ускорил шаг."
2005503-27 = "Клубная комната Отдела разработки игр"
2005503-28 = "[ns] «Юзу! Ты в порядке?!»"
2005503-29 = "С-Сенсей?!"
2005503-30 = ""
2005503-33 = "Ч-Что случилось?!"
2005503-34 = "Почему вы так спешили...? Пожалуйста, отдышитесь."
2005503-35 = "[s] «С тобой точно ничего не случилось, Юзу?»"
2005503-36 = "А? К-Конечно нет, Сенсей."
2005503-37 = "С-Смотрите, теперь я совершенно спокойно могу залезать в шкафчик."
2005503-38 = ""
2005503-40 = ""
2005503-41 = ""
2005503-42 = "Т-Только не говорите, что пришли из-за моего MomoTalk?!"
2005503-43 = "Я всего лишь сказала, что одна игра немного сложная...?!"
2005503-44 = "Вы переживаете... потому что это «новая сторона меня», которую вы раньше не видели?"
2005503-45 = ""
2005503-47 = ""
2005503-48 = "Если подумать, правда..."
2005503-49 = "Я почти никогда не испытывала трудностей в играх."
2005503-50 = "[s1] «Эта игра случайно не называется...»\n[s2] «...Simulion Quest?»"
2005503-53 = "К-Как вы узнали?!"
2005503-54 = ""
2005503-55 = "Я рассказал ей о разговоре, который подслушал на территории академии."
2005503-56 = "А, я-я понимаю..."
2005503-57 = "...Как вы уже узнали, мне пока не удалось нормально освоить эту игру."
2005503-58 = "Потому что, ну..."
2005503-59 = "...Хотите сами посмотреть?"
2005503-61 = "Юзу запустила Simulion Quest."
2005503-62 = "Как только игра началась и она достала периферию, я понял, почему ей было тяжело."
2005503-63 = ""
2005503-64 = "[ns3] «Нужно сражаться собственными руками...»\n[ns4] «...Это VR-игра!»"
2005503-67 = "Да. Тут дело не только в кнопках и таймингах. Нужно двигать всем телом, чтобы уклоняться и атаковать."
2005503-68 = "Но для меня... Одно дело использовать только руки, а двигаться всем телом так скованно и неловко, что..."
2005503-69 = "Я правда хотела как следует попробовать, но даже обучение оказалось сложным..."
2005503-70 = "А? Вы тоже хотите попробовать, Сенсей?"
2005503-71 = "Ну, там есть кооператив на двоих, но..."
2005503-72 = "У вас есть «идея»?"
2005503-75 = ""
2005503-76 = ""
2005503-77 = "Почему я снова это надела?!"
2005503-78 = "О, потому что «похоже на одежду протагониста»? Ну, не то чтобы вы совсем неправы, но всё же...! Не перебор ли?"
2005503-79 = "[s5] «Ну что же...»\n[s6] «Залезай мне на плечи, Юзу.»"
2005503-82 = "Что?!"
2005503-83 = "Ик!"
2005503-84 = ""
2005503-86 = ""
2005503-88 = "Я поднял Юзу, будто собирался нести её на спине."
2005503-91 = "У-Уа-а, как высоко...!"
2005503-92 = "С-Сенсей, в кооперативе на двоих играют не так...!"
2005503-93 = "[s7] «Но игра это отражает, видишь?»\n[s8] «Смотри, твой персонаж тоже едет верхом!»"
2005503-96 = "Э-Это правда, но...!"
2005503-97 = "[s9] «Движением тела займусь я, пилот.»\n[s10] «Сосредоточься на своей работе, Юзу!»"
2005503-100 = "...!"
2005503-101 = "...В таком случае я возьму на себя наблюдение и инструктаж, а движение и атаки оставлю вам, Сенсей."
2005503-102 = "[s] «Звучит отлично. Поехали!»"
2005503-107 = "И так, начав кооперативную игру на двоих вместе с Юзу..."
2005503-108 = "...меньше чем за день мы ворвались в верхние строчки рейтинга."
2005503-109 = "А потом..."
2005503-111 = "...форумы Simulion Quest заполнили игроки. Они выкладывали скриншоты и рассказывали, как видели уникальную кооперативную пару верхом, сметавшую боссов."
2005503-112 = "Однако, несмотря на весь интерес, UZQueen оказалась единственным игроком, способным повторить эту технику..."
