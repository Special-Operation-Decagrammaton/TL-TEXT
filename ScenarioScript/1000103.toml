[translation]
1000103-1 = "Исследование трендов 1"
1000103-2 = "В классе"
1000103-3 = "Ты пришёл, Сенсей."
1000103-4 = "Рада, что ты смог прийти. Знаю, ты, должно быть, занят."
1000103-5 = "[s] «Что тебя в последнее время беспокоит?»"
1000103-6 = "Ну, если честно..."
1000103-7 = "Как ты думаешь... какие сейчас девушки?"
1000103-8 = "[s] «...Почему ты спрашиваешь меня?»"
1000103-9 = "Ну, потому что тебя всегда окружают девушки."
1000103-10 = "Вот я и подумала, что ты эксперт..."
1000103-11 = "Я ошиблась?"
1000103-12 = "Хм..."
1000103-13 = "[s] «С чего вдруг такой вопрос?»"
1000103-14 = "Ну... в последнее время мне трудно находить общий язык с друзьями."
1000103-15 = "Например, они хотели сходить в новую кондитерскую, которая открылась рядом со школой."
1000103-16 = "Если им хочется вредной еды, разве не выгоднее купить дешёвую жирную картошку фри, а не дорогие конфеты?"
1000103-17 = "И это ещё без учёта времени в очереди. Я просто не понимаю их логику."
1000103-18 = "[s] «Иногда просто хочется именно сладкого.»"
1000103-19 = "Это разумный довод... но есть и другие случаи."
1000103-20 = "Например, почему девушек так интересует оккультизм? Таро, гороскопы, гадания и всё такое?"
1000103-21 = "С какой стати вообще верить какому-то гадателю по телевизору? В этом же никакой логики. Я не понимаю."
1000103-22 = "[s] «Я тоже этого не понимаю...»"
1000103-23 = "Значит, даже ты не всё знаешь о девушках. Удивлена."
1000103-24 = "Может, у меня всё-таки есть шанс..."
1000103-25 = "Хм? Я ничего не говорила."
1000103-26 = "В любом случае, если я хочу дружить с ними, мне нужно знать, что нравится девушкам."
1000103-27 = "Я сейчас прозвучала так, будто сама не настоящая девушка моего возраста? Не виню тебя, если да."
1000103-28 = "Иногда я вообще забываю, что я студент. Ты для меня скорее... товарищ, чем учитель, Сенсей."
1000103-29 = "Но если так думать, выпускаться будет только сложнее. А это неэффективно."
1000103-30 = "Итак, Сенсей. Давай прочитаем журнал, который я принесла, и исследуем природу девушек."
1000103-32 = "После этого мы с Эйми читали женские журналы, но толку было немного..."
