[translation]
2001805-1 = "Неразорвавшийся боеприпас"
2001805-2 = "Моэ пришла в офис на свою смену."
2001805-3 = "Сенсей, сегодня рассчитываю на вас!"
2001805-4 = "Хи-хи-хи... Мне уже не терпится посмотреть, какие файлы спрятаны на вашем компьютере, под предлогом выполнения обязанностей..."
2001805-5 = "[s1] «Ничего особенно интересного не найдёшь. Я уже перенёс все данные.»\n[s2] «Я заранее перенёс данные с компьютера, потому что знал, что ты придёшь.»"
2001805-6 = "Хмф... В этом не было необходимости..."
2001805-7 = "Хмф... В этом не было необходимости..."
2001805-8 = "Вы... всё ещё переживаете из-за того, что случилось в прошлый раз?"
2001805-9 = "Конечно, это была моя вина, что я нажала кнопку аварийного форматирования, но..."
2001805-10 = ""
2001805-12 = ""
2001805-13 = ""
2001805-14 = "Скажите честно, Сенсей."
2001805-15 = "Вы ведь тоже что-то почувствовали, когда все данные, над которыми мы полдня работали, исчезли?"
2001805-16 = "Катарсис, когда все наши усилия в одно мгновение превратились в ничто..."
2001805-17 = "Это будоражащее удовольствие...! *тяжело дышит* *тяжело дышит*"
2001805-18 = "[s] «Волосы действительно встали дыбом, но совсем не от удовольствия...»"
2001805-19 = "Хмф. А я так ждала возможности порыться в вашем компьютере."
2001805-20 = "Так, какая у меня сегодня работа? Давайте отчёты!"
2001805-21 = "...А? Сегодня мне ничего не нужно делать?"
2001805-22 = "Вы ненадолго уйдёте из офиса по делам «Шале», поэтому не хотите, чтобы я чего-то касалась, и просите просто сидеть здесь?"
2001805-23 = "Это несложно... но вы уверены, что мне совсем ничего не нужно делать?"
2001805-24 = "Я оператор SRT. Я пришла помогать. Я не сторожевой пёс."
2001805-25 = "Мой мозг можно использовать гораздо полезнее."
2001805-26 = "Правда? Может, мне ещё ошейник надеть, пока вас жду?"
2001805-27 = "[s3] «Не делай это странным и... Ничего. Не. Трогай.»\n[s4] «Просто ничего не трогай и жди. Вот и всё.»"
2001805-28 = "Хорошо-хорошо. Если это приказ, тогда..."
2001805-29 = "Хорошо-хорошо. Если это приказ, тогда..."
2001805-30 = "Тогда оставьте офис на меня и идите по делам. Я буду смирно сидеть и ждать, как приказано."
2001805-31 = ""
2001805-34 = "...Почему вы так подозрительно на меня смотрите? Я ничего не трону!"
2001805-36 = "...Я вышел из здания, а Моэ за моей спиной хитро улыбалась."
2001805-38 = ""
2001805-39 = "Как будто я упущу такую золотую возможность исследовать офис «Шале»!"
2001805-40 = "Может, я обнаружу новое или секретное оружие, которым владеет «Шале»..."
2001805-41 = "Или ещё лучше — раскрою какой-нибудь постыдный секрет Сенсея... Хи-хи..."
2001805-42 = "Пора расследовать!"
2001805-43 = ""
2001805-45 = ""
2001805-46 = ""
2001805-47 = ""
2001805-48 = "...А? Что это за красная кнопка?"
2001805-49 = "Возле крепления для оружия есть большая красная кнопка..."
2001805-50 = "Как подозрительно. Для чего она?"
2001805-51 = ""
2001805-53 = ""
2001805-54 = "Я в «Шале», внутри рабочего кабинета Сенсея."
2001805-55 = "Сенсей обладает внесудебными полномочиями, и даже Генеральному студенческому совету трудно его контролировать, а эта кнопка расположена так, чтобы Сенсей мог нажать её в любой момент..."
2001805-56 = "Значит, это аварийная кнопка, предназначенная только для крайне срочных и опасных ситуаций."
2001805-57 = "Например, может быть, кнопка вызова всех учеников Кивотоса..."
2001805-58 = "Или запуска древнего оружия, дремлющего в подвале «Шале»..."
2001805-59 = "Или запуска всей Башни Санктум...?"
2001805-60 = "Что бы это ни было, последствия наверняка огромны и превосходят любые мои фантазии!"
2001805-61 = "От одних мыслей об этом я возбуждаюсь... Не могу устоять!"
2001805-62 = "*тяжело дышит* *тяжело дышит* ...Я на пределе. Я её нажму... Я сделаю это!"
2001805-63 = "...Я!"
2001805-64 = ""
2001805-67 = ""
2001805-68 = "Ч-Что?! С потолка льётся вода!"
2001805-69 = "А-а, холодно!"
2001805-70 = ""
2001805-73 = "[ns] «Я вернулся...»"
2001805-75 = "[ns] «Ого! Почему повсюду вода?!»"
2001805-76 = "Я сама хотела это спросить!"
2001805-77 = "Сенсей, для чего эта кнопка?"
2001805-78 = "[s5] «Моэ, я же велел тебе сидеть спокойно. Это кнопка аварийного душа.»\n[s6] «Ты начала рыться вокруг и нажала кнопку аварийного душа?»"
2001805-79 = "...Кнопка аварийного душа?"
2001805-80 = "...Кнопка аварийного душа?"
2001805-81 = "Эта подозрительная красная кнопка... просто включает аварийный душ...?"
2001805-82 = "[s7] «В „Шале“ приходит много учеников с самыми разными проблемами. Никогда не знаешь, что случится.»\n[s8] «Я сделал эту красную кнопку, чтобы быстро реагировать в экстренной ситуации.»"
2001805-83 = ""
2001805-84 = ""
2001805-86 = ""
2001805-87 = "[ns9] «Хотя я всё-таки просил тебя ничего не трогать...»\n[ns10] «Я немного разочарован, Моэ.»"
2001805-88 = "Не смотрите на меня так разочарованно! Это я разочарована!"
2001805-89 = "Я здесь разочарована!"
2001805-90 = ""
2001805-93 = "Вы знаете, как сильно я предвкушала нажатие этой кнопки?!"
2001805-94 = "Я ожидала разрушения катастрофического масштаба!"
2001805-95 = "Хотя бы запуск ракеты!"
2001805-96 = "А в итоге просто приняла душ!"
2001805-97 = "Вы ответственны за моё разочарование!"
2001805-99 = "Некоторое время я пытался успокоить Моэ, которая почему-то злилась на меня по причинам, которых я до сих пор не понимаю."
