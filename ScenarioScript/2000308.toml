[translation]
2000308-1 = "Долг перед справедливостью"
2000308-2 = "Крыша Тринити"
2000308-3 = "Хм. Они опаздывают. Уже должны вот-вот пройти здесь..."
2000308-4 = "Но расслабляться нельзя. У меня будет лишь мгновение, чтобы сделать идеальный выстрел по цели!"
2000308-5 = "Что? Вам кажется жестоким одним выстрелом вывести цель из строя? Даже если она виновна в ужасных преступлениях?"
2000308-6 = "Не беспокойтесь. В этой винтовке транквилизаторы — они лишь усыпят цель."
2000308-7 = "Как только цель отключится, мы возьмём её под стражу и попросим президента Цуруги провести расследование."
2000308-10 = "― Фух... Сегодня непривычно жарко.[wa:520]"
2000308-13 = "― Я выдержу такую жару, если это необходимо ради идеального выстрела.[wa:1920]"
2000308-16 = "― Но надеюсь... я не слишком вспотею.[wa:380]"
2000308-19 = "― В такие жаркие летние дни я завидую белой форме других студентов.[wa:1320]"
2000308-22 = "― Сенсей. Вы на меня смотрите.[wa:1720]"
2000308-24 = "― Разве вам не следует следить за целью?[wa:10]"
2000308-27 = "*бип* *бип*"
2000308-28 = "А? Звонок от Оперативной группы правосудия...?"
2000308-29 = "Маширо? Где ты и что сейчас делаешь?"
2000308-30 = "Вчера Хасуми сказала мне, что глава Чёрного рынка скоро будет проходить неподалёку... Я заняла ближайшую позицию и жду."
2000308-31 = "Ох. Боюсь, ты зря теряла время."
2000308-32 = "А? В смысле?"
2000308-33 = "Президент Цуруги сама арестовала этого преступника ещё прошлой ночью."
2000308-34 = "Ты же её знаешь. Вечно действует самостоятельно."
2000308-35 = "Тогда... всё это было напрасно?"
2000308-36 = "Можешь возвращаться в клубную комнату. Прости за недоразумение."
2000308-37 = "*вздох* Понятно."
2000308-39 = "По дороге обратно в школу я пытался подбодрить Маширо."
