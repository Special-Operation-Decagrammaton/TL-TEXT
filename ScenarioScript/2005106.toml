[translation]
2005106-1 = "Я горжусь тобой, Рейса"
2005106-2 = ""
2005106-3 = "Сенсей, сюда!"
2005106-4 = "[s] «О, рад тебя видеть, Рейса!»"
2005106-5 = "Фу-фу. «Узава Рейса». Как ностальгично."
2005106-6 = "Когда-то меня так называли."
2005106-7 = "[s] «А?»"
2005106-8 = "Отныне прошу называть меня «Thermite Pink»!"
2005106-9 = "[s] «Ты пробудилась!»"
2005106-10 = "Ха-ха-ха!"
2005106-11 = ""
2005106-13 = ""
2005106-14 = "Угх..."
2005106-15 = "Я уже второй раз застряла в одном и том же костюме..."
2005106-16 = "Так что я смирилась со своей судьбой."
2005106-17 = "[s] «Если не можешь победить — присоединяйся!»"
2005106-18 = "Ну, приятно носить любимый костюм."
2005106-19 = "Но уже пора на патруль!"
2005106-20 = "Я подумала, для разнообразия будет весело надеть его."
2005106-21 = "И, скажем так, всё пошло непредсказуемо!"
2005106-22 = "Мне нужно переодеться и заняться работой..."
2005106-23 = ""
2005106-25 = ""
2005106-26 = ""
2005106-27 = "Эй! Ты собираешься что-нибудь с этим делать?"
2005106-28 = "По-моему, этот тип вывихнул мне плечо!"
2005106-29 = "П-Правда? Я всего лишь случайно вас задел, не более."
2005106-30 = "Это ты так извиняешься?"
2005106-31 = "Может, сразу начнёшь оплачивать мне больницу? Давай кошелёк!"
2005106-32 = "Ва! Пожалуйста, отпустите меня!"
2005106-33 = ""
2005106-36 = ""
2005106-37 = "А ну стоять!"
2005106-38 = ""
2005106-41 = ""
2005106-42 = "А? Что это, съезд чудиков?"
2005106-43 = "Ты типа принцесса?"
2005106-44 = ""
2005106-47 = ""
2005106-49 = "Нет, фея?"
2005106-50 = ""
2005106-53 = ""
2005106-55 = "Да всё равно! Проваливай! У нас тут личные дела!"
2005106-56 = ""
2005106-58 = ""
2005106-61 = "Ай!!! М-Моё плечо!!!"
2005106-62 = "Теперь оно, кажется, НА САМОМ ДЕЛЕ сломано! А-а-ай!"
2005106-64 = "А теперь извинись!"
2005106-66 = "А-Ах, п-прости! Простите! Я не специально."
2005106-67 = "Э-Эм... Да, ну..."
2005106-69 = "И ещё одно извинение! За то, что назвал меня принцессой-феей!"
2005106-70 = "Ты вообще чем думаешь?!"
2005106-72 = "О нет, Флаффи Паффи!"
2005106-73 = "Мой Флаффи Паффи застрял на дереве!"
2005106-74 = "Мм!"
2005106-75 = "Так, значит, у нас кошка на дереве?"
2005106-76 = "Я уже иду!"
2005106-77 = ""
2005106-82 = "Хоп!"
2005106-83 = "Эм... Кошки я не вижу. Зато нашла дрон."
2005106-84 = "Бедный Флаффи Паффи!"
2005106-85 = "Он застрял в ветках. Не специально! Огромное спасибо!"
2005106-86 = "Что??"
2005106-87 = ""
2005106-88 = "О боже! Пожалуйста, помогите!"
2005106-89 = "Уже работаю!"
2005106-90 = ""
2005106-91 = "Сегодня столько всего произошло."
2005106-92 = "Я даже переодеться не успела."
2005106-93 = "[s] «И всё же сейчас, кажется, спокойно.»"
2005106-94 = "Фу-фу, для звёздного аса Отряда линчевателей это сущий пустяк!"
2005106-95 = "Нам уже пора возвр..."
2005106-96 = ""
2005106-98 = ""
2005106-99 = ""
2005106-100 = "Эй! Мой воздушный змей!"
2005106-101 = "Он летит в реку!"
2005106-102 = "Я так долго его делал! О нет!"
2005106-103 = "!!"
2005106-104 = "Нужно сохранить дух трудолюбия этого ребёнка!"
2005106-105 = "Хия!"
2005106-106 = ""
2005106-112 = "― [log=레이사 매지컬]Спасён![/log][wa:1950]"
2005106-115 = "― [log=레이사 매지컬]Фу-фу... И покой воздушного змея тоже сохранён![/log][wa:1148]"
2005106-117 = "― [log=레이사 매지컬]Я поймала его прямо перед тем, как он упал в воду! [/log][wa:1010]"
2005106-120 = "[ns] «Рейса, ты в порядке?»"
2005106-122 = "― [log=레이사 매지컬]Отряд линчевателей никогда не колеблется, когда нужно помочь другому![/log][wa:1340]"
2005106-125 = "― [log=레이사 매지컬]Огонь или вода, [/log][wa:1310]"
2005106-127 = "― [log=레이사 매지컬]где бы это ни было, мы прыгнем туда! Э-хе-хе... [/log][wa:1610]"
2005106-130 = "[ns] «Ты насквозь промокла! Так можно простудиться.»"
2005106-131 = "― [log=레이사 매지컬]Костюм героя [/log][wa:1120]"
2005106-133 = "― [log=레이사 매지컬]сияет по-настоящему только во время геройских поступков![/log][wa:1930]"
2005106-136 = "― [log=레이사 매지컬]К тому же этот костюм можно стирать в машинке![/log][wa:1650]"
2005106-139 = "― [log=레이사 매지컬]И ещё я... кое-чему у тебя научилась... [/log][wa:3011]"
2005106-141 = "― [log=레이사 매지컬]Только те, кто действует, могут защитить невинных! Э-хе-хе![/log][wa:3180]"
2005106-144 = "― [log=레이사 매지컬]Хи-хи, а-а... [/log][wa:1300]"
2005106-146 = "― [log=레이사 매지컬]Апчхи!!! [/log][wa:10]"
2005106-149 = "― [log=레이사 매지컬]Ух...[/log]"
2005106-152 = "Я отвёл храбрую Рейсу обратно в Шале."
2005106-153 = "Проследил, чтобы она приняла душ и отдохнула."
