83300500800-7 = "*вздыхает* ...И весь этот шум сразу после завершения тренировок."
83300500800-8 = "Через пять дней откроется Вечеринка Геенны... И обещает быть совсем не похожей на прежние."
83300500800-9 = ""
83300500800-11 = ""
83300500800-12 = "А стоит за всем этим никто иной, как председатель Общества Пандемониума... Ханума Макото."
83300500800-13 = ""
83300500800-15 = ""
83300500800-16 = "...Хватит. Одними мрачными размышлениями проблему не решить."
83300500800-17 = "Завтра стоит... навестить Общество Пандемониума."
