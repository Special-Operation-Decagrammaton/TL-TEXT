[translation]
80000126-1 = "Тройка"
80000126-3 = ""
80000126-4 = "Здравствуйте, Сенсей! Я пришла!"
80000126-5 = "[s] «Добро пожаловать! Ну, что случилось?»"
80000126-6 = "Насчёт этого! Я-я, эм..."
80000126-7 = "..."
80000126-8 = ""
80000126-10 = "(О-Ого... Я думала, всё будет легко. Столько раз репетировала, но...!)"
80000126-11 = "(Теперь, когда действительно стою перед Сенсеем, кажется, я не смогу...!)"
80000126-12 = "(Ч-Что делать? Может, просто помахать рукой и уйти...?)"
80000126-13 = "(Нет! Нет! Я могу думать бесконечно, но знаю, что так нельзя!)"
80000126-14 = ""
80000126-16 = "[ns] «Рэй?»"
80000126-17 = "?!"
80000126-18 = "Эм, э-э, Сенсей? Ну, вы же знаете, что сегодня, эм, такой особый день?"
80000126-19 = "[s] «Какой день? День игры?»"
80000126-20 = "В-В-В..."
80000126-21 = "День святого Валентина!"
80000126-22 = "П-Простите! Это было слишком... прямо? Я, э-эм..."
80000126-23 = "Вот! Сегодня этот день! Я попробовала кое-что сделать..."
80000126-24 = "И буду рада, если вы примете!"
80000126-25 = "Рэй внезапно протянула нечто похожее на бейсбольную перчатку шоколадного цвета."
80000126-26 = ""
80000126-28 = ""
80000126-29 = ""
80000126-30 = "Х-Хи-хи... Получилось... Фух..."
80000126-31 = "[s1] «Это... „шоколад-варежка“?»\n[s2] «Спасибо, выглядит восхитительно.»"
80000126-34 = ""
80000126-36 = "!!"
80000126-37 = "Конечно! Спасибо! То есть, эм, пожалуйста!"
80000126-38 = "Хм? Сделала ли я сама? Просто шоколад такой формы обычно не продают?"
80000126-39 = "..."
80000126-40 = "Ну, можно сказать, что да, но в то же время как бы и нет."
80000126-42 = "Я запутался и попросил объяснить."
80000126-44 = ""
80000126-45 = "Для начала... модель этой перчатки сделали по одной из моих старых."
80000126-46 = "А 3D-сканирование, уменьшение масштаба, графический рендеринг..."
80000126-47 = "...и затем 3D-печать были, скажем так, «с помощью»."
80000126-48 = "...Потому что у меня нет навыков ни для этого, ни даже для изготовления формы..."
80000126-49 = "...я попросила ИИ-помощника сделать это."
80000126-50 = "Н-Но...! Конечно, распечатанную модель я шлифовала сама. И заглаживала. Шва ведь даже не видно, правда?"
80000126-51 = "Но в итоге можно сказать, что всё, что я сделала, — залила горячий шоколад в пластик."
80000126-52 = "Поэтому я не уверена, можно ли сказать, что я вообще что-то «сделала» сама. Ха..."
80000126-53 = "[s3] «Нет, этого более чем достаточно.»\n[s4] «Наверняка потребовалось немало усилий. Спасибо.»"
80000126-56 = "Серьёзно?"
80000126-57 = "Хи-хи..."
80000126-58 = "В таком случае! На самом деле я сделала ещё немного!"
80000126-59 = ""
80000126-61 = ""
80000126-62 = ""
80000126-63 = "[ns] «Перчатка, бита И бейсбольный мяч...?»"
80000126-64 = "Да! Для меня это триада бейсбольного снаряжения! Самое необходимое!"
80000126-65 = "С этой тройкой можно в любой момент сыграть в бейсбол с кем угодно!"
80000126-66 = "Вот, если покатить мяч к перчатке и ударить его битой..."
80000126-67 = "Номаса Рэй делает чистый удар! Мяч пролетает мимо шортстопа! Трибуны ревут!"
80000126-68 = "Рэй несётся на полной скорости! Успеет ли она добежать до второй базы?!"
80000126-70 = "Я поделился бейсбольной шоколадной тройкой с расслабившейся и развеселившейся Рэй."
80000126-71 = "С сияющими глазами она продолжала «играть в бейсбол», пока мы ели шоколад."
