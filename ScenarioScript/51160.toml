51160-148 = ""
51160-149 = "...?!"
51160-150 = "[s] «Вы тоже это слышали?»"
51160-151 = ""
51160-157 = "[ns] «Фейерверки? Похоже, фестиваль начался.»"
51160-158 = "Грохот фейерверков заполнил ночное небо."
51160-160 = "Так фестиваль официально начался."
51160-161 = ""
51160-168 = ""
51160-170 = ""
51160-171 = "Морё?! Что вы—"
51160-172 = ""
51160-175 = ""
51160-176 = "Ик!"
51160-177 = "Поверьте нам! Это не мы!"
51160-178 = "Она нас использовала! Мы ничего не пытались призывать!"
51160-179 = "[s] «О чём вы говорите? Начните с самого начала.»"
51160-180 = "Она задавала нам все эти вопросы."
51160-181 = "Мы даже, типа, толком не соглашались! Она сказала, что может нам помочь, и звучало это неплохо."
51160-182 = "Но потом...!"
