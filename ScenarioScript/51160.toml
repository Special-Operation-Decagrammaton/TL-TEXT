[translation]
51160-1 = "Эпизод 16;Горё Нагуса"
51160-3 = ""
51160-4 = ""
51160-5 = "(В воздухе трепещет возбуждение, подхваченное волнами смеха.)"
51160-6 = "(Радость, рождённую фестивалем, почти можно ощутить руками.)"
51160-8 = "(Когда-то такая картина была обычным делом.)"
51160-9 = "(В те времена, когда Хяккарёран...)"
51160-12 = "Когда мы с тобой патрулировали улицы..."
51160-13 = "Аямэ."
51160-15 = "Она в одиночку мгновенно разобралась со всеми этими преступниками!"
51160-16 = "Согласно отчётам, это уже 127-й раз, когда она разрешила конфликт без какой-либо поддержки."
51160-17 = "И при всём этом она не считает ниже своего достоинства залезть на дерево, чтобы спасти потерявшуюся кошку или другого питомца!"
51160-18 = "Я даже слышала, что...!"
51160-20 = "(Все говорят о ней.)"
51160-21 = "(Куда ни повернись, повсюду имя Аямэ.)"
51160-23 = "Аямэ — талант, который рождается раз в поколение!"
51160-24 = "Я сплю как младенец, зная, что Аямэ на дежурстве."
51160-25 = "Нанакадо Аямэ — мой пример для подражания! Я очень ею восхищаюсь."
51160-27 = "Слава богам за Аямэ."
51160-28 = ""
51160-32 = "Все знали, что под руководством Аямэ Хяккарёран в безопасности."
51160-33 = "Мы с Аямэ служили в Хяккарёран вместе, бок о бок."
51160-34 = "Мы оставались бы подругами, пока обе дышим."
51160-35 = "Я всегда была бы её правой рукой."
51160-37 = "Я подумала..."
51160-38 = "...моё место рядом с ней."
51160-41 = "Можешь поверить? Похоже, президент Аямэ и правда исчезла."
51160-42 = "Ходят слухи, что она встретилась с Кузунохой, а потом... пуф!"
51160-43 = "Кузуноха вообще не существует. Быть такого не может."
51160-44 = "Ну, она точно исчезла. Что... нам делать?"
51160-45 = "У нас нет президента. Кто поведёт Хяккарёран?"
51160-46 = "Что теперь будет...?"
51160-47 = ""
51160-51 = "Не унывайте так. Всё будет хорошо."
51160-52 = "Точно! Нагуса всё ещё здесь!"
51160-53 = "Нагуса все эти годы поддерживала Аямэ. Она столько сделала для Хяккарёран."
51160-55 = "Всё будет хорошо."
51160-56 = ""
51160-58 = ""
51160-59 = ""
51160-60 = ""
51160-62 = "Нет. Не будет. Совсем не будет."
51160-63 = "(Как я могла сказать им такое?)"
51160-64 = "Я не могу так с ними поступить."
51160-67 = "(Мне не хватит сил нести этот крест.)"
51160-68 = "Конечно, не хватит."
51160-69 = ""
51160-72 = "Потому что я не Аямэ."
51160-73 = ""
51160-76 = "Я никогда не стану Аямэ."
51160-77 = "Аямэ — президент Хяккарёран. Только она достойна этой должности."
51160-79 = "Мне никогда... не сравниться с тобой..."
51160-80 = "Что ты ожидала от меня... без тебя...?"
51160-81 = ""
51160-84 = "[ns] «Я так и думал, что вы Нагуса.»"
51160-85 = ""
51160-87 = ""
51160-88 = "...!"
51160-89 = ""
51160-92 = "Члены Клуба исследования ниндзюцу заметили в Западном районе девушку, подходящую под описание Нагусы, и это привело меня прямо к ней."
51160-93 = "Я узнал её, едва снова увидел."
51160-94 = "И снова здравствуйте, Сенсей из Шале."
51160-95 = "[s] «Вы та девушка с куриным шашлычком!»"
51160-96 = "Куриным... чем?"
51160-97 = "...Сейчас не время для ваших выходок."
51160-98 = "Похоже, нам всё же следует как следует представиться."
51160-99 = "[s] «Нагуса.»"
51160-100 = ""
51160-102 = ""
51160-103 = "Попалась. Меня зовут Горё Нагуса, вице-президент Хяккарёран."
51160-104 = "Точнее, бывший вице-президент."
51160-105 = "Зачем вы приложили столько усилий, чтобы найти меня?"
51160-106 = "...Поговорить? Со мной?"
51160-107 = "[s] «В прошлый раз мы говорили о состязании за преемство... и о Хяккарёран.»"
51160-109 = "Я рассказал Нагусе о событиях, произошедших после нашего разговора."
51160-110 = "Я рассказал ей о встрече Юкари и Кикё, последовавшем состязании за преемство и о том, как всё закончилось решением Юкари принять свою роль мико Кадэнокодзи."
51160-112 = "Понятно."
51160-113 = "Тогда всё так, как и должно быть. Это хорошо."
51160-114 = "[s] «Вы правда так думаете?»"
51160-115 = "...Почему вы спрашиваете?"
51160-116 = "[s1] «Юкари всегда так хорошо отзывалась о вас, Нагуса.»\n[s2] «Она вступила в Хяккарёран из-за вас.»"
51160-119 = "[ns3] «Вы просто позволите ей уйти?»\n[ns4] «Вы не будете за неё бороться?»"
51160-122 = "..."
51160-123 = "...Я..."
51160-124 = "[s] «Я слышал, вы ушли с должности, Нагуса.»"
51160-125 = "Вы пришли сюда, чтобы узнать почему?"
51160-126 = "Почему я позволяю Хяккарёран разваливаться? Это вы хотели спросить?"
51160-127 = "..."
51160-128 = "Всё предельно просто."
51160-129 = "Нанакадо Аямэ — президент Хяккарёран."
51160-130 = "Только она была достойна этой должности."
51160-131 = "Она была... талантом, который рождается раз в поколение."
51160-132 = "Аямэ незаменима. Поэтому я ушла."
51160-134 = ""
51160-136 = "Все смотрели на меня, и я неизбежно их разочаровала бы."
51160-137 = "Кикё, Рэнгэ и Юкари могут кричать, спорить и не соглашаться, но реальность они не изменят."
51160-138 = "Однажды они сами это поймут."
51160-140 = "Я унаследовала титул президента. Я его не заслужила."
51160-141 = "Да. Всё так, как и должно—"
51160-142 = ""
