51160-193 = "[s] «Что это такое?!»"
51160-194 = "...Фантомные сказания."
51160-195 = "Этому не место здесь. Оно вырвалось с Великого снежного поля."
51160-198 = "Итак, сцена готова!"
51160-199 = "Поднимайте занавес. Пора."
