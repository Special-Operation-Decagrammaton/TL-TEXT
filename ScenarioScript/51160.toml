[translation]
51160-1 = "Episódio 16;Goryou Nagusa"
51160-5 = "(Vozes cheias de empolgação e expectativa, passos leves)"
51160-6 = "(As ruas de Hyakkiyako estão agora repletas de expectativa para o festival)"
51160-8 = "(Uma cena muito comum na Hyakkiyako de antigamente)"
51160-9 = "(Uma cidade assim... nós... o Hyakkaryouran...)"
51160-12 = "Fazíamos a patrulha juntas, né."
51160-13 = "......Ei, Ayame."
51160-15 = "Ouvi dizer que a Ayame-senpai espantou uns encrenqueiros de novo!"
51160-16 = "Já é a 127ª vez com essa?#nResolver tudo sozinha! Incrível!"
51160-17 = "Outro dia ela até salvou um gatinho que não conseguia descer de uma árvore!"
51160-18 = "E daquela outra vez...!"
51160-20 = "(Sobre a Ayame)"
51160-21 = "(Todos falavam sem parar)"
51160-23 = "A Ayame-senpai é mesmo incrível, né!"
51160-24 = "Com a Ayame-senpai aqui, parece que não precisamos nos preocupar com nada!"
51160-25 = "Nanakado Ayame-senpai... Um dia eu também quero ser como a senpai!"
51160-27 = "Que bom que a Ayame-senpai está no Hyakkaryouran!"
51160-32 = "Sim. Contanto que a Ayame esteja aqui, o Hyakkaryouran vai ficar bem."
51160-33 = "Se a Ayame estiver aqui... eu também posso continuar atuando no Hyakkaryouran assim."
51160-34 = "Como amiga de infância da Ayame..."
51160-35 = "Posso ficar ao lado da Ayame para sempre."
51160-37 = "Eu achava que seria assim—"
51160-38 = "—mas não foi."
51160-41 = "Ei, você soube? Dizem que a Presidente Ayame desapareceu."
51160-42 = "Segundo os boatos, ela sumiu depois de se encontrar com a Kuzunoha-sama."
51160-43 = "Hã, sério? Mas a Kuzunoha-sama não era só um boato?"
51160-44 = "Sei lá... Aliás, o que vamos fazer agora?"
51160-45 = "O que vai acontecer com o Hyakkaryouran daqui pra frente?#nO cargo de Presidente vai ficar vago, né?"
51160-46 = "O que vai... ser de nós?"
51160-51 = "Quanto a isso, não vai ficar tudo bem?"
51160-52 = "Bom, nós ainda temos a Nagusa-senpai."
51160-53 = "Mesmo sem a Ayame-senpai, a competente Nagusa-senpai ficou conosco!"
51160-55 = "Então vai ficar tudo bem!"
51160-62 = "Não... não é isso."
51160-63 = "(Estes eram meus verdadeiros sentimentos, que eu não conseguia dizer em voz alta)"
51160-64 = "...Eu não consigo."
51160-67 = "(Para mim, que fui deixada para trás, esta arma é pesada demais)"
51160-68 = "Porque... eu..."
51160-72 = "Não sou a Ayame."
51160-76 = "Porque eu não posso substituir a Ayame."
51160-77 = "Porque a única digna de ser a Presidente do Hyakkaryouran é a Ayame."
51160-79 = "Eu não tenho esse direito... eu não tenho nada disso..."
51160-80 = "...Sem você no Hyakkaryouran... eu não consigo mais..."
51160-84 = "[ns] \"Afinal, você era mesmo a Nagusa.\""
51160-88 = "...!"
51160-92 = "(Após receber uma mensagem do Clube de Pesquisa Ninjutsu dizendo \"Encontramos alguém parecida com a Nagusa no Distrito Oeste\", corri para o local)"
51160-93 = "(Lá estava uma garota com quem eu já havia trocado algumas palavras antes)"
51160-94 = "Você é... o Sensei da Schale da outra vez."
51160-95 = "[s] \"E você é a garota da espiral de felicidade do yakitori infinito daquela vez!\""
51160-96 = "Espiral de felici... o quê?"
51160-97 = "...Pare com essas piadas sem graça."
51160-98 = "Pelo visto... você já sabe quem eu sou.#nNão que eu tivesse a intenção de esconder."
51160-99 = "[s] \"Nagusa.\""
51160-103 = "Sim, eu sou Goryou Nagusa.#nVice-Presidente do Hyakkaryouran."
51160-104 = "Não, agora que devolvi o símbolo... acho que sou a \"ex\"-Vice-Presidente."
51160-105 = "Então, o que você quer?"
51160-106 = "Assunto comigo...? Você?"
51160-107 = "[s] \"Quando nos encontramos antes, falamos sobre o Torneio de Sucessão e o Hyakkaryouran, lembra?\""
51160-109 = "(Expliquei a Nagusa o que aconteceu depois daquilo)"
51160-110 = "(Que fui encontrar a Kikyou com a Yukari, o resultado do Torneio de Sucessão contra a Kikyou, e que a Yukari decidiu dançar como sacerdotisa no festival)"
51160-112 = "...Entendo."
51160-113 = "Acho que essa é a resposta certa. A escolha dela está correta."
51160-114 = "[s] \"...Você realmente acha isso?\""
51160-115 = "...Por que está me perguntando isso?"
51160-116 = "[s1] \"A Yukari falou de você o tempo todo.\"\n[s2] \"Disse que entrou para o Hyakkaryouran porque te admirava.\""
51160-119 = "[ns3] \"Você realmente acha que ela deveria deixar o Hyakkaryouran...\"\n[ns4] \"E voltar para o lugar de onde veio?\""
51160-122 = "......"
51160-123 = "Eu......"
51160-124 = "[s] \"Ouvi dizer que você tentou devolver o símbolo da Presidente, Nagusa.\""
51160-125 = "Por que eu fiz isso..."
51160-126 = "Quer saber por que eu não volto para onde estão todas e não atuo como membro do Hyakkaryouran...#nÉ isso?"
51160-127 = "......"
51160-128 = "A resposta é simples."
51160-129 = "Porque a Presidente do Hyakkaryouran é \"Nanakado Ayame\"."
51160-130 = "A Ayame é a única que merece o cargo de Presidente."
51160-131 = "Tem que ser a Ayame."
51160-132 = "Eu não posso substituir a Ayame.#nPor isso decidi recuar."
51160-136 = "Eu não sou tão digna... quanto aquelas garotas pensam."
51160-137 = "Agora todas estão dizendo que não aceitam isso, mas..."
51160-138 = "Com o tempo, elas certamente vão entender."
51160-140 = "Esse título de Presidente Interina... só foi empurrado para mim."
51160-141 = "Sim, é realmente só isso—"
51160-146 = "[log=???][ff4444]<Mentira>[-][/log]"
51160-149 = "...?!"
51160-150 = "[s] \"O que foi isso agora...?\""
51160-157 = "[ns] \"Ah, o sinal de início do festival...\""
51160-158 = "(Flores desabrocham no céu—)"
51160-160 = "(O festival—vai começar)"
51160-171 = "Trupe Chimi, vocês...!"
51160-176 = "Iik?!"
51160-177 = "N-Não é isso... aquilo não foi coisa nossa...!"
51160-178 = "A gente não fez nada! É verdade, juro!"
51160-179 = "[s] \"Primeiro se acalmem... me contem exatamente o que aconteceu.\""
51160-180 = "A gente só respondeu à pergunta daquela pessoa!"
51160-181 = "Querem ajuda?"
51160-182 = "Ela perguntou isso e a gente só respondeu \"sim\"...!"
51160-192 = "...!"
51160-193 = "[s] \"O que é aquilo...\""
51160-194 = "......Hyakumonogatari Espectral."
51160-195 = "Por que... aquilo está aqui...?!"
51160-198 = "Os atores estão todos reunidos."
51160-199 = "Vamos começar?"
51160-203 = "...O nosso próprio espetáculo refinado."
51160-205 = "Próximo;O Conto Macabro que Caminha pela Cidade (1)"
