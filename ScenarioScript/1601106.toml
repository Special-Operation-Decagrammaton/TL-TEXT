[translation]
1601106-1 = "Правильная форма"
1601106-2 = "У меня выдалось свободное время, поэтому я связался с Хасуми и договорился о тренировке."
1601106-3 = "К тому времени, как я пришёл в небольшой спортзал, который мы выбрали, Хасуми уже была там."
1601106-4 = ""
1601106-6 = ""
1601106-7 = "О, вы пришли, Сенсей. Я вас ждала."
1601106-8 = "...Хм?"
1601106-9 = "Вы пришли рано, но я ещё раньше?"
1601106-10 = "Конечно. Именно такой настрой сегодня и нужен."
1601106-11 = "[s1] «Какой ещё настрой?»\n[s2] «Что ты имеешь в виду?»"
1601106-14 = "Сегодняшний день отведён тренировке выносливости."
1601106-15 = "Во время Фестиваля Хало Кивотоса мне пришло в голову несколько вещей. До следующего ещё далеко, но..."
1601106-16 = "А пока я подумала дать вам несколько простых советов."
1601106-17 = "Исправить осанку, показать хорошие упражнения на растяжку..."
1601106-18 = "Не как тренер или что-то такое. Я думала, мы подойдём к этому как товарищи по тренировкам."
1601106-19 = "Это слишком? Теперь, когда сказала вслух, стало как-то неловко..."
1601106-20 = "[s3] «Меня устраивает. Буду ждать с нетерпением.»\n[s4] «Как раз то, что нужно. В последнее время всё тело затекло.»"
1601106-23 = "Хи-хи... Я рада. Тренировки должны приносить удовольствие, а не быть обузой."
1601106-24 = "Вообще-то именно ваши прежние слова натолкнули меня на эту идею."
1601106-25 = ""
1601106-27 = ""
1601106-28 = ""
1601106-30 = "Может, начнём с чего-нибудь лёгкого?"
1601106-47 = "Я повторял движения за Хасуми и выполнил комплекс упражнений."
1601106-51 = "О. Сенсей, можете немного подождать?"
1601106-52 = "Оставайтесь в таком положении. Я сейчас подойду."
1601106-53 = "Для этого движения голову нужно опустить ниже..."
1601106-54 = "Я поправлю."
1601106-55 = ""
1601106-57 = ""
1601106-58 = ""
1601106-60 = ""
1601106-61 = "Вот так..."
1601106-62 = ""
1601106-64 = ""
1601106-65 = "А теперь так."
1601106-66 = ""
1601106-68 = ""
1601106-70 = "[ns5] «...?! Х-Хасуми?!»\n[ns6] «(...?! Ко мне что-то прижимается...?!)»"
1601106-71 = ""
1601106-72 = ""
1601106-74 = ""
1601106-75 = "...Хм? Что-то не так, Сенсей? Вам неудобно..."
1601106-76 = "А? Говорите, справитесь сами? Что вы имеете в виду?"
1601106-77 = "Я слишком сильно надавила? Или..."
1601106-78 = ""
1601106-80 = ""
1601106-81 = "...Ах."
1601106-82 = ""
1601106-84 = ""
1601106-85 = ""
1601106-87 = "(Это потому, что я давлю на Сенсея своим весом?)"
1601106-88 = "(Неужели... я слишком тяжёлая?! А Сенсей слишком добрый, чтобы сказать?!)"
1601106-89 = ""
1601106-91 = ""
1601106-93 = ""
1601106-94 = "[ns7] «...Хасуми?»\n[ns8] «Почему ты вдруг отодвинулась?»"
1601106-97 = "П-Простите, Сенсей! Я вовсе не хотела...!"
1601106-98 = "Всё нормально? Н-Но..."
1601106-99 = "...А? Будем по очереди?"
1601106-100 = "Теперь вы будете следить за моей техникой? Ну, я не против..."
1601106-101 = "[s9] «Мне будет спокойнее, если я тоже внесу вклад.»\n[s10] «Мы же товарищи по тренировке, значит должны помогать друг другу.»"
1601106-104 = "Хм..."
1601106-105 = "Справедливо. На этот раз можете помочь мне..."
1601106-106 = "Помочь... с моей... позой..."
1601106-107 = ""
1601106-109 = ""
1601106-110 = ""
1601106-112 = "Т-Тогда..."
1601106-113 = "Я... рассчитываю на вас... Сенсей..."
1601106-117 = "*тяжело дышит* *тяжело дышит*"
1601106-118 = "Это уже три подхода..."
1601106-119 = "На сегодня хватит?"
1601106-120 = "...Ах."
1601106-121 = "Простите. Я сказала это так, будто само собой разумеется, что мы продолжим заниматься вместе."
1601106-122 = "Я не хотела навязываться..."
1601106-123 = "О? Вы тоже так и предполагали?"
1601106-124 = "Я-я хочу сказать... Да, конечно, если хотите..."
1601106-125 = ""
1601106-127 = ""
1601106-128 = "...Хи-хи. Понятно."
1601106-129 = "Тогда мы договорились."
1601106-130 = "Спасибо, Сенсей."
1601106-132 = "Буду ждать следующего раза."
