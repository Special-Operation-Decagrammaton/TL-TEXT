[translation]
202-1 = "Хесед, Милосердный арбитр"
202-2 = "Эти так называемые руины должны оказаться для нас полезными."
202-3 = "Несколько моих коллег из Гематрия проявили к этому месту большой интерес."
202-4 = "Давно замолчавший завод боеприпасов, хм?"
202-5 = "Декаграмматон вступил в контакт с Divi:Sion — ИИ, создающим бесконечную армию."
202-6 = "Теперь сам завод боеприпасов был просвещён и поставлен на новый путь как пророк Декаграмматона."
202-8 = "Хесед."
202-9 = "Его путь — милосердие, рождённое силой."
202-10 = "Его титул — Милосердный арбитр."
202-11 = ""
202-12 = "Возможно ли вообще свергнуть его власть над стабильным царством и преданными подданными?"
202-13 = "И это тоже интересная тема."
