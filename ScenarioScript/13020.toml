[translation]
13020-1 = "Episódio 2;Convidados Indesejados"
13020-5 = "Cof, cof.#nUgh..."
13020-6 = "Este aqui era o último?"
13020-7 = "É, era para ser..."
13020-8 = "Mas realocar o depósito logo numa época dessas, o que deu..."
13020-9 = "Parece que este lugar ficou abandonado por um bom tempo...#nPara que servia originalmente?"
13020-10 = "Se não me engano, guardavam documentos confidenciais da academia aqui, ou algo assim..."
13020-11 = "...Documentos confidenciais?"
13020-12 = "Ainda assim, já não devem servir para nada.#nNão foi por isso que mandaram descartar tudo?"
13020-13 = "Mas não seria melhor dar uma olhada rápida nos papéis, só por precaução...?"
13020-14 = "...Não, pode descartar mesmo.#nTambém não temos muito tempo."
13020-15 = "É, faz sentido... Hm?"
13020-20 = "Ngh?!"
13020-21 = "O que foi?!"
13020-22 = "O pilar...! Corre!"
13020-27 = "Huff, huff...#n...Você se machucou?"
13020-28 = "E-Estou bem.#nQuem diria que o prédio estava tão deteriorado assim..."
13020-29 = "Não tem nem como limpar isso agora...#nVamos confirmar com o pessoal de cima primeiro..."
13020-30 = "Hm? O que é isso?"
13020-34 = "Que documento é esse?"
13020-35 = "Deixa eu ver..."
13020-36 = "\"Contrato de Compra e Venda—"
13020-37 = "—Colégio Abydos\"?"
13020-53 = "Com licença..."
13020-59 = "Aquela é a vice-presidente do conselho estudantil..."
13020-60 = "..."
13020-61 = "Por que ela ainda está aqui sozinha..."
13020-62 = "...Hm?"
13020-69 = "Sinto um olhar..."
13020-70 = "..."
13020-71 = "...Deve ser impressão minha."
13020-73 = "Huff, huff..."
13020-74 = "Que susto..."
13020-75 = "Mesmo estando tão longe...#nEu tinha ouvido os boatos, mas..."
13020-76 = "Que boatos?"
13020-78 = "...E-Eh, bem.#nHoshino-san..."
13020-82 = "!?"
13020-84 = "Ora... Você sabe o meu nome?"
13020-86 = "E-Então, bem..."
13020-87 = "Quem é você?#nO que quer comigo?"
13020-88 = "E-Eu sou..."
13020-89 = "Estudante de onde?#nQual é a sua escola e o seu ano?"
13020-90 = "Não que eu vá pegar leve mesmo se for mais velha.#nVocê já deve saber disso, se andou me investigando."
13020-91 = "N-Não foi com essa intenção que eu vim..."
13020-92 = "Ué, esse brasão..."
13020-93 = "S-Sim.#nEu também sou estudante do Distrito Autônomo de Abydos..."
13020-94 = "E ainda estou no ensino fundamental.#nEmbora eu vá me formar em breve..."
13020-98 = "...E-Ensino fundamental?#nEntendi... Você até parece mais velha do que eu..."
13020-99 = "A-Ahaha..."
13020-100 = "...Lembrei.#nEsse é o brasão da Escola Fundamental Particular Nephthys, não é?"
13020-101 = "A-Ah, i-isso é..."
13020-102 = "...Mas que estranho.#nJá faz um bom tempo que a sede da Nephthys se mudou para fora do distrito autônomo...#nE se não me engano, a escola também ia fechar..."
13020-103 = "..."
13020-104 = "Quando eu me formar... ela vai fechar logo depois."
13020-108 = "...Escola Fundamental Particular Nephthys."
13020-109 = "Uma escola de superelite vinculada à empresa Nephthys."
13020-110 = "Eu tinha ouvido que a herdeira da Nephthys ainda estava por aqui...#n...Entendi."
13020-112 = "..."
13020-113 = "Então era você, Nonomi Izayoi-san?"
13020-117 = "Veio fazer turismo uma última vez?"
13020-118 = "O que a senhorita da famosa empresa corrupta \"Nephthys\" quer na nossa escola?"
13020-119 = "E-Eu..."
13020-120 = "Dependendo da sua resposta..."
13020-121 = "...!!??"
13020-122 = "Não garanto a segurança do seu halo."
13020-123 = "M-Me desculpe, eu..."
13020-124 = "E-Eu..."
13020-135 = "...Será que peguei pesado demais?"
13020-137 = "..."
13020-138 = "Nephthys..."
13020-139 = "[s] \"Falando no Grupo Nephthys...\""
13020-140 = "Foi essa Nephthys que comprou os títulos da nossa dívida, né?#nEspecificamente, qual é o problema nisso?"
13020-141 = "Isso é—"
13020-142 = "A Saint Nephthys Company.#nO chamado Grupo Nephthys..."
13020-144 = "Era uma empresa nativa de Abydos,#nque antigamente competia de igual para igual com as maiores corporações de Kivotos."
13020-145 = "Uma empresa dessas, aqui em Abydos...?!"
13020-146 = "Abydos costumava ser um lugar incrível, sabe."
13020-148 = "Outrora ostentando a história mais longa de Kivotos..."
13020-149 = "Por causa do seu imenso poder, era uma escola temida e até invejada#npor todas as outras academias... Essa era Abydos."
13020-150 = "...Embora isso tenha sido antes da desertificação avançar."
13020-151 = "...A Saint Nephthys Company foi uma empresa que compartilhou essa era de ouro de Abydos."
13020-153 = "Porém, conforme a desertificação avançava,#na Nephthys também entrou em declínio, assim como Abydos."
13020-155 = "Além disso, ao tentar compensar à força os prejuízos da Ferrovia Transdesértica, acabou chegando à beira da falência..."
13020-158 = "As operações precisaram ser interrompidas.#nComo na época era uma grande corporação, isso causou danos irreparáveis a toda Abydos..."
13020-159 = "Assim, um após o outro, os moradores foram deixando Abydos,#ne a Nephthys também encerrou todos os seus negócios e partiu."
13020-161 = "Para tentar reerguer Abydos de alguma forma, o Conselho Estudantil de Abydos acabou contraindo dívidas..."
13020-162 = "...É mais ou menos isso.#nQuando eu estava no 1º ano, já quase não se via nada da Nephthys no distrito autônomo."
13020-164 = "Quer dizer que foi por culpa da Nephthys que o nosso distrito autônomo ficou desse jeito?!"
13020-165 = "Aí já é um pouco de exagero~.#nA Nephthys foi apenas um dos motivos do declínio de Abydos."
13020-166 = "Mas... se não fosse pelo fracasso da Nephthys,#nAbydos ainda teria tido uma chance de se reerguer."
13020-167 = "Quem deu o golpe de misericórdia foi, sem dúvida, a Nephthys."
13020-168 = "A Nephthys é a culpada pelo que aconteceu com Abydos.#nE—"
13020-169 = "—É a empresa administrada pela minha família."
13020-174 = "...Quê?!#nSério mesmo?!"
13020-175 = "..."
13020-176 = "...Sim.#nEu sou do Grupo Nephthys."
13020-177 = "[s] \"Nonomi...\""
13020-181 = "...Então era isso mesmo."
13020-182 = "Como assim \"então era isso mesmo\"... Ayane-chan, você já sabia?"
13020-183 = "Não, eu nunca ouvi diretamente...#nMas o motivo de ela ter um cartão gold, e também..."
13020-185 = "E além disso— aquela ferrovia foi justamente o que acelerou o declínio de Abydos..."
13020-186 = "Se ela puder ser útil para salvar o mundo... nada me deixaria mais feliz."
13020-187 = "..."
13020-189 = "Quando vi a Nonomi-senpai acessando o sistema da Ferrovia Transdesértica,#npensei que provavelmente era isso..."
13020-190 = "Quê?! Eu era a única que não sabia de nada?!#nE a Hoshino-senpai e a Shiroko-senpai?"
13020-195 = "...Shiroko-senpai, você também não sabia, né?"
13020-196 = "S-Sim."
13020-197 = "...Nonomi-senpai, por que você escondeu isso?"
13020-199 = "B-Bem, é que..."
13020-200 = "...Desculpa.#nNão é algo pelo qual eu deva te pressionar assim, né."
13020-201 = "Não..."
13020-202 = "Mas, mesmo com a Nephthys indo embora de Abydos...#nQue bom que você ficou com a gente, senpai."
13020-203 = "..."
13020-205 = "Vamos organizar a situação primeiro!"
13020-206 = "Hoje, a Kaiser Corporation vendeu 45% da dívida de Abydos."
13020-207 = "Na ocasião, novos credores correram para comprar e os títulos dispararam... chegando a impressionantes 4 a 5 vezes o valor original."
13020-208 = "A compradora dos títulos foi— a Saint Nephthys."
13020-209 = "A Kaiser deve ter obtido um lucro gigantesco com essa transação."
13020-210 = "Porém, por que fizeram um negócio desses?#nO motivo nós ainda não sabemos."
13020-211 = "Ayane-chan, você pode verificar os detalhes dos direitos que a Nephthys adquiriu com a compra?"
13020-212 = "Ah, sim...!"
13020-216 = "Com esta transação, a Nephthys obteve...#na propriedade e os direitos de desenvolvimento de instalações específicas e infraestrutura dentro do Distrito Autônomo de Abydos."
13020-217 = "São todos os direitos, exceto a propriedade das terras.#nDe fato, as terras continuam com a Kaiser..."
13020-218 = "O que está incluído nessas \"instalações específicas\"?"
13020-219 = "Diz aqui: infraestrutura de transporte voltada para logística...#ne instalações relacionadas a ela."
13020-220 = "Infraestrutura de transporte? Ainda sobrou alguma coisa disso por aqui?"
13020-225 = "...A \"Ferrovia Transdesértica\"."
13020-226 = "Quê?!"
13020-227 = "Só pode ser isso que se encaixa na descrição."
13020-228 = "M-Mas, Nonomi-senpai.#nAquilo não ficou abandonado no meio da construção...?#nMesmo assim, compraram por um preço tão absurdo...?"
13020-229 = "Além disso, a Nephthys acabou recomprando#num negócio do qual ela mesma havia aberto mão no passado."
13020-230 = "...Qual é o objetivo?"
13020-232 = "...Eu também não sei.#nPor que será..."
13020-233 = "S-Será que...!"
13020-238 = "Encontraram petróleo ou algo assim?!"
13020-243 = "Não, não, de jeito nenhum.#nSe tivesse, Abydos não estaria nesse estado, né."
13020-244 = "Então, detectaram uma quantidade enorme de terras-raras...?#nTipo germânio ou sei lá o quê... era isso?"
13020-245 = "Uhe~, você continua uma fofa como sempre, Serika-chan.#nO velhote aqui já investigou tudo que pudesse render dinheiro."
13020-246 = "Mas não saiu nada. Nem petróleo, nem minerais raros, nadinha de nada.#n...Aliás, germânio não é daqueles baratinhos?"
13020-248 = "E-Esquece isso!#nEntão por que diabos compraram os direitos?"
13020-249 = "Como eu também não sei, o velhote aqui tá quebrando a cabeça~."
13020-254 = "...Inimigos?"
13020-255 = "O-O que foi isso do nada?!"
13020-257 = "São invasores!#nDetectei reações de explosão no distrito autônomo!"
13020-258 = "Não me diga que é a Kaiser Corporation...?!"
13020-259 = "Mas essas explosões, em vez de serem um ataque..."
13020-260 = "Hmm... Será que não é lá na área de escavação?"
13020-261 = "Não, parece que não...! Isso é..."
13020-265 = "..."
13020-266 = "O quê... Tem gente vindo para cá...?#nSão dezenas de pessoas, com uniformes que nunca vi antes!"
13020-267 = "O que está acontecendo?!"
13020-269 = "Identifiquei!#nElas são..."
13020-278 = "Ahahaha! Isso aí, gostei de ver!"
13020-280 = "Próximo;Academia Ferroviária Highlander"
