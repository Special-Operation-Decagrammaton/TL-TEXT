[translation]
13020-1 = "Эпизод 2;Незваные гости"
13020-5 = "*кашель* *кашель* Угх. Пыль в горло лезет."
13020-6 = "Это последняя?"
13020-7 = "Вроде да. И зачем им понадобилось назначать перевозку груза именно сейчас?"
13020-8 = "*кашель* Эти склады сто лет никто не трогал."
13020-9 = "Серьёзно, а для чего вообще это место?"
13020-10 = "Наверное, здесь хранят документы о промышленном сотрудничестве с академиями... Что бы это ни значило. В общем, важные бумаги."
13020-11 = "Эта древность важная? Если бы это было так, она бы не лежала здесь, собирая пыль."
13020-12 = "Да без разницы. Давайте просто закончим. Коробки в том углу помечены на утилизацию."
13020-13 = "Точно? Может, стоит открыть их и перепроверить..."
13020-14 = "Всё будет нормально. У нас мало времени, так что шевелись."
13020-15 = "Раз ты так— Ик?!"
13020-16 = ""
13020-18 = ""
13020-19 = ""
13020-20 = "О-Отойди! Стеллажи сейчас рухнут!"
13020-21 = "Как вообще сломались опоры?! Что ты сделала?"
13020-22 = "Я-Я?! Я даже не прикасалась!"
13020-23 = ""
13020-26 = ""
13020-27 = "Фух. Чуть не задело."
13020-28 = "Как металлический стеллаж мог просто взять и сломаться?"
13020-29 = "Лучше скажи, как мы теперь всё это убирать будем?"
13020-30 = "А? Что это?"
13020-31 = ""
13020-33 = ""
13020-34 = "Ух. Не могу поверить... На что ты там смотришь?"
13020-35 = "Не знаю. Какой-то документ выпал из одной коробки."
13020-36 = "Какой-то договор купли-продажи? Из старшей школы Абидоса?"
13020-37 = "А?"
13020-42 = ""
13020-43 = ""
13020-45 = ""
13020-46 = ""
13020-49 = ""
13020-50 = ""
13020-52 = ""
13020-53 = "Это здесь?"
13020-54 = ""
13020-56 = ""
13020-59 = "Тот студент, должно быть... вице-президент..."
13020-60 = "..."
13020-61 = "Она всё ещё держится совсем одна. Но... почему...?"
13020-62 = "А?"
13020-63 = ""
13020-69 = "Хм. Мне показалось, там кто-то был."
13020-70 = "..."
13020-71 = "Наверное, показалось..."
13020-73 = "*вздыхает*"
13020-74 = "Ч-Чуть не попалась."
13020-75 = "Я слышала, она талант поколения и всё такое, но как она меня заметила?!"
13020-76 = "Талант поколения? Что ещё ты слышала?"
13020-78 = "Я слышала, что Хошино—"
13020-79 = ""
13020-82 = "?!"
13020-84 = "Ого. Ты даже моё имя знаешь?"
13020-85 = ""
13020-86 = "Н-Насчёт этого! Понимаешь...!"
13020-87 = "Ты меня знаешь, а я тебя нет. Что тебе здесь нужно?"
13020-88 = "Я-я..."
13020-89 = "Ничего? Ты шпионка? Кто тебя послал? Назови свою принадлежность и год обучения."
13020-90 = "Наверняка ты слышала слухи. Может, ты и старше меня, но поблажек не жди."
13020-91 = "...Я? Н-Нет, я не—"
13020-92 = "Стой. Я знаю эту школьную эмблему."
13020-93 = "Д-Да! Я тоже из района Абидоса..."
13020-94 = "И вообще-то я младше тебя... В этом году заканчиваю среднюю школу."
13020-95 = ""
13020-97 = ""
13020-98 = "Ты? Студент средней школы? Выглядишь намного старше меня."
13020-99 = "Ага... ха-ха..."
13020-100 = "А, точно. Вспомнила, где её видела. Частная средняя школа Нефтис?"
13020-101 = "Д-Да! Это я...!"
13020-102 = "Но это мало что объясняет. Главный офис Нефтис давно покинул район, вместе со всеми связанными школами."
13020-103 = "..."
13020-104 = "После моего выпуска нашу школу закроют. Я буду последним выпуском..."
13020-105 = ""
13020-107 = ""
13020-108 = "...Частная средняя школа Нефтис."
13020-109 = "Элитная частная школа, принадлежащая Нефтис Group и управляемая ею."
13020-110 = "Теперь понятно. Я слышала, что наследнице Нефтис Group примерно столько же лет, сколько студенту средней школы."
13020-112 = "..."
13020-113 = "Так почему ты до сих пор не покинула район, Изаёй Нономи?"
13020-114 = ""
13020-116 = ""
13020-117 = "Решила в последний раз прогуляться перед отъездом? Впрочем, неважно."
13020-118 = "Но что драгоценной дочке печально известной Нефтис Group понадобилось от меня? Или вы пришли за школой?"
13020-119 = "Я-я..."
13020-120 = "Если Нефтис решила добраться до этой школы..."
13020-121 = "...?!"
13020-122 = "...их маленькая наследница узнает, насколько легко может разбиться нимб."
13020-123 = "П-Прости... Я..."
13020-124 = "Я...!"
13020-125 = ""
13020-133 = ""
13020-134 = ""
13020-135 = "...Я немного перегнула."
13020-136 = ""
13020-137 = "..."
13020-138 = "Нефтис..."
13020-139 = "[s] «Нефтис Group...»"
13020-140 = "Можешь уже объяснить, Аяне? Что это за Нефтис скупает наши облигации?!"
13020-141 = "Это... Ну..."
13020-142 = "Saint Нефтис Company, или Нефтис Group..."
13020-144 = "Это компания, которая появилась в Абидосе и невероятно быстро выросла. В своё время она была одной из самых успешных компаний во всём Кивотосе."
13020-145 = "Во всём Кивотосе? Из Абидоса?!"
13020-146 = "М-м. Ты недооцениваешь, насколько влиятельным Абидос был раньше."
13020-147 = ""
13020-148 = "Она права. Абидос был... лучшим из лучших."
13020-149 = "Когда-то с нами приходилось считаться. Академия с богатой историей, сильнейшими учениками и лучшим образованием. Когда-то..."
13020-150 = "Ну а потом начались песчаные бури, дальше вы и сами знаете!"
13020-151 = "И в тот золотой век Saint Нефтис Company процветала вместе со старшей школой Абидоса."
13020-153 = "Но песок... всё не прекращался. Опустынивание района высасывало из нас все силы, и Нефтис рухнула вместе с Абидосом."
13020-155 = "Транспустынная железная дорога была отчаянной попыткой привлечь в район больше торговли... но было уже поздно. Этот проект едва не обанкротил их."
13020-158 = "Бизнес практически остановился, а Нефтис распылила средства, пытаясь всё исправить. Итогом стал экономический крах, после которого Абидос... уже просто не смог оправиться."
13020-159 = "Студсовет Абидоса изо всех сил пытался смягчить последствия, но и ученики, и жители начали массово покидать район."
13020-161 = "А после всего этого... Нефтис решила прекратить убытки. Компания продала все свои активы и оставила Абидос позади."
13020-162 = "Вот такие дела! К тому времени, когда я поступила на первый курс, Нефтис уже была лишь дурным воспоминанием."
13020-164 = "То есть наш район оказался полностью угроблен из-за жадности Нефтис?!"
13020-165 = "Полегче, Сэрика. Она была лишь одним звеном в длинной цепочке бедствий."
13020-166 = "Всё нормально, Хошино. Она совершенно права. Нефтис пошла на опасный риск, а расплачиваться пришлось Абидосу."
13020-167 = "Нефтис стала последним гвоздём в крышке гроба Абидоса."
13020-168 = "Она была главным фактором падения Абидоса. Антагонистом этой истории."
13020-169 = "А мою семью основала именно она."
13020-170 = ""
13020-173 = ""
13020-174 = "Ч-Ч-Что?!"
13020-175 = "..."
13020-176 = "Да... Я наследница Saint Нефтис Group."
13020-177 = "[s] «Нономи...»"
13020-178 = ""
13020-180 = ""
13020-181 = "...Я вроде как знала."
13020-182 = "Т-Ты знала, Аяне?! И всё это время мне не говорила?"
13020-183 = "Нет-нет. Я лишь догадалась по косвенным признакам. Первой подсказкой была её золотая карта. А потом..."
13020-184 = ""
13020-185 = "Транспустынная железная дорога была тем проектом, который ускорил падение Абидоса..."
13020-186 = "Если мы сможем использовать её, чтобы спасти мир... Для меня не было бы большей радости. ♧"
13020-187 = "..."
13020-188 = ""
13020-189 = "А когда Нономи смогла получить доступ к системе железной дороги, это окончательно подтвердило мои догадки."
13020-190 = "Т-То есть только я одна не знала?! А Хошино и Широко?"
13020-191 = ""
13020-194 = ""
13020-195 = "А, ладно. Хорошо. Широко тоже не знала."
13020-196 = "Э-Эм."
13020-197 = "Но ПОЧЕМУ ты всё это время скрывала это?"
13020-199 = "Н-Ну, я... Эм..."
13020-200 = "Ай! Прости, это было ужасно бестактно с моей стороны. Наверное, не так-то просто вот так взять и заговорить об этом."
13020-201 = "Не переживай, Сэрика."
13020-202 = "И в конце концов ты осталась! У тебя были все причины уйти вместе с Нефтис, но ты всё это время оставалась здесь."
13020-203 = "..."
13020-205 = "Раз с этим разобрались, изложу факты."
13020-206 = "Сегодня Корпорация Кайзер продала на чёрном рынке 45% облигаций Абидоса."
13020-207 = "Кайзер, скорее всего, получила с этих продаж огромную прибыль... а у нас теперь резко выросло число кредиторов."
13020-208 = "Я подтвердила, что Saint Нефтис скупила все производные облигации, ранее выпущенные под залог промышленных объектов Абидоса."
13020-209 = "Причём по цене в четыре-пять раз выше первоначальной..."
13020-210 = "И возникает вопрос — зачем... Придётся разобраться."
13020-211 = "Можешь посмотреть, какие залоговые права прилагались к производным облигациям, купленным Нефтис?"
13020-212 = "Да! Сейчас посмотрю..."
13020-213 = ""
13020-215 = ""
13020-216 = "В залог, похоже, входят: права на застройку, собственность на отдельные объекты и инфраструктуру, а также все сопутствующие сооружения."
13020-217 = "По сути всё, кроме недвижимости. Ожидаемо. Кайзер так просто от неё не откажется."
13020-218 = "Ты знаешь, какие именно объекты туда вошли?"
13020-219 = "Где-то видела... Вот! Транспортная инфраструктура и связанные с ней объекты..."
13020-220 = "С каких пор у нас вообще осталось что-то транспортное?"
13020-221 = ""
13020-224 = ""
13020-225 = "...Транс-пустынная железная дорога."
13020-226 = "Что?!"
13020-227 = "Больше ничего в районе под это описание не подходит."
13020-228 = "Н-Но это же бессмыслица! Зачем им покупать проект, который они сами бросили гнить в пустыне? Да ещё в пять раз дороже, чем продали?"
13020-229 = "С точки зрения бизнеса это нелогично. Должен быть мотив, которого мы не видим..."
13020-230 = "Чего они вообще пытаются добиться?"
13020-232 = "...Непонятно. Я не вижу ни одного разумного объяснения."
13020-233 = "П-Погодите! А если...?"
13020-234 = ""
13020-236 = ""
13020-238 = "Что если глубоко под стройплощадкой нашли нефтяное месторождение?"
13020-239 = ""
13020-242 = ""
13020-243 = "Никаких шансов, Сэрика. Будь это хоть немного возможно, Абидос сейчас не был бы городом-призраком."
13020-244 = "Л-Ладно. А если там какой-нибудь суперредкий камень? Или элемент? Может, нашли германий!"
13020-245 = "Ты такая же забавная, как и милая, Сэрика. Обещаю, из этой пустыни уже выжали последнюю каплю хоть какой-то ценности."
13020-246 = "И нельзя сказать, что никто не пытался. Просто находить было нечего. Ни нефти, ни суперредких камней, ни германия... Стоп, Сэрика, германий вообще не настолько ценен."
13020-248 = "Н-Ну, никто другой всё равно не придумал объяснения!"
13020-249 = "Это и правда загадка..."
13020-250 = ""
13020-253 = ""
13020-254 = "Аварийная тревога?"
13020-255 = "Ч-Что случилось?!"
13020-257 = "В районе прогремели взрывы! Нарушители!"
13020-258 = "Кайзер?! Это Кайзер?"
13020-259 = "П-Похоже, нет! Они не целятся в здания и вообще не устраивают заметных разрушений."
13020-260 = "Может, контролируемые подрывы? Это рядом с местом раскопок?"
13020-261 = "Похоже, нет... Подождите! Секунду..."
13020-262 = ""
13020-264 = ""
13020-265 = "..."
13020-266 = "Нашла!#nУченицы другой академии?! Я раньше не видела такую форму... и их десятки!"
13020-267 = "Что?!"
13020-269 = "Похоже, они..."
13020-272 = ""
13020-273 = ""
13020-276 = ""
13020-278 = "Пахяхяхя! Вот это кайф!"
13020-280 = "Следующий эпизод;Железнодорожная академия Хайлендер"
