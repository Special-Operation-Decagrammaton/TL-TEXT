[translation]
1601503-1 = "Sugar Rush"
1601503-2 = "Я пришёл в комнату группы и помог Айри с практикой на клавишных. Проблему удалось исправить довольно быстро."
1601503-3 = "Настоящая проблема началась после репетиции, когда мы возвращались..."
1601503-5 = "Какой неожиданный ливень..."
1601503-6 = "Я совсем этого не ожидала. И уж точно не ожидала, что мы застрянем под навесом этого здания..."
1601503-7 = "Ни у кого из нас нет зонта, и поблизости я не вижу ни одного магазина."
1601503-8 = "...Угх. Мне правда ужасно жаль. Если бы не я, вы бы не застряли под дождём."
1601503-9 = "[s1] «Не глупи. Не ты же вызвала дождь.»\n[s2] «Такое иногда случается.»"
1601503-12 = "Наверное... И всё же я ценю ваш позитивный настрой в таких ситуациях."
1601503-13 = "Но всё равно немного обидно. Если бы мы пробежали ещё совсем чуть-чуть, уже были бы у клубной комнаты."
1601503-14 = ""
1601503-16 = ""
1601503-17 = "...Пробежали...?"
1601503-18 = "Эм... Может, получится...?"
1601503-19 = "[s3] «Пробежали»? Что ты задумала?!\n[s4] «Ты ведь не собираешься бежать под таким ливнем...»"
1601503-22 = "Не говорите глупостей! Мы не побежим совсем без укрытия. Просто нужно импровизировать с зонтом..."
1601503-23 = "А у нас..."
1601503-24 = ""
1601503-26 = ""
1601503-27 = "...как раз есть вот это!"
1601503-28 = "[s5] «А-Айри?! Но это же...!»\n[s6] «Это твоя куртка!»"
1601503-31 = "Хи-хи. Она на мне ужасно большая! Очень просторная."
1601503-32 = "Настолько просторная, что мы оба сможем бежать под ней! Умная импровизация, правда, Сенсей? Как вам?"
1601503-33 = "...Что?"
1601503-34 = "Вы хотите переждать? Но... почему?"
1601503-35 = "...Думаете, не стоит так использовать мою куртку? А я совсем не против."
1601503-36 = "...А. Наверное, это и правда немного слишком, да? Я опять увлеклась."
1601503-37 = "Хм..."
1601503-38 = "А мне казалось, это будет весело... Жалко упускать такую возможность. Хи-хи..."
1601503-39 = ""
1601503-42 = "[ns7] «...Тогда побежали!»\n[ns8] «Только в этот раз!»"
1601503-45 = "*ахает*"
1601503-46 = ""
1601503-48 = ""
1601503-49 = "Хорошо!"
1601503-52 = "― [log=아이리 밴드]Хи-хи... Ну же, Сенсей! [/log][wa:4250]"
1601503-53 = "― [log=아이리 밴드]Идите сюда! Не стесняйтесь![/log][wa:2160]"
1601503-56 = "― [log=아이리 밴드]...? Сенсей...?[/log][wa:1900]"
1601503-57 = "― [log=아이리 밴드]Что такое?[/log][wa:1900]"
1601503-60 = "― [log=아이리 밴드]Я... [/log][wa:1930]"
1601503-61 = "― [log=아이리 밴드]Я заставила вас чувствовать себя неловко?[/log][wa:2600]"
1601503-64 = "― [log=아이리 밴드]Хмпф! Но я ведь так старалась...[/log][wa:3815]"
1601503-67 = "― [log=아이리 밴드]Я понимаю, что опять упрямлюсь, но...[/log]"
1601503-68 = "― [log=아이리 밴드]Не могли бы вы немного мне подыграть?[/log][wa:6080]"
1601503-71 = "[ns9] «Когда ты так говоришь...»\n[ns10] «Не могу же я дать всем твоим усилиям пропасть зря.»"
1601503-72 = "― [log=아이리 밴드]...Хи-хи-хи.[/log][wa:1150]"
1601503-73 = "― [log=아이리 밴드]...Хи-хи-хи.[/log][wa:1150]"
1601503-74 = "― [log=아이리 밴드]Хорошо! Ура![/log][wa:1990]"
1601503-77 = "― [log=아이리 밴드](...Надо поблагодарить облака за сегодняшний дождь.)[/log][wa:1650]"
1601503-80 = "― [log=아이리 밴드]По моей команде выбегаем вместе![/log][wa:1140]"
1601503-81 = "― [log=아이리 밴드]Готовы?[/log][wa:1820]"
1601503-84 = "― [log=아이리 밴드]Вперёд![/log][wa:1800]"
1601503-87 = "Приготовились...!!"
1601503-88 = "Один...!"
1601503-89 = "Два...!"
1601503-90 = "...Три!"
1601503-91 = ""
1601503-97 = "...Мы столкнулись и вместе покатились по улице."
