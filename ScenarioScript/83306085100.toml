[translation]
83306085100-5 = ""
83306085100-6 = "Сорасаки Хина. Прекрати вмешиваться."
83306085100-7 = "В чём дело?"
83306085100-8 = "«В чём дело»? Ты вообще представляешь, какая трагедия прямо сейчас разворачивается в палатке Общества Пандемониума?"
83306085100-9 = "...*вздох*"
83306085100-10 = "И ты ещё смеешь показывать раздражение, хотя пренебрегаешь обязанностями главы Префектурной команды!"
83306085100-11 = "В нашем временном убежище критическая ситуация! Ты должна раскрыть Дело о пропавшем пудинге!"
83306085100-12 = "Пропавшем... пудинге?"
83306085100-13 = "Легендарное дело о пропавшем пудинге: скандал в Геенне! Живо за работу!"
83306085100-14 = "...Понятно. И это ещё легендарное дело о нелепых переименованиях..."
83306085100-15 = "Какая-то злая сила помешала пудингу, который Общество Пандемониума собиралось съесть на десерт, добраться до нас!"
83306085100-16 = "Уверена, это диверсант... злодей, который решил ударить по Обществу Пандемониума в момент нашей слабости, надеясь, что грусть от потерянного пудинга поглотит нас..."
83306085100-17 = "Я знаю, конечная цель этого мерзавца — довести до слёз отчаяния Ибуки, которая обожает пудинг!"
83306085100-18 = "Пора Префектурной команде хоть раз выполнить свой долг! Предотвращать такие ужасающие преступления — ваша обязанность!"
83306085100-19 = "...Я с радостью расследую настоящий проступок."
83306085100-20 = "Но ладно. Осмотрю... место преступления."
