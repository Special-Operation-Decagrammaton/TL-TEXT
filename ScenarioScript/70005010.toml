[translation]
70005010-1 = "Запись от 18 февраля"
70005010-3 = "[log]18 февраля[/log]"
70005010-6 = "Клубная комната Префектурной команды Геенна"
70005010-7 = "Ты абсолютно уверена, что заказала торт?!"
70005010-8 = "Его нужно заказать до конца сегодняшнего дня, если хотим получить завтра!"
70005010-10 = "Не переживай, Ако. Мы перепроверили раз десять."
70005010-12 = "...Бюджет получился почти впритык, но мы справились."
70005010-14 = "Простите. Что вы только что сказали?"
70005010-15 = "Что значит «почти впритык», Чинацу? Нашего бюджета должно было хватить с запасом!"
70005010-16 = "Я специально урезала часть бюджета на закуски в прошлом месяце, чтобы мы могли позволить себе торт на день рождения главного префекта Хины в этом месяце!"
70005010-17 = ""
70005010-18 = "Так вот почему закусок стало меньше..."
70005010-19 = "Э-Это неважно! Объясни, почему нам не хватало денег?!"
70005010-20 = "Ну, Общество Пандемониума—"
70005010-21 = "Опять эти еноты?! Я сейчас правда..."
70005010-22 = "Они выставили нам счёт за подарок на день рождения главного префекта Хины... который купили сами..."
70005010-23 = "...Общество Пандемониума празднует день рождения главного префекта? Председателя Макото сняли с должности?!"
70005010-24 = "Не совсем... Они пытались отправить нам «гурманский» пирог с красной фасолью, но без красной фасоли. Это и был подарок."
70005010-25 = "Что это вообще такое? Они нас разыгрывали? И главное, такое вообще существует?"
70005010-27 = "По-видимому, это был индивидуальный заказ."
70005010-28 = "Почему бы им не направить столько усилий на управление академией...?"
70005010-29 = "В общем, пекарня решила, что в заказе ошибка, и в итоге отправила обычный гурманский пирог с красной фасолью, с фасолью..."
70005010-30 = "Замечательно. Просто замечательно..."
70005010-31 = "Стоп. С фасолью или без, эти еноты всё равно выставили счёт НАМ!"
70005010-32 = "Что и возвращает нас к исходной проблеме..."
70005010-34 = "Именно поэтому бюджет оказался немного стеснён."
70005010-35 = "Торт мы заказали без проблем, но пришлось выбрать самый дешёвый вариант доставки."
70005010-36 = "Хм..."
70005010-37 = "Полагаю, приемлемо. Всё равно хорошо экономить там, где можно."
70005010-38 = "Покажи, пожалуйста, страницу с информацией о доставке."
70005010-39 = "Хорошо, вот."
70005010-40 = "Понятно. Согласно этому, завтра утром торт доставят на станцию Каваниси, а примерно к полудню он прибудет в клубную комнату Префектурной команды."
70005010-41 = "Поскольку праздник в честь дня рождения главного префекта начинается в 16:00, всё идеально."
70005010-42 = "Хорошо. Отличная работа, все. Я уже жду."
70005010-43 = "Да-да. Я тоже."
70005010-44 = "Ты в порядке, Чинацу? Что-то не так?"
70005010-45 = "Нет-нет. Совсем нет, старший администратор Ако."
70005010-46 = ""
70005010-48 = ""
70005010-50 = "(Обычно, когда всё идёт настолько гладко, обязательно что-нибудь случается.)"
70005010-51 = "(Нет, уверена, всё нормально. Наверное, прошлый опыт заставляет меня слишком много думать.)"
70005010-52 = "(Что бы ни случилось, завтра день рождения нашей трудолюбивой главного префекта.)"
70005010-54 = "Гостевая комната Генрюмон"
70005010-55 = "Именно! Нам вообще не понадобилась помощь Променада Чёрной Черепахи! Мы купили торт на день рождения госпожи в роскошной кондитерской!"
70005010-56 = "Ну как? Потрясающе, да? Значит, мы можем справляться с задачами, связанными с едой, без ваших непрошеных советов!"
70005010-57 = "Фуфуфу... Можно даже сказать, это явное доказательство прогресса Генрюмон! Мы постоянно совершенствуемся!"
70005010-58 = "Да-да. Похоже, кондитерскую вы действительно выбрали хорошую, но какую службу доставки взяли?"
70005010-59 = "Службу доставки? Самую дешёвую и быструю, естественно."
70005010-60 = "...Дешёвой и быстрой доставки не бывает. По крайней мере без какого-нибудь подвоха."
70005010-61 = "Но в рекламе было написано именно так: «Дешёвая и быстрая доставка!»"
70005010-62 = "...Ты веришь каждой листовке, которую видишь?"
70005010-63 = "Да! Они бы не писали такое, если бы по-настоящему не были уверены в своих силах."
70005010-64 = "*вздох*... Ты идеальная целевая аудитория для капиталистических желаний. Дай посмотреть."
70005010-65 = ""
70005010-67 = ""
70005010-68 = ""
70005010-69 = ""
70005010-70 = ""
70005010-72 = "...? Почему именно туда?!"
70005010-73 = "А? Хм? О чём ты? Что не так?"
70005010-75 = "...Для Генрюмон это будет хороший урок. Если всё получится, эта служба доставки и правда окажется самой дешёвой и быстрой."
70005010-76 = "О, какое облегчение! Значит, моя крутая проницательность всё-таки не ошиблась!"
70005010-77 = "Слушай внимательно. Я сказала: «Если всё получится»."
70005010-78 = "...И что именно ты имеешь в виду?"
70005010-79 = ""
70005010-81 = ""
70005010-82 = "Дёшево и быстро будет, пока ваша посылка не потеряется в распределительном центре Каваниси."
70005010-83 = "Распределительном центре Каваниси?"
70005010-84 = "Да. Это станция с выдающимся объёмом распределения даже по меркам Кивотос."
70005010-85 = "Говорят, там есть скрытая дорога, ведущая к Стиксу."
70005010-86 = "И когда посылки проходят по этой дороге в загробный мир и возвращаются, к твоей двери приезжает уже что-то совершенно другое."
70005010-87 = "Ч-Что ты такое говоришь...?"
70005010-88 = "Там постоянно путают доставки. Эта посылка становится той, а та — этой."
70005010-89 = "Р-Разве такую компанию не должны закрыть?!"
70005010-90 = "Ты сама сказала. Дёшево и быстро."
70005010-91 = "...Другими словами, может быть дёшево и быстро, но..."
70005010-92 = "...!"
70005010-93 = "G-Генрюмон, общий сбор!!"
70005010-94 = "Успокойся... И что это даст? Будете следить за каждой посылкой, прибывающей на станцию?"
70005010-95 = ""
70005010-97 = ""
70005010-98 = "А можно?!"
70005010-99 = "Я говорю, НЕ НАДО!!"
