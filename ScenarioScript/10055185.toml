[translation]
10055185-2 = "Ки-хе-хе-хе! Смотрите! Восстание аутсайдера!"
10055185-3 = "...Нет, ПАДЕНИЕ аутсайдера! ...Ты ведь и была аутсайдером."
10055185-4 = "Выбери уже что-нибудь одно."
10055185-5 = "*ах* Что... Что происходит? Что сейчас было?"
10055185-6 = "Ты снова в норме, Наги?"
10055185-7 = "Вернулась. Если только ТО не было её настоящим лицом, а это всё маска..."
10055185-8 = "Эм... Мне уже можно уйти?"
10055185-9 = "Ки-хе-хе! Даже ненавистная Чайная вечеринка нас не остановила!"
10055185-10 = "В Кивотосе никто не сравнится с Обществом Пандемониума. Никто не сравнится со МНОЙ! Ки-хе-хе!"
10055185-11 = "Ужасно самодовольная."
10055185-12 = "И всё из-за пары побед в крабовых боях..."
10055185-13 = "У нас уже четыре звезды!"
10055185-14 = "Спасибо, что считаешь, Ибуки."
10055185-15 = "...Хм. Но если ты права насчёт этой закономерности... разве Тринити не должна была стать последним соперником?"
10055185-16 = "К чему ты клонишь?"
10055185-17 = "Для победы во «Всемирном турнире боевых искусств крабов-отшельников» нужно ПЯТЬ звёзд, помнишь?"
10055185-18 = "Ты даже правила запомнила?"
10055185-19 = "Но кто ещё может появиться после Тринити...?"
10055185-20 = ""
10055185-21 = ""
10055185-22 = "..."
