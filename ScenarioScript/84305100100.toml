[translation]
84305100100-5 = ""
84305100100-6 = "Так что конкретно мне нужно сделать?"
84305100100-7 = "Да, вот в чём вопрос..."
84305100100-8 = "Ты сказала, что попасть туда без твоих биометрических данных гораздо сложнее."
84305100100-9 = "Так что это за более сложный способ?"
84305100100-10 = "Попасть внутрь без проверки? ...Есть только один способ."
84305100100-11 = "И в одиночку ты не справишься. Я всё рассчитала — понадобятся два человека."
84305100100-12 = "Ну, кроме тебя нас как раз двое."
84305100100-13 = "Честно говоря, даже если забыть про биометрию, будь мне нужно выбрать одну из вас в напарницы для этой операции, я бы выбрала её."
84305100100-14 = "У неё талант к проникновению."
84305100100-15 = "Она тебе прямо понравилась, да?"
84305100100-16 = "...Не особенно. Просто у неё немного больше практического опыта скрытного передвижения, чем у тебя."
84305100100-18 = "Опыта? Но я ведь не занималась скрытными операциями."
84305100100-19 = "Нет, занималась, просто другого рода. Да и когда мы впервые встретились, ты как раз кралась."
84305100100-20 = "Но нужно помнить о рисках."
84305100100-21 = "Она не студент Миллениум. Она из Тринити, да ещё и из Чаепития."
84305100100-22 = "Если что-то пойдёт не так, у Миллениум будут невообразимые проблемы."
84305100100-23 = "Да ну. Куда рискованнее будет тащить туда тебя с твоими двумя левыми ногами."
84305100100-24 = "К тому же неприятности, о которых ты говоришь, — абсолютный худший сценарий. Нельзя принимать решения, исходя только из него."
84305100100-25 = "Разве мы не делаем всё это как раз затем, чтобы ЭТОГО не произошло?"
84305100100-26 = "Правда? Я что, ошибаюсь? В чём проблема?"
84305100100-27 = "Ну..."
84305100100-29 = "..."
84305100100-30 = "...Хорошо, ладно."
84305100100-31 = "Вот так просто? Не думала, что ты так быстро согласишься."
84305100100-32 = "Ты стала чаще прислушиваться."
84305100100-33 = "А, точно. Сэя."
84305100100-34 = "Хм? Да?"
84305100100-35 = "Я не против взять тебя с собой, но не заблуждайся: я буду твоей напарницей, а не нянькой. Жду, что ты сделаешь свою часть."
84305100100-36 = "Ты и я — либо делаем это вместе, либо никак."
84305100100-37 = "..."
84305100100-38 = "...Фуфу."
84305100100-39 = "Справедливо, но могут быть вещи, с которыми мне придётся попросить тебя справиться вместо меня."
84305100100-40 = "Заранее прошу прощения, но уверена, ты справишься."
84305100100-41 = "Ага, просто сразу говори. И не пытайся брать на себя лишнее."
84305100100-43 = "..."
84305100100-44 = "...Тогда я составлю план."
