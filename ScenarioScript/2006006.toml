[translation]
2006006-1 = "Вместе с Ибуки"
2006006-2 = "Пляж"
2006006-3 = "Я отправился на пляж, чтобы встретиться с Ибуки."
2006006-4 = "Но, когда я пришёл..."
2006006-5 = ""
2006006-7 = ""
2006006-8 = "Хм..."
2006006-9 = "А, вот ещё один!"
2006006-10 = ""
2006006-12 = ""
2006006-13 = ""
2006006-14 = "Хи-хи, уже пять..."
2006006-16 = "Ибуки была занята тем, что копалась в песке и что-то из него выбирала."
2006006-17 = ""
2006006-18 = "[ns] «Ибуки?»"
2006006-19 = "А, Сенсей!"
2006006-20 = "[s] «Чем ты занимаешься?»"
2006006-21 = "О, Ибуки ищет материалы для рисунка!"
2006006-22 = ""
2006006-24 = ""
2006006-25 = ""
2006006-26 = "Смотрите!"
2006006-27 = ""
2006006-28 = "Ибуки показала мне..."
2006006-29 = "...разноцветные обломки ракушек и округлые стекляшки."
2006006-30 = "Волны отполировали их до гладкости."
2006006-31 = "Красивые, правда, Сенсей?"
2006006-32 = "[s1] «Совсем как драгоценные камни...!»\n[s2] «Но как ты будешь ими рисовать?»"
2006006-35 = "А, насчёт этого..."
2006006-36 = "Ибуки приклеит их к бумаге и сделает картину! Настоящее... искусство!"
2006006-37 = "Ведь для цвета не обязательно нужны карандаши или краски!"
2006006-38 = "Только вот найти кусочки нужного оттенка сложно..."
2006006-39 = "Поэтому Ибуки с рассвета копается в песке!"
2006006-40 = ""
2006006-42 = ""
2006006-43 = ""
2006006-44 = "[ns3] «Тогда позволишь помочь?»\n[ns4] «Госпожа художница Ибуки?»"
2006006-47 = "Художница...!"
2006006-48 = "Да, да! Спасибо, Сенсей!"
2006006-49 = "[s] «Тогда подождёшь меня здесь минутку?»"
2006006-50 = "А?"
2006006-51 = "А, у вас есть «кое-что полезное»?"
2006006-52 = "Хорошо! Тогда Ибуки терпеливо подождёт!"
2006006-54 = "Я заглянул в ближайший магазин и вернулся к Ибуки."
2006006-55 = ""
2006006-56 = "А, Сенсей! Вы вернулись!"
2006006-57 = "М? А что это у вас в руках...?"
2006006-58 = "Грабли...?"
2006006-59 = "[s] «Ага, садовые»."
2006006-60 = "Но что вы собираетесь...?"
2006006-61 = "Ах!"
2006006-62 = "Сенсей! Ибуки, кажется, поняла!"
2006006-63 = "Если провести граблями по песку, песок просыплется между зубьями..."
2006006-64 = "А большие ракушки и стекляшки останутся!"
2006006-65 = "[s] «Я знал, что ты догадаешься! Какая же ты умница, Ибуки!»"
2006006-66 = "Хи-хи, спасибо, Сенсей!"
2006006-68 = "Я протянул Ибуки грабли."
2006006-69 = ""
2006006-70 = "Теперь будет намного проще находить материалы для рисунка!"
2006006-71 = ""
2006006-73 = ""
2006006-74 = ""
2006006-75 = "Так, начнём вот здесь..."
2006006-76 = ""
2006006-78 = ""
2006006-79 = ""
2006006-80 = "...А?"
2006006-81 = "[s] «А...!»"
2006006-83 = "Грабли Ибуки действительно собирали ракушки и стекляшки..."
2006006-84 = "...Но куда лучше они вытаскивали из песка мусор."
2006006-85 = ""
2006006-86 = "[ns] «Эм, Ибуки...»"
2006006-87 = "Теперь мы можем убраться на пляже!"
2006006-88 = "[s] «М-м...?»"
2006006-89 = "Можно одновременно собирать материалы и убирать мусор, правда?"
2006006-90 = "Ибуки постарается изо всех сил!"
2006006-91 = "[s5] «А, как же ярко...!»\n[s6] «Ой, мне что-то в глаз попало...!»"
2006006-94 = "М? Сенсей, вы плачете?"
2006006-95 = "И-Ибуки что-то не так сделала?"
2006006-96 = "Н-нет...? Вы уверены?"
2006006-97 = "Вы просто... «растрогались»? Почему...?"
2006006-99 = "Я принёс мусорные мешки, и мы с Ибуки принялись выкапывать мусор."
2006006-100 = "В итоге набралось целых пять мешков мусора..."
2006006-101 = "И горстка... прекрасных сверкающих осколков."
