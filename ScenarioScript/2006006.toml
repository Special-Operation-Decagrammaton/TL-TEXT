[translation]
2006006-1 = "With Ibuki."
2006006-2 = "Beach"
2006006-3 = "(As I head toward the beach...)"
2006006-4 = "(Ibuki is doing something...)"
2006006-8 = "Heave-ho..."
2006006-9 = "Oh! There's one over there too!"
2006006-14 = "Hehehe, that makes five!"
2006006-16 = "(Ibuki was busily picking something up.)"
2006006-18 = "[ns] \"Ibuki?\""
2006006-19 = "Oh, Sensei!"
2006006-20 = "[s] \"What are you doing?\""
2006006-21 = "I'm looking for things to use in my art!"
2006006-26 = "Like this!"
2006006-28 = "(In the palm of the hand Ibuki held out...)"
2006006-29 = "(Worn down by the waves over many years, rounded and beautiful—)"
2006006-30 = "(...were colorful seashells and glass shards.)"
2006006-31 = "What do you think? Pretty, right?"
2006006-32 = "[s1] \"They look like jewels!\"\n[s2] \"But how are you going to use them for art?\""
2006006-35 = "Well, you see..."
2006006-36 = "I'm going to stick a whole bunch of these onto paper!"
2006006-37 = "Art isn't just about using crayons or paint, you know!"
2006006-38 = "But... I'm having a hard time finding the colors I'm looking for..."
2006006-39 = "That's why I woke up early to look for them!"
2006006-44 = "[ns3] \"I see... In that case, let me help you!\"\n[ns4] \"Master Ibuki!\""
2006006-47 = "Ma-master...!"
2006006-48 = "Hehehe, I'm counting on you, Sensei!"
2006006-49 = "[s] \"Alright, wait here for a second.\""
2006006-50 = "Huh? Wait? Why?"
2006006-51 = "Sensei, do you know a good trick...?"
2006006-52 = "Got it! I'll wait!"
2006006-54 = "(I went to a nearby shop and bought 'something'.)"
2006006-56 = "Welcome back!"
2006006-57 = "Oh, what are you holding, Sensei?"
2006006-58 = "Is that... a fork?"
2006006-59 = "[s] \"It's a rake.\""
2006006-60 = "A rake...?"
2006006-61 = "Oh!"
2006006-62 = "Ibuki thinks she gets it!"
2006006-63 = "If I rake the sand with this—"
2006006-64 = "It means I can just pick up the shells and shards!"
2006006-65 = "[s] \"Exactly! You're so smart, Ibuki!\""
2006006-66 = "Hehehe, you praised me. #nThank you, Sensei!"
2006006-68 = "(I handed the rake to Ibuki.)"
2006006-70 = "With this, I'll be able to find so many!"
2006006-75 = "Okay, starting from here..."
2006006-80 = "...Huh?"
2006006-81 = "[s] \"Oh no...!\""
2006006-83 = "(The rake wasn't holding shells or glass shards...)"
2006006-84 = "(It was full of trash.)"
2006006-86 = "[ns] \"Um... Ibuki...\""
2006006-87 = "Amazing! With this, we can clean the beach at the same time!"
2006006-88 = "[s] \"Huh...?\""
2006006-89 = "We can get the shells and glass shards, and clean the ocean too! #nIsn't that what they call killing two birds with one stone?"
2006006-90 = "Alright! Ibuki will do her best!"
2006006-91 = "[s5] \"Guh...!\"\n[s6] \"So dazzling...!\""
2006006-94 = "Sensei? Are you crying?"
2006006-95 = "D-did Ibuki say something weird...?"
2006006-96 = "No...?"
2006006-97 = "You were just moved...? Why?"
2006006-99 = "(After that, I brought over some plastic bags and helped Ibuki collect the trash.)"
2006006-100 = "(By the time we left, we had five bags full of trash...)"
2006006-101 = "(And we managed to find one single shard that sparkled just like a jewel.)"