[translation]
1004902-1 = "Пересдача и десерт"
1004902-3 = "О. Привет, Сенсей. Вы довольно быстро пришли."
1004902-4 = "Я переживала, что сегодня вы будете заняты."
1004902-5 = "[s1] «Сегодня работы было меньше обычного.»\n[s2] «Я всё бросил, потому что ты для меня в приоритете.»"
1004902-6 = "Рада, что не отвлекаю вас от чего-то важного."
1004902-7 = "Странно, Сенсей. Надеюсь, вы не разговариваете так с другими студентами!"
1004902-8 = "Ну, я позвала вас потому что... Ничего серьёзного, просто принесла кое-что, с чем мне нужна помощь..."
1004902-9 = "В общем..."
1004902-10 = ""
1004902-12 = ""
1004902-13 = "[ns3] «...Это предполагаемые вопросы к пересдаче?»\n[ns4] «Эта стопка бумаг выше тебя.»"
1004902-14 = "Да. Пересдача уже совсем скоро."
1004902-15 = "Это тренировочные вопросы! Пересдача уже совсем скоро."
1004902-16 = "Не думаю, что пересдача будет очень сложной, но с несколькими темами у меня проблемы."
1004902-17 = "А?"
1004902-18 = "...Вы хотите узнать, насколько плохо у меня с учёбой?"
1004902-19 = "Как прямолинейно. Вам повезло, что я не обидчивая."
1004902-20 = "Ну, вы же мне помогаете... Ладно."
1004902-21 = "С оценками у меня, прямо скажем, не блестяще. Я не самая худшая, но где-то... в нижних двадцати-тридцати процентах?"
1004902-22 = "Поэтому мне и нужна помощь."
1004902-23 = "А?!"
1004902-24 = "Вы думали, я хотя бы в середине?"
1004902-25 = "Ха."
1004902-26 = "Хотела бы. Но в средней школе я практически никогда не училась."
1004902-27 = "Если вы правда так думаете, спасибо. По крайней мере, не считаете меня тупой."
1004902-28 = "Вообще-то в последнее время я сильно подтянулась! Учусь до и после занятий. Честно!"
1004902-29 = "Но, не знаю... Навёрстывать слишком много."
1004902-30 = ""
1004902-32 = ""
1004902-33 = "...Что это за лицо?"
1004902-34 = "Если это жалость, я вам врежу."
1004902-35 = "[s5] «Нет, я думал о том, как горжусь тобой.»\n[s6] «Я правда рад, что твой труд начал приносить результаты.»"
1004902-36 = "Хм..."
1004902-37 = "Хм..."
1004902-38 = "Я никогда не понимаю, серьёзно вы говорите или нет... но спасибо, наверное."
1004902-39 = "В любом случае, у меня нет времени вот так болтать."
1004902-40 = "Давайте начнём повторять. Один напиток за мой счёт, раз уж вы сегодня тратите на меня время."
1004902-41 = "А? Вы считаете, что учитель всё равно должен платить?"
1004902-42 = "Эм..."
1004902-43 = "Нет. Я должна вам отплатить, иначе не смогу сосредоточиться на учёбе."
1004902-44 = "Вы ведь не хотите мешать моей учёбе, правда?"
1004902-45 = "Хи-хи. Значит, сегодня плачу я."
1004902-46 = "Я схожу закажу. А вы пока можете посмотреть мои вопросы по этой задаче?"
1004902-47 = ""
1004902-49 = ""
1004902-50 = "Oh, and I was confused on this topic..."
1004902-52 = "Мы с Казусой тщательно разобрали страницы к пересдаче."
1004902-53 = "She took it very seriously, and since the content was for a make-up exam, she progressed quickly."
1004902-55 = "*вздыхает*"
1004902-56 = "Мы закончили. Это была последняя."
1004902-57 = "Хм... Вот какая разница, когда рядом есть учитель?"
1004902-58 = "С вами оказалось намного легче понять все эти вещи."
1004902-59 = "Теперь даже не верится, что я ошибалась во всех этих заданиях. Как-то безумно."
1004902-60 = "Что?"
1004902-61 = "Ошибка ретроспективы? Когда знаешь ответ, всё кажется очевидным? Наверное, логично..."
1004902-62 = "В любом случае, я всё повторила, так что на экзамене проблем быть не должно."
1004902-63 = "Вы были отличным учителем..."
1004902-64 = "...Так что спасибо."
1004902-65 = "Вы уходите? Я думала, сегодня у вас довольно свободный день."
1004902-66 = "А..."
1004902-67 = "Нет, я уже сказала, что не хочу, чтобы вы мне что-то покупали. Даже десерт."
1004902-68 = "Почему вы такой настойчивый?"
1004902-69 = "[s7] «Просто сегодня я свободен.»\n[s8] «Я тоже не хочу оставаться у тебя в долгу.»"
1004902-70 = ""
1004902-71 = ""
1004902-73 = ""
1004902-74 = "...Сенсей."
1004902-75 = "Вы действительно умеете подобрать слова."
1004902-76 = "Ладно, хорошо. Только один раз."
1004902-77 = "Заказывать будете вы, раз в прошлый раз выбирала я."
1004902-78 = "Я съем что угодно, так что выбирайте сами."
1004902-79 = "Что бы это ни было..."
1004902-80 = ""
1004902-82 = ""
1004902-83 = "...Спасибо, Сенсей."
1004902-85 = "Мы с Казусой разделили десерт и немного поболтали, прежде чем я вернулся в «Шале»."
