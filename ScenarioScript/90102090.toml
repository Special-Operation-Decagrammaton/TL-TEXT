[translation]
90102090-1 = "Episode 9;Express Train for Private Hyacinth Academy"
90102090-2 = "(The same night. We met up at the platform at the appointed time.)"
90102090-3 = "(Perhaps because it was late, the platform was completely empty and suffocatingly quiet.)"
90102090-11 = "Y-You really came...!"
90102090-12 = "Being alone made me kind of scared...#nI was just thinking about heading home if no one showed up a little longer."
90102090-13 = "By the way... what's with that equipment?"
90102090-17 = "Sorry, sorry. Getting ready took longer than I thought."
90102090-18 = "Cluster grenades, thermite for the rails... and I brought spare drones, too!"
90102090-19 = "I was in a rush so this is all I could grab, but... well, it should be enough."
90102090-20 = "Um, we're looking for Takahashi, right?"
90102090-21 = "That equipment... looks like it's meant to blow up a train."
90102090-22 = "Well, I suppose I can't deny that."
90102090-23 = "If necessary, we have to be ready to stop it even if it means blowing the train up."
90102090-24 = "I did consider planting landmines on the tracks, but that'd probably cause trouble for a lot of people..."
90102090-25 = "We should avoid wasteful expenses. Even if we do have backers."
90102090-26 = "(Miyako's seniors might be a lot more dangerous than I thought...)"
90102090-27 = "So, how is it today?"
90102090-28 = "Um... what do you mean?"
90102090-29 = "The atmosphere of the platform. Does it feel similar to when you saw the suspicious train?"
90102090-30 = "...Yes, it felt just like this back then."
90102090-31 = "I had a little time before the train I was supposed to take arrived, so#nI was sitting on a bench, thinking about the past."
90102090-36 = "I just happened to have my old commuter pass in my bag... and it made me feel nostalgic, so I was looking at it."
90102090-38 = "Maybe because it's so quiet around us... the scenery I'm looking at started to blur a little, giving me the sensation that my memories were becoming crystal clear."
90102090-39 = "Memories from long ago came back to me as if they happened just yesterday."
90102090-43 = "The faint sound of a railroad crossing gate lowering in the distance."
90102090-47 = "The voices of students chatting happily."
90102090-49 = "Red spider lilies running wild along the tracks, and the nostalgic scenery changing with the seasons..."
90102090-54 = "\"The train for Platform 4 will be arriving shortly.\""
90102090-55 = "Eh...?"
90102090-56 = "Th-That's strange... according to the timetable, it's not time for a train yet...!"
90102090-57 = "\"The express train bound for Private Hyacinth Academy will be arriving shortly on Platform 4.\""
90102090-58 = "\"For your safety, please step behind the yellow line.\""
90102090-59 = "FOX4, status on the station's security cameras?"
90102090-60 = "Signal Lost. Not a peep out of them."
90102090-61 = "Same condition as when the disappearance case happened."
90102090-62 = "Which means..."
90102090-63 = "The approaching train is our target—Object Alpha."
90102090-64 = "All personnel, prepare for combat. Bolt check, disengage safeties."
90102090-65 = "Confirmed. Target is approximately 300 meters from current position."
90102090-66 = "Wh-What on earth are you planning to..."
90102090-67 = "It's fine. Just a safety check."
90102090-71 = "\"The doors are opening. Please watch your step as you board.\""
90102090-76 = "No one inside. Just like we heard."
90102090-77 = "...I'm not keen on storming a car with zero intelligence, but we don't have a choice right now."
90102090-78 = "FOX Squad, all personnel, board the train."
90102090-83 = "Sensei.#nWhile we carry out the operation, could you wait here with our client?"
90102090-84 = "[s1] \"Why...?\"\n[s2] \"Can't I come with you?\""
90102090-87 = "This operation is more dangerous than any before."
90102090-88 = "What the inside of the train is like, what's waiting for us inside—#nwe don't have a single piece of reliable information."
90102090-89 = "Unlike intercepting monsters in a pre-surveyed area, this operation is—#nMight as well be stepping straight into a monster's mouth."
90102090-90 = "[s3] \"All the more reason for me to go, then.\"\n[s4] \"Can you guarantee you'll be able to give orders from outside the train?\""
90102090-93 = "But if something happens to Sensei..."
90102090-94 = "[s] \"You trust me, right, Yukino?\""
90102090-95 = "Well, of course."
90102090-96 = "[s5] \"I trust you too, Yukino.\"\n[s6] \"That's why I want to stay by your side.\""
90102090-102 = "............Sigh."
90102090-103 = "Then make sure you don't leave my back, no matter what."
90102090-104 = "All personnel, breach."
90102090-105 = "U-Um... are you really going to be okay?"
90102090-106 = "About what?"
90102090-107 = "Not a single person who's boarded this train has ever come back... and you're taking such a risk..."
90102090-108 = "This is about my friend for me, but to you guys, I'm a complete stranger, right...?#nYou don't have to go this far just because it's a request..."
90102090-113 = "You aren't a complete stranger."
90102090-114 = "The students who vanished are precious friends and family to someone, I'm sure..."
90102090-115 = "Besides, you're a friend of our precious junior's."
90102090-116 = "I promise. We'll bring them back, no matter what."
90102090-122 = "Ah, right. I'm going to borrow this commuter pass for a second."
90102090-126 = "Um... watching Miyako made me think a little bit...#nCould you guys, by any chance—"
90102090-127 = "Shh."
90102090-128 = "Anything beyond that is classified information."
90102090-135 = "\"The doors are closing. Please refrain from forced boarding.\""
90102090-140 = "Next Episode;Bullet Train"
