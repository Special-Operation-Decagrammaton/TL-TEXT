[translation]
90102090-1 = "Эпизод 9;Поезд до частной академии Гиацинт"
90102090-2 = "(Той же ночью. В назначенное время мы встретились на платформе)"
90102090-3 = "(Наверное, из-за позднего часа на платформе не было ни души, стояла такая тишина, что перехватывало дыхание)"
90102090-4 = ""
90102090-6 = ""
90102090-8 = ""
90102090-9 = ""
90102090-11 = "В-вы пришли...!"
90102090-12 = "Когда я осталась одна, мне стало как-то страшно...#nЯ уже думала, что если вы не придёте чуть позже, то я пойду домой."
90102090-13 = "Кстати... что это за снаряжение?"
90102090-14 = ""
90102090-16 = ""
90102090-17 = "Прости-прости. С подготовкой ушло больше времени, чем я думала."
90102090-18 = "Кассетные гранаты и термит для путей... ещё и запасной дрон прихватила!"
90102090-19 = "Спешила, поэтому только это и смогла взять... ну, этого должно хватить."
90102090-20 = "Эм, вы ведь идёте искать Такахаси?"
90102090-21 = "Это снаряжение... выглядит так, будто оно для подрыва поезда."
90102090-22 = "Ну, отрицать не стану."
90102090-23 = "Если понадобится, придётся даже взорвать поезд, чтобы остановить его."
90102090-24 = "Была и идея заложить мины на путях, но это, похоже, доставит много хлопот людям..."
90102090-25 = "Лишних расходов следует избегать. Пусть за нами и есть поддержка."
90102090-26 = "(Подруги Мияко, похоже, опаснее, чем я думала...)"
90102090-27 = "Итак, как сегодня?"
90102090-28 = "Эм... что именно?"
90102090-29 = "Атмосфера на платформе. Похожа на ту, когда ты видела подозрительный поезд?"
90102090-30 = "...Да, тогда было так же."
90102090-31 = "До поезда, на который я собиралась сесть, оставалось ещё немного времени,#nи я сидела на скамейке, думая о прошлом."
90102090-32 = ""
90102090-34 = ""
90102090-35 = ""
90102090-36 = "Как раз в сумке оставался старый проездной... стало как-то ностальгически, и я его разглядывала."
90102090-38 = "Может, потому что вокруг тихо... пейзаж перед глазами постепенно расплывался, и казалось, что воспоминания проступают отчётливо."
90102090-39 = "Я вспоминала давние воспоминания так ясно, будто это было вчера."
90102090-40 = ""
90102090-43 = "Доносящийся издалека слабый звук опускающегося шлагбаума на переезде."
90102090-44 = ""
90102090-47 = "Голоса студентов, весело болтающих друг с другом."
90102090-48 = ""
90102090-49 = "Ликорисы, пышно цветущие вдоль путей, и дорогие сердцу пейзажи, меняющиеся от сезона к сезону..."
90102090-50 = ""
90102090-53 = ""
90102090-54 = "«Скоро на 4-й путь прибудет поезд»"
90102090-55 = "Э...?"
90102090-56 = "С-странно... по расписанию ещё не время для поезда...!"
90102090-57 = "«Скоро на 4-й путь прибудет поезд до частной академии Гиацинт»"
90102090-58 = "«Во избежание несчастных случаев отойдите за жёлтую линию»"
90102090-59 = "FOX4, как камеры наблюдения на станции?"
90102090-60 = "Сигнал потерян. Ни слуху ни духу."
90102090-61 = "То же состояние, что и при исчезновениях."
90102090-62 = "Значит..."
90102090-63 = "Приближающийся поезд — наша цель, Объект Альфа."
90102090-64 = "Всем приготовиться к бою. Проверить затворы, снять предохранители."
90102090-65 = "Подтверждаю. Цель примерно в 300 метрах от текущей позиции."
90102090-66 = "Ч-что вы теперь собираетесь..."
90102090-67 = "Всё в порядке. Это просто проверка безопасности."
90102090-68 = ""
90102090-71 = "«Двери открываются. Пожалуйста, будьте осторожны при посадке»"
90102090-72 = ""
90102090-75 = ""
90102090-76 = "Внутри никого нет. Как и говорили."
90102090-77 = "...Врываться в вагон без разведданных не хочется, но сейчас ничего не поделаешь."
90102090-78 = "Отряд FOX, всем садиться."
90102090-79 = ""
90102090-81 = ""
90102090-82 = ""
90102090-83 = "Сенсей.#nПока мы ведём операцию, не могли бы вы подождать здесь вместе с заказчицей?"
90102090-84 = "[s1] «Почему...?»\n[s2] «Мне тоже нельзя пойти с вами?»"
90102090-87 = "Эта операция опаснее всех предыдущих."
90102090-88 = "Что внутри поезда, что нас там ждёт.#nМы не знаем ни о чём."
90102090-89 = "В отличие от встречи с монстром в заранее разведанном месте, эта операция―#nтак сказать, шагнуть прямо в пасть монстру."
90102090-90 = "[s3] «Тем более.»\n[s4] «Ведь нет гарантии, что я смогу отдавать приказы удалённо снаружи поезда, верно?»"
90102090-93 = "Но если с учителем что-то случится..."
90102090-94 = "[s] «Юкино ведь верит мне?»"
90102090-95 = "Конечно."
90102090-96 = "[s5] «И я верю Юкино.»\n[s6] «Поэтому хочу быть рядом с Юкино.»"
90102090-99 = ""
90102090-101 = ""
90102090-102 = "......Эх."
90102090-103 = "Тогда, пожалуйста, ни в коем случае не отходите у меня из-за спины."
90102090-104 = "Всем, вперёд."
90102090-105 = "Э-эм... вы правда уверены, что всё в порядке?"
90102090-106 = "Что именно?"
90102090-107 = "Ведь никто из тех, кто сел в этот поезд, так и не вернулся... и ради такого риска..."
90102090-108 = "Для меня это подруга, но для вас всех она совершенно чужой человек, верно...?#nДаже если это заказ, не обязательно заходить так далеко..."
90102090-109 = ""
90102090-111 = ""
90102090-112 = ""
90102090-113 = "Она не совсем чужой человек."
90102090-114 = "Думаю, пропавшие студенты тоже для кого-то дорогие подруги и семьи..."
90102090-115 = "К тому же, это подруга нашей дорогой младшей."
90102090-116 = "Обещаю. Обязательно приведу её обратно."
90102090-117 = ""
90102090-119 = ""
90102090-120 = ""
90102090-122 = "Ах да. На минутку одолжу твой проездной."
90102090-123 = ""
90102090-125 = ""
90102090-126 = "Эм... когда я смотрела на Мияко, мне немного подумалось...#nВы ведь, случайно―"
90102090-127 = "Тсс."
90102090-128 = "Всё, что дальше, — секретная информация."
90102090-129 = ""
90102090-135 = "«Двери закрываются. Пожалуйста, не пытайтесь вскочить в поезд»"
90102090-136 = ""
90102090-140 = "Следующий эпизод;Пулевой поезд"
