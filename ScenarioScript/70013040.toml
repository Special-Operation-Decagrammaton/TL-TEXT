70013040-28 = "Они что, чёртовы суперсолдаты?"
70013040-29 = "Без понятия. Босс сильно на нервах, так что, может, они уровня Семи заключённых. Типа Акэми."
70013040-30 = "Да НИ ЗА ЧТО какие-то случайные девки не сравнятся с этим монстром."
70013040-31 = "Значит, все их люди здесь..."
70013040-32 = "Ку-фу-фу, отлично. Чем больше взрывать, тем лучше!"
70013040-33 = "Пошли, Харука."
70013040-34 = ""
70013040-39 = ""
