[translation]
1012606-1 = "Это... не я."
1012606-4 = "По делам я вышел из офиса."
1012606-5 = "Мяу. Мя-яу."
1012606-6 = "Кар. Кар-кар."
1012606-7 = "[ns] «...Чёрные кошки и вороны?»"
1012606-9 = ""
1012606-10 = ""
1012606-11 = ""
1012606-12 = ""
1012606-13 = "[ns] «...?!»"
1012606-14 = "Э... хе-хе..."
1012606-15 = "[ns1] «(...Сегодня от неё веет ещё более зловещим, чем обычно.)»\n[ns2] «(Как она и просила, пока просто проигнорирую...)»"
1012606-21 = "Мяу! Мя-яу!"
1012606-22 = ""
1012606-24 = ""
1012606-25 = "..."
1012606-26 = "[ns] «Что...?!»"
1012606-30 = "Кар! Кар-ка-а-ар!"
1012606-31 = ""
1012606-33 = "..."
1012606-34 = "[ns] «И-И здесь тоже?!»"
1012606-36 = ""
1012606-37 = ""
1012606-38 = "..."
1012606-39 = "[ns] «ДА ЧТО вообще происходит?!»"
1012606-41 = "Куда бы я ни пошёл, везде видел Каноэ."
1012606-42 = ""
1012606-45 = "Я старался сосредоточиться на рабочих делах, выполняя их одно за другим по плану."
1012606-46 = ""
1012606-49 = ""
1012606-50 = ""
1012606-51 = ""
1012606-52 = ""
1012606-53 = ""
1012606-54 = ""
1012606-55 = ""
1012606-56 = ""
1012606-57 = ""
1012606-58 = ""
1012606-60 = "Но продолжал видеть её повсюду..."
1012606-63 = "[ns] «*тяжело дышит* *тяжело дышит*»"
1012606-64 = "А, вот ты где. Нам сказали, что у тебя назначена деловая встреча."
1012606-65 = "Но ты... довольно рано, разве нет?"
1012606-66 = "[s] «Д-Дело в том...»"
1012606-68 = "Я объяснил, что Каноэ постоянно преследует меня."
1012606-69 = ""
1012606-70 = "Каноэ? Итагаки Каноэ, ходячая метла?"
1012606-71 = "[s] «Ходячая метла»? Что ты имеешь в виду?"
1012606-72 = "За ней всегда ходят чёрные кошки и летают вороны."
1012606-73 = "Она ГОВОРИТ, что сама не знает почему, но я ей не верю."
1012606-74 = "...К тому же они почти беспрекословно её слушаются."
1012606-75 = "Она холодная как лёд и такая же бледная..."
1012606-76 = "...а голосами владеет настолько хорошо, что, говорят, НИКТО никогда не слышал её настоящего голоса."
1012606-77 = ""
1012606-78 = "...Она уже несколько раз обманывала меня таким образом, так что тут я спорить не мог."
1012606-80 = "А может, она вообще... призрак."
1012606-81 = "Может, она прямо сейчас за нами следит и смеётся над нами!"
1012606-82 = "[ns] «...!»"
1012606-89 = "Я вздрогнул и огляделся, но нигде её не увидел."
1012606-90 = "...Хотя, если уж на то пошло, она не единственная странная в этой академии."
1012606-91 = "Может, она просто всех разыгрывает, так что, наверное, не стоит воспринимать это слишком серьёзно."
1012606-92 = "Проще просто подыграть."
1012606-93 = "[s] «П-Правда? Ха-ха...»"
1012606-95 = "Я быстро закончил работу и вернулся в офис."
1012606-96 = "А на следующий день..."
1012606-99 = "Каноэ звонит."
1012606-100 = "Она сказала, что позвонит, когда всё станет безопасно."
1012606-101 = ""
1012606-104 = ""
1012606-105 = "Сенсей... Вчера всё было в порядке...?"
1012606-106 = "Сейчас-то всё нормально, да? Всё как обычно?"
1012606-107 = "[s3] «Что именно произошло?»\n[s4] «Я видел тебя повсюду...»"
1012606-110 = "Да, прежде всего я должна извиниться."
1012606-111 = "Я допустила ошибку."
1012606-112 = "Я думала, ритуал был идеален. Но это оказалось не так."
1012606-113 = "[s] «Р-Ритуал? Какой ещё ритуал...?»"
1012606-114 = "Для призыва злых духов."
1012606-115 = "Я случайно призвала слишком много, и они стали насмехаться надо мной, приняв мой облик."
1012606-116 = "Они даже скопировали мой характер. Наверное, поэтому все они и преследовали тебя."
1012606-117 = "[s] «Хочешь сказать, все Каноэ, которых я видел вчера, были...?»"
1012606-118 = "Да. Все они были злыми духами."
1012606-119 = "Не волнуйся. Я уже изгнала их всех."
1012606-120 = "[s5] «Настоящие злые духи.»\n[s6] «То есть ни одна из тех Каноэ, которых я видел, не была тобой.»"
1012606-123 = "Верно. И они выбрали худшее время для своих проделок — ты был так занят. Настолько, что никто не мог нормально с тобой встретиться, только посмотреть издалека..."
1012606-124 = "...даже если кто-то с трудом получил разрешение выйти в тот день..."
1012606-125 = "[s] «Так это ВСЁ-ТАКИ была ты!»"
1012606-126 = "Ты услышал моё объяснение. А верить или нет — решай сам."
1012606-127 = "Э-хе-хе..."
1012606-128 = ""
1012606-130 = ""
1012606-132 = "Я так до конца и не уверен, кого именно видел в тот день..."
1012606-133 = "...и так и не выяснил."
1012606-134 = "Хи-хи..."
1012606-135 = "Э-хе-хе-хе...!"
