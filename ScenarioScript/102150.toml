102150-59 = ""
102150-60 = ""
102150-61 = ""
102150-62 = "С-Сакурако...? Ч-Что на тебе надето...?!"
102150-63 = "Этот наряд..."
102150-64 = "Са... Сакурако?!"
102150-66 = "Это церемониальное одеяние Совета святой Юстины, оставленное предыдущим председателем совета..."
102150-67 = "...Это символ моей решимости."
102150-68 = "Я хочу отпустить ненависть прошлого и выковать для совета новое будущее. Для всех нас."
102150-69 = "...Сакурако."
102150-70 = ""
102150-72 = ""
102150-73 = "Этот... комбинезон — символ твоей решимости?!"
102150-74 = "Но он же такой откровенный?!"
102150-75 = "Ты хочешь сказать, что это... платье выражает волю совета? И Сестринство продолжит эту традицию?!"
102150-76 = "То есть теперь все сёстры будут носить такой откровенный наряд?"
102150-78 = "А?! П-Правда?!"
102150-79 = "Я... я не думаю, что смогу надеть что-то подобное..."
102150-80 = "Ч-Что вы такое говорите?! Нет! Я вовсе не это имела в виду!"
102150-81 = "Посмотрите на этот откровенный купальник с высоким вырезом. Уже чтобы просто его надеть, нужна огромная смелость!"
102150-82 = "А дизайн! При ходьбе приходится переживать буквально обо всём! Спереди? Сзади?! Всё под угрозой!"
102150-83 = "И это символизирует твою решимость, Сакурако?!"
102150-84 = "Н-Ну... это..."
102150-85 = "Сакурако, пожалуйста, ответь честно. Мне нужно знать... На тебе вообще что-нибудь есть под этим? Нет... физически это, наверное, невозможно."
102150-86 = "Подводя итог: Сакурако пришла на штурм в одних гигантских трусиках!"
102150-87 = "Х-Ханако, что за чушь ты сейчас несёшь?! Правда!"
102150-88 = "..."
102150-89 = "Прошу, прости наши грехи... и избавь нас от зла..."
102150-90 = "Я, Урава Ханако, не ожидала осознать, насколько недостойна перед несгибаемой волей Сакурако."
102150-91 = "...Да. Ты права. Но теперь я тоже осознала своё недостоинство. Я также укреплю свою решимость."
