[translation]
102150-1 = "Эпизод 15; Четвёртое святилище — Базилика в катакомбах"
102150-8 = "Сейчас в четвёртое святилище ведёт только один путь. Легко не будет, и потребуется немалая огневая мощь... но выбора нет."
102150-9 = ""
102150-10 = "Веди нас, Ханако. Мы доверяем твоему командованию."
102150-11 = "Согласна. Ханако, ждём твоих приказов."
102150-12 = "Ох. Как же мило, когда мы обе делаем вид, будто за этими словами нет никакого скрытого смысла. ♡"
102150-13 = ""
102150-15 = ""
102150-16 = "Всё готово, кроме одного... нам нужно усилить оборону тыла..."
102150-17 = "Людей просто не хватает. Придётся рискнуть."
102150-19 = "Позволите нам помочь?"
102150-20 = ""
102150-22 = ""
102150-23 = ""
102150-26 = ""
102150-27 = "...Вы?"
102150-28 = "Если не возражаете, можете доверить нам оборону тыла."
102150-30 = "..."
102150-31 = "...Понимаю, просить вашего доверия — это слишком, но мы могли бы... Мы хотим помочь."
102150-32 = "Ничего подобного, Саори. Отряд Ариус будет прикрывать тыл нашего построения."
102150-33 = "...!"
102150-35 = "П-Правда? Слишком уж легко вы согласились!"
102150-36 = "...Ты ведь прекрасно понимаешь, кому именно говоришь «да». Какой у тебя мотив?"
102150-38 = "Вы получили просьбу о помощи от Сенсея, как и мы. Я не могу отвергать его решение."
102150-39 = "Но что ещё важнее — у нас есть общая подруга, которая значит для нас очень многое, разве нет?"
102150-41 = "..."
102150-42 = "Вот почему я доверяю Отряду Ариус."
102150-43 = "...Понятно. Спасибо."
102150-44 = "..."
102150-45 = "Но не волнуйтесь, вы не будете защищать тыл в одиночку. Хи-хи."
102150-46 = "Что за логика..."
102150-47 = "Д-Да! В-Выглядит страшно и безнадёжно, но я постараюсь изо всех сил работать вместе с вами!"
102150-52 = "Похоже, все готовы."
102150-53 = "...Кроме одной. Где Сакурако?"
102150-54 = "Прошу прощения за опоздание."
102150-55 = ""
