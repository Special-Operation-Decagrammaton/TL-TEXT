[translation]
13210-1 = "Episódio 21;A Segunda Perseguição"
13210-2 = "Estão todos bem?"
13210-3 = "G-Graças a vocês, conseguimos escapar..."
13210-5 = "Não dá mais para continuar. Vamos recuar."
13210-6 = "Foi um erro tentar nos meter com Abydos..."
13210-8 = "Nunca imaginei que acabaria assim..."
13210-9 = "Se ao menos não tivéssemos nos envolvido desde o início..."
13210-11 = "O Presidente deve enviar reforços em breve.#nSe for rápido, ainda hoje à tarde..."
13210-12 = "Por favor, fujam todos antes que Abydos vire um campo de batalha."
13210-13 = "E-Entendido..."
13210-16 = "Senhorita..."
13210-17 = "Sr. Mordomo, você está bem...?"
13210-18 = "O-O que foi que eu fiz..."
13210-19 = "Abydos logo vai se transformar em um campo de batalha."
13210-20 = "Não era... para ser assim..."
13210-21 = "Eu sei, Sr. Mordomo."
13210-22 = "...Senhorita."
13210-23 = "Embora nossos métodos fossem diferentes,#nvocê também desejava a reconstrução de Abydos, não é?"
13210-24 = "..."
13210-25 = "Independentemente do resultado..."
13210-26 = "...Eu sinto muito."
13210-27 = "Desde que descobri a existência do Canhão Ferroviário,#nnão consegui pensar em mais nada..."
13210-28 = "Achei que, com aquilo em mãos, poderíamos recuperar a glória do passado."
13210-29 = "Achei que a Nephthys conseguiria retornar a Abydos..."
13210-30 = "Não tenho nada a dizer em minha defesa."
13210-31 = "..."
13210-32 = "Então, cuide-se bem, Sr. Mordomo."
13210-33 = "P-Para onde está indo, Senhorita?!"
13210-34 = "Vou impedir a Hoshino-senpai."
13210-35 = "Do jeito que as coisas estão, ela pretende assumir sozinha a culpa por destruir o Canhão Ferroviário#ne abandonar a escola."
13210-36 = "M-Mas como...?"
13210-37 = "...Ainda não sei. Mas se pensarmos todas juntas, com certeza vai dar certo."
13210-41 = "..."
13210-43 = "Não consegui detê-la de novo.#nSe eu fosse mais forte..."
13210-44 = "Já disse que não é culpa sua, Shiroko-senpai.#nA Hoshino-senpai é que é forte demais."
13210-45 = "...Anime-se, Shiroko-chan."
13210-46 = "..."
13210-47 = "Se continuar assim, a Hoshino-senpai vai embora."
13210-48 = "Se ela testemunhar que agiu completamente por conta própria..."
13210-49 = "Quando algum problema surgir, Abydos não será responsabilizada..."
13210-50 = "Ela estava meio estranha, né? A senpai."
13210-51 = "Não sei explicar direito, mas parecia encurralada."
13210-52 = "Se fosse a senpai de sempre, estaríamos pensando numa solução todas juntas..."
13210-54 = "...Parece com aquela época."
13210-59 = "A Hoshino-senpai parece acreditar que destruir o Canhão Ferroviário é a vontade da Presidente Yume."
13210-60 = "Hã? Mas a Presidente Yume nunca disse nada disso, né?"
13210-61 = "Sim. Mas a Hoshino-senpai disse \"é o que a Yume-senpai faria\"."
13210-62 = "Por quê...?"
13210-64 = "Isso é apenas uma suposição minha, mas..."
13210-65 = "Provavelmente..."
13210-74 = "Hoje nós vamos caçar um tesouro!"
13210-75 = "O~i, Hoshino-chan...?"
13210-81 = "Ah, senpai. O que foi dessa vez?"
13210-82 = "Então, é que... espera, o que aconteceu com você, Hoshino-chan?"
13210-83 = "Isso aqui é..."
13210-84 = "Será que você finalmente começou a achar que é um peixinho...?"
13210-88 = "Claro que não, né!"
13210-89 = "Eu me molhei enquanto consertava o encanamento, então só troquei de roupa!"
13210-90 = "Ah, o do pátio?#nVocê consertou pra gente!"
13210-91 = "Não, ainda não consegui consertar.#nÉ mais difícil do que eu pensava..."
13210-92 = "Hihi, então até a Hoshino-chan tem coisas que não consegue fazer."
13210-93 = "Parece um velhote desajeitado, é até fofinho."
13210-94 = "E-E,"
13210-95 = "Enfim, o que tem essa caça ao tesouro?"
13210-97 = "Ah, é verdade! Olha só, Hoshino-chan!"
13210-101 = "Eu consegui uma informação incrível!"
13210-102 = "Já não consigo mais confiar no \"incrível\" da senpai..."
13210-103 = "Dessa vez é verdade mesmo, confia em mim!"
13210-104 = "Você não foi enganada de novo, né?"
13210-105 = "\"Vale do Conselho Estudantil\"...?"
13210-106 = "Parece que existe um salão de exposições construído por uma antiga presidente do Conselho Estudantil de Abydos!"
13210-107 = "Dizem que tem um moooonte de coisas valiosas expostas lá!"
13210-108 = "Mesmo que isso seja verdade,#nacho que já venderam ou roubaram tudo faz tempo."
13210-109 = "Heh heh heh, é o que você pensa, né?"
13210-110 = "Mas dizem que fica num lugar secreto que nunca foi aberto ao público!"
13210-112 = "Ou seja..."
13210-113 = "Se a escola vendeu por causa das dificuldades financeiras, não tem jeito,#nmas pelo menos a chance de ter sido roubado é bem pequena!"
13210-114 = "Então... você quer ir procurar?"
13210-115 = "Aham!"
13210-116 = "...Como a gente vai procurar se ninguém sabe onde fica?"
13210-117 = "Hmph!"
13210-118 = "Eu estava mexendo nos documentos antigos e achei isto aqui!"
13210-119 = "...O que é isso?"
13210-123 = "Está quase tudo censurado de preto, não dá pra ler nada."
13210-124 = "Olha, vê bem aqui."
13210-125 = "\"Zona Fechada do Deserto de Abydos, Setor 35-9\"?"
13210-126 = "Pelo menos acho que deve ter alguma pista lá!"
13210-130 = "Haaah..."
13210-131 = "Não dá... né?"
13210-132 = "Sério, Yume-senpai..."
13210-133 = "H-Hau..."
13210-138 = "Por que não falou antes?!#nVamos lá agora mesmo!"
13210-139 = "Hoshino-chan!"
13210-141 = "Dessa vez vamos encontrar o tesouro!"
13210-146 = "E-Espera, Hoshino-chan!#nPrecisa trocar de roupa primeiro!"
13210-149 = "Ah!"
13210-160 = "Yume-senpai, não tem nada por aqui."
13210-161 = "...Aqui também não tem nada, buá..."
13210-165 = "..."
13210-169 = "Zona Fechada do Deserto de Abydos — Setor 35-9"
13210-171 = "...Não mudou nada."
13210-174 = "...Acho que ela está presa a isso."
13210-175 = "Isso quer dizer..."
13210-176 = "Ou talvez nós também estejamos..."
13210-177 = "Como se estivéssemos presas a alguma coisa..."
13210-178 = "Hmm..."
13210-179 = "[s] \"Presas a algo, é...\""
13210-180 = "Mesmo assim, precisamos impedir a Hoshino-senpai."
13210-182 = "É verdade.#nSe ela destruir o Canhão Ferroviário, a Kaiser vai cobrar uma indenização gigantesca."
13210-183 = "Não podemos simplesmente ficar olhando."
13210-184 = "Temos que encontrar um jeito..."
13210-185 = "Primeiro, vamos atrás da Hoshino-senpai!#nEu não vou mais hesitar!"
13210-187 = "Mas mesmo se formos atrás dela, não somos páreo para a Hoshino-senpai."
13210-188 = "Hmm..."
13210-189 = "Sensei, não tem ninguém que possa ajudar a gente?"
13210-190 = "Alguém tão forte quanto a Hoshino-senpai..."
13210-191 = "[s] \"Hmm...\""
13210-193 = "É uma boa ideia, mas acho que isso não resolveria o problema pela raiz."
13210-194 = "Se um problema parecido acontecer de novo no futuro,#nela vai continuar seguindo a sombra da Presidente Yume e tentando resolver tudo sozinha."
13210-195 = "Isso é algo que nós mesmas temos que resolver."
13210-197 = "Então está decidido!"
13210-198 = "Nn."
13210-199 = "Vamos partir agora mesmo..."
13210-200 = "...Quer dizer, a gente nem sabe onde fica."
13210-205 = "Hmm..."
13210-206 = "A Hoshino-senpai parecia saber, mas..."
13210-208 = "...Senhorita."
13210-209 = "...?"
13210-210 = "Aconteceu algu—"
13210-216 = "Por acaso você sabe onde fica, Sr. Mordomo?!"
13210-217 = "O Presidente mencionou a \"Zona Fechada do Deserto de Abydos, Setor 35-9\"."
13210-218 = "Provavelmente se refere à região do deserto rochoso a cerca de 480 km daqui."
13210-223 = "Lá existe uma estação da Ferrovia Transdesértica."
13210-226 = "...Está aberta."
13210-237 = "...O sistema de controle está funcionando."
13210-238 = "Achei que fosse só um monte de sucata..."
13210-242 = "Privilégio de administrador: \"Nonomi Izayoi\"..."
13210-243 = "Entendi."
13210-244 = "Só não estava sendo usado há muito tempo, mas as funções continuam intactas."
13210-245 = "O destino é... \"Vale do Conselho Estudantil\"."
13210-246 = "O trem que partiu há pouco#ndeve ser o que aquela garota de tapa-olho pegou."
13210-247 = "Como é que eu faço isso funcionar... será que é aqui?"
13210-257 = "...Acertei."
13210-259 = "Pode parecer apenas uma estação abandonada, mas..."
13210-260 = "Na verdade, é uma estação de baldeação que leva ao \"Vale do Conselho Estudantil\"."
13210-261 = "Se usar o cartão da Senhorita para acessar os privilégios,#ndeve ser possível reiniciar o sistema do trem."
13210-262 = "Isso significa que..."
13210-263 = "Sr. Mordomo..."
13210-269 = "[ns] \"Muito obrigado.\""
13210-270 = "...Não há de quê."
13210-271 = "Senhorita, peço minhas mais sinceras desculpas."
13210-272 = "...Sr. Mordomo."
13210-273 = "Por favor, apressem-se.#nTanto a Hoshino-san quanto a Suou-san devem ter ido para lá."
13210-274 = "Sim..."
13210-275 = "Aliás... quem exatamente é a Suou-san?"
13210-276 = "No começo, pensei que fosse da Highlander.#nMas ela também parecia ligada à Nephthys e a um fundo de investimento privado,#ne quando achei que trabalhava para a Kaiser, ela os traiu também..."
13210-277 = "Além disso, por que ela está mirando na Hoshino-senpai...?"
13210-281 = "Originalmente, Suou Asagiri era uma delinquente que vagava sem pertencer a nenhuma academia específica."
13210-282 = "Quando eu procurava uma guarda-costas para quando a Senhorita ingressasse na Highlander,#nacabei sabendo da existência dela."
13210-283 = "Minha guarda-costas...?"
13210-284 = "Sim. Contudo, como a Senhorita ingressou em Abydos, esse cargo deixou de ser necessário.#nDepois disso, esqueci-me dela por um tempo..."
13210-285 = "Quando me dei conta, ela já estava no posto de supervisora."
13210-286 = "Voltei a entrar em contato com ela depois de muito tempo por causa deste incidente."
13210-291 = "...Quem ela realmente é e o que está pensando,#nnem eu sei dizer."
13210-292 = "Se formos ao Vale do Conselho Estudantil..."
13210-293 = "Sim, provavelmente.#nMas para alcançá-las, vocês precisariam usar um trem de alta velocidade."
13210-295 = "...Aí está o problema."
13210-296 = "O que vamos fazer...?"
13210-302 = "Pahahá! Parece que vocês estão precisando de uma mãozinha, né?"
13210-311 = "As heroínas chegaram!"
13210-313 = "Vocês são...!"
13210-315 = "Estão precisando de um trem de alta velocidade, não é?"
13210-316 = "C-Com licença... Nós conhecemos bem a Ferrovia Transdesértica,#ne vocês nos ajudaram agora há pouco..."
13210-317 = "Isso, isso.#nSe envolve ferrovias, também é problema nosso."
13210-318 = "É isso aí~, também somos vítimas~."
13210-319 = "A gente leva vocês lá!"
13210-321 = "Até que vocês têm iniciativa!"
13210-322 = "Sim, sim☆#nMuito obrigada, pessoal da Highlander!"
13210-323 = "Nn, obrigada."
13210-325 = "Uhuuu, vou mandar um drift em trilho duplo!"
13210-326 = "Ahaha!#nÉ perigoso, então faz só um pouquinho, tá?"
13210-328 = "S-Será que isso vai dar certo?#nEm termos de segurança..."
13210-334 = "[ns] \"Obrigado, vocês três.\""
13210-335 = "Beleza, vamos preparar tudo rapidinho!"
13210-343 = "Oiii, tá tudo pronto!"
13210-344 = "Nos trinques."
13210-346 = "Já podemos embarcar?"
13210-347 = "E-Esperem um pouco.#nO que é isso que vocês estão segurando?"
13210-348 = "Hidrazinaaa."
13210-349 = "Hã?! Isso não é propelente de foguete?!"
13210-350 = "Por que estão levando algo tão perigoso?!"
13210-351 = "Ahaha, só por precaução, né?"
13210-352 = "Bom, acho que a gente não vai usar~, provavelmente."
13210-353 = "Talvez."
13210-354 = "V-Vai ficar tudo bem mesmo, né?#nÉ uma substância tóxica, então manuseiem com cuidado..."
13210-356 = "Tá bom, tá bom, vai dar tudo certo, Ayane-chan.#nA gente dá um jeito."
13210-357 = "Nn."
13210-359 = "Isso aí, chega de papo e sobe logo!"
13210-364 = "S-Sim... entendido."
13210-365 = "B-Bom, pessoal... tomem cuidado."
13210-367 = "Então, senhorita secretária, fica escondidinha até a gente voltar, tá?#nPahahá!"
13210-368 = "Bora, bora."
13210-376 = "Onde vamos nos sentar?"
13210-377 = "Uau~☆#nQue incrível!"
13210-378 = "Ué... por que um trem tem cintos de segurança?"
13210-380 = "Bom, montanha-russa também tem, então não é tão estranho, né?"
13210-385 = "Sim, sim!#nParece que estamos andando num brinquedo de parque!"
13210-391 = "Todo mundo a bordo?"
13210-392 = "[s] \"Estamos todos a bordo. Conto com vocês na direção.\""
13210-393 = "Partiuuu!"
13210-401 = "Kyaaaah?!"
13210-403 = "Uhuuu."
13210-404 = "Esse trem pode mesmo andar tão rápido assim?"
13210-405 = "Sei láaa."
13210-406 = "Pahahá!#nAh, nem precisa esquentar a cabeça com isso."
13210-413 = "Ah, tô sentindo cheiro de encrenca~?"
13210-414 = "Tem um helicóptero da Kaiser PMC vindo bem em cima do trem~."
13210-415 = "Opa,"
13210-416 = "Não tão mirando no vagão da frente?! Se a gente não impedir, ferrou!"
13210-418 = "Entendido, deixa comigo."
13210-419 = "[s] \"É a nossa vez.\""
13210-420 = "...Sim!#nVamos impedi-los!"
