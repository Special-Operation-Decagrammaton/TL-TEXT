[translation]
1012515-1 = "Starting Point of Magic"
1012515-2 = "(After finishing my work, I headed to the atelier where Eri was waiting.)"
1012515-9 = "Eri, you are using much bolder colors than usual."
1012515-10 = "There is a passionate aura hidden beneath that warmth... I feel like this is more than just an abstract painting."
1012515-11 = "Right? This is almost like--"
1012515-12 = "Ah, I see. So this is what happens when Eri uses her imagination..."
1012515-14 = "Wh-Wh-What kind of conversation is this...?! I am definitely not imagining anything weird...!"
1012515-16 = "Huuuh? Reallyyy?"
1012515-17 = "So suspicious..."
1012515-19 = "It-It is the truth, I swear...!"
1012515-21 = "Still, there is no doubt it is a wonderful piece."
1012515-22 = "Yeah. Eri, you are getting better and better."
1012515-27 = "I-Is that so...? Ah, thank you... Ehehe..."
1012515-32 = "[ns] \"Hello.\" "
1012515-34 = "Ah, Sensei. Hello."
1012515-35 = "Since Sensei is showing up here... Hehe, as I thought?"
1012515-36 = "Well then, time for the third wheel to withdraw. See you later!"
1012515-37 = "See you later."
1012515-44 = "[ns] \"What are you talking about...?\" "
1012515-46 = "D-Don't worry about it! It is just those two misunderstanding things!"
1012515-47 = "[s] \"It seems like you are getting along well with everyone in your department.\" "
1012515-48 = "Who knows... I am still being pushed around as much as ever..."
1012515-49 = "But even so, I suppose I have built up a bit more tolerance than before..."
1012515-50 = "[s1] \"You do not have to force yourself to talk about it.\"\n[s2] \"What was it like before?\""
1012515-53 = "...Forget holding a conversation, I could not even look them in the eye."
1012515-54 = "Whenever I stood in front of the others in my department, I just felt so shabby... and small..."
1012515-55 = "If I did not have this magical hat... I think I would still be running away."
1012515-56 = "I might not even have been able to exchange words with you, Master..."
1012515-57 = "[s3] \"It is a magical hat that gives you confidence!\"\n[s4] \"Did you make it yourself?\""
1012515-60 = "No way. I could never make such a wonderful hat."
1012515-61 = "This hat was--"
1012515-65 = "Left unattended in the atelier warehouse."
1012515-67 = "This was about a year ago."
1012515-70 = "Atelier Warehouse"
1012515-73 = "Aaaaah..."
1012515-74 = "I ran away again..."
1012515-75 = "This is no good... Why am I so pathetic...?"
1012515-76 = "At this rate, I will keep failing classes without making any friends... and get kicked out of the academy..."
1012515-77 = "I did not come to Wildhunt just to do this..."
1012515-78 = "..."
1012515-82 = "...Huh?"
1012515-83 = "Where is that hat...?"
1012515-92 = "Cough, cough...!"
1012515-93 = "Ugh, it is covered in dust... How long has it been here...?"
1012515-94 = "Left all alone..."
1012515-95 = "Somehow..."
1012515-96 = "...It feels so lonely."
1012515-106 = "Hah, hah...!"
1012515-107 = "Um, um, excuse me...!"
1012515-113 = "...Eh? Ah, were you talking to us?!"
1012515-114 = "Oh, whoa...! What is up?"
1012515-116 = "U-Um... well..."
1012515-120 = "Th-The magical hat in the warehouse... do you know whose it is...?"
1012515-122 = "A hat...? Beats me. I have no idea. Do you?"
1012515-123 = "I only just learned there was a hat like that."
1012515-124 = "If it is in the warehouse, you should ask the caretaker."
1012515-126 = "I-I see!"
1012515-127 = "Th-Th-Thank you...!"
1012515-132 = "...What was that about? Come to think of it, that might be the first time I heard her speak."
1012515-133 = "Well, isn't it a good change of pace? Probably."
1012515-136 = "After that, I went to ask the warehouse caretaker."
1012515-137 = "They told me it was so old they had no idea when it even got there..."
1012515-138 = "Even when they tried to throw it out, it looked so ominous that nobody wanted to touch it."
1012515-139 = "They were worried about getting cursed... or catching bad vibes, or things like that."
1012515-140 = "They say old objects can harbor souls, after all."
1012515-141 = "[s] \"So that is why it was left alone.\" "
1012515-142 = "...Yes."
1012515-146 = "But strangely enough... the moment I saw this hat, I felt a sense of destiny."
1012515-147 = "Its dust-covered appearance... somehow looked just like me, unable to fit in with those around me..."
1012515-148 = "So I asked the caretaker for permission and brought it home."
1012515-149 = "I washed it clean, sewed up the frayed edges, and patched up the roughly repaired parts with red cloth from above."
1012515-150 = "And when I finally put it on... confidence welled up within me like magic."
1012515-151 = "At first, I thought it was just because the wide brim blocked out everyone's gazes."
1012515-152 = "But! There is definitely magic dwelling in this hat! And a truly extraordinary magic at that!"
1012515-153 = "Otherwise, there is no way to explain that fateful encounter!"
1012515-154 = "[s] \"Maybe so!\" "
1012515-155 = "...Without this hat, I would not be who I am today."
1012515-156 = "I am sure I never would have met you, Master."
1012515-157 = "I do not know who the previous owner was, nor why they left it behind in a place like that..."
1012515-158 = "But now, this hat is practically my other half!"
1012515-159 = "That is why I will cherish it forever!"
1012515-160 = "[s] \"I am sure you can do it, Eri.\" "
1012515-161 = "Nyuhehe, thank you."
1012515-162 = "Oh, right. If you do not mind, Master, would you like to try wearing it?"
1012515-163 = "I am sure you will feel its mysterious power!"
1012515-164 = "[s5] \"Me, wear this hat...?\"\n[s6] \"...Is it really okay?\""
1012515-167 = "Of course!"
1012515-171 = "Here you go!"
1012515-178 = "Oh! It suits you well, Master!"
1012515-179 = "Hm hm, my judgment was spot on after all."
1012515-180 = "How is it? Do you feel confidence welling up inside you?"
1012515-181 = "[s] \"I think I can feel some special power...!\" "
1012515-182 = "Nyuhehe, I knew you would."
1012515-183 = "As a special treat, I will lend it to you a little longer. Since it is just the two of us here, the mana resonance will be even clearer..."
1012515-184 = "Just the two of us... resonance..."
1012515-188 = "The hat is... Huh?"
1012515-189 = "[s7] \"Come to think of it...\"\n[s8] \"Aren't you embarrassed without your hat?\""
1012515-192 = "..."
1012515-196 = "...Ha!!"
1012515-198 = "Ah, I... acting so indecently in front of Master...!!"
1012515-199 = "Wh-What should I do...?! If it comes to this, I will just have to use a memory-erasing spell--!!"
1012515-200 = "Master, it will be fine! It-It will be over right away...!!"
1012515-201 = "[s] \"Stop, stop! I'll give the hat back...!\" "
1012515-204 = "(I hurriedly returned the hat to Eri, stopping her from casting the memory-erasing spell.)"
1012515-208 = "Hah, hah... I am sorry, Master..."
1012515-209 = "I lost my cool for a moment..."
1012515-210 = "So, um... Today's main business was to hand over the painting--"
1012515-211 = "--A- Ah, looks like the paint has finally dried!"
1012515-217 = "(Seeing how incredibly embarrassed Eri was, I decided to take the painting and leave the atelier early.)"
1012515-223 = "W-Well then, see you again!"
1012515-224 = "[s] \"See you!\" "
1012515-226 = "(On my way back to Schale, I couldn't get Eri out of my mind.)"
1012515-230 = "(The image of Eri--innocent and cheerful, placing her precious hat on my head--lingered in my thoughts.)"
