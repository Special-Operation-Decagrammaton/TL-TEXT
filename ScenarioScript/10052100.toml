[translation]
10052100-1 = "Гебура, Правитель безрассудства"
10052100-3 = "..."
10052100-4 = "ПОЧЕМУ мы снова в Ледниковом море?"
10052100-5 = "[s] «Это всего лишь этот участок Стального континента. Всё будет хорошо, Химари.»"
10052100-6 = "Я НЕ то чтобы этого не понимаю! Я просто не понимаю, почему Гебура везде упорно требует ледяной температуры!"
10052100-7 = "С Хокмой ведь тоже было так... Может, у пророков есть... предпочитаемая природная среда?"
10052100-8 = "Понятно. Как Химари и Эйми, которые спорят из-за кондиционера."
10052100-9 = "...Рискуя повториться в тысячный раз: именно устойчивость Эйми к холоду здесь ненормальна."
10052100-10 = "Ладно, дальше. Здесь немного ностальгично."
10052100-11 = "Когда мы отследили сигналы Декаграмматона до Ледникового моря, первым... был Гебура."
10052100-12 = "[s] «Если подумать, это была первая миссия Токи.»"
10052100-13 = "Да. Это также была моя первая миссия с Сенсеем в составе Отряда Исследования Сверхъестественного."
10052100-14 = "Однако я хочу, чтобы все кое-что знали. Тогда я ужасно мёрзла, но наблюдала за поведением Эйми и выдержала всё одной лишь силой воли."
10052100-15 = "Разве я не впечатляю, Сенсей? Это возможность похвалить меня и сказать, как вы мной гордитесь."
10052100-16 = "[s] «...В любом случае, я всегда тобой горжусь, Токи.»"
10052100-17 = "Я ценю ваши чувства. Однако такого заявления недостаточно. Я, Асума Токи, спокойно спрошу ещё раз."
10052100-18 = "...Сенсей. Для её развития нехорошо так её баловать."
10052100-19 = "[s] «...Это Химари сказала.»"
10052100-20 = "Подтверждаю. Теперь я немного отойду от группы, чтобы как следует подуться."
10052100-21 = "Э-эм! Тебе... всё ещё холодно?"
10052100-22 = "Нет. Этот костюм создавался с учётом таких условий. Беспокоиться не о чем. Спасибо за заботу, Юзу."
10052100-23 = "...Хотя, если подумать, будь у этого костюма НЕ такая хорошая защита от холода, я могла бы греться, прижимаясь к Сенсею. Моя ошибка."
10052100-25 = "Так-так, Токи. Вернёмся к делу."
10052100-26 = "Мы предполагаем, что до взлома Декаграмматоном Гебура была беспилотным ИИ-дроном, работавшим из исследовательского центра в полярном регионе."
10052100-27 = "Или, словами Декаграмматона, он «вдохновил» ИИ следовать его учению. Но для нынешней задачи это неважно."
10052100-28 = "Гораздо важнее мне интересно, какая инженерия смогла превратить беспилотный дрон в—"
10052100-29 = ""
10052100-34 = "И-и-и...?!"
10052100-35 = "Кстати о вдохновлённом беспилотном дроне..."
10052100-36 = ""
10052100-38 = ""
10052100-39 = "Тогда, Сенсей. Готова принимать приказы."
