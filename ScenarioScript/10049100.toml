10049100-170 = ""
10049100-171 = ""
10049100-172 = "Кья-а-а?!"
10049100-173 = "Бесполезно!"
10049100-174 = "Сдавайся!"
10049100-175 = "С дороги!"
10049100-176 = ""
10049100-179 = "Уф!"
10049100-180 = "Почему вы ТАК упорно за мной гонитесь?!"
10049100-181 = "Ты портишь людям отдых и обманываешь детей, продавая им дешёвое барахло."
10049100-182 = "И заодно портишь репутацию товара ДРУГИХ людей."
10049100-183 = "И, если ты забыла, продажа взрывчатки в парке развлечений строго запрещена!"
10049100-184 = ""
10049100-188 = "Кья-а-а!!"
10049100-189 = ""
10049100-191 = ""
10049100-192 = ""
10049100-193 = "!!"
10049100-194 = "Это не просто взрывчатка! Это германиевые гранаты! Отлично улучшают кровообращение!"
10049100-195 = "А, но если вы недовольны товаром..."
10049100-196 = "...ну, обычно я такого не делаю, но могу вернуть деньги! Только один раз! Никому не говорите!"
10049100-197 = "Я у тебя ничего не покупала."
10049100-198 = "Тогда почему?! Почему ты ко мне пристала? Тебя кто-то подослал?"
10049100-199 = "Нет. Просто так правильно."
10049100-200 = "Это вообще не имеет смысла! Ты ничего с этого не получишь!"
10049100-201 = "Ты из Тринити, да? Знаешь, что это значит?"
10049100-202 = "Это территория Геенны! Ты собираешься устроить скандал в районе другой академии?"
10049100-203 = "И вообще, у тебя патроны кончились, разве нет? Ты даже не пытаешься это скрыть!"
10049100-205 = "..."
10049100-206 = ""
10049100-209 = "Сузуми!"
10049100-210 = "Маширо, патроны закончились. Запрашиваю огневую поддержку."
10049100-212 = "К сожалению, запрос отклонён. Цель находится в районе Геенны."
10049100-213 = "Это нарушило бы боевые правила Отряда справедливости."
