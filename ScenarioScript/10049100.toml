10049100-159 = "У меня был идеальный план! А потом на меня попёрли сотни людей только потому, что она их попросила! *задыхается* *задыхается*"
10049100-162 = ""
10049100-163 = "Нужно добраться до площади!"
10049100-164 = "Кажется, я оторвалась от этих чудиков. Теперь осталось только пересечь границу."
