10049100-1 = "Эпизод 10;Держись, Сузуми на скорости света!"
10049100-3 = "С-С дороги!!"
10049100-4 = ""
10049100-6 = ""
10049100-7 = ""
10049100-8 = "Эй! Не толкайся!"
