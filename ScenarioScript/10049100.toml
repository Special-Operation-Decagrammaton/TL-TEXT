10049100-219 = "Фух, а я-то зря испугалась. Проваливай. Тебе нечего мне сказать."
10049100-220 = "Вообще-то, мне есть что сказать. Три вещи."
10049100-221 = ""
10049100-223 = ""
10049100-224 = "Во-первых, никогда не бросай светошумовую гранату в сторону Сенсея. Это опасно."
10049100-225 = ""
10049100-227 = ""
10049100-228 = "Во-вторых. Я не только не состою в Отряде справедливости — я провалилась как его участница."
10049100-229 = ""
10049100-231 = ""
10049100-232 = "И в-третьих."
10049100-233 = ""
10049100-234 = "Ты же занимаешься этим только потому, что не смогла попасть в Отряд, да?"
10049100-235 = ""
