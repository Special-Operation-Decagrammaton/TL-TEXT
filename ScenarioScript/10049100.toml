10049100-54 = ""
10049100-56 = ""
10049100-58 = ""
10049100-60 = "Ух!!"
10049100-61 = ""
10049100-62 = "Врагов больше, чем ожидалось. Если не уложим их быстро, могут пострадать окружающие."
10049100-63 = ""
10049100-65 = ""
10049100-66 = ""
10049100-67 = "Белая! У меня кончились патроны!"
10049100-68 = "Это мой последний магазин!"
10049100-69 = "Чёрт, у меня тоже всё. Надо было взять больше..."
10049100-70 = "На меня обрушился град пуль..."
10049100-71 = ""
10049100-73 = ""
10049100-74 = ""
10049100-75 = ""
10049100-76 = "...но я уклонилась в мгновение ока! Узрите грацию Азума Мираи!"
10049100-78 = "А-а! Это реплика Отряда линчевателей! Даже НЕ ДУМАЙ её воровать!"
10049100-79 = "А, толпа! Я могу затеряться в ней."
10049100-80 = ""
10049100-83 = ""
10049100-84 = ""
10049100-85 = "Ай, осторожнее!"
10049100-86 = "Т-Тсс! Не надо кричать. Я просто прохожу мимо!"
10049100-87 = "Она из актёров?"
10049100-89 = "Тьфу, мы потеряли её в толпе!"
10049100-90 = "Наверное, затаилась. Я вообще её не вижу."
10049100-91 = "Всё дальше — территория Геенны. Силой здесь ничего не добиться..."
10049100-92 = ""
10049100-94 = ""
10049100-95 = "...Хм? А где Шимико...?"
10049100-96 = ""
10049100-99 = "Наконец-то ты пришла мне на помощь, родственная душа!"
10049100-100 = ""
10049100-102 = ""
10049100-103 = ""
10049100-104 = ""
10049100-106 = ""
10049100-107 = "Мой верный слуга, демон-торговец Серебряная Пластина!"
10049100-108 = "Как хитро ты спряталась среди толпы!"
10049100-109 = "Теперь судьба Тяжёлого Калибра уже предрешена!"
10049100-110 = "Раз уж мы с Серебряной Пластиной, злой офицершей Эрой, создали Рыцарей Зла, у вас нет ни шанса!"
10049100-111 = "Чтобы победить нас, вам понадобится союз, которого мир ещё не видывал!"
10049100-112 = "О-хо-хо! Победа наша, Тяжёлый Калибр!!"
10049100-113 = "Э...?"
10049100-114 = "Серебряная кто? Это, типа, я?"
10049100-115 = ""
10049100-117 = ""
10049100-118 = "А, кхм."
10049100-119 = "Все, можно минутку вашего внимания?"
10049100-121 = "Шимико? Что ты делаешь...?"
10049100-122 = "Она выходит из образа!"
10049100-124 = "Демон-торговец Серебряная Пластина прямо сейчас скрывается среди нас!"
10049100-125 = "И Тяжёлый Калибр только что её упустил!"
10049100-126 = "Поэтому..."
10049100-127 = "...им нужна ваша помощь!"
10049100-128 = "Серебряную Пластину можно узнать по серебряным волосам и белой одежде!"
10049100-129 = "Если увидите Серебряную Пластину, поднимите телефон или светящуюся палочку, чтобы показать нам, где она!"
10049100-130 = "Помогите Тяжёлому Калибру спасти день!"
10049100-131 = "Э-Э...?!"
10049100-132 = "Ого! Серебряная Пластина! Она здесь!"
10049100-133 = "Т-Тсс!! Тихо!!"
10049100-134 = "Ахаха!! Это тебе за то «ведёрко для попкорна», которое ты мне продала!"
10049100-136 = "Все, дайте нам свою силу!"
10049100-137 = ""
10049100-139 = ""
10049100-140 = ""
10049100-141 = ""
10049100-142 = ""
10049100-143 = "Теперь она здесь!"
10049100-144 = "Вот это здорово! Куда бы она ни пошла, все её подсвечивают!"
10049100-145 = "Теперь не потеряем!"
10049100-146 = "Отличная идея, Шимико!"
10049100-147 = "Это прямо как магия! Все работают вместе и создают чудо!"
