[translation]
22110-1 = "Episódio 11;Isso Não Importa!"
22110-2 = "...No fim das contas, a Presidente levou mesmo a Aris, né."
22110-3 = "Ei... isso não é bem ruim, não...?"
22110-4 = "Sim, é uma situação de emergência."
22110-6 = "Então, o motivo de a Presidente Rio não ter chamado ninguém além da Líder..."
22110-7 = "Provavelmente, ela já presumia desde o início que a Líder a trairia."
22110-8 = "Que maldade! Além de levar a Aris-chan, ainda maltratou a Líder!"
22110-10 = "...Haa."
22110-11 = "...Líder?"
22110-12 = "[s] \"Neru...? Ainda está doendo em algum lugar...?\""
22110-13 = "Bem na minha frente, levaram ela embora...#nE eu não pude fazer nada além de ficar olhando..."
22110-15 = "Isso..."
22110-16 = "Líder, não precisa se culpar. Não foi uma luta de frente, certo?"
22110-17 = "Isso mesmo! Aquilo não valeu! Não valeu!"
22110-19 = "...Vocês dão esse tipo de desculpa quando falham numa missão?"
22110-23 = "Bom..."
22110-25 = "Aquela garota que passou por cima de mim como se não fosse nada e levou a Aris..."
22110-26 = "Ela se chamou de \"Codinome Zero Quatro\"."
22110-27 = "Era Toki, né?#n— Akane, você conhece ela?"
22110-28 = "...Pois bem."
22110-29 = "Eu sabia da existência dela."
22110-30 = "Codinome Zero Quatro.#nEmbora pertença à \"C&C\", ela é uma integrante exclusiva da Presidente Rio."
22110-31 = "Por assim dizer, a guarda-costas da Presidente Rio..."
22110-32 = "Contudo, esta também foi a primeira vez que a encontrei pessoalmente..."
22110-33 = "Jamais imaginei... que a Presidente recorreria a ela para fazer algo assim..."
22110-34 = "Além disso, mesmo sendo um ataque surpresa, subjugar a Líder desse jeito..."
22110-35 = "...Ela tava usando um troço esquisito."
22110-36 = "[s] \"...Ela disse que era um \"armamento\" que a Rio deu a ela.\""
22110-37 = "Ei, Sensei."
22110-38 = "Por que aquela baixinha..."
22110-39 = "...foi embora com a Rio mesmo depois de ouvir que ela ia destruir o halo dela?"
22110-40 = "Ela entendeu o que aquilo significava e aceitou ir mesmo assim?"
22110-41 = "Ei... por que a Rio disse uma coisa daquelas pra uma baixinha que só sabe jogar videogame um pouco bem?"
22110-42 = "Só eu que não tô entendendo?#nEi, me fala logo... o que diabos é tudo isso?"
22110-43 = "Neru-senpai..."
22110-44 = "[s] \"Por enquanto... vamos organizar a situação.\""
22110-46 = "(Enquanto a Momoi ainda não recobrava a consciência, a Aris foi sequestrada pela Rio —)"
22110-47 = "(E então, a Rio nos declarou que seu objetivo é destruir o halo da Aris)"
22110-49 = "Ou seja, \"Aris\".#nVocê é —"
22110-50 = "O \"Rei Demônio\" que nasceu para destruir este mundo."
22110-52 = "Ah... será que ficou difícil de entender?"
22110-53 = "Em resumo — se destruirmos o seu halo, o problema estará resolvido."
22110-55 = "Sensei, a Aris-chan é...#nComo a Presidente disse, será que ela é mesmo..."
22110-56 = "...um \"Rei Demônio\"?"
22110-57 = "[s] \"Midori...\""
22110-61 = "Eu..."
22110-62 = "Eu... não..."
22110-63 = "Não consigo... entender direito..."
22110-64 = "Eu quero ouvir direito o que a Aris-chan sente e conversar com ela..."
22110-65 = "Quero convencer a Presidente de que a Aris-chan não é nada disso...#nDe que ela não é nenhum \"Rei Demônio\"..."
22110-66 = "Eu..."
22110-67 = "Nós..."
22110-72 = "Sensei, o que a gente deveria fazer?"
22110-76 = "[ns] \"...\""
22110-78 = "Momoi..."
22110-81 = "Ressurgiu!"
22110-82 = "Mana?!"
22110-83 = "[s] \"Momoi...! Você está bem?! E os ferimentos?!\""
22110-84 = "Meu corpo tá ótimo! Dormi super bem, então meu HP tá 100% recuperado!"
22110-85 = "Isso mesmo... agora eu sou uma guerreira que pegou poções na prateleira#ne upou além do nível recomendado para a próxima fase...!"
22110-86 = "Não temo nada, estou no modo estudante super buffada!"
22110-87 = "Mana..."
22110-88 = "Mana... a Aris-chan... a Aris-chan!"
22110-94 = "Uaaah!!? O que foi, o que foi?!"
22110-95 = "A Midori tá no \"modo carente por um dia\" de quando lê comentários de haters no dia anterior!? Por quê?!"
22110-99 = "Momoi, a Aris-chan..."
22110-102 = "Seus bobos!!"
22110-104 = "M-Mana?"
22110-105 = "Momoi...?"
22110-107 = "Sinceramente, eu não entendo direito essas coisas complicadas, mas...!"
22110-108 = "Ouvir tudo o que vocês disseram deu um aperto no meu peito...#nNem consigo organizar direito as palavras, sabe..."
22110-109 = "Mas tem uma coisa de que eu tenho certeza absoluta!"
22110-110 = "...Certeza?"
22110-111 = "Que a gente não aceita essa situação de jeito nenhum!!"
22110-112 = "Sinceramente, se a Aris é um \"Rei Demônio\" ou sei lá o quê, isso não importa!"
22110-113 = "Eu não quero me despedir da Aris desse jeito!"
22110-114 = "As últimas palavras da Aris nem foram uma despedida de verdade!"
22110-115 = "Nem um final decente isso é! É horrível!"
22110-116 = "Por isso eu quero trazer a Aris de volta! Eu vou lá buscar ela!#nVocês não pensam igual?!"
22110-117 = "Mana..."
22110-118 = "Momoi..."
22110-122 = "...Sim, você tem razão."
22110-128 = "Ei, baixinha."
22110-129 = "Ai!? O-O que foi... Neru-senpai?"
22110-130 = "Você —"
22110-132 = "Até que você falou bonito!"
22110-133 = "S-Sério...?"
22110-134 = "Você tem razão. Não tem pra que ficar quebrando a cabeça.#nSe levou um soco, é só devolver."
22110-135 = "Se roubaram algo da gente, é só ir lá e pegar de volta. Simples assim."
22110-136 = "E aí, o que vocês acham?#nAkane, Asuna, Karin."
22110-138 = "Fufu... precisa mesmo colocar em palavras?"
22110-139 = "Se essa é a decisão da Líder."
22110-140 = "Tô dentro~♪"
22110-142 = "...Sensei,"
22110-143 = "Por favor! Empresta a sua força pra gente!"
22110-147 = "[ns] \"Momoi... pessoal...\""
22110-149 = "[ns] \"Entendido. Vamos pensar juntos num jeito de trazer a Aris de volta.\""
22110-151 = "Próximo;Reunião Estratégica"
