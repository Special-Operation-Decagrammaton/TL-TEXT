[translation]
22110-1 = "Эпизод 11; И всё же!"
22110-2 = "...Значит, президент забрала Алису?"
22110-3 = "Эмм... Разве это не очень опасная ситуация?"
22110-4 = "Да, это явно чрезвычайная ситуация."
22110-6 = "Причина, по которой президент Рио позвала только Неру..."
22110-7 = "...в том, что она заранее знала, как Неру отреагирует."
22110-8 = "Как подло! Она забрала Алису и ещё поиздевалась над лидером!"
22110-10 = "*вздыхает*"
22110-11 = "...Неру?"
22110-12 = "[s] «Неру...? Что случилось? Ты нигде не ранена?»"
22110-13 = "Она забрала мелкую. А я... я, чёрт возьми, ничего не смогла сделать."
22110-14 = ""
22110-15 = "Это..."
22110-16 = "Это не твоя вина, Неру. Она устроила засаду и загнала тебя в нечестный бой."
22110-17 = "Точно! Такое не считается!"
22110-19 = "Ты сказала бы то же самое, если бы провалила задание из-за засады?"
22110-20 = ""
22110-22 = ""
22110-23 = "Ну..."
22110-25 = "Она легко одолела меня, президента C&C, и я позволила им забрать Алису."
22110-26 = "Она представилась позывным Ноль-Четыре."
22110-27 = "Сказала, что её зовут Токи. Акане, ты её знаешь?"
22110-28 = "Знаю ли? Хмм..."
22110-29 = "Скажем так, я знала о её существовании."
22110-30 = "Позывной Ноль-Четыре числилась в C&C, как и мы, но была закреплена исключительно за Президентом Рио."
22110-31 = "То есть можно сказать, что она телохранитель Рио."
22110-32 = "Но сегодня я впервые увидела её и впервые услышала её имя..."
22110-33 = "Не думала, что она станет использовать кого-то такого ради этого дела..."
22110-34 = "И мало того — она была достаточно сильна, чтобы одолеть Неру..."
22110-35 = "...Она использовала что-то странное."
22110-36 = "[s] «Точно... Это то, что Рио назвала \"оружием\"?»"
22110-37 = "Эй, Сенсей."
22110-38 = "Почему мелкая пошла за Рио без сопротивления?"
22110-39 = "Ей сказали, что уничтожат её нимб, так почему?"
22110-40 = "Она вообще поняла, что это значит, прежде чем уйти?"
22110-41 = "Она только и делает, что играет в видеоигры и ходит в приключения. Зачем Рио наговорила ей столько ужасного? Заставила чувствовать, будто она не заслуживает жить?"
22110-42 = "Я одна ничего не понимаю? Что... Что она вообще сделала не так?"
22110-43 = "Неру..."
22110-44 = "[s] «Давайте сначала спокойно разберёмся в ситуации.»"
22110-46 = "Пока Момои была без сознания, Рио похитила Алису."
22110-47 = "Рио сказала, что её цель — уничтожить нимб Алисы."
22110-49 = "Алиса, по сути твоё существование..."
22110-50 = "...равнозначно существованию тёмного владыки, рождённого уничтожить этот мир."
22110-52 = "Это оказалось слишком сложно для понимания? Тогда скажу проще."
22110-53 = "Твой нимб должен быть уничтожен."
22110-55 = "Сенсей, как сказала Рио, неужели Алиса правда..."
22110-56 = "...повелитель демонов?"
22110-57 = "[s] «Мидори, это...»"
22110-58 = ""
22110-60 = ""
22110-61 = "Я..."
22110-62 = "Я хочу..."
22110-63 = "Не знаю..."
22110-64 = "Я хочу поговорить с Алисой. Хочу услышать, что она думает..."
22110-65 = "Я хочу убедить Рио, что Алиса... совсем не похожа на повелителя демонов..."
22110-66 = "Я..."
22110-67 = "Мы должны..."
22110-68 = ""
22110-70 = ""
22110-71 = ""
22110-72 = "Сенсей... Что нам теперь делать?"
22110-73 = ""
22110-75 = ""
22110-76 = "[ns] «...»"
22110-78 = "Я..."
22110-79 = ""
22110-81 = "Я восстала!"
22110-82 = "Момои?!"
22110-83 = "[s] «Момои...! Как ты себя чувствуешь? Как твои раны?!»"
22110-84 = "Я в порядке! Всё уже зажило! Я всё проспала и теперь готова в путь!"
22110-85 = "Я Герой, который пополнил все зелья, набрал достаточно экспы для повышения уровня и перешёл на следующий этап!"
22110-86 = "Я суперусиленный персонаж, которому больше нечего бояться!"
22110-87 = "Момои..."
22110-88 = "Момои... Алиса... Алиса...!"
22110-89 = ""
22110-91 = ""
22110-94 = "Ого! Это что такое?!"
22110-95 = "Почему Мидори такая прилипчивая? Будто ей только что накидали кучу злых комментариев в интернете!"
22110-96 = ""
22110-98 = ""
22110-99 = "Момои, Алиса..."
22110-102 = "Глупцы!"
22110-104 = "Э-Эй...?"
22110-105 = "Момои...?"
22110-107 = "Хмм... Не уверена, что всё до конца понимаю..."
22110-108 = "После вашего рассказа я даже не могу толком объяснить всё, что чувствую, и на душе тяжело..."
22110-109 = "Но одно ясно точно!"
22110-110 = "Что?"
22110-111 = "Мы не можем и не станем мириться с этой ситуацией!"
22110-112 = "Мне плевать, повелитель демонов Алиса или кто там ещё!"
22110-113 = "Она наша подруга! Мы не можем просто так её отпустить!"
22110-114 = "То, что она сказала перед уходом... такое прощание меня не устраивает!"
22110-115 = "Это не может быть концом! Это худший финал!"
22110-116 = "Я хочу вернуть Алису! Я пойду за ней! Все согласны?"
22110-117 = "Эй..."
22110-118 = "Момои..."
22110-119 = ""
22110-121 = ""
22110-122 = "...Да. Она права."
22110-123 = ""
22110-125 = ""
22110-127 = ""
22110-128 = "Эй, мелкая."
22110-129 = "Воа?! Ч-Что...? Д-Да, Неру?"
22110-130 = "Ты..."
22110-132 = "Хорошая речь."
22110-133 = "...?"
22110-134 = "Ты права. Незачем всё усложнять. Нам нужно просто сделать то, что у меня получается лучше всего: напасть."
22110-135 = "Она забрала её у нас, значит теперь мы пойдём и заберём обратно."
22110-136 = "Что скажете, Акане, Асуна, Карин?"
22110-137 = ""
22110-138 = "Хи-хи... Больше ни слова."
22110-139 = "Если таково твоё решение..."
22110-140 = "Я этого ждала!"
22110-142 = "Итак, Сенсей!"
22110-143 = "Пожалуйста! Одолжите нам свою силу!"
22110-144 = ""
22110-146 = ""
22110-147 = "[ns] «Момои... все...»"
22110-149 = "[ns] «Хорошо. Давайте подумаем, как вернуть Алису.»"
22110-151 = "Следующий Эпизод: Стратегическое совещание"
