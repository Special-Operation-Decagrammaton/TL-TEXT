[translation]
70009020-1 = "И всё же Префектурный совет продолжает работу 2"
70009020-3 = "*вздох* ...Наконец-то."
70009020-7 = "Ну и денёк. Я выжата."
70009020-8 = "Хорошо, что капитан Совета подоспела вовремя. Если бы не она... Ух. Даже думать не хочу."
70009020-9 = ""
70009020-11 = ""
70009020-12 = ""
70009020-13 = "А, точно. Моя картина..."
70009020-14 = ""
70009020-16 = ""
70009020-17 = "Да и ладно. День был ужасный, я заслужила свободный вечер. Займусь завтра!"
70009020-18 = ""
70009020-20 = ""
70009020-21 = "Ах! О, кровать, как же я по тебе скучала."
70009020-22 = ""
70009020-24 = ""
70009020-25 = "...Сколько дней уже прошло с тех пор, как я держала палитру...?"
70009020-26 = "Займусь. Беспокоиться бессмысленно. Лучше поспать, пока есть возможность. Это ведь полезно для вдохновения, да?"
70009020-27 = "*зевает* ...Спокойной ночи, картина."
70009020-28 = ""
70009020-30 = ""
70009020-32 = "БАМ! БАБАБАМ!!"
70009020-33 = "Гах?! Ч-Что происходит?!"
70009020-34 = "Кто в такой час басы наваливает...? Ух, кто же ещё."
70009020-35 = "Опять за своё! Вообще-то некоторые люди пытаются выспаться!"
70009020-36 = "Это Клуб фоновой музыки! Кто-нибудь, заглушите их ужасные биты!"
70009020-37 = ""
70009020-39 = ""
70009020-40 = "Всем агентам доложиться! Сбор в северном коридоре через 5 минут! Повторяю! ВСЕМ ВСТАТЬ!"
70009020-41 = "А, а-а-а..."
70009020-42 = "...*вздох* А какой у меня выбор?"
70009020-45 = ""
70009020-46 = ""
70009020-48 = ""
70009020-49 = "...Примерно 7 минут назад мы обнаружили признаки того, что Клуб свободных прогулок пытается сбежать, перелезая через северо-западную стену академии."
70009020-50 = "ОПЯТЬ они?!"
70009020-51 = "Это уже четвёртый раз за месяц! Они вообще спят?!"
70009020-52 = ""
70009020-54 = ""
70009020-55 = "Наша первоочередная задача — остановить побег, а затем задержать президента Клуба свободных прогулок. Всем понятно?"
70009020-56 = "Эм, вообще-то у меня вопрос."
70009020-57 = "Мы так и оставим Клуб фоновой музыки снаружи? Со всего двора уже жалобы идут."
70009020-58 = "Хм, оставьте Клуб фоновой музыки в покое. Приказа на их арест мы не получали."
70009020-59 = "Но тогда студенты не смогут спа—"
70009020-60 = "Теперь мой вопрос. Что произойдёт, если все музыканты оркестра проигнорируют дирижёра и начнут играть кто во что горазд?"
70009020-61 = "А? Эм... Музыка будет звучать... плохо?"
70009020-62 = "Именно. Капитан Совета не отдавала приказ об аресте. Мы не спрашиваем почему. Наша задача — лишь выполнить порученную миссию на достойном уровне."
70009020-63 = "Не пытайтесь понять приказ... Доверьтесь ему! Доверьтесь весу принесённой вами присяги!"
70009020-64 = "О, понятно...! Кажется, я чувствую это доверие...!"
70009020-66 = "(...Мне всё равно. Давайте просто поскорее закончим!)"
70009020-68 = ""
70009020-70 = ""
70009020-72 = "Префектурный совет! В АТАКУ!"
70009020-74 = "У стены школы Вайлдхант"
70009020-76 = "*тяжело дышит* *тяжело дышит*"
70009020-77 = "Почему? Почему именно сейчас? Посреди ночи? Ух... Почти пришли!"
70009020-78 = ""
70009020-80 = ""
70009020-83 = ""
70009020-86 = "Принято. Что?! Нет, я... понимаю. Поняла."
70009020-87 = ""
70009020-89 = ""
70009020-91 = "Всем подразделениям, стоять!"
70009020-92 = ""
70009020-95 = "...Да?"
70009020-96 = "Вернуться во двор. Приказ немедленно арестовать Клуб фоновой музыки!"
70009020-97 = "...А?"
70009020-99 = "А как же Клуб свободных прогулок? Мы весь путь сюда проделали..."
70009020-100 = "Почему мы не арестовали Клуб фоновой музыки раньше? Они устраивали рейв, а мы прошли прямо мимо!"
70009020-102 = "Капитан Совета поставила в приоритет заключение Клуба фоновой музыки под стражу. Крайне важно обеспечить студентам комфортный отдых!"
70009020-103 = "И всё же... я понимаю ваше недовольство."
70009020-104 = "...О?"
70009020-105 = "Мы пришли сюда задержать Клуб свободных прогулок, а теперь нам велят отступать. Такое решение и правда может показаться совершенно непонятным."
70009020-107 = "(Она наконец поняла...?)"
70009020-108 = "(Ещё чуть-чуть. Может, она наконец возразит—)"
70009020-110 = "...А всё потому, что капитан Совета невероятно умна. Поэтому она и командует!"
70009020-111 = "Вперёд, девушки! Это возвращение, а не отступление! Приказ капитана Совета абсолютен. Шевелитесь!"
70009020-112 = ""
70009020-115 = ""
70009020-116 = "...Ах..."
70009020-117 = "Вы серьёзно?!"
70009020-118 = ""
70009020-121 = "Да что, чёрт возьми, не так с этой школой?!"
70009020-122 = ""
70009020-125 = "И всё же Префектурный совет продолжает работу"
