[translation]
10058090-1 = "Episode 9;Giving It Everything"
10058090-2 = "Helllooo? You're from Class 183, right?"
10058090-6 = "……."
10058090-9 = "Why are you suddenly making weird faces? Well, you're weird to begin with, I guess."
10058090-10 = "Shh! Shh! We're pretending we can't connect, so read the room!"
10058090-11 = "There's no way the organizers are calling with good news!"
10058090-12 = "Y-You're right…!"
10058090-13 = "No, no, no! This isn't about any fouls or disqualifications, so don't worry!"
10058090-14 = "Well, since the number of remaining teams has dwindled down…#nper tournament rules, we will now announce the positional data of each team."
10058090-15 = "We look forward to an intense match between the Pandemonium Society's Puppy-go from the Class 183 Special Class and the Prefect Team's Toramaru-go!"
10058090-16 = "Now, I shall return to the broadcasting booth!"
10058090-17 = "Eh? Ah, yes…."
10058090-20 = "There aren't many teams left!? Seriously!?"
10058090-21 = "And our opponent is that Toramaru-go? Yikes!"
10058090-22 = "True. It looks like our respective locations are marked on the map, roughly speaking…."
10058090-23 = "Hmm…."
10058090-24 = "Erina, this means…"
10058090-25 = "Nn… well… how should I put it…."
10058090-26 = "We're being targeted."
10058090-27 = "Right! As expected, Lana is the smartest one here~!"
10058090-28 = "Looks like the target they just destroyed over there was their last one."
10058090-29 = "That would mean Iroha's group is closer to the finish line once they hit it."
10058090-30 = "Our speed is higher, so we could overtake them, but…"
10058090-31 = "If we take a clumsy detour, they'll reach the goal first."
10058090-32 = "But fighting them head-on means game over in an instant."
10058090-33 = "They must be aware of this situation too, so…"
10058090-34 = "It's going to come down to a frontal clash after all."
10058090-35 = "There's also the option of playing it safe after they reach the goal."
10058090-36 = "We'd secure second place for sure, and…"
10058090-37 = "That might just be the smartest choice~"
10058090-41 = "I know. We're not doing that.#nGetting this way was suuuuper tough!"
10058090-43 = "Everyone else fought with all their heart…#nso there's no way we're just going to run away!"
10058090-45 = "That's right. We didn't get here purely on our own strength, either."
10058090-47 = "Now that we've started, I want to see a proper ending."
10058090-49 = "Let's go! We're going to prove that the Puppy-go is the greatest tank!"
10058090-50 = "Erina, give us your highest-penetration shell!"
10058090-51 = "Every night, we're going to boil water in the championship cup to make tea!"
10058090-52 = "And I'll have cereal every morning—"
10058090-63 = "Class 183, let's make this a huge success!"
10058090-65 = "“Class 183, let's make this a huge success!”—what a lovely rallying cry!"
10058090-66 = "Will the championship cup that Gehenna has protected for so long…#nultimately fall into Red Winter's hands?"
10058090-67 = "I'm also quite curious about how they plan to boil water in the championship cup!"
10058090-68 = "Now, it's finally time for the decisive battle of fate!"
10058090-69 = "Chiaki-senpai! One of the other seniors gave me a memo, and it says \"volcanic ash\"—what's that?"
10058090-70 = "Ibuki-chan.#nVolcanic ash is like dust that comes out when a volcano erupts!"
10058090-71 = "According to information, the activity of the volcano located near the end of the course is intensifying!"
10058090-72 = "How the volcanic ash will affect the race, such as worsening visibility, is another major highlight!"
10058090-73 = "Will Iroha Natsume from the Gehenna Academy Pandemonium Society#nmanage to defend the \"Toramaru-go\"!?"
10058090-74 = "Will Anna Niki from the Red Winter Federal Academy Class 183 Special Class#n snatch their very first title with the \"Puppy-go\"!?"
10058090-75 = "Let us witness the clash between the fierce tiger and the fierce hound! Now, connecting to the on-site camera!"
10058090-79 = "Cough, cough."
10058090-80 = "It feels like the eruption is getting more intense…."
10058090-81 = "True… there don't seem to be any pyroclastic flows, but the volcanic ash is crazy."
10058090-82 = "Lana, how's the engine?"
10058090-83 = "The temperature is rising in proportion to the surrounding air, but it's still holding up."
10058090-84 = "Ugh, the volcanic ash is piling up… I should've attached a roof."
10058090-85 = "Though that probably would've been inconvenient in various ways.#nWe couldn't have predicted an environment like this, so it can't be helped."
10058090-86 = "Class 183 Special Class, Puppy-go team. Pardon me for cutting into the common channel."
10058090-87 = "This is the Pandemonium Society's Toramaru team. Iroha Natsume, tank commander."
10058090-90 = "Did she just say the Toramaru team!?"
10058090-91 = "U-Um, what do you need…?"
10058090-92 = "We've both worked hard today, so let's take a break and chat."
10058090-93 = "There are a few things I'd like to confirm, too.#nRest assured, I won't attack you."
10058090-94 = "Please proceed to the 2 o'clock position. I'll keep our turret pointed backward."
10058090-95 = "What are they plotting?"
10058090-96 = "Hmm, what could it be?… Huh?#nThey were right over there just a moment ago, but now we can't see them because of the volcanic ash."
10058090-97 = "If we spot them first, can we just attack?"
10058090-98 = "Maybe she really does want to talk. She's probably bored."
10058090-99 = "No way. Even if she's bored, it can't be that."
10058090-100 = "…Understood. We don't have a turret, so we can't do anything anyway."
10058090-101 = "Feel free to shoot if you want to. We won't back down from a challenge."
10058090-102 = "Then let's meet up and talk in person."
10058090-106 = "…Are they looking down on us?"
10058090-107 = "Let's just go hear what she has to say~. Hypotheses need to be tested."
10058090-108 = "Lana, be careful on the way!"
10058090-119 = "We've arrived. I am Anna Niki, class representative of the Class 183 Special Class."
10058090-124 = "You've arrived."
10058090-125 = "Hmph…."
10058090-126 = "W-What is it you wanted to talk about…?"
10058090-127 = "I am a competitor, but I'm also acting as an administrator for this tournament.#nThere are a few things I'd like to confirm."
10058090-128 = "Is the tank operating normally? Are there any issues with the weaponry or movement?"
10058090-129 = "Of course! We've already taken down two tanks to get this far!"
10058090-130 = "Understood. I will log that you are capable of continuing the race."
10058090-131 = "Volcanic ash is falling. Do you have any intention of forfeiting?"
10058090-132 = "No way! We are not—ever—doing that!"
10058090-133 = "Understood. I'm not trying to provoke you, so please don't take it the wrong way."
10058090-134 = "If there is a risk of severe danger to the competitors,#nthe match can be called off if a majority of the remaining contestants agree."
10058090-135 = "Your tank doesn't seem to have a roof, will you be alright?#nThe volcanic ash is only going to get heavier from here."
10058090-136 = "I agree to call it off. There will be plenty of other races in the future,#nand I'm not particularly hung up on winning."
10058090-137 = "If you all agree…#nthe race will be called off as-is, and we will both be treated as runners-up."
10058090-138 = "Fluffy-san, are you not going to eliminate us and take the win?"
10058090-139 = "F-Fluffy-san?"
10058090-140 = "As I said earlier…#nunless your side makes the first move, I have no intention of fighting."
10058090-141 = "Are you looking down on us, by any chance?"
10058090-142 = "No, that's not it.#nIt's a matter of preference, or perhaps conviction… You could even call it a habit."
10058090-143 = "What will you do?#nI wouldn't consider you cowards even if you chose to forfeit right here, you know?"
10058090-146 = "Erina."
10058090-147 = "Lana."
10058090-148 = "Anna."
10058090-149 = "We decline!"
10058090-150 = "We've decided to give it everything we've got!"
10058090-151 = "Sure, there are other tournaments out there, but…#nthis is the only chance we get to go all out in this one!"
10058090-152 = "At first, we just came along because we wanted to join in…#nbut now, we suuuuper want to win!"
10058090-153 = "To find out just how far the tank the three of us built can go,#nwe want to fight to the very end."
10058090-154 = "Because a tank that never gives up is cool."
10058090-155 = "And besides…."
10058090-156 = "We want to win properly and tell our past failures, \"In your face!\""
10058090-157 = "Anna…!"
10058090-158 = "V!"
10058090-159 = "So with that said, we're terribly sorry, but we won't hand over a solo victory!"
10058090-160 = "We're never giving up… No, giving up is just impossible!"
10058090-161 = "Ho."
10058090-162 = "You all look very different in the eyes compared to the start. A good change."
10058090-163 = "Where did the people who were saying, \"It's scary~ make it stop~\" go?"
10058090-164 = "Fuel-waster, be quiet…!"
10058090-165 = "Fufufu!"
10058090-166 = "Very well.#nFrom here on, we'll circle this volcano in opposite directions, and it's a duel the moment we encounter each other."
10058090-167 = "Toramaru team, all hands mount up! Start engines!"
10058090-172 = "I-I actually said it…."
10058090-173 = "I went and provoked a giant heavy tank and the absolute monarch…."
10058090-174 = "?"
10058090-175 = "Want to take it back now?"
10058090-176 = "No way!!!"
