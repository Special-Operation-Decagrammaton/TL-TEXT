[translation]
10058090-1 = "Episode 9;Give It Our All"
10058090-2 = "Hellooo? This IS Team 183, right?"
10058090-6 = "..."
10058090-9 = "Why're you making such a weird expression? Well, you always are, but still."
10058090-10 = "Shush! Shush! I'm pretending we're not here! Read the room!"
10058090-11 = "There's no way the organizers would be calling us with good news!"
10058090-12 = "Y-You're right, actually...!"
10058090-13 = "No no no! This isn't about a foul or a disqualification! Don't worry!"
10058090-14 = "Let's see, since there aren't many teams left... #nIn accordance with the rules of this tournament, we'll be revealing the position of all remaining teams."
10058090-15 = "I'll be looking forward to an intense showdown between 183's Puppy and#nthe Pandemonium Society's Toramaru!"
10058090-16 = "Now then, it's time for me to return back to the commentary stand!"
10058090-17 = "Huh? Ah, sure..."
10058090-20 = "There's only a few teams left!? Seriously!?"
10058090-21 = "And we're up against THE Toramaru!? This is bad!"
10058090-22 = "She wasn't kidding. Even if it's not exact, the map now shows everyone's#npositions..."
10058090-23 = "Hmmm..."
10058090-24 = "Erina, isn't this..."
10058090-25 = "Nhh... Well... How do I put it..."
10058090-26 = "We're being put in check."
10058090-27 = "That's it! That's why you're the smartest, Ranaaa!"
10058090-28 = "It seems like the target we just destroyed is their final target."
10058090-29 = "If that's true, then after hitting it, Iroha-san's team would be able to reach the goal#nbefore us."
10058090-30 = "Our speed is higher so we could theoretically overtake them..."
10058090-31 = "If we wimp out and try to take a detour, they'll reach the goal first though."
10058090-32 = "But if we face them head on, it's immediately game over for us."
10058090-33 = "They're definitely aware of this as well..."
10058090-34 = "It looks like this'll be a direct showdown then..."
10058090-35 = "Well, we could always let them reach the goal first. There'd be no risk that way."
10058090-36 = "It'd at least guarantee us second place..."
10058090-37 = "Honestly? This is probably the smarter choice."
10058090-41 = "But yeah, I get it. Obviously, we're not doing that. #nIt was a huuuuge pain just to get this far!"
10058090-43 = "Everyone's been fighting with everything they've got... #nNo way we're gonna be the only ones to run away!"
10058090-45 = "You're right. It's not like we made it this far with just our own strength."
10058090-47 = "Since we're already in this, we should see it all the way through."
10058090-49 = "Then let's do this! Let's prove that Puppy is the strongest tank out there!"
10058090-50 = "Erina, load whatever shell has the most penetration!"
10058090-51 = "I swear, I'm gonna boil water in that trophy cup every night to make tea!"
10058090-52 = "Then I'll have cereal out of it every morning."
10058090-63 = "Let's make this a huge success, 183!"
10058090-65 = "\"Let's make this a huge success, 183!\" What a fantastic battle cry!"
10058090-66 = "Will the championship trophy held onto by Gehenna for so long, #nfinally be snatched away by Red Winter?"
10058090-67 = "I'm also curious how she's planning to boil water in that thing!"
10058090-68 = "Now then, it's finally time for the final, fateful showdown!"
10058090-69 = "Chiaki-senpaai! The other senpais gave me this note, but what is \"volcanic ash?\""
10058090-70 = "Ibuki-chan. Volcanic ash is basically the dust-like stuff that comes out of a volcano when it erupts!"
10058090-71 = "According to our reports, the volcano near the end of the course is starting to#nbecome active!"
10058090-72 = "It'll be veeery interesting to see how the ash affects the rest of this race! #nFor example, the poor visibility it causes!"
10058090-73 = "Will Natsume Iroha from Gehenna's Pandemonium Society #nsuccessfully defend her title as the champion with Toramaru!?"
10058090-74 = "Or will Niki Anna from Red Winter's Spec Ops No. 183 #nscore her very first title with Puppy!?"
10058090-75 = "Let's witness this ultimate showdown between a fierce tiger and a fierce dog!#nNow back over to our camera on-site!"
10058090-79 = "*Cough cough*"
10058090-80 = "It feels like the eruption is intensifying..."
10058090-81 = "You're right... There doesn't seem to be any pyroclastic flows, but there's a crazy#namount of ash."
10058090-82 = "Rana, how is the engine doing?"
10058090-83 = "The temperature is rising in proportion with our surroundings, but it's otherwise#nstill fine."
10058090-84 = "Ugh, the ash's piling up... We shoulda really put a roof or something on."
10058090-85 = "It probably would've come with its own share of problems, to be honest. #nPlus, we didn't even know we'd be fighting somewhere like this."
10058090-86 = "Hailing the crew of Spec Ops No. 183's Puppy via the public channel."
10058090-87 = "This is Natsume Iroha, the commander of Team Toramaru from the Pandemonium#nSociety."
10058090-90 = "Did she just say Team Toramaru!?"
10058090-91 = "Wh-what can we do for you...?"
10058090-92 = "Both of our teams have been working hard. Let's take a small break and have a#nchat."
10058090-93 = "There are several things I'd like to check with you. #nRest assured. We don't intend to shoot you."
10058090-94 = "Advance in your 2 o'clock direction. We'll keep our turret pointed away."
10058090-95 = "Do you think she's scheming something?"
10058090-96 = "Mmm, who knows? ...Huh? #nI was able to see them over there just a second ago, but not anymore. The ash is way too thick."
10058090-97 = "If you're sure you saw them over there, do you think we could just shoot them?"
10058090-98 = "I think she really does want to talk, though. She's probably bored."
10058090-99 = "There's no way someone could be bored enough to do that."
10058090-100 = "...All right. Not like we can do much anyways since we don't have a turret."
10058090-101 = "You're free to shoot if you'd like. Just know I'm not one to turn down a challenge."
10058090-102 = "That's all. Let's talk again in person."
10058090-106 = "...Do you think she's looking down on us?"
10058090-107 = "Leeet's just do what she says for now. We need to confirm our hypothesis."
10058090-108 = "Rana, be careful on the way over."
10058090-119 = "We've arrived. I'm Spec Ops No. 183's class president, Niki Anna."
10058090-124 = "You've come."
10058090-125 = "Hmm."
10058090-126 = "S-So what did you want to talk about...?"
10058090-127 = "While I am one of the competitors, I'm also part of the management team for#ntournament. There are several things I would like to confirm."
10058090-128 = "Is your tank functioning normally? Are there any problems with your gun or your mobility?"
10058090-129 = "Everything perfectly fine! We've even taken out two tanks throughout this race!"
10058090-130 = "Got it. Then I'll record that you're capable of continuing the race."
10058090-131 = "With the current volcanic ash, do you have any plans to withdraw from the race?"
10058090-132 = "Dream on! There's absolutely noooo way we'd bail out now!"
10058090-133 = "Got it—and if it sounded like I was trying to provoke you, please understand that it#nwasn't intentional."
10058090-134 = "If there is a risk that a player may be put in serious danger, #nthen the race can be called off if a majority of players agree to it."
10058090-135 = "Will you be fine without a roof on your tank? #nThe volcanic ash will only worsen from here."
10058090-136 = "I personally wouldn't mind stopping the race. There are still many other races to#ncome after this, and I'm not especially fixated on winning."
10058090-137 = "If you all agree to it as well... #nThen this race will be called off and both teams will be treated as runner-ups."
10058090-138 = "Fluffy-san, are you not going to eliminate us and take the win?"
10058090-139 = "Fl...Fluffy-san?"
10058090-140 = "As I mentioned before... #nI have no intention on fighting unless you strike first."
10058090-141 = "Are you looking down on us?"
10058090-142 = "Not at all. #nYou could call it a desire, a belief... perhaps even a habit of mine."
10058090-143 = "So what will you choose? #nJust know that I won't think any less of you for choosing to drop out."
10058090-146 = "Erina."
10058090-147 = "Rana."
10058090-148 = "Anna."
10058090-149 = "We refuse!"
10058090-150 = "We've decided we're gonna take this on with everything we've got!"
10058090-151 = "Yeah, sure. There might be other tournaments... #nBut right now is the only time we can give it our all on this one!"
10058090-152 = "At first, I came here only wanting to participate... #nBut now, I want nothing more than to win it all!"
10058090-153 = "I also want to know how far the tank that we made can go, #nso I'll choose to fight until the end."
10058090-154 = "A tank that never gives up is very cool, after all."
10058090-155 = "Besides..."
10058090-156 = "I want to win this fair and square and give my past failures a big \"in your face!\""
10058090-157 = "Anna...!"
10058090-158 = "Peace!"
10058090-159 = "With that said, I'm truly sorry, but we're going to be the ONLY winners of this race!"
10058090-160 = "We definitely won't give up... Actually, giving up isn't even an option!"
10058090-161 = "Hoh?"
10058090-162 = "The look in your eyes have changed since the start. It's a welcome change."
10058090-163 = "Oh, I do wonder where the girl that was screaming \"It's scary! Let's stop!\" went."
10058090-164 = "Shut your mouth you fuel waster...!"
10058090-165 = "Heheheh!"
10058090-166 = "Very well. Then we'll head in opposite directions now around the volcano.#nIf we meet—we duel."
10058090-167 = "Team Toramaru, to your stations! Start the engine!"
10058090-172 = "W-We really said it..."
10058090-173 = "We've just made that humongous heavy tank our enemy AND provoked the#nundefeated champion..."
10058090-174 = "?"
10058090-175 = "Want to take back your words then?"
10058090-176 = "Absolutely not!"