[translation]
10033030-1 = "Эпизод 3;Приятно познакомиться"
10033030-2 = "Надеюсь, всем понравилась поездка сюда."
10033030-3 = "Если прищуриться, там, далеко впереди, можно увидеть нашу следующую остановку: обсерваторию!"
10033030-4 = ""
10033030-7 = ""
10033030-8 = "Атмосфера здесь, типа, вообще другая. Мне нравится оформление!"
10033030-9 = "В Геенне такого точно не встретишь."
10033030-10 = "О-о, идеальное место для селфи. Эрика, иди сюда!"
10033030-11 = "Хорошая идея! Тогда..."
10033030-12 = "Ах! Ты права. Все, давайте сфоткаемся! И вы тоже, милые экскурсоводы!"
10033030-14 = "М-мы тоже?"
10033030-16 = "Теперь вы часть нашей компании, так что должны быть на фото! Кстати, я Кирара. Ёдзакура Кирара!"
10033030-17 = "Хатами Эрика."
10033030-19 = "П-полагаю, фотографии — важный ритуал дружбы, символизирующий преданность и товарищество... Хорошо!"
10033030-20 = "Приятно познакомиться! Меня зовут Асахина Пина, я одна из ваших экскурсоводов в этой поездке!"
10033030-21 = "О-ой! Точно. Я Сатохама Умика... Мне ещё многому нужно научиться, но я сделаю всё возможное, чтобы эта поездка запомнилась вам."
10033030-22 = "Я Каэдэ! Исами Каэдэ! Я тренируюсь, чтобы стать идеальной настоящей леди!"
10033030-24 = "Тренируешься? Но вы уже настоящая леди, госпожа Каэдэ! Хахаха!"
10033030-25 = "Т-ты правда так думаешь? Серьёзно? Хи-хи-хи! Вот Мимори удивится, когда я ей расскажу!"
10033030-26 = "Но это не значит, что я стану халтурить на тренировках! Я стану ещё совершеннее, обещаю!"
10033030-27 = "Касуга Цубаки... *зевает* Если будет трудно уснуть, у меня есть подушки, маски для сна, одеяла, беруши... Всё, что нужно."
10033030-28 = "Спасибо, но заставить этих хулиганок успокоиться и поспать во время экскурсии — задача не из простых."
10033030-30 = "Цубаки! Ты уверена, что именно так хочешь позировать для фото?"
10033030-31 = "*зевает* Ага... Всё нормально."
10033030-32 = ""
10033030-34 = ""
10033030-37 = "Все готовы?"
10033030-38 = ""
10033030-39 = ""
10033030-42 = "Да, мэм! Умика, все, скажите «сыр»!"
10033030-43 = "Хорошо! С-сыр!"
10033030-44 = ""
10033030-45 = ""
10033030-54 = "Раз... Два..."
10033030-56 = "Три!"
10033030-62 = ""
10033030-63 = "Дай посмотреть... Ура! Как мило! Дайте мне свои номера, я отправлю вам фотографию. И заодно у вас будет мой номер."
10033030-64 = "Думаю, вы уже заметили, но Кирара вообще не знает, что такое личные границы. Если тебе станет некомфортно, просто скажи мне."
10033030-70 = ""
10033030-71 = "Молодцы, что добрались до самой обсерватории."
10033030-72 = "Отсюда открывается идеальный вид на Древо божеств. Это важный символ Хяккияко, который мы всегда глубоко почитали."
10033030-73 = "И вы только посмотрите! Так совпало, что ритуал Древа божеств пройдёт уже завтра."
10033030-74 = "Какое счастливое совпадение! Я невероятно его жду!"
10033030-75 = ""
10033030-77 = ""
10033030-79 = "Я запланировала сон прямо перед ритуалом... так что точно проснусь вовремя."
10033030-80 = "(Мы действительно совсем немного перенесли ритуал Древа божеств пораньше ради экскурсии... но никому не обязательно это знать!)"
10033030-82 = "Кстати, Умика, разве Хяккияко не славится своими фестивалями?"
10033030-83 = "Я слышала, фестивали для вас будто сама кровь в жилах!"
10033030-84 = "[s] «Хм. Вообще-то хорошее сравнение.»"
10033030-86 = "Фестивали — это же просто волшебство, правда?"
10033030-87 = "Можно вырваться из повседневности, объединиться ради общей цели..."
10033030-88 = "Это особое место, где люди создают воспоминания и переживают то, чего больше нигде не испытать! А звук смеха людей, наслаждающихся молодостью, просто прекрасен."
10033030-89 = "А по-настоящему замечательно то, что двух одинаковых фестивалей не бывает. В каждой академии Кивотоса есть свои варианты праздников!"
10033030-90 = "Даже в академии Геенны, откуда вы приехали, есть фестиваль, который начинается ровно в 11:11 одиннадцатого числа и достигает кульминации во время Марша роз, или Фестиваль мягких помидоров, где люди кидаются друг в друга помидорами!"
10033030-92 = "У нас... есть такие фестивали?"
10033030-93 = "А откуда нам знать? Мы Клуб «Идём домой», а не Клуб «Участвуем в школьных мероприятиях»."
10033030-94 = "Хахахаха! Но Умика, ты ведь огромная фанатка фестивалей, да? Ты прямо засветилась, как светлячок, когда начала о них говорить."
10033030-96 = "П-правда? Прошу прощения. Я совсем увлеклась."
10033030-97 = "[s] «Умика правда... ОЧЕНЬ любит фестивали...»"
10033030-98 = "И вы туда же, Сенсей?!"
10033030-100 = "Но ритуал Древа божеств звучит очень весело! Здесь всё так отличается от Геенны."
10033030-101 = "Будем надеяться, что мы переживём его без каких-нибудь взрывов..."
10033030-105 = ""
10033030-106 = "Ай! Я поскользнулась на этой плитке! Почему она такая гладкая?!"
10033030-107 = "Ты— Дурочка. Ты даже не ушиблась. Перестань ныть."
10033030-108 = "М-мои искренние извинения! Это место...!"
10033030-110 = "Посмотри, как блестит... Я даже вижу своё отражение!"
10033030-111 = "Ты права! И только этот участок отполирован как зеркало. Как будто специально..."
10033030-113 = "...Это место известно тем, что отсюда лучше всего видно Древо божеств."
10033030-115 = "Эй, я тоже! Я тоже хочу здесь скользить!"
10033030-116 = "Я была первой. Вставай за мной."
10033030-117 = ""
10033030-119 = ""
10033030-121 = "Кхм! Эм, итак, Древо божеств имеет долгую историю—"
10033030-123 = "Хочешь, чтобы я встала в очередь? Ты за кого нас принимаешь, за Тринити?"
10033030-124 = "Мы вообще-то сейчас не в Геенне, умница!"
10033030-126 = "Х-хотя истинное происхождение Древа божеств нам неизвестно, существует несколько легенд...!"
10033030-128 = "Может, нам что-нибудь сделать?"
10033030-129 = "Хм-м, пока я не вижу гранат, мин или ракет, думаю, всё нормально!"
10033030-130 = ""
10033030-133 = ""
10033030-134 = "Эй, хватит вам."
10033030-136 = "Ах, видишь? Всё будет хорошо."
10033030-137 = ""
10033030-140 = ""
10033030-141 = ""
10033030-142 = ""
10033030-143 = "Я придумала! Давайте отполируем всю плитку, и тогда здесь получится огромная горка, по которой смогут кататься все."
10033030-144 = "Ещё как!"
10033030-145 = "[ns] «Это был огромный скачок в логике!»"
10033030-146 = ""
10033030-148 = ""
10033030-150 = "Хахаха! Здесь суперскользко!"
10033030-151 = "Я хочу кататься! Кататься!"
10033030-152 = ""
10033030-154 = ""
10033030-155 = "Тогда отполируй свой участок пола сама!"
10033030-157 = "Ч-что вы делаете? Пожалуйста, послушайте меня, все!"
10033030-158 = "Знаете, что сделало бы это место реально крутым? Поставить несколько бомб!"
10033030-159 = "Представьте, как высоко мы взлетим!"
10033030-160 = "А если мы пострадаем?!"
10033030-161 = "Тогда удачи! Хахаха!"
10033030-162 = "Нееееееет!"
10033030-163 = ""
10033030-165 = ""
10033030-167 = "Умика не слишком сильно переживает?"
10033030-168 = "Нам стоит их остановить."
10033030-169 = "Хахаха! Похоже, выбора нет."
10033030-170 = ""
10033030-172 = ""
10033030-174 = ""
10033030-175 = ""
10033030-176 = ""
10033030-177 = "*тяжело дышит* *тяжело дышит* Каким-то образом зверя удалось укротить!"
10033030-178 = "Теперь моя очередь выйти вперёд! Все, пожалуйста, следуйте за мной к следующему месту!"
10033030-179 = ""
10033030-181 = ""
10033030-182 = "*зевает* Здесь гораздо больше движухи... чем я ожидала."
10033030-183 = ""
10033030-185 = ""
10033030-186 = "[ns] «Хорошая работа, все...»"
10033030-187 = ""
10033030-189 = ""
10033030-190 = "*тяжело дышит* *тяжело дышит* Студенты Геенны точно... энергичные! *тяжело дышит*"
10033030-191 = "От всего сердца спасибо вам за помощь."
10033030-193 = "Хахаха! Да не парься. Ты, типа, реально сильно нервничала!"
10033030-194 = "Я забыла, что в других школах такой уровень безумия вообще-то не считается нормой."
10033030-195 = "[s] «Вы очень помогли. Спасибо.»"
10033030-196 = "Эм, учитель? Умика? Можно я кое-что скажу."
10033030-197 = "Не чувствуйте, будто обязаны благодарить нас каждый раз, когда такое случается. Потому что сегодня это, скорее всего, произойдёт ещё, скажем, раз сто."
10033030-198 = "[s] «Мне немного страшно узнавать, правда ли это!»"
10033030-199 = "Это может произойти раньше, чем ты думаешь. Увидимся на следующей точке, Сенсей! Умика!"
10033030-200 = ""
10033030-202 = ""
10033030-203 = "Будем и дальше помогать друг другу, ладно? Увидимся там!"
10033030-204 = ""
10033030-206 = ""
10033030-208 = "Ох... Мы уже отстаём от расписания на двенадцать минут. Как мне теперь выровнять время?"
10033030-209 = "[s1] «В маршруте предусмотрены запасные интервалы.»\n[s2] «Пока что по времени мы ещё укладываемся.»"
10033030-212 = "Но мы уже тратим весь запас, а день только начался."
10033030-213 = "Если так будет продолжаться, что мне делать, Сенсей?"
10033030-214 = "[s] «Умика. Иногда...»"
10033030-215 = "...Сегодня я казалась другой?"
10033030-216 = "[s] «Иногда... нам остаётся только стараться изо всех сил.»"
10033030-217 = ""
10033030-219 = ""
10033030-220 = "Сенсе-э-эй!"
