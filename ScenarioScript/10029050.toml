[translation]
10029050-1 = "Эпизод 5;Рейлган из Токивадая"
10029050-2 = "Подземелье руин Миллениума"
10029050-4 = "Мы уже довольно глубоко спустились..."
10029050-5 = "Странно. Чем глубже мы идём, тем лучше сохранились машины."
10029050-6 = "Просто уточню... Мы ведь идём в правильном направлении?"
10029050-7 = "Да. Вполне естественно, что по мере продвижения техника выглядит всё более нетронутой."
10029050-8 = "Эти части руин почти не исследовали, поэтому со временем им нанесли меньше повреждений."
10029050-9 = "Когда ты так говоришь, это звучит как рыба, которая долго лежала в морозилке... Или банка скумбрии..."
10029050-10 = "...Хм? Сенсей?"
10029050-11 = "Да...?"
10029050-12 = "Похоже, мы довольно привычны к сражениям?"
10029050-13 = "Хм... Пожалуй, да..."
10029050-14 = "Можно сказать, что у нас там тоже довольно... оживлённо."
10029050-15 = "Имена называть не буду, но есть определённые личности, которые просто не могут не создавать проблемы всем остальным."
10029050-16 = "Мисака — одна из всего семи эсперов 5-го уровня во всём Академия-Сити. Её называют «Рейлган!»"
10029050-18 = "...Простите, что вы сейчас сказали?"
10029050-19 = "[s1] «Рейлган...?»\n[s2] «5-й уровень...?»"
10029050-22 = "А. Не обращайте внимания. Это неважно."
10029050-23 = "Куда важнее другое, Шокухо! Это Я создаю проблемы? Они теперь подумают, что я какая-то хулиганка!"
10029050-24 = "Что такое? То есть ты не такая? Хммм... Наверное, я что-то путаю..."
10029050-25 = "Теперь уже очевидно, что ты всё выдумываешь! Если собираешься врать, хотя бы делай это убедительнее!"
10029050-26 = "Ну-ну. Стоит ли нам сейчас ссориться между собой? У нас всё-таки зрители..."
10029050-27 = ""
10029050-30 = "...А?"
10029050-31 = "Кто-нибудь ещё это слышал? Это точно какой-то механический звук..."
10029050-32 = ""
10029050-35 = "...И снова...?"
10029050-36 = "[s3] «Ты упоминала об этом, Эйми...»\n[s4] «Они появляются один за другим...»"
10029050-39 = "Верно. Автоматоны Руин."
10029050-40 = "...Они приближаются. Анализ построения завершён."
10029050-41 = "Начинаю бой."
