[translation]
211060-1 = "Episódio 06;Negociações"
211060-2 = ""
211060-3 = ""
211060-4 = ""
211060-5 = "......"
211060-6 = "NEM PENSAR!!"
211060-7 = "Por que não?!"
211060-8 = "A gente já explicou por que esse espaço é essencial, não explicou?!"
211060-9 = "Não me interessa! Não gostei da ideia e pronto!"
211060-10 = "Que arbitrariedade é essa?!"
211060-11 = "O que vocês querem criar não passa de uma valvulazinha de escape fajuta!"
211060-12 = "Não vou gastar um mísero tostão furado numa bobagem dessas.#nSeria um milhão de vezes melhor investir nos alto-falantes da rádio da escola,#nassim poderei proclamar a glória e soberania de Makoto-sama aos quatro ventos!"
211060-13 = "Mas se os tumultos diminuírem, a gente vai economizar uma fortuna de verba no futuro!"
211060-14 = "E isso até aliviaria a sobrecarga do Comitê de Disciplina――"
211060-15 = "ESSE É EXATAMENTE O PROBLEMA!!"
211060-16 = "Quêêê?!"
211060-17 = "Bater perna pra caçar encrenqueiras e limpar a sujeira é obrigação do Comitê de Disciplina!#nFalta de verba? Exaustão? A [ruby=Pandemônio]Sociedade Pandemônio[/ruby] não quer nem saber!"
211060-18 = "Não tolero nem imaginar a possibilidade daquelas chatas de perna pro ar folgando! Kishishi!"
211060-19 = "Ai, meus deuses..."
211060-20 = ""
211060-22 = ""
211060-23 = ""
211060-24 = "O ódio de vocês por elas beira a obsessão, credo..."
211060-25 = "Mas afinal de contas, a Pandemônio não é o Conselho Estudantil?!#nEssa proposta é única e exclusivamente em benefício dos alunos――"
211060-26 = ""
211060-28 = ""
211060-29 = ""
211060-30 = "Assessora da Presidente do Comitê de Restauração de Gehenna, [ruby=Myouraku]Karen Myouraku[/ruby], do segundo ano."
211060-31 = "Você decorou o meu nome?!"
211060-32 = "E a Presidente é [ruby=Furihata]Mayumi Furihata[/ruby], também do segundo ano."
211060-33 = "O meu também?!"
211060-34 = "Kishishi! Essa preocupação de vocês pelo bem de Gehenna――é deveras comovente."
211060-35 = "CONTUDO! Gehenna NÃO precisa de mudança alguma!#nEsta é a diretriz absoluta da líder suprema da Sociedade Pandemônio, Hanuma Makoto-sama!"
211060-36 = ""
211060-38 = ""
211060-39 = "Por que não?! Você não quer tornar Gehenna grandiosa de novo?!"
211060-40 = "Ora, não seja tola! Gehenna JÁ É grandiosa neste exato instante!"
211060-41 = "A Gehenna de agora?!"
211060-42 = "Calouras ingênuas não entendem nada da vida, então vou esclarecer:#na cultura escolar que temos hoje foi meticulosamente desenhada por mim mesma!"
211060-43 = "Pros olhos do mundo, parece apenas pura preguiça de administrar e descaso deslavado."
211060-44 = "Então você pretende largar essa bagunça caótica pra sempre?! Sem fazer nada?!"
211060-45 = "Tá falando sério?! Todo mundo chama Gehenna de 'depósito de delinquentes' lá fora!"
211060-46 = "Quem pensa com essa mesquinharia são vocês duas!"
211060-47 = "Ficar se importando com a fofoca dos outros é atestado de fraqueza!#nA envergadura de vocês é minúscula demais para almejar liderança!"
211060-48 = "Guaaargh! Ela jogou o papo de 'envergadura' de volta na nossa cara!"
211060-49 = ""
211060-51 = ""
211060-52 = ""
211060-54 = ""
211060-55 = "...Presidente Makoto, teria um momento para me ouvir?"
211060-56 = "Você é a secretária do segundo ano, [ruby=Igarashi]Shoko Igarashi[/ruby], estou certa?"
211060-57 = "...O boato de que conhece de cor o nome de cada aluna do colégio é fático, portanto."
211060-58 = "Para quem ocupa o topo da pirâmide, tal destreza mnemônica é mero dever básico."
211060-59 = "Prossiga. O que tem a dizer?"
211060-60 = ""
211060-62 = ""
211060-63 = "Compreendi plenamente que a Gehenna contemporânea reflete a sublime filosofia política de Vossa Excelência."
211060-64 = ""
211060-66 = ""
211060-67 = "Trata-se do clássico preceito da 'governança pelo não-agir'.#nUm refinamento diplomático de altíssimo calibre, inatingível para meros mortais."
211060-68 = ""
211060-70 = ""
211060-71 = ""
211060-72 = "Kishishi! Exatamente isso! Vejo que você possui um intelecto refinadíssimo!"
211060-73 = ""
211060-75 = ""
211060-76 = ""
211060-77 = "Lá vem... o 'modo puxa-saco ativado' da Shoko...!"
211060-78 = "Certeza que ela tá armando uma arapuca das grandes..."
211060-79 = "Baderneiras armando motim e o Comitê de Disciplina as reprimindo a ferro e fogo.#nA engrenagem atual de Gehenna gira nesse eterno jogo de gato e rato."
211060-80 = "Quanto mais as alunas tocam o terror, mais o Comitê de Disciplina se afoga em trabalho extenuante.#nE quanto mais elas endurecem a repressão, mais são temidas pelo corpo discente como o símbolo máximo da tirania e opressão."
211060-81 = "Esse foi, indubitavelmente, o desfecho estratégico brilhantemente calculado pela Presidente Makoto."
211060-82 = "A moral daquele comitê só afunda no lodo a cada dia que passa!"
211060-83 = "No entanto, magnânima Presidente... há um ponto cego crucial nessa equação."
211060-84 = "Como é que é?"
211060-85 = "As alunas temem e odeiam o [ruby=Comite]Comitê de Disciplina[/ruby] com todas as forças――#nPorém, a presença da Pandemônio é praticamente invisível para elas no cotidiano."
211060-86 = "Sua mente arguta certamente buscou suscitar a apatia pública como artifício.#nTodavia, inadvertidamente, isso serviu de adubo fértil para consolidar a hegemonia da imagem do Comitê de Disciplina."
211060-87 = "Uuuugh..."
211060-88 = "Afinal, quem o povo enxerga como a verdadeira 'protagonista' de Gehenna――"
211060-89 = "É a Presidente do Comitê de Disciplina, [ruby=Sorasaki]Hina Sorasaki[/ruby]."
211060-90 = "Se preza pelo sucesso deste pleito, recomendo medir minuciosamente as palavras..."
211060-91 = "Contudo, se anuir com a nossa singela proposta, o tabuleiro geopolítico se inverterá."
211060-92 = ""
211060-94 = ""
211060-95 = "O perímetro especial sob nossa gestão, denominado 'Zona do Gatilho Fácil',#nnão operará como mera válvula de escape."
211060-96 = "Ele se consagrará como o santuário da liberdade e do deleite, [ruby=concedido]outorgado diretamente pela Presidente da Pandemônio[/ruby]!"
211060-97 = "A cada cartucho deflagrado, as jovens proclamarão:#n'Quem nos concedeu esta jubilosa recreação foi a magnânima Hanuma Makoto-sama, e não a implacável algoz Hina Sorasaki!'"
211060-98 = "Ora, ora... Prossiga..."
211060-99 = ""
211060-101 = ""
211060-102 = "Vai que é tua, Shoko! Encurrala ela!"
211060-103 = "De um lado, o Comitê de Disciplina asfixiando os alunos; do outro, a Pandemônio provendo a verdadeira liberdade."
211060-104 = "Qual das facções as massas irão aclamar em cânticos de louvor? A resposta ressoa cristalina."
211060-105 = ""
211060-107 = ""
211060-108 = ""
211060-109 = "Em vez de reprimir o ímpeto libertário, institucionalizar sua catarse... É isso?"
211060-110 = ""
211060-112 = ""
211060-113 = ""
211060-114 = "......"
211060-115 = "Vocês me julgaram com demasiada ingenuidade!"
211060-116 = ""
211060-118 = ""
211060-119 = "...Como?"
211060-120 = "Apesar de toda essa retórica ornamentada com pedrarias, no fundo vocês só querem executar seus próprios caprichos!"
211060-121 = "Usurpando a autoridade soberana da gloriosa Pandemônio fatia por fatia...!"
211060-122 = "É um equívoco. Nosso intento visa apenas――"
211060-123 = "Humph! Jamais transferirei tamanha prerrogativa para mãos de calouras desprovidas de tirocínio!"
211060-124 = "......"
211060-125 = "E a ideia daquelas desocupadas do Comitê de Disciplina descansarem me repugna profundamente!#nHá princípios sagrados neste cosmos que jamais transigirei!"
211060-126 = "[s] \"Makoto.\""
211060-127 = ""
211060-129 = ""
211060-130 = "[ns1] \"Decisões políticas têm seu peso, claro...\"\n[ns2] \"Mas que tal estender uma chance para as suas calouras?\"\n[ns3] \"A vontade sincera de arregaçar as mangas merece ser apoiada.\""
211060-134 = "......"
211060-135 = "......"
211060-136 = "......"
211060-137 = ""
211060-139 = ""
211060-140 = ""
211060-141 = ""
211060-142 = "Kishishi... Admito que demonstraram astúcia. Seduzir o Sensei para atuar como fiador do projeto..."
211060-143 = "...Posso até admitir essa articulação de bastidores como evidência de competência diplomática."
211060-144 = "Seduzir...?"
211060-145 = "Shiu! Fica caladinha!"
211060-146 = "......"
211060-147 = "Em deferência à venerável pessoa do Sensei, concederei a chancela prévia para a operação."
211060-148 = ""
211060-150 = ""
211060-151 = "AEEEE! CONSEGUIMOS!! VIVAAA!!"
211060-152 = ""
211060-154 = ""
211060-155 = ""
211060-156 = ""
211060-157 = ""
211060-158 = "[ns] \"Muito obrigado, Makoto!\""
211060-159 = "Kishishi... Esta concessão graciosa da Pandemônio constará como uma dívida de honra!"
211060-160 = "Pois cobrarei futuramente algo de magnitude equivalente ou superior para equilibrar a balança!"
211060-161 = "Exigirei a devida lealdade e consideração, sem falta――!!"
211060-162 = ""
211060-164 = ""
211060-165 = "Cof, cof!! Cof, argh, engasguei!!"
211060-166 = ""
211060-168 = ""
211060-170 = "Ai, ai... engasgou com a própria saliva de novo.#nFoi gritar histericamente do nada... Tá inteira aí?"
211060-171 = "Cof, cof!! Argh, cof!!"
211060-172 = "Bom, já que o acordo foi selado...#nEu cuido desse estrago aqui. Podem ir andando."
211060-173 = "[s4] \"Obrigado, Iroha.\"\n[s5] \"Melhoras, Makoto... respira fundo...\""
211060-176 = ""
211060-178 = ""
211060-179 = ""
211060-181 = ""
211060-182 = "......"
211060-183 = "Algum problema?"
211060-184 = "...Não. Com licença."
211060-185 = ""
211060-187 = ""
211060-188 = ""
211060-189 = "Cof, cof! Eergh, que afogamento horrível!!"
211060-190 = "Quer que eu dê uns tapinhas nas suas costas pra desentalar?"
211060-192 = "Ganhamos essa rodada! Sucesso absoluto!"
211060-193 = "Eu mantinha convicção na solidez do meu argumento, mas..."
211060-194 = "O xeque-mate decisivo veio da intervenção do Sensei."
211060-195 = "Mandou bem demais, Sensei! Aquele seu discurso tocou fundo até na alma!"
211060-196 = "[s] \"É porque vocês estavam falando com o coração.\""
211060-197 = "Pois é! Ninguém ama esta escola com tanta ferocidade quanto nós!"
211060-198 = "E você, Shoko-chan, que lábia diabólica foi aquela?! Dava pra virar estelionatária profissional fácil!"
211060-199 = "Tenho fortes razões para crer que isso não se enquadra como elogio."
211060-200 = "De qualquer forma, superamos o maior paredão da montanha!"
211060-201 = "Agora o próximo passo é――!!"
211060-202 = "......"
211060-203 = "...Pra onde a gente ia mesmo?"
211060-204 = ""
211060-206 = ""
211060-207 = ""
211060-211 = "...Entendo. Então era isso o que estavam tramando."
211060-212 = "Não tenho qualquer objeção. Jamais barraria calouras imbuídas de um propósito autêntico."
211060-213 = "O Comitê de Disciplina não interferirá no perímetro em questão. É isso que desejam, certo?"
211060-214 = "Transmitirei a ordem a todo o efetivo."
211060-215 = "[s] \"O que você acha dessa iniciativa, Hina?\""
211060-216 = "Como assim o que eu acho...? Do Comitê de Restauração de Gehenna?"
211060-217 = "...Não sei ao certo. Ainda é cedo para formular um parecer definitivo, mas..."
211060-218 = "Independentemente dos métodos, o anseio delas de revitalizar Gehenna transparece com sinceridade."
211060-219 = "Contanto que não desencadeiem um desastre de proporções incontroláveis no trajeto..."
211060-220 = "Pretendo observar à distância por ora. Já carrego preocupações em demasia sob as costas."
211060-221 = "E acima de tudo: você está ao lado delas, não está? Sabendo disso, meu coração fica em paz."
211060-222 = "[s] \"Você é bondosa e atenciosa demais, Hina.\""
211060-223 = "Hum..."
211060-224 = "......"
211060-225 = "Sensei... não são apenas aquelas garotas que carecem do seu amparo..."
211060-226 = ""
211060-228 = ""
211060-229 = ""
211060-230 = "Poderia... me conceder um tempinho do seu dia?"
211060-232 = "(Tomei um chá reconfortante com Hina para que ela pudesse relaxar um pouco...)"
211060-233 = "(Torci do fundo do coração para que essa iniciativa diminuísse o peso do trabalho dela.)"
211060-235 = "A Seguir;Karen"
