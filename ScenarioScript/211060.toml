211060-171 = "*Hack*! Cough, cough!!"
211060-172 = "Well, it seems the matter is settled. I'll clean this up, so you can go home now."
211060-173 = "[s4] \"Thank you, Iroha.\"\n[s5] \"Makoto…… take care of yourself…….\""
211060-182 = "……."
211060-183 = "Is something the matter?"
211060-184 = "……No. Well then."
211060-189 = "*Hack*, cough, cough!!"
211060-190 = "Geez, do you want me to rub your back?"
211060-192 = "We did it! It's a success! A huge success!"
211060-193 = "I was confident we could persuade her, but……."
211060-194 = "The final push was definitely Sensei."
211060-195 = "You're good. I was actually a little moved by what you said earlier!"
211060-196 = "[s] \"It's because everyone was serious about it.\""
211060-197 = "Exactly! We're the students who truly love Gehenna!"
211060-198 = "Shoko-chan, your way of speaking was intense too. Could you be a con artist or something?"
211060-199 = "Is that not a compliment?"
211060-200 = "Anyway, we've cleared one big hurdle."
211060-201 = "So, what's next～!!"
211060-202 = "……."
211060-203 = "……Where was it again?"
211060-211 = "……So that's what you were doing."
211060-212 = "I have no objections. I don't intend to stop juniors who are trying to do something."
211060-213 = "The Prefect Team won't interfere in that zone. That's fine, right?"
211060-214 = "I'll let everyone know."
211060-215 = "[s] \"What do you think, Hina?\""
211060-216 = "What do I think…… about what? The Gehenna Reconstruction Committee?"
211060-217 = "……I'm not sure. I still don't really know……."
211060-218 = "Whatever their methods, their desire to improve Gehenna comes through."
211060-219 = "I just hope they don't cause any trouble in the process……."
211060-220 = "I intend to watch over them for a while. I don't want to increase the seeds of my worries too much."
211060-221 = "Above all, Sensei is with them, right? Then there's nothing to worry about."
211060-222 = "[s] \"Hina is kind after all.\""
211060-223 = "Hmm……."
211060-224 = "……."
211060-225 = "It's not just those kids who need Sensei's help……."
211060-230 = "Could you…… give me a little time?"
211060-232 = "(I drank tea with Hina so she could find a little peace.)"
211060-233 = "(I hoped that this would reduce the Prefect Team's workload…….)"
211060-235 = "Next Episode;Karen"