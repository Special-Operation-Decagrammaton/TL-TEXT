[translation]
211060-1 = "Episode 6;Negotiation"
211060-5 = "……."
211060-6 = "No way!!"
211060-7 = "Why not!?"
211060-8 = "I already explained why we need the space, didn't I?"
211060-9 = "I don't care! I just don't like it!"
211060-10 = "That's unreasonable!?"
211060-11 = "What you're trying to build is nothing more than a 'venting ground'."
211060-12 = "I don't have a single cent of budget to waste on something like that.#nIt would be better to expand the school's PA system instead.#nThat way, I can broadcast Makoto-sama's majesty far and wide!"
211060-13 = "But if this reduces the problems, maybe we can cut the budget even more than now?"
211060-14 = "If we do that, the burden on the Prefect Team would also—"
211060-15 = "That is the problem!!"
211060-16 = "Huh!?"
211060-17 = "Stepping in and cleaning up the mess is all the Prefect Team's job!#nBudget? Overwork? That's none of the Pandemonium Society's concern!"
211060-18 = "I don't want to see the Prefect Team having an easy time! Kishishi!"
211060-19 = "Sigh……."
211060-24 = "You really have a bad relationship with the Prefect Team……."
211060-25 = "But isn't the Pandemonium Society the student council?#nThis is all for the sake of the students—"
211060-30 = "Gehenna Reconstruction Committee Vice-Chair, 2nd year, Karen Myouraku."
211060-31 = "You remembered my name?"
211060-32 = "And the Chair is 2nd year, Mayumi Furihata."
211060-33 = "Me too!?"
211060-34 = "Kishishi. Your spirit for the sake of Gehenna—truly admirable."
211060-35 = "But! Gehenna has no need to change!#nThat is the philosophy of Makoto Hanuma-sama, the pinnacle of the Pandemonium Society."
211060-39 = "Why? Don't you want to make Gehenna great?"
211060-40 = "No. Because Gehenna is already great."
211060-41 = "The current Gehenna?"
211060-42 = "You greenhorns wouldn't know, so I'll tell you.#nThe current school culture was shaped exactly as I intended."
211060-43 = "It just looks like you're leaving it alone because you're lazy, though."
211060-44 = "So you intend to just leave it in chaos? Forever?"
211060-45 = "Are you serious? Gehenna is called the 'School for Problem Children', you know?"
211060-46 = "That's only what you think!"
211060-47 = "Why do you care about what others think!#nYou're too small-minded to call yourself a leader!"
211060-48 = "Gah, she threw the 'small-minded' comment right back at me!"
211060-55 = "……Chairperson Makoto, may I have a moment?"
211060-56 = "Shoko Igarashi, the 2nd-year secretary."
211060-57 = "……So it was true that you remember every student in the school."
211060-58 = "As one who stands at the pinnacle, this much is only natural."
211060-59 = "So, what is it?"
211060-63 = "I understand that the current Gehenna is shaped by your philosophy, Chairperson."
211060-67 = "It is truly 'governance through inaction'.#nIt could be called a high-level political skill that even ordinary people couldn't imitate."
211060-72 = "Kishishi! That's right! You understand well!"
211060-77 = "There it is! Shoko's 'flattery mode'……!"
211060-78 = "She's definitely planning something……."
211060-79 = "Problem children causing trouble, and the Prefect Team cleaning it up.#nThe current Gehenna runs on that cat-and-mouse game."
211060-80 = "The more students act out, the more overworked the Prefect Team becomes.#nAnd the harder the Prefect Team works to crack down, the more they are feared by students as a 'symbol of tyranny and terror'."
211060-81 = "This is surely the result Chairperson Makoto intended."
211060-82 = "The Prefect Team's reputation is falling, that's for sure."
211060-83 = "But Chairperson. There is one thing you've overlooked."
211060-84 = "Oh?"
211060-85 = "Even if the problem children fear and hate the Prefect Team—#nthey barely feel the presence of the Pandemonium Society at all."
211060-86 = "A wise Chairperson would intentionally invite public indifference.#nBut unfortunately, this has become the soil that solidifies the Prefect Team's presence."
211060-87 = "Ugh……."
211060-88 = "The 'protagonist' of the current Gehenna is—"
211060-89 = "Prefect Team Chairperson, Hina Sorasaki, isn't it?"
211060-90 = "If you want to negotiate, you'd be wise to choose your words carefully, wouldn't you?"
211060-91 = "If you accept our proposal, the story will change."
211060-95 = "The special zone we manage, the 'Trigger Happy Zone',#ndoesn't just provide a simple 'venting ground'."
211060-96 = "It becomes a space of freedom and pleasure permitted by the Chairperson of the Pandemonium Society."
211060-97 = "Every time students use it, they will realize:#n'The one who gave us this joy is Makoto Hanuma, the generous pinnacle of the Pandemonium Society, not the demon Prefect Chairperson Hina Sorasaki'."
211060-98 = "Oh……."
211060-102 = "Go! Shoko! Keep pushing!"
211060-103 = "The Prefect Team that suppresses them, and the Pandemonium Society that grants them true freedom."
211060-104 = "Which one the students prefer and praise—the answer is obvious."
211060-109 = "Instead of suppressing freedom, create a way to vent it—is that it?"
211060-114 = "……."
211060-115 = "I've been taken for a fool."
211060-119 = "……Excuse me?"
211060-120 = "No matter how many flowery words you use, in the end, you're just doing what you want to do."
211060-121 = "While stealing the power of the great Pandemonium Society bit by bit……!"
211060-122 = "That's a misunderstanding. We just—"
211060-123 = "Hmph. I can't let greenhorns hold that kind of authority."
211060-124 = "……."
211060-125 = "I also don't like that the Prefect Team's work would decrease!#nThere are things in this world that cannot be yielded!"
211060-126 = "[s] \"Makoto.\""
211060-130 = "[ns1] \"Political judgment is important, but...\"\n[ns2] \"Why not give your juniors a chance?\"\n[ns3] \"I want to support their desire to try.\""
211060-134 = "……."
211060-135 = "……."
211060-136 = "……."
211060-142 = "Kishishi…… not bad. To talk Sensei into giving you their backing."
211060-143 = "……I suppose I can acknowledge this groundwork as proof of your capability."
211060-144 = "Talk into……?"
211060-145 = "Shh, be quiet."
211060-146 = "……."
211060-147 = "I'll save face for Sensei and permit your activities for now."
211060-151 = "We did it! Hooray!!"
211060-158 = "[ns] \"Thank you!\""
211060-159 = "Kishishi…… I'll count this concession from the Pandemonium Society as a favor owed."
211060-160 = "If I don't receive something 'more' than this in the future, it won't be balanced!"
211060-161 = "You must show appropriate sincerity—!!"
211060-165 = "Cough, cough!! *Hack*!!"
