[translation]
211060-1 = "Эпизод 6;Переговоры"
211060-2 = ""
211060-3 = ""
211060-4 = ""
211060-5 = "..."
211060-6 = "Нет!"
211060-7 = "Почему?!"
211060-8 = "Председатель, может, мы плохо объяснили? Что именно вам не нравится в нашей идее?"
211060-9 = "Мне не нужны причины! Просто не нравится! Ки-хе-хе!"
211060-10 = "Это же бред!"
211060-11 = "Хмф. Вы желаете устроить рассадник безобразий."
211060-12 = "В бюджете на такое нет средств! Тем более в этом квартале мы столько вкладываем в систему вещания. Как ещё народу узнать о моём величии?"
211060-13 = "Но ведь можно сэкономить КУЧУ денег, если собрать всех нарушителей в одном месте! Представьте, сколько средств уйдёт не на ремонт зданий!"
211060-14 = "К тому же Префектура получит передышку. Не придётся целыми днями гоняться за студентами."
211060-15 = "Именно это и есть проблема!"
211060-16 = "А?!"
211060-17 = "Бюджет на возмещение ущерба — забота Префектуры! Не Общества Пандемониума!"
211060-18 = "Я не собираюсь помогать Префектуре почивать на лаврах! Ки-хе-хе!"
211060-19 = "А-а..."
211060-20 = ""
211060-22 = ""
211060-23 = ""
211060-24 = "А... Ну да. Мы знали, что Префектура ей не по душе..."
211060-25 = "Но ведь Общество Пандемониума — наш студенческий совет, разве нет? Оно должно заботиться обо ВСЕХ студентах!"
211060-26 = ""
211060-28 = ""
211060-29 = ""
211060-30 = "Заместитель председателя Лиги наследия, студент второго курса, Мёраку Карен."
211060-31 = "Постойте, вы меня помните?"
211060-32 = "А также председатель Лиги наследия, студент второго курса, Фурихата Маюми."
211060-33 = "И меня тоже?"
211060-34 = "Ки-хе-хе. Я горжусь тем, что вы стремитесь сделать нашу любимую Геенну лучше."
211060-35 = "И всё же! Я, великая Ханума Макото, считаю, что наша прекрасная академия ни в каких переменах не нуждается."
211060-36 = ""
211060-38 = ""
211060-39 = "Почему? Разве вы не хотите, чтобы Геенна стала ещё лучше?"
211060-40 = "Геенна и так достаточно хороша."
211060-41 = "«Хороша»? По-вашему, нынешняя Геенна — это ХОРОШО?!"
211060-42 = "Ха! Вам невдомёк, но именно такой атмосферы я и добивалась."
211060-43 = "Ага. Это только КАЖЕТСЯ, что ей просто лень что-то исправлять..."
211060-44 = "И всё? Вы хотите, чтобы Геенна навсегда осталась полным бедламом?"
211060-45 = "Вас устраивает, что нас называют хулиганами, террористами и бездельниками? Серьёзно?!"
211060-46 = "Это только ВЫ считаете, что здесь «полный бедлам»!"
211060-47 = "Так печётесь о чужом мнении! Разве так ведёт себя «способный лидер», Фурихата Маюми?!"
211060-48 = "Цк, обратила мои же слова против меня...!"
211060-49 = ""
211060-51 = ""
211060-52 = ""
211060-54 = ""
211060-55 = "...Председатель Макото, позволите?"
211060-56 = "Секретарь Лиги наследия, студент второго курса, Игараши Шоуко."
211060-57 = "...Значит, это правда. Вы помните каждого студента."
211060-58 = "Ки-хе. Для того, кто стоит во главе, это само собой разумеется."
211060-59 = "Говори."
211060-60 = ""
211060-62 = ""
211060-63 = "Я понимаю, что нынешняя Геенна — плод вашей просвещённой философии."
211060-64 = ""
211060-66 = ""
211060-67 = "«Правление через невмешательство»! Столь утончённое государственное искусство недоступно пониманию простых людей."
211060-68 = ""
211060-70 = ""
211060-71 = ""
211060-72 = "Ки-хе-хе, именно! Рада, что ты заметила!"
211060-73 = ""
211060-75 = ""
211060-76 = ""
211060-77 = "Ого, Шоуко подлизывается на полную катушку...!"
211060-78 = "Это она ещё не разошлась..."
211060-79 = "Геенна застряла в бесконечном противостоянии: нарушители сеют хаос, а Префектура их наказывает."
211060-80 = "Чем больше беспорядков, тем больше работы у Префектуры. Неизбежно студенты начинают видеть в ней воплощение угнетения и страха."
211060-81 = "Несомненно, именно так и задумала великая Макото."
211060-82 = "Верно! Популярность Префектуры падает с каждым днём. Ки-хе."
211060-83 = "Однако, председатель, вы могли упустить одну деталь."
211060-84 = "Что?"
211060-85 = "Студенты могут бояться и ненавидеть Префектуру, но к Обществу Пандемониума они не испытывают вообще ничего."
211060-86 = "Ваше мудрое, ненавязчивое руководство сделало подчинённых равнодушными к политике. А тем временем влияние и авторитет главы Префектуры Сорасаки Хины только растут."
211060-87 = "Хм..."
211060-88 = "К сожалению, когда люди думают о Геенне, её «главным действующим лицом» они считают не кого иного, как..."
211060-89 = "...главу Префектуры Сорасаки Хину, а вовсе не председателя Хануму Макото."
211060-90 = "С этим я не могу смириться. Какое вопиющее..."
211060-91 = "Но положение изменится, если вы примете предложение Лиги наследия Геенны."
211060-92 = ""
211060-94 = ""
211060-95 = "«Зона безудержной стрельбы», которую мы намерены создать, вовсе не просто «место для хулиганов»."
211060-96 = "Мы представим её как пространство свободы и развлечений, получившее личное одобрение председателя."
211060-97 = "Студенты поймут, что подарила им такое развлечение именно глава Общества Пандемониума, щедрая Ханума Макото... А не та грозная мелкая заноза, что командует Префектурой."
211060-98 = "Хм..."
211060-99 = ""
211060-101 = ""
211060-102 = "Отличная работа, Шоуко! Ещё немного, и она на крючке!"
211060-103 = "Префектура, которая подавляет, против Общества Пандемониума, которое дарует свободу..."
211060-104 = "Кого предпочтут студенты? Кому достанутся шумные овации?"
211060-105 = ""
211060-107 = ""
211060-108 = ""
211060-109 = "Направлять стремление к свободе, а не подавлять его..."
211060-110 = ""
211060-112 = ""
211060-113 = ""
211060-114 = "..."
211060-115 = "Ки-хе-хе! Неужели вы считаете меня дурой?"
211060-116 = ""
211060-118 = ""
211060-119 = "Что?"
211060-120 = "Можете сколько угодно подслащивать речи, но вы всего лишь добиваетесь своего."
211060-121 = "...И хотите добиться этого, отняв власть у великого Общества Пандемониума!"
211060-122 = "Должно быть, произошло недоразумение. Мы лишь..."
211060-123 = "Хмф! Я не могу доверить такие полномочия кучке неопытных младшекурсников."
211060-124 = "..."
211060-125 = "К тому же я против сокращения нагрузки на Префектуру! Есть границы, которые нельзя переходить, даже прикрываясь так называемыми «благими намерениями»!"
211060-126 = "[s] «Макото»."
211060-127 = ""
211060-129 = ""
211060-130 = "[ns1] «Политические интриги — это, конечно, весело...»\n[ns2] «Но почему бы не дать младшекурсникам шанс?»\n[ns3] «Я хочу поддержать их желание попробовать»."
211060-134 = "..."
211060-135 = "..."
211060-136 = "..."
211060-137 = ""
211060-139 = ""
211060-140 = ""
211060-141 = ""
211060-142 = "Ки-хе-хе... Ладно. Вижу, вам удалось уговорить Сенсея помочь."
211060-143 = "Одно это уже доказывает, что у этих детишек ЕСТЬ определённые способности."
211060-144 = "«Уговорить»...?"
211060-145 = "Тише, тише."
211060-146 = "..."
211060-147 = "Что ж. Ради Сенсея я предварительно одобрю деятельность Лиги наследия."
211060-148 = ""
211060-150 = ""
211060-151 = "Ура! Вот это другое дело!"
211060-152 = ""
211060-154 = ""
211060-155 = ""
211060-156 = ""
211060-157 = ""
211060-158 = "[ns] «Спасибо, Макото»."
211060-159 = "Ки-хе-хе... Считайте, что теперь вы в долгу перед Обществом Пандемониума, Сенсей."
211060-160 = "Позже мы обязательно взыщем его! С чудовищными, но справедливыми процентами!"
211060-161 = "И плата будет бесценной, неважно, о материальных ли благах идёт речь или же о...!"
211060-162 = ""
211060-164 = ""
211060-165 = "*кашель* *кашель* *хрипит*"
211060-166 = ""
211060-168 = ""
211060-170 = "А, она опять подавилась слюной. Макото, ты в порядке?"
211060-171 = "*кашляет* *кашляет*"
211060-172 = "Эм, раз вы уже закончили, прошу вас на выход. А я разберусь... с этим вот."
211060-173 = "[s4] «Спасибо, Ироха».\n[s5] «Береги себя, Макото...»"
211060-176 = ""
211060-178 = ""
211060-179 = ""
211060-181 = ""
211060-182 = "..."
211060-183 = "Хм? Вы хотели мне что-то сказать?"
211060-184 = "...Нет, пожалуй. Неважно."
211060-185 = ""
211060-187 = ""
211060-188 = ""
211060-189 = "*кашляет* *кашляет*"
211060-190 = "О, Макото! Как же тебе плохо! Может, похлопать тебя по спине?"
211060-192 = "Ура! У нас получилось!"
211060-193 = "Я, конечно, не сомневалась в своём умении убеждать..."
211060-194 = "...Но, похоже, поддержка Сенсея оказалась ещё весомее."
211060-195 = "Спасибо, Сенсей! Ваши добрые слова меня даже немного растрогали!"
211060-196 = "[s] «Вы трое так искренне стараетесь»."
211060-197 = "Именно! Потому что мы по-настоящему любим Геенну!"
211060-198 = "Шоуко, кто бы мог подумать, что ты так ловко умеешь заговаривать зубы? За этими очками скрывается настоящий мастер красноречия."
211060-199 = "Это... не совсем комплимент."
211060-200 = "Главное, мы преодолели серьёзное препятствие! Хи-хи."
211060-201 = "А теперь помчались преодолевать следующее!"
211060-202 = "..."
211060-203 = "...П-погодите, а какое у нас следующее «препятствие»?"
211060-204 = ""
211060-206 = ""
211060-207 = ""
211060-211 = "...Так вот чем вы занимались, Сенсей."
211060-212 = "Я не собираюсь мешать младшекурсникам, которые стараются изменить что-то к лучшему."
211060-213 = "Иными словами, Префектура не будет вмешиваться в происходящее в том парке... Я правильно поняла?"
211060-214 = "Хорошо. Я сообщу остальным."
211060-215 = "[s] «Что думаешь, Хина?»"
211060-216 = "О... чём? О Лиге наследия Геенны?"
211060-217 = "...Даже не знаю. Пока трудно сказать..."
211060-218 = "Но, каковы бы ни были их методы, мне кажется, они искренне хотят сделать Геенну лучше."
211060-219 = "Конечно, я бы предпочла, чтобы они обошлись без всяких странных затей..."
211060-220 = "Я присмотрю за ними. Не хочется наживать себе лишних забот."
211060-221 = "Хотя, полагаю, всё будет в порядке, пока вы за ними присматриваете, Сенсей."
211060-222 = "[s] «Ты и правда добрая, Хина»."
211060-223 = "Эм..."
211060-224 = "..."
211060-225 = "Не только этим студентам нужна ваша помощь."
211060-226 = ""
211060-228 = ""
211060-229 = ""
211060-230 = "Сенсей, у вас найдётся свободная минутка...?"
211060-232 = "Мы посидели с Хиной за чашкой чая, пока она немного отдыхала. Оказалось, у неё был невероятно тяжёлый рабочий день."
211060-233 = "Я надеялся, что новая зона облегчит жизнь ей и всей Префектуре..."
211060-235 = "Следующий эпизод;Карен"
