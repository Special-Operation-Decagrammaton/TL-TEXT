[translation]
1010305-1 = "Разрубить гордиев узел"
1010305-2 = "Персиковый источник"
1010305-3 = "Хм. Чай Шаньхайцзина очень ароматный."
1010305-4 = "Интересно, какие листья они используют и как именно его заваривают."
1010305-5 = "[s] «Марина, ты много знаешь о чае?»"
1010305-6 = "Не сказала бы, что много. Но дома я иногда люблю выпить чашку."
1010305-7 = "У меня даже есть собственный чайник — он называется «самовар»."
1010305-8 = "Никогда не слышали? Внутри чайника можно развести огонь, чтобы вода оставалась горячей."
1010305-9 = "И там есть краник, из которого можно наливать чай! Очень удобно."
1010305-10 = "Знаю! В следующий раз, когда вы придёте ко мне, я угощу вас чёрным чаем по-краснозимнему!"
1010305-11 = "Вы будете ждать этого, но сейчас мы ведь в Шаньхайцзине?"
1010305-12 = "Я немного забежала вперёд. Чай здесь... как бы сказать? Чистый и ароматный."
1010305-13 = "Но чего-то не хватает..."
1010305-15 = "Внезапно рядом вспыхнул громкий спор."
1010305-17 = "Ещё чего! Я буду резать лунный пряник! Ты всегда режешь его на восемь частей!"
1010305-18 = "Ну да. Потому что так и положено! Это ты странная, раз хочешь четыре куска!"
1010305-19 = "Я тебе уже сто раз говорила: если резать на восемь частей, возникает слишком много проблем!"
1010305-20 = "Если разделить на четыре, он меньше крошится! Ненавижу этот бардак."
1010305-21 = "Нет-нет, ты вообще меня не слушаешь! Лунные пряники толстые, их нельзя съесть за один укус, если куски такие большие!"
1010305-22 = "Правильный способ есть лунный пряник такой: разрезать на восемь частей, съесть кусочек за один укус и запить чаем."
1010305-23 = ""
1010305-25 = ""
1010305-26 = "...О чём они спорят?"
1010305-27 = "[s1] «О том, делить ли лунный пряник на восемь или четыре части...»\n[s2] «...похоже, это тема их спора.»"
1010305-30 = "О...?"
1010305-32 = "Разрезать на восемь частей ужасно трудно! Чуть ошибёшься — и весь пряник испорчен!"
1010305-33 = "Это потому, что ты плохо режешь! И лунные пряники такие сладкие и жирные! Разве от таких больших кусков не становится плохо?!"
1010305-34 = "Тогда просто ешь в два укуса! Большие куски сами содержат маленькие!"
1010305-35 = "Тогда почему сразу не разрезать на восемь?! Тогда кусать вообще не придётся!"
1010305-36 = "Угх! Мы никогда не договоримся."
1010305-37 = "Эй, смотри туда! Я их раньше здесь не видела. Наверное, они не местные!"
1010305-39 = "Отлично. Значит, они смогут дать совершенно объективное мнение."
1010305-40 = "Давайте спросим, как правильно делить лунный пряник!"
1010305-42 = "Так нас заставили рассудить, какой способ поедания лунного пряника лучше(?)."
1010305-43 = "Казалось, вопрос непростой, но затем..."
1010305-45 = "Хорошо. Я знаю, что делать."
1010305-46 = "[s] «Марина...?»"
1010305-48 = "Ни секунды не колеблясь, Марина встала и направилась к столу спорящих студентов."
1010305-49 = ""
1010305-50 = ""
1010305-51 = "Прошу прощения."
1010305-52 = ""
1010305-54 = ""
1010305-56 = ""
1010305-58 = "Ч-Что ты делаешь с целым лунным пряником?!"
1010305-59 = "Она съела его... за один укус?!"
1010305-61 = "Ням-ням."
1010305-62 = "М-м. Вкусно."
1010305-63 = "Неважно, как его есть. Лунный пряник всё равно будет вкусом лунного пряника."
1010305-64 = "Куда важнее, что эти пряники принято есть с чаем."
1010305-65 = "Пока вы спорите о том, как правильно делить лунный пряник, чай остывает. Это и называется «ставить телегу впереди лошади»."
1010305-66 = "Эм... Я правильно сказала?"
1010305-67 = "[s] «Да. Выражение использовано совершенно верно, госпожа Марина.»"
1010305-68 = "Да! Моё высказывание одобрено Сенсеем!"
1010305-69 = "В любом случае, вот так. Простите, если я была слишком прямолинейна."
1010305-71 = "Я-я поняла!"
1010305-72 = "Если сосредоточиться на том, что действительно важно..."
1010305-73 = "...становится понятно, что всякие мелочи вроде методики вообще не имеют значения!"
1010305-74 = "Я знала, что взгляд со стороны поможет!"
1010305-76 = "Да. Я рада, что мой ответ вас устроил."
1010305-77 = "Но, знаете, я всё думала, что чего-то не хватает..."
1010305-78 = "У вас случайно нет варенья? Сваренного с сахаром, чтобы фрукты остались целыми!"
1010305-79 = ""
1010305-82 = "В-Варенья...?!"
1010305-83 = "К чаю?!"
1010305-84 = "Разумеется! Варенье — неотъемлемая часть чаепития!"
1010305-85 = "Чтобы ощутить настоящий вкус небес, сделайте глоток чая, а затем съешьте ложку варенья!"
1010305-86 = "Если нет варенья, подойдёт кубик сахара или даже просто кусочек!"
1010305-87 = "Если есть сахар отдельно, вкус самого чая не изменится, а вы всё равно получите приятную сладость."
1010305-88 = "Это... Это..."
1010305-89 = "Это кощунство над самим чаем!"
1010305-90 = "Ч-Что?"
1010305-92 = "Настоящий чай должен быть чистым на вкус и свежим по аромату!"
1010305-93 = "Цвет должен быть прозрачным и радовать глаз, а звучание — прекрасным, словно музыка для ушей!"
1010305-94 = ""
1010305-95 = "Варенье, кубики сахара, кусочки сахара — всё это отход от истинного пути и совершенно неправильно!"
1010305-97 = "Подождите, я просто рассказывала, как мы пьём чай в Красной Зиме?!"
1010305-99 = "Спор студентов Шаньхайцзина и Марины о том, как правильно пить чай, продолжался ещё очень долго."
1010305-100 = "Само собой, чай успел остыть..."
