[translation]
90001170-1 = "Эпизод 17;Воссоединение"
90001170-2 = ""
90001170-3 = "...Вот так мы тебя и разбудили."
90001170-4 = "Да. Особенно большую роль сыграла Рио. Отдай ей должное, Кей."
90001170-5 = "И, конечно же, именно я усерднее всех выполняла приказы Рио."
90001170-6 = ""
90001170-8 = ""
90001170-9 = ""
90001170-10 = "...Токи? Боюсь, если ты будешь так говорить, всем присутствующим станет немного неловко."
90001170-11 = "А согласно статистическому анализу, больше всего работы в этом деле на самом деле выполнила я. Проверим журналы ещё раз?"
90001170-12 = ""
90001170-14 = ""
90001170-16 = ""
90001170-17 = "...Похоже, с тех пор как я уснула, вы почти не изменились..."
90001170-18 = "[s1] «Эм... Привет, Кей-Кей?»\n[s2] «Давно не виделись, да?»"
90001170-21 = "Не называйте меня Кей-Кей!"
90001170-22 = "И что ещё важнее, где мы? Я не могу похвастаться знанием всех существующих мест Кивотоса..."
90001170-23 = "...но в этом месте есть что-то фундаментально незнакомое."
90001170-24 = "Хорошее начало. Мы у Ледникового моря."
90001170-25 = "Ледникового моря? ТОГО САМОГО Ледникового моря? Зачем вы привезли меня сюда?"
90001170-26 = "Мы всё тебе расскажем, но давай по порядку."
90001170-27 = "Для начала представимся? Со мной и Рио ты уже прекрасно знакома, Кей."
90001170-28 = "Д-Да..."
90001170-29 = "Привет, Кей. Я Асума Токи."
90001170-30 = "Однажды я похитила тебя и Алису. Пис, пис."
90001170-31 = "Это ты считаешь представлением?"
90001170-32 = "Я Изумимото Эйми. Приятно познакомиться."
90001170-33 = "...Привет. Эм. Полагаю, приятно познакомиться. Я Кей."
90001170-34 = "Хотя это всего лишь прозвище, появившееся из-за неправильного произношения."
90001170-35 = "*вздох* Но принцесса сказала, что ей оно нравится, так что..."
90001170-37 = ""
90001170-38 = "Я хочу выразить благодарность за то, что вы сохранили часть моих данных."
90001170-39 = "Хотя всё это время меня бесконечно болтало из стороны в сторону — благодаря вашему решению перенести меня, из всех возможных вещей, именно в брелок-куклу."
90001170-40 = "Угх...! Мои воспоминания...! Меня привязали к швабре и бесконечно размахивали мной...?!"
90001170-41 = "[s] «Эм... Это потому, что у нас не было другого выбора...?»"
90001170-42 = "И это, по-вашему, оправдание?"
90001170-43 = "Эм... Это может прозвучать странно, но я уже в некоторой степени знаю каждого из вас."
90001170-44 = "Принцесса рассказывала мне о вас, пока мы были вместе. Однако ваше представление обо мне, вероятно..."
90001170-45 = "Это возможность нам узнать друг друга получше, верно, Кей? Мы этого ждём."
90001170-46 = "...Пока что понятно."
90001170-47 = "Кстати, раз уж об этом заговорили, где принцесса?"
90001170-48 = "[s3] «Точно! Насчёт этого!»\n[s4] «Я хочу кое с кем тебя познакомить, Кей-Кей!»"
90001170-51 = "Ещё раз: не называйте меня Кей-Кей!"
90001170-52 = ""
90001170-54 = ""
90001170-55 = "...Нет. Насколько я понимаю, вы как раз из тех, кто демонстративно игнорирует подобные просьбы, Сенсей [USERNAME]."
90001170-56 = "И перестаньте делать это ужасное лицо, на котором написано: «Ого! Ты так хорошо меня знаешь!»"
90001170-57 = "Ну так кого вы хотите мне представить?"
90001170-59 = "[ns] «Это же...»"
90001170-62 = ""
90001170-64 = ""
90001170-65 = "А? MomoTalk от Сенсея?"
90001170-66 = ""
90001170-68 = ""
90001170-69 = "..."
90001170-70 = "Все! Возвращаемся внутрь, прямо сейчас!"
90001170-71 = "Что? Уже?!"
90001170-72 = "Да, уже, Момои? Я хочу ещё поиграть!"
90001170-73 = "А-Я уже устала..."
90001170-74 = "Да ладно, Юзу всё равно устала! А Сенсей сказал, что приготовит нам горячее какао!"
90001170-75 = "Горячее какао от Сенсея...? Это редкий предмет восстановления! Я не могу упустить такую возможность!"
90001170-76 = "Вот и я о том! Пойдём!"
90001170-77 = ""
90001170-79 = ""
90001170-80 = "Ч-Что? Нечестно, сестрёнка! Подожди меня! Юзу, вставай!"
90001170-81 = "Какао... и правда звучит неплохо. Да."
90001170-82 = ""
90001170-84 = ""
90001170-86 = ""
90001170-87 = "Сенсей! Мы вернулись!"
90001170-88 = "Да! Мы хотели ещё поиграть, но восстановление тоже важно!"
90001170-89 = "[s] «Добро пожаловать, добро пожаловать. Вот, четыре чашки горячего какао.»"
90001170-90 = "Спасибо, Сенсей. У-у-у, какое тёплое."
90001170-91 = "В-Вы сами не будете, Сенсей? А... Вы уже пили кофе? Л-Ладно..."
90001170-96 = "*вздох* Хорошо-то как. Будто тело изнутри тает..."
90001170-97 = ""
90001170-99 = ""
90001170-100 = ""
90001170-101 = ""
90001170-102 = "Тогда... Алиса. Хочешь войти первой?"
90001170-103 = "На базу? Почему именно я должна идти первой?"
90001170-104 = "Потому что там тебя кое-кто ждёт! Кто-то, кто хочет увидеть тебя раньше всех!"
90001170-105 = ""
90001170-106 = "Кто-то, кто хочет первым увидеть Алису?.."
90001170-107 = "Неужели...!"
90001170-108 = "..."
90001170-109 = ""
90001170-110 = "Н-Но почему именно меня?"
90001170-111 = "...!"
90001170-112 = "П-Подождите. Неужели...?!"
90001170-113 = "[s] «Ну же, пойдём, Алиса.»"
90001170-114 = "...Хорошо. Поняла. Но я хочу, чтобы вы были рядом со мной, Сенсей. Можно?"
90001170-115 = "Спасибо, Сенсей. И ещё кое-что..."
90001170-116 = ""
90001170-118 = ""
90001170-119 = ""
90001170-120 = "Пожалуйста, крепко держите меня за руку."
90001170-121 = "Я очень сильно дрожу. Даже стоять трудно."
90001170-124 = "Спасибо, Сенсей. Спасибо... правда, от всего сердца."
90001170-125 = ""
90001170-135 = ""
90001170-137 = ""
90001170-138 = "...!"
90001170-139 = "...!"
90001170-140 = "..."
90001170-141 = "..."
90001170-142 = "Кей... Это ведь Кей?"
90001170-143 = "П-Принцесса..."
90001170-144 = "Это правда... Это и правда ты, Кей..."
90001170-145 = "Принцесса... Я..."
90001170-146 = ""
90001170-148 = ""
90001170-149 = "Кей!"
90001170-150 = "Пожалуйста, никогда, никогда больше не говори, что должна исчезнуть!"
90001170-151 = "Никогда не говори, что так и должно быть. Или что это правильный путь. Никогда."
90001170-152 = "Это..."
90001170-153 = "Прошу тебя, Кей. Потому что сейчас... мне даже не хватает слов, чтобы описать, насколько я счастлива."
90001170-154 = "Я очень, очень счастлива снова тебя видеть, Кей."
90001170-155 = "Мне трудно поверить, что перед моими глазами действительно ты."
90001170-156 = "Спасибо тебе, Кей. Правда, спасибо."
90001170-157 = "Я так благодарна. Спасибо, что вернулась ко мне."
90001170-158 = "Поэтому никогда, никогда, никогда..."
90001170-159 = "*шмыг* *всхлип*"
90001170-160 = "Да... Я понимаю, Принцесса."
90001170-161 = "Теперь всё будет хорошо."
90001170-162 = ""
90001170-163 = "Спасибо, Химари и Рио. Эйми, Токи и Сенсей — вам тоже. Огромное спасибо."
90001170-164 = "Хотя из меня такой плохой герой, вы... вернули мне Кей. Я даже не знаю, как когда-нибудь смогу отплатить за этот долг..."
90001170-166 = "Не нужно нас благодарить, Алиса. Твоя яркая сияющая улыбка — уже достаточная награда."
90001170-167 = "Да. Сам факт существования Кей здесь доказывает правильность моей теории. Для меня этого тоже более чем достаточно."
90001170-168 = "Рио. Ну пожалуйста..."
90001170-169 = "Я опять сказала что-то не то?"
90001170-170 = "...Нет. Правда, именно ты вернула Кей к жизни... Но... *вздох*"
90001170-171 = ""
90001170-173 = ""
90001170-175 = "Это я, Момои! Врываюсь в эту эмоциональную и душевную сцену!"
90001170-176 = "А. Ты."
90001170-177 = "С-Сестрёнка?!"
90001170-178 = "М-Мне так жаль... Я правда пыталась её о-остановить..."
90001170-180 = "Ты! Ты посмела вырубить меня одним ударом! Даже не пытайся делать вид, что не помнишь! Потому что я помню!"
90001170-182 = "...Я и не притворяюсь. С этической точки зрения считаю, что за этот поступок должна извиниться."
90001170-183 = "Однако лично мне сама эта мысль неприятна, Сайба Момои."
90001170-184 = "[s] «Кей-Кей?!»"
90001170-185 = "К-Кей?!"
90001170-186 = "Хм. По крайней мере, мне нравится твой настрой. Мой старый враг. И в чём причина?"
90001170-188 = "Потому что ты ужасно плохо влияла на Принцессу!"
90001170-189 = "[s] «А.»"
90001170-190 = "Ах..."
90001170-191 = "Ты заставляла Принцессу не спать допоздна ради своих видеоигр, а сама постоянно засыпала первой!"
90001170-192 = "Н-Но мы же Отдел разработки игр...!"
90001170-193 = "А ещё ты поила её колой поздно ночью и даже не следила, чтобы потом она почистила зубы!"
90001170-194 = "Н-Но это была кола без сахара... Наверное."
90001170-195 = "И чем ты оправдаешь этот жалкий рацион? Ради здоровья Принцессы в её питании должно быть больше клетчатки и растительных питательных веществ!"
90001170-196 = "Уааа... Ты не ошибаешься, но я тоже не люблю овощи..."
90001170-197 = "Именно! Это касается не только Принцессы, но и всех вас! Каждой из вас пошёл бы на пользу более здоровый образ жизни!"
90001170-198 = "Прошу вас! Берегите себя! Вы даже не представляете, как я...! *тяжело дышит* *тяжело дышит*"
90001170-199 = "В нынешнем состоянии тебе ведь вообще не нужно дышать? Если тебе жарко, я могу увеличить мощность охлаждения..."
90001170-200 = ""
90001170-203 = ""
90001170-204 = "Это было устойчивое выражение! Как ты вообще умудряешься хуже меня, потока данных, чувствовать атмосферу, Рио?!"
90001170-205 = "К-Кей?!"
90001170-206 = "Уаа! Рио, мне очень жаль! Это полностью моя вина, не Кей! Поэтому, пожалуйста, прости её."
90001170-208 = "Ах, Принцесса. Это..."
90001170-209 = "Не думаю, что тебе есть за что извиняться, Алиса. Хотя я не понимаю причины, это был всего лишь большой скачок гнева в системе когнитивных цепей Кей."
90001170-211 = "...В каком-то смысле я даже рада, что госпожа Рио именно такая."
90001170-213 = "Ладно, дальше. Зачем вы вызвали меня... точнее, Принцессу и её друзей в это место?"
90001170-214 = "Сразу к делу. Логично. Мне нравится."
90001170-215 = ""
90001170-217 = ""
90001170-218 = "Кей. Мы хотим, чтобы вы с Алисой снова уничтожили Многомерный барьер."
90001170-219 = "Рио? Алло? В таких ситуациях сначала нужно дать контекст—"
90001170-220 = "Подождите. Услышав это, я не могу просто стоять в стороне."
90001170-221 = "Многомерный барьер...? Произнося эти слова, вы имеете в виду то же самое, о чём думаю я?"
90001170-222 = "[s5] «Ладно, история немного длинная.»\n[s6] «Алиса, и все остальные, пожалуйста, внимательно послушайте это повторение.»"
90001170-225 = "Поняла, Сенсей. Тогда я пойду вздремну, разбудите меня, когда закончите."
90001170-226 = "Не думаю, что сейчас для этого подходящее время, Токи..."
90001170-227 = "Всё хорошо. Это между мной и Сенсеем. Никакой проблемы."
90001170-228 = "Между тобой и Сенсеем...? Эм, Токи?! Что это вообще значит?!"
90001170-230 = "Потребовалось немало усилий, но в конце концов мы утихомирили эту шумную атмосферу..."
90001170-231 = "...и я подробно объяснил Кей всё, что произошло."
90001170-232 = ""
90001170-234 = ""
90001170-235 = ""
90001170-236 = "Итак, подводя итог..."
90001170-237 = "Да. Повторю сказанное ранее: мы хотим, чтобы вы с Алисой уничтожили Многомерный барьер."
90001170-238 = "Само существование барьера подвергает Кивотос—"
90001170-239 = "Я отказываюсь."
90001170-240 = "?!"
90001170-241 = "?!"
90001170-242 = "..."
90001170-243 = ""
90001170-245 = ""
90001170-246 = ""
90001170-247 = ""
90001170-248 = ""
90001170-249 = ""
90001170-250 = "Этот вкус... вкус того, что нечто важное ещё не было обсуждено."
90001170-251 = "Что ещё за вкус у тебя...? Ладно, неважно. Важнее то, что ты вообще не способна меня почувствовать на вкус."
90001170-252 = "Это выражение я выучила из культурных материалов в клубной комнате C&C."
90001170-253 = "...Я так и знала, что задала совершенно ненужный вопрос."
90001170-254 = "Но она права. Сейчас вам не хватает важнейшего элемента этой истории."
90001170-255 = "Если упростить, уничтожение Многомерного барьера означает риск для жизни Принцессы."
90001170-256 = "Вы можете сослаться на нашу прошлую успешную попытку, но я могу сказать лишь одно: нам невероятно повезло."
90001170-257 = "...Нам повезло, что тогда пострадала только я."
90001170-259 = "Что?!"
90001170-260 = "Что ты сказала?!"
90001170-261 = "А-Алиса и Кей-Кей...?!"
90001170-263 = "Теперь даже ты называешь меня Кей-Кей..."
90001170-264 = "...Можешь точно объяснить, что произошло?"
90001170-265 = "Да. Полагаю, объяснение необходимо, и раз все собрались здесь, лучшего момента не будет."
90001170-267 = "Кей рассказала, что произошло с ней и Алисой на борту Корабля Утнапиштима в тот день."
90001170-268 = "И все..."
90001170-269 = ""
90001170-270 = "УАААА! Прости, Алиса! Мы понятия не имели!"
90001170-271 = "Алиса... Кей-Кей...!"
90001170-272 = "*шмыг* *всхлип*"
90001170-274 = "Это... Нам нужно всё обдумать. Прости, Кей. Если бы я знала, что всё было именно так..."
90001170-275 = "...Извинения не нужны. Вы не знали."
90001170-276 = "Незнание само по себе не делает человека виновным. Проблема появляется лишь тогда, когда, узнав всё, он всё равно принимает то же решение."
90001170-277 = "Но раз уж мы об этом заговорили. *вздох* Принцесса..."
90001170-278 = "Д-Да?!"
90001170-279 = "Почему вы так бездумно согласились на эту миссию?"
90001170-280 = "Вы прекрасно знаете, что уничтожение Многомерного барьера означает для нас. Для вас и для меня."
90001170-281 = "...Ты права. Мне очень жаль, Кей."
90001170-282 = "Я знала, правда знала. Но не хотела волновать остальных, рассказывая им."
90001170-283 = "Если во время— с тобой случится немыслимое..."
90001170-284 = "Тебе не нужно об этом беспокоиться, Кей."
90001170-285 = ""
90001170-287 = ""
90001170-289 = "Потому что с дружбой и храбростью можно преодолеть всё!"
90001170-290 = "Рио, Химари, Эйми, Токи, все из Отдела разработки игр..."
90001170-291 = "...и самое главное, Сенсей со мной!"
90001170-292 = "Нет, Принцесса. Это..."
90001170-293 = "...Нет, всё хорошо. Я понимаю, почему вы так думаете. В этом нет вашей вины. На самом деле..."
90001170-294 = "Ты! Сенсей! Это всё твоя вина!"
90001170-295 = "[s] «Подожди! Я невиновен! Почему я?!»"
90001170-296 = "Именно ты посеял в Принцессе семя этих нелепых надежд!"
90001170-297 = "[s] «Ты ведь не собираешься сказать, что надежда — это какая-то ужасная болезнь?!»"
90001170-298 = ""
90001170-301 = "Всё, что причиняет вред Принцессе, — плохо!"
90001170-302 = "Кей?! Успокойся, Кей! Пожалуйста, ради меня!"
90001170-303 = ""
90001170-304 = "Она права. Просить Алису и Кей уничтожить Многомерный барьер нельзя."
90001170-305 = "И это возвращает нас к исходной проблеме."
90001170-306 = "Да. Нам нужно решить, что делать дальше."
90001170-308 = "Кстати об этом. В чём именно проблема с Многомерным барьером и пророками?"
90001170-310 = "Что? Ну, очевидно..."
90001170-311 = ""
90001170-313 = ""
90001170-314 = "...А?"
90001170-315 = "...!"
90001170-317 = "Да. Именно. Полагаю, ты достаточно хорошо понимаешь ситуацию. Однако какую задачу сейчас выполняют пророки?"
90001170-318 = "Разве они не прячутся внутри Многомерного барьера, тайком копошась там?"
90001170-319 = "Типа... испуганной улитки или черепахи, спрятавшейся в панцире?"
90001170-320 = "Хорошая аналогия, Момои. Что бы они ни делали внутри этого панциря, это, безусловно, вызывает тревогу."
90001170-321 = "Однако на данный момент, полагаю, достаточно просто наблюдать и отслеживать их активность."
90001170-322 = "Это эффективный подход. Как мы могли упустить настолько простое решение?"
90001170-323 = "Это понятно. При первой встрече Многомерный барьер создал в Кивотосе почти непреодолимый кризис."
90001170-324 = "Вполне естественно, что его повторное появление вызывает острое чувство надвигающейся катастрофы."
90001170-325 = "В конце концов, люди судят о будущем на основании прошлого опыта."
90001170-326 = ""
90001170-327 = "Понятно. Хорошо сказано, Кей. Но тогда..."
90001170-328 = "...Что нам теперь делать?"
90001170-330 = ""
90001170-332 = ""
90001170-333 = "..."
90001170-334 = "..."
90001170-336 = "Кто-нибудь хочет сыграть в Tales Saga Chronicle?"
90001170-337 = "Я лучше умру, Принцесса!"
90001170-338 = "М-Может, при повторном прохождении впечатления будут другими, Кей. Возможно, игра вызовет ностальгию и напомнит хорошие моменты прошлого..."
90001170-339 = "С этой игрой это абсолютно невозможно! Вы и сами прекрасно это знаете, Принцесса!"
90001170-340 = "Э-Это правда, но..."
90001170-342 = "Ладно, дальше. Нам нужно серьёзно подумать о следующих шагах."
90001170-343 = "Для начала сделаем Кей тело."
90001170-345 = ""
90001170-347 = ""
90001170-348 = "...Что?"
90001170-349 = "Что...?"
90001170-350 = "П-Простите? Что это за внезапный поворот разговора?"
90001170-351 = "Сейчас Кей, по сути, находится в вегетативном состоянии ниже шеи. Любое раздражение или недовольство, которое она испытывает, из-за этого усиливается в десять раз."
90001170-352 = "Ага! Понимаю. Это ещё сильнее усугубляет агрессивные наклонности Кей и мешает продуктивному разговору. Логичный анализ ситуации, Рио."
90001170-353 = "[s] «О. В этом есть смысл.»"
90001170-354 = "Спасибо за понимание, Сенсей, Химари."
90001170-356 = "Нет. Подождите. Не исключайте меня из этого разговора!"
90001170-357 = "Почему-то участие Рио в этом вопросе вызывает у меня особенно сильное дурное предчувствие."
90001170-359 = "Но как мы сделаем ей тело?"
90001170-360 = "Я справлюсь. Я привезла с собой столько AMAS, сколько смогла, так что запасных деталей и материалов должно хватить."
90001170-362 = "Вы меня вообще слушаете? Вы не слышите, как я сообщаю о невыносимом ощущении надвигающейся гибели от того, что именно Рио занимается этой задачей?"
90001170-364 = "Президент, с какого AMAS вы собираетесь начать? Хотя обычно в таких ситуациях именно я получаю приказы."
90001170-365 = "Не волнуйся. Вкусы Рио всегда очень... уникальны."
90001170-367 = "Я сказала прекратить! Слово «уникальны» совершенно не внушает уверенности в этом предприятии!"
90001170-368 = "Вы ведь все относительно умные и проницательные люди, нет? Вы же понимаете мои опасения?!"
90001170-369 = ""
90001170-372 = ""
90001170-373 = "И-и-и...?!"
90001170-375 = "...Ты правда собираешься сделать Кей тело, Рио?"
90001170-376 = "Это значит, что я... снова смогу прикоснуться... и почувствовать Кей?"
90001170-377 = "П-Принцесса?!"
90001170-379 = "Да. Возможно, от меня это прозвучит неуместно..."
90001170-380 = ""
90001170-382 = ""
90001170-383 = ""
90001170-384 = ""
90001170-385 = "...но, пожалуйста, доверься мне, Алиса."
90001170-386 = "Спасибо, Рио! И вам тоже, Химари!"
90001170-387 = "Конечно, Алиса. Мы сделаем всё возможное."
90001170-388 = "Когда кто-то с вами разговаривает, его нужно слушать! Я прошу хоть кого-нибудь меня услышать!"
90001170-389 = "[s] «Успокойся, Кей. Мы все пытаемся тебе помочь.»"
90001170-390 = "И при этом вы полностью игнорируете мнение той, кому якобы помогаете?!"
90001170-391 = "Я умоляю вас остановить одну конкретную личность, которая под видом рациональности собирается НАВЯЗАТЬ МНЕ собственную извращённую эстетику!"
90001170-392 = ""
90001170-395 = "[ns] «Успокойся, Кей. Они уже начали.»"
