[translation]
211130-1 = "Episode 13;The Tree in the Forest"
211130-7 = "Hello, Erika Hatami and Kirara Yozakura."
211130-12 = "Wait, you know who we are?"
211130-13 = "You're that committee everyone's been talking about lately, right?"
211130-14 = "The name was, let's see—"
211130-16 = "The Gehenna Academy Restoration Committee. I'm Shouko Igarashi."
211130-17 = "We're the same age, you know. Did you know that?"
211130-18 = "Yes, to an extent."
211130-19 = "Oh, I see! Nice to meet you!#nSo, did you need something?"
211130-26 = "I have a few questions I'd like to ask."
211130-27 = "Oh, but don't feel pressured if you can't answer."
211130-29 = "……Wait? Sensei is here too!"
211130-30 = "[s] \"Hey there, Kirara, Erika!\""
211130-31 = "Is this, like, super important?"
211130-32 = "No, we won't take up much of your time."
211130-33 = "We were just about to head home anyway. Ask us anything."
211130-34 = "Then, I'll take you up on that offer."
211130-36 = "Sure thing! We're always happy to make new friends."
211130-40 = "Mmm! The white chocolate here really is the best!"
211130-41 = "Sorry for letting you treat us. You really didn't have to go that far."
211130-43 = "I'm paying, so don't hold back. Feel free to order seconds, too."
211130-44 = "—That is what Sensei thought."
211130-45 = "[s] \"Not this again...!\""
211130-46 = "Ahaha, so that's how you two roll.#nAs expected, Sensei gets along with everyone."
211130-47 = "So, what was it you wanted to talk about?"
211130-48 = "Um……."
211130-49 = "You two were doing the school broadcasts before, right?"
211130-50 = "Oh, that."
211130-51 = "We only did it once, but it was so much fun! It was our first time doing something like that!"
211130-52 = "Are you interested in school broadcasting?"
211130-53 = "It's not that, but there's something I'm looking into right now."
211130-54 = "The school broadcasts haven't been running lately, have they? Probably ever since you two did yours.#n……Did something happen?"
211130-55 = "Now that you mention it, you're right."
211130-56 = "We didn't mess up, and we didn't break any equipment either…… I wonder why."
211130-57 = "Maybe we were just too good, and the next person felt pressured?"
211130-58 = "No way."
211130-59 = "Oh, but…… we haven't heard anything about the broadcasting club president coming back."
211130-60 = "Actually, back then, there was talk about us continuing the broadcasts."
211130-61 = "We turned it down because we thought it was better for the original person to do it."
211130-66 = "And since then, the broadcasts have stayed off……."
211130-67 = "When you two were broadcasting, was there anything unusual?"
211130-68 = "Like what?"
211130-69 = "Like a technical glitch, or hearing a sound that shouldn't have been there……."
211130-70 = "Come to think of it, there might have been a beep for a split second.#nLike a really high-pitched 'screech!' sound. You know what I mean?"
211130-71 = "……I see."
211130-72 = "Yeah. But Erika fixed it right away!"
211130-74 = "It was just a tangled cable. Once I fixed the wiring, it stopped immediately."
211130-75 = "Anything else?"
211130-79 = "Um…… oh."
211130-80 = "I feel like I heard a strange voice, too."
211130-81 = "Did we? I don't remember that."
211130-82 = "I wasn't sure if I'd misheard it, so I didn't tell anyone."
211130-84 = "What kind of voice was it?"
211130-85 = "Hmm…… it was a woman's voice……."
211130-86 = "I think she was saying…… some words."
211130-87 = "Like 'Te-k-ke-tsu' or 'Chi-tsu-jo'……#nSomething like that, but I don't remember the details."
211130-91 = "Oh, is it okay if I call you Erika-chan?"
211130-92 = "Of course. Erika is fine too."
211130-93 = "So you heard it clearly, Erika-chan?#nWhat we heard was a bit more muffled."
211130-94 = "No, I couldn't make it out clearly either. I just got the general nuance."
211130-95 = "I see…… that's strange."
211130-96 = "But why are you so interested in this?"
211130-97 = "We're currently in the middle of solving this 'ghost' mystery."
211130-98 = "Whoa, that sounds like so much fun! It's so sparkly!"
211130-99 = "We're basically solving students' problems. Just by circumstance, really."
211130-100 = "You do that kind of stuff? Ahaha! That sounds super interesting!"
211130-102 = "How about it? If you're interested, why not join us?"
211130-103 = "Sorry. We're in the Twinkle Twinkle Club Club."
211130-104 = "I think you two would be a perfect fit! Let's make Gehenna great together!"
211130-105 = "Make Gehenna great, huh……."
211130-106 = "Would it be a problem if it became too great?"
211130-107 = "Why? Isn't being the best in Kivotos a good thing?"
211130-108 = "Hmm…… I think that might be a bit too heavy of a mantle for me."
211130-109 = "I'm not trying to be negative, though.#nIt's just that I'm more comfortable with something smaller-scale."
211130-110 = "Hey, what does a 'great Gehenna' look like?"
211130-114 = "Heh, a great Gehenna is!"
211130-115 = "With orderly rules and control, everyone becomes one—"
211130-117 = "And we all push forward toward the same goal with one heart!"
211130-118 = "It's an ideal academy, just like in the pictures!#nJust like the Gehenna of the past!"
211130-124 = "Wouldn't it be boring if everyone was the same?"
211130-129 = "Not at all! Because it's at the end of a long and difficult road, it's great and exciting!"
211130-130 = "But…… then all the dramas and music would end up being the same, right?"
211130-131 = "Isn't it more interesting because we're all different……?"
211130-132 = "……."
211130-134 = "Oh, Mayumi-chan froze up."
211130-136 = "N-no, that's not it! The content and…… um, what was it? The overall direction! They're different things!"
211130-137 = "Hmm……?"
211130-141 = "……Sho……!"
211130-143 = "Shouko!!"
211130-149 = "……Shouko? Don't just sit there thinking, help me out!"
211130-153 = "……Oh."
211130-154 = "What's up? Did something happen?"
211130-155 = "No. I just had something to think about."
211130-156 = "Like what?"
211130-157 = "……."
211130-158 = "It seems we need to get into the broadcasting room."
211130-160 = "Oh, that? Well, we do have to settle this eventually."
211130-162 = "But how do you plan on getting in?"
211130-163 = "We'll have no choice but to negotiate with the Pandemonium Society head-on."
211130-164 = "So coooool!"
211130-165 = "Thanks to our activities, our reputation has risen quite a bit.#nIf we talk to them now, they shouldn't be able to push us around so easily."
211130-167 = "Things just got heavy all of a sudden…… we're rooting for you."
211130-168 = "Yeah! This might be 'sparkly' too!"
211130-169 = "……But before that."
211130-175 = "White Chocolate Chip Frappuccino…… could I have another one?"
211130-179 = "[ns] \"Feel free to order seconds, too.\""
211130-184 = "Next Episode;Shadows of the Flickering Flame"