[translation]
211130-1 = "Episódio 13;A Árvore na Floresta"
211130-2 = ""
211130-3 = ""
211130-6 = ""
211130-7 = "Olá, [ruby=Hatami]Erika Hatami[/ruby]-san e [ruby=Yozakura]Kirara Yozakura[/ruby]-san."
211130-8 = ""
211130-11 = ""
211130-12 = "Ué, vocês conhecem a gente?"
211130-13 = "Vocês são daquele comitê que tá bombando nos grupos da escola, né?"
211130-14 = "O nome era... deixa ver..."
211130-16 = "Comitê de Restauração de Gehenna. Chamo-me [ruby=Igarashi]Shoko Igarashi[/ruby]."
211130-17 = "A gente é do mesmo ano, sabia? Pode falar na boa."
211130-18 = "Sim, estava ciente da equiparação de série."
211130-19 = "Aee, que tudo! Prazerzão!#nE aí, no que a gente pode ajudar?"
211130-20 = ""
211130-25 = ""
211130-26 = "Queríamos fazer algumas perguntinhas pra vocês."
211130-27 = "Claro que só se não for incomodar!"
211130-29 = "...Ué?! O Sensei tá junto também?!"
211130-30 = "[s] \"Olá, Kirara! Oi, Erika!\""
211130-31 = "Gente, a parada é séria assim mesmo?"
211130-32 = "Não demandará excessivo dispêndio de tempo, afianço."
211130-33 = "A gente já tava de saída mesmo, pode perguntar o que quiser!"
211130-34 = "Sendo assim, aceitamos de bom grado sua gentileza."
211130-36 = "Fechado! Amiga nova é sempre super bem-vinda!"
211130-40 = "Huuuuum! Esse frappuccino de chocolate branco daqui é o melhor da vida inteira!"
211130-41 = "Fico até com vergonha de você pagar tudo pra gente, Sensei. Não precisava ter esse trabalho todo."
211130-43 = "'A conta fica inteiramente por minha conta, fiquem à vontade. Se quiserem repetir, é só pedir mais!'"
211130-44 = "――Foi o que o Sensei ponderou intimamente."
211130-45 = "[s] \"De novo com isso, Shoko...?!\""
211130-46 = "Hahaha! Adorei a sintonia de vocês dois!#nO Sensei se enturma fácil com qualquer um mesmo."
211130-47 = "Mas enfim, sobre o que vocês queriam falar?"
211130-48 = "Então..."
211130-49 = "Vocês apresentaram um programa na rádio da escola outro dia, não foi?"
211130-50 = "Ah, aquilo lá!"
211130-51 = "Foi uma vez só, mas foi divertido demais! Nunca tinha feito nada daquele estilo!"
211130-52 = "Vocês têm interesse em locução na rádio?"
211130-53 = "Não é que a gente não goste, mas no momento estamos investigando um mistério."
211130-54 = "A transmissão do colégio tá paralisada desde que vocês apresentaram aquele dia.#n...Aconteceu alguma coisa estranha lá dentro?"
211130-55 = "Parando pra pensar... é verdade, né?"
211130-56 = "A gente não fez nenhuma burrada nem quebrou os aparelhos... por que será?"
211130-57 = "Será que fomos tão brilhantes que a próxima locutora ficou com vergonha de não dar conta do recado?!"
211130-58 = "Nada a ver, viaja não."
211130-59 = "Ah, mas... ninguém soube mais da Presidente do Clube de Radiodifusão desde então."
211130-60 = "Na época, até sugeriram que a gente assumisse a grade da rádio pra sempre."
211130-61 = "Mas achamos que era mancada com quem já cuidava de lá e recusamos o convite."
211130-62 = ""
211130-65 = ""
211130-66 = "E desde então, a rádio continua em silêncio absoluto..."
211130-67 = "Quando estiveram no estúdio, notaram qualquer irregularidade incomum?"
211130-68 = "Tipo o quê?"
211130-69 = "Falhas elétricas inexplicáveis, interferências acústicas estranhas nos fones..."
211130-70 = "Agora que você falou... Rolou um apito estridente por um segundo.#nAquele ruído agudo insuportável, manja?"
211130-71 = "...De fato."
211130-72 = "Pois é! Mas a Erika resolveu no ato!"
211130-74 = "Era só um cabo todo embolado no chão. Dei uma ajeitada na fiação e o barulho sumiu na hora."
211130-75 = "E além disso, mais nada digno de nota?"
211130-76 = ""
211130-78 = ""
211130-79 = "Hum... espera aí."
211130-80 = "Eu tenho quase certeza de que ouvi uma voz bizarra vindo de algum lugar."
211130-81 = "Teve isso?! Nem percebi!"
211130-82 = "Achei que pudesse ter sido delírio meu, por isso não comentei com ninguém."
211130-84 = "Que tipo de timbre possuía a referida voz?"
211130-85 = "Huum... Era a voz de uma mulher..."
211130-86 = "Parecia estar repetindo algumas palavras específicas..."
211130-87 = "Acho que falava '[ruby=teketsu]ferro e sangue[/ruby]'... E também '[ruby=chitsujo]ordem[/ruby]'...#nTenho quase certeza de que era isso, mas não lembro de cada detalhe."
211130-88 = ""
211130-90 = ""
211130-91 = "Ah, posso te chamar de Erika-chan?"
211130-92 = "Claro! Pode chamar de Erika também, sem frescura."
211130-93 = "Você conseguiu ouvir com tanta nitidez assim?#nQuando a gente ouviu no corredor, tava bem mais abafado."
211130-94 = "Não, não foi tão nítido assim não. Foi só pra pegar a ideia geral das palavras."
211130-95 = "Que loucura misteriosa..."
211130-96 = "Mas por que vocês estão tão encucadas com essa história?"
211130-97 = "É que a gente tá no meio de uma investigação desse tal 'caso do fantasma'."
211130-98 = "MENTIIIRA! Que babado incrível! Parece super empolgante e brilhante!"
211130-99 = "A gente abriu uma ouvidoria de alunos pra resolver perrengues, aí calhou de cair nesse caso."
211130-100 = "Vocês fazem isso também?! Hahaha, muito maneiro!"
211130-102 = "E aí? Se curtiram a vibe, não querem entrar no nosso comitê?"
211130-103 = "Uma pena, mas a gente já é do Clube Kirakira de corpo e alma."
211130-104 = "Vocês tinham tudo a ver com a gente! Bora tornar Gehenna grande de novo juntas!"
211130-105 = "Tornar Gehenna grande, é...?"
211130-106 = "Ficar grande demais não dá uma dor de cabeça sem fim?"
211130-107 = "Por que daria?! Ser a número um de Kivotos não é o ápice?!"
211130-108 = "Huum... Eu acho que esse rótulo pesa demais nas costas."
211130-109 = "Não tô falando mal do sonho de vocês, viu?#nÉ que eu prefiro uma vida mais sossegada no meu cantinho, combina mais comigo."
211130-110 = "Mas me conta: como é que seria essa tal Gehenna grandiosa?"
211130-111 = ""
211130-113 = ""
211130-114 = "Humph! A Grande Gehenna será assim:"
211130-115 = "Sob regras impecáveis e rigorosa disciplina, todo mundo unida em um só bloco――"
211130-117 = "Com um único coração batendo no mesmo ritmo rumo a um ideal supremo!"
211130-118 = "Um colégio perfeito e reluzente digno de pintura!#nExatamente como Gehenna era nos tempos de ouro do passado!"
211130-119 = ""
211130-121 = ""
211130-123 = ""
211130-124 = "Mas se todo mundo for igualzinho... não vai ser chato pra caramba?"
211130-125 = ""
211130-128 = ""
211130-129 = "Nada a ver! A jornada é longa e desafiadora, por isso mesmo é grandiosa e emocionante!"
211130-130 = "Mas pensa bem... Séries, músicas, moda... Ia ficar tudo uma cópia da mesma coisa."
211130-131 = "As coisas só têm graça na vida porque cada um tem o seu jeitinho diferente..."
211130-132 = "......"
211130-134 = "Eita, a Mayumi-chan travou a tela de vez."
211130-136 = "N-N-Não é isso! O conteúdo cultural e a... aquela coisa... a diretriz geral são coisas completamente diferentes!"
211130-137 = "Será mesmo...?"
211130-138 = ""
211130-140 = ""
211130-141 = "...Sho...!"
211130-143 = "SHOKO!!"
211130-144 = ""
211130-146 = ""
211130-148 = ""
211130-149 = "...Shoko?! Para de viajar nos seus pensamentos e me acode aqui!"
211130-150 = ""
211130-152 = ""
211130-153 = "...Ah."
211130-154 = "Qual foi? Viajou pra que planeta?"
211130-155 = "Nada. Apenas deparei-me com uma reflexão de peso."
211130-156 = "Que reflexão?!"
211130-157 = "......"
211130-158 = "Pelo visto, adentrar a Sala de Radiodifusão tornou-se uma urgência inadiável."
211130-160 = "Ah, voltamos pro caso da assombração? Bom, temos que encerrar o mistério mesmo."
211130-162 = "Mas como você planeja entrar lá com a porta trancada a chave?"
211130-163 = "Não nos resta alternativa senão negociar frontalmente... com a Sociedade Pandemônio."
211130-164 = "Que audácia mais estilosa!"
211130-165 = "Nossos feitos recentes elevaram substancialmente o nosso peso político.#nEm uma mesa de negociações direta, não seremos desfeiteadas com facilidade agora."
211130-167 = "O papo ficou denso do nada... Mas tô torcendo por vocês!"
211130-168 = "Isso aí! Essa determinação de vocês tem muito brilho!"
211130-169 = "...Antes disso."
211130-170 = ""
211130-172 = ""
211130-174 = ""
211130-175 = "Seria possível solicitar... mais um Frappuccino de Chocolate Branco com Raspas ao Sensei?"
211130-176 = ""
211130-179 = "[ns] \"O refil tá liberado, pode pedir o quanto quiser.\""
211130-184 = "A Seguir;A Sombra das Chamas Trêmulas"
