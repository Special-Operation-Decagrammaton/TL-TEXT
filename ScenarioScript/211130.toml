[translation]
211130-1 = "Эпизод 13;Дерево в лесу"
211130-2 = ""
211130-3 = ""
211130-6 = ""
211130-7 = "Хатами Эрика и Ёзакура Кирара. Здравствуйте."
211130-8 = ""
211130-11 = ""
211130-12 = "А? Мы знакомы?"
211130-13 = "Ты..."
211130-14 = "Вы ведь руководите тем новым модным клубом, да? А ты, кажется..."
211130-16 = "Игараши Шоуко."
211130-17 = "А! Точно! Круто, мы с тобой на одном курсе. Знала?"
211130-18 = "В общих чертах."
211130-19 = "Хи-хи, наконец-то познакомились! Ну и чем вы все занимаетесь?"
211130-20 = ""
211130-25 = ""
211130-26 = "И вам привет! Здорово, дай пять! Вообще-то мы хотели кое-что спросить. Есть минутка?"
211130-27 = "Но мы вас не заставляем. Если некогда, ничего страшного."
211130-29 = "А знаешь, кажется, я вас уже где-то видела! Лица знакомые."
211130-30 = "[s] «Привет, Кирара и Эрика»."
211130-31 = "Сенсей тоже здесь?! Ого, что происходит?"
211130-32 = "Повторю: у нас всего один простой вопрос. Вы можете уделить нам минуту?"
211130-33 = "«Да». Это ответ на твой вопрос? Мы как раз собирались возвращаться."
211130-34 = "Превосходно. Поговорим по дороге."
211130-36 = "Ладно! Чем больше народу, тем веселее! Пошли!"
211130-40 = "Точно! Белый шоколад здесь всегда что надо!"
211130-41 = "Вам вовсе не обязательно было нас угощать, но всё равно спасибо."
211130-43 = "«Я угощаю, так что ни в чём себе не отказывайте. Заказывайте сколько хотите!»"
211130-44 = "...Именно это вы и собирались сказать, верно, Сенсей?"
211130-45 = "[s] «Опять за своё...!»"
211130-46 = "Ахаха. Наверное, у вас такая шутка. Вы со всеми находите общий язык, Сенсей."
211130-47 = "Итак, о чём вы хотели поговорить?"
211130-48 = "Отлично! Тогда сразу к делу."
211130-49 = "Вы ведь вдвоём вели школьную радиопередачу?"
211130-50 = "Ага, было такое."
211130-51 = "Всего один вечер, зато как весело! Я раньше никогда этим не занималась, а Эрика ещё и спела!"
211130-52 = "Лига наследия интересуется радиовещанием?"
211130-53 = "Эм, мы не исключаем такой возможности. Но сначала нам надо кое в чём разобраться."
211130-54 = "Во время вашей последней радиопередачи... ничего странного не случилось?"
211130-55 = "А, точно. После нашего выпуска всю программу закрыли."
211130-56 = "Интересно почему. Ироха сказала, что всем очень понравилось, и мы ничего плохого не делали. Хм..."
211130-57 = "Может, мы выступили НАСТОЛЬКО хорошо, что после нас никто не осмелился выходить в эфир?"
211130-58 = "Ха-ха. Ну да, конечно."
211130-59 = "Я думала, прежний председатель Клуба радиовещания уже вернулся."
211130-60 = "Нас даже спрашивали, не хотим ли мы продолжать! Так что нас вовсе не уволили!"
211130-61 = "Но мы отказались из уважения к другим. Участники настоящего Клуба радиовещания тоже заслуживают шанса..."
211130-62 = ""
211130-65 = ""
211130-66 = "А потом эфир окончательно замолчал."
211130-67 = "Когда вы были в прямом эфире, ничего необычного не произошло? Никаких странностей?"
211130-68 = "«Странностей»...?"
211130-69 = "Ну, например, какой-нибудь сбой или непонятный звук..."
211130-70 = "Ага, был короткий писк. Очень высокий, будто проверочный сигнал. Ужасно раздражал."
211130-71 = "...Вот как?"
211130-72 = "Угу. Но Эри тут же всё исправила!"
211130-74 = "Просто несколько кабелей перепутались, и я их распутала. Ничего особенного."
211130-75 = "И это всё?"
211130-76 = ""
211130-78 = ""
211130-79 = "Эм... А!"
211130-80 = "Если подумать, я вроде слышала ещё что-то странное."
211130-81 = "А? Правда?"
211130-82 = "Ага. Но я никому не говорила, потому что, кажется, больше никто этого не заметил."
211130-84 = "Что именно ты слышала...?"
211130-85 = "Ну... Женский голос..."
211130-86 = "Будто кто-то пытался произнести какие-то слова..."
211130-87 = "Подробностей не помню. Что-то вроде «железо, кровь, порядок»... Или что-то такое. Может, из медицины? Не знаю."
211130-88 = ""
211130-90 = ""
211130-91 = "Эм, Эри? Тебе нравится, когда тебя так называют?"
211130-92 = "Многие друзья меня так зовут! Но «Эрика» тоже подойдёт."
211130-93 = "Эрика, ты отчётливо слышала эти слова? Потому что мы почти ничего не разобрали, но кое-что услышали..."
211130-94 = "Эм, не уверена, что моим словам стоит доверять. Что-то про кровь и всё такое, но лучше на меня не ссылаться."
211130-95 = "Хм... Любопытно."
211130-96 = "Кстати, а зачем вы нас обо всём этом расспрашиваете?"
211130-97 = "О, мы пытаемся разгадать одну загадку с призраком."
211130-98 = "Ого, как здорово! Звучит весело! Прямо искорки в глазах загораются!"
211130-99 = "Как-то так вышло, что мы стали и консультантами студентов, и исследователями паранормального. Йаха!"
211130-100 = "Значит, Лига наследия и таким занимается? Не знала! Ахаха! Как весело!"
211130-102 = "О, вам интересно? Хотите вступить в Лигу наследия?"
211130-103 = "А, простите, но мы уже состоим в клубе. Собственно, мы и есть Клуб «Мерцание»."
211130-104 = "По-моему, вы обе нам прекрасно подойдёте! Давайте вместе возродим величие Геенны! Что скажете?"
211130-105 = "Великая Геенна..."
211130-106 = "Ой, а что будет, если она станет ЧЕРЕСЧУР великой? Даже страшно, ха."
211130-107 = "М? Что ты имеешь в виду? Наши возможности безграничны. Мы превратим Геенну в величайшую академию Кивотоса!"
211130-108 = "Ну... Для меня это, пожалуй, слишком."
211130-109 = "Я не говорю, что в этом есть что-то плохое. Просто предпочитаю жить без лишнего шума."
211130-110 = "Ага, расскажите! Какой будет эта великая Геенна?"
211130-111 = ""
211130-113 = ""
211130-114 = "Кхм. Рада, что вы спросили. ВЕЛИКАЯ ГЕЕННА!"
211130-115 = "Академия, объединённая строгим порядком и всеобщей сплочённостью..."
211130-117 = "...устремлённая к единой цели, движимая единым разумом!"
211130-118 = "Совершенная академия, воплощение идеала! Такой Геенна была когда-то! И ТАКОЙ ОНА СТАНЕТ ВНОВЬ!"
211130-119 = ""
211130-121 = ""
211130-123 = ""
211130-124 = "Эм, но разве не будет скучно, если все начнут «думать одинаково»?"
211130-125 = ""
211130-128 = ""
211130-129 = "Нет! Будет КРУТО, ВЕЛИЧЕСТВЕННО и ВЕСЕЛО, ведь мы добьёмся единства!"
211130-130 = "Если все будут думать одинаково, разве телепередачи и музыка не станут совершенно одинаковыми?"
211130-131 = "Мне кажется, всё интересно как раз ПОТОМУ, что у людей разные взгляды..."
211130-132 = "..."
211130-134 = "Ого, Маюми даже лишилась дара речи."
211130-136 = "Э-это другое! Ну, творческие произведения и... эм... общее направление! Общество! Это совершенно разные вещи!"
211130-137 = "Хм..."
211130-138 = ""
211130-140 = ""
211130-141 = "...Шо...!"
211130-143 = "Шоуко!!"
211130-144 = ""
211130-146 = ""
211130-148 = ""
211130-149 = "Шоуко! Ты что делаешь? Вмешайся и объясни все гениальные подробности!"
211130-150 = ""
211130-152 = ""
211130-153 = "Ах..."
211130-154 = "Что случилось, Шоуко? Всё в порядке?"
211130-155 = "Ничего. Просто задумалась."
211130-156 = "О чём?"
211130-157 = "..."
211130-158 = "Думаю, нам нужно попасть в радиорубку."
211130-160 = "А, точно, призраки. Поняла. Надо довести это дело до конца."
211130-162 = "Как мы туда попадём?"
211130-163 = "...Полагаю, придётся обратиться к Пандемониуму."
211130-164 = "Ого! Смелое решение!"
211130-165 = "Мы заметно выросли. Полагаю, теперь мы уже не уступим им... даже если придётся столкнуться с ними лицом к лицу."
211130-167 = "Кажется, всё становится серьёзно. Что ж, мы будем за вас болеть."
211130-168 = "Ага! Удачи в штурме крепости, пусть всё сверкает!"
211130-169 = "...Но прежде..."
211130-170 = ""
211130-172 = ""
211130-174 = ""
211130-175 = "Сенсей, можно мне ещё один фраппе с кусочками белого шоколада?"
211130-176 = ""
211130-179 = "[ns] «Заказывайте сколько хотите...»"
211130-184 = "Следующий эпизод;Тень под пламенем"
