[translation]
42030-1 = "Episódio 3;Isca"
42030-3 = "...Sim, assim já está bem assado."
42030-4 = "Então—"
42030-6 = "Bom apetite!"
42030-11 = "E-Esse sabor... é pecaminoso demais...!!"
42030-13 = "Logo na primeira mordida a gordura derrete...#nE esse sabor concentrado enche a boca toda..."
42030-14 = "Que diabos era a carne bovina que eu comi a vida inteira..."
42030-15 = "Derrete no instante em que entra na boca... A gordura é tão docinha..."
42030-16 = "É realmente uma carne de altíssima qualidade...#nÉ um luxo tão grande que meu paladar até fica sem graça..."
42030-17 = "[ns] \"Tem carne de sobra, então comam à vontade.\""
42030-18 = "Muito obrigada. Mas... tem certeza mesmo de que tudo bem?#nMesmo sendo um agradecimento, aceitar uma carne tão cara assim..."
42030-19 = "...É verdade, é luxuoso demais para ser só uma recompensa por aquilo."
42030-20 = "Será que... essa carne é uma isca para nos atrair para uma armadilha?!"
42030-21 = "Enganar o alvo com algo doce..."
42030-22 = "E-Essa é a famosa honey trap...?"
42030-23 = "[s1] \"Acho que o significado é um pouco diferente...\"\n[s2] \"É só um agradecimento sincero, não se preocupem.\""
42030-24 = "...Tanto faz. Se a armadilha for assim, eu caio quantas vezes precisar."
42030-25 = "...Tanto faz. Se a armadilha for assim, eu caio quantas vezes precisar."
42030-26 = "Encher a barriga de carne bovina de primeira assim#né algo que não vamos conseguir fazer nem se voltarmos para a Academia Especial SRT."
42030-27 = "Pois é. Carne de porco enlatada barata a gente pode comer à vontade, né."
42030-28 = "Ugh... Estamos finalmente comendo carne boa, não me faça lembrar disso..."
42030-29 = "De fato, as rações distribuídas nos exercícios de campo da SRT eram sempre carne de porco em conserva."
42030-30 = "Teve uma vez, num treinamento de acampamento, que ficamos mais de quatro dias comendo só carne de porco enlatada..."
42030-31 = "Aquela vez em que só tínhamos lata gordurosa para comer logo cedo de manhã...#nNunca mais quero passar por uma experiência horrível daquelas..."
42030-33 = "Mas... por que os suprimentos da SRT só têm carne de porco enlatada...?"
42030-34 = "Pelo menos podia ter corned beef ou atum em lata..."
42030-35 = "Ora, porque é o mais barato."
42030-36 = "Os figurões adoram ficar brincando com números.#nExiste até o ditado de que \"suprimentos devem ser sempre entregues pelo menor preço de licitação\"."
42030-37 = "Carne de porco enlatada é barata e tem validade longa.#nPor isso sempre foi muito usada como ração de combate."
42030-38 = "Para ter uma ideia do quanto era usada...#nUm certo romancista de Trinity ficou tão enjoado de comer carne de porco enlatada nas refeições#nque trocou todas as comidas das suas histórias por carne de porco enlatada em forma de protesto."
42030-39 = "A gente nem tá comendo carne de porco enlatada agora, precisa mesmo falar disso?"
42030-40 = "Cala a boca."
42030-42 = "Eu também conheço esse escritor. Se não me engano, numa obra dele,#nhavia uma história sobre cavaleiros em busca do Santo Graal que lutam contra um coelho selvagem, não é?"
42030-43 = "Tinha isso mesmo — o que tem?"
42030-44 = "...Quando o Esquadrão RABBIT tinha acabado de ser criado, eu perguntei à nossa senpai."
42030-45 = "Disse que \"coelho\" é um nome bonitinho,#nmas que talvez não combinasse com um esquadrão da SRT que exerce força de elite."
42030-46 = "Então, a senpai me respondeu citando justamente essa obra."
42030-47 = "Ela disse: \"À primeira vista, o coelho é um animal dócil e fofo,#nmas, quando fica furioso, vira uma fera terrível capaz de enfrentar até cavaleiros armados\"."
42030-48 = "Realmente, naquela história os cavaleiros que procuravam o Santo Graal#nlevaram mordidas no pescoço do coelho que guardava a caverna e saíram correndo."
42030-49 = "Quem subestima pela aparência acaba se arrependendo."
42030-50 = "E como acaba essa história?#nOs cavaleiros perdem pro coelho e desistem de procurar o Santo Graal?"
42030-51 = "Não, o coelho acaba sendo pulverizado por uma granada usada pelos cavaleiros..."
42030-52 = "No fim... por mais forte que um coelho seja,#nele não passa de um ser indefeso diante de uma granada..."
42030-53 = "O nosso futuro também... com certeza vai ser assim..."
42030-54 = "Não liga pra isso, é só uma metáfora, né?"
42030-55 = "Por enquanto, vamos focar no sabor dessa carne de primeira."
42030-57 = "A propósito, Sensei. Com todo aquele incidente da Kaiser PMC, não sumiu nenhum objeto nem nada?"
42030-58 = "Deve haver muitas coisas ligadas ao Conselho Estudantil Geral na Schale, então fiquei um pouco preocupada..."
42030-59 = "[s] \"Acho que não sumiu nada, mas...\""
42030-61 = "[ns3] \"Ainda nem terminei de arrumar tudo depois do incidente.\"\n[ns4] \"Quando tiver um tempo, vou dar uma conferida.\""
42030-62 = "Se for assim, eu confiro agora mesmo pra você~"
42030-63 = "Se for assim, eu confiro agora mesmo pra você~"
42030-64 = "Agora? Como?"
42030-65 = "Moe-chan... por acaso você está negociando informações por baixo dos panos com a Kaiser PMC...?"
42030-66 = "Claro que não, né!"
42030-67 = "Pelas gravações das câmeras de segurança!#nSe eu hackear as câmeras perto da entrada da Schale,#ndá pra ver quem entrou e saiu do prédio, a que horas e o que levou~"
42030-68 = "Não passou tanto tempo assim entre o sequestro do Sensei e a retomada da Schale, e não deve ter entrado e saído tanta gente, então se alguém estiver carregando algo suspeito vai dar pra identificar rapidinho."
42030-69 = "Ooh, até que foi esperta para o seu nível, Moe."
42030-70 = "O quê, comer carne cara fez o seu cérebro funcionar?"
42030-71 = "Tá querendo ir pelos ares, é?!"
42030-75 = "Vamos ver... Hackeando a segurança do servidor em nuvem das câmeras..."
42030-80 = "...Prontinho! Essa é a filmagem do dia do incidente."
42030-84 = "Ah... isso é da operação de retomada..."
42030-85 = "Esses caras de capacete com visor aqui#neram aqueles tais de SOF ou SOAP da Kaiser, né?#nPara quem carregava armas tão chamativas, não eram grande coisa."
42030-87 = "Foi graças à Miyu ter distraído os inimigos com os disparos de precisão.#nSe tivéssemos avançado de frente, também teríamos sofrido baixas consideráveis."
42030-88 = "Foi graças à Saki-chan e à Miyako-chan terem invadido primeiro...#nVocês duas passaram a posição dos inimigos, então consegui atirar sem problemas..."
42030-89 = "Hehe, até que foi divertido..."
42030-90 = "...Vocês não tão parecendo que estão folheando um álbum de formatura, não?#nPrestem atenção no que os soldados estão carregando!"
42030-92 = "Hmm... daqui pra frente já éramos nós fazendo a vigilância, então deixa eu voltar mais um pouco..."
42030-96 = "Hã? Quem são esses soldados mascarados?#nNão parecem ser da Kaiser PMC."
42030-100 = "Esses caras... estão carregando uma carga que não tinham quando entraram."
42030-101 = "[s] \"Dá para ver o que eles estão levando?\""
42030-102 = "A imagem tá granulada demais pra ver isso..."
42030-103 = "Mas, pelo jeito que se movem, são soldados muito bem treinados.#nAs armas também são de altíssimo nível..."
42030-108 = "...Saki."
42030-109 = "Sim, aquele equipamento..."
42030-111 = "Ué? Por que vocês duas ficaram sérias de repente?"
42030-112 = "Os soldados não identificados que roubaram algo da Schale... parecem estar usando equipamentos da SRT."
42030-113 = "C-Como assim...? Equipamentos da SRT...?"
42030-114 = "A mira a laser que o sujeito que parece ser o líder está usando#né uma mira dupla combinada de infravermelho e luz visível."
42030-115 = "Além de cara, não dá para usar direito sem visão noturna,#nentão não há registro de produção oficial fora as distribuídas para as alunas da SRT."
42030-116 = "Além disso, os rádios comunicadores que os soldados estão usando provavelmente também são fabricados pela SRT.#nO design é completamente diferente dos da Kaiser Industry."
42030-117 = "Quê? Como assim?!"
42030-118 = "[s] \"Hã? Descobriram alguma coisa?\""
42030-119 = "N-Não é nada! Só nos empolgamos falando de tática..."
42030-120 = "Shh, Moe. Fale mais baixo, por favor."
42030-121 = "D-Desculpa... é que eu levei um susto..."
42030-123 = "Mas soldados de fora usando equipamento da SRT..."
42030-124 = "...Só existem duas formas de alguém de fora conseguir equipamentos da SRT."
42030-125 = "Atacar a SRT e roubar os equipamentos—"
42030-126 = "— Ou receber diretamente de uma aluna da SRT."
42030-127 = "Não, não, a segunda opção tá fora de cogitação, né~#nA gente não é um bando de mercenários amadores, por que uma integrante da SRT entregaria equipamento pra soldados de PMC—"
42030-129 = "Bom, de certa forma é voltar às origens, um método clássico de negociação."
42030-130 = "A gente entrega algo valioso que temos e recebe armas e munição em troca."
42030-133 = "Ah."
42030-134 = "Ah."
42030-135 = "Pensando bem, daquela vez em que o acampamento alagou,#nvendemos parte dos equipamentos de forças especiais que quase não usávamos..."
42030-136 = "Pensando bem, aquele traficante de armas... escondia o rosto e era bem suspeito..."
42030-137 = "Espera. Então quer dizer que as armas que vendemos#nforam parar nas mãos dos caras que atacaram a Schale?"
42030-138 = "...Droga, desse jeito, em vez de receber agradecimentos do Sensei, somos nós que devíamos pedir desculpas."
42030-143 = "[ns5] \"A propósito, pessoal, já estão cheias?\"\n[ns6] \"Ainda tem bastante carne.\""
42030-144 = "Bem, é que..."
42030-145 = "Bem, é que..."
42030-146 = "Aah~, não se preocupa! A gente já comeu carne até estourar!"
42030-147 = "E-Eu também... acho que já cheguei no limite..."
42030-148 = "Além disso, acabamos de lembrar de um assunto urgente."
42030-149 = "[s] \"Assunto urgente...? Aconteceu alguma coisa?\""
42030-150 = "Não fique perguntando tudo! Não tem nada a ver com você, Sensei!"
42030-151 = "[s] \"Então vou guardar a carne que sobrou na geladeira da Schale.\""
42030-152 = "Sim, por favor."
42030-156 = "Hã... será que não deveríamos contar ao Sensei#nque as armas que vendemos podem ter sido usadas no ataque à Schale...?"
42030-157 = "O Sensei pode ter passado por algo terrível por nossa culpa..."
42030-158 = "...É claro que vamos pedir desculpas.#nMas, agora, encontrar os culpados vem primeiro."
42030-159 = "Sim, eu também acho."
42030-160 = "Além disso, o Sensei deve ficar ocupado por um tempo lidando com as consequências do incidente...#nÉ melhor não darmos ainda mais preocupações."
42030-162 = "Vamos capturar os culpados, recuperar o que foi roubado...#ne depois explicar tudo ao Sensei e pedir desculpas."
42030-163 = "Moe, você consegue rastrear para onde foram as armas que negociamos?"
42030-164 = "Consigo, é só rastrear a chave única dos equipamentos eletrônicos.#nAcho que vai levar um tempinho, mas dá."
42030-165 = "Então conto com você.#nQuanto às demais, verifiquem seus equipamentos para que possamos partir a qualquer momento."
42030-166 = "Aos ladrões que usaram equipamentos da SRT para cometer crimes...#nVamos dar uma lição que eles nunca vão esquecer."
42030-170 = "[ns] \"Ah, parece que sobrou um pouco de carne de porco também...\""
42030-172 = "[ns9] \"Ué, pessoal...?\"\n[ns10] \"Para onde será que elas foram...?\""
42030-176 = "Próximo;Reencontro Inesperado"
