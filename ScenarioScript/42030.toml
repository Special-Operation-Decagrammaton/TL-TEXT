[translation]
42030-1 = "Эпизод 3;Приманка"
42030-3 = "Готово! Идеальная прожарка!"
42030-4 = "Тогда без лишних церемоний..."
42030-5 = ""
42030-6 = "Спасибо за еду!"
42030-7 = ""
42030-9 = ""
42030-10 = ""
42030-11 = "О-О-Ого! Это лучше самых безумных ожиданий!"
42030-13 = "Тающая во рту текстура благодаря мраморности и этот невероятный насыщенный вкус, который бывает только у лучшей говядины..."
42030-14 = "Теперь вся говядина, которую я ела раньше, кажется подделкой... Она просто не выдерживает сравнения."
42030-15 = "Вкусно... Так вкусно... Такое мягкое, будто т-тает во рту. Как пудинг..."
42030-16 = "Не помню, когда мы в последний раз позволяли себе такую роскошь... Даже немного стыдно."
42030-17 = "[ns] «Мяса более чем достаточно, так что не стесняйтесь.»"
42030-18 = "Сенсей... Даже если это благодарность, не слишком ли? Наверняка стоило ужасно дорого..."
42030-19 = "Точно! Я немного подозреваю... Награда явно превосходит заслугу."
42030-20 = "Эта говядина... часть одного из ваших злых планов?!"
42030-21 = "В-Вы решили заманить нас в ловушку в-вкусной едой!"
42030-22 = "Наверное, это та самая «медовая ловушка», о которой я слышала..."
42030-23 = "[s1] «Нет! И это вообще НЕ то, что означает „медовая ловушка“!»\n[s2] «У меня нет скрытых мотивов. Вам всем нужно научиться принимать подарки.»"
42030-24 = "Знаете что? Мне всё равно, даже если это ловушка."
42030-25 = "Знаете что? Мне всё равно, даже если это ловушка."
42030-26 = "Такой шанс набить живот самой качественной говядиной нельзя упускать! Даже в SRT мы бы такого не попробовали."
42030-27 = "Хотя в SRT я набивала живот дешёвой консервированной свининой. Ням."
42030-28 = "Ух... Можешь не портить лучший ужин моей жизни мыслями о консервированной свинине?"
42030-29 = "Мы и правда ели много свинины, да? Почти в каждом сухпайке она была в том или ином виде."
42030-30 = "Помню, однажды полевые учения затянулись дольше плана и больше трёх дней мы жили на одной консервированной свинине..."
42030-31 = "Фу... Этот склизкий вкус я бы с радостью никогда больше не вспоминала... Спасибо, Мияко."
42030-33 = "Я-я никогда не задумывалась... Почему везде именно свинина?"
42030-34 = "П-Почему не солонина...? Или хотя бы тунец..."
42030-35 = "Потому что дёшево и практично. Очевидно же."
42030-36 = "Начальство видит только цифры. В учебниках так и написано: снабжение — количество важнее качества. Армию не прокормишь, если думать о комфорте и излишествах."
42030-37 = "Поэтому консервированная свинина так долго остаётся стандартным боевым рационом. Это консервированное мясо: дёшево и долго хранится. Даже обычные академии подхватили идею и начали использовать её в школьных столовых."
42030-38 = "Как-то раз в столовых её стало настолько много, что одна писательница из Тринити протестовала: заменила все упоминания еды в своём произведении на «консервированную свинину» и раскидала копии по кампусу."
42030-39 = "Ого. Огромное спасибо. Мне определённо было необходимо это знать. Нет. З-а-д-р-о-т-к-а."
42030-40 = "Заткнись, маньячка-поджигательница!"
42030-42 = "Кстати, разве у той писательницы из Тринити не была сцена, где группа рыцарей в поисках Святого Грааля сражалась с диким кроликом?"
42030-43 = "Что-то такое помню. И что?"
42030-44 = "Давным-давно, примерно когда отряд RABBIT только появился, я спросила старших о нашем названии."
42030-45 = "Мне было интересно, почему нас назвали в честь милого безобидного животного. SRT должна была быть символом дисциплины и справедливости, а не пушистых лапок и висячих ушек."
42030-46 = "Ответ оказался совсем не таким, как я ожидала. Она процитировала ту книгу."
42030-47 = "«Не стоит недооценивать кролика из-за его покладистой и милой внешности. Гордый и территориальный, спровоцированный кролик становится грозным зверем, способным отбиться даже от храбрых рыцарей»."
42030-48 = "Кажется, помню эту сцену. Рыцари, ищущие Святой Грааль, пытаются войти в пещеру, которую охраняет кролик, а он вырывает им глотки."
42030-49 = "И поэтому на занятиях по тактике и стратегии нас учили никогда не судить противника по внешности."
42030-50 = "Ну не обрывай на самом интересном. Кролик всех рыцарей избивает, и они сдаются и уходят домой?"
42030-51 = "Н-Ну... Эм, рыцари бросают в кролика гранату, и его разрывает на кусочки..."
42030-52 = "П-Потому что никакой кролик не сможет победить оружие... гранаты... бомбы... или плохих людей..."
42030-53 = "Нас тоже в итоге взорвут, как того кролика!"
42030-54 = "Эй! Концовка какой-то тупой книжки из школьной программы к нам отношения не имеет."
42030-55 = "Единственное, о чём тебе сейчас нужно думать, — эта великолепная говядина."
42030-57 = "Это немного внезапно, Сенсей, но меня недавно кое-что беспокоит. Не пропали ли какие-нибудь секретные документы во время оккупации Шале силами Кайзер..."
42030-58 = "Я переживаю из-за количества данных Генерального студенческого совета, которые хранятся в здании Шале..."
42030-59 = "[s] «Ничего особенно подозрительного я не заметил...»"
42030-61 = "[ns3] «Но мы не проводили тщательный поиск. Всё было разгромлено.»\n[ns4] «Раз ты сказала, наверное, стоит перепроверить...»"
42030-62 = "Я могу! Секунду..."
42030-63 = "Я могу! Секунду..."
42030-64 = "Проверить? Отсюда? Как?"
42030-65 = "М-Моэ... Ты опять передала Кайзер разведданные ради оружия...?"
42030-66 = "Эй! Это было один раз, ясно?!"
42030-67 = "Но сейчас не это! Мне нужно просто залезть на сервер Шале и достать записи камер. Проверим входы и выходы: кто там был и что вынес."
42030-68 = "Оккупация здания Кайзер после похищения Сенсея длилась недолго. Достаточно проверить выходы за тот промежуток и убедиться, что ничего важного не украли."
42030-69 = "Хм. На удивление хорошая идея от Моэ."
42030-70 = "Ты в порядке? Такая вкусная еда свела тебя с ума?"
42030-71 = "Заткнись! Я тебя взорву!"
42030-72 = ""
42030-74 = ""
42030-75 = "Уф. Если не обращать внимания на качка, думаю, я легко зайду на облачный сервер и вытащу записи камер..."
42030-76 = ""
42030-80 = "Хи-хи! Ага! Вот они. Записи наблюдения со дня нападения."
42030-81 = ""
42030-83 = ""
42030-84 = "Ах... Здесь примерно тот момент, когда мы отбили здание."
42030-85 = "Эти ребята в шлемах были супераэлитным спецназом Кайзер? SOAP или как там? Оружие у них впечатляющее, а пользоваться им не умеют."
42030-87 = "Так легко было только благодаря стрельбе Мию. Без неё пришлось бы идти в лоб и получать урон."
42030-88 = "П-Правда...? Но я бы не справилась без Саки впереди, которая передавала позиции... И Мияко тоже..."
42030-89 = "Хи-хи. Для этого и нужен отряд. Весёлая была операция..."
42030-90 = "Мы уже звучим как старушки, вспоминающие славные времена. Хватит болтать, помогите проверить, не вынес ли кто из солдат Кайзер что-нибудь!"
42030-92 = "Ну, здесь ничего не видно... Вернусь чуть назад..."
42030-93 = ""
42030-96 = "Кто эти солдаты? Эти маски и форма не похожи на Кайзер."
42030-97 = ""
42030-98 = ""
42030-99 = ""
42030-100 = "Вот там... Они что-то выносят из подвала. Видите руки? Когда заходили, у них этого не было."
42030-101 = "[s] «Можешь понять, что это?»"
42030-102 = "Не особо... Качество видео ужасное, а двигаются они быстро."
42030-103 = "Даже слишком быстро. Ни одного лишнего движения, уверенно обращаются с современным оружием..."
42030-104 = ""
42030-106 = ""
42030-107 = ""
42030-108 = "...Саки, ты тоже это видишь?"
42030-109 = "Видео зернистое, но это снаряжение я узнаю где угодно..."
42030-111 = "Ладно-ладно! Госпожа Мрак-и-уныние, поделишься с классом?"
42030-112 = "Ты права, эти солдаты не похожи на Кайзер... Они используют снаряжение SRT."
42030-113 = "Н-Но всё оставшееся снаряжение SRT у нас..."
42030-114 = "Лазерный целеуказатель лидера... Это двойной комбинированный модуль с инфракрасным и видимым лазером."
42030-115 = "Он безумно дорогой и почти бесполезен без приборов ночного видения, поэтому его фактически производили только для студентов SRT."
42030-116 = "И рация, которой они пользуются... Не уверена на сто процентов, но очень похожа на SRT. Всё оборудование SRT проектировалось специально под наши нужды, и на технологии связи Кайзер это точно не похоже."
42030-117 = "Вы серьёзно?! Но как оно у них оказалось?"
42030-118 = "[s] «А? Вы что-то сказали?»"
42030-119 = "Эм, н-нет! Ничего! Просто немного увлеклась разговором о тактике... Сами понимаете!"
42030-120 = "Знаю, тебе это не свойственно, Моэ, но говори тише. Сенсею нельзя знать, пока не разберёмся."
42030-121 = "Права, прости. Просто невероятно."
42030-123 = "Я-я тоже так думаю... Не понимаю, как случайные люди могли достать снаряжение SRT..."
42030-124 = "Я вижу только два варианта."
42030-125 = "Первый: они напали на отряд или базу SRT и забрали оборудование."
42030-126 = "Второй — кто-то из студентов SRT сам им его передал."
42030-127 = "Вот что невозможно. Ни один студент SRT не был бы настолько тупой, чтобы отдать оборудование солдатам ЧВК. Мы элитные агенты, а не какие-то грубые жадные..."
42030-129 = "Люди обменивались вещами ещё до того, как научились говорить."
42030-130 = "Так что всё просто-просто: обменяем наши ценные вещи на новые прекрасные зажигательные средства... и оружие!"
42030-131 = ""
42030-133 = "Ах."
42030-134 = "Ах."
42030-135 = "Похоже, тупыми студентами SRT были мы. После затопления лагеря мы продали часть необязательного оборудования, чтобы компенсировать потери."
42030-136 = "П-Помните тех торговцев оружием? У них были огромные маски, лиц не было видно..."
42030-137 = "То есть... именно мы, отряд RABBIT, снабдили оружием тех, кто напал на Шале?"
42030-138 = "...А теперь сидим и объедаемся дорогим мясом, которое нам дали в благодарность за борьбу с этими же нападавшими..."
42030-139 = ""
42030-141 = ""
42030-143 = "[ns5] «Все наелись? Точно больше не хотите?»\n[ns6] «Хватит болтать, идите есть! Тут ещё куча мяса!»"
42030-144 = "Мы... Ну, эм..."
42030-145 = "Мы... Ну, эм..."
42030-146 = "Ох... Кажется, у меня тот самый «пищевой живот»..."
42030-147 = "У-У меня тоже! Да! Я н-никогда ещё не была настолько сыта..."
42030-148 = "Ого! Я внезапно вспомнила об ужасно срочном деле на сегодня. Прямо сейчас!"
42030-149 = "[s] «Что могло внезапно стать настолько срочным? Тебе в туалет?»"
42030-150 = "Уф, нет! У вас вообще фильтра нет, Сенсей!"
42030-151 = "[s] «Я просто дразню. Тогда оставлю остальное мясо вам в Шале.»"
42030-152 = "Спасибо, Сенсей."
42030-153 = ""
42030-156 = "М-Мы не скажем Сенсею, что продали оружие плохим ребятам?"
42030-157 = "Мне стыдно... Если бы не мы... Сенсей не пережил бы всего этого..."
42030-158 = "Мне тоже стыдно, Мию. Мы обязательно расскажем Сенсею и извинимся, но сначала нужно поймать виновных."
42030-159 = "Мияко права. Если пойдём к Сенсею сейчас, просто принесём ещё одну проблему. У него и так дел хватает — восстановительный проект и всё остальное."
42030-160 = "Последнее, что нужно Сенсею, — ещё одна причина переживать, особенно из-за нашей ошибки."
42030-162 = "Да. Найдём виновных, вернём украденное, а потом нормально извинимся перед Сенсеем."
42030-163 = "Для начала нужна твоя помощь, Моэ. Собери всю информацию, какую сможешь, о том, куда ушло оружие после продажи."
42030-164 = "Это займёт время, но возможно. Если отследить уникальные ключевые значения в электронике, надеюсь, получится проследить путь."
42030-165 = "Остальные — начинайте штатную проверку всего оборудования. Быстро, чтобы мы могли выдвинуться сразу, как Моэ найдёт нужное."
42030-166 = "Я больше не позволю этим торговцам оружием пачкать снаряжение SRT своей несправедливостью."
42030-170 = "[ns] «Знаю, вы сказали, что наелись, но я забыл про лишнюю свинину...»"
42030-172 = "[ns9] «Мияко...? Саки...?»\n[ns10] «Куда все ушли...?»"
42030-176 = "Следующий эпизод;Неожиданная встреча"
