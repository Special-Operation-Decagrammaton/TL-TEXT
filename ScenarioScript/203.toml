[translation]
203-1 = "Репликанты наслаждения"
203-2 = ""
203-3 = "Говорят, каждая эмоция — репликант первозданного истока."
203-4 = "Радость, наслаждение, желание, гнев... Всё происходит из воспроизведения."
203-5 = ""
203-6 = "Как художника, меня вдохновляет такой взгляд. Он наполняет меня восторгом, хотя я и не вижу, куда заведёт такое вдохновение."
203-7 = "..."
203-8 = "Прошу прощения."
203-9 = "Рад познакомиться, Сенсей. Надеюсь, вы простите мне отсутствие манер."
203-10 = "Я вам не друг и не враг. Я не сторонник и не помеха."
203-11 = "Я Маэстро. Под этим именем меня знают в Гематрия."
203-12 = ""
203-13 = ""
203-14 = "Этот закрытый парк развлечений когда-то хранил радость и восторг множества людей. Теперь эти эмоции превращены в Mimesis и проявлены здесь."
203-15 = "Эти сломанные и брошенные куклы наконец обрели смысл."
203-16 = "Я называю их Mimesis. Они — репликанты наслаждения: Terror, тёмная сторона того, на что способен Mystic."
203-17 = ""
203-18 = ""
203-19 = "Прошу, поаплодируйте, Сенсей."
