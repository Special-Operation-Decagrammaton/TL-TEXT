[translation]
901010600460-6 = "Итак, подведём итог тому, что выяснили..."
901010600460-7 = "Пропавший рыбак был по уши в долгах."
901010600460-8 = "В день происшествия он сел на поезд и покинул порт по железной дороге."
901010600460-9 = "Как и рыбак, многие другие люди занимали деньги у семьи Карпаччо."
901010600460-10 = "А, кажется, я понимаю, к чему всё идёт."
901010600460-11 = "Люди, пропавшие возле порта Канэсаки, на самом деле были должниками семьи Карпаччо."
901010600460-12 = "Из-за высоких процентов некоторые не могли вернуть займы. Поэтому решили бежать."
901010600460-13 = "А поскольку им нужно было избежать семьи Карпаччо, контролирующей входы и выходы из порта, должникам приходилось делать вид, будто они исчезли бесследно."
901010600460-14 = "Я согласна с FOX 4."
901010600460-15 = "Другой причины и способа внезапно исчезнуть я не вижу."
901010600460-16 = "Слухи делали всё это таким ужасным, но правда оказалась удивительно простой."
901010600460-17 = "Думаю, мы готовы отправить отчёт Генеральному студенческому совету. Нужно попросить Казначейство проверить возможные нарушения при взыскании долгов."
901010600460-18 = "[s] «То есть... дело закрыто?»"
901010600460-19 = "Пока что да..."
901010600460-20 = "..."
901010600460-21 = ""
901010600460-23 = ""
901010600460-24 = "Что-то беспокоит, FOX 1?"
901010600460-25 = "Мне кажется, мы упускаем что-то важное."
901010600460-26 = "[s] «Что именно тебя тревожит?»"
901010600460-27 = "Ничего конкретного. Собранная информация не противоречит сама себе."
901010600460-28 = "Всё просто и понятно... Все данные складываются в изящный вывод."
901010600460-29 = "Возможно, это интуиция. Но вывод дался слишком легко, будто... кто-то специально подвёл нас к нему."
901010600460-30 = "Если всё дело только в долгах..."
901010600460-31 = "...то почему крабы в бочке постоянно всплывают в разговорах?"
901010600460-32 = "Это слишком странно и намеренно. Кто-то явно распространяет эту историю не просто так."
901010600460-34 = "А если... просто потому, что она звучит интересно?"
901010600460-35 = "В конце концов, иногда вещи становятся вирусными без всякой особой причины."
901010600460-36 = "Это как пытаться понять, почему какой-нибудь раздражающий мем внезапно становится популярным."
901010600460-37 = "Например, та круглая птица с высунутым языком. Ничего особенного, а люди сходят по ней с ума."
901010600460-39 = "Это так, но..."
901010600460-40 = ""
901010600460-44 = "[ns] «Как насчёт того, чтобы всем утром сходить в порт?»"
901010600460-45 = ""
901010600460-47 = ""
901010600460-49 = ""
901010600460-50 = "Хм? Зачем? Хотите что-то расследовать, Сенсей?"
901010600460-51 = "[s] «Нет, не поэтому...»"
901010600460-52 = ""
901010600460-54 = ""
901010600460-55 = "[ns1] «Ваши рассказы вдохновили меня сходить туда.»\n[ns2] «Похоже, там можно вкусно поесть!»"
901010600460-56 = ""
901010600460-57 = ""
901010600460-59 = ""
901010600460-61 = "Хм, лично я мало что знаю, но Акита Сифуд, похоже, был настоящей скрытой жемчужиной."
901010600460-62 = "После того как заведение стало вирусным, в сети только и делают, что хвалят их еду."
901010600460-63 = "[s3] «Тогда позавтракаем там?»\n[s4] «И о цене не переживайте. Я угощаю.»"
901010600460-64 = ""
901010600460-65 = ""
901010600460-67 = ""
901010600460-68 = "Н-Но Сенсей, мы не можем снова вас обременять..."
901010600460-69 = "О. Кто же откажется от бесплатного завтрака?"
901010600460-70 = "В руководстве SRT ведь сказано по возможности добывать еду на месте. Никогда не знаешь, когда понадобится энергия!"
901010600460-71 = "Не думаю, что это означает жить за чужой счёт..."
901010600460-72 = "Но... я согласна. В конце концов, в порту я так и не поела."
901010600460-73 = ""
901010600460-75 = ""
901010600460-76 = "В таком случае... мы снова у вас в долгу, Сенсей."
901010600460-77 = "[s] «Юкино.»"
901010600460-78 = ""
901010600460-81 = ""
901010600460-82 = "Да? Что со мной?"
901010600460-83 = "[s5] «...Тебе ведь интересно посмотреть порт, да?»\n[s6] «После еды сможем осмотреться.»"
901010600460-84 = ""
901010600460-85 = ""
901010600460-87 = ""
901010600460-88 = "Очень проницательно, Сенсей."
901010600460-89 = "Хотя в этом мире чувствительность к чужому страданию подобна пути, вымощенному болью."
901010600460-90 = "[s] «...Хм? Что ты сказала?»"
901010600460-91 = "Ничего. Прошу прощения."
901010600460-92 = ""
901010600460-94 = ""
901010600460-96 = ""
901010600460-97 = "Отличная работа сегодня, отряд FOX."
901010600460-98 = "Хорошо отдохните до завтрашнего утра."
901010600460-100 = ""
901010600460-101 = "Есть!"
