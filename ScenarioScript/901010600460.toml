[translation]
901010600460-6 = "Muito bem, vamos condensar o que temos até agora."
901010600460-7 = "1. \"O pescador desaparecido acumulava dívidas impagáveis de agiotagem.\""
901010600460-8 = "2. \"Na madrugada do sumiço, ele embarcou no trem de operários e deixou o porto.\""
901010600460-9 = "3. \"Assim como ele, inúmeros outros cidadãos pegaram dinheiro com a Família Carpaccio e desapareceram.\""
901010600460-10 = "Parece que finalmente matamos a charada desse mistério todo."
901010600460-11 = "As pessoas que sumiram no Porto de Kanezaki eram, na verdade, devedores encurralados pela Família Carpaccio."
901010600460-12 = "Sem ter como quitar as parcelas, eles planejaram fugas clandestinas e se mandaram da cidade."
901010600460-13 = "Por isso pareciam desaparecimentos misteriosos para quem ficava para trás."
901010600460-14 = "Desta vez tenho que concordar com a dedução da FOX4."
901010600460-15 = "Fora isso, não haveria outro motivo nem meio plausível para tanta gente sumir sem deixar rastro."
901010600460-16 = "Com tantos boatos macabros acumulados parecia um crime hediondo sobrenatural... mas na prática era uma trama bem mais mundana."
901010600460-17 = "Vamos encaminhar os dados ao Conselho Estudantil Federal e solicitar à Diretoria Financeira que investigue os contratos de crédito da Família Carpaccio."
901010600460-18 = "[s] \"Com isso podemos dar o caso por encerrado?\""
901010600460-19 = "Sim, a princípio tudo indica que sim, mas..."
901010600460-20 = "............"
901010600460-21 = ""
901010600460-23 = ""
901010600460-24 = "Yukino? Alguma preocupação na sua cabeça?"
901010600460-25 = "Não sei dizer ao certo... Sinto que estamos deixando passar algo fundamental."
901010600460-26 = "[s] \"Tem algo te incomodando nessa conclusão?\""
901010600460-27 = "Não há falhas lógicas nos dados que reunimos."
901010600460-28 = "Tudo é claro, direto e perfeitamente amarrado em torno de um único desfecho."
901010600460-29 = "E é justamente por estar tudo perfeito demais... que sinto como se alguém tivesse montado esse cenário de propósito para chegarmos a essa resposta."
901010600460-30 = "Além do mais... se o caso se resume a caloteiros fugindo de credores..."
901010600460-31 = "Por qual razão a lenda do \"Caranguejo de Tambor de Óleo\" insiste em reaparecer em tantos depoimentos?"
901010600460-32 = "Se alguém está espalhando essa história com empenho, deve haver um motivo concreto por trás—"
901010600460-34 = "Não seria... simplesmente porque é uma história bizarra que viraliza fácil?"
901010600460-35 = "Na internet, qualquer absurdo sensacionalista vira assunto do momento."
901010600460-36 = "Buscar sentido numa lenda urbana de internet é tão inútil quanto tentar achar lógica num meme."
901010600460-37 = "Aquele pássaro branco feioso também não tem nada de fofo e mesmo assim vende produtos que nem água, não vende?"
901010600460-39 = "Isso..."
901010600460-40 = ""
901010600460-44 = "[ns] \"Gente... que tal voltarmos ao porto amanhã todos juntos?\""
901010600460-45 = ""
901010600460-47 = ""
901010600460-49 = ""
901010600460-50 = "Ué? O senhor também tem algo pessoal que queira investigar por lá, Sensei?"
901010600460-51 = "[s] \"Não, não é investigação...\""
901010600460-52 = ""
901010600460-54 = ""
901010600460-55 = "[ns1] \"Ouvindo vocês conversarem, fiquei com muita vontade de conhecer o porto.\"\n[ns2] \"E soube que tem vários restaurantes deliciosos por lá!\""
901010600460-56 = ""
901010600460-57 = ""
901010600460-59 = ""
901010600460-61 = "Verdade... Aquele \"Pescados Akita\" que visitei no primeiro dia é uma verdadeira joia escondida."
901010600460-62 = "Depois que a recomendação correu a boca do povo, a clientela não para de postar elogios na rede."
901010600460-63 = "[s3] \"Então que tal tomarmos o café da manhã lá amanhã?!\"\n[s4] \"Não se preocupem com a conta, o Sensei banca tudo!\""
901010600460-64 = ""
901010600460-65 = ""
901010600460-67 = ""
901010600460-68 = "M-mas não podemos aceitar que o senhor gaste tanto conosco..."
901010600460-69 = "OPA! É PRA JÁ! Se é de graça, não tem nem o que pensar!"
901010600460-70 = "O manual da SRT preceitua: \"Em situações extremas, obtenha suprimentos no local sempre que possível\"!"
901010600460-71 = "Tenho quase certeza de que o manual não estava se referindo a abusar da generosidade do Sensei..."
901010600460-72 = "Bom, eu também vou adorar ir. Em serviço a gente mal consegue sentar e apreciar a gastronomia do cais."
901010600460-73 = ""
901010600460-75 = ""
901010600460-76 = "Nesse caso... aceitamos seu convite de bom coração mais uma vez."
901010600460-77 = "[s] \"Yukino.\""
901010600460-78 = ""
901010600460-81 = ""
901010600460-82 = "Sim, Sensei? Precisa de algo?"
901010600460-83 = "[s5] \"...Você ainda tem algo que quer tirar a limpo no porto, não tem?\"\n[s6] \"Amanhã nós daremos mais uma boa olhada em volta para não deixar nenhuma ponta solta.\""
901010600460-84 = ""
901010600460-85 = ""
901010600460-87 = ""
901010600460-88 = "...Muito obrigada, Sensei. O senhor é extraordinariamente perceptivo."
901010600460-89 = "Embora ser tão sensível aos dilemas alheios seja o mesmo que escolher trilhar um caminho repleto de espinhos..."
901010600460-90 = "[s] \"...Como disse?\""
901010600460-91 = "Não é nada, perdoe-me."
901010600460-92 = ""
901010600460-94 = ""
901010600460-96 = ""
901010600460-97 = "Esquadrão FOX, excelente trabalho a todas."
901010600460-98 = "Estão liberadas até a manhã de amanhã."
