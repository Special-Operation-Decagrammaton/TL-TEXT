[translation]
2001505-1 = "Когда я вырасту"
2001505-2 = "Привет, Сенсей! Я пришла помочь вам с вашей кучей работы!"
2001505-3 = "Странно. Здесь никого?"
2001505-4 = "Может, Сенсей в туалете."
2001505-5 = "Ого! На столе Сенсея полный бардак! Мимори будет в ужасе!"
2001505-6 = ""
2001505-8 = ""
2001505-9 = "Это кофе? Сенсей всё время его пьёт!"
2001505-10 = "Хм..."
2001505-11 = ""
2001505-13 = ""
2001505-14 = "*глоток*"
2001505-15 = ""
2001505-17 = ""
2001505-18 = "Бе-е! Горько!"
2001505-19 = "Надеюсь, когда вырасту, мне не придётся пить эту гадость. Банановое молоко намного лучше."
2001505-20 = "Быть взрослым, похоже, тяжело. Постойте, кофе холодный!"
2001505-21 = "О! Придумала!"
2001505-22 = "Приготовлю Сенсею свежий горячий кофе!"
2001505-23 = "Идеальная тренировка настоящей леди! Я помогаю взрослому со взрослым делом."
2001505-24 = "Прямо как в той пикантной дораме, которую я смотрела вчера вечером!"
2001505-25 = "Там ведь делали что-то такое, да?!"
2001505-26 = "Ладно! Сейчас я приготовлю для Сенсея особенный кофе в стиле Каэдэ!"
2001505-27 = ""
2001505-29 = ""
2001505-30 = "*напевает*"
2001505-31 = "Добавим немного этого."
2001505-32 = ""
2001505-33 = "М-м, вкусно. Должно получиться идеально!"
2001505-34 = "Вуаля! Суперультракофе Каэдэ готов!"
2001505-35 = "Не могу дождаться, когда Сенсей его попробует!"
2001505-36 = "Хи-хи! А вдруг в награду мне купят игрушку?"
2001505-37 = "Ура! Я так взволнована! Осталось только отнести это на стол Сенсея..."
2001505-38 = ""
2001505-40 = ""
2001505-41 = "Акх!"
2001505-42 = ""
2001505-43 = "Что? Не-е-ет! Кофе!"
2001505-44 = ""
2001505-49 = "Вааааа?!"
2001505-51 = "[ns] «Итак, Каэдэ... Не хочешь объяснить, что здесь произошло?»"
2001505-52 = "Вы сказали, что очень заняты, да? Поэтому я пришла помочь..."
2001505-53 = "Но когда я пришла, вас здесь не было. А на столе был полный беспорядок."
2001505-54 = "И кофе был холодный! Я хотела помочь, поэтому приготовила вам новую чашку."
2001505-55 = "Я... я правда изо всех сил старалась помочь!"
2001505-56 = "[s] «Каэдэ.»"
2001505-57 = "Простите!"
2001505-58 = "Я всё признаю! Я думала, если приготовлю вам кофе, вы меня похвалите и купите игрушку!"
2001505-59 = "Я правда старалась вести себя как настоящая леди."
2001505-60 = "Но оказалось сложнее, чем я думала. И я устроила огромный беспорядок!"
2001505-61 = "Н-Но я всё равно просто хотела помочь..."
2001505-62 = "Я не хотела устраивать такой бардак... Правда..."
2001505-63 = "[s] «Каэдэ.»"
2001505-64 = "*шмыгает носом*"
2001505-65 = "УАААААА!!! Простите меня!!!"
2001505-66 = "Простите, что вошла в ваш офис без приглашения!"
2001505-67 = "Простите, что сделала ваш и без того беспорядочный офис ещё хуже!"
2001505-68 = "*всхлипывает* Простите."
2001505-69 = "Сенсей и так всегда очень занят."
2001505-70 = "А я только ещё сильнее всё усложнила."
2001505-71 = "*всхлипывает* Я совсем не помогла..."
2001505-72 = "*всхлипывает*"
2001505-73 = "[s] «Успокойся, Каэдэ.»"
2001505-74 = "...А?"
2001505-75 = "[s] «Давай немного поговорим, Каэдэ.»"
2001505-76 = "*шмыгает носом*"
2001505-78 = "[s] «Вот. Выпей какао.»"
2001505-79 = "Я... Я люблю кофе больше, чем какао."
2001505-80 = "[s] «Не хочешь?»"
2001505-81 = "...Нет, хочу."
2001505-82 = "*хлюп*"
2001505-83 = "[s] «Можно кое-что спросить?»"
2001505-84 = "Хорошо."
2001505-85 = "[s] «Стать настоящей леди для тебя очень важно, да?»"
2001505-86 = "Да."
2001505-87 = "[s] «Почему?»"
2001505-88 = "Э-Это..."
2001505-89 = "Это..."
2001505-90 = "[s] «Это...?»"
2001505-91 = "..."
2001505-92 = "Я... Вы знали, что в детстве я была настоящей сорванцом?"
2001505-93 = "[s] «Сорванцом?»"
2001505-94 = "Да... Когда жила в деревне."
2001505-95 = "Я носилась по полям, горам, морскому берегу..."
2001505-96 = "И до средней школы постоянно бегала и влипала в неприятности."
2001505-97 = "Если что-то казалось весёлым, мне сразу хотелось это попробовать."
2001505-98 = "Вы ведь знаете, откуда я родом, да?"
2001505-99 = "Там совсем глушь, даже по меркам района Хяккияко. Поэтому, когда я поступила в старшую школу, мне пришлось переехать в город."
2001505-100 = "Я перевелась в городскую школу. Впервые проехалась на метро..."
2001505-101 = "О! Раньше я думала, что перед входом в метро нужно снимать обувь! Все считали меня сумасшедшей!"
2001505-102 = "...!"
2001505-103 = "Простите, отвлеклась..."
2001505-104 = "[s] «Итак, город?»"
2001505-105 = "Да, я переехала в город."
2001505-106 = "И там все были потрясающими!"
2001505-107 = "Особенно Цубаки и Мимори! Они такие крутые, красивые и способные!"
2001505-108 = "Рядом с ними я чувствовала себя совсем ребёнком и решила, что должна измениться."
2001505-109 = "«Я не могу вечно оставаться такой. Я буду стараться и стану достойным членом Клуба внутренней дисциплины.»"
2001505-110 = "Именно тогда я решила стать настоящей леди."
2001505-111 = "Я правда верила, что мне достаточно просто стараться изо всех сил."
2001505-112 = "Я думала, что смогу стать настоящей леди, как Цубаки и Мимори."
2001505-113 = "Но... я ошибалась."
2001505-114 = "Я думала, что усердно работаю. Думала, что выкладываюсь полностью."
2001505-115 = "Но куда бы я ни пошла, я только создаю проблемы, а все считают меня чудачкой."
2001505-116 = "Я совсем не повзрослела."
2001505-117 = "Я думала, если отдам этому все силы..."
2001505-118 = "Может, таким, как я, просто не суждено стать настоящей леди."
2001505-119 = "[s] «Это неправда.»"
2001505-120 = "Сенсей?"
2001505-121 = "[s1] «Я лучше всех знаю, как сильно ты стараешься.»\n[s2] «Ты всегда выкладываешься по полной.»"
2001505-122 = "Как мы?"
2001505-123 = "Как мы?"
2001505-124 = "[s3] «Иногда ты ошибаешься.»\n[s4] «Ошибаются все.»"
2001505-125 = "..."
2001505-126 = "..."
2001505-127 = "[s5] «Так что всё нормально. Ты просто остаёшься Каэдэ.»\n[s6] «Двигайся в своём темпе. Ничего страшного, если медленно.»"
2001505-128 = "Просто быть собой..."
2001505-129 = "Просто быть собой..."
2001505-130 = "[s] «И ты всегда можешь положиться на старших. И на меня.»"
2001505-131 = "...А? Сенсей?"
2001505-132 = "[s] «Всё всегда будет хорошо. Я ведь твой учитель, правда?»"
2001505-133 = "..."
2001505-134 = "Вы правы..."
2001505-135 = "Хорошо!"
2001505-136 = "Точно! Вы всегда будете моим учителем!"
2001505-137 = "А я всё это время зря ломала голову!"
2001505-138 = "Ха-ха-ха! Каэдэ вернулась! Спасибо, Сенсей! У меня снова куча сил!"
2001505-139 = "Как вы сказали, если продолжу понемногу стараться, я обязательно стану лучше!"
2001505-140 = "Я вас не разочарую, Сенсей!"
2001505-141 = "[s7] «У тебя получится, Каэдэ!»\n[s8] «А теперь давай уберём этот беспорядок?»"
2001505-142 = "О! Мне нужно прибраться!"
2001505-143 = "О! Мне нужно прибраться!"
2001505-144 = "Хорошо! Я начну заново! Я стану настоящей леди — по-своему!"
2001505-146 = "После долгого разговора мы с Каэдэ вместе убрали офис."
2001505-148 = "На следующий день..."
2001505-149 = ""
2001505-152 = "[ns9] «Думаю, на сегодня хватит.»\n[ns10] «Интересно, как там Каэдэ.»"
2001505-159 = "Сенсей! Чрезвычайная ситуация! У нас чрезвычайная ситуация!!!"
2001505-160 = "[s] «Каэдэ?! Что случилось?»"
2001505-161 = "Так вот что произошло...!"
2001505-162 = "В лесу Белок-летяг Хяккияко появились жуки-геркулесы!"
2001505-163 = "[s] «...А?»"
2001505-164 = "Нет времени, Сенсей! Мне нужны принадлежности для ловли насекомых и камера, чтобы сфотографировать величественных жуков!"
2001505-165 = "О, а если по дороге захочется пить? Нам нужно молоко!"
2001505-166 = "Хорошо! Я готова! Пойдём, Сенсей!"
2001505-167 = "Пора ловить жуков!"
2001505-168 = "[s11] «Эм... Ладно... Наверное...»\n[s12] «Я рад, что ты снова бодра, Каэдэ.»"
2001505-169 = "...А?"
2001505-170 = "...А?"
2001505-172 = "Я скрыл облегчение и отправился ловить насекомых вместе с Каэдэ, такой же живой и энергичной, как всегда."
