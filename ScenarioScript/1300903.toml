[translation]
1300903-1 = "Тренировка Цубаки: снаряжение"
1300903-2 = ""
1300903-3 = "[ns1] «Я пришёл сразу, как получил твоё сообщение.»\n[ns2] «С твоим тренажёром что-то не так? Что случилось?»"
1300903-4 = "Оно испорчено..."
1300903-5 = "Оно испорчено..."
1300903-6 = ""
1300903-7 = ""
1300903-8 = "Цубаки показала мне потрёпанную подушку, из которой вылез весь наполнитель."
1300903-9 = "[s] «...Подушка?»"
1300903-10 = "Нет, Сенсей. Это не подушка! Это снаряжение Клуба внутренней дисциплины. Важный тренировочный инструмент."
1300903-11 = "Это один из моих любимых предметов. Но, кажется, прошлой ночью на патруле я слишком усердно тренировалась..."
1300903-12 = "Понимаешь, тренировочный инструмент внутри моего щита весь износился!"
1300903-13 = "[s] «Ты обычно там его хранишь?»"
1300903-14 = "Тренировочные инструменты всегда должны быть под рукой!"
1300903-15 = "...В общем, Сенсей, мне нужен новый."
1300903-16 = "Сходишь со мной за покупками? Хм?"
1300903-17 = "[s] «Почему бы и нет? Конечно.»"
1300903-18 = "Отлично! Спасибо, Сенсей!"
1300903-20 = "Супермаркет Хяккияко"
1300903-22 = "[ns] «Так какую подушку ты собираешься купить?»"
1300903-23 = "Сенсей. Это не подушка. Это снаряжение."
1300903-24 = "Раз уж ты здесь, я хотела бы узнать твоё мнение."
1300903-25 = "Тренировочное снаряжение куда глубже, чем думают люди."
1300903-26 = "Некоторым не нравятся деревянные подушки, потому что они жёсткие, но когда привыкнешь, они на удивление удобные."
1300903-27 = "А подушки с гусиным пухом почти гарантируют хороший сон."
1300903-28 = "Стоит взглянуть и на пену с памятью формы. Она достаточно стабильна, чтобы поддерживать тело в любой позе и в любое время — днём или ночью!"
1300903-29 = "[s] «Ух ты, Цубаки, никогда не видел тебя такой увлечённой.»"
1300903-30 = "Я ведь президент Клуба внутренней дисциплины...?"
1300903-31 = "Правильное снаряжение имеет первостепенное значение для тренировок."
1300903-32 = "Ладно, осмотримся в магазине."
1300903-34 = "Мы с Цубаки ходили по магазину и смотрели подушки..."
1300903-35 = "...то есть «тренировочные инструменты»."
1300903-38 = "[ns3] «А как насчёт этого? Он должен уменьшать нагрузку на шею.»\n[ns4] «Это новый тип латекса с низким сопротивлением.»"
1300903-39 = "Хм. Неплохо, но..."
1300903-40 = "Хм. Неплохо, но..."
1300903-41 = "[s] «Но что?»"
1300903-42 = "Тебе не кажется, что она слишком... обычная?"
1300903-43 = "То есть... Ты правда думаешь, что эта подойдёт?"
1300903-44 = "[s] «Ладно, Цубаки, давай разберёмся, чего ты на самом деле хочешь.»"
1300903-45 = "Чего я хочу?"
1300903-46 = "[s5] «Что самое важное в твоих тренировках?»\n[s6] «Что для тебя главное в тренировочном снаряде?»"
1300903-47 = "Чего я хочу... Что самое важное..."
1300903-48 = "Чего я хочу... Что самое важное..."
1300903-49 = "(кивает)"
1300903-50 = "...После твоих слов, кажется, я поняла."
1300903-51 = "Я ведь президент Клуба внутренней дисциплины, да?"
1300903-52 = "И если хочу быть примером для остальных, мне придётся тренироваться гораздо усерднее..."
1300903-53 = "Я хочу стать человеком, которым смогу гордиться."
1300903-54 = "[s] «Вот что для тебя важно?»"
1300903-55 = "Да. Вместо того чтобы лениться..."
1300903-56 = "Я хочу быть смелее и пробовать новое..."
1300903-57 = "[s] «Смелее?»"
1300903-58 = "Я больше не хочу полагаться на обычные инструменты..."
1300903-59 = ""
1300903-60 = ""
1300903-61 = ""
1300903-62 = "Как насчёт этого, Сенсей? Тренировочный инструмент, который можно обнимать."
1300903-63 = "[s] «Что? Тренировочный инструмент, который можно обнимать?»"
1300903-64 = "Правда, из-за размера он немного неудобный."
1300903-65 = "Здесь написано: «...можно напечатать любую полноразмерную иллюстрацию, какую захотите»."
1300903-66 = "(наклоняет голову) Хм. Зачем такое вообще нужно на тренировочном инструменте?"
1300903-67 = "[s] «Эм, давай выберем что-нибудь другое!»"
1300903-68 = "Тебе не нравится?"
1300903-69 = "Эй, а как насчёт этой, Сенсей?"
1300903-70 = "На этом тренировочном инструменте спереди написано «ДА», а сзади — «НЕТ»."
1300903-71 = "[s] «Цубаки, это же...!»"
1300903-72 = ""
1300903-73 = "Сенсей?! Тебе тяжело?"
1300903-74 = "[s7] «Д... да!»\n[s8] «Н-нет!»"
1300903-75 = "А? Сенсей, почему ты так вспотел?"
1300903-76 = "А? Сенсей, почему ты так вспотел?"
1300903-77 = "Говорят, эта подушка популярна у молодожёнов. Любопытно..."
1300903-78 = ""
1300903-79 = "Ахаха! Смотри, Сенсей. Подушка Пероро — идеально бросать в кого-нибудь в критической ситуации."
1300903-80 = "[s] «Так это подушка или тренировочный инструмент?!»"
1300903-81 = ""
1300903-82 = "Смотри, Сенсей."
1300903-83 = ""
1300903-84 = "И вот эту тоже, Сенсей."
1300903-86 = "Мы с Цубаки обошли весь магазин, рассматривая тренировочные инструменты... или подушки, или как их там."
1300903-88 = "[ns] «Уже почти ночь, а мы всё ещё не выбрали подушку.»"
1300903-89 = "Да, знаю. *зевает*"
1300903-90 = "[s9] «Цубаки, ты, наверное, очень сонная.»\n[s10] «Может, отдохнём?»"
1300903-91 = "Д-Да. Хорошо. Мне нужна всего минутка..."
1300903-92 = "Д-Да. Хорошо. Мне нужна всего минутка..."
1300903-93 = "[s] «А? Эй, Ц-Цубаки?»"
1300903-94 = ""
1300903-96 = ""
1300903-97 = "[s] «Эм... Цубаки?»"
1300903-98 = "Понятно... *зевает*"
1300903-99 = "Теперь, когда я использую твои ноги как подушку..."
1300903-100 = "Я кое-что поняла."
1300903-101 = "Идеальная подушка всё это время была прямо рядом!"
1300903-103 = "[s] «Э-Эй?»"
1300903-104 = "..."
1300903-105 = "[s] «Цубаки...?»"
1300903-106 = ""
1300903-107 = "Хр-р..."
1300903-109 = "Вскоре солнце село, а когда я наконец смог встать, обе ноги полностью затекли."
