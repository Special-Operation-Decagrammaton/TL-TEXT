2300502-39 = "..."
2300502-40 = "..."
2300502-41 = "*шмыгает носом*"
2300502-42 = "[s] «Я-я просто пошутил!»"
2300502-45 = "После этого я ещё долго и очень усердно извинялся за сказанное."
2300502-47 = "Я позвала Вас потому, что..."
2300502-48 = "Нашла это, пока разбирала один неиспользуемый класс."
2300502-49 = ""
2300502-50 = ""
2300502-51 = "Аяне протянула мне старую книгу."
2300502-52 = "[s] «Старая книга?..»"
2300502-53 = "Думаю, её оставила кто-то из бывших студентов..."
2300502-54 = "Я слышала, раньше у некоторых были довольно странные хобби."
2300502-55 = "В общем, я подумала, что Вы, возможно, поймёте, ценная она или нет..."
2300502-56 = "Что думаешь?"
2300502-57 = "Похоже на роман на старом языке. Я его не понимаю..."
2300502-58 = "[s7] «Хм...»\n[s8] «Не уверен...»"
2300502-59 = "Похоже, и Вы не можете помочь..."
2300502-60 = "Похоже, и Вы не можете помочь..."
2300502-61 = "[s9] «Почему бы не отнести это в антикварный магазин?»\n[s10] «Лучше спросить специалиста, а не меня.»"
2300502-62 = "Думаю, Вы правы..."
2300502-63 = "Думаю, Вы правы..."
