2300502-69 = "Когда мне попадается что-то старое или потенциально ценное, я никак не могу перестать об этом думать."
2300502-70 = "*вздох* ...но, наверное, такие вещи просто так в руки не падают..."
2300502-71 = "[s11] «О! Ты, должно быть, очень бережлива.»\n[s12] «Значит, это твоё хобби?»"
2300502-72 = "А?! О, н-нет, не то чтобы..."
2300502-73 = "А?! О, н-нет, не то чтобы..."
2300502-74 = "Я-я не хочу, чтобы Вы считали меня скрягой!"
2300502-75 = "[s] «Ну, тогда дай знать, если понадобится помощь.»"
2300502-76 = "О, ахаха... Спасибо, Сенсей."
2300502-77 = "Возможно, я воспользуюсь предложением."
