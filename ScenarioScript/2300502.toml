2300502-28 = ""
2300502-29 = "..."
2300502-30 = "Здравствуйте, Сенсей."
2300502-31 = "[s3] «Ты в порядке, Аяне?»\n[s4] «Что там случилось?»"
2300502-32 = "Извините, что заставила волноваться. Я не пострадала."
2300502-33 = "Извините, что заставила волноваться. Я не пострадала."
2300502-34 = "Я забралась на полку за книгой, но потеряла равновесие и упала..."
2300502-35 = "Не могу поверить, что Вы увидели меня в таком виде..."
2300502-36 = "О, Сенсей! Пожалуйста, забудьте о том, что видели!"
