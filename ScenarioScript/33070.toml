[translation]
33070-1 = "Эпизод 7;День огня и пепла, часть 1"
33070-3 = "А-а-а-а-а!"
33070-4 = "У-Студент ранен! Студент ранен!"
33070-5 = "*кашляет* *кашляет*"
33070-7 = "Срочная новость! В соборе прогремел неизвестный взрыв!"
33070-8 = "Он полностью охвачен огнём! Шпиль — он рушится!"
33070-9 = "Наги."
33070-12 = "А-а-а-а-а!"
33070-13 = "Осторожно! Бегите!"
33070-14 = "Ч-Что происходит...?"
33070-15 = ""
33070-17 = ""
33070-18 = "Азусы нигде нет!"
33070-19 = "Там был Отряд правосудия... Они...?"
33070-20 = "Кохару! Хифуми!"
33070-21 = "Мы не можем просто броситься туда! Пока не знаем ситуацию, это слишком опасно!"
33070-22 = "А как же Азуса?"
33070-24 = "Она и Отряд правосудия прекрасно умеют постоять за себя! Нам нельзя разделяться!"
33070-25 = "Н-Но..."
33070-26 = "Тогда что нам делать?"
33070-30 = "(Что только что произошло?)"
33070-31 = "(Взрыв? На нас напали?)"
33070-32 = "(Этот звук... что-то летело на высокой скорости, а потом удар.)"
33070-33 = "(Это могла быть крылатая ракета? Настолько быстрая, что ПВО не успело перехватить?)"
33070-34 = "(Она использовала прямоточный двигатель? Но единственное место в Кивотосе с такими технологиями — это...)"
33070-35 = "(Нет. Одного этого недостаточно, чтобы объяснить масштаб разрушений. В соборе с самого начала была заложена взрывчатка?)"
33070-36 = "(Кто мог устроить такую ловушку? Тринити? Сестринство?)"
33070-38 = "(Сейчас не время об этом думать. Нужно сосредоточиться.)"
33070-39 = "(С Ако всё должно быть в порядке, но нужно двигаться быстрее.)"
33070-40 = "(...)"
33070-41 = "Сенсей!"
33070-43 = "Э-Эта Хина всё ещё стоит..."
33070-44 = "Ч-Что нам теперь делать? Как сдержать того, кто пережил такое? Если она всё ещё готова драться, будет больно... Мы будем страдать..."
33070-46 = "Без оправданий. Не дайте Хине уйти."
33070-47 = "Д-Да! Я-я постараюсь!"
33070-48 = ""
33070-49 = ""
33070-50 = ""
33070-51 = "Н-Ну, у нас приказ. Простите... ха-ха."
33070-53 = "(Филиал Ариуса.)"
33070-54 = "М-Мы не можем просто так позволить вам уйти..."
33070-56 = "..."
33070-57 = "С дороги."
33070-58 = "О-Ох. Вот и начинаются страдания."
33070-59 = ""
33070-63 = "Ха-ха-ха-ха!"
33070-64 = "Всё по плану! Ха-ха-ха!"
33070-65 = "О чём вы говорите...?"
33070-66 = "Все, кто мог бы помешать моим планам, устранены!#nНе только Чаепитие, но и эта заноза Хина."
33070-67 = "Не понимаешь, Ироха? Классический пример — убить двух зайцев одним выстрелом."
33070-69 = "Именно поэтому всё это время я тайно сотрудничала с заклятым врагом Тринити — Ариусом!"
33070-70 = "Я знала всё с самого начала. От внутренних распрей Чаепития до переворота. Всё вело к сегодняшнему дню!"
33070-72 = "Переворот?"
33070-73 = "Как давно вы это планировали? Значит... вы вообще никогда не собирались подписывать Эдемский договор."
33070-74 = "Именно! Он меня никогда не интересовал. Я хотела лишь избавиться от тех, кто стоит у меня на пути!"
33070-75 = "Я согласилась только затем, чтобы выманить этих паразитов из Чаепития из их нор."
33070-76 = "А заодно почему бы наконец не избавиться от Хины? Кихехе!"
33070-77 = "Ариус так щедро предложил свою поддержку. Более того, именно они оплатили этот бронированный дирижабль — символ нашей дружбы. Как говорится, враг моего врага — мой друг. Кихехехе!"
33070-78 = "Итак. Свяжитесь с Ариусом."
33070-79 = "Хина и Нагиса больше никогда не встанут у меня на пути!"
33070-81 = "Пришло время раз и навсегда стереть Тринити с карты!"
33070-83 = "Макото... ты ведь понимаешь, что Ариус ненавидит Геенну даже сильнее, чем Тринити? С чего бы им вообще сотрудничать с нами?"
33070-84 = ""
33070-86 = ""
33070-88 = "ПРАВДА?!"
33070-89 = "Эй, Ибуки нашла здесь кучу ящиков! Тут написано «огнеопасно», «обращаться осторожно» и... «взрывчатка»?"
33070-90 = "*вздох* Они тебя обманули, Макото."
33070-92 = "*БУМ*"
33070-96 = "Команда II. Докладывайте."
33070-97 = "Команда II вошла в собор. Скоро вступим в бой с Отрядом правосудия. А у вас, лидер?"
33070-98 = "Я закончила своё дело."
33070-99 = "Команда III сейчас сражается с Хиной! Команда V уходит под землю по плану!"
33070-100 = "Принято. Скоро присоединюсь."
33070-102 = "Тринити и Геенна... Наконец пришло время расплатиться за эту древнюю ненависть."
33070-103 = "Да, во имя рая..."
33070-105 = "...именно мы, Ариус, вынесем вам приговор."
33070-107 = "...нсэй!"
33070-108 = "Сенсей! Проснитесь!"
33070-109 = "[s] «Арона?»"
33070-110 = "Вы в порядке? Нужно прийти в себя!"
33070-111 = "[s] «Что случилось?»"
33070-112 = "Произошёл взрыв, и собор обрушился. Я сделала всё, что могла, чтобы защитить вас, но..."
33070-113 = "Уф. Кажется, я почти на пределе. У меня заканчивается энергия, поэтому вы должны проснуться!"
33070-114 = "[s] «Ты что сделала? Арона?!»"
33070-115 = ""
33070-120 = ""
33070-122 = ""
33070-125 = "[ns] «(Что это сейчас было?)»"
33070-127 = "...нсэй!"
33070-129 = "Сенсей... *кашель* *кашель* Вы живы!"
33070-130 = "[ns] «(Я не могу двигаться...)»"
33070-131 = "Слава богу. Вас завалило обломками."
33070-132 = "Подождите. Я вас вытащу!"
33070-133 = ""
33070-136 = "Хорошо, что мои мышцы пригодились в такой момент... Вот. Можете двигаться?"
33070-137 = "[ns] Встать."
33070-139 = "Похоже, серьёзных травм нет. Чудо, что после такого взрыва вы не получили тяжёлых ран..."
33070-140 = ""
33070-142 = ""
33070-143 = "Сенсей! Вы в порядке!"
33070-144 = "*всхлип* Сенсей!"
33070-145 = "Отряд правосудия! Ох, ваши раны..."
33070-146 = "[s] «Вам стоит больше беспокоиться о себе, чем обо мне.»"
33070-147 = "С нами всё будет в порядке. К сожалению, остальные члены отряда выведены из строя взрывом."
33070-148 = "Нагиса, Сакурако и ключевые люди, которые были с ними, пропали. И вдобавок..."
33070-149 = "Я не видела ни одного представителя Геенны. Что происходит?"
33070-151 = "...!"
33070-152 = ""
33070-157 = ""
33070-158 = "Подтверждаю прибытие к цели. Обнаружены остатки Отряда правосудия. Нет — поправка. Это ядро их сил."
33070-159 = "Цуруги и Хасуми замечены. Отправьте подкрепление. Скоро вступим в бой."
33070-161 = "Филиал Ариуса?!"
33070-162 = "О-Откуда они взялись? Как попали сюда?! Периметр должен был быть защищён..."
33070-163 = "Н-Не может быть!"
33070-166 = ""
33070-167 = "Они, должно быть, пришли снизу... Через катакомбы под собором."
33070-168 = "..."
33070-169 = "Понятно. Значит, всё это дело рук Ариуса?"
33070-170 = "Вам это с рук не сойдёт. За свои грехи вы заплатите здесь и сейчас!"
33070-171 = "Хасуми."
33070-172 = "...!"
33070-173 = "Постарайся сохранять спокойствие."
33070-174 = "Да. Ты права."
33070-175 = "Спасибо, Цуруги. Сейчас важнее всего безопасность Сенсея — нужно увести его как можно дальше отсюда. Я этим займусь."
33070-176 = "Хорошо. Позволь мне испачкать руки."
33070-177 = "Кехехе... Ну что ж."
33070-178 = "В строй и приготовиться к уничтожению!"
33070-180 = "Кья-ха-ха-ха-ха!"
33070-181 = "Идём, Сенсей!"
