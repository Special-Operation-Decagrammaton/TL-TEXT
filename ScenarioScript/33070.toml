[translation]
33070-1 = "Episódio 7;O Dia Tingido de Fogo e Cinzas (1)"
33070-3 = "Kyaaaaaaah!?"
33070-4 = "Aqui, tem feridos aqui...!"
33070-5 = "Cof, cof! A-Alguém..."
33070-7 = "Emergência! A Antiga Catedral foi envolvida pelas chamas após uma explosão de origem desconhecida...!"
33070-8 = "O que é isso... A-A torre está desabando!"
33070-9 = "...Nagi-chan?"
33070-12 = "Kyaaaaaah!!"
33070-13 = "Cuidado! Por aí...!"
33070-14 = "O-O que é isso...?"
33070-18 = "A-A Azusa-chan, cadê ela...!?"
33070-19 = "A-As veteranas...!"
33070-20 = "Koharu-chan, Hifumi-chan! Esperem, por favor!"
33070-21 = "Não é prudente nos movermos até entendermos a situação!"
33070-22 = "M-Mas a Azusa-chan...!"
33070-24 = "Tanto a Azusa-chan quanto o Comitê de Justiça conseguem ao menos se proteger! Agora, é muito mais perigoso nos espalharmos!"
33070-25 = "M-Mas...!"
33070-26 = "Hanako-chan, Koharu-chan... O que a gente faz...?"
33070-30 = "(...O que aconteceu?)"
33070-31 = "(Uma explosão... Fomos atacadas? Qual é a situação?)"
33070-32 = "(Aquele som agora há pouco, de algo voando em alta velocidade... e a extensão desses danos...)"
33070-33 = "(Um míssil de cruzeiro... e rápido demais até para o sistema de defesa antiaérea interceptar?)"
33070-34 = "(...Um motor ramjet? Em Kivotos, quem teria tecnologia desse nível...?)"
33070-35 = "(Não, só isso não causaria uma explosão dessa escala... Já havia explosivos plantados na Antiga Catedral desde o início...?)"
33070-36 = "(Desde quando isso tudo era uma armadilha? E quem foi... Trinity, a Irmandade...?)"
33070-38 = "(...Não. O que preciso pensar agora é...!)"
33070-39 = "(A Ako está... a salvo. Nesse caso...)"
33070-40 = "(O meu próximo passo deve ser...)"
33070-41 = "...! Sensei...!?"
33070-43 = "H-Hina-san, você ainda está de pé..."
33070-44 = "O-O que eu faço...? Continuar de pé depois de receber aquilo tudo... Que incrível, que forte... Como ainda quer continuar lutando...? Deve estar doendo tanto, deve estar sendo tão sofrido..."
33070-46 = "Acabem com ela. Especialmente a Hina, não a deixem escapar."
33070-47 = "S-Sim!"
33070-51 = "P-Parece que é assim que as coisas são... Me desculpe, ehehe..."
33070-53 = "(...A Filial Arius.)"
33070-54 = "M-Mandaram eu não deixar você passar daqui... Me desculpe, mas ordens são ordens..."
33070-56 = "..."
33070-57 = "...Saia da frente."
33070-58 = "No fim das contas, a vida só tem coisas dolorosas mesmo..."
33070-63 = "Kikikikiki!!"
33070-64 = "Sucesso! Tudo exatamente como planejado! Kihyahyahyahya!!"
33070-65 = "Makoto-senpai, o que diabos você fez...?"
33070-66 = "Com isso, todos os estorvos vão desaparecer. Tanto a Tea Party quanto aquela irritante da Hina!"
33070-67 = "Entende, Iroha? É o que chamam de matar dois coelhos com uma cajadada só."
33070-69 = "Não vou esconder: esta grande Makoto-sama já estava mancomunada há muito tempo com Arius, que guarda rancor de Trinity!"
33070-70 = "O conflito interno da Tea Party, o golpe de Estado... eu sabia de tudo desde o começo. Tudo para o plano de hoje!"
33070-72 = "Golpe de Estado...?"
33070-73 = "Quando foi que você fez tudo isso...? Quer dizer que, desde o início, a senhora não tinha a menor intenção de assinar o Tratado do Éden?"
33070-74 = "Ah, eu não tenho o menor interesse nessa besteira! Minha única preocupação sempre foi dar um fim naqueles estorvos!"
33070-75 = "Só fingi concordar com o tratado para atrair o pessoal da Tea Party, que nunca dava as caras."
33070-76 = "E, de quebra, ainda me livrei da Hina! Não podia ter sorte maior! Kikiki!"
33070-77 = "Para isso, Arius nos deu um baita suporte. Até este dirigível foi um presente como prova da nossa amizade... O inimigo do meu inimigo é meu amigo, kikikiki!!"
33070-78 = "Vamos, entre em contato com Arius. É hora de começarmos pra valer a guerra de aniquilação contra Trinity."
33070-79 = "Hina, Nagisa... Não sobrou mais ninguém no meu caminho!"
33070-81 = "Chegou a hora de apagar Trinity do mapa de Kivotos!"
33070-83 = "Makoto-senpai... Se bobear, quem Arius mais odeia, até mais do que Trinity, somos nós de Gehenna. Por que achou que eles se aliariam a nós?"
33070-88 = "...O quêêê!?"
33070-89 = "Ei, ei, o que são todas essas caixas empilhadas aqui? Está escrito \"Cuidado ao Manusear\" e \"Inflamável\"..."
33070-90 = "Bom, resumindo... A Makoto-senpai foi enganada de novo."
33070-92 = "(CABUUUUUUUM!!)"
33070-96 = "Equipe II, relatório."
33070-97 = "A Equipe II invadiu a Antiga Catedral. Estamos prestes a entrar em combate contra o Comitê de Justiça. E vocês?"
33070-98 = "Sim, já terminamos o serviço por aqui também."
33070-99 = "A-A Equipe III está em combate contra a Hina-san neste momento! A Equipe V está invadindo o subsolo conforme o planejado...!"
33070-100 = "Entendido. Vamos nos reagrupar imediatamente."
33070-102 = "Trinity e Gehenna... Chegou a hora de pagarem a dívida por todo o ódio que acumulamos ao longo de tantos anos."
33070-103 = "Nós, de Arius, em nome do Paraíso..."
33070-105 = "Traremos o julgamento sobre vocês."
33070-107 = "...ei!"
33070-108 = "Sensei, acorde, por favor!"
33070-109 = "[s] \"Arona...?\""
33070-110 = "Sensei, você está bem!? Fique firme...!"
33070-111 = "[s] \"O que foi que aconteceu...?\""
33070-112 = "A Antiga Catedral foi bombardeada... Eu tentei proteger você de algum jeito, mas..."
33070-113 = "Eu não aguento mais... Fique firme... Minhas forças..."
33070-114 = "[s] \"Arona...!?\""
33070-125 = "[ns] (Aquilo agora há pouco foi...!)"
33070-127 = "...Sensei!"
33070-129 = "S-Sensei... cof, cof... Você está a salvo!"
33070-130 = "[ns] (Meu corpo não se mexe...)"
33070-131 = "Que alívio, você ficou bem num vão entre os escombros..."
33070-132 = "Espere só um instante, eu já vou tirar...!"
33070-136 = "Agradeço por ter sido abençoada com tanta força... Sensei, consegue ficar de pé?"
33070-137 = "[ns] Levantar-se."
33070-139 = "Parece que... você não está ferido. Sair quase sem nenhum arranhão depois de ser pego naquela explosão é um verdadeiro milagre..."
33070-143 = "Sensei! Você está bem!"
33070-144 = "S-Sensei...!"
33070-145 = "Pessoal do Comitê de Justiça...!"
33070-146 = "[s] \"Vocês estão todas muito feridas...\""
33070-147 = "Isso não é nada demais. Porém, com a explosão de agora há pouco, a maioria das integrantes do Comitê de Justiça ficou fora de combate."
33070-148 = "Além disso, não conseguimos encontrar a Nagisa-sama, a Sakurako-san... nem várias outras pessoas..."
33070-149 = "...Também quase não há sinal do lado de Gehenna. O que está acontecendo aqui...?"
33070-151 = "!!"
33070-158 = "Chegamos à área de operação. Remanescentes do Comitê de Justiça localizadas. ...Não, correção. Não são remanescentes, são a elite do Comitê de Justiça."
33070-159 = "Tsurugi e Hasumi, é...? Redirecionem as tropas para cá. Iniciando combate."
33070-161 = "A Filial Arius...!?"
33070-162 = "D-De onde surgiu um contingente desse tamanho...!? Como, se toda a área ao redor estava em alerta máximo...?"
33070-163 = "N-Não pode ser...!!"
33070-167 = "Não me diga que vieram do subsolo...? Daquelas Catacumbas embaixo da Antiga Catedral...!?"
33070-168 = "..."
33070-169 = "...Entendo. Então podemos concluir que toda essa situação é obra de vocês, de Arius?"
33070-170 = "...Eu não vou perdoar. Vocês vão pagar o preço agora mesmo...!"
33070-171 = "...Hasumi."
33070-172 = "...!"
33070-173 = "Acalme-se."
33070-174 = "...Sim, você tem razão."
33070-175 = "Obrigada, Tsurugi. Agora a segurança do Sensei é a nossa maior prioridade... Vou levar o Sensei e recuar daqui."
33070-176 = "Sim... Tocar o terror é o meu trabalho."
33070-177 = "Kuhihihihi... Muito bem."
33070-178 = "Eu vou brincar com vocês, seus vermes! Podem vir com tudo!!!"
33070-180 = "Hyahahahahaaaaah!"
33070-181 = "Sensei, vamos!"
