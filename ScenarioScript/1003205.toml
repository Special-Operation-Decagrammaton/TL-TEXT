[translation]
1003205-1 = "Для ханэцуки нужны двое!"
1003205-3 = "(Я не смог отказать Муцки и вышел поиграть с ней в ханэцуки.)"
1003205-4 = "Ого, Сенсей. Не думала, что вы настолько самоуверенно примете мой вызов в лоб."
1003205-5 = "Вы так уверены, что победите?"
1003205-6 = "[s] «Я... я просто пришёл, потому что ты позвала.»"
1003205-7 = "Ох... Понятно. Вы просто пришли, потому что я позвала."
1003205-8 = "Но неважно! Не вините меня, когда пожалеете, что так легко приняли мой вызов."
1003205-9 = "Может, по мне и не скажешь, но я очень уверена в своих навыках ханэцуки!"
1003205-10 = "Особенно теперь, когда у меня есть эта сверхмощная ракетка для ханэцуки из моего новогоднего счастливого мешочка!"
1003205-11 = "Хи-хи! Я заставлю вас реветь как младенца, Сенсей!"
1003205-12 = "[s1] «Сверхмощная ракетка для ханэцуки?»\n[s2] «У неё есть какая-то особая функция?»"
1003205-13 = "Ага! Только не пугайтесь, когда я расскажу, ладно?"
1003205-14 = "Ага! Только не пугайтесь, когда я расскажу, ладно?"
1003205-15 = "У этой ракетки действительно есть особая функция. И заключается она в том, что..."
1003205-16 = "проигравший обязан слушаться победителя!"
1003205-17 = "[s] «Мне кажется, ты только что это придумала...»"
1003205-18 = "Хи-хи, детали, детали! А теперь готовьтесь к погибели, Сенсей!"
1003205-19 = "Начали!"
1003205-20 = "[s] «Не уверен, что „погибель“ — подходящее слово... но ладно! Я принимаю твой вызов!»"
1003205-23 = "(Так началась моя напряжённая битва в ханэцуки с Муцки!)"
1003205-24 = "Я начну."
1003205-25 = ""
1003205-27 = ""
1003205-28 = "Ях!"
1003205-29 = ""
1003205-31 = ""
1003205-32 = "(Ракетка Муцки рассекла воздух, совершенно не задев волан.)"
1003205-33 = ""
1003205-35 = ""
1003205-36 = "[ns] «...Эм.»"
1003205-37 = "Ха-ха, это была просто разминка! Готовьтесь к настоящей игре!"
1003205-38 = "Вот теперь я серьёзно, Сенсей!"
1003205-39 = "Ях!"
1003205-40 = ""
1003205-42 = ""
1003205-43 = "(И снова ракетка Муцки рассекла воздух, так и не коснувшись волана.)"
1003205-44 = ""
1003205-46 = ""
1003205-47 = "[ns] «Муцки, это...»"
1003205-48 = "Н-Нет! Стойте! Ещё раз!"
1003205-49 = "Ях!"
1003205-50 = ""
1003205-52 = ""
1003205-53 = "(И снова ракетка Муцки рассекла воздух — дальнейшее опущено.)"
1003205-56 = ""
1003205-57 = "..."
1003205-58 = "Ха-ха-ха! Упс! Сенсей... вы довольно хороши!"
1003205-59 = "Я и не подозревала, что вы скрываете такие навыки. Неудивительно, что вы совсем не переживали."
1003205-60 = "Вот почему вы способны одолеть меня, чемпионку мира Муцки!#nНаверняка всё именно так!"
1003205-61 = "[s] «Я вообще ничего не сделал.»"
1003205-62 = "Я купила её в магазине игрушек, потому что там сказали, что это самая мощная ракетка для ханэцуки, но... похоже, товар бракованный."
1003205-63 = "Ха-ха, ничего не поделаешь. Давайте забудем про сегодняшний матч."
1003205-64 = ""
1003205-66 = ""
1003205-67 = "[ns3] «Муцки, правило есть правило. Пора рисовать на лице.»\n[ns4] «Или, согласно твоему же правилу, проигравший должен слушаться победителя.»"
1003205-68 = "Эм, п-подождите! Сенсей!"
1003205-69 = "Эм, п-подождите! Сенсей!"
1003205-70 = "Тайм-аут! Тайм-аут! Матч ещё не закончен!"
1003205-71 = "Да! Точно! Будет неинтересно, если всё закончится вот так!"
1003205-72 = "Мы специально пришли сюда поиграть в ханэцуки на Новый год, так что нужно провести ещё несколько матчей и определить победителя!"
1003205-73 = "Вот как это работает! Ну что скажете, Сенсей? А? Вы согласны, правда...? Правда?!"
1003205-74 = "[s] «Какая же ты тиранша...»"
1003205-75 = "Ещё раз! Давайте ещё раз! Первый раунд я вам поддалась, но настоящая игра начинается сейчас!"
1003205-76 = "На этот раз пощады не будет! Сенсей! Лучше приготовьтесь!"
1003205-77 = "[s] «Ладно, принимаю твой самовольный вызов.»"
1003205-79 = "(После этого мы с Муцки сыграли ещё несколько матчей в ханэцуки, но результат каждый раз был тем же.)"
1003205-80 = "Нет! Опять промах!"
1003205-82 = "Чёрт! Дурацкий ветер!"
1003205-84 = "Как вы заставляете волан менять направление прямо в воздухе?#nВы используете какую-то особую технику удара?"
1003205-87 = "Может, это была удача новичка или просто везение..."
1003205-88 = "...но я выиграл у Муцки все двенадцать матчей из двенадцати."
1003205-90 = ""
1003205-91 = "НЕ! МОЖЕТ! БЫТЬ! Как?! Вы слишком хороши, Сенсей!"
1003205-92 = "У вас к ракетке что-то приделано? Вы ведь как-то жульничаете, да?!"
1003205-93 = "[s] «Нет, конечно.»"
1003205-94 = "А! А как же мой план изрисовать ваше лицо тушью?!"
1003205-95 = "Уф!"
1003205-96 = "Хмф!"
1003205-97 = ""
1003205-99 = ""
1003205-100 = "Ну, раз так..."
1003205-101 = "[s] (У меня плохое предчувствие.)"
1003205-102 = "Ещё раз! Сенсей, давайте сыграем ещё раз! Я обязательно заставлю вас ныть и кричать: «Я в ярости! Как такое возможно?!»"
1003205-103 = "Ладно, Сенсей, начинайте вы. Только приготовьтесь как следует, хорошо?"
1003205-104 = "Когда я серьёзна, я очень страшная!"
1003205-105 = "[s] «Да-да, ладно, только дай мне...»"
1003205-106 = ""
1003205-109 = "Ага! Вижу брешь!"
1003205-110 = "[s] «М-Муцки?! Эй?!»"
1003205-111 = "Теперь мой шанс..."
1003205-112 = "укусить вас за шею!"
1003205-113 = "*ням*"
1003205-114 = ""
1003205-116 = ""
1003205-119 = "Ахаха! Вы так растерялись, что промахнулись по волану!"
1003205-120 = "Хи-хи, Сенсей, я нашла вашу слабость! У вас всё лицо красное!"
1003205-121 = "Ну, жаль, но раз вы промахнулись по волану, в этот раз вы проиграли!"
1003205-122 = "[s] «Стой! Это против правил ханэцуки!»"
1003205-123 = "Хи-хи! Проигравшие не имеют права голоса!"
1003205-124 = "А теперь, хия!"
1003205-127 = "― Ой, как жаль. Я победила, Сенсей![wa:2730]"
1003205-130 = "― Хе-хе-хе.[wa:10]"
1003205-132 = "― Признаю, вы хорошо сражались,[wa:480]"
1003205-135 = "― но поражение всегда горько, как ни крути.[wa:10]"
1003205-137 = "― А теперь примите лекарство. Хи-хи! ♪[wa:510]"
1003205-140 = "― Так, что же мне нарисовать?[wa:860]"
1003205-142 = "― Кружок? Крестик? Или у вас есть идея получше?[wa:580]"
1003205-145 = "― Сейчас ваш шанс, Сенсей.[wa:10]"
1003205-147 = "― Выполню любую просьбу.[wa:30]"
1003205-150 = "― Хотя нет, я передумала.[wa:510]"
1003205-152 = "― Что-то настолько простое не подойдёт...[wa:270]"
1003205-155 = "― Вместо этого я изрисую всё ваше лицо. Целиком![wa:470]"
1003205-158 = "Я закончила! И результат..."
1003205-159 = ""
1003205-161 = ""
1003205-163 = ""
1003205-164 = "Ха-ха-ха! Сенсей, у вас такое смешное лицо! Это слишком забавно!"
1003205-165 = "[s] «В-В следующий раз! В следующий раз я точно выиграю!»"
1003205-166 = "Нет. Не выйдет. Я победила, значит сегодняшняя игра окончена!"
1003205-167 = "[s] «Да ладно! Это нечестно!»"
1003205-168 = "Что? Что значит нечестно?"
1003205-169 = "Ну, если хотите, я могу продолжить атаковать так же, как раньше."
1003205-170 = "Хи-хи. Сенсей, хотите, чтобы я продолжала вот так на вас нападать?"
1003205-171 = "[s] «Нет, я не это имел в виду...»"
1003205-172 = "Ахаха! Шучу! Сенсей, вы такой милый, когда смущаетесь!"
1003205-173 = "Но сегодняшняя игра окончена! Мне было весело, так что я довольна!"
1003205-174 = "С этого момента я воспользуюсь полномочиями победителя!"
1003205-175 = "[s] «Что значит „полномочиями победителя“?»"
1003205-176 = "Это..."
1003205-177 = ""
1003205-179 = ""
1003205-180 = ""
1003205-182 = "Я хочу прямо сейчас прогуляться с вами, пока ваше лицо всё изрисовано!"
1003205-183 = ""
1003205-185 = ""
1003205-186 = "Ладно, Сенсей. Пошли!"
1003205-188 = "Я взял улыбающуюся Муцки за руку, и мы отправились гулять по территории."
1003205-189 = "(Я не знал, как выглядело моё лицо, но, идя рядом с улыбающейся Муцки, привлекал множество взглядов.)"
