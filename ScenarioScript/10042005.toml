[translation]
10042005-217 = "#video;10042"
10042005-1 = "Пролог;Чей-то выходной, чья-то подработка"
10042005-2 = "Кампус Геенны"
10042005-3 = "..."
10042005-4 = "У меня выходной!"
10042005-5 = "Это потрясающе! Целый выходной у всего Клуба школьной столовой!"
10042005-6 = "Что мне делать? Это правда происходит? Может, я сплю?"
10042005-7 = "О, надо проверить, ударив себя по голове..."
10042005-8 = ""
10042005-10 = ""
10042005-11 = "А-а-ай... Больно. Значит... всё правда! По-настоящему!"
10042005-12 = ""
10042005-14 = ""
10042005-15 = "Сенсей, если вы меня слышите, у меня выходной!"
10042005-16 = "Тот самый, о котором я вчера говорила с вами в MomoTalk."
10042005-17 = "Может, ещё раз проверить MomoTalk..."
10042005-18 = "<Выходной для Клуба школьной столовой. Поздравляю! Обязательно расскажи Дзюри!>"
10042005-19 = "<Может, хотя бы сегодня займёшься чем-нибудь, что совсем не связано с готовкой?>"
10042005-20 = "<Если поискать, в мире спрятано столько весёлых и увлекательных вещей!>"
10042005-21 = "Хи-хи-хи... Сенсей, как всегда, такой заботливый..."
10042005-22 = "Но чем мне на самом деле заняться...? До сих пор я думала только о готовке..."
10042005-23 = "..."
10042005-24 = "Ну, разберусь по ходу дела!"
10042005-25 = "Просто пойду куда глаза глядят и найду что-нибудь весёлое!"
10042005-26 = "А? О, привет, Фуука!"
10042005-27 = "Джури! Ты слышала? Сенсей нас поздравил. У нас целый день выходной!"
10042005-28 = "Правда? О, здорово!"
10042005-29 = "Эм, а почему ты так одета? То есть ты милая, тебе идёт, но..."
10042005-30 = "А, это? Я на один день устроилась на подработку в блинное кафе неподалёку."
10042005-31 = "На подработку? В единственный выходной?"
10042005-32 = "Может, тебе стоит отдохнуть или типа того? Мне кажется, стоило бы..."
10042005-33 = "О, не переживай. Я давно это планировала. Потому что, понимаешь, когда работаешь официанткой и подаёшь еду..."
10042005-34 = "...это немного похоже на то, будто я сама готовлю и угощаю кого-то!"
10042005-35 = "Я очень хочу попробовать!"
10042005-36 = "Джури..."
10042005-37 = "Ладно. Это вполне логично. Тут и сказать нечего."
10042005-38 = "А ты, Фуука? Чем сегодня займёшься?"
10042005-39 = "Я не очень уверена. Такие дни у нас почти никогда не бывают, понимаешь? Поэтому..."
10042005-40 = "...для начала просто выйду прогуляться."
10042005-41 = "Может, схожу в торговый центр, на стадион, на выставку, в караоке, игровой зал, на традиционный рынок..."
10042005-42 = "К-конечно, ничего слишком далёкого."
10042005-43 = "Но я постараюсь успеть как можно больше и пойду настолько далеко, насколько унесут ноги!"
10042005-44 = "..."
10042005-45 = ""
10042005-47 = ""
10042005-49 = "(Наверное, у Фууки раньше почти никогда не было свободного времени...)"
10042005-50 = ""
10042005-52 = ""
10042005-54 = "Здорово! Надеюсь, день будет прекрасным, Фуука! Повеселись на полную и ни о чём не жалей!"
10042005-55 = "Спасибо. Удачи на подработке, Джури. Только не перенапрягайся. Надеюсь, тебе понравится."
10042005-56 = "Обязательно! Повеселись!"
10042005-57 = "Спасибо. Тогда я пойду."
10042005-58 = ""
10042005-60 = ""
10042005-61 = "Может, мне поскорее добраться до кафе? Сегодня я ни с чем не могу просить Фууку помочь."
10042005-62 = "Что бы ни случилось, я справлюсь сама! Фуука заслуживает отдыха!"
10042005-64 = "Блинное кафе на окраине Геенны"
10042005-65 = ""
10042005-66 = "Мне блинчик со взбитыми сливками и клубничным сиропом. И с маслом!"
10042005-67 = "Поняла. Один блинчик со взбитыми сливками, клубничным сиропом и маслом."
10042005-68 = "А мне шоколадный блинчик с кофейным кремом."
10042005-69 = "Шоколадный блинчик с кофейным кремом. Хотите что-нибудь выпить?"
10042005-70 = "Напитки, напитки... А нам надо? Вода же есть..."
10042005-71 = "Есть, но... будто чего-то не хватает."
10042005-72 = "(Хорошо. Всё как я тренировалась...)"
10042005-73 = "Оба заказанных вами блинчика очень сладкие и вкусные, но могут быть немного липкими. А сладость бывает настолько насыщенной, что забивает вкусовые рецепторы."
10042005-74 = "Может, чёрный чай или кофе, чтобы освежить вкус?"
10042005-75 = "Хм-м... Может, правда?"
10042005-76 = "Ну, там сливки, масло и сироп. В её словах есть смысл."
10042005-77 = "Тогда мне чёрный чай."
10042005-78 = "А мне холодный кофе."
10042005-79 = "Хорошо, один чёрный чай и один холодный кофе. О, у нас ещё есть парфе. Хотите?"
10042005-80 = "Парфе, говоришь..."
10042005-81 = "Не пожалеете!"
10042005-82 = "А почему бы и нет? Два парфе!"
10042005-83 = "Отлично! Сейчас принесём."
10042005-85 = ""
10042005-86 = "Эй, Джури, спасибо! Ты отлично справляешься."
10042005-87 = "Правда? Спасибо. Хи-хи-хи..."
10042005-88 = "Конечно! Я бы с радостью взял тебя на постоянную работу!"
10042005-89 = "Э-это очень любезно, но у меня и так хватает дел в Клубе школьной столовой..."
10042005-90 = "О, Клуб школьной столовой Геенны? Они потрясающие. Знаешь, у них отличная репутация."
10042005-91 = "П-правда?"
10042005-92 = "Конечно! Каждый день они готовят огромное количество еды и все очень добросовестно работают."
10042005-93 = "О, рада слышать, что о нас так думают!"
10042005-94 = "А ещё, не то чтобы я в это верил, но слышал кое-что о... живой еде? Это ведь просто слух, да?"
10042005-95 = "Ч-что?! К-к-конечно. Просто слух."
10042005-96 = "Ну что ж, сегодня после обеда я на тебя рассчитываю, Джури. С тобой здесь всё стало гораздо проще."
10042005-97 = "Если продолжишь в том же духе, я прослежу, чтобы ты получила хороший бонус—"
10042005-98 = ""
10042005-100 = ""
10042005-102 = "!?"
10042005-103 = "?!"
10042005-104 = "Ч-что это было?!"
10042005-105 = "Кладовая...!"
10042005-107 = "Кладовая кафе"
10042005-108 = "Ч-что происходит?! Шеф, проснитесь!"
10042005-109 = "У-ух..."
10042005-110 = "Я думал, тот белый порошок — мука... А это был порох..."
10042005-111 = "(грохот)"
10042005-112 = "Он потерял сознание!"
10042005-113 = ""
10042005-115 = ""
10042005-116 = "Т-так вот что произошло! Это катастрофа...!"
10042005-117 = "Но почему в нашей кладовой вообще был порох?"
10042005-118 = "О, это мой. Разве сюда его класть нельзя?"
10042005-119 = "Да ты вообще КТО такая?! Просто пришла сюда со своим порохом и— Тебе самой это кажется НОРМАЛЬНЫМ?!"
10042005-120 = "Эм... Ну, не особо, наверное..."
10042005-121 = "Нет, не кажется!!"
10042005-122 = "М-м, да, моя вина."
10042005-123 = "*вздох* Какая же вопиющая беспечность... Побольше бы людям поучиться у тебя, Джури."
10042005-124 = "Ой, я-я не учитель..."
10042005-125 = ""
10042005-127 = ""
10042005-128 = "(Отлично, а теперь у нас ещё и повара нет, так что...)"
10042005-130 = "Где мои панкейки? Почему так долго?"
10042005-131 = "ПАНКЕЙКИ ещё ладно, но я просто заказала грейпфрутовый лимонад! Почему ДАЖЕ ЕГО так долго несут?!"
10042005-132 = "Ну да, они требуют времени. Эти вот снаружи хрустящие, а внутри пышные. Немного сиропа сверху, и... М-м-м!"
10042005-133 = "Еда у них отличная, но обслуживание ужасное!"
10042005-135 = ""
10042005-136 = "М-менеджер? Что нам делать?! Посетители уже злятся!"
10042005-137 = "Д-да. И что же нам ДЕЛАТЬ...?"
10042005-138 = "...Джури, я могу повысить тебе оплату. Сделаю всё, что попросишь, в разумных пределах..."
10042005-139 = "...Пожалуйста, начни готовить панкейки!"
10042005-140 = "Что?!"
10042005-141 = "(Я... буду... готовить... панкейки?!)"
10042005-142 = "О нет! Я не могу! Готовка — это..."
10042005-143 = "Я-я пока не очень хорошо умею!"
10042005-144 = "Что ты имеешь в виду? Ты же из Клуба школьной столовой. Вы ведь готовите каждый день, разве нет?"
10042005-145 = "...!"
10042005-146 = "Н-ну, да, но..."
10042005-147 = "Послушай, их несложно готовить. Тесто уже замешано. Просто следи за сковородой — и всё получится."
10042005-148 = "Главное — не перегреть их. Когда будут готовы, добавишь начинку — и всё!"
10042005-149 = "Д-да, рецепт я знаю, но..."
10042005-150 = "...То есть МОЖНО подумать, что всё просто, но..."
10042005-151 = "Вот оно как, да? Ну тогда мы и правда в полной заднице..."
10042005-152 = ""
10042005-154 = ""
10042005-155 = "О, погоди! Раз уж речь о Клубе школьной столовой, их президент... Айкиё Фуука, верно?"
10042005-157 = "?!"
10042005-158 = "Точно, ты же раньше говорила, что сегодня у всего вашего клуба выходной..."
10042005-159 = "...значит, наверняка и она сегодня свободна!"
10042005-160 = "Я заплачу ей вдвое — нет, втрое больше. Если она сможет прийти хотя бы на несколько часов..."
10042005-161 = "*ахает*"
10042005-162 = "(Позвать её сюда?)"
10042005-163 = ""
10042005-164 = "(Но она выглядела такой счастливой...)"
10042005-165 = "(Нет. Я не могу прерывать её выходной.)"
10042005-166 = "(Она заслужила его. Она так много делает для всех нас. Я не стану портить ей отдых.)"
10042005-167 = ""
10042005-168 = "(Ни за что! Как я ей и сказала, что бы ни случилось, я сама со всем справлюсь!)"
10042005-169 = "Так, номер Фууки..."
10042005-170 = "Менеджер, я сделаю это!"
10042005-171 = "П-Правда придёте?"
10042005-173 = "Я буду благодарен за помощь, но..."
10042005-174 = "...разве ты только что не сказала, что не сможешь?"
10042005-175 = "Э-это... Я передумала!"
10042005-176 = "Нельзя звонить Фууке! Сегодня для неё важный день! Да и незачем — я ведь здесь, прямо перед вами!"
10042005-177 = "Пусть я и не лучший повар, но если вложу в это всю душу, то, может быть, хотя бы может быть..."
10042005-178 = "Мне нравится твой энтузиазм, но... ты понимаешь, тут всё-таки не вопрос жизни и смерти..."
10042005-179 = "В любом случае спасибо, Джури. Тогда рассчитываю на тебя."
10042005-181 = "Кухня кафе"
10042005-182 = "*задыхается* *задыхается*"
10042005-183 = ""
10042005-185 = ""
10042005-186 = ""
10042005-188 = "(...Это даже немного страшно.)"
10042005-189 = "(На тренировке у меня получается нормально. Потому что если я ошибусь — ничего страшного. Я подведу только себя.)"
10042005-190 = "(Но сейчас всё иначе. Я готовлю для других. Для посетителей.)"
10042005-191 = "(И я бы очень хотела, чтобы КОГДА-НИБУДЬ другим нравилась моя еда, но...)"
10042005-192 = "Панкейки ещё не готовы?"
10042005-193 = ""
10042005-195 = ""
10042005-196 = "Все ингредиенты у меня есть..."
10042005-197 = "..."
10042005-198 = "...Не знаю, справлюсь ли я, но я ТОЧНО не могу сегодня подвести Фууку."
10042005-199 = ""
10042005-201 = ""
10042005-203 = "(Пожалуйста.)"
10042005-204 = "(Пусть они хотя бы получатся съедобными.)"
10042005-205 = "(Пожалуйста... помогите мне. Пожалуйста, пусть ничего не пойдёт не так.)"
10042005-206 = "(Только в этот раз. Неважно, что будет потом.)"
10042005-207 = "(Поэтому, пожалуйста... позвольте мне сохранить выходной Фууки...!)"
10042005-208 = "М-меня зовут Ушимаки Джури!"
10042005-209 = "И я... Я здесь, чтобы сделать это!"
10042005-214 = "А...?"
10042005-215 = "Они... правда получились нормально?"