[translation]
1013705-1 = "Платье детектива"
1013705-2 = "Ю-ху! Вот вы где, Сенсей!"
1013705-3 = "За вами никто не шёл? Хвоста нет? Общественность ни в коем случае не должна об этом узнать."
1013705-4 = "[s1] «Но у меня... нет хвоста?»\n[s2] «Что вообще происходит?»"
1013705-7 = "Пойдём внутрь, там незаметнее. Здесь слишком много глаз."
1013705-8 = "А. И, как я уже говорила... Всё, что увидите дальше, совершенно секретно."
1013705-9 = "Так же, как бесчисленные секреты, о которых вы уже забыли, этот тоже нужно забыть."
1013705-10 = "[s] «Х-Хорошо-о...!»"
1013705-14 = ""
1013705-15 = "Какого—! Кто это?"
1013705-16 = "Здравствуйте, у меня всё хорошо. Большое спасибо, что спросили."
1013705-17 = "Это клиент. Не переживай. За его умение держать язык за зубами я ручаюсь."
1013705-18 = "В конце концов, не хочу, чтобы кто-то затмил блеск моего скрытого сокровища, верно?"
1013705-19 = "Шима Коно́ка! Опять ты несёшь эту чушь!!"
1013705-20 = ""
1013705-22 = ""
1013705-24 = "МАГАЗИНУ ОДЕЖДЫ НУЖНО, чтобы о нём говорили!!"
1013705-25 = "Эх. Но мне нравится покупать здесь."
1013705-26 = "Вот именно! Поэтому ПОЖАЛУЙСТА рассказывай о нас людям!"
1013705-27 = ""
1013705-28 = "[ns] «Это место... магазин одежды?»"
1013705-29 = "Бинго! Лучшее место, если хочешь купить гавайские рубашки."
1013705-30 = "От винтажа до новинок — всё разложено по цветам! Настоятая скрытая жемчужина."
1013705-31 = "ТЫ!!! Именно ТЫ держишь её скрытой!"
1013705-32 = "Да ладно, каждый раз я покупаю минимум за десятерых клиентов. Разве этого мало?"
1013705-33 = "Если сюда набегут охотники за трендами, я потеряю прямой доступ к редким и уникальным вещам!"
1013705-34 = "Вы! Вы же Сенсей из Шале! Пожалуйста, советуйте нас всем, кому сможете! Я вас буквально умоляю."
1013705-35 = "А я буду рядом и не дам Сенсею сказать ни слова! БЕ-Е!"
1013705-36 = "Ты полицейская или бандитка?!"
1013705-37 = "Но всё же она права. Не так много людей способны оценить глубокий мир гавайских рубашек."
1013705-38 = "Приятно, когда есть клиенты, которые это понимают."
1013705-39 = "Я знала, что вы поймёте. Тогда осмотримся."
1013705-40 = "Время пришло-о-о! Найдём новых друзей и заберём домой, хи-хи-хи!"
1013705-41 = ""
1013705-43 = ""
1013705-44 = "Хмм-хмм... Когда приходит Валькирия, Банда Шлемов рыдает...!"
1013705-45 = ""
1013705-47 = ""
1013705-48 = "А если побежишь... умрё-ё-ёшь!"
1013705-49 = "Ух, расположение цветов нравится... но баланс ужасный, выбываешь!"
1013705-50 = "[ns3] «Ты отлично разбираешься в гавайских рубашках, Коно́ка.»\n[ns4] «Ты всегда их любила?»"
1013705-53 = "А? Нет. Раньше совсем не любила."
1013705-54 = "Мне просто не хотелось их носить. Можно сказать, я даже немного их ненавидела."
1013705-55 = "Только после поступления в Валькирию я наконец поняла настоящий потенциал гавайской рубашки."
1013705-56 = "Интересно, как это произошло?"
1013705-57 = "[s] «И как ты поняла это из—*вдох*!»"
1013705-58 = "Кья! Хотите верьте, хотите нет, но я И ПРАВДА заместитель директора. Я всё вижу насквозь."
1013705-59 = "Так... Когда же это было..."
1013705-60 = "А, наверное, на первом курсе. Я поступила, потому что слышала: там хвалят за то, что избиваешь бандитов."
1013705-61 = "Когда только пришла, знала лишь кулаки и пули. Всем назначали наставников. Моя была молчаливой, но ужасной занудой. В какой-то момент она была настоящим проклятием моей жизни..."
1013705-62 = "Однажды мы проверяли одно сообщение и, представьте себе, попали в ловушку. Даже не знаю, сколько их на нас навалилось."
1013705-63 = "В итоге мы всё-таки победили, а они попытались вызвать на нас полицию! Ха. Мы выглядели ужасно — вся одежда порвана, сами в крови."
1013705-64 = "[s] «Они вызвали полицию на полицию?»"
1013705-65 = "Моя наставница балансировала на тонкой грани между преступницей и офицером Валькирии."
1013705-66 = "В общем, домой в таком виде возвращаться было нельзя, так что я хотя бы хотела переодеться. А этот магазин одежды оказался единственным открытым."
1013705-67 = "Гавайка здесь, гавайка там, гавайка, гавайка, гавайка! Не знаю почему, но меня это жутко рассмешило!"
1013705-68 = "Сначала я подумала, что она надела гавайскую рубашку только потому, что её белая была в полном ужасе!"
1013705-69 = "Ого, у нас даже есть живое свидетельство очевидца!"
1013705-70 = "Так что нам с наставницей пришлось возвращаться в гавайских рубашках. Мне показалось, что мне идёт, и с тех пор я их ношу. И для расследований удобно!"
1013705-71 = ""
1013705-73 = ""
1013705-74 = "О! Вот она! Я всегда хотела с утками!"
1013705-75 = "Здесь как раз есть ещё одна, так что возьму такую же и вам, Сенсей. Маленький подарок от меня!"
1013705-76 = "Я пошла, босс! Оставьте мне эти две."
1013705-77 = "Две, поняла! Уверена, вам тоже пойдёт, Сенсей."
1013705-78 = "[s] «А платить?»"
1013705-79 = "Госпожа-следователь заранее оплатила примерно 300 рубашек, потому что не любит таскать с собой кошелёк."
1013705-80 = "Приходите ещё и обязательно советуйте нас другим!"
1013705-82 = "Кья! Покупки и правда лучше всего!"
1013705-83 = "Пусть это останется между нами. Сюда вам можно приходить только со мной."
1013705-84 = "Было приятно вспомнить прошлое. Я даже скучаю по тем тяжёлым временам с наставницей."
1013705-85 = "Надо было тогда сфотографировать сестрёнку в гавайской рубашке... Эх, жаль."
1013705-86 = "[s] «Сестрёнку»? Значит, твоей наставницей была...?!"
1013705-87 = "А? Разве не очевидно? Кто ещё?"
1013705-88 = "Надо отдать должное тогдашнему начальству. Именно они придумали поставить Дикую Гончую в пару с какой-то хулиганкой."
1013705-89 = "Ладно, увидимся позже! И обязательно постирайте рубашку перед тем, как надевать!"
1013705-90 = "Пока-пока!"
1013705-92 = "Коно́ка с улыбкой скрылась за углом."
