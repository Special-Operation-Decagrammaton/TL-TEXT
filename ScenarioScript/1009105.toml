[translation]
1009105-1 = "Да, я её менеджер"
1009105-2 = "Поздним вечером я ждал Казусу у ближайшего перекрёстка."
1009105-3 = "...Йо! Сенсей."
1009105-4 = ""
1009105-7 = ""
1009105-8 = "[ns1] «О, привет, Казуса.»\n[ns2] «Ты как раз вовремя.»"
1009105-11 = "Вы же не долго ждали? Я старалась закончить репетицию как можно быстрее..."
1009105-12 = "Я знаю, что иногда вы приходите слишком рано."
1009105-13 = "Мы ведь не впервые встречаемся... Вы уже должны знать мои привычки, так что не стоит ждать дольше, чем нужно."
1009105-14 = "[s] «Если я жду тебя, Казуса...»"
1009105-15 = "Эй-эй. Стоп. Стоп."
1009105-16 = "Я знала, что вы это скажете. Даже отвечать ничего не буду. На этот раз."
1009105-17 = "Почему бы вам просто не выбрать что-нибудь поесть?"
1009105-18 = "...Хм? Вы уже что-то выбрали?"
1009105-19 = "О...? Ничего себе. Решили разнообразить, да?"
1009105-20 = "Тогда дайте мне список. Я придумаю маршрут."
1009105-21 = "У всех заведений здесь разное время закрытия, так что если начать с ближайших, некоторые мы можем не успеть посетить."
1009105-22 = "Короче говоря, оставьте всё эксперту. Хи-хи."
1009105-23 = ""
1009105-25 = ""
1009105-26 = ""
1009105-27 = "Так, посмотрим..."
1009105-28 = "М-м. Хм... Понятно..."
1009105-29 = "Хм, неплохо. На этом этапе вы уже полноценный член Клуба сладостей после школы. Я бы сказала, готовы."
1009105-30 = "[s] «Ну, у меня был отличный учитель.»"
1009105-31 = "Лесть вам ничего не даст. Но это не значит, что нужно прекращать."
1009105-32 = "...Хи-хи."
1009105-33 = "Ладно. Не люблю тратить время впустую, так что..."
1009105-34 = "...пойдём!"
1009105-36 = "После этого мы с Казусой обошли все десертные вокруг."
1009105-37 = "Мы немало петляли, но она сказала, что это «оптимальный маршрут», чтобы успеть во все места до закрытия."
1009105-39 = "К вечеру мы добрались до последнего заведения в списке."
1009105-40 = ""
1009105-44 = "...Хм. Хорошо. Мы не слишком опоздали."
1009105-45 = "Вот и всё. Официально прошли весь список."
1009105-46 = "А?"
1009105-47 = "Я потрясающая? Ха-ха. Ладно, этот комплимент я приму с гордостью."
1009105-48 = "В смысле, у остальных есть вещи, в которых я не так уж хороша..."
1009105-49 = "Но когда речь о том, чтобы водить Сенсея за собой, возможно, я лучшая."
1009105-50 = "Так что теперь, когда вам снова захочется чего-то такого..."
1009105-51 = ""
1009105-53 = ""
1009105-54 = "...просто положитесь на старшую сестрёнку для всех. Поняли?"
1009105-55 = "[s3] «Сегодня ты очень уверенная.»\n[s4] «Ха-ха. Буду ждать.»"
1009105-58 = "Хи-хи. Конечно, договорились."
1009105-59 = "Ну а теперь..."
1009105-61 = "О, здравствуйте. Вы наш последний посетитель на сегодня."
1009105-62 = ""
1009105-64 = ""
1009105-65 = ""
1009105-66 = "...Ого. Ну надо же. Нашему особому гостю достаётся последняя порция."
1009105-67 = "Вы случайно не... вокалистка какой-нибудь группы?"
1009105-68 = "Хм?"
1009105-69 = ""
1009105-71 = ""
1009105-72 = "...Погодите, что? Они ко мне обращаются, Сенсей?"
1009105-73 = "[s5] «У тебя и правда такой вид.»\n[s6] «Ну, кроме нас здесь никого нет.»"
1009105-76 = "Сейчас многие музыканты начинают ещё в школьные годы."
1009105-77 = "Иметь мечту в юности и упорно к ней идти... это здорово! Я всегда за таких болею."
1009105-78 = "А кто рядом с вами?"
1009105-79 = "А, точно, это..."
1009105-80 = "...Сэн—"
1009105-82 = "...Ваш менеджер, верно?"
1009105-83 = ""
1009105-85 = ""
1009105-86 = "*ахает*"
1009105-87 = ""
1009105-90 = "[ns7] «...А?»\n[ns8] «Ну да, я ведь и правда похож на менеджера, да?»"
1009105-91 = ""
1009105-93 = ""
1009105-94 = "А, эм... Это..."
1009105-95 = "Эм... Ну..."
1009105-96 = "Хм?"
1009105-97 = "...? Х-Хм?"
1009105-98 = "О-Ой. Прошу прощения... Наверное, я сказал что-то не то."
1009105-99 = "Наверное, просто увлёкся, ведь вы последние посетители. Похоже, ошибся..."
1009105-100 = "..."
1009105-101 = "..."
1009105-102 = "Тогда это..."
1009105-103 = "[s9] «Нет, всё нормально. Я...»\n[s10] «...этому студенту...»"
1009105-106 = "...менеджер."
1009105-107 = ""
1009105-108 = "[ns11] «Хм?»\n[ns12] «Казуса?»"
1009105-111 = "Да. Менеджер. Это мой менеджер."
1009105-112 = "Я просто на секунду растерялась, потому что не думала, что кто-то заметит."
1009105-113 = ""
1009105-115 = ""
1009105-116 = "...Точно?"
1009105-117 = ""
1009105-119 = ""
1009105-120 = ""
1009105-121 = "Менеджер? ...Правда?"
1009105-122 = ""
1009105-126 = "...Я пока просто согласился и купил последний десерт в магазине."
1009105-127 = "Выйдя наружу, я на секунду отвёл взгляд. А когда посмотрел снова, Казуса уже убежала."
