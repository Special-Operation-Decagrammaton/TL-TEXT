[translation]
10012050-1 = "Эпизод 5; Незваный гость"
10012050-2 = ""
10012050-4 = "Вот мы и пришли."
10012050-5 = "Спасибо, что пошли со мной. Надеюсь, отсюда мы сможем восстановить электроснабжение."
10012050-7 = "Конечно... Но после всей этой уборки и сбора припасов неплохо было бы и отдохнуть."
10012050-8 = "Хи-хи. Мне так нравится смотреть, как мои детишки веселятся."
10012050-9 = "Веселятся?! Мои боль и страдания кажутся тебе весельем?!"
10012050-11 = "Я знаю, Серика. Прости, что заставляю тебя через всё это проходить."
10012050-12 = "Обещаю, как только восстановим электричество, ты получишь отпуск, которого заслуживаешь."
10012050-13 = "Хм... Оборудование в рабочем состоянии."
10012050-14 = "Оно, конечно, старое и ржавое, но я смогу его запустить."
10012050-15 = "Ещё я нашла план курорта."
10012050-16 = "Смотрите, вот здесь. Тут есть ангар и складское помещение."
10012050-17 = "Ангар? Серьёзно?"
10012050-19 = "Отличная находка, Широко! Аяне сможет перестать переживать о ремонте вертолёта, если там найдутся запчасти."
10012050-20 = "Всё складывается как нельзя лучше! ☆"
10012050-21 = "Прежде чем вы слишком обрадуетесь: железные ворота ангара не сдвинутся, пока мы не восстановим электричество."
10012050-23 = "Мало было убрать весь комплекс... Теперь нам ещё и электриками становиться?"
10012050-24 = "Ну-ну. Считай это частью полного погружения в отпуск."
10012050-25 = "Просто делай всё по шагам, Серика."
10012050-26 = "Кстати... Какой у нас следующий шаг?"
10012050-29 = "Эй? Здесь кто-нибудь есть?"
10012050-30 = "Если только ты не ищешь призраков, думаю, всё безопасно."
10012050-31 = "Справедливости ради, нельзя быть уверенными, что мы окончательно отпугнули бандитов в шлемах."
10012050-33 = "Согласна. Нам стоит сохранять бдительность."
10012050-34 = "Думаю, всё будет нормально. Будь у них возможность, они бы уже подключились к системе наблюдения."
10012050-35 = "Судя по толстому слою пыли, мы здесь первые."
10012050-36 = "Ты правда думаешь, эта древняя развалюха ещё работает?"
10012050-37 = "Ну..."
10012050-38 = ""
10012050-40 = ""
10012050-41 = ""
10012050-44 = "Она включается!"
10012050-45 = "Серьёзно?! Всё было настолько просто — просто нажать кнопку?"
10012050-46 = "Хи-хи! Глупенькая Серика! Для этого кнопка «Вкл.» и существует!"
10012050-47 = "О-Очевидно! Я не это имела в виду!"
10012050-48 = "В защиту Серики скажу: я тоже не ожидала, что всё заработает с первой попытки."
10012050-49 = "Хоть что-то прошло гладко — уже облегчение."
10012050-50 = "О? Вы это видите?"
10012050-51 = ""
10012050-53 = ""
10012050-54 = "«Система защиты курорта»...?"
10012050-56 = "Как круто! У курорта есть собственная система защиты!"
10012050-57 = "Она будет нас защищать, и нам даже пальцем шевелить не придётся. Я за!"
10012050-58 = "Хотела бы я посмотреть, как эти тупые бандиты теперь попробуют сюда сунуться."
10012050-59 = "Давай, Аяне! Запускай её."
10012050-61 = "Т-Ты уверена? Думаю, терять нам всё равно нечего..."
10012050-62 = ""
10012050-64 = ""
10012050-66 = "Она работает?"
10012050-68 = "О! Кажется, включается."
10012050-69 = "Ага, ага! Смотрите, через камеры видно весь курорт."
10012050-70 = "Электричество есть! Какое облегчение."
10012050-71 = ""
10012050-75 = "<Системное сообщение>"
10012050-77 = "Система защиты курорта."
10012050-79 = "Система защиты курорта. Активация."
10012050-81 = "Переход в автономный режим охраны."
10012050-84 = "<Системное сообщение>"
10012050-86 = "Сканирование"
10012050-88 = "Сканирование..."
10012050-90 = "Сканирование......"
10012050-92 = "Невероятно. Она сканирует весь курорт на наличие угроз."
10012050-93 = "Не каждый может позволить себе настолько современную систему защиты."
10012050-94 = "...Кайзер мог бы себе позволить."
10012050-95 = "Я бы не переживала из-за этого. Эта система даже более продвинутая, чем их технологии."
10012050-97 = "<Системное сообщение>"
10012050-98 = "...Сканирование завершено."
10012050-101 = "<Системное сообщение>"
10012050-102 = "Поиск неавторизованного персонала."
10012050-104 = "Несколько объектов"
10012050-106 = "обнаружено"
10012050-108 = "обнаружено на"
10012050-110 = "обнаружено на территории курорта."
10012050-112 = "Она уже нашла угрозу! Как круто."
10012050-113 = "Погоди? Под неавторизованным персоналом она имеет в виду..."
10012050-114 = "Ой-ой."
10012050-116 = "<Системное сообщение>"
10012050-117 = "Развёртывание автономных"
10012050-119 = "мер предотвращения проникновения."
10012050-122 = "Стойте! Нет!"
10012050-123 = "Система активировала целую армию охранных роботов!"
10012050-125 = "З-Зачем? Потому что, похоже..."
10012050-126 = "...они направляются сюда..."
10012050-127 = "Очень на то похоже~"
10012050-128 = "[s1] «...Вот это поворот.»\n[s2] «Технически мы и правда проникли сюда без разрешения.»"
10012050-129 = "Это же нелепо! У нас есть разрешение! У нас есть билет!"
10012050-130 = "Нет, мы не нарушители! У нас есть разрешение! У нас есть билет!"
10012050-131 = "Но система не знает, что у нас есть билеты. Здесь никого не было, чтобы нас зарегистрировать."
10012050-132 = "Да и вообще, думаю, отдыхающих не хотели бы видеть в диспетчерской."
10012050-134 = "Они уже здесь. Их примерно..."
10012050-135 = "...пара сотен!"
10012050-137 = "С-С-Сотен?! Что делать? Что нам делать?!"
10012050-138 = "Дыши глубже, Серика! Здесь должен быть способ зарегистрировать нас."
10012050-139 = "Вот видите, никаких проблем! Нам нужно просто защищать Аяне, пока она всех нас регистрирует."
10012050-140 = "Нет, это огромная проблема! Я на такое не подписывалась."
10012050-142 = "...Сенсей? Что нам делать?"
10012050-143 = "[s3] «Подерёмся с роботами.»\n[s4] «Не волнуйтесь. Я проведу вас через это.»"
10012050-144 = ""
10012050-145 = ""
10012050-147 = ""
10012050-148 = "Они идут!"
