[translation]
1015002-1 = "Curious Orca"
1015002-3 = "(One day, while visiting Odyssey Marine High School for Schale work)"
1015002-4 = "(With some free time, I decided to soak up the sun on a pier bench)"
1015002-5 = "(The monotonous sound of waves and the warm sunlight...#nstarted making me feel drowsy...)"
1015002-11 = "(How much time has passed since then...)"
1015002-15 = "Hmm..."
1015002-19 = "[ns] \"Whoa...!?\""
1015002-20 = "Oh, it was just Sensei."
1015002-21 = "You were sitting on my favorite bench, so I wondered who it was."
1015002-22 = "[s1] \"K-Kotone?\"\n[s2] \"Why are you getting so close... is something wrong?\""
1015002-25 = "Hmm... I was just checking your face."
1015002-26 = "Why? Well... my eyesight is bad."
1015002-27 = "I cannot see your face properly unless I get this close."
1015002-28 = "I was supposed to leave my glasses around here, though..."
1015002-33 = "...Found them."
1015002-38 = "[ns] \"I was startled to wake up and see Kotone right in front of me.\""
1015002-39 = "Is it really that surprising?"
1015002-40 = "Though, come to think of it... when I checked faces before, some kids did panic."
1015002-41 = "I suppose people are not comfortable with someone getting this close."
1015002-42 = "What should I do about it? I cannot just wear glasses all the time..."
1015002-43 = "[s] \"Isn't it more inconvenient not wearing them?\""
1015002-44 = "Ugh... but the diving club has to submerge suddenly a lot."
1015002-45 = "Keeping glasses on causes all sorts of inconveniences."
1015002-46 = "[s3] \"I guess you do not wear glasses when diving...\n[s4] \"Still... not being able to see is dangerous even underwater.\""
1015002-49 = "It is fine. Underwater, you can use other things besides eyesight."
1015002-50 = "[s] \"Things besides eyesight...?\""
1015002-51 = "Like the flow of seawater you feel on your skin, or the water temperature..."
1015002-52 = "The easiest one to understand is probably sound."
1015002-53 = "Water has a higher density than air, so sounds travel far."
1015002-54 = "That is why you can quickly grasp your surroundings."
1015002-55 = "Of course, getting used to it takes a little training."
1015002-56 = "[s5] \"I never even thought about straining my ears underwater...\n[s6] \"What kind of things can you hear?\""
1015002-59 = "Hmm..."
1015002-60 = "Oh, right. I have some sounds I recorded underwater. Want to listen?"
1015002-61 = "It might even help you detect danger underwater."
1015002-62 = "[s] \"Sure. I would love to hear them.\""
1015002-63 = "Okay. Here is the first one."
1015002-68 = "...What does this sound like to you?"
1015002-69 = "[s7] \"I hear something like a large machine operating...\n[s8] \"Is that... an engine sound?\""
1015002-72 = "Correct. That is the sound of a ship's engine heard underwater."
1015002-73 = "If you hear sounds like this, there is a high chance a ship is passing overhead...#nSo be careful when surfacing."
1015002-74 = "Next is the second sound."
1015002-78 = "[ns9] \"It sounds kind of like an elephant calling...\n[ns10] \"Could that be a whale's call?\""
1015002-79 = "It is a bit similar, but that is a humpback whale call."
1015002-80 = "Yep. That is the call of a humpback whale."
1015002-81 = "Whale calls sound kind of sad...#nlistening to them can give you chills sometimes, but..."
1015002-82 = "They are basically harmless, so you do not need to be too wary of them."
1015002-83 = "Besides...#nmost sea creatures will not attack unless you mess with them first."
1015002-84 = "People tend to instinctively fear unknown sea creatures...#nbut the most dangerous creature of all might just be humans."
1015002-85 = "Lastly, the third sound is--"
1015002-89 = "Sorry, that last one was a different sound."
1015002-90 = "I have not eaten anything since finishing the morning dive..."
1015002-91 = "[s] \"Hunger is a major threat, too.\""
1015002-95 = "[ns11] \"Should we go grab something to eat?\"\n[ns12] \"Is there anything you want?\""
1015002-99 = "...Poke."
1015002-100 = "I love poke packed with fish."
1015002-101 = "[s] \"Sounds good. Let us go, then.\""
1015002-103 = "(After that... we enjoyed a fun time with Kotone at the port while eating poke loaded with tuna)"
