[translation]
2600602-1 = "Один удачный день"
2600602-2 = "Жилой район Кивотоса."
2600602-3 = "Идя по улице, я заметил монету в 500 иен."
2600602-4 = "[s] (Поднять монету в 500 иен.)"
2600602-5 = "Сто-о-ой!"
2600602-7 = ""
2600602-8 = "*тяжело дышит* *тяжело дышит* ...Сенсей, это моя монета!"
2600602-9 = "[s] «Ты уронила эту монету?»"
2600602-10 = "Нет, я её не роняла, но..."
2600602-11 = "Я первой её нашла!"
2600602-12 = "С расстояния в один километр!"
2600602-13 = "[s] «С километра?»"
2600602-14 = "Ага! Если посмотреть через этот телескоп, я даже муравьёв, ползущих за сотни километров, увижу!"
2600602-15 = "Мой утренний гороскоп обещал удачу, поэтому я всё утро смотрела в телескоп в надежде, что сегодня случится что-нибудь хорошее... и мне повезло!"
2600602-16 = "В Спецотряде №227 ужасное снабжение, так что нам даже сладостей не хватает..."
2600602-17 = "Но на 500 иен я смогу купить целую гору выпечки и напитков в магазине!"
2600602-18 = "Так что, Сенсей, пожалуйста, отдай мне монету!"
2600602-19 = "[s1] (Не отдавать монету.)\n[s2] (Проигнорировать её.)"
2600602-20 = "Почему, Сенсей?!"
2600602-21 = "Почему, Сенсей?!"
2600602-22 = "Что? Неважно, кто увидел первым? Законный владелец тот, кто первым поднял?"
2600602-23 = "Ты злой! Жадный! Несправедливый!"
2600602-24 = "[s] «Вместо этого я куплю тебе пирожное в L'Oiseau Bleu в центре.»"
2600602-25 = "Ч-Что? L'Oiseau Bleu — это ведь тот... дорогущий магазин сладостей, где даже самое дешёвое пирожное стоит больше 1000 иен?"
2600602-26 = "Т-Ты уверен?"
2600602-27 = "[s] «Я не против.»"
2600602-28 = "С-Спасибо."
2600602-29 = "И правда... сегодня мне очень везёт."
2600602-31 = "После всего этого я всё-таки купил самое дорогое пирожное, расплатившись картой..."
2600602-32 = "Но Нодока не смогла съесть даже половину — цена слишком сильно её смущала."
