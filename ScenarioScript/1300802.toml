[translation]
1300802-1 = "Помощник на подработке"
1300802-2 = "Пригородный рынок Абидоса"
1300802-3 = "Вы опоздали! Я уже целую вечность жду."
1300802-4 = "[s] «По моему расписанию — нет.»"
1300802-5 = "Все знают, что на подработку нужно приходить немного заранее."
1300802-6 = "[s] «Да ладно тебе, Серика.»"
1300802-7 = "Но всё равно пришли только вы. По крайней мере вы надёжный."
1300802-8 = "А? Что значит, вы ещё ни на что не соглашались? Ну же, не будьте таким."
1300802-9 = "Я просто не понимаю, зачем тратить свободное время впустую. Лучше быть активной... Это полезно для здоровья, можно немного заработать и вообще куча причин."
1300802-10 = "А? Хотите знать, что мне нужно?"
1300802-11 = ""
1300802-12 = "Вот, возьмите."
1300802-13 = "[s] «Листовки?»"
1300802-14 = ""
1300802-15 = "Главная задача сегодня — раздать эти листовки. Прохожим или по почтовым ящикам в округе. Одна иена за листовку!"
1300802-16 = "В этой работе важна скорость! Листовок очень много, так что помощь мне правда пригодится."
1300802-17 = "[s] «И всё? Просто раздавать их?»"
1300802-18 = "Кажется, вы неправильно поняли. Я не прошу вас их раздавать..."
1300802-19 = "Вы будете присматривать за лавкой."
1300802-20 = "Оставайтесь здесь, пока я раздаю листовки. Когда вернусь, приготовьте следующую пачку. Я заберу её и снова пойду раздавать. И так по кругу."
1300802-21 = "Просто, да? Половину сегодняшней оплаты отдам вам, так что за дело!"
1300802-22 = "[s1] «Разве вдвоём мы не раздадим их быстрее?»\n[s2] «Поделить оплату пополам? Не нужно.»"
1300802-23 = "Ну же, у нас нет времени это обсуждать. Мне пора, так что дайте пятьсот листовок!"
1300802-24 = "Ну же, у нас нет времени это обсуждать. Мне пора, так что дайте 500 листовок!"
1300802-25 = "[s] Передать пачку листовок."
1300802-26 = ""
1300802-27 = "Я скоро вернусь!"
1300802-30 = "Так, я вернулась! Следующую!"
1300802-31 = "[s] Передать пачку листовок."
1300802-32 = ""
1300802-33 = "Скоро буду!"
1300802-36 = ""
1300802-37 = ""
1300802-38 = "*пыхтит* *пыхтит* Следующую!"
1300802-39 = "[s] Передать пачку листовок."
1300802-40 = ""
1300802-41 = "Фух... Погнали!"
1300802-44 = ""
1300802-45 = ""
1300802-46 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
1300802-47 = ""
1300802-48 = "*вздыхает*"
1300802-49 = "[s3] «Тебе не стоит немного сбавить темп?»\n[s4] «Ты выглядишь измотанной...»"
1300802-50 = "Я-я в порядке. К тому же, если не буду так спешить, до конца дня не закончу."
1300802-51 = "Я-я в порядке. К тому же, если не буду так спешить, до конца дня не закончу."
1300802-52 = ""
1300802-53 = "*вздох* Ладно, я скоро вернусь!"
1300802-54 = ""
1300802-55 = ""
1300802-56 = ""
1300802-57 = "[s5] ...\n[s6] ...Нужно ей помочь."
1300802-58 = "(Я решил раздать часть листовок.)"
1300802-59 = "(Я решил раздать часть листовок.)"
1300802-62 = "Я вернулась... *тяжело дышит*"
1300802-63 = "[s] «Молодец.»"
1300802-64 = "Сколько... ещё осталось?"
1300802-65 = "[s7] «Это была последняя. Всё готово.»\n[s8] Показать пустой пакет."
1300802-66 = "А...?"
1300802-67 = "А...?"
1300802-68 = "Я была уверена, что оставалось ещё несколько пачек. Может, мне показалось..."
1300802-69 = "[s9] «Наверняка.»\n[s10] «Вероятно, ты просто очень устала.»"
1300802-70 = "Ну, ладно тогда. Ха-ха! Всё-таки справилась!"
1300802-71 = "Ну, ладно тогда. Ха-ха! Всё-таки справилась!"
1300802-72 = "[s] «Молодец.»"
1300802-73 = "Спасибо! Вы тоже хорошо поработали, Сенсей!"
1300802-74 = "*вздох* Если честно, я и так была уже на пределе... Ноги дрожат."
1300802-75 = "Готовы пойти за оплатой?"
1300802-77 = "Я решил отдать Сэрике свою долю заработка."
1300802-78 = "Что?"
1300802-79 = "Но вы честно заработали свою часть! Вам положена оплата!"
1300802-80 = "Она отказалась."
1300802-82 = "*зевок*"
1300802-83 = "После долгого рабочего дня я всегда ужасно устаю. У вас так же?"
1300802-84 = "[s] «Что собираешься делать с заработанными деньгами?»"
1300802-85 = "Хм? Тратить не буду. Всё пойдёт Комитету по предотвращению закрытия."
1300802-86 = "[s] «...О.»"
1300802-87 = "Ага. Нужно продолжать зарабатывать, чтобы выплачивать долг академии."
1300802-88 = "...Комитет по предотвращению закрытия не принял бы эти деньги, если бы узнал, что я заработала их на подработке."
1300802-89 = "Поэтому я и попросила вас помочь!"
1300802-90 = "..."
1300802-91 = "Не против иногда снова работать вместе? Сегодня ваша помощь сильно всё изменила."
1300802-92 = "[s] Кивнуть."
1300802-93 = "Хи-хи. Спасибо."
1300802-94 = "Ещё увидимся! Мне нужно домой и в душ. И, наверное, что-нибудь поесть."
1300802-95 = "Пока, Сенсей!"
1300802-96 = ""
1300802-97 = "(Надо подумать, что сделать с заработанными деньгами.)"
1300802-99 = "(...)"
1300802-100 = "(Можно анонимно пожертвовать их Комитету по предотвращению закрытия.)"
