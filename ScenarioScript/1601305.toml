[translation]
1601305-1 = "Ночное небо Кохару"
1601305-4 = "Я сидел на пляже, когда вскоре ко мне присоединилась Кохару. По тихим шагам было слышно, что она крадётся на цыпочках."
1601305-5 = ""
1601305-8 = ""
1601305-9 = "...Т-Так вот где вы были, Сенсей!"
1601305-10 = "Что вы делаете? Если бы мы были в Тринити, комендантский час уже давно начался бы!"
1601305-11 = "А?"
1601305-12 = "Вы хотели посмотреть на звёзды, потому что здесь такое чистое небо?"
1601305-13 = "В этом нет никакого смысла. Я могу смотреть на звёзды из своей комнаты в общежитии Тринити когда захочу."
1601305-14 = "Это ведь просто отговорка! Вы наверняка задумали здесь в одиночку что-нибудь непристойное!"
1601305-15 = "...А? Звёзды здесь и дома выглядят по-разному?"
1601305-16 = "Что вы имеете в виду—"
1601305-17 = "[s1] «Посмотри внимательнее сама, Кохару.»\n[s2] «Без городских огней небо выглядит иначе.»"
1601305-20 = "О чём вы говорите...?"
1601305-21 = "Хм..."
1601305-22 = ""
1601305-24 = ""
1601305-25 = ""
1601305-26 = "...!"
1601305-29 = "Ч-Что происходит? Звёзд стало гораздо больше!"
1601305-30 = "Не понимаю. Это же всё то же небо, на которое я смотрю дома!"
1601305-31 = "Я знаю, что мы в новом месте, но оно выглядит совершенно иначе!"
1601305-32 = "[s3] «Искусственный свет обычно затмевает звёзды.»\n[s4] «Чем темнее ночь, тем ярче сияют звёзды.»"
1601305-37 = "Правда...? Наверное, в этом есть смысл."
1601305-38 = "Так вы пришли сюда в такую даль, чтобы в одиночку смотреть на звёзды?"
1601305-39 = "Вот как..."
1601305-40 = "Эта отговорка... на самом деле звучит довольно разумно. Хм..."
1601305-41 = "[s5] «А ты, Кохару?»\n[s6] «Почему ты пришла меня искать?»"
1601305-42 = ""
1601305-43 = ""
1601305-45 = ""
1601305-46 = "Я?! П-Просто так! У меня не было какой-то особой причины...!"
1601305-47 = "Я имею в виду, следить за вами — мой долг! Вы уже должны это знать!"
1601305-48 = "...Что? Почему я не спала?"
1601305-49 = "Ну..."
1601305-50 = "Но...! Но..."
1601305-51 = "Я просто... внезапно проснулась, а вас нигде не было... поэтому..."
1601305-52 = "Я испугалась, что с вами могло что-то случиться..."
1601305-53 = ""
1601305-55 = ""
1601305-56 = "Э-Эй! Немедленно перестаньте смеяться! Хватит!"
1601305-57 = "Беру свои слова обратно! Забудьте! Я вообще за вас не волновалась!"
1601305-58 = "Забудьте! Я иду обратно спать! А вы любуйтесь своими звёздами, Сенсей!"
1601305-59 = ""
1601305-61 = ""
1601305-67 = ""
1601305-68 = "..."
1601305-69 = "[s7] «...Кохару?»\n[s8] «Разве ты не сказала, что пойдёшь спать?»"
1601305-70 = ""
1601305-71 = ""
1601305-73 = ""
1601305-74 = "Н-Ну..."
1601305-75 = "Ну..."
1601305-76 = "Так... эм..."
1601305-77 = ""
1601305-80 = "[ns9] «Вообще-то я уже довольно сонный.»\n[ns10] Молча вернуться вместе с Кохару."
1601305-86 = "Угх. Дальше, чем я думала... и темнее..."
1601305-87 = "Если бы я знала, что будет так темно, просто попросила бы Сенсея прийти ко мне..."
1601305-88 = "...Сенсей? Вы ведь прямо рядом со мной? Правда?"
1601305-89 = "[s11] «Я всё ещё держу тебя за руку. Не бойся.»\n[s12] «Может, пойдём медленнее, если тебе слишком страшно?»"
1601305-90 = ""
1601305-91 = ""
1601305-93 = ""
1601305-94 = "Я-я вовсе не говорила, что мне страшно!"
1601305-95 = "Просто, эм..."
1601305-96 = "Ночью тропинки опасны! Можно споткнуться и УМЕРЕТЬ!"
1601305-97 = "И-и... Эм..."
1601305-98 = "Эм..."
1601305-99 = "Вообще-то... наверное... пока я с вами... всё будет в порядке..."
1601305-100 = "Может быть, всё и правда будет хорошо..."
1601305-101 = ""
1601305-103 = ""
1601305-104 = "...Хи-хи."
1601305-105 = "Хи-хи-хи..."
1601305-106 = ""
1601305-109 = "И-и!"
1601305-110 = "Что это был за звук? Совсем рядом!"
1601305-111 = ""
1601305-114 = ""
1601305-115 = "[ns13] «Успокойся, Кохару. Просто...»\n[ns14] «Наверняка это какое-то маленькое животное.»"
1601305-116 = ""
1601305-117 = ""
1601305-119 = ""
1601305-120 = "А-а-а-а!"
1601305-121 = "Сенсей!!!"
1601305-122 = ""
1601305-125 = ""
1601305-127 = "[ns15] «К-Кохару! Отойди!»\n[ns16] «Я ничего перед собой не вижу!»"
1601305-130 = "[ns] «Так мы...!»"
1601305-131 = ""
1601305-137 = "...Мы столкнулись головами, и я потерял сознание..."
1601305-141 = "Когда я пришёл в себя, солнце уже всходило."
1601305-142 = ""
1601305-145 = "[ns17] Быстро осмотреться.\n[ns18] «Кохару...? Кохару?!»"
1601305-146 = ""
1601305-147 = ""
1601305-153 = ""
1601305-154 = "...Хи... хи-хи-хи..."
1601305-155 = "Как вкусно... Хр-р... Я больше... не могу есть... хи-хи..."
1601305-156 = "Хи-хи... хи-хи-хи..."
1601305-157 = "Сенсей..."
1601305-158 = ""
1601305-162 = "Я взвалил спящую Кохару себе на спину и отнёс нас обратно в лагерь."
