[translation]
1007102-1 = "SRT, экипируемся!"
1007102-3 = "Я отправился к координатам встречи, которые прислала Мияко, но когда прибыл..."
1007102-5 = "Центральный универмаг D.U."
1007102-7 = "[ns] «Этого не может быть...»"
1007102-8 = "Я совершенно не понимал, какое военное снаряжение она собирается покупать в универмаге..."
1007102-9 = ""
1007102-11 = ""
1007102-12 = "А, Сенсей. Вы пришли."
1007102-13 = "Я рада, что вы добрались без происшествий."
1007102-14 = "Раз мы успешно встретились, можем продолжить путь к месту назначения."
1007102-15 = "[s] «Подожди секунду, Мияко.»"
1007102-16 = ""
1007102-18 = ""
1007102-19 = "Хм? Что-то случилось?"
1007102-20 = "[s1] «Мы ведь здесь ради операции, да?»\n[s2] «Но это же универмаг...»"
1007102-23 = "О... Понимаю."
1007102-24 = "Похоже, я забыла объяснить подробности. Прошу прощения."
1007102-25 = "[s3] «Тебе не за что извиняться...»\n[s4] «Объяснишь, что мы здесь делаем?»"
1007102-28 = "Некоторое время назад человек, которому я помогла, в благодарность подарил мне сертификат этого магазина."
1007102-29 = "Я пыталась отказаться, но он настоял, чтобы я потратила его на припасы для отряда. Похоже, срок действия сертификата всё равно скоро истекал, и он не хотел, чтобы тот пропал зря."
1007102-30 = "Я решила купить снаряжение для летней операции SRT, но ассортимент универмага оказался... ошеломляющим..."
1007102-31 = "В академии нам просто выдавали всё необходимое..."
1007102-32 = "Раз бюджет ограничен, я хотела бы попросить вашей помощи, Сенсей. Вы поможете мне убедиться, что деньги не будут потрачены зря."
1007102-33 = "[s5] «Я не очень разбираюсь в туристическом снаряжении, но постараюсь.»\n[s6] «Разберёмся вместе.»"
1007102-36 = "Спасибо, Сенсей."
1007102-37 = ""
1007102-39 = ""
1007102-40 = "Первое в списке — что-нибудь, что защитит электронное оборудование от дождя и влаги..."
1007102-42 = "Вскоре мы с Мияко уже ходили по универмагу и покупали припасы."
1007102-45 = "...Хм. Если купить солевые таблетки оптом, каждая обойдётся гораздо дешевле."
1007102-46 = "Спасибо, Сенсей. С вашей помощью мне удалось прилично сэкономить."
1007102-47 = "[s] «Не стоит.»"
1007102-48 = "У большинства из нас пока очень мало жизненного опыта, а недостаток опыта может дорого обходиться."
1007102-49 = "Я рада, что в таких ситуациях рядом есть взрослый вроде вас."
1007102-50 = "Теперь последнее, что осталось в списке..."
1007102-51 = ""
1007102-53 = ""
1007102-54 = "Эм... Здесь...?"
1007102-55 = "[s] «Это отдел купальников.»"
1007102-56 = "Здесь столько разных видов..."
1007102-57 = "Мне действительно нужен новый купальник, чтобы быть готовой к любым десантным операциям с воды."
1007102-58 = "Мы так поспешно покинули академию, что я не успела взять стандартный купальник..."
1007102-59 = "Так, посмотрим..."
1007102-60 = ""
1007102-62 = ""
1007102-63 = ""
1007102-64 = ""
1007102-65 = ""
1007102-66 = ""
1007102-67 = "Это... а... мило..."
1007102-68 = "[s] «Тебе нравится этот?»"
1007102-69 = ""
1007102-71 = ""
1007102-72 = "Да... Э-э, н-нет!"
1007102-73 = "Ну... Я имею в виду..."
1007102-74 = ""
1007102-76 = ""
1007102-77 = "Да. Он определённо достаточно милый."
1007102-78 = "Но для боевой операции он едва ли практичен, верно?"
1007102-79 = "Эти оборки могут мешать двигаться, и мне совершенно некуда убрать снаряжение..."
1007102-80 = "Гораздо полезнее будет вот этот купальник. Он не очень красивый, зато материал прочный и есть карманы."
1007102-81 = "[s7] «Но он не слишком заметный?»\n[s8] «Милый купальник поможет тебе затеряться среди туристов на пляже.»"
1007102-84 = "В-Вы правы, это хороший аргумент..."
1007102-85 = "Но я командир подразделения специального назначения, и без определённого снаряжения мне нельзя."
1007102-86 = "Нужны рации для связи с отрядом, запасные боеприпасы, аптечка..."
1007102-87 = "Как бы сильно я ни сокращала комплект, мне всё равно нужно где-то его хранить."
1007102-88 = "В этом смысле я просто не могу выбрать купальник лишь потому, что он милый..."
1007102-89 = "[ns] «Если проблема только в этом, я понесу твоё снаряжение.»"
1007102-90 = "Это очень мило с вашей стороны, но в полевых условиях всё снаряжение должно всегда быть у меня под рукой."
1007102-91 = "Я не могу каждый раз бегать искать вас, когда мне что-нибудь понадобится, поэтому—"
1007102-92 = "[ns] «Не переживай!»"
1007102-93 = ""
1007102-95 = ""
1007102-96 = "[ns] «На задании я всегда буду рядом с тобой.»"
1007102-97 = ""
1007102-99 = ""
1007102-100 = ""
1007102-101 = ""
1007102-102 = ""
1007102-103 = "...Хорошо!"
1007102-105 = "После этого мы с Мияко купили милый купальник и вернулись в парк Коусаги."
