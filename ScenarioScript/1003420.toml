[translation]
1003420-1 = "Искренность настоящей леди"
1003420-2 = ""
1003420-3 = "Добро пожаловать, Сенсей!"
1003420-4 = "Спасибо, что пришли! Я хотела показать вам результаты своих последних тренировок."
1003420-5 = "Если позволите, не могли бы вы пройти со мной на кухню?"
1003420-6 = "Кухня Клуба внутренней дисциплины"
1003420-7 = "Это кухня Клуба внутренней дисциплины."
1003420-8 = "Здесь тренируются готовить, готовят еду, закаляют разум и тело и делают много... других... вещей?"
1003420-10 = ""
1003420-11 = ""
1003420-12 = ""
1003420-14 = ""
1003420-16 = ""
1003420-17 = ""
1003420-19 = ""
1003420-21 = ""
1003420-23 = "Почему на кухне такой бардак?!"
1003420-24 = "Ах! Эм... П-Привет, Мимори! Ну... прошлой ночью Моурё немного праздновали здесь на кухне..."
1003420-25 = "Так что, боюсь, кухня закрыта, пока мы всё не уберём. Придётся прийти завтра."
1003420-26 = "..."
1003420-27 = "Боюсь, я не могу так поступить."
1003420-29 = ""
1003420-30 = ""
1003420-31 = ""
1003420-33 = ""
1003420-35 = ""
1003420-36 = ""
1003420-38 = ""
1003420-40 = ""
1003420-42 = ""
1003420-44 = "Мимори?!"
1003420-45 = "Здесь нужно лишь хорошенько засучить рукава и поработать!"
1003420-46 = "[s] «Если так, я с удовольствием помогу.»"
1003420-47 = "Что?! Вы будете убирать, Сенсей?!"
1003420-48 = "Я категорически не могу это позволить! Пожалуйста, позвольте мне самой заняться уборкой! Эта кухня — ответственность Клуба внутренней дисциплины!"
1003420-49 = "Настоящая леди сумела бы предугадать празднование Моурё и состояние кухни ещё до прибытия Сенсея!"
1003420-50 = "И зная это, настоящая леди явилась бы на место преступления ранним утром и заставила всё сиять к вашему визиту!"
1003420-51 = "[s] «Ты слишком многого от себя требуешь!»"
1003420-52 = "Но... но..."
1003420-53 = "Этот беспорядок возник из-за моего бездействия..."
1003420-54 = "Как я могу просить вас, моего гостя, помогать исправлять мою ошибку..."
1003420-55 = "[s1] «Не нужно так всё усложнять, Мимори.»\n[s2] «Настоящая леди знает и когда принять помощь.»"
1003420-58 = "..."
1003420-59 = "Если вы настаиваете, Сенсей, тогда... я приму вашу помощь."
1003420-60 = "Спасибо, что помогаете, Сенсей."
1003420-61 = "Т-Тогда! Я должна соответствовать вашей самоотдаче!"
1003420-62 = "Я, Мизуха Мимори, вице-президент Клуба внутренней дисциплины..."
1003420-63 = "Вложу в это сердце и душу! Мимори в серьёзном режиме!"
1003420-64 = "[s] «Хотя обычно ты и так выглядишь вполне серьёзной!»"
1003420-65 = "Вы ещё не видели меня по-настоящему серьёзной! Я должна воплотить образ истинной леди всем своим существом!"
1003420-66 = "А значит, я должна использовать «это»."
1003420-67 = ""
1003420-69 = ""
1003420-73 = "[ns] «Это высокотехнологичный инструмент для уборки?!»"
1003420-74 = "Та-дам! Начнём!"
1003420-77 = "Мимори в серьёзном режиме(?) была поистине... невероятна. Её энергия и рвение граничили с пугающими."
1003420-79 = ""
1003420-83 = ""
1003420-84 = "Фух... Спасибо за усердную работу, Сенсей."
1003420-85 = "...Что? Всю работу сделала я? Хаха..."
1003420-86 = "Мы вложились поровну, Сенсей! К тому же вы были лишь помощником!"
1003420-87 = "Раз уж мы закончили, позвольте мне это снять."
1003420-88 = ""
1003420-90 = ""
1003420-92 = "...М-Мне не снимать? Ч-Что значит, вы думаете, что это «мило»?"
1003420-93 = "Так шутить неприлично, Сенсей!"
1003420-94 = "О... Вы не шутите...?"
1003420-95 = "..."
1003420-96 = "В-Вы наверняка устали! Давайте немного отдохнём?"
1003420-97 = ""
1003420-99 = "Подождите здесь, пожалуйста. Я принесу чай."
1003420-100 = ""
1003420-102 = ""
1003420-105 = ""
1003420-107 = ""
1003420-108 = ""
1003420-110 = ""
1003420-112 = "Надеюсь, вам понравится напиток, Сенсей. Я также принесла к нему вагаси."
1003420-113 = "Вообще-то именно из-за этих вагаси я вас и пригласила. Я очень усердно работала над рецептом."
1003420-114 = ""
1003420-120 = "Ну как? Вам нравится вкус?"
1003420-121 = "[s] «Невероятно! И пахнет так приятно!»"
1003420-122 = "Какое облегчение! Я рада это слышать."
1003420-123 = "Что? Мой... фартук?"
1003420-124 = "..."
1003420-125 = "Вообще-то это было в тот день, когда я решила стать настоящей леди. Меня вдохновила манга, которую я читала, и я пошла и купила его."
1003420-126 = "Теперь он немного старый, но всё ещё прекрасно выполняет свою работу."
1003420-127 = "[s] «И он до сих пор в отличном состоянии!»"
1003420-128 = "Хи-хи. Рада, что так кажется, но если присмотреться, можно увидеть все заплатки и потрёпанные края, которые я чинила."
1003420-129 = "Но для меня... для меня он всё ещё идеален."
1003420-130 = "Не могу толком объяснить, но когда я его надеваю, мне становится спокойнее."
1003420-131 = "Уборка, готовка, стирка, шитьё, чтение мыслей... Его возможности безграничны."
1003420-132 = "[s] «...Прости, ты сказала „чтение мыслей“?»"
1003420-133 = "Ах! Р-Разве?"
1003420-134 = "Наверное, вы ослышались! Или я оговорилась!"
1003420-136 = "Я продолжал приставать к Мимори с вопросами о чтении мыслей, но она слишком ловко меняла тему."
1003420-137 = ""
1003420-138 = "Кхм! В любом случае я купила этот фартук много лет назад и тогда даже подворачивала его, потому что он был слишком большим!"
1003420-139 = "В тот день я дала себе обещание. Я поклялась, что стану настоящей леди к тому времени, когда этот фартук будет мне впору."
1003420-140 = "Немного неловко произносить это вслух."
1003420-141 = "[s] «Это замечательное стремление. Не смущайся.»"
1003420-142 = "...Вы правда так думаете?"
1003420-143 = "Видите ли, тогда я всем сердцем верила, что с правильным настроем и усердием смогу добиться чего угодно."
1003420-144 = "И вот я уже достаточно выросла, чтобы этот фартук идеально мне подходил."
1003420-145 = "Но стала ли я той настоящей леди, которой надеялась стать к этому времени? Гордилась бы маленькая Мимори нынешней мной?"
1003420-147 = "Я уже открыл рот, чтобы заверить Мимори, что главное — она старается изо всех сил..."
1003420-148 = "Ну же, Сенсей. Вы ведь не собирались сказать, что главное — я стараюсь изо всех сил, правда?"
1003420-149 = "[s] «К-Как ты узнала?!»"
1003420-150 = "Хи-хи... Это же прямо из вашего типичного набора фраз, Сенсей! Но я всё равно ценю это."
1003420-151 = "[s3] «Неужели это сила фартука?!»\n[s4] «Фартук и правда даёт тебе способность читать мысли!»"
1003420-154 = "А-А?! Я ничего такого не говорила!"
1003420-155 = ""
1003420-158 = "Не подмигивайте мне, Сенсей! У меня нет никаких тайных сил чтения мыслей!"
1003420-159 = "Сенсей? Сенсей?!"
1003420-161 = "После этого крайне смущённая Мимори пыталась всё объяснить, пока мы допивали чай и доедали вагаси."
