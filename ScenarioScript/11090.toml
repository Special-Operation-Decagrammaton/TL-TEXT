[translation]
11090-2 = "Episódio 9;Batalha Sangrenta dos Ingratos"
11090-3 = "Então, tomem cuidado!"
11090-4 = "Espero que o trabalho dê super certo!"
11090-5 = "Ahaha! Pode deixar! E boa sorte na reconstrução da escola de vocês também! Vou ficar na torcida!"
11090-6 = "Tchau!"
11090-9 = "Ufa... Eram pessoas tão legais, né?"
11090-10 = "..."
11090-11 = "..."
11090-12 = "Presidente.#n...Reparou nos uniformes daquelas garotas?"
11090-13 = "Hã? Uniformes? O que tem eles?"
11090-14 = "Elas são de Abydos."
11090-16 = "O-O-O-O QUÊÊÊÊÊÊ?!?!"
11090-18 = "Ahahahaha, essa sua reação foi hilária!"
11090-19 = "Ai, ai... Você realmente não tinha percebido nada..."
11090-20 = "Hã? E-Então elas são o nosso alvo, né? Q-Quer que eu vá lá dar um fim nelas?!"
11090-21 = "Ahahaha, calma, já foram embora.#nDe qualquer forma vamos atacar daqui a pouquinho, então você pode tocar o terror nessa hora, Haruka-chan."
11090-22 = "N-Não pode ser... Aquelas garotas? De Abydos...#nU-Uuh... Que ironia cruel do destino..."
11090-23 = "O que você tá fazendo, Aru-chan? Vamos trabalhar, né?"
11090-24 = "O pessoal temporário está esperando a ordem."
11090-25 = "Sério mesmo...? Eu vou mesmo ter que... atacar aquelas garotas...?"
11090-26 = "Ahaha, essa situação é meio pesada pra Aru-chan de coração mole, né~?"
11090-27 = "\"Sem piedade\" e \"Fazemos qualquer coisa por dinheiro\" é o nosso lema, não é?#nPor que está hesitando agora?"
11090-28 = "É-É verdade, mas..."
11090-29 = "(Nossa, ela tá completamente abalada...)"
11090-30 = "A-Assim não dá, Aru! Como presidente de uma empresa, você não pode ficar assim!"
11090-32 = "Vamos! Reúnam os temporários!"
11090-38 = "Qual é~, demoraram pra caramba."
11090-39 = "Tive um pequeno imprevisto. Estão prontas, certo?"
11090-40 = "Claro. Tanto faz, só nada de hora extra, viu? Já pechincharam até o nosso valor por hora."
11090-41 = "Deixem os detalhes de lado por enquanto!#nVamos lá! Hora de invadir Abydos!"
11090-43 = "Partiu~!"
11090-44 = "Ai, ai..."
11090-45 = "Aru-sama! E-Eu vou dar o meu melhor!"
11090-47 = "Vou esmagar todas elas, sem deixar sobrar nenhuma!"
11090-49 = "Detectei uma grande força armada a cerca de 15 km ao sul do colégio!"
11090-50 = "Será que é a Gangue dos Capacetes?"
11090-51 = "N-Não! Não é a Gangue dos Capacetes!"
11090-52 = "...São mercenárias! Provavelmente mercenárias contratadas por diária!"
11090-53 = "Nossa, mercenárias, é? Isso deve sair bem caro."
11090-54 = "É perigoso deixá-las chegar mais perto!#nSensei, dê a ordem de mobilização!"
11090-55 = "[s]\"Avançar!\""
11090-57 = "Identifiquei o grupo que está liderando as mercenárias logo à frente!"
11090-58 = "Ué... São as garotas da casa de lámen...?"
11090-59 = "G-Ghh..."
11090-60 = "Olha só quem é, eram vocês!!#nEu até dei porção extragrande de lámen de graça, suas ingratas!!"
11090-61 = "Ahahaha, valeu por aquilo. Mas uma coisa é uma coisa, outra coisa é outra coisa. A gente também tá trabalhando."
11090-62 = "É uma pena, mas precisamos separar o pessoal do profissional. Trabalho aceito é trabalho cumprido."
11090-63 = "...Entendi. Então esse tal trabalho de vocês era ser uma agência de faz-tudo."
11090-65 = "Francamente! Se são estudantes, existem tantos trabalhos de meio período mais decentes por aí! E vocês foram virar faz-tudo?!"
11090-66 = "E-Ei, não é um bico de meio período! É um negócio de verdade! A gente tem até cargos oficiais!"
11090-67 = "Eu sou a presidente!"
11090-68 = "Aquela ali é a chefe de seção,"
11090-69 = "e esta aqui é a gerente..."
11090-70 = "Ai, ai... Presidente. Falar isso desse jeito aqui só faz parecer ainda mais amador..."
11090-73 = "Quem mandou vocês? ...Não, é claro que não vão responder."
11090-74 = "(Clac) Só nos resta fazer vocês falarem à força."
11090-75 = "Fufufu, isso é segredo comercial, é claro."
11090-76 = "Todas as unidades! Atacar!"
