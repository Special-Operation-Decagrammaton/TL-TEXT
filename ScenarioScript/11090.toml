[translation]
11090-2 = "Эпизод 9;Неумолимая кровная вражда"
11090-3 = "Осторожнее по дороге домой!"
11090-4 = "Удачи с вашим делом!"
11090-5 = "Ха-ха! И вам удачи! Пусть получится возродить вашу школу.#nБуду за вас болеть!"
11090-6 = "Пока-пока!"
11090-9 = "Хех... Хорошие девчонки, правда?"
11090-10 = "..."
11090-11 = "..."
11090-12 = "Ару. Тебе их форма ничего не напомнила?"
11090-13 = "А? Нет. А должна была?"
11090-14 = "Это были студенты Абидоса."
11090-15 = ""
11090-16 = "Что ты сказала?!"
11090-18 = "Ха-ха-ха! Видела бы ты своё лицо."
11090-19 = "Ты правда не поняла?"
11090-20 = "Н-но разве это не наши цели? М-может, мне вернуться и прикончить их?"
11090-21 = "Ха-ха. Поздновато уже. Мы всё равно скоро на них нападём,#nтак что прибереги силы до тех пор, Харука."
11090-22 = "В-вы серьёзно... Это они из Абидоса? Угх. Ах...#nПочему судьба так жестока?"
11090-23 = "Что с тобой, Ару? Разве нам не пора за работу?"
11090-24 = "Наёмники ждут указаний."
11090-25 = "А обязательно...? Нам правда нужно уничтожать их прямо сейчас?"
11090-26 = "Похоже, наша милая Ару разрывается изнутри."
11090-27 = "А как же «Ваши деньги — наши преступления»? Решалы 68 не позволяют эмоциям мешать работе, так что случилось?"
11090-28 = "Я-я знаю, но..."
11090-29 = "(Она действительно сейчас в смятении.)"
11090-30 = "Нужно взять себя в руки! Что я за руководитель, если не могу выполнить такую простую работу?"
11090-31 = ""
11090-32 = "Делаем! Собирайте наёмников!"
11090-34 = ""
11090-35 = ""
11090-36 = ""
11090-37 = ""
11090-38 = "Эй. Чего так долго?"
11090-39 = "Занимались делами. Надеюсь, вы все готовы?"
11090-40 = "Как скажешь. Только помни: мы заканчиваем ровно по часам.#nОсобенно учитывая, как ты пожадничала с оплатой."
11090-41 = "Мелкий шрифт обсудим потом. Выдвигаемся! Пора атаковать Абидос!"
11090-42 = ""
11090-43 = "Вперёд!"
11090-44 = "*вздыхает*"
11090-45 = "Я-я вас не подведу, Ару!"
11090-46 = ""
11090-47 = "Разотрём их в пыль!"
11090-49 = "Я засекла крупную вооружённую группу в 15 километрах к югу от школы!"
11090-50 = "Что? Опять Банда шлемов?"
11090-51 = "Н-нет! Это не они."
11090-52 = "Похожи на наёмников! Кто-то явно нанял их для нападения!"
11090-53 = "Что, скупили их оптом в «Магазине головорезов» на рассвете?#nНанять столько людей наверняка стоило целое состояние."
11090-54 = "Нельзя подпускать их ближе! Сенсей, отдайте приказ выдвигаться!"
11090-55 = "[s] «Шоу начинается»."
11090-57 = "Вижу впереди отряд, который ведёт этих головорезов!"
11090-58 = "Погодите. Это разве не те девушки, которых мы встретили в рамэн-баре?"
11090-59 = "У-угх..."
11090-60 = "Так это ВЫ на нас нападаете?! После того как я навалила вам дополнительного рамэна?! Неблагодарные засранки!"
11090-61 = "Хи-хи! Я правда очень это оценила, но это неважно.#nБизнес есть бизнес, ничего личного."
11090-62 = "Согласна. Очень жаль, но бизнес есть бизнес. Мы должны выполнить контракт."
11090-63 = "Так вы, значит, решалы."
11090-65 = "Что это вообще за работа для девочек вашего возраста?! Не могли найти обычную подработку?"
11090-66 = "Это не подработка! Это настоящий уважаемый бизнес!#nУ нас даже должности есть и всё такое!"
11090-67 = "А я босс!"
11090-68 = "Она начальник штаба."
11090-69 = "А вот она — начальник отдела."
11090-70 = "Прошу. Звучит куда внушительнее, чем есть на самом деле."
11090-71 = ""
11090-73 = "Так кто вас нанял? Нет... Зачем я вообще спрашиваю?"
11090-74 = "Всегда можно выбить ответ силой."
11090-75 = "Ха-ха. Удачи. Коммерческие тайны мы не выдаём."
11090-76 = "Взять их, девочки!"
