[translation]
80000067-1 = "Если тебя это задевает — ты уже проиграл"
80000067-2 = "Нэру написала мне и попросила встретиться в Миллениум."
80000067-3 = "Сенсей, сюда!"
80000067-4 = "[s1] «Нэру?»\n[s2] Посмотреть в сторону её голоса."
80000067-8 = "Сенсей! Ты, как всегда, неприлично рано."
80000067-9 = "Что мне было нужно? Ну... это гораздо неловче, чем я думала."
80000067-10 = "Только не жди ничего особенного, ясно?#nНичего такого."
80000067-11 = "Я позвала тебя из-за этой дурацкой штуки."
80000067-12 = ""
80000067-14 = ""
80000067-15 = "Хотя вообще-то она крутая. Я сама её выбрала."
80000067-16 = "Вот! Смотри!"
80000067-17 = ""
80000067-19 = ""
80000067-21 = "[ns3] «Ух ты...! Что это?»\n[ns4] «Выглядит потрясающе.»"
80000067-22 = "Ахаха! Удивлён? Ну как?!"
80000067-23 = "Ахаха! Удивлён? Ну как?!"
80000067-24 = "Круто, да? Я её целую вечность искала! Всё было скучным и обычным, я уже почти отчаялась."
80000067-25 = "А? Почему я это тебе дарю?"
80000067-26 = "Ахаха! Ты что, тупой? Сегодня День святого Валентина, Сенсей!"
80000067-27 = "Наверное, ты слишком занят, да? Не парься. Всё нормально."
80000067-28 = "А? Хочешь узнать больше про такой шоколад?"
80000067-29 = "Почему? Он слишком скучный? Слишком маленький?"
80000067-30 = "Может, стоило взять тот, что был В ФОРМЕ дракона..."
80000067-31 = "А?"
80000067-32 = "Знаю ли я, зачем вообще нужен День святого Валентина?"
80000067-33 = "Ну, это просто день, когда дарят людям шоколад, разве нет?"
80000067-34 = "[s5] «Неважно. Не беспокойся.»\n[s6] «Полагаю, главное, что это выглядит довольно круто.»"
80000067-35 = "Ахаха! Ты такой странный, Сенсей."
80000067-36 = "Ахаха! Ты такой странный, Сенсей."
80000067-37 = "Ладно. Теперь попробуй."
80000067-38 = "Но я тоже хочу. Мне всё время было интересно, какой он на вкус, так что делись!"
80000067-39 = "[s7] «Но это шоколад ко Дню святого Валентина...»\n[s8] «Ты собираешься съесть мой подарок?»"
80000067-40 = "Ага. И что?"
80000067-41 = "Ага. И что?"
80000067-42 = "Не жадничай! Всё равно я за него платила!"
80000067-43 = ""
80000067-45 = ""
80000067-46 = "Давай! Иди сюда, садись. Будем есть!"
80000067-47 = "[s] «...»"
80000067-49 = "Я сел рядом с ней, и мы поделили мой шоколад."
80000067-50 = "Несмотря на необычный дизайн и повод, это оказался самый обычный шоколад."
