[translation]
1006705-1 = "Место для отдыха"
1006705-2 = "Гостиная Шале"
1006705-5 = "Сообщение Токи выглядело серьёзно, и я не находил себе места."
1006705-6 = "Каждый раз, когда я решал сдаться и лечь спать..."
1006705-8 = "Говорит позывной Zero-Four. Моё местоположение..."
1006705-10 = "[ns] «Токи?!»"
1006705-11 = "Сигнал Токи постоянно пропадал и появлялся снова."
1006705-12 = ""
1006705-16 = "Позывной Zero-Four вызывает. Приём? Ваше местоположение..."
1006705-17 = "Снова и снова, с перебоями..."
1006705-18 = ""
1006705-22 = "...Подтверждаю. Каков ваш приказ?"
1006705-23 = "И наконец..."
1006705-24 = ""
1006705-28 = "Соединение установлено."
1006705-29 = "Эм, Сенсей? Как вы...?"
1006705-30 = "[s] «Токи! Ты в порядке?»"
1006705-31 = ""
1006705-32 = "Конечно, я..."
1006705-33 = ""
1006705-35 = ""
1006705-37 = "[ns] «Опять отключилось...»"
1006705-40 = "Миссия завершена. Отличная работа, все..."
1006705-42 = "Я несколько раз звонил Токи, но каждый раз попадал на голосовую почту."
1006705-43 = "Всю ночь я то засыпал, то просыпался, продолжая пытаться дозвониться ей, пока наконец не уснул окончательно."
1006705-45 = ""
1006705-48 = "Я проснулся от щебетания птиц."
1006705-49 = "Спросонья я рассеянно протянул руку..."
1006705-50 = ""
1006705-58 = "И почувствовал рядом чьё-то тепло."
1006705-61 = "― Хм...? Сенсей...?[wa:1880]"
1006705-64 = "― Что такое...?[wa:620]"
1006705-66 = "― Почему у вас такое лицо...?[wa:1740]"
1006705-69 = "[ns] «Т-Токи!!???»"
1006705-70 = "― Если всё в порядке,[wa:1640]"
1006705-72 = "― я ещё немного посплю...[wa:160]"
1006705-75 = "― А? Вы всё ещё пытаетесь меня разбудить?[wa:5020]"
1006705-77 = "― ...Нет, спасибо. Я снова спать.[wa:2800]"
1006705-80 = "― К тому же эта кровать[wa:2220]"
1006705-82 = "― такая тёплая и мягкая... Мне нравится...[wa:3540]"
1006705-85 = "― Так что... говорите что хотите, Сенсей... Я... спать...[wa:3100]"
1006705-87 = "― Так... хочется спать...[wa:3240]"
1006705-91 = "Несмотря на мои протесты, Токи быстро заснула."
1006705-92 = "Она проспала далеко за полдень..."
1006705-94 = ""
1006705-96 = ""
1006705-97 = "..."
1006705-98 = "[s] «Можно спросить, почему ты спала здесь?»"
1006705-99 = "Вы спрашиваете очевидное. Потому что здесь была кровать."
1006705-100 = "[s] «Потому что она здесь была» — в данном случае не ответ!"
1006705-101 = "Если подробнее, я возвращалась с задания поздно ночью."
1006705-102 = "В офисе Шале горел свет, поэтому я забеспокоилась."
1006705-103 = "[s] «Эм... К тому времени двери уже должны были быть заперты?»"
1006705-104 = "Сенсей, я член C&C."
1006705-105 = "[s] «...Хорошо.»"
1006705-106 = "В любом случае, я пришла в офис и увидела, что вы спите при включённом свете, а вокруг полный беспорядок."
1006705-108 = ""
1006705-112 = ""
1006705-113 = ""
1006705-115 = ""
1006705-116 = ""
1006705-118 = ""
1006705-120 = ""
1006705-121 = ""
1006705-124 = ""
1006705-125 = "Как лучшему агенту и идеальной горничной, мне оставалось только заправить для вас кровать."
1006705-126 = "Но после этого мне стало ужасно хотеться спать. Было поздно, да и миссия оказалась непростой."
1006705-127 = "Совершенно естественно, что меня клонило в сон."
1006705-128 = "А рядом стояла кровать — такая идеальная и манящая..."
1006705-129 = "Что я могла поделать?"
1006705-130 = "[s] «И поэтому ты уснула здесь?»"
1006705-131 = "Да."
1006705-132 = "К тому же спать здесь было очень удобно. Должна выразить своё одобрение."
1006705-133 = "[s1] «Ну, спасибо... Но всё же!»\n[s2] «Нельзя просто так спать в чужой кровати...»"
1006705-136 = "Ещё раз: я уснула только потому, что хотела спать."
1006705-137 = "[s] «Тогда ты будешь спать в кровати любого человека, как только захочешь спать?»"
1006705-138 = "...!"
1006705-139 = ""
1006705-141 = ""
1006705-142 = "Дайте мне секунду подумать, Сенсей."
1006705-143 = "[s] «А? Эм, ладно...»"
1006705-149 = "Токи долго молчала."
1006705-150 = "...И как раз когда я уже собирался сказать, что вопрос вовсе не был настолько серьёзным..."
1006705-151 = "Я... не хочу. Но не знаю."
1006705-152 = "[s] «Что ты имеешь в виду...?»"
1006705-153 = "Сколько бы я ни думала, мне не кажется, что я стала бы спать в чужих кроватях."
1006705-154 = "Но... я не знаю почему."
1006705-155 = "Сенсей, почему в вашей кровати можно, а в чужих — нельзя?"
1006705-156 = "[s] «Н-ну, я не знаю?»"
1006705-157 = "Значит, вы тоже не знаете."
1006705-158 = "Ну, ничего страшного. Тогда не будем об этом думать."
1006705-159 = "[s] «Ты так быстро сдалась?!»"
1006705-160 = "Я не хочу тратить слишком много времени на вопрос, который не обязательно решать. Это неэффективно."
1006705-161 = "И сейчас у меня есть гораздо более серьёзная проблема."
1006705-162 = "[s] «...Какая?»"
1006705-163 = "Очень важная и серьёзная проблема."
1006705-164 = "Мне скучно."
1006705-165 = "[ns] «Ты сказала „важная и серьёзная“!? Простите?!»"
1006705-166 = "Вы не понимаете. Это важный вопрос."
1006705-167 = "Человек может умереть от скуки. И морально, и физически."
1006705-168 = "Поэтому на вас лежит ответственность помочь умирающей у вас на глазах студенте."
1006705-169 = "Так что, пожалуйста, поиграйте со мной. Это важный вопрос."
1006705-170 = "[s] «Ты серьёзно?»"
1006705-171 = ""
1006705-173 = ""
1006705-175 = ""
1006705-176 = "Я всегда серьёзна."
1006705-178 = "На мгновение уверенная логика Токи лишила меня дара речи..."
1006705-179 = "Но как бы то ни было, остаток дня я с удовольствием провёл вместе с Токи."
