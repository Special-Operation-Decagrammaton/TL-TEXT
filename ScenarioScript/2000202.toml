[translation]
2000202-1 = "Добро пожаловать в лабораторию Саи!"
2000202-2 = "Коридор перед лабораторией Саи"
2000202-4 = "[ns] Постучать в дверь."
2000202-6 = "Угх... Всё, с меня хватит!"
2000202-8 = "Да плевать уже! Мы больше этого не делаем! Мы тебе не подопытные крысы!"
2000202-9 = "Вот именно! В своих экспериментах больше на нас не рассчитывай!"
2000202-10 = "Давайте все успокоимся... Я уверена, следующий эксперимент точно будет успешным."
2000202-11 = "Ты всегда так говоришь!"
2000202-12 = "Я использовала твой «непроницаемый эликсир», который якобы защищает от любого яда, и теперь у меня кожа жабы!"
2000202-13 = "А я выпила твой «неразрушимый эликсир», который якобы позволяет остановить меч голыми руками. Посмотри на меня! У меня кожа будто из камня!"
2000202-14 = "Так значит, он сработал! Я сказала, что сможешь остановить меч голыми руками — теперь можешь."
2000202-15 = "Ты ничего не говорила о том, что я буду выглядеть как монстр!"
2000202-16 = "Вот именно! Всё, больше никаких твоих лекарств, шарлатанка!"
2000202-17 = "П-Погодите! У меня ещё есть эликсир бессмертия—"
2000202-18 = ""
2000202-19 = "Чёрт... Убежали."
2000202-20 = ""
2000202-21 = "О, Сенсей. Вот ты где. Я тебя ждала."
2000202-22 = "[s] Сбежать."
2000202-23 = "Стой! Куда это ты убегаешь?"
2000202-24 = "Эликсиры, о которых говорили мои ассистенты? Хахаха! Не бойся. Эликсир, который я сделала на этот раз, совсем другой. Он точно сработает!"
2000202-25 = "Готов испытать его, Сенсей?"
2000202-26 = "[s] Сбежать."
2000202-27 = "Я сказала, не убегай!"
2000202-28 = "Почему не попросить других студентов? Ни за что. Для этого исследования нужен именно ТЫ!"
2000202-29 = "Этот эликсир возвращает молодость, поэтому на студентах его испытывать бессмысленно. Они и так молодые! Мне нужен взрослый для контрольной группы!"
2000202-30 = "Ну же, Сенсей. Даю слово, ты выживешь, так что... пойдём в лабораторию!"
2000202-32 = "Лаборатория Саи"
2000202-34 = "Добро пожаловать в мою лабораторию, Сенсей!"
2000202-35 = "Советую не трогать образцы вон там. Они всё ещё живые."
2000202-36 = "[s] Спросить, какие исследования она здесь проводит."
2000202-37 = "Ты разве не слушал? Эликсир бессмертия, конечно."
2000202-38 = "Конечно, по пути я случайно создала ещё несколько эликсиров... но конечная цель Общества восточной алхимии — разработать эликсир, дарующий бессмертие. Хахаха!"
2000202-39 = "[s] Спросить, что общество собирается делать с эликсиром бессмертия."
2000202-40 = "Разве не очевидно? Если я никогда не состарюсь, то смогу вечно оставаться студентом и проводить любые исследования..."
2000202-41 = "[s] «Да, и...?»"
2000202-42 = "И люди будут уважать меня, хвалить и обожать..."
2000202-43 = "[s] «...и?»"
2000202-44 = "Эм... и... Угх! Какой ты надоедливый! Не можешь просто спокойно сидеть и слушать?"
2000202-45 = ""
2000202-46 = ""
2000202-47 = "Сая протягивает мне подозрительную колбу."
2000202-48 = "У тебя в руках мой новейший образец эликсира бессмертия. Наверняка чувствуешь себя моложе уже от одного взгляда."
2000202-49 = "[s1] «...»\n[s2] «...Это ДЕЙСТВИТЕЛЬНО дарует бессмертие?»"
2000202-50 = "Что, сомневаешься во мне? Я бы никогда тебе не соврала!"
2000202-51 = "Что, сомневаешься во мне? Я бы никогда тебе не соврала!"
2000202-52 = "Один глоток — и почувствуешь, как в тебе бурлит энергия, будто ты снова ученик!"
2000202-53 = "[s] Выпить эликсир."
2000202-54 = ""
2000202-55 = ""
2000202-57 = "Ну как? Как ощущения? Помолодел?"
2000202-58 = "[s] «Мои руки...»"
2000202-59 = "Руки?"
2000202-60 = "[s] «Мои руки сияют! Они превращаются в золото!»"
2000202-61 = "Хахаха! Я знала! Я знала, что сочетание всех этих алхимических формул сработает. Наконец-то!"
2000202-62 = "Почему ты так на меня смотришь? Если всё тело станет золотым, значит, ты никогда не состаришься! А значит — бессмертен!"
2000202-63 = "Я гений! Хахаха!"
2000202-64 = "[s] Потребовать вернуть всё как было."
2000202-65 = "Что? Тебе не нравится бессмертное тело? Ну, наверное, вечная жизнь подходит не всем..."
2000202-66 = "Не волнуйся. Этот эликсир — всего лишь прототип. К завтрашнему дню эффект пройдёт."
2000202-67 = "А пока советую насладиться золотой кожей. Хахаха!"
