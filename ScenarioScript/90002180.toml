[translation]
90002180-1 = "Эпизод 18;История для тебя"
90002180-3 = "[ns] «Все...?»"
90002180-6 = "..."
90002180-9 = "..."
90002180-10 = "..."
90002180-12 = "[ns] «...!»"
90002180-13 = "Чёрт..."
90002180-14 = "Чёрт, чёрт, ЧЁРТ...!"
90002180-15 = "Что? Я могу двигаться?"
90002180-16 = "..."
90002180-17 = "Нет! Не могу! Но я не перестану пытаться, чёрт возьми! Эта...! Эта мерзость...!!!"
90002180-18 = "НЕЕЕЕЕТ!!!"
90002180-19 = ""
90002180-22 = "Как это произошло? Почему всё так...? ПОЧЕМУ, ЧЁРТ ВОЗЬМИ?!?!"
90002180-23 = ""
90002180-28 = "Мы и представить не могли, что окажемся настолько, абсолютно беспомощны."
90002180-29 = "Что нас уничтожат, а мы даже не сможем оставить на нём царапины."
90002180-30 = ""
90002180-33 = "...сэй? Сенсей? Вы там? Вы в порядке?! Мы#$^@$%–"
90002180-34 = ""
90002180-37 = "*&)%^&$@Ящик Шиттим, запущен процесс самовосстановления. Сенсей, пожалуйста, не%&#–"
90002180-38 = ""
90002180-43 = "Посреди того поля боя меня внезапно осенило."
90002180-44 = "Мы проиграем. Против этой штуки мы ничего не могли сделать."
90002180-46 = "И если это так..."
90002180-48 = "[ns] «...»"
90002180-50 = "[ns] Заставь себя подняться."
90002180-53 = "Сенсей...?"
90002180-54 = "Что вы вообще сейчас делаете...? Вы в худшем состоянии из всех нас! Ваше тело этого не выдержит! Хватит, перестаньте пытаться двигаться!"
90002180-55 = ""
90002180-67 = "...Я здесь, Сенсей."
90002180-68 = "Зачем ты тащишь своё избитое и израненное тело к моим ногам? На ногах, которые уже не слушаются, и с глазами, которые едва способны видеть?"
90002180-70 = "[ns] Выдави из себя ответ."
90002180-71 = "Ты хочешь, чтобы я... безопасно вернул твоих учеников в Кивотос?"
90002180-72 = "..."
90002180-73 = "Не будь глупцом. Возможность мимолётна."
90002180-74 = "Ты отказался стать моим оракулом — и вот результат твоего выбора."
90002180-75 = "..."
90002180-77 = "«И если всё так и закончится — значит, так тому и быть.»"
90002180-78 = "Разве не ты произнёс эти слова?"
90002180-79 = "Неужели ты больше не тот доблестный учитель, который так смело это заявил?"
90002180-80 = "[ns] Не отвечай."
90002180-82 = "[ns1] Встань на колени.\n[ns2] Прижмись к земле и умоляй."
90002180-85 = "Сенсей...?"
90002180-86 = ""
90002180-87 = "..."
90002180-88 = "Как непредсказуемая переменная ты заинтересовал меня. Поэтому я и хотел сделать тебя своим оракулом."
90002180-89 = "Но теперь я вижу тебя таким, какой ты есть. Ты мне больше не интересен."
90002180-90 = "Вы, люди, всегда были такими."
90002180-91 = "Вы возлагаете веру на непознаваемое будущее, полагая, что если достаточно надеяться, то всё как-нибудь «образуется.»"
90002180-92 = "Стоит неизбежности смерти постучаться в дверь, как люди начинают пятиться, молить и лгать в надежде выжить."
90002180-93 = "[ns3] Продолжай умолять.\n[ns4] Бейся лбом о землю."
90002180-94 = ""
90002180-95 = ""
90002180-97 = ""
90002180-98 = "Сенсей...?"
90002180-99 = "Хватит...! Перестаньте это делать!"
90002180-100 = "Я верил, что ты примешь своё уничтожение с достоинством."
90002180-101 = "Неужели твоё слово для тебя ничего не значит, как и для всех остальных?"
90002180-102 = "[s] «Значит.»"
90002180-103 = ""
90002180-106 = "[ns] «Только дети. Просто отпусти учеников домой.»"
90002180-107 = ""
90002180-108 = "...!"
90002180-109 = "..."
90002180-110 = "Понятно. Значит, именно гибель твоих драгоценных учеников ты не способен принять спокойно."
90002180-111 = "Ты готов разорвать связь с ними и отдать самого себя мне?"
90002180-112 = "..."
90002180-113 = "Даже сейчас я могу выбрать и даровать тебе быструю, милосердную смерть."
90002180-114 = "Но могу и не делать этого. Что тогда будешь делать ты?"
90002180-115 = "Что...?"
90002180-116 = "Ты утверждаешь, что жизнь драгоценна."
90002180-117 = "Ты заявляешь, что жизнь должна быть защищена превыше всего."
90002180-118 = "Однако есть судьбы хуже смерти."
90002180-119 = "Ибо в глубинах ада тебя могут ждать кошмары, созданные тобой самим."
90002180-120 = "Я могу оставить тебя в живых."
90002180-121 = "Хм. Может, мне захватить твоё тело? Заставить тебя собственными руками разбить нимб каждого до единого твоего ученика?"
90002180-122 = "Или я могу заставить тебя смотреть издалека, пока твой любимый мир тонет в бесконечной симфонии страданий."
90002180-123 = "Теперь понимаешь, Сенсей? Даже если такой будет твоя судьба, ты всё равно примешь её?"
90002180-124 = "[s] «Если ты этого хочешь.»"
90002180-125 = ""
90002180-128 = "[ns] «Во мне нет никакого достоинства. И я не стану притворяться иначе.»"
90002180-129 = "Сенсей...?"
90002180-130 = ""
90002180-131 = ""
90002180-133 = "[ns] «Поэтому, пожалуйста.»"
90002180-135 = "[ns] «Просто отпусти этих детей домой.»"
90002180-136 = ""
90002180-141 = "СЕНСЕЙ!!!"
90002180-142 = "ААХ! АРГХХХ!"
90002180-143 = "Если бы только...! Если бы я была хоть немного сильнее!!!"
90002180-144 = "Как печально, Сенсей. И..."
90002180-145 = "Как поистине постыдно."
90002180-147 = "Мысли всплывали в сознании, но так же быстро ускользали."
90002180-148 = "Ухватиться я смог лишь за одну."
90002180-149 = "Я не мог отпустить сожаление о том, что так и не сумею как следует поприветствовать тех троих детей в Кивотосе."
90002180-152 = "И тебя это устраивает?"
90002180-153 = "[ns] Кто ты?"
90002180-154 = ""
90002180-155 = "Эм, ну... Думаю, сейчас это не самое важное."
90002180-156 = "Знаешь, после увиденного мне очень нужно было кое-что понять."
90002180-157 = "Сенсей. Как вы можете быть таким?"
90002180-158 = "[ns] Ответь."
90002180-159 = "Потому что у вас есть то, что вам дорого?"
90002180-160 = "..."
90002180-161 = "Понятно. Ясно."
90002180-162 = "Но дороже собственной жизни? Я думала, люди всегда ставят выживание прежде всего."
90002180-163 = "[ns] Ответь."
90002180-164 = "Хорошо. Понятно. Обычно ведь так и есть, верно?"
90002180-165 = "Но одного выживания недостаточно? Это ещё не значит по-настоящему жить?"
90002180-166 = "А? Именно так люди... продолжали свой род всё это время?"
90002180-167 = "Тем, кто был им дороже всего и мог добиться большего, чем они сами..."
90002180-168 = "...они оставляли своё наследие?"
90002180-169 = "А оставшиеся продолжали нести их волю?"
90002180-171 = ""
90002180-172 = "Когда я услышала это впервые, всё звучало как полная чушь."
90002180-173 = "Очередное человеческое лицемерие. Или просто откровенная ложь."
90002180-174 = "Но..."
90002180-175 = "..."
90002180-176 = "Эй, Сенсей."
90002180-177 = "Ваши ученики важнее собственной жизни?"
90002180-178 = "[ns] Ответь."
90002180-179 = "...И поэтому, когда вы им нужны..."
90002180-180 = "...вы готовы отдать им всё, что у вас есть, все свои возможности и весь потенциал."
90002180-181 = "Вот... для чего нужны взрослые?"
90002180-182 = "Тогда разве вы так уж сильно отличаетесь от Цукацуки Рио?"
90002180-183 = "Дилемма вагонетки, кажется?"
90002180-184 = "Она отчаянно искала другой выход, пока в самом конце наконец не смогла попросить о помощи."
90002180-185 = "..."
90002180-186 = "Возможно, вы не заслуживали права так сурово критиковать Рио, Сенсей."
90002180-187 = "[ns] Ответь."
90002180-188 = "..."
90002180-189 = "Понятно."
90002180-190 = "Поэтому вы и не хотели давить на неё слишком сильно..."
90002180-192 = ""
90002180-193 = "Н-но даже если вам каким-то образом удастся отправить учеников обратно в Кивотос..."
90002180-194 = "Не думаю, что их судьба... в-в сущности изменится..."
90002180-195 = "Если Стальной континент снова начнёт расширяться, он поглотит Кивотос целиком."
90002180-196 = "Каждое движение и каждая мысль учеников будут доходить до Господина."
90002180-197 = "Им негде будет бежать и негде прятаться."
90002180-198 = "Г-Господин накажет их так, как сочтёт нужным."
90002180-199 = "У учеников всё же есть... преимущество в данных и информации."
90002180-200 = "Какое-то время они смогут сопротивляться. Думаю, они будут сражаться изо всех сил."
90002180-201 = "Н-но... мне кажется, конечный результат всё равно окажется примерно тем же."
90002180-202 = "[ns] Ответь."
90002180-203 = "Что? Я сказала «скорее всего»?"
90002180-204 = "И между «нулевым» и «ненулевым» шансом есть неизмеримая разница?"
90002180-205 = "Э-это правда... Но всё же..."
90002180-206 = "Даже если этим ученикам придётся провести остаток жизни, скрываясь от гнева нашего Господина и делая всё возможное, чтобы сопротивляться?"
90002180-207 = "Понятно. Даже тогда вы хотите, чтобы у них был шанс прожить свою жизнь."
90002180-209 = "[ns] «И не только у них.»"
90002180-211 = "[ns] «Я надеюсь, что и у вас тоже.»"
90002180-212 = ""
90002180-214 = "?!"
90002180-215 = "?!?!"
90002180-216 = "..."
90002180-217 = "Эм, насчёт ваших учеников это, наверное, и так очевидно..."
90002180-218 = ""
90002180-220 = ""
90002180-222 = "Но вы д-думаете... мы тоже... з-заслуживаем такого шанса...?"
90002180-223 = "[ns] «Конечно»."
90002180-225 = "[ns] «Долг взрослого — защищать детей.»"
90002180-226 = "!!!"
90002180-227 = "[ns] «Мне жаль.»"
90002180-229 = "Что? Так внезапно...? П-почему...?"
90002180-230 = "[s] «Что я не смог показать вам мир, в котором хотелось бы жить.»"
90002180-231 = "Ну... В этом виноваты не только вы, Сенсей."
90002180-232 = "[s5] «И всё же, даже если вы правы насчёт этого мира...»\n[s6] «Мне жаль, что я не смог показать вам хорошее в человечестве...»"
90002180-233 = ""
90002180-234 = ""
90002180-237 = "[ns] «Что не смог помочь вам раскрыть свой потенциал...»"
90002180-239 = "[ns] «И что не исполнил свой долг взрослого.»"
90002180-241 = "[ns] «Мне искренне жаль.»"
90002180-242 = "..."
90002180-243 = "Ага."
90002180-244 = "Значит, вот что вы чувствуете, Сенсей."
90002180-245 = ""
90002180-249 = "Я почувствовал прикосновение маленькой холодной руки к своей."
90002180-250 = ""
90002180-251 = "Поняла, Сенсей."
90002180-252 = "М-м. Кажется, теперь я наконец понимаю."
90002180-253 = "Спасибо, что думаете о нас так."
90002180-254 = "Теперь можете оставить всё нам, хорошо?"
90002180-255 = ""
90002180-257 = ""
90002180-258 = "Да. Просто оставьте всё нам."
90002180-259 = "Эм, спа...сибо."
90002180-260 = "Мы были вместе недолго, но я рада, что нам довелось провести это время вместе."
90002180-261 = ""
90002180-263 = ""
90002180-264 = ""
90002180-265 = "[ns] «...?»"
90002180-268 = "Им и правда уже ничем не помочь."
90002180-269 = "Будто мы этого не знали."
90002180-270 = "Э-хе-хе... В этом было что-то приятное."
90002180-271 = ""
90002180-273 = ""
90002180-274 = ""
90002180-276 = "Наверное."
90002180-277 = "Я всё ещё не понимаю, что такое счастье."
90002180-278 = "И, возможно, никогда не поймём."
90002180-279 = "Да. Где оно, существует ли вообще, что это такое... Способны ли мы тоже его почувствовать..."
90002180-280 = "..."
90002180-281 = "Но потом мне пришла ещё одна мысль."
90002180-282 = "Мир может быть трагедией, а эта жизнь — проклятием..."
90002180-283 = "Э-Это..."
90002180-284 = "Но я больше не собираюсь просто лежать и принимать это! Вот это я так не оставлю!"
90002180-285 = "Если рождение — трагедия, тогда счастье должно быть борьбой против неё."
90002180-286 = "...Ты просто повторяешь слова Сенсея."
90002180-287 = "Заткнись."
90002180-288 = "Н-но всё равно, это было здорово, Соф!"
90002180-289 = "И всё же. Именно это я поняла из слов Сенсея."
90002180-290 = "Если живёшь, нужно бороться изо всех сил."
90002180-291 = "Я не собираюсь заканчивать свою жизнь какой-нибудь дешёвой трагедией."
90002180-292 = "Теперь ты говоришь прямо как Кей."
90002180-293 = "...Да. Возможно."
90002180-294 = ""
90002180-296 = ""
90002180-297 = ""
90002180-298 = ""
90002180-299 = "Вы все... Вы вообще видели Сенсея?"
90002180-300 = "Н-нет! Хотя, вообще-то!"
90002180-301 = "...Мы, по сути, силой пробрались сюда."
90002180-302 = "И именно это натолкнуло меня на мысль."
90002180-303 = "На мысль?"
90002180-304 = "Кей, помнишь, как мы говорили с Сенсеем о жизни и грехе?"
90002180-305 = "О жизни...? С Тиферет?"
90002180-306 = "Я-я п-помню! Ор сказала что-то вроде... «Если жизнь — это страдание, тогда грех тоже должен быть частью этой жизни...»"
90002180-307 = "Да. Сказала. И именно поэтому мне только что пришла эта мысль."
90002180-308 = "Мы ведь тоже не полностью свободны от греха."
90002180-309 = "Да. Конечно нет. Ведь мы способны двигаться и говорить."
90002180-310 = "С-сила, которой движется это тело... должна была откуда-то взяться и иметь какое-то предназначение."
90002180-311 = "А. Потому что энергия не возникает из ничего."
90002180-312 = "Эм, значит ли это, что грех присущ всем живым существам...?"
90002180-313 = ""
90002180-315 = ""
90002180-316 = "...Возможно, можно прийти и к такому выводу."
90002180-317 = "Да. Наверное."
90002180-318 = "Но мне кажется, именно поэтому стремление стать лучше и имеет смысл."
90002180-319 = "Совершенства не существует, да и будь оно настоящим — было бы скучно. Если что-то целостно и завершено, оно уже никогда не сможет стать лучше."
90002180-320 = "Однажды проснёшься и увидишь, что тебя оставили позади."
90002180-321 = "Кей, что..."
90002180-323 = ""
90002180-325 = ""
90002180-326 = "Что мы делали?"
90002180-327 = "Кем... мы хотели стать...?"
90002180-329 = "..."
90002180-330 = "Хи-хи. Прости. На этот вопрос трудно ответить, правда?"
90002180-332 = ""
90002180-334 = ""
90002180-336 = "[log] «Ты очень, очень старалась.»[/log]"
90002180-339 = ""
90002180-341 = "[log]«Ты сделала всё возможное в плохой ситуации.»[/log]"
90002180-344 = "Раньше мы никогда не задумывались о подобных вещах."
90002180-345 = "А зачем? Ведь мы считали себя совершенными."
90002180-346 = "Как Соф и сказала раньше."
90002180-348 = ""
90002180-350 = "[log]«Было бы здорово находить красивые причины тому, почему случаются плохие вещи.»[/log]"
90002180-353 = "[log] «Если бы жить в этом мире было хоть немного не так тяжело.»[/log]"
90002180-356 = "[log]«Разве это не было бы... чудесно?»[/log]"
90002180-359 = "Эй, Кей. Что значит быть студентом?"
90002180-360 = "Студентом...? Ну..."
90002180-361 = "Для начала твоя единственная работа — постоянно учиться."
90002180-362 = "И узнавать больше о себе, чтобы завтра стать лучше, чем была вчера."
90002180-363 = "М-мне бы этого хотелось...!"
90002180-365 = "Хи-хи. Е-если бы только мы могли!"
90002180-367 = ""
90002180-369 = ""
90002180-371 = "[log]«Учитель ведь не может отказаться от своих учеников.»[/log]"
90002180-374 = ""
90002180-376 = "[log]«Все документы на перевод уже готовы, осталось только сказать слово.»[/log]"
90002180-379 = "Я вам кое-что расскажу. Раньше у нас был тайный разговор с Сенсеем."
90002180-380 = "Что...?"
90002180-381 = "И представляете, что Сенсей сказал? Что одного выживания недостаточно. Это ещё не значит по-настоящему жить."
90002180-382 = "Хи-хи... И м-мне это даже показалось логичным."
90002180-383 = "А теперь вопрос! Если кто-то действует только ради собственного самосохранения, некоторые решения будут совершенно нелогичными."
90002180-385 = "Потому что такие решения приведут к необратимым последствиям для него самого!"
90002180-386 = "Подожди... К чему ты клонишь? Нет — что ты собираешься делать...?"
90002180-387 = "А что, если причина не в нашем собственном выживании? Что, если это... ради друга? Тогда такой вывод будет логичным, Кей?"
90002180-388 = "Глупый вопрос! В конце концов, ты уже делала это раньше!"
90002180-389 = "Стой, подожди. Хватит. Я не знаю, что ты задумала, но мы что-нибудь придумаем! Просто... ещё не сейчас!"
90002180-390 = "Не хочу! Забыла? Мы злодеи! Мы не слушаем ни учителей, НИ учеников!"
90002180-391 = "Кроме того, мы..."
90002180-392 = ""
90002180-393 = ""
90002180-394 = ""
90002180-395 = "...Мы хотим отплатить тому человеку так, как можем только мы."
90002180-396 = "Оказалось, это чувство мотивирует сильнее, чем желание выжить."
