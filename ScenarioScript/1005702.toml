[translation]
1005702-1 = "Сошла с рельсов. Но только иногда."
1005702-4 = "Получив сообщение от Харуны, я отправился к месту встречи."
1005702-5 = "О, Сенсей."
1005702-6 = "Вы как раз вовремя."
1005702-7 = "[s] «Красивый наряд.»"
1005702-8 = "Спасибо."
1005702-9 = "Мне показалось, он мне подходит."
1005702-10 = "Но что важнее, он подходит для путешествия за сезонными гастрономическими впечатлениями."
1005702-11 = "Истинная гастрономия выходит за рамки самой еды. Это впечатление, которое нужно создавать."
1005702-12 = "[s] «То есть тебе просто хотелось надеть кимоно на Новый год.»"
1005702-13 = "Можно подытожить и так."
1005702-14 = "Но не только я сегодня взволнована."
1005702-15 = ""
1005702-19 = "[ns] «Да, на улицах полно народу.»"
1005702-20 = "Из-за Нового года здесь стало так людно..."
1005702-21 = "Прошедший год остаётся позади, новый ждёт впереди..."
1005702-22 = "Это подходящее время, чтобы открыть «новую себя»."
1005702-23 = "И конечно, всегда хочется верить, что новый год принесёт в жизнь что-то хорошее."
1005702-24 = "Что касается меня... мои ожидания больше связаны с едой."
1005702-25 = ""
1005702-26 = "Хи-хи..."
1005702-27 = "Дело не только во вкусе еды..."
1005702-28 = "...атмосфера тоже придаёт новогодней трапезе особый вкус."
1005702-29 = "[s] «Наверное...»"
1005702-30 = "Я не сомневаюсь."
1005702-31 = "Как думаете, зачем я пригласила вас сюда?"
1005702-32 = "Кстати, может, уже пойдём?"
1005702-33 = ""
1005702-35 = ""
1005702-37 = ""
1005702-38 = "[ns] «Харуна?!»"
1005702-39 = "Что такого в том, чтобы идти со мной под руку?"
1005702-40 = "Не знаю, заметили ли вы, но я сегодня очень взволнована."
1005702-41 = "Я рассчитываю на вас, Сенсей!"
1005702-46 = "Попробуйте нашу еду! Только самые свежие ингредиенты!"
1005702-47 = "Бананы в шоколаде! Купите один и получите шанс выиграть ещё один!"
1005702-48 = "Якисоба! Шипящая якисоба прямо с раскалённой плиты двадцать четыре часа в сутки!"
1005702-49 = ""
1005702-50 = "А, якисоба."
1005702-51 = "Кажется, она всегда где-то рядом... Но стоит ей исчезнуть — начинаешь скучать."
1005702-55 = "Извините, можно одну порцию?"
1005702-56 = "О, и две пары палочек, пожалуйста."
1005702-58 = "Они ещё и рамэн продают? Интересно, как его подают."
1005702-59 = "А... Они наливают бульон в широкий одноразовый стакан..."
1005702-60 = "Может, тоже попробуем?"
1005702-61 = ""
1005702-63 = ""
1005702-65 = "Хи-хи. Делить одну порцию на двоих..."
1005702-66 = "Весело, правда?"
1005702-68 = "О-о, эта кастелла выглядит аппетитно."
1005702-69 = "Сначала её выпекают, а потом снова прогревают снаружи ради текстуры..."
1005702-70 = "И как раз когда мне захотелось сладкого."
1005702-71 = "Давайте попробуем."
1005702-75 = "А, моти с клубникой."
1005702-76 = "Большая клубника, покрытая пастой из красной фасоли и засунутая прямо внутрь моти..."
1005702-77 = "Сначала ощущаешь сладость красной фасоли, а затем добираешься до освежающего вкуса клубники..."
1005702-78 = "И всё это в упругом рисовом тесте..."
1005702-79 = ""
1005702-81 = ""
1005702-82 = "Извините, можно две порции клубничного моти?"
1005702-84 = "Мы с Харуной продолжили бродить по улицам в поисках новых ларьков, которые можно было бы покорить."
1005702-85 = ""
1005702-89 = "[ns] «Я... я больше не могу...»"
1005702-90 = "Я... Я тоже больше не могу."
1005702-91 = "[s] «Ну как тебе, Харуна?»"
1005702-92 = "А, точно. Что ж, это было путешествие по праздничным деликатесам."
1005702-93 = "Итак, нам пора прийти к окончательному решению."
1005702-94 = "Особая еда, которую ешь в особое время, в особом месте и особой атмосфере..."
1005702-95 = ""
1005702-97 = ""
1005702-98 = "Я разочарована."
1005702-99 = "[s] «П-Правда?»"
1005702-100 = "Шипение якисобы ничего не значит, если соус плохо смешан с лапшой."
1005702-101 = "Рамэн из уличного ларька ценен своей простотой, но это не значит, что гарнир должен состоять лишь из водорослей и сладкой кукурузы."
1005702-102 = "Кастелла подгорела, потому что они явно не умеют прогревать только внешнюю часть."
1005702-103 = "А паста из красной фасоли в клубничном моти горчила."
1005702-104 = "Наверняка использовали дешёвые готовые продукты."
1005702-105 = "[s1] «О нет! Твои вкусовые рецепторы разозлились!»\n[s2] «(Зажать уши и свернуться клубком.)»"
1005702-108 = "...Эм, что?"
1005702-109 = "О, вы подумали, что я сейчас взорву эти ларьки?"
1005702-110 = "Ну бросьте, я не всегда так делаю."
1005702-111 = "Кроме того..."
1005702-112 = "[s] «Кроме того?»"
1005702-113 = "Я не хотела портить время, которое мы проводим вместе."
1005702-114 = "Это было не совсем гастрономическое откровение... но мне понравилось."
1005702-115 = "Можете остаться со мной, чтобы я насладилась этим ещё немного?"
1005702-116 = "В конце концов, нам ещё столько еды предстоит попробовать."
1005702-118 = ""
1005702-123 = "Мы с Харуной гуляли дальше, наслаждаясь атмосферой улиц."
1005702-124 = "По пути она продолжала пробовать еду то в одном, то в другом ларьке."
