[translation]
1301005-1 = "Человек-калькулятор"
1301005-2 = "Рабочий кабинет Сенсея в Шале"
1301005-3 = "Я слышала кое-что интересное, Сенсей! Правда, что после налёта на оружейный склад бандитов ты забрал кучу снаряжения?"
1301005-4 = "Это надолго выведет их из строя. Отличная работа!"
1301005-5 = "Но ты выглядишь не очень довольным. С оборудованием что-то не так?"
1301005-6 = "Говоришь, с оборудованием всё нормально, но проблема с описью? В каком смысле?"
1301005-7 = "[s] Передать Юке опись оборудования."
1301005-8 = "Посмотрим... 200 галлонов топлива для танков, 600 фунтов тротила, патроны калибра 0,3..."
1301005-9 = "Наверное, из-за возраста большая часть единиц измерения здесь из старой системы Тринити."
1301005-10 = "Так что тебе трудно привести журнал в порядок, потому что ты не знаком с этими единицами?"
1301005-11 = "И раз всё написано от руки, быстро пересчитать на компьютере тоже не получится."
1301005-12 = "Сами расчёты не должны быть сложными. Здесь хватит немного посчитать в уме."
1301005-13 = "Думаю, справлюсь минут за тридцать."
1301005-14 = "Что? Не веришь? Просто смотри."
1301005-15 = "Дай немного времени."
1301005-17 = "Готово. Я пересчитала опись в привычные единицы."
1301005-18 = "Некоторые значения нельзя было пересчитать точно, поэтому я округлила их вверх или вниз. Обязательно прочитай примечания."
1301005-19 = "[s] «Ты правда сделала всё это за 30 минут?»"
1301005-20 = "Хе-хе. А я что говорила?"
1301005-21 = "Пустяки. Я бы не была казначеем Миллениума, если бы не справлялась с такой простой задачей."
1301005-22 = "[s] «Тогда можешь и это за меня сделать?»"
1301005-23 = "Документ? Это...?"
1301005-24 = "Сенсей! Это обычный отчёт Шале для Главного ученического совета!"
1301005-25 = "Он просрочен уже на три месяца!"
1301005-26 = "Да, я хорошо считаю, но нельзя сваливать работу на других просто потому, что тебе лень! Делай сам!"
1301005-27 = ""
1301005-28 = "...И не смотри на меня так!"
1301005-29 = ""
1301005-30 = "..."
1301005-31 = "*вздох* Ладно. Немного помогу."
1301005-32 = "Мне нужно перестать быть такой мягкотелой..."
1301005-33 = "Почему ты просто сидишь? На остальных бумагах ТВОЁ имя, так что продолжай писать!"
1301005-35 = "После этого мы с Юкой спокойно привели журнал в порядок."
