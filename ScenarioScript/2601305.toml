[translation]
2601305-1 = "Последняя фотография"
2601305-2 = "Я встретился с Ацуко на фестивале, чтобы помочь ей найти объект для последнего снимка."
2601305-4 = "Здравствуйте, Сенсей."
2601305-5 = "Спасибо, что пришли."
2601305-6 = "Мне трудно решить, что сфотографировать, а заряд камеры почти закончился."
2601305-7 = "Мне очень нужен ваш совет, Сенсей."
2601305-8 = "[s1] «Хм... Сложный вопрос.»\n[s2] «Вот это кажется хорошим вариантом, но и то тоже...»"
2601305-11 = "Тогда почему бы нам вместе не обойти фестиваль?"
2601305-12 = "Может, во время прогулки найдём вдохновение."
2601305-13 = "Что думаешь?"
2601305-14 = "[s] «Давай найдём идеальный последний кадр!»"
2601305-15 = "Хи-хи. Я постараюсь, Сенсей!"
2601305-17 = "Поймайте себе милого питомца в игре с золотыми рыбками! Подходите!"
2601305-18 = "Ого! В аквариуме столько рыбок."
2601305-19 = "Они так красиво плавают."
2601305-20 = "[s] «Хочешь сфотографировать?»"
2601305-21 = "Нет, уверена, найдётся объект получше."
2601305-22 = "Let's try another place."
2601305-26 = "Скоро начнётся танцевальное выступление Банды Шлемов!"
2601305-27 = "Приходите посмотреть на наши потрясающие танцы!"
2601305-28 = ""
2601305-30 = ""
2601305-31 = ""
2601305-32 = "[ns] «Как насчёт уличного выступления, Ацуко?»"
2601305-33 = "Если бы заряда оставалось больше, было бы весело..."
2601305-34 = "Но почему-то тратить на это последний снимок..."
2601305-35 = "Кажется расточительством."
2601305-36 = "Let's try another place."
2601305-38 = "Какой впечатляющий песчаный замок."
2601305-39 = "Он почти с человека ростом. Создатель очень умелый."
2601305-40 = "...Но это не идеально."
2601305-41 = "[s] «Тогда продолжаем искать!»"
2601305-43 = "Мы с Ацуко обошли весь фестиваль в поисках последнего кадра, но..."
2601305-44 = "...так и не нашли идеальный объект."
2601305-46 = "...Солнце уже село."
2601305-47 = "Мы так и не нашли, что сфотографировать."
2601305-48 = "[s3] «Может, поищем что-нибудь на ночном фестивале?»\n[s4] «В темноте можно использовать вспышку.»"
2601305-51 = "Это было бы неплохо, но... камера была довольно дешёвая. Вспышка сломана."
2601305-52 = "Так что ночью все снимки будут просто тёмными."
2601305-53 = "Похоже, придётся признать сегодняшний день неудачным."
2601305-54 = ""
2601305-59 = "О?"
2601305-60 = ""
2601305-63 = ""
2601305-64 = "Фейерверки..."
2601305-65 = "[s] «Фейерверки...»"
2601305-66 = "Точно! Я совсем забыла, что на сегодня запланирован фейерверк."
2601305-67 = "А. Тогда..."
2601305-68 = ""
2601305-70 = ""
2601305-71 = ""
2601305-72 = "[ns] «Ты сделала последний снимок?»"
2601305-73 = "Да! Наконец-то я нашла идеальный объект."
2601305-74 = "Хи-хи. Нет, смотреть нельзя."
2601305-75 = "...А? Вам показалось, что объектив был направлен на вас?"
2601305-76 = ""
2601305-78 = ""
2601305-79 = "[ns] «Покажи, пожалуйста...»"
2601305-80 = "Это мой секрет."
2601305-81 = "Но мне удалось сфотографировать именно то, что я хотела."
2601305-82 = "И всё благодаря вам, Сенсей. Спасибо!"
