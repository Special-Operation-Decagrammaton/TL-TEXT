[translation]
1011703-1 = "Девушка на улице"
1011703-2 = "Я шёл по улице, когда..."
1011703-3 = ""
1011703-6 = "[ns] «(Это разве не...?)»"
1011703-7 = ""
1011703-8 = ""
1011703-9 = ""
1011703-10 = ""
1011703-11 = "[ns] «Эй, Хикари, чем занимаешься?»"
1011703-12 = ""
1011703-13 = "А. Сенсей."
1011703-14 = "Скорее. Иди сюда."
1011703-16 = "Я подошёл к Хикари."
1011703-17 = ""
1011703-18 = "Вот. Видишь-видишь?"
1011703-19 = ""
1011703-22 = "[ns] «О, похоже на...»"
1011703-24 = "Чёрные и красные муравьи сновали туда-сюда, ведя ожесточённую битву."
1011703-25 = ""
1011703-26 = "[ns] «Муравьиная война...!»"
1011703-27 = "Ага. Финальный Рагнарёк Кивотоса. Без «муравья» не было бы и этой великой битвы."
1011703-28 = "[s] «И это ты хотела мне показать?»"
1011703-29 = "Ага-а. Хикари обожает смотреть на муравьиные драки."
1011703-30 = "Весь день, каждый день — время муравьиных боёв!"
1011703-31 = "Эй. Эй, Сенсей. Как думаешь, кто победит?"
1011703-32 = "[s1] «(Напоминает детство...)»\n[s2] «Ну, что мы о них знаем?»"
1011703-33 = ""
1011703-34 = ""
1011703-36 = ""
1011703-37 = ""
1011703-38 = "У чёрных муравьёв сила."
1011703-39 = "А у красных — численность."
1011703-40 = "[ns3] «Ставлю на чёрных!»\n[ns4] «Ставлю на красных!»"
1011703-43 = "Круто. Хикари выберет других."
1011703-44 = "О-о, генерал чёрной команды!"
1011703-45 = "Какой огромный. Красным сейчас несладко."
1011703-46 = "[s] «Ой-ой, к красным идёт подкрепление!»"
1011703-47 = "Как эпично..."
1011703-49 = "Пока мы с Хикари всё сильнее увлекались наблюдением за муравьями..."
1011703-50 = ""
1011703-51 = "Ого. Красная команда подтягивает артиллерию."
1011703-52 = "Полный залп!"
1011703-53 = "[s5] «О-о, они стреляют кислотой.»\n[s6] «Это может быть опасно. Давай отойдём.»"
1011703-56 = "Ай."
1011703-57 = "Ик! Здесь пострадал невинный!"
1011703-58 = "[s] «Ой! Сюда, скорее...!»"
1011703-60 = "Я поспешно отвёл Хикари к ближайшему крану и смыл кислоту водой."
1011703-61 = ""
1011703-62 = "Урон кислотой... критический..."
1011703-63 = "[s7] «Это всего одна капля. Всё будет хорошо.»\n[s8] «Сильно болит?»"
1011703-66 = "500 миллионов урона в секунду..."
1011703-67 = "Надо отомстить..."
1011703-68 = "[s9] «Будь милосердна, Хикари. Давай забудем об этом.»\n[s10] «А если я куплю тебе что-нибудь вкусное?»"
1011703-71 = "О-о... Что-нибудь вкусное..."
1011703-72 = "Но Хикари всё равно хочет проучить этих муравьёв, а то они начнут смотреть на неё свысока..."
1011703-73 = ""
1011703-75 = ""
1011703-76 = "Мм."
1011703-77 = "Ладно. Можешь восполнить потерянную кровь Хикари вкусняшками."
1011703-78 = "[s] «Но ты вообще не потеряла кровь...»"
1011703-80 = "После первой помощи мы отправились есть что-нибудь вкусное."
