83306035701-5 = "Глава префектов. Вы нашли то, что искали?"
83306035701-6 = "Да, благодаря тебе. Спасибо за помощь."
83306035701-7 = "А, конечно! Но в следующий раз я могу просто сама всё сде—!"
83306035701-8 = "Не нужно лишний раз себя утруждать."
83306035701-9 = "А... если вы уверены..."
83306035701-10 = "Но всё равно, пожалуйста, говорите, если я могу чем-нибудь помочь."
