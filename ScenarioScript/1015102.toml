[translation]
1015102-1 = "Genius and Experiments"
1015102-3 = "That being said, Sensei."
1015102-4 = "Could you pull a wrestling move on me?"
1015102-5 = "[s1] \"How did we come to this?!\"\n[s2] \"But why though!?\""
1015102-8 = "Huh? We were just talking about puppy socialization, weren't we?"
1015102-9 = "Look, it says it right there. #n\"It's dangerous if they don't know the pain of being attacked.\" Isn't it?"
1015102-10 = "[s] \"Yeah. But what does that have to do with pro wrestling...?\""
1015102-11 = "It has everything to do with it!"
1015102-12 = "For example... learning a wrestling move and putting it into practice is easy#nenough in itself, but—"
1015102-13 = "You wouldn't know how much force is needed to apply the move safely and#neffectively."
1015102-14 = "The manual says to use \"moderate force,\" but the \"moderate\" part is the problem!"
1015102-15 = "Since there are no specific units like kilogram-forces or newtons, nor are there any numerical values, I have no idea what that means."
1015102-16 = "If I use what I think is \"moderate\" and end up injuring my opponent, it would be a big problem!"
1015102-17 = "So... I figured I should have someone use a move on me so I could get a feel for it."
1015102-18 = "So once again, could you put me in a joint lock?"
1015102-19 = "[s3] \"I understand what you're trying to say, but!\"\n[s4] \"For various reasons, I think that's going to be difficult...\""
1015102-22 = "It's not difficult at all! Just think about it."
1015102-23 = "I have deemed you as a trustworthy adult, Sensei."
1015102-24 = "So... if I ever put a move on someone and they complain that it hurts—"
1015102-25 = "I can argue back, \"It's fine, I did it to Schale's Sensei too!\""
1015102-26 = "[s5] \"J-Just imagining that gives me the chills...\"\n[s6] \"There's no way I can do that! Also...\""
1015102-29 = "[ns] \"I don't want to hurt you, Anna...\""
1015102-33 = "...That's true. I'm sorry, I just got a little carried away."
1015102-34 = "Ahaha..."
1015102-35 = "A-Ahem. Where were we reading again...?"
1015102-36 = "..."
1015102-37 = "[s7] \"How about you try put that move on me instead, Anna?\"\n[s8] \"You're probably better at it than me, anyway.\""
1015102-42 = "Eh! Are you sure?!"
1015102-43 = "Then I'll accept that offer! If it hurts, please tell me right away, okay?"
1015102-44 = "[s9] \"I'm ready whenever!\"\n[s10] \"By the way, what kind of move is it?\""
1015102-47 = "I'm going to grab your head under my arm and squeeze! It's a \"Headlock\"!"
1015102-48 = "[s] \"Eh?!\""
1015102-52 = "Yaaah!"
1015102-57 = "How is it? Sensei!"
1015102-58 = "Why aren't you saying anything? I shouldn't be covering your mouth..."
1015102-59 = "[ns11] \"I'm fine, but also not really!\"\n[ns12] \"That's enough already, right?!\""
1015102-62 = "That's good, it didn't hurt then!"
1015102-63 = "How about this, then?"
1015102-67 = "I'll stop immediately if it hurts!"
1015102-68 = "[ns] \"I-it hurts! Well not really, but let's just say it does!\""
1015102-73 = "I see, so I should squeeze with about this much force."
1015102-74 = "Thank you very much! I learned a great information!"
1015102-75 = "I'll take notes so I don't forget!"
1015102-79 = "Huh, Sensei... you look a bit pale"
1015102-80 = "Are you hurting somewhere?"
1015102-81 = "[s] \"I'm fine! No need to worry!\""
1015102-82 = "Y-You don't look fine at all! Waaah!"
1015102-84 = "(After that... I explained that I wasn't in any pain and calmed Anna down.)"
1015102-85 = "(She asked if she could try other moves, but I politely declined and made my#nescape.)"