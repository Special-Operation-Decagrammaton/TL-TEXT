[translation]
1015102-1 = "Geniuses and experiments..."
1015102-3 = "So, Sensei."
1015102-4 = "Could you put me in a wrestling hold?"
1015102-5 = "[s1] \"How did we get here!?\"\n[s2] \"How on earth did you reach that conclusion!?\""
1015102-8 = "Huh? We were just talking about puppy socialization, right?"
1015102-9 = "Look, it says right here, \"It is dangerous if you do not know the pain of being attacked.\""
1015102-10 = "[s] \"Yeah. But what does that have to do with pro wrestling...?\""
1015102-11 = "It has everything to do with it!"
1015102-12 = "For example... learning wrestling moves is easy enough in theory, but--"
1015102-13 = "I have no idea how much force is needed to apply a hold safely and effectively."
1015102-14 = "The guide says \"use moderate force,\" but that \"moderate\" part is the problem!"
1015102-15 = "It does not give any specific units or numbers like kilograms-force or newtons, so I have no clue."
1015102-16 = "It would be terrible if I used what I thought was \"moderate\" force and accidentally injured someone!"
1015102-17 = "So... I was thinking you could put me in a hold so I can get a feel for it."
1015102-18 = "Once again, will you put me in a joint lock?"
1015102-19 = "[s3] \"I get what you are trying to say, but...!\"\n[s4] \"That is going to be difficult for various reasons...\""
1015102-22 = "It is not difficult at all! Just think about it."
1015102-23 = "I have determined that Sensei is a trustworthy adult."
1015102-24 = "So... if someone complains that I hurt them when I use a hold on them--"
1015102-25 = "I can just argue, \"I did it to the Schale teacher too, so it is fine!\""
1015102-26 = "[s5] \"J-Just imagining that gives me the chills...\"\n[s6] \"There is no way I can do that! Besides...\""
1015102-29 = "[ns] \"I do not want to hurt Anna...\""
1015102-33 = "...Right, I am sorry. I got a little carried away."
1015102-34 = "Ahaha..."
1015102-35 = "A-Ahem. Now, where were we reading..."
1015102-36 = "..."
1015102-37 = "[s7] \"How about Anna puts me in a hold instead?\"\n[s8] \"You are probably better at it than I am anyway.\""
1015102-42 = "Eh! Are you sure!?"
1015102-43 = "Well, if you insist! Please tell me right away if it hurts, okay?"
1015102-44 = "[s9] \"Anytime!\"\n[s10] \"By the way, what kind of move is it?\""
1015102-47 = "It is a \"headlock,\" where I tuck your head under my arm and squeeze!"
1015102-48 = "[s] \"Eh!?\""
1015102-52 = "Take this!"
1015102-57 = "How is that, Sensei?"
1015102-58 = "Why are you not saying anything? Your mouth should not be blocked..."
1015102-59 = "[ns11] \"I am fine, but maybe I am not fine!\"\n[ns12] \"That is enough already, right!?\""
1015102-62 = "Oh good, it did not hurt then!"
1015102-63 = "How about this one?"
1015102-67 = "I will stop immediately if it hurts!"
1015102-68 = "[ns] \"I-It hurts! Let us just go with that!\""
1015102-73 = "I see, so I just need to squeeze with this much force."
1015102-74 = "Thank you! I learned a lot!"
1015102-75 = "I will take notes so I do not forget!"
1015102-79 = "Huh, Sensei... you look a little pale..."
1015102-80 = "Wait, are you hurt somewhere!?"
1015102-81 = "[s] \"I am fine! No need to worry!\""
1015102-82 = "Y-You do not look fine at all! Waaah!"
1015102-84 = "(Afterward... I explained that I was not actually in pain and managed to reassure Anna.)"
1015102-85 = "(She asked if she could try other moves, but I politely declined and slipped away.)"
