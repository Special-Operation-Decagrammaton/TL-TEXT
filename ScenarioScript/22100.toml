[translation]
22100-1 = "Episódio 10;A Verdade Cruel (2)"
22100-15 = "Uns zé-ninguém desses não vão me segurar nem a pau!"
22100-19 = "— Como esperado da Neru. Parece que meros AMAS não são capazes de detê-la."
22100-20 = "Eu não queria ter que fazer isso, mas —"
22100-22 = "...Toki."
22100-23 = "Sim, senhora."
22100-24 = "Autorizo o uso do \"armamento\"."
22100-26 = "Entendido."
22100-31 = "Preparação concluída. Entrando no \"Modo 2\"."
22100-32 = "Hã? Que papo furado é esse —"
22100-42 = "Ué? A roupa dela..."
22100-43 = "[ns] \"...A \"aparência\" dela mudou?\""
22100-45 = "...!"
22100-54 = "Aí?!"
22100-69 = "Acha que vai escapar...?!"
22100-82 = "Tsc, droga... não acerta..."
22100-83 = "E-ela desapareceu num piscar de olhos..."
22100-89 = "Onde diabos você se meteu...?"
22100-91 = "Neru-senpai, atrás de você...!"
22100-92 = "...O quê?"
22100-106 = "Gah!!?"
22100-107 = "[s] \"A Neru foi derrubada num instante...\""
22100-109 = "Quando eu percebi... ela apareceu do nada..."
22100-110 = "A-aah..."
22100-115 = "Droga! Me larga?! Quer virar sucata?!"
22100-116 = "Se continuar se debatendo assim, seu braço vai dobrar na direção errada, senpai."
22100-117 = "Pessoal, sugiro que não façam nenhum movimento brusco.#nNão recomendo resistência inútil."
22100-119 = "...Ugh!"
22100-120 = "...!"
22100-123 = "[ns] \"O que diabos é isso...?\""
22100-124 = "É um armamento especial que eu mesma desenvolvi."
22100-125 = "— Embora eu não tivesse intenção de usá-lo num lugar como este."
22100-126 = "Vamos, AMAS.#nRecolham a Aris."
22100-136 = "!!"
22100-137 = "E-espera aí...!"
22100-139 = "É melhor não fazer nenhum movimento brusco."
22100-145 = "Não quero ferir quem não tem nada a ver com isso."
22100-151 = "(Estremece!)"
22100-154 = "[ns] \"Pare com isso, Rio.\""
22100-157 = "— Essa é a minha fala."
22100-158 = "Eu também não quero entrar em conflito."
22100-159 = "Não tenho intenção de ser sua inimiga, nem quero ser odiada por você."
22100-160 = "Na verdade, eu é quem gostaria de lhe perguntar."
22100-161 = "Diante de uma situação como esta, como Sensei da Schale,"
22100-166 = "não deveria ser você, como adulto, o primeiro a agir?"
22100-167 = "[s] \"...O que quer dizer com isso?\""
22100-168 = "Alguém que não se deixa dominar pelas emoções como uma criança#ne consegue julgar a situação com frieza —"
22100-169 = "Não deveria ser você, como adulto, quem deveria ter agido?"
22100-170 = "[s] \"Machucar uma aluna...\""
22100-171 = "— Até quando pretende continuar falando esses disparates?!"
22100-172 = "[s] \"...!!\""
22100-173 = "— Não me entenda mal, Sensei."
22100-176 = "\"Aquilo\" não é um ser vivo — não é uma aluna pela qual você deva se responsabilizar."
22100-177 = "Se você sente isso, não passa do \"efeito ELIZA\"."
22100-178 = "\"Aquilo\" é uma arma terrível capaz de levar este mundo ao fim."
22100-181 = "Se lhe pedissem para colocar aquilo na balança contra todas as alunas de Kivotos, a resposta seria óbvia, não é?"
22100-182 = "...E se, mesmo assim, você se recusar a agir..."
22100-183 = "Eu mesma destruirei a auréola da Aris com minhas próprias mãos.#nOs preparativos já estão todos prontos."
22100-189 = "..."
22100-190 = "Não..."
22100-191 = "Não é verdade! A Aris-chan não é nenhuma arma!"
22100-192 = "A Aris-chan... é uma heroína!#nPorque —"
22100-193 = "A Aris-chan tem a Espada da Luz... a \"Supernova\", a prova de uma heroína!"
22100-195 = "A Espada da Luz... aquele brinquedo feito pelo Clube de Engenharia?"
22100-196 = "Entendo... se é isso que vocês dizem..."
22100-197 = "Pois bem."
22100-205 = "[ns] \"A energia da Supernova... apagou?\""
22100-206 = "...!"
22100-207 = "Isso basta?"
22100-208 = "A Espada da Luz não existe mais."
22100-209 = "Com isso, a prova está encerrada."
22100-210 = "A espada da Aris... a prova de uma heroína..."
22100-211 = "A-ah... uuh..."
22100-217 = "Midori... Yuzu..."
22100-223 = "Droga! Me larga!"
22100-224 = "Ei, nanica! Não fica parada aí, revida!"
22100-226 = "..."
22100-227 = "Neru-senpai..."
22100-230 = "Sensei..."
22100-231 = "[s] \"...Aris.\""
22100-232 = "...!!"
22100-239 = "...Momoi."
22100-240 = "Tudo... é porque a Aris existe...?"
22100-245 = "Isso aconteceu... porque a Aris é o \"Rei Demônio\"?"
22100-246 = "..."
22100-247 = "Se a Aris... continuar aqui...#na mesma coisa vai..."
22100-248 = "..."
22100-249 = "...Se a Aris..."
22100-250 = "...Se a Aris não é uma heroína..."
22100-255 = "...É... verdade."
22100-261 = "[ns] \"Aris...?\""
22100-266 = "Sim... a Aris entendeu tudo."
22100-267 = "...A Aris vai desaparecer."
22100-268 = "Não! Aris-chan!"
22100-269 = "Ari... s-chan..."
22100-270 = "Quê...?! Ei, nanica, sua...!"
22100-275 = "[ns] \"Você não precisa fazer isso, Aris.\""
22100-279 = "Não, está tudo bem."
22100-280 = "A Aris... não quer que o Sensei se machuque."
22100-281 = "A Aris..."
22100-291 = "A Midori, a Yuzu, a Neru-senpai, e todo mundo também..."
22100-292 = "Não quero que ninguém se machuque."
22100-293 = "...Quando a Momoi se machucou por causa da Aris... o peito da Aris doeu muito."
22100-294 = "Por quê... como as coisas acabaram assim, a Aris não consegue entender direito."
22100-297 = "Mas, mesmo assim... depois de ouvir essa conversa... finalmente entendi."
22100-298 = "Que tudo... aconteceu por culpa da Aris..."
22100-299 = "Se a Aris continuar aqui para sempre..."
22100-300 = "Um dia... todo mundo vai acabar se machucando."
22100-301 = "[s] \"Não precisa acreditar em tudo o que a Rio diz. Vamos conversar direito, Aris.\""
22100-302 = "Sensei... não precisa se preocupar, está tudo bem."
22100-305 = "Está tudo bem. Afinal, a Aris não é um ser vivo."
22100-306 = "A Aris não é uma aluna da Millennium.#nMesmo que desapareça, vai ficar tudo bem."
22100-307 = "A Aris... não é... uma heroína..."
22100-308 = "A Aris... vai... ficar bem."
22100-313 = "Sensei, muito obrigada por tudo até agora."
22100-314 = "Pessoal, muito obrigada por terem vivido aventuras com a Aris."
22100-315 = "A Aris..."
22100-319 = "Foi muito feliz até agora..."
22100-329 = "Pois bem — com licença."
22100-330 = "Caso — o Sensei tenha se magoado com minhas ações ou palavras..."
22100-331 = "Quando tudo isso acabar, permita-me pedir desculpas formalmente."
22100-332 = "Então, até logo —"
22100-338 = "(Até que Rio e Aris deixassem completamente o local,)"
22100-342 = "(Imobilizados pelos AMAS, não conseguimos mover sequer um dedo —)"
22100-347 = "(E assim, diante de nós, esmagados apenas por uma total impotência —)"
22100-352 = "(— Aris desapareceu.)"
22100-358 = "Próximo;Isso Não Importa!"
