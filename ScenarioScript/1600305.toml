[translation]
1600305-1 = "Всемогущая светошумовая граната"
1600305-2 = "Сюда, Сенсей. Это Сузуми."
1600305-3 = "Всё в порядке. Я и сама только что пришла."
1600305-4 = "Прошу прощения? Почему я должна быть против того, что вы мне звоните...?"
1600305-5 = "Если вы переживаете из-за моей нагрузки в Патрульной команде, то не стоит."
1600305-6 = "Вы ведь не отрываете меня от любимой работы."
1600305-7 = "Меня заставляют этим заниматься? Нет, совсем нет. Никто меня ни к чему не принуждает."
1600305-8 = "Просто мне это... не особо нравится. Вот и всё."
1600305-9 = "Честно говоря, я надеюсь, что однажды этому району вообще больше не понадобится Патрульная команда..."
1600305-10 = "Думаете, это делает меня доброй?"
1600305-11 = "Наверное, вы ошибаетесь. Другие предпочитают держаться подальше, потому что я кажусь холодной."
1600305-12 = "Не то чтобы я их не понимала. Это просто издержки такой работы."
1600305-13 = "...Но всё равно спасибо, что сказали это."
1600305-14 = "Пойдёмте, Сенсей. Я поведу... то есть..."
1600305-15 = ""
1600305-16 = ""
1600305-17 = "Давайте пойдём вместе."
1600305-18 = "[s] (Я пошёл рядом с Сузуми.)"
1600305-22 = "Мне нравится это кафе. Не хотите зайти со мной?"
1600305-23 = "Я предпочитаю латте, а в этом кафе они..."
1600305-24 = "*грохот* *бах*"
1600305-25 = "Эй! Что вы делаете?!"
1600305-26 = "...?!"
1600305-27 = "А-ха-ха! Ты что, тупая? Мы тебя грабим, очевидно же!"
1600305-28 = "Идеальный налёт! Мы неделями всё разведывали, чтобы ударить, когда Патрульная команда отдыхает!"
1600305-29 = "Так что закрой рот и выгребай кассу. Шевелись!"
1600305-30 = "*вздыхает*"
1600305-31 = "Если бы местные хулиганки вкладывали столько же сил в учёбу."
1600305-32 = "(Это ведь должен был быть мой выходной... и я с Сенсеем.)"
1600305-33 = ""
1600305-34 = ""
1600305-35 = "..."
1600305-36 = "Я-я же сказала! Это вся выручка за неделю!"
1600305-37 = "Ты имеешь в виду деньги, которые теперь заработали МЫ. Обещаем не потратить всё в одном месте."
1600305-38 = "Надеюсь, ты не собралась изображать героя. Меньше всего тебе хочется оказаться в больнице после того, как тебя уволят за такое! Ха-ха-ха!"
1600305-39 = "..."
1600305-40 = "Эм..."
1600305-41 = "Сенсей... я..."
1600305-42 = "Ничего. Простите."
1600305-43 = "[s1] «Всё хорошо. Иди.»\n[s2] «Ты ведь не собираешься просто их бросить?»"
1600305-44 = "...!"
1600305-45 = "...!"
1600305-46 = "Ты права."
1600305-47 = "Спасибо, Сенсей. Я ненадолго. Разберусь с этим как можно быстрее."
1600305-48 = "*щелчок*"
1600305-49 = "А? Вы что-нибудь слышали?"
1600305-50 = "Да. Что это было? Звучало подозрительно знакомо..."
1600305-51 = "Светошумовая граната!"
1600305-53 = "*бах* *звя-я-я-я-янь*"
1600305-58 = "(Дальше всё прошло как обычно. После шока от светошумовой гранаты хулиганок быстро усмирили.)"
1600305-59 = "(Сузуми привязала их к столбу и заставила слушать «Baby» Остина Дибера на повторе.)"
1600305-61 = "Я вернулась, Сенсей. Простите. Это заняло больше времени, чем я ожидала."
1600305-62 = "Сегодня я должна была составить вам компанию, но мне всё равно пришлось..."
1600305-63 = "Вы... не против? Вам сегодня было весело?"
1600305-64 = "И вам интересно, почему я выбираю именно светошумовые гранаты?"
1600305-65 = "Всё просто..."
1600305-66 = "Они нелетальны, а их эффект со временем проходит."
1600305-67 = "Светошумовые гранаты — самый быстрый и безопасный способ нейтрализовать ситуацию и подавить противника."
1600305-68 = "Да, это хулиганы, но моя цель не причинить им вред."
1600305-69 = "Моя задача — только остановить их. В этом и состоит цель Патрульной команды."
1600305-70 = "[s] «Я же говорил, у тебя доброе сердце, Сузуми»."
1600305-71 = "...! Ч-что из сказанного мной привело вас к такому выводу?"
1600305-72 = "В любом случае нам пора! Такими темпами мы выбьемся из сегодняшнего расписания."
1600305-73 = "Сюда...!"
1600305-74 = ""
1600305-76 = "(В итоге в тот день Сузуми пришлось использовать светошумовую гранату почти в каждом месте, куда мы заходили.)"
1600305-77 = "(К концу дня она израсходовала легко больше десяти.)"
1600305-79 = "..."
1600305-80 = "Мне так стыдно, Сенсей..."
1600305-81 = "С учётом того, как прошёл день, можно считать, что я всё-таки была на дежурстве."
1600305-82 = "Я просто не могла пройти мимо. Простите..."
1600305-83 = "Вы серьёзно? Вам правда всё равно было весело?"
1600305-84 = "И вы хотите ещё раз куда-нибудь со мной сходить?"
1600305-85 = "..."
1600305-86 = "Если вы этого хотите. С удовольствием, Сенсей."
1600305-87 = "Я буду рада составить вам компанию в любое время."
1600305-88 = "Так что спасибо за сегодняшний день."
1600305-89 = ""
1600305-90 = ""
1600305-91 = "Я... прекрасно провела время."
1600305-93 = "(Сузуми медленно развернулась и пошла прочь.)"
1600305-94 = "(В отличие от прошлого раза, теперь её шаги были спокойными и лёгкими.)"
