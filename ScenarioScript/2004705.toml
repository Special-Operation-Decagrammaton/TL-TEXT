[translation]
2004705-1 = "Тэнсюкаку моего сердца"
2004705-5 = ""
2004705-6 = ""
2004705-7 = ""
2004705-8 = ""
2004705-9 = ""
2004705-11 = "Мы вместе весело играли на мелководье."
2004705-12 = "Однако Кикё так и не отпускала мою руку."
2004705-14 = ""
2004705-15 = "Я уже довольно привыкла к этому."
2004705-16 = "...Не поймите неправильно. Я не боюсь воды. Совсем."
2004705-17 = "Всё это лишь ради безопасности..."
2004705-18 = "..."
2004705-19 = "Ладно. Неважно."
2004705-20 = "Мы уже достаточно поиграли в воде. Давайте займёмся чем-нибудь ещё."
2004705-21 = "В конце концов, я ведь говорила, что нам стоит попробовать что-то новое, разве нет?"
2004705-22 = "Я заинтриговала вас, не так ли?"
2004705-23 = "Я покажу."
2004705-24 = ""
2004705-26 = ""
2004705-27 = "Идите сюда. Ложитесь здесь."
2004705-28 = "За то, что сопровождали меня в океане, я награжу вас, Сенсей."
2004705-29 = "[s1] «Н-Наградишь?»\n[s2] «Что ты собираешься со мной делать?!»"
2004705-32 = "Скоро узнаете."
2004705-33 = "Вам нужно лишь лечь."
2004705-34 = "Доверьтесь мне. И не двигайтесь."
2004705-35 = "А теперь... ложитесь и закройте глаза."
2004705-37 = "Немного поколебавшись, я сделал, как сказала Кикё."
2004705-38 = ""
2004705-42 = "Разве я не велела вам лежать спокойно? Всё испортите."
2004705-43 = ""
2004705-47 = "Вот. Не двигайтесь."
2004705-48 = ""
2004705-52 = "Некоторое время спустя..."
2004705-53 = ""
2004705-57 = "Готово. Теперь можете открыть глаза."
2004705-60 = "Что вы думаете..."
2004705-61 = "...о моей особой песочной ванне?"
2004705-62 = "[s3] «Всё тело... стало тяжёлым!»\n[s4] «С-Спаси меня!»"
2004705-65 = "Не жалуйтесь. Я делала это для вас."
2004705-66 = "У песочной ванны много полезных свойств."
2004705-67 = "Потоотделение очищает кожу и поры, а тепло помогает циркуляции кислорода в организме."
2004705-68 = "Это также должно помочь облегчить боль в нервах и суставах."
2004705-69 = "Ну как? Усталость уменьшилась?"
2004705-70 = "[s5] «Я действительно довольно расслаблен...»\n[s6] «Но здесь СЛИШКОМ много песка!»"
2004705-73 = "Просто насыпать кучу показалось скучно, поэтому я придала ей форму замка."
2004705-74 = "Вы защищаете своих студентов, так что это довольно уместно, разве нет? Мой собственный Тэнсюкаку."
2004705-75 = "А сверху — деревянная кукла меня."
2004705-76 = "Вы должны защищать куклу Кикё 30 минут. Если я упаду, начнём сначала."
2004705-77 = "[s7] «Я никогда не дам тебе упасть!»\n[s8] «Сделаю всё, чтобы удержать...!»"
2004705-80 = "Т-Так искренне говорить подобные вещи..."
2004705-81 = "Фуфу. Вижу, в вас ещё осталось озорство."
2004705-82 = "Тогда вот это, это... и это тоже."
2004705-83 = ""
2004705-85 = ""
2004705-86 = ""
2004705-87 = ""
2004705-88 = "Я добавила ещё много кукол."
2004705-89 = "Теперь судьба Хяккарёран в ваших руках... Вы удержите их всех на вершине Тэнсюкаку, да?"
2004705-90 = "[s] «Я-Я сделаю всё, что смогу!»"
2004705-91 = "Тогда докажите... насколько прочен наш союз."
2004705-92 = "[s] «Мне кажется, он уже довольно прочный...»"
2004705-94 = "[ns] «Но вообще-то это довольно хороший песочный замок.»"
2004705-95 = "В детстве я построила их множество."
2004705-96 = "Мне нравилось придумывать стратегии и разыгрывать военные игры с песочными замками и деревянными куклами."
2004705-97 = "[s] «Значит, стать операционным офицером тебе было предначертано судьбой!»"
2004705-98 = "Ну, начиналось это как простая ролевая игра."
2004705-99 = "Однако детские воспоминания помогают определять наше будущее. Из них складываются наши ценности."
2004705-100 = "Наши сердца похожи на замок, а воспоминания — его краеугольные камни. С таким драгоценным фундаментом... он ведь не рухнет так легко, правда?"
2004705-101 = "Как этот момент с вами..."
2004705-102 = ""
2004705-104 = ""
2004705-105 = "...!"
2004705-106 = "Н-Неважно. Забудьте."
2004705-107 = "Я опять наболтала какой-то нелепицы."
2004705-108 = ""
2004705-112 = "Хм? Сенсей. Замок сейчас трясётся..."
2004705-113 = "[ns] «...Кикё!»"
2004705-114 = "Ч-Что вы...?"
2004705-115 = ""
2004705-118 = "Кья...!"
2004705-119 = ""
2004705-121 = ""
2004705-125 = "С-Сенсей?!"
2004705-126 = "[s9] «Создание воспоминаний оставь мне!»\n[s10] «Теперь твоя очередь принимать песочную ванну, Кикё!»"
2004705-129 = "Я не против, но сначала..."
2004705-130 = "Куклы упали, Сенсей."
2004705-131 = ""
2004705-135 = "После этого мы с Кикё играли вместе в песке, по очереди закапывая друг друга."
