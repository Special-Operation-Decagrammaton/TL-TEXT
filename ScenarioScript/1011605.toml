[translation]
1011605-1 = "Ответная благодарность"
1011605-2 = "Я отправился на встречу с Саори."
1011605-3 = "Но..."
1011605-7 = ""
1011605-8 = "..."
1011605-9 = "[ns] «Э-Эм... Саори?»"
1011605-10 = ""
1011605-12 = ""
1011605-13 = "А, Сенсей. Я ждала тебя."
1011605-14 = "Пойдём. Куда ты хочешь отправиться?"
1011605-15 = "[ns] «П-Подождите!»"
1011605-17 = "[ns] «Ты всё это время ждала... вот так?»"
1011605-18 = "Я слышала, что для особых случаев принято наряжаться..."
1011605-19 = ""
1011605-21 = ""
1011605-22 = "О-о... Какое элегантное платье. Она из богатой семьи?"
1011605-23 = "Она потерялась?"
1011605-24 = "Какая красивая... Может, попросить её сфотографироваться?"
1011605-25 = ""
1011605-28 = ""
1011605-29 = "Сенсей... На нас смотрят? Что-то не так?"
1011605-30 = "[ns1] «Б-Бежим отсюда!»\n[ns2] «Тут какой-то зоопарк!»"
1011605-33 = ""
1011605-35 = ""
1011605-36 = "Хм? Постой. Сенсей...?"
1011605-37 = ""
1011605-39 = ""
1011605-43 = "Когда мы отошли подальше..."
1011605-45 = ""
1011605-46 = "Я объяснил Саори, в чём дело."
1011605-47 = ""
1011605-49 = ""
1011605-50 = ""
1011605-52 = ""
1011605-53 = "...Вот как? Это моя вина."
1011605-54 = "Если бы мы остались, я выставила бы нас на посмешище."
1011605-55 = "Как неловко. Я поставила тебя в неудобное положение."
1011605-56 = "Прости. Я хотела отблагодарить тебя за помощь."
1011605-57 = "Но, похоже, только испортила нашу прогулку."
1011605-58 = "Я переоденусь, если дашь мне минутку..."
1011605-59 = ""
1011605-61 = ""
1011605-62 = "...Хм? Тебе так больше нравится? Почему?"
1011605-63 = "[s3] «Потому что ты надела его ради меня!»\n[s4] «Не могу позволить твоим стараниям пропасть зря!»"
1011605-66 = "Ц...!"
1011605-67 = "Н-Но я не могу пойти с тобой куда-нибудь поесть в таком виде..."
1011605-68 = "...Что? Ты сам приготовишь ужин? Почему?"
1011605-69 = "[s5] «Потому что хочу отплатить тебе тем же.»\n[s6] «Ты хорошо потрудилась, Саори, и заслужила награду.»"
1011605-72 = "Т-Так вот как ты на это смотришь..."
1011605-73 = "...Хорошо. Сделаю, как скажешь."
1011605-74 = "Мне тоже любопытно попробовать твою готовку."
1011605-75 = "[ns] «Ну, это уже повод отпраздновать.»"
1011605-77 = "[ns] «Давай сфотографируемся!»"
1011605-78 = "Фотография..."
1011605-79 = "Хорошо."
1011605-80 = "[s] «Хм? Ты разрешишь? Правда?»"
1011605-81 = "Ты помог мне научиться позировать. От ещё одной фотографии хуже не станет."
1011605-82 = "...Кстати, у меня кое-что для тебя есть."
1011605-83 = "Вот."
1011605-84 = ""
1011605-86 = ""
1011605-87 = ""
1011605-88 = ""
1011605-89 = ""
1011605-91 = ""
1011605-93 = "Это модный журнал... с моей фотографией."
1011605-94 = "С твоей помощью я стала... девушкой с обложки."
1011605-95 = "Они были очень впечатлены. Сказали, что позовут меня и на другие съёмки."
1011605-96 = "Так что мне не только заплатили — после съёмки ещё и разрешили оставить платье себе."
1011605-97 = "И всё благодаря тебе. Поэтому я хотела отдать тебе этот журнал раньше, чем его увидит кто-нибудь ещё..."
1011605-98 = "[ns] «О-о, так про тебя тут целая статья?»"
1011605-101 = "П-Постой! Сенсей! Ты собираешься читать это прямо при мне?"
1011605-102 = "[ns7] «Ты отлично справилась, Саори! Я так горжусь!»\n[ns8] «Ого, какая взрослая и элегантная!»"
1011605-103 = ""
1011605-104 = ""
1011605-110 = "Х-Хватит. Перестань сравнивать меня с фотографией в журнале!"
1011605-111 = "После всей ретуши там на меня почти не похоже."
1011605-112 = "...Хм? Ты не согласен?"
1011605-113 = "[ns] «О, вот это выражение лица сейчас идеально!»"
1011605-115 = "[ns] «Давай запечатлеем его на память!»"
1011605-116 = "...Цок!"
1011605-117 = "Л-Ладно. Но..."
1011605-118 = ""
1011605-120 = ""
1011605-121 = "Эта фотография только ДЛЯ ТЕБЯ, понял?"
1011605-122 = "[ns] «Ура-а!»"
1011605-131 = "После нашей личной фотосессии я приготовил еду, и мы поужинали вместе с Саори."
