[translation]
1005006-1 = "...Только один раз, честно!"
1005006-2 = "Центр города"
1005006-3 = "Мы с Коконой пришли в морковный ресторан."
1005006-4 = "Не могу поверить, что вы действительно меня сюда привели."
1005006-5 = "И что морковный ресторан вообще существует..."
1005006-6 = "Ого. Они ПРАВДА любят морковь, да?"
1005006-7 = "Морковь на шторах, на лестнице..."
1005006-8 = "Даже вывеска — огромная морковь!"
1005006-9 = "Сенсей, нам не обязательно это делать. Ещё не поздно уйти."
1005006-10 = "Вообще, вы настолько решительно настроены, что я начинаю переживать: вас что, промыла мозги Большая Морковь?!"
1005006-11 = "Точно! Вам промыли мозги! Не переживайте, Сенсей! Я вас спасу!"
1005006-12 = ""
1005006-14 = ""
1005006-15 = "Я рассмеялся и успокоил Кокону, пока мы вместе заходили в ресторан."
1005006-16 = "Стойте! Стойте!!! Пожалуйста, не заставляйте меня туда идти! С настоящей леди так нельзя!"
1005006-17 = "Я знаю, что вы пытаетесь сделать добро, но правда—"
1005006-18 = "У-а-а-а-а!"
1005006-20 = "Морковтопия"
1005006-21 = "Ух. Буквально в КАЖДОМ блюде есть морковь."
1005006-22 = "Что вы хотите?"
1005006-23 = "Эм..."
1005006-24 = "Закажите вы, Сенсей."
1005006-25 = "[s] «Я?»"
1005006-26 = "Вы привели меня сюда, значит знаете, что здесь вкусное."
1005006-27 = "Так что закажите за нас обоих."
1005006-28 = "Я всё равно это возненавижу, но хотя бы не настолько сильно."
1005006-30 = "Я улыбнулся про себя и заказал блюдо из секретного меню."
1005006-31 = "Еду принесли быстро."
1005006-33 = "[s] «Приятного аппетита!»"
1005006-34 = "Ладно... Ух..."
1005006-35 = "Кокона неохотно поднесла вилку ко рту."
1005006-36 = "Она немного пожевала. А потом..."
1005006-37 = "Так..."
1005006-38 = "Сладко! И почему-то одновременно пикантно? И мягко!"
1005006-39 = "Не может быть, что это морковь!"
1005006-40 = "Так они готовят её на пару, чтобы сохранить сладость, а потом жарят на сливочном масле... Хм!"
1005006-41 = "Хотите, чтобы я попробовала этот соус? Хорошо..."
1005006-42 = "О-о-о! Так вкусно!"
1005006-45 = "― Но...[wa:1360]"
1005006-47 = "― Просто чтобы вы знали... я всё ещё ненавижу морковь.[wa:1500]"
1005006-50 = "― Я ем её только ради вас...[wa:1600]"
1005006-52 = "― ...и потому что я инструктор. Не потому, что сама хочу.[wa:420]"
1005006-55 = "― Понятно?"
1005006-57 = "― Это не моя вина, что вы такой упрямый.[wa:560]"
1005006-60 = "― Наверное...[wa:1040]"
1005006-62 = "― Если мне уж совсем придётся её есть—[wa:460]"
1005006-65 = "― Морковь, я имею в виду..."
1005006-67 = "― Я приду сюда."
1005006-70 = "― Это первое место, куда я пришла вместе с вами.[wa:590]"
1005006-72 = "― Поэтому теперь оно особенное.[wa:120]"
1005006-75 = "― Понимаете? Дело не в моркови. Дело в компании.[wa:10]"
1005006-77 = "― Хорошо?"
1005006-80 = "― В любом случае...[wa:1250]"
1005006-82 = "― Наверное... морковь не так плоха, как я думала.[wa:1160]"
1005006-85 = "Я съела всю порцию!"
1005006-86 = "[s] «Ну и? Как тебе?»"
1005006-87 = "Было... вкусно."
1005006-88 = "Наверное, в этот раз вы доказали, что я ошибалась."
1005006-89 = "Но когда-нибудь я отомщу вам за то, что заставили меня есть морковь."
1005006-90 = "А значит, вам придётся ещё раз провести со мной время."
1005006-91 = "Хорошо?"
