[translation]
2000803-1 = "Неважно, это срочно!"
2000803-2 = "(Когда я пришёл к месту встречи, Ако уже ждала.)"
2000803-5 = ""
2000803-6 = "Уф."
2000803-7 = "[s] «У тебя глаза как у мёртвой женщины!»"
2000803-8 = "Ты пришёл, Сенсей."
2000803-9 = "«Что-то случилось?», спрашиваете?"
2000803-10 = ""
2000803-12 = ""
2000803-13 = "Да. Случилось. И вообще-то много чего."
2000803-14 = "*вздох* Серьёзно..."
2000803-15 = "Всё началось сегодня утром во время проверки присутствующих."
2000803-16 = "Как только я вошла в клубную комнату Префекторской команды, обнаружила нечто невероятное."
2000803-17 = "Из всех возможных вещей..."
2000803-18 = "Лифт сломался!"
2000803-19 = "[s] «А, вот чем ты собираешься заниматься.»"
2000803-20 = "Да! Поэтому весь день мне пришлось ходить вверх и вниз по лестнице! Хотите верьте, хотите нет, но я чрезвычайно занятой человек. Мне нужно встречаться с людьми и постоянно куда-то идти!"
2000803-21 = "Только сегодня я, наверное, поднялась больше чем на сто лестничных пролётов!"
2000803-22 = "[s] «Эм... Д-Должно быть, тяжело.»"
2000803-23 = "И это ещё не всё! На обед только мне одной досталась подгоревшая крокета."
2000803-24 = "Потом во время патруля начался дождь."
2000803-25 = "Хлеб, который я оставила в холодильнике на потом, оказался просроченным."
2000803-26 = "Мой обычный маршрут перекрыли из-за стройки, и пришлось идти в обход."
2000803-27 = "Весь мой день прошёл вот так!"
2000803-28 = "Вы что, не чувствуете эту злобу в воздухе?!"
2000803-29 = "[s1] «Не думаю, что это вызвано чьей-то злобой...»\n[s2] «По крайней мере, одна из этих вещей явно произошла по твоей вине, Ако.»"
2000803-30 = "Нет, это явно злоба какого-то завистливого вредителя, который пытается подорвать меня — старшего администратора Префекторской команды!"
2000803-31 = "Нет, это явно злоба какого-то завистливого вредителя, который пытается подорвать меня — старшего администратора Префекторской команды!"
2000803-32 = "Е-Если нет, тогда давайте поспорим! Если я права, вы прямо здесь станцуете голышом!"
2000803-33 = "[s] «Опять эта ерунда.»"
2000803-34 = "Вдобавок мне вручили совершенно неразборчивый документ от Общества Пандемониума."
2000803-35 = "Они хотят, чтобы мы исследовали и доложили о корреляции между размерами обуви всех членов Префекторской команды и количеством осадков за последние десять лет. Что это вообще значит?!"
2000803-36 = "Откуда мне знать, сколько дождя выпало за последние десять лет?! И при чём тут размеры обуви?"
2000803-37 = "[s3] «Мы ценим, как усердно ты работаешь.»\n[s4] «Вот здесь я и правда чувствую некоторую злобу.»"
2000803-38 = "И это ещё не всё. После этого произошло..."
2000803-39 = "И это ещё не всё. После этого произошло..."
2000803-40 = "[s] «Ещё что-то?!»"
2000803-42 = "(После этого Ако ещё очень долго продолжала жаловаться.)"
2000803-45 = "Хм-м... Хорошо."
2000803-46 = "Это всё, что случилось сегодня?"
2000803-47 = "О, если подумать, моё время почти вышло. На сегодня придётся разойтись."
2000803-48 = "[s] «А. То есть срочное дело, ради которого ты хотела меня увидеть, было...»"
2000803-49 = "Хм? Мы ведь только что с ним закончили, разве нет?"
2000803-50 = "[s] «Ох.»"
2000803-51 = ""
2000803-53 = ""
2000803-54 = ""
2000803-55 = "Хи-хи. В следующий раз снова вам позвоню, Сенсей!"
2000803-57 = "(Почему-то, прощаясь, Ако выглядела заметно посвежевшей.)"
