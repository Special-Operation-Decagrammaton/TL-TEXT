10028010-50 = "Приём."
10028010-51 = ""
10028010-56 = ""
10028010-57 = "Это я! Что вам понадобилось, Хасуми?"
10028010-58 = "Спасибо, что пришла так быстро, Ичика."
10028010-59 = "Ты хорошо отдохнула? Прости, что позвала так рано."
10028010-60 = "Под глазами ни мешков, кожа сияет! Я готова ко всему."
10028010-61 = "А судя по тону... случилось что-то плохое, да?"
10028010-62 = "Я бы не сказала, что обязательно плохое, но ты права: я позвала тебя не на чаепитие."
10028010-63 = "Мы с Цуруги оценили и обсудили ситуацию и решили, что именно ты лучше всего подходишь для этого."
10028010-64 = "Даже Цуруги так считает? Подхожу для чего именно...?"
10028010-65 = "Эм... Вы сказали, что ничего плохого, но..."
10028010-66 = "Возможно, я подала всё страшнее, чем есть. Мы бы не отправили тебя одну на сложную миссию."
10028010-67 = "Это простая задача по доставке. Нужно забрать и доставить Чаепитию чрезвычайно важную сумку. Сегодня."
10028010-68 = "Единственная настоящая проблема — место получения немного дальше, чем ожидалось..."
10028010-69 = "Ты общительная и поддерживаешь много дружеских связей в других районах. Полная противоположность мне или Цуруги."
10028010-70 = "Думаю, понятно, почему мы сочли эту задачу более подходящей именно для твоих способностей."
10028010-71 = "Так уже понятнее. Просто нужно день поработать вашей девочкой на побегушках, да?"
10028010-72 = "По сути. Но должна подчеркнуть, что это не просто обычное поручение."
10028010-73 = "От успешной доставки этой сумки зависит очень многое."
10028010-74 = ""
10028010-75 = "Настолько, что Нагиса лично попросила нас помочь."
10028010-76 = "Если кратко..."
10028010-77 = ""
10028010-79 = ""
10028010-81 = ""
10028010-82 = ""
10028010-83 = "Ты будешь доставлять реликвию, которая может повлиять на саму способность Чаепития удерживать власть в Тринити."
10028010-84 = ""
10028010-85 = ""
10028010-87 = ""
10028010-88 = "...Не стоило мне называть это обычным поручением."
10028010-89 = "Ты справишься. Но..."
10028010-90 = "Есть ещё кое-что."
10028010-91 = "На личном уровне эта вторая задача для меня так же важна, как и доставка."
10028010-92 = ""
10028010-94 = ""
10028010-95 = "Когда будешь забирать предмет, там будет Сенсей, и обратно вы поедете одним поездом."
10028010-96 = "Я хочу, чтобы ты обеспечила безопасное возвращение Сенсея вместе с предметом."
10028010-97 = "Просто... без помощи Сенсея мы вообще не смогли бы получить эту реликвию."
10028010-98 = "Было бы неправильно с нашей стороны не позаботиться в ответ о его безопасности и комфорте."
10028010-99 = ""
10028010-101 = ""
10028010-102 = "А?"
10028010-103 = "...Сенсей? Сенсей тоже будет там?"
10028010-104 = "Да. Понимаю, что ещё сильнее нагружаю тебя своей просьбой. Наш официальный приказ касается только безопасной доставки реликвии."
10028010-105 = "Если боишься, что это хоть как-то помешает обязанностям, ставь приказ выше."
10028010-106 = ""
10028010-108 = ""
10028010-110 = ""
10028010-111 = "Что скажешь? Всё это тебя устраивает, Ичика?"
10028010-112 = "Хм..."
10028010-113 = "Кажется, я поняла ситуацию. Дай секунду всё обдумать..."
10028010-114 = "Сенсей, значит... Интересно..."
10028010-115 = "Сумка... Сенсей... Поезд... Хм..."
10028010-116 = "Хи-хи."
10028010-117 = "Думаю, всё нормально. Только дорогу туда придётся провести одной, а обратно я ещё и смогу немного побыть с Сенсеем?"
10028010-118 = "То есть..."
10028010-119 = "Что самое плохое вообще может случиться при доставке сумки? Уверена, всё пройдёт гладко."
10028010-120 = ""
10028010-122 = ""
10028010-124 = ""
10028010-125 = "Считайте, дело сделано!"
10028010-126 = ""
10028010-127 = "И вот я здесь!"
10028010-128 = "Раз... И!"
10028010-129 = ""
10028010-132 = ""
10028010-135 = ""
10028010-138 = ""
10028010-141 = ""
10028010-143 = ""
10028010-145 = ""
10028010-148 = ""
10028010-150 = ""
10028010-152 = ""
10028010-155 = ""
10028010-158 = ""
10028010-161 = ""
10028010-164 = ""
10028010-167 = ""
10028010-170 = ""
10028010-173 = ""
10028010-176 = ""
10028010-179 = ""
10028010-181 = ""
10028010-184 = ""
10028010-185 = "Фух."
10028010-186 = "Слава богу, это последний багаж. Давно я так не потела."
10028010-187 = "От имени Спецотряда правосудия... нет, всей академии Тринити, спасибо вам, Сенсей."
10028010-188 = "В любой другой день с моей стороны было бы довольно нагло такое говорить. Но на этой миссии я выступаю специальным представителем!"
10028010-189 = "Нужно соответствовать такой важной роли! Хи-хи."
10028010-190 = "[s1] «Сегодня ты хорошо потрудилась, Ичика.»\n[s2] «Ты более чем справляешься.»"
10028010-193 = "Вы шутите? Моя поездка сюда ничего не значила бы без вашей тяжёлой работы и работы команды раскопок."
10028010-194 = "Я всего лишь присоединилась к уборке, раз уж всё равно приехала за сумкой."
10028010-195 = "И в итоге оно того стоило! Я всё ещё поражена... Этот чайный сервиз восходит к самому первому собранию Чаепития."
10028010-196 = "Слава богу, его сохранили все эти годы. Это действительно важная часть нашей истории."
10028010-197 = "Подумать только, его спрятали за пределами Тринити..."
10028010-198 = "...Хм?"
10028010-199 = "А! Почему этот чайный сервиз настолько важен?"
10028010-200 = "Чаепитие попросило вас приехать сюда и всё это раскопать, ничего не объяснив? Хаха. Очень на них похоже."
10028010-201 = "Это не то чтобы большой секрет. Хм, с чего начать..."
10028010-202 = "Думаю, всё сводится к легитимности."
10028010-203 = "Вы и так прекрасно знаете о напряжении между Чаепитием, Рыцарями помощи и Сестринством, учитывая всё, что происходило в последнее время."
10028010-204 = "Поэтому, когда равновесие власти вот так шатается, именно такая символическая реликвия им и нужна. Впечатляющее напоминание о том, насколько древняя история у Чаепития."
10028010-205 = "Именно поэтому им понадобились здесь и вы. Чтобы придать процессу легитимность и убедиться, что всё пройдёт хорошо."
10028010-206 = "А чтобы поддержать вас в этом деле, здесь я!"
10028010-207 = "Иными словами..."
10028010-208 = "Сегодня я исполнительный помощник Сенсея!"
10028010-209 = "Надеюсь, вы понимаете, какая это редкая возможность для вас. Не упускайте её и просите меня о чём угодно!"
10028010-210 = "Не стесняйтесь на меня полагаться, хорошо?"
10028010-211 = "[s3] «Ты всегда была надёжной. Спасибо, Ичика.»\n[s4] «Тогда я буду рассчитывать на тебя, Ичика.»"
10028010-214 = "Хи-хи-хи. Если за это можно получать такую похвалу, я готова быть вашим помощником в любое время!"
10028010-215 = "Если честно, я давно хотела хотя бы раз поработать вместе с вами."
10028010-216 = "Цуруги, Хасуми и Маширо постоянно о вас говорят, знаете."
10028010-217 = "Не смотрите так тревожно! Все трое только хвалили вас."
10028010-218 = "«Сенсей очень добрый,» и «Рядом с ним почему-то очень уютно.» Что-то в таком духе."
10028010-219 = "Именно потому, что они так хорошо о вас отзывались, мне стало немного любопытно."
10028010-220 = "Но моя работа не так уж часто пересекается с вашей..."
10028010-221 = "...Что?"
10028010-222 = "Мне не нужна причина, чтобы с вами связаться?"
10028010-223 = "...Хаха."
10028010-224 = "Это очень мило с вашей стороны, но мне бы не хотелось доставлять неудобства."
10028010-225 = "Не хочу, чтобы сейчас вы говорили, что всё нормально, а потом начали на меня злиться."
10028010-226 = "Я сильная и самостоятельный студент! Не маленький ребёнок, за которым нужно присматривать."
10028010-227 = "Но взамен, когда наши пути всё-таки пересекаются вот так..."
10028010-228 = "Можете уделить мне чуть больше внимания, хорошо?"
10028010-229 = ""
10028010-231 = ""
10028010-232 = "...Хаха."
10028010-233 = "Не обращайте внимания, я просто болтаю. Давайте погрузим остальной багаж!"
10028010-234 = ""
10028010-236 = ""
10028010-237 = ""
10028010-238 = "Почти всё оборудование здесь уже убрано, так что..."
10028010-239 = "Хм?"
10028010-240 = "Чайный сервиз? Он в белой сумке."
10028010-241 = "Не волнуйтесь! Я надёжно упаковала его ещё до того, как мы начали сворачивать лагерь."
10028010-242 = "Он уже безопасно загружен в багажный вагон! Не хватает только нас."
10028010-243 = ""
10028010-247 = "А?"
10028010-248 = ""
10028010-250 = ""
10028010-251 = "Что вы имеете в виду? Почему ему не быть в багажном вагоне?"
10028010-252 = "Мы ведь... вместе возвращаемся поездом, да?"
10028010-253 = "А?"
10028010-254 = "Поезд будет только через три часа...?"
10028010-255 = "Что значит он отправляется в 6:10..."
10028010-256 = ""
10028010-258 = ""
10028010-259 = ""
10028010-260 = "Сейчас только 3:00!"
10028010-261 = "Нет, нет. Так не может быть."
10028010-262 = "Когда я приехала, мне дали расписание поездов... Смотрите, вот..."
10028010-263 = ""
10028010-265 = ""
10028010-266 = "Погодите, погодите. Если я ошиблась, тогда..."
10028010-267 = "В какой поезд я только что загрузила свою сумку?!"
10028010-268 = ""
10028010-272 = "Внимание всем пассажирам. Внимание всем пассажирам."
10028010-273 = "Поезд до Геенны скоро отправляется."
10028010-274 = "Просим занять свои места. Подготовьте билеты для проверки проводником."
10028010-275 = "Повторяем: поезд до Геенны скоро отправляется. Все по вагонам!"
10028010-276 = ""
10028010-278 = ""
10028010-279 = ""
10028010-280 = "Геенн...?"
10028010-282 = "Диктор только что сказал... Геенна?"
