[translation]
10009010-130 = "#video;10009"
10009010-1 = "Эпизод 1;Первое нападение!"
10009010-2 = "Центральная улица D.U."
10009010-4 = "Хм. Мы патрулируем уже довольно долго, но пока так и не встретили ни одного трупа."
10009010-5 = "Прошу прощения. Я хотела сказать — раненого."
10009010-6 = "[s] «Почему ты звучишь так разочарованно?»"
10009010-7 = "Пожалуйста, не поймите неправильно. Разумеется, я не желаю видеть трупы."
10009010-8 = "То есть я не хочу, чтобы кто-то пострадал..."
10009010-9 = "Хотя... возможно, во мне и правда есть мрачное любопытство."
10009010-10 = "[s] «Вот! Я так и знал!»"
10009010-11 = "Но я искренне говорю, что не хочу, чтобы кто-либо пострадал."
10009010-12 = "В конце концов, специфика нашего клуба такова: если работы нет,#nзначит царит мир."
10009010-13 = "[s] «Похоже, ты много об этом думала.»"
10009010-14 = "Да, но это не значит, что я не могу всё равно быть разочарована."
10009010-15 = "[s] «И мы снова вернулись к началу!»"
10009010-17 = "Мы с Сэной продолжали беседовать, пока не дошли до конца улицы."
10009010-22 = "Перезапуск системы безопасности завершён."
10009010-23 = "Теперь проблем быть не должно."
10009010-24 = "Большое спасибо! Вы, студенты Веритас, лучшие.#nТеперь мы будем готовы ко всему."
10009010-25 = "Не за что..."
10009010-26 = ""
10009010-28 = ""
10009010-29 = "Тогда я пойду."
10009010-30 = "[s] «Эй, Чихиро.»"
10009010-31 = "Хм? Сенсей?"
10009010-32 = "Кто это с вами? Студент из Геенны?"
10009010-33 = "Вы двое — довольно неожиданная компания для Дня святого Валентина."
10009010-34 = "Это должно означать..."
10009010-35 = "Я патрулирую праздничную зону вместе с Сенсеем."
10009010-36 = "Моя обязанность — высматривать трупы."
10009010-37 = "Трупы...? Это патрулирование вообще санкционировано?"
10009010-38 = "[s] «Это обычный патруль безопасности...! А ты чем занимаешься, Чихиро?»"
10009010-39 = "Чем яростнее вы это отрицаете, тем подозрительнее звучите..."
10009010-40 = "...но раз вы так говорите."
10009010-41 = "Что до меня, Валькирия попросила проверить системы безопасности вокруг фестиваля."
10009010-42 = "Я обновлю устаревшее оборудование и проверю, соответствуют ли нормам датчики, системы пожаротушения и прочее."
10009010-43 = "Чтобы такие крупные мероприятия были безопасны для всех, требуется немало работы."
10009010-44 = "[s] «Похоже, у тебя дел по горло.»"
10009010-45 = "Ничего, с чем я бы не справилась."
10009010-46 = "К тому же это официальный запрос, направленный прямо в Веритас.#nМне приходится подхватывать работу, пока президент Химари взяла отпуск."
10009010-47 = "К тому же сегодня День святого Валентина, верно?"
10009010-48 = "Естественно, мне хочется, чтобы все смогли им насладиться."
10009010-49 = "[s] «Ты потрясающая, Чихиро.»"
10009010-50 = "Не нужно мне льстить..."
10009010-51 = "Так вы говорили, что патрулируете?"
10009010-52 = ""
10009010-54 = ""
10009010-55 = "Мне ещё нужно проверить несколько систем безопасности.#nХотите пойти со мной?"
10009010-56 = "Почему бы и нет. Возможно, где-то нас уже ждут трупы."
10009010-57 = "То есть раненые, которым нужна наша помощь."
10009010-58 = "Понятно... Вы точно не задумали ничего незаконного?"
10009010-59 = "[s] «Клянусь!»"
10009010-62 = "*зевает* Сопровождать преступников — скучнее некуда."
10009010-63 = "Фубуки! Капитан тебя отчитает, если увидит, как ты зеваешь!"
10009010-64 = "Ты слишком много переживаешь. Попробуй немного расслабиться."
10009010-65 = "Я-я вовсе не... и вообще, постарайся не забывать, кого именно мы сопровождаем."
10009010-66 = "Вот видишь? Слишком много переживаешь, как я и сказала."
10009010-67 = "Я просто проявляю должную осторожность."
10009010-68 = "В конце концов, мы имеем дело с одной из печально известных семи преступниц, сумевших сбежать из Исправительного бюро..."
10009010-70 = "...Лисой Бедствий!"
10009010-71 = "Я слышала, после побега она даже собрала других нарушителей и напала на Генеральный студенческий совет! Даже им было непросто с ней справиться."
10009010-73 = "Разве это не потому, что они были заняты после исчезновения президента Генерального студенческого совета?"
10009010-74 = "И всё же расслабляться нельзя — особенно если слух, который я недавно услышала, правдив."
10009010-75 = "Какой слух?"
10009010-76 = "Говорят, Лиса Бедствий настолько злая и жестокая..."
10009010-77 = "...что способна околдовать любого, с кем соприкоснётся, и заставить делать всё, что она скажет!"
10009010-78 = ""
10009010-80 = ""
10009010-81 = "Ты слишком много аниме смотришь."
10009010-82 = "Расслабься немного. Ты и ПРАВДА вечно переживаешь."
10009010-83 = "Правда?"
10009010-84 = "Подумай сама. Здесь не только мы, но и Бюро безопасности."
10009010-85 = "После ареста у неё забрали всё, кроме одежды и маски.#nДаже Лиса Бедствий не сможет сбежать без оружия."
10009010-86 = "Это было бы совершенно невозможно, если только она не сделана из магии или что-то—"
10009010-87 = ""
10009010-90 = "Что это было?"
10009010-91 = "Вот что бывает из-за твоего длинного языка!"
10009010-92 = ""
10009010-97 = "Это был взрыв...?"
10009010-98 = "Может, где-то трубу прорвало?"
10009010-99 = "[s] «Что-то подсказывает, что нам так не повезло...»"
10009010-100 = ""
10009010-102 = ""
10009010-103 = "Срочные новости! Несколько мгновений назад внезапно взорвался полицейский фургон Валькирии, перевозивший преступницу в Исправительное бюро!"
10009010-104 = "Прямо сейчас несколько банд воспользовались ситуацией и устроили хаос!"
10009010-105 = ""
10009010-109 = ""
10009010-110 = "Сенсей, приём!"
10009010-111 = "[s] «Фубуки?»"
10009010-112 = "Только что сбежала Лиса Бедствий. Она мобилизовала банды, чтобы угнать бронемашину и украсть оружие у Полицейской академии Валькирии!"
10009010-113 = "Нам нужна ваша помощь, Сенсей!"
10009010-114 = "Если мы её не поймаем, всё будет куда хуже объяснительной — мне ещё могут урезать отпуск!"
10009010-115 = "В последний раз её видели направляющейся к—"
10009010-116 = ""
10009010-119 = ""
10009010-120 = ""
10009010-121 = "[ns] «Кажется, я её нашёл.»"
10009010-122 = ""
10009010-123 = "Хи-хи... Я знаю этот запах."
10009010-124 = ""
10009010-126 = ""
10009010-127 = "Если я выбрала добычу, она от меня уже не уйдёт!"