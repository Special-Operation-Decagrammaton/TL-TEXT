[translation]
2006302-1 = "The Girl's Pickup"
2006302-2 = "Parking Lot 2"
2006302-3 = "(As we head to Parking Lot 2...)"
2006302-8 = "(Azusa is already waiting for me.)"
2006302-9 = "You're here, Sensei."
2006302-10 = "I've been assigned as the deputy tank commander. #nSince I'll also be acting as the driver, I'll be operating the tank."
2006302-11 = "I have a reasonable amount of confidence in my driving skills, at least."
2006302-12 = "Though, I'm not really used to driving in the city..."
2006302-13 = "Unfamiliar places, unfamiliar people, unfamiliar lives—#nI'm getting used to it bit by bit, but I'm still nervous."
2006302-14 = "That's why I wanted you to accompany me for practice."
2006302-15 = "[s] \"With pleasure!\""
2006302-16 = "You always accept me just like that."
2006302-17 = "Well then, let's hop in the tank—"
2006302-21 = "—Hm?"
2006302-25 = "Hmm...?"
2006302-29 = "[ns] \"What's wrong?\""
2006302-30 = "The tank... isn't here."
2006302-31 = "I'm sure I parked it around here..."
2006302-32 = "[s] \"Sometimes you just forget things...!?\""
2006302-33 = "Even though I'm always supposed to remember the pickup spot."
2006302-34 = "It's surprisingly easy to forget where you parked your vehicle."
2006302-35 = "The remote key's... battery must be dead. Looks like I have no choice but to look for it visually."
2006302-42 = "...This is it. #nThough I feel like the location is slightly different from my memory."
2006302-43 = "I'll review what went wrong later. I need to be more careful next time."
2006302-47 = "Huh? The engine is already running. #nIt seems to have a feature that starts up automatically when you get close."
2006302-48 = "[s] \"...Hm?\""
2006302-49 = "Come on, let's get in."
2006302-61 = "Eh?! Ah, g-good work, Senior—Eh?!"
2006302-62 = "Senior...?"
2006302-63 = "It's Shirasu Azusa."
2006302-64 = "By the way, what are you doing in my vehicle?"
2006302-65 = "This is a Justice Realization Committee tank, you know?!"
2006302-66 = "That's strange."
2006302-67 = "I can understand why you'd make a mistake. It's the same kind of tank, after all. #nJust to be safe, we should double-check."
2006302-68 = "[s] \"I think this really is the Justice Realization Committee's!\""
2006302-69 = "Eh?!"
2006302-72 = "To make a mistake like this... How embarrassing."
2006302-73 = "Thank you for apologizing with me, Sensei."
2006302-74 = "The model was the same and the parking spot was similar. #nThat's why... I mistook it for the Crusader."
2006302-75 = "...So, where is my tank?"
2006302-76 = "To forget something like this is proof that I've let my guard down. #nI need to reflect on this..."
2006302-80 = "Hm? I got a message."
2006302-85 = "It was moved for a vehicle inspection—"
2006302-86 = "—Apparently."
2006302-87 = "So it wasn't that I forgot the location after all."
2006302-88 = "[s] \"No wonder you couldn't find it!\""
2006302-89 = "Hah... Thank goodness."
2006302-90 = "I panicked a little, thinking I had become this absent-minded."
2006302-91 = "[s1] \"This is totally normal!\"\n[s2] \"Anyone can make a silly mistake like that!\""
2006302-94 = "Is that so?"
2006302-95 = "An ordinary, silly mistake..."
2006302-96 = "I see. This isn't negligence... It's just a normal thing."
2006302-97 = "...Is that right? Hehe. So that's how it is."
2006302-98 = "If that's the case, I'm a bit relieved. Thank you, Sensei."
2006302-102 = "Well, since we don't have the tank anymore... Let's take a break somewhere."
2006302-103 = "[s] \"What about your driving practice?\""
2006302-104 = "It's fine."
2006302-105 = "Because today, I learned about an 'ordinary daily life' instead."
