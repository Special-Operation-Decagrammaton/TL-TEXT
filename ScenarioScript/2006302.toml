[translation]
2006302-1 = "Her Pick-up"
2006302-2 = "Parking Lot No.2"
2006302-3 = "(When I arrived at the second parking lot—)"
2006302-8 = "(Azusa was already there waiting for me.)"
2006302-9 = "You've come, Sensei."
2006302-10 = "For this race, I was assigned the role of deputy tank commander. #nI'll be doubling as our driver as well."
2006302-11 = "I'm more or less confident in my driving skills."
2006302-12 = "However, I'm not used to driving around town yet..."
2006302-13 = "Being in an unfamiliar place, with unfamiliar people, living an unfamiliar life— #nEven if I'm slowly getting used to it, it still makes me nervous."
2006302-14 = "That's why I'd like you to join me while I practice."
2006302-15 = "[s] \"Sure thing!\""
2006302-16 = "You're always so ready to agree."
2006302-17 = "In that case, let's get on the tank..."
2006302-21 = "...Hm?"
2006302-25 = "Hmmm...?"
2006302-29 = "[ns] \"What's wrong?\""
2006302-30 = "The tank's... gone."
2006302-31 = "I'm pretty certain I parked it here..."
2006302-32 = "[s] \"It's normal to forget sometimes...!\""
2006302-33 = "I should've kept reminding myself of the pick-up location."
2006302-34 = "It's always so easy for me to forget where I parked."
2006302-35 = "And the key fob... is out of power. We'll have to search for the tank ourselves."
2006302-42 = "...Here it is. #nIt's a little different from where I remember parking it though."
2006302-43 = "I'll reflect on this after we're done. I need to be more careful next time."
2006302-47 = "Weird. The engine's already running. #nI suppose it starts up when you get close."
2006302-48 = "[s] \"...Uh?\""
2006302-49 = "Let's hop on aboard."
2006302-61 = "Huh!? Ah, g-good work, Senpa... Eh!?"
2006302-62 = "Senpai...?"
2006302-63 = "I'm Shirasu Azusa."
2006302-64 = "By the way, what're you doing in my tank?"
2006302-65 = "This tank belongs to the Justice Task Force though!?"
2006302-66 = "Strange."
2006302-67 = "I understand if you got them mixed up. We do use the same model after all. #nMaybe you should double check just to be sure."
2006302-68 = "[s] \"I'm pretty sure this IS one of the JTF's tanks, actually!\""
2006302-69 = "Huh!?"
2006302-72 = "What an embarrassing mix up..."
2006302-73 = "Thanks for apologizing with me, Sensei."
2006302-74 = "It was the same model and parked in a similar spot... #nThat's why I mistook it for Crusader-chan."
2006302-75 = "...So where is the tank then?"
2006302-76 = "I must be letting my guard down to have forgotten something like this. #nI really need to reflect over this later..."
2006302-80 = "Hm? I got a message."
2006302-85 = "Looks like the tank had to be inspected and..."
2006302-86 = "...was moved away."
2006302-87 = "Seems I didn't forget where I parked after all."
2006302-88 = "[s] \"So that's why we couldn't find it!\""
2006302-89 = "Phew... Thank goodness."
2006302-90 = "I was beginning to panic, thinking that I'd lost my edge."
2006302-91 = "[s1] \"That's just normal!\"\n[s2] \"Everyone makes these kinds of simple mistakes!\""
2006302-94 = "Really?"
2006302-95 = "So it was a normal, simple mistake..."
2006302-96 = "I see. So this wasn't my negligence... just something normal that happens."
2006302-97 = "...I see. Hehe, so that's how it is."
2006302-98 = "That makes me feel a little better. Thanks, Sensei."
2006302-102 = "Well, if we can't use the tank... then let's find a place to rest instead."
2006302-103 = "[s] \"What about your driving practice?\""
2006302-104 = "It's fine."
2006302-105 = "I learned something else today instead—living a normal life."