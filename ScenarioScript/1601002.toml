[translation]
1601002-1 = "Скрытые привычки мастера"
1601002-2 = "Рынок тканей, окраина города Шиба"
1601002-4 = "Я встретил Хибики на рынке неподалёку от Шале."
1601002-5 = ""
1601002-7 = ""
1601002-8 = "...Привет, Сенсей."
1601002-9 = "Неожиданно видеть тебя в таком месте в выходной."
1601002-10 = "Что привело тебя в магазин тканей?"
1601002-11 = "...Нужно заменить шторы в Шале?"
1601002-12 = "Верно, D.U. не лучшее место для таких покупок."
1601002-13 = "Если нужна ткань, подходящая для камуфляжа, могу посоветовать одно место..."
1601002-14 = "[s] «Это шторы, Хибики. Мне нужна обычная ткань.»"
1601002-16 = "[ns] «А ты? Что тебя сюда привело?»"
1601002-17 = "...Я?"
1601002-18 = "Я покупаю ткань для новой одежды."
1601002-19 = "Заказывать через интернет удобнее, но..."
1601002-20 = "Одежда касается кожи, поэтому важно лично проверить, какая ткань на ощупь."
1601002-21 = "[s1] «Ты сама шьёшь одежду?»\n[s2] «Это очень впечатляет, Хибики.»"
1601002-24 = "Ну, я не то чтобы сама шью повседневную одежду..."
1601002-25 = "Это для косплея."
1601002-26 = "[s] «Косплея...?»"
1601002-27 = "Да. Тебе нравится косплей?"
1601002-28 = "[s3] «Я известный ценитель косплея.»\n[s4] «Я не очень с ним знаком...»"
1601002-29 = "Это хорошо. Тогда мне не придётся много объяснять."
1601002-30 = "Косплей — это когда ты переодеваешься в вымышленного персонажа и изображаешь его."
1601002-31 = "Поскольку наряды вымышленных персонажей бывают довольно... необычными, готовой одежды с такими дизайнами часто не существует, поэтому косплееры воссоздают её сами."
1601002-32 = "Сначала я просто смотрела видео, чтобы научиться делать одежду для ходячих манекенов..."
1601002-33 = "Но потом сильно увлеклась."
1601002-34 = "[s] «Тебе нравится шить одежду?»"
1601002-35 = "Шить одежду — это неплохо... Но больше всего мне нравится ощущение, будто я становлюсь другим человеком."
1601002-36 = "Косплей — это не только переодевание. Нужно по-настоящему передать сущность персонажа, которого изображаешь."
1601002-37 = "Нельзя просто вести себя как обычный человек в необычном костюме — нужно выглядеть как искатель приключений, странствующий между мирами, или как маг, владеющий тайным искусством."
1601002-38 = "Косплей полезен и инженерам: он учит смотреть на вещи с разных точек зрения."
1601002-39 = "К тому же... можно ненадолго попробовать совсем другую жизнь... Ну, совсем чуть-чуть..."
1601002-40 = "[s5] «Как на спортивном празднике?»\n[s6] «Когда ты была болельщицей?»"
1601002-41 = ""
1601002-42 = ""
1601002-44 = ""
1601002-45 = "Н-Не смейся надо мной, Сенсей."
1601002-46 = "Тогда у меня просто не хватило времени, чтобы полностью вжиться в роль болельщицы."
1601002-47 = "И тот костюм болельщицы был моей первой попыткой косплея, поэтому я немного стеснялась..."
1601002-48 = "Следующий мой косплей болельщицы будет лучше, вот увидишь."
1601002-49 = "[s7] «То есть...»\n[s8] «Ты снова собираешься куда-то в образе болельщицы?»"
1601002-50 = "Ну... обещать не буду, но..."
1601002-51 = "Ну... обещать не буду, но..."
1601002-52 = "То есть, если мне понадобится кого-то поддержать, почему бы заодно не надеть костюм?"
1601002-53 = "Как я и говорила, косплей — это не только одежда. Подходящая ситуация помогает погрузиться в образ сильнее, чем любая ткань."
1601002-54 = "[s] «И какой косплей ты планируешь сейчас?»"
1601002-55 = "...Отличный вопрос, Сенсей."
1601002-56 = "Я собираюсь сделать костюм героини популярного сериала «Мирная жизнь сильнейшего управляющего оружейной фабрикой в другом мире»."
1601002-57 = ""
1601002-59 = ""
1601002-61 = ""
1601002-63 = ""
1601002-64 = "Эта героиня работала учёным в современном мире, поэтому даже в средневековом окружении носит белый лабораторный халат."
1601002-65 = "Конечно, поскольку синтез полимеров в том мире ещё не развит, полиэстеровый лабораторный халат там был бы невозможен."
1601002-66 = "Если говорить о ткани, подходящей средневековому сеттингу, то, скорее всего, это лён..."
1601002-67 = "Но судя по ключевым иллюстрациям, ткань там слишком грубая и лёгкая."
1601002-68 = "Как думаешь, Сенсей? Какая ткань лучше всего передаст образ этого персонажа?"
1601002-69 = ""
1601002-72 = "[ns] «...Просто выбрать похожие цвета?»"
1601002-73 = "Неверно. Точное историческое исследование — важная часть погружения."
1601002-74 = "Как мастер Миллениума, я ни в чём не иду на компромиссы, когда что-то создаю."
1601002-75 = "[s] «Очень по-хибиковски.»"
1601002-76 = "Хм... Кажется, вон там есть магазин, специализирующийся на натуральных тканях."
1601002-77 = "А ещё у них должны быть ткани спокойных оттенков, хорошо блокирующие свет, так что ты сможешь купить материал для новых штор."
1601002-78 = ""
1601002-80 = ""
1601002-81 = "Пойдём выбирать вместе?"
1601002-83 = "Мы с Хибики отлично провели время, выбирая ткани. В основном выбирала она."
