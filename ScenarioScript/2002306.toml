[translation]
2002306-1 = "Мечта директора"
2002306-2 = "Исполнительный офис Шале"
2002306-3 = "Обычный день, такой же, как все остальные..."
2002306-4 = ""
2002306-9 = "[ns] «Канна...? Что случилось?»"
2002306-10 = "Эм, Сенсей? Простите, что отвлекаю вас, когда вы заняты, но..."
2002306-11 = "Можно попросить вас ненадолго помочь мне?"
2002306-12 = "[s1] «Да, конечно.»\n[s2] «Ты нечасто просишь меня о помощи.»"
2002306-15 = "Да, дело в том... что я столкнулась с проблемой, которая мне неподвластна..."
2002306-16 = "*всхлип* Уаа-а-а-а..."
2002306-17 = ""
2002306-19 = ""
2002306-20 = "[ns] «Это ребёнок плачет?»"
2002306-21 = "Да. Именно в этом и проблема."
2002306-23 = ""
2002306-24 = "По дороге обратно в школу после задания я встретила потерявшегося ребёнка."
2002306-25 = "УААААА!"
2002306-28 = "[ns3] «Ты пыталась найти дом потерявшегося ребёнка?»\n[ns4] «То есть ты не можешь успокоить ребёнка, Канна?»"
2002306-31 = "Да. Всё верно."
2002306-32 = "Бюро общественного порядка редко приходится иметь дело с маленькими детьми..."
2002306-33 = "Я не пыталась её запугать, но, похоже, случайно напугала ребёнка."
2002306-34 = "*шмыг* *всхлип*"
2002306-35 = "Я пыталась немного расспросить её, чтобы собрать сведения, но что бы я ни говорила, она не перестаёт плакать. Разговор совсем не продвигается."
2002306-36 = "Я также пыталась связаться с Бюро общественной безопасности и передать ребёнка им, но они все ушли на обед..."
2002306-37 = "У вас есть идеи, как её успокоить?"
2002306-38 = "[s] «А если скорчить смешную рожицу?»"
2002306-39 = "Смешную рожицу?"
2002306-40 = "Попробую."
2002306-41 = ""
2002306-43 = ""
2002306-44 = "Простите. Пожалуйста, посмотрите сюда."
2002306-45 = "(улыбается)"
2002306-46 = "УААААА!"
2002306-47 = ""
2002306-49 = ""
2002306-50 = "Не сработало."
2002306-51 = "[ns] «Печально.»"
2002306-53 = "[ns] «Я сейчас же приеду. Скинешь адрес?»"
2002306-54 = "Что? Вы хотите приехать и помочь лично?"
2002306-55 = "Не стоит. За защиту и помощь потерявшимся гражданам отвечает Полицейская школа «Валькирия»."
2002306-56 = "Я не могу просить вас помогать с обычными обязанностями «Валькирии», когда вы и так так заняты—"
2002306-57 = "УААААААААААА!"
2002306-58 = ""
2002306-60 = ""
2002306-61 = "...Я буду ждать у входа на 5-ю улицу в северном районе Шиба-тауна, D.U."
2002306-63 = "Я поспешил по адресу, который дала Канна, и успокоил испуганного ребёнка, выяснив домашний адрес и номер телефона."
2002306-64 = "В конце концов мы нашли студента Бюро общественной безопасности, которая благополучно отвела потерявшегося ребёнка домой."
2002306-66 = ""
2002306-67 = "...Фух. Я у вас в долгу."
2002306-68 = "Если бы вы не вмешались, я, возможно, запаниковала бы не меньше ребёнка. Получился бы полный бардак."
2002306-69 = "Хотя я благодарна вам за помощь... я директор Полицейской школы «Валькирия». Мне стыдно, что я не смогла сама справиться даже с одним потерявшимся ребёнком."
2002306-70 = "Когда-то я даже думала вступить в Бюро общественной безопасности, но старшекурсницы отговорили меня. Хорошо, что я их послушала."
2002306-71 = "Нелюдимая Бешеная Гончая из Бюро общественной безопасности только усугубляла бы любые проблемы."
2002306-72 = "Как бы то ни было. Хорошо, что в итоге мы нашли сотрудницу Бюро общественной безопасности."
2002306-73 = "[s] «Мне кажется, ты и в Бюро общественной безопасности отлично справлялась бы, Канна.»"
2002306-74 = "Серьёзно?"
2002306-75 = "Не понимаю, с чего вы так решили. Офицеру, который даже не умеет как следует успокоить маленького ребёнка, вряд ли стоит поручать жалобы граждан."
2002306-76 = "В «Валькирии» этот талант часто недооценивают, но умение приветствовать людей с улыбкой и внушать им спокойствие — дар, который у одних есть от природы, а у других нет."
2002306-77 = "Я как раз из тех, кому его от природы не досталось."
2002306-78 = "[ns] «Но ты всё равно продолжала пытаться успокоить плачущего ребёнка.»"
2002306-80 = "[ns5] «Любая проблема кажется сложной, когда сталкиваешься с ней впервые.»\n[ns6] «Разницу в природных способностях можно компенсировать трудом.»"
2002306-83 = ""
2002306-85 = ""
2002306-86 = "Хм..."
2002306-87 = "Может быть. Но думать об этом уже особого смысла нет. Я выбрала другой путь."
2002306-88 = "Это была бы жизнь Огаты Канны, а не Бешеной Гончей..."
2002306-89 = "И всё же мне кажется, что роль Бешеной Гончей подходит мне лучше всего."
2002306-90 = "В любом случае, ещё раз спасибо за помощь."
2002306-91 = "До следующей встречи... увидимся, когда увидимся."
2002306-92 = ""
2002306-94 = ""
