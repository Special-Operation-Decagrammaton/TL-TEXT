[translation]
10042040-1 = "Эпизод 4;Лили Марлен"
10042040-2 = "Комната Префектурной команды Геенны"
10042040-3 = "..."
10042040-4 = "[s1] «Эм... Ако, ты в порядке?»\n[s2] «Мне повторить?»"
10042040-7 = "Нет, и я вас услышала. Повторять не нужно. Это ничего не изменит."
10042040-8 = "Я просто... скажем так, удивлена, что вы воспользовались горячей линией Дисциплинарного комитета, чтобы сообщить о..."
10042040-9 = "...«сбежавшем блинчике». Я ничего не упустила?"
10042040-10 = "[s] «Реакция понятная, но...»"
10042040-11 = "Простите, все. Можно я просто кое-что скажу? Я уже двое суток не спала."
10042040-12 = ""
10042040-15 = "Да, мы знаем, старший администратор. Из-за нашего внезапного выезда вам опять приходится разгребать всю офисную работу."
10042040-16 = "Нет, я не... Я не пытаюсь никого отчитывать..."
10042040-17 = ""
10042040-19 = ""
10042040-20 = "...Фух."
10042040-21 = "Не поймите неправильно. Подхватывать чужую работу в таких случаях — часть моих обязанностей. Это не проблема."
10042040-22 = "Но я хочу заметить, что подобный «кризис» для Геенны вовсе не новость..."
10042040-23 = "...и я считаю, что вы все ДОЛЖНЫ быть способны справиться с ним самостоятельно."
10042040-24 = "...Особенно раз вы там вместе с ними, Сенсей."
10042040-25 = "[s3] «Справедливо, но это уже далеко за пределами нормы...»\n[s4] «Думаю, ты передумаешь, когда приедешь сюда...»"
10042040-28 = "Что...?"
10042040-29 = "Никогда не думала, что услышу такое от вас, Сенсей."
10042040-30 = "Обычно вы просто говорите: «Оставьте это мне!» — и на этом всё."
10042040-31 = ""
10042040-33 = ""
10042040-34 = "Значит, либо всё и ПРАВДА невероятно серьёзно..."
10042040-35 = "...либо это часть какого-то вашего тайного плана."
10042040-36 = "Откуда мне знать, что вы не пытаетесь выманить меня на какую-нибудь тайную вечеринку со скрытыми камерами или чем-то подобным?"
10042040-37 = "[s5] «Прошу, думай обо мне немного лучше.»\n[s6] «Нет, я серьёзно. Всё действительно очень плохо.»"
10042040-40 = "Я же сказала...!"
10042040-41 = ""
10042040-43 = ""
10042040-44 = "*вздыхает*"
10042040-45 = "Ладно, хорошо, просто подождите. Дайте мне немного прийти в себя..."
10042040-46 = "Я сейчас на взводе только потому, что не выспалась."
10042040-47 = "И ПОТОМУ, что кое-кто позвонил на горячую линию из-за «сбежавшего блинчика»."
10042040-48 = "[s7] «Если не будешь вредничать, я угощу тебя чем-нибудь вкусным.»\n[s8] «Ну вот, теперь ты уже просто издеваешься!»"
10042040-49 = "...? Хм, вот как?"
10042040-50 = "Уверена, потом мне не придётся вам об этом напоминать, правда? Правда ведь?"
10042040-51 = "Ну да, кто-то тут определённо вредничает..."
10042040-52 = "В любом случае позже выкроим время в вашем расписании, и вы загладите передо мной вину. Понятно?"
10042040-53 = "[s] «Сэна сделала эти фотографии как доказательство. Посмотри.»"
10042040-54 = "...? Фотодоказательства от главы Клуба экстренной медицинской помощи...?"
10042040-55 = "Хорошо. Я посмотрю."
10042040-56 = ""
10042040-58 = ""
10042040-59 = ""
10042040-60 = "...Вы уверены, что эти фотографии никак не подделаны?"
10042040-61 = ""
10042040-64 = "Я бы никогда не стала делать ничего подобного."
10042040-65 = "О, я знаю. Просто это настолько невероятно. Надеюсь, я вас не обидела."
10042040-66 = "Хм... Понятно."
10042040-67 = "Я всегда верю лишь половине того, что говорит Сенсей, но главе Клуба экстренной медицинской помощи? Вам я доверяю безоговорочно."
10042040-68 = "Так что у меня просто нет выбора, кроме как поверить вам."
10042040-69 = "[s] «...? Это что ещё значит насчёт моих слов?»"
10042040-70 = "Я же сказала, что верю половине! Ведите себя соответственно возрасту, хорошо?"
10042040-71 = "В любом случае теперь проблема мне ясна."
10042040-72 = "С учётом показаний Клуба экстренной медицинской помощи и фотодоказательств Дисциплинарный комитет сделает всё возможное для подготовки. Я сама выдвинусь на место."
10042040-73 = "(Клянусь, если это какая-то чушь со скрытой камерой...)"
10042040-74 = "А вы, Сенсей, два дня поработаете с Дисциплинарным комитетом... Нет, чтобы мы были в расчёте, будете работать непосредственно на меня."
10042040-75 = "Что вы собираетесь делать, старший администратор...?"
10042040-76 = "Всё довольно просто."
10042040-77 = "Если проблема настолько большая, решение тоже должно быть соответствующего масштаба."
10042040-78 = "[s9] «Соответствующего масштаба...?»\n[s10] «Ако...?»"
10042040-81 = "Мне нужно сделать кое-какие приготовления по снабжению, так что, если позволите..."
10042040-82 = "(По крайней мере, об огневой мощи переживать не придётся...)"
10042040-83 = "С-Старший администратор...?"
10042040-84 = "Старший администратор Ако—"
10042040-85 = ""
10042040-91 = "Внимание. Всем членам Дисциплинарного комитета, находящимся в резерве."
10042040-92 = "Подготовьте столько 88-мм орудий FlaK 36, сколько сможете!"
10042040-93 = "88-мм FlaK 36? Все до единого?"
10042040-94 = "Именно. Мне нужны все доступные Acht-Acht!"
10042040-95 = "К-Для какой операции вообще нужна такая огневая мощь...? Вы уверены?"
10042040-96 = "С самого утра нам не поступало никаких подобных приказов..."
10042040-97 = "Это личная просьба Сенсея. Этого достаточно, чтобы ответить на ваши вопросы?"
10042040-98 = "О-От Сенсея?!"
10042040-99 = "Поняла. Подготовим всё немедленно!"
10042040-100 = ""
10042040-102 = ""
10042040-103 = "...Раз Сенсей предельно ясно дал понять, насколько всё серьёзно..."
10042040-104 = "...нам тоже следует отнестись к этому со всей серьёзностью."
10042040-105 = "Кроме того, будет приятно, если Сенсей окажется у нас в долгу."
10042040-106 = "Ха, да. Уже есть чего ждать!"
10042040-108 = "Район Геенны"
10042040-109 = "[ns] «Что там вообще задумала Ако?»"
10042040-110 = "У меня есть догадка."
10042040-111 = "В конце она упомянула огневую мощь, поэтому подозреваю, что она вытащит 88-миллиметровки."
10042040-112 = "Но не уверена, что такая артиллерия даст нужный эффект в городской застройке, где мешает множество зданий."
10042040-113 = "Если цель на ходу укроется между зданиями, вывести её на чистую линию огня будет трудно."
10042040-114 = "...Если их это вообще волнует, конечно."
10042040-115 = "[s] «Это всё больше похоже на плохую идею.»"
10042040-116 = "Кто знает? В другой академии, конечно, могли бы поступить иначе."
10042040-117 = "Но здесь, в Геенне, это обычные будни."
10042040-118 = "...Если только Макото из Общества Пандемониума не вмешается."
10042040-119 = "[s] «А.»"
10042040-120 = "Да. Если действия Дисциплинарного комитета приведут к сообщениям о серьёзном ущербе..."
10042040-121 = "...я даже представить не могу, что по этому поводу может устроить председатель Макото."
10042040-122 = "Уверена, старший администратор держит это в уме."
10042040-123 = "Но она выглядела не в своей тарелке, так что, возможно, сейчас её суждения не самые здравые..."
10042040-124 = "Простите... Из-за меня у всех проблемы... Даже у Сенсея..."
10042040-125 = "Я уже говорила и повторю ещё раз. В тот момент ты была слишком занята, Джури. Ты ничего не могла сделать."
10042040-126 = "И, ну..."
10042040-127 = "Уверена, всё будет хорошо. За исключением ещё нескольких тел..."
10042040-128 = "...то есть ещё нескольких пострадавших, которых отправят в Клуб экстренной медицинской помощи."
10042040-129 = "Т-Ты уверена, что это считается «хорошо»?!"
10042040-130 = "Не вижу причин считать иначе. Знаю, прозвучит бестактно, но регулярные поездки в Клуб экстренной медицинской помощи..."
10042040-131 = "...ну, по крайней мере в Геенне, это так же естественно, как дышать."
10042040-132 = "Эм, простите. Я понимаю, к чему вы клоните, но, пожалуйста, помните, что мы все стоим здесь и всё слышим."
10042040-133 = "...Прошу прощения."
10042040-134 = ""
10042040-136 = ""
10042040-139 = "Сенсей? Старший администратор снова нам написала."
10042040-140 = "Она приказала определить местоположение блинчика методом триангуляции к её прибытию."
10042040-141 = "Понятно. Что ж, мы всё равно уже шли по его следу."
10042040-142 = "Тогда продолжим по плану."
