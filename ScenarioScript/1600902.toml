[translation]
1600902-1 = "Девушки-ниндзя привередливы"
1600902-3 = "Как обычно, я тонул в горе работы."
1600902-4 = ""
1600902-8 = "[ns] «Хм... Неплохо бы поесть.»"
1600902-9 = "Сегодня я ещё ничего не ел, поэтому решил сходить за обедом."
1600902-12 = "[ns] «Нужно возвращаться к работе. Значит, лапша в стакане.»"
1600902-14 = "[ns] «Так. Через три минуты будет готово.»"
1600902-16 = "(Я ждал, пока заварится лапша быстрого приготовления.)"
1600902-17 = ""
1600902-19 = ""
1600902-20 = ""
1600902-21 = "[ns] «А?»"
1600902-23 = ""
1600902-24 = ""
1600902-25 = "[ns] «...Хм.»"
1600902-26 = ""
1600902-27 = ""
1600902-28 = "[ns] «...Хмммммм.»"
1600902-31 = "[ns] «Время...»"
1600902-33 = ""
1600902-34 = "Сейчас! Пока он потерял бдительность!"
1600902-35 = ""
1600902-38 = "А-а-а-а-а!"
1600902-41 = ""
1600902-42 = "Как вы ускользнули из моей идеальной засады?!"
1600902-43 = "[s] «Разве плохо, что я ускользнул?!»"
1600902-44 = "Хмф!"
1600902-45 = "О!"
1600902-46 = "Вы настоящий мастер, достопочтенный Сенсей! Как вы уклонились от моей тщательно подготовленной засады?"
1600902-47 = "[s] «Ты стояла прямо у всех на виду.»"
1600902-48 = "Ха-ха-ха! Правда?"
1600902-49 = "«Я насквозь вижу твою засаду!» — уверенные слова победителя!"
1600902-50 = "Да! Мне нравится!"
1600902-51 = "Я чувствую огромную боевую мощь!"
1600902-52 = "Исходя из всего этого... Да. У вас определённо есть потенциал!"
1600902-53 = "[s1] «Потенциал? Какой ещё потенциал?»\n[s2] «Кстати, Мичиру... Моя лапша...»"
1600902-54 = "Какой же ещё потенциал? Конечно, потенциал ниндзя!"
1600902-55 = "Какой же ещё потенциал? Конечно, потенциал ниндзя!"
1600902-56 = "[s] «Ниндзя...?»"
1600902-57 = "Да! Я знаю, о чём вы думаете!"
1600902-58 = "Путь к становлению ниндзя кажется слишком сложным. Я понимаю вашу тревогу."
1600902-59 = "Не спешите, вы ведь только новичок. Начинать нужно медленно и заложить хорошую основу."
1600902-60 = "Например, можно начать как фанат ниндзя."
1600902-61 = "[s] «То есть если фанат ниндзя прокачается, он станет ниндзя?»"
1600902-62 = "Я вас раскусила! Вы из тех, кто не любит начинать с новичка, да?"
1600902-63 = "Какие амбиции!"
1600902-64 = "Но мне нравится ваша страсть!"
1600902-65 = "[s] «Кажется, ты меня вообще не слушаешь.»"
1600902-66 = "Но всё нормально, Сенсей! Я Чидори Мичиру, президент благородного Клуба исследования ниндзюцу!"
1600902-67 = "Ну... пока неофициального, но потенциал у нас огромный!"
1600902-68 = "В общем! Для таких, как вы, Клуб исследования ниндзюцу рекомендует «План Б: становление ниндзя»!"
1600902-69 = "[s] «Мне сейчас пирамиду продают?»"
1600902-70 = "Если не хотите идти уровень за уровнем, есть другой путь!"
1600902-71 = "Как выбор класса в обучении!"
1600902-72 = "Вместо фаната ниндзя можете начать черепахой."
1600902-73 = "[s3] «Ты кадровое агентство открыла?»\n[s4] «Как вообще черепаха станет ниндзя?!»"
1600902-74 = "У черепах огромный потенциал стать ниндзя! И они любят пиццу!"
1600902-75 = "Ну же! У черепах огромный потенциал стать ниндзя! И они любят пиццу!"
1600902-76 = "Но если начать в канализации, путь будет тяжёлым. И всё же это вполне возможно, особенно если вы живёте где-нибудь с новейшей канализационной системой Миллениума..."
1600902-77 = "[s] «Так, Мичиру... Зачем ты пришла?»"
1600902-78 = "О! Я совсем ушла в сторону из-за нашего разговора!"
1600902-79 = "Сенсей! У нас большая проблема! Огромная! Мы в беде!"
1600902-80 = "Как вы уже знаете, мы ведём видеоканал «Мичиручи: свиток девушки-ниндзя.»"
1600902-81 = "[s5] «О да. Помню.»\n[s6] «Там вы делитесь техниками ниндзюцу?»"
1600902-82 = "Да, мы выкладываем видео дважды в неделю. Скоро нужно загрузить новое... Но я вообще не знаю, что снимать дальше..."
1600902-83 = "Да, мы выкладываем видео дважды в неделю. Скоро нужно загрузить новое... Но я вообще не знаю, что снимать дальше..."
1600902-84 = "Мы полностью зашли в тупик! Нас загнали в угол! Можно уже назвать следующее видео «Мичиру! Кризис юности!»"
1600902-85 = "Вот почему я написала вам в MomoTalk. Просто совсем забыла объяснить остальное!"
1600902-86 = "[s] «То есть такой кризис у тебя бывает дважды в неделю, Мичиру?»"
1600902-87 = "Но важнее другое! Я подумала, что вы сможете мне помочь!"
1600902-88 = "У вас могут быть идеи, до которых я не додумалась."
1600902-89 = "Взрослые же должны быть супермозговитыми, правда?"
1600902-90 = "Вот поэтому я и устроила засаду!"
1600902-91 = "[s7] «Я на такое вообще не подписывался!»\n[s8] «Больше никогда не устраивай на меня засад!»"
1600902-92 = "Сенсей, пожалуйста! У меня есть несколько идей... Проблема в том, что мы не знаем, в каком направлении двигаться. Можете выбрать?"
1600902-93 = "Сенсей, пожалуйста! У меня есть несколько идей... Проблема в том, что мы не знаем, в каком направлении двигаться. Можете выбрать?"
1600902-94 = "Например, как вам такое? «Обзор десяти лучших инструментов ниндзюцу, которыми пользуются настоящие паркур-ниндзя!»"
1600902-95 = "Или... «Подробный разбор CG в игровом фильме „Уничтожитель ниндзя“»!"
1600902-96 = "О, или вот: «Почему ниндзя всегда кладут в рамен много чеснока и добавляют тясю?»"
1600902-97 = "[s9] «Как ты вообще придумала последнее?»\n[s10] «Ниндзя правда так едят рамен?»"
1600902-98 = "Детали, детали. Какой вариант вам нравится больше всего, достопочтенный Сенсей?"
1600902-99 = "Детали, детали. Какой вариант вам нравится больше всего, достопочтенный Сенсей?"
1600902-100 = "Какой сильнее пробуждает интерес к ниндзя?"
1600902-101 = "Какой заставляет подумать: «Ого! Ниндзя — лучшие!»?"
1600902-102 = "И, может быть: «Кто президент Клуба исследования ниндзюцу, снявший это видео? Она что, гений?»"
1600902-103 = "Что думаешь?"
1600902-104 = "[s] «Слишком большая ответственность...»"
1600902-105 = "Если есть другие предложения, я вся внимание!"
1600902-106 = "Цель Клуба исследования ниндзюцу — рассказать о ниндзя как можно большему числу людей и однажды получить статус официального клуба!"
1600902-107 = "Мы готовы на всё ради этого! А поскольку я вас уважаю, я уверена, что вы предложите что-то новаторское!"
1600902-108 = "[s] «Эм... А что насчёт...»"
1600902-109 = "О! Я знала, что у вас будет потрясающая идея!"
1600902-110 = "[s11] «Как насчёт „Кто самый сильный ниндзя из фильмов и сериалов?“»\n[s12] «А „Кто самый быстрый ниндзя из фильмов и сериалов?“»\n[s13] «Или „Кто самый крутой ниндзя из фильмов и сериалов?“»"
1600902-111 = "Что?!"
1600902-112 = "Что?!"
1600902-113 = "Что?!"
1600902-114 = "[s] «Просто существует так много разных фильмов и сериалов про ниндзя...»"
1600902-115 = "..."
1600902-116 = "[s] «Какой ниндзя самый... Эм, Мичиру? Ты выглядишь страшно...»"
1600902-117 = "Нет, нет, нет, нет, нет! Сенсей! Это ужасно!"
1600902-118 = "Как мы вообще смеем сравнивать ниндзя из разных произведений! По каким параметрам проводить анализ?"
1600902-119 = "Существуют бесчисленные произведения с ниндзя! Романы, комиксы, фильмы, аниме..."
1600902-120 = "Есть шедевры от «Шиба-ину Ван-Ван» до истории, которую я написала в тетрадке!"
1600902-121 = "[s] «Ты сама что-то написала? Вот это преданность.»"
1600902-122 = "У каждого из этих произведений свой мир и собственный лор. Это совершенно разные вселенные!"
1600902-123 = "Если учитывать лор, разницу в уровнях силы между ниндзя и бесчисленное множество других вещей, составить рейтинг невозможно!"
1600902-124 = "Но самое главное — это полностью игнорирует саму сущность ниндзя! Ниндзя постоянно меняются и развиваются! Такое видео делать нельзя!"
1600902-125 = "*всхлипывает* Вы такой нуб!"
1600902-126 = "[s] «Почему мне кажется, будто я совершил преступление?»"
1600902-127 = "Вы просто не понимаете! Так, Сенсей. Пожалуйста, садитесь."
1600902-128 = "Пришло время рассказать вам о величии ниндзя и их глубоких истоках!"
1600902-129 = "[s] «Мичиру, моя лапша!»"
1600902-130 = "Итак, видите ли, Сенсей. Ниндзя появлялись в медиа ещё с..."
1600902-131 = "[s] «...Я сдаюсь.»"
1600902-133 = "Мичиру держала меня в заложниках три часа, читая лекцию о том, что она назвала краткой версией истории ниндзя."
1600902-134 = "Разумеется, моя лапша быстрого приготовления остыла и размокла."
