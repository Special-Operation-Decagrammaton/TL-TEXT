[translation]
42200-1 = "Episódio 20;A Caverna de Carbanog (1)"
42200-2 = "Silo - Sala de Operações"
42200-5 = "\"...Os coelhos caíram na armadilha.\""
42200-6 = "FOX 1 iniciando a operação.#nTodos os membros, mantenham suas posições a qualquer custo e reportem a situação conforme necessário."
42200-10 = "Aqui é FOX 4. Um drone inimigo avistado e abatido no Ponto Alfa."
42200-11 = "Achei que fossem avançar com tudo de cara, mas... a líder Miyako é cautelosa como sempre. Estão bem focadas."
42200-12 = "Só que, depois disso, não houve nenhum movimento digno de nota."
42200-13 = "Será que estão tramando alguma coisa interessante?"
42200-14 = "FOX 4, não baixe a guarda.#nMesmo sendo alunas do primeiro ano, elas também são da SRT."
42200-15 = "Entendiiido."
42200-16 = "Como aquele tiro pode ter entregado a minha posição,#nvou mudar de lugar e entro em contato de novo."
42200-20 = "Aqui é FOX 3. Atualmente em posição no Ponto Lima — perto da entrada do elevador central que leva à sala de operações."
42200-21 = "A passagem à frente é estreita por causa dos corrimãos, então acho que dou conta sozinha."
42200-22 = "Mesmo que tenham sorte de desviar dos disparos da atiradora, não vão passar pelo meu escudo."
42200-23 = "Ei, espera aí, FOX 3. Não posso deixar isso passar batido."
42200-24 = "Você acha mesmo que eu erraria um alvo correndo num corredor estreito?"
42200-25 = "Não tô duvidando da sua mira, mas#ne se várias integrantes do Esquadrão RABBIT avançarem juntas de uma vez?"
42200-26 = "Se o seu rifle de precisão fosse de cano duplo, eu até considerava."
42200-27 = "Opa, até que não é uma má ideia, né?"
42200-29 = "FOX 4, priorize a cobertura da FOX 3 e concentre-se em deter o avanço inimigo."
42200-30 = "Elas sabem que há uma atiradora de elite. Certamente vão invadir com alguma contramedida."
42200-31 = "...No pior dos casos, podem tentar nos pegar de surpresa contornando a rota."
42200-33 = "O princípio da guerra especial é controlar as variáveis em um campo de batalha em constante mudança#ne manter a superioridade numérica."
42200-34 = "Só pela vantagem geográfica e pelo desempenho do equipamento, nosso poder de combate já supera o delas.#nSe lidarmos bem com as variáveis, o sucesso da operação é garantido."
42200-36 = "...Faz todo sentido."
42200-37 = "Bem, a Yukino... quer dizer, a FOX 1 sempre está certa."
42200-38 = "E é exatamente por isso que podemos confiar e seguir as ordens dela, não é?"
42200-40 = "Se entenderam, chega de conversa paralela.#nPreparem-se, logo será a Hora H."
42200-46 = "Aqui é FOX 2. Coloquei em modo offline o controle remoto do elevador central que leva à sala de operações."
42200-47 = "Assim, não importa o que a Moe-chan tente, ela não vai conseguir hackear."
42200-48 = "...Mas será que isso não é um pouco de exagero?#nMesmo sendo nossas calouras, acho que elas não vão chegar tão longe..."
42200-49 = "É melhor prevenir do que remediar. Operadoras de forças especiais devem sempre agir prevendo o pior cenário."
42200-50 = "..."
42200-51 = "Yukino-chan..."
42200-52 = "Não, espera... FOX 1, você acha mesmo que podemos perder para o Esquadrão RABBIT?"
42200-53 = "...Nada neste mundo é absoluto, então não é impossível."
42200-57 = "Se por acaso... até a FOX 2 for derrotada e elas romperem a linha..."
42200-58 = "Todas devem subir à superfície e aguardar a próxima ordem."
42200-63 = "Ué? Não era pra gente se reagrupar com a FOX 1 e contra-atacar?"
42200-64 = "Mesmo perdendo poder de fogo, se ainda pudermos nos mexer, não seria melhor dar suporte na retaguarda—"
42200-66 = "Não. Se permitirmos que o inimigo se aproxime da sala de operações, a operação estará praticamente fracassada."
42200-67 = "Quero que subam à superfície e garantam a rota de fuga para podermos evacuar rapidamente."
42200-69 = "Até faz sentido, mas..."
42200-70 = "Se a capitã está dizendo isso... deve ter algum motivo em mente."
42200-72 = "FOX 1, por acaso..."
42200-74 = "...É uma ordem, Niko."
42200-75 = "Apenas desta vez, peço que não pergunte o motivo."
42200-81 = "...Entendido."
42200-84 = "O objetivo desta operação é capturar ou neutralizar a bomba termobárica <A.N.T.I.O.C.H.> trazida para este silo e impedir sua detonação."
42200-85 = "Atualmente, a ogiva já está instalada no silo, e todo o controle é feito na sala de operações, no nível inferior da instalação."
42200-86 = "Para neutralizar a ogiva, primeiro precisamos tomar a sala de operações, mas..."
42200-92 = "...Fica bem mais fundo do que eu pensava."
42200-94 = "Sim. Como a sala de operações fica na parte mais profunda do silo, precisaremos descer pelo elevador central."
42200-95 = "Além disso, não há cobertura no caminho até o elevador... A rota é fixa e totalmente aberta, então ficaremos expostas à linha de visão da atiradora."
42200-96 = "Tem pontos de tiro demais aqui... Vai ser difícil até identificar a posição dela."
42200-97 = "O mais seguro seria neutralizar a atiradora antes de avançar, mas... resta pouquíssimo tempo até a detonação da ogiva."
42200-98 = "...Portanto, para não dar margem de reação ao inimigo, faremos um ataque surpresa com todo o esquadrão."
42200-99 = "Rápido como o vento ao avançar, feroz como o fogo ao atacar.#nÉ o básico da arte da guerra."
42200-100 = "E quais são os pontos específicos que exigem atenção?"
42200-104 = "Bem... há uma grande chance de o inimigo estar de emboscada aqui, no Ponto Lima."
42200-105 = "RABBIT 2, após neutralizar o inimigo, assegure o console de controle do elevador central."
42200-106 = "Em seguida, RABBIT 3, assim que o console estiver seguro, tente hackeá-lo para assumir o controle do elevador."
42200-108 = "Sem problema. Pode deixar comigo~"
42200-109 = "E-E eu, o que devo fazer...?"
42200-111 = "RABBIT 4..."
42200-112 = "Esconda-se no ponto de tiro da escadaria externa e, assim que a atiradora disparar contra a nossa batedora... calcule a distância e a direção para o contratiro, por favor."
42200-113 = "Calcular a direção e a distância do ponto de disparo tudo bem, mas..."
42200-114 = "E se a Saki-chan acabar se machucando com esse tiro...?"
42200-115 = "Fica tranquila. Quem tem medo de bala não serve pra ser batedora."
42200-116 = "Este capacete e este colete à prova de balas servem justamente pra isso. Não se preocupe!"
42200-117 = "T-Tudo bem...!"
42200-119 = "Hmm, entendi o plano, mas... e se der errado? Não tem um Plano B?"
42200-120 = "Se a Saki for neutralizada, se eu falhar no hack ou se a Miyu errar o contratiro, o plano inteiro vai por água abaixo, sabia?"
42200-125 = "Não preparei... nenhum plano alternativo."
42200-126 = "Hã? Como assim?"
42200-127 = "Vocês são o esquadrão mais forte sob o meu comando."
42200-128 = "Por sermos uma força especial mais rápida, forte e furtiva do que qualquer outra — sequer consigo imaginar perdermos em guerra especial."
42200-130 = "Portanto, confiem umas nas outras — e entrem nesta operação partindo do princípio de que todas vamos vencer."
42200-131 = "...Porque eu também confio em todas vocês."
42200-133 = "...De todos os planos que você já fez, Miyako, esse é o mais idiota."
42200-134 = "P-Parece que eu falei tanta besteira assim...?"
42200-135 = "Mas, bem... é uma ordem da nossa líder, não é?"
42200-139 = "RABBIT 2, cumprindo a ordem."
42200-140 = "...Moe, Miyu. Conto com vocês para o suporte na retaguarda."
42200-143 = "Pode deixar!"
42200-148 = "Então... iniciar invasão!"
