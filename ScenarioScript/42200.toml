[translation]
42200-1 = "Эпизод 20; Пещера Каэрбаннога 1"
42200-2 = "Операционная комната шахты"
42200-4 = ""
42200-5 = "...Кролик угодил в силки."
42200-6 = "FOX 1. Начинаю операцию. Всем подразделениям сохранять позиции и доложить обстановку."
42200-7 = ""
42200-9 = ""
42200-10 = "Говорит FOX 4. Только что сбила дрон возле точки «Альфа»."
42200-11 = "На секунду я испугалась, что они пойдут напролом с пушками наперевес... Хорошо, что Мияко не дурочка."
42200-12 = "Но с тех пор они только и делают, что сидят без дела."
42200-13 = "Что они задумали?"
42200-14 = "Не теряй бдительности, FOX 4. Они могут быть новичками, но всё ещё SRT."
42200-15 = "Принято."
42200-16 = "После того выстрела моя позиция раскрыта. Сменю её и доложу."
42200-17 = ""
42200-19 = ""
42200-20 = "Говорит FOX 3. Сейчас я в точке «Лима». Контролирую центральный лифт."
42200-21 = "Их путь сюда ограничен ограждениями, так что эта узкая точка под моим контролем."
42200-22 = "Даже если им повезёт уклониться от выстрела, они не смогут просто проигнорировать мой щит и пробежать мимо."
42200-23 = "FOX 3. Вообще-то у меня есть претензия к тому, что ты только что сказала."
42200-24 = "«Уклониться от выстрела»? Ты думаешь, они уклонятся от МОЕГО выстрела?"
42200-25 = "Я настолько тебе доверяю, что выбежала бы на поле боя с завязанными глазами, если бы ты прикрывала. Но что если они решат резко рвануть вперёд?"
42200-26 = "Я бы меньше переживала, будь у твоей винтовки четыре ствола..."
42200-27 = "Хм... Четырёхствольная винтовка и правда всё сильно упростила бы, да?"
42200-29 = "FOX 4, поддержи FOX 3. Прижми цели огнём."
42200-30 = "Теперь они знают, что Отоги следит за ними. Полагаю, Мияко сейчас пытается придумать, как её обойти."
42200-31 = "В худшем случае они застанут нас врасплох и найдут способ вообще нас миновать."
42200-33 = "Суть спецопераций — уметь справляться с непредсказуемым и использовать стратегические преимущества."
42200-34 = "Сейчас преимущество у нас. Учитывая позиции и снаряжение, если мы будем гибко реагировать по ходу боя, операция должна завершиться успешно."
42200-36 = "Это наша Юкино."
42200-37 = "Как будто это сюрприз. Никто не планирует операции лучше нашего командира!"
42200-38 = "...С отрядом FOX — хоть в ад и обратно."
42200-40 = "Сосредоточьтесь. Осталось недолго."
42200-41 = ""
42200-43 = ""
42200-45 = ""
42200-46 = "FOX 2 докладывает. Я отключила дистанционное управление центральным лифтом."
42200-47 = "Если система офлайн, Моэ не сможет взломать её и управлять лифтом, какие бы трюки ни пробовала."
42200-48 = "Я не перебарщиваю? Я очень верю в наших младших, но не уверена, что они вообще доберутся так далеко..."
42200-49 = "Нет. Как я всегда говорю: готовься к худшему сценарию."
42200-50 = "..."
42200-51 = "Юкино..."
42200-52 = "Ты правда думаешь, что они могут это сделать? Победить нас?"
42200-53 = "Такая возможность существует."
42200-54 = ""
42200-56 = ""
42200-57 = "Если они всё же прорвутся через FOX 2 к центру..."
42200-58 = "...соберитесь на первом уровне и ждите приказов."
42200-59 = ""
42200-62 = ""
42200-63 = "А? Нам не нужно перегруппироваться с тобой, FOX 1?"
42200-64 = "Даже если нас раскроют, мы можем отступить и поддержать тебя с тыла..."
42200-66 = "Нет. Если они захватят операционную, мы проиграли."
42200-67 = "Если они прорвутся, обеспечьте путь для быстрого отступления."
42200-69 = "Логика понятна, но..."
42200-70 = "Куруми. Уверена, у неё есть причины."
42200-72 = "FOX 1, ты же не собираешься..."
42200-74 = "Это был приказ, Нико."
42200-75 = "В SRT приказы не обсуждают."
42200-76 = ""
42200-79 = ""
42200-80 = ""
42200-81 = "...Принято."
42200-84 = "Наша задача: либо забрать, либо обезвредить термобарическую боеголовку A.N.T.I.O.C.H., чтобы отряд FOX не смог её подорвать."
42200-85 = "Боеголовка находится в шахте, но запуск детонации производится из операционной ниже."
42200-86 = "Чтобы обезвредить боеголовку, нам нужно захватить операционную."
42200-87 = ""
42200-89 = ""
42200-91 = ""
42200-92 = "Легче сказать, чем сделать..."
42200-94 = "Она права. Операционная находится глубоко внутри шахты, поэтому попасть туда можно только через центральный лифт."
42200-95 = "И что ещё хуже, отсюда до лифта всё пространство открытое. Для Отоги это идеальный тир."
42200-96 = "Я уже насчитала 13 хороших укрытий... Она может быть где угодно."
42200-97 = "Обычно мы бы сначала устранили снайпера и только потом двинулись дальше, но до детонации осталось мало времени."
42200-98 = "Поэтому придётся идти на полномасштабный штурм. Не дадим им ни секунды на размышления."
42200-99 = "Юкино контролирует поле боя до миллиметра, поэтому победить мы сможем только если достаточно сильно надавим и заставим их ошибиться. Нужно ворваться быстро и жёстко."
42200-100 = "Что-нибудь ещё?"
42200-101 = ""
42200-103 = ""
42200-104 = "Да, вот здесь. Ставлю на то, что вражеское подразделение находится в точке «Лима»."
42200-105 = "RABBIT 2, нейтрализуй это подразделение и захвати управление центральным лифтом."
42200-106 = "RABBIT 3, взломай лифт сразу после сигнала."
42200-108 = "Пара пустяков."
42200-109 = "Что со мной?"
42200-111 = "RABBIT 4..."
42200-112 = "Займи укрытие здесь, на внешней лестнице. Жди, пока RABBIT 2 выманит выстрел снайпера, и вычисли её позицию."
42200-113 = "Без проблем, но..."
42200-114 = "Но разве Саки не пострадает?"
42200-115 = "Ха-ха-ха! Я ваш штурмовик, RABBIT 4! Для этого я и нужна."
42200-116 = "И взгляни на этот шлем и баллистическую броню. Даже если попадут, будет как удар пёрышком!"
42200-117 = "Х-Хорошо!"
42200-119 = "Всё это замечательно, но какой у нас план Б?"
42200-120 = "Если Саки вырубят, если я не смогу взломать лифт или Мию не найдёт снайпера вовремя... Что тогда?"
42200-121 = ""
42200-124 = ""
42200-125 = "Плана Б нет."
42200-126 = "Что? Почему?"
42200-127 = "Он нам не нужен. Вы все — члены отряда RABBIT под моим командованием."
42200-128 = "Как самый быстрый, сильный и самоотверженный спецотряд из всех, кого я встречала, может проиграть?"
42200-130 = "Так что доверяйте друг другу и выполняйте операцию, зная, что у вас всё получится."
42200-131 = "...Потому что я верю в каждую из вас."
42200-133 = "Ох, Мияко. Из всех твоих безумных планов этот, пожалуй, самый безумный."
42200-134 = "Я плохо это сказала? О нет, речь была слишком пафосной, да?"
42200-135 = "Ну, безумный или нет, командир отряда отдала мне приказ."
42200-136 = ""
42200-138 = ""
42200-139 = "RABBIT 2, принято."
42200-140 = "Моэ, Мию... прикроете мне спину?"
42200-142 = ""
42200-143 = "Пошли!"
42200-144 = ""
42200-147 = ""
42200-148 = "Тогда... начинаем операцию!"
