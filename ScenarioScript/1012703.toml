[translation]
1012703-1 = "Порог писателя"
1012703-2 = "Центр города"
1012703-3 = "На следующее утро я отправился в Вайлдхант по работе."
1012703-4 = "[ns] «Кажется, в последнее время я бываю здесь слишком часто.»"
1012703-5 = "А после нескольких часов работы, когда я уже вернулся в город Ширатори..."
1012703-6 = "Хм? Сенсей?"
1012703-7 = ""
1012703-9 = "Доброе утро..."
1012703-10 = "[s] «Миё? Что привело тебя за стены Вайлдхант?»"
1012703-11 = "Н-Ну..."
1012703-12 = "Я получила предложение от издательства здесь. Мне разрешили выйти на несколько часов, потому что это считается деловой встречей."
1012703-13 = "[s] «Предложение о публикации?!»"
1012703-14 = "Да. Возможно, вы помните, что я работала над рассказом, когда была у вас в Шале."
1012703-15 = "И... я закончила! Моей работой заинтересовалось издательство романтической литературы."
1012703-16 = "[s1] «ЭТО была романтика...?»\n[s2] «Это потрясающе, Миё! Ты настоящий писатель!»"
1012703-19 = "Н-Не льстите мне! Пожалуйста, я ещё даже контракт не видела."
1012703-20 = "О, а когда встреча?"
1012703-21 = "Через 20 минут, в два часа. И прямо в этом здании. Я пытаюсь не ходить кругами слишком заметно. Не хочется выглядеть отчаявшейся, правда?"
1012703-22 = "...Что? Вы пойдёте со мной?"
1012703-23 = "То есть... Это слишком многого от вас требует. У вас наверняка был долгий день, и..."
1012703-24 = "Это правда. Я никогда раньше не подписывала настоящий контракт. А вы столько в них понимаете."
1012703-25 = ""
1012703-27 = ""
1012703-28 = "В-В таком случае..."
1012703-29 = "Я буду рада, если вы пойдёте со мной, Сенсей."
1012703-31 = "Мы с Миё вместе направились в офис издательства."
1012703-33 = "Переговорная издательства"
1012703-34 = "А! Вот и она! Наша особенная писательница с ленточками и таким чутьём на романтику!"
1012703-35 = "Но... Сенсей из Шале? Что вы здесь делаете?"
1012703-36 = "[s] «Я слышал, вы предлагаете ей контракт. Я здесь, чтобы поддержать её.»"
1012703-37 = "А, понятно. Какая вовлечённость! Чудесно. Посмотрите на нас двоих — поддерживаем молодые голоса завтрашнего дня!"
1012703-38 = "Раз уж все заняты, перейдём к делу. Итак, Миё, ты умная девочка, так что наверняка всё это понимаешь."
1012703-39 = "Индустрия уже не та, что раньше! Накладных расходов полно. Писать тебе, может, и легко, но издательское дело обходится дорого!"
1012703-40 = "Конечно, есть бумага, но ещё редакторы, дизайн, локализация и МАРКЕТИНГ! Ты даже не представляешь, сколько стоит маркетинг."
1012703-41 = "А если, к сожалению, напечатанные книги не продадутся — придётся платить за хранение. Склады с климат-контролем! Вооружённая охрана!"
1012703-42 = "Д-Да. Я знакома с этими понятиями."
1012703-43 = "Отлично. Тогда всё предельно ясно. Просто хотел убедиться, что мы понимаем друг друга!"
1012703-44 = "[s] «Но разве это не обычные расходы издательства?»"
1012703-45 = "Издательство! Вот это мой язык, Сенсей. А теперь перейдём к предложению."
1012703-46 = "Миё... Как тебе идея стать равноправным партнёром?! Мы даём тебе возможность вложиться в издание СОБСТВЕННОЙ книги."
1012703-47 = "...?"
1012703-48 = "Именно. Мы публикуем, а ТЫ получаешь привилегию оплатить печать, редактуру, дизайн и маркетинг!"
1012703-49 = "А всё остальное мы возьмём на себя!"
1012703-50 = "[s] «Погодите, но тогда Миё делает вообще всё...»"
1012703-51 = "Ух ты...!"
1012703-52 = "[s] «Миё...?»"
1012703-53 = "О, спорим, это ещё не всё, да?"
1012703-54 = "А?"
1012703-55 = "После того как я внесу все эти «инвестиционные» деньги и книгу издадут, мне, конечно же, придётся выкупить ещё штук 500 экземпляров, верно? Чтобы накрутить список бестселлеров Кронос?"
1012703-56 = "О...! Ты в теме!"
1012703-57 = "И наверняка мне ещё придётся записаться на какие-нибудь ваши платные курсы писательского мастерства... Ну, чтобы моя следующая книга у вас была ещё лучше? Я права?"
1012703-58 = "Абсолютно! Ты уже всё понимаешь. Мы инвестируем в твоё будущее, Миё!"
1012703-59 = "Да, конечно! Ого!"
1012703-60 = "...Вам, мошенникам, нужен новый сценарий."
1012703-61 = ""
1012703-63 = ""
1012703-64 = "К-Контракт...!"
1012703-65 = "Пойдём, Сенсей. Здесь мне больше нечего делать."
1012703-66 = ""
1012703-68 = ""
1012703-72 = "Парк неподалёку"
1012703-73 = "*вздыхает*"
1012703-74 = "Пожалуйста, не смотри на меня так, Сенсей. Всё нормально. Я крепче, чем кажусь."
1012703-75 = "Хм? Как я распознала мошенничество?"
1012703-76 = "Просто представила, что сделала бы сама, если бы хотела... использовать наивную девушку с мечтой, и от этого уже оттолкнулась. Так я и наши схемы контрабанды придумываю."
1012703-77 = "Ну..."
1012703-78 = "...*всхлипывает*"
1012703-79 = "[s] «Миё?!»"
1012703-80 = "Почему именно в ЭТОМ я хороша? Быть отбросом?"
1012703-81 = "Мне не удаётся заставить людей заинтересоваться моей работой, моими текстами — тем, во что я вкладываюсь больше всего."
1012703-82 = "...Мой единственный талант — преступления."
1012703-83 = "Я никогда не стану писателем. Никому не нужны мои глупые романы. Мне просто суждено быть... ВОТ ЭТИМ, да?"
1012703-84 = "[s] «Без понятия.»"
1012703-85 = ""
1012703-87 = ""
1012703-88 = "Как утешительно. Ты умеешь подобрать слова."
1012703-89 = "[s] «Я не переживаю за тебя, Миё. Ты найдёшь свой путь.»"
1012703-90 = ""
1012703-93 = "[ns] «Потому что неправильные пути ты знаешь лучше всех.»"
1012703-94 = "..."
1012703-95 = "Избегать неправильного пути... не менее важно, чем найти правильный."
1012703-96 = "Да. Я могла бы быть той девочкой, которая ведётся на мошенников. Такой милой. Такой наивной. Но я — это я."
1012703-97 = "И это преимущество. Мне повезло быть такой... сообразительной."
1012703-98 = "...Хотя я всё равно ненавижу то, какая я."
1012703-99 = "[s3] «Но контрабанда приносит деньги, да...?»\n[s4] «Она же помогла тебе купить новую печатную машинку?»"
1012703-100 = ""
1012703-101 = ""
1012703-103 = ""
1012703-104 = "З-Заткнись!"
1012703-106 = "Мы ещё немного поговорили в парке, а затем вернулись."
