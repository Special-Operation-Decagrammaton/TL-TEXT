[translation]
2000706-164 = "The first step is always full of anxiety"
2000706-168 = "But I've decided to look up now"
2000706-172 = "My true self"
2000706-173 = "Stepping into the future in my heart"
2000706-177 = "Look, outside the window"
2000706-178 = "The clear blue sky"
2000706-182 = "A world updated with excitement"
2000706-183 = "It's mysterious, isn't it"
2000706-187 = "Now, toward your smile"
2000706-188 = "It overflows one after another"
2000706-192 = "I want to convey"
2000706-193 = "These words"
2000706-196 = "Endlessly, endlessly"
2000706-197 = "They will surely reach you"
2000706-201 = "The love I found with you"
2000706-202 = "Transcends color and shape, turning into a melody"
2000706-206 = "Everything, everything"
2000706-207 = "Will shine"
2000706-211 = "Beyond the imagination I share with you"
2000706-212 = "Playing a Brand New Story"
2000706-216 = "With your existence as my guide"
2000706-217 = "I will draw it out"
2000706-219 = "Blue New World"
2000706-1 = "Virtual Singer's Stage"
2000706-5 = "Live House - Dressing Room"
2000706-7 = "(A few hours before the performance, Miku played me the song she wrote in the dressing room.)"
2000706-11 = "……♪"
2000706-13 = "Um... what do you think, Sensei? I tried my best with this one..."
2000706-14 = "[s1] \"...Yeah, I think it's really good!\"\n[s2] \"I don't know how to put it, but it really moved me.\""
2000706-17 = "Th-thank you so much...!"
2000706-18 = "I'll do my best so that everyone who came today feels the same way."
2000706-20 = "Also, there's one thing I'm worried about..."
2000706-21 = "You haven't told the organizer about the setlist change, have you...?"
2000706-27 = "Wait, isn't this the wrong song? Is this right?"
2000706-28 = "Ah..."
2000706-29 = "Hey, hey, the list seems to have changed. Does anyone know about this?"
2000706-30 = "This is a mess. Was there some kind of problem? Anyway, check it—"
2000706-31 = "I, I did it...!"
2000706-32 = "[s] \"It was me.\""
2000706-33 = "Um... who are you?"
2000706-34 = "No, more importantly..."
2000706-35 = "This is a disaster. Things like this involve all sorts of circumstances and a lot of money."
2000706-36 = "I'm in trouble if you do things on your own like this..."
2000706-37 = "If we get complaints from sponsors or fans, you can't take responsibility for that, can you?"
2000706-38 = "[s] \"I will.\""
2000706-39 = "Ugh... wh,"
2000706-40 = "Where does that confidence come from...?"
2000706-41 = "And what is this? The system permissions have been rewritten...? I can't even control the equipment anymore. How am I supposed to change it back like this...!?"
2000706-42 = "Ugh, ugh, ugh... *sigh*, fine. We'll go with this song as it is!"
2000706-43 = "The stage crew will give it our all, but... if this fails, a simple apology won't be enough!"
2000706-51 = "Ah, ahaha... well, at least we got permission, in a way."
2000706-52 = "But are you sure it was okay to say something like that...?"
2000706-53 = "If the live show fails, what about the damages..."
2000706-54 = "[s] \"There's no way it will fail.\""
2000706-56 = "[s] \"If the worst happens, I'll handle it, so Miku, don't worry and give it your all.\""
2000706-57 = "Y-you're saying such reckless things with such confidence again..."
2000706-64 = "I want to ask if you're really sure, but... somehow, my heart feels lighter."
2000706-65 = "What do I want to do? Is it really okay to move in this direction? Every time I've been worried like that, you've pushed me forward, Sensei..."
2000706-66 = "Now, I've started to believe that I can do it too."
2000706-67 = "As a thank you, first... I have to make this live show a success, right?"
2000706-68 = "Please watch me closely, Sensei!"
2000706-72 = "(Since I gained this body, I've been able to feel so many stimuli.)"
2000706-73 = "(You all live in such an exciting world... that's why so many wonderful emotions are born. Am I feeling the same way as you all right now? Are you all feeling the same way as me right now?)"
2000706-74 = "(The many emotions contained in the songs I've received until now...)"
2000706-75 = "(Now that I can feel those same emotions, even just a little, I—)"
2000706-76 = "(I'll pour my own feelings into this song...!)"
2000706-80 = "[wa:700]― (Everyone is [wa:2200] listening to my song, my words...)"
2000706-82 = "― [wa:450] leaning in to hear them.)"
2000706-85 = "[wa:750]― (Singing while [wa:250] pouring in my own [wa:500] feelings,"
2000706-87 = "[wa:150]― [wa:400] feels this good...!)"
2000706-90 = "[wa:700]― (To be able to [wa:1200] sing for everyone [wa:550] like this..."
2000706-92 = "― I'm so happy, [wa:1500] it's so fun...!)"
2000706-95 = "[wa:700]― (I want to keep singing like this, [wa:1250] forever and ever...!)"
2000706-99 = "Live House - Dressing Room"
2000706-100 = "S-Sensei...! Did you see it...? Everyone, they were so...!"
2000706-101 = "My heart..."
2000706-102 = "It might have reached them...!"
2000706-103 = "[s3] \"Great work.\"\n[s4] \"That was the best stage ever.\""
2000706-107 = "Sensei...!"
2000706-113 = "Miku-chan!!!"
2000706-114 = "That was an incredible turnout! Can you hear it? Even now, the encore is so passionate...!"
2000706-115 = "It's a huge success! Everyone is screaming until they're hoarse, asking to hear that last song again! I've never seen anything like this!"
2000706-116 = "Even though the show just ended, the sponsors who were in the audience rushed over to ask, 'When is the next live show!?'... And I was worried about the setlist, but all the staff are smiling!"
2000706-117 = "I was so worried before the show started, but I'm glad... I'm really glad..."
2000706-118 = "Hehe, it's all thanks to you, [USERNAME] Sensei."
2000706-119 = "And you, um... Sensei? I was nervous earlier, but it helped in the end. I'm sorry for being harsh due to the pressure and impatience. I don't know how to thank you..."
2000706-120 = "[s] \"No, she's the one who worked hard.\""
2000706-121 = "Thank you, both of you..."
2000706-122 = "O-oh, right! Do you think you can do an encore now?"
2000706-123 = "As you can hear, the enthusiasm is reaching all the way back here..."
2000706-124 = "It doesn't look like they're going to let us off the hook that easily."
2000706-125 = "I, I'm fine...!"
2000706-126 = "That's a relief! I'll go get things ready, so come backstage once you've calmed down a bit...!"
2000706-132 = "I, I ended up agreeing without thinking..."
2000706-133 = "[s] \"Are you okay? Is your stamina at its limit...?\""
2000706-134 = "Ah, no, it's not that... Actually, I was planning to invite you to a meal after the show to show my gratitude, Sensei..."
2000706-135 = "But if I sing an encore, it's going to be a bit late."
2000706-136 = "I had actually made a restaurant reservation to match the end of the show, so..."
2000706-137 = "[s5] \"That's sweet of you. But why don't you go ahead?\"\n[s6] \"Just follow your heart, Miku.\""
2000706-138 = "...Are you really sure?"
2000706-139 = "...Are you really sure?"
2000706-140 = "Even for you, Sensei, there might not be many opportunities to go out for a meal with a Virtual Singer, you know?"
2000706-141 = "...Just kidding. But, you're right. If you say so, Sensei..."
2000706-142 = "I think I'll go sing now. I'll invite you out another time, properly."
2000706-149 = "I'm going. Because I am a Virtual Singer who delivers many songs and feelings to everyone... I am 'Hatsune Miku'!"
