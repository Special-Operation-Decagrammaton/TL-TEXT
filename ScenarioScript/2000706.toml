[translation]
2000706-164 = "The first step is always nerve-wracking."
2000706-168 = "But I've decided to look up now."
2000706-172 = "Stepping into a future"
2000706-173 = "with my true self in my heart."
2000706-177 = "Look, outside the window,"
2000706-178 = "the sky is crystal clear blue."
2000706-182 = "A world updated by excitement."
2000706-183 = "It's strange, isn't it?"
2000706-187 = "Now, toward your smile,"
2000706-188 = "they overflow one after another."
2000706-192 = "The words"
2000706-193 = "I want to tell you."
2000706-196 = "On and on, forever and ever,"
2000706-197 = "they will surely reach you."
2000706-201 = "The love I found with you"
2000706-202 = "transcends color and form, turning into a melody."
2000706-206 = "Everything, absolutely everything,"
2000706-207 = "will shine bright."
2000706-211 = "Beyond the imagination I share with you,"
2000706-212 = "I'll keep playing this Brand New Story."
2000706-216 = "With your existence as my guiding light,"
2000706-217 = "I'll keep on drawing it."
2000706-219 = "[b0edeb]Blue New World[-]"