[translation]
2000706-1 = "Сцена виртуального идола"
2000706-5 = "Комната ожидания амфитеатра"
2000706-7 = "(Перед концертом я заглянул в комнату ожидания, чтобы послушать новую песню, которую сочинила Мику.)"
2000706-8 = ""
2000706-10 = ""
2000706-11 = "... ♪"
2000706-12 = ""
2000706-13 = "Что скажете, Сенсей? Я написала её прямо от сердца, как мы и говорили."
2000706-14 = "[s1] «Приятно услышать настоящую тебя.»\n[s2] «Это было великолепно! Ты лучшая!»"
2000706-17 = "Спасибо, Сенсей."
2000706-18 = "Надеюсь, моим поклонникам она понравится так же сильно."
2000706-20 = "Но я всё ещё не могу избавиться от неприятного чувства..."
2000706-21 = "Во-первых, я до сих пор не рассказала организатору сцены о своём плане."
2000706-22 = ""
2000706-26 = ""
2000706-27 = "Кто-то изменил сет-лист!"
2000706-28 = "О-Ох. Вот вы где."
2000706-29 = "Весь сет-лист сегодняшнего концерта изменили в последнюю секунду! Что происходит?! Ты что-нибудь об этом знаешь?"
2000706-30 = "Дело плохо. До концерта осталось совсем немного времени..."
2000706-31 = "В общем, дело в том, что..."
2000706-32 = "[s] «Это изменил я.»"
2000706-33 = "Что?"
2000706-34 = "А вы ещё кто? Нет, важнее другое — зачем вы вмешались в сет-лист?"
2000706-35 = "Подготовка к такому шоу требует огромной работы. На планирование каждой песни уходит время, а время — деньги."
2000706-36 = "Если изменить сет-лист в последнюю секунду, это может вызвать массу проблем."
2000706-37 = "А ВЫ готовы взять на себя ответственность, если спонсоры или зрители решат предъявить претензии?"
2000706-38 = "[s] «Я возьму ответственность на себя.»"
2000706-39 = "Хм. Не ожидал такого уверенного ответа."
2000706-40 = "И кто вы вообще такой, чтобы иметь на это право?"
2000706-41 = "Не знаю, что вы сделали, но я не могу ни открыть, ни изменить сет-лист, а контроллер не позволяет управлять сценическим оборудованием..."
2000706-42 = "Похоже, у нас нет выбора. Шоу должно продолжаться — даже с подменённым сет-листом!"
2000706-43 = "Но запомни: простым извинением ты не отделаешься, если этот концерт провалится!"
2000706-44 = ""
2000706-46 = ""
2000706-50 = ""
2000706-51 = "Х-Хаха. Ого. Это оказалось куда проще, чем я думала."
2000706-52 = "Но вы уверены, что у нас всё получится?"
2000706-53 = "Он ведь только что сказал, что если концерт провалится, вам придётся платить."
2000706-54 = "[s] «Я не против.»"
2000706-56 = "[s] «Песни, идущие из твоего сердца, не могут провалиться.»"
2000706-57 = "Вы опять говорите безрассудные вещи..."
2000706-58 = ""
2000706-60 = ""
2000706-61 = ""
2000706-62 = ""
2000706-64 = "Какой бы пугающей ни становилась ситуация, вы всё равно продолжаете верить в меня и подбадривать."
2000706-65 = "Вместо того чтобы указывать правильное направление, вы даёте мне толчок, чтобы я сама его нашла."
2000706-66 = "Я всего лишь обычный виртуальный идол, но рядом с вами мне начинает казаться, что я способна на всё."
2000706-67 = "Наверное, лучший способ отплатить за вашу доброту — оправдать ваши ожидания, верно?"
2000706-68 = "Только смотрите, Сенсей. Я устрою выступление всей своей жизни!"
2000706-71 = ""
2000706-72 = "(С тех пор как я получила это тело, я испытала так много нового.)"
2000706-73 = "(Если мои чувства настоящие, то больше всего я хочу понять, как люди справляются с тем, что в их сердцах так много всего.)"
2000706-74 = "(Все эти бесчисленные эмоции так долго жили в песнях, которые я пела...)"
2000706-75 = "(...и теперь я наконец могу по-настоящему им сопереживать.)"
2000706-76 = "(Вот что я хочу передать — от самого сердца!)"
2000706-80 = "― (Люди слушают мои песни... По-настоящему слушают.[wa:1450]"
2000706-82 = "― Я наконец снова могу достучаться до них.)[wa:10]"
2000706-85 = "― (Это чувство... невероятно глубокое и приятное.[wa:940]"
2000706-87 = "― Я пою от самого сердца.)[wa:10]"
2000706-90 = "― (Я так благодарна и счастлива, что снова могу это делать!)[wa:1290]"
2000706-92 = "― Это так весело, и я так счастлива!)[wa:740]"
2000706-95 = "― (Я хочу, чтобы мой голос всегда мог достигать их!)[wa:910]"
2000706-99 = "Комната ожидания амфитеатра"
2000706-100 = "Вы смотрели, Сенсей? Всем было так весело!"
2000706-101 = "Я пела от сердца..."
2000706-102 = "...и это действительно сработало! Я смогла достучаться до них именно так, как хотела!"
2000706-103 = "[s3] «Это был лучший концерт в моей жизни.»\n[s4] «Твоё сердце с самого начала подсказывало правильно.»"
2000706-104 = ""
2000706-105 = ""
2000706-107 = "Сенсей..."
2000706-108 = ""
2000706-112 = ""
2000706-113 = "Мику!"
2000706-114 = "Там публика с ума сходит! Они требуют на бис!"
2000706-115 = "Сегодняшнее шоу стало огромным успехом, и теперь они требуют снова услышать новую песню!"
2000706-116 = "Даже наши спонсоры на седьмом небе. Уже спрашивают, когда будет следующее выступление."
2000706-117 = "Я думал, нам конец, когда перед самым концертом изменили сет-лист. Как же хорошо, что всё обернулось к лучшему."
2000706-118 = "И всё благодаря Сенсею [USERNAME]."
2000706-119 = "Я тоже в огромном долгу перед вашим Сенсеем. Даже не знаю, как отплатить за помощь..."
2000706-120 = "[s] «Вся заслуга Мику. Пела ведь она.»"
2000706-121 = "Д-Да, это правда."
2000706-122 = "Но как думаешь, сможешь исполнить ещё одну песню на бис?"
2000706-123 = "Не хочу разочаровывать их сейчас."
2000706-124 = "А то, ещё хуже, они могут немного разбушеваться — уж слишком разогрелась публика."
2000706-125 = "Это... хороший аргумент."
2000706-126 = "Хорошо, я пока приведу сцену в порядок. Выходи, как только будешь готова."
2000706-127 = ""
2000706-129 = ""
2000706-131 = ""
2000706-132 = "Хаха... Похоже, мне всё-таки придётся спеть на бис."
2000706-133 = "[s] «Что-то случилось?»"
2000706-134 = "Нет, просто я думала, что всё уже закончилось, и собиралась пригласить вас на ужин в знак благодарности."
2000706-135 = "Если сейчас выйти на бис, потом может стать слишком поздно."
2000706-136 = "Вообще-то я даже забронировала на сегодня столик в пятизвёздочном ресторане... Не знаю, что выбрать."
2000706-137 = "[s5] «Со мной всё будет нормально. Не переживай.»\n[s6] «Делай то, что подсказывает сердце.»"
2000706-138 = "Вы точно не против?"
2000706-139 = "Вы точно не против?"
2000706-140 = "Я знаю, вы здесь довольно популярны, но ужин с виртуальным идолом бывает не каждый день, знаете ли."
2000706-141 = "Но если вы настаиваете, тогда..."
2000706-142 = "Хорошо. Я дам им тот бис, которого они ждут."
2000706-143 = ""
2000706-145 = ""
2000706-147 = ""
2000706-149 = "Я была бы нечестна с собой, если бы не спела для своих поклонников от самого сердца!"
2000706-154 = ""
2000706-164 = "始まりの一歩はいつも不安だよ"
2000706-168 = "だけどもう顔を上げるって決めたの"
2000706-172 = "ありのままの自分を"
2000706-173 = "胸に踏み出す未来"
2000706-177 = "窓の外はほら"
2000706-178 = "澄み渡る青"
2000706-182 = "ときめきでアップデートされた世界"
2000706-183 = "不思議だね"
2000706-187 = "今キミの笑顔へと"
2000706-188 = "次々と[ruby=あふ]溢[/ruby]れて[ruby=い]行[/ruby]く"
2000706-192 = "伝えたい"
2000706-193 = "言葉たち"
2000706-196 = "どこまでもどこまでも"
2000706-197 = "きっと届くよ"
2000706-201 = "キミと見つけたアイが"
2000706-202 = "イロもカタチも越えてメロディに変わる"
2000706-206 = "何もかも何もかも"
2000706-207 = "全部輝くよ"
2000706-211 = "キミと想像の[ruby=かなた]彼方[/ruby]に"
2000706-212 = "[ruby=かな]奏[/ruby]でて[ruby=い]行[/ruby]く Brand New Story"
2000706-216 = "キミの存在を[ruby=ひかり]道標[/ruby]に"
2000706-217 = "[ruby=えが]描[/ruby]いて[ruby=い]行[/ruby]く"
2000706-219 = "[b0edeb]Blue New World[-]"
