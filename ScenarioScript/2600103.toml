[translation]
2600103-1 = "Голос Мэри"
2600103-2 = "Дом Шале"
2600103-4 = "После поздней работы в Шале я лёг на раскладушку, чтобы немного отдохнуть."
2600103-5 = "И как раз когда начал засыпать, услышал странный звук."
2600103-6 = "Ахаха, ахахаха..."
2600103-7 = "Меня зовут... Я... в..."
2600103-8 = "[s] «...Откуда идёт этот голос?»"
2600103-9 = "Я иду прямо к тебе... Два...!"
2600103-10 = "[s] «Этот голос... Мэри?»"
2600103-11 = "Один...!"
2600103-12 = "[s] «?!»"
2600103-15 = "Из-за загадочного смеха я так и не смог уснуть..."
2600103-17 = "Исполнительный офис Шале"
2600103-18 = "Значит, в доме Шале ты слышал загадочный голос, который, как тебе кажется, принадлежал Мэри?"
2600103-19 = "Интересно... Вообще-то я давно мечтаю записать голос настоящего призрака."
2600103-20 = "Можно я сегодня переночую с тобой в доме Шале? Я выясню, откуда идёт звук."
2600103-21 = "[s] «Котама, ты не боишься Мэри?»"
2600103-22 = "Бояться нечего. Большинство явлений можно объяснить наукой, а необъяснимые нужно исследовать. Наоборот, мне даже интересно."
2600103-23 = "[s] «...Ты всё-таки настоящий студент Миллениума.»"
2600103-24 = "Конечно. И я ещё член Веритас, искателей истины."
2600103-25 = "Мне нужно заранее установить звуковое оборудование в доме Шале, чтобы сразу начать запись, когда мы что-нибудь услышим."
2600103-26 = "Тогда я схожу в клубную комнату Веритас за аппаратурой."
2600103-28 = "Котама вернулась в Миллениум за оборудованием для записи."
2600103-30 = "Дом Шале"
2600103-31 = "Значит, это дом Шале, которым Сенсей пользуется во время дежурств."
2600103-32 = "Я так старалась тайком установить здесь прослушку... Кто бы мог подумать, что однажды мне позволят принести её сюда самой?"
2600103-33 = "Шучу, конечно. Не беспокойся, подслушивать я не буду."
2600103-34 = "[s] «После таких слов я беспокоюсь ещё больше...»"
2600103-35 = "Для начала внимательно послушаем, нет ли каких-нибудь странных звуков."
2600103-37 = "Вскоре..."
2600103-38 = "Ахаха, ахахаха..."
2600103-39 = "Меня зовут... Я... в..."
2600103-40 = "[s] «Вот! Снова!»"
2600103-41 = "Этот голос, возможно...?"
2600103-42 = "Сенсей, можешь включить радио в кабинете?"
2600103-43 = "Если я права, то это, скорее всего..."
2600103-46 = "Ахаха! Заждались? С вами DJ Mary, в прямом эфире из Кронос!"
2600103-47 = "Присылайте свои истории — и получите призы."
2600103-48 = "Сегодня у нас... две истории!"
2600103-49 = "[s] «Этот голос...»"
2600103-50 = "Именно. Это ночная радиопередача."
2600103-51 = "Иногда радиочастота может случайно ловиться неподключённым динамиком, и тогда появляется такой странный голос."
2600103-52 = "Голос Мэри, должно быть, был именно из этой радиопередачи."
2600103-53 = "[s] «Хорошо, что это не призрак.»"
2600103-54 = "Но немного жаль. Я надеялась записать настоящий голос призрака."
2600103-55 = ""
2600103-56 = "...Может, попробовать вызвать Коккури монетой в 10 иен."
2600103-57 = "[s] «Прекрати, вот теперь мне действительно страшно!»"
2600103-59 = "После этого мне пришлось долго отговаривать Котаму от попытки вызывать призраков."
