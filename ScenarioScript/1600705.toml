[translation]
1600705-1 = "Речь под снегом"
1600705-4 = "(На обратном пути в офис Красной Зимы после агитационного тура...)"
1600705-5 = "Хи-хи, думаю, речи прошли успешно."
1600705-6 = "Даже скептически настроенные студенты, ставившие под сомнение легитимность президента, к концу речи уже аплодировали и выкрикивали лозунги."
1600705-7 = "Хотя бы некоторое время я смогу расслабиться, даже если Черино снова вытворит что-нибудь безумное. Студенты теперь полностью убеждены в величии президента."
1600705-8 = "[s1] «У тебя потрясающие ораторские навыки.»\n[s2] «Речь была настолько хороша, что даже я почти поверил.»"
1600705-9 = "Хи-хи, спасибо за комплимент, Сенсей."
1600705-10 = "Что значит «почти поверили»? Президент Черино бесспорно великий президент студсовета с великолепными усами."
1600705-11 = "Поскольку Академия Красной Зимы огромна, здесь немало студентов, которые никогда лично не видели президента Черино и знают её только по слухам."
1600705-12 = "Именно поэтому необходимо периодически устраивать агитационные туры, чтобы неосведомлённые студенты не поддались ложным слухам."
1600705-13 = "[s] «Тогда агитационный тур уже закончен?»"
1600705-14 = "Нет, остались ещё Старый институт и библиотека Красной Зимы."
1600705-15 = "Но на сегодня я закончу и вернусь в Секретариат."
1600705-16 = "Я проверила прогноз погоды, и, похоже, к району приближается огромная снежная туча."
1600705-18 = ""
1600705-19 = "Ого, стоило только сказать. Какой сильный ветер!"
1600705-20 = "Поторопимся, пока снег не усилился!"
1600705-22 = "(Несколько часов спустя...)"
1600705-26 = "Странно... Мы уже довольно долго идём."
1600705-27 = "[s] «Кажется, мы заблудились в снегу.»"
1600705-28 = "Вы правы. Похоже, мы потерялись."
1600705-29 = "Нам нужно пока найти место, где можно согреться."
1600705-30 = "[s] «Вон там вроде деревянная хижина.»"
1600705-31 = "Это... склад, где хранят материалы для ремонта горной дороги!"
1600705-32 = "Отлично, Сенсей. Там мы сможем переждать снег."
1600705-33 = "Ну же. Давайте зайдём и согреемся!"
1600705-39 = "― Ого, какая сильная метель.[wa:3420]"
1600705-42 = "― Ну же, Сенсей, прямо сейчас снимайте верхнюю одежду.[wa:550]"
1600705-45 = "― Вы можете простудиться, если[wa:10]"
1600705-47 = "― останетесь в мокрой одежде."
1600705-50 = "― Сенсей, на что вы всё это время[wa:2160]"
1600705-52 = "― смотрите?[wa:660]"
1600705-55 = "― Неужели вы тоже...[wa:2730]"
1600705-58 = "― интересуетесь"
1600705-60 = "― великими достижениями президента Черино?[wa:1020]"
1600705-63 = "― Что ж, раз уж момент подходящий, это даже хорошо.[wa:760]"
1600705-65 = "― Тогда давайте поговорим о величии президента[wa:1090]"
1600705-68 = "― пока снег не прекратится!"
1600705-71 = "(После этого Томоэ читала мне лекцию о президенте Черино до тех пор, пока снег не закончился.)"
1600705-73 = "Фух, наконец снег прекратился. Не ожидала, что метель продлится так долго."
1600705-74 = "Хорошо, что за разговорами о величии президента Черино время всегда летит незаметно."
1600705-75 = "Вы ведь согласны, Сенсей?"
1600705-76 = "[s] «...»"
1600705-77 = "А? Ваше выражение лица..."
1600705-78 = "Похоже, у вас всё ещё много вопросов о великих достижениях президента Черино!"
1600705-79 = "Ничего страшного. У нас ещё много времени."
1600705-80 = "Когда вернёмся в Секретариат, я продолжу рассказ!"
1600705-81 = "[s] «...Прекрати мои страдания.»"
