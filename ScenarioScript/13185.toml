13185-56 = "Вы тоже ничего не знаете?"
13185-57 = "Хм... Эта проклятая надзиратель Суо игнорит нас со вчерашнего дня... Кажется, я слышала, что может начаться драка, но это всё!"
13185-58 = "Хикари спала... может, наполовину спала? Поэтому Хикари забыла."
13185-59 = "Ну, отсутствие надзирателя — для меня только плюс! Стройка пойдёт как по маслу! Пахяхяхя! Мне больше ничего не важно!"
13185-60 = "Огромный плюс!"
13185-62 = "Как бы там ни было, становится реально опасно, так что вам лучше пока остановить стройку и спрятаться в безопасном месте."
13185-63 = "В-Вы слышали, офицеры? Нужно бежать с этой проклятой земли Абидоса!"
13185-64 = "Я бы не стала... называть её проклятой..."
13185-66 = "В общем, предупреждение получили, да?"
