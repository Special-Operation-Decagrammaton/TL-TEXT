[translation]
2005102-1 = "Мы снова встретились, Рейса"
2005102-2 = "Погода была хорошая, поэтому я вышел прогуляться возле Шале."
2005102-3 = "[ns] «Какой прекрасный день.»"
2005102-4 = "Э-Эм... Сенсей..."
2005102-5 = "[s] «Хм?»"
2005102-6 = ""
2005102-8 = ""
2005102-9 = "У-ух..."
2005102-10 = ""
2005102-12 = ""
2005102-13 = "П-Привет, Сенсей...!"
2005102-14 = "[s1] «О-Ого...»\n[s2] «Thermite Pink! Во плоти?»"
2005102-17 = "Ты сейчас совершенно-абсолютно-стопроцентно меня дразнишь!"
2005102-18 = "Я через столько прошла, чтобы сюда добраться. Это было тяжело..."
2005102-19 = "[s] «Тебя маленькая кошкоподобная штука попросила подписать контракт?»"
2005102-20 = "О-О. Ты ведь не всерьёз в такое веришь... правда?"
2005102-21 = "Ну, это тот подержанный костюм, который я тебе раньше показывала."
2005102-22 = "Его доставили, и я решила примерить, чтобы проверить размер."
2005102-23 = "И тут — БАЦ! Язычок молнии оторвался!"
2005102-24 = "Так что мне пришлось «трансформироваться», и теперь я застряла в этом наряде. Поэтому... конечно, я ещё и причёску сделала."
2005102-25 = "Я не могу найти язычок молнии, и инструментов у меня нет... Поэтому я пришла в Шале...!"
2005102-26 = "Я подумала, Сенсей наверняка сможет помочь, да?"
2005102-27 = "[s3] «У меня в офисе должен быть ящик с инструментами.»\n[s4] «Ты проделала весь путь сюда в этом костюме?»"
2005102-30 = "Да. Ха-ха, ха..."
2005102-31 = "Я чувствовала себя настоящей суперзвездой."
2005102-32 = "Я ехала сюда на автобусе, и на пересадках ко мне подходили дети и просили сфотографироваться."
2005102-33 = "Я прошла мимо выставочного центра, и люди решили, что я косплеер..."
2005102-34 = "Вот как чувствует себя суперзвезда... Ха, ха-ха..."
2005102-35 = "[s5] «Бедная Рейса сломалась!»\n[s6] «Но тебе ведь нравятся девочки-волшебницы?»"
2005102-38 = "Конечно, мне нравятся девочки-волшебницы!"
2005102-39 = "Размер идеальный, и костюм милый, но..."
2005102-40 = "...меня заставили стать одной из них раньше, чем я морально подготовилась."
2005102-41 = "Это как с роботами: даже если они тебе нравятся, ты не хочешь, чтобы один из них тайком забрался к тебе в кровать!"
2005102-42 = "...Пожалуйста, помоги мне отменить трансформацию..."
2005102-43 = "[s7] «Для меня честь получить такую возможность!»\n[s8] «Я помогу тебе в Шале!»"
2005102-46 = "Спасибо..."
2005102-49 = "[ns] «О, получилось расстегнуть.»"
2005102-50 = ""
2005102-51 = "«Трансформация... отменена!»... Наверное!"
2005102-52 = "Ого, я сейчас реально прозвучала как настоящая девочка-волшебница!"
2005102-53 = "[s] «Второе место в рейтинге „фраз, которые повезёт услышать хоть раз в жизни“!»"
2005102-54 = "Хи-хи, рада, что всё получилось."
2005102-55 = "Я знала, что ты сможешь решить проблему, Сенсей."
2005102-56 = "На тебя всегда можно положиться в критической ситуации!"
2005102-57 = "[s] «Использование моих сил отнимает столько энергии!»"
2005102-58 = "Ха-ха! Точно!"
2005102-59 = "Тогда я пойду обратно!"
2005102-60 = "Скоро увидимся. Спасибо."
2005102-61 = "[s9] «Погоди, Рейса. Ты правда собираешься уйти в таком виде?»\n[s10] «Молнии на спине у тебя полностью расстёгнуты.»"
2005102-64 = "О-О, точно!"
2005102-65 = "Я забыла взять одежду, чтобы переодеться!"
2005102-66 = "Я... правда идиотка."
2005102-67 = "[s] «Д-Девочка выбыла! Требуется подкрепление!»"
2005102-68 = ""
2005102-71 = "Я одолжил Рейсе свою куртку."
2005102-72 = "Я с облегчением увидел, что Рейса оживилась и воспряла духом."
