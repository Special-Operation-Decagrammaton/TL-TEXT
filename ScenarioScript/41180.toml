[translation]
41180-1 = "Episódio 18;Operação Trevo (2)"
41180-2 = "Ngh, grrr...!"
41180-5 = "...Não dá, não abre de jeito nenhum."
41180-6 = "E aí, vocês já pegaram a prova, o que estão fazendo ainda?"
41180-7 = "O tempo tá acabando, por que não saem logo daí?"
41180-8 = "Você não ouviu? A porta não abre!"
41180-9 = "...Hã? Pra começar, por que diabos vocês fecharam?"
41180-10 = "É óbvio que uma porta de cofre tem trava automática!"
41180-11 = "É-É que eu achei que, se deixássemos aberta, alguém poderia nos encontrar..."
41180-12 = "Mas eu tô vigiando essa parte direitinho..."
41180-13 = "Por que você foi ficar nervosa logo com isso?"
41180-14 = "D-Desculpa..."
41180-16 = "Pelo menos podiam ter calçado a porta com alguma coisa..."
41180-17 = "Uuh, uuuh..."
41180-18 = "Eu sabia... alguém como eu nunca devia ter entrado na SRT..."
41180-19 = "Eu só fico com medo e atrapalho todo mundo..."
41180-20 = "Alguém como eu nem devia ter nascido..."
41180-21 = "Miyu, não diga uma coisa dessas. É natural que uma atiradora de elite não esteja acostumada com operações em ambientes fechados."
41180-22 = "Na verdade, a culpa é minha por não ter levado isso em consideração."
41180-23 = "...Será mesmo?"
41180-24 = "Não tenta passar pano, não tem dúvida de que foi erro da Miyu."
41180-26 = "Não é hora de ficar procurando culpados, o limite de tempo tá quase estourando!"
41180-27 = "Então o que você sugere? Vamos arrombar na força bruta, como eu disse antes?"
41180-28 = "Espera aí, não dá pra só hackear de novo como antes?"
41180-29 = "Não adianta só destravar a fechadura eletrônica se a porta não abre fisicamente."
41180-30 = "Uuh, quero morrer... quero fugir..."
41180-32 = "P-Pessoal, primeiro se acalmem..."
41180-34 = "Miyako, você não tem nenhuma boa ideia? Já faltam menos de 5 minutos!"
41180-35 = "Você é a líder do esquadrão, não é?"
41180-36 = "Miyako-chan..."
41180-41 = "E-Eu..."
41180-42 = "Decide logo, Miyako. Não temos tempo!"
41180-43 = "Miyako!"
41180-44 = "..."
41180-50 = "(...Pensando bem, desde que saímos da SRT, todas as operações que eu comandei falharam.)"
41180-51 = "(Tanto no parque quanto quando o acampamento alagou...)"
41180-52 = "(...Eu não tenho a visão estratégica nem a liderança do Sensei.)"
41180-53 = "(Nesta situação desesperadora...)"
41180-54 = "(O que eu poderia fazer...?)"
41180-55 = "[s1] \"Miyako, se acalme.\"\n[s2] \"Ainda não acabou.\""
41180-56 = "...Sensei."
41180-57 = "...Sensei."
41180-58 = "Esta situação... eu não tenho como resolver."
41180-59 = "Se o Sensei estivesse aqui, talvez conseguisse dar um jeito, mas..."
41180-60 = "Eu sou diferente do Sensei. Não tenho essa capacidade."
41180-61 = "E mesmo que tivesse, agora eu já não sei mais o que fazer...!"
41180-62 = "Sozinha, eu não consigo fazer nada!"
41180-63 = "Eu... não consigo acreditar em mim mesma...!"
41180-64 = "[s] \"Você não precisa carregar tudo sozinha.\""
41180-68 = "[ns] \"Acredite em todo mundo.\""
41180-69 = "...?"
41180-74 = "É você quem vai fazer isso, né?"
41180-75 = "Uma situação dessas não tá no manual, então eu não dou conta."
41180-76 = "As missões sempre me dão muito medo, mas..."
41180-77 = "Mas a Miyako-chan está aqui..."
41180-78 = "E além disso, eu já não consigo fazer mais nada. Só a operação já tá me dando trabalho demais."
41180-80 = "Então..."
41180-82 = "[s] \"Conto com você, Miyako.\""
41180-88 = "...Sim, entendido."
41180-89 = "Vamos reiniciar a operação. Pode ser que algumas ordens pareçam estranhas daqui pra frente, mas, por favor, sigam sem hesitar."
41180-90 = "A situação não é favorável e enfrentaremos vários obstáculos pela frente. Ainda assim..."
41180-91 = "Vamos dar um jeito de levar este \"Trevo\"... e voltar para o nosso lugar."
41180-92 = "De acordo?"
41180-95 = "Entendido!"
41180-97 = "(Cerca de 5 minutos depois...)"
41180-102 = "É o alarme!!"
41180-103 = "Mas não apareceu nada nas câmeras de segurança..."
41180-104 = "Será que não é um gato de rua ou um rato?"
41180-105 = "É o alarme do depósito! Como é que um gato ia entrar lá?"
41180-106 = "Vai ver cavou um buraco?"
41180-118 = "Gatinhooo, sai daíii... Se for um rato, aí complica..."
41180-121 = "...Hã?"
41180-135 = "Quando ocorre uma anomalia, o básico é presumir o pior cenário."
41180-136 = "É com essa atitude relaxada que os problemas nunca acabam em Kivotos."
41180-141 = "I-Intrusas!"
41180-153 = "Disparar o alarme de propósito... Bem a sua cara, Miyako, uma estratégia que não tá no manual. Fazer elas mesmas abrirem a porta."
41180-154 = "Ainda assim, ver que a força que divide conosco a segurança de Kivotos tem esse nível de preparo... não sei se fico aliviada ou desanimada..."
41180-155 = "I-Isso vai mesmo dar certo...?"
41180-156 = "O alarme não para de tocar..."
41180-161 = "Sim, as outras alunas devem começar a chegar uma atrás da outra."
41180-162 = "Evitem confrontos em áreas abertas. Sempre que engajarmos o inimigo, devemos tomar a iniciativa com o elemento surpresa."
41180-163 = "Vamos usar o corredor leste, que tem bastante cobertura."
41180-167 = "Fiquem atentas a emboscadas enquanto avançamos até o ORP!"
