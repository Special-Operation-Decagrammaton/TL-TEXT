[translation]
41180-1 = "Эпизод 18;Операция «Клевер», часть 2"
41180-2 = "А-а-а-а! Гр-р-р-р!"
41180-5 = "Она реально не двигается."
41180-6 = "Разве вы не забрали «Клевер»? Вы там чаепитие устроили?"
41180-7 = "Время почти вышло! Нужно немедленно возвращаться к точке сбора!"
41180-8 = "Я бы с радостью. Если бы дверь не была закрыта."
41180-9 = "Что?! Какой идиот закрыл дверь за собой?"
41180-10 = "Даже Я знаю, что у хранилища с такой дверью при закрытии срабатывает автозамок! А я вообще не учусь!"
41180-11 = "Я... я... Н-Ну, я подумала, кто-нибудь м-может увидеть открытую дверь..."
41180-12 = "Я тебе сказала или нет, что слежу за ситуацией через камеры?"
41180-13 = "Ты действовала на эмоциях, а не по фактам! И посмотри, в какую ситуацию втянула товарищей!"
41180-14 = "П-Прости..."
41180-16 = "Можно было хотя бы подпереть дверь... чем угодно..."
41180-17 = "У-Уа-а-а-а!"
41180-18 = "М-Мне вообще не следовало вступать в SRT..."
41180-19 = "Т-Тупая трусиха, которая только тянет остальных вниз."
41180-20 = "Лучше бы я вообще не родилась! Уа-а-а!"
41180-21 = "Всё нормально, Мию. Ты снайпер, поэтому хуже знакома с боями в помещениях."
41180-22 = "Мне следовало лучше следить за ситуацией из тыла."
41180-23 = "Но это не твоя вина, Мияко. Совсем."
41180-24 = "Не пытайся перевести стрелки. Здесь вся вина на Мию."
41180-26 = "Я тоже злюсь, но сейчас не время! Нужно вытащить вас до включения сигнализации!"
41180-27 = "Что делать? Я могу попробовать взрывчатку, но мы взяли совсем немного."
41180-28 = "Разве нельзя снова взломать электронный замок?"
41180-29 = "Не могу, когда механический замок уже сработал!"
41180-30 = "В-Вот и всё... Я хочу домой..."
41180-32 = "Д-Давайте сначала успокоимся..."
41180-34 = "Мияко, используй уже мозги! Пять минут осталось!"
41180-35 = "Ты ведь наш лидер, Мияко?"
41180-36 = "М-Мияко... Помоги..."
41180-37 = ""
41180-39 = ""
41180-41 = "Я-Я?"
41180-42 = "Ты должна что-нибудь придумать. И прямо сейчас!"
41180-43 = "Мияко!"
41180-44 = "Я..."
41180-45 = ""
41180-47 = ""
41180-48 = ""
41180-50 = "(Я не знаю. С тех пор как мы ушли из SRT, моё лидерство — сплошные провалы.)"
41180-51 = "(Протест, затопление лагеря... Всё провалы.)"
41180-52 = "(Неужели это всё, на что я способна? У меня нет находчивости и лидерских навыков, как у Сенсея...)"
41180-53 = "(Я привела своих товарищей в ситуацию, где они могут погибнуть.)"
41180-54 = "(Хватит ли мне сил вытащить их? Или я снова всё провалю, как всегда?)"
41180-55 = "[s1] «Соберись, Мияко!»\n[s2] «Операция ещё идёт, Мияко!»"
41180-56 = "Сенсей?"
41180-57 = "Сенсей?"
41180-58 = "Я... я не справлюсь, Сенсей. Ситуация безнадёжная."
41180-59 = "Если бы вы были здесь, вы бы нашли выход... смогли бы защитить свой отряд..."
41180-60 = "Но я не такая, как вы, Сенсей. Никогда не была."
41180-61 = "Даже если я выложусь полностью..."
41180-62 = "Я не знаю! Просто не знаю, Сенсей!"
41180-63 = "Я не могу сделать это одна! Я не верю в себя так, как вы!"
41180-64 = "[s] «Тебе и не нужно делать это одной.»"
41180-65 = ""
41180-67 = ""
41180-68 = "[ns] «Посмотри на товарищей, которые всегда тебе доверяли!»"
41180-69 = "Мои товарищи... доверяют мне?"
41180-70 = ""
41180-72 = ""
41180-74 = "Ты тупая? Кто ещё способен повести отряд RABBIT в такой ситуации?"
41180-75 = "Думаешь, я сама что-то сделаю? По-моему, в моих учебниках не было главы «что делать, если тебя заперли в хранилище во время налёта на полицейскую школу»."
41180-76 = "М-Мне всегда страшно и одиноко, когда я одна на снайперской позиции..."
41180-77 = "Но т-ты единственная, кто никогда обо мне не забывала, Мияко."
41180-78 = "Думаешь, я нас поведу? Я и так еле успеваю помогать вам, дурочкам, отсюда."
41180-79 = ""
41180-80 = "Так что сейчас мы все..."
41180-81 = ""
41180-82 = "[s] «Мы все верим в тебя, Мияко!»"
41180-83 = ""
41180-85 = ""
41180-87 = ""
41180-88 = "...Понятно."
41180-89 = "Как полевой командир, я отдаю приказы всем членам отряда."
41180-90 = "Дальше ситуация будет нестабильной, и каждое решение важно. Прошу следовать за мной вслепую — даже если не понимаете причин."
41180-91 = "Но обещаю: мы безопасно завершим миссию и вернём «Клевер» в... наш дом. Все вместе."
41180-92 = "Понятно?"
41180-94 = ""
41180-95 = "Поняла!"
41180-97 = "Примерно пять минут спустя..."
41180-102 = "Сигнализация в архиве сработала! Неужели нарушители?"
41180-103 = "Не может быть. На камерах ничего не было."
41180-104 = "Наверное, просто бродячая кошка или что-то такое."
41180-105 = "Как бродячая кошка пройдёт через дверь хранилища?"
41180-106 = "Без понятия. Может, через дырку пролезла."
41180-107 = ""
41180-109 = ""
41180-110 = ""
41180-117 = ""
41180-118 = "Кис-кис-кис..."
41180-119 = ""
41180-120 = ""
41180-121 = "Какого?! Кто вы такие?!"
41180-122 = ""
41180-124 = ""
41180-129 = ""
41180-130 = ""
41180-132 = ""
41180-134 = ""
41180-135 = "Когда дело касается безопасности, всегда нужно предполагать худшее. Это стандартная практика."
41180-136 = "Именно такое отсутствие дисциплины и объясняет нынешнее состояние Кивотоса!"
41180-137 = ""
41180-139 = ""
41180-141 = "Н-Нарушители!"
41180-142 = ""
41180-153 = "Мияко была права. Достаточно было специально включить сигнализацию, и Бюро безопасности само прибежало и выпустило нас."
41180-154 = "Наверное, стоит быть благодарной, что наши коллеги, которые вроде как делят с нами ответственность за безопасность Кивотоса, тупые как пробки..."
41180-155 = "Н-Но..."
41180-156 = "Сигнализация всё ещё орёт..."
41180-157 = ""
41180-159 = ""
41180-161 = "Да. Подкрепление скоро прибудет."
41180-162 = "Наша цель — действовать агрессивно и застать их врасплох. Но избегайте больших групп и открытых пространств."
41180-163 = "Атакуем в восточном коридоре. Он узкий и там много укрытий."
41180-164 = ""
41180-166 = ""
41180-167 = "Будьте готовы к засадам и двигайтесь к точке сбора! Вперёд!"
