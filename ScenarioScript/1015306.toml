[translation]
1015306-1 = "An ordinary secret base!"
1015306-3 = "I tried painting it as a test, but..."
1015306-4 = "Sensei, what do you think...?"
1015306-5 = "Out of these four, which one do you think is closest to the original color?"
1015306-6 = "[s] \"...Aren't they all the same?\""
1015306-7 = "I knew it, right...?"
1015306-8 = "They're supposed to be all different colors, but they just look identical to me too."
1015306-9 = "It's just touch-up painting, so I need to match the original color, but..."
1015306-10 = "[s] \"Does it have to be an exact match?\""
1015306-11 = "It doesn't need to be that strict, but since four things that should be different all looked the same, #nI wondered if there was something wrong with how I was seeing things and wanted to hear your opinion, Sensei."
1015306-12 = "If they all look the same color to you too, Sensei, I guess I don't need to worry about it."
1015306-13 = "Well then... I'm going to paint it all at once, so I'd appreciate your help!"
1015306-14 = "[s] \"Leave it to me!\""
1015306-18 = "Phew..."
1015306-19 = "Thank you very much! #nDoing it together made the time fly by!"
1015306-20 = "Now Crusader-chan is all clean and pretty!"
1015306-21 = "[s] \"Good job keeping up with the maintenance!\""
1015306-22 = "Of course. It's borrowed, after all."
1015306-23 = "It's important to return things cleaner than when you borrowed them, right? Ehehe."
1015306-24 = "Ah, come to think of it. #nWould it be alright if we leisurely hang out here until the paint dries before heading back?"
1015306-25 = "[s] \"Of course!\""
1015306-26 = "Thank you!"
1015306-31 = "Uum..."
1015306-32 = "It really is hot inside a tank..."
1015306-33 = "There is an air conditioner of sorts, but it's broken right now..."
1015306-34 = "That said, outside is――"
1015306-40 = "There's a breeze, but surprisingly little shade, so the direct sunlight is tough..."
1015306-42 = "Uum..."
1015306-43 = "I know!"
1015306-44 = "Sensei! I'm going to make a secret base right now!"
1015306-48 = "Heave... ho!"
1015306-51 = "(Hifumi climbed onto the tank, turned the turret backward――)"
1015306-54 = "(And hung a flag over the barrel to create some shade.)"
1015306-59 = "[wa:2000]― [log=히후미 레이싱]Hah~ [wa:1720]The tank is [wa:1440]so cool and refreshing...[/log]"
1015306-61 = "― [log=히후미 레이싱]It really is [wa:720]cool in the shade...[/log]"
1015306-64 = "― [log=히후미 레이싱]What do you think of this secret base made from a tank, [wa:2050]Sensei?[/log]"
1015306-67 = "[wa:1360]― [log=히후미 레이싱]...It's so quiet, isn't it?[/log]"
1015306-70 = "― [log=히후미 레이싱]When the engine is turned off,[/log]"
1015306-72 = "― [log=히후미 레이싱]the armor [wa:1320]absorbs all the surrounding sounds.[/log]"
1015306-75 = "― [log=히후미 레이싱]It's quiet enough that you can even hear [wa:2020]breathing and heartbeats,[wa:1310] and...[/log]"
1015306-78 = "[wa:570]― [log=히후미 레이싱]I just love this space.[/log]"
1015306-80 = "― [log=히후미 레이싱]It feels almost like [wa:901]we're the only two people in the world――[/log]"
1015306-83 = "― [log=히후미 레이싱]Ah, [wa:1030]ahaha! [wa:1160]Even though you're stuck with an ordinary student [wa:910]like me,[/log]"
1015306-85 = "― [log=히후미 레이싱]it might not be very interesting, but...[/log]"
1015306-88 = "[ns1] \"Hifumi is a special existence to me.\"\n[ns2] \"You're an irreplaceable student, Hifumi.\""
1015306-91 = "[wa:400]― [log=히후미 레이싱]Eh? [wa:590]Ah, [wa:340]ah, well, [wa:840]um...![/log]"
1015306-93 = "― [log=히후미 레이싱]Ahaha... [wa:1240]Sensei, [wa:1440]you're always giving me [wa:1330]so much energy, aren't you?[/log]"
1015306-96 = "― [log=히후미 레이싱]Ah, [wa:700]huh? [wa:1010]It suddenly got hot in here![/log]"
1015306-98 = "― [log=히후미 레이싱]Th- [wa:440]the paint, [wa:650]I hope it dries soon...![/log]"
1015306-101 = "[wa:2030]― [log=히후미 레이싱](Wh- [wa:750]what if Sensei can hear [wa:2130]my heartbeat)[/log]"
1015306-103 = "― [log=히후미 레이싱](I should have played some music [wa:1510]or left the engine running...!)[/log]"
1015306-106 = "― [log=히후미 레이싱](Auwu... [wa:1110]How embarrassing...)[/log]"
1015306-110 = "(Hifumi averted her gaze and fell silent.)"
1015306-113 = "(Before I knew it, I had surrendered to the comfort of our secret base and drifted off to sleep.)"
