[translation]
1015306-1 = "An Ordinary Hideout!"
1015306-3 = "I tried applying a few swatches of paint, but..."
1015306-4 = "What do you think?"
1015306-5 = "One, two, three, or four— which one looks most like the original color?"
1015306-6 = "[s] \"...These are different colors?\""
1015306-7 = "So it's the same for you..."
1015306-8 = "They're supposed to be different colors, but I also think they all look the same."
1015306-9 = "Since I'm only painting part of the tank, I need the color to match the original#nas closely as possible."
1015306-10 = "[s] \"Does it really have to perfectly match?\""
1015306-11 = "It doesn't have to be that exact. It's just that these four are supposedly different colors,#nyet they all seem the same to me. I was wondering it was just me who couldn't tell the#ndifference, so I wanted to hear your opinion as well."
1015306-12 = "If you also don't see a difference, then it probably doesn't matter."
1015306-13 = "With that out of the way... I'd like to finish painting this in one go.#nCould I ask for your help?"
1015306-14 = "[s] \"Leave it to me!\""
1015306-18 = "Phew..."
1015306-19 = "Thank you so much! #nWith the two of us here, we were able to finish this in an instant!"
1015306-20 = "Now Crusader-chan looks as good as new!"
1015306-21 = "[s] \"Great job too, keeping on top of things with maintenance!\""
1015306-22 = "Of course. I'm only borrowing Crusader-chan after all."
1015306-23 = "It feels great to return something in even better condition than when it arrived!#nEhehe."
1015306-24 = "Ah, right. #nWould it be all right if we hung out here until the paint dries?"
1015306-25 = "[s] \"Of course!\""
1015306-26 = "Thank you!"
1015306-31 = "Hmm..."
1015306-32 = "It really is hot inside of the tank..."
1015306-33 = "It does have an AC, but it's currently broken..."
1015306-34 = "Not that being outside is any better."
1015306-40 = "There is some wind, but there's surprisingly little shade from the trees, on top of#nthe sun coming down pretty harshly..."
1015306-42 = "Hmm..."
1015306-43 = "I got it!"
1015306-44 = "Sensei! I'm going to make us a hideout!"
1015306-48 = "Heave... ho!"
1015306-51 = "(Hifumi climbed onto the tank and turned the turret towards the rear—)"
1015306-54 = "(After which, she draped her flag over the barrel to create a pocket of shade.)"
1015306-59 = "[wa:2000]― [log=히후미 레이싱]Fwaaah![wa:1720] The tank feels[wa:1440] nice and cool...[/log]"
1015306-61 = "― [log=히후미 레이싱]A little bit of shade really does go a long way...[/log]"
1015306-64 = "― [log=히후미 레이싱]What do you think of this, Sensei?[wa:450] It's a hideout made using a tank![/log]"
1015306-67 = "[wa:1360]― [log=히후미 레이싱]...Quiet, isn't it?[/log]"
1015306-70 = "― [log=히후미 레이싱]When the engine is off,[/log]"
1015306-72 = "― [log=히후미 레이싱]the armor absorbs all of the surrounding noise.[/log]"
1015306-75 = "― [log=히후미 레이싱]It's so quiet that you can even hear your own breathing[wa:1350] and heartbeat.[/log]"
1015306-78 = "[wa:570]― [log=히후미 레이싱]I really love this place.[/log]"
1015306-80 = "― [log=히후미 레이싱]It makes me[wa:500] feel like we're the only two people in the world here—[/log]"
1015306-83 = "― [log=히후미 레이싱]A-[wa:150]ahaha![wa:250] It's not really[wa:200] exciting though, is it?[/log]"
1015306-85 = "― [log=히후미 레이싱]Hanging around someone as ordinary as myself...[/log]"
1015306-88 = "[ns1] \"You're someone special to me though.\"\n[ns2] \"You're an irreplacable student to me though.\""
1015306-91 = "[wa:400]― [log=히후미 레이싱]Huh?[wa:590] Aah,[wa:340] uh,[wa:200] umm...[wa:200] Well...![/log]"
1015306-93 = "― [log=히후미 레이싱]Ahaha...[wa:1240] Look at you, always finding[wa:700] a way to cheering me up.[/log]"
1015306-96 = "[wa:1000]― [log=히후미 레이싱]W-[wa:700]wow.[wa:1010] It feels like it suddenly got hotter here![/log]"
1015306-98 = "― [log=히후미 레이싱]I-[wa:150]I hope[wa:650] the paint dries soon...![/log]"
1015306-101 = "[wa:2030]― [log=히후미 레이싱](M-[wa:750]my heart...[wa:2130] I really hope Sensei can't hear how my heart's pounding!)[/log]"
1015306-103 = "― [log=히후미 레이싱](I should've put on some music or turned the engine on...!)[/log]"
1015306-106 = "― [log=히후미 레이싱](Auuu...[wa:500] This is so embarrassing...)[/log]"
1015306-110 = "(Hifumi turned the other way and went completely silent.)"
1015306-113 = "(Before I knew it, I'd surrendered myself to the comfort of our hideout and drifted asleep.)"