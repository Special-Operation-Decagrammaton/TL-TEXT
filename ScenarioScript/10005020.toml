10005020-21 = "Какого чёрта?"
10005020-22 = "И это всё, на что они способны?"
10005020-23 = "В смысле? Ты уже вырубила кучу народу."
10005020-24 = "Наша Нэру немного раздражена, потому что ей некуда выплеснуть это."
10005020-25 = "Хмф."
10005020-26 = "Почему всё должно быть настолько легко?"
10005020-27 = "Они все слабаки."
10005020-29 = "Главное, что наша миссия проходит гладко."
10005020-30 = "Кстати, можем поговорить о твоём наряде?"
10005020-31 = "Я уже дважды сказала, Карин! Куртка остаётся!"
10005020-32 = "Не трогай! Я её ни за что не сниму!"
10005020-33 = "Угх, что вообще за дурацкая миссия? Почему мы должны красться ради какой-то сбежавшей девчонки?"
10005020-34 = "Это просто худшее! Почему нельзя просто отпустить меня с цепи?!"
10005020-35 = "Я бы закончила всё за пять минут."
10005020-36 = "[s1] «Ни в коем случае. Потерпи ещё немного.»\n[s2] «Самоконтроль — тоже навык, Нэру.»"
10005020-37 = "Угх, Сенсей! Опять?!"
10005020-38 = "Угх, Сенсей! Опять?!"
10005020-39 = "Ладно. Я всё равно шутила, ясно? Шутила."
10005020-40 = ""
10005020-41 = "Вы, мелкие придурки, радуйтесь, что Сенсей здесь! Иначе уже рыб кормили бы!"
10005020-42 = "Не знаю, заметила ли ты, но они без сознания."
10005020-43 = "В отличие от Нэру, я рада, что мы смогли быстро зачистить территорию. Нам стоит двигаться дальше."
10005020-44 = "Аканэ, ты почти закончила?"
10005020-46 = "Хи-хи, конечно! Я почти закончила установку."
10005020-47 = "[s3] «Как всегда, на тебя можно положиться, Аканэ.»\n[s4] «Как быстро. Ты очень надёжная.»"
10005020-48 = "Хи-хи. Спасибо, Сенсей."
10005020-49 = "Хи-хи. Спасибо, Сенсей."
10005020-50 = "Комплимент от Сенсея во время миссии... Какая прелесть."
10005020-52 = "Аргх! Я заставлю эту мелкую Белую Кроличку пожалеть, что она вообще родилась!"
10005020-53 = "Думаю, казначей Семинара и так планирует нечто подобное."
10005020-54 = "Хм, Сенсей? Что вы сказали?"
10005020-55 = "Думаете, мы необычно снисходительны к Белой Кроличке?"
10005020-56 = "Возможно, вы правы."
10005020-57 = "Не стану отрицать, она бывает головной болью, но злой её не назовёшь."
10005020-59 = "Мы сталкивались столько раз, что теперь она знает нас по именам."
10005020-60 = "Она всегда кричит: «Хватит за мной гоняться, Нэру!» или «Не бей меня, Нэру!»"
10005020-61 = "Эта мелкая дрянь! Это она носится повсюду и создаёт проблемы."
10005020-62 = "Наверное, у неё просто такой возраст. Она шалит и устраивает истерики, потому что ещё не понимает, как устроен мир."
10005020-63 = "...?"
10005020-64 = "А, ты про Белую Кроличку, а не про себя."
10005020-65 = "...?"
10005020-66 = "Эй! Повтори-ка это, ты...!"
10005020-67 = "Ну-ну. Давайте все обнимемся и будем дружить. Ах да, я закончила!"
10005020-68 = "Ты так быстро перехватила управление системой. Впечатляет."
10005020-69 = "Хи-хи, спасибо. А теперь, пожалуйста, соберитесь здесь."
10005020-70 = "Из-за характера моей установки там сейчас немного опасно."
10005020-71 = "Сюда, скорее."
10005020-73 = "Мне осталось только нажать кнопку..."
10005020-74 = ""
10005020-76 = ""
