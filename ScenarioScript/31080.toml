[translation]
31080-1 = "Episódio 8;1º Exame Especial de Aptidão Acadêmica"
31080-3 = "(Ah, isso aqui é exatamente o que vimos nas aulas de reforço...!)"
31080-4 = "(Os conteúdos que o Sensei explicou e as questões que estudamos juntas estão quase idênticos...!)"
31080-5 = "(Além disso, a dificuldade é de nível iniciante... não, nível básico!)"
31080-6 = "(Disseram tantas coisas assustadoras até agora, mas será que, na verdade, essa prova é uma chance para nos salvar...!?)"
31080-10 = "I-Isso é... h-hum, vejamos..."
31080-14 = "Fufu..."
31080-18 = "...Hum."
31080-22 = "(Mas não podemos baixar a guarda...! Pessoal, vamos manter o foco até o fim e nos formar neste Clube de Aulas de Reforço com um sorriso no rosto!)"
31080-29 = "[ns] Os resultados da prova chegaram."
31080-30 = "B-Bom trabalho a todos...!"
31080-31 = "Hum, parece que a nota de corte é 60 de 100 pontos! Mesmo que não tenhamos tirado notas altas, contanto que passemos dessa linha, vai dar tudo certo."
31080-32 = "E o conteúdo também estava bem fácil... Então, vamos ao anúncio dos resultados!"
31080-33 = "Sensei, por favor!"
31080-34 = "[s] Anunciar os resultados."
31080-35 = "Hifumi: 72 pontos"
31080-36 = "Resultado — Aprovada"
31080-37 = "M-Muito obrigada! É uma nota meio na média, mas que alívio! Bom, agora a próxima..."
31080-39 = "Azusa: 32 pontos"
31080-40 = "Resultado — Reprovada"
31080-41 = "...Quêêê!?"
31080-42 = "Tsc, foi por um triz."
31080-43 = "...E-Espera aí! Essa nota não foi \"por um triz\" coisa nenhuma!? Faltou um montão de pontos!?"
31080-45 = "Koharu: 11 pontos"
31080-46 = "Resultado — Reprovada"
31080-47 = "!?"
31080-48 = "Koharu-chaaaan!? V-Você não estava escondendo o seu verdadeiro potencial!? Dessa vez você fez mesmo a prova do 1º ano, né!? N-Não me diga que fez a do 2º ano de novo... não, com essa nota, por acaso você fez a prova do 3º ano!?"
31080-49 = "É-É que...! T-Tava bem difícil..."
31080-50 = "Estava super fácil!? Era praticamente nível de teste surpresa!?"
31080-51 = "Ora, ora..."
31080-52 = "Uuu... Então quer dizer que só eu e a Hanako-chan passamos...? Sendo assim, vamos ter que fazer o segundo exame..."
31080-53 = "Hanako: 2 pontos"
31080-54 = "Resultado — Reprovada"
31080-56 = "2 pontos!!?!?!?!?"
31080-57 = "2 pontos, você tirou 2 pontos!? Não 20 pontos!? Quer dizer, 20 pontos também não adiantaria, mas...! Aliás, o que você acertou para tirar isso!? Ou melhor, espera aí, Hanako-chan, você parecia ser super boa nos estudos, não é!?"
31080-58 = "De fato, dizem que eu passo essa impressão. Embora minhas notas sejam outra história."
31080-59 = "Impressão!? Era só impressão!? Como assim suas notas são outra história!?"
31080-60 = "Uh..."
31080-61 = "Auuu..."
31080-65 = "[ns] \"Hifumi! Aguente firme...!\""
31080-70 = "1º Exame Especial de Aptidão Acadêmica, resultado —"
31080-72 = "Hanako — [FF6666]Reprovada[-]"
31080-74 = "Azusa — [FF6666]Reprovada[-]"
31080-76 = "Koharu — [FF6666]Reprovada[-]"
31080-78 = "Hifumi — [007eff]Aprovada[-]"
31080-80 = "O acampamento de estudos do Clube de Aulas de Reforço foi decidido!"
31080-84 = "Próximo;Sombras Oscilando Sob a Superfície"
