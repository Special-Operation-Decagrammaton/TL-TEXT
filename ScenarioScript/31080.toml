[translation]
31080-1 = "Эпизод 8;Первый аттестационный экзамен"
31080-3 = "(Слава богу, все вопросы именно по тому, что мы проходили на дополнительных занятиях!)"
31080-4 = "(Задачи, которые мы решали с Сенсеем, и темы, которые разбирали вместе, почти один в один!)"
31080-5 = "(Этот экзамен для всех нас должен быть лёгким!)"
31080-6 = "(Неужели его специально сделали полегче для Клуба дополнительных занятий? Хотя нам и угрожали учебным лагерем, всё-таки пошли навстречу...)"
31080-7 = ""
31080-10 = "*кряхтит* Это... эм..."
31080-11 = ""
31080-14 = "Хи-хи."
31080-15 = ""
31080-18 = "*шурх* *шурх*"
31080-19 = ""
31080-22 = "(Вот и всё, девочки! Финиш уже близко! Сдадим этот тест — и все с улыбкой выпустимся из Клуба дополнительных занятий!)"
31080-23 = ""
31080-29 = "[ns] Результаты подсчитаны."
31080-30 = "Хорошая работа, все."
31080-31 = "Нужно набрать всего 60 из 100 или больше. Всё нормально, пока вы не провалились, а этот тест был почти разминкой."
31080-32 = "Пожалуйста, объявите результаты, Сенсей."
31080-33 = "Мы готовы!"
31080-34 = "[s] Объявить результаты."
31080-35 = "Хифуми: 72."
31080-36 = "Результат: Сдано."
31080-37 = "У меня получилось! Дальше..."
31080-39 = "Азуса: 32."
31080-40 = "Результат: Провал."
31080-41 = "Что?!"
31080-42 = "Хмф. Почти."
31080-43 = "П-Подожди! Это даже не половина проходного балла! Т-Тест ведь должен был быть лёгким!"
31080-44 = ""
31080-45 = "Кохару: 11."
31080-46 = "Результат: Провал."
31080-47 = "...?!"
31080-48 = "Погоди минуту! Ч-Что стало с твоим истинным потенциалом?! Ты точно сдавала экзамен первого курса, Кохару?! Не второй снова — или вообще третий?!"
31080-49 = "Я-я могу объяснить! Тест был очень сложным..."
31080-50 = "Нет! Он должен был быть лёгким!"
31080-51 = "О боже..."
31080-52 = "Что будем делать, Ханако? Даже если мы двое сдали... всё равно придётся сдавать второй экзамен."
31080-53 = "Ханако: 2."
31080-54 = "Результат: Провал."
31080-56 = "ДВА?!"
31080-57 = "Два! Я правильно услышала? Такая оценка вообще возможна? Что случилось, Ханако?! Во время подготовки ты выглядела как рыба в воде!"
31080-58 = "Мне говорили, что я создаю такое впечатление, но это не значит, что у меня хорошие оценки."
31080-59 = "Впечатление?! Просто впечатление?! И к оценкам это вообще отношения не имеет?!"
31080-60 = "А..."
31080-61 = "Нет..."
31080-62 = ""
31080-63 = ""
31080-65 = "[ns] «Держись, Хифуми!»"
31080-70 = "Результаты первого аттестационного экзамена"
31080-72 = "Ханако: [FF6666]Провал[-]"
31080-74 = "Азуса: [FF6666]Провал[-]"
31080-76 = "Кохару: [FF6666]Провал[-]"
31080-78 = "Хифуми: [007eff]Сдано[-]"
31080-80 = "Клуб дополнительных занятий отправляется в учебный лагерь!"
31080-84 = "Следующий эпизод;Что скрывается в глубине"
