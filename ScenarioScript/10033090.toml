[translation]
10033090-1 = "Эпизод 9;Этот фестиваль наш!"
10033090-2 = ""
10033090-3 = "Что вы себе позволяете?!"
10033090-4 = ""
10033090-6 = ""
10033090-7 = ""
10033090-9 = "Разве не очевидно? Мы пришли вернуть то, что принадлежит нам: ритуал Древа божеств!"
10033090-10 = "Ритуал Древа божеств предназначен для Хяккияко! Он приносит удачу нам и только нам!"
10033090-11 = "Так что мне плевать, приглашали их или нет! Он не для чужаков!"
10033090-12 = "[ns] «Какова именно ваша цель здесь...?»"
10033090-13 = "Хи-хи-хи... Только не пугайтесь слишком сильно, ладно? Я всё тщательно продумала! Это настолько ужасно, что словно ваш худший кошмар! Даже хуже худшего кошмара!"
10033090-14 = "Именно!"
10033090-16 = "Что именно...?"
10033090-17 = "Эти гигантские фейерверки у вас там, которые вы собираетесь запускать в конце фестиваля..."
10033090-19 = "Мы запустим их все! Днём!"
10033090-21 = "Э-это и есть великое раскрытие плана?"
10033090-22 = "Точно! Мвахаха! Я назвала это операцией «Сделать впечатляющий фейерверк супер-невпечатляющим, запустив его днём»!"
10033090-23 = "Я вижу, как вы трясётесь от страха! Знаю-знаю! В этот раз я превзошла саму себя. Вы так напуганы, что даже говорить не можете!"
10033090-24 = ""
10033090-26 = ""
10033090-27 = ""
10033090-28 = ""
10033090-30 = "..."
10033090-31 = "..."
10033090-32 = "[ns] «...»"
10033090-33 = "Алло-о?! Что за вялая реакция?"
10033090-34 = ""
10033090-36 = ""
10033090-37 = "В-вы нас совсем недооцениваете, да? Не верите, что мы способны на такой ужасный поступок! Вы... Хватит обвинять нас в трусости!"
10033090-38 = ""
10033090-40 = ""
10033090-41 = "Это вы боитесь! Боитесь нас, больших, злых, страшных преступников!"
10033090-42 = "[s] «Никто вообще не говорил, что вы боитесь!»"
10033090-43 = "Почему вы мне не верите?! Чёрт!"
10033090-45 = "А что случилось с ритуалом?"
10033090-47 = "Не знаю. Может, это его часть?"
10033090-48 = "А, точно! Я слышала, что представление «Принцесса Вараку», которое здесь регулярно проводят, интерактивное. Может, и тут так же."
10033090-49 = "Иногда ты умнее, чем я думаю."
10033090-50 = "Может, если немного подождём, случится что-нибудь крутое."
10033090-52 = "..."
10033090-53 = ""
10033090-55 = ""
10033090-57 = ""
10033090-59 = "Эрика. Эрика."
10033090-60 = "Это... наверное, не представление, да?"
10033090-61 = "Я бы сказала, что нет!"
10033090-62 = "Как будем действовать? Сначала к Сенсею?"
10033090-63 = "Наверняка он будет вместе с Умикой."
10033090-64 = ""
10033090-67 = ""
10033090-69 = ""
10033090-70 = "Немедленно прекратите! Я не позволю вам вмешиваться в наше расписание!"
10033090-71 = "Фейерверк состоится вечером, точно вовремя, как я и запланировала."
10033090-72 = "Вот почему мой план такой дьявольский! Мы запустим их прямо сейчас, хотите вы того или нет!"
10033090-74 = "Хи-хи-хи. Кто-то плохо сделал домашнюю работу!"
10033090-75 = "Именно! Фейерверки находятся не здесь! Обычно их устанавливают за несколько часов до ритуала, но сегодня их доставят прямо перед концом ритуала."
10033090-77 = "Ч-чего?! Обычно всё не так! Я-я не знала! Это нечестно! Вы отстой!"
10033090-78 = "?!?!"
10033090-80 = "Что-то не так, Умика? Ты выглядишь потрясённой и обеспокоенной!"
10033090-81 = "Н-ну! Эм..."
10033090-83 = "Вот эта куча — фейерверки? Л-лидер! Сюда."
10033090-85 = "К-Как это возможно?"
10033090-86 = "(Моя попытка опередить график и заранее установить фейерверки... сыграла против меня?)"
10033090-87 = ""
10033090-89 = ""
10033090-90 = "Нет! Я этого не позволю, Моурё!"
10033090-91 = "Я буду сражаться до последнего вздоха, чтобы защитить этот фестиваль! Ради студентов Геенны и ради Сенсея."
10033090-92 = "Вы не прикоснётесь к этим фейерверкам ни одним пальцем!"
10033090-93 = "У-успокойся, Умика!"
10033090-94 = "Э-эм, не хочу перебивать, но вы уверены, что драться на площади Древа божеств — нормально? Почему-то это кажется неправильным!"
10033090-96 = "...Иногда ради общего блага приходится идти на жертвы."
