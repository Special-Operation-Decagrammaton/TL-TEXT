10033100-373 = ""
10033100-374 = "*тяжело дышит* Мы прибежали так быстро, как смогли, когда увидели пожар..."
10033100-375 = "Но я рада видеть, что ситуацию уже взяли под контроль."
10033100-376 = "[s] «Префектурная команда? Я думал, у вас встреча!»"
10033100-377 = "Наша встреча очень удачно проходила прямо рядом с фестивалем."
10033100-378 = "Ния, кажется? Та девушка из клуба Инь-Ян всё организовала."
10033100-379 = "Но важнее другое: какого чёрта здесь произошло?"
10033100-380 = "Давайте оценим ситуацию и посмотрим, можем ли мы помочь."
10033100-381 = ""
10033100-383 = ""
10033100-386 = ""
10033100-387 = "Чтобы студенты протянули руки через границы своих академий...! Они объединились в час великой опасности, взявшись за руки как незнакомцы, но действуя как единое целое!"
10033100-388 = "Это трогательное зрелище по-настоящему взволновало меня! Я просто не могу выразить этот поток чувств!"
10033100-389 = "Мы ведь не можем теперь оставаться в стороне, правда, Кикё?"
10033100-390 = "Полностью согласна. Хяккарёран не останется в стороне."
10033100-391 = ""
10033100-393 = ""
10033100-394 = ""
10033100-395 = ""
10033100-397 = "[ns] «Ния... Она строила планы с самого начала. Как обычно.»"
10033100-398 = ""
10033100-404 = ""
10033100-405 = ""
10033100-406 = "И теперь, в последний раз, я снова хочу представить ослепительную мико ритуала Древа божеств!"
10033100-407 = "Благодаря усилиям каждого из вас, дорогие зрители, наша мико благополучно вернулась на сцену и теперь проведёт финальную церемонию..."
10033100-409 = "Хяккияко и правда любит интерактивные фестивали..."
10033100-410 = "Хахаха! Круто ведь, правда? Когда ты в последний раз была на такой вечеринке?"
10033100-411 = "Надо отдать им должное. Уверена, всё было под контролем, но ощущалось настолько реально."
10033100-412 = ""
10033100-415 = ""
10033100-416 = "Хм... Похоже, всё получилось."
10033100-418 = "Мы все знали, что Хяккияко славится туризмом и фестивалями, и они оправдали репутацию."
10033100-419 = "Было так весело... Мне грустно, что всё заканчивается! Вот бы остаться ещё на денёк!"
10033100-421 = "...Давайте не будем открывать дверь для новых происшествий."
10033100-422 = "А? Что значит «происшествий»?"
10033100-423 = "Эм, я сказала «прощальных танцев». Иди веселись перед отъездом...#nЧуть не спалилась. Но знаешь..."
10033100-424 = "Что такое?"
10033100-425 = ""
10033100-427 = ""
10033100-428 = "Просто... мне кажется, поездка вышла довольно хорошей."
10033100-429 = "Хм?"
10033100-431 = "Танец, который вы сейчас наблюдаете, посвящён молитве и подношению—"
10033100-433 = ""
10033100-434 = "Ещё одна история в копилку. Да?"
10033100-435 = "Ага."
10033100-436 = ""
10033100-438 = ""
10033100-440 = ""
10033100-441 = ""
10033100-442 = ""
10033100-443 = "..."
10033100-444 = "Здесь время фестиваля."
10033100-445 = "Люди празднуют."
10033100-446 = "И занавес опускается."
10033100-447 = ""
