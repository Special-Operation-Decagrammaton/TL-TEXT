[translation]
10033100-1 = "Эпизод 10;Что можно сделать"
10033100-2 = "Нет!!!!!"
10033100-3 = ""
10033100-11 = ""
10033100-12 = "Искры летят повсюду!"
10033100-13 = "Нужно потушить всё, пока огонь не распространился. Сейчас же."
10033100-14 = "Вода! Огнетушитель! Что угодно?! Помогите!"
10033100-15 = "Если огонь распространится слишком далеко... Ритуал Древа божеств будет испорчен. И Чисэ...! Чисэ всё ещё на сцене!"
10033100-16 = ""
10033100-19 = ""
10033100-20 = "Огонь пляшет вокруг сцены."
10033100-21 = "Фейерверки... Искры красивые."
10033100-24 = "[ns1] «Горячо! Всё горит!»\n[ns2] «Фейерверки не перестают взрываться!»"
10033100-28 = ""
10033100-29 = "Добраться до сцены невозможно!"
10033100-31 = "Если мы ничего не сделаем, здания вокруг обречены!"
10033100-32 = "Вааа! Это уже слишком! Что нам делать?!"
10033100-34 = "Это... Это..."
10033100-36 = "Ч-что нам делать, лидер?!"
10033100-37 = "Мы запустили фейерверки! Значит, мы победили?"
10033100-38 = ""
10033100-40 = ""
10033100-42 = "Это... Это не то..."
10033100-43 = "Я не хотела, чтобы всё зашло так далеко! Я не хотела всё разрушить!"
10033100-44 = ""
10033100-47 = ""
10033100-48 = "Лидер! Опасно!"
10033100-49 = "Ай! Здесь слишком жарко!"
10033100-50 = ""
10033100-55 = ""
10033100-56 = ""
10033100-59 = ""
10033100-60 = "(Моя самоуверенность... привела к этому. Я действительно поверила, что способна предсказать будущее, и отклонилась от плана, никому не сказав.)"
10033100-61 = "(С самого начала я совершала одну ошибку за другой.)"
10033100-62 = "(Я не смогла удержать группу в расписании. Я провалилась как экскурсовод.)"
10033100-63 = "(Да. Мои недостатки...)"
10033100-64 = "(Я думала, что смогу их компенсировать. Моё стремление устроить фейерверк точно вовремя и запустило всю эту цепочку событий.)"
10033100-65 = "(...)"
10033100-66 = "(Глупая.)"
10033100-67 = "(Что бы босс сделала иначе?)"
10033100-68 = "(Если бы президент была здесь, она преуспела бы там, где я провалилась.)"
10033100-69 = "(Моя некомпетентность... Я... Я всё разрушила. Я испортила репутацию Хяккияко и экскурсию Геенны.)"
10033100-71 = "*шмыг* *всхлип*"
10033100-72 = ""
10033100-75 = "[ns] Подойти к Умике."
10033100-76 = ""
10033100-81 = "[ns] Протянуть ей руку."
10033100-82 = ""
10033100-83 = "С-Сенсей...?"
10033100-84 = "[s] «Это ещё не конец.»"
10033100-85 = "Но конец! Я порчу всё, к чему прикасаюсь. Я не могу справиться одна."
10033100-86 = "Если бы я только не привезла фейерверки заранее..."
10033100-87 = "Я перешла границу, решив, что могу действовать по собственной воле. Это было глупо, и теперь мне остаётся только извиняться."
10033100-88 = "Простите, Сенсей. Мне так жаль. Я вообще не должна была соглашаться на эту роль. Я правда надеялась... Уже неважно, что я думала. Я просто..."
10033100-89 = "Простите! Я всех подвела..."
10033100-90 = "[s3] «Нет, Умика. Это не провал.»\n[s4] «Все видят, сколько сил ты вложила.»"
10033100-93 = "Усилия ничего не значат, Сенсей! Ничего! То, что должно было стать незабываемым опытом для Геенны, закончилось катастрофой!"
10033100-94 = "[s] «Ты правда так думаешь? Посмотри.»"
10033100-95 = "...?"
10033100-98 = "Мне кажется или атмосфера какая-то не такая?"
10033100-99 = "Да нет. Наверное, это часть фестиваля."
10033100-100 = "Студенты Хяккияко реально умеют тусоваться! Всё взрывается и горит. Я бы до такого не додумалась!"
10033100-102 = "Звучит как вызов! У меня уже руки чешутся присоединиться."
10033100-104 = "Быстро! Дай ракетницу."
10033100-105 = "И что ты с ней собираешься делать?"
10033100-106 = "Подумай! Если выстрелить гранатой в небо, она взорвётся высоко наверху."
10033100-107 = "О! Как фейерверк!"
10033100-108 = "Вот теперь ты говоришь дело."
10033100-109 = "Иногда у тебя бывают хорошие идеи."
10033100-110 = ""
10033100-112 = ""
10033100-114 = ""
10033100-115 = "Угх. Эм... Э-э. Я не знаю... Что мне делать?"
10033100-116 = "Соберитесь, лидер!"
10033100-117 = "Моурё идут за вами! Нам нужно, чтобы вы вели нас, лидер!"
10033100-118 = "Т-ты права! Мы делаем это!"
10033100-119 = ""
10033100-122 = ""
10033100-123 = "Огонь слева и справа. Сверху и снизу."
10033100-124 = ""
10033100-126 = ""
10033100-127 = "Так красиво!"
10033100-128 = ""
10033100-131 = ""
10033100-132 = "А?!"
10033100-133 = "Они все выглядят... Никто не боится?"
10033100-134 = "[ns] «Ага. Полностью оправдывает ожидания.»"
10033100-135 = "Что... вы имеете в виду?"
10033100-138 = ""
10033100-139 = ""
10033100-141 = ""
10033100-142 = ""
10033100-144 = ""
10033100-145 = ""
10033100-149 = "[ns] «В конце концов, мы имеем дело с Геенной.»"
10033100-150 = "...!"
10033100-151 = "У меня нет слов..."
10033100-152 = "И всё равно это не меняет того факта, что виновата во всём именно я!"
10033100-153 = "[s5] «Но нет необходимости паниковать или мучить себя.»\n[s6] «В конце концов, для чего ещё нужны друзья, правда, Умика?»"
10033100-156 = "Как ты тут, Умика?"
10033100-157 = "Пина..."
10033100-158 = "Сейчас всё уже за гранью безумия, но мы можем попросить всех помочь!"
10033100-159 = "П-помочь...?"
10033100-160 = "Да, помочь! Есть столько людей, к которым можно обратиться: студенты Геенны, наши товарищи из Хяккияко..."
10033100-161 = "Но я ведь экскурсовод. Просить других исправлять мои ошибки..."
10033100-162 = ""
10033100-164 = ""
10033100-168 = ""
10033100-169 = "В этом нет ничего плохого."
10033100-170 = "Цубаки...?"
10033100-171 = "[ns7] «Если тебе нужна помощь, это не значит, что ты безответственная.»\n[ns8] «Никто не может сделать всё в одиночку.»"
10033100-174 = "Нет, но если бы босс была здесь..."
10033100-175 = "Тогда она поступила бы точно так же!"
10033100-176 = "Ч-что?!"
10033100-177 = ""
10033100-184 = ""
10033100-185 = ""
10033100-186 = ""
10033100-188 = "[ns9] «Шизуко тоже сталкивалась с проблемами, которые казались неразрешимыми.»\n[ns10] «Но она просила о помощи и справлялась с ними.»"
10033100-191 = "..."
10033100-192 = ""
10033100-194 = ""
10033100-195 = "Эй! Как вы тут держитесь?"
10033100-197 = ""
10033100-201 = ""
10033100-203 = "Эрика?! Кирара?"
10033100-205 = "У нас было стойкое чувство, что вам может понадобиться помощь."
10033100-206 = "Точно! Мы ведь слегка влипли, да?"
10033100-207 = "[s] «Да. Нужно потушить пожар, и быстро.»"
10033100-208 = "А тут все говорили, что это часть фестиваля..."
10033100-209 = "Ну, считайте, что студенты Геенны к вашим услугам! Всё, что понадобится!"
10033100-210 = "Но что мы вообще можем сделать? Что-то слишком резкое может вызвать панику. Мы сейчас в тупике..."
10033100-211 = "Хи-хи. Не парься по мелочам. Выход есть всегда!"
10033100-213 = "Т-Ты правда так думаешь?"
10033100-214 = "Конечно! Нам просто нужна та отважная экскурсовод, которая вела нас всю эту поездку, чтобы сейчас взять всё в свои руки!"
10033100-215 = "Экскурсовод...? Кто...?"
10033100-216 = ""
10033100-219 = ""
10033100-221 = ""
10033100-223 = ""
10033100-224 = ""
10033100-225 = "[ns] «Твой звёздный час, Умика.»"
10033100-226 = "Мой... звёздный час?"
10033100-227 = ""
10033100-229 = ""
10033100-230 = ""
10033100-231 = "Хорошо. Сенсей, все."
10033100-232 = "Думаю, у меня есть план."
10033100-233 = "Прошу прощения за такую бесстыдную просьбу, но могу ли я в последний раз попросить вашей помощи?"
10033100-234 = "Да!"
10033100-235 = ""
10033100-239 = ""
10033100-240 = "Прошу внимания! Всем жителям Хяккияко и нашим уважаемым гостям из Геенны!"
10033100-241 = "Огонь, который вы видите вокруг, — интерактивная часть фестиваля, требующая участия зрителей!"
10033100-242 = "Площадь охвачена пламенем, и наша любимая мико в опасности! Огонь всё ближе подбирается к сцене."
10033100-243 = "Если ничего не делать, пламя поглотит и площадь, и мико."
10033100-244 = "Мы должны объединить разум и силы, чтобы преодолеть это испытание!"
10033100-245 = "Если нам удастся, Древо божеств признает созданные нами дружбу и товарищество и одарит всех удачей!"
10033100-246 = ""
10033100-248 = ""
10033100-249 = ""
10033100-250 = "П-Правда?"
10033100-251 = ""
10033100-253 = ""
10033100-255 = ""
10033100-256 = "Хахаха! Понимаешь, что она делает, Эрика?"
10033100-257 = "Ну, идея неплохая. Посмотрим, что получится."
10033100-258 = "Мы пойдём помогать. Скоро увидимся, Сенсей! Умика!"
10033100-259 = ""
10033100-261 = ""
10033100-263 = ""
10033100-264 = "Пожалуйста, будьте осторожны!"
10033100-265 = ""
10033100-268 = ""
10033100-270 = "Одноклассницы, вечеринка начинается!"
10033100-271 = "Я тоже слышала, что она сказала."
10033100-272 = "Потушить пожар и спасти мико. Всё довольно просто, да?"
10033100-273 = "Так это всё было большим представлением?"
10033100-274 = "Ага! И сейчас грандиозный финал! Ну же, разве не хочется закончить ритуал?"
10033100-275 = "Лучше поторопись. Они начинают без тебя."
10033100-277 = ""
10033100-278 = "Сюда, Каэдэ. Мы победим это пламя, пока от него не останется даже уголька!"
10033100-279 = "Тогда понадобится больше воды! Вёдра, бутылки — всё, что сможете найти!"
10033100-280 = "Я раздам пожарные вёдра. Будем действовать шаг за шагом."
10033100-282 = ""
10033100-284 = ""
10033100-285 = ""
10033100-286 = "Погодите, госпожа экскурсовод! Я помогу!"
10033100-287 = ""
10033100-289 = ""
10033100-290 = "Я тоже присоединяюсь к веселью. Уверена, что хочешь это пропустить?"
10033100-291 = ""
10033100-293 = ""
10033100-294 = ""
10033100-295 = "Я не знала, что всё вот так..."
10033100-296 = "Я не хочу оставаться в стороне!"
10033100-297 = ""
10033100-299 = ""
10033100-301 = ""
10033100-302 = ""
10033100-304 = ""
10033100-306 = ""
10033100-307 = ""
10033100-308 = "Моурё, двигайтесь быстрее! Скорее!"
10033100-310 = "А-А? Мне...?"
10033100-311 = "Да, тебе! Ты ведь тоже не хочешь, чтобы фестиваль провалился, верно?"
10033100-313 = "...!"
10033100-314 = "Д-да... Я просто хотела немного всё испортить..."
10033100-315 = "Я не хотела, чтобы всё сгорело к чёрту!"
10033100-316 = "Иди сюда, Моурё! У нас работа!"
10033100-317 = ""
10033100-320 = ""
10033100-321 = "Лидер! Отдавайте приказ!"
10033100-322 = "Древо божеств в опасности! Такими темпами всему фестивалю конец!"
10033100-324 = "Именно! Сейчас важнее всего не дать Древу божеств сгореть."
10033100-325 = "Наш новый враг — огонь! Потушим его изо всех сил!"
10033100-326 = ""
10033100-329 = ""
10033100-330 = "Поняли. Лидер!"
10033100-331 = "Мы защитим наш фестиваль собственными руками!"
