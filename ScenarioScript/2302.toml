[translation]
2302-1 = "Снова! Собрание Фестивального отдела!"
2302-4 = "В тихий праздничный день участницы Отдела организации фестивалей собрались в Момоёдо."
2302-7 = ""
2302-8 = ""
2302-9 = ""
2302-10 = "Доска — есть. Маркер — есть. Всё готово!"
2302-11 = ""
2302-13 = ""
2302-14 = "Сцена твоя, Пина!"
2302-15 = "Есть! Мы получили благословение президента, так что пора!"
2302-16 = ""
2302-18 = ""
2302-19 = ""
2302-20 = ""
2302-22 = "Объявляю собрание Отдела организации фестивалей открытым!"
2302-23 = ""
2302-25 = ""
2302-27 = "Хи-хи. Хи-хи-хи!"
2302-28 = "В прошлый раз нам помешало нежеланное вмешательство Дисциплинарного клуба..."
2302-29 = "Но в этот раз всё будет иначе! Да, именно!"
2302-30 = "Спросите почему? Потому что теперь у нас есть козырь в рукаве."
2302-32 = "Единственная и неповторимая Умика вернулась!"
2302-33 = "Да! Лучшего козыря нам и пожелать нельзя!"
2302-34 = "Добро пожаловать, Умика! Я с нетерпением ждала твоего возвращения!"
2302-36 = "Рада вернуться, босс!"
2302-37 = "Я тоже по тебе скучала, Пина!"
2302-38 = "Называй меня президентом, а не боссом!"
2302-39 = "*вздыхает*"
2302-40 = "Сколько ещё раз мне нужно вбить это тебе в голову?!"
2302-41 = "Переходим к делу! В следующем месяце мы должны провести фестиваль в торговом районе Foxy!"
2302-42 = "Наша дорогая Умика отправилась в грандиозную фестивальную экспедицию, чтобы узнать больше о нашем ремесле!"
2302-43 = ""
2302-46 = ""
2302-48 = ""
2302-49 = ""
2302-50 = "Пожалуйста, поделись историями своих подвигов и полученными уроками! Вооружившись твоими новыми деловыми знаниями, мы штурмом возьмём торговый район и устроим фестивальный ренессанс!"
2302-52 = "Ренессанс!"
2302-53 = ""
2302-56 = ""
2302-57 = "Да-да! Я вернулась с множеством предложений."
2302-58 = "Для начала я узнала о Кроваво-багровом фестивале Геенна и нашла целую сокровищницу вдохновения."
2302-59 = ""
2302-62 = ""
2302-63 = ""
2302-65 = "(Кроваво-багровый звучит... А. Она про Томатный фестиваль Геенна.)"
2302-66 = "(Я только читала о нём, но студенты собираются вместе и бросаются друг в друга помидорами, создавая впечатление кровавой бойни. Очень в духе Геенна.)"
2302-67 = "(Фестиваль такого масштаба... Интересно...)"
2302-68 = ""
2302-70 = ""
2302-71 = ""
2302-73 = "П-Прекрасно!"
2302-74 = "Пожалуйста, просвети нас насчёт этой найденной сокровищницы."
2302-75 = "Да, это очень познавательно."
2302-76 = "Истоки этого фестиваля уходят далеко в прошлое. Назвать его историю «кровавой» вполне уместно: участники стреляли друг в друга боевыми патронами, пока их тела не становились багровыми от крови!"
2302-77 = "Что?!"
2302-78 = ""
2302-81 = ""
2302-82 = "Это... Это больше похоже на жестокий конфликт двух враждующих организаций..."
2302-83 = "Как и ожидалось от Геенна! Какой ужас!"
2302-84 = "Нет-нет-нет. Не может быть, чтобы это было настоящим происхождением! Кто тебе это сказал?!"
2302-85 = "Хм? Одна добрая участница банды Helmet, которую я случайно встретила."
2302-86 = "Она предложила рассказать мне тайную, никому не известную историю происхождения Кроваво-багрового фестиваля всего за 1000 иен. Очень щедро с её стороны."
2302-87 = "Умика! Это был самый очевидный развод столетия. Разве я не говорила тебе остерегаться туристических ловушек?"
2302-88 = "Да? И я остерегалась?"
2302-89 = "Возвращаясь к рассказу, со временем эту кровавую практику заменили нынешней, более мирной версией."
2302-90 = "Теперь это прекрасный фестиваль, где вместо пуль бросают помидоры — но, конечно, с фирменным стилем Геенна!"
2302-91 = ""
2302-93 = ""
2302-94 = "Они используют всевозможные метательные устройства: томатные катапульты, томатные пусковые установки, томатные гранаты, бронебойные оперённые подкалиберные томатные снаряды..."
2302-95 = ""
2302-96 = "Их безграничное воображение по-настоящему меня вдохновило."
2302-97 = "Я могла бы неделями, нет, месяцами смотреть, какими разными способами они запускают друг в друга помидоры!"
2302-99 = "Что ещё за бронебойные оперённые подкалиберные томатные снаряды?!"
2302-100 = "Ходят даже слухи, что масштаб фестиваля настолько впечатляет, что Миллениум собирается заключить с ними партнёрство!"
2302-101 = "Поэтому я предлагаю воссоздать такой же Кроваво-багровый фестиваль в Хяккияко, босс!"
2302-102 = "В-Воссоздать?! Здесь?"
2302-105 = "Видите ли, Томатный фестиваль Геенна — это гораздо больше, чем просто бросание помидоров."
2302-106 = "Он ещё и экологичен, потому что позволяет культурно и без отходов использовать излишки помидоров."
2302-109 = "Только представьте возможности, босс!"
2302-110 = "Если мы сможем воссоздать его здесь..."
2302-111 = "Хяккияко выкупит все лишние помидоры у окрестных ферм..."
2302-112 = "А Отдел организации фестивалей станет ведущей силой оживления наших рынков!"
2302-113 = "Это также даст возможность расширить традиционную кухню и открыть новые блюда из помидоров. Разве нет?"
2302-114 = ""
2302-117 = ""
2302-119 = "Так лишние помидоры не будут просто гнить на полях."
2302-120 = "Мы объединимся с местными ресторанами и предложим посетителям фестиваля новые томатные блюда."
2302-121 = "И Хяккияко станет потреблять ещё больше помидоров!"
2302-122 = "А дополнительным бонусом станет то, что для уборки после фестиваля понадобятся профессиональные уборщики и прачечные."
2302-123 = ""
2302-125 = ""
2302-126 = ""
2302-127 = "Эти местные отрасли получат больше заказов, что, в свою очередь, подстегнёт нашу экономику."
2302-128 = "Умика, ты настоящее вдохновение!"
2302-129 = "Твои путешествия явно не прошли зря и расширили знания о нашем ремесле!"
2302-130 = "Мне даже в голову не приходили все эти замечательные возможности."
2302-132 = "Н-неужели?"
2302-133 = "Оживление местной экономики — безусловный плюс, так что, может быть, это и правда..."
2302-134 = ""
2302-136 = ""
2302-137 = "Нет! Чуть не повелась! У нас нет бюджета на всё это!"
2302-138 = "И ответственность слишком большая. Люди могут пострадать! Отклонено!"
2302-139 = "Ничего страшного. Я наблюдала за фестивальными традициями множества разных мест!"
2302-140 = "В Академии искусств Вайлдхант проводят общешкольный фестиваль, уникальный для их района."
2302-141 = "Вот это уже звучит лучше. Никакой крови и подкалиберных штук."
2302-142 = "Правда? Правда?"
2302-143 = "И, как я сказала, у них есть очень необычная особенность в постановке. Когда думаешь о спектакле..."
2302-144 = "Я вся внимание! Да? Да?"
2302-145 = ""
2302-147 = ""
2302-148 = ""
2302-150 = "Они стремятся к реализму, чтобы добиться настоящего погружения!"
2302-151 = "Поэтому прямо на сцене устанавливают MG5! И используют все сто патронов!"
2302-152 = "В ответ противоборствующая сторона применяет зажигательные боеприпасы! Пламя! Огонь!"
2302-153 = "В драматичном финале сцена рушится, сгорает дотла и взрывается ровно в момент окончания пьесы!"
2302-154 = "Клубам дают полную свободу выражать искусство любыми средствами!"
2302-155 = "Всё соединяется в прекрасный калейдоскоп взрывов! Разрушения и хаоса! Долой институты!"
2302-156 = "Обожаю! В конце концов, взрывы — истинная сущность искусства!"
2302-157 = "Или... это было разрушение?"
2302-159 = "Не думаю, что хоть одно из этих слов вообще должно стоять в одном предложении со словом «фестиваль»!"
2302-160 = "И... откуда ты всё это взяла?"
2302-161 = "Из интернета!"
2302-162 = ""
2302-164 = ""
2302-165 = ""
2302-166 = "В последний раз повторяю! Не всё, что пишут в интернете, правда, Умика."
2302-167 = "А. Точно, ты уже говорила мне об этом. Ладно, а как насчёт гоночного фестиваля в сельской академии?"
2302-168 = "Тихая сельская академия... Звучит очень умиротворяюще. Расскажи подробнее. Это вроде легкоатлетических соревнований?"
2302-169 = "Если точнее, это фестиваль технических гонок."
2302-170 = "Ч-Что значит «технических»?!"
2302-171 = "Именно то и значит! Они гоняют на модифицированных машинах, увешанных всем оружием, какое только можно придумать: зенитными пушками, ракетницами, автоматическими пулемётами — всем, что влезет!"
2302-172 = "Нужно огромное техническое мастерство, чтобы вести машину с таким нестабильным центром тяжести и выжимать предел скорости из их нелегально установленных V8...!"
2302-173 = "Это открыло мне совершенно новый мир!"
2302-174 = "Такая гонка вдохнёт в наши улицы совсем новую энергию! Это воплощение жизни на полную катушку."
2302-176 = "Я хочу впитать эту энергию!"
2302-177 = "Вот что нам нужно, чтобы расшевелить студентов!"
2302-179 = "Нет, нет и ещё раз нет! Ни за что! В Хяккияко слишком строгие правила для нелегально модифицированных машин, особенно с таким вооружением."
2302-181 = "Отклонено!"
2302-182 = ""
2302-185 = ""
2302-188 = ""
2302-189 = "Я тебя умоляю, Умика... У тебя есть хоть что-нибудь, что подходит бренду Момоёдо? На этом этапе я уже соглашусь на что угодно..."
2302-190 = "Что-то в духе нашего бренда... Хм. Есть один фестиваль. Но он довольно невзрачный..."
2302-191 = "Я, если честно, не очень понимаю, какая от него польза... и он далеко не такой захватывающий, как нелегальные автогонки..."
2302-192 = "Потенциала оживить торговый район у него намного меньше, но..."
2302-193 = "Во время путешествий мне всё же попался небольшой фестиваль, который на мгновение привлёк моё внимание."
2302-194 = ""
2302-196 = ""
2302-198 = "Он назывался Фестивалем ив."
2302-199 = ""
2302-202 = ""
2302-203 = "И что там делают? Может, раскачиваются на ветвях ивы?"
2302-204 = ""
2302-206 = ""
2302-208 = "Ничего подобного. Люди просто собираются вместе и делают украшения, похожие на ивовые ветви. А потом все участники идут вдоль берега реки, держа их в руках."
2302-209 = ""
2302-211 = ""
2302-212 = "Их чувства и добрые намерения объединяются, пока они смотрят, как ветви качаются на ветру или плывут по воде."
2302-213 = "Это фестиваль, посвящённый спокойствию жизни."
2302-214 = "Торговцы готовят праздничные угощения в форме ив, например конфеты и выпечку."
2302-215 = "Согласно легенде, положительная энергия, накопленная в ивовых ветвях, защищает местных жителей и приносит им благословение."
2302-216 = "Из этой легенды и вырос фестиваль."
2302-218 = "Как замечательно! Я и не знала, что ивы имеют такое значение!"
2302-219 = ""
2302-221 = ""
2302-223 = "Очень красиво! Скорее всего, легенда возникла потому, что ивы способны очищать воду поблизости."
2302-224 = "Кора и листья ивы ещё и обладают лечебными свойствами, поскольку содержат салициловую кислоту."
2302-225 = "Если смешать её с уксусной кислотой, можно получить ацетилсалициловую кислоту. Иными словами, жаропонижающее и обезболивающее, которым местные пользовались веками."
2302-226 = "Я ещё слышала историю об измученном путнике, который проходил через город и отчаянно хотел пить. Жители добавили в воду ивовые листья, чтобы приободрить его и не дать выпить слишком много слишком быстро и навредить себе."
2302-227 = "Какая романтичная история!"
2302-228 = "Я тоже подумала, что это очень красиво!"
2302-229 = "Когда фестиваль только появился, люди использовали настоящие ивовые ветви..."
2302-230 = "Но местные не хотели вредить деревьям, поэтому начали делать декоративные ветви сами!"
2302-231 = ""
2302-233 = ""
2302-235 = ""
2302-236 = ""
2302-237 = "Вот именно это нам и было нужно, Умика!"
2302-238 = "Ты потрясающая! Ничего другого я от тебя и не ожидала."
2302-239 = ""
2302-242 = ""
2302-243 = "Я согласна с президентом! Меня очень тронули и происхождение фестиваля, и связанные с ним истории. Вот это наша Умика."
2302-244 = "П-Правда?"
2302-245 = "Я удивлена! Но очень рада. Главное, что тебе понравилось, босс!"
2302-246 = "Знаю! Вместо одних только веток потратим весь бюджет на огромную модель ивы!"
2302-248 = "А ну стой!"
2302-249 = "А-А?"
2302-250 = "Но..."
2302-252 = "Исходной идеи вполне достаточно!"
2302-253 = ""
2302-256 = ""
2302-257 = "Немного скромно, но если ты так говоришь, босс."
2302-258 = ""
2302-260 = ""
2302-261 = "Тогда на этом сегодняшнее собрание окончено!"
2302-263 = "Да! Идея Умики станет идеальной основой для фестиваля торгового района!"
2302-264 = "П-Правда?! Ну, большую часть презентации действительно делала я, но уверена, что босс—"
2302-265 = "Но идея хорошая, Умика. И волноваться не о чем. Ты ведь не одна этим занимаешься!"
2302-266 = "Члены Фестивального отдела преданы друг другу — через кровь, пот и слёзы!"
2302-268 = "Именно! Фестивали существуют для всех без исключения!"
2302-269 = ""
2302-271 = ""
2302-273 = "Так что вперёд! Докажем, почему нас называют Фестивальным отделом!"
2302-275 = ""
2302-276 = "Есть, мэм! Пойдём, Умика!"
2302-277 = "Д-Да! Босс! Пина!"
2302-280 = "Так началось блестящее выступление Фестивального отдела!"
2302-281 = "Снова! Собрание Фестивального отдела!"
