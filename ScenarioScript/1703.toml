[translation]
1703-1 = "Призрак в палате, часть 3"
1703-2 = "Главная больница Святой Терезы, 4-й этаж — пустующее отделение"
1703-3 = "Погодите, что? Вы не настоящий призрак?"
1703-4 = "Да! Я именно это и твержу всё это время!"
1703-5 = "Но все эти спецэффекты... И играли вы так хорошо... Я правда решила, что вы настоящий призрак!"
1703-6 = "А зачем вы бродили здесь, притворяясь призраком? Играли в прятки в пустующем отделении?"
1703-7 = "С чего бы мне притворяться призраком по такой дурацкой причине?! Я пробрался сюда, чтобы распугать людей и спокойно воровать вещи!"
1703-8 = "Воровать? Воровать плохо!"
1703-9 = "Я-Я знаю! Н-Но у меня не было выбора... Только так я мог найти потерянную память об отце!"
1703-10 = "Память об отце? Почему вы ищете её именно здесь, в больнице?"
1703-11 = "В прошлом году моему отцу делали операцию в этой больнице. Но когда пришло время выписываться, я совсем забыл про его ожерелье. Так оно и потерялось..."
1703-12 = "Я не хотел причинять вред другим пациентам... но в больнице мне не разрешали подняться сюда, поэтому другого выхода не было!"
1703-14 = "Так вот почему... Понятно."
1703-15 = "Мы поможем вам найти память вашего отца!"
1703-17 = "Правда? Но я ведь притворялся призраком, чтобы воровать... Вы уверены?"
1703-18 = "Девиз Рыцарей исправительного курса — помогать каждому, кто попал в беду. Просто пообещайте, что не тронете ничего чужого!"
1703-19 = "Конечно! Обещаю уйти сразу, как только найду ожерелье отца!"
1703-20 = "Хорошо! Ханаэ, давай осмотримся и поищем что-нибудь важное!"
1703-22 = "Хорошо!"
1703-25 = "На этой полке железный ящик! Наверняка внутри полно ценных вещей... Поможете его передвинуть?"
1703-26 = "О! Секунду!"
1703-28 = "Уф! Фух, тяжёлый. Интересно, что там внутри."
1703-29 = "Отдай!"
1703-30 = "Дай мне этот сейф!"
1703-32 = ""
1703-34 = "Господин Призрак, зачем вы это делаете?!"
1703-35 = "Ха-ха-ха, я вас обманул, дурочки!"
1703-36 = "Я выдумал всю историю про память отца! Я пробрался в эту больницу, чтобы немного подзаработать!"
1703-37 = "А вы сами вызвались мне помогать. Студенты Тринити такие наивные! Ха-ха-ха!"
1703-38 = "Что? Как можно пользоваться чужой добротой? Это так подло!"
1703-39 = "Сами виноваты, что поверили. Я не отвечаю за ваши глупые решения!"
1703-40 = "Теперь этот сейф мой!"
1703-41 = ""
1703-43 = "Эй! Ты в порядке?"
1703-44 = "Я-Я в порядке. Но нам нужно вернуть украденный сейф у призрака..."
1703-45 = "Не волнуйся. Этот ящик — не обычный сейф. Это автоклав, который используют в больницах!"
1703-46 = "А? Что такое автоклав?"
1703-47 = "Ну, в нём действительно хранится много ценного оборудования, так что он похож на сейф, но внутри ещё и пар под высоким давлением. Если силой открыть дверцу, он весь рванёт с оглушительным хлопком!"
1703-48 = "*бах*"
1703-49 = "А-а-а!"
1703-50 = "..."
1703-51 = "..."
1703-52 = "Ханаэ, пожалуйста, в следующий раз говори о таких вещах заранее. Кто-то серьёзно пострадал."
1703-53 = "Обязательно!"
1703-55 = "Палата Главной больницы Святой Терезы"
1703-56 = "На следующее утро..."
1703-57 = "Дамы и господа, Рыцари исправительного курса прибыли!"
1703-58 = "Доброе утро. Как вам спалось?"
1703-59 = "Я вообще не смогла уснуть из-за шума этажом выше..."
1703-60 = "Сначала там была куча выстрелов, а потом что-то будто бомба взорвалась! Это был кошмар!"
1703-61 = "Кстати, вы двое прошлой ночью дежурили вместо медсестёр. Никого подозрительного не видели?"
1703-62 = "Ну... мы даже близко к четвёртому этажу не подходили, потому что слишком боялись призрака. Я... понятия не имею, что это был за взрыв."
1703-63 = "Что? Если собираешься дежурить ночью в больнице, нельзя бояться призраков!"
1703-64 = "Но именно поэтому Сэрина такая милая! Правда же, новичок?"
1703-65 = "Эм, ага. Ха-ха-ха."
1703-66 = "О, господин Призрак. Вот вы где!"
1703-67 = "Я искала вас с тех пор, как вы исчезли, ничего не сказав!"
1703-68 = "О чём ты, Ханаэ? Этот пациент поступил только сегодня утром. Вы уже знакомы?"
1703-69 = "Почему этот новичок уже успел познакомиться с Ханаэ?! Ненавижу!"
1703-70 = "Кстати, «господин Призрак» — странное прозвище. Откуда оно?"
1703-71 = "А, это потому, что господин Призрак притворялся призраком в пустом отделении на четвёртом этаже..."
1703-72 = "Нет, неправда! Меня так называют, потому что я страшно выгляжу... Как призрак!"
1703-73 = "Что? Как скучно. Я ожидала куда более интересную предысторию..."
1703-75 = "Да что с вами такое?! Кто вы вообще? Почему постоянно ходите за мной и пристаёте?!"
1703-76 = "Мы? Мы Рыцари исправительного курса! Мы идём туда, где есть пациенты."
1703-77 = "Мы не пытаемся вас доставать. Мы хотим помочь! Не нужно нас бояться!"
1703-78 = "Но откуда мне знать, что вы не затаили обиду после вчерашнего?"
1703-79 = "Какую обиду? Ты пострадал из-за нашей ошибки, поэтому мы просто хотим помочь тебе выздороветь как можно скорее."
1703-80 = ""
1703-81 = ""
1703-83 = "Но... укол будет немного больно, хорошо?"
1703-85 = ""
1703-86 = ""
1703-87 = ""
1703-88 = ""
1703-89 = ""
1703-90 = "Нет, пожалуйста, только не укол! Я терпеть не могу иглы... Пощадите!"
1703-91 = "Призрак в палате"
