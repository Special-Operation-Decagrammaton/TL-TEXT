[translation]
21070-1 = "Эпизод 7;Слишком велик, чтобы называться пушкой"
21070-2 = "Департамент Разработки Игр Милленниума"
21070-3 = "У всех студентов Милленниума — да и вообще Кивотоса — есть личное оружие."
21070-4 = "Так что тебе тоже понадобится, Алиса."
21070-5 = "И есть только одно место, где тебе быстро найдут что-нибудь подходящее."
21070-6 = "Инженерный Департамент."
21070-7 = "Это новое слово. \"Ин...же...нерный\"?"
21070-8 = "Это клуб экспертов, которые в Милленниуме создают и ремонтируют машины."
21070-9 = "Их участников называют мастерами."
21070-10 = "Они в целом много занимаются техникой и ещё переделывают школьное оружие..."
21070-11 = "Так что у них наверняка завалялась пара лишних пушек."
21070-12 = "Ладно, пошли!"
21070-14 = "Мастерская Инженерного Департамента"
21070-15 = "...Понятно."
21070-16 = "Вы хотите подобрать вашей однокласснице оружие получше."
21070-17 = "Что ж, вы пришли по адресу."
21070-18 = "Способный студент без подходящего оружия — ничто."
21070-19 = "Посмотрите в тот угол — там несколько наших прототипов."
21070-20 = "Можете брать что угодно, выбирайте."
21070-21 = "Ого! Спасибо большое, Утаха!"
21070-22 = ""
21070-23 = ""
21070-24 = "Эм, привет. Я Хибики, первокурсница... Давай подберём тебе что-нибудь особенное."
21070-25 = "Как насчёт этого?"
21070-27 = "О, пистолет."
21070-28 = "Мне кажется, у этой девушки, э-э, не очень много боевого опыта. Я права?"
21070-29 = "Отрицательно. Я уже 27 раз спасала человечество, 46 раз побеждала короля демонов и исследовала сотни подземелий."
21070-31 = "..."
21070-32 = "Это, э-э, весьма богатый опыт."
21070-33 = "Но с огнестрельным оружием ты, похоже, новичок."
21070-34 = "Тогда пистолет подойдёт идеально. У него лёгкая пластиковая рама и почти нет отдачи."
21070-35 = "Отличное оружие для новичка, но есть у него и кое-что ещё получше."
21070-36 = ""
21070-37 = "У этой модели есть совершенно новая функция, которой до недавнего времени вообще не существовало в истории нашей школы."
21070-39 = "Ч-Что же это?"
21070-40 = "Звучит впечатляюще. Рассказывай."
21070-41 = "Новая функция, которая перевернёт мир огнестрельного оружия..."
21070-42 = "Блютуз."
21070-43 = "...А?"
21070-44 = "Это единственный в мире пистолет, который позволяет без проводов слушать музыку и передавать файлы по Bluetooth."
21070-45 = "Ещё он работает как цифровой ключ от машины и им можно прикладываться к IC-панелям в общественном транспорте."
21070-46 = "А если включить NFC, им даже можно расплачиваться в магазинах у дома."
21070-47 = "Э-Это потрясающе."
21070-48 = "Но представь лицо кассира, если достать пистолет и сказать: \"Я расплачусь вот этим!\""
21070-49 = "Ну как тебе, Алис— Погоди, куда она делась?"
21070-50 = "А, вот она."
21070-51 = "Она смотрит на..."
21070-52 = ""
21070-54 = "(пристально смотрит)"
21070-55 = ""
21070-57 = "Это...?"
21070-58 = "Хе-хе. Глаз у тебя намётан, покупатель."
21070-59 = "Ты кто?"
21070-60 = "Я Котори, одна из мастеров Инженерного Департамента и мастер объяснений!"
21070-61 = "...?"
21070-62 = "А ты, должно быть, Алиса, четвёртая участница Департамента Разработки Игр!"
21070-64 = "О, привет ещё раз, Котори. Что это за огромная штука?"
21070-67 = "Похоже на... пушку."
21070-68 = "Отличная дедукция, Мидори. На неё ушло примерно 70 процентов бюджета клуба на второе полугодие..."
21070-69 = "Позвольте представить наш самый амбициозный проект — рельсотрон для межгалактического линкора!"
21070-70 = "М-Межгалактического линкора... Это уже безумие..."
21070-71 = "Разве у кучи людей не было жуткой простуды, когда вы пытались сделать ту установку криосна?"
21070-72 = "Ну, вообще Direct to Future Express до сих пор используется..."
21070-73 = "...правда, теперь как холодильник. Мы отправляем еду в далёкое будущее, так что полным провалом это не было."
21070-74 = "Ну и название для холодильника!"
21070-75 = "Инженерный Департамент собирается разработать межгалактический линкор — сразу после вертолётов и универсальных рабочих роботов!"
21070-76 = "Этот рельсотрон — начало плана. Оружие с боевыми снарядами для использования в вакууме космоса! В истории Милленниума такого ещё никто не делал!"
21070-77 = "Когда ты так говоришь, мне самой становится интересно!"
21070-78 = "Мне тоже! Если кто и сможет сделать это, то наш Инженерный Департамент!"
21070-79 = "Хи-хи! Можете на нас рассчитывать!"
21070-80 = "Но вообще-то, эм... весь план пока заморожен."
21070-81 = "Зачем ты сначала так меня завела, чтобы тут же обломать?!"
21070-82 = "Как обычно, проблема не в нехватке фантазии или страсти, а в бюджете."
21070-83 = "На одну эту пушку ушло 70 процентов бюджета семестра. Для межгалактического линкора нам понадобится в тысячу раз больше..."
21070-84 = "Тогда зачем вы вообще сделали эту пушку?!"
21070-85 = ""
21070-87 = "Какой разочаровывающий вопрос, Момои."
21070-88 = "Всё просто. Потому что... мы любим лазерные лучи."
21070-89 = "*кивает* *кивает*"
21070-90 = "Хорошо сказано, Утаха. Разумеется, я полностью согласна. Если Момои не ценит лазеры, значит она просто глупа."
21070-91 = "Я окружена идиотами!"
21070-92 = ""
21070-93 = "Кстати, официальное название этого проекта, созданного из чистой страсти..."
21070-94 = "\"Сверхновая: Меч Света\"!"
21070-95 = "Очередное пафосное название..."
21070-96 = "...!"
21070-97 = "Меч Света?!"
21070-98 = "Ого! Посмотрите, как у Алисы глаза загорелись!"
21070-99 = "Ого! Невероятно!"
21070-100 = "Я-Я никогда не видела её такой взволнованной."
21070-101 = "Я... хочу его."
21070-102 = "...А?"
21070-103 = ""
21070-104 = "О великие кузнецы стали, даруйте мне мощь дыхания дракона."
21070-106 = "Э-э-э... приятно видеть, что ты так... воодушевлена."
21070-107 = "Но выполнить эту просьбу мы никак не можем!"
21070-109 = "Но вы же сказали, что всё в этом углу можно брать!"
21070-110 = "...У нас есть причины."
21070-111 = "Какие ещё причины?"
21070-112 = "Мой уровень слишком низкий? Какие характеристики нужны, чтобы экипировать это оружие?"
21070-113 = "Не совсем это я имела в виду..."
21070-114 = "В таких вопросах нужно быть реалистами."
21070-115 = "А. Так и знала. Дело в деньгах."
21070-116 = "Не волнуйся, Алиса. Если понадобится, я готова расстаться с FlyStation Мидори."
21070-117 = "...И это тоже не то."
21070-118 = "Тогда насчёт чего быть реалистами, если дело не в деньгах?!"
21070-119 = "Не поймите неправильно, бюджет действительно вызывает опасения."
21070-120 = "Но есть кое-что куда более давящее....#nЭто оружие слишком тяжёлое для личного использования."
21070-122 = "Сам рельсотрон, наверное, весит 140 килограммов. Добавьте оптическую систему точности и батарею... выйдет почти 200 килограммов!"
21070-124 = "Хм..."
21070-125 = "Именно. Мы все рады, что тебе так понравилось наше творение, и если бы ты действительно могла им пользоваться, думаю, мы смогли бы с ним расстаться."
21070-126 = "...?"
21070-127 = "Ох?!"
21070-128 = "Уверена ли ты, что никакое наваждение не затуманивает твои мысли, техномаг?"
21070-129 = "А? Она снова странно говорит..."
21070-130 = "Д-Думаю, она спрашивает, серьёзно ли ты насчёт того, что только что сказала."
21070-131 = "Конечно. Как насчёт этого — хочешь попробовать поднять?"
21070-132 = "*кивает*"
21070-133 = ""
21070-134 = "*пододвигается вперёд*"
21070-135 = "Та, что вознесёт это оружие ввысь..."
21070-136 = "...будет править этой землёй!"
21070-137 = "Ха-ха! Вот это настрой."
21070-138 = ""
21070-139 = "*хвать*"
21070-140 = "Оп...!"
21070-141 = "О-Осторожно. Не поранься... Нам правда стоило сначала подогнать сюда кран—"
21070-142 = ""
21070-143 = "Ха-а-а-а-а!"
21070-144 = "Чт..."
21070-145 = "ЧЕГО?!"
21070-146 = "*фьюх*"
21070-147 = "Ура! Я-Я смогла!"
21070-148 = "Быть... не может..."
21070-149 = "Эмм... И как тут расположены кнопки? Вот это правый курок...?"
21070-150 = "П-Погоди!"
21070-152 = "Слепящий Свет!"
21070-153 = ""
21070-155 = "*БА-А-АХ*"
21070-156 = "А-а-а! Крыша!"
21070-157 = "...Невероятно."
21070-158 = "Я экипирую это в слот оружия."
21070-159 = "П-Постой! Выбери что-нибудь другое! Мы столько бюджета в него вложили..."
21070-160 = "Всё нормально..."
21070-161 = "Пусть забирает."
21070-162 = "Ты правда не против, Утаха?"
21070-163 = "Всё равно больше никто им не может пользоваться."
21070-164 = "Хибики, сделай плечевой ремень и добавь несколько ручек, чтобы Алисе было проще его носить."
21070-165 = "Будет сделано."
21070-166 = "Зато мы сможем собрать много хороших данных из, эм, реальных боевых ситуаций."
21070-167 = "Безумие. Будто мы только что получили суперредкий предмет! Спасибо вам!"
21070-168 = "С-Спасибо!"
21070-169 = "Благодарить пока рановато."
21070-170 = "Что теперь?"
21070-171 = ""
21070-172 = "Хибики. Принеси всех дронов и роботов, которых мы собирались выбросить."
21070-173 = "...Хорошо."
21070-175 = "Что Утаха задумала?"
21070-176 = "А! Может, она не собирается так просто отдавать рельсотрон."
21070-177 = "Быстро соображаешь."
21070-178 = "Если хотите это оружие..."
21070-179 = ""
21070-181 = "...придётся сначала пройти через нас!"
21070-182 = "Ох?!"
21070-183 = "С-Серьёзно?! Я думала, ты сказала, что мы сможем забрать его, если она сумеет поднять, Утаха!"
21070-184 = "М-Мы просто хотели оружие для Алисы..."
21070-186 = "Будь это любое другое оружие, я бы с радостью отдала."
21070-187 = "Но в случае с этим проектом сначала заслужите моё одобрение."
21070-188 = "Ч-Что это значит?"
21070-189 = "Думаю, это скорее квалификационный экзамен, чем попытка заслужить одобрение."
21070-190 = "Не понимаю..."
21070-191 = ""
21070-193 = "Обнаружены боевые дроны и роботы. Опасность подтверждена."
21070-194 = "Вот они!"
21070-195 = "И-и-и!"
