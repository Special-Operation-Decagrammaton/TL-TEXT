[translation]
21070-1 = "Episódio 7;Grande Demais para Ser Chamada de Arma"
21070-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21070-3 = "Em Millennium... não, todas as alunas de Kivotos têm sua própria arma."
21070-4 = "Por isso, também precisamos arranjar uma arma para a Aris."
21070-5 = "Há várias formas de conseguir uma, mas o lugar mais rápido em Millennium para arrumar uma arma de verdade é..."
21070-6 = "...o Clube de Engenharia, com certeza."
21070-7 = "Clube de... Engenharia?"
21070-8 = "Aqui em Millennium, chamamos de \"Meisters\" os especialistas que constroem e consertam máquinas."
21070-9 = "O Clube de Engenharia é um clube focado em hardware que reúne vários desses Meisters."
21070-10 = "Além de dominarem tudo sobre máquinas, eles também cuidam do conserto e da modificação de armas."
21070-11 = "Acho que eles devem ter várias armas sem uso sobrando por lá."
21070-12 = "Então vamos logo para lá!"
21070-14 = "Clube de Engenharia - Oficina"
21070-15 = "...Entendi, já peguei a ideia geral."
21070-16 = "Vocês querem dar uma arma melhor de presente para a nova integrante... certo?"
21070-17 = "Nesse caso, vir ao Clube de Engenharia foi uma excelente escolha."
21070-18 = "Em Millennium, a vitória ou a derrota dependem muito de ter bons engenheiros ao seu lado."
21070-19 = "Ali naquele canto estão vários protótipos que construímos até hoje."
21070-20 = "Se for algo dali, podem levar o que quiserem."
21070-21 = "Eba! Obrigada, senpai!"
21070-24 = "Oi... sou a Hibiki, do primeiro ano. Se quiser, posso escolher algo legal para você..."
21070-25 = "...Que tal esta aqui, Aris?"
21070-27 = "Uau, uma pistola?"
21070-28 = "Pelo que parece, provavelmente... você ainda não tem muita experiência em combate..."
21070-29 = "Aris nega essa afirmação. Até hoje, Aris salvou a humanidade 27 vezes, travou 46 batalhas contra o exército do Rei Demônio e explorou mais de cem masmorras. A experiência de Aris é razoavelmente rica."
21070-31 = "..."
21070-32 = "Nossa, que incrível..."
21070-33 = "De qualquer forma, parece que você não tem muita experiência usando armas de fogo..."
21070-34 = "Para alguém assim, uma pistola é o ideal... Esta é feita de plástico, então é leve e tem pouco recuo..."
21070-35 = "Nesse sentido, é bem amigável para iniciantes... E, acima de tudo..."
21070-37 = "Esta arma vem equipada com uma função que nunca existiu antes na história de Millennium."
21070-39 = "O-O que é?"
21070-40 = "Já parece incrível antes mesmo de saber... que função é essa?"
21070-41 = "É a..."
21070-42 = "Função \"Bluetooth\"."
21070-43 = "...Hã?"
21070-44 = "Uma pistola capaz de tocar música e até transferir arquivos via Bluetooth... Até onde pesquisei, nunca existiu nada assim antes."
21070-45 = "...Claro, também tem a função Sumomo. Dá para encostar no leitor de cartão da estação e usar o transporte público."
21070-46 = "E ainda tem NFC, então você consegue até fazer pagamentos em lojas de conveniência..."
21070-47 = "B-Bem, se for parar para pensar, até que é impressionante, mas..."
21070-48 = "Se você sacar uma pistola na loja de conveniência dizendo \"vou pagar com isso\", o atendente vai morrer de susto!"
21070-49 = "Ué, falando nisso, cadê a Aris-chan...? Aris-chan, Aris-chaaan?"
21070-50 = "...A-Ali."
21070-51 = "...Aquilo é..."
21070-54 = "(Encarando fixamente...)"
21070-57 = "Isto é...?"
21070-58 = "Hehehe... Você tem um excelente olho, cliente."
21070-59 = "H-Hã...?"
21070-60 = "Precisando de uma explicação, entrego a resposta a qualquer hora e em qualquer lugar! Sou Kotori, Meister do Clube de Engenharia!"
21070-61 = "...?"
21070-62 = "Você é a Aris, certo? A quarta integrante do Clube de Desenvolvimento de Jogos!"
21070-64 = "Ah, Kotori-chan, quanto tempo. Aliás, o que é essa coisa enorme que a Aris-chan está olhando?"
21070-67 = "Parece até um... \"canhão\"."
21070-68 = "Boa pergunta, Midori. Isto foi construído usando quase 70% do orçamento do segundo semestre do Clube de Engenharia..."
21070-69 = "É o projeto ambicioso do Clube de Engenharia: o \"Railgun para Nave de Guerra Espacial\"!"
21070-70 = "Nave de guerra espacial...? Vocês aprontaram outra loucura..."
21070-71 = "Antes vocês também não tentaram fazer sono criogênico, construíram uma cápsula de hibernação dizendo \"nos vemos no futuro\", causaram a maior confusão e no fim todo mundo só pegou um resfriado?"
21070-72 = "...Aquele \"Expresso Direto para o Futuro\" ainda é muito usado até hoje."
21070-73 = "...Bem, como geladeira, claro. Agora conseguimos enviar comida para um futuro mais distante, então não foi um fracasso."
21070-74 = "Que nome exagerado para o uso que tem!"
21070-75 = "Voltando ao assunto, depois de helicópteros e robôs utilitários, o objetivo atual do Clube de Engenharia é desenvolver uma nave de guerra espacial!"
21070-76 = "Este railgun é o primeiro passo. Uma arma de projéteis sólidos desenvolvida para combate fora da atmosfera! Claramente uma iniciativa inédita na história de Millennium!"
21070-77 = "Que irado... Só de ouvir já fico empolgada!"
21070-78 = "Como esperado do Clube de Engenharia de Millennium! Desta vez está dando tudo certo, né?!"
21070-79 = "Hehehe, mas é claro!"
21070-80 = "É o que eu gostaria de dizer, mas no momento está meio pausado..."
21070-81 = "Quêêê?! Por quê?! Eu estava toda animada!"
21070-82 = "Como sempre, o que segura os engenheiros em qualquer época não é a falta de imaginação ou paixão, mas sim o orçamento..."
21070-83 = "Só para construir este railgun já foram 70% do orçamento do segundo semestre, então imagina quantos milhares de vezes mais custaria construir a nave de guerra espacial em si..."
21070-84 = "Mas isso dava para saber já na fase de planejamento! Por que diabos vocês levaram esse railgun até a conclusão?!"
21070-87 = "Pergunta tola, Momoi."
21070-88 = "...Porque um canhão de raios é puro romantismo."
21070-89 = "(Acena com a cabeça)"
21070-90 = "Exatamente! Não entender o charme de um canhão de raios... Ai, ai, só a Momoi mesmo."
21070-91 = "São umas idiotas! Um bando de idiotas mesmo sendo tão inteligentes!"
21070-93 = "E o nome oficial desta arma, onde toda a paixão do Clube de Engenharia foi depositada, é..."
21070-94 = "\"Espada da Luz: Supernova\"!"
21070-95 = "Mais um nome exagerado à toa..."
21070-96 = "...!"
21070-97 = "E-Espada da Luz...?!"
21070-98 = "O-Os olhos da Aris estão brilhando...?!"
21070-99 = "Uau, uauuu...!"
21070-100 = "Acho que é a primeira vez que vejo a Aris-chan tão animada assim."
21070-101 = "...Eu quero isto."
21070-102 = "...Hã?"
21070-104 = "Ó grande artesã do aço, desejo possuir esse sopro do dragão."
21070-106 = "Hmm, fico feliz que diga isso, mas..."
21070-107 = "Sinto muito, mas esse pedido infelizmente não dá para atender!"
21070-109 = "Por quê?! Você disse que a gente podia levar qualquer coisa desta sala!"
21070-110 = "...É que tem um motivo."
21070-111 = "Motivo?"
21070-112 = "Será que meu nível ainda não é suficiente...? Por favor, informe o nível necessário para equipar!"
21070-113 = "Não, desculpe, não é esse tipo de problema..."
21070-114 = "É um problema bem mais realista."
21070-115 = "Dinheiro, né..."
21070-116 = "Não se preocupe, Aris. Nem que eu tenha que vender o PryStation da Midori..."
21070-117 = "...Também não é uma questão de dinheiro."
21070-118 = "Na realidade não existe problema maior do que dinheiro!"
21070-119 = "Bem, em termos de orçamento de fabricação, até concordo em parte, mas..."
21070-120 = "...Esta arma é grande e pesada demais para ser usada como armamento individual."
21070-122 = "Acredite se quiser, só o peso base já passa de 140 kg! E se somar a mira óptica e a bateria na hora do disparo, o recuo instantâneo ultrapassa 200 kg!"
21070-124 = "..."
21070-125 = "Só de você ter achado ela legal, já ficamos felizes. Obrigada. Se você conseguisse levar, nós realmente te daríamos, mas..."
21070-126 = "...?"
21070-127 = "...!"
21070-128 = "...Tu juras que não há uma única sombra de mentira nessas palavras?"
21070-129 = "Hmm? Essa garota voltou a falar daquele jeito..."
21070-130 = "A-Acho que ela está perguntando se é verdade mesmo."
21070-131 = "Claro que não estou mentindo, mas... isso quer dizer que você pretende levantar aquilo?"
21070-132 = "(Acena com a cabeça)"
21070-134 = "(Se aproxima...)"
21070-135 = "Aquele que sacar esta arma..."
21070-136 = "...há de se tornar o soberano desta terra!"
21070-137 = "Hehehe, entendi. A determinação é admirável!"
21070-139 = "(Agarra firme)"
21070-140 = "Hmph...!"
21070-141 = "É melhor não forçar... Sem um guindaste, não dá para levantar—"
21070-143 = "Hnnnnngh...!"
21070-144 = "...Não pode ser."
21070-145 = "Quêêê?!"
21070-146 = "(Erguendo com força—!)"
21070-147 = "...L-Levantou!"
21070-148 = "Mentira... Não acredito..."
21070-149 = "Hmm, o botão... Será que este é o botão B...?"
21070-150 = "E-Espere...!"
21070-152 = "...Ó luz!!!"
21070-155 = "(KABOOOOM!)"
21070-156 = "Aaaaaah! O-O teto da nossa sala do clube?!"
21070-157 = "...Incrível."
21070-158 = "Aris vai equipar esta arma."
21070-159 = "E-Ela conseguiu usar mesmo... M-Mas logo essa, bem...! Por questões de orçamento e tudo mais, se puder escolher outra, por favor...!"
21070-160 = "...Não,"
21070-161 = "Tudo bem, pode levar."
21070-162 = "Utaha-senpai... Tem certeza mesmo?"
21070-163 = "Sim. De qualquer forma, ninguém além desta garota conseguiria usá-la."
21070-164 = "Hibiki, depois faça uma alça de ombro e uma empunhadura para ficar mais fácil para a Aris carregar."
21070-165 = "Entendido."
21070-166 = "...Pensando pelo lado positivo, poder coletar dados em combate real até que é uma boa."
21070-167 = "Uau, acabamos ganhando uma arma absurda! Obrigada!"
21070-168 = "M-Muito obrigada!"
21070-169 = "Não, ainda é cedo para agradecer."
21070-170 = "Hã?"
21070-172 = "Pois bem... Hibiki, libere todos os drones e robôs que recebemos pedido de descarte antes."
21070-173 = "...Certo."
21070-175 = "Hmm... Utaha-senpai? Parece que a situação tomou um rumo estranho..."
21070-176 = "Por acaso isso não é aquele clichê de \"não vamos deixar vocês levarem a arma tão fácil assim!\", né?!"
21070-177 = "Exatamente isso."
21070-178 = "Se realmente querem levar essa arma..."
21070-181 = "Terão que nos derrotar primeiro!"
21070-182 = "!?"
21070-183 = "Quêêê! Qual é, Utaha-senpai, por quê?!"
21070-184 = "T-Tudo isso só por causa de uma arma...?"
21070-186 = "Se fosse qualquer outra arma, eu entregaria com prazer, mas..."
21070-187 = "No caso dessa arma, achei necessário fazer uma verificação."
21070-188 = "V-Verificação?"
21070-189 = "Não... talvez seja mais apropriado chamar de \"qualificação\"."
21070-190 = "Qualificação? O que isso..."
21070-193 = "Drones de combate e robôs detectados à frente, assinaturas hostis confirmadas."
21070-194 = "Eles estão vindo!"
21070-195 = "Ah, qual é!"
