[translation]
10002170-1 = "Послесловие;Что произошло до прибытия девушек"
10002170-2 = "Заказ готов!"
10002170-3 = ""
10002170-4 = "Ого!"
10002170-5 = "Это наш хит продаж: якисоба с сыром и тарако."
10002170-6 = "Попробуй и скажи, как тебе, юная леди."
10002170-7 = "С удовольствием!"
10002170-8 = ""
10002170-9 = ""
10002170-10 = "Ням-ням."
10002170-11 = "М-м-м! Вкусно!"
10002170-12 = "Ого, ты и правда набросилась на еду!"
10002170-13 = "Я так испугалась, когда нашла тебя лежащей на улице. В этих краях люди нередко получают тепловой удар."
10002170-14 = "А потом оказалось, что ты потеряла сознание от голода. Сколько же ты не ела?"
10002170-15 = "Я берегла аппетит ради всей той вкусной пляжной еды, о которой слышала..."
10002170-16 = "...но оказалось, сил на дорогу мне совершенно не хватило."
10002170-17 = "К тому моменту, как я добралась сюда, я так вымоталась, что сразу рухнула."
10002170-18 = "Если бы не вы, мне был бы конец! Огромное спасибо!"
10002170-19 = "Не стоит. Я рада, что тебе понравилась еда."
10002170-20 = "Заодно это была хорошая практика перед сегодняшним открытием."
10002170-21 = "Если хотя бы половина клиентов будет так же довольна, как ты, думаю, лето у меня будет удачным!"
10002170-22 = "Возможно. Еда у вас и правда вкусная, но..."
10002170-23 = "Но?"
10002170-24 = "Мне кажется, чего-то не хватает. Может, слишком пресно."
10002170-25 = "Думаю, ей не помешает немного цвета!"
10002170-26 = "К счастью, всё лето я езжу в гастрономические поездки и пробую новое!"
10002170-27 = "Новое, говоришь?"
10002170-28 = "Вот. Особый соус, который я получила от Клуба школьного питания. Может, с ним блюдо станет ещё вкуснее!"
10002170-29 = "Значит, соус из академии Геенна? Почему бы и нет. С удовольствием попробую!"
10002170-30 = "Раз уж так, посмотрю, подходит ли он к моей еде."
10002170-31 = "Правда хотите попробовать? Конечно, держите!"
10002170-32 = ""
10002170-33 = ""
10002170-34 = "Хм. Цвет чернильно-чёрный. Не такого я ожидала..."
10002170-35 = "*нюх* *нюх* А что это за запах? Неужели чёрный кунжут?"
10002170-36 = "Ну, была не была..."
10002170-37 = ""
10002170-38 = "Чёрный кунжут? Нет, кажется, Джури сказала, что это сделано из манго."
10002170-39 = "А? Ман—"
10002170-40 = ""
10002170-41 = "...!"
10002170-42 = ""
10002170-44 = ""
10002170-46 = "А? Почему вы...?"
10002170-47 = ""
10002170-48 = "А-а-а! Вы в порядке?!"
10002170-49 = "Что случилось?! Вы меня слышите?!"
10002170-50 = "Тепловой удар...? Может, из-за того, что вы столько готовили горячую еду под солнцем?"
10002170-51 = "Извините! Я хочу сделать заказ!"
10002170-52 = "Ой нет. Клиенты ждут."
10002170-53 = "Что же делать...?"
10002170-54 = ""
10002170-55 = ""
10002170-56 = "Придумала! Сенсей всегда говорит, что после того, как тебе что-то дали, вежливо отплатить добром. Хозяин приготовил для меня вкусную еду..."
10002170-57 = "...так что теперь моя очередь приготовить вкусную еду для других! Я не дам его жертве пропасть зря!"
10002170-58 = "Сэр, пока вы не проснётесь, ваша лавка в надёжных руках!"
10002170-59 = "Алло? Тут есть кто-нибудь?"
10002170-60 = ""
10002170-61 = "Сейчас подойду принять ваш заказ!"
