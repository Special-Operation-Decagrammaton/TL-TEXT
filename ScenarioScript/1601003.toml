[translation]
1601003-1 = "Воодушевляющая поддержка мастера"
1601003-2 = ""
1601003-4 = "Офис Шале"
1601003-5 = ""
1601003-8 = "Я задержался в офисе допоздна, восстанавливая потерянные данные..."
1601003-9 = ""
1601003-12 = ""
1601003-14 = ""
1601003-15 = ""
1601003-16 = "[ns1] «...?»\n[ns2] «Кто здесь в такой час?»"
1601003-17 = ""
1601003-18 = ""
1601003-21 = "Эм."
1601003-22 = ""
1601003-26 = ""
1601003-27 = "...Привет, Сенсей."
1601003-28 = "Так... Дело в том..."
1601003-29 = "...Ты сказал, что тебе нужна помощь."
1601003-30 = "[s] «Ладно, это я понимаю, но... что за наряд болельщицы?»"
1601003-31 = "Ну... Это чтобы... поддержать тебя."
1601003-32 = "Это совершенно логично. Для любой работы в мире есть одежда, которая, может, и не обязательна, но уж точно оптимальна."
1601003-33 = "Если работаешь в жаре, носишь жаропрочную одежду. Или, эм, меньше одежды, наверное. А если работаешь в пыльном месте, лучше носить... пылезащитную... одежду?"
1601003-34 = "Поэтому очевидно, что лучший способ максимально повысить эффективность поддержки — надеть форму болельщицы. Честно говоря, это само собой разумеется."
1601003-35 = "[s] «...Это ведь форма, которую ты носила на спортивном празднике?»"
1601003-36 = "Она самая."
1601003-37 = "Пусть этот наряд и был неловким прототипом, который я сделала, едва начав заниматься косплеем..."
1601003-38 = "Но, как я уже говорила, самое важное в косплее — не костюм, а правильный настрой."
1601003-39 = "На спортивном празднике у меня не хватило времени полностью погрузиться в роль..."
1601003-40 = "Но сейчас я думаю только о том, чтобы поддержать тебя, так что я точно не провалюсь как болельщица."
1601003-41 = ""
1601003-43 = ""
1601003-45 = ""
1601003-47 = "Так что, эм... пожалуйста, почувствуй поддержку!"
1601003-50 = "― Давай, давай... Сенсей![wa:2410]"
1601003-52 = "― Борись, побеждай. Сенсей...[wa:2360]"
1601003-55 = "― А?[wa:120]"
1601003-57 = "― С чем, по-моему, ты сейчас борешься?[wa:600]"
1601003-60 = "― Эм..."
1601003-63 = "― С работой, наверное? Или...[wa:2420]"
1601003-65 = "― с твоими... обязанностями учителя?[wa:1360]"
1601003-68 = "― Тебе... не нравится?[wa:230]"
1601003-70 = "― Мне изменить кричалку...?[wa:1320]"
1601003-73 = "― Ты сможешь, ты сможешь...! Сенсей![wa:1950]"
1601003-76 = "― ...Не понимаю.[wa:1420]"
1601003-79 = "― (Вместо того чтобы воодушевиться,[wa:780]"
1601003-81 = "― Сенсей, кажется, отвлёкся ещё сильнее.)[wa:1040]"
1601003-84 = "― (...Если подумать ещё раз... Нет,[wa:1650]"
1601003-86 = "― если подумать уже в третий раз, возможно, я занимаюсь какой-то нелепостью...)[wa:90]"
1601003-91 = "Ну... как тебе?"
1601003-92 = "Моя поддержка тебя мотивировала?"
1601003-93 = ""
1601003-95 = ""
1601003-96 = "...То, что я так много двигалась, отвлекало?"
1601003-97 = "Хм... Прости, я этого не учла..."
1601003-98 = "Но если подумать, вполне логично, что эффектная поддержка только отвлекает от работы."
1601003-99 = "Теперь я понимаю, почему работа болельщицы — не офисная..."
1601003-100 = "Я пыталась помочь тебе, а в итоге только отвлекла..."
1601003-101 = "Похоже, мне ещё далеко до звания настоящего мастера..."
1601003-102 = "[s] «Не будь к себе так строга. Я ценю сам жест.»"
1601003-103 = ""
1601003-105 = ""
1601003-106 = "[ns3] «Просто сложно сосредоточиться, когда я так устал.»\n[ns4] «...Можешь оказать мне услугу и принести кофе?»"
1601003-107 = ""
1601003-108 = ""
1601003-110 = ""
1601003-111 = "...Хорошо."
1601003-112 = "Я часто варю кофе, когда всю ночь работаю в Инженерном отделе."
1601003-113 = ""
1601003-115 = ""
1601003-116 = "О, но раз мы не в клубе, сначала придётся собрать устройство высокого давления для концентрации вкуса и достижения оптимальной кофейности..."
1601003-117 = "[s] «...Мне подойдёт обычный кофе.»"
1601003-118 = "...Ладно."
1601003-119 = "Тогда я приготовлю тебе лучшую в жизни чашку неоптимизированного кофе."
1601003-121 = "Благодаря энтузиазму Хибики за моей спиной я смог восстановить данные быстрее, чем ожидал..."
1601003-122 = "Но вскоре разошёлся слух, что поздно ночью я был наедине со студентом в форме болельщицы, из-за чего среди горожан возникло неловкое недоразумение..."
