[translation]
1600003-1 = "Недопонимание"
1600003-2 = "Я-я удивлена, что вы пришли, Сенсей!"
1600003-3 = "Я, эм... думала, что вы просто оставите такого человека, как я, без ответа."
1600003-4 = "Я позвала вас потому... что хотела загладить вину. Ну, после прошлого раза."
1600003-5 = "Я-я знаю, вы всегда так заняты, п-поэтому меньше всего хочу отнимать ваше время. Поэтому я..."
1600003-6 = ""
1600003-7 = ""
1600003-8 = "В-вместо этого я принесла вам вот это. Подарок..."
1600003-9 = "[s] «Цветочный горшок?»"
1600003-10 = "Д-да. Горшок с сорняками... который я сделала. Надеюсь, вам понравится..."
1600003-11 = "..."
1600003-12 = "Н-неважно! К-кому вообще нужны бесполезные сорняки в подарок?"
1600003-13 = "О ч-чём я только думала?!"
1600003-14 = "Простите простите простите простите простите..."
1600003-15 = "А?"
1600003-16 = "Вам нравится, как он украшен? В-вы уверены...?"
1600003-17 = "Вам просто интересно, почему я выращиваю сорняки, а не цветы или что-то ещё?"
1600003-18 = "Я-я..."
1600003-19 = "Х-хе-хе. Выращивать сорняки — моё хобби."
1600003-20 = "Я чувствую с сорняками какое-то родство. Они напоминают мне меня."
1600003-21 = "От них никакой пользы. Все считают их раздражающей помехой."
1600003-22 = "Бесполезные уродливые растения, которые снова и снова лезут из земли. Эти качества..."
1600003-23 = "...напоминают мне меня. Поэтому, когда я смотрю на сорняки, мне кажется, что я не одна."
1600003-24 = "[s1] «Но сейчас они выглядят так красиво.»\n[s2] «По-моему, они очень освежают. А ты как думаешь?»"
1600003-25 = "...П-простите?"
1600003-26 = "...П-простите?"
1600003-27 = "Что вы хотите сказать, Сенсей?"
1600003-28 = "[s3] «Мне нравится их постоянство.»\n[s4] «Благодаря упорству они всегда остаются под рукой.»"
1600003-29 = "..."
1600003-30 = "..."
1600003-31 = "Сенсей...?"
1600003-32 = ""
1600003-34 = "(Ч-что говорит Сенсей? Не может же это относиться ко мне...)"
1600003-35 = "(С-Сенсей... сейчас меня хвалит?!)"
1600003-36 = "(Н-нет, ни за что. Хватит витать в облаках, Харука, тупица!)"
1600003-37 = "(Но... Но...!)"
1600003-38 = "(Но мы ведь одни, и Сенсей говорит прямо со мной. Это может значить...?! )"
1600003-39 = "(Может быть...!)"
1600003-40 = "*шорох*"
1600003-41 = "...?"
1600003-42 = "*шорох* *шорох* *шевеление*"
1600003-43 = "Червяк?"
1600003-44 = "В земле черви..."
1600003-45 = "..."
1600003-46 = "Непро... стительно..."
1600003-47 = "Непростительно. Кто тебе разрешил...? Кто сказал, что ты можешь туда заползать?"
1600003-48 = "Как ты смеешь... превращать мой подарок Сенсею в свой дом?!"
1600003-49 = "Как ты смеешь...?"
1600003-50 = "[s] «Харука?»"
1600003-51 = "Ненавижу ненавижу ненавижу ненавижу ненавижу!"
1600003-52 = "[s] «Харука, успокойся...»"
1600003-53 = "Я убью вас, мерзкие паразиты!"
1600003-54 = ""
1600003-55 = "*щёлк* *БАХ*"
1600003-56 = "*хрясь*"
1600003-57 = "*шлёп*"
1600003-58 = "..."
1600003-59 = "...?"
1600003-60 = "О."
1600003-62 = "(...)"
1600003-63 = "(Пуля разбила горшок, и земля с листьями разлетелись мне прямо в лицо.)"
1600003-64 = "(Земля попала в глаза, я ничего не вижу перед собой.)"
1600003-65 = "[s] Медленно стереть землю и листья с лица."
1600003-67 = "(...?)"
1600003-68 = "(Когда я снова открыл глаза, Харуки нигде не было.)"
1600003-69 = "(На полу остались только осколки разбитого горшка, земля и черви.)"
