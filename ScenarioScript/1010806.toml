[translation]
1010806-1 = "Бессонная ночь Семинара"
1010806-2 = "*вздох*... И сегодня день снова выдался суматошным."
1010806-3 = ""
1010806-5 = ""
1010806-10 = "Комната убрана, так что осталось только—"
1010806-11 = "А! Трансляция вот-вот начнётся! Чуть не пропустила."
1010806-12 = ""
1010806-14 = ""
1010806-16 = "Здравствуйте, с вами диджей Мэри!"
1010806-17 = "В последнее время стало довольно холодно, правда?"
1010806-18 = "Укутывайтесь потеплее в одеяло, чтобы не простудиться из-за перепадов температуры!"
1010806-19 = "Сегодня я прочитаю истории, присланные нашими верными слушателями, и постараюсь ответить на их вопросы."
1010806-20 = "Сегодняшняя история пришла от Х. из Научной школы Миллениума."
1010806-21 = "Ого... это же моя история!"
1010806-22 = "Я просто однажды ночью записала всё, что было у меня в голове, потому что не могла уснуть. Не думала, что её выберут."
1010806-23 = "«Здравствуйте, я студент, которому очень нравится музыкальная программа диджея Мэри.»"
1010806-24 = "«Я начала слушать её по совету подруги. Вы ставите много спокойной классической музыки, которая помогает уснуть, поэтому теперь перед сном у меня всегда играет программа диджея Мэри.»"
1010806-25 = "Вообще-то я люблю энергичный рок, но в это время ставлю только спокойную музыку."
1010806-26 = "Эта программа выходит в час, когда большинство людей уже ложится спать. Не хотелось бы, чтобы из-за меня кто-нибудь начал недосыпать! Ха-ха."
1010806-28 = "«Однако в последнее время моя бессонница стала настолько сильной, что даже программа диджея Мэри больше не помогает.»"
1010806-29 = "«Дело совсем не в подборе песен! У диджея Мэри всегда отличный плейлист, просто когда я ложусь спать, в голове столько мыслей, что я вообще не могу сосредоточиться на музыке.»"
1010806-30 = "«Когда я ложусь в кровать и смотрю в тёмный потолок, мне начинают вспоминаться события прошедшего дня.»"
1010806-31 = "«Я думаю о чём-то вроде: 'Сегодня я могла бы справиться лучше. Что мне улучшить завтра?'»"
1010806-32 = "«Стоит мне начать об этом думать, как тревога прогоняет всякую надежду на сон... Кажется, я страдаю от бессонницы уже почти месяц.»"
1010806-33 = "«Диджей Мэри, есть ли хороший способ избавиться от бессонницы?»"
1010806-35 = "Эм... Слышать, как это зачитывают вслух, немного неловко..."
1010806-36 = "Хм... У нас немало слушателей, которые страдают от бессонницы."
1010806-37 = "Вообще, говорят, что в современном мире бессонница — весьма распространённая хроническая проблема."
1010806-38 = "К сожалению, я обычно засыпаю в течение пяти минут после того, как голова касается подушки, так что, возможно, я не лучший человек для ответа на этот вопрос!"
1010806-39 = "Если кто-то из слушателей этой программы знает хорошие способы справиться с бессонницей, пожалуйста, присылайте свои ответы!"
1010806-40 = "Не то чтобы я многого ожидала, но, похоже, простого решения и правда нет."
1010806-41 = "Наверное, мне остаётся только последовать совету [USERNAME] Сенсея и постараться не думать обо всём слишком много..."
1010806-42 = "Хотя просто расслабиться и почувствовать удовлетворение в конце дня совсем непросто..."
1010806-43 = ""
1010806-45 = ""
1010806-46 = "...По крайней мере, музыка хорошая."
1010806-48 = "Неделю спустя..."
1010806-50 = ""
1010806-51 = ""
1010806-52 = ""
1010806-53 = "Здравствуйте, все! И снова пришло время «Музыкального путешествия диджея Мэри.»"
1010806-54 = "Помните студентку Миллениума, которая на прошлой неделе рассказывала о своей бессоннице? С тех пор нас буквально завалили сообщениями от студентов с похожими проблемами!"
1010806-55 = "Что...?! Моя история была настолько популярной?"
1010806-56 = "Уф, а что, если кто-нибудь узнает, что это я её отправила...?"
1010806-57 = "Большинство писали о схожих переживаниях и выражали сочувствие, но несколько человек прислали советы против бессонницы. Давайте их обсудим!"
1010806-58 = "Это сообщение пришло от... анонимного слушателя по имени «С. из Шале.»"
1010806-59 = "Когда вы говорите, откуда человек, анонимность как-то теряет смысл, не находите...?"
1010806-60 = "...Шале? Неужели это Сенсей?!"
1010806-61 = "Я будто уже слышу громкую реакцию по ту сторону радио."
1010806-62 = "В любом случае, мы делимся историей из анонимного источника, так что просто послушайте и не делайте поспешных выводов!"
1010806-63 = "А теперь я прочту письмо!"
1010806-65 = "«Многие люди боятся сна. Потому что, когда ты засыпаешь, наступает завтра.»"
1010806-66 = "«А поскольку завтра — это будущее, которого ещё не было, судить о нём мы можем только по сегодняшнему дню.»"
1010806-67 = "«После ослепительного дня темнота впереди может казаться непривычной и пугающей. Но не переживайте.»"
1010806-68 = "«Вы боитесь ночи именно потому, что прожили день по-настоящему насыщенно.»"
1010806-69 = "«Если сегодня вы прожили день старательно, завтра у вас получится ещё лучше.»"
1010806-71 = ""
1010806-72 = "...Какое хорошее письмо. Надеюсь, Х. из Миллениума услышала его и сегодня хорошо выспится."
1010806-73 = "А дальше вас ждёт подборка спокойной классической музыки, которая поможет уснуть, так что оставайтесь с нами до конца."
1010806-74 = "...Именно."
1010806-75 = ""
1010806-77 = ""
1010806-78 = ""
1010806-79 = ""
1010806-80 = "Я уверена, завтра у меня получится ещё лучше."
1010806-82 = "В ту ночь Юке удалось поспать немного крепче обычного."
