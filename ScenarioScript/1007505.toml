[translation]
1007505-1 = "Творческие муки 2"
1007505-2 = ""
1007505-3 = "Каков мой коварный план? Хороший вопрос!"
1007505-4 = "Хи-хи-хи... В прошлый раз вы показали мне кусочек своего мира."
1007505-5 = "А в этот раз я приведу вас в свой мир!"
1007505-6 = "[s] «Я хотел бы воспользоваться своим правом на отказ, ваша честь.»"
1007505-7 = "Отклонено! И права хранить молчание у вас тоже нет!"
1007505-8 = "В моём суде ваши обычные права не признаются! Ха-ха-ха!"
1007505-10 = "Несмотря на мои протесты, Мэру схватила меня за руку и потащила в «свой мир»."
1007505-11 = "Игровой центр"
1007505-12 = "[ns] «Это...?»"
1007505-13 = "Хе-хе. Хе-хе-хе. Может показаться, что это обычный игровой центр..."
1007505-14 = "Но если спуститься по лестнице, спрятанной за автоматом с клешнёй...!"
1007505-15 = "[s] «Понятно. Тайный магазин фигурок.»"
1007505-16 = "А? Вы знаете, что такое фигурки, Сенсей?"
1007505-17 = "Неожиданно... Не знала, что у вас есть такие интересы."
1007505-18 = "Не спешите, осмотритесь! Изначально здесь обменивали и продавали подержанную мангу."
1007505-19 = "Но со временем люди начали приносить и другие похожие вещи. В конце концов это стало обычным местом с товарами для отаку."
1007505-20 = "Пластиковые модели, фигурки, игрушки, сценарии токусацу, кадры из анимации, черновики манги..."
1007505-21 = "Но по-настоящему популярным стал именно отдел фигурок."
1007505-22 = "[s] «Вообще-то круто... Ого, посмотри, как проработано это платье...!»"
1007505-23 = "...Только не увлекайтесь слишком сильно."
1007505-24 = "Торговый центр"
1007505-25 = "[ns1] «Хм. Осмелюсь сказать, это место кажется знакомым.»\n[ns2] «Почему-то такое чувство, будто мы уже были где-то подобном.»"
1007505-28 = "Сенсей! Вы начинаете перенимать мою манеру речи. Взрослые и правда быстро учатся."
1007505-29 = "Но это не просто торговый центр! Он отличается от остальных!"
1007505-30 = "Здесь есть поп-ап магазин!"
1007505-31 = "[s] «Я не очень разбираюсь в таких современных трендах...»"
1007505-32 = "Это временный обычный магазин, который продаёт специальные товары!"
1007505-33 = "Их называют «поп-апами», потому что они открываются лишь на ограниченное время."
1007505-34 = "Поп-ап магазины по сериалам, музыке и прочим модным вещам в последнее время... появляются повсюду!"
1007505-35 = "Но этот — то, что надо! Здесь продаются ограниченные товары, которые по-настоящему оценим только мы и такие же, как мы!"
1007505-36 = "[s] «Понятно. Я заметил, что все посетители ведут себя очень прилично.»"
1007505-37 = "Хорошо подмечено, Сенсей!"
1007505-38 = "Все пришли купить то, что им нужно, и уйти! Никто не хочет тратить силы и время на разговоры с другими!"
1007505-39 = "Такое поведение — краеугольный камень культуры отаку!"
1007505-40 = "[s] «О. Тот человек покупает сразу очень много.»"
1007505-41 = "Хе-хе... Наверное, я смогу выставить это в интернете за полторы... Нет! Может, даже за двойную цену! Прибыль взлетит до небес!"
1007505-42 = ""
1007505-44 = ""
1007505-45 = "..."
1007505-46 = "Это перекупщик! Взять его!"
1007505-47 = "Кафе"
1007505-50 = "[ns] «Разве мы уже здесь не были?»"
1007505-51 = ""
1007505-52 = "Да, это кафе, но оно отличается от того, куда мы ходили в прошлый раз."
1007505-53 = "Вы ведь чувствуете разницу?"
1007505-54 = "[s] «Интерьер... сделан для отаку?»"
1007505-55 = "Именно! Здесь проходит коллаборация!"
1007505-56 = "Тут есть ростовые стенды, специальные подарочные карты, предварительный показ грядущего фильма, мерч..."
1007505-57 = "О, и в меню тоже есть специальные блюда коллаборации! Что будете заказывать?"
1007505-58 = "[s] «Посмотрим... Я возьму „Набор американо для подзарядки офицера“.»"
1007505-59 = "Тогда я возьму «Розовый энергетический безумный MAX-спешл»!"
1007505-61 = ""
1007505-62 = "Фух, здесь я чувствую себя как дома."
1007505-63 = "[s] «Тихо, правда?»"
1007505-64 = "Конечно. Такие места обычно привлекают более замкнутых и тихих людей."
1007505-65 = "..."
1007505-66 = "Ладно. Я хочу кое-что тебе рассказать, Сенсей. Но только тебе!"
1007505-67 = "Одна из моих мечт... создать что-нибудь и однажды устроить коллаборацию с кафе, прямо как здесь."
1007505-68 = "Сейчас большинство моих работ — производные, но однажды моя собственная оригинальная работа будет разлетаться с прилавков!"
1007505-69 = "[s] «Это замечательная мечта.»"
1007505-70 = "...Ещё какая! Хотя я знаю, что путь к ней будет непростым."
1007505-71 = "Вот бы искусство было таким простым: сел и время от времени что-нибудь создаёшь."
1007505-72 = "Знаю, знаю. Жизнь не настолько проста, так что не смотри на меня так... Не каждое творчество всегда приносит удовольствие."
1007505-73 = "[s] «Неожиданный ответ.»"
1007505-74 = "..."
1007505-75 = "В моём случае, сколько бы препятствий ни возникало, мне тяжелее просто отпустить пришедшую в голову идею, чем воплотить её. И дело не всегда в том, что мне нравится этим заниматься."
1007505-76 = "Что я имею в виду? Хм..."
1007505-77 = ""
1007505-79 = ""
1007505-81 = "Представь вот как. Иногда в моей голове внезапно расцветает какая-нибудь сцена или идея."
1007505-83 = "Как моменты, которые так и просятся на рисунок! Что-нибудь даёт толчок — книга, аниме, да что угодно — и этот момент превращается в сцену у меня в голове!"
1007505-85 = "И я уже не могу удержаться: начинаю придумывать следующую сцену, а то и весь сюжет! Наверное, можно было бы просто отпустить эту идею..."
1007505-87 = "Но просто дать ей исчезнуть кажется почти невозможным, понимаешь?"
1007505-88 = ""
1007505-89 = "Допустим, ты увидишь маленькую птичку, у которой голова застряла в консервной банке. Что ты сделаешь?"
1007505-90 = "[s] «Наверное... помогу ей?»"
1007505-91 = "Вот именно! То же самое я чувствую к этим моментам, которые хочется зарисовать! Они словно та птичка с банкой на голове."
1007505-92 = "Я не могу просто пройти мимо и оставить её так! Мне нужно спасти птичку и увидеть, как она величественно улетит."
1007505-93 = ""
1007505-96 = "А? Разве истории и сцены не появляются у меня в голове постоянно?"
1007505-97 = "Ну да. В этом и смысл, Сенсей! Поэтому душа художника во мне никогда не перестаёт пылать!"
1007505-98 = "Если я не смогу выразить эти моменты, эти сцены, которые разыгрываются у меня в голове, я сойду с ума!"
1007505-99 = "Но в последнее время я чувствую что-то странное... Будто в моей голове пытается вырваться наружу нечто новое, сильнее обычного момента для рисунка. И мне ужасно трудно с этим..."
1007505-100 = ""
1007505-102 = ""
1007505-103 = "..."
1007505-104 = "Стоп, что я вообще говорю...?!"
1007505-105 = "...!"
1007505-106 = "М-Мы тут уже слишком долго! Пошли отсюда!"
1007505-107 = "[s] «Что? Но мы здесь ещё даже часа не провели...»"
1007505-108 = "Для отаку час — это слишком долго! Мы уходим! Сейчас же!"
1007505-110 = ""
1007505-111 = "Фух... Наконец-то могу остыть."
1007505-112 = "Со мной всё нормально? Ну... К-Конечно! Я же с тобой!"
1007505-113 = "...Х-Хотя, может, всё наоборот..."
1007505-114 = "[s3] «Я запутался, но давай пойдём.»\n[s4] «А пока я провожу тебя обратно на Фронт освобождения знаний.»"
1007505-117 = "...!"
1007505-118 = "Н-Не надо! Я сама сюда добралась, значит, и обратно доберусь!"
1007505-119 = "Ч-Что? Не будь такой отстранённой? Всё нормально! Я просто хочу немного побыть одна!"
1007505-120 = "В прошлый раз я тоже так сделала? И ты думаешь... что это может быть из-за тебя?"
1007505-121 = "Нет! Это точно не твоя вина, Сенсей! Это... эм... Не твоё дело! То есть! Я не это имела в виду!"
1007505-122 = ""
1007505-124 = ""
1007505-125 = "В общем, мне пора! Пока, Сенсей!"
1007505-126 = ""
1007505-128 = ""
1007505-129 = ""
1007505-130 = "Позабавившись редким зрелищем смущённой Мэру, я отпустил её и махал вслед, пока её быстро удаляющаяся фигура не скрылась из виду."
