[translation]
1011802-1 = "Неожиданный спутник"
1011802-2 = "Я сел на поезд, отправляясь в командировку."
1011802-4 = "Внимание, пассажиры поезда у платформы №2..."
1011802-5 = "Из-за технических работ отправление задерживается примерно на 20 минут."
1011802-6 = "[ns] «Похоже, я опоздаю...»"
1011802-8 = "20 минут спустя..."
1011802-9 = ""
1011802-12 = "А, наконец-то поехали."
1011802-13 = "Но слишком поздно! Надеюсь, нам хотя бы компенсируют эту задержку!"
1011802-14 = ""
1011802-17 = "А-а. Уважаемые пассажиры. Вы меня слышите, да?"
1011802-18 = "Сейчас мы чу-у-уточку ускоримся! Пахьяхья!"
1011802-19 = "Ч-Что?"
1011802-20 = "[ns] «О, я знаю этот голос...»"
1011802-21 = ""
1011802-25 = "[ns] «А?!»"
1011802-31 = "[ns] «Похоже, я успел как раз вовремя...»"
1011802-33 = ""
1011802-34 = "Хм? Сенсей?"
1011802-35 = "[s1] «Привет, Нозоми.»\n[s2] «Так это ты сегодня ведёшь поезд?»"
1011802-38 = "Пахьяхья! Ага, это я!"
1011802-39 = "А ты что здесь делаешь?"
1011802-40 = "Ну как тебе моя езда?"
1011802-41 = "[s] «Невероятно быстро...»"
1011802-42 = "Фуфуфу, я всегда прихожу вовремя."
1011802-43 = "Надеюсь, ты никуда не опаздываешь!"
1011802-44 = "[s] «А, н-нет. Думаю, благодаря тебе я успею вовремя.»"
1011802-45 = "Отлично, рада слышать."
1011802-46 = "А обратно когда поедешь?"
1011802-47 = "[s] «Наверное, вечером...»"
1011802-48 = "Хм, удачи. Надеюсь увидеть тебя, когда закончишь!"
1011802-49 = ""
1011802-51 = ""
1011802-54 = "И Нозоми умчалась словно ветер."
1011802-56 = "После работы я позвонил ей..."
1011802-57 = ""
1011802-60 = "О, как вовремя! Я как раз подъезжаю к платформе №1, так что подходи к головному вагону!"
1011802-61 = ""
1011802-64 = "[ns] «(К головному вагону, значит...)»"
1011802-67 = "Вот вы где, Сенсей!"
1011802-68 = "[ns] «Погоди, разве это не...?»"
1011802-69 = "Заходи! Мы как раз собираемся отправляться!"
1011802-70 = "Нозоми затащила меня в кабину машиниста..."
1011802-71 = "[ns] «Мне вообще можно здесь находиться...?»"
1011802-72 = "Можно, можно! Считай это экскурсией."
1011802-73 = "Ну что, все на борт!"
1011802-74 = ""
1011802-80 = "― [log=노조미]Ну как тебе вид?[/log][wa:4620]"
1011802-83 = "― [log=노조미]В это время дня здесь всегда очень красиво.[/log]"
1011802-85 = "― [log=노조미]Мне нравится. Закат, в смысле.[/log][wa:1280]"
1011802-88 = "[ns3] «Как круто...!»\n[ns4] «Управлять поездом сложнее, чем я думал.»"
1011802-91 = "― [log=노조미]Ну, вообще-то здесь есть автопилот...[/log][wa:310]"
1011802-92 = "― [log=노조미]...но я не так уж часто им пользуюсь.[/log][wa:1720]"
1011802-95 = "― [log=노조미]Скучно же, понимаешь? [/log][wa:10]"
1011802-96 = "― [log=노조미]Я предпочитаю сама держать управление в руках.[/log][wa:1870]"
1011802-99 = "― [log=노조미]О... хочешь попробовать, Сенсей?[/log][wa:630]"
1011802-102 = "[ns] «Ни за что! Я слишком нервничаю!»"
1011802-103 = "― [log=노조미]Пахьяхья! Я шучу! [/log][wa:990]"
1011802-106 = "― [log=노조미]Ну же, Сенсей, чтобы водить поезд, нужны права.[/log][wa:920]"
1011802-108 = "― [log=노조미]Будто я просто так отдам управление полному новичку.[/log][wa:320]"
1011802-111 = "[ns] «Да, справедливо.»"
1011802-113 = "Так Нозоми и отвезла меня обратно на поезде."
1011802-114 = ""
1011802-118 = ""
1011802-119 = "[ns] «Спасибо за необычный опыт, Нозоми.»"
1011802-120 = "Пахьяхья! Не за что!"
1011802-121 = "Мне тоже было весело."
1011802-122 = "[ns] «Но в следующий раз я просто куплю обычный билет и останусь на своём месте.»"
1011802-123 = ""
1011802-124 = "[ns5] «Как ты и сказала, у меня нет прав.»\n[ns6] «Я просто буду обычным пассажиром. Договорились?»"
1011802-127 = "Хм-м. Ну, как хочешь!"
1011802-128 = "Наверное, и правда лучше держать тебя подальше от управления. Пахьяхья!"
1011802-130 = "В благодарность за этот опыт я купил Нозоми мороженое."
