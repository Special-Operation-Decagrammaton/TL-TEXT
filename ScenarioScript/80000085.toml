[translation]
80000085-1 = "Рейд SRT за припасами"
80000085-2 = "За несколько дней до Дня святого Валентина я открыл кухню Шале по просьбе Мияко."
80000085-3 = ""
80000085-7 = "Спасибо, что разрешили воспользоваться кухней Шале, Сенсей."
80000085-8 = "Обычно, если нужно просто что-то приготовить на огне, мне достаточно походной горелки в парке."
80000085-9 = "Но я хотела сохранить это в секрете от остальных."
80000085-10 = "[s] «Без проблем. Ты всегда можешь сюда прийти!»"
80000085-12 = "[ns] «И что за секретное блюдо?»"
80000085-13 = "Ну, вы наверняка знаете, что День святого Валентина уже скоро."
80000085-14 = "И, наверное, заметили, что магазины выставили всевозможный шоколад. Но в лагере у нас есть только твёрдый безвкусный шоколад из сухпайка."
80000085-15 = "Мои товарищи по отряду так стараются. Я хочу приготовить им к празднику что-нибудь сладкое."
80000085-16 = "А, кстати. Спасибо, что разрешили взять ваше масло, яйца и сахар."
80000085-17 = "Я не смогла достать ингредиенты для того, что хотела приготовить."
80000085-18 = "Без вашей помощи мой план бы провалился."
80000085-19 = "[s] «Не переживай. Я купил слишком много и не знал, куда это девать.»"
80000085-20 = "Хи-хи. Всё равно спасибо."
80000085-21 = ""
80000085-24 = "О, таймер."
80000085-25 = "Нужно доставать из духовки."
80000085-26 = ""
80000085-28 = ""
80000085-29 = ""
80000085-30 = ""
80000085-31 = "[ns] «Ого. Что это всё такое?»"
80000085-32 = "Это шоколадно-морковные пирожные."
80000085-33 = "Мелко нарезанную морковь часто используют в выпечке, чтобы улучшить текстуру и сбалансировать сладость."
80000085-34 = "А главное преимущество — можно использовать меньше муки."
80000085-35 = "[s] «Где ты научилась печь, Мияко?»"
80000085-36 = "А, меня никто специально не учил, но наш отряд часто ночует в дикой местности. Несколько кулинарных навыков сильно облегчают такие ситуации."
80000085-37 = "Когда мы ещё учились в академии SRT, я превращала походный котелок в духовку и пекла хлеб."
80000085-38 = "Странно. Сейчас вспоминаю об этом с ностальгией."
80000085-39 = "В любом случае, вот. Три для моих товарищей по отряду, а четвёртый..."
