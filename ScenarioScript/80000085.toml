80000085-48 = "Этот для вас, Сенсей."
80000085-49 = "Я сделала лишний в качестве благодарности."
80000085-50 = "[s1] «Но разве эта не...»\n[s2] «Тогда какая предназначена тебе?»"
80000085-51 = "Всё хорошо. Я немного попробовала во время готовки."
80000085-52 = "Всё хорошо. Я немного попробовала во время готовки."
80000085-53 = "И, знаете, кролику вредно есть слишком много сладкого."
80000085-54 = "Что? Вы хотите поделиться со мной?"
80000085-55 = "Но пирожное и так маленькое. Его едва хватит одному человеку, не говоря уже о двоих. Вы уверены?"
80000085-56 = "[s3] «Что касается избытка сладкого...»\n[s4] «Это вредно и для кроликов, и для взрослых.»"
80000085-57 = "Хи-хи. Правда?"
80000085-58 = "Хи-хи. Правда?"
80000085-59 = "Тогда я с радостью присоединюсь."
80000085-61 = "Так мы с Мияко и поделили морковное пирожное."
