[translation]
31090-1 = "Episódio 9;Sombras Oscilando Sob a Superfície"
31090-4 = "Ora, Sensei. Bom trabalho hoje."
31090-5 = "Como estão indo as coisas com o Clube de Aulas de Reforço?"
31090-6 = "...Dito isso, eu já ouvi a respeito. Ao que parece, a primeira prova não correu muito bem, não é?"
31090-7 = "Mas ainda restam mais duas chances, então..."
31090-8 = "...Ah, isto aqui? É xadrez, um hobby meu."
31090-9 = "[s] Olhar para o tabuleiro de xadrez nas mãos da Nagisa."
31090-10 = "...Provavelmente é uma formação pouco familiar para você, não é?"
31090-11 = "As pretas têm apenas o rei, a rainha e todo o resto são peões."
31090-12 = "Já as brancas têm o rei, além de três a quatro torres, bispos e cavalos cada... Certamente é uma disposição que não se vê com frequência."
31090-13 = "[s] \"Você estava jogando isso sozinha?\""
31090-14 = "Sim, no momento estou sozinha. A barulhenta da Mika-san também não está por perto."
31090-15 = "Hoje havia algo que eu gostaria de lhe informar, Sensei... mas, antes disso, tenho a impressão de que você tem algo que quer me dizer primeiro."
31090-16 = "[s] \"Se reprovarem nas três provas, o que vai acontecer com as meninas do Clube de Aulas de Reforço?\""
31090-17 = "..."
31090-18 = "Por acaso ouviu isso por aí? A fonte foi... a Hifumi-san, imagino."
31090-19 = "Ela tem esse jeito mesmo. Bem, essa também é uma das qualidades da Hifumi-san, mas..."
31090-20 = "Pois bem, respondendo à sua pergunta, é uma história simples. Se reprovarem repetidamente nas provas, sem chance de escapar da retenção e sem conseguirem ajudar umas às outras... nesse caso, não restará outra escolha a não ser todas juntas serem expulsas da escola."
31090-21 = "[s] \"Expulsas!?\""
31090-22 = "É claro que, originalmente, aqui na Trinity também existem regras escolares referentes a reprovação, suspensão e expulsão."
31090-23 = "Contudo, os trâmites são longos e burocráticos, exigindo inúmeras verificações e debates. Diferente de Gehenna, nós damos muita importância aos procedimentos formais."
31090-24 = "Mas o Clube de Aulas de Reforço, que foi criado às pressas desta vez, foi ajustado de modo a poder ignorar essas regras escolares. Como também incorporamos um pouco da autoridade da Schale, esse tipo de medida tornou-se possível."
31090-25 = "Para começo de conversa, o Clube de Aulas de Reforço..."
31090-30 = "Foi criado justamente para expulsar alunas."
31090-31 = "[s] \"...!?\""
31090-33 = "[s] \"Por que fazer uma coisa dessas...!?\""
31090-34 = "..."
31090-35 = "Porque, entre elas, há uma traidora da Trinity."
31090-36 = "[s] \"Uma traidora...?\""
31090-39 = "O objetivo dessa traidora é impedir a assinatura do Tratado do Éden."
31090-40 = "Para que compreenda o peso dessas palavras... é necessário explicar primeiro o que é o \"Tratado do Éden\"."
31090-42 = "O Tratado do Éden... dizendo de forma simples, é um pacto de não agressão a ser firmado entre a Trinity e Gehenna."
31090-43 = "Sua essência está em estabelecer uma organização neutra com a presença de todos os membros centrais de Gehenna e da Trinity."
31090-44 = "Essa entidade, que será chamada de \"Organização do Tratado do Éden\", ou \"ETO\", irá intervir sempre que surgir um conflito entre a Trinity e Gehenna para solucioná-lo."
31090-45 = "Por assim dizer, é como \"inimigos no mesmo barco\". Uma aliança de paz hostil, firmada ao embarcarem juntas em um navio instável que balança sem parar."
31090-46 = "Com isso, uma guerra total entre as duas academias deixará de acontecer. Afinal, se qualquer um dos lados passar dos limites, ambas as facções acabarão afundando juntas."
31090-48 = "...Sensei."
31090-49 = "A longa relação de hostilidade entre a Trinity e Gehenna tornou-se um fardo imenso para ambos os lados."
31090-50 = "O Tratado do Éden é, provavelmente, a única maneira de evitar esse desgaste sem sentido, além de ser uma forma de manter o equilíbrio de poder em Kivotos."
31090-51 = "Essa também foi a solução apresentada pela Presidente do Conselho Estudantil Geral. Após o desaparecimento dela, o projeto quase se desfez por completo, mas, sob a minha liderança, consegui de alguma forma reconstruí-lo até aqui."
31090-52 = "E justo neste momento, quando estamos prestes a concluir esse tão sonhado tratado... chegou aos meus ouvidos a informação de que há pessoas tentando sabotá-lo."
31090-53 = "Ainda não sabemos quem é. Não conseguimos identificar a culpada. Por isso, como a segunda melhor medida... reuni todas as suspeitas em potencial em um só lugar."
31090-54 = "...A traidora está lá. Porém, não sabemos quem ela é."
31090-55 = "Sendo assim, vamos juntar todas em uma única caixa... para que, caso seja necessário, fique mais fácil descartar tudo de uma só vez."
31090-56 = "...A esta altura você já deve ter entendido: isso é o \"Clube de Aulas de Reforço\". E você, Sensei, colaborou conosco na criação dessa \"caixa\"."
31090-57 = "...Peço desculpas."
31090-58 = "Acabei envolvendo você em um assunto tão sórdido quanto este. Não me importo se quiser me insultar por isso."
31090-59 = "[s] \"...Mas se a sua intenção fosse realmente só me usar, você não estaria me contando tudo isso agora, estaria?\""
31090-60 = "...Como esperado, você compreende as coisas muito rápido."
31090-61 = "Eu estava me perguntando se acreditaria em mim caso eu contasse, mas é exatamente como diz. Sendo assim, a nossa conversa fica bem mais rápida."
31090-62 = "Sensei."
31090-63 = "...Você poderia encontrar a traidora que está no Clube de Aulas de Reforço para mim?"
31090-64 = "[s] \"...\""
31090-65 = "Há alguém tentando enganar você e a Trinity."
31090-66 = "Trata-se de uma terrorista que pretende destruir a paz. Ela está tentando colocar na balança não apenas a nossa paz, mas a de toda Kivotos, em troca de seus próprios interesses."
31090-67 = "Descobrir quem é a traidora está diretamente ligado à paz de Kivotos. O que me diz? Eu ficaria muito grata se pudesse compreender a situação como representante do Clube de Investigação Federal, Schale—"
31090-68 = "[s] \"...Eu vou lidar com esse problema do meu próprio jeito.\""
31090-71 = "...Entendo. Compreendo."
31090-72 = "...Contudo, Sensei. Quando é difícil separar o lixo nos mínimos detalhes antes de jogá-lo fora, descartar a caixa inteira também é um dos meios possíveis... Não concorda?"
31090-73 = "E mais um detalhe... A respeito das provas, elas estão basicamente na palma das nossas mãos."
31090-74 = "Por exemplo, \"o conteúdo da prova mudar de repente\", ou \"o local da prova ser alterado\", ou ainda \"o nível de dificuldade mudar\"..."
31090-75 = "Eu rezo para que esse tipo de coisa não aconteça, mas..."
31090-76 = "...Perdoe-me, não foi uma boa maneira de me expressar. Bem, conto com você para continuar cuidando do Clube de Aulas de Reforço daqui em diante, Sensei."
31090-77 = "Eu gostaria de poder dizer que, da nossa parte, não causaremos nenhum prejuízo ou dano a você, Sensei... mas..."
31090-78 = "[s] \"...Não pode garantir isso com tanta certeza?\""
31090-79 = "...Pois é. Não posso fazer essa promessa tão facilmente."
31090-80 = "No entanto, não acredito que você seja o tipo de pessoa que abandonaria as alunas por causa disso... então nem mesmo eu consigo prever totalmente como as coisas vão se desenrolar a partir de agora."
31090-81 = "Só posso desejar que esse desfecho... seja o menos doloroso possível."
31090-82 = "Ah, mas permita-me esclarecer apenas uma coisa..."
31090-83 = "Na primeira prova, nós não realizamos absolutamente nenhuma manipulação da nossa parte. Quanto a isso, eu juro e prometo que não é mentira."
31090-84 = "[s] \"...\""
31090-85 = "O seu próprio jeito de fazer as coisas... Espero sinceramente que ele traga benefícios para a Trinity."
31090-86 = "...Então, até mais."
31090-89 = "Próximo;Começa o Acampamento de Estudos!"
