[translation]
31090-1 = "Эпизод 9;Что скрывается в глубине"
31090-3 = ""
31090-4 = "Добро пожаловать, Сенсей. Рада, что вы пришли."
31090-5 = "Как идут дела у вас и Клуба дополнительных занятий?"
31090-6 = "...Да. Я слышала новости. Похоже, первый экзамен прошёл не очень удачно."
31090-7 = "Однако впереди ещё два экзамена."
31090-8 = "О... это? Я играла в шахматы. Моё хобби."
31090-9 = "[s] Осмотреть шахматную доску Нагисы."
31090-10 = "Что-то не так?"
31090-11 = "Если не считать пешек, у чёрных только король и ферзь, а у белых по три-четыре короля, ладьи, слона и коня."
31090-12 = "Уверена, эта партия кажется вам странной."
31090-13 = "[s] «Вы играли сами с собой?»"
31090-14 = "Да, сейчас я одна. Мики нет, чтобы устраивать обычные отвлекающие выходки. Я ждала здесь одна, чтобы поговорить с вами."
31090-15 = "Хотя, похоже, сначала вы хотите спросить о чём-то другом."
31090-16 = "[s] «Что будет с Клубом дополнительных занятий, если кто-то провалит все три экзамена?»"
31090-17 = "..."
31090-18 = "Значит, вы услышали. Хифуми, должно быть, рассказала."
31090-19 = "У неё мягкое сердце в таких вопросах, хотя это одно из её достойных качеств."
31090-20 = "Ничего необычного не произойдёт. После повторных академических провалов есть только один путь: всех участниц Клуба дополнительных занятий исключат."
31090-21 = "[s] «Исключат?!»"
31090-22 = "Естественно, в Тринити есть правила о провале, отстранении и исключении."
31090-23 = "Процедура долгая и тяжёлая. В отличие от Геенна, Тринити соблюдает порядок."
31090-24 = "Но Клуб дополнительных занятий создан через лазейку, позволяющую обойти эти правила. Учредить его удалось благодаря полномочиям Шале."
31090-25 = "Ведь истинная цель Клуба дополнительных занятий..."
31090-26 = ""
31090-27 = ""
31090-28 = ""
31090-29 = ""
31090-30 = "...исключить студентов."
31090-31 = "[s] «...?!»"
31090-33 = "[s] «Зачем вам это?!»"
31090-34 = "..."
31090-35 = "Потому что среди них есть тот, кто хочет предать Тринити."
31090-36 = "[s] «Среди них есть предатель?»"
31090-39 = "Этот предатель хочет помешать подписанию Эдемского договора."
31090-40 = "Пожалуй, пришло время объяснить договор, чтобы вы поняли серьёзность ситуации."
31090-42 = "Эдемский договор, если просто, — пакт о ненападении между Тринити и Геенна."
31090-43 = "Его главная цель — создать нейтральную договорную организацию, состоящую из ключевых представителей Геенна и Тринити."
31090-44 = "Эта организация, названная Организацией Эдемского договора, будет автоматически вмешиваться и разрешать любые конфликты между Тринити и Геенна."
31090-45 = "Иными словами, это союз, который пытается добиться мира, объединив двух заклятых врагов."
31090-46 = "Он предотвратит полномасштабную войну между академиями — ведь если одна пойдёт ко дну, утонут обе."
31090-47 = ""
31090-48 = "Сенсей."
31090-49 = "Длительная вражда между Тринити и Геенна стала тяжёлым бременем для обеих сторон."
31090-50 = "Эдемский договор — единственный способ положить конец бессмысленной вражде и сохранить баланс сил в Кивотосе."
31090-51 = "Это решение предложила президент Генерального студсовета. После её исчезновения всё застопорилось, но мне удалось вновь сдвинуть дело с места."
31090-52 = "И теперь, когда мы наконец готовимся подписать договор, поступают сведения о тех, кто намерен его сорвать."
31090-53 = "Но мы не знаем, кто именно это. Поэтому следующим лучшим вариантом было собрать всех подозреваемых в одном месте."
31090-54 = "Но будьте уверены: она среди них."
31090-55 = "Мы избавляемся от всей корзины яблок, чтобы уничтожить одно гнилое."
31090-56 = "К счастью, Сенсей, именно поэтому мы выбрали вас присматривать за этой корзиной — руководить Клубом дополнительных занятий."
31090-57 = "...Прошу прощения."
31090-58 = "Я понимаю, что поставила вас в крайне неприятное положение. Вы имеете полное право меня ненавидеть."
31090-59 = "[s] «Если бы вы хотели лишь использовать меня, то ничего этого не рассказали бы.»"
31090-60 = "Вы правы."
31090-61 = "Хорошо, что вы быстро понимаете."
31090-62 = "Сенсей."
31090-63 = "Я хочу, чтобы вы нашли предателя, скрывающегося среди участниц Клуба дополнительных занятий."
31090-64 = "[s] «...»"
31090-65 = "Прямо сейчас она уже обманывает и вас, и Тринити."
31090-66 = "Она террористка, а террористы не желают мира. Они готовы рисковать безопасностью Кивотоса ради собственной выгоды."
31090-67 = "Найти предателя необходимо ради мира и безопасности Кивотоса. Как представитель Шале вы ведь можете это понять."
31090-68 = "[s] «Нет. Я найду решение ПО-СВОЕМУ.»"
31090-69 = ""
31090-70 = ""
31090-71 = "Неужели?"
31090-72 = "Но не забывайте про корзину яблок. Если не можете найти гнилое яблоко, можно просто... опрокинуть корзину и избавиться от всех."
31090-73 = "Есть много способов повлиять на результаты экзамена."
31090-74 = "Например, содержание, место проведения или сложность экзамена могут внезапно измениться в последний момент."
31090-75 = "Конечно, было бы жаль, если бы такое произошло, но всё же..."
31090-76 = "Прошу прощения, Сенсей. Я и дальше оставляю Клуб дополнительных занятий на ваше попечение."
31090-77 = "Хотелось бы сказать, что лично вас эта неприятность не затронет..."
31090-78 = "[s] «Почему-то сомневаюсь.»"
31090-79 = "Верно. Ничего не обещаю."
31090-80 = "Но зная вас — человека, который не может оставить студента в беде —#nя едва ли могу предсказать, чем всё закончится."
31090-81 = "Могу лишь надеяться, что у этой истории будет счастливый конец."
31090-82 = "Ах да, есть одна вещь, которую я хочу прояснить."
31090-83 = "Мы никак не вмешивались в первый экзамен. Обещаю."
31090-84 = "[s] «...»"
31090-85 = "Если вы намерены действовать по-своему, надеюсь, это принесёт пользу Тринити."
31090-86 = "Что ж. До следующей встречи."
31090-89 = "Следующий эпизод;В учебный лагерь!"
