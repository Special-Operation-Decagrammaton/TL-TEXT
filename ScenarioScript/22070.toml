22070-39 = "Ela começou... a carregar a railgun de novo!"
22070-43 = "[ns] \"...Precisamos pará-la logo!\""
22070-45 = "[ns] \"Pessoal, segurem a Aris...!\""
22070-47 = "Aris-chan!! Desculpa!!!"
22070-59 = "Interferência detectada. Falha no carregamento."
