22070-157 = "Ugh... M-mais ou menos..."
22070-158 = "Ueeeh... Achei que minhas tripas iam sair pra fora..."
22070-159 = "Se ainda consegue fazer piada, pelo menos está inteira."
22070-160 = "[s] \"Que alívio...\""
22070-166 = "Sensei...! Sensei!"
22070-167 = "A-ah, a M-Momoi..."
