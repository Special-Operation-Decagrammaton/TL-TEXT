10028025-8 = ""
10028025-9 = "*тяжело дышит* *задыхается*..."
10028025-10 = "Так, эм, Сенсей..."
10028025-11 = "Я просто очень хочу подчеркнуть..."
10028025-12 = "Я знаю, выглядит ужасно, но я совершенно не хотела, чтобы всё происходило вот так. Клянусь..."
10028025-13 = "[s1] «Ты всего лишь избила враждебную поездную бригаду.»\n[s2] «Не то чтобы они встретили тебя с распростёртыми объятиями.»"
10028025-16 = ""
10028025-18 = ""
10028025-19 = "Хаха. Точно..."
10028025-20 = "Сначала я полностью путаю расписание поездов. Потом ещё и нападаю на студентов другой академии."
10028025-21 = "Впечатление я на вас произвожу не самое лучшее. Похоже, словами из этого уже не выкрутиться."
10028025-22 = "...А? Я прекрасно справляюсь?"
10028025-23 = "Хаха... Опять же, я ценю поддержку, но мне немного трудно с этим согласиться."
10028025-24 = "И мы ещё не совсем в безопасности. Такое ощущение, будто мы против... всего поезда."
10028025-25 = "Сюда! Они здесь!"
10028025-26 = "Вы окружены! Даже не думайте пытаться сбежать!"
10028025-27 = ""
10028025-30 = ""
10028025-31 = ""
10028025-32 = ""
10028025-33 = ""
10028025-42 = ""
10028025-43 = "...Как я и говорила."
10028025-44 = ""
10028025-46 = ""
10028025-47 = "Дайте подумать... Эм..."
10028025-48 = "Я не хочу, чтобы всё превратилось в массовую драку, особенно когда вы здесь, Сенсей. Вы можете пострадать."
10028025-49 = "Может, на этом этапе лучше просто сдаться."
10028025-50 = "Они отвезут нас в Геенну, и там мы попробуем всё объяснить... теоретически?"
10028025-51 = "[s3] «Не думаю, что они позволят нам просто уйти с твоей сумкой...»\n[s4] «Ты не очень уверенно говоришь о своей теории...»"
10028025-54 = "Ну, ситуация далеко не идеальная, а идей у меня больше нет."
10028025-55 = "В Спецотряде правосудия нас учат прежде всего снижать напряжение, так что..."
10028025-56 = ""
10028025-61 = ""
10028025-65 = ""
10028025-68 = ""
10028025-69 = "А?"
10028025-70 = "Что это было? Вы слышали этот звук?"
10028025-71 = ""
10028025-75 = ""
10028025-79 = ""
10028025-81 = "Там что-то... пищит?"
10028025-82 = "Кажется, да, но не в этом вагоне. Звук идёт сзади...?"
10028025-83 = "Сзади...? Погодите, погодите. Позади нас..."
10028025-84 = ""
10028025-102 = "Транспортный вагон..."
10028025-103 = "...!!!!!"
10028025-104 = "Стойте! Тогда получается—"
10028025-108 = ""
10028025-109 = "Аргх! Ух! *кашель* *кашель*"
10028025-110 = "Что сегодня вообще происходит?! Сначала я сажусь вообще не на тот поезд, а потом он ещё и взрывается?"
10028025-111 = "Стойте, Сенсей? Сенсей! Вы в порядке?! Где-нибудь ранены?"
10028025-112 = ""
10028025-114 = ""
10028025-116 = ""
10028025-117 = "Взрыв произошёл слишком быстро, я не успела полностью вас прикрыть... Мне ужасно жаль."
10028025-118 = "[s5] «На мне ни царапины.»\n[s6] «Ты защитила меня, Ичика.»"
10028025-121 = "Слава богу. Хоть что-то хорошее."
10028025-122 = "Разве работники не вели себя так, будто вагон позади нас очень важный? Транспортный вагон? Надеюсь, с ними всё хорошо..."
10028025-123 = ""
10028025-125 = ""
10028025-126 = "Эм... Не смотрите, Сенсей, но все вагоны позади нас... исчезли."
10028025-127 = "И люди, которые пытались нас арестовать, тоже. Победа-поражение, наверное?"
10028025-128 = "Хм... Хмм. Стра-а-анно."
10028025-129 = "Это весь ущерб, который я нанесла? Я ожидала куда большего БА-БАХА разрушения! Чтобы поезд разнесло в небытие!"
10028025-130 = ""
10028025-132 = ""
10028025-133 = "Вы это слышали? Или я схожу с ума?"
10028025-134 = ""
10028025-136 = ""
10028025-137 = "Хм. Я никогда не ошибаюсь в расчётах. Огневой мощи хватало! Значит, они действительно усилили броню поезда!"
10028025-138 = "Хотите сказать, у этих детишек есть мозги?! Вот это сюжетный поворот! Мне нравится! Хех, очень нравится! Вахахаха!"
10028025-139 = "[s7] «Я слышал это „Вахаха“ в своих кошмарах...»\n[s8] «Только не говорите мне...»"
10028025-142 = "А? На что это я смотрю?!"
10028025-143 = "Глаза меня не обманывают? Сенсей?! Вот этого я точно не ожидала!"
10028025-144 = ""
10028025-147 = ""
10028025-149 = ""
10028025-150 = "Какая неожиданная встреча! Вахаха!"
10028025-151 = "Я знала, что сегодня будет отличный день! Мне! Нравится! Это!"
10028025-152 = "Так даже проще! Представления можно пропустить. Хи-хи-хи."
10028025-153 = ""
10028025-154 = ""
10028025-156 = ""
10028025-157 = "...Я немного потерялась."
10028025-158 = "[s9] «Касуми?! Ты вообще откуда взялась?»\n[s10] «Как и зачем ты здесь, Касуми?!»"
10028025-161 = "Ваша знакомая, Сенсей?"
10028025-162 = "Погодите."
10028025-163 = "Вы сказали Касуми? Касуми... Имя кажется знакомым."
10028025-164 = "Ха! Первым делом засыпаете меня вопросами? Скука! Просто плывите по течению, Сенсей!"
10028025-165 = "Это же прямо сцена из фильма! Наше долгожданное воссоединение, и всё такое драматичное! Хи-хи-хи."
10028025-166 = "Касуми... Я точно где-то слышала это— Стойте."
10028025-167 = "Кинугава Касуми...?"
10028025-168 = ""
10028025-170 = ""
10028025-171 = "Известная преступница в розыске из академии Геенна, Кинугава Касуми?"
10028025-172 = ""
10028025-173 = "Вахаха! Вы слишком добры, спасибо, спасибо! Сейчас я чувствую себя настоящей рок-звездой! Хотите автограф?"
10028025-174 = "Э-Эм... Думаю, не надо... Но спасибо..."
10028025-175 = "Моя репутация и правда бежит впереди меня! Вахаха! Ладно, дальше! Сенсей..."
10028025-176 = "Что вы делаете так далеко в этой глуши?"
10028025-177 = ""
10028025-179 = ""
10028025-181 = ""
10028025-182 = "...Да ещё с таким очаровательным маленькым студентом Тринити."
