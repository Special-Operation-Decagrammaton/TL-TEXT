[translation]
2402-1 = "Снимаем промо клуба! Часть 2"
2402-2 = "Так, проверка камеры. Проверка... Раз, два..."
2402-3 = "Заодно проверим микрофон! Меня видно? Слышно?"
2402-4 = "Отлично, начинаем снимать промо!"
2402-5 = ""
2402-6 = ""
2402-7 = "Это Клуб внутренней дисциплины! А прямо сейчас мы на берегу реки Красной Панды, любимого места президента клуба!"
2402-8 = "Мы здесь потому что..."
2402-9 = "Цубаки, президент Клуба внутренней дисциплины, любит здесь тренироваться!"
2402-10 = "А, лёгка на помине!"
2402-11 = ""
2402-13 = "*храпит*"
2402-14 = ""
2402-15 = "Позвольте представить её!"
2402-16 = "Это Касуга Цубаки! Второй курс! Шестнадцать лет! Также известна как Спящая красавица и президент Клуба внутренней дисциплины!"
2402-17 = "А теперь, чтобы вы поняли, насколько Цубаки потрясающая..."
2402-18 = "А?"
2402-20 = "Погодите... Прямо рядом с Цубаки появился кот!"
2402-22 = "Теперь их два!"
2402-24 = "Теперь щенок... и кролик? ...А теперь голубь, олень и ещё больше животных?"
2402-25 = "Они всё прибывают!"
2402-26 = "Наверняка их всех завораживает вид так мирно спящей Цубаки!"
2402-27 = "*храпит*"
2402-28 = "Невероятно! Посмотрите, как она спит, не обращая внимания на огромную стаю животных вокруг!"
2402-29 = "Она ни капли не дрогнула. Вот она — красота образцовой леди!"
2402-30 = "Точно, я не могу отставать!"
2402-31 = "Как очаровательный талисман Клуба внутренней дисциплины и будущая потрясающая леди, я буду оттачивать навыки, пока не достигну её уровня!"
2402-32 = "Эм, простите!"
2402-33 = ""
2402-34 = ""
2402-35 = ""
2402-38 = "Ого..."
2402-39 = "Так вот что видит Цубаки, когда лежит..."
2402-40 = "Засыпать с таким видом..."
2402-41 = "Наверное, именно так и тренируются потрясающие леди..."
2402-42 = "Тогда и я закрою глаза, прямо как Цубаки..."
2402-44 = "..."
2402-47 = "А, щекотно!"
2402-48 = "Хватит! Не лижи меня в щёку! Я не могу уснуть!"
2402-49 = "Ммм!"
2402-51 = "Ух! Серьёзно!"
2402-52 = "Вот, лижите Цубаки!"
2402-53 = ""
2402-54 = ""
2402-55 = ""
2402-56 = "..."
2402-57 = "Фух! Какая полезная тренировка! Переходим к следующей части!"
2402-58 = ""
2402-60 = ""
2402-61 = "*всё ещё храпит*"
2402-63 = "Следующая — вице-президент Клуба внутренней дисциплины..."
2402-64 = "...живой пример прекрасной леди, Мимори!"
2402-65 = "В это время Мимори наверняка готовит ужин..."
2402-66 = "О, Каэдэ? Что происходит?"
2402-67 = "Мимори!"
2402-68 = "Это... камера?"
2402-69 = "Ага! Я снимаю один день из жизни Клуба внутренней дисциплины!"
2402-70 = "Один день из жизни Клуба внутренней дисциплины?"
2402-71 = "Не совсем понимаю, что происходит... Это часть той тренировки, о которой ты говорила?"
2402-72 = "Именно! Благодаря этой тренировке я стану потрясающей леди и одолею Клуб Инь-Ян!"
2402-73 = "Что, простите?"
2402-74 = "В любом случае удачи с тренировкой. Сегодня на ужин карри!"
2402-75 = "Обязательно вернись в клубную комнату до того, как ужин остынет, хорошо?"
2402-76 = "Обязательно!"
2402-77 = ""
2402-78 = "Видите? Мимори — вице-президент Клуба внутренней дисциплины. Она заботится о множестве вещей, не только о нашей еде!"
2402-79 = "Мечта Мимори — стать утончённой и элегантной леди! Ради этого она и тренируется!"
2402-80 = "Мимори ничуть не менее элегантная леди, чем Цубаки..."
2402-81 = "Так что я не могу отставать! Если хочу стать как Мимори, мне нужно тренироваться так же, как она..."
2402-82 = "А! Придумала!"
2402-85 = "Ммм... Это запах знаменитого карри Мимори! Вкуснятина!"
2402-86 = "Попробую совсем чуть-чуть... Ням-ням. *хлюп*"
2402-88 = "Ммм! Так вкусно!"
2402-89 = "Но я не стану как Мимори, если буду только есть её еду!"
2402-90 = "Так что смотрите внимательно, дорогой зритель!"
2402-91 = "Думаю, я сама улучшу карри, чтобы стать как Мимори!"
2402-92 = "Карри и так потрясающе вкусное, но если мне удастся сделать его ещё лучше своими кулинарными навыками..."
2402-94 = "Каэдэ! Это гениально! Не могу поверить, что ты сделала моё карри вдвое вкуснее!"
2402-95 = "Ты потрясающая, Каэдэ! Я возьму добавку..."
2402-97 = "Хи-хи."
2402-98 = "Ммм, карри очень вкусное, но, думаю, могло бы быть чуточку слаще..."
2402-99 = "Так что добавлю немного сахара..."
2402-103 = "О нет, крышка слетела! Я насыпала слишком много сахара!"
2402-104 = "Что делать?!"
2402-105 = "Ах!"
2402-106 = "Ладно! Если хочу немного приглушить сладость... надо сделать его солонее!"
2402-107 = "В большинстве карточных игр урон же примерно так и компенсируют, да?"
2402-108 = "Добавим ещё соли..."
2402-110 = "Ага! Идеально! Чувствую, сегодня я чего-то добилась!"
2402-111 = "И на этом моя тренировка Мимори завершена!"
2402-113 = "Вот, готово, Сенсей! Промо-видео закончено!"
2402-114 = "Здесь запечатлён весь Клуб внутренней дисциплины, сама его сущность!"
2402-115 = "[s] «А... Вот как?»"
2402-116 = "Как только я это отправлю, победа Клуба внутренней дисциплины станет вероятной... нет, гарантированной! Это будет мой дебют как настоящей леди!"
2402-117 = "*вздох* Но что, если после публикации видео станет вирусным...?!"
2402-118 = "...и нас накроет волна желающих вступить в клуб?!"
2402-119 = "Хмм... Неважно! Всё уже решено! Мне останется принять роль элегантной леди и направлять юных новобранцев! Хи-хи-хи!"
2402-120 = "[s1] «Звучит здорово, но, эм...»\n[s2] «Каэдэ, посмотри назад.»"
2402-121 = "Что? Назад? Зачем?"
2402-122 = "Что? Назад? Зачем?"
2402-123 = ""
2402-124 = ""
2402-125 = "*лижет* *хлюпает* *лакает* Коты... Щенки... Кажется, я побывала в каком-то аду из облизывания..."
2402-126 = ""
2402-127 = "О, Каэдэ!"
2402-128 = ""
2402-129 = ""
2402-130 = "Каэдэ, это ты трогала карри на кухне клубной комнаты?"
2402-131 = ""
2402-132 = "Иди сюда и садись. Само собой, я немного зла..."
2402-133 = "Ой-ой! Это то самое лицо, которое Цубаки и Мимори делают, когда очень злятся!"
2402-134 = "С такими темпами меня ждёт тяжёлая пятичасовая лекция!"
2402-135 = "Ух. П-Помогите, Сенсей!"
2402-136 = "[s] «Ну, ты сама это устроила.»"
2402-137 = ""
2402-138 = "А-Ааа!"
2402-140 = "(Так начинается пятичасовая лекция Клуба внутренней дисциплины.)"
2402-141 = "Снимаем промо клуба!"
