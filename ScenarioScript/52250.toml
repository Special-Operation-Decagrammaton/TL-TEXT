[translation]
52250-1 = "Эпизод 25;Третий том"
52250-2 = "О-хо. Какое зрелище."
52250-3 = "Трагедия и комедия сливаются воедино. История, какой нам ещё не доводилось видеть."
52250-4 = "Комедия торжествует, а страх рассеивается, словно обрывок сна. Истории о призраках, некогда вселявшие ужас, теперь растворяются вместе с утренним туманом."
52250-5 = "Эта мелкая паршивка превратила моё изящное представление в... шутку!"
52250-6 = "Вы позволите этому сойти ей с рук, госпожа Кокурико?!"
52250-7 = "Сюро пачкает мою изысканность дешёвой буффонадой!"
52250-8 = "«Фантомные иллюстрации Тотэй» питаются страхом, чтобы создавать необъяснимое. А эта нелепая «Фантомная сказка» подрывает утончённый вкус «Ста историй о призраках»!"
52250-9 = "Успокойся."
52250-10 = "Искусство каждый воспринимает по-своему."
52250-11 = "Если история Сюро способна привлечь внимание зрителя, значит, твоей просто чего-то не хватает."
52250-12 = "Определи свои слабые места, чтобы в следующий раз написать историю, которая взбудоражит и захватит душу."
52250-13 = "Я... не могу это принять."
52250-14 = ""
52250-16 = ""
52250-17 = "Сейчас мне хочется лишь вышвырнуть эту наглую мелкую дрянь в мир духов, пока она будет визжать и плакать."
52250-18 = ""
52250-21 = ""
52250-23 = ""
52250-25 = ""
52250-26 = ""
52250-27 = "...Довольно."
52250-28 = "Ты прекрасно понимаешь, что значит для нас этот ребёнок."
52250-29 = "Ты смеешь намекать, будто твоя некомпетентность — моя вина?"
52250-30 = "Н-Нет, вовсе нет. Я совсем не это имела в виду, госпожа Кокурико..."
52250-31 = "Ты ведь угрожала отправить Сюро в мир духов, не так ли?"
52250-32 = "Ты и сама художница-призрак. Последствия такого поступка тебе прекрасно известны."
52250-33 = "Д-Да, но..."
52250-34 = "Нити твоей жалкой истории распустились. Ты больше не способна вплетать страх в сердца людей."
52250-35 = "Истинный рассказчик обращает непредвиденное в предзнаменование и вплетает его в сложный узор своего произведения. А твой неизящный ответ — обвинять публику в собственной бездарности?"
52250-36 = "Какое бесчестье, заклинательница змей."
52250-37 = "П-Прошу глубочайшего прощения!"
52250-38 = "Такая, как я, и мечтать не посмеет ставить вас под сомнение, госпожа Кокурико!"
52250-39 = "Я просто... позволила своему разочарованию вырваться наружу—"
52250-40 = ""
52250-42 = ""
52250-44 = ""
52250-45 = "...Хватит."
52250-46 = "Теперь, когда глава Хяккарёран и Сенсей из Шале вернулись, глава страха и раскола подошла к концу."
52250-47 = "Пусть теперь на сцену выйдет Хитоцумэ Аямэ."
52250-48 = "А что насчёт той мелкой— ...Что насчёт Сюро?"
52250-49 = "Вопрос, над которым стоит поразмыслить... Однако я не стану преградой на пути, который она стремится проложить для себя."
52250-50 = ""
52250-52 = ""
52250-56 = ""
52250-57 = "Вот вы где, Красота природы!"
52250-58 = "Хабу Азами... заклинательница змей. Вашим отвратительным историям здесь и сейчас придёт конец."
52250-59 = "Сдавайтесь, и Хяккарёран проявит к вам милосердие, которого вы не заслуживаете. Сопротивляйтесь — и вас сокрушит вся сила нашей кары."
52250-60 = "Хяккарёран... Как вы вообще добрались сюда?"
52250-61 = "Даже если том ослаб, неужели вы и правда думаете, что таким, как вы, под силу одержать победу в бою?"
52250-62 = "Нас, Хяккарёран, вам больше не запугать!"
52250-63 = "Нагуса — исполняющая обязанности президента Хяккарёран и владеет Сотней Лотосов! Её великая сила сокрушит вас всех!"
52250-64 = "Пока Нагуса с нами, какая-то там призрачная сказительница нас не напугает!"
52250-65 = "Сколько раз мне повторять: я художница-призрак! А не какая-то жалкая сказительница! Идиотки—!"
52250-66 = "...Как всегда, человеческое сердце остаётся загадкой."
52250-67 = "Скажи мне, почему люди так упорно стремятся довести до конца свои бессмысленные сюжеты?"
52250-68 = "А? Кто это? В прошлый раз её же здесь не было, верно?"
52250-69 = "Эта женщина..."
52250-70 = ""
52250-72 = ""
52250-73 = ""
52250-74 = "Глава Красоты природы, Кокурико."
52250-75 = "Верно. Наконец-то ты приветствуешь меня как подобает, глупая младшая."
52250-76 = "...Я никогда не признавала кого-то вроде тебя своей старшей."
52250-77 = "Если бы одно слово могло разорвать связь, Аямэ давно бы уже это сделала."
52250-78 = "..."
52250-79 = "Ты цепляешься за образ своей спутницы и отказываешься отпустить её после всего случившегося. Так как же ты можешь столь поспешно судить о той, о ком ничего не знаешь?"
52250-80 = "Некомпетентность. Высокомерие."
52250-81 = "Не слушай её бред, Нагуса."
52250-82 = "Именно. Она просто пытается задеть тебя и выиграть ещё немного времени."
52250-83 = "Я сейчас же её прикончу. Посмотрим, что она скажет после того, как я—"
52250-84 = "П-Пожалуйста, подожди, Рэнгэ!"
52250-85 = "Я чувствую какую-то... странную энергию, исходящую от главы Красоты природы."
52250-86 = "Ты можешь отказаться от своих обязанностей, но от крови Кадэнокодзи так просто не отречься."
52250-87 = "Впечатляет, что ты способна почувствовать присутствие тома."
52250-88 = "[s] «Книга...?»"
52250-89 = "Серьёзно? ЕЩЁ одна?!"
52250-90 = "Та мелкая из Красоты природы сказала, что их всего две!"
52250-91 = "Изначально у Красоты природы было три тома."
52250-93 = ""
52250-94 = "«Фантомные записи Ино» — отражение человеческих желаний."
52250-96 = ""
52250-97 = "«Фантомные иллюстрации Тотэй» — отражение человеческих страхов."
52250-99 = ""
52250-101 = "И наконец, отражение самих людей — «Записи духов Ино»."
52250-102 = "Сюро считала, что «Записи духов» исчезли на Великом снежном поле двадцать лет назад."
52250-103 = "Точнее будет сказать — были утрачены."
52250-104 = "Их история однажды завершилась, и они потеряли форму, но при необходимости можно изменить и использовать даже оригинал."
52250-105 = "[s] «'Однажды завершилась'...?»"
52250-106 = "Создавай сколько угодно томов — меня это не остановит."
52250-107 = "Я дала клятву перед Кузунохой, [USERNAME]-Сенсеем и всеми в Хяккарёран."
52250-108 = "Я поклялась больше никогда не оставлять Аямэ одну."
52250-109 = "Так скажите мне, президент Кокурико. Где Аямэ?"
52250-111 = "Ты всё ещё блуждаешь в стране грёз?"
52250-112 = "Великая пророчица Кузуноха. Воплощение прощения и вечных уз, да к тому же всего лишь слух. Усталый, банальный сюжет."
52250-113 = "Позволь мне разрушить твою ложь."
52250-114 = "Я раскрою твои затуманенные глаза и заставлю тебя принять реальность."
52250-115 = ""
