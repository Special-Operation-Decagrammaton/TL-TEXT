[translation]
52250-1 = "Episódio 25;O Terceiro Livro Macabro"
52250-2 = "Oh... que entretenimento interessante."
52250-3 = "Quem diria que tragédia e comédia se misturariam assim."
52250-4 = "A comédia venceu a tragédia, e ninguém mais dá atenção ao medo.#nA história de terror que deveria gelar corpo e alma...#nfoi esquecida e desapareceu como a névoa da manhã... não é?"
52250-5 = "Aquela pirralha... ousou manchar a minha elegância...!"
52250-6 = "Senhora Kokuriko, podemos mesmo deixá-la agir livremente?!"
52250-7 = "A Shuro está transformando a minha elegância em uma comédia!"
52250-8 = "A verdadeira essência do \"Toutei Bukkairoku\" é criar algo novo a partir do medo.#nSe ela enfia um Hyakumonogatari tão idiota no meio disso, quem vai temer esta história de terror?!"
52250-9 = "...Não precisa esquentar tanto a cabeça, Mulher-Serpente."
52250-10 = "O valor da elegância é medido pelo coração de quem a sente."
52250-11 = "Se o público foi cativado pela história da Shuro, isso só significa que você deixou a desejar, não é?"
52250-12 = "Se faltou alguma coisa, basta escrever uma nova história, não concorda?"
52250-13 = "Eu... não posso perdoar isso."
52250-17 = "Vou jogar aquela idiota no Crepúsculo agora mesmo e ver o rosto dela chorando e gritando—"
52250-27 = "...Já chega."
52250-28 = "Você sabe muito bem o que aquela garota significa para mim— ou por acaso não sabe?"
52250-29 = "Ou será que pretende jogar a sua própria imaturidade sobre mim só para desabafar?"
52250-30 = "N-Não... não foi minha intenção ofender a Senhora Kokuriko..."
52250-31 = "Você disse que jogaria a Shuro no Crepúsculo."
52250-32 = "Que consequências isso traria... como Artista do Macabro, você deveria saber muitíssimo bem."
52250-33 = "...S-Sim."
52250-34 = "Faça o que fizer, a sua história perdeu o poder. Ela não consegue mais tecer o medo."
52250-35 = "Um narrador habilidoso transforma até imprevistos em prenúncios...#nE você vai descontar a sua raiva na plateia só porque as coisas não saíram como queria?"
52250-36 = "Não há nada mais patético do que isso."
52250-37 = "P-Peço mil desculpas...!"
52250-38 = "Jamais ousei duvidar da vontade da Senhora Kokuriko!"
52250-39 = "Eu apenas... não consegui conter a minha frustração..."
52250-45 = "...Já está bom."
52250-46 = "No momento em que a Hyakkaryouran e o Sensei de Schale chegaram aqui, o capítulo do medo e da divisão se encerrou."
52250-47 = "De agora em diante, vamos deixar o resto com o Hitotsume."
52250-48 = "E quanto àquela idiota... digo, à Shuro, o que devemos fazer?"
52250-49 = "Pois é... se aquela garota encontrou o próprio caminho, não há por que forçá-la a vir conosco, mas..."
52250-57 = "A hora do acerto de contas chegou, Clube Beleza da Natureza!"
52250-58 = "Azami Habu... não, Mulher-Serpente.#nA história desagradável de vocês acaba aqui."
52250-59 = "Se vocês se renderem, a Hyakkaryouran tratará o caso com a devida cortesia.#n...Mas, se recusarem, não teremos piedade."
52250-60 = "Malditas da Hyakkaryouran, quando foi que vocês chegaram...?!"
52250-61 = "Acham mesmo que gente como vocês pode vencer só porque o poder do Livro Macabro enfraqueceu?"
52250-62 = "Se pensa que vamos recuar diante de uma ameaça dessas, está redondamente enganada!"
52250-63 = "Afinal, agora temos conosco a Nagusa-senpai, que empunha a Hyakuren capaz de atravessar assombrações!"
52250-64 = "Uma Contadora de Histórias de Terror como você não nos mete o menor medo!"
52250-65 = "Eu já disse que sou uma Artista do Macabro!!#nTodo mundo com essa mesma história...!"
52250-66 = "...Como sempre, o coração humano é algo impossível de compreender."
52250-67 = "Por que insistem em perseguir uma história tão entediante, mesmo sabendo qual será o final?"
52250-68 = "Hã? Quem é essa mulher...?"
52250-69 = "Aquela é—"
52250-74 = "A presidente do Clube Beleza da Natureza, Kokuriko."
52250-75 = "Finalmente se lembrou de mim, minha querida caloura?"
52250-76 = "...Eu não tenho nenhuma veterana como você."
52250-77 = "Se bastasse uma palavra para apagar um vínculo, a Ayame teria feito o mesmo."
52250-78 = "..."
52250-79 = "Você, que se agarra a quem acredita ser sua amiga... acha mesmo que pode negar o fato de que sou sua veterana?"
52250-80 = "É por isso que eu disse que você é incompetente e arrogante."
52250-81 = "Senpai, não dê ouvidos ao que essa mulher diz."
52250-82 = "É isso aí. Ela só tá falando besteira pra ganhar tempo."
52250-83 = "Se a gente acabar logo com ela—"
52250-84 = "E-Espere um momento, Renge-senpai!"
52250-85 = "Estou sentindo uma presença estranha... vindo da presidente do Clube Beleza da Natureza."
52250-86 = "Mesmo tendo abandonado seus deveres, o sangue dos Kadenokouji continua o mesmo... não é?"
52250-87 = "Quem diria que perceberia a presença de um \"Livro Macabro\"."
52250-88 = "[s] \"Livro Macabro...?\""
52250-89 = "Quer dizer que ainda existe outro...?"
52250-90 = "Aquela baixinha não disse que só existiam dois...?"
52250-91 = "Desde o início, o Clube Beleza da Natureza sempre possuiu três livros."
52250-94 = "O \"Inou Mononokeroku\", que reflete os desejos humanos."
52250-97 = "O \"Toutei Bukkairoku\", que reflete o medo humano."
52250-101 = "E aquele que reflete o próprio ser humano... o \"Inou Reikairoku\"."
52250-102 = "Parece que a Shuro achava que ele havia desaparecido na Grande Planície Nevada há vinte anos, mas..."
52250-103 = "Bem, dizer que ele foi perdido talvez não esteja de todo errado."
52250-104 = "Ele perdeu sua forma original — e estamos forçando a regeneração daquilo que se despedaçou."
52250-105 = "[s] \"...?\""
52250-106 = "Não importa quantos Livros Macabros vocês tenham, não vamos recuar."
52250-107 = "Porque eu jurei diante da Senhora Kuzunoha, do [USERNAME]-Sensei... e de toda a Hyakkaryouran."
52250-108 = "Que nunca mais deixaria a Ayame sozinha."
52250-109 = "Kokuriko, onde está a Ayame?"
52250-111 = "...Ainda está sonhando acordada?"
52250-112 = "\"Kuzunoha\", \"a Presidente perfeita\", \"uma amizade inabalável\"... tudo isso não passa de pura fantasia."
52250-113 = "Se insiste em se gabar de que isso é real, eu também tenho uma ideia."
52250-114 = "Que tal... dar uma olhada? Na realidade da qual todos tentam desviar o olhar."
52250-123 = "[ns] \"Tomem cuidado, pessoal!\""
52250-130 = "Próximo;Do Fundo das Sombras Escuras e Profundas"
