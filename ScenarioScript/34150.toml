[translation]
34150-1 = "Episódio 15;O que Restou"
34150-3 = "[ns1] \"Mika... pare!!\"\n[ns2] \"Agora não é hora para isso...!\""
34150-4 = "...Desculpa, Sensei. Eu sempre fui uma \"menina má\" que não obedece ninguém, né?"
34150-5 = "...Desculpa, Sensei. Eu sempre fui uma \"menina má\" que não obedece ninguém, né?"
34150-6 = "Eu tenho uma boa ideia da situação em que você está agora, Sensei, mas... não posso obedecer a essas palavras."
34150-7 = "Eu já traí você tantas vezes, Sensei... e não é como se uma ou duas vezes a mais fossem mudar alguma coisa a essa altura, né?"
34150-11 = "..."
34150-12 = "O que faremos?"
34150-13 = "S-Sensei..."
34150-17 = "[ns3] \"Por enquanto, vamos conter a Mika.\"\n[ns4] \"Por enquanto, vamos dar uma lição na Mika.\""
34150-20 = "Que bom. Eu já estava começando a ficar irritada."
34150-22 = "Ué? Isso significa que eu é que vou levar bronca?"
34150-23 = "Sério, fazer o papel de vilã só me traz prejuízo mesmo."
