[translation]
32130-1 = "Episódio 13;Mesmo Assim"
32130-2 = "(Depois disso, todas do Clube de Aulas de Reforço continuaram se esforçando dia após dia para a 3ª Prova Especial de Aptidão Acadêmica...)"
32130-24 = "4º Simulado do Clube de Aulas de Reforço, Resultado —"
32130-25 = "Hanako - 100 pontos [007eff](Aprovada)[-]"
32130-26 = "Azusa - 82 pontos [FF6666](Reprovada)[-]"
32130-27 = "Koharu - 74 pontos [FF6666](Reprovada)[-]"
32130-28 = "Hifumi - 79 pontos [FF6666](Reprovada)[-]"
32130-53 = "5º Simulado do Clube de Aulas de Reforço, Resultado —"
32130-54 = "Hanako - 100 pontos [007eff](Aprovada)[-]"
32130-55 = "Azusa - 94 pontos [007eff](Aprovada)[-]"
32130-56 = "Koharu - 90 pontos [007eff](Aprovada)[-]"
32130-57 = "Hifumi - 93 pontos [007eff](Aprovada)[-]"
32130-71 = "6º Simulado do Clube de Aulas de Reforço, Resultado —"
32130-72 = "Hanako - 100 pontos [007eff](Aprovada)[-]"
32130-73 = "Azusa - 91 pontos [007eff](Aprovada)[-]"
32130-74 = "Koharu - 83 pontos [FF6666](Reprovada)[-]"
32130-75 = "Hifumi - 89 pontos [FF6666](Reprovada)[-]"
32130-82 = "Faltam 6 dias para a última Prova Especial de Aptidão Acadêmica"
32130-85 = "Faltam 5 dias para a última Prova Especial de Aptidão Acadêmica"
32130-88 = "Faltam 4 dias para a última Prova Especial de Aptidão Acadêmica"
32130-91 = "Faltam 3 dias para a última Prova Especial de Aptidão Acadêmica"
32130-94 = "Faltam 2 dias para a última Prova Especial de Aptidão Acadêmica"
32130-97 = "Falta 1 dia para a última Prova Especial de Aptidão Acadêmica"
32130-100 = "...Finalmente é amanhã, né?"
32130-101 = "Sim..."
32130-102 = "..."
32130-103 = "N-Não vão mudar um monte de coisas de repente de novo, né?"
32130-107 = "Sim, por enquanto..."
32130-108 = "Pois é. O conteúdo da prova continua o mesmo de antes, e a nota de corte permanece em 90 pontos ou mais."
32130-109 = "O local é a Sala 32 do 19º Anexo de Trinity. Fica afastado do prédio principal, mas não é tão longe assim."
32130-110 = "O horário começa às 9h da manhã e não mudou."
32130-111 = "Na verdade, o que me intriga mesmo... é que desde ontem o prédio principal está silencioso a um ponto nada natural. É como se a presença de pessoas tivesse sumido de vez."
32130-112 = "...Por via das dúvidas, vou ficar de olho no quadro de avisos a noite toda hoje também."
32130-113 = "H-Hanako-chan, seria melhor você dormir também..."
32130-114 = "Fufu, eu estou bem. Além do mais, isso é o máximo que eu posso fazer..."
32130-115 = "I-Isso não é verdade! Graças à Hanako-chan nos ensinando a matéria com tanto cuidado, as minhas notas, as da Azusa-chan e as da Koharu-chan subiram tantooo...!"
32130-116 = "Isso foi porque todas vocês se esforçaram."
32130-117 = "Vocês passaram dias sem conseguir dormir direito e, mesmo assim, deram o seu melhor."
32130-118 = "[s] \"...É, com certeza vai dar tudo certo.\""
32130-119 = "Sim. Mesmo assim, 90 pontos ainda é bem no limite, mas... se as questões da prova de amanhã forem fáceis, com certeza..."
32130-120 = "..."
32130-121 = "...! É-É claro que uma coisa conveniente dessas não vai acontecer! Eu ainda vou continuar estudando até tarde da noite!"
32130-122 = "100 pontos! Se eu tirar 100 pontos, ninguém vai poder reclamar de nada, né!?"
32130-123 = "K-Koharu-chan... Eu entendo como você se sente, mas hoje seria melhor descansar com calma..."
32130-124 = "É verdade. Todo mundo sabe o quanto a Koharu-chan se esforçou, vai ficar tudo bem. Acho melhor você descansar por hoje e se preparar para amanhã."
32130-125 = "Descansar também faz parte da estratégia."
32130-126 = "Sim. E isso vale para você também, viu, Azusa-chan?"
32130-127 = "...Uhum. Pelo menos hoje, acho que vou descansar com calma."
32130-131 = "Finalmente amanhã... o nosso destino será decidido."
32130-132 = "Se por acaso... Não, melhor não falar coisas que dão azar. Nós vamos passar com certeza."
32130-133 = "E-Eu também! Não vou perder de jeito nenhum!"
32130-134 = "É-É verdade. Chorando ou sorrindo, só resta mais uma chance. Vamos dar o nosso melhor."
32130-135 = "Sim. Como nos esforçamos tanto até aqui, agora só nos resta fazer o nosso melhor até o fim."
32130-136 = "[s] \"...Vamos acreditar em todo o esforço que fizemos até agora. Com certeza vai dar tudo certo.\""
32130-137 = "Sim!"
32130-138 = "Isso mesmo."
32130-139 = "Uhum."
32130-140 = "..."
32130-142 = "Falta 1 dia para a última Prova Especial de Aptidão Acadêmica"
32130-148 = "..."
32130-153 = "..."
32130-156 = "Azusa, o cronograma mudou."
32130-157 = "...?"
32130-159 = "Será amanhã de manhã. Aguarde ordens no local combinado."
32130-160 = "E-Espera, Saori, amanhã é..."
32130-161 = "Algum problema?"
32130-162 = "O-Os preparativos ainda não estão prontos. Adiantar o cronograma em relação ao plano é um risco grande demais."
32130-163 = "Não, a execução será amanhã. Isso já está decidido, prepare-se direito."
32130-164 = "..."
32130-165 = "Quando o amanhã chegar, tudo vai mudar. Uma grande mudança irreversível acontecerá tanto para a nossa Arius quanto para esta Trinity."
32130-166 = "Destruir o halo de Kirifuji Nagisa, a Anfitriã da Tea Party de Trinity... É para isso que você está aqui."
32130-167 = "..."
32130-168 = "Eu confio na sua habilidade. Faça um bom trabalho, assim como fez com Yurizono Seia."
32130-169 = "...Entendido."
32130-170 = "Vou deixar tudo preparado."
32130-175 = "Azusa."
32130-176 = "...?"
32130-177 = "Espero que não tenha se esquecido: \"vanitas vanitatum\"."
32130-178 = "...Tudo é em vão."
32130-179 = "Qualquer esforço, sucesso ou fracasso... no fim, tudo não passa de algo sem sentido."
32130-180 = "...Eu nunca esqueci, nem uma única vez."
32130-185 = "..."
32130-187 = "..."
32130-189 = "Próximo;Confissão"
