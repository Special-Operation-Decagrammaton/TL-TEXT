32130-82 = "До последнего экзамена шесть дней."
32130-85 = "До последнего экзамена пять дней."
32130-88 = "До последнего экзамена четыре дня."
32130-91 = "До последнего экзамена три дня."
32130-94 = "До последнего экзамена два дня."
32130-97 = "До последнего экзамена один день."
32130-100 = "Завтра решающий день."
32130-101 = "И не говори."
32130-102 = "..."
32130-103 = "Они ведь не изменят время и место в последнюю секунду?"
32130-104 = ""
32130-106 = ""
32130-107 = "Я проверила — пока ничего не изменилось."
32130-108 = "Время и место те же, но нужно набрать не меньше 90 баллов."
32130-109 = "Здание 19 Тринити, класс 32. Оно на окраине района, но не так уж далеко."
32130-110 = "Экзамен начнётся в 9 утра, как и было назначено."
32130-111 = "На этой неделе странно было только то, как тихо стало в главном корпусе. Я вообще не видела там студентов."
32130-112 = "На всякий случай буду следить за доской объявлений."
32130-113 = "Но тебе тоже нужно хорошо выспаться, как и всем нам."
32130-114 = "Со мной всё будет хорошо. Это меньшее, что я могу сделать для всех."
32130-115 = "Вовсе нет! На этой неделе ты нам очень помогла. Мы подняли оценки только благодаря твоим занятиям."
32130-116 = "Ты преувеличиваешь. Это вы трое усердно трудились."
32130-117 = "Вы каждую ночь занимались до изнеможения."
32130-118 = "[s] «Думаю, вам всем есть чем гордиться.»"
32130-119 = "Набрать 90 баллов на экзамене непросто, но, может быть... если все вопросы покажутся знакомыми..."
32130-120 = "..."
32130-121 = "Это просто несбыточные мечты! На этот раз буду зубрить всю ночь!"
32130-122 = "Если наберу 100 баллов, они не смогут меня завалить! Вот увидите!"
32130-123 = "Ты права, Кохару, но я всё же советую тебе сегодня отдохнуть."
32130-124 = "Мы знаем, как усердно ты занималась. Не дай усталости завтра помешать тебе сосредоточиться."
32130-125 = "Верно. Тело должно быть готово не меньше, чем разум."
32130-126 = "Это и тебя касается, Азуса."
32130-127 = "Знаю. По крайней мере сегодня я хорошенько высплюсь."
32130-128 = ""
32130-130 = ""
32130-131 = "Всё решится завтра."
32130-132 = "Я... Нет, оставлю это. Обещаю завтра сдать экзамен."
32130-133 = "И я! Я так просто не сдамся!"
32130-134 = "Странно. Я уже начала сомневаться в наших шансах. Но вы правы — надо смотреть на вещи оптимистичнее."
32130-135 = "Именно. Каждый сделал всё, что мог."
32130-136 = "[s] «Да, положение тяжёлое, но верьте в себя.»"
32130-137 = "Хорошо, Сенсей."
32130-138 = "Точно."
32130-139 = "Да."
32130-140 = "..."
32130-142 = "До последнего экзамена меньше 12 часов."
32130-148 = "..."
32130-149 = ""
32130-151 = ""
32130-153 = "..."
32130-155 = ""
32130-156 = "Азуса, назначенный день изменился."
32130-157 = "Изменился?"
32130-158 = ""
32130-159 = "Завтра утром. Жди дальнейших указаний в условленном месте."
32130-160 = "П-Постой, Саори. Завтра я должна..."
32130-161 = "Есть проблема?"
32130-162 = "Мы не завершили подготовку. Перенос на более ранний срок чрезвычайно опасен."
32130-163 = "Решение окончательное. Доверься своей подготовке и будь готова, Азуса."
32130-164 = "..."
32130-165 = "Завтра ход истории изменится — и для Ариуса, и для Тринити."
32130-166 = "Не забывай о задании. Ты должна уничтожить нимб главы Чайной партии, Кирифуджи Нагисы. Больше ничего не имеет значения."
32130-167 = "..."
32130-168 = "Я знаю, ты справишься. Как справилась с Сэей."
32130-169 = "Поняла. Больше не буду возражать."
32130-170 = "Нужно подготовиться к завтрашнему заданию."
32130-171 = ""
32130-173 = ""
32130-174 = ""
32130-175 = "Азуса."
32130-176 = "...?"
32130-177 = "Помни. Vanitas vanitatum."
32130-178 = "Всё суета сует. Разумеется."
32130-179 = "В конце концов все усилия, достижения и даже неудачи бессмысленны."
32130-180 = "Я никогда об этом не забывала. Ни разу."
