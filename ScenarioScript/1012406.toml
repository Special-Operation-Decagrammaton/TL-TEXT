[translation]
1012406-1 = "Чёрная птица летнего неба"
1012406-2 = "Во время перерыва я наблюдал, как темнеет небо."
1012406-3 = ""
1012406-6 = "Наконец Хасуми вышла из отеля и направилась ко мне."
1012406-7 = ""
1012406-10 = "Вот ты где, Сенсей."
1012406-11 = "Я знаю, вы просили найти вас, как только освобожусь, но уже не слишком поздно?"
1012406-12 = "[s1] «Вовсе нет. На самом деле время идеальное.»\n[s2] «Условия просто идеальные!»"
1012406-15 = "«Идеальные условия» для чего?"
1012406-16 = "В такой час уже ничего не работает..."
1012406-17 = "[s3] «Фуфуфу... Совсем не годится...!»\n[s4] «Тебе нужно больше воображения!»"
1012406-20 = "С-Сенсей?"
1012406-21 = "[ns5] «Та-дам!»\n[ns6] Театрально продемонстрировать фейерверки."
1012406-24 = "Вы принесли... фейерверки?!"
1012406-25 = ""
1012406-27 = ""
1012406-28 = "Мы с вами успели сделать почти всё, чего мне хотелось на пляже."
1012406-29 = "Строили песочный замок, принимали песочную ванну, плавали, разбивали арбузы и играли в пляжный волейбол. Правда, волейбол пришлось прервать..."
1012406-30 = "А теперь ещё и фейерверки."
1012406-31 = ""
1012406-33 = ""
1012406-34 = "Я помню это..."
1012406-35 = "[s7] «Ага. Одна моя знакомая очень хотела всё это попробовать.»\n[s8] «Но она всегда ставит других выше себя, поэтому не могла.»"
1012406-38 = "...Такие незначительные вещи."
1012406-39 = "Я просто перечисляла занятия, которыми, как мне казалось, люди занимаются на пляже."
1012406-40 = "Они не стоили всех ваших усилий..."
1012406-41 = "[s9] «Именно таким ты представляла „лучший отдых на пляже“.»\n[s10] «А я хотел подарить тебе лето, о котором ты мечтала.»"
1012406-42 = ""
1012406-43 = ""
1012406-46 = "[ns] «Спасибо тебе за всё, что ты делаешь, Хасуми.»"
1012406-47 = "...Вы такой жестокий, Сенсей."
1012406-48 = "[s11] «А, запускаются.»\n[s12] Посмотреть на фейерверки."
1012406-54 = "[ns] «Как красиво.»"
1012406-56 = "Воистину."
1012406-57 = "Какое невероятное зрелище..."
1012406-59 = "Мы запускали фейерверки вместе, пока они не закончились."
1012406-61 = "Когда веселишься, время и правда летит незаметно."
1012406-62 = "Даже не хочется возвращаться к реальности."
1012406-63 = "[s] «Это тоже часть летнего отдыха!»"
1012406-64 = "Фуфу. Я и не знала, что на пляже может быть вот так."
1012406-65 = "Надеюсь, следующим летом мы сможем вернуться. Уже на настоящий отдых, а не по работе."
1012406-66 = "[s13] «Я рад, что тебе понравилось!»\n[s14] «Значит, всё было не зря!»"
1012406-69 = "Да. Мне понравилось каждое мгновение."
1012406-70 = "Но по-настоящему «того стоила» именно компания."
1012406-71 = "Так что следующим летом тоже..."
1012406-72 = "Неважно. Нельзя быть настолько жадной за один день."
1012406-73 = ""
1012406-75 = ""
1012406-76 = ""
1012406-77 = "...Пойдём обратно, Сенсей?"
