[translation]
84300100500-5 = ""
84300100500-6 = ""
84300100500-7 = "Эта записка..."
84300100500-8 = "...«Список деталей для сделки»? Почему здесь такое..."
84300100500-9 = ""
84300100500-11 = ""
84300100500-12 = "А здесь ещё один список... Всё это засекреченная информация. По крайней мере, должна быть."
84300100500-13 = "Что-то связанное с Чёрным рынком...? Нужно доложить..."
84300100500-14 = "...но мне почти нечего будет сказать, если я даже не знаю, где подозреваемые."
84300100500-15 = "Я видела, куда они пошли. Могу проследить за ними."
84300100500-16 = ""
84300100500-18 = ""
84300100500-19 = "...Нет. Я здесь, чтобы наблюдать за Выставкой Миллениума. Не стоит поднимать волну."
84300100500-20 = "Это не Тринити. Достаточно сообщить гидам."
84300100500-21 = "Не лезть в чужие проблемы. Таков был уговор с Нагисой."
84300100500-22 = "Уговор... с Нагисой..."
84300100500-23 = "Нагиса..."
84300100500-25 = "...а Сейя больше не может предсказывать подобные вещи и готовиться к ним, как раньше."
84300100500-26 = "Проще говоря..."
84300100500-27 = "...Я считаю, ей нужна защита."
84300100500-28 = ""
84300100500-30 = "*вздыхает*"
84300100500-31 = "И надо же было вспомнить об этом именно сейчас."
84300100500-32 = "...Неудачно."
84300100500-33 = "Но я ведь довольно эмоциональный человек."
84300100500-34 = "...Я просто подтвержу, где они находятся, прежде чем кому-нибудь сообщить..."
