[translation]
1004115-1 = "Личные воспоминания"
1004115-2 = "После разговора с Мисаки в MomoTalk я забеспокоился и отправился её искать."
1004115-6 = ""
1004115-7 = "Я, эм, оставила студенческий билет дома..."
1004115-8 = "Что ж, простите, но нам поступают сообщения о людях, которые пробираются в парк после закрытия."
1004115-9 = "Если вы не можете подтвердить личность, мне придётся сообщить в Валькирию!"
1004115-10 = "Аргх!"
1004115-11 = "[s] «Что случилось?»"
1004115-12 = ""
1004115-14 = ""
1004115-15 = "А. Приветствую, Сенсей из Шале. Что привело вас сюда в столь поздний час?"
1004115-16 = "С-Сенсей?!"
1004115-19 = "О? Вы пришли забрать этого студента? Тогда..."
1004115-20 = "Прошу прощения. Вам стоило сразу сказать, что вы просто ждёте, когда вас заберут домой."
1004115-21 = "[s] «Ничего, если дальше я сам разберусь?»"
1004115-22 = "Конечно. Пожалуйста."
1004115-23 = "И ВАМ спасибо, что так заботитесь о своих студентах."
1004115-24 = ""
1004115-26 = ""
1004115-28 = ""
1004115-30 = "...Я снова у вас в долгу."
1004115-31 = "[s1] «Рад, что смог помочь. Что ты делаешь здесь?»\n[s2] «Ты что-то потеряла?»"
1004115-34 = "...Я потеряла сумку."
1004115-35 = "Вчера я ночевала в этом парке. Сегодня вернулась забрать вещи, и тут меня поймал охранник..."
1004115-36 = "[s3] «Давай я помогу тебе поискать.»\n[s4] «Я хорошо знаю это место. Каждый день гуляю по району.»"
1004115-39 = "Не нужно. Потеряла я."
1004115-40 = "Сама и найду. А вы занимайтесь своими делами."
1004115-41 = "[s5] «Если будешь одна, охрана может снова тебя поймать.»\n[s6] «Вдвоём мы найдём быстрее, разве нет?»"
1004115-44 = "Вы не ошибаетесь..."
1004115-45 = ""
1004115-47 = ""
1004115-48 = "*вздыхает* Ладно. Давайте повторим мой маршрут, чтобы сузить область поиска."
1004115-49 = ""
1004115-51 = ""
1004115-52 = "Следуйте за мной."
1004115-53 = ""
1004115-55 = ""
1004115-59 = ""
1004115-60 = "Похоже, здесь нет."
1004115-63 = "Не здесь..."
1004115-66 = "И тут тоже нет..."
1004115-69 = ""
1004115-70 = "Всё ещё ничего..."
1004115-71 = ""
1004115-74 = "[ns] «Погоди! Вон там!»"
1004115-75 = ""
1004115-77 = ""
1004115-82 = ""
1004115-83 = "Вижу!"
1004115-84 = ""
1004115-86 = ""
1004115-92 = ""
1004115-93 = "Теперь вспомнила. Я оставила её здесь, а потом буквально наткнулась на патруль. Пока убегала, совершенно забыла."
1004115-94 = "Я просто рада, что сумка всё ещё здесь."
1004115-95 = "...Спасибо, Сенсей. Я у вас в долгу."
1004115-96 = "[s] «Проверь ещё раз, ничего ли не выпало.»"
1004115-97 = ""
1004115-99 = ""
1004115-100 = "Одежда — есть. Кошелёк — есть. Зубная паста и щётка на месте..."
1004115-101 = ""
1004115-103 = ""
1004115-104 = "...Эм."
1004115-105 = "[s] «Что такое? Чего-то не хватает?»"
1004115-106 = "...Ничего важного."
1004115-107 = "В таком месте иногда теряешь мелочи. Бывает."
1004115-108 = ""
1004115-114 = ""
1004115-115 = "С-Сенсей, что это у вас в руке?!"
1004115-116 = "[s7] «Это твоё, Мисаки?»\n[s8] «Это то, чего не хватало?»"
1004115-117 = ""
1004115-118 = ""
1004115-120 = ""
1004115-123 = "Да! Отдайте сюда!"
1004115-124 = ""
1004115-126 = ""
1004115-127 = ""
1004115-128 = "[ns] «Не думал, что ты любишь миниатюры.»"
1004115-129 = ""
1004115-131 = ""
1004115-132 = "*вздыхает*"
1004115-133 = ""
1004115-135 = ""
1004115-136 = ""
1004115-137 = "Саори вырезала это для меня, когда я была маленькой. Сделала карманным ножом из случайного полена, которое мы нашли."
1004115-138 = "Детям всегда нужно за что-то держаться, правда?"
1004115-139 = "Это просто детская игрушка. Не больше и не меньше."
1004115-140 = "Просто у меня плохая привычка таскать всякий хлам в сумке."
1004115-141 = "Ответ устраивает?"
1004115-142 = "[s] «Понятно. Значит, она очень тебе дорога.»"
1004115-143 = "...Вы вообще меня слушали?"
1004115-144 = "БЫЛА дорога. Сейчас уже нет."
1004115-145 = ""
1004115-147 = ""
1004115-148 = "В любом случае, спасибо за помощь сегодня."
1004115-149 = ""
1004115-151 = ""
1004115-152 = "Буду на связи."
