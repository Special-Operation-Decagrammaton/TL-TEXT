[translation]
1300602-1 = "Бесёнок-весельчак"
1300602-2 = "Я здесь!"
1300602-3 = "Ну что, Сенсей, чем займёмся сегодня?!"
1300602-4 = "[s] «Ты ведь просто пришла потусоваться, да?»"
1300602-5 = "Я пришла поддержать своего трудолюбивого Сенсея и помочь чем смогу!"
1300602-6 = "А что может быть полезнее, чем помочь тебе расслабиться?"
1300602-7 = ""
1300602-8 = "Давай поиграем, Сенсей!"
1300602-9 = "[s] «Прости, Муцуки. У меня слишком много работы, чтобы играть...»"
1300602-10 = "Не переживай. Я могу подождать."
1300602-11 = ""
1300602-12 = "Просто посижу здесь тихонько, пока ты не закончишь."
1300602-13 = "Как тебе?"
1300602-14 = "[s] «Ну, если ты так говоришь, Муцуки...»"
1300602-15 = "Спасибо, Сенсей!"
1300602-17 = "(Так я продолжил работать, пока Муцуки наблюдала.)"
1300602-18 = ""
1300602-19 = "(пристально смотрит)"
1300602-20 = "[s] «...»"
1300602-21 = ""
1300602-22 = "(пристально смотрит)"
1300602-23 = "[s] «Эм, Муцуки?»"
1300602-24 = "А? Ты закончил, Сенсей?"
1300602-25 = "[s] «Мне нужно ещё немного времени, так что...»"
1300602-26 = "Уф, ждать здесь ужасно скучно."
1300602-27 = "Хватит работать, поиграй со мной, Сенсей!"
1300602-28 = "Я даже принесла кое-что, с чем мы можем поиграть вместе!"
1300602-29 = "[s] «Это игрушка?»"
1300602-30 = ""
1300602-31 = "Видишь? У меня на сегодня были весёлые планы с этим браслетом."
1300602-32 = "[s] «Хм, но у меня всё ещё есть дела...»"
1300602-33 = "Иногда делать перерыв во время работы важно, правда?"
1300602-34 = "Ты всегда работаешь, когда меня нет рядом..."
1300602-35 = "Поэтому я подумала, что мы могли бы немного повеселиться и отдохнуть вместе..."
1300602-36 = "Можно..."
1300602-37 = ""
1300602-39 = ""
1300602-40 = "...поиграть?"
1300602-42 = "[s] «Да, отдых так же важен, как и работа!»"
1300602-43 = "Ура! Давай повеселимся, Сенсей!"
1300602-45 = "[ns] «Так для чего этот браслет?»"
1300602-46 = "Хи-хи-хи! Это датчик сердцебиения."
1300602-47 = "Надеваем его на запястье, и он делает «бззз», если пульс становится слишком высоким!"
1300602-48 = "[s] «И во что можно играть с такой штукой?»"
1300602-49 = "Хи-хи! Хороший вопрос, Сенсей."
1300602-50 = "Правила простые. По очереди пытаемся смутить друг друга."
1300602-51 = "Кто первым засмущается и получит разряд — проиграл."
1300602-52 = "А проигравший, разумеется, исполняет одно желание победителя."
1300602-53 = "[s] «И снова правило, на которое я не соглашался...»"
1300602-54 = "Ну же, не будь занудой."
1300602-55 = ""
1300602-56 = ""
1300602-57 = "Вот, Сенсей!"
1300602-59 = ""
1300602-60 = "Игра начинается прямо сейчас!"
1300602-61 = ""
1300602-62 = "Раз ты играешь впервые, можешь ходить первым. Считай это пощадой новичку."
1300602-63 = "(Так. Как бы смутить Муцуки?)"
1300602-64 = "[ns1] (Пощекотать Муцуки.)\n[ns2] (Скорчить смешную рожицу.)"
1300602-65 = "Ахахаха! Сенсей! Щекотно!"
1300602-66 = "(Я щекотал Муцуки, но браслет никак не реагировал.)"
1300602-67 = "Ахахаха! Хи-хи... ха. Фух... И это всё?"
1300602-68 = "Какая жалость! Все твои старания впустую."
1300602-69 = "Ого, Сенсей... Это выглядело почти отчаянно..."
1300602-70 = "..."
1300602-71 = "Хахахаха! Как смешно!"
1300602-72 = "Хахаха! Ты просто умора!"
1300602-73 = "Какая жалость! Не сработало, атака провалилась."
1300602-74 = "Не повезло! Твой ход окончен!"
1300602-75 = "Теперь моя очередь. Ладно, готовься."
1300602-76 = ""
1300602-77 = ""
1300602-78 = "[s3] «Эм, Муцуки...?»\n[s4] «Почему ты так близко?»"
1300602-79 = "Дай-ка ухо..."
1300602-80 = "Дай-ка ухо..."
1300602-81 = "(Это шёпотная атака!)"
1300602-82 = "[s] «Ч-Что...?!»"
1300602-85 = "[ns] «Ай, щиплется!»"
1300602-87 = "[ns] «Т-Ты меня напугала.»"
1300602-88 = "Ахаха! Смотри, как ты растерялся! Похоже, этот раунд мой!"
1300602-89 = "Проигравший хочет узнать, какое желание у победителя?"
1300602-90 = "Хе-хе-хе..."
1300602-91 = ""
1300602-92 = ""
1300602-93 = "(Я проиграл Муцуки. Пока я переживал поражение, кое-что привлекло внимание.)"
1300602-94 = "[s5] «А? Погоди, Муцуки. Этот браслет...»\n[s6] «Разве он не... выключен?»"
1300602-97 = ""
1300602-98 = "..."
1300602-99 = "[s] «Только не говори... Муцуки, ты жульничала!»"
1300602-100 = "Ахаха, поймал! ♪"
1300602-101 = "Раз меня раскрыли, пора уходить!"
1300602-102 = ""
1300602-103 = "[s] «С-Стой, Муцуки...!»"
1300602-106 = "(Не дав мне ни секунды, чтобы остановить её, Муцуки исчезла как ветер.)"
