[translation]
2601105-1 = "Ставка на удар"
2601105-2 = "Сатэн пригласила меня в местный бейсбольный тренажёрный зал."
2601105-3 = ""
2601105-7 = ""
2601105-8 = ""
2601105-9 = ""
2601105-10 = "Ух ты, здесь неплохое оборудование."
2601105-11 = "Я слышала, что у каждой академии своя атмосфера, но это место действительно напоминает мне Академгородок."
2601105-12 = "[s1] Бейсбольный зал?\n[s2] Помахать Сатэн, подходя к ней."
2601105-15 = "Сенсей, сюда! Я здесь!"
2601105-16 = "Ты раньше, чем я ожидала! Я как раз собиралась начинать."
2601105-17 = "...Хм? Что значит, ты думал, я собираюсь отдыхать?"
2601105-18 = "Я и отдыхаю. Отбивая мячи! В Академгородке я постоянно так делаю."
2601105-19 = ""
2601105-21 = ""
2601105-22 = "...Это странно?"
2601105-23 = "[s3] Нет-нет! Делай как нравится.\n[s4] Я просто подумал, что у тебя всегда столько энергии."
2601105-26 = "Вообще-то сначала у меня есть вопрос."
2601105-27 = "Оборудование и всё остальное здесь очень хорошее..."
2601105-28 = "Но я заметила, что вон та клетка устроена как-то странно."
2601105-29 = "Видишь? Вон там."
2601105-30 = ""
2601105-33 = "[ns5] И правда выглядит немного... странно?\n[ns6] Что там вообще происходит?"
2601105-36 = "Пока ждала, я поискала информацию. Оказывается, там стоит «опасно мощная подающая машина», которую сделал студент Миллениума."
2601105-37 = "Это предупреждение... Разве от него не хочется попробовать ещё сильнее?"
2601105-38 = "...Что? Думаешь, это слишком опасно? Хм..."
2601105-39 = "Хмммм..."
2601105-40 = "[s7] Эм, Сатэн?\n[s8] Я что-то не то сказал?"
2601105-43 = "Нет, ничего такого... Просто я думаю об этом ещё с тех пор, как ты пришёл."
2601105-44 = "То есть, когда я слышу, что что-то опасно, часть меня сразу хочет проверить, НАСКОЛЬКО именно это опасно..."
2601105-45 = "Хм..."
2601105-46 = "Ничего не поделаешь. Мне нужно это проверить. Смотри, Сенсей!"
2601105-47 = ""
2601105-49 = ""
2601105-51 = "Решительно настроенная Сатэн направилась к клетке."
2601105-54 = "― [log=사텐]Ну...[/log][wa:1600]"
2601105-55 = "― [log=사텐]Она не особо отличается от остальных клеток...[/log][wa:380]"
2601105-58 = "― [log=사텐]...Сенсей, чего у тебя такое обеспокоенное лицо?[/log][wa:3400]"
2601105-59 = "― [log=사텐]Это всего лишь подающая машина.[/log][wa:230]"
2601105-62 = "[ns] Остановись в любой момент, если почувствуешь, что становится слишком опасно."
2601105-65 = "― [log=사텐]Хорошо! Но я уверена, со мной всё будет в порядке.[/log][wa:1040]"
2601105-68 = "― [log=사텐]В конце концов, я довольно уверена[/log][wa:990]"
2601105-69 = "― [log=사텐]в своих навыках с битой.[/log][wa:240]"
2601105-72 = "― [log=사텐]...А теперь ты смотришь на меня[/log][wa:1070]"
2601105-73 = "― [log=사텐]совсем уж подозрительно.[/log]"
2601105-76 = "― [log=사텐]Может, заключим пари?[/log][wa:340]"
2601105-79 = "― [log=사텐]Если я не попаду по мячу за три подачи,[/log][wa:1120]"
2601105-80 = "― [log=사텐]то спокойно уйду с площадки.[/log][wa:20]"
2601105-83 = "― [log=사텐]Но если попаду хотя бы по одному мячу,[/log][wa:2950]"
2601105-84 = "― [log=사텐]ты купишь мне напиток из того автомата![/log][wa:10]"
2601105-87 = "― [log=사텐]Ну как?[/log][wa:1210]"
2601105-88 = "― [log=사텐]Для тебя ведь тоже неплохое пари, правда?[/log][wa:100]"
2601105-91 = "― [log=사텐]...Хи-хи.[/log][wa:200]"
2601105-93 = ""
2601105-94 = "Ладно! К бите выходит четвёртый номер — Сатэн!"
2601105-95 = "А теперь первая подача!"
2601105-96 = ""
2601105-99 = "Летит!"
2601105-100 = ""
2601105-102 = ""
2601105-103 = "Хия-а!!"
2601105-104 = ""
2601105-111 = "Мне пришлось купить ей три напитка."
