[translation]
83303400200-5 = ""
83303400200-6 = "Вы работаете так чисто, глава префектов Хина."
83303400200-7 = "Спасибо, что дали мне возможность уложить столько трупов в покой— простите, я хотела сказать: раненых в больничные койки."
83303400200-8 = "Я была с ними строже, чем следовало. Боюсь, потеряла самообладание."
83303400200-9 = "К счастью, никто не получил особенно серьёзных травм, во многом благодаря тебе."
83303400200-10 = "Я лишь исполняла свой долг."
83303400200-11 = "О — погодите, глава префектов Хина. У вас кровь на щеке..."
83303400200-12 = "А... Похоже, получила небольшую царапину, когда усмиряла их."
83303400200-13 = "Возьмите мазь из шкафчика с припасами. Не хотелось бы, чтобы кто-нибудь из этих хулиганов потом хвастался, будто оставил вам шрам."
83303400200-14 = "А... Спасибо."
