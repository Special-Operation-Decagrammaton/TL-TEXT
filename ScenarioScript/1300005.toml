[translation]
1300005-1 = "Прогулка вдвоём"
1300005-2 = "Первый район Чёрного рынка возле Миллениума"
1300005-3 = "Стой, мерзавец!"
1300005-4 = "*топот*"
1300005-5 = ""
1300005-6 = ""
1300005-8 = ""
1300005-9 = ""
1300005-10 = ""
1300005-11 = "Ух... Я потеряла цель?"
1300005-12 = "Могла быть утечка? Они слишком быстро среагировали."
1300005-13 = "Сделку остановить удалось, но документы всё ещё не у меня. Маршрут отхода оказался непредсказуемым..."
1300005-14 = "А?"
1300005-15 = "Господин?! Что ты здесь делаешь?"
1300005-16 = "Пришёл сюда, потому что услышал взрыв? Могу на сто миллионов процентов гарантировать: это не имеет ко мне никакого отношения."
1300005-17 = "Хочешь знать, что я здесь делаю? Ну, я только что закончила миссию и..."
1300005-18 = "То есть закончила клубное занятие и уже шла домой."
1300005-19 = "Ха-ха. Какое совпадение."
1300005-20 = "Кстати, ты сейчас занят, Господин?"
1300005-21 = "Такой леди, как я, опасно ходить одной так поздно. К сожалению, безопасность в Кивотосе уже не та, что раньше."
1300005-22 = ""
1300005-23 = ""
1300005-24 = "Не проводишь меня до Миллениума?"
1300005-26 = "Центр города возле Миллениума"
1300005-27 = "Господин. Господин!"
1300005-28 = "Прошу прощения? Ты не хочешь, чтобы я называла тебя Господином при других?"
1300005-29 = "Наверное, волнуешься, как это выглядит со стороны. Тогда как мне к тебе обращаться?"
1300005-30 = "[s1] «Скажи, что я твой старший брат.»\n[s2] «Считай меня любящей старшей сестрой.»\n[s3] «Давай остановимся на Сенсее.»"
1300005-31 = "Хм. На данном этапе это будет довольно сложно."
1300005-32 = "Хм. На данном этапе это будет довольно сложно."
1300005-33 = "Хм. На данном этапе это будет довольно сложно."
1300005-34 = "Я не могу просто изменить обращение к тому, кому служу, даже по приказу самого господина."
1300005-35 = "В конце концов, я горничная."
1300005-36 = "[s] «Почему ты вообще вступила в Клуб горничных?»"
1300005-37 = "О?"
1300005-38 = "Согласна, Клуб горничных немного необычнее остальных."
1300005-39 = "Например, Карин вступила, чтобы освоить домашнее хозяйство и стать идеальной женой..."
1300005-40 = "А Асуна вступила просто потому, что хотела быть рядом с Нэру."
1300005-41 = "Но я не вступала под каким-то предлогом или ради особой цели..."
1300005-42 = "...и не стала горничной после вступления в Клуб горничных."
1300005-43 = "Я выбрала C&C, потому что уже была горничной."
1300005-44 = "Я живу ради служения своему господину."
1300005-45 = "Так я чувствую с самого рождения."
1300005-46 = "О? Прохожие начали о нас перешёптываться?"
1300005-47 = "А. Я могу вытереть ими пол, если тебе будет угодно."
1300005-48 = ""
1300005-49 = "Ха-ха. Успокойся, пожалуйста."
1300005-50 = "Это была безобидная шутка."
1300005-52 = "Если честно, сегодня я... провалила миссию."
1300005-53 = "Пусть мне и не удалось выполнить задачу, но встретить тебя вот так..."
1300005-54 = "...кажется мне большой удачей."
1300005-55 = "Я провалила миссию."
1300005-56 = "И всё же почему-то не могу перестать улыбаться. Почему?"
1300005-57 = "Потому что ты рядом?"
1300005-58 = "Спасибо, что делаешь меня счастливой, Господин."
1300005-59 = "В ответ я тоже хочу сделать счастливым тебя."
1300005-60 = ""
1300005-61 = ""
1300005-62 = "(бумп)"
1300005-63 = "Эй, смотри куда идёшь! Ослеп, что ли?!"
1300005-64 = "Прошу прощения. Мне следовало быть внимательнее..."
1300005-65 = "Подождите."
1300005-66 = "...?"
1300005-67 = "Ну что ж."
1300005-68 = "Какого...?!"
1300005-69 = "Т-Ты та самая горничная из C&C! Ты преследовала меня до самого сюда?!"
1300005-71 = "А! Стой!"
1300005-72 = "Когда я с тобой, удача всегда словно улыбается мне, Господин!"
1300005-73 = "Эту цель наняла злая корпорация, чтобы украсть личные данные студентов Миллениума!"
1300005-74 = "За ним!"
1300005-76 = "После этого я помог Аканэ всё-таки успешно завершить миссию."
