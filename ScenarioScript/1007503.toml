1007503-8 = ""
1007503-9 = ""
1007503-10 = ""
1007503-11 = ""
1007503-12 = ""
1007503-13 = ""
1007503-14 = "Как героиня должна отреагировать, когда её ВПЕРВЫЕ В ЖИЗНИ приглашают на свидание?!"
1007503-15 = "[s] «Откуда мне знать?»"
1007503-16 = "Потому что я не знаю! Вы взрослый, вы должны разбираться в таких вещах!"
1007503-17 = "[s] «О чём вообще речь?»"
1007503-18 = ""
1007503-20 = ""
1007503-21 = "Хм... Похоже, придётся объяснить вам всё с самого начала."
1007503-22 = "Итак, в моей истории есть героиня."
1007503-23 = "Она неуклюжая, не очень уверена в себе и никогда особо не старалась научиться краситься или красиво одеваться."
1007503-24 = "Но после череды тяжёлых событий её неожиданно приглашают на свидание!"
1007503-25 = "[s] «Тебе придётся объяснить, что это за „тяжёлые события“.»"
1007503-26 = "Эта часть не важна!"
1007503-27 = "В общем... Героиня впервые в жизни наносит макияж, верно?"
1007503-28 = "И в предвкушении свидания впервые сама готовит бэнто!"
1007503-29 = "[s] «Похоже, тебе не так уж нужна моя помощь...»"
1007503-30 = "Нет-нет! Именно здесь и начинается проблема!"
1007503-31 = "О чём она думает, выходя из дома?"
1007503-32 = "Какие чувства бурлят в ней, пока она идёт на свидание?"
1007503-33 = "И... что вообще происходит на свидании?! И как ей на всё реагировать?"
1007503-34 = "А-а-а-а! Я просто не знаю! Не знаю! У меня полный творческий ступор!"
1007503-35 = "[s3] «Хм, кажется, у меня есть идея.»\n[s4] «Почему бы не устроить выездное исследование за пределами Красной Зимы?»"
1007503-38 = "Ч-Что?! О чём вы?"
1007503-39 = ""
1007503-42 = "Сенсей?"
1007503-43 = ""
1007503-45 = ""
1007503-46 = "Сенсей?!"
1007503-47 = ""
1007503-49 = ""
1007503-50 = "Л-Ладно! Иду! Не нужно меня тащить!"
1007503-51 = "Центр Кивотоса"
1007503-52 = ""
1007503-54 = ""
1007503-56 = ""
1007503-58 = ""
1007503-60 = "..."
1007503-61 = ""
1007503-63 = ""
1007503-64 = ""
1007503-65 = ""
1007503-66 = "Я... Я правда здесь..."
1007503-67 = "Что вы задумали, Сенсей?!"
1007503-68 = "[s5] «Сегодня отличная погода. Идеально для прогулки.»\n[s6] «Давай проветрим голову, пока гуляем снаружи.»"
1007503-71 = "Хм, прогулка..."
1007503-72 = "Наверное, новые места действительно могут разбудить моё творческое вдохновение."
1007503-73 = "[s] «Тогда пошли.»"
1007503-74 = "О. Значит, сегодня вы мой сопровождающий? Хорошо! Ведите, Сенсей!"
1007503-75 = "Торговый центр"
1007503-76 = ""
1007503-77 = "Это... крупный торговый центр...?"
1007503-78 = "Здесь и правда много людей... Красная Зима тоже довольно большая, но у нас не хватает учеников, чтобы она выглядела настолько оживлённой."
1007503-79 = "О! Посмотрите на тех двоих. Из них может получиться хороший референс."
1007503-80 = "Магазин косметики. Один студент пытается накрасить другую, а вторая отбивается. Может, она раньше никогда не пользовалась косметикой."
1007503-81 = "Хм, хмм... В голове что-то складывается..."
1007503-82 = ""
1007503-84 = ""
1007503-85 = ""
1007503-86 = "Есть! Момент, который нужно зарисовать!"
1007503-87 = "[s] «Ч-Что ты имеешь в виду?»"
1007503-88 = "Идеально! Героиня изо всех сил пытается накраситься, но её партнёрша считает, что ей это не идёт!"
1007503-89 = "Поэтому партнёрша тащит героиню в магазин косметики. Та тут же начинает сопротивляться!"
1007503-90 = "И это вызывает неожиданный обратный эффект! Её сопротивление лишь сильнее провоцирует партнёршу поддразнивать её! Всё начинается с лёгкой основы, а заканчивается полным макияжем. Она преображается!"
1007503-91 = "Нет, погодите. Нужно больше загадочности! Героиня лишь притворялась, что ей всё равно! На самом деле она тщательно всё подстроила, чтобы спровоцировать партнёршу на поддразнивания."
1007503-92 = "Та, кто думала, что наступает, на самом деле всё это время плясала под дудку героини..."
1007503-93 = "Погодите-ка, Сенсей! Вы же ЗНАЕТЕ, как проходят свидания!"
1007503-94 = "[s7] «А! Я просто привёл тебя в торговый центр!»\n[s8] «Я не собирался помогать тебе вот таким способом!»"
1007503-97 = ""
1007503-99 = ""
1007503-100 = ""
1007503-101 = "А? Сенсей? Что вы делаете? Это же самое интересное! Не утаскивайте меня!"
1007503-102 = ""
1007503-104 = ""
1007503-105 = "Парк развлечений"
1007503-106 = ""
1007503-107 = "Хм. На этот раз парк развлечений. Классика любого свидания."
1007503-108 = "Посмотрим... Есть ли здесь ученики, которые хорошо проводят время... а вот и они! Легки на помине!"
1007503-109 = "Колесо обозрения! Идеальная сцена: маленькая кабинка, вы сидите рядом, пока она медленно кружится."
1007503-110 = ""
1007503-112 = ""
1007503-113 = ""
1007503-114 = "...И вот ещё один! Момент для зарисовки!"
1007503-115 = "[s] «...Я совершенно не понимаю, что именно запускает у тебя эти моменты.»"
1007503-116 = "Не переживайте о неважных деталях! Это распространённое клише!"
1007503-117 = "Героиня и её партнёрша, всё ещё немного стесняясь и нервничая, осторожно садятся друг напротив друга в кабинке."
1007503-118 = "Но чем выше поднимается кабинка, тем сильнее растут их чувства друг к другу. На самой вершине они смотрят друг другу в глаза."
1007503-119 = "Партнёрша встаёт, проходит через кабинку и садится рядом с героиней..."
1007503-120 = "И вместе с физическим расстоянием сокращается эмоциональное...! А потом, потом...!"
1007503-121 = "[ns] «Прости, что прерываю...»"
1007503-123 = "[ns] «Наша очередь, Мэру.»"
1007503-124 = "Погодите! Это идеальный момент!"
1007503-125 = "Но, пожалуй, американские горки тоже будут неплохим опытом. Совсем неплохим."
1007503-126 = "Согласно закону ошибочной атрибуции возбуждения, героиня и её партнёрша..."
1007503-128 = "Пожалуйста, пристегните ремень безопасности и не высовывайте руки и ноги во время движения аттракциона."
1007503-138 = "Ха-ха-ха! Это правда здорово!"
1007503-139 = "Кафе"
1007503-140 = ""
1007503-141 = "На этот раз кафе! Любопытно. Видите ли, кафе может иметь множество значений. Место для учёбы, любимая точка встречи друзей или личное свидание для двоих..."
1007503-142 = "Но в действительности всё это происходит в очень публичном месте!"
1007503-143 = "Противопоставление личного и общественного, водоворот противоречивых эмоций участников... Хи-хи. ХИ-ХИ-ХИ! Моя душа художника ОЖИЛА!"
1007503-144 = "[s] «Давай сначала сделаем заказ...»"
1007503-145 = "А? Ах, точно. Чтобы остаться, нужно что-нибудь купить. Я возьму..."
1007503-152 = ""
1007503-153 = "Эй, Сенсей. Вон те двое. Я уже какое-то время за ними наблюдаю..."
1007503-154 = "О, одна из них уронила трубочку."
1007503-155 = "[s] «И попросила у сотрудника новую, как обычно и делают.»"
1007503-156 = "Ох, какой скучный финал."
1007503-157 = ""
1007503-159 = ""
1007503-160 = ""
1007503-161 = "Но мой момент для зарисовки на этом не остановить! Теперь героиня сама пойдёт в наступление! Она делает вид, будто случайно роняет трубочку, чтобы естественно перейти к тому, чтобы пить через одну трубочку...!"
1007503-162 = "Погодите, так ли лучше? Может, наоборот? Не нарушит ли такой резкий скачок в смелости развитие персонажа?"
1007503-163 = "Нет, нет... А как насчёт этого! Она воплощает свой план с трубочкой, но в последний момент трусит!"
1007503-164 = "Поэтому, когда она просит у сотрудника новую трубочку, с одной стороны она почувствует облегчение, а с другой — разочарование..."
1007503-165 = "Она окажется в чистилище между дружбой и отношениями!"
1007503-166 = "[s] «Наш заказ принесли, так что продолжим после того, как допьём.»"
1007503-171 = "Фух! Я объелась!"
1007503-172 = "[s] «...Мы вообще-то почти ничего не ели...»"
1007503-173 = "Нужно погрузиться в душу художника, Сенсей! Чувство насыщения может означать многое!"
1007503-174 = "Но знаете, вы довольно хороший помощник! Места, которые вы выбрали, были идеальны."
1007503-175 = "[s] «Рад, что тебе понравилось наше свидание.»"
1007503-176 = ""
1007503-178 = ""
1007503-179 = "...Что...?"
1007503-180 = "С-С-С-СВИДАНИЕ... вы сказали СВИДАНИЕ...?!"
1007503-181 = "П-Погодите... места, куда мы сегодня ходили... торговый центр, парк развлечений, кафе..."
1007503-182 = "...?!"
1007503-183 = "[s] «Ты набрала достаточно хороших референсов для своей истории?»"
1007503-184 = "...!"
1007503-185 = "К-К-К-Конечно!"
1007503-186 = "Т-Такие вещи для художника вроде меня — пустяки!"
1007503-187 = "Я-я пойду обратно первой! Пока, Сенсей!"
1007503-188 = ""
1007503-190 = ""
1007503-193 = "Хья?!"
1007503-194 = "[s] «О. Она врезалась в столб.»"
1007503-195 = "Угх... Моя голова...!"
1007503-196 = "Я-я вам это припомню! Я отомщу!"
1007503-198 = "Я молча помахал вслед Мэру, которая умчалась прежде, чем я успел что-либо сказать..."
