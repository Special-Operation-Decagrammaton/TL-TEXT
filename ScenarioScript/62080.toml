[translation]
62080-1 = "Эпизод 8;Porta Pacis 2"
62080-2 = ""
62080-3 = ""
62080-4 = "...Тайна? Серьёзно?"
62080-5 = "Что дальше, будем вызывать призраков? Каких-нибудь мстительных духов?"
62080-6 = "Президент!"
62080-7 = "Угх..."
62080-8 = ""
62080-10 = ""
62080-11 = ""
62080-12 = "Я... никогда об этом не слышала."
62080-13 = "И не могла слышать. Если честно, поначалу я сама считала это всего лишь легендой или мифом."
62080-14 = "Я никому об этом не рассказывала."
62080-15 = "Однако незадолго до Эдемского договора Беатриса отправилась в архив Porta Pacis."
62080-16 = "Она рассказала об этом только мне."
62080-17 = ""
62080-19 = ""
62080-20 = ""
62080-21 = "!"
62080-22 = "Э...?"
62080-23 = ""
62080-25 = ""
62080-26 = ""
62080-27 = "Н-Но ведь туда никому нельзя было ходить..."
62080-28 = "Думаешь, Беатрису это волновало?"
62080-29 = "Это... правда..."
62080-30 = "У Беатрисы было множество секретов, и это был один из них."
62080-31 = "...Тогда, может быть, мимесисы Совета Святой Юстины проявились именно из-за...?"
62080-32 = "Возможно. Скорее всего, мы уже никогда не узнаем наверняка."
62080-33 = "...Максимум можно сказать, что эти вещи, вероятно, так или иначе были связаны."
62080-34 = "И, как вы все знаете, по всему Ариусу стало происходить всё больше странных явлений."
62080-35 = "Да... Помню. Внезапно появилось много нового, чего я раньше никогда не видела. И у нас было... очень-очень много оружия..."
62080-36 = "Наверное, мы об этом особо не задумывались. Просто считали... что взрослые отличаются от нас... Взрослые невероятные..."
62080-37 = "[s] «...»"
62080-38 = "Но здесь важно именно то, что их стало «больше»."
62080-39 = "Хм...? То есть..."
62080-40 = "Ага."
62080-41 = "Хотя это случалось редко, странные явления происходили здесь, в Ариусе, всегда."
62080-43 = "...Да, в каждой школе есть свои истории о призраках, но с Ариусом... всё было совсем другого уровня."
62080-44 = "Только покинув Ариус, я поняла, насколько ненормально часто здесь происходило подобное."
62080-45 = ""
62080-47 = ""
62080-48 = ""
62080-49 = "[ns] «Почему... это происходит именно здесь?»"
62080-50 = "Я не могу назвать точную причину."
62080-51 = "Однако..."
62080-52 = "Мне кажется, это место просто... стало таким."
62080-53 = "В Ариусе всегда было «что-то»."
62080-54 = "Скорбь, обида, ненависть, ярость, смирение... Всё это собирается здесь и гниёт."
62080-55 = "Говорят, достаточно сильное желание или решимость так или иначе способны обрести форму."
62080-56 = "Н-Но разве это не просто... метафора..."
62080-57 = "Но мы ведь уже видели подобное. Совет Святой Юстины и Барбару, разве нет?"
62080-58 = "...Видели. Но я думала, это просто дело рук Мадам... Беатрисы."
62080-59 = "Может, я просто отводила взгляд... от другой стороны «истины» Ариуса."
62080-60 = "Я не могу утверждать наверняка. Но иногда мне всё равно становится страшно."
62080-61 = "Эта бурлящая масса отрицательных чувств... Что вообще может скрываться под ней?"
62080-62 = "От одной мысли... мне страшно."
62080-63 = "..."
62080-64 = "Угх..."
62080-65 = ""
62080-67 = ""
62080-68 = ""
62080-69 = "...Давайте поговорим о Книге Откровения."
62080-70 = "В конце концов... похоже, именно она лежит в основе того, что сейчас происходит в Ариусе."
62080-71 = "Да. Спасибо, Шимико."
62080-72 = "Конечно, Ацуко."
62080-73 = "Книга Откровения — последняя часть Писания, которое передаётся и в Тринити, и в Ариусе."
62080-74 = "Ведь Писание обе академии используют одно и то же. Их толкования могли разойтись, но источник остался единым."
62080-75 = "Однако в Тринити Книгу Откровения используют скорее как... справочный текст, что ли."
62080-76 = "Книга нравственных уроков, советов и притч... Не более того."
62080-77 = "В Ариусе исследовали Книгу Откровения и интересовались ею куда серьёзнее."
62080-78 = "...Их интересовал «конец света», описанный в Откровении."
62080-79 = "[s] «Разве это не значит...?!»"
62080-80 = "...Так или иначе руководство Ариуса хотело приблизить конец света."
62080-81 = "..."
62080-82 = "Скажу прямо, Сенсей. Именно так."
62080-83 = "М-М-М-М-М-М-Мисаки?!"
62080-84 = "Что за реакция? Я что, вру? К тому же мы говорим с Сенсеем."
62080-86 = "...Я могу это понять."
62080-87 = "Ребёнок, которым пренебрегают, подожжёт деревню, лишь бы почувствовать тепло огня."
62080-88 = "Для того, кому уже нечего терять, даже конец света может казаться спасением."
62080-89 = "Потому что, по крайней мере, тогда всё покажется справедливым..."
62080-90 = "Говорят, для отдельного человека его смерть и конец света в итоге одно и то же, верно?"
62080-91 = "Тогда вполне правдоподобно, что однажды кто-то посмотрит на это и с обратной стороны."
62080-93 = "Да. Когда человек зацикливается, это опасно. Он начинает путать средство и цель."
62080-94 = "..."
62080-95 = "..."
62080-96 = "В Книге Откровения трижды появляются группы из семи ангелов. Мы называем их «Ангелами Откровения»."
62080-98 = "Я считала их всего лишь мифом, родившимся из нашего страха и страданий."
62080-99 = "В конце концов, Ариус всегда особенно любил Книгу Откровения."
62080-100 = "...Как Ацуко сказала ранее, сильные человеческие чувства склонны так или иначе воплощаться."
62080-102 = "Три группы ангелов, записанные в Книге Откровения, знаменуют конец света."
62080-103 = "Сначала семь «ангелов, снимающих печати», затем семь «ангелов, трубящих в трубы», и наконец семь «ангелов, изливающих чаши»."
62080-104 = "Вы ведь все слышали трубу? Я тоже. Должно быть, это и были «ангелы, трубящие в трубы»."
62080-105 = "Судя по тексту, труба прозвучала четыре раза."
62080-106 = "Это совпадает с голосом, который мы слышали с неба."
62080-107 = "«Из-за звуков труб, в которые вот-вот затрубят остальные три ангела»."
62080-108 = "[s] «Что произойдёт, если все семь ангелов затрубят?»"
62080-109 = "Фуфу. Интересно."
62080-110 = "Если вдруг всё, что написано в Книге Откровения, сбудется..."
62080-111 = "Тогда следующими будут семь ангелов с чашами гнева."
62080-112 = "И когда всё по порядку изольётся на землю, миру придёт конец..."
62080-113 = "А на его месте возникнет новый мир для верных. Так нас учили."
62080-114 = "...Да. Если всё будет следовать Книге Откровения."
62080-115 = "Но действительно ли это были Семь трубящих ангелов?"
62080-116 = "Думаешь, это могло быть что-то другое?"
62080-117 = ""
62080-119 = ""
62080-120 = "...Возможно. Честно говоря, сейчас всё слишком неопределённо."
62080-121 = "В глубинах Ариуса всегда что-то зрело, а эта земля переживала одну трагедию за другой."
62080-125 = ""
62080-126 = ""
62080-127 = "М-Мы правда здесь..."
62080-128 = "Эм... Ух..."
62080-130 = "Все, тихо. Это всего лишь здание. Не паникуйте."
62080-132 = "Д-Да."
62080-134 = "Наша цель — архив под Porta Pacis."
62080-135 = "Говорят, там покоится «истина» Ариуса."
62080-136 = "Возможно, там найдутся подсказки об Ангелах, трубящих в трубы."
62080-137 = "Как вы все прекрасно знаете, это место было запечатано больше ста лет..."
62080-139 = "С-Субару? Дверь... открыта...?"
62080-141 = "Что?! Значит, кто-то уже побывал здесь...?"
62080-142 = ""
62080-144 = ""
62080-145 = "Нет, всё в порядке. Даже лучше."
62080-146 = "Я слышала, что тот, кто откроет эту дверь, навеки заблудится в конце своего пути."
62080-147 = "...Кто-то любезно открыл её за нас, так что одной заботой меньше."
62080-149 = "Значит, мы правда..."
62080-150 = "...спустимся... туда?"
62080-152 = "..."
62080-153 = "Нет. Пойду только я."
62080-154 = "Там ведь может случиться что-нибудь страшное."
62080-156 = "...!"
62080-157 = "П-Поняла, Субару..."
62080-158 = "А что тогда делать нам...?"
62080-160 = "Организуйте здесь базу."
62080-162 = "Базу?"
62080-164 = "Да. Вы все этому обучались, так что не волнуйтесь."
62080-165 = "Но обязательно..."
62080-166 = "...будьте готовы отражать нападение и снаружи, и изнутри."
62080-168 = "Это...!"
62080-169 = "На случай, если с вами что-нибудь случится...?"
62080-171 = "Не заставляй меня повторять."
62080-173 = "А!!"
62080-174 = "П-Поняла!"
62080-175 = ""
62080-177 = ""
62080-178 = ""
62080-179 = "[ns] «Некоторые не слышали трубу?»"
62080-180 = "Да. Мы разделились на тех, кто слышал трубу..."
62080-181 = "..."
62080-182 = "...и тех, кто не слышал."
62080-183 = "Ты знаешь почему?"
62080-184 = "Не уверена... Я была среди тех, кто слышал..."
62080-185 = "..."
62080-186 = "А Субару — нет..."
62080-187 = "*всхлипывает*"
62080-188 = "П-Почему ты плачешь...?"
62080-189 = "Прости. Мне правда жаль... Просто..."
62080-190 = "Я и сама чувствовала, что вчера, должно быть, что-то произошло."
62080-191 = "И-Ик?!"
62080-192 = "Прости. Я вовсе не хочу на тебя давить."
62080-193 = "Но если тебе комфортно об этом говорить, можешь рассказать, что случилось?"
62080-194 = "Куда ушли остальные студенты? Почему только ты вернулась к Сенсею...?"
62080-195 = "И откуда ты знала, что они направились в Porta Pacis?"
62080-196 = "[s] «Ацуко, это...»"
62080-197 = "Хм?"
62080-198 = "..."
62080-199 = "Понятно. Значит, вы сказали, что подождёте, пока Майя сама не будет готова, Сенсей."
62080-201 = "Майя свернулась калачиком и затряслась как лист..."
62080-202 = "Все немного растерялись, не зная, что делать, а затем..."
62080-203 = ""
62080-204 = "Э-Эм... Думаю, можно... рассказать Сенсею, что случилось."
62080-205 = "Хиёри...?"
62080-206 = "Сао-Сао, тише."
62080-207 = "П-Прости. Я не очень хорошо умею разговаривать... Мне часто говорят, что я немного бестолковая... Хи-хи..."
62080-208 = "Но всё равно, я д-думаю, тебе пришлось пережить что-то очень тяжёлое... болезненное... и грустное..."
62080-209 = "Когда такое случается, помогает просто поговорить... Ну, выплеснуть всё кому-нибудь, понимаешь...?"
62080-210 = "Просто поговорить... с кем угодно...?"
62080-211 = "Д-Да! В этом случае — с Сенсеем... и с нами тоже. А! Но м-мы можем уйти, если тебе неловко! Я не хотела...!"
62080-212 = ""
62080-213 = "...Мы тоже можем отключиться."
62080-214 = "Да. Как тебе будет удобнее!"
62080-215 = ""
62080-216 = "Всё хорошо! Сенсею можно... правда можно доверять. По крайней мере, я доверяю."
62080-217 = "Что бы ты ни сказала, Сенсей всегда пытается помочь. Однажды мне даже купили лекарство для желудка... и журналы..."
62080-218 = "Я-Я не хочу сказать, что Сенсей волшебным образом решит все твои проблемы! Тебе самой тоже нужно понять, в ч-чём ты хороша..."
62080-219 = "...Хотя, возможно, за меня Сенсей действительно сделал почти всё..."
62080-220 = "Но всё равно! Мне говорили, именно так студент со временем учится стоять на собственных ногах..."
62080-221 = "Ух, я не умею нормально это объяснить... В-В общем! Когда случается что-то такое..."
62080-222 = "...если держать всё в себе и страдать в одиночку, станет только больнее."
62080-223 = "У-Студентам нашей школы особенно трудно с такими вещами — разговаривать, просить помощи... Я и сама всё ещё учусь этому..."
62080-224 = "П-Поэтому я подумала, что это может хоть немного помочь...! Хи-хи..."
62080-226 = "Хиёри..."
62080-227 = ""
62080-229 = ""
62080-230 = ""
62080-231 = ""
62080-232 = "Т-Так, нам теперь лучше выйти? Ну, знаешь, в мире полно вещей, которые было бы неловко рассказывать слишком многим людям."
62080-233 = "Да, пожалуй. Пройдёмся и осмотрим окрестности."
62080-234 = "Да. Давайте так и сделаем."
62080-236 = "П-Подождите!"
62080-238 = "Хм?"
62080-239 = "Д-Да...?"
62080-241 = "..."
62080-242 = "Я хочу. Рассказать всем..."
62080-244 = "...Не нужно себя заставлять..."
62080-245 = "Она наконец набралась смелости, так что всё должно быть нормально. Верно, Уи?"
62080-246 = "То есть я бы никогда..."
62080-247 = ""
62080-249 = ""
62080-250 = ""
62080-251 = "[ns] «Ты уверена?»"
62080-252 = "...Да."
62080-253 = "Думаю, я хочу услышать мнение всех... чтобы самой обрести решимость!"
62080-255 = "Майя медленно начала рассказывать о событиях прошлой ночи."
62080-256 = "...Мы все ошеломлённо молчали, боясь сказать что-нибудь не то."
62080-257 = ""
62080-258 = "..."
62080-259 = "..."
62080-260 = "..."
62080-261 = "У-Уааа! Уаааа!!"
62080-262 = ""
62080-264 = ""
62080-265 = ""
62080-266 = "Х-Хиёри? Если ты так разрыдаешься..."
62080-267 = "Это слишком! Это слишком грустно! Как можно слушать такую историю и не плакать?! УААА!!"
62080-268 = ""
62080-270 = ""
62080-271 = ""
62080-272 = ""
62080-274 = "Х-Х-Х-Хиёри?! Эм, если ты...!"
62080-275 = "Уаааааа!"
62080-276 = "Я-Я... тоже еле... сдерживалась... *шмыг*"
62080-277 = "ВОТ ИМЕННО ОБ ЭТОМ Я И ГОВОРЮ-У-У!!"
62080-278 = ""
62080-279 = "Ты очень добрая, Хиёри."
62080-280 = "Да... Всегда была. Мисаки?"
62080-281 = "Перестань. Н-Не смотри на меня."
62080-282 = "Фуфу. В такие моменты положено выплакаться от души."
62080-283 = "Я не плачу!"
62080-284 = ""
62080-285 = "[ns] «Спасибо, что поделилась с нами»."
62080-286 = "Н-Не за что. На самом деле это вам спасибо... всем, что выслушали меня..."
62080-287 = "Но мы снова возвращаемся к вопросу... Почему трубу услышали только некоторые из нас?"
62080-288 = "...У меня есть догадка. На основе всего, что мы узнали."
62080-289 = "Я нашла один общий фактор у каждой из двух групп."
62080-290 = "Какой...?"
62080-291 = "Их участие в занятиях Сенсея."
62080-292 = "Что? Н-Но мы ведь все ходили на эти занятия..."
62080-293 = "Но участие — не совсем то же самое, что присутствие. Можно прочитать слова на странице и не понять из них ни единого."
62080-294 = "...Снаружи есть люди, которые читают краткие пересказы книг, а потом говорят так, будто их мнение — закон и истина!"
62080-295 = "...А есть даже люди, которые думают, будто книги нужны только для украшения стен и полок...!"
62080-296 = "Вообще-то книга — это разговор между автором и читателем! Нельзя просто пробежаться глазами и решить, что вы нормально пообщались!"
62080-298 = "Имейте уважение! Уважайте книги! Уважайте их!!"
62080-300 = "Уи? Ты немного ушла от темы..."
62080-302 = "И-и-и?!"
62080-303 = "П-Прошу прощения. В общем... С чтением всё так же, как и с занятиями."
62080-304 = "Во-первых, учёба — это процесс принятия чего-то не своего, знаний, которых прежде у тебя не было."
62080-305 = "На занятии учитель передаёт тебе эти знания, чтобы затем ты могла взять их и продолжить учиться самостоятельно."
62080-306 = "Можно сколько угодно ходить на занятия, но если ты совсем не слушаешь..."
62080-307 = "...или забываешь всё сразу после возвращения домой, тогда какой вообще был смысл присутствовать?"
62080-308 = "А...!"
62080-309 = "Конечно, это лишь предположение. Но только ты можешь подтвердить или опровергнуть его."
62080-310 = "Насколько я понимаю, студенты, услышавшие звук трубы — знамение конца света..."
62080-311 = "...должны были быть теми, кто был более открыт к принятию чужих знаний и идей."
62080-312 = "Иными словами, студентами, которые меньше сопротивлялись новым взглядам, приходящим в Ариус извне."
62080-313 = "Что думаешь?"
62080-314 = "Ты права! Думаю, это имеет смысл! Уи, ты потрясающая!"
62080-315 = "Н-Ничего такого... Это всего лишь логическое предположение..."
62080-316 = "Сколько раз мне повторять, что на искренний комплимент нужно отвечать искренней благодарностью?"
62080-317 = "И-и-и?!"
62080-318 = "И-И если они были готовы смотреть на внешний мир и принимать его..."
62080-319 = "...то, скорее всего, у них уже начали возникать сомнения относительно самого Ариуса."
62080-320 = "...Знания и образование считаются одними из сильнейших стимулов личностного роста и перемен."
62080-321 = ""
62080-323 = ""
62080-324 = ""
62080-325 = "Если у них уже появляются сомнения, разве это не значит...?"
