[translation]
2601506-1 = "Уже Проходили"
2601506-2 = ""
2601506-3 = ""
2601506-4 = "[ns1] «Ичика, я всегда приму тебя!»\n[ns2] «Какой бы ты ни была!»"
2601506-7 = "...Что?"
2601506-8 = "Это дежавю? Или у меня амнезия?"
2601506-9 = "...Что вообще происходит?"
2601506-10 = "Вы разве не сказали в прошлый раз ровно то же самое, Сенсей?"
2601506-11 = "[s] «Да, сказал.»"
2601506-12 = "Эм, да. Ладно."
2601506-13 = "...Так что вы делаете?"
2601506-14 = "Я недостаточно ясно донесла свою мысль?"
2601506-15 = "...Нет, точно достаточно. Вы делаете это нарочно."
2601506-16 = "Послушайте, я просто шутила, когда говорила, что я опасный человек и всё такое."
2601506-17 = "Поэтому вам совсем не обязательно обращаться со мной как с проблемным студентом."
2601506-18 = "[s] «После той твоей выходки, правда...»"
2601506-19 = "...Тут мне, пожалуй, нечего возразить."
2601506-20 = "Я сама всё это спровоцировала, когда решила так себя повести."
2601506-21 = "Но я правда не хотела, чтобы всё так обернулось."
2601506-22 = ""
2601506-24 = ""
2601506-25 = "...?"
2601506-26 = "Но почему вы заговорили об этом именно сейчас?"
2601506-27 = "[s3] «Теперь я знаю, что ты не всегда образцовый студент.»\n[s4] «Так что больше не нужно ничего от меня скрывать.»"
2601506-30 = "Наверное..."
2601506-31 = "...в этом есть смысл?"
2601506-32 = "Эм... Хм-м-м."
2601506-33 = "Ха-ха. Странно."
2601506-34 = "Я пыталась полностью вас отговорить, а теперь вы только сильнее напираете."
2601506-35 = "А! Я не имела в виду ничего плохого."
2601506-36 = "Я просто хотела уточнить: я пыталась сказать, что вам не следует так вести себя и с другими студентами."
2601506-37 = "Однажды кто-нибудь всерьёз воспользуется вашей добротой."
2601506-38 = "Но... наверное, в каждой лжи есть доля правды, да?"
2601506-39 = "Ох, какая дилемма."
2601506-40 = "В конце концов, я не могу отрицать то, что вы уже увидели."
2601506-41 = "Я не тот образцовый студент, какой меня все считают."
2601506-42 = "[s5] «Я не это пытаюсь сказать, Ичика.»\n[s6] «Я просто хочу, чтобы рядом со мной ты могла немного расслабиться.»"
2601506-45 = "Вот именно об этом я и говорю..."
2601506-46 = "Эм... *вздыхает*"
2601506-47 = "Ладно. Я поняла."
2601506-48 = "Раз вы настаиваете."
2601506-49 = "Когда мы будем только вдвоём, я постараюсь быть собой."
2601506-50 = "Но заранее предупреждаю."
2601506-51 = ""
2601506-53 = ""
2601506-54 = ""
2601506-55 = "Вы сами на это подписались, Сенсей!"
