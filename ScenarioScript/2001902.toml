2001902-55 = "[s1] «Ну, эм... Такая сейчас мода, да?»\n[s2] «...Девушка-кролик?»"
2001902-56 = "Как я уже говорила, горничная — та, кто служит. Поэтому одежда горничной должна подходить для служения."
2001902-57 = "Как я уже говорила, горничная — та, кто служит. Поэтому одежда горничной должна подходить для служения."
