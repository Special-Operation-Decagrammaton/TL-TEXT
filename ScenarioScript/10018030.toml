[translation]
10018030-1 = "Эпизод 3; Это ещё не конец!"
10018030-2 = "*пыхтит* *пыхтит* ...! В-Вы вообще кто такие?!"
10018030-3 = "Позвольте ответить."
10018030-4 = "Мы паломники, а наши святыни — гастрономические крайности этого мира."
10018030-6 = "Не страшась никаких лишений и препятствий между нами и вкусной едой, мы — не кто иные, как Общество гурманов Геенны. Ешь или умри!"
10018030-7 = ""
10018030-9 = ""
10018030-11 = ""
10018030-12 = "Общество гурманов?! Серьёзно?!"
10018030-13 = "Те самые, что прыгнули в море огня ради попкорна?!"
10018030-15 = "?!"
10018030-17 = "Откуда вы услышали эту чушь?"
10018030-18 = "Они не прыгали в море огня — они оттуда вышли! Потому что уже съели всё, что было внутри."
10018030-19 = ""
10018030-22 = ""
10018030-24 = ""
10018030-25 = "Ходят слухи, что у одной из них вместо желудка чёрная дыра. Если слишком близко подойти к её рту, тебя засосёт внутрь."
10018030-27 = "?!"
10018030-29 = "И разве на них не лежит какое-то проклятие? Вроде рядом с ними невозможно закончить ни одну трапезу, потому что обязательно что-нибудь случается."
10018030-30 = ""
10018030-33 = ""
10018030-35 = "В-В любом случае!"
10018030-36 = "Что здесь делают эти демонические террористки из Общества гурманов?"
10018030-37 = "Демонические?! Террористки?!"
10018030-38 = "Мы просто ходим и едим вкусную еду! Пара взрывов тут и там в процессе неизбежна!"
10018030-39 = "Я слышала, насколько бесстыже Общество гурманов. Теперь вижу, что все слухи правдивы. Как страшно..."
10018030-40 = "Слушайте сюда! Вы не имеете права нам мешать!"
10018030-41 = "Точно! На нашей стороне сила договорного права!"
10018030-42 = "Владелица должна освободить помещение!"
10018030-43 = "Мы просто пришли дружески ей напомнить."
10018030-44 = "Ага! Мы просто хорошие соседи! Хотя мы вообще-то не соседи... то есть мы специально стараемся быть добрыми!"
10018030-46 = "Странно."
10018030-47 = "Не припоминаю, чтобы мои соседи носили шлемы и угрожали людям оружием."
10018030-48 = "М-Мы никому не угрожаем оружием! Мы просто угрожаем людям, пока держим оружие!"
10018030-49 = "Тогда почему банда гурманов в шлемах вмешивается в якобы договорный спор Няо Фудс?"
10018030-50 = "Значит, мы можем предположить, что между Няо Фудс и бандой гурманов в шлемах есть связь?"
10018030-51 = ""
10018030-53 = ""
10018030-54 = "Ч-Что-о-о? Да это же безумие..."
10018030-55 = "Н-Нам конец, если начальство об этом узнает!"
10018030-56 = "Ну, они не узнают, если не останется свидетелей."
10018030-57 = "Но свидетели есть... О! Теперь поняла. Ага! Никаких свидетелей!"
10018030-58 = "Ой, простите, должно быть, мы слишком сильно вас приложили, раз вы теперь совсем не способны ясно мыслить."
10018030-59 = "Минуту назад вы даже прикоснуться к нам не могли, откуда вдруг такая уверенность?"
10018030-60 = "Хе-хе-хе... Глупцы! Когда такие трусы, как мы, вдруг меняют отношение, для этого всегда есть веская причина!"
10018030-61 = "И что же вы имеете в виду?"
10018030-62 = "Хватит вопросов! Просто обернитесь и осознайте своё поражение!"
10018030-63 = ""
10018030-66 = ""
10018030-70 = ""
10018030-71 = "Что происходит? Зачем вы завалили нас экстренными вызовами?"
10018030-72 = "Хочу побыстрее с этим закончить, у меня встреча владельцев домашних камней, на которую я хочу попасть."
10018030-74 = "Подкрепление?"
10018030-75 = "Понятно. Как мило."
10018030-77 = "Теперь поняли?"
10018030-78 = "Никто не бросает вызов банде гурманов в шлемах и не уходит безнаказанным!"
10018030-80 = "Нет, не это..."
10018030-81 = "Теперь я понимаю лишь одно: вы ничем не лучше ресторана, где подают испорченную еду."
