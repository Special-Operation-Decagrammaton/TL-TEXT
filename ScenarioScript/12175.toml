[translation]
12175-2 = "Противник начал атаку!"
12175-3 = "Остановить их!! Сосредоточить все силы!!"
12175-4 = "Атака с севера и востока! На север отправить оборонный батальон Декаграмматона!"
12175-5 = "Есть, сэр!"
12175-6 = "К северу замечена небольшая группа бойцов!"
12175-7 = "Что?! Подкрепление из Абидоса?!"
12175-8 = "Отрицательно! Их всего трое, но они...!"
12175-10 = "..."
12175-11 = "Замечено подкрепление ЧВК Кайзер. Подразделение численностью примерно в батальон, мэм."
12175-12 = "Поняла. Готовьтесь."
12175-13 = "*вздох* Как я вообще здесь оказалась?"
12175-14 = "(...Почему меня опять в это втянули?)"
12175-15 = "У нас ещё осталась незаконченная работа. Быстро разберёмся и вернёмся."
12175-16 = "Глава префектов дала нам эту возможность вместо написания объяснительной. Так что поменьше жалоб."
12175-17 = "Мы остановим врага на месте. Ни один из них не приблизится к Сенсею."
12175-18 = ""
12175-20 = "Пойдёмте."
12175-23 = "Следующий эпизод;Не отпуская. Часть 1"
