[translation]
12175-2 = "Inimigos avistados, eles começaram a atacar!"
12175-3 = "Reúnam todas as tropas!"
12175-4 = "Chamem reforços do norte e do leste também, inclusive o batalhão anti-Decagrammaton do norte!!"
12175-5 = "Sim, senhor!"
12175-6 = "...?! Forças inimigas confirmadas ao norte, embora em pequeno número!"
12175-7 = "H-Hã, ao norte...?!"
12175-8 = "São três... A-Aquelas são...!"
12175-10 = "...Haah."
12175-11 = "Reforços da Kaiser PMC avistados. Do tamanho de um batalhão inteiro, Chefe."
12175-12 = "Entendido, preparem-se."
12175-13 = "Por que eu também estou aqui..."
12175-14 = "(A Iori tudo bem, mas por que até eu...)"
12175-15 = "Ainda temos trabalho do Comitê Disciplinar pendente, então vamos acabar com isso rápido."
12175-16 = "A Chefe teve a gentileza de aceitar isso no lugar do relatório de reflexão, então vamos parar de reclamar, tudo bem?"
12175-17 = "Vamos deter todo o exército aqui. Não deixaremos ninguém se aproximar do Sensei."
12175-20 = "Vamos."
12175-23 = "Próximo;O Que Mesmo Assim Não Deixamos Ir (1)"
