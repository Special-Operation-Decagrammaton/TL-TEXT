[translation]
204-1 = "Древние доктрины"
204-3 = ""
204-4 = ""
204-5 = "У возвышенного есть две стороны. Если на одной находится непостижимый Mystic, на другой непременно должен обитать необратимый Terror."
204-6 = "Как две стороны одной монеты, Terror и Mystic неразделимы."
204-7 = "Но так же, как подброшенная монета в каждый момент показывает лишь одну сторону, возвышенное может проявляться только одним способом за раз."
204-8 = "Terror или Mystic. Сущность их одинакова, но наблюдать мы можем лишь один аспект за раз."
204-9 = "А возвышенное... оказалось тем, чего мы не смогли понять. Проще говоря, мы, Гематрия, потерпели неудачу."
204-10 = "Мы не смогли достичь сущности Mystic, не говоря уже о том, чтобы завладеть ею."
204-12 = "Всё, на что нас хватило, — Terror, да и тот был лишь Mimesis."
204-13 = "Однако я сторонник симулякров. Различие между оригиналом и копией бессмысленно."
204-14 = ""
204-15 = "В итоге я пришёл к выводу, что возвышенное этого мира находится вне нашего контроля."
204-16 = "Некоторые мои коллеги вполне могут со мной не согласиться. Не моё дело вмешиваться."
204-17 = "К вопросу нужно подойти иначе."
204-18 = "Поэтому мы обратили внимание на древние доктрины, запечатанные под Тринити.#nОни отличаются от возвышенного, но содержащиеся в них Terror и Mystic в чём-то похожи. Теоретически..."
204-19 = "..."
204-20 = "Я вас утомляю? Простите, Сенсей."
204-21 = "Я лишь хотел рассказать вам о нашем небольшом успехе."
204-22 = "Потому что древние доктрины наконец обретут плоть, доказывая, что их воля может исполниться на земле, как на небесах."
204-23 = ""
204-24 = ""
204-25 = "Искусственный ангел, созданный нами, — божественное чудовище."
204-26 = "Позвольте представить. Это доктрина, направляющая Communio Sanctorum."
204-27 = "Его называют Иеронимусом — имя заимствовано из древних доктрин."
204-28 = "Считайте это провозглашением его пришествия. Возможно, немного авангардно, но художнику вроде меня это подходит, не так ли?"
204-29 = "«О, Congregatio de Causis Sanctorum, эти благословенные, с радостью последовавшие вашим учениям, наконец канонизированы и совершат чудеса в доказательство»."
204-30 = "Вот здесь вам следует поаплодировать, Сенсей."
