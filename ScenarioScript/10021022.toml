[translation]
10021022-2 = ""
10021022-3 = ""
10021022-4 = "Доступных последовательностей эвакуации: 1"
10021022-13 = "[ns] «(Ах…)»"
10021022-14 = "...!!!"
10021022-15 = "..."
10021022-16 = ""
10021022-19 = "[ns1] «(Неужели всё действительно закончится так?)»\n[ns2] «(Мы что-то упустили?)»"
10021022-24 = "[ns] «Что бы ни случилось... я обязан это сделать.»"
10021022-26 = "[ns3] «Я должен выполнить обязанности взрослого.»\n[ns4] «Я должен выполнить долг учителя.»"
10021022-32 = "Хрома вступила в контакт с хозяином Сундука!"
10021022-33 = "Неожиданно. Хрома отреагировала на их боль? Или..."
10021022-34 = "Нет. Невозможно. У них нет ни возвышенного, ни мистического, ни ужаса. У Хромы нет причин контактировать с настолько ничтожной сущностью."
10021022-36 = "Что происходит?"
10021022-37 = "Они станут Проводником Хромы вместо бога подземного мира?"
10021022-39 = "Не понимаю."
10021022-40 = "Не понимаю."
10021022-41 = "Не понимаю."
10021022-43 = "Не понимаю. Но если мы получим доступ к этому Сундуку, возможно, понимать и не понадобится."
10021022-44 = "Я сделаю тебя Проводником Хромы, как ты желаешь, хозяин Сундука."
10021022-46 = "Тебя будут звать Френапатес."
10021022-47 = "Но ты не будешь действовать по собственной воле. Проводник Хромы — лишь сосуд. Ты представляешь волю безымянных жрецов."
10021022-48 = "Мы хорошо используем силу Сундука."
10021022-50 = "Ты будешь сожалеть об этом решении вечность!"
10021022-51 = ""
10021022-56 = "[ns5] «Похоже, Френапатес хочет что-то сказать.»\n[ns6] «Почему он стал Проводником Хромы и пришёл сюда?»"
10021022-65 = "Сенсей, простите. Это моя вина."
10021022-66 = "Потому что я жила — потому что не смогла умереть..."
10021022-67 = "Всё из-за моей ошибки."
10021022-68 = ""
10021022-73 = "...Сенсей?"
10021022-74 = ""
10021022-77 = "Твоя жизнь важна. Не сожалей о том, что живёшь."
10021022-78 = ""
10021022-81 = "Нет ничего плохого в желании быть счастливой."
10021022-82 = ""
10021022-85 = "Ужасно думать, будто единственный способ прекратить страдания — смерть."
10021022-86 = ""
10021022-89 = "Ты родилась не для того, чтобы страдать."
10021022-90 = "И не должна."
10021022-91 = "Ни один ребёнок никогда не должен так себя чувствовать."
10021022-92 = ""
10021022-95 = "Если в твоём мире больше боли, чем счастья..."
10021022-96 = "Если ты хочешь, чтобы жизнь закончилась, лишь бы прекратить отчаяние..."
10021022-97 = "Если ты блуждаешь по миру с чувством, что тебе в нём нет места..."
10021022-98 = "Это не твоя вина."
10021022-99 = ""
10021022-102 = "Это вина мира, в котором ты живёшь, и людей, ответственных за него."
10021022-103 = "Ни один человек не должен нести на плечах вес всего мира... тем более ребёнок."
10021022-104 = ""
10021022-107 = "Сколько бы ужасных вещей ты ни сделала, сколько бы непростительных проступков ни совершила..."
10021022-108 = ""
10021022-111 = "Так быть НЕ должно."
10021022-112 = ""
10021022-115 = "Это не твоя ответственность."
10021022-116 = "Этот долг должен лежать на взрослых в твоей жизни."
10021022-117 = ""
10021022-126 = "Ч-Что...? Нет..."
10021022-127 = "Нет... Нет, нет, нет! Стой, стой, стой!"
10021022-128 = "Нет, Сенсей, нет!!!"
10021022-129 = "Нет, нет, нет, нет, нет, нет, нет, Сенсей!!!"
10021022-130 = ""
10021022-135 = "Не заблуждайся!"
10021022-136 = "Это не тот ребёнок, каким ты его считаешь!"
10021022-138 = "Это проявление Бога! Это мистика, ужас, возвышенное!"
10021022-139 = "Это свет, страх, абсолют. Это идея. Это сущность за пределами твоего понимания!"
10021022-140 = "Это символ, метафора, выраженная в мире воображения и проявленная в физическом мире!"
10021022-141 = "[ns] «(Нет.)»"
10021022-143 = "[ns7] «(Она настоящая.)» \n[ns8] «(Я это знаю.)»"
10021022-146 = "[ns9] «(Она любит велосипеды и тренировки.)»\n[ns10] «(Она сама делает маски для ограблений банков.)»\n[ns11] «(Она второкурсница Оперативной группы по взысканию долгов Абидоса, Сунаоками Широко.)»"
10021022-150 = "[ns] «Она просто страдающий ребёнок, и у меня есть сила это изменить.»"
10021022-151 = "Ты будешь сожалеть об этом решении вечность!"
10021022-152 = "[ns] «Может быть, но...»"
10021022-163 = "Это моя ответственность как взрослого. Мой долг как Сенсея. Я выполню обязанности взрослого. Выполню долг учителя."
10021022-164 = ""
10021022-167 = "Чего бы это ни стоило. Какими бы ни были последствия... Я это сделаю."
10021022-168 = ""
10021022-180 = "С-Сенсей...?"
10021022-181 = ""
10021022-185 = "Как пожелаете, Сенсей."
10021022-186 = "Даже если это приведёт к концу всех миров..."
10021022-187 = ""
10021022-192 = "[ns] Слушать Френапатеса."
10021022-194 = "Пожалуйста, позаботьтесь о моих учениках."
10021022-198 = "[ns] Ответить."
