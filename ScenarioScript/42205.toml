[translation]
42205-5 = "Hyaaaaah—!!"
42205-11 = "FOX 3, sua caloura acabou de sair correndo do nada, viu?"
42205-12 = "Avançar de cabeça mesmo sabendo que tem uma atiradora de elite... Que disposição, hein!"
42205-14 = "...Aquela idiota, o que diabos ela pretende?"
42205-15 = "Quer que eu atire?"
42205-16 = "Não, espera. Você disse que elas podem ter preparado contramedidas contra snipers, né?"
42205-17 = "Além disso... quem tem que enfrentar a vanguarda é a vanguarda."
42205-18 = "FOX 4, eu assumo aqui. Me dê apoio de retaguarda."
42205-20 = "Entendido."
42205-32 = "Nos encontramos de novo, \"senpai\"."
42205-34 = "...Quantas vezes eu já disse que, ao invadir território inimigo, você deve se esconder e entrar sem ser notada?"
42205-35 = "Ah... Parece que você precisa de treino extra!"
42205-44 = "Ao entrar no campo de visão do inimigo com a rota limitada, furtividade não serve para nada, e além disso..."
42205-45 = "A pistola calibre .45 que você usa, senpai, não consegue perfurar meu equipamento à prova de balas."
42205-47 = "Verdade. Aceitar levar alguns tiros para encurtar a distância foi uma boa decisão."
42205-48 = "Mas, agora, eu não sou o martelo, sou a bigorna."
42205-49 = "É melhor tomar cuidado com a nuca para não levar um tiro de sniper!"
42205-76 = "...Seu CQC melhorou bastante, hein."
42205-77 = "Entrar na minha guarda e usar a coronha em vez da arma secundária... Nada mal."
42205-78 = "Foi você quem me ensinou isso, senpai."
42205-79 = "Você nunca esquece o que aprende uma vez. Como esperado da aluna modelo que tirou nota máxima na prova escrita."
42205-80 = "É uma pena não podermos ficar juntas, sendo você uma caloura tão excelente..."
42205-81 = "Isso é o que eu deveria dizer."
42205-82 = "Mesmo que seja para reviver a SRT, não consigo acreditar que você escolheu ameaçar a segurança dos cidadãos, senpai."
42205-83 = "— A bigorna e o martelo não precisam pensar no que estão golpeando."
42205-84 = "Não pode hesitar quando apontar a arma!"
42205-88 = "(...Ótimo, vou ganhar tempo assim para fazê-la ficar sem munição e então—)"
42205-89 = "Ei, olha para cá—"
42205-94 = "Diga xis!"
42205-100 = "Argh...!"
42205-111 = "...Saki, você é séria demais."
42205-112 = "Tanto seus disparos quanto sua cobertura seguem o manual à risca,#nentão dá para prever seu próximo movimento como a palma da minha mão."
42205-113 = "É por ter tanta gente assim que dizem que não é fácil se tornar veterana."
42205-115 = "...Acha mesmo que já venceu?"
42205-116 = "Hã... Ainda tem alguma carta na manga?"
42205-117 = "Ah, por acaso... está esperando fogo de cobertura daquela atiradora tímida?"
42205-118 = "Ela até pode conseguir me ferir, mas vai ser difícil virar o jogo só com um disparo de precisão."
42205-119 = "Pelo contrário, se ela fizer isso, pode acabar levando um contra-tiro de sniper..."
42205-125 = "...Senpai, até que ponto você confia nas suas companheiras de esquadrão?"
42205-126 = "De onde veio isso?"
42205-127 = "Quando a nossa Miyu se esconde de verdade, ninguém consegue encontrá-la."
42205-128 = "Deixando CQB e táticas de combate próximo de lado, tenho certeza absoluta de que ela nunca erra um tiro de precisão."
42205-129 = "...Não está achando nada estranho?#nA essa altura, a Otogi-senpai já deveria ter dado fogo de cobertura."
42205-130 = "Ah, talvez— a nossa assassina já tenha dado um jeito na Otogi-senpai."
42205-132 = "...!"
42205-136 = "FOX 4, você está bem? FOX 4!"
42205-140 = "...Hm? Não aconteceu nada, ué?"
42205-141 = "Era para eu aguardar sem atirar caso elas tivessem contramedidas contra snipers, não era?"
42205-142 = "Que alívio, achei que a Otogi tivesse sido atingida..."
42205-151 = "Ah."
42205-155 = "Vou devolver as mesmas palavras que você me disse agora há pouco, senpai.#nNão hesite quando apontar a arma—"
42205-156 = "...Pelo visto, quem não conseguiu confiar na própria equipe até o fim foi você, senpai."
42205-164 = "FOX 3 fora de combate."
42205-165 = "Kurumi, não tentou se exibir demais na frente da caloura, não?#nPara ser derrubada tão fácil assim..."
42205-166 = "...Bom, fazer o quê.#nEu, como suporte, cuido dos alvos restantes, então."
42205-171 = "Drones chamariz posicionados. Contramedidas ECCM prontas...#nAssim não preciso me preocupar com contra-snipers."
42205-172 = "Pois bem.#nPor enquanto, acho que vou cuidar da vanguarda primeiro."
42205-173 = "...Pensando bem, onde será que está a atiradora do Esquadrão RABBIT?"
42205-180 = "Com licença... estou aqui..."
42205-181 = "U-Uah...?"
42205-186 = "D-Desde quando...?! Aliás, por que você está aqui...?!"
42205-188 = "É que... eu também estava procurando um ponto de tiro para dar cobertura..."
42205-189 = "Como você já estava aqui, senpai... fiquei esperando aqui atrás o momento certo para falar com você..."
42205-190 = "Mas... você parecia tão ocupada com várias coisas... que eu não consegui criar coragem para chamar..."
42205-191 = "Você nem se aproximou evitando meu campo de visão... ficou esperando atrás de mim esse tempo todo...?"
42205-192 = "Miyu, que garota assustadora..."
42205-194 = "No fim, ninguém nunca me nota mesmo... um dia eu vou acabar desaparecendo da memória de todo mundo..."
42205-195 = "Mas... eu acho bom ter essa característica."
42205-196 = "Graças a ninguém ter me notado... eu consegui ajudar todo mundo do esquadrão."
42205-200 = "...Me desculpe, senpai."
42205-206 = "E-Espera um pouco...!"
42205-212 = "...FOX 3 e FOX 4 fora de combate."
42205-213 = "Jamais imaginei que seríamos encurraladas até esse ponto pelas nossas calouras."
42205-214 = "Ainda bem que desativei o console de controle do elevador central com antecedência..."
42205-220 = "Ué, o que é isso? Não tem um único nó respondendo?"
42205-221 = "Não me diga que forçaram o modo offline?!"
42205-222 = "Desculpa, Moe-chan. Este elevador está fora de uso."
42205-223 = "É que já temos um compromisso marcado hoje."
42205-224 = "...Niko-senpai? Isso é coisa sua, né?"
42205-225 = "Eu conheço bem as suas habilidades de hacking, Moe-chan. Com tempo suficiente, você com certeza encontraria uma brecha de segurança neste console..."
42205-226 = "Então eu cortei fisicamente os cabos para impedir qualquer conexão externa. Desculpa."
42205-227 = "Usar um truque tão sujo desses..."
42205-228 = "...Não importa o que você tente, não vai conseguir abrir esta passagem para a sala de operações com hacking."
42205-229 = "Além disso... se ficarem aí, os reforços da Kaiser Security vão chegar."
42205-230 = "Pelo seu próprio bem, vá para casa com as outras calouras antes que isso aconteça."
42205-235 = "...Se o que você diz é verdade, então essa porta nunca vai abrir por meios eletrônicos, certo?"
42205-236 = "Hihihi... Perfeito. Era exatamente o que eu queria."
42205-241 = "Er, Moe-chan...? O que exatamente você está pensando em fazer...?"
42205-243 = "Uma porta reforçada que não abre por nada... ser arrombada à força com poder esmagador..."
42205-244 = "Vai ficar tudo em pedaços... Só de imaginar já me dá arrepios... Haa, haa..."
42205-245 = "Este elevador tem uma porta eletrônica, não dá para abrir por meios físicos, sabia?"
42205-246 = "Se meios físicos não funcionam... quer dizer que é só meter mais força até funcionar, né?"
42205-251 = "Porque explosivo aqui é o que não falta!"
42205-252 = "Vejamos... agora eu tenho uns dez blocos de uma libra de Semtex..."
42205-253 = "Vou colar tuuudo na porta e mandar pelos ares!"
42205-255 = "S-Se você usar tanto explosivo assim... até pode danificar a porta, mas..."
42205-256 = "Antes disso, vocês mesmas podem acabar sendo atingidas pela explosão?!"
42205-257 = "Relaxa! O pessoal do meu esquadrão já está acostumado com isso!"
42205-258 = "Mesmo acostumadas, tentar uma invasão colocando a si mesmas em perigo..."
42205-259 = "Pelo bom senso, isso é impossí—"
42205-272 = "Cof, cof... Abriu! ♪"
42205-274 = "Ah... Mais do que abrir..."
42205-275 = "O mais correto seria dizer que arrombamos à força, mas..."
42205-276 = "Eu disse que confiava em você para cuidar disso... mas não imaginei que fosse usar todo o nosso estoque de explosivo plástico aqui."
42205-278 = "Bom, acho que até a veterana da FOX nunca viu uma invasão tão maluca quanto essa."
42205-279 = "Quem diria que essa tendência da Moe de não temer a destruição seria útil num momento desses..."
42205-280 = "Que papo é esse, tá tirando onda comigo?"
42205-281 = "É um elogio, um elogio."
42205-285 = "...Bom trabalho, RABBIT 3."
42205-286 = "Bem, você também mandou bem lá, RABBIT 2."
42205-288 = "O acesso ao elevador está liberado, então vamos descer de rapel até a frente da sala de operações!"
42205-289 = "Pessoal, prendam os arneses nos cabos."
42205-296 = "Pois bem... continuamos a invasão!"
42205-303 = "Próximo;A Caverna de Carbanog (2)"
