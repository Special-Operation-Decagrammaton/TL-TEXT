[translation]
42205-5 = "В АТАКУ!"
42205-6 = ""
42205-11 = "...FOX 3. Кажется, это твоя младшая носится там как курица без головы."
42205-12 = "Ха-ха-ха! Она правда просто бежит по открытому месту, зная, что я здесь! И вправду твоя уменьшенная копия."
42205-14 = "...Даже я на первом курсе не была настолько тупой!"
42205-15 = "Я её вижу. Хочешь, преподам ей небольшой урок?"
42205-16 = "Погоди. FOX 1 сказала, что они заранее учтут твоё присутствие и подготовят способ с тобой справиться."
42205-17 = "А я, пожалуй, сама немного поговорю со своей младшей — штурмовик со штурмовиком."
42205-18 = "Просто прикрой меня, FOX 4."
42205-20 = "Принято."
42205-21 = ""
42205-23 = ""
42205-32 = "О, какое совпадение. Часто сюда заходишь?"
42205-34 = "...Сколько раз я тебе говорила? На вражеской территории не высовывайся. Информация — твоё лучшее оружие на поле боя, а ты только что сама отдала её нам."
42205-35 = "Похоже, тебе нужен повторный курс, Саки!"
42205-36 = ""
42205-44 = "Ага, конечно, я собиралась тайком красться по этому узкому коридору, зная, что вы следите за каждым сантиметром."
42205-45 = "Я лучше рискну против твоего пистолета .45 калибра, чем против снайперского огня Отоги."
42205-47 = "Ладно, справедливо. Тебе всё равно нужно было как-то сократить дистанцию."
42205-48 = "Но сегодня я щит нашего отряда. Посмотрим, кто из нас лучший штурмовик, Саки."
42205-49 = "Только не дай застать себя врасплох!"
42205-50 = ""
42205-53 = ""
42205-65 = ""
42205-67 = ""
42205-76 = "...Твои навыки ближнего боя сильно выросли за короткое время."
42205-77 = "Умный ход — использовать приклад вместо того, чтобы доставать вторичное оружие, пока уклоняешься от атак."
42205-78 = "Ага... Одна моя старшая когда-то меня этому научила."
42205-79 = "Записала все мои уроки, да? В учёбе тебя действительно никто не мог превзойти."
42205-80 = "Немного жаль прощаться с таким перспективным студентом."
42205-81 = "А мне не жаль. Ты меня уже достаточно разочаровала."
42205-82 = "Как ты могла, Куруми? Возрождение SRT ничего не значит, если оно построено на крови гражданских, которых мы должны защищать!"
42205-83 = "...Инструменты не задаются вопросами о намерениях того, кто ими пользуется."
42205-84 = "Ты в бою, сосредоточься! Если направляешь на кого-то оружие, будь готова выстрелить."
42205-85 = ""
42205-88 = "(Мне не нужно вступать с ней в прямой бой... Буду держать дистанцию и заставлю её потратить как можно больше боеприпасов.)"
42205-89 = "Эй, Саки! Посмотри сюда, пожалуйста!"
42205-90 = ""
42205-92 = ""
42205-94 = "Сы-ы-ыр!"
42205-95 = ""
42205-100 = "Серьёзно?!"
42205-101 = ""
42205-110 = ""
42205-111 = "Ты слишком честная, Саки..."
42205-112 = "Каждое движение, каждая стойка — всё как по учебнику. Тебя слишком легко читать."
42205-113 = "Некоторые люди просто по характеру не подходят для такой работы."
42205-115 = "Кажется, у тебя обо мне неправильное впечатление."
42205-116 = "Беспочвенная уверенность тебе не идёт, Саки. С чего ты решила, что можешь..."
42205-117 = "А. Т-Т-Твоя зелёная снайперша? Она вас всех спасёт?"
42205-118 = "Максимум один удачный выстрел."
42205-119 = "Она, может, и попадёт в меня этим одним выстрелом, но Отоги найдёт и снимет её раньше, чем ты успеешь сказать «кролик»."
42205-120 = ""
42205-122 = ""
42205-124 = ""
42205-125 = "Похоже, ты очень доверяешь своим товарищам по отряду, да?"
42205-126 = "К чему ты клонишь?"
42205-127 = "Я бы не стала недооценивать нашего снайпера."
42205-128 = "Конечно, в рукопашной она, наверное, не победит. И тебе она может казаться слабой или робкой, но она лучший чёртов снайпер во всём Кивотосе."
42205-129 = "Хм... Теперь, когда думаю об этом, почему Отоги до сих пор не прикрыла тебя огнём? Это на неё не похоже..."
42205-130 = "Кстати, Мию всегда занимала первое место по проникновению и скрытности. Каждый. Чёртов. Раз."
42205-132 = "...!"
42205-133 = ""
42205-135 = ""
42205-136 = "FOX 4, ответь! FOX 4!"
42205-137 = ""
42205-139 = ""
42205-140 = "Что такое? Я просто отдыхаю."
42205-141 = "Ты ведь сказала мне не стрелять, разве нет?"
42205-142 = "Я должна была убедиться. На секунду мне показалось..."
42205-143 = ""
42205-151 = "О."
42205-152 = ""
42205-154 = ""
42205-155 = "Что ты там говорила... А, точно. Если направляешь на кого-то оружие, будь готова выстрелить."
42205-156 = "Похоже, связи в отряде FOX не такие уж крепкие, как принято говорить, да?"
42205-157 = ""
42205-159 = ""
42205-164 = "FOX 3 выведена из строя."
42205-165 = "Куруми слишком старается выглядеть крутой перед кроликами. И каждый раз это выходит ей боком..."
42205-166 = "Ну что ж. Похоже, уборка опять на мне!"
42205-167 = ""
42205-169 = ""
42205-170 = ""
42205-171 = "Дрон-приманка развёрнут. Подготовка ECCM — готово. Ни один снайпер не подкрадётся к этой девочке."
42205-172 = "Ну а теперь... Где там эта безумная мелкая штурмовичка..."
42205-173 = "Хм... Давно ничего не видела и не слышала о снайпере RABBIT..."
42205-174 = ""
42205-176 = ""
42205-178 = ""
42205-179 = ""
42205-180 = "Н-Ну... Вообще-то я прямо здесь..."
42205-181 = "Ч-Ч-Что за—"
42205-182 = ""
42205-185 = ""
42205-186 = "С каких пор? Как?!"
42205-188 = "Я... вообще-то тоже поднялась сюда, чтобы найти позицию..."
42205-189 = "Но когда пришла, вы уже б-были здесь..."
42205-190 = "Я пыталась придумать, как сказать, что я здесь, но вы выглядели такой сосредоточенной..."
42205-191 = "Одно дело, если бы ты как-то незаметно сюда прокралась... Но ты просто... стояла у меня за спиной? И я тебя не заметила?"
42205-192 = "Ты призрак? Тебе нужно, чтобы кто-то исполнил твоё последнее желание, и тогда ты сможешь уйти в иной мир?"
42205-194 = "Я часто просто растворяюсь на фоне... Наверное, однажды даже товарищи по отряду перестанут замечать, есть я рядом или нет... Вообще-то один раз уже так было... прямо посреди задания..."
42205-195 = "Но... иногда это даже хорошо."
42205-196 = "Иногда благодаря этому я могу быть полезной своим товарищам. Вот так..."
42205-197 = ""
42205-199 = ""
42205-200 = "М-Мне правда очень жаль."
42205-201 = ""
42205-203 = ""
42205-205 = ""
42205-206 = "Д-Д-Давай поговорим об этом!"
42205-207 = ""
42205-212 = "...FOX 3 и 4 выведены из строя."
42205-213 = "Не ожидала, что они окажут настолько серьёзное сопротивление..."
42205-214 = "Отключить управление центральным лифтом было правильным решением."
42205-215 = ""
42205-217 = ""
42205-219 = ""
42205-220 = "Не могу поймать сигнал..."
42205-221 = "Она... Она что, чёртову систему просто выключила?!"
42205-222 = "Хи-хи. Похоже, она не работает."
42205-223 = "В конце концов, хороший план операции учитывает неожиданности!"
42205-224 = "...Нико? Это ведь твоих рук дело, да?"
42205-225 = "Если есть время, можно пробраться мимо любой системы безопасности."
42205-226 = "Я решила, что лучшая защита — остановить тебя прежде, чем ты вообще сможешь попробовать. Хи-хи."
42205-227 = "Это уже просто... хитро."
42205-228 = "Это единственный путь к операционной, и впервые ты не можешь решить проблему взломом."
42205-229 = "Что будешь делать, Моэ? Чем дольше ты здесь тянешь время, тем ближе подкрепление «Кайзера»."
42205-230 = "Иными словами, моим милым младшим пора домой."
42205-231 = ""
42205-234 = ""
42205-235 = "То есть электронным способом никак?"
42205-236 = "Хи-хи-хи! Тебе не хватает хитрости, Нико. Ты зациклилась на моих компьютерных навыках и забыла остальную часть моего досье!"
42205-237 = ""
42205-240 = ""
42205-241 = "Можешь блефовать сколько угодно, Моэ. Ты никак не пройдёшь."
42205-243 = "Пробить упрямую дверь? Заставить армированный материал подчиниться моей воле?"
42205-244 = "От одной мысли аж мурашки... *пых* *пых*"
42205-245 = "Не знаю, что ты задумала, но двери полностью электронные. Без питания ты никак их не откроешь силой."
42205-246 = "Если что-то не взорвалось с первого раза — взорви ещё раз! И ещё! И ещё! Ха-ха-ха!"
42205-247 = ""
42205-249 = ""
42205-251 = "Я не смогу пробиться? Мои малышки не смогут взорвать одну жалкую дверь?!"
42205-252 = "Начинаем! У меня десять фунтов семтекса..."
42205-253 = "Хи-хи-хи. Я никогда не взрывала столько семтекса за раз! Сейчас будет шоу!"
42205-255 = "Эй-эй-эй! Это разнесёт не только дверь!"
42205-256 = "Заденет всё и всех вокруг!"
42205-257 = "Пф, моя команда крепкая. Переживут."
42205-258 = "Ты точно блефуешь. Не может быть, чтобы ты решилась на такой рискованный манёвр здесь!"
42205-259 = "Это совершенно нелогично—"
42205-260 = ""
42205-269 = ""
42205-270 = ""
42205-272 = "*кашляет* *кашляет* Бум! Динамит сработал!"
42205-274 = "Для простого открытия двери мы слегка переборщили..."
42205-275 = "«Аннигилировали» будет точнее..."
42205-276 = "Я дала ей полную свободу, так что, наверное, должна была это предвидеть..."
42205-278 = "Ну, если уж МЫ удивлены, представьте, что сейчас чувствует отряд FOX."
42205-279 = "Пожалуй, неудержимая тяга Моэ к хаосу и разрушению иногда бывает полезна..."
42205-280 = "Ты серьёзно язвишь той, кто только что в одиночку спасла всю операцию?"
42205-281 = "Я в хорошем смысле, ладно?"
42205-282 = ""
42205-284 = ""
42205-285 = "Серьёзно, хорошая работа."
42205-286 = "Ты тоже отлично справилась, RABBIT 2."
42205-288 = "Лифт чист. Спускаюсь по тросу в операционную!"
42205-289 = "Закрепляйтесь на тросе и следуйте за мной!"
42205-290 = ""
42205-292 = ""
42205-295 = ""
42205-296 = "Входим!"
42205-297 = ""
42205-303 = "Следующий эпизод; Пещера Каэрбаннога 2"
