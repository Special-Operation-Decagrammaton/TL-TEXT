[translation]
1014303-1 = "Summer. A Side of You I Don't Usually See."
1014303-2 = "Hello! Sensei!!!"
1014303-3 = "[ns] \"......\""
1014303-4 = "Is something wrong?"
1014303-5 = "[s] \"That \"side I don't usually see\" thing...\""
1014303-6 = "Ehehe. That's right. I'm not wrong, am I?"
1014303-7 = "[s] \"I suppose that's true, but...\""
1014303-8 = "Come on, let's go have some fun!"
1014303-9 = "Time is precious, you know!"
1014303-11 = "（Pulled by Shunling's hand, I headed toward the ropeway station...）"
1014303-15 = "Look! The buildings look like toys!"
1014303-16 = "That mountain has such a strange shape...!"
1014303-17 = "There are so many Kounoki trees growing around here!"
1014303-18 = "[s] \"By the way... is your body alright?\""
1014303-19 = "Oh... you mean the \"rejuvenation potion\", right?"
1014303-20 = "According to the Eastern Alchemy Society, it's become safer than it was before."
1014303-21 = "They say there are times when it's unstable, but there's no problem with my body."
1014303-22 = "[ns] （When it's unstable...?）"
1014303-23 = "Um, is something wrong? #nCould it be... that you don't want to... play with \"Shunling\"?"
1014303-24 = "[ns] \"No way! That's not true at all!\""
1014303-25 = "That a relief. ...I was worried that you might have started to hate me."
1014303-26 = "Huh? that never going to happened..."
1014303-27 = "..."
1014303-28 = "Ehehe, thank you!"
1014303-29 = "Oh, it looks like we've arrived!"
1014303-30 = "The thing I wanted to do with you today, Sensei, is..."
1014303-31 = "Rafting!"
1014303-36 = "Welcome, and thank you for coming today!"
1014303-37 = "Rafting is fun, but it also comes with dangers."
1014303-38 = "Rest assured. I will be riding in the boat as well."
1014303-39 = "Safety first, safety second, there is no third or fourth, and safety fifth."
1014303-41 = "If you happen to fall out of the boat—"
1014303-43 = "Everyone, do you have your paddles? Then let's set off!"
1014303-44 = "Waaaah!!!"
1014303-45 = "[s] \"The water is really cold!\""
1014303-46 = "Yes! But my body is getting hot from rowing, it feels really good!"
1014303-47 = "Yes, one, two, one, two!"
1014303-48 = "—One, two!"
1014303-49 = "[s] \"One, two!!\""
1014303-51 = "（I started rowing according to the guide's instructions!）"
1014303-62 = "Oh, Sensei! Look!"
1014303-63 = "We're going to go down those rapids, aren't we!"
1014303-64 = "This is the first big point! Watch out for the rocks!"
1014303-69 = "Kyaaa!!!"
1014303-72 = "（The boat rose to a decent height!）"
1014303-73 = "（The river water surged, and we got completely soaked!）"
1014303-75 = "On the right side, there's a rock with a big hole in it, you see?"
1014303-76 = "It's called \"Water Buffalo Rock\" because it looks like a water buffalo."
1014303-77 = "Oh, it really does look like a water buffalo!"
1014303-78 = "They say the big hole was made a long time ago when a general fired a#ncannon at it."
1014303-79 = "That’s quite a large shell, isn't it..."
1014303-82 = "30 minutes have passed! Let's take a short break around here!"
1014303-83 = "Um, what should I do during the break?"
1014303-84 = "You can swim, float in the water, or just rest on the boat like this... #nYou can do whatever you like."
1014303-89 = "That's what they said, Sensei! Let's swim together!"
1014303-90 = "[s1] \"Sorry... I'm going to take a little break...\"\n[s2] \"But in return, I'll take a picture of you swimming, Shunling.\""
1014303-93 = "You're going to take a picture of me...?"
1014303-97 = "Understood! I'm counting on you!"
1014303-102 = "Please treasure the photo forever and ever, okay?"
1014303-103 = "[s3] \"...?\"\n[s4] \"U-Um, sure?\""
1014303-106 = "Ehehe!"
1014303-109 = "（Shunling jumps into the water and starts swimming happily）"
1014303-111 = "Sensei! Now is the time!"
1014303-118 = "Okay! Say cheese!"
1014303-126 = "How about this one...?"
1014303-127 = "[ns] \"?!?!\""
1014303-129 = "We're entering the rough rapids from here! Stay sharp!"
1014303-130 = "We'll go up high and then... drop down hard!"
1014303-135 = "W-wow... my heart is pounding...!"
1014303-136 = "[s] \"Let's not let our guard down...!\""
1014303-137 = "Yes!"
1014303-138 = "...It's finally time!"
1014303-142 = "Ahahaha!"
1014303-143 = "That's amazing!"
1014303-148 = "Whoa!?"
1014303-152 = "[ns] \"Look out!\""
1014303-164 = "Keep holding on tight just like that!"
1014303-165 = "H-hold on tight, the guide said."
1014303-166 = "Ehehe... you can't let go of my hand, okay?"
1014303-167 = "..."
1014303-168 = "Sensei's chest is so warm... and big..."
1014303-169 = "It makes me feel so safe."
1014303-170 = "[s] \"Y-yeah...\""
1014303-173 = "That's all for today's rafting!"
1014303-174 = "Thank you!"
1014303-175 = "[s] \"Thank you very much!\""
1014303-176 = "Please continue to enjoy your sightseeing!"
1014303-181 = "Sensei, Sensei! What should we do next?"
1014303-182 = "Well, let's see... it's starting to get a little cold, so..."
1014303-183 = "I want to eat something warm!"
1014303-187 = "Oh, Sensei! That looks delicious!"
1014303-188 = "Meat and veggie skewers... I can already smell the spices wafting over here…!"
1014303-190 = "That is... rice noodles! #nThe rice noodles in this region are famous for being packed with peanuts."
1014303-191 = "Should we order one and share it?"
1014303-193 = "Sensei! Next, I want to eat something cold and sweet!"
1014303-194 = "I heard the fruit shaved ice here is delicious! #nThey say you can even add toppings like red beans, mung beans, and jelly!"
1014303-196 = "（And so, I \"completely conquered\" the shopping district together with Shunling）"
1014303-197 = "（We looked at each other's full bellies and couldn't help but laugh）"
1014303-199 = "Phew... I think I ate a little too much. My body is starting to feel hot."
1014303-200 = "But I don't have the energy to swim anymore..."
1014303-201 = "..."
1014303-202 = "Um, Sensei."
1014303-203 = "[s] \"What is it?\""
1014303-204 = "Thank you for spoling me today."
1014303-205 = "[s5] \"It's no trouble at all.\"\n[s6] \"You can always rely on me.\""
1014303-208 = "..."
1014303-209 = "I really love you, Sensei!"
1014303-212 = "（Shunling sits down in a clear puddle by the water's edge and begins to play#nhappily）"
1014303-213 = "（As I watch her, feeling a bit dazed...）"
1014303-217 = "W-waaaa!?"
1014303-218 = "[ns] \"Hmm...? Wh-what's wrong!?!\""
1014303-222 = "[wa:2020]― [log=슌 수영복]Eek,[wa:600] kyaaa!?[/log]"
1014303-225 = "― [log=슌 수영복]S-[wa:278]Sensei!?[/log]"
1014303-227 = "― [log=슌 수영복]This is,[wa:630] um...![/log]"
1014303-230 = "[wa:1210]― [log=슌 수영복]C-[wa:350]come to think of it....[/log]"
1014303-232 = "― [log=슌 수영복]Saya-san did say it might become a bit unstable, but...[wa:3000]c-could it be...?[/log]"
1014303-235 = "[ns] \"I-I'm sorry!\""
1014303-236 = "[wa:880]― [log=슌 수영복]S-[wa:440]Sensei, there is no need for you to apologize...![/log]"
1014303-238 = "― [log=슌 수영복]I-[wa:380]I mean...[wa:970] um...[wa:1280] well.[/log]"
1014303-241 = "― [log=슌 수영복]W-[wa:470]what should I do...![/log]"
1014303-244 = "[ns] \"A-Alright… I’m heading over there!\""
1014303-245 = "[wa:660]― [log=슌 수영복]No![/log]"
1014303-248 = "― [log=슌 수영복]Th-[wa:260]that...![/log]"
1014303-251 = "― [log=슌 수영복]Could you please just stand there?[/log]"
1014303-253 = "― [log=슌 수영복]I'm going to hide....[/log]"
1014303-256 = "[wa:2260]― [log=슌 수영복]I...[wa:1550] I'll be fine,[wa:880] really.[/log]"
1014303-259 = "― [log=슌 수영복]Sensei,[wa:750] if that's the case...[/log]"
1014303-261 = "― [log=슌 수영복]We could stay like this[wa:1000] for a little longer,[wa:1000] I guess...[/log]"
1014303-264 = "（While keeping an eye on our surroundings, I managed to bring Shun's#nswimsuit...）"
1014303-266 = "..."
1014303-267 = "[s] \"......\""
1014303-268 = "S-say something... please..."
1014303-269 = "[s] \"Wh-what am I supposed to say...?\""
1014303-270 = "..."
1014303-271 = "I-I don't know either..."
1014303-273 = "（Perhaps because she was very embarrassed）"
1014303-274 = "（After that, Shun was quieter than usual...）"