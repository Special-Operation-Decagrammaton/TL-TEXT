[translation]
22210-1 = "Episódio 21;O Que Esse Nome Significa."
22210-2 = "[ns] \"Neru! Conto com você!\""
22210-4 = "...Seja qual for o ataque, nada surtirá efeito contra o meu \"Armamento\"."
22210-5 = "Ferida desse jeito, qualquer resistência a mais é inútil!"
22210-6 = "...Hã,"
22210-7 = "E eu lá me importo com isso?"
22210-8 = "Eu já me decidi."
22210-9 = "Vou acabar com você aqui mesmo e..."
22210-11 = "Não tô a fim de deixar pontas soltas."
22210-12 = "Sendo assim, ir salvar a pirralha —"
22210-13 = "não vai ser tarde demais mesmo \"depois\" que eu acabar com você."
22210-15 = "E ir trazer a pirralha de volta!"
22210-16 = "Bora lá, calouras!#nÉ a nossa revanche!"
22210-17 = "Asuna!!"
22210-18 = "...?!"
22210-19 = "Tô aqui!#nAhaha! Ao ataqueee!"
22210-23 = "Um ataque desses..."
22210-33 = "...?! Ela desviou de tudo...?!"
22210-34 = "Sim!#nTipo um instinto selvagem, sabe?"
22210-35 = "Karin."
22210-39 = "Um disparo... de fora do meu campo de visão!"
22210-44 = "Não vou cair por tão pouco —"
22210-56 = "...Akane! Vamos avançar com tudo! Detona logo isso!"
22210-57 = "Sim, Líder!"
22210-67 = "Destruir a porta para invadir o interior da torre...?"
22210-68 = "Mas como exatamente...?"
22210-70 = "...Isso não é tão simples quanto parece..."
22210-71 = "É verdade. Mais do que simples..."
22210-72 = "Ahaha!#nChamar isso de plano não é meio doido demais?"
22210-74 = "V-verdade... Acho melhor esquecermos o que eu disse..."
22210-75 = "Não, vamos nessa."
22210-76 = "V-você vai mesmo seguir esse plano?!"
22210-78 = "...Tem certeza disso?#nO que falamos agora há pouco ainda é só uma hipótese."
22210-79 = "Ha, eu sei muito bem disso.#nMas esse plano veio de ninguém menos que a \"Testuda\"."
22210-80 = "T-Testuda...?"
22210-81 = "Essa garota, não importa o quanto esteja encurralada, nunca amarela e mostra coragem quando é pelos amigos."
22210-82 = "Como é que eu não ia gostar de um plano vindo de alguém assim?"
22210-83 = "Neru-senpai conhece a Yuzu super bem, né! Quando foi que vocês ficaram tão próximas?"
22210-84 = "Será que... é porque você sempre joga um monte contra a Yuzu?"
22210-85 = "Por que diabos esse assunto surgiu agora?!"
22210-86 = "Entendo a sua intenção. Porém, Líder, com esses ferimentos..."
22210-87 = "Hã? O que tá falando? Se eu não fizer loucura agora, vou fazer quando?#nTenho que corresponder às expectativas que esse pessoal colocou em mim."
22210-88 = "Com um pouco de raça a gente dá conta disso fácil."
22210-89 = "— E quanto a vocês? Não tô obrigando ninguém a ajudar."
22210-90 = "Nós..."
22210-91 = "...Não tem jeito. Se é a decisão da líder."
22210-92 = "Sim! Se a Líder decidiu, eu tô dentro!"
22210-94 = "...Mas vai ficar tudo bem mesmo? Executar esse plano só com a C&C..."
22210-95 = "Sim. Se a Líder decidiu assim, tudo o que nos resta é segui-la."
22210-96 = "...Além disso, se tivermos que lutar de novo, os planos desta vez serão um pouco diferentes da última."
22210-97 = "[s] \"Se todo mundo concorda... entendi.\""
22210-98 = "...Então todos concordaram com o plano, certo?"
22210-99 = "Encontrei um local adequado para executar a operação..."
22210-100 = "Iniciando a navegação — vamos lá!"
22210-120 = "[ns] \"Sigam em frente... o alvo está bem na nossa frente!\""
22210-123 = "(Imprudente.)"
22210-124 = "(Essa definitivamente não é uma escolha racional.)"
22210-125 = "(Não só a C&C, mas até o Sensei da Schale já perdeu uma vez para o \"Armamento\" da Toki.#nEsse é um fato imutável.)"
22210-126 = "(Portanto, pensando de forma racional...#nNaturalmente, a próxima estratégia não seria um ataque frontal, mas uma abordagem indireta.)"
22210-127 = "(Porém, e se... esse for um plano elaborado pelo Sensei [USERNAME] da Schale...?)"
22210-131 = "Toki! Autorizo o uso do canhão principal!"
22210-132 = "Sim, senhora."
22210-136 = "A energia está se concentrando na torre central! Pessoal, cuidado —"
22210-147 = "[ns1] \"Aquilo agora há pouco... era um laser...?\"\n[ns2] \"Eles ainda estavam... escondendo algo assim...?\""
22210-153 = "(O que foi aquilo agora há pouco...?)"
22210-154 = "(Não foi uma decisão baseada em probabilidade de vitória ou dados...)"
22210-155 = "(Tive um mau pressentimento... e mudei minha decisão apenas por esse motivo...?)"
22210-156 = "(Impossível... Eu jamais faria uma escolha tão irracional...#nFoi apenas uma impressão equivocada.)"
22210-157 = "[s] \"...Rio.\""
22210-158 = "...Acabou por aqui."
22210-159 = "O resultado confirmado pelo \"Armamento\" —#nNinguém pode reverter um futuro calculado por dados."
22210-160 = "Sensei da Schale... Você já deveria ter entendido no momento em que perdeu para o \"Armamento\".#nQue a probabilidade de nos vencer é zero."
22210-161 = "E, mesmo assim, por que veio nos desafiar...? Não consigo compreender."
22210-162 = "Se acreditou ter encontrado alguma chance mínima de vitória,#nisso é uma atitude inútil e extremamente irracional."
22210-163 = "Se submeteu uma aluna coberta de ferimentos a isso por causa de uma ilusão tão insignificante..."
22210-164 = "...Estou profundamente decepcionada."
22210-165 = "[s] \"Isso é...\""
22210-166 = "O Sensei não deu esse tipo de ordem."
22210-167 = "Akane?"
22210-168 = "Não, antes de tudo, precisamos corrigir essa sua percepção desde o início."
22210-169 = "Nós não lutamos por acreditar em taxas de vitória ou em dados."
22210-170 = "...O quê?"
22210-173 = "Líder."
22210-174 = "Hã? Que foi, Akane?"
22210-175 = "Como eu já disse antes,#na probabilidade de sucesso do plano que a Chihiro-san mencionou é extremamente baixa."
22210-176 = "E ainda assim, nesse estado..."
22210-177 = "Tô nem aí."
22210-178 = "Taxa de vitória, probabilidade... não dou a mínima pra essas frescuras."
22210-179 = "Se eu deixar isso com você ou com o Sensei, a gente dá um jeito."
22210-181 = "O que importa é \"queremos salvar a pirralha ou não\", não é?"
22210-185 = "...Fufu."
22210-186 = "Como eu já vinha pensando há algum tempo... a senhora mudou um pouco, Líder."
22210-187 = "...Com certeza, foi..."
22210-188 = "Aos poucos... desde aquele dia em que conheceu aquelas meninas."
22210-192 = "Ainda assim... partir em uma aventura para resgatar uma amiga sequestrada."
22210-193 = "Nós parecemos até..."
22210-194 = "— Protagonistas de um jogo, não é?"
22210-196 = "Querer salvar uma amiga querida... Sim, é apenas isso."
22210-197 = "..."
22210-198 = "Ah, a propósito, Presidente Rio.#nNão me diga que se esqueceu?"
22210-199 = "— Do outro nome da Neru-senpai."
22210-200 = "Codinome: Double O."
22210-201 = "O \"Símbolo da Vitória Garantida\" da nossa Millennium."
22210-202 = "...?!"
22210-208 = "Te peguei."
22210-210 = "Como consegue se mover mesmo depois de levar o canhão principal de frente...?!"
22210-211 = "Azar o seu, eu levei um parecido com esse outro dia mesmo!"
22210-215 = "Hackeei o elevador de carga da torre central!"
22210-216 = "[ns] \"Neru!! Agora!\""
22210-223 = "O elevador...?#nNão me diga que o destino delas era...?!"
22210-225 = "F-foi uma ideia que a Momoi teve antes, mas..."
22210-226 = "Eh?! Eu?!"
22210-227 = "Se a gente usar o elevador... talvez..."
22210-229 = "...!!!"
22210-230 = "A falha do \"Armamento\"...!#nNão pode ser, dessa forma...?!"
22210-232 = "Toki! Saia daí agora!! Elas vão...!"
22210-233 = "Elas pretendem usar o elevador para paralisar o sistema de evasão do \"Armamento\"!!"
22210-234 = "Tarde demais."
22210-240 = "Eu já não te disse antes?"
22210-242 = "Não existe ninguém em toda Kivotos capaz de vencer entrando no meu alcance."
22210-245 = "..."
22210-246 = "Ah... não cheguei a dizer isso pra você?#nBom, tanto faz."
22210-251 = "Acelera!"
22210-252 = "Aumenta a aceleração gravitacional em 10 vezes!!"
22210-261 = "...Sistema de evasão paralisado."
22210-262 = "...Muito bem, então."
22210-263 = "Agora você não pode mais usar trapaça.#nVamos lutar de forma justa, caloura?"
22210-268 = "Haa... É o fim, então."
22210-283 = "Tsc..."
22210-284 = "Hmph, nem foi grande coisa."
22210-291 = "Então essa é..."
22210-292 = "A mais forte de Millennium..."
22210-294 = "Double O..."
22210-297 = "Próximo;Pavana para uma Princesa (1)"
