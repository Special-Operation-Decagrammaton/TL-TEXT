[translation]
22210-1 = "Эпизод 21; Что в имени?"
22210-2 = "[ns] «Нэру! Удачи!»"
22210-4 = "...Нэру! Ни одна твоя атака не сработает против моего оружия!"
22210-5 = "Ты серьёзно ранена. Теперь сопротивление бессмысленно!"
22210-6 = "*вздыхает*"
22210-7 = "Мне на всё это плевать."
22210-8 = "Я уже давно всё решила."
22210-9 = "Я одолею тебя прямо здесь и сейчас."
22210-10 = ""
22210-11 = "Зачем всё так усложнять?"
22210-12 = "Я могу просто пойти спасти мелкую..."
22210-13 = "...после того как изобью тебя."
22210-14 = ""
22210-15 = "Слышишь? Мы спасём Алису!"
22210-16 = "Ладно, мелкие! Начинаем второй матч-реванш старшекурсниц!"
22210-17 = "Асуна!"
22210-18 = "...?!"
22210-19 = "Это я! Ха-ха! В атаку!"
22210-20 = ""
22210-22 = ""
22210-23 = "Это пустяки...!"
22210-24 = ""
22210-33 = "...?! Она от всего уклонилась...?!"
22210-34 = "Да! Это называется дикая интуиция!"
22210-35 = "Карин."
22210-36 = ""
22210-39 = "Снайперская атака из слепой зоны...!"
22210-40 = ""
22210-42 = ""
22210-44 = "Такая атака против меня не сработает...!"
22210-45 = ""
22210-47 = ""
22210-54 = ""
22210-56 = "...Аканэ! Вперёд! Уничтожить их!"
22210-57 = "Да, президент!"
22210-58 = ""
22210-66 = ""
22210-67 = "Серией атак выбить дверь и ворваться в башню...?!"
22210-68 = "Но как...?"
22210-70 = "Будет нелегко..."
22210-71 = "Да, легко не будет..."
22210-72 = "Ха-ха-ха! Что это вообще за бардак вместо стратегии?"
22210-74 = "Я-Я знаю. Давайте забудем..."
22210-75 = "Нет, мы это сделаем."
22210-76 = "Т-Ту стратегию?!"
22210-78 = "Ты уверена? Это всё лишь теория..."
22210-79 = "Ха, знаю. Но это стратегия от Мисс Лобешник."
22210-80 = "М-Мисс Лобешник?"
22210-81 = "Даже в кризис она всегда находит смелость действовать ради друзей."
22210-82 = "Почему мне не принять стратегию от такого человека?"
22210-83 = "О! Нэру! Ты так много знаешь о Юзу!"
22210-84 = "Это потому, что Юзу победила тебя в куче игр?"
22210-85 = "Ты сейчас-то зачем об этом заговорила, а?!"
22210-86 = "Но, президент... А ваши раны...?!"
22210-87 = "И что с ними? Я не могу разочаровать ожидания остальных. Моей гордости это не понравится."
22210-88 = "Не переживайте о глупостях."
22210-89 = "А вы? Я никого не заставляю."
22210-90 = "Мы..."
22210-91 = "...Мы всегда следуем за нашим президентом."
22210-92 = "Ага! Я выполню приказ нашего маленького президента!"
22210-94 = "Но вы уверены, что C&C в одиночку сможет выполнить эту стратегию...?"
22210-95 = "Да, сможем."
22210-96 = "...Если нам снова выпадет шанс сразиться, всё будет иначе, чем в прошлый раз."
22210-97 = "[s] «Если все так говорят... хорошо.»"
22210-98 = "Значит, все согласны на этот бардак вместо стратегии?"
22210-99 = "Тогда я знаю идеальное место."
22210-100 = "Это место..."
22210-102 = ""
22210-103 = ""
22210-107 = ""
22210-108 = ""
22210-112 = ""
22210-114 = ""
22210-116 = ""
22210-117 = ""
22210-118 = ""
22210-120 = "[ns] «Ещё чуть-чуть...! Цель рядом!»"
22210-123 = "(Это безрассудно.)"
22210-124 = "(Это нерациональное решение.)"
22210-125 = "(Факт в том, что C&C и Сенсей уже один раз проиграли оружию Токи.)"
22210-126 = "(Значит, если рассуждать рационально... следующая стратегия, естественно, должна быть обходной, а не прямым прорывом.)"
22210-127 = "(Если это стратегия... Сенсея [USERNAME]...)"
22210-128 = ""
22210-130 = ""
22210-131 = "Токи! Разрешаю использование основного вооружения!"
22210-132 = "Да, мэм."
22210-133 = ""
22210-136 = "Энергия молниеносно концентрируется в центральной башне! Все, осторожно...!"
22210-137 = ""
22210-144 = ""
22210-145 = ""
22210-147 = "[ns1] «Это был... лазер?»\n[ns2] «Они скрывали нечто подобное...?!»"
22210-148 = ""
22210-149 = ""
22210-150 = ""
22210-153 = "(Что я только что сделала...?)"
22210-154 = "(Неужели я изменила решение не из-за процентов или данных...)"
22210-155 = "(...а лишь потому, что почувствовала нечто зловещее...?)"
22210-156 = "(Нет. Не может быть, чтобы я приняла столь иррациональное решение... Я ошибаюсь.)"
22210-157 = "[s] «...Рио.»"
22210-158 = "...На этом всё."
22210-159 = "Результат уже определён. Никто не может изменить будущее, рассчитанное на основе данных."
22210-160 = "Сенсей из Шале. После первого поражения вы должны были понимать, что шансов победить нас нет."
22210-161 = "Не понимаю, что заставляло вас пытаться снова и снова."
22210-162 = "Это бессмысленно и иррационально."
22210-163 = "Если вы бездумно ворвались сюда, даже заставив раненых студентов продолжать атаку..."
22210-164 = "...я буду в вас очень разочарована."
22210-165 = "[s] «Верно...»"
22210-166 = "Сенсей никогда не приказывал нам делать ничего подобного."
22210-167 = "Аканэ?"
22210-168 = "Для начала я хотела бы исправить твоё представление о ситуации."
22210-169 = "Мы сражались не из-за шанса победы и не думая о каких-либо данных."
22210-170 = "А?"
22210-171 = ""
22210-172 = ""
22210-173 = "Президент."
22210-174 = "А? Какой?"
22210-175 = "Как я и сказала, вероятность успеха этой стратегии очень низка."
22210-176 = "А вы ещё и сражаетесь с такими тяжёлыми ранами..."
22210-177 = "Кого это волнует."
22210-178 = "Мне плевать на шансы победить."
22210-179 = "Пусть об этом беспокоитесь ты и Сенсей."
22210-181 = "Важно лишь одно: действительно ли мы хотим спасти нашу подругу. Вот и всё!"
22210-182 = ""
22210-184 = ""
22210-185 = "...Хи-хи."
22210-186 = "Я уже какое-то время об этом думаю... Вы немного изменились, президент."
22210-187 = "Наверное, с тех пор как..."
22210-188 = "...встретили тех мелких..."
22210-189 = ""
22210-191 = ""
22210-192 = "В любом случае... вы отправились в приключение спасать похищенную подругу."
22210-193 = "Точно... Это словно..."
22210-194 = "Вы главный персонаж игры."
22210-195 = ""
22210-196 = "И всё, чего хотите, — спасти подругу."
22210-197 = "..."
22210-198 = "О, кстати, президент Рио. Надеюсь, вы не забыли..."
22210-199 = "Другое имя Нэру и его значение."
22210-200 = "Позывной Double O."
22210-201 = "Это имя — символ победы Миллениум."
22210-202 = "...?!"
22210-203 = ""
22210-205 = ""
22210-208 = "Поняла."
22210-210 = "Как ты вообще двигаешься после такого удара?!"
22210-211 = "К несчастью для тебя, мне не впервой!"
22210-212 = ""
22210-215 = "Я взломала грузовой лифт центральной башни!"
22210-216 = "[ns] «Нэру! Сейчас!»"
22210-217 = ""
22210-218 = ""
22210-223 = "Лифт...? Тогда их цель...?!"
22210-225 = "Это идея, которую предложила Момои."
22210-226 = "Кто? Я?!"
22210-227 = "Если использовать лифт... возможно..."
22210-229 = "...!!!"
22210-230 = "Постой, слабое место оружия...! Неужели?!"
22210-232 = "Токи! Уходи оттуда! Они собираются...!"
22210-233 = "Они пытаются парализовать систему уклонения оружия с помощью перегрузки лифта?!"
22210-234 = "Слишком поздно."
22210-235 = ""
22210-240 = "Кажется, я уже предупреждала тебя."
22210-242 = "Во всём Кивотосе нет никого, кто способен победить меня в ближнем бою."
22210-245 = "..."
22210-246 = "О... Может, я забыла тебе это сказать. Впрочем, неважно."
22210-247 = ""
22210-251 = "Сейчас! Запускайте лифт! Скорость должна быть..."
22210-252 = "...десятикратное ускорение свободного падения!"
22210-254 = ""
22210-261 = "...Система уклонения парализована."
22210-262 = "...Отлично, теперь."
22210-263 = "Давай сразимся без читов, младшекурсница."
