[translation]
103020-1 = "Эпизод 2; Следующая цель"
103020-2 = ""
103020-5 = "...!"
103020-7 = "Вы в порядке, Маэстро?"
103020-8 = ""
103020-11 = ""
103020-12 = ""
103020-13 = "...Что произошло?"
103020-14 = "Нет, объяснять не нужно. Моё тело изменилось... Я всё ещё привыкаю..."
103020-15 = "Ха-ха. Прошу прощения. Мы спешили, поэтому пришлось взять то, что было под рукой. Неудобно? Как вы себя чувствуете?"
103020-16 = "Это несущественно. Физические тела расходны."
103020-17 = "...Куда важнее то, что Chroma атаковала."
103020-18 = "Да. Phrenapates, Проводник Chroma, атаковал раньше, чем мы ожидали."
103020-19 = "...Он знал наше местоположение и слабости и выбрал оптимальный момент для атаки."
103020-20 = "Проводник с самого начала был на шаг впереди нас. Мы позорим имя Гематрия."
103020-21 = "Хи-хи-хи... Мы с самого начала не были его приоритетом."
103020-22 = "Он напал на нас лишь как на средство для достижения цели. Чтобы заполучить инструмент для выполнения своего предназначения."
103020-23 = "Инструмент для уничтожения Кивотос."
103020-24 = "Да. Сдвинув с места бога подземного мира, изменённого своим ужасом, он лишил Гематрия всех её секретов."
103020-39 = "Mimesis, Communio Sanctorum, Decagrammaton, Безымянные боги, Библиотека знаний и... даже Ковчег Атрахасис, который нам так и не удалось заполучить."
103020-40 = "Теперь, когда Проводник Chroma заполучил ужас Анубиса, Кивотос больше не является подходящим местом для нашей деятельности."
103020-41 = "Chroma поглотит всё, а Кивотос покроется слоем безумия. Такова её природа."
103020-42 = "Даже если мы продолжим следовать своим ценностям здесь, наши достижения лишь станут новыми инструментами для Phrenapates."
103020-43 = "Тогда Кивотос придёт конец?"
103020-44 = "...Возможно, нет. Сенсей [USERNAME] остаётся. Вместе с учениками он будет вести эту горькую борьбу до самого конца."
103020-45 = "...Понятно. Другого я и не ожидал."
103020-46 = "Но как долго они будут сражаться? Как долго Сенсей сможет противостоять непостижимой Chroma? Хи-хи-хи."
103020-47 = ""
103020-49 = ""
103020-50 = "Даже теперь, когда всё разрушено, остаются увлекательные явления для наблюдения. Как захватывающе!"
103020-51 = ""
103020-53 = ""
103020-54 = "...Гематрия временно распускается."
103020-55 = ""
103020-58 = ""
103020-59 = "Мы соберёмся снова, когда придёт время. До тех пор можете делать что угодно, Маэстро."
103020-60 = "Понимаю. А что с Голкондой? Что с ним случилось?"
103020-61 = "С ним всё будет в порядке, ведь Decalcomania, основное тело, не может умереть. Но Фрэнсис захватил их сознание."
103020-62 = "...Фрэнсис вернулся."
103020-63 = "В каком-то смысле он даже опаснее Беатриче. Я буду скучать по Голконде."
103020-64 = ""
103020-66 = ""
103020-67 = "Чёрный костюм, чем вы займётесь теперь?"
103020-68 = "Хи-хи-хи..."
103020-71 = "Мне нужен доклад! Какова ситуация?"
103020-72 = "Эм, как бы это сказать...? По всему Кивотос обнаружены массы со сверхвысокой энергией..."
103020-73 = ""
103020-75 = ""
103020-78 = "...Снова."
103020-80 = "Как это возможно...?"
103020-81 = "Уф."
103020-83 = "Комната Комитета по предотвращению закрытия"
103020-84 = "..."
103020-85 = "...Хм."
103020-86 = "Это значит..."
103020-87 = ""
103020-89 = ""
103020-91 = "...Да. Это всё, что я знаю, Комитет по предотвращению закрытия."
103020-92 = "..."
103020-94 = "Значит, Широко потеряла себя после контакта с Chroma... так?"
103020-95 = "И Широко причастна ко всем этим инцидентам...?"
103020-96 = ""
103020-99 = ""
103020-101 = "Широко... Как такое могло случиться...?"
103020-102 = "Что произошло с Широко? Почему она пытается уничтожить мир? Что... Что это было за выражение на её лице...?"
103020-103 = "Аяне..."
103020-104 = "Я-я не знаю... Я слышала о Chroma, но не понимаю, как она могла стать совершенно другим человеком..."
103020-105 = "Я не знаю, почему это произошло и что всё это значит... Я только знаю... я совсем не могла понять, о чём она думает..."
103020-106 = "..."
103020-107 = "Аяне..."
103020-109 = "Что бы ни происходило с Широко, это не её вина."
103020-110 = "Нужно учитывать, что она оказалась во власти силы, которую не могла преодолеть собственными усилиями."
103020-112 = "Точно, Аяне! Похоже, здесь виновата Хрома, а не Широко!"
103020-113 = "..."
103020-114 = "Есть ли способ вернуть Широко в прежнее состояние?"
103020-115 = ""
103020-118 = ""
103020-119 = "Мы работаем над этим, но пока решения нет."
103020-120 = "Э-Это..."
103020-122 = "В прошлом я была единственной, кто столкнулся с Chroma и благополучно вернулся."
103020-123 = ""
103020-125 = ""
103020-127 = "Сенсей отправил кого-то в район Хяккияко, чтобы найти способ бороться с Chroma."
103020-128 = "Сенсей..."
103020-130 = "Мы также сотрудничаем с Сестринство, анализируя наши данные о Chroma... Мы найдём способ освободить Сунаоками Широко из её власти."
103020-132 = "Что там написано, президент?"
103020-133 = "М-Можно посмотреть...?"
103020-134 = ""
103020-136 = ""
103020-138 = "Так, посмотрим..."
103020-139 = ""
103020-141 = ""
103020-142 = ""
103020-144 = "«Сенсей [USERNAME].»"
103020-145 = "«Нет способа вернуть существование, обращённое Chroma, в исходное состояние.»"
103020-146 = ""
103020-149 = "«Это естественный закон этого мира, такой же, как невозможность вернуть мёртвых к жизни.»"
103020-155 = "Э-Это значит... святилища появятся снова?"
103020-156 = "Тогда всё, что мы делали до сих пор, было бессмысленно."
103020-158 = "...Ситуация не совсем такая же."
103020-159 = "А, точно. В этот раз места появления энергии немного другие."
103020-160 = ""
103020-162 = ""
103020-163 = "Замёрзшее море Красная Зима, область под заброшенным парком аттракционов, вулкан Hinnom в Геенна и подземные катакомбы Тринити..."
103020-164 = "Аюму, сколько времени прошло в прошлый раз от первого проявления феномена до появления святилищ?"
103020-165 = "О... примерно... двадцать четыре часа."
103020-167 = "Тогда, возможно, именно столько времени у нас осталось..."
103020-168 = "Нет, в этот раз всё может произойти раньше."
103020-169 = "Энергия в среднем примерно на тридцать восемь процентов выше, чем в прошлый раз."
103020-171 = "...А?"
103020-172 = ""
103020-174 = ""
103020-175 = ""
103020-177 = "Ты права! Рин, ты... запомнила все эти числа? Ничего себе."
103020-179 = "Значит, у нас меньше суток..."
103020-180 = "Сейчас каждый район разбирается с последствиями штурма. Святилища исчезли, но по всему Кивотос всё ещё полно врагов."
103020-181 = "В любом случае подготовиться к новому штурму святилищ невозможно. В первый раз все выложились до предела и так и не отдохнули."
103020-182 = "Единственный вариант — остановить святилища ещё до их появления."
103020-183 = "...Но как?"
103020-184 = ""
103020-187 = ""
103020-189 = "..."
103020-190 = "Противник невидим. Его сейчас даже не существует. Мы можем обнаружить только энергию, но она появляется из ниоткуда."
103020-191 = "Можно ли это остановить? Есть решение?"
103020-192 = "[s] «...»"
103020-193 = "Сенсей..."
103020-194 = "[s] «Я отвечаю за то, как всё обернулось. Простите меня, все.»"
103020-195 = ""
103020-198 = ""
103020-199 = "Что...?!"
103020-200 = "С-Сенсей?! Что вы имеете в виду...?"
103020-201 = "[s] «У меня было смутное ощущение, что что-то приближается.»"
103020-204 = "[ns] «Я знал, что Широко в опасности...»"
103020-207 = "[ns] «Пророчество об уничтожении Кивотос...»"
103020-210 = "[ns] «Я даже получил прямое предупреждение о враге, с которым нам предстояло столкнуться.»"
103020-213 = "[ns] «Все кусочки были прямо передо мной.»"
103020-216 = "[ns] «Я слишком расслабился. Думал, что справлюсь с чем угодно.»"
103020-218 = "Вы ошибаетесь, Сенсей! Вы сделали всё, что могли, с тем, что у вас было, как всегда!"
103020-219 = "Рин...?"
103020-220 = "Вы знали, что у пророчества нет оснований, но всё равно пришли ко мне со своими опасениями. Вы приняли все необходимые меры предосторожности."
103020-221 = "Именно благодаря вашему предупреждению мы смогли успешно провести штурм Ложных святилищ."
103020-222 = "А за остальное... ответственность лежит на мне."
103020-223 = "Если бы я была способнее... Если бы я... Если бы я была президентом Генерального студсовета... а не просто собой..."
103020-225 = "..."
103020-227 = "Рин..."
103020-229 = ""
103020-230 = "[ns1] «Это не оправдание.»\n[ns2] «Я должен был защитить Широко.»\n[ns3] «Это была моя ответственность как взрослого.»"
103020-234 = "..."
103020-236 = "Ну-ну. Давайте глубоко вдохнём, Сенсей."
103020-237 = "[s] «А-А? Хошино?»"
103020-240 = "На самом деле всё гораздо проще, чем вы тут напридумывали."
103020-241 = "Широко ведёт себя странно? Тогда мы просто притащим её сюда и как следует отчитаем. А с остальным разберёмся потом."
103020-242 = "Х-Хошино? Ты о чём...?"
103020-243 = "Хех. Не буду отрицать: у меня давно было плохое предчувствие, что однажды Широко может ступить на опасный путь. Наверное, я всегда это знала."
103020-244 = "Так что если всё происходящее каким-то образом крутится вокруг нашей пропавшей Широко..."
103020-245 = "Ну, глупо было бы говорить, что я не волнуюсь. Вариантов у нас немного."
103020-246 = ""
103020-248 = ""
103020-250 = "Но это совершенно другая история!"
103020-251 = "Виновата Chroma, а не Широко и не Сенсей! Никто из вас не виноват!"
103020-252 = "Сражаться нам нужно не с Широко!"
103020-253 = "[s] «...»"
103020-254 = "К тому же, если мы не решим эту проблему прямо сейчас, в Кивотос могут появиться новые жертвы вроде Широко."
103020-255 = "Так что всё просто."
103020-256 = "Мы вместе с Сенсеем должны не допустить новых жертв вроде Широко. Вот что важнее всего!"
103020-257 = "А если Широко попытается нас остановить? Просто поймаем её!"
103020-258 = "Сенсей и остальные придумают, как вернуть её в себя!"
103020-259 = "Хошино..."
103020-261 = "Она всё-таки не дикое животное, чтобы её ловить! Хотя... сходство кое-какое есть..."
103020-262 = "Хех... Именно. Я специалист по поимке диких Широко. Это не в первый раз!"
103020-263 = "Верно, Нономи?"
103020-264 = "Ага! Вообще-то ты делала это всего один раз, но зато ты единственная в Кивотос, кто вообще делал это. ☆"
103020-265 = "Хех... Так что, Сенсей, просто скажите, как обычно, что всё будет хорошо."
103020-266 = ""
103020-269 = "[ns4] «...Ты права.» \n[ns5] «Спасибо, Хошино.»"
103020-272 = "[ns] «Вернём Широко любой ценой.»"
103020-273 = "Хех... Вот теперь это больше похоже на вас, Сенсей!"
103020-275 = "Точно! Широко и так всегда была немного странной, так что ничего страшного, если стала ещё чуточку страннее! Ловить Широко звучит весело!"
103020-276 = "Ага, точно. Эта дикая версия Широко свирепая, так что придётся посадить её на поводок и таскать за собой. ☆"
103020-277 = ""
103020-280 = ""
103020-281 = "...Хорошо. Поняла."
103020-282 = "Я найду способ решить нашу проблему и найти Широко!"
103020-283 = ""
103020-285 = ""
103020-286 = ""
103020-287 = "[ns] «Я рассчитываю на вас.»"
103020-289 = "...Хмм. А если..."
103020-290 = "Момока. Та энергия, которую мы обнаружили по всему Кивотос, можно отследить её поток?"
103020-291 = "Поток?"
103020-292 = "Когда мы атаковали последнее святилище, мы видели, как энергия всех святилищ сходилась вместе."
103020-293 = "О! Точно. Если предположить, что энергия — что-то текучее и может передаваться из одного места в другое..."
103020-295 = "...Хм, понимаю, к чему ты клонишь. Попробую."
103020-296 = ""
103020-298 = ""
103020-299 = ""
103020-304 = "Хм..."
103020-305 = "Думаю, она права. У всех координат есть общий поток энергии."
103020-306 = "Момока! А если проследить поток назад...?"
103020-308 = "Знаю. Секунду."
103020-309 = ""
103020-311 = ""
103020-312 = ""
103020-313 = ""
103020-314 = ""
103020-316 = ""
103020-317 = "Кажется, нашла."
103020-318 = "Момока!"
103020-321 = "Вся энергия ведёт в одно место. Это её источник."
103020-322 = "Другими словами, именно там находится эпицентр, создающий Ложные святилища."
103020-323 = "Где?"
103020-326 = "Над небом... Высота — 75 000 метров над Кивотос."
103020-327 = "Что?! Это же выше стратосферы...?!"
103020-328 = "Над небом..."
103020-330 = "Да. Я обнаруживаю там ещё больше энергии."
103020-331 = "Значит... именно это место стоит за всеми этими происшествиями..."
103020-332 = "Кто бы мог подумать, что оно прячется над небом?"
103020-334 = "Тогда тот, кто ведёт Кивотос к уничтожению... должен быть там."
103020-341 = "[ns] «Phrenapates, Проводник Chroma.»"
103020-344 = "Следующий эпизод; Методы и механизмы"
