[translation]
1003405-1 = "Этикет II: Уборка"
1003405-2 = "Старое школьное здание Хяккияко 18"
1003405-3 = "Уборка — тоже важная часть моих обязанностей как настоящей леди."
1003405-4 = "[s] «Здесь довольно пыльно.»"
1003405-5 = "Да, формально это место больше не используется."
1003405-6 = "Но это не значит, что можно позволить ему прийти в такой беспорядок."
1003405-7 = "Я заставлю это место сиять не хуже остального здания."
1003405-8 = "[s] «Это тоже часть твоей подготовки?»"
1003405-9 = "Разумеется."
1003405-10 = "Настоящая леди..."
1003405-11 = "Или, точнее, молодая жена и хозяйка дома должна уметь всё: убирать, готовить, стирать, шить, вести хозяйство и многое другое."
1003405-12 = "Необходимым навыкам и знаниям поистине нет конца!"
1003405-13 = "[s] «Путь настоящей леди нелёгок, да?»"
1003405-14 = "Да, безусловно! Именно поэтому он так вознаграждает."
1003405-15 = "Тогда начнём?"
1003405-17 = ""
1003405-18 = ""
1003405-19 = ""
1003405-20 = ""
1003405-21 = ""
1003405-22 = ""
1003405-23 = ""
1003405-24 = ""
1003405-25 = ""
1003405-27 = "Мы с Мимори три часа убирали только класс бывших институтов."
1003405-30 = "[ns1] «Пол, окна, парты, доска, стулья — всё сделали...»\n[ns2] «У меня руки сейчас отвалятся. Пожалуйста, скажи, что мы закончили.»"
1003405-31 = "Мы почти закончили, однако..."
1003405-32 = "Мы почти закончили, однако..."
1003405-33 = "Нельзя забывать самую важную часть."
1003405-34 = "[s] «И о какой?»"
1003405-35 = "Оконные рамы!"
1003405-36 = "Очень легко просто протереть стёкла и забыть о всей пыли, которая скапливается в самих рамах."
1003405-37 = "[s3] «Ого, ты настолько внимательна к деталям!»\n[s4] «Настоящее мышление истинной леди!»"
1003405-38 = "Я подготовила всё необходимое."
1003405-39 = "Я подготовила всё необходимое."
1003405-40 = "Пульверизаторы, губки для уборки и деревянные палочки..."
1003405-41 = "Все принадлежности здесь!"
1003405-42 = ""
1003405-43 = ""
1003405-44 = "*протирает*"
1003405-45 = "Сенсей, смотрите!"
1003405-46 = "Всё просто сверкает!"
1003405-47 = "[s] «Ого, чистые оконные рамы и правда многое меняют.»"
1003405-48 = "Этот способ я нашла в интернете."
1003405-49 = "Как приятно видеть такую чистоту..."
1003405-50 = "...но мы ещё не закончили."
1003405-51 = "Мы только слегка затронули поверхность."
1003405-52 = "Губка не достаёт до глубоких щелей оконной рамы."
1003405-53 = "[s] «*ах* Т-Тогда что нам делать, сержант Мимори?!»"
1003405-54 = "В таких ситуациях у нас есть секретное оружие!"
1003405-55 = "Кисточка для рисования!"
1003405-56 = "[s] «Как неожиданно!»"
1003405-57 = "Это тонкая кисть для прорисовки мелких деталей."
1003405-58 = "С ней даже самые глубокие щели не устоят."
1003405-59 = "В интернете полно советов о том, как стать настоящей леди!"
1003405-60 = "[s] «Мудрость настоящей леди — при участии интернета!»"
1003405-61 = ""
1003405-62 = ""
1003405-63 = ""
1003405-64 = "*протирает*"
1003405-65 = "Хи-хи. И готово!"
1003405-66 = "[s] «Ты выглядишь счастливой.»"
1003405-67 = "П-Правда?"
1003405-68 = "Полагаю, настолько тщательная уборка оконных рам..."
1003405-69 = "...дала мне чувство выполненного долга."
1003405-70 = "[s] «Похоже, тебе нравится уборка.»"
1003405-71 = "О да! Думаю, я уже довольно хорошо умею вести хозяйство."
1003405-72 = "Но одной это не так увлекательно..."
1003405-73 = "[s] «Правда? А сейчас ты выглядишь довольно увлечённой.»"
1003405-74 = "Ну, сейчас немного иначе, потому что..."
1003405-75 = "[s] «Потому что...?»"
1003405-76 = "Хи-хи. Просто потому что."
1003405-77 = "Хорошо, Сенсей. В следующую комнату!"
1003405-79 = "Мы с Мимори убирались ещё два часа и наслаждались каждой минутой."
