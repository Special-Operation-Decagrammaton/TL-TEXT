[translation]
12015-2 = "Entendo..."
12015-3 = "Primeira Companhia aniquilada! Estamos recuando para nos reorganizar!"
12015-4 = "Terceira Companhia impossibilitada de continuar! Recuando temporariamente para reabastecimento!"
12015-5 = "..."
12015-6 = "Entendo, já tenho uma boa noção agora. O poder de Schale, as forças que serão necessárias..."
12015-7 = "Supera em muito as minhas expectativas... É impressionante."
12015-8 = "Não que eu os tenha subestimado, mas talvez devesse ter agido com mais cautela."
12015-9 = "Ainda assim, estão longe de serem invencíveis. Já identifiquei seus pontos fracos... e consegui ler o rumo da batalha."
12015-10 = "Se pressionarmos um pouco mais por aqui... será apenas uma questão de tempo até cederem."
12015-13 = "Oitava Companhia. Deixem a retaguarda e iniciem o avanço."
12015-15 = "O Comitê Disciplinar está mobilizando a terceira onda!"
12015-16 = "Arf... arf... Ainda tem mais?!"
12015-17 = "Enviando ainda mais reforços nessa situação...?!"
12015-18 = "N-Não é grande coisa! Eu ainda consigo lutar muito bem!"
12015-19 = "Mesmo assim... isso já ultrapassa o efetivo que a Ako tem autoridade para mobilizar. O que significa que esse ataque não é uma decisão unilateral dela... será que..."
12015-20 = "...A Chefe do Comitê Disciplinar?"
12015-21 = "Hã, a Hina está vindo?! Sem chance, sem chance, sem chance?! Vamos fugir, rápido!!!"
12015-22 = "Não, eu não disse isso... Calma, presidente..."
12015-26 = "(Passos marchando: tum, tum, tum, tum...)"
12015-28 = "Huhu... Mais do que isso já seria demais..."
12015-29 = "Se a Chefe ficar sabendo, vou acabar escrevendo uma carta de desculpas juntinha com a Iori..."
12015-30 = "Pois bem... dizem que na terceira vez dá certo, não é? Comitê Disciplinar, ataquem—"
12015-31 = "(Chiado de rádio)"
12015-33 = "Ako."
12015-34 = "...Hã?"
12015-35 = "Ch-Ch-Chefe Hina?!"
12015-37 = "Chefe?"
12015-38 = "A-A pessoa na ligação é...? Se é a Chefe, então é a líder do Comitê Disciplinar...?"
12015-39 = "Ch-Ch-Chefe, por que está ligando a essa hora...?"
12015-40 = "Ako, onde você está agora?"
12015-41 = "E-Eu? Eu estou... b-bem... hum... n-nos arredores da cidade perto de Gehenna! Fazendo patrulha com as integrantes do Comitê Disciplinar..."
12015-42 = "Que mentira descarada!"
12015-43 = "Pelo visto, era mesmo uma ação unilateral da administradora..."
12015-44 = "M-Mais importante, Chefe, por que está ligando a essa hora...? Não estava em viagem a trabalho?"
12015-45 = "Voltei agora há pouco."
12015-46 = "E-Entendi...! Bem, eu tenho um assunto que preciso resolver com urgência agora mesmo... Entro em contato de novo mais tarde! E-Estou um pouco ocupada no momento...!"
12015-47 = "Ocupada...? Que raro durante uma patrulha. Aconteceu alguma coisa?"
12015-48 = "Hã? B-Bem... isso é..."
12015-49 = "Algo que exija mobilizar as integrantes do comitê por conta própria no distrito autônomo de outra academia?"
12015-50 = "...Hã?"
12015-56 = "...Quê?"
12015-57 = "...?!"
12015-58 = "Hã, ué?!"
12015-59 = "?!"
12015-60 = "Ch-Ch-Ch-Chefe?! D-Desde quando está aí?!"
12015-61 = "!!"
12015-62 = "...Hã,"
12015-64 = "Hããããã?!"
12015-66 = "..."
12015-67 = "...Ako. Você vai me explicar essa situação direito."
12015-69 = "Próximo;A Chefe do Comitê Disciplinar de Gehenna"
