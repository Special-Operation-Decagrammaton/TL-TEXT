[translation]
1001705-1 = "Черино девять лет?"
1001705-2 = "Торговый квартал 3-й улицы"
1001705-3 = "Вы опоздали, Товарищ!"
1001705-4 = "Вы заставили меня ждать. Вас следует запереть в Бывшем институте на сто лет! Вы заслуживаете чистки!"
1001705-5 = "Хмф!"
1001705-6 = "Но раз сегодня вы покупаете мне пудинг, на этот раз прощу. Вы должны гордиться, Товарищ!"
1001705-7 = "Кстати, правда можно заказать всё, что захочу? Можно взять самый большой пудинг?"
1001705-8 = "[s] «Конечно.»"
1001705-9 = "Хи-хи-хи! Тогда я буду есть пудинг, пока лимит карты моего Товарища не закончится!"
1001705-10 = "Я достаточно потрудилась, так что заслуживаю это!"
1001705-12 = ""
1001705-13 = ""
1001705-14 = "*ням-ням-ням*"
1001705-15 = "*вздох* ...Пудинг здесь действительно восхитительный! Я могла бы есть его вечно!"
1001705-16 = "Конечно, пудинг из столовой Красная Зима тоже вкусный, но этот по-своему особенный..."
1001705-17 = "А теперь, пожалуй, попробую следующий пудинг."
1001705-18 = "*ням-ням-ням*"
1001705-20 = ""
1001705-21 = "Ой-ой. Какая милая маленькая леди. Ты пришла в магазин с родителем?"
1001705-22 = "Ч-Что ты сказала?"
1001705-23 = "Вы всё неправильно поняли! Товарищ — мой учитель, а не родитель!"
1001705-24 = "О, простите. Я не подумала, что вы студент. Тогда... вы школьница младших классов?"
1001705-25 = "М-младших классов?"
1001705-26 = "За сколько лет вы меня принимаете?! Я Черино, Великий лидер академии Красная Зима, президент студсовета и председатель... всяких великих вещей!"
1001705-27 = "Пусть я и невысокая, как можно не чувствовать исходящую от меня зрелость?!"
1001705-28 = "Мне очень жаль! Наверное, я решила, что вы пришли на акцию."
1001705-29 = "Акцию? Какую ещё акцию?"
1001705-30 = "Сегодня десятилетие нашего магазина, поэтому мы бесплатно раздаём печенье детям младше десяти лет."
1001705-31 = "П-печенье?"
1001705-32 = ""
1001705-33 = ""
1001705-35 = "(Печенье L'Oiseau Bleu — эксклюзивное деликатесное печенье, которое трудно достать даже за деньги... И его раздают бесплатно?)"
1001705-36 = "(А по словам Томоэ, оно такое же сладкое, как здешний пудинг...)"
1001705-37 = "(Я не могу упустить такую возможность!)"
1001705-38 = "(Но притворяться ребёнком ради печенья — удар по моей гордости президента Красная Зима... Что делать?)"
1001705-39 = ""
1001705-40 = "(Чёрт, не знаю!)"
1001705-42 = "Ха-ха! В таком случае мне тоже полагается печенье. Давайте его сюда!"
1001705-43 = "Что? Но только что вы сказали, что учитесь в академии Красная Зима..."
1001705-44 = "П-потому что... я перепрыгнула через классы!"
1001705-45 = "Я гений, который умел решать дифференциальные уравнения ещё до того, как научился ходить... Перепрыгнуть сразу в старшую школу для меня пустяки!"
1001705-46 = "Так что давайте печенье!"
1001705-47 = "Но..."
1001705-48 = "Почему вы не даёте мне печенье? Я же сказала, мне девять лет!"
1001705-49 = "Печенье, дайте мне моё печенье! Печенье!"
1001705-50 = ""
1001705-52 = "...Разве это не президент Черино? Почему она здесь закатывает истерику?"
1001705-53 = "Я знала, что она ребячлива, но не думала, что она способна вести себя настолько бесстыдно. Смотреть неловко."
1001705-54 = "Мне даже стыдно, что я учусь в академии Красная Зима."
1001705-55 = "..."
1001705-56 = "Чистка... Вас ждёт чистка!"
1001705-57 = ""
1001705-58 = "Всех в этом магазине ждёт чистка!"
1001705-59 = ""
1001705-63 = "Успокоив разъярённую Черино, я вернулся в академию Красная Зима."
