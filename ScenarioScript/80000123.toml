[translation]
80000123-1 = "Сладкая журналистика"
80000123-2 = "Отли-и-ичная работа!"
80000123-3 = "Благодаря вам у нас выйдет горячая и шумная статья ко Дню святого Валентина!"
80000123-4 = "[s] «Кажется, ты только что сказала что-то, чего говорить не стоило...»"
80000123-5 = "Не парьтесь о мелочах! Для хорошей статьи такое необходимо!"
80000123-6 = "Тогда я пойду заканчивать текст!"
80000123-7 = ""
80000123-9 = ""
80000123-10 = "А! Точно! Пока не забыла! Я не могла прийти с пустыми руками в День святого Валентина, поэтому кое-что принесла."
80000123-11 = "Это награда за то, что вы пожертвовали честью и будущим ради очередной хитовой статьи в «Еженедельнике Общества Пандемониума»!"
80000123-12 = "[s] «Мои ответы были настолько важны?!»"
80000123-13 = "Всё хорошо, что хорошо кончается! Так, куда я это положила?"
80000123-14 = "А! Вот!"
80000123-15 = ""
80000123-18 = "Та-дам! Ну как?"
80000123-19 = "[s1] «Даже если спросишь моё мнение...»\n[s2] «Что это?»"
80000123-22 = "Вы серьёзно?! Это ваш собственный эксклюзивный специальный выпуск «Еженедельника Общества Пандемониума»!"
80000123-23 = "Шоколад ведь ценен тем, что сделан своими руками, верно? Поэтому я запечатлела самое важное."
80000123-24 = "Использовать лучшую фотографию домашнего шоколада — самый эффектный и драматичный способ его вручить, разве нет?"
80000123-25 = "[s] «Понятно...»"
80000123-26 = ""
80000123-29 = "[ns] «...Но шоколад вживую совсем не похож на фотографию.»"
80000123-30 = "Верно. Как и ожидалось от преданного читателя уважаемого журнала Геенны «Еженедельник Общества Пандемониума» — глаз у вас острый!"
80000123-31 = "Чтобы красиво фотографировать еду вроде этого шоколада, я использую разные постановочные приёмы."
80000123-32 = "Например, что бы вы сделали, если захотели сфотографировать суп с зеленью или другой посыпкой сверху?"
80000123-33 = "[s] «Положить побольше?»"
80000123-34 = "Бип! Неверно!"
80000123-35 = "Если положить слишком много, всё быстро утонет, и на фотографии ничего толком не будет видно!"
80000123-36 = "Поэтому для красивого кадра переворачивают маленькую миску, ставят внутрь большой и уже сверху кладут украшение!"
80000123-37 = "[s] «Миска в миске...?»"
80000123-38 = "Ну, суп всё равно можно съесть, если потом вынуть внутреннюю миску!"
80000123-39 = "Суть в том, что для хорошей фотографии требуется много постановки!"
80000123-40 = "А в этот раз ничего нельзя было поделать: пока я искала подходящий ракурс, шоколад растаял и снова застыл!"
80000123-41 = "[s] «Немного натянуто называть это „живой репортажной журналистикой“...»"
80000123-42 = "В любом случае, фотография красивая, а настоящий шоколад вкусный, так что всё нормально, да?"
80000123-43 = "Будет реалистичнее, если есть фотографию, глядя на шоколад!"
80000123-44 = "[s] «Разве не наоборот?»"
80000123-46 = "После этого я ел шоколад, глядя на фотографию."
80000123-47 = "Шоколад был довольно обычным, а Чиаки — милой."
