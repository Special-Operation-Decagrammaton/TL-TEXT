[translation]
1007506-1 = "Приглашение в Красную Зиму"
1007506-2 = "Во время визита в академию Красная Зима я решил заглянуть на Фронт освобождения знаний."
1007506-3 = "MomoTalk от Мэру меня немного обеспокоил..."
1007506-4 = ""
1007506-6 = "В библиотеке"
1007506-7 = ""
1007506-8 = "А? Сенсей?! Ты правда пришёл?"
1007506-9 = "Если бы я знала, что ты придёшь, хоть немного бы подготовилась!"
1007506-10 = "[s] «Я не хотел мешать! Тогда я пойду...»"
1007506-11 = "Нет-нет-нет! Не говори так, мне станет неловко."
1007506-12 = "...Что? Ты специально так сказал?! Какой же ты ужасный взрослый...!"
1007506-13 = "Кхм! В общем... Что же делать? В библиотеке Фронта освобождения знаний мне нечего тебе порекомендовать."
1007506-14 = "Она забита вещами, которые тебе не понравятся... хотя, зная Сенсея, может, тебе они как раз очень даже понравятся..."
1007506-15 = "[s] «Теперь мне стало интересно.»"
1007506-16 = "Я-Я не могу тебе это показать! Лучше уж..."
1007506-17 = "О, точно! Есть идея!"
1007506-18 = ""
1007506-20 = ""
1007506-21 = "Я пошёл вслед за внезапно оживившейся Мэру вглубь библиотеки."
1007506-23 = ""
1007506-24 = "Добро пожаловать... в мастерскую Фронта освобождения знаний!"
1007506-25 = "[s1] «На твоём поле боя тут много всего происходит.» \n[s2] «Так вот какое у тебя поле боя.»"
1007506-28 = "Ну... Это скорее мой реабилитационный центр, чем поле боя."
1007506-29 = "Что я имею в виду? Эм... Ну..."
1007506-30 = "Раз уж я привела тебя сюда, наверное, стоит рассказать."
1007506-31 = ""
1007506-33 = ""
1007506-34 = "...Немного неловко это признавать, но иногда творчество идёт совсем не так, как я представляла. Вообще-то, чаще всего именно так."
1007506-35 = "Когда это случается, я падаю духом, будто меня загнали в угол."
1007506-36 = "Чем сильнее я чувствую себя в ловушке, тем больше хочется отложить перо."
1007506-37 = "В каком-то смысле это и правда поле боя. Я солдат, который только что проиграл сражение. Боевой дух на нуле, сил двигаться дальше нет. Но командование требует снова взять оружие и продолжать бой."
1007506-38 = "Когда это поле боя становится невыносимым, я прихожу сюда, чтобы начать всё сначала."
1007506-39 = "Это одновременно что-то вроде тренировки и психологической реабилитации."
1007506-40 = "Звучит совсем безумно? Творчество меня и добило, но подняться обратно я могу только благодаря искусству!"
1007506-41 = "Почему у всех творческих людей обязательно не все винтики на месте? Ахаха!"
1007506-42 = "[s3] «Нелегко продолжать, когда на пути столько препятствий.» \n[s4] «По-моему, это довольно впечатляет.»"
1007506-45 = "Не поздравляй меня, Сенсей! Именно здесь родился сам первородный грех!"
1007506-46 = "Первородный грех — делать всё только потому, что мне это нравится."
1007506-47 = "Что? Даже то, что мы любим делать... всё равно может быть тяжёлым...?"
1007506-48 = "..."
1007506-49 = "Сегодня ты прямо бьёшь в самое яблочко, Сенсей."
1007506-50 = "[s5] «Тогда мне нужно понять.» \n[s6] «Раз уж я здесь, я должен убедиться, что Фронт освобождения знаний усердно работает. »"
1007506-53 = ""
1007506-55 = ""
1007506-56 = "..."
1007506-57 = "Вот же..."
1007506-58 = ""
1007506-62 = "― [log=메루]Я не делаю ничего настолько выдающегося.[/log][wa:2160]"
1007506-65 = "― [log=메루]Просто я больше ничего не умею,[/log][wa:10]"
1007506-66 = "― [log=메루]и ни в чём другом не хороша...[/log][wa:530]"
1007506-69 = "― [log=메루]Может, поэтому...[/log][wa:100]"
1007506-71 = "― [log=메루]мне всё время хочется что-нибудь создавать.[/log][wa:600]"
1007506-74 = "― [log=메루]Но сейчас... это не кажется чем-то неправильным или плохим.[/log][wa:490]"
1007506-77 = "― [log=메루]Здесь, в этой мастерской,[/log]"
1007506-78 = "― [log=메루]мне кажется, что я могу по-настоящему поговорить с тобой.[/log][wa:3140]"
1007506-81 = "― [log=메루]Потому что...[/log][wa:1040]"
1007506-83 = "― [log=메루]Творчество требует перемен, правда?[/log][wa:10]"
1007506-86 = "― [log=메루]А ты, Сенсей, тот, кто помогает мне меняться.[/log][wa:2310]"
1007506-89 = "― [log=메루]Уф...[/log][wa:260]"
1007506-91 = "― [log=메루]Я только что сказала что-то ужасно пафосное.[/log][wa:360]"
1007506-94 = "― [log=메루]Эм, просто сделай вид, что ничего не слышал! Забудь! Забудь прямо сейчас![/log][wa:10]"
1007506-96 = "― [log=메루]Ахахаха![/log]"
1007506-99 = "[ns7] «Я не понимаю, что ты имеешь в виду под переменами.» \n[ns8] «Можешь объяснить немного подробнее?»"
1007506-102 = ""
1007506-103 = "Я же только что сказала тебе забыть об этом?!"
1007506-104 = "Уф, ладно, будь по-твоему! Как бы это объяснить..."
1007506-105 = "В последнее время я стала замечать вещи, которые раньше вообще прошли бы мимо моего внимания."
1007506-106 = "То, что раньше едва цепляло взгляд, теперь вызывает интерес и рождает у меня в голове моменты, которые хочется зарисовать."
1007506-107 = "Да... Если это вообще понятно. Мне хочется рисовать... гораздо более разные вещи."
1007506-108 = "И мне кажется, во многом это... благодаря твоему влиянию."
1007506-109 = "[s] «Кто? Я?»"
1007506-110 = "Да, ты! Поэтому теперь ты должен нести ответственность за то, какой я стала."
1007506-111 = "[s] «Вот насчёт этого я очень сомневаюсь, Мэру.»"
1007506-112 = "*вздох* Ну, я так и знала, что ты скажешь что-нибудь подобное."
1007506-113 = "Как бы предсказуем ни был этот ответ, он всё равно неправильный. Бззз. Одно предупреждение."
1007506-114 = "[s] «Предупреждение? С каких пор ты можешь выдавать предупреждения?»"
1007506-115 = "С этого момента! Так что теперь ты обязан помочь мне с рукописью!"
1007506-116 = "...? А как ещё ты собираешься искупить предупреждение, которое я только что тебе выдала?"
1007506-117 = "Ты правда собираешься поджать хвост и вернуться в Шале с ПРЕДУПРЕЖДЕНИЕМ?"
1007506-118 = "[s] «Ну, мне кажется, мне было бы всё равно—»"
1007506-119 = ""
1007506-121 = ""
1007506-123 = ""
1007506-124 = "Наверняка это испортило бы тебе весь день, правда?"
1007506-125 = "[s] «Как я уже сказал, мне вообще-то—»"
1007506-126 = "Правда? ПРАВДА?"
1007506-127 = "[s] «...Да, пожалуй, ты права.»"
1007506-128 = "Я так и знала! Ну что же, посмотрим, что поручить тебе первым!"
1007506-130 = "Так я и провёл остаток дня с Мэру, помогая ей с рукописью..."
