[translation]
1011902-1 = "Стрельба Хяккарёран"
1011902-2 = "Клубная комната Совета урегулирования Хяккарёран"
1011902-3 = "На следующий день я пришёл в клубную комнату Хяккарёран раньше назначенного времени, поскольку моя работа в Хяккияко закончилась быстрее, чем ожидалось."
1011902-6 = "Во дворе за клубной комнатой я обнаружил усердно тренировавшуюся Нагусу."
1011902-7 = ""
1011902-13 = "Хоп... Хаа!"
1011902-14 = ""
1011902-16 = ""
1011902-17 = "...О, Сенсей."
1011902-18 = "Надеюсь, я не заставила вас ждать?"
1011902-19 = "Простите. Я слишком увлеклась тренировкой."
1011902-20 = "[s1] «Нет, я совсем не ждал.»\n[s2] «Ты не опоздала, это я пришёл рано.»"
1011902-23 = "Понятно... Тогда хорошо."
1011902-24 = "Хотя вы застали меня в несколько растрёпанном виде..."
1011902-25 = "Если готовы немного подождать, я могла бы закончить и привести себя в порядок."
1011902-26 = "[s3] «Не обязательно.»\n[s4] «Не нужно. Продолжай заниматься.»"
1011902-29 = "Но..."
1011902-30 = "[s] «Мне любопытно увидеть знаменитую „стрельбу Хяккарёран“.»"
1011902-31 = "Любопытно, говорите?"
1011902-32 = "Что ж, в наших тренировочных методах нет ничего необычного."
1011902-33 = "Мы просто стреляем, меняем мишень и повторяем. Смотреть на это может быть не слишком интересно."
1011902-34 = "...К сожалению, мне не хватает таланта моих предшественниц."
1011902-35 = "Поэтому вы можете разочароваться, Сенсей."
1011902-36 = "[s] «Всё нормально. Тебе не нужно пытаться меня впечатлить.»"
1011902-37 = ""
1011902-40 = "[ns5] «Усердно заниматься чем-то, даже когда не уверен в себе...»\n[ns6] «Мне всегда приятно это видеть.»"
1011902-43 = "...Спасибо, что так говорите."
1011902-44 = "Хорошо... тогда позвольте показать вам основные формы."
1011902-45 = "О, только не советую смотреть сзади — из-за шальных пуль."
1011902-46 = "[s] «Шальных пуль?»"
1011902-47 = "Как и следует из названия, Совет урегулирования часто берёт на себя разрешение конфликтов между студентами. Нередко одной из нас приходится выступать против целой толпы."
1011902-48 = "И, конечно, это Кивотос, где почти у каждого есть оружие. Выстрел может прозвучать откуда угодно и когда угодно."
1011902-49 = "Стрельба Хяккарёран развивалась годами именно для противодействия этому."
1011902-50 = "Используя её формы, можно одновременно уклоняться и поражать нескольких противников."
1011902-51 = "По сути, задача — просчитать линию огня врага, уйти с неё, навести прицел на каждую цель и ответить точными быстрыми выстрелами."
1011902-52 = "Разумеется, враги могут появиться сзади или вне поля зрения, поэтому мы готовимся и к этому."
1011902-53 = "[s7] «Звучит как кунг-фу.»\n[s8] «Глубокое искусство.»"
1011902-54 = "Я мало знаю о кунг-фу... хотя если когда-нибудь представится шанс посетить Шаньхайцзин, я бы с удовольствием узнала больше."
1011902-56 = "Итак, начать?"
1011902-57 = "Предположим, четыре мишени вокруг меня — враги, и я поразю их по порядку."
1011902-58 = "Советую держаться на расстоянии."
1011902-59 = ""
1011902-60 = "*вдох*"
1011902-61 = ""
1011902-64 = "...Хаа!"
1011902-65 = ""
1011902-72 = ""
1011902-73 = "Приемлемо? Прошу прощения, если выглядело немного неотточенно. Я нечасто выступаю перед зрителями."
1011902-74 = "[s9] «*ах*»\n[s10] «...КАК ты это сделала?!»"
1011902-77 = "...«Как?» Я просто стреляла в них по мере приближения. Почему вы спрашиваете?"
1011902-78 = "[s11] «Ты двигалась быстрее, чем я успевал увидеть.»\n[s12] «Я просто моргнул — и мишени уже взорвались.»"
1011902-81 = "Что ж, если объяснять по шагам..."
1011902-82 = "Первым двинулся противник на двенадцать часов, поэтому я шагнула в сторону и выстрелила на три часа, затем развернулась и выстрелила из-под руки, нейтрализовав противника на девять часов."
1011902-83 = "Затем я повернулась на четверть оборота и бросила оружие, нейтрализовав врага позади. Из-за этого он выронил винтовку, поэтому я просто перевернулась в воздухе, поймала её, вверх ногами застрелила врага на двенадцать часов и приземлилась."
1011902-84 = "Четыре противника нейтрализованы."
1011902-85 = "Конечно, этот метод работает только при такой расстановке. В зависимости от количества и положения врагов существуют и другие техники."
1011902-86 = "[s] «...И это ты называешь „просто“.»"
1011902-87 = "О, не нужно мне льстить, Сенсей."
1011902-88 = "Хотя ваш комплимент и правда вызывает у меня определённый... прилив чувств, можно сказать."
1011902-89 = "У нас ещё есть время, если хотите увидеть ещё несколько примеров."
1011902-91 = "Я продолжил наблюдать, как Нагуса отрабатывает базовые приёмы стрельбы Хяккарёран."
1011902-92 = "Ни один из которых не выглядел хоть сколько-нибудь базовым."
