[translation]
1005605-1 = "Один день с Рыцарями скорой помощи"
1005605-2 = ""
1005605-6 = ""
1005605-7 = ""
1005605-8 = "О, Сенсей. Сюда!"
1005605-9 = ""
1005605-11 = ""
1005605-12 = "Но... вы точно справитесь?"
1005605-13 = "[s] «Ты постоянно этим занимаешься, так что конечно!»"
1005605-14 = "Ха-ха... Если с вами всё в порядке."
1005605-15 = "Спасибо, Сенсей."
1005605-21 = "Палата Главной больницы Святой Терезы"
1005605-22 = "Хо-хо-хо! Это я, Санта!"
1005605-23 = "Здоровье, возможно, величайший подарок, но у меня есть ещё и подарки для всех хороших мальчиков и девочек здесь!"
1005605-24 = "Это Санта Серина! Как чудесно."
1005605-25 = "А это... Санта Сенсей? Спасибо за ваш труд."
1005605-26 = "С двумя Сантами все дети получат подарок на Рождество."
1005605-27 = "Конечно получат! И мы всегда рады помочь."
1005605-28 = ""
1005605-29 = "Ох, осторожнее с повреждённой рукой. Давайте, я разверну подарок за вас!"
1005605-30 = "Ха-ха. Санте разворачивать и ваш подарок — это уже чересчур? Полагаю, обстоятельства особые!"
1005605-31 = "Давайте посмотрим, что вам досталось!"
1005605-32 = ""
1005605-34 = ""
1005605-35 = "Та-дам! Надеюсь, вам понравится рождественский подарок!"
1005605-36 = ""
1005605-37 = "Два Санты, пришедшие вас навестить, — уже лучший подарок?"
1005605-38 = "Ну, такой хороший ребёнок, как ты, заслуживает много подарков!"
1005605-39 = "Вот! Держи ещё один! Счастливого Рождества!"
1005605-40 = ""
1005605-41 = "Взамен пообещай мне съедать всю еду, включая овощи!"
1005605-42 = "К непослушным детям Санта не приходит."
1005605-43 = "Скажи: «А-а-а»! Если примешь лекарство и расскажешь нам, как себя чувствуешь..."
1005605-44 = "...то получишь особый подарок только для тебя!"
1005605-46 = "Серина прекрасно справлялась и как Рыцарь скорой помощи, и как Санта для детей."
1005605-47 = "Настолько хорошо, что мне почти нечего было делать."
1005605-48 = ""
1005605-51 = "Вестибюль Главной больницы Святой Терезы"
1005605-52 = ""
1005605-53 = "[ns] «...Ты так усердно работаешь каждый день?»"
1005605-54 = "Если честно, сегодня было немного больше дел, чем обычно. Роль Санты добавляет много обязанностей!"
1005605-55 = "Вы устали, Сенсей? Простите, что заставила вас так много работать."
1005605-56 = "Хм? Вы были рады помочь?"
1005605-57 = "Хи-хи. Хорошо, тогда извиняться не буду."
1005605-58 = "[s] «Наверное, тяжело одновременно учиться и работать в Рыцарях скорой помощи...»"
1005605-59 = "О... Я никогда особо об этом не задумывалась."
1005605-60 = "Я просто выполняю свой долг, верно?"
1005605-61 = "С учёбой у меня всё хорошо, и я помогла многим ученикам по всему кампусу."
1005605-62 = "Работа в Рыцарях скорой помощи приносит мне слишком много удовлетворения, чтобы считать её обузой."
1005605-63 = "После тяжёлого рабочего дня я чувствую, что сделала что-то важное, и горжусь собой."
1005605-64 = "[s1] «А сама постоянно говоришь мне не перерабатывать...» \n[s2] «Серина, а ты не думала, что сама слишком много работаешь?»"
1005605-67 = "Ха-ха-ха... Тут мне, пожалуй, нечего возразить."
1005605-68 = "Но, пожалуйста, не беспокойтесь обо мне."
1005605-69 = "Если почувствую, что достигла предела, обязательно подам сигнал тревоги."
1005605-70 = ""
1005605-72 = ""
1005605-73 = ""
1005605-74 = "Итак, Сенсей... Почему вы сегодня решили пойти вместе с Рыцарями скорой помощи?"
1005605-75 = "[s3] «Без особой причины. Просто хотел увидеть тебя.»\n[s4] «Я просто хотел больше узнать о Серине и Рыцарях скорой помощи.»"
1005605-78 = "Ч-Что?! М-Меня?"
1005605-79 = "Что за глупости вы говорите, Сенсей?!"
1005605-80 = "П-Пожалуйста, больше не смущайте меня так!"
1005605-81 = "..."
1005605-82 = ""
1005605-84 = ""
1005605-85 = ""
1005605-86 = "В-Вообще-то... Сенсей..."
1005605-87 = "Ну..."
1005605-88 = "Если в следующий раз вы снова будете свободны..."
1005605-89 = "...не могли бы вы опять мне помочь?"
1005605-90 = "Мне было приятно провести с вами время сегодня..."
1005605-91 = "[s5] «Конечно! К вашим услугам!» \n[s6] «Для этого и нужен твой Сенсей!»"
1005605-94 = ""
1005605-96 = ""
1005605-97 = "Ха-ха. Сенсей, вы всегда такой забавный."
1005605-98 = "Тогда... это обещание!"
1005605-99 = "Я очень серьёзно отношусь к обещаниям! Так что даже не думайте о нём забывать!"
1005605-100 = "Спасибо... Сенсей."
1005605-101 = "Я рада, что могу на вас рассчитывать."
1005605-103 = "После этого я вернулся в Шале вместе с Сериной, которая почему-то всё время краснела."
