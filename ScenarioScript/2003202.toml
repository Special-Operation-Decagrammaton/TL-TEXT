[translation]
2003202-1 = "Особая тренировка моды"
2003202-2 = ""
2003202-3 = ""
2003202-4 = ""
2003202-5 = ""
2003202-6 = "Фух. Здравствуйте, Сенсей. Спасибо, что нашли время так внезапно."
2003202-7 = "...Что это? Модные журналы, которые я купила в книжном магазине."
2003202-8 = "Я выберу среди них то, что понравится мне больше всего. А потом хочу узнать мнение Сенсея о моём выборе."
2003202-9 = "Варианты, которые пройдут первичный отбор, станут моими новыми нарядами."
2003202-10 = "Считайте это модным PDCA — циклом «планируй, делай, проверяй, действуй»."
2003202-11 = "[s1] «Мода — не моя сильная сторона, но я постараюсь.»\n[s2] «...Не жди от меня слишком большой помощи.»"
2003202-14 = "Спасибо, Сенсей. Тогда начнём."
2003202-15 = "Вот первый вариант, который я рассматривала."
2003202-16 = ""
2003202-18 = ""
2003202-19 = ""
2003202-20 = "Он немного выбивается из моего обычного гардероба... но говорят, сейчас это самый горячий тренд. Кто не рискует, тот не выигрывает."
2003202-21 = "[s] «Хм... ты уверена, что в таком можно непринуждённо ходить по кампусу?»"
2003202-22 = "Слишком броско? А... А мне казалось, этот образ довольно смелый."
2003202-23 = "Хорошо. Тогда что насчёт этого?"
2003202-24 = ""
2003202-26 = ""
2003202-27 = "Это офисный стиль. Сам по себе скучный, но если убрать нижнюю часть, становится куда эффектнее..."
2003202-28 = "Что? Слишком много открытой кожи для такой погоды? Не волнуйтесь. Поэтому у меня есть гольфы, чтобы не мёрзнуть."
2003202-29 = "А? Дело не только в воздействии погоды?"
2003202-30 = "А, понимаю. Вы переживаете, что без галстука я выгляжу непрофессионально."
2003202-32 = "Особая модная тренировка Эйми продолжалась..."
2003202-34 = "Как вам этот? В журнале его назвали ретро-стилем."
2003202-35 = "Это было модно ещё в прошлый вторник? Тренды могут меняться буквально за несколько дней?"
2003202-36 = "Хм... Это задачка посложнее, чем я думала."
2003202-38 = "А этот как?"
2003202-39 = ""
2003202-41 = ""
2003202-42 = "Говорят, этот наряд гарантированно поможет «закрыть сделку». Идеальная одежда для переговоров с другими школами. Что думаете, Сенсей?"
2003202-43 = ""
2003202-45 = ""
2003202-46 = "Или вот этот? Очень авангардно, правда?"
2003202-47 = "[s] «Эйми, ты уверена, что это вообще журналы о моде?»"
2003202-49 = "Я внимательнее посмотрел журналы, которые принесла Эйми. Все они были либо жёлтой прессой о знаменитостях, либо посвящены самой передовой экспериментальной моде."
2003202-50 = "Поэтому все варианты Эйми либо опережали своё время, либо были откровенно скандальными."
2003202-52 = "Я выбрала те, что выглядели красивыми и модными."
2003202-53 = "..."
2003202-54 = "[s] «Эйми.»"
2003202-56 = "[ns3] «Может, я схожу с тобой за покупками?»\n[ns4] «Тогда найдём наряд, который мы оба сочтём... модным.»"
2003202-57 = ""
2003202-58 = ""
2003202-59 = "Хорошо."
2003202-60 = "Да. Так и сделаем."
2003202-61 = "[s] «Но всё же... Эйми, я заметил, что все твои варианты были больше похожи на купальники, чем на одежду...»"
2003202-62 = "Конечно. Я ведь искала купальник."
2003202-63 = "...Я сказала, что ищу одежду, а не купальники? Сенсей, разве вы не знаете? Купальник — это тоже одежда."
2003202-64 = "[s5] «То, что формально ты права, ещё не значит, что ты права!»\n[s6] «Почему мы ни разу не можем пойти за нормальной одеждой?!»"
2003202-67 = "Вам придётся признать факты, Сенсей. Купальники — это одежда."
2003202-69 = "Так я и пообещал сходить с Эйми за купальником."
2003202-70 = "Ради забавы Эйми выбрала из журналов ещё несколько вариантов. Разумеется, ни один из них не был нормальным нарядом."
