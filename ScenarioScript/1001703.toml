[translation]
1001703-1 = "Болгарский перец и гамбургский стейк"
1001703-2 = "Исполнительный офис академии Красная Зима"
1001703-3 = "Хи-хи, хи-хи-хи..."
1001703-4 = "Му-ха-ха-ха!"
1001703-5 = "Они действительно умеют меня порадовать!"
1001703-6 = "[s] «Что-то хорошее случилось?»"
1001703-7 = "А! Вы заметили, Товарищ!"
1001703-8 = "Как вы, наверное, догадались, сегодня меня ждёт нечто особенное."
1001703-9 = "Это..."
1001703-10 = "Сегодня на обед — гамбургский стейк!"
1001703-11 = "Что это за лицо, Товарищ? Вы не любите гамбургский стейк?"
1001703-12 = "[s] «Нет, люблю.»"
1001703-13 = "Мм, мм! Конечно."
1001703-14 = "Ведь в мире нет людей, которые ненавидят гамбургский стейк!"
1001703-15 = "Более того, гамбургский стейк от Клуба школьных обедов Красная Зима ничем не уступает стейку из дорогого ресторана!"
1001703-16 = "К-конечно, я никогда не ела стейк в настоящем дорогом ресторане, но... наверняка в Кивотосе нет мясного блюда вкуснее нашего школьного гамбургского стейка."
1001703-17 = "А если положить сверху ломтик сыра..."
1001703-18 = "О, и не забудьте яйцо-глазунью!"
1001703-19 = "Хи-хи-хи, не могу дождаться!"
1001703-20 = "Гамбургер! Гамбургер! Вкусный гамбургер! ♪"
1001703-23 = "Столовая академии Красная Зима"
1001703-25 = "Ч-что это..."
1001703-26 = ""
1001703-27 = "Что вы сделали с моим гамбургским стейком?!"
1001703-28 = "П-президент Черино, что-то не так?"
1001703-29 = "Конечно не так! Посмотрите внимательно на этот поднос!"
1001703-30 = "Вы же сказали, что сегодня на обед гамбургский стейк!"
1001703-31 = "Так почему... почему сверху лежит болгарский перец?!"
1001703-32 = "Н-ну, у нас осталось много перца с прошлого раза... Нам пришлось использовать его весь на этой неделе."
1001703-33 = "Тогда надо было просто выбросить его в мусор! Зачем делать такое ужасное с вкусным гамбургским стейком?!"
1001703-34 = "Н-но мясо и болгарский перец хорошо сочетаются. Острота перца уравновешивает жирность мяса—"
1001703-35 = "Не хочу слышать! Члены Клуба школьных обедов совершили преступление, испортив мой долгожданный гамбургский стейк. Они заслуживают чистки сто раз подряд! Всех отправить в бывший институт спецопераций №227!"
1001703-36 = "[s] «Успокойся, Черино.»"
1001703-37 = ""
1001703-38 = ""
1001703-39 = "Что такое, Товарищ?"
1001703-40 = "Как бы сильно вам ни нравился болгарский перец, это неприемлемо!"
1001703-41 = "Что? Говорите, если я буду привередничать в еде, то не вырасту?"
1001703-42 = "И в будущем стану некрасивой, потому что испортится кожа?"
1001703-43 = "Я и так это знаю!"
1001703-44 = "Но... но..."
1001703-45 = "Но я ничего не могу поделать с тем, что болгарский перец невкусный! Он горький!"
1001703-46 = "Как бы вы меня ни убеждали, я просто не могу есть болгарский перец!"
1001703-47 = "[s] «Если просто съешь перец, в следующий раз в городе я куплю тебе пудинг.»"
1001703-48 = ""
1001703-49 = ""
1001703-50 = "П-правда? Можно ограниченный пудинг из L'Oiseau Bleu?"
1001703-51 = "Хм... Съесть перец, чтобы потом поесть пудинг с Товарищем, или вообще его не трогать..."
1001703-52 = "Ба, я же не умру, если съем!"
1001703-54 = ""
1001703-55 = ""
1001703-56 = "*жует* *жует*"
1001703-57 = "А? Он совсем не такой горький, как тот перец, который я пробовала в прошлый раз."
1001703-58 = "Д-да! Мы заранее замариновали перец в соевом соусе..."
1001703-59 = "Наверное, с тех пор мои вкусовые рецепторы повзрослели. Я великолепна!"
1001703-60 = "А? Что вы хотели сказать, президент Клуба школьных обедов?"
1001703-61 = "Ничего, президент Черино! Вы даже едите болгарский перец... Настоящий образ зрелого лидера!"
1001703-62 = "Хи-хи! Даже если будете так мне льстить, дополнительных очков не получите."
1001703-63 = "Я не забуду, что вы положили болгарский перец на мой гамбургский стейк!"
1001703-64 = "Сегодня я возьму два пудинга на десерт!"
1001703-66 = "После этого Черино съела два пудинга, а потом ещё один — для верности."
