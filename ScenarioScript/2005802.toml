[translation]
2005802-1 = "Эрика, покупки"
2005802-2 = "Я пришёл в подземный торговый центр купить канцелярию."
2005802-4 = ""
2005802-5 = "О, Сенсей. Здравствуйте!"
2005802-6 = "[s1] «Рад тебя видеть, Эрика.»\n[s2] «Что ты здесь делаешь?»"
2005802-9 = "В этом торговом комплексе много магазинов необычных товаров."
2005802-10 = "Хотела посмотреть, не завезли ли чего-нибудь нового и милого."
2005802-11 = "Они рекламировали кучу распродаж, всё больше временных магазинов открывается и закрывается..."
2005802-12 = "Но мне не хочется покупать что-то только потому, что это модно, понимаете?"
2005802-13 = "Если просто смотреть без ожиданий, иногда находится вещь, которая идеально подходит именно тебе."
2005802-14 = "Понимаете, о чём я? Что-то, что цепляет лично тебя, даже если никто больше не разделяет этого чувства."
2005802-15 = "[s3] «Понимаю, понимаю.»\n[s4] «Такие вещи бывают.»"
2005802-18 = "Если повезёт, можно наткнуться на редкость, которую обычно трудно найти."
2005802-19 = "В общем, просто бесцельно ходить тоже полезно."
2005802-20 = "Может, встреча с вами здесь — как раз одна из таких вещей."
2005802-21 = "[s] «Раз уж мы оба здесь, хочешь погулять вместе?»"
2005802-22 = "Серьёзно?"
2005802-23 = "Вы уверены? Боюсь, вам будет скучно."
2005802-24 = "Вам интересно узнать больше о моих вкусах?"
2005802-25 = "Ну... Тут мне возразить нечего."
2005802-26 = ""
2005802-28 = ""
2005802-29 = "Пойдём сюда!"
2005802-31 = "Так я и оказался на прогулке по магазинам вместе с Эрикой."
2005802-33 = ""
2005802-34 = ""
2005802-35 = ""
2005802-36 = ""
2005802-37 = ""
2005802-38 = "О, Сенсей! А как вам это?"
2005802-39 = "[s] «Брелок с леопардовым принтом?»"
2005802-40 = "Да! Леопардовый принт не особо популярен, особенно на аксессуарах, так что это удачная находка."
2005802-41 = "[s] «Если подумать, на твоём оружии такой же принт, да?»"
2005802-42 = "Хаха, да. Леопардовый принт меня правда цепляет."
2005802-43 = "Почему?"
2005802-44 = "Хм, ну..."
2005802-45 = "Наверное, потому что ощущается необычно?"
2005802-46 = "Просто брать то, что популярно, не так весело. А выбрать что-то другое — в этом есть ощущение свободы."
2005802-47 = "Мой маленький подростковый бунт, наверное. Хаха."
2005802-48 = "[s5] «Важно находить в себе такие уникальные вещи.»\n[s6] «И понимать, что тебе нравится, тоже важно!»"
2005802-51 = "..."
2005802-52 = "Ого. Сейчас вы правда прозвучали как учитель."
2005802-53 = "Понимать, что мне нравится..."
2005802-54 = "Это сложнее, чем кажется. Не думаю, что мои вкусы настолько устойчивые."
2005802-55 = "Я правда восхищаюсь людьми, которые могут просто сказать: «Я обожаю это» или «Я точно такой человек!»"
2005802-56 = "У меня нет вещей, которые я особенно люблю или ненавижу. Обычно беру то, что понравилось именно в этот момент."
2005802-57 = "Но это не так уж плохо. Значит, я всегда открыта к новому и готова дать чему-то шанс."
2005802-58 = "Хаха, в общем, я решила. Беру это!"
2005802-59 = "[ns] «Я куплю в память о сегодняшнем дне—»"
2005802-60 = ""
2005802-61 = ""
2005802-62 = "Ни за что. Уберите кошелёк!"
2005802-63 = "Я и сама могу себе это позволить."
2005802-64 = "И это наша первая встреча вне академии. Давайте без лишней серьёзности."
2005802-65 = "«Ничего особенного»? Ну вот и я так думаю! Понимаете меня, да?"
2005802-66 = "Фуфу. Спасибо, что погуляли со мной, Сенсей."
