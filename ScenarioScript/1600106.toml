[translation]
1600106-1 = "Asuna 404: мысль не найдена"
1600106-2 = "Асуна в последнее время казалась немного странной, поэтому я решил проверить, как она."
1600106-6 = "Вскоре я заметил Асуну, сидящую вдали на скамейке."
1600106-7 = ""
1600106-9 = ""
1600106-10 = "(пристально смотрит)"
1600106-11 = "[s] «...Асуна?»"
1600106-12 = "О... Эм..."
1600106-13 = ""
1600106-15 = ""
1600106-16 = "*ахает*"
1600106-17 = "А? Что? Господин?! Откуда ты взялся?!"
1600106-18 = "[s1] «Ты в порядке? Что-то случилось?»\n[s2] «В последнее время ты странная.»"
1600106-19 = "О, ха-ха-ха... Ничего серьёзного. Иногда я просто... вот такая."
1600106-20 = "О, ха-ха-ха... Ничего серьёзного. Иногда я просто... вот такая."
1600106-21 = "Если уж на то пошло, самое странное — что вообще ничего не происходит..."
1600106-22 = "А когда ничего не происходит... мне трудно сосредоточиться на этом самом „ничего“."
1600106-23 = "[s3] «Это из-за звериных инстинктов?»\n[s4] «Если слишком долго не получать стимуляции...»\n[s5] «Инстинкты притупляются, верно?»"
1600106-24 = "Хм. Думаешь?"
1600106-25 = "Хм. Думаешь?"
1600106-26 = "Хм. Думаешь?"
1600106-27 = "Звучит достаточно правдоподобно... наверное?"
1600106-28 = "В общем, когда мне не о чем думать, я просто... не думаю, наверное."
1600106-29 = "Например..."
1600106-30 = ""
1600106-32 = ""
1600106-33 = "(пристально смотрит)"
1600106-34 = "...Погоди, а пример чего я сейчас приводила?"
1600106-35 = "[s] «Разве это не немного опасно?»"
1600106-36 = "Да ладно, не волнуйся так. Скоро пройдёт. Такое почти никогда не случается..."
1600106-37 = "Но когда случается, мне и правда нужна чья-то помощь."
1600106-38 = "Хорошо, что ты пришёл, Господин..."
1600106-39 = ""
1600106-41 = ""
1600106-42 = "О, Господин?! А ты давно здесь?"
1600106-44 = "...Я забеспокоился и предложил немного сменить обстановку."
1600106-48 = ""
1600106-49 = ""
1600106-50 = ""
1600106-51 = ""
1600106-52 = ""
1600106-53 = ""
1600106-54 = ""
1600106-57 = "Она шла настолько неуверенно, что мне пришлось держать её за руку, чтобы она не упала."
1600106-58 = "Но даже так Асуна постоянно останавливалась посреди дороги,"
1600106-59 = "так что на несколько сотен метров ушёл почти час."
1600106-63 = "Хм... Эм... Мне становится... как-то..."
1600106-64 = "О... Где я...?"
1600106-65 = "[s6] «Ты почти пришла.»\n[s7] «Ты перед своим общежитием.»"
1600106-66 = "Правда...? Погоди, ты здесь? Господин, зачем ты зашёл...?"
1600106-67 = "Правда...? Погоди, ты здесь? Господин, зачем ты зашёл...?"
1600106-68 = "А...? Предлагаешь мне отдохнуть?"
1600106-69 = "Хм... Похоже, стоит..."
1600106-70 = "Я вроде не настолько устала, но..."
1600106-71 = ""
1600106-73 = ""
1600106-74 = "...Лестница?"
1600106-75 = "Как по лестнице ходят... Вот так...?"
1600106-76 = ""
1600106-78 = ""
1600106-79 = "О...? А...?"
1600106-80 = "[s8] «Асуна!»\n[s9] Поймать её."
1600106-81 = ""
1600106-82 = ""
1600106-84 = ""
1600106-85 = "*туп*"
1600106-86 = ""
1600106-88 = "...А?"
1600106-89 = "Что происходит..?"
1600106-90 = ""
1600106-92 = ""
1600106-93 = "Я... лежу на Господине? Хи-хи..."
1600106-94 = ""
1600106-96 = ""
1600106-97 = "Господин... очень тёплая подушка..."
1600106-98 = "...А?"
1600106-99 = "[s] «...Асуна?»"
1600106-100 = ""
1600106-102 = ""
1600106-103 = "А?!"
1600106-104 = "Ч-что?!"
1600106-105 = "Почему я лежу на Господине?"
1600106-106 = "...А, точно. Я упала? На лестнице? А ты меня поймал?"
1600106-107 = "...Ха-ха-ха! Отличный улов! Со мной такое впервые! Как весело!"
1600106-108 = "Ха-ха... Не очень по-горничному — получать столько помощи. Если бы не ты, я бы упала на пол, а не на тебя."
1600106-109 = "...Я ведь не слишком тяжёлая?"
1600106-110 = "[s10] «Вовсе нет.»\n[s11] «Рад, что тебе лучше, Асуна.»"
1600106-111 = "Правда? Спасибо, Господин!"
1600106-112 = "Правда? Спасибо, Господин!"
1600106-113 = "Падать, оказывается, довольно весело, если падаешь на кого-то."
1600106-114 = "...Хм."
1600106-115 = "Теперь я полностью в порядке!"
1600106-116 = "[s] «Снова обычная Асуна. Я рад.»"
1600106-117 = "Ах!"
1600106-118 = ""
1600106-120 = ""
1600106-121 = "Я вернулась! Полностью вернулась! Господин! Смотри, как плавно я двигаюсь! Смотри на руки! На ноги!"
1600106-122 = ""
1600106-124 = ""
1600106-126 = ""
1600106-128 = "Смотри! Я даже прыгать могу! Как лягушка! Или что-нибудь ещё прыгучее!"
1600106-129 = ""
1600106-132 = ""
1600106-133 = "Прыгательная сила, вперёд!"
1600106-134 = "«(...?)»"
1600106-135 = "«(...!!!)»"
1600106-136 = ""
1600106-138 = ""
1600106-144 = "― Хи-хи, я забралась на Господина![wa:920]"
1600106-146 = "― Моё тело! Такое лёгкое! Теперь возможно всё![wa:1040]"
1600106-149 = "[ns12] «Т-ты опять сломалась?!»\n[ns13] «А! Не ешь меня!»"
1600106-150 = "― Хм... Это чувство...?[wa:2780]"
1600106-151 = "― Хм... Это чувство...?[wa:2780]"
1600106-154 = "― А, ну и ладно!"
1600106-156 = "― Та-дам! Асуна вернулась и готова к бою![wa:850]"
1600106-159 = "― Всё благодаря тебе, Господин! Спасибо![wa:950]"
1600106-162 = "― Ха-ха, когда Господин рядом, моё сердце[wa:710]"
1600106-164 = "― просто сходит с ума!"
1600106-167 = "― К этому я могла бы привыкнуть![wa:540]"
1600106-170 = "― Так что... давай и дальше так, ладно?[wa:2870]"
1600106-173 = "― Удачи нам обоим, мой господин![wa:10]"
1600106-176 = "Так я проводил вновь ожившую Асуну и вернулся в кабинет."
