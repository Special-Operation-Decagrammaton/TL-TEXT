[translation]
10048090-1 = "Эпизод 9;Мне не нравится такая концовка"
10048090-2 = "Парк Вайлдханта"
10048090-3 = "Миё подробно объяснила Акире задание Картеля свободной торговли..."
10048090-4 = "...А солнце скрылось за горизонтом, уступая место ночи."
10048090-5 = "Вы, девочки, считали, что в хранилище лежит подделка..."
10048090-6 = "...А клиентка, движимая благородными намерениями, передала вам настоящий шедевр?"
10048090-7 = "...Именно. Теперь я понимаю, что всё было наоборот."
10048090-8 = "Да. Она дала вам подделку, причём весьма посредственную."
10048090-9 = "Эм, н-но вот чего я не понимаю."
10048090-10 = "Зачем ей было просить нас об этом? Где выгода?"
10048090-11 = "Я бы поняла, если бы она хотела, чтобы мы украли НАСТОЯЩУЮ работу и принесли ей. Я бы, конечно, отказалась."
10048090-12 = "Но она хотела, чтобы мы повесили подделку в галерее и уничтожили настоящую картину."
10048090-13 = "...И всё это за НЕПРИЛИЧНО большую сумму, между прочим."
10048090-14 = "Зачем платить столько, ничего не получая взамен?"
10048090-15 = "Я не понимаю мотива."
10048090-16 = "Никто ничего не получил бы... кроме нас. Мир просто так потерял бы шедевр."
10048090-18 = "Есть вещи, вроде убеждений и ценностей, которые стоят дороже денег."
10048090-19 = "Вашей клиенткой, несомненно, двигало сильнейшее желание."
10048090-20 = "...Полагаю, это желание мне не понять."
10048090-21 = "Единоличному желанию не нужны ни убеждение других, ни зрители."
10048090-22 = "Однако я могу предположить."
10048090-23 = "...?!"
10048090-24 = "Ваша клиентка хотела, чтобы именно эта подделка оказалась на выставке, где ею будут восхищаться массы."
10048090-25 = "Вероятно, она хотела что-то этим доказать."
10048090-26 = "Возможно, она хотела высмеять людей, заставив их восхищаться подделкой."
10048090-27 = "Или... возможно, она хотела продемонстрировать свои... бредовые... навыки фальсификатора."
10048090-28 = "Это же так извращённо!"
10048090-29 = "Ты обо мне сейчас или...?"
10048090-30 = "Нет, я-я...!"
10048090-31 = "Изначально ваша миссия, насколько вы знали, заключалась в том, чтобы заменить подделку настоящей картиной."
10048090-32 = "А меня вы решили удобно использовать как... службу утилизации?"
10048090-34 = "...М-Мы не хотели вас оскорбить."
10048090-35 = "Я и не оскорблена. Вы доверяли моим навыкам и знали, что я украду её чисто..."
10048090-36 = "Вы считали меня компетентной, но предсказуемой. Я оставила визитную карточку... и вы поняли послание."
10048090-37 = "Э-Это..."
10048090-38 = "Не стоит так неловко себя чувствовать."
10048090-39 = "Я нарушила правила, как и вы. Эта... неловкость была естественным последствием."
10048090-40 = "...Но почему ты продолжаешь это делать? Почему просто не остановиться и не... соблюдать правила?"
10048090-41 = "Красть искусство..."
10048090-42 = "Да, это определённо против правил."
10048090-43 = "Но всегда ли правила верны? Всегда ли справедливы?"
10048090-44 = "Не думаю."
10048090-45 = "Правила застаиваются и устаревают, отстают от времени и не учитывают перемены..."
10048090-46 = "Очевидно, вы двое тоже не видите смысла в КАЖДОМ правиле Вайлдханта."
10048090-47 = "...Даже не начинай. Ты же знаешь, что они даже не позволяют —"
10048090-48 = "Заткнись."
10048090-50 = "Так что пусть я и не подчиняюсь правилам, свои действия я считаю полностью оправданными."
10048090-51 = "...Это правила не сумели поспеть за мной."
10048090-52 = "..."
10048090-53 = "Я считаю, что искусство должно быть доступно каждому."
10048090-54 = "Поэтому я против того, чтобы его копили как личную собственность."
10048090-55 = "Вот почему я «краду» искусство."
10048090-56 = "Хотя... это не столько «кража», сколько «освобождение»."
10048090-57 = "Т-Тогда можно тебя кое о чём спросить?"
10048090-58 = "Разумеется."
10048090-59 = "...Те произведения, которые ты «освободила»... Где они сейчас?"
10048090-60 = "К сожалению, большинство людей пока не осознают истинную ценность искусства."
10048090-61 = "Очень немногие обладают чувством прекрасного."
10048090-62 = "Но я верю..."
10048090-63 = "Однажды люди пробудятся. Они повзрослеют, начнут видеть сердцем и признают истинную красоту."
10048090-64 = "...До того дня я буду надёжно хранить и защищать освобождённые произведения искусства."
10048090-65 = ""
10048090-67 = ""
10048090-68 = ""
10048090-69 = "Ты никому не доверяешь."
10048090-70 = "А почему должна?"
10048090-71 = "Разве ты сама не такая же?"
10048090-72 = "Если бы Сенсей за меня не поручился, ты бы мне никогда не поверила."
10048090-73 = "Это..."
10048090-74 = "...Погоди? А чем тогда она отличается? Она тоже всё складирует. Она просто СОБИРАЕТСЯ ОСТАВИТЬ себе всё украденное?"
10048090-75 = "ЗАТКНИСЬ."
10048090-76 = "А теперь, когда мы все всё понимаем..."
10048090-77 = "...вывод одновременно очевиден и изящен."
10048090-78 = "...Правда?"
10048090-79 = "Моя цель — получить подлинное произведение искусства."
10048090-80 = "...Ваша — получить оплату."
10048090-81 = "Эти цели друг другу не мешают. Более того, сотрудничество позволит добиться обеих."
10048090-82 = "...Объясни подробнее."
10048090-83 = "Я оставлю подделку, будто выронила её в неуклюжей попытке сбежать. Префектурный совет найдёт её и будет праздновать победу."
10048090-84 = "После этого картину повесят на выставке, а Совет, которому совсем не захочется терять лицо, очень кстати забудет отправить её на повторную экспертизу."
10048090-85 = "...А что будет с настоящей?"
10048090-86 = "Естественно, она останется у меня."
10048090-87 = "..."
10048090-88 = "Ох, не надо так тревожно смотреть."
10048090-89 = "О подделке никто никогда не узнает."
10048090-90 = "Вы образцовые студенты Вайлдханта, а ведь даже вы ничего не заметили."
10048090-91 = "...!"
10048090-93 = "...Не будем делать поспешных выводов."
10048090-94 = "Мы и так потратили достаточно времени."
10048090-95 = "Прощайте!"
10048090-96 = "...Погоди."
10048090-97 = "Уже достаточно поздно."
10048090-98 = "И Сенсей, было безмерно при—"
10048090-99 = "Это была не просьба."
10048090-100 = "...Что?"
10048090-101 = "Сейчас же."
10048090-102 = "Лес падает."
10048090-104 = "Лес... падает?"
10048090-105 = ""
10048090-107 = ""
10048090-108 = "ПА-А-А-АДАЕТ!!"
10048090-109 = ""
10048090-111 = ""
10048090-119 = "[ns] «Дерево упало?!»"
10048090-120 = "(Эта девушка...)"
10048090-121 = "(Она свалила дерево одним ударом голых кулаков...?)"
10048090-122 = "(И перекрыла мне путь к отступлению... Впечатляет.)"
10048090-123 = "Ха-ха. Умная девочка, ты меня переиграла."
10048090-124 = "А то! Потому что я Усуба Рицу!"
10048090-125 = "Зачем ты... Вот для чего мы придумали кодовые имена!"
10048090-126 = "Приятно познакомиться, Воришка!"
10048090-127 = "Вориш...ка..?"
10048090-128 = "...Фуфу. Мне тоже приятно, мисс Рицу."
10048090-129 = "А что до тебя... Полагаю, мне стоит выслушать твою просьбу."
10048090-131 = "Я прошу лишь о небольшой рецензии от коллеги."
10048090-132 = "...Видишь ли, я пишу эту историю, и мы все в ней."
10048090-133 = "Это мой сюжет, моя стратегия и..."
10048090-134 = "...моя работа."
10048090-135 = "Очевидно, контрабанда мне не нравится."
10048090-136 = "Мне не нравится нарушать правила или строить преступные планы."
10048090-137 = "...И всё же, пусть это и не мой любимый жанр, у меня всё ещё есть художественные принципы."
10048090-138 = "Такая концовка тревожная и открытая. Ничего важного так и не разрешилось."
10048090-139 = "Закончить всё смешком, когда каждый поймёт, что его обманули, а затем получить сомнительную плату..."
10048090-140 = "Как писатель я не могу принять такую наспех слепленную... халтуру!"
10048090-141 = ""
10048090-143 = ""
10048090-144 = ""
10048090-145 = "И...?"
10048090-146 = "Предлагаешь правку, дорогой автор?"
10048090-147 = "Верно."
10048090-148 = "Я никогда не делаю намёков, не продумав развязку."
10048090-149 = "Поэтому... пожалуйста, выслушай моё предложение."
10048090-150 = "Если ты готова сотрудничать, думаю, мы обе сможем согласиться на..."
10048090-152 = "...пари."
