[translation]
211010-1 = "Episode 1;Gehenna is Peaceful Today, Too"
211010-3 = "[ns] \"Today, just like any other day...\""
211010-4 = "Liiiike I saaaid!!"
211010-6 = "Gehenna Plaza"
211010-11 = "Ugh, this is going nowhere!#nI guess I'll just have to solve it this way!"
211010-24 = "[ns] \"...That's Gehenna for you.\""
211010-32 = "That's enough!"
211010-36 = "The Prefect Team!?"
211010-37 = "Wait, wait, wait!#nThere's a reason for this...!"
211010-38 = "...What is it?"
211010-39 = "You see those oil drums over there?#nThose were my creations!"
211010-40 = "And?"
211010-41 = "I was trying to build the coolest 'Tower of Explosive Flames' ever.#nI was going to stack the drums one by one and blow them all up at once."
211010-42 = "And guess what this idiot did!?#nShe shot them before I could! Can you believe it!?"
211010-43 = "I just felt like shooting them...#nBesides, it's your fault for making a target that practically screams 'shoot me'."
211010-44 = "Liiiike I saaaid! I was the one who was supposed to shoot them!#nWhy are you stealing my fun!?"
211010-48 = "For starters, stacking oil drums in the plaza and blowing them up is prohibited.#nI've told you time and again to stop causing disturbances in public!"
211010-53 = "Ugh, you're way too strict."
211010-54 = "It's like, suffocating or something..."
211010-55 = "You can breathe just fine without causing a ruckus, can't you?"
211010-56 = "I'm going to suffocate in this stifling atmosphere!"
211010-60 = "What are you even talking about..."
211010-67 = "What is all this noise about!"
211010-68 = "Dealing with the Pandemonium Society is already a headache enough, so please stop causing trouble."
211010-69 = "Did they say something to you again?"
211010-70 = "We've been ordered to conduct a full inspection of the Prefect Team's equipment by tomorrow.#nThey claim we have excessive firepower and that we must return any ammunition with power exceeding 9mm rounds."
211010-71 = "It's not like this is the first time, but... honestly, it's absurd."
211010-72 = "I'm speechless..."
211010-77 = "I've been wondering about this."
211010-81 = "Why do you just do whatever the Pandemonium Society says?"
211010-82 = "Whatever they say!? How could you say such a thing!!"
211010-83 = "If you wanted to, couldn't the Prefect Team leader just do whatever she wants?#nSo, I'm wondering why you're following their orders."
211010-84 = "Sigh..."
211010-88 = "And what would we gain by overturning them with force?"
211010-92 = "Huh?"
211010-93 = "If we defeated them, then what?"
211010-94 = "What do you mean, 'then what'..."
211010-95 = "If you win, you win, right?#nDoesn't that mean you can do whatever you want?"
211010-96 = "Yeah, exactly! That sounds awesome, right?"
211010-100 = "So... you're saying that because we have the power, we should be allowed to do whatever we want?"
211010-101 = "If the Prefect Team ran Gehenna exactly as we pleased, it might end up affecting all of you, too, you know?"
211010-102 = "W-what do you mean?"
211010-103 = "For example... what if the leader decreed that 'wearing your uniform sloppily is prohibited'?"
211010-104 = "You would have to tie your tie properly, tuck in your shirt completely, and always wear your jacket."
211010-105 = "That would also be the result of those in power doing whatever they want. Do you still think that's wonderful?#nOf course, the leader is not that kind of person."
211010-106 = "Maybe that's not so great..."
211010-107 = "I wouldn't like that..."
211010-108 = "Even if we have the power, we don't act selfishly."
211010-109 = "Even if we have the power, we maintain the lines that must not be crossed."
211010-110 = "—It is precisely because we have the power that we must maintain those lines."
211010-111 = "That is the policy of the Prefect Team."
211010-112 = "Chinatsu is right."
211010-119 = "Leader...!"
211010-120 = "I'm sorry... I overstepped my bounds..."
211010-121 = "Why? That is what Ako and I are always saying."
211010-122 = "I'm glad you remembered."
211010-123 = "Leader..."
211010-124 = "Thank you."
211010-125 = "Anyway."
211010-126 = "Just because we have power doesn't mean we're allowed to do whatever we want."
211010-127 = "But, I have no intention of over-regulating, either."
211010-128 = "A free—"
211010-129 = "Watching over Gehenna to ensure it remains free without crossing the line.#nThat is the role of the Prefect Team."
211010-133 = "...It is also my promise."
211010-138 = "I-I get it..."
211010-139 = "That's so cool... maybe I should join?"
211010-140 = "Huh? A slacker like you?"
211010-141 = "Ha!? Are you saying I can't do it!?"
211010-142 = "The Prefect Team welcomes anyone.#nWrite an application and bring it to me."
211010-143 = "Ugh, never mind, that sounds like too much work..."
211010-144 = "Then don't say it in the first place!!"
211010-145 = "Heh heh, as ridiculous as ever."
211010-149 = "You...!"
211010-156 = "Sigh... I suppose you couldn't just walk on by."
211010-157 = "No matter how much you try to act cool, there's a limit to what you can do."
211010-158 = "You always resort to violence. That's why you can't even make people follow you from the heart."
211010-159 = "My capacity is far greater than yours, Makoto!"
211010-160 = "Was this just another one of your baseless accusations...?"
211010-161 = "Besides, you're hardly in a position to talk about 'capacity', are you?"
211010-162 = "Take this latest order, for example.#nYou come up with all sorts of excuses to cut the Prefect Team's budget.#nAnd yet, you keep delaying the approval of our operational expenses!"
211010-163 = "I don't have time to deal with such trivial matters!!"
211010-164 = "If you won't do it, then who will!?"
211010-165 = "Gah! The Pandemonium Society is busy! The Prefect Team can wait!"
211010-171 = "...If that's truly the reason, I cannot overlook this."
211010-181 = "Whoa, they're fighting."
211010-182 = "It's the usual."
211010-190 = "Wait!!"
211010-194 = "[ns] \"???\""
211010-199 = "Next Episode;Gehenna Restoration Committee"