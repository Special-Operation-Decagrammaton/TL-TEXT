211010-1 = "Episódio 01;Mais um Dia de Paz em Gehenna"
211010-3 = "[ns] \"Hoje, como em qualquer outro dia――\""
211010-4 = "Já～ fa～lei～ que～ não～!!"
211010-5 = ""
211010-6 = "Praça Central de Gehenna"
211010-7 = ""
211010-8 = ""
211010-9 = ""
211010-10 = ""
211010-11 = "Ah, não vai ter jeito!#nO único jeito de resolver isso é na bala!"
211010-12 = ""
211010-14 = ""
211010-15 = ""
211010-16 = ""
211010-24 = "[ns] \"――É, isso é tão Gehenna.\""
211010-28 = ""
211010-29 = ""
211010-31 = ""
211010-32 = "Paradas aí!"
211010-33 = ""
211010-35 = ""
211010-36 = "O Comitê de Disciplina?!"
211010-37 = "Opa, opa, calma, peraí!#nTem uma explicação perfeitamente lógica pra isso...!"
211010-38 = "......Que explicação?"
211010-39 = "Tá vendo aqueles tambores ali?#nAquilo [ruby=era]ERA[/ruby] a minha obra de arte!"
211010-40 = "E daí?"
211010-41 = "Eu tava montando a 'Torre de Chamas Flamejantes' mais irada de todas!#nEmpilhando tambor por tambor pra detonar tudo de uma vez só!"
211010-42 = "Aí sabe o que essa sem noção fez?!#nAtirou antes de mim!! Dá pra acreditar numa palhaçada dessas?!"
211010-43 = "É que deu uma vontade incontrolável...#nTipo, a culpa é dela de empilhar aquilo com cara de 'por favor, me exploda'."
211010-44 = "E-U! I-A! A-TI-RAR!#nPor que você tinha que estragar a minha diversão?!"
211010-45 = ""
211010-47 = ""
211010-48 = "Pra começo de conversa, é terminantemente proibido empilhar e explodir tambores na praça!#nQuantas vezes preciso repetir para pararem de causar baderna em área pública?!"
211010-49 = ""
211010-51 = ""
211010-52 = ""
211010-53 = "Tsc, quanta chatice..."
211010-54 = "Desse jeito a gente não consegue nem respirar..."
211010-55 = "Dá pra respirar muito bem sem precisar explodir nada, sabia?"
211010-56 = "Num clima sufocante desses qualquer um morre asfixiado!"
211010-57 = ""
211010-59 = ""
211010-60 = "Mas de onde vocês tiram tanta besteira...?"
211010-61 = ""
211010-63 = ""
211010-66 = ""
211010-67 = "Mas que gritaria é essa aqui?!"
211010-68 = "Já não basta a dor de cabeça de aguentar a [ruby=Pandemônio]Sociedade Pandemônio[/ruby], vocês ainda me arranjam confusão?!"
211010-69 = "Elas vieram encher o saco de novo?"
211010-70 = "Exigiram uma auditoria completa de todo o arsenal do Comitê de Disciplina até amanhã.#nDisseram que é 'poder de fogo excessivo' e que devemos entregar qualquer munição acima de 9mm."
211010-71 = "Não que isso seja novidade, mas... sinceramente, é um absurdo sem tamanho."
211010-72 = "Que palhaçada..."
211010-73 = ""
211010-75 = ""
211010-76 = ""
211010-77 = "Ei, posso perguntar uma parada?"
211010-78 = ""
211010-80 = ""
211010-81 = "Por que vocês sempre abaixam a cabeça pra Pandemônio?"
211010-82 = "Abaixar a cabeça?! Olha o respeito, garota!!"
211010-83 = "Se quisesse, a Presidente do Comitê de Disciplina passava o trator nelas num piscar de olhos, não é?#nPor que vocês continuam obedecendo?"
211010-84 = "Ai, céus..."
211010-85 = ""
211010-87 = ""
211010-88 = "E o que resolveríamos derrubando tudo na base da força?"
211010-89 = ""
211010-91 = ""
211010-92 = "Hã?"
211010-93 = "Derrubamos elas... e [ruby=depois]depois[/ruby]?"
211010-94 = "Ué, depois..."
211010-95 = "Quem ganha manda, ué!#nNão dá pra fazer o que bem entender?"
211010-96 = "Pois é! Seria bom demais, não acha?"
211010-97 = ""
211010-99 = ""
211010-100 = "Então... vocês acham correto quem tem força fazer o que quiser sem limites?"
211010-101 = "Se Gehenna ficasse sob os caprichos absolutos do Comitê de Disciplina, isso não sobraria para vocês também?"
211010-102 = "C-Como assim?"
211010-103 = "Por exemplo... e se a Presidente decretasse: 'É proibido alterar ou desleixar o uniforme'?"
211010-104 = "Gravata alinhada até o pescoço, camisa bem enfiada na saia e casaco abotoado obrigatoriamente."
211010-105 = "Isso também seria o resultado de quem tem poder fazendo o que quer. Ainda acham maravilhoso?#nEmbora, é claro, a nossa Presidente jamais faria algo assim."
211010-106 = "Pensando bem, parece meio puxado..."
211010-107 = "Deus me livre, aí não dá..."
211010-108 = "Mesmo tendo força, não agimos por puro capricho."
211010-109 = "Mesmo tendo poder, respeitamos o limite que não se deve cruzar."
211010-110 = "――É exatamente por termos poder que precisamos preservar esse limite."
211010-111 = "Essa é a diretriz do Comitê de Disciplina."
211010-112 = "A Chinatsu disse tudo."
211010-113 = ""
211010-115 = ""
211010-116 = ""
211010-118 = ""
211010-119 = "Presidente...!"
211010-120 = "Peço desculpas... falei mais do que devia..."
211010-121 = "Por que se desculpar? É exatamente o que eu e a Ako sempre defendemos."
211010-122 = "Fico feliz que você guarde isso com tanto carinho."
211010-123 = "Presidente..."
211010-124 = "Muito obrigada."
211010-125 = "Enfim."
211010-126 = "Não vou permitir que ninguém abuse da força só porque a possui."
211010-127 = "Mas também não tenho intenção de policiar cada detalhe da vida de vocês."
211010-128 = "Uma Gehenna livre――"
211010-129 = "Observar de perto para garantir que Gehenna continue livre sem que ninguém cruze a linha vermelha.#nEsse é o papel do Comitê de Disciplina."
211010-130 = ""
211010-132 = ""
211010-133 = "......E é também a minha promessa."
211010-134 = ""
211010-136 = ""
211010-137 = ""
211010-138 = "E-Entendido..."
211010-139 = "Caramba, que moral... Acho que vou me alistar também!"
211010-140 = "Você? A maior gazeadora de aula do ano?!"
211010-141 = "Qual foi?! Tá achando que eu não aguento o tranco?!"
211010-142 = "O Comitê de Disciplina está sempre de portas abertas.#nPreencha a ficha de inscrição e leve até nós."
211010-143 = "Ih, preguiça... burocracia é chato demais, deixa pra lá..."
211010-144 = "Então cale a boca antes de falar besteira!!"
211010-145 = "Kishishi! Patéticas como sempre!"
211010-146 = ""
211010-148 = ""
211010-149 = "Você...!"
211010-150 = ""
211010-152 = ""
211010-155 = ""
211010-156 = "Ai... não consegue passar sem dar um showzinho, né?"
211010-157 = "Não importa quanta pose façam, o limite de vocês é constrangedor!"
211010-158 = "Recorrem à violência na primeira oportunidade! Desse jeito jamais conquistarão as mentes e corações dos alunos!"
211010-159 = "Falta a vocês a envergadura colossal e a grandeza de espírito da magnífica Makoto-sama!"
211010-160 = "A ladainha de sempre, que surpresa..."
211010-161 = "Pra início de conversa, desde quando você tem moral pra falar de 'envergadura'?"
211010-162 = "Essa ordem de agora é a prova viva!#nInventa mil desculpas esfarrapadas pra cortar a verba do Comitê de Disciplina,#ne ainda senta em cima da aprovação das nossas despesas operacionais!"
211010-163 = "Não tenho tempo a perder com ninharias burocráticas!!"
211010-164 = "Se vocês não fizerem isso, quem vai fazer?!"
211010-165 = "Cala a boca! A Pandemônio vive atarefada! O Comitê de Disciplina que espere na fila do pão!"
