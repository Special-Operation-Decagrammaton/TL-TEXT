[translation]
211010-1 = "Эпизод 1;Ещё один мирный день в Геенне"
211010-3 = "[ns] «Ещё один мирный...»"
211010-4 = "Я! Тебе! Говорю!"
211010-5 = ""
211010-6 = "Площадь Геенны"
211010-7 = ""
211010-8 = ""
211010-9 = ""
211010-10 = ""
211010-11 = "Ну, я пыталась! Остался только один способ всё решить... Взрывчатка!"
211010-12 = ""
211010-14 = ""
211010-15 = ""
211010-16 = ""
211010-24 = "[ns] «...день в Геенне»."
211010-28 = ""
211010-29 = ""
211010-31 = ""
211010-32 = "А ну, обе стойте!"
211010-33 = ""
211010-35 = ""
211010-36 = "Э-это команда Префектов!"
211010-37 = "Погоди, успокойся. Я тут вообще невинная, рассудительная и миролюбивая! Это ОНА начала!"
211010-38 = "Что здесь происходит...?"
211010-39 = "Видишь аккуратно сложенные вон там металлические бочки? Это я их расставила... для своего художественного проекта!"
211010-40 = "И?"
211010-41 = "Сейчас они выглядят не слишком впечатляюще, но я собиралась взорвать их все одновременно. Получился бы столб пламени до небес! Только представь символизм!"
211010-42 = "А ОНА сюда заявилась и начала палить, прежде чем я успела как следует заложить заряды! Да-да, я о ТЕБЕ! Что с тобой не так?"
211010-43 = "Мне что, просто стоять и смотреть? Они были идеально расставлены! Я увидела прекрасную мишень и выстрелила. Как будто ты бы не выстрелила!"
211010-44 = "КОНЕЧНО, ВЫСТРЕЛИЛА БЫ! Поэтому я неделями всё планировала. А ты взяла и испортила всё удовольствие!"
211010-45 = ""
211010-47 = ""
211010-48 = "Послушайте! Нельзя складывать и взрывать бочки прямо на площади! Мы вам что, Вайлдхант?!"
211010-49 = ""
211010-51 = ""
211010-52 = ""
211010-53 = "А похоже. Команда Префектов  просто не даёт житья..."
211010-54 = "И не говори. Вечно к нам цепляются. Уже и вздохнуть нельзя, чтобы не получить выговор."
211010-55 = "Вздыхать можно и без вандализма!"
211010-56 = "Не могу я жить, вдыхая эти жалкие, удушающие крохи воздуха!"
211010-57 = ""
211010-59 = ""
211010-60 = "О чём ты вообще говоришь...?"
211010-61 = ""
211010-63 = ""
211010-66 = ""
211010-67 = "Да что здесь за шум?!"
211010-68 = "Нам и без того головной боли хватает. Ты видела новый приказ Общества Пандемониум?"
211010-69 = "Что на этот раз?"
211010-70 = "Они требуют провести проверку команды Префектов. До завтра мы должны полностью проверить снаряжение и сдать все патроны калибром больше 9 мм."
211010-71 = "Да какое они имеют право?! Такое чувство, будто мы с детьми возимся..."
211010-72 = "Возмутительно..."
211010-73 = ""
211010-75 = ""
211010-76 = ""
211010-77 = "Кстати..."
211010-78 = ""
211010-80 = ""
211010-81 = "Почему вы всё время позволяете Обществу Пандемониум собой командовать?"
211010-82 = "КОМАНДОВАТЬ НАМИ?! Ты это серьёзно?!"
211010-83 = "Ну разве глава Префектов и так не добивается всего, чего хочет? Иногда кажется, что она просто потакает всем требованиям председателя..."
211010-84 = "*вздыхает* Насчёт этого..."
211010-85 = ""
211010-87 = ""
211010-88 = "А что, если бы она победила?"
211010-89 = ""
211010-91 = ""
211010-92 = "А?"
211010-93 = "Что, если бы Хина победила? Если бы она отстранила Общество Пандемониум? И что тогда?"
211010-94 = "Что значит «и что тогда»...?"
211010-95 = "Ну, если бы победила Хина, она бы стала главной и могла делать всё, что захочет?"
211010-96 = "Да! Вот было бы круто. Кому бы это не понравилось?"
211010-97 = ""
211010-99 = ""
211010-100 = "Допустим, ВСЯ власть оказалась бы у нас и мы могли делать всё, что захотим..."
211010-101 = "Если бы Геенной управляла команда Префектов, вы бы наверняка были нами недовольны, как бы мы ни правили."
211010-102 = "А?"
211010-103 = "Что, если бы наша глава приказала всем студентам Геенны носить одинаковую форму? Не то чтобы она так поступила, конечно."
211010-104 = "И заставила бы вас затянуть галстуки, заправить рубашки, надеть пиджаки и перестать носить короткие юбки?"
211010-105 = "Вам бы по-прежнему казалось таким «крутым», что она главная и может беспрепятственно приказывать всё, что захочет?"
211010-106 = "Ну, если так посмотреть..."
211010-107 = "Ну да, весело только тогда, когда Я могу делать всё, что вздумается. Конечно, я не хочу, чтобы мной командовал кто-то другой."
211010-108 = "«Даже обладая властью, я не стану действовать своевольно...»"
211010-109 = "«Даже имея право давить на других, я знаю, где нужно остановиться»."
211010-110 = "«Именно потому, что я обладаю властью, я знаю, какие границы нельзя переступать»."
211010-111 = "Это девиз команды Префектов."
211010-112 = "Хорошо сказано, Чинацу."
211010-113 = ""
211010-115 = ""
211010-116 = ""
211010-118 = ""
211010-119 = "Г-глава Префектов...!"
211010-120 = "А, насчёт этого... Простите за излишнюю патетику."
211010-121 = "Не извиняйся. Мы с Ако тоже часто повторяем этот девиз."
211010-122 = "Я рада, что ты так дорожишь этими словами."
211010-123 = "Это..."
211010-124 = "С-спасибо, глава Префектов..."
211010-125 = "Кроме того..."
211010-126 = "Я не потерплю, чтобы кто-то творил всё, что вздумается, лишь потому, что обладает властью."
211010-127 = "И сама не собираюсь чрезмерно ограничивать свободу студентов."
211010-128 = "Просто..."
211010-129 = "Задача команды Префектов — следить за свободной Геенной, оберегать её свободу и не допускать, чтобы эта свобода переходила допустимые границы."
211010-130 = ""
211010-132 = ""
211010-133 = "...Такова и моя личная клятва."
211010-134 = ""
211010-136 = ""
211010-137 = ""
211010-138 = "П-понятно..."
211010-139 = "Звучит круто. Может, и мне записаться в команду Префектов?"
211010-140 = "Да куда тебе! Как такая лентяйка вообще продержится в команде Префектов?"
211010-141 = "Что? Думаешь, у меня не получится?!"
211010-142 = "Ну-ну. Двери команды Префектов открыты для всех. Просто приходите и заполняйте заявление. У нас даже буклеты есть."
211010-143 = "А, знаешь что? Слишком много возни. Не надо."
211010-144 = "Ну и не надо! Очень мне нужно!"
211010-145 = "Ки-хе-хе, как всегда нелепо."
211010-146 = ""
211010-148 = ""
211010-149 = "Это же вы...!"
211010-150 = ""
211010-152 = ""
211010-155 = ""
211010-156 = "*вздыхает* Ни дня покоя."
211010-157 = "Них, сколько бы вы ни важничали, ваши возможности весьма ограничены."
211010-158 = "Вы можете подавить волю народа угрозами и насилием, но вам не сломить его дух."
211010-159 = "Короче говоря, вам, команде Префектов, чуть что прибегающей к силе, просто не хватает великодушия, чтобы принять всех. В отличие от меня, великой и великодушной Макото!"
211010-160 = "А я-то думала, к чему ты ведёшь. Ты просто нарываешься на ссору..."
211010-161 = "Не вам читать нам лекции о великодушии, председатель Макото!"
211010-162 = "Это вы издали нелепый приказ! Вы урезали квартальный бюджет команды Префектов и постоянно затягиваете утверждение наших текущих расходов!"
211010-163 = "Мне некогда заниматься такими пустяками!!"
211010-164 = "Какие ещё «пустяки»?! Если вы, действующий студенческий совет, не утверждаете расходы, кто тогда должен это делать?!"
211010-165 = "Дела команды Префектов занимают последнее место в горе забот, навалившихся на Общество Пандемониум! Самое последнее! Ниже уровня земли!"
211010-166 = ""
211010-168 = ""
211010-169 = ""
211010-170 = ""
211010-171 = "Макото... Если ты действительно это серьёзно, я не уверена, что смогу спустить тебе такое с рук."
211010-172 = ""
211010-174 = ""
211010-175 = ""
211010-176 = ""
211010-179 = ""
211010-180 = ""
211010-181 = "Ого, опять за своё."
211010-182 = "Всё как обычно..."
211010-183 = ""
