[translation]
42080-1 = "Эпизод 8;Новый заместитель"
42080-2 = "Вход в здание Генерального студенческого совета"
42080-3 = "Услышав трансляцию Каи, я сразу направился в здание Генерального студенческого совета."
42080-4 = ""
42080-10 = "С-Сенсей!"
42080-11 = "Ох, мы в ужасном положении... Рин... Нет, главный администратор...!"
42080-12 = "[s1] «Можешь объяснить ситуацию?»\n[s2] «Успокойся, Аюму. Что случилось?»"
42080-13 = "Эм... Ну..."
42080-14 = "Эм... Ну..."
42080-15 = "Рин арестовали."
42080-16 = "Её обвиняют в подделке письма председателя Генерального студенческого совета ради собственной выгоды и приказе совершать террористические акты против коллег."
42080-17 = "[s] «Письмо, которое председатель оставила перед исчезновением? Как?»"
42080-18 = "Э-Это всё ужасное недоразумение!"
42080-19 = "Никакое не недоразумение. Её подставили. На сто процентов."
42080-20 = "Если бы наша высокоморальная старшая умела хоть немного думать о собственных интересах или самосохранении, Генеральный студенческий совет никогда бы не восстановился и не продолжил работать так, как сейчас."
42080-21 = "Но нет, она слишком занята правильными поступками, вот и попалась на их очевидную схему."
42080-22 = "[s] «А вы обе как? Всё нормально?»"
42080-23 = "Пока держимся..."
42080-24 = "На голосовании сторонники главы Каи практически полностью заглушили остальных."
42080-25 = "Тех, кто пытался защищать невиновность Рин, перекричало большинство, и их фактически вытеснили из процесса..."
42080-26 = "Я всегда жаловалась на работу, но никогда не думала, что увижу день, когда сама её прогуляю..."
42080-27 = ""
42080-29 = ""
42080-32 = ""
42080-33 = "...Вы пришли. Сенсей [USERNAME]."
42080-34 = "Новая временная председательница Генерального студенческого совета ждёт вас."
42080-35 = "Прошу за мной."
42080-37 = "...Я бы дважды подумала на вашем месте, Сенсей."
42080-38 = "Они откровенно ставят ловушку и просят вас самому в неё зайти. Идти туда довольно глупо, не думаете?"
42080-39 = "Вас раздавят как картофельную чипсину."
42080-40 = "[s] «...Я справлюсь. Так или иначе.»"
42080-42 = "[ns] «Просто берегите себя до моего возвращения, Момока. Аюму.»"
42080-43 = "*вздох* Вам повезло, что слепой оптимизм — ваше главное качество."
42080-44 = "Такая бездельница, как я, всё равно не сможет помочь, если вы реально хотите туда идти. Так что осторожнее."
42080-45 = "П-Пожалуйста, берегите себя, Сенсей!"
42080-46 = ""
42080-48 = ""
42080-49 = "Следуйте за мной."
42080-51 = "Кабинет временной председательницы Генерального студенческого совета"
42080-52 = "Здравствуйте, Сенсей [USERNAME]."
42080-53 = "Прошу прощения за неудобства, которые вам доставил беспорядок Генерального студенческого совета."
42080-54 = "Обычно мы бы организовали официальный приём, но я слышала, что вы были заняты."
42080-55 = "С учётом обстоятельств я сочла необходимым обратиться к вам напрямую. Прошу прощения, что пришлось делать это через публичную трансляцию."
42080-56 = ""
42080-58 = ""
42080-59 = "У вас ведь не было срочных планов? Ничего особенного?"
42080-60 = "[s] «Просто несколько дел.»"
42080-62 = "[ns] «...Но прежде — что случилось с Рин?»"
42080-63 = "Главный администратор Рин сейчас находится под стражей в студенческом общежитии."
42080-64 = "Я заняла должность временной председательницы в соответствии с недавно найденным письмом председателя Генерального студенческого совета."
42080-65 = "Буду рада работать с вами ещё теснее, Сенсей."
42080-66 = "[s] «Насчёт этого... Откуда вообще взялось это якобы письмо, Кая?»"
42080-67 = "Его нашли в подвале школы."
42080-68 = "Там мы храним некоторые старые вещи и проекты председателя, например комнату крафта."
42080-69 = "Я вполне понимаю, как это могло затеряться во время передачи полномочий и участия Шале."
42080-70 = "Даже такая, как Рин, может ошибаться."
42080-71 = "[s] «...И этот несанкционированный обыск подвала организовала ты?»"
42080-72 = ""
42080-74 = ""
42080-75 = "На этом этапе отрицать уже бессмысленно."
42080-76 = "Когда переворот погрузил D.U. в хаос, я тайно поручила забрать все оставшиеся в подвале вещи председателя."
42080-77 = "Мне всё это казалось очень странным... Сверхчеловек вроде председателя Генерального студенческого совета исчезает и оставляет именно Рин занимать своё место."
42080-78 = "Я подумала, что мы, обычные студенты, чего-то не понимаем. Что существует какой-то великий план."
42080-79 = "Но именно благодаря этому несанкционированному обыску я наконец раскрыла истинные намерения председателя."
42080-80 = "Знаю, я перешла границы, но..."
42080-81 = "[s] «Но цель оправдывает средства?»"
42080-82 = "Начинаете понимать. Иногда правила и процессы мешают справедливости."
42080-83 = "Люди у власти — не сверхлюди. Их законы слабы. В них полно дыр. И вредители всегда выползают из щелей, чтобы воспользоваться хрупкой системой."
42080-84 = "Чтобы давить таких вредителей, нужны тяжёлые сапоги, Сенсей."
42080-85 = "Кайзер, возможно, немного перестаралась во время оккупации Шале, но это не значит, что их сила была ложью. Скорее наоборот."
42080-86 = "Правильно использовать власть по назначению — естественная часть работы главы обороны."
42080-87 = "Поэтому я намерена использовать полномочия временной председательницы Генерального студенческого совета на полную."
42080-88 = "[s] «Что ты собираешься сделать с Шале?»"
42080-89 = "Что я собираюсь сделать с Шале? Вы выставляете меня настоящей злодейкой, Сенсей."
42080-90 = "Зачем мне вообще что-то менять? Особенно после всего, что вы и ваша маленькая команда сделали для Кивотоса, пока Генеральный студенческий совет был в хаосе."
42080-91 = "Мы ценим ваш вклад и не собираемся проявлять неблагодарность."
42080-92 = "Но любому с глазами очевидно, что вы перерабатываете, Сенсей."
42080-93 = "Да, студенты работают посменно, чтобы облегчать повседневную нагрузку, но сама структура Шале означает, что вы всегда будете разрываться."
42080-94 = "Поэтому «мы» подумали."
42080-95 = "Мы, члены Генерального студенческого совета, размышляли, как могли бы... ну, «помочь» вам. Сенсей."
42080-99 = "[ns] «И как именно вы собираетесь это сделать?»"
42080-100 = "Это предложение по реформированию административной структуры Шале."
42080-101 = "Мы хотели представить его вам на утверждение."
42080-102 = "Главная цель — уменьшить вашу нагрузку и одновременно дать больше полномочий, Сенсей."
42080-103 = "Не спешите, внимательно изучите. Если согласны — подпишите на линии."
42080-104 = "[s] «Что изменится после моей подписи?»"
42080-106 = "Ничего... не изменится, если формально."
42080-107 = "Вы сможете продолжать работать как всегда."
42080-108 = "Проводить дни со студентами, помогать нуждающимся гражданам..."
42080-109 = "Конечно, если больше не хотите работать, тоже ничего страшного. Я не стану осуждать, если решите немного побездельничать, Сенсей."
42080-110 = "Если понадобятся деньги — считайте вопрос закрытым."
42080-111 = "Мы даже возьмём на себя всю эту утомительную бумажную работу. Я помню, как вы ненавидите отчёты."
42080-112 = "...Решение за вами, Сенсей."
42080-113 = "Вам придётся отдать нам лишь одну маленькую вещь."
42080-114 = "Отныне мы будем нести ответственность за ваши действия."
42080-115 = "Вся деятельность Шале будет осуществляться от имени Генерального студенческого совета."
42080-116 = "Что бы вы ни сделали и какими бы ни были последствия для Шале, мы разберёмся с ними."
42080-117 = "Неплохое предложение, правда?"
42080-118 = "Взрослые ведь известны тем, что пытаются уклоняться от ответственности, не так ли?"
42080-120 = "Так что я возьму её всю на себя за вас, Сенсей."
42080-121 = "Можете просто опереться на меня и наконец спокойно вздохнуть."
42080-123 = "[ns] «Спасибо за предложение. Но я это не подпишу.»"
42080-125 = "[ns] «Быть взрослым — значит нести свою ответственность, какой бы тяжёлой она ни была.»"
42080-126 = ""
42080-127 = "...Что, простите?"
42080-128 = "Сенсей, кажется, возникло недопонимание..."
42080-129 = "Наше предложение не пытается вас ограничить. Это не какой-то грязный трюк, чтобы отнять полномочия Шале."
42080-130 = "Мы лишь хотим облегчить вашу работу и дать больше свободы. Вы сможете делать всё, что захотите."
42080-131 = "Разумеется, предложение не высечено в камне. Если какой-то пункт вам не нравится, можем обсудить."
42080-132 = "[s] «Не буду лгать. Предложение заманчивое, Кая.»"
42080-134 = "[ns3] «Но я не могу позволить студентам смотреть мне вслед, пока я убегаю.»\n[ns4] «Но безделье — не лучший пример для моих студентов.»"
42080-135 = ""
42080-136 = ""
42080-138 = ""
42080-139 = "*вздыхает*"
42080-140 = "Вы действительно просто упрямый взрослый."
42080-141 = "Упрямый, жалкий взрослый, настолько потерявшийся в детских идеалах, что не способен принять реальность."
42080-142 = "Управлять такими, как вы, невероятно утомительно..."
42080-143 = "Но хорошо. Пока отложим предложение о реформе."
42080-144 = ""
42080-146 = ""
42080-147 = ""
42080-148 = "Завтра вступят в силу масштабные административные реформы нашего нового кабинета."
42080-149 = "Эти изменения — будущее Кивотоса. Я превращу наше общество в идеально регулируемый новый мир."
42080-150 = "Надеюсь, увидев новый Кивотос в действии, вы передумаете."
42080-151 = "Оборонный отдел... вернее, Генеральный студенческий совет теперь всегда открыт для вас."
42080-152 = "Думаю, скоро увидимся снова, Сенсей."
42080-153 = "[ns] Уйти."
42080-156 = ""
42080-159 = "Следующий эпизод;Новый рассвет D.U."
