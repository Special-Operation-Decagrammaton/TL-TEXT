[translation]
42080-1 = "Episódio 8;Nova Presidente Interina"
42080-2 = "Entrada do Prédio do Conselho Estudantil Geral"
42080-3 = "(Após ver a transmissão de Kaya, vim até o prédio do Conselho Estudantil Geral.)"
42080-10 = "S-Sensei...!"
42080-11 = "É-É terrível... A Rin-senpai... A Rin-senpai...!"
42080-12 = "[s1] \"Calma, Ayumu.\"\n[s2] \"O que aconteceu?\""
42080-13 = "Hã... É que..."
42080-14 = "Hã... É que..."
42080-15 = "A Rin-senpai foi colocada em prisão domiciliar."
42080-16 = "Dizem que ela é suspeita de forjar a carta da Presidente do Conselho Estudantil Geral por interesse próprio,#ne de planejar ataques terroristas contra outros membros."
42080-17 = "[s] \"A carta da Presidente do Conselho Estudantil Geral...?\""
42080-18 = "C-Com certeza é algum mal-entendido...!"
42080-19 = "Mal-entendido nada... Com certeza armaram pra cima dela."
42080-20 = "Se aquela senpai toda certinha agisse por interesse próprio,#no trabalho do Conselho Estudantil Geral nunca teria ficado tão travado assim."
42080-21 = "...Bom, justamente por causa desse jeito dela é que acabou#ncaindo numa armação tão na cara."
42080-22 = "[s] \"E vocês duas, Ayumu e Momoka, estão bem?\""
42080-23 = "Sim... Não sofremos nenhuma consequência direta.#nMas..."
42080-24 = "Assim que a prisão domiciliar da Rin-senpai foi anunciada, cresceram os pedidos na assembleia#npara que a Chefe do Gabinete de Defesa, Kaya, assumisse como Presidente Interina..."
42080-25 = "E quem apoiava a Rin-senpai#nacabou pressionado e expulso do plenário..."
42080-26 = "Eu sei que vivia dizendo que não queria trabalhar...#nMas nunca imaginei que fosse matar serviço desse jeito."
42080-33 = "...Sensei [USERNAME], agradecemos por ter vindo até aqui."
42080-34 = "A \"nova Presidente Interina do Conselho Estudantil Geral\" está à sua espera."
42080-35 = "Por aqui, por favor."
42080-37 = "— Sensei, se eu fosse você, não iria."
42080-38 = "Você perdeu o juízo de ir se enfiar numa armadilha tão óbvia assim?"
42080-39 = "Não venha reclamar depois se sair todo esmagado feito batata chips no fundo do pacote."
42080-40 = "[s] \"...Acho que vai ficar tudo bem.\""
42080-42 = "[ns] \"Eu já vou indo. Momoka, Ayumu.\""
42080-43 = "Haa... Esse seu otimismo despreocupado até que é uma qualidade, Sensei..."
42080-44 = "Bom, não adianta falar mesmo.#nUma preguiçosa como eu não conseguiria ajudar em nada..."
42080-45 = "P-Por favor, tome cuidado, Sensei...!"
42080-49 = "...Por aqui."
42080-51 = "Gabinete da Presidente Interina do Conselho Estudantil Geral"
42080-52 = "Olá, Sensei [USERNAME]."
42080-53 = "Peço desculpas por chamá-lo tão de repente por questões nossas."
42080-54 = "Cheguei a enviar alguém para buscá-lo, mas como parece que o senhor não esteve na Schale hoje à tarde, acabei recorrendo a este meio."
42080-55 = "No momento, há uma questão urgente em andamento no Conselho Estudantil Geral.#nPedi que viesse até aqui porque gostaria de conversar um pouco com você sobre isso.#nMesmo sendo um assunto emergencial, peço desculpas pela abordagem um tanto indelicada."
42080-59 = "...A propósito, surgiu algum compromisso de última hora mais cedo?#nSe bem me lembro, não havia nada marcado na sua agenda."
42080-60 = "[s] \"Só umas coisinhas pra resolver.\""
42080-62 = "[ns] \"...Mais importante, onde está a Rin?\""
42080-63 = "A Administradora Rin está no dormitório por certas circunstâncias."
42080-64 = "E, como anunciei na transmissão, no lugar dela,#natualmente estou exercendo o cargo de Presidente Interina do Conselho Estudantil Geral."
42080-65 = "— Em conformidade com a \"Carta da Presidente do Conselho Estudantil Geral\"."
42080-66 = "[s] \"Onde você encontrou essa carta?\""
42080-67 = "...No subsolo da Schale."
42080-68 = "Lá estavam guardados não apenas a carta, mas também pertences pessoais desconhecidos da Presidente do Conselho Estudantil Geral, como a Câmara de Fabricação, então não há margem para dúvidas."
42080-69 = "Provavelmente houve um pequeno equívoco na hora de transferir a autoridade para a Schale."
42080-70 = "Afinal, até mesmo alguém como a Administradora Rin comete erros de vez em quando."
42080-71 = "[s] \"...Kaya, você entrou no subsolo da Schale sem permissão?\""
42080-75 = "...De fato, não vou negar isso."
42080-76 = "É verdade que, quando o caos tomou conta do D.U. durante o recente golpe de Estado, ordenei que invadissem o subsolo da Schale#ne trouxessem o que a Presidente do Conselho Estudantil Geral havia deixado lá.#n— Tudo para descobrir as verdadeiras intenções dela."
42080-77 = "Sempre tive uma dúvida: por que a Presidente do Conselho Estudantil Geral desapareceu deixando a interinidade nas mãos da Administradora Rin, que está longe de ser perfeita?"
42080-78 = "Pensei que talvez houvesse ali uma intenção que pessoas comuns não conseguiriam compreender.#nCom isso em mente, conduzi a investigação e —"
42080-79 = "Finalmente consegui descobrir o que ela realmente desejava."
42080-80 = "É claro que tenho consciência de que, para isso, acabei invadindo o espaço privado do Sensei. Contudo..."
42080-81 = "[s] \"...Você acha que não tinha outro jeito, então.\""
42080-82 = "Como esperado, fico grata por entender tão rápido.#nO Sensei também sabe, não é? Que existe uma justiça que não pode ser protegida se ficarmos presos às regras."
42080-83 = "A menos que quem as aplica seja um super-humano, as regras invariavelmente acabam se distorcendo.#nE sempre surgirá alguém para se aproveitar dessas brechas."
42080-84 = "Por isso, para eliminar essas pessoas, é necessária uma força poderosa."
42080-85 = "...É verdade que a Kaiser Corporation se empolgou um pouco demais no incidente anterior, mas o poder que eles possuem é inegavelmente real..."
42080-86 = "Portanto, decidi fazer bom uso desse poder."
42080-87 = "Não há motivo para se preocupar, é claro.#nComo Chefe do Gabinete de Defesa, estou acostumada a lidar com o poder."
42080-88 = "[s] \"...E o que você pretende fazer com todo esse poder?\""
42080-89 = "Ora, ora, não faça essa cara tão séria.#nNão precisa se preocupar, não tenho nenhuma intenção de tocar na Schale."
42080-90 = "A Schale resolveu os problemas de Kivotos no lugar de um Conselho Estudantil Geral em caos,#ne conquistou imensa confiança de muitas alunas."
42080-91 = "Deveríamos é agradecer, não há motivo algum para fazermos mal a vocês."
42080-92 = "Porém... também é fato que o Sensei carrega diariamente trabalho e responsabilidades demais."
42080-93 = "Várias alunas vêm fazendo plantões e se esforçando para aliviar a sua carga de trabalho, mas... enquanto não mudarmos a estrutura fundamental da Schale, o peso sobre o Sensei não vai diminuir."
42080-94 = "\"Nós\" também vínhamos refletindo sobre essa questão.#nPensando no que o Conselho Estudantil Geral poderia fazer pelo Sensei."
42080-95 = "E a resposta é —"
42080-99 = "[ns] \"...O que é isto?\""
42080-100 = "É uma proposta de reforma dos procedimentos administrativos da Schale."
42080-101 = "Tem como objetivo principal reduzir a sua carga de trabalho —"
42080-102 = "E, em determinadas funções, chega até a ampliar a autoridade do Sensei."
42080-103 = "Dê uma olhada rápida e, se estiver tudo de acordo,#npor favor, assine aqui."
42080-104 = "[s] \"Se eu assinar aqui... o que vai mudar?\""
42080-106 = "...Nada em especial. Não vai mudar absolutamente nada."
42080-107 = "O Sensei só precisa continuar fazendo o que quiser.#nExatamente como sempre fez."
42080-108 = "Passar o dia a dia com as alunas, ajudar quem estiver em apuros —"
42080-109 = "Mas você nem sequer será obrigado a fazer nada disso.#nMesmo que não faça nada, ninguém irá culpá-lo."
42080-110 = "Se precisar de dinheiro, forneceremos o quanto for necessário."
42080-111 = "Até mesmo os relatórios chatos nós faremos no seu lugar."
42080-112 = "Sim... Tudo ficará inteiramente à sua escolha, Sensei."
42080-113 = "Apenas... me prometa uma única coisa."
42080-114 = "Que, daqui em diante, todas as atividades da Schale serão realizadas em nome do Conselho Estudantil Geral."
42080-115 = "Se concordar com isso,#nassumiremos toda a responsabilidade por tudo o que o Sensei fizer."
42080-116 = "Não importa que crime cometa ou que problema cause...#no Sensei jamais será responsabilizado."
42080-117 = "O que me diz? Não é uma proposta nada ruim, não acha?"
42080-118 = "Afinal, não dizem que adultos detestam assumir responsabilidades?"
42080-120 = "Por isso, eu cuidarei do Sensei."
42080-121 = "Deixe tudo comigo e viva livremente — sem nenhuma preocupação, que tal?"
42080-123 = "[ns] \"Agradeço muito pela proposta, mas vou recusar.\""
42080-125 = "[ns] \"Porque um adulto só é adulto de verdade quando assume responsabilidade pelas próprias palavras e ações.\""
42080-127 = "...Como é?"
42080-128 = "Sensei, permita-me explicar mais uma vez..."
42080-129 = "Esta proposta de reforma serve justamente para libertá-lo."
42080-130 = "Ela não pretende restringi-lo nem limitar a autoridade da Schale..."
42080-131 = "Houve alguma cláusula que o incomodou?"
42080-132 = "[s] \"Realmente parece tentador, mas...\""
42080-134 = "[ns3] \"Mas, se eu mostrar um adulto fugindo das próprias responsabilidades...\"\n[ns4] \"Como Sensei, eu não poderia servir de exemplo para as alunas.\""
42080-139 = "Haa..."
42080-140 = "Francamente, que adulto mais cabeça-dura."
42080-141 = "Desvia o olhar da sociedade e continua se agarrando a fantasias infantis..."
42080-142 = "Não há nada mais cansativo do que lidar com um adulto tão patético..."
42080-143 = "...Entendido. Sendo assim, vamos deixar este assunto em suspenso por enquanto."
42080-148 = "...A partir de amanhã, terá início a reforma administrativa conduzida pelo novo regime do Conselho Estudantil Geral."
42080-149 = "Com essa reforma, Kivotos será perfeitamente controlada por regulamentos#ne renascerá como um \"admirável mundo novo\", seguro e ordeiro."
42080-150 = "Quando vir a nova Kivotos, talvez você acabe mudando de ideia, Sensei."
42080-151 = "Nós do Gabinete de Defesa — digo, do Conselho Estudantil Geral — estaremos sempre à sua espera, Sensei."
42080-152 = "Pois bem, conto com a sua contínua colaboração."
42080-153 = "[ns] Ir embora."
42080-159 = "Próximo;Uma Nova Manhã no D.U."
