[translation]
84303400200-5 = "Я закончила анализ игры."
84303400200-6 = "Теперь понятно, как Отдел разработки игр пропустил этот маленький баг в коде. Он был очень профессионально спрятан."
84303400200-7 = "Как ты, наверное, уже догадалась, он незаметно изменяет игру так, чтобы ты получала худшие возможные результаты."
84303400200-8 = "На первый взгляд игра совсем не сложная, поэтому баг создаёт у людей впечатление, будто они ужасно в неё играют. Бьёт прямо по самолюбию."
84303400200-9 = "Временная шкала тоже совпадает с их показаниями. Как и говорил сам Отдел разработки игр, они не виноваты в происшествии."
84303400200-10 = "...Пока что я продолжу изучать код."
84303400200-11 = "Возможно, там найдётся что-то ещё."
