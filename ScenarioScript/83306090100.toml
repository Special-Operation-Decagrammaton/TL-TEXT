[translation]
83306090100-5 = ""
83306090100-6 = "О, глава префектов. Что привело вас сюда?"
83306090100-7 = "У вас обеспокоенное выражение лица."
83306090100-8 = "Есть проблема?"
83306090100-9 = "Ну... наверное, проблема есть... А может, и нет."
83306090100-10 = "Сегодня у нас с Кирарой дежурство."
83306090100-11 = "Но она, наверное, опять чем-то отвлеклась. Так и не пришла."
83306090100-12 = "Для одного человека работы слишком много, поэтому я думала, как лучше с ней справиться."
83306090100-13 = "Хм... Тогда, может, я помогу?"
83306090100-14 = "Что? Правда? Ну, конечно! ...Но разве вы не заняты тем, что вы, типа, глава префектов? Можете вообще тратить время на дежурство?"
83306090100-15 = "Префектурная команда обязана помогать студентам, которым нужна помощь. Помочь тебе — тоже моя работа."
83306090100-16 = "Ахаха! Ну ладно... Тогда спасибо за помощь!"
