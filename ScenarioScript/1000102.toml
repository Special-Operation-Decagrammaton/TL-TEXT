[translation]
1000102-1 = "Контроль температуры"
1000102-2 = "Внутри здания Миллениума"
1000102-4 = "*вздох* И снова хорошая работа, Сенсей."
1000102-5 = "[s] «Ты тоже неплохо справилась.»"
1000102-6 = "Ну а теперь..."
1000102-7 = ""
1000102-8 = "Эйми внезапно начала раздеваться."
1000102-9 = "[s] «Ч-Что ты делаешь?!»"
1000102-10 = "Хм? Раздеваюсь. А что?"
1000102-11 = "Почему раздеваюсь...? Потому что жарко."
1000102-12 = "Мне нельзя просто снять одежду, если жарко? И как тогда мне охлаждаться?"
1000102-13 = "Самый эффективный способ рассеять тепло тела — снять одежду."
1000102-14 = "[s] «Тебе не стыдно раздеваться на людях?»"
1000102-15 = "Стыдно...? Разве смущение — уважительная причина для провала миссии?"
1000102-16 = "[s] «Всё равно раздеваться нельзя.»"
1000102-17 = "Тогда что ты предлагаешь делать, чтобы охладиться и не раздеваться?"
1000102-18 = "Хм..."
1000102-19 = "[s] «Как насчёт мороженого?»"
1000102-20 = "Мороженое? Да, если съесть что-нибудь холодное, это может сработать... Эффективный способ снизить внутреннюю температуру."
1000102-21 = "[s] «Давай съездим в кафе-мороженое на окраине. Я угощаю.»"
1000102-22 = "Хорошо, но только при условии, что твоё мороженое куплю я."
1000102-23 = "Почему...? Потому что так логично."
1000102-24 = "Хи-хи... Поспешим, Сенсей. Если останемся здесь, только ещё сильнее перегреемся."
1000102-26 = "После этого мы с Эйми пошли за мороженым."
