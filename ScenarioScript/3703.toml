[translation]
3703-1 = "Suspicious Liminal Space (2)"
3703-2 = "This is definitely just someone's prank!#nInvestigation over! Let's head down to the 1st floor and get out of here!!"
3703-7 = "Why isn't it responding!?"
3703-8 = "Maybe it's because we haven't met the rule of 'investigating the abnormal phenomenon' yet..."
3703-11 = "It seems it won't let us leave unless we investigate."
3703-12 = "Hehe. I'm looking forward to seeing what kind of anomalies are here."
3703-13 = "Then let's start with a nearby room."
3703-20 = "This is... a lonely room, isn't it?"
3703-21 = "Doesn't look like anything is out of the ordinary, but—"
3703-25 = "—Wait, why is this computer turned on!?"
3703-26 = "Shall we try waking it from sleep mode?"
3703-27 = "I don't want to do that...?"
3703-29 = "Hiyah!"
3703-33 = "Whoa!? Why is everything bright red!?"
3703-34 = "...Let's leave the room. Quickly."
3703-39 = "Oh... that was a surprise, even if it was just for a moment."
3703-40 = "Hehe. So we just need to keep investigating rooms like this, right?"
3703-41 = "This is truly interesting."
3703-42 = "Shhh! What's so interesting about it! If we fail, we'll be wandering the 8th floor forever, you know!?"
3703-43 = "Ugh... I knew I shouldn't have tagged along..."
3703-44 = "We were supposed to go to the floor above if there was an abnormal phenomenon, right?"
3703-45 = "Yeah... let's go."
3703-52 = "Suspicious Building - 5th Floor Hallway"
3703-57 = "Oh? This floor already has quite the atmosphere!"
3703-58 = "Heh... feels like something is about to jump out at any moment."
3703-59 = "...!!"
3703-60 = "Rena-chan, please get behind me. I'll protect you."
3703-61 = "I'm not scared, you know!?"
3703-62 = "Now then, what could be in here?"
3703-67 = "...Huh? The room is clean."
3703-68 = "There doesn't seem to be anything else here either..."
3703-69 = "Then let's try the next room."
3703-73 = "Oh... this one is clean too."
3703-74 = "An old hallway, and a clean room..."
3703-76 = "The other rooms were just as clean."
3703-77 = "Even after searching every corner, nothing out of the ordinary happened."
3703-79 = "Now, it's time to choose."
3703-80 = "There were no obvious anomalies, but if I had to say, the hallway and the rooms felt different."
3703-81 = "I suppose the question is whether or not to define this as an 'abnormal phenomenon'."
3703-82 = "Liminal spaces are places that make you feel uneasy by nature, so it's difficult."
3703-83 = "What do you think... Rena-chan?"
3703-84 = "If it's that hard, why don't we go down? If we go to the 8th floor, it's game over, right? I don't want that."
3703-85 = "Then we shall go down. Let's head to the 4th floor again!"
3703-92 = "Suspicious Building - 4th Floor Hallway"
3703-95 = "What is this!? It's completely different from before!?"
3703-96 = "Hehe... since we can't see outside, we have no idea what the situation is."
3703-97 = "Uwaaaaaaa...!"
3703-99 = "And so, the adventure to escape the liminal space continued."
3703-101 = "Suspicious Building - 6th Floor Hallway"
3703-112 = "Suspicious Building - 2nd Floor Room"
3703-118 = "Suspicious Building - 3rd Floor Room"
3703-127 = "Suspicious Building - 7th Floor Room"
3703-136 = "Abnormal phenomena continued to occur incessantly—"
3703-137 = "The Occult Research Club members were finally forced to make their final choice at the 7th-floor elevator."
3703-139 = "Suspicious Building - 7th Floor Elevator"
3703-140 = "I can't take it anymore! Even the elevator lights just went out!?"
3703-141 = "Looks like only the button for the 8th floor works..."
3703-142 = "Could it be the work of that suspicious shadow after all...?"
3703-143 = "What shadow!?"
3703-144 = "I don't know... it ran away too fast."
3703-145 = "Eeeek...!!"
3703-146 = "I knew I shouldn't have come! I should have just stayed in the dorm and slept!!"
3703-147 = "It's over... everything is over...!!"
3703-148 = "There's no need to be afraid! We've finally proven that the occult exists!"
3703-149 = "Our adventure starts here!"
3703-150 = "I didn't ask for an adventure like this...!"
3703-151 = "Because nobody told me! That 'liminal spaces' were actually real!!"
3703-152 = "Let me out! Get me out of here!!"
3703-156 = "There is only one choice left—"
3703-157 = "Let's go up.#nWhether despair or hope awaits us... we don't know yet."
3703-158 = "It ends on the 8th floor, right?#nIf that happens, we'll be wandering forever...!!"
3703-159 = "I am not afraid.#nI believe this incident will make everyone's hearts stronger."
3703-163 = "The heart that faces things calmly and without fear at all times is—"
3703-164 = "—'Brave'."
3703-165 = "...That is why!"
3703-166 = "Shhh! Is everyone crazy or something!?"
3703-167 = "Hehe.#nThen... we shall go up."
3703-174 = "Suspicious Building - 8th Floor Hallway"
3703-176 = "...It certainly has an atmosphere. Feels like something is about to jump out."
3703-177 = "S-so, what do we do?"
3703-178 = "I have... a countermeasure."
3703-179 = "Hehehe. I prepared an exorcism spell for a time like this."
3703-180 = "If you have something like that, use it already!?"
3703-181 = "This is a special spell, so it can only be used once.#nI've been saving it carefully for a moment like this."
3703-182 = "I think now is that moment..."
3703-183 = "...Yes. I agree."
3703-186 = "My resolve is set. Is everyone ready?"
3703-187 = "Hehe, of course."
3703-188 = "A-and that will actually work, right!?"
3703-189 = "This is undoubtedly the work of a demon...!#nTsumugi, please lure the demon out!"
3703-190 = "Lure it out... you mean 'that thing', right?"
3703-191 = "Kanoe-senpai, help me exorcise the demon!"
3703-192 = "Heh... leave it to me."
3703-193 = "And finally, Rena-chan, please encourage us with your cheering...!"
3703-196 = "Cheering? What am I supposed to do?"
3703-197 = "Do a cute cat impression!"
3703-198 = "Why!?"
3703-199 = "Because it'll boost our spirits!"
3703-200 = "Me too..."
3703-201 = "Me as well."
3703-204 = "Ugh... fine! I get it! Let's just go all out then!!"
3703-205 = "Then, I shall begin."
3703-209 = "That's the spirit! Next is Rena-chan!"
3703-212 = "M-meow! Meow meow...!!"
3703-216 = "Aha... I'm starting to feel energized..."
3703-217 = "Yes... the mana is filling up..."
3703-218 = "Nyaaa-o...!!"
3703-219 = "(Shhh! What is this!?) "
3703-220 = "The activation conditions are now met!"
3703-221 = "Demon, come out! We shall be your opponents!"
3703-230 = "That is... the shadow we saw earlier..."
3703-231 = "It has finally revealed itself!"
3703-232 = "Alright then, here I go..."
3703-235 = "Abra...!"
3703-236 = "Kadabra—!"
3703-251 = "We did it!"
3703-252 = "—Wait, that's just a gun and a flashbang!"
3703-253 = "But we defeated it, didn't we?"
3703-254 = "Why don't you just surrender...? I think the match is decided."
3703-257 = "Ugh...!"
3703-260 = "I am terribly sorry!!#nPlease, just don't break the set...!"
3703-263 = "T-the set...?"
3703-265 = "The full story of the incident was this—"
3703-267 = "A film set... all of this?"
3703-268 = "Yes.#nWe dream of becoming directors, so we make films using hyper-realism without any CG."
3703-269 = "To realize that ideal, we built this set with like-minded friends."
3703-270 = "We were just checking the set when you all arrived, so..."
3703-271 = "At first, we just wanted to see how it looked...#nHehehe... your reactions were so good, we just kept going."
3703-272 = "How did you do that elevator? And the abnormal phenomena that happened in a row!?"
3703-273 = "The details are a trade secret, but it would be faster if you just looked at this."
3703-277 = "Ta-da."
3703-278 = "So you were controlling it with this. Is this the source of the unease I felt the whole time?"
3703-279 = "Shhh!! You mean we were being teased the whole time...!?"
3703-280 = "So it wasn't the occult after all."
3703-281 = "Hehehe. I don't mind."
3703-282 = "Because it was a fun time, just like magic!"
3703-283 = "Yes, I had fun too."
3703-284 = "As expected, what awaited us was hope, not despair."
3703-285 = "Isn't the fact that we all believed it, even for a second, the real despair here!?"
3703-286 = "Fufu. I'm glad you enjoyed it."
3703-287 = "Yes, I'll give you my contact information. Please let me know if you need anything."
3703-288 = "Also, I'll be using today's recording as reference material for our film production!"
3703-289 = "Reference material!? No! Delete it immediately!!"
3703-290 = "Of course, I won't ask you to do it for free.#n...Take this."
3703-291 = "Are you trying to bribe us? Don't look down on us!"
3703-294 = "—Though, it was a pretty good amount of money to say that."
3703-296 = "Well then, everyone, take care!"
3703-298 = "Inside the elevator going down to the 1st floor—"
3703-299 = "Sigh... why did I have to go through this..."
3703-300 = "I won't be fooled again, that's for sure."
3703-306 = "What's with that look!#nIf you have something to say, just say it clearly."
3703-309 = "Nyaa..."
3703-312 = "Nyaa~"
3703-313 = "Myaao."
3703-314 = "Gah! I told you to forget about that already~~!!"
3703-318 = "Suspicious Building - 4th Floor"
3703-320 = "W-what? Why are we stopping on the 4th floor?"
3703-321 = "A malfunction, perhaps? Well, things like this happen."
3703-329 = "Outside the Suspicious Building"
3703-335 = "Phew... finally out..."
3703-336 = "I really thought it was a real liminal space... I was trembling halfway through!"
3703-337 = "Faithful to the rumors, I'd say. It was a magnificent recreation.#nRight, Rena-chan?"
3703-338 = "Don't ask me! I don't even want to remember it anymore!"
3703-339 = "Heh... let's eat something delicious when we get back."
3703-340 = "...Oh!#nCome to think of it, the elevator stopped on the 4th floor earlier, didn't it?"
3703-341 = "Did you see the blood-stained girl standing on the other side of the hallway?"
3703-342 = "That was some very skillful makeup. Even I was a little surprised by that."
3703-343 = "Hmph, that wasn't scary at all? It was just a prop, right?"
3703-344 = "Hmm...? That's strange."
3703-349 = "What's the matter? Did you forget something?"
3703-350 = "I have a question... on the 4th floor, was there a blood-stained girl?"
3703-353 = "Huh? We didn't use any production like that."
3703-357 = "...Because..."
3703-361 = "Oh my."
3703-362 = "Does that mean it was real!?#nOh... the occult really did exist after all...!!"
3703-363 = "N-no way! Please! Tell me you're lying!!"
3703-365 = "A blood-stained girl witnessed on the 4th floor of a certain building."
3703-366 = "Was she an otherworldly entity drawn to the 'boundary'—"
3703-367 = "Waaaaah! No no no no! That's all a lie~~~!!!"
3703-368 = "Suspicious Liminal Space"
