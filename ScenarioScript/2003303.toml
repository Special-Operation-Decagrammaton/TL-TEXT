[translation]
2003303-1 = "Деловая деятельность Великого председателя"
2003303-2 = ""
2003303-3 = ""
2003303-4 = ""
2003303-5 = ""
2003303-6 = ""
2003303-7 = ""
2003303-8 = "[ns] «...А?»"
2003303-9 = "Председатель Ханума Макото прибыла!"
2003303-10 = ""
2003303-12 = ""
2003303-13 = ""
2003303-14 = ""
2003303-15 = ""
2003303-16 = "Хорошо. Мне нужно обсудить дела с Сенсеем, так что ждите нас снаружи."
2003303-17 = ""
2003303-18 = "Да, председатель!"
2003303-19 = ""
2003303-21 = ""
2003303-22 = "...Я сочла уместным отплатить за оказанное вами уважение и лично удостоить вас своим визитом."
2003303-23 = "[s1] «А... добро пожаловать? Эм, располагайся как дома.»\n[s2] «Эм, может, кофе или что-нибудь ещё?»"
2003303-26 = "Кихехех! С удовольствием приму ваше гостеприимство, Сенсей."
2003303-27 = "Однако... Хмм..."
2003303-28 = "Кихехехех... Так вот он какой, так называемый Исполнительный офис, из которого глава Шале ведёт дела."
2003303-29 = "Он и правда..."
2003303-30 = "[s] «...Да?»"
2003303-31 = "Куда теснее и убогее, чем мне рассказывали!"
2003303-32 = "[s] «Некоторые сочли бы такие слова от гостя довольно оскорбительными.»"
2003303-33 = "Ха! Я бы никогда вас не оскорбила! Я лишь сказала правду!"
2003303-34 = "Вы же понимаете, что у лидера должен быть исполнительный офис, соответствующий его положению!"
2003303-35 = "Невозможно вести дела как следует в таком тесном помещении!"
2003303-36 = "В этом бюрократическом логове даже нет места для статуи, способной передать вашу харизму, Сенсей!"
2003303-37 = "*вздох* Если бы вы только приняли моё предложение о союзе. Тогда к вашим услугам был бы зал для аудиенций, чьи простор и роскошь соответствуют вашему престижу."
2003303-38 = "[s3] «Не знаю... Мне кажется, мой кабинет мне подходит...»\n[s4] «Я не хочу украшать его собственной статуей!»"
2003303-41 = "Как бы то ни было, знайте: я потратила немало времени, обдумывая ваш отказ от моего великодушного предложения!"
2003303-42 = "И после долгих размышлений и совещаний с самой собой мне наконец удалось выяснить причину вашего ответа!"
2003303-43 = "[s] «...Эм, и в чём же, по-твоему, была причина?»"
2003303-44 = "Кихехехех... Для такой, как я, разгадать её было совсем несложно."
2003303-45 = "Потому что Сенсей ещё не осознал весь потенциал Общества Пандемониума! По неведению вы совершили ошибку, от одной мысли о которой большинство людей задрожало бы от страха!"
2003303-46 = "[s] «...Вот как?»"
2003303-47 = "Разумеется, винить Сенсея в этом трудно."
2003303-48 = "Очевидно, я не сумела должным образом передать вам наши амбиции, мощь и чистую силу воли. Вина лежит на мне."
2003303-49 = "Да сама Великая Макото могла бы принять ВАС за выскочку, если бы вы пришли за партнёрством, не разъяснив своих великих достижений и подвигов — ровно как я сейчас не сделала этого."
2003303-50 = "Истинный лидер обязан уметь объективно оценивать любую ситуацию и брать ответственность за собственные ошибки!"
2003303-51 = "Именно поэтому я отбросила привычный возвышенный облик и лично пришла к вам, Сенсей. Наш путь вперёд очевиден:"
2003303-52 = "Я покажу вам, чего достигла Ханума Макото силой Общества Пандемониума, и открою ваши глаза на то, чего способны достичь два лидера нашего уровня, объединив силы!"
2003303-53 = "Я раскрою перед вами всё, Сенсей, вплоть до мельчайших деталей моей организации!"
2003303-54 = "Когда вы поймёте, что именно мы можем вам предложить, вы пожалеете, что отвергли мою руку! Кихехехехех!"
2003303-55 = "[s] «Сильно сомневаюсь, что так будет...»"
2003303-56 = "Довольно! Нам нельзя терять время!"
2003303-57 = ""
2003303-59 = ""
2003303-60 = ""
2003303-61 = "Подайте Сенсею лимузин!"
2003303-62 = "Инспекция операционных объектов Общества Пандемониума начинается прямо сейчас!"
2003303-63 = "[s] «П-Подожди, Макото, у меня ещё работа!»"
2003303-64 = "Кихехехех! Перед лицом грандиозного замысла не стоит переживать о мелочах, Сенсей!"
2003303-65 = "Не могу дождаться, когда на вашем лице появятся шок и благоговение! Вы даже не представляете, какое величие сейчас увидите!"
2003303-66 = "Все — выдвигаемся!"
2003303-67 = "[s] «Ты меня вообще не слушаешь!»"
2003303-68 = ""
2003303-70 = ""
2003303-71 = ""
2003303-72 = ""
2003303-75 = "Так началось моё внезапное похищение Макото — то есть экскурсия по деловым операциям Общества Пандемониума."
2003303-78 = "Кихехехех... Первое направление, которое мой будущий партнёр должен увидеть..."
2003303-79 = "Может быть только это!"
2003303-80 = "[s] «Это... типография?»"
2003303-81 = "Именно. У вас намётанный глаз."
2003303-82 = "Но несмотря на внешний вид... это не просто типография."
2003303-83 = "Это крупнейшая типография в Геенне, которой эксклюзивно управляет Общество Пандемониума!"
2003303-84 = "Всё, что мы здесь печатаем — листовки, книги, газеты, рекламные материалы — распространяет философию Общества Пандемониума..."
2003303-85 = "А значит, прославляет великое имя Ханумы Макото!"
2003303-86 = "[s] «То есть ты хочешь сказать...»"
2003303-87 = "Кихехехех! Теперь вы поняли! Великая Макото держит бумажное издательство и полиграфическую индустрию железной хваткой! И это лишь первый шаг моего плана по контролю над всеми традиционными СМИ!"
2003303-88 = "Пока масштаб невелик... Но я ожидаю экспоненциального роста."
2003303-89 = "Лишь вопрос времени, когда каждый телеведущий и журналист-расследователь Геенны преклонит передо мной колени!"
2003303-90 = "Подумайте, что союзник с такой силой может сделать для вас, Сенсей! Кто ещё в Кивотосе способен управлять индустрией такого масштаба, кроме Великой Макото?"
2003303-91 = "Теперь вы чуть лучше понимаете широту моих возможностей?"
2003303-92 = "[s] «Эм... Да, довольно впечатляюще.»"
2003303-93 = "А?! Как вы можете реагировать так безразлично после всего увиденного?!"
2003303-94 = "[s5] «Я уже видел нечто похожее...»\n[s6] «Размер организации — далеко не всё...»"
2003303-97 = "Ч-Что? ...Сенсей, через какой бардак вам вообще пришлось пройти?"
2003303-98 = "Но... если даже этого недостаточно, чтобы вас убедить..."
2003303-99 = "Прекрасно! Лёгкая победа ничего не стоит! Мы только начинаем!"
2003303-100 = "Вперёд!"
2003303-103 = "А вот и наша следующая операция!"
2003303-104 = "[s] «Стройплощадка? Что здесь строят?»"
2003303-105 = "Кихехех. Позвольте объяснить!"
2003303-106 = "О, наш инвестор! Вы пришли проверить прогресс?"
2003303-107 = "А, строительство идёт по графику?"
2003303-108 = "Ха-ха! Само собой, всё идёт отлично!"
2003303-109 = "Ждите с нетерпением! Скоро перед вами вознесётся небоскрёб, провозглашающий величие Ханумы Макото прямо небесам!"
2003303-111 = "Когда Башня Макото будет завершена, каждый студент Кивотоса будет смотреть на вас снизу вверх!"
2003303-112 = "[s] «Башня... Макото?»"
2003303-113 = "Кихехехех. Да. Как следует из названия, мы возводим небоскрёб, носящий моё имя..."
2003303-114 = "По размеру и масштабу... он превзойдёт даже Башню Санктум Шале!"
2003303-115 = "Прекрасно сказано! Мы приняли вашу страсть близко к сердцу и сделаем всё возможное, чтобы построить небоскрёб, отражающий ваш пыл и щедрые инвестиции!"
2003303-116 = "Скоро... в небе будет господствовать башня, видимая из Геенны, Тринити и Миллениума! Даже Хяккияко и Федеральная академия Красной Зимы окажутся под её тенью!"
2003303-117 = "[s] «Да это физически невозможно?!»"
2003303-118 = "Хмф! Не ожидала услышать от вас такие слабые слова! В руках Великой Макото возможно всё!"
2003303-119 = "Хи-хи. Хотя, если быть точной, строим-то её всё-таки мы."
2003303-120 = "Кихехех! Пустяки!"
2003303-121 = "Хи-хи-хи! Совершеннейшие пустяки! Мы ведь здесь только для того, чтобы исполнять ваши приказы!"
2003303-123 = "Кихехехехех!!!"
2003303-124 = "Хи-хи-хи-хи!!!"
2003303-125 = ""
2003303-126 = "После завершения это здание станет символом Геенны и ориентиром, объединяющим людей из всех академий! Где бы вы ни находились, сможете поднять взгляд и мечтать об одной и той же мечте!"
2003303-127 = "Когда это случится, наши туристические доходы взлетят... и превосходство Общества Пандемониума признают по всему Кивотосу!"
2003303-128 = "Префекторской команде такое и в самых смелых мечтах не под силу... Подобной славы можно достичь лишь волей Великой Макото!"
2003303-129 = "Что скажете, Сенсей?"
2003303-130 = "Хм...? Дизайн крутой, но вы переживаете, что я не продумала детали?"
2003303-131 = "Планирование бюджета и расползание масштаба? Отчёты о реализуемости моих туристических планов...?"
2003303-132 = "Кихехехех! Сенсей, неужели вы и правда беспокоитесь о таких скучных вещах?"
2003303-133 = "[s] «...Разве их можно просто отмахнуть потому, что они скучные?»"
2003303-134 = "Конечно! Неужели вы правда собираетесь ограничивать себя тем, что другие называют «реальностью»?"
2003303-135 = "Великому лидеру следует задавать себе лишь два вопроса: «Хочу ли я это сделать?» и «Будет ли это круто выглядеть?»!"
2003303-136 = "Иными словами, наши прихоти — их приказ!"
2003303-137 = "[s] «Неужели можно вот так просто отмахнуться от всего мира?!»"
2003303-138 = "Хм, понимаю... Возможно, одного строящегося здания недостаточно, чтобы впечатлить Сенсея, каким бы грандиозным ни был проект."
2003303-139 = "К следующей операции!"
2003303-141 = "Несмотря на растущее беспокойство, я продолжил ездить с Макото по операционным объектам."
2003303-143 = "Сейчас Общество Пандемониума владеет временным магазином в этом торговом центре."
2003303-144 = "Мы заполнили его десятками фигурок, плакатов и других товаров с моим образом, чтобы распространять моё великое имя и дать поклонникам способ выразить своё восхищение мной!"
2003303-145 = "И пока железо горячо, я уже планирую огромную распродажу в нашем интернет-магазине! Кто знает, насколько далеко распространится слава Великой Макото!"
2003303-147 = "Кихехехех! Здесь у нас курорт, которым управляет Общество Пандемониума."
2003303-148 = "Помимо специальных скидок для всех гостей, мы бесплатно выдаём им значки фан-клуба Общества Пандемониума, чтобы они забрали их домой!"
2003303-150 = ""
2003303-151 = ""
2003303-152 = ""
2003303-153 = ""
2003303-154 = ""
2003303-156 = "Наша экскурсия завершилась в одном из торговых районов Геенны, где как раз шла самая новая операция Общества Пандемониума."
2003303-157 = "Ну вот, вы увидели масштаб наших операций. Что скажете?"
2003303-158 = "Хочу услышать ваши впечатления. Не сдерживайтесь!"
2003303-159 = "[s] «Эм... У тебя и правда много всего происходит, да?»"
2003303-160 = "Кихехех! Верно сказано! Да, всё именно так!"
2003303-161 = "Даже сейчас я вынашиваю новые, ещё более грандиозные планы, которые увеличат влияние и прибыль Общества Пандемониума!"
2003303-162 = "И не говоря уже о том, чтобы..."
2003303-163 = "Распространять славу Великой Макото!"
2003303-164 = "Конечно, Ироха жалуется каждый раз, когда я единолично что-то финансирую."
2003303-165 = "[s] «Посмотрев на твои операции, я понимаю почему...»"
2003303-166 = "Какая вопиющая невежественность!"
2003303-167 = "Только наступая во всех направлениях, мы сможем затмить Префекторскую команду и утвердить своё превосходство над Геенной... Нет, над всем Кивотосом!"
2003303-168 = "Теперь величие Общества Пандемониума наверняка дошло до вас, Сенсей."
2003303-169 = "Готовы пересмотреть моё великолепное предложение о взаимном союзе?"
2003303-170 = "[s] «Ну, Макото... Прости, но это немного—»"
2003303-171 = ""
2003303-174 = ""
2003303-175 = "Хм? Что это за шум на моих улицах?"
2003303-177 = "Послушайте меня — мы на переднем крае нового тренда мерча! Это просто не может не стать огромным хитом! Этот старый унылый магазинчик будет завален покупателями!"
2003303-178 = "Так вы говорите. Простите, но я не хочу превращать наш торговый район в полигон для странных товаров."
2003303-179 = "Но сэр, этот продукт ведь не от кого попало! Его разработало Общество Пандемониума! Представьте прибыль, если сделка выстрелит..."
2003303-180 = "Молодёжь нынче думает только о деньгах! А как же мои постоянные клиенты? Люди из этого района ходят сюда десятилетиями, они заслуживают большего, чем... вот это всё!"
2003303-182 = "Неужели вы не видите, что времена меняются, сэр?!"
2003303-183 = "Эй вы, что означает этот шум?"
2003303-184 = "А, п-председатель Макото!"
2003303-185 = "Хм. Вы тот дистрибьютор, с которым я встречалась раньше. Проблемы с клиентом?"
2003303-186 = "А, н-ну, дело в том..."
2003303-187 = "Ага! Так это вы стоите за нашествием продавцов, которые толкают по всему району специальный «Подарочный набор Великой Макото» от Общества Пандемониума!"
2003303-188 = "[s] «...Подарочный... набор... Великой Макото?»"
2003303-189 = "А, припоминаю, я одобряла что-то подобное. И что?"
2003303-190 = "В смысле что? Этот магазин — часть истории района! Некоторые мои покупатели ходят сюда с детства! Я отказываюсь превращать его в новый магазин подарков для этих нелепых вещей!"
2003303-191 = "Я прекрасно знаю, что эта недвижимость принадлежит вашей организации... но, пожалуйста, местные покупатели невероятно преданы нам. Они доверяют мне заботиться об их экономических интересах... Я не могу от них отвернуться!"
2003303-192 = "Ага!"
2003303-193 = "Мы за президента!"
2003303-194 = "Не разрушайте наш район!"
2003303-196 = "В-Все! Н-Нельзя так разговаривать с председателем!"
2003303-197 = "Кихехехех... Значит, вы встаёте поперёк моих планов расширения... Вы и правда собираетесь протестовать из-за таких местечковых причин?"
2003303-198 = "Какой совершенно ненужный беспорядок──"
2003303-199 = "[s] «П-Подожди, Макото, не нужно злиться—»"
2003303-200 = "Слушайте меня!"
2003303-201 = ""
2003303-203 = ""
2003303-205 = "Наша цель — возвысить имя Общества Пандемониума и увеличить процветание как нашей организации, так и самой Геенны!"
2003303-206 = "...За исключением Префекторской команды, разумеется."
2003303-207 = "Я хочу принести самые глубокие извинения за неудобства, которые наше расширение вам причинило."
2003303-208 = "У меня нет желания получать прибыль ценой вашего торгового района. Расскажите мне свои претензии, и мы вместе найдём путь вперёд. Все разумные требования будут учтены."
2003303-209 = "А если кто-то из вас потерял сегодня прибыль или зарплату из-за участия в протесте, обещаю полную компенсацию."
2003303-210 = "Вас это устраивает?"
2003303-211 = "Вы и правда так великолепны, как о вас говорят!"
2003303-212 = "...Это правда допустимо? А как же ваши планы расширения? У вас наверняка есть график."
2003303-213 = "Кихехехех! Конечно допустимо! Щедрости и гибкости Великой Макото нет предела!"
2003303-214 = "...Кроме случаев, связанных с Префекторской командой, пожалуй."
2003303-215 = "...Спасибо. Спасибо!"
2003303-216 = ""
2003303-218 = ""
2003303-220 = "Хорошо. Если возникнут другие проблемы, обращайтесь прямо в мой офис."
2003303-221 = "[s] «Макото... это было потрясающе. Я впечатлён.»"
2003303-222 = "А, это? Пустяки."
2003303-223 = "Нельзя добраться до вершины Общества Пандемониума, не умея обращаться с разгневанной толпой."
2003303-224 = "Великий лидер должен принимать такие вещи как должное."
2003303-225 = "Кихехехех... но вы были впечатлены, да? Значит, наконец готовы вступить в союз с Обществом Пандемониума, увидев мои способности, верно?"
2003303-226 = "[s] «Нет, это уже совсем другой вопрос.»"
2003303-227 = "Хмф! Вы излишне упрямитесь!"
2003303-228 = "...Ц. Ладно, пусть будет так."
2003303-229 = "Я понимаю. Вы держитесь выше глупцов, которых легко поколебать одобрением толпы."
2003303-230 = "[s] «Мне кажется, ты сильно меня переоцениваешь...»"
2003303-231 = "Но Великая Ханума Макото так легко не сдаётся!"
2003303-232 = "Очень скоро... Вы будете принадлежать мне, Сенсей!"
2003303-233 = "Кихехех... Кихехехехех!!! Ждите этого дня!"
2003303-234 = "[s] «А, к-конечно. Спасибо за терпение...»"
