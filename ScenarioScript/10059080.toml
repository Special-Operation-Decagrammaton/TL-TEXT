[translation]
10059080-1 = "Episode 8; D-Day"
10059080-2 = "(One week later. D-Day has finally arrived.)"
10059080-4 = "Secret Negotiation Site"
10059080-8 = "[ns] (The tension is immense...)"
10059080-19 = "Well, well, everyone. It has been a long time."
10059080-20 = "I would have preferred to avoid reuniting under these circumstances, though."
10059080-21 = "A larger crowd than I expected."
10059080-22 = "Sigh... I tried so hard to have you leave peacefully back then."
10059080-23 = "Since you've intruded this far, I suppose I have no choice but to take you seriously, don't I?"
10059080-24 = "Is everyone here? I don't see the person who matters most."
10059080-25 = "The Boss is running a little late."
10059080-26 = "A sudden business meeting came up."
10059080-31 = "Ah, speak of the devil. It seems they have just arrived. #nEveryone, please be sure to show proper respect."
10059080-36 = "...Ah. I'll leave the cleanup to you."
10059080-37 = "I made sure it would sink properly. It shouldn't take any extra effort."
10059080-38 = "Well then. I have another appointment."
10059080-42 = "...Hmph."
10059080-47 = "Everyone is here, I see."
10059080-48 = "[s] \"So you're...\""
10059080-49 = "You must be Sensei [USERNAME]."
10059080-50 = "You already know who I am, don't you?"
10059080-51 = "Then let's skip the useless introductions and get started."
10059080-52 = "Time is money, right?"
10059080-53 = "[s] \"First, let's confirm each other's demands.\""
10059080-54 = "Our wish is simple."
10059080-55 = "As of today, you are to withdraw from all illegal transactions involving Wildhunt's works."
10059080-56 = "And never again use art for your business. #nPlease agree to these two points in writing."
10059080-57 = "You will withdraw completely from our academy."
10059080-58 = "...Are you even trying to negotiate?"
10059080-59 = "Hey."
10059080-60 = "Yes! I will handle it!"
10059080-66 = "I don't like this. A mere underling sitting at the negotiation table?"
10059080-70 = "No, it seems you are under a major misunderstanding."
10059080-71 = "In this negotiation, there is nothing you are in a position to demand."
10059080-72 = "This meeting itself exists only through the Boss's goodwill. #nDemanding conditions is far too presumptuous."
10059080-73 = "Quietly accept our terms."
10059080-74 = "...!"
10059080-75 = "Don't make such a scary face."
10059080-76 = "We are here for a \"negotiation\" as well. #nThe Boss is willing to grant at least one of your wishes."
10059080-77 = "Therefore, we will accept your first condition."
10059080-78 = "We will cease all trading of Wildhunt's works #non the black market."
10059080-79 = "However, there is a condition."
10059080-80 = "This is a \"negotiation,\" after all. #nIn exchange, I want the official distribution rights for Wildhunt's works."
10059080-81 = "You want to... officially handle our academy's works?"
10059080-82 = "Yes. Through legal, official channels."
10059080-83 = "If you leave it to me, I think I can sell them for much more than you do now."
10059080-84 = "It's a win-win! An ideal deal that benefits both sides, right?"
10059080-85 = "What do you think? I don't think it's a bad offer."
10059080-88 = "How are we supposed to believe those words?"
10059080-89 = "Contracts don't lie."
10059080-90 = "As the Council President, you should know the weight of a contract."
10059080-91 = "I'll even let you draft the proposal."
10059080-92 = "I think I'm making quite a concession here."
10059080-93 = "...Was that your goal in approaching our academy from the start?"
10059080-94 = "Of course not."
10059080-95 = "What if you break the contract unilaterally?"
10059080-96 = "As the Council President, you should know the weight of a contract, right?"
10059080-97 = "..."
10059080-98 = "I understand perfectly."
10059080-99 = "I apologize for contradicting you, but—"
10059080-100 = "This is not worth discussing."
10059080-101 = "...Huh?"
10059080-102 = "The whole thing started with the despicable act of using students' work for money laundering."
10059080-103 = "And now the culprit wants to earn money by officially distributing Wildhunt's works?"
10059080-107 = "Keep your delusions to your dreams."
10059080-108 = "You dare speak to the Boss like that—!!"
10059080-109 = "Let them say what they want. I'll listen to see how much they can bark."
10059080-110 = "I cannot build any cooperative relationship with someone who only measures the world by money."
10059080-111 = "We don't face art to earn money."
10059080-112 = "We do it to chase our dreams."
10059080-113 = "Do not tarnish the future of students who are struggling to find their own path while purely enjoying creation—#nfor your own convenience."
10059080-114 = "We will never forgive those who trample on our dreams."
10059080-119 = "...Hmph."
10059080-120 = "Sophistry."
10059080-121 = "As the head of the academy, you should know this too."
10059080-122 = "If you have money, you can erase even your crimes. #nIf you don't have money, you're forced to bear the burden of crimes you didn't even commit."
10059080-123 = "Those with money are strong. That is the reality of this world."
10059080-124 = "It seems your world is fundamentally different from the one I know."
10059080-125 = "It would be useless to exchange any more words with you."
10059080-126 = "Oh, oh..."
10059080-127 = "Nice. That's some impressive pride, as expected."
10059080-128 = "You know what the price for that is, don't you?"
10059080-129 = "Of course."
10059080-130 = "Then I'll give you exactly what you want."
10059080-134 = "The negotiation has broken down."
10059080-135 = "Ugh... I, I knew it would come to this..."
10059080-136 = "I never thought they were people you could reason with from the start."
10059080-137 = "Everyone—get ready."
10059080-141 = "I'll crush the Council members. I'll leave the rest to you."
10059080-142 = "Understood!"
10059080-146 = "You lot! Crush them, every last one of them!!"
10059080-154 = "Oh my. Are you sure you should be that confident?"
10059080-155 = "For criminals, you sure have a lot of nerve..."
10059080-156 = "(I should fight as Milia of the Dormitory Guard here.)"
