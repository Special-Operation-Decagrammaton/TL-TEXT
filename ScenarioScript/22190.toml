[translation]
22190-1 = "Эпизод 19; Читер!"
22190-7 = ""
22190-10 = "...!"
22190-11 = ""
22190-13 = ""
22190-14 = ""
22190-15 = "[ns] «Все участницы C&C атакуют, а на ней даже царапины нет...»"
22190-16 = "Повышенная прочность за счёт особого металла... Она не просто выдерживает наши атаки..."
22190-17 = "Она активно нейтрализует их и одновременно контратакует."
22190-18 = ""
22190-20 = ""
22190-23 = "Все снаряды сбиваются, а от атак в слепые зоны она уклоняется манёврами."
22190-24 = "Постойте, это странно. Такой объём данных... невозможен..."
22190-25 = "Вся энергия и вычислительные ресурсы сети Города-крепости Эрид сосредоточены на ней и этом костюме!"
22190-26 = "Если его характеристики усиливаются за счёт такого объёма данных и вычислений... эта штука фактически способна предсказывать ближайшее будущее."
22190-27 = "[s] «Она видит будущее...?»"
22190-28 = "Ч-Что? Звучит как способность финального босса из видеоигры!"
22190-29 = "Это читерство!"
22190-30 = "У-ух..."
22190-32 = "Тут уже даже стратегию или тактику обсуждать бессмысленно..."
22190-33 = "Мы закончим всё, лишив эту разношёрстную компанию переменной, которая их ведёт: их драгоценного Сенсея."
22190-34 = "Да, мэм."
22190-35 = "Сенсей! Бегите! Если президент добьётся своего, нам конец!"
22190-36 = "[s] «Угх...! Но!»"
22190-37 = ""
22190-39 = ""
22190-40 = ""
22190-41 = "[ns] «(Что делать? Как нам её победить?!)»"
22190-42 = ""
22190-46 = ""
22190-48 = "Сенсей... Противник... несмотря на её возможности... привязан к земле..."
22190-49 = ""
22190-52 = "[ns] «!»"
22190-54 = "[ns] «...Нэру! Давай немного сменим поле боя!»"
22190-55 = "Что?!"
22190-56 = "[s] «Наша цель... крыша!»"
22190-57 = "...!"
22190-58 = "Ха...! Поняла, Сенсей!"
22190-59 = ""
22190-61 = ""
22190-66 = "Я схвачу вас и прыгну. Держитесь крепко, чтобы не пораниться!"
22190-68 = "[ns] «Ого!»"
22190-77 = "Они сбежали...! Токи, преследуй!"
22190-78 = ""
22190-110 = "Подтверждаю. Я прибыла на крышу."
22190-111 = "Они выбрали крышу для побега... Умно."
22190-112 = "...Так у вас появится шанс сразиться с Токи в ограниченном пространстве."
22190-113 = "На это вы рассчитывали, Сенсей?"
22190-114 = "[s] «Нет, не только на это.»"
22190-116 = "[ns] «Неру!»"
22190-119 = "...Сверху!"
22190-120 = "Ха!"
22190-121 = ""
22190-123 = "Бесполезно! Выполняю манёвр уклонения...!"
22190-124 = ""
22190-126 = ""
22190-127 = ""
22190-128 = ""
22190-129 = ""
22190-130 = "Ну конечно игрушка вроде этой может носиться как сумасшедшая во все стороны."
22190-131 = "Но только пока стоит на земле, верно?"
22190-133 = "А как ты справляешься в воздухе?"
22190-134 = "...?!"
22190-135 = ""
22190-147 = "...Меня выбросили из здания...?"
22190-149 = "Эй, только не говори, что эта штука ещё и летать умеет?"
22190-151 = "Посмотрим, сможет ли махина такого размера уклоняться во время падения!"
22190-154 = "*тяжело дышит* *тяжело дышит* Где они?! Куда делись?!"
22190-155 = "Нэру и Сенсей точно шли сюда..."
22190-156 = "...!! Ах! Момои! Сверху...!"
22190-157 = ""
22190-159 = ""
22190-166 = "А ну вернись!"
22190-167 = ""
22190-170 = "Незначительный урон от пуль...!"
22190-171 = "Начинаю вычислительную коррекцию гравитационного ускорения при свободном падении."
22190-172 = "Пока поддержка Эрида функционирует, даже падение не ограничит мои движения."
22190-173 = "Начинаю ответный огонь."
22190-174 = ""
22190-178 = "Что за...?! Это ещё что?! Серьёзно?!"
22190-179 = "Уклоняется, скользя в таком тяжёлом снаряжении...!"
22190-180 = "Угх! Не может быть! Это читерство! Чёрт тебя дери!!"
22190-181 = "Нэру."
22190-182 = "Я закончу всё здесь."
22190-183 = ""
22190-186 = "Огонь...!"
22190-187 = "Ага, конечно! Думаешь, я просто приму удар?!"
22190-188 = ""
22190-194 = "(Только что...!)"
22190-195 = "Спина открыта...!"
22190-196 = "Урон после боя... нулевой."
22190-197 = "Возобновляю реагирование."
22190-198 = "...?!?!"
22190-199 = ""
22190-211 = ""
22190-215 = ""
22190-216 = ""
22190-217 = "[ns] «*тяжело дышит* ... *тяжело дышит* ...Нэру!»"
22190-218 = ""
22190-219 = "...Сенсей, что с этой проклятой младшекурсницей?"
22190-220 = "[s] «Токи... Но важнее — Нэру?! Ты в порядке?! Ты ранена...!»"
22190-221 = "...А!"
22190-222 = "Э-Это пустяки..."
22190-223 = ""
22190-225 = ""
22190-227 = "[ns] «Нэру?!»"
22190-229 = "Нэру!"
22190-230 = ""
22190-232 = ""
22190-236 = ""
22190-238 = ""
22190-239 = "Н-Нет... не может быть... Упасть со здания с таким количеством металла... и таким весом..."
22190-240 = "И при этом... ни малейшего признака повреждений..."
22190-241 = ""
22190-243 = ""
22190-244 = "Оружие изначально проектировалось как средство против будущих угроз Кивотосу."
22190-245 = "В нём сосредоточены характеристики всех функций и возможностей Города-крепости. Не будет преувеличением сказать, что это фактически сам Город-крепость."
22190-246 = "Кроме того... это контрмера, подготовленная на случай, если C&C решит предать нас, как сейчас."
22190-247 = "Нэру, ты безусловно превосходный инструмент, но..."
22190-248 = "...ты и участницы C&C под твоим командованием также представляете для меня риск."
22190-249 = "Я должна была подготовиться."
22190-250 = "[s] «Значит, вот каково... истинное назначение этого оружия...»"
22190-251 = "Токи, захвати Сенсея из Шале."
22190-252 = "...Да, мэм."
22190-253 = ""
22190-255 = ""
22190-256 = "Постой, он получил повреждение...?!"
22190-257 = "Слабое место...! Момои! Это наш шанс! Используй то, что получила от Утахи...!"
22190-258 = "Уже работаю!"
22190-259 = ""
22190-261 = ""
22190-262 = "Хия-я-я-я!"
22190-266 = "Цель пытается скрыться. Преследовать?"
22190-267 = "Нет... Не нужно."
22190-268 = "Наша цель — защищать это место оставшееся время."
22190-269 = "...Понятно."
22190-270 = "Нужно лишь подождать. Они перегруппируются и вернутся."
22190-271 = "Они именно такие."
22190-272 = "И когда это случится..."
22190-274 = "...мы сделаем то, что должны."
22190-276 = "Следующий Эпизод: Геймеры и друзья"
