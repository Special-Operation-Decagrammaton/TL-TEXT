[translation]
22190-1 = "Episódio 19;Cheater"
22190-10 = "...!!"
22190-15 = "[ns] \"Mesmo com tantos ataques, não conseguimos fazer nem um arranhão...\""
22190-16 = "A durabilidade foi aumentada com um metal especial... Não, ela não está simplesmente resistindo...?"
22190-17 = "Na verdade, ela está neutralizando todos os ataques...?"
22190-23 = "As balas são abatidas antes de acertarem, e até os ataques de pontos cegos estão sendo desviados..."
22190-24 = "Espera, tem algo estranho.#nEsse volume de dados é... impossível...!"
22190-25 = "Toda a energia e capacidade de processamento da cidade-fortaleza de Eridu estão concentradas naquela \"unidade\"...?!"
22190-26 = "Com esse nível de aprimoramento... ela consegue até... prever o futuro...!"
22190-27 = "[s] \"Prever... o futuro...?!\""
22190-28 = "O-O que é isso?! Isso aí é habilidade de chefão final?!"
22190-29 = "Mas isso é puro cheat!"
22190-30 = "A-Auu..."
22190-32 = "Isso é ruim. Já passamos do ponto em que estratégia ou tática fazem diferença..."
22190-33 = "Sensei, você é a única variável — vou neutralizar sua capacidade de comando e pôr um ponto final nisso."
22190-34 = "Sim, senhora."
22190-35 = "Sensei! Fuja!"
22190-36 = "[s] \"Droga...! Mas...!\""
22190-41 = "[ns] (O que eu faço... Como diabos eu vou virar essa situação?!)"
22190-48 = "Sensei... o alvo é... exclusivo para combate terrestre..."
22190-52 = "[ns] \"!!\""
22190-54 = "[ns] \"...Neru! Vamos mudar o local da luta!\""
22190-55 = "Hã?!"
22190-56 = "[s] \"Vamos para o terraço...!\""
22190-57 = "...!!"
22190-58 = "Ah... Tá legal! Eu confio em você!"
22190-66 = "Então trinca os dentes aí pra não morder a língua!"
22190-68 = "[ns] \"Uaaah!\""
22190-77 = "Fugindo numa hora dessas...! Toki, vá atrás deles!"
22190-110 = "Alvo perseguido. Cheguei ao terraço."
22190-111 = "Logo o terraço do prédio—"
22190-112 = "...Achou que num espaço apertado conseguiria enfrentar a Toki de igual para igual."
22190-113 = "Foi esse o seu julgamento, não é, Sensei?"
22190-114 = "[s] \"Não, não era esse o meu objetivo.\""
22190-116 = "[ns] \"Neru!\""
22190-119 = "...Por cima?!"
22190-120 = "Hah!"
22190-123 = "Isso é inútil! Eu consigo desviar—"
22190-130 = "É, pode ser. Com esse brinquedão gigante aí, você até consegue ficar fugindo."
22190-131 = "Mas isso só vale em terra firme, né?"
22190-133 = "Então, que tal no ar?"
22190-134 = "...?!"
22190-147 = "Tsc... Fui jogada para fora do prédio...?"
22190-149 = "Ei, ei, não vai me dizer que essa coisa também voa, né?"
22190-151 = "Vamos lá, cai dentro!#nQuero ver se você consegue desviar dos meus ataques caindo no ar!"
22190-154 = "Arf, arf...! Aonde diabos os dois foram parar?!"
22190-155 = "Pela direção que eles foram, era para estarem por aqui..."
22190-156 = "...!! A-Ali!#nMomoi, olha pra cima...!"
22190-166 = "Toma essaaa!"
22190-170 = "Atingida... Dano... mínimo...!"
22190-171 = "Iniciando correção de cálculo para aceleração gravitacional."
22190-172 = "Enquanto eu tiver o suporte de Eridu...#nmesmo no ar, minhas ações não sofrem nenhuma restrição."
22190-173 = "Retomando contra-ataque."
22190-178 = "Ai, droga!!#nMas que diabos é isso?!"
22190-179 = "Conseguir lutar até no ar... isso lá existe...?!"
22190-180 = "Aliás, isso é cheat na cara dura, não é?!#nSua desgraçada!! Tá de sacanagem comigo?!"
22190-181 = "Neru-senpai."
22190-182 = "É o fim."
22190-186 = "Fogo total...!"
22190-187 = "Nem ferrando que eu vou cair aqui...!"
22190-194 = "(Agora...!)"
22190-195 = "Suas costas estão completamente abertas...!"
22190-196 = "Danos acumulados em combate... zero."
22190-197 = "Retomando contra-ataque."
22190-198 = "...?!?!"
22190-217 = "[ns] \"Arf... arf...! Neru, você está bem?!\""
22190-219 = "Ah, Sensei... O que aconteceu com ela?"
22190-220 = "[s] \"Ainda não sei como a Toki está... Espera, seus ferimentos...!\""
22190-221 = "...É."
22190-222 = "Isso aqui não é nada..."
22190-227 = "[ns] \"Neru?!\""
22190-229 = "Neru-senpai!"
22190-239 = "I-Impossível... Ela caiu do prédio..."
22190-240 = "E não tem... nem um arranhão..."
22190-244 = "Antes de tudo, este \"Armamento\" foi criado junto com a cidade-fortaleza para nos preparar contra futuras ameaças a Kivotos."
22190-245 = "E ele concentra todas as capacidades da cidade-fortaleza —#nou seja, não é exagero dizer que ele é a própria cidade-fortaleza."
22190-246 = "Além disso... também foi preparado para o caso de vocês, da C&C, nos traírem."
22190-247 = "Neru, você realmente é muito capaz, mas..."
22190-248 = "Você e a C&C que você lidera — sempre foram um fator de instabilidade para mim."
22190-249 = "Por isso, eu me preparei para o caso de um dia como este chegar."
22190-250 = "[s] \"Então esse é o poder... do \"Armamento\".\""
22190-251 = "Toki, recupere o Sensei da Schale."
22190-252 = "...Sim, senhora."
22190-256 = "Isso é... dano à unidade...?"
22190-257 = "Uma brecha...! Momoi! Agora!"
22190-258 = "Sim...! Pode deixar!"
22190-262 = "Iaaaaah!!"
22190-266 = "Fuga do alvo confirmada. Devo persegui-los?"
22190-267 = "Não... não há necessidade de ir tão longe."
22190-268 = "Nosso objetivo é apenas defender este lugar até o prazo final."
22190-269 = "...Entendido."
22190-270 = "Mas eles certamente virão de novo."
22190-271 = "Porque é assim que eles são."
22190-272 = "E quando esse momento chegar—"
22190-274 = "—vamos acabar com tudo de uma vez."
22190-276 = "Próximo;Como Gamer, Como Amiga"
