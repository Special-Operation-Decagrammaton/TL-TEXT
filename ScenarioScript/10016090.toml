[translation]
10016090-1 = "Эпизод 9;Звезда Фестиваля Хало Кивотоса"
10016090-2 = "Здравствуйте, зрители! Захватывающий Фестиваль Хало Кивотоса подходит к концу!"
10016090-3 = "Следующее соревнование — грандиозный финал: школьная эстафета!"
10016090-4 = "Результаты эстафеты определят победителя Фестиваля Хало Кивотоса!"
10016090-5 = "Знаете, обычно к этому моменту мы уже примерно понимаем, кто победит..."
10016090-6 = "О? Кто сейчас лидирует?!"
10016090-7 = "Ну, видите ли... Только не удивляйтесь слишком сильно..."
10016090-8 = "Тринити, Геенна и Миллениум — все на первом месте! У них ничья!"
10016090-9 = "ЧТО?! Ничья без единого очка разницы?"
10016090-10 = "Именно! Обычно в последнем соревновании спортивного фестиваля Тринити и Геенна сражаются друг с другом."
10016090-11 = "Но в этом году Миллениум превзошёл все ожидания и навязал им серьёзную борьбу!"
10016090-12 = "Похоже, нынешняя эстафета будет невероятно напряжённой, так что не пропустите!"
10016090-14 = "Вы сможете посмотреть всё от начала до конца на канале «Кронос»!"
10016090-16 = "Значит, всё решит эта последняя гонка."
10016090-17 = "Каждой школе придётся тщательно выбрать участниц."
10016090-18 = "Эй! Вы слышали? Президент Дисциплинарного комитета Хина пропала."
10016090-19 = "Да ладно? Что с ней случилось?"
10016090-20 = "Просто исчезла? Надеюсь, ничего плохого не случилось..."
10016090-21 = "Но разве это не значит, что в последней гонке у нас проблемы? Представлять Геенну лучше Хины было некому!"
10016090-22 = "Серьёзно... Надеюсь, это не значит, что у нас совсем нет шансов."
10016090-23 = "Это был наш единственный шанс обойти Тринити..."
10016090-24 = "Президент Дисциплинарного комитета Геенны Хина пропала...?"
10016090-25 = "Надеюсь, с ней всё хорошо, но если сильнейшая участница Геенны выбыла..."
10016090-26 = "Шансы Тринити на победу выросли."
10016090-27 = "Если поставить быстрых бегуний вперёд и создать отрыв, мы сможем захватить лидерство и победить."
10016090-28 = "Сейчас у нас есть Казуса из Клуба сладкоежек после школы и Сузуми из Отряда бдительности."
10016090-29 = "Они должны справиться."
10016090-30 = "И, конечно, важную роль финишера можно отдать Цуруги."
10016090-32 = "Комната участниц Тринити"
10016090-33 = "Не-а. Не буду."
10016090-34 = "Ч-что ты имеешь в виду? Почему?!"
10016090-35 = "Ты получила травму в прошлом соревновании?"
10016090-36 = "Конечно нет. Думаешь, я могу получить травму?"
10016090-37 = "Просто я уже сделала свою часть на этом спортивном фестивале."
10016090-38 = "Пусть и другие студенты поиграют."
10016090-39 = "Цуруги... Ты устала?"
10016090-40 = "Нет-нет. Я не устала! Просто..."
10016090-41 = "Ух, ну... Этот Фестиваль Хало ведь должен быть для всех, да?"
10016090-42 = "Не думаю, что правильно участвовать во всех соревнованиях только потому, что я наша сильнейшая участница."
10016090-43 = "Было бы весело поучаствовать ещё, но многие студенты Тринити вообще ни разу не вышли на поле."
10016090-44 = "Это..."
10016090-45 = "И хуже того, тот, кто бежит последним этапом эстафеты, оказывается в центре всеобщего внимания..."
10016090-46 = "Мне не нравится, когда... все на меня смотрят..."
10016090-47 = "...Я понимаю твою точку зрения. Но где мы найдём замену так срочно?"
10016090-49 = "...Замену?"
10016090-50 = "Хасуми, почему бы не тебе?"
10016090-51 = "Что?!"
10016090-52 = "Мне? Бежать последней?!"
10016090-53 = "Да... Почему это тебя удивляет?"
10016090-54 = "Цуруги, у нас нет времени на такие шутки!"
10016090-55 = "Ты ведь понимаешь, что эта эстафета определит, какая академия выиграет весь фестиваль?"
10016090-56 = "Все стараются выставить своих лучших спортсменок, а я для этого совершенно не подхожу."
10016090-57 = "Прошу прощения, что перебиваю..."
10016090-58 = "Но я согласна с Цуруги."
10016090-59 = "...И ты тоже, Маширо?!"
10016090-60 = "Почему..."
10016090-61 = "Почему вы все так хотите меня опозорить?!"
10016090-63 = "О-опозорить вас?!"
10016090-64 = "Мы вовсе не это пытаемся сделать..."
10016090-66 = "Ты прекрасно знаешь, что я далеко не самая быстрая."
10016090-67 = "Даже если Тринити выставит сильнейших бегуний, а Миллениум — слабейших, у меня нет способностей, чтобы соревноваться в беге."
10016090-68 = "Тринити может проиграть весь фестиваль из-за того, что такая, как я, не справилась с самым важным соревнованием дня."
10016090-69 = "Как вы ожидаете, что я взвалю на себя такую ответственность?!"
10016090-70 = "...Неужели победа настолько важна?"
10016090-72 = "Конечно!"
10016090-73 = ""
10016090-75 = ""
10016090-76 = "Перед участием в этом спортивном фестивале я уделила время изучению истории и идеологии Фестиваля Хало Кивотоса."
10016090-77 = "Этот спортивный фестиваль давно служит местом, где студенты Кивотоса проверяют пределы своих возможностей и потенциал."
10016090-78 = "Но поскольку физические особенности у всех разные, Фестиваль Хало Кивотоса на протяжении лет постоянно пересматривал правила, чтобы обеспечить честные и равные условия для всех."
10016090-79 = "Но если ради победы превыше всего мы начнём давать отдельным спортсменкам больше возможностей из-за их врождённых физических данных..."
10016090-80 = "Можно ли тогда вообще назвать такой Фестиваль Хало Кивотоса «честным»?"
10016090-81 = "Можно ли вообще назвать это справедливостью?!"
10016090-82 = "Я... Пожалуй, понимаю твою мысль."
10016090-83 = ""
10016090-85 = ""
10016090-86 = ""
10016090-87 = "Есть ещё одна причина, почему я согласна с Цуруги..."
10016090-88 = "Хасуми, ты весь день была так занята обязанностями Исполнительного комитета, что ни разу не смогла поучаствовать в соревнованиях, верно?"
10016090-89 = "Ты работала усерднее всех, чтобы фестиваль прошёл гладко, но ни разу не попала в кадр и не получила никакого признания."
10016090-90 = "Я считаю, Хасуми заслуживает шанса показать всему Кивотосу, насколько ярко она может сиять, в самом последнем соревновании дня!"
10016090-91 = "Я-я хочу увидеть, как Хасуми соревнуется!"
10016090-92 = "Ага! Я тоже!"
10016090-93 = ""
10016090-95 = ""
10016090-96 = ""
10016090-97 = ""
10016090-100 = "Мне кажется, куда больше похвалы заслуживает стрельба Хасуми."
10016090-101 = ""
10016090-103 = ""
10016090-104 = "Неважно, союзники мы или враги. Пока мы можем играть с тобой, будет весело!"
10016090-105 = ""
10016090-107 = ""
10016090-108 = "«Думаю, новый опыт был бы весёлым.»"
10016090-109 = ""
10016090-110 = "...Вы все просто делаете что хотите, да?"
10016090-111 = "Ладно, я побегу последней за Тринити."
10016090-112 = "И можете быть уверены: я выполню эту задачу до конца, независимо от своих физических возможностей."
10016090-113 = "Раз уж я участвую в эстафете, я во что бы то ни стало принесу Тринити победу!"
10016090-115 = "Хорошо. Вот это мне нравится слышать."
10016090-116 = "Мы будем болеть за тебя с края трассы."
10016090-117 = "Удачи, Хасуми!"
10016090-119 = ""
10016090-120 = "И третьи бегуньи стартовали!"
10016090-121 = "Последние бегуньи каждой школы, просим выйти на трассу!"
10016090-122 = ""
10016090-125 = ""
10016090-126 = "А? Вице-президент Хасуми?"
10016090-127 = "...Юука?"
10016090-128 = "Хасуми, раз ты здесь... Значит, ты бежишь последний этап за Тринити?"
10016090-129 = "Да... И, полагаю, ты бежишь последней за Миллениум, Юука?"
10016090-130 = "Ага, именно... *вздыхает*"
10016090-131 = "Если честно, я совсем не сильна в беге, но меня заставили, потому что студенты Семинара отказались участвовать, если я не побегу. Совсем с ума сошли."
10016090-132 = "Не понимаю, почему они так упёрлись, когда у нас действительно есть шанс на победу!"
10016090-133 = ""
10016090-136 = ""
10016090-137 = "Ха, хаха...."
10016090-138 = "Ч-что? Я сказала что-то смешное? О нет, у меня что-то на лице?"
10016090-139 = "Вовсе нет. Просто, кажется, я понимаю, с чем тебе пришлось столкнуться."
10016090-140 = "...Но это не значит, что я буду тебе поддаваться."
10016090-141 = "Т-то же самое могу сказать тебе!"
10016090-142 = "Это был не мой первый выбор, но раз уж я здесь, сделаю всё возможное ради победы Миллениума!"
10016090-143 = "Уважаю твою решимость, но уверяю: победителем Фестиваля Хало станет Тринити!"
10016090-144 = ""
10016090-146 = ""
10016090-147 = "А вот и третьи бегуньи приближаются к зоне передачи!"
10016090-148 = ""
10016090-154 = "Уф... Я выжала из себя все силы в этой гонке..."
10016090-155 = "Для меня... всё кончено..."
10016090-156 = "Эстафета принята!"
10016090-157 = ""
10016090-165 = "И последние бегуньи стартуют!"
10016090-166 = "П-погодите! У меня ещё нет палочки... А-а?!"
10016090-167 = ""
10016090-171 = "Джунко из Геенны не ловит палочку и падает!"
10016090-172 = "Ох, какая катастрофическая ошибка! Похоже, Геенна теперь выбыла из борьбы!"
10016090-173 = "Вот ты где, Хасуми! Мы снова встретились!"
10016090-174 = "Ха...! *тяжело дышит* ...!"
10016090-175 = "Какая устрашающая аура! Но я начинающая ниндзя и не отступлю!"
10016090-176 = "Я не... сдамся!"
10016090-177 = "И я... тоже!"
10016090-178 = "Какая... юношеская энергия!"
10016090-179 = "Даже на такую старушку, как я, эта энергия действует заразительно...!"
10016090-180 = "Хошино, если уже передала эстафету, убирайся с трассы!"
10016090-181 = ""
10016090-182 = "(*тяжело дышит* ...Сколько ещё до финиша?)"
10016090-183 = "(Я так задыхаюсь, что всё плывёт перед глазами... Я даже не знаю, где остальные бегуньи...)"
10016090-184 = "(Но сейчас, когда я лечу по трассе под всеобщие крики поддержки... мысли стали яснее, чем когда-либо.)"
10016090-185 = "(Наверное, это и называют эйфорией бегуна...)"
10016090-186 = "(Моё тело уже на абсолютном пределе, но с каждым шагом я чувствую всё больше восторга...!)"
10016090-187 = "(Кажется, я могла бы бежать так вечно...!)"
10016090-189 = "...Хасуми пересекает финишную черту!"
10016090-190 = "...Я сделала это!"
10016090-191 = ""
10016090-195 = ""
10016090-196 = "Хасуми финиширует шестой!"
10016090-197 = "...А?"
10016090-198 = "Было близко, но Юука совсем немного обогнала тебя и заняла пятое место."
10016090-199 = "Ты отлично выступила, так что не расстраивайся. Молодец!"
10016090-200 = ""
10016090-202 = ""
10016090-203 = "Я-я шестая...? Тогда кто победил...?"
10016090-204 = "Вы это видели? Несмотря на жёсткое падение прямо на старте, Джунко сумела догнать остальных и выиграть гонку! Невероятная скорость!"
10016090-205 = "Иначе и не скажешь! Драматичное возвращение, достойное Фестиваля Хало!"
10016090-206 = ""
10016090-207 = "Вы видели? Смотрели? Я пришла первой!"
10016090-208 = "Всё по плану. Я знала, что Джунко способна победить."
10016090-209 = "Ты уверена? Мне почему-то помнится, как ты чуть не сказала: «Не надо было доверять этим ненормальным из Общества исследования гурманов!» когда Джунко упала..."
10016090-210 = ""
10016090-211 = "Что ж, в итоге её опасения оказались напрасными, и Геенна заняла первое место."
10016090-212 = "Я знала, что Джунко станет звездой этого Фестиваля Хало Кивотоса."
10016090-213 = "Значит, теперь с этим общим талоном на питание мы можем наесться чем угодно до отвала, да? Да?!"
10016090-214 = "Быстрее, быстрее! А вдруг еда закончится?"
10016090-216 = "Что ж. Полагаю, на этом всё."
10016090-217 = ""
10016090-222 = ""
10016090-223 = "Я так старалась... Не могу поверить, что заняла только пятое место..."
10016090-224 = "Вот поэтому я и не хотела бежать последней..."
10016090-225 = ""
10016090-227 = ""
10016090-228 = "Отличная работа, Юука."
10016090-229 = "Вы тоже, вице-президент Хасуми..."
10016090-231 = "Последнее соревнование завершено, а значит пришло время объявлений!"
10016090-232 = "Победившая академия Фестиваля Хало Кивотоса — это..."
10016090-234 = "Геенна!"
