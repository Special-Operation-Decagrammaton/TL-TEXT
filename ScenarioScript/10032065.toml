[translation]
10032065-4 = ""
10032065-5 = ""
10032065-6 = ""
10032065-7 = ""
10032065-8 = "Мы прибыли в указанное место."
10032065-9 = "Группа эвакуации ещё не прибыла? Удивительно медлят."
10032065-10 = "Нет, не моё дело жаловаться. Я должна сосредоточиться только на защите клиента, несмотря ни на что."
10032065-11 = "К счастью, мне удобно сражаться на такой местности."
10032065-12 = ""
10032065-15 = "..."
10032065-16 = "Решалы 68..."
10032065-17 = "Я считала, что работа уже закончена, но это всё осложняет."
10032065-18 = "[s1] «Вот ты где, Саори!»\n[s2] «Ты правда здесь. Каёко была права!»"
10032065-21 = "Даже Сенсей..."
10032065-22 = ""
10032065-24 = ""
10032065-26 = ""
10032065-27 = ""
10032065-28 = "Стоять."
10032065-29 = "Ч-что случилось с Аранчино? Куда он делся?!"
10032065-30 = "И откуда у тебя этот огромный мешок?!"
10032065-31 = ""
10032065-33 = ""
10032065-34 = "Я очень стараюсь не делать поспешных выводов, но..."
10032065-35 = "[s3] «Саори. Это Дон Аранчино?»\n[s4] «Ты... засунула своего клиента в мешок?»"
10032065-38 = "...?"
10032065-39 = "Да. Почему вы так обеспокоены?"
10032065-40 = ""
10032065-42 = ""
10032065-43 = ""
10032065-44 = "...?"
10032065-45 = "...?"
10032065-46 = ""
10032065-48 = ""
10032065-49 = ""
10032065-50 = "[ns] «...?»"
10032065-51 = ""
10032065-53 = ""
10032065-54 = ""
10032065-55 = "Н-наверное, так ей и правда проще выполнять работу..."
10032065-56 = "Хахаха! Ты издеваешься? Это гениально! Я вдохновилась!"
10032065-58 = "Если Муцуки вдохновилась, это на сто процентов плохо. Только не сейчас."
10032065-59 = "Я не понимаю. Я сделала что-то не так?"
10032065-60 = "И ещё — почему вы спустились сюда за нами, Сенсей?"
10032065-61 = "Это тоже должно стать частью вашего документального фильма?"
10032065-63 = "Как думаешь, она серьёзно? Ну прям совсем-совсем серьёзно?"
10032065-64 = "Похоже, не только у нас винтиков не хватает..."
10032065-66 = "...?"
10032065-67 = "Я не совсем понимаю, но сейчас это неважно. Важно то, что—"
10032065-68 = ""
10032065-79 = "...!"
10032065-80 = "Очень вовремя."
10032065-81 = ""
10032065-82 = "Ч-чего?! Почему сюда сейчас подъезжает столько дорогих чёрных машин?!"
10032065-83 = "Их столько, что я даже сосчитать не могу!"
10032065-84 = ""
10032065-85 = "Мы упустили момент."
10032065-86 = "Тогда я...!"
10032065-87 = ""
10032065-89 = ""
10032065-90 = ""
10032065-91 = "Стой, Харука. Пусть они сделают первый ход."
10032065-92 = "И что будем делать? Драться со всеми? Это основные силы Аранчино, приехали забрать своего босса."
10032065-93 = ""
10032065-99 = ""
10032065-100 = "Вы как раз вовремя. Клиент—"
10032065-101 = ""
10032065-106 = "Опусти оружие и руки вверх! Ты окружена, слышишь?!"
10032065-107 = "Если сейчас отпустишь нашего босса, мы ещё подумаем, оставить ли тебя в живых!"
10032065-108 = ""
10032065-110 = ""
10032065-111 = "...А?"
10032065-112 = "[ns5] «Они окружили Саори...?»\n[ns6] «Почему они целятся в Саори...?»"
10032065-115 = "Не понимаю..."
10032065-116 = "Полагаю, произошло недоразумение. Я вам не враг."
10032065-117 = "Я лишь выполняю приказ. Клиент прямо—"
10032065-118 = "Клиент? Кто нанял тебя на это, а?! Лучше выкладывай!"
10032065-119 = "Разве вы сами не должны знать...? Очевидно же, это был..."
10032065-120 = ""
10032065-122 = ""
10032065-124 = ""
10032065-126 = "...Он."
10032065-127 = "У нас заранее была договорённость, что в случае опасности я сопровожу его в безопасное место."
10032065-128 = "...?"
10032065-129 = "Ты чё несёшь?"
10032065-130 = ""
10032065-131 = ""
10032065-132 = "Ты же не думаешь всерьёз, что мы поверим в такую чушь?!"
10032065-134 = "...?"
10032065-135 = "Есть... какая-то проблема?"
10032065-136 = "Думаешь, можно запихнуть нашего босса в мешок, а потом заговорить нам зубы умными словами и милой улыбочкой?! А?!"
10032065-137 = "Если уж врёшь, так хоть попытайся сделать это правдоподобно! Это, мать его, неуважение!"
10032065-139 = "Кажется, у всех истерика..."
10032065-140 = "Уверяю, я не хотела проявлять неуважение. Я немного сбита с толку, потому что на самом деле всё наоборот."
10032065-141 = "В конце концов, я новичок в этой сфере и полагаюсь на ваши знания и опыт. Зачем мне над вами насмехаться?"
10032065-142 = ""
10032065-144 = ""
10032065-145 = "Ты... Ты хочешь сказать, что не пытаешься выставить нас идиотами?!"
10032065-146 = "Да посмотри ты наконец, что делаешь, и повтори это ещё раз! Наш босс тебе не клиент и не прочая чушь, которую ты пытаешься нам впарить!"
10032065-148 = "Посмотреть... на то, что я делаю...? Хорошо. Смотрю."
10032065-149 = "Да. Я определила наиболее эффективный способ транспортировки и действовала соответственно. Более того, благодаря этому я добралась до гаража быстрее вас."
10032065-150 = "Возможно, вас расстроило, что я пришла сюда первой?"
10032065-152 = "...Она говорила серьёзно. Абсолютно серьёзно."
10032065-154 = "..."
10032065-155 = "[s7] «Я... Я же говорила, что от неё и такого можно ожидать.»\n[s8] «Эффективность... Где у тебя вообще проходит граница...?»"
10032065-156 = ""
10032065-157 = ""
10032065-158 = "Хм..."
10032065-159 = "Какая дилемма. Мы так ни к чему не придём."
10032065-160 = "Я разбужу его, и он всё объяснит."
10032065-161 = "Пожалуйста, проснитесь. Ваши подчинённые обвиняют меня в вашем похищении."
10032065-162 = "...Просыпайтесь."
10032065-163 = ""
10032065-165 = ""
10032065-166 = ""
10032065-167 = "Угх... Ур-р-ргх...!"
10032065-168 = "Она его ударила! Она руки на самого босса подняла!"
10032065-170 = "...?!"
10032065-171 = "Нет-нет. Я его не била. Я лишь пыталась привести его в чувство, чтобы он объяснил..."
10032065-172 = "Всё, хватит с меня! У неё ведь даже армии нет! Взять её!"
10032065-173 = "Вперёд! В атаку!!"
10032065-174 = ""
10032065-176 = ""
10032065-177 = ""
10032065-178 = "В-вы на меня нападаете?! Но почему?"
10032065-179 = ""
10032065-181 = ""
10032065-182 = "...Если только!"
10032065-183 = "Цк. Понятно. Я снова угодила в ловушку работодателя."
10032065-184 = "Они собирались использовать меня, а потом предать. Опять...!"
10032065-185 = "[s9] «Почти угадала, но не совсем!»\n[s10] «Как бы это сказать? Эм, Саори...»"
10032065-188 = ""
10032065-189 = ""
10032065-190 = "*вздыхает*"
10032065-191 = "...Харука."
10032065-192 = "Д-да, Ару!"
10032065-193 = "Готовься к бою. Мы поддержим Джомаэ Саори."
10032065-194 = "П-Поняла!"
10032065-195 = ""
10032065-197 = ""
10032065-198 = ""
10032065-199 = "...Наверное?"
10032065-200 = ""
10032065-202 = ""
10032065-203 = ""
10032065-204 = "Хм?"
10032065-205 = "Что происходит, Ару? Мы дерёмся?"
10032065-206 = "...Босс?"
10032065-207 = "Я-я думала, она враг... и мешает планам Ару..."
10032065-208 = "Ик! Я н-никогда не стала бы оспаривать твои приказы, Ару! Поняла! Я-я сейчас пойду и всех их взорву!"
10032065-209 = ""
10032065-211 = ""
10032065-212 = ""
10032065-214 = ""
10032065-215 = "[ns11] «Каков план, Ару?»\n[ns12] «Ты пытаешься ей помочь?»"
10032065-218 = "Твой вопрос выдаёт твоё невежество, Сенсей."
10032065-219 = "Помочь? Решалы 68 ничего не делают бесплатно. Враг моего врага — мой друг, разве нет?"
10032065-220 = "Это просто просчитанный ход, чтобы выполнить работу."
10032065-221 = "Считай это уроком крутости. Нужно уметь приспосабливаться к любой ситуации и использовать выгодные союзы при любой возможности."
10032065-222 = "Помнишь, как Ару такая: «Преступники ни с кем не работают»? О! Я помню! Потому что это было час назад! Хахаха!"
10032065-223 = "Это совсем другое! Я использую нечестные приёмы, чтобы украсть цель!"
10032065-224 = "Д-да! Совсем другое!"
10032065-225 = "[s13] «...Спасибо, Ару.»\n[s14] «Я ценю твою помощь.»"
10032065-226 = ""
10032065-227 = ""
10032065-229 = ""
10032065-230 = "...Хи-хи. Хватит разговоров."
10032065-231 = "Время пришло!"
10032065-232 = "Решалы 68! Ваша задача — поддержать Джомае Саори и захватить Дона Аранчино!"
10032065-233 = "В атаку!!"
