[translation]
1702-1 = "Призрак в палате, часть 2"
1702-2 = "Главная больница Святой Терезы, 4-й этаж — пустующее отделение"
1702-3 = ""
1702-4 = "Хе-хе... Ненавижу вас... Ненавижу...!"
1702-5 = "Я отомщу..."
1702-6 = ""
1702-7 = "...Уф. Всё равно никто меня не видит. Может, хватит уже изображать призрака?"
1702-8 = ""
1702-9 = ""
1702-10 = "Ха! План сработал! Не думал, что они так быстро закроют отделение... А мне всего-то и нужно было притвориться призраком!"
1702-11 = "Пациенты, врачи, медсёстры... никто даже близко к этому этажу не подходит, потому что все боятся «призрака». Хи-хи! Теперь могу делать что захочу!"
1702-12 = "Так, посмотрим, нет ли здесь чего-нибудь, что можно продать и быстро заработать..."
1702-15 = "Стой! Это шаги?"
1702-16 = ""
1702-18 = ""
1702-19 = "Х-Ханаэ... ты правда собираешься идти дальше? П-По-моему, здесь ничего нет..."
1702-20 = "Мы не можем вернуться, пока не докажем, что в этом отделении нет призрака! Пациенты до сих пор напуганы этим слухом!"
1702-21 = "Почему ты такая смелая только в подобных ситуациях? Уф..."
1702-24 = "Кто это был? На медсестёр не похожи... Может, студенты-волонтёры?"
1702-25 = ""
1702-26 = "Кем бы они ни были, незваным гостям я не позволю разрушить мои планы. Достаточно изображать призрака и напугать их!"
1702-28 = ""
1702-29 = ""
1702-31 = "*вздыхает от испуга* Х-Ханаэ, ты это видела? За занавеской что-то шевельнулось!"
1702-32 = "А? Я ничего не заметила... Может, через окно забралась кошка?"
1702-33 = "Кис-кис-кис! Кс-кс-кс!"
1702-34 = ""
1702-35 = "Хе-хе... Ненавижу вас... Ненавижу...!"
1702-36 = "А-а-а! П-П-Призрак! Это призрак!"
1702-37 = "Покиньте это место, иначе я украду ваши души!"
1702-38 = "Заряди в магазин патроны с синей меткой! Это серебряные пули, которые мне дали в Сестринстве!"
1702-39 = "Я надеялась, что нам не придётся их использовать..."
1702-40 = ""
1702-42 = "П-Простите, господин Призрак! Покойтесь с миром!"
1702-43 = ""
1702-44 = "Погодите, что?! Вы в меня из оружия стреляете?! Какого чёрта?!"
1702-45 = "Вы вообще понимаете, что находитесь в больнице?! Как можно приносить сюда такое опасное оружие? Вы ведь можете кого-нибудь серьёзно ранить!"
1702-46 = "А? Оружие в больнице очень полезно. Его можно использовать как костыль, если у кого-то травмирована нога. А ещё оно помогает поддержать пациента, если тот не хочет вставать!"
1702-47 = "Оружие почти как магия. Я бы сказала, это незаменимый инструмент в любой больнице!"
1702-48 = "Но раз вы призрак, вы ведь не пострадаете, если мы в вас выстрелим, правда?"
1702-50 = "Ну... Д-Да, это правда, но..."
1702-51 = ""
1702-52 = "Э-Эй! Погодите!"
1702-53 = "Серебряные пули для изгнания духов опасны и для живых! Если случайно попасть в человека, его можно ранить или даже убить!"
1702-55 = "А? Я думала, призраки уже мёртвые. Как можно умереть ещё раз?"
1702-56 = "Я понимаю, что вы пока не готовы перейти на ту сторону, но вам здесь не место! Пора упокоиться с миром!"
1702-58 = ""
1702-59 = "Стойте, стойте! Я больше не могу!"
1702-60 = "Я-Я сдаюсь! Пожалуйста, прекратите!"
1702-62 = "Хотя фальшивый призрак сдался, стрельба продолжалась ещё больше часа..."
