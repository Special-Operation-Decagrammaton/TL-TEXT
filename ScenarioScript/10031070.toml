[translation]
10031070-1 = "Эпизод 7;День вечеринки"
10031070-2 = "После множества испытаний и неприятностей день вечеринки наконец настал."
10031070-4 = "Место проведения вечеринки Геенны"
10031070-7 = "[ns] «До начала вечеринки три часа.»"
10031070-8 = ""
10031070-10 = ""
10031070-11 = ""
10031070-12 = ""
10031070-14 = ""
10031070-15 = ""
10031070-16 = ""
10031070-18 = ""
10031070-19 = ""
10031070-20 = ""
10031070-22 = "Кстати, вы слышали о первом событии вечеринки?"
10031070-23 = "А, точно. Разве рекламы не было повсюду?"
10031070-24 = "Я тоже слышала! Главное событие —"
10031070-25 = "Вступительный фортепианный концерт главы Дисциплинарной комиссии!"
10031070-26 = "Не могу дождаться выступления Хины!"
10031070-27 = "Разве Общество Пандемониума и Дисциплинарная комиссия не ненавидят друг друга? Удивительно, что Общество Пандемониума вообще одобрило её выступление."
10031070-28 = "Я слышала, председатель Общества Пандемониума немного умерила гордость и начала предпринимать шаги к улучшению отношений с Дисциплинарной комиссией..."
10031070-30 = "[ns] «Макото и правда с невозмутимым лицом проталкивала такую рекламу...»"
10031070-31 = "Ещё как..."
10031070-32 = ""
10031070-35 = ""
10031070-36 = "Она бегала и раскручивала позитивный пиар, пока мы были заняты тренировками и абсурдными требованиями Общества Пандемониума."
10031070-37 = "Серьёзно... Любую схему, которая выгодна ей, она проталкивает с деликатностью бульдозера."
10031070-38 = "*вздыхает* Теперь уже поздно. Главе нужно было стоять на своём и вообще не соглашаться на это требование."
10031070-39 = "[s] «Ако...»"
10031070-40 = "А. Здравствуйте, Сенсей. Вы рано."
10031070-41 = "Честно говоря, у меня есть пара слов насчёт вашей помощи Обществу Пандемониума."
10031070-42 = "[s1] «Пришлось. Это была просьба студенты.»\n[s2] «И вообще, в проведении вечеринки нет никакого настоящего злого умысла.»"
10031070-45 = "То есть вы помогли им так же, как помогли бы любому ученику в их положении."
10031070-46 = "...Ну, полагаю, в этом и трудность работы учителя. Не стану притворяться, что не понимаю."
10031070-47 = "...Но всё равно кажется, что по дороге вы заставили Дисциплинарную комиссию пережить немало головной боли."
10031070-48 = "[s] «П-Потому что я доверял Дисциплинарной комиссии и знал, что вы справитесь!»"
10031070-49 = "...Конечно, я ценю ваше доверие. Но от этого вся раздражающая рутина, которую на нас свалили, не становится приятнее."
10031070-50 = "Ну и как вам? Разбираться с Обществом Пандемониума в одиночку?"
10031070-51 = "Теперь понимаете, почему у нас зуб на эту нелепую компанию?"
10031070-52 = "[s] «Хм, ну... Думаю, они действительно уникальная группа студентов...»"
10031070-53 = "Хм. Уникальная. Вы явно умеете подсластить формулировку..."
10031070-54 = "[s] «Кстати, Ако... Насчёт твоего наряда...»"
10031070-55 = "А, это."
10031070-56 = "Ну... Я не то чтобы с нетерпением ждала эту вечеринку."
10031070-57 = "Но как старший администратор я обязана помогать главе. Я нарядилась так, чтобы смешаться с гостями и следить за обстановкой."
10031070-58 = "Да... Сейчас я гламурный шпион, которому позавидует любой другой член Дисциплинарной комиссии."
10031070-59 = "Что-то вроде того."
10031070-60 = "[s] «Отлично выглядишь.»"
10031070-61 = "...Что?"
10031070-62 = "Н-Не поймите неправильно. Я оделась так не из-за скрытых мотивов, просто хотела почувствовать себя шпионом и внутри, и снаружи."
10031070-63 = "...Погодите, почему я вообще так смутилась?"
10031070-64 = "Не думайте, что можете с невозмутимым лицом говорить такие странные вещи, Сенсей."
10031070-65 = "[s] «Что?! Что я такого сделал?!»"
10031070-66 = "...Кхм. В любом случае, спасибо за искренний комплимент, Сенсей."
10031070-67 = "Ладно, мне нельзя терять бдительность."
10031070-68 = "Мы разместили силы Дисциплинарной комиссии на месте, чтобы быстро реагировать на любую возникающую ситуацию."
10031070-71 = ""
10031070-72 = ""
10031070-74 = ""
10031070-75 = ""
10031070-76 = ""
10031070-77 = ""
10031070-79 = ""
10031070-80 = ""
10031070-82 = ""
10031070-83 = "И всё же... даже при наличии сил рядом мне тревожно."
10031070-84 = "Не найдётся же безумца, который устроит беспорядки на вечеринке, где присутствуют и Общество Пандемониума, и Дисциплинарная комиссия..."
10031070-85 = "Тем более когда хозяйка — сама председатель Общества Пандемониума."
10031070-86 = "Но серьёзно. Даже если до открытия ещё несколько часов, я должна оставаться начеку."
10031070-87 = "[s3] «Разве всё уже не должно быть в порядке? Мы ведь дошли так далеко...»\n[s4] «К тому же здесь охраняете ты, Хина и вся Дисциплинарная комиссия!»"
10031070-90 = "Глава Хина... Ммм. Вы так говорите, но..."
10031070-91 = "[s] «Кстати, где Хина?»"
10031070-92 = "А, главе пришлось ненадолго уйти."
10031070-93 = "У неё были дела..."
10031070-94 = "Кихехе. Здравствуй, [USERNAME] Сенсей. И старший администратор Ако."
10031070-95 = ""
10031070-97 = ""
10031070-105 = "Здравствуйте, Сенсей! И тебе привет, Ако!"
10031070-107 = "Хмпф... Вы."
10031070-109 = ""
10031070-111 = "[ns] «Привет. Вы обе выглядите нарядно...»"
10031070-113 = "Кеке! У тебя хороший глаз! Я выбрала праздничный наряд, воплощающий мою сияющую харизму!"
10031070-114 = "Макото выбрала платье Ибуки! Красивое, правда?"
10031070-115 = "[s] «Ты всегда милая, так что сегодня особенно милая, Ибуки.»"
10031070-116 = "А, правда? Спасибо, Сенсей!"
10031070-117 = "Кихехе... Именно. В праздничном платье очарование Ибуки выросло более чем в 150 раз!"
10031070-118 = "Осторожнее, Амау Ако. Если слишком долго смотреть на эту сияющую звезду милоты, можно ослепнуть."
10031070-120 = "...Тут ты не ошибаешься. За Макото не скажу, но ты действительно очень милая, Ибуки."
10031070-121 = "А, правда, Ако? Спасибо!"
10031070-122 = "К-Конечно... Я-я просто честно сказала, что думаю. Кхм."
10031070-123 = "Кекекеке! Оставим такие очевидные наблюдения в стороне..."
10031070-124 = "Я не вижу Сорасаки Хину, главу Дисциплинарной комиссии."
10031070-125 = "А... Это потому что..."
10031070-126 = "До фортепианного концерта осталось всего два часа."
10031070-127 = "Судя по тому, что её всё ещё нет..."
10031070-128 = "Кеке... Можно ли предположить, что страх игры на пианино заставил главу сбежать?"
10031070-129 = "Что ты сказала?"
10031070-130 = "Если это не так, как ещё объяснить её отсутствие?"
10031070-131 = "Сейчас она должна либо репетировать, либо спокойно сидеть в комнате ожидания."
10031070-132 = "Т-Тут ты не ошибаешься..."
10031070-133 = "Но Хина ни за что не сбежала бы от трудности! Мы же говорим о главе Дисциплинарной комиссии!"
10031070-134 = "Кеке. Твои слова — лишь ветер."
10031070-135 = "Даже самого ответственного человека может сломить один маленький миг трусости."
10031070-136 = "Столкнувшись с чем-то невозможным, несмотря на все усилия, даже глава может сбежать куда глаза глядят, не так ли?"
10031070-137 = ""
10031070-140 = "[ns] «С чем-то невозможным?»"
10031070-141 = "Кекеке! Как всегда наблюдателен, Сенсей!"
10031070-142 = "Разведывательная команда Общества Пандемониума превосходна! Дисциплинарной комиссии до неё далеко!"
10031070-143 = "Наши агенты добыли сочный кусочек совершенно секретной информации о Дисциплинарной комиссии."
10031070-144 = "Вы... Вы шпионили за нами?!"
10031070-145 = "Хмпф, не строй из себя удивлённую. Разве не так всё устроено здесь, в Геенне?"
10031070-146 = "Так, что там было в отчёте? «Сорасаки Хина может казаться золотой девочкой, способной на всё.»"
10031070-147 = "«Но мы обнаружили несколько вещей, которые она попросту не умеет делать, а некоторые задачи у неё выходят совсем плохо...»"
10031070-148 = "«На первом месте — плавание!»"
10031070-149 = "?!"
10031070-150 = "«А на втором — она не умеет играть ни на одном музыкальном инструменте, включая пианино!»"
10031070-151 = "Ты знала об этом и всё равно—"
10031070-152 = "Именно! Я выбрала её для фортепианного концерта именно потому, что знала её слабость!"
10031070-153 = "Зачем тебе делать такое?"
10031070-154 = "Хм? Почему я подставила Хину на унизительное выступление, зная, что это может испортить вечеринку, в которую я столько вложила?"
10031070-155 = "Кекекеке. Разве не очевидно?"
10031070-156 = "Смотреть, как она провалится, будет настолько весело, что мне плевать, если вечеринка будет испорчена!"
10031070-157 = "[s] «...Ого.»"
10031070-158 = "...Ты идиотка?"
10031070-159 = "О, это ещё не всё!"
10031070-160 = "Если Хина решит избежать унижения и не появится, она покажет всем, насколько Дисциплинарная комиссия уступает Обществу Пандемониума!"
10031070-161 = "Трусам нет оправданий!"
10031070-162 = "...Не могу поверить, что ты опустилась так низко."
10031070-163 = "Но клянусь... глава никогда бы не сбежала..."
10031070-164 = "Хмпф, для твоих жалких оправданий уже поздно."
10031070-165 = "Ироха?! Где Ироха и Чиаки?! Скоро выступление, а главы всё нет!"
10031070-166 = "Разнесите эту новость по всей Геенне! Общество Пандемониума победило!"
10031070-167 = "П-Погоди. Ты с ума сошла?! Если объявишь такое—!"
10031070-168 = "Кихехехе! Слова проигравшего — лишь ветер! Но серьёзно, где Ироха и Чиаки?"
10031070-169 = "О, они обе ушли помогать с последними приготовлениями к вечеринке."
10031070-170 = "Как жаль, что они не увидят мой великий момент."
10031070-171 = "Кихехе. Ладно. Сделаю всё сама."
10031070-172 = "Кихехе... С этим..."
10031070-173 = "Правление Общества Пандемониума наконец начинается!"
10031070-174 = "[ns] «...У меня плохое предчувствие.»"
10031070-177 = ""
10031070-178 = "Итак! Ученики Геенны!"
10031070-179 = "Сорасаки Хина, наш открывающий номер Особой вечеринки Геенны, так и не появилась!"
10031070-180 = "Теперь должно быть ясно, что она испугалась ответственности такой важной роли и сбежала!"
10031070-181 = "Это оскорбление Общества Пандемониума, которое полностью ей доверяло! Она сама признала свою некомпетентность!"
10031070-182 = "Поступок Хины доказывает, что только я, Великая Макото, достойна быть лидером Геенны!"
10031070-187 = ""
10031070-188 = "Кихехе... Правлению Дисциплинарной комиссии конец!"
10031070-189 = "..."
10031070-190 = "[s] «Ако... Ты правда просто это проглотишь?»"
10031070-191 = "С нами всё в порядке."
10031070-192 = "Настоящая проблема..."
10031070-193 = "[s] «Какая проблема?»"
10031070-194 = ""
10031070-197 = "П-Председатель! Чрезвычайная ситуация!"
10031070-198 = "Хм? Что случилось?"
10031070-199 = "Э-Это... Сразу после вашего объявления в эфире... По всей Геенне—!"
10031070-200 = "...?"
10031070-202 = ""
10031070-203 = "Президент! Вы только что видели эфир?! Глава пропала! Общество Пандемониума победило!"
10031070-204 = "Глава пропала?"
10031070-205 = "..."
10031070-206 = "*фыркает* *хихикает*"
10031070-207 = ""
10031070-209 = ""
10031070-210 = "Значит... пришёл звёздный час Отдела горячих источников!"
10031070-211 = "Да! Это наш шанс!"
10031070-212 = "Вахахаха!!"
10031070-213 = "Вперёд! Пусть горячие источники текут! Мы закончим начатое... Горячий источник Общества Пандемониума!"
10031070-214 = "Ура-а! Все! Берите инструменты! Пора разрабатывать!"
10031070-215 = "Вперё-о-о-од!"
10031070-216 = ""
10031070-218 = ""
10031070-224 = ""
10031070-225 = "Хм. В том эфире только что сказали... что этой строгой главы нет?"
10031070-226 = "Хи-хи. Что хочешь с этим делать, Харуна?"
10031070-227 = "Ты ещё спрашиваешь?!"
10031070-228 = "Верно! Нам нужно приготовить... что-нибудь вкусное!"
10031070-229 = "На этот раз главы нет, чтобы нас остановить. Может, начнём?"
10031070-230 = ""
10031070-232 = ""
10031070-234 = ""
10031070-235 = ""
10031070-238 = ""
10031070-239 = ""
10031070-240 = ""
10031070-245 = ""
10031070-246 = ""
10031070-247 = ""
10031070-248 = ""
10031070-249 = "Пан-Пан... Пан-Пан снова разбушевался!"
10031070-251 = ""
10031070-252 = "Если глава пропала... Мы не можем просто почивать на лаврах!"
10031070-253 = "Именно! Мы самые надёжные преступницы Геенны! Если берём заказ, доводим до конца!"
10031070-254 = "Начинайте снова устанавливать эти статуи! Как и приказала председатель Общества Пандемониума!"
10031070-256 = "...И это всё, что сейчас происходит в Геенне!"
10031070-257 = "Председатель! Ваши приказы?"
10031070-258 = ""
10031070-260 = ""
10031070-261 = ""
10031070-262 = "Ч-Ч-Что? П-Почему всё это происходит?!"
10031070-263 = "Разве не очевидно? Если объявить, что силы, удерживающей Геенну под контролем, больше нет..."
10031070-264 = "Все нарушители спокойствия тут же начнут бесчинствовать. Ты правда этого не предвидела?"
10031070-265 = "[s] «Но как всё это могло произойти из-за одного прямого эфира?»"
10031070-266 = "Никогда не недооценивайте хаос Геенны, Сенсей."
10031070-267 = "[s] «Да когда я его недооценивал?!»"
10031070-268 = "Как бы то ни было... если мы не подавим эту анархию, будет испорчена не только вечеринка, но и сама Геенна..."
10031070-269 = "Ч-Ч-Что? Н-Нет! Только не моя вечеринка! В-Вся моя подготовка—!"
10031070-270 = "Вся эта работа, чтобы показать превосходство Общества Пандемониума над Дисциплинарной комиссией!"
10031070-271 = ""
10031070-275 = ""
10031070-276 = "Что это сейчас было за объявление?!"
10031070-277 = "...Забудьте. Что вообще сейчас происходит?!"
10031070-278 = "*вздыхает* Что ты натворила, Макото?"
10031070-279 = "Ахахаха! Полный бардак! Очень в стиле Макото!"
10031070-280 = ""
10031070-282 = ""
10031070-283 = ""
10031070-284 = ""
10031070-285 = "Это значит... вечеринки не будет?"
10031070-286 = "Нет, Ибуки! Всё не... Я не хотела...!"
10031070-287 = "Мм! Похоже, ничего не поделаешь. Используем мой улучшенный проект NK Ultra и—!"
10031070-289 = "Это лишь снова заставит Макото вести себя странно, Сацуки."
