10031070-323 = ""
10031070-325 = "[ns] «(Ако сказала, что Хина опаздывает из-за каких-то дел. Если так...)»"
10031070-327 = "[ns] «Придётся мне самому разобраться.»"
10031070-328 = ""
10031070-329 = "Сенсей?"
10031070-330 = "[s] «Ты сказала, у Хины были дела?»"
10031070-331 = "...Да."
10031070-332 = "[s] «Тогда до возвращения Хины оставьте это мне.»"
10031070-333 = "Но..."
10031070-334 = "Сенсей... вам не нужно брать ответственность за ошибки этой тупой председательши."
10031070-335 = "[ns] «Я правда начал ждать эту вечеринку... Особенно выступление Хины.»"
10031070-337 = "[ns] «Так что я не позволю вечеринке развалиться. Не только ради Хины, но и ради себя.»"
