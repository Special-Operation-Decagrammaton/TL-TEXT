[translation]
2601703-1 = "Lana and the Colossus"
2601703-2 = "(Worried about Lana, I hurried over to Special Class Room 183.)"
2601703-3 = "(I hope she's alright...)"
2601703-5 = "Special Class Room 183"
2601703-8 = "......"
2601703-9 = "Hmm..."
2601703-10 = "[ns1] \"Phew... You're safe.\"\n[ns2] \"Lana! I'm here!\""
2601703-14 = "Ah, Sensei."
2601703-15 = "If you don't mind, could you bring over that diesel engine on the cart?"
2601703-16 = "It's heavy, so please be careful not to hurt your feet."
2601703-17 = "[s] \"Oh, sure...!\""
2601703-19 = "(Lana seemed to be building a gigantic machine.)"
2601703-20 = "(I supported her from the side, staying quiet so as not to get in her way.)"
2601703-22 = "Sensei, I need that part over there—"
2601703-23 = "I can't reach it, so could you give me a piggyback ride?"
2601703-24 = "[s] \"Of course!\""
2601703-25 = "Thank you."
2601703-31 = "Hmm...!"
2601703-32 = "This should do it. Thanks to you, Sensei, I was able to finish it today."
2601703-33 = "Things always go smoothly when you're with me, Sensei. Thank you."
2601703-34 = "I'm going to start the engine now, so please try not to be startled by the gunshot."
2601703-35 = "[s3] \"An engine...?\"\n[s4] \"A gunshot...?\""
2601703-45 = "Oh..."
2601703-46 = "It's running properly. That's a relief."
2601703-47 = "[s] \"You started the engine with a gun?\""
2601703-48 = "Yes. I used a Coffman starter. #nSince there's no starter motor, I used the pressure of gunpowder to crank the engine. It worked out nicely."
2601703-49 = "This may be a small machine to me, #nbut it must be a giant leap for Red Winter."
2601703-50 = "[s] \"Amazing! So cool! Good job, Lana!\""
2601703-54 = "[ns] \"...So, what kind of machine is this...?\""
2601703-55 = "It's nothing much. This is—"
2601703-60 = "A smartphone charger."
2601703-61 = "My old one broke, #nso I decided to take this opportunity to build a fast charger."
2601703-62 = "[s] \"I-It's so huge...\""
2601703-63 = "Using vacuum tubes turned out like this. #nIt's warm and much better than a regular charger."
2601703-64 = "If you need to, Sensei, would you like to use it too? It has four ports."
2601703-68 = "Oh, that's right... I completely forgot."
2601703-69 = "Good morning, Sensei. I am Furuhata Lana."
2601703-70 = "What a coincidence to run into you here."
2601703-71 = "[s5] \"Haha... I was just worried about you and came to check, you see...\"\n[s6] \"I'm glad you're safe!\""
2601703-74 = "Safe...?"
2601703-75 = "I'm not sure what you mean, but I'm glad you look happy, Sensei."
2601703-77 = "(I spent the rest of the time together with Lana.)"
2601703-78 = "(The charger radiated enough heat to melt the freezing snow.)"
