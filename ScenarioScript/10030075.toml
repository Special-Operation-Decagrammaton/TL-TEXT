10030075-18 = "...А? Что это за шум?"
10030075-19 = "Пока мы были на горе, весь кемпинг заполнился палатками."
10030075-20 = "Кемпинг — первый тренд нового года?"
10030075-21 = "[s] «Интересно...»"
10030075-25 = ""
10030075-26 = "Здравствуйте и добро пожаловать на канал Кронос! С вами Казамаки Май, ведущая нового расследовательского цикла «Прогулка по истории!»"
10030075-27 = "Мы ведём прямой эфир из Альп Хигаси и расскажем вам последние новости о новом открытии, потрясшем научное сообщество!"
10030075-28 = "Новости об открытии разлетелись по соцсетям как пожар, и, хотя сегодня первый день нового года, кемпинг забит людьми, желающими узнать больше!"
10030075-29 = "Кто знает, как изменится само наше понимание Кивотоса после—"
10030075-30 = ""
10030075-32 = ""
10030075-33 = "О? Секундочку — это же знакомое лицо!"
10030075-34 = "Внимание, зрители! Главная знаменитость Кивотоса, [USERNAME] Сенсей, попала в кадр прямо на месте открытия!"
10030075-35 = "Мы выходим к Сенсею из Шале в прямом эфире, чтобы получить официальное заявление об этих судьбоносных событиях!"
10030075-36 = ""
10030075-38 = ""
10030075-39 = "Здравствуйте, [USERNAME] Сенсей! Вы в прямом эфире канала Кронос!"
10030075-40 = "[s1] «Всем привет!»\n[s2] «С Новым годом, Май.»"
10030075-43 = "Кто бы мог подумать, что уже в первый день года мне достанется такой эксклюзив—"
10030075-44 = "Эм, то есть нам невероятно повезло встретить вас сегодня!"
10030075-45 = "Но важнее другое: раз вы здесь, [USERNAME] Сенсей..."
10030075-46 = "Готово ли Шале подтвердить слухи, которые ходят вокруг нового открытия?"
10030075-47 = "[s3] «...Нового открытия?»\n[s4] «На данный момент Шале воздержится от комментариев.»"
10030075-50 = "О? Решили прикинуться ничего не знающим, Сенсей?"
10030075-51 = "Вы наверняка здесь, чтобы исследовать древнюю фреску, которую несколько туристов-учеников обнаружили на стенах естественной пещеры в Альпах Хигаси! Даже Шале не сможет отрицать невероятное внимание, которое она получила в соцсетях!"
10030075-52 = ""
10030075-55 = ""
10030075-56 = ""
10030075-58 = "Что особенно необычно для наскальной живописи: по словам экспертов, обычно на ней изображают охоту и собирательство, а эта фреска, похоже, показывает современные объекты — гигантскую башню и механические детали!"
10030075-62 = "Более того, сообщается, что главным элементом фрески является ужасное чудовище, притаившееся на вершине башни..."
10030075-63 = "Ученики, обнаружившие фреску, вызвали переполох в D.U., когда добрались до праздничной толпы и объявили, что нашли «пророчество апокалипсиса!»"
10030075-65 = "Итак, Сенсей, сможет ли Шале защитить наших зрителей от надвигающейся угрозы? Какие меры вы принимаете, чтобы Кивотос пережил её?"
10030075-66 = ""
10030075-69 = "[ns] «...Маки.»"
10030075-70 = ""
10030075-72 = ""
10030075-73 = "Я-Я не виновата!!"
10030075-74 = "Ну да, эти рисунки сделала я, но..."
10030075-75 = "Кажется, вчера я просила тебя смыть эту фреску, прежде чем мы уйдём из пещеры..."
10030075-76 = "Н-Но я так занялась поисками Котамы вместе с тобой, что забыла..."
10030075-77 = "Кроме того..."
10030075-78 = ""
10030075-80 = ""
10030075-81 = "Разве не круто, что моё искусство произвело такой огромный эффект?"
10030075-82 = ""
10030075-84 = ""
10030075-86 = ""
10030075-87 = ""
10030075-88 = "Прояви хоть немного раскаяния!"
10030075-90 = "Панику в конце концов удалось успокоить, когда мы с Маки дали эксклюзивное интервью и объяснили происхождение фрески... хотя слухи о сокрытии правды ещё несколько месяцев не исчезали."
