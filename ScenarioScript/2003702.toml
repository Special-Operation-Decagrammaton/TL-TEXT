[translation]
2003702-1 = "Полицейская история: эпизод в фуд-корте"
2003702-2 = "Фубуки написала мне в MomoTalk и попросила прийти помочь."
2003702-3 = ""
2003702-5 = ""
2003702-6 = "Сэн... то есть, инспектор! Спасибо, что пришли!"
2003702-7 = "[s1] «Что? „Инспектор“...?»\n[s2] «Что ты вообще задумала?»"
2003702-10 = "Не ожидали такого, инспектор?"
2003702-11 = "Не переживайте. Сейчас объясню, чем мы сегодня займёмся."
2003702-12 = "Мы с вами обойдём фуд-корт и проверим соблюдение санитарных норм."
2003702-13 = "[s3] «Погоди. Санитарных норм?»\n[s4] «Кажется, я не понимаю, к чему ты ведёшь.»"
2003702-14 = ""
2003702-15 = ""
2003702-17 = ""
2003702-18 = ""
2003702-19 = "Не отставайте, Сенсей."
2003702-20 = "Ладно, расскажу всё как есть..."
2003702-21 = "Около тридцати минут назад я получила информацию, что Master Donut в фуд-корте этого аквапарка выпустит НОВЫЙ пончик."
2003702-22 = "Продажи ещё не начались, но как только начнутся, толпа будет огромная."
2003702-23 = "[s] «...И?»"
2003702-24 = "А значит, у нас есть шанс попробовать его первыми!"
2003702-25 = "Разумеется... если со мной будет инспектор по безопасности пищевых продуктов!"
2003702-26 = "Я изучила правила, и там сказано — цитирую: «Инспектором по безопасности пищевых продуктов должен быть член Генерального студсовета ИЛИ преподаватель из Шале.»"
2003702-27 = "Понимаете?"
2003702-28 = "[s] «Фубуки, ты ведь не...»"
2003702-29 = "Ради безопасности и удовольствия посетителей парка, а также ради популяризации культуры здоровья и благополучия..."
2003702-30 = "Мы с вами имеем привилегию — нет, ОБЯЗАННОСТЬ — первыми попробовать новый пончик Master Donut!"
2003702-31 = ""
2003702-34 = "[ns] «Ага, понятно...»"
2003702-35 = "Ну всё, пошли. Пока их не начали сметать с прилавков!"
2003702-37 = ""
2003702-38 = "Здравствуйте!"
2003702-39 = "Спасибо, что пришли. Но мы ещё не совсем открылись. Не могли бы вы вернуться позже?"
2003702-40 = "О, мы не покупатели."
2003702-41 = "Я спасатель парка, а это Сэн... то есть, инспектор по безопасности пищевых продуктов из Шале."
2003702-42 = "Мы пришли... проверить безопасность вашей еды. До открытия."
2003702-43 = "О! Понимаю! С радостью помогу."
2003702-44 = "Отлично, отлично. Можно попросить образец?"
2003702-45 = "Конечно! Как насчёт нашего нового пончика? Он вот-вот поступит в продажу."
2003702-46 = "Вообще-то это идеально подходит."
2003702-47 = ""
2003702-49 = ""
2003702-50 = "Мы с удовольствием примем предложение."
2003702-52 = "Отлично! Вот, держите!"
2003702-53 = "Новая амбициозная разработка нашего магазина..."
2003702-54 = ""
2003702-56 = ""
2003702-57 = ""
2003702-58 = ""
2003702-59 = ""
2003702-60 = ""
2003702-61 = ""
2003702-62 = "Огуречный пончик!"
2003702-63 = "Пончик с целым свежим огурцом внутри!"
2003702-64 = "Ч-что?!"
2003702-65 = ""
2003702-67 = ""
2003702-68 = ""
2003702-69 = "Одобрен членом всемирно известного Общества гурманов!"
2003702-70 = "А если макнуть его вот в этот мятно-васабиевый соус, станет ещё вкуснее!"
2003702-71 = "[s5] «(Я даже представить не могу, какой у этого вкус.)»\n[s6] «(И НЕ ХОЧУ представлять, какой у этого вкус...)»"
2003702-74 = "Так, эм... нам теперь правда нужно это съесть?"
2003702-75 = "Это немного выходит за пределы моего... обычного вкуса... Если честно, мне даже интересно, КОМУ такое нравится..."
2003702-76 = "То есть, возможно, это не самый подходящий пончик для дегустации...!"
2003702-77 = "[s] «Мы должны как следует выполнить свою работу, Фубуки.»"
2003702-78 = ""
2003702-80 = ""
2003702-81 = "[ns] «Ради безопасности и удовольствия посетителей парка, а также ради популяризации культуры здоровья и благополучия...»"
2003702-82 = "Пожалуйста, попробуйте!"
2003702-84 = "Для этого я специально выбрал особенно большой огурец!"
2003702-86 = "И-Ик! Он же огромный...!"
2003702-88 = "Фубуки всё-таки удалось доесть огуречный пончик целиком."
2003702-89 = "К тому моменту она выглядела так, будто вот-вот расплачется."
