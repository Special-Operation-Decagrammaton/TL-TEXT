[translation]
10033070-1 = "Эпизод 7;Каждому своё"
10033070-2 = ""
10033070-3 = "Эти мелкие из Геенны сумасшедшие! Безумные! Психованные!"
10033070-4 = "Я на коленях отдраивал этот чёртов пол в Обсерватории!"
10033070-5 = "И что они сделали? Превратили его в грёбаную игровую площадку!"
10033070-6 = "Я слышал, что ты сильнее всех, если тебе весело."
10033070-7 = "Не хочу это слышать! Только психи додумались бы ставить бомбы, чтобы сделать горку."
10033070-8 = "А если бы они поцарапали эту плитку? Это же нам пришлось бы всё потом чистить!"
10033070-9 = ""
10033070-14 = ""
10033070-15 = "Чего вы все их хвалите и восхищаетесь ими? Они враги, ясно! Враги!"
10033070-16 = "Лидер! Вы наконец вернулись!"
10033070-17 = "Как прошла операция «притвориться супер-страшным ёкаем и распугать их во время испытания храбрости»?"
10033070-18 = "...Нам пришлось тактически отступить! Тактически!"
10033070-19 = "Я видел их по дороге сюда. Они палили из всего оружия, какое только было, будто на фестивале каком-то!"
10033070-20 = "Всё взрывалось, как фейерверки!"
10033070-21 = "Ну да, они и меня до усрачки напугали, когда в мастерской заявили, что выкопают горячий источник и используют нас как украшения для курорта..."
10033070-22 = "У них всё на совершенно другом уровне. Что бы мы ни придумали, они на шаг впереди. Такое не выдумаешь! Вот тебе и Геенна."
10033070-23 = "Попробуешь тост с джемом из кусаи, если я приготовлю?"
10033070-24 = "Ты издеваешься? Я от одного запаха вырубился. Клянусь, вонь до сих пор на одежде."
10033070-25 = "А та странная девчонка почему-то уплетала его будто вчерашний ужин!"
10033070-26 = "У меня челюсть отвисла! В мире просто нет еды, которую она не съест!"
10033070-27 = ""
10033070-29 = ""
10033070-32 = "Вы чего расслабились и болтаете, будто у костра старыми добрыми воспоминаниями делитесь!"
10033070-33 = "Вам не кажется, что вы слишком несерьёзно к этому относитесь?! Ритуал Древа божеств завтра! Завтра!"
10033070-34 = "Он вообще-то должен проходить только раз в год, и изначально это праздник Моурё, разве нет?!"
10033070-35 = "А эти важные фестивальные типы строят из себя хозяев и пытаются проводить НАШ фестиваль, будто он их собственность! Всё ради каких-то тупых мелких из Геенны!"
10033070-36 = "Если бы Древо божеств умело говорить, оно бы точно орало о такой несправедливости!"
10033070-38 = "Эти мелкие из Геенны ведь туристы, которые хотят посмотреть наши фестивали, да?"
10033070-39 = "А вся суть Хяккияко — принимать туристов и хорошо к ним относиться."
10033070-40 = "Ритуал Древа божеств в последнее время и так больше не про нас, а про молитвы об удаче."
10033070-41 = "Так что, может, дерево на самом деле ужасно радо, что сюда приехало столько людей!"
10033070-42 = ""
10033070-46 = "Какого чёрта мне делать, если даже вы не на моей стороне?!"
10033070-47 = ""
10033070-50 = ""
10033070-51 = "Глубоко вдохните, лидер. Всё будет хорошо!"
10033070-53 = "Угх! Завтра я верну то, что наше. Не позволю им делать что захотят с фестивалем Моурё!"
10033070-55 = "Если подумать, получается, мы вроде как собираемся взорвать собственный фестиваль..."
10033070-56 = "Ага, думаешь, это нормально? Как-то неловко..."
10033070-58 = "Да нет же! Завтрашний ритуал всё равно ненастоящий, так какая разница, если их фальшивый фестиваль будет испорчен?"
10033070-59 = "Мы ясно дадим понять Геенне и всем остальным! Фестивали Хяккияко принадлежат Хяккияко! А значит, они принадлежат нам, Моурё!"
10033070-61 = "Надо признать, звучит неплохо. Фестивали — Моурё!"
10033070-62 = "Технически пока мы проигрывали только студентам Геенны. Не обычным жителям Хяккияко."
10033070-63 = "Теперь у меня даже появилась мотивация завтра постараться!"
10033070-64 = "Ага! Я только вспомнила, что Чисэ будет выступать на ритуале Древа божеств!"
10033070-65 = "Хочу посмотреть, как она сделает подношение на сцене. Будет круто."
10033070-66 = ""
10033070-70 = "Я! ГОВОРЮ! Вы все слишком расслабились!"
10033070-76 = ""
10033070-77 = ""
10033070-78 = "Отличная работа, Сенсей."
10033070-79 = "К счастью, студенты Геенны уснули быстрее, чем я ожидала."
10033070-80 = "[s1] «Я был уверен, что будет кровавая битва подушками...»\n[s2] «Я думал, студенты будут носиться по улицам и кричать что-нибудь вроде „Свобода!!!“...»"
10033070-83 = "Они все довольно сильно устали."
10033070-84 = "Но, разумеется, мы не можем халтурить на ночном патруле!"
10033070-85 = "[s] «Ты усердно работаешь, руководя этой экскурсией, Умика.»"
10033070-86 = "Наоборот. Кажется, я постоянно показываю всем себя с худшей стороны."
10033070-87 = "Когда я вспоминаю всё, что произошло за последний день... Мне просто хочется свернуться где-нибудь в яме и исчезнуть."
10033070-88 = "Я совершенно не справилась с расписанием, а маршрут оказался скорее рекомендацией, чем планом."
10033070-89 = "Босс справилась бы со всем намного плавнее..."
10033070-90 = "[ns3] «Я слышал одну поговорку...»\n[ns4] «Планы бесполезны, но планирование — это всё.»"
10033070-93 = "Ч-что? Я не понимаю..."
10033070-94 = "...Когда-нибудь я пойму это естественным образом? Как загадочно."
10033070-95 = "[s] «Даже фестивали часто идут не по плану, разве нет?»"
10033070-96 = ""
10033070-98 = "Фестивали, говорите..."
10033070-99 = "Пожалуй, вы правы. Вообще-то фестивали редко проходят именно так, как мы ожидаем."
10033070-100 = "На фестивалях обычно полно сюрпризов и трудностей, поэтому гибкость необходима для успеха."
10033070-101 = "Однако..."
10033070-102 = "Мне ведь раньше никогда не приходилось самой разбираться с такими неожиданными ситуациями."
10033070-103 = "[s] «Это немного удивительно.»"
10033070-104 = "Ну, обычно всеми нашими усилиями руководит босс."
10033070-105 = "Довольно жалко с моей стороны, правда? Я утверждаю, что люблю фестивали, и действительно вкладываю все силы в планирование и подготовку..."
10033070-106 = "Но теперь начинаю понимать, что всегда уклонялась от самых сложных аспектов управления фестивалем. Босс меня слишком избаловала."
10033070-107 = "Я не собираюсь сдаваться и знаю, что должна довести всё до конца."
10033070-108 = "Просто иногда ничего не могу поделать с мыслью: «Вот бы босс была здесь...»"
10033070-109 = "[s5] «Это совершенно естественно, когда берёшься за что-то новое.»\n[s6] «Но ведь ты вложила в это все силы, разве нет?»"
10033070-112 = "Пожалуй..."
10033070-114 = "Хия! Атака!"
10033070-115 = "[ns] «Ого?!»"
10033070-117 = "К-Кирара? Эрика?"
10033070-118 = ""
10033070-120 = ""
10033070-121 = "Привет-привет! Мы увидели, как вы патрулируете, и ты выглядела немного грустной!"
10033070-122 = "Тебе правда стоит быть осторожнее."
10033070-123 = "Я ведь никого не задела, да? В любом случае, чего ты так себя грызёшь?"
10033070-124 = "Это... Ну..."
10033070-128 = ""
10033070-130 = "По-моему, ты отлично справляешься!"
10033070-131 = "Это очень мило с твоей стороны. Но сегодня ничего не пошло по плану, и мы ужасно отстали от расписания."
10033070-132 = "Хм. Немного иронично слышать это от меня..."
10033070-133 = "Но ты имеешь дело со студентами Геенны, понимаешь? Как сказала Кирара, учитывая это, ты справилась отлично."
10033070-134 = "Точно! Так что хватит себя ругать, госпожа экскурсовод!"
10033070-135 = "Вид на Древо божеств с Обсерватории был потрясающим! Всем понравилось мастерить поделки, а ужин был отпад!"
10033070-136 = "А испытание храбрости было... Оно было... эм..."
10033070-137 = "Оно было настолько ужасным?!"
10033070-138 = "Прости-прости. Я не это хотела сказать. Опыт определённо был... интересный."
10033070-139 = ""
10033070-141 = ""
10033070-142 = "Нет, не извиняйся."
10033070-143 = "Я взялась за это дело, надеясь доказать, что чего-то стою. Вот... и всё."
10033070-144 = "[s] «Конечно, мы понимаем.»"
10033070-145 = "(Босс справилась бы со всем гораздо лучше.)"
10033070-146 = "Ничто никогда не идёт по плану на сто процентов! Такова жизнь."
10033070-147 = "Ага. Если только ты каким-то образом не умеешь предсказывать будущее, всё предусмотреть невозможно."
10033070-148 = "Сегодня мне было очень весело! И завтра тоже будет взрывно. Я просто знаю!"
10033070-149 = "Вы обе всегда так добры. Спасибо."
10033070-150 = "Это не просто слова. Я серьёзно."
10033070-151 = "В любом случае, посмотрите на вас двоих: всё ещё усердно работаете и патрулируете в такой час."
10033070-152 = "Хахаха! Команда экскурсоводов вообще никогда не спит!"
10033070-153 = ""
10033070-155 = ""
10033070-157 = "[ns] «Спасибо. Но есть один момент.»"
10033070-158 = "Хм? Что такое, учитель?"
10033070-159 = "[ns] «Разве у вас уже не прошёл комендантский час?»"
10033070-160 = ""
10033070-162 = ""
10033070-164 = "Ах."
10033070-165 = "Нас поймали! Хахаха! Бежим!"
10033070-166 = ""
10033070-169 = ""
10033070-170 = "[ns] «А ну стоять! Хулиганки!»"
10033070-172 = ""
10033070-173 = "(...)"
10033070-174 = "(Если только я не умею предсказывать будущее?)"
10033070-175 = "(Значит, если я просто смогу предусмотреть все возможные исходы...)"
10033070-176 = "(Тогда я смогу предотвратить любые сбои в расписании!)"
