[translation]
1005203-1 = "Секретарь становится учителем"
1005203-2 = "Исполнительный офис Шале"
1005203-3 = "Здравствуйте, Сенсей."
1005203-4 = "Я снова работаю сегодня в Шале."
1005203-5 = "Как обычно, надеюсь на плодотворную совместную работу."
1005203-6 = "[s] «Да. Я тоже.»"
1005203-7 = "Ты сегодня в хорошем настроении."
1005203-8 = "Случилось что-то хорошее?"
1005203-9 = "[s1] «Если точнее, вчера вечером мне пришла хорошая идея.»\n[s2] «Я придумал, как вывести Ноа из равновесия!»"
1005203-10 = "...А? Ты хочешь вывести меня из равновесия?"
1005203-11 = "...Вывести меня из равновесия?"
1005203-12 = "Никогда не думала, что моё самообладание чем-то особенно примечательно..."
1005203-13 = "Но мне любопытно, раз оно заставляет тебя бросить мне вызов."
1005203-14 = "Итак, что это за хорошая идея?"
1005203-15 = "[s] «На этот раз я буду записывать твои действия.»"
1005203-16 = "А, понятно. Решил поменяться со мной ролями. Сегодня ты будешь секретарём, а я буду..."
1005203-17 = "Что ж, для меня это будет новый опыт."
1005203-18 = "Обычно именно я записываю действия других людей..."
1005203-19 = "Мне никогда не приходило в голову самой стать объектом записи."
1005203-20 = "Полагаю, сегодня мы можем наблюдать друг за другом во время работы."
1005203-21 = "О, но заранее хочу предупредить..."
1005203-22 = ""
1005203-24 = ""
1005203-26 = ""
1005203-27 = "Это будет непросто. Хи-хи."
1005203-29 = "Тридцать минут спустя..."
1005203-31 = "..."
1005203-32 = "[s] «...»"
1005203-33 = "... ♪"
1005203-34 = "Сенсей? Ты выглядишь уставшим."
1005203-35 = "[s] «Почему наблюдать за кем-то так утомительно...»"
1005203-36 = "Правда?"
1005203-37 = "Слова — самый громкий способ передать намерение, но далеко не единственный. Язык тела, выражение лица... Нужно замечать столько всего."
1005203-38 = "Нелегко уместить весь этот бесконечно растущий объём информации на маленьких листках бумаги."
1005203-39 = "[s] «Не недооценивай меня! Я пока не пропустил ни одного твоего действия!»"
1005203-40 = "Ты очень стараешься, Сенсей. Хи-хи."
1005203-41 = "Такими темпами нам понадобятся дополнительные письменные принадлежности. Я схожу за ними на склад."
1005203-42 = ""
1005203-44 = ""
1005203-46 = ""
1005203-50 = "Я вернулась!"
1005203-51 = ""
1005203-53 = ""
1005203-54 = "Теперь..."
1005203-55 = "Время викторины!"
1005203-56 = "[s] «Внезапная викторина?!»"
1005203-57 = "Ты выглядишь очень уверенно, поэтому мне захотелось тебя проверить."
1005203-58 = "Если ответишь правильно, я выполню любую одну твою просьбу."
1005203-59 = "Но если ошибёшься... Ты должен мне чашку кофе за невнимательность!"
1005203-60 = "[s] «Звучит достаточно просто, но...»"
1005203-61 = "Итак, вопрос..."
1005203-62 = "Прежде чем вернуться сюда, я изменила одну деталь своего наряда."
1005203-63 = "Что сейчас в моём наряде отличается от того, что было раньше?"
1005203-64 = "[s3] «Сложный вопрос...»\n[s4] «Выглядит так же...»"
1005203-65 = "Мне немного обидно. Если ты действительно внимательно наблюдал, ответить должно быть нетрудно."
1005203-66 = "Мне немного обидно. Если ты действительно внимательно наблюдал, ответить должно быть нетрудно."
1005203-67 = "И второй попытки не будет, так что будь осторожен."
1005203-68 = "[s] «...Ты поменяла заколку?»"
1005203-69 = "Нет! Неправильно."
1005203-70 = "Хи-хи, как и обещал, ты должен мне чашку кофе."
1005203-71 = ""
1005203-73 = ""
1005203-74 = ""
1005203-76 = "[ns] «Так что же ты изменила?»"
1005203-77 = ""
1005203-78 = "Ты всё ещё не заметил?"
1005203-79 = "Ответ... ничего!"
1005203-80 = "[s5] «Что?!»\n[s6] «Ты меня обманула!»"
1005203-81 = "Что такое? Я всего лишь задала вопрос. И ответ всё это время был прямо перед тобой!"
1005203-82 = "Обманула? Я всего лишь задала вопрос. И ответ всё это время был прямо перед тобой!"
1005203-83 = "Иногда сам вопрос становится одним из тех субъективных предубеждений, о которых я говорила раньше."
1005203-84 = "Хороший секретарь не позволяет таким предубеждениям влиять на свой подход."
1005203-85 = "Только тогда мы можем увидеть реальность такой, какая она есть... и не попасться на уловки плохих студентов вроде меня."
1005203-86 = "Так что раскрой глаза пошире и как следует наблюдай за мной."
1005203-88 = "Я изо всех сил уставился прямо на Ноа, пытаясь заметить хоть малейшее изменение..."
1005203-89 = "Хи-хи, сегодня кофе кажется слаще обычного!"
1005203-90 = ""
1005203-92 = ""
1005203-93 = "Но безрезультатно..."
