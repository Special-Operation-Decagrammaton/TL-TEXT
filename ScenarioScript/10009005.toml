[translation]
10009005-3 = "Гааах!"
10009005-4 = "Ч-Что за...?!"
10009005-5 = ""
10009005-6 = ""
10009005-10 = "Хорошо. Мы успели обезвредить их до того, как ситуация обострилась."
10009005-11 = "Теперь нужно избавиться от тел..."
10009005-12 = "Кхм, то есть... перенести раненых в медпункт."
10009005-13 = "С-спасибо за помощь!"
10009005-14 = "Я лишь исполняла свой долг как член клуба экстренной медицинской помощи.#nНе стоит меня благодарить."
10009005-15 = "[s] «Сэна, это ты?»"
10009005-16 = "Хм?"
10009005-17 = "Ах, здравствуйте, Сенсей [USERNAME]. Не ожидала встретить вас здесь."
10009005-18 = "Вы здесь патрулируете?"
10009005-19 = "Понятно. Должно быть, от имени Шале."
10009005-20 = "Интересуетесь, что привело сюда меня?"
10009005-21 = "Мне сообщили, что здесь будут трупы."
10009005-22 = "Прошу прощения. Я хотела сказать, что мне сообщили о большом числе раненых в результате боёв."
10009005-23 = "Поэтому я патрулирую район в рамках деятельности клуба."
10009005-24 = "[s] «Не знал, что клуб экстренной медицинской помощи занимается такими вещами.»"
10009005-25 = "День святого Валентина — особое исключение, ведь это такой важный праздник.#nВ этот день люди обмениваются шоколадом, чтобы передать чувства, которые хранят в сердце."
10009005-26 = "Если задуматься, это довольно светлое событие — и его стоит защищать."
10009005-27 = "[s] «Немного неожиданно слышать такое от тебя...»"
10009005-28 = "Однако именно из-за этих добрых намерений в такой день мы должны быть особенно бдительны."
10009005-29 = "Некоторые негодяи могут воспользоваться праздником и напасть на магазины с особым шоколадом, как вы уже видели."
10009005-30 = "Также между конкурирующими торговцами могут возникнуть конфликты из-за продаж шоколада,#nа ещё хуже — могут столкнуться силы за гранью нашего понимания, сражаясь за сердца определённых людей."
10009005-31 = "Неизвестно, сколько трупов может устилать улицы в такой день... Кхм, то есть сколько людей может пострадать."
10009005-32 = "В Кивотосе в такой день нет ни минуты покоя."
10009005-33 = ""
10009005-35 = ""
10009005-36 = "Как президент клуба экстренной медицинской помощи, я считаю этот сезон самым напряжённым."
10009005-37 = "А теперь прошу меня извинить. Мне нужно предотвратить ещё несколько катастроф."
10009005-38 = "[s] «Что-то не очень верится...»"
10009005-39 = "Вы слишком наивны, Сенсей."
10009005-40 = "Катастрофа может случиться в любой момент."
10009005-41 = ""
10009005-44 = "[ns] «Эм...»"
10009005-46 = "Ч-что происходит?!"
10009005-47 = "То здание внезапно рухнуло!"
10009005-48 = "Смотрите! Срочный выпуск новостей!"
10009005-50 = "Срочные новости! Только что поступило сообщение из торгового района D.U. №3!"
10009005-51 = "Замечена разыскиваемая преступница, известная как Лиса Бедствий!#nВсем гражданам поблизости от торгового района настоятельно рекомендуется эвакуироваться!"
10009005-52 = "[s] «Лиса Бедствий?»"
10009005-53 = ""
10009005-56 = ""
10009005-58 = ""
10009005-59 = "..."
10009005-61 = "Докладываю из торгового района! Подозреваемая в поле зрения!"
10009005-62 = "Мы не знаем, чего ты добиваешься, но бежать тебе некуда!#nСдавайся, Косака Вакамо!"
10009005-63 = ""
10009005-66 = ""
10009005-67 = ""
10009005-68 = "Ну надо же. Опять вы, мошки."
10009005-69 = "Прочь. Вы мешаете мне."
10009005-70 = ""
10009005-72 = ""
10009005-79 = "А-А-а-а-а!"
10009005-80 = "Она нас уделала..."
10009005-81 = ""
10009005-83 = ""
10009005-86 = "Хи-хи. Как смело с вашей стороны думать, что вы способны меня остановить. ♥"
10009005-87 = "Время пришло. То, чего я так долго желала, наконец почти у меня в руках..."
10009005-88 = ""
10009005-90 = ""
10009005-93 = ""
10009005-95 = "...!"
10009005-96 = ""
10009005-99 = ""
10009005-100 = "Угроза обнаружена. Как президент клуба экстренной медицинской помощи,#nя не могу позволить тебе ранить ещё больше мирных жителей."
10009005-101 = "У нас и без того работы выше крыши."
10009005-102 = "Вот это неожиданность. Ты не похожа на студента Валькирии."
10009005-103 = "Ох, ну почему столько людей постоянно встают у меня на пути?#nВсё, чего я хочу, это—"
10009005-104 = "[s] «Стоять!»"
10009005-105 = ""
10009005-107 = ""
10009005-109 = "Открылась!"
10009005-111 = "...?!"
10009005-112 = "Стреляй, Кирино!"
10009005-114 = "Е-есть!"
10009005-115 = ""
10009005-117 = ""
10009005-118 = "В-вот я иду, Лиса Бедствий!"
10009005-119 = ""
10009005-125 = "Хорошо, Сенсей!"
10009005-126 = "Сейчас наш шанс!"
10009005-127 = ""
10009005-128 = "*падает*"
10009005-129 = "[s] «А?»"
10009005-130 = ""
10009005-132 = ""
10009005-134 = "Какого...?"
10009005-135 = ""
10009005-137 = ""
10009005-138 = "Она потеряла сознание..."
10009005-139 = "Вы серьёзно?!"
10009005-140 = ""
10009005-143 = ""
10009005-144 = "Подозреваемая задержана."
10009005-145 = "Отличная работа, все."
10009005-146 = "А?"
10009005-148 = "Отлично, Кирино! Ты уложила Лису Бедствий так, словно это пустяк! Это серьёзное достижение!"
10009005-149 = "Н-но мне кажется, я вообще..."
10009005-150 = "Я даже не уверена, что произошло."
10009005-151 = "Эх, не заморачивайся о деталях."
10009005-152 = "Как бы там ни было..."
10009005-153 = "...тебе удалось обезвредить одну из печально известных Семи Заключённых."
10009005-154 = "Вот уж есть чем похвастаться."
10009005-155 = "Т-Ты правда так думаешь?"
10009005-156 = "[s1] «Лиса Бедствий? Это же Вакамо, верно?»\n[s2] «Семь Заключённых? Что-то припоминаю.»"
10009005-157 = "А, точно. Я слышала, что некоторое время назад ты уже сталкивался с Вакамо."
10009005-158 = "А, точно. Я слышала, что некоторое время назад ты уже сталкивался с Вакамо."
10009005-159 = "Я раньше читала об этом в документах Валькирии!"
10009005-160 = "Там говорилось, что Вакамо сбежала из Исправительного бюро, но затем Сенсей [USERNAME] принял командование и разрешил ситуацию!"
10009005-161 = "[s3] «А, да. Кажется, такое было.»\n[s4] «У меня дежавю. Будто это происходило не один раз...»"
10009005-162 = "Хм. Ну, в любом случае..."
10009005-163 = "Хм. Ну, в любом случае..."
10009005-164 = "Лиса Бедствий — прозвище, которое получила Косака Вакамо."
10009005-165 = "Куда бы она ни пошла, за ней следует разрушение."
10009005-166 = "Что касается Семи Заключённых..."
10009005-167 = "Они сбежали из Исправительного бюро вместе с Вакамо, пока Генеральный студенческий совет был в смятении после исчезновения своего президента."
10009005-168 = "[s] «И ты говоришь, их СЕМЕРО?!»"
10009005-169 = "Ага. Сейчас под стражей только одна, так что на свободе остаются ещё шестеро."
10009005-170 = "Это значит, что преступницы не менее опасные, чем Вакамо, могут скрываться за любым углом Кивотоса!"
10009005-171 = "Жутковато, да?"
10009005-172 = ""
10009005-175 = "[ns] «Д-да, наверное...»"
10009005-176 = "Да ладно. Хоть немного энтузиазма."
10009005-177 = "Отстань, Фубуки. Слишком много информации за один раз."
10009005-178 = "Как бы то ни было, Вакамо считается одной из самых жестоких среди Семи Заключённых."
10009005-179 = "После прошлого инцидента она притихла, и я всё гадала, чем она может заниматься."
10009005-180 = "Но уж точно не ожидала столкнуться с ней сегодня."
10009005-181 = "Держу пари, за это нам полагается неплохая награда."
10009005-182 = "Хватит, Фубуки. Тебя только это и волнует..."
10009005-183 = "Не воспринимай всё так серьёзно."
10009005-184 = "В любом случае, спасибо вам обеим за помощь сегодня."
10009005-185 = "Если мы и правда получим награду, угостим вас чем-нибудь хорошим."
10009005-186 = "Не стоит. Я лишь выполняла свой долг."
10009005-187 = "Да ладно! Не нужно так скромничать."
10009005-188 = "[s] «Вакамо не показалась вам немного странной?»"
10009005-189 = "Что ты имеешь в виду?"
10009005-190 = "Похоже, у её нападения была какая-то конкретная цель.#nКогда мы ей помешали, она заметно растерялась."
10009005-191 = "Что-то заставило её потерять концентрацию?"
10009005-192 = "[s] «Хмм...»"
10009005-193 = "Ну, сейчас уже нет смысла об этом думать."
10009005-194 = "Нет смысла искать логику в мыслях такой преступницы, как она."
10009005-195 = "Теперь она под стражей, так что это уже неважно."
10009005-196 = "[s] «Возможно...»"
10009005-197 = ""
10009005-201 = ""
10009005-202 = "Внимание всем студентам Валькирии в D.U. Разыскиваемая преступница, известная как Лиса Бедствий, арестована."
10009005-203 = "Просим всех студентов Валькирии в D.U. помочь с транспортировкой подозреваемой. Пожалуйста, как можно скорее прибыть на Восточную улицу."
10009005-204 = "Фубуки, это к нам! Нам нужно идти!"
10009005-205 = "Эх... Разве мы сегодня ещё недостаточно работали?#nТащиться пешком до Исправительного бюро — такая морока."
10009005-206 = "Не начинай. Мы её арестовали, значит должны довести дело до конца!"
10009005-207 = "Да-да... Меньше всего мне хочется писать объяснительную за игнорирование приказа. Да и о награде тогда можно будет забыть."
10009005-208 = ""
10009005-210 = ""
10009005-211 = "Ладно. Мы скоро вернёмся, Сенсей."
10009005-212 = "Пока нас нет, продолжайте патрулировать."
10009005-213 = "До скорого!"
10009005-214 = ""
10009005-216 = ""
10009005-218 = "Полагаю, с этим разобрались. Нам обоим пора возвращаться к патрулированию."
10009005-219 = "[s5] «Ага. Хочешь пойти со мной?»\n[s6] «Вакамо, Лиса Бедствий. Хм...»"
10009005-223 = "Я продолжил патрулировать День святого Валентина вместе с Сэной, всё ещё пытаясь осмыслить произошедшее."
