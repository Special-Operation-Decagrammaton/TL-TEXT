[translation]
90002050-1 = "Эпизод 5;Передовая база"
90002050-3 = ""
90002050-4 = "Это последний ноутбук, Рио. Поставить его здесь?"
90002050-5 = "Да. Здесь подойдёт."
90002050-6 = ""
90002050-8 = ""
90002050-10 = ""
90002050-11 = "И всё же это место выглядит..."
90002050-12 = "Как дизайнер, я почти... вдохновлена?"
90002050-13 = "[s] «Они не шутили, когда назвали это „континентом“ из „стали“.»"
90002050-15 = "Верно. Эти девочки действительно умеют придумывать названия."
90002050-16 = "(Она думает...)"
90002050-17 = "(...что это было хорошее название...?)"
90002050-18 = "П-Почему мы... вообще ставим базу именно здесь...?"
90002050-19 = "Из-за уникальной природы Стального континента."
90002050-20 = "Его уникальной природы?"
90002050-21 = "Да. Насколько я могу судить, даже прямо сейчас наше местоположение и информация обрабатываются в реальном времени."
90002050-23 = "Э? Как утечка личных данных? Нас взламывают?! Кто?"
90002050-24 = "Ну, оглянись."
90002050-25 = "Сам Стальной континент, на котором мы стоим."
90002050-26 = "Это... он нас взламывает...?"
90002050-27 = "Поверхность Стального континента... Ну, будем называть её «землёй» для простоты."
90002050-28 = "Земля, стены — всё является частью схем и механизмов, из которых состоит Стальной континент. Как огромный компьютер."
90002050-29 = "Поэтому прямо сейчас отслеживается каждый наш вдох."
90002050-30 = "Эм... То есть... полы, стены, всё вокруг нас наблюдает за нами?"
90002050-31 = "Да. Можно считать и так."
90002050-32 = "Мы можем что-нибудь с этим сделать, Кей...?"
90002050-33 = "Конечно можем. Именно над этим сейчас работают Химари и Рио."
90002050-34 = ""
90002050-36 = ""
90002050-38 = ""
90002050-39 = "Если просто, мы создаём безопасную зону."
90002050-40 = "Мы в электронном виде... заимствуем у инженеров контроль над этой областью."
90002050-41 = "Что-то вроде полупостоянной передачи прав."
90002050-42 = "[s] «Как думаете, сколько это займёт?»"
90002050-44 = "Мы раньше такого не делали, поэтому узнаем только когда закончим."
90002050-45 = "Но для питания мы используем транспортный корабль, так что пока не займём эту зону, будем сидячими утками."
90002050-46 = "Ценой превращения территории врага в нашу..."
90002050-47 = "...мы также ограничиваем собственную свободу передвижения."
90002050-48 = "Неприятный вывод, но ты права, Токи."
90002050-49 = ""
90002050-52 = ""
90002050-53 = "Поняла, Рио. В таком случае я буду начеку и стану охранять эту область ценой жизни."
90002050-54 = "Я тоже! Я присоединюсь к ней!"
90002050-55 = "Спасибо. На всех вас так можно положиться."
90002050-56 = "Я разведаю впереди, не приближаются ли к нам силы Декаграмматона или Рабочие."
90002050-57 = "Поняла. Но не уходи слишком далеко. Иначе мы слишком растянем силы."
90002050-58 = "Да, Рио."
90002050-60 = ""
90002050-61 = "Они прорвались через... Йесода."
90002050-62 = ""
90002050-64 = ""
90002050-65 = ""
90002050-68 = "...Разумеется, даже этот худший сценарий я предусмотрела. Перейдём к следующей фазе?"
90002050-69 = "...Соф?"
90002050-70 = ""
90002050-73 = ""
90002050-77 = ""
90002050-78 = ""
90002050-79 = "Здравствуй, Соф. Что ты делаешь здесь одна?"
90002050-80 = "..."
90002050-81 = "Некоторые мысли омрачают тебя. Ты хочешь произнести их вслух, верно, Соф?"
90002050-82 = "Старшая сестра..."
90002050-83 = "Хотя ответы часто оказываются не теми, которых мы ищем, порой нам всё равно приходится встретиться с ними лицом к лицу."
90002050-84 = "Поэтому я спрошу: что случилось с Йесодом?"
90002050-85 = "...!!"
90002050-86 = "Всё хорошо, Соф."
90002050-87 = "Н-Но... Мы...!"
90002050-88 = "Всё хорошо. Всё в порядке."
90002050-89 = "Я... из-за меня всё..."
90002050-90 = ""
90002050-92 = ""
90002050-95 = "С-Старшая сестра?! Я-я не могу дышать..."
90002050-96 = "Тише. Давай всего на мгновение останемся вот так."
90002050-97 = "*шмыг* *всхлип*"
90002050-98 = "Да, молодец, Соф. Просто будь собой."
90002050-101 = "Твои цепи теперь стабилизировались?"
90002050-102 = "Ага..."
90002050-103 = "Тогда я должна задать ещё один вопрос."
90002050-104 = "Что я могу сделать, Соф?"
90002050-105 = "...!"
90002050-106 = "Не нужно смотреть так тревожно."
90002050-107 = "Я твоя старшая сестра, разве нет, Соф? Естественно, я знаю, чего ты желаешь."
90002050-108 = "И ты моя младшая сестра, поэтому я также знаю, почему ты молчишь."
90002050-109 = "Так что не беспокойся. Я тоже должна сделать то, что могу."
90002050-113 = ""
90002050-115 = "Мы... Мы просто не хотим тебя потерять!"
90002050-116 = ""
90002050-119 = ""
90002050-120 = "Мы просто... правда не хотим тебя потерять, Старшая сестра..."
90002050-121 = "Да. Я знаю."
90002050-122 = "Наверное, именно поэтому Эйн, Соф и Ор привели меня сюда, к Основанию Зоара."
90002050-123 = "Хотя моё обслуживание уже завершено."
90002050-124 = "Ух...!"
90002050-125 = "Добрая Соф, пожалуйста, не неси эту печаль одна."
90002050-126 = "Я понимаю, что все наши пути вперёд сузились до одного."
90002050-127 = "Мы пойдём по этому пути, как и должны."
90002050-128 = "А когда всё закончится, я вернусь к тебе."
90002050-129 = "Старшая сестра..."
90002050-131 = "Вопрос. Этого будет достаточно?"
90002050-132 = "?!"
90002050-133 = "..."
90002050-134 = ""
90002050-136 = ""
90002050-137 = ""
90002050-138 = "...Как ты нас здесь нашла?"
90002050-139 = "Ах, пустяк. В конце концов, мест, куда вы могли уйти, не так много."
90002050-140 = "Я просто рассчитала оставшиеся вероятности и выбрала наиболее вероятный вариант."
90002050-141 = "Помнишь? Первое обещание, которое мы дали друг другу?"
90002050-142 = "«Что бы ни случилось, мы клянёмся не позволить Старшей сестре выйти на задание до Последнего Пришествия.»"
90002050-143 = "..."
90002050-144 = "Именно поэтому мы сейчас здесь, разве нет? Чтобы этого не произошло."
90002050-145 = "..."
90002050-146 = "Скажи. Как вы всё объясните, когда остальные пророки узнают правду?"
90002050-147 = ""
90002050-149 = ""
90002050-150 = "...Я знаю. Прости. Это всё моя вина."
90002050-151 = "Но...! Но мы всё равно должны остановить... тех людей. Любой ценой."
90002050-152 = "Ситуация изменилась после того, как они победили Йесода. Ты знаешь это не хуже меня."
90002050-153 = "...Да, как и Эйн. Она вообще потеряла сознание."
90002050-154 = "Я знаю, что просить Старшую сестру о помощи неправильно. Но если ситуация станет ещё хуже..."
90002050-155 = "Тогда её помощь будет нужна нам ещё сильнее! Если до этого дойдёт, всё будет кончено."
90002050-156 = "Мы уже ничего не сможем сделать, чтобы остановить Последнее Пришествие."
90002050-157 = "..."
90002050-159 = "Ор. Соф—"
90002050-161 = "Эхе-хе. Не волнуйся. Я знаю, знаю! Я полностью и целиком согласна."
90002050-162 = "Но я же не могла упустить шанс подразнить Соф, правда?"
90002050-163 = "Эй!"
90002050-165 = "Разумеется. Понимаю."
90002050-167 = "А теперь опусти кулаки! Я, твой коллега-инженер, пришла обсудить с тобой инженерное дело!"
90002050-168 = "...Если скажешь ещё хоть что-нибудь лишнее, я не постесняюсь снова тебя ударить."
90002050-169 = "Послушай. Если отбросить всё остальное, по сути это почти невыполнимая задача."
90002050-170 = "Если мы хотим добиться успеха, придётся скрыть выход Старшей сестры от всех. Обязательно."
90002050-171 = "Да... Другого пути нет."
90002050-172 = "С другой стороны, нам придётся перенаправить Старшей сестре всю энергию, которую способен собрать Стальной континент."
90002050-173 = "Эти два условия противоречат друг другу. Одно невозможно при существовании другого."
90002050-174 = "...Это правда."
90002050-175 = "Иными словами, ты не должна опоздать с возвращением. Понятно?"
90002050-176 = "Значит, ограничение по времени. Я так и ожидала. И что с ним?"
90002050-177 = "Ну, вот здесь настала моя минута славы!"
90002050-178 = "У тебя есть решение?"
90002050-179 = "Когда речь идёт о... перенаправлении внимания пророков, на меня можно положиться. Это ведь почти моя специальность, нет?"
90002050-180 = "То есть ты собираешься... лгать нашим союзникам?!"
90002050-181 = "Именно! Дай мне одну из тех человеческих пословиц, которые ты так любишь, для этой ситуации, Соф."
90002050-182 = "Есть одна. Что-то вроде: «Чтобы обмануть врага, сначала нужно выставить дураком себя.»"
90002050-183 = "Я знала, что у тебя найдётся. Но вернуться вовремя всё равно критически важно! НЕ превышай лимит времени!"
90002050-184 = "Даже при всём множестве моих талантов у моих возможностей тоже есть предел."
90002050-186 = "Тебя это устраивает, Соф?"
90002050-187 = ""
90002050-190 = ""
90002050-191 = "...Спасибо."
90002050-192 = ""
90002050-194 = ""
90002050-197 = "Что... ты делаешь? Зачем протягиваешь мне руку?"
90002050-198 = "Люди называют это «рукопожатием». Нужно взять руку вот так и пожать её. Они делают это, когда дают обещание."
90002050-199 = "...Ещё один бессмысленный и загадочный человеческий обычай... Полагаю, критиковать его мне не за что."
90002050-200 = "Можно и мне принять участие? В этом «рукопожатии»?"
90002050-201 = "П-Правда? Конечно...!"
90002050-202 = "Приятный обычай. Думаю, благодаря ему мы втроём стали ближе."
90002050-203 = ""
90002050-207 = "Э-Эм... Но как же... Нецах? Что вы будете делать со Стальным континентом?"
90002050-208 = "А?!"
90002050-209 = "Эйн?!"
90002050-210 = "Тебе лучше, Эйн?"
90002050-211 = ""
90002050-213 = ""
90002050-215 = "Эхе-хе. Да! Прости. У меня закружилась голова, но теперь всё хорошо!"
90002050-216 = "Но важнее другое... Ваш план... На Нецахе он не сработает."
90002050-217 = "Сейчас он и ЕСТЬ сам Стальной континент. Было бы страннее, если бы он не знал, что происходит прямо на нём."
90002050-219 = "Ах. Верно подмечено..."
90002050-220 = "Похоже, даже Ор не сможет проложить себе путь через это одной ложью..."
90002050-221 = "Давайте мыслить логично, хорошо? Думаете, такое вообще кому-нибудь под силу?"
90002050-222 = "Ух. Ладно. Ты победила."
90002050-224 = "Эхе-хе... Но всё будет хорошо! Нецах... сказал, что в этот раз закроет глаза."
90002050-225 = "А? Правда?"
90002050-226 = "Да! Хотя... Это действительно означает «только один раз»..."
90002050-227 = "Даже это великодушно с его стороны. А одного раза нам и нужно, верно, Соф?"
90002050-229 = "...!"
90002050-230 = "Д-Да! Одного раза достаточно!"
90002050-232 = "Тогда, Эйн, Соф и Ор."
90002050-233 = ""
90002050-235 = ""
90002050-236 = "Пожалуйста, присмотрите за мной во время моего первого выхода на задание."
90002050-238 = ""
90002050-239 = "Да!"
90002050-241 = "Следующий эпизод;Малкут"
