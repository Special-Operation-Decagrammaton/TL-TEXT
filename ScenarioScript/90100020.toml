[translation]
90100020-1 = "Эпизод 2;Между сверхчеловеком и лисой"
90100020-5 = ""
90100020-6 = "Как же жаааарко!"
90100020-7 = "Почему уже настолько отвратительно жарко? До лета ещё несколько месяцев."
90100020-8 = "А двор Исправительного бюро — вообще худшее место. Тени нет, всё под открытым небом, и настолько пекло, что я ВИЖУ, как от земли поднимается марево."
90100020-9 = "Это жестокое и необычное наказание. У них такой огромный комплекс, а денег на какой-нибудь хлипкий навес от солнца нет?"
90100020-10 = ""
90100020-12 = ""
90100020-13 = ""
90100020-14 = "Думаю, это скорее чтобы охрана могла за нами следить."
90100020-15 = "Конструкции отбрасывают тени, знаешь ли. А значит, появляются слепые зоны. А ЭТО значит — больше возможностей для побега заключённых."
90100020-16 = "Я слышала, Вакамо вообще сбежала потому, что кто-то пронёс инструменты и спрятал их за деревом."
90100020-17 = "Угх... Никогда она мне не нравилась."
90100020-18 = "Надо было преподать ей НАСТОЯЩИЙ урок, чтобы она даже МЕЧТАТЬ не смела о побеге."
90100020-19 = ""
90100020-22 = ""
90100020-23 = "Успокойся, Куруми. Существуют важные и необходимые законы, запрещающие нам применять чрезмерную силу."
90100020-24 = "Да... Но теперь, когда мы сами застряли в Исправительном бюро, я никак не могу перестать о ней думать. А ещё эта жара — ладно, я немного раздражена, ясно?"
90100020-25 = "...Нико, как тебе вообще не жарко? Ты даже не вспотела!"
90100020-26 = "Хмм... Наверное, я обычно мёрзну. Здесь даже довольно тепло и приятно."
90100020-27 = "...Странно. Мы все проходили одинаковую тренировку в экстремальной жаре, так почему у нас настолько разная переносимость?"
90100020-28 = "Может, генетика."
90100020-29 = "Интересно. Может, потому что твои «достоинства» меньше, чем у Нико?"
90100020-30 = "Какие ещё «достоинства»?!"
90100020-31 = "Уши. Твои уши... А ты о чём подумала?"
90100020-32 = "Говорят, конечности сильнее всего чувствуют изменения температуры, верно?"
90100020-33 = "У Нико такие пушистые уши-спутниковые тарелки — может, они помогают отводить тепло."
90100020-34 = "Кстати... летом верхняя часть моих ушей и правда нагревается быстрее остального тела."
90100020-35 = "А зимой уши так мёрзнут, что начинают болеть, и из-за этого трудно долго быть на улице."
90100020-36 = "Понятно... Значит, ничего не поделаешь."
90100020-37 = "Но всё равно я предпочитаю зиму лету. Ненавижу, когда грудь вся потная и липкая."
90100020-38 = ""
90100020-40 = ""
90100020-41 = ""
90100020-42 = "...Тц."
90100020-43 = "Ты сейчас цокнула языком?"
90100020-44 = "Да ни за что! Не я."
90100020-45 = "Врёшь! Я слышала! Щёлк — и «тц». Что ты хотела этим сказать?"
90100020-46 = ""
90100020-48 = ""
90100020-49 = ""
90100020-50 = "...А Юкино всё ещё бегает круги."
90100020-51 = "Юкино, когда ты уже сделаешь перерыв? Время прогулки почти закончилось!"
90100020-52 = ""
90100020-54 = ""
90100020-56 = ""
90100020-57 = ""
90100020-58 = "...Ещё один круг."
90100020-59 = ""
90100020-61 = ""
90100020-62 = ""
90100020-63 = "Знаете, с тех пор как нас заперли, Юкино почти с нами не разговаривает. Только тренируется целыми днями."
90100020-64 = "Может, ей нужно немного побыть одной и собраться с мыслями."
90100020-71 = ""
90100020-72 = "...Ну, подумать ей есть о чём."
90100020-73 = "...Пожалуй."
90100020-74 = "Я рада, что она так мотивирована тренироваться, но надеюсь, она не причинит себе вреда."
90100020-77 = ""
90100020-78 = ""
90100020-79 = "(Я не могу терять здесь время. Я должна взять ответственность.)"
90100020-80 = "(Нужно заставлять себя двигаться дальше, стараться сильнее и учиться доверять другим. Пора взрослеть.)"
90100020-81 = "(Но...)"
90100020-83 = "Отвечай за свои поступки!"
90100020-84 = "Кто ты такая, чтобы называть это «миссией ради народа»?! Ты знаешь, сколько я потерял из-за твоего самоуправства?"
90100020-85 = ""
90100020-87 = "Почему страдать должна именно я? Почему я — исключение?!"
90100020-88 = "...Возможно, стоило просто позволить аварии произойти."
90100020-89 = ""
90100020-91 = "Мне больше нечего тебе сказать! Приведите кого-то компетентного! Кого-то выше по должности! Мне нужен тот, кто способен взять ответственность!"
90100020-92 = ""
90100020-93 = "(...Я всё ещё не уверена, как должна была поступить.)"
90100020-94 = "(Разрешилось бы всё само со временем, как настаивал Сенсей?)"
90100020-95 = "(Или силы было слишком много? Бремя, которое мог вынести только сверхчеловек вроде президента? Может, это изначально было за пределами моих возможностей?)"
90100020-96 = "Госпожа... 5-5020...?"
90100020-97 = "П-пожалуйста, заключённая 5020...! Простите, можно вас на минуту?"
90100020-98 = ""
90100020-99 = "Директор кого-то ищет."
90100020-100 = "Разве это не номер Юкино?"
90100020-101 = "Юкино, эй. Она тебя зовёт. Остановись."
90100020-104 = ""
90100020-105 = "...Прошу прощения, госпожа Юкино. Я понимаю, что у вас прекрасное имя и вы не... привыкли отзываться на идентификационный номер. К сожалению, такова политика Бюро при публичных объявлениях."
90100020-106 = "...Прошу прощения, директор. Я слишком увлеклась тренировкой."
90100020-107 = "Чем могу помочь?"
90100020-108 = "У вас посетитель. Не могли бы вы привести себя в порядок, а затем позволить мне проводить вас к ней?"
90100020-109 = "...Посетитель? Но я думала, часы посещений уже закончились."
90100020-110 = "Совершенно верно. Но это не ПРОСТО посетитель, госпожа Юкино."
90100020-111 = ""
90100020-113 = ""
90100020-114 = "...Это президент Генерального ученического совета."
90100020-115 = "ТА САМАЯ президент Генерального ученического совета...?"
90100020-119 = ""
90100020-120 = "Директор, если позволите спросить..."
90100020-121 = "Это правда она? Президент Генерального ученического совета вернулась?"
90100020-122 = "Да. В Валькирии сейчас... настоящий переполох. Она внезапно вернулась после долгого отсутствия. Для всех нас это стало неожиданностью."
90100020-123 = "Она уже усердно работает и, как всегда, блестяще справляется. Она творит чудеса с накопившимися делами Совета."
90100020-124 = "Может, потом ей стоит помочь и нам в Исправительном бюро..."
90100020-125 = ""
90100020-127 = ""
90100020-128 = "(Если она собиралась вот так по прихоти вернуться, зачем мы вообще прошли через все эти трудности...?)"
90100020-129 = "К-конечно, каждому отделу Валькирии нужны внимание и забота. Прежде всего нам нужно разобраться с главой обороны..."
90100020-130 = ""
90100020-132 = ""
90100020-133 = "...Ах, прошу прощения. Я, как обычно, заболталась."
90100020-134 = "Не за что."
90100020-135 = ""
90100020-143 = "Президент Генерального ученического совета. Юкино, заключённая № 5020, прибыла, как вы просили."
90100020-144 = "Приём."
90100020-145 = "(...Незнакомый голос.)"
90100020-146 = "(Нет, скорее не «незнакомый»... Что-то не так. Жуткое чувство. И ЭТО президент Генерального ученического совета?)"
90100020-147 = "(Как она вообще звучала раньше?)"
90100020-148 = "(Я даже не могу вспомнить её лицо.)"
90100020-149 = ""
90100020-153 = ""
90100020-154 = "Исполнительный офис Генерального ученического совета"
90100020-155 = ""
90100020-156 = ""
90100020-157 = "Рада тебя видеть, командир отряда Юкино."
90100020-158 = ""
90100020-160 = ""
90100020-161 = "Вы... Да..."
90100020-162 = ""
90100020-164 = ""
90100020-165 = ""
90100020-166 = ""
90100020-167 = ""
90100020-169 = "...Президент Генерального Студсовета."
90100020-170 = "Давно не виделись. В тебе теперь чувствуется что-то другое."
90100020-171 = "Правда? В последнее время я часто это слышу."
90100020-172 = "Что ж, полагаю, всё потому, что меня так долго не было. Изменилась и я, и Генеральный ученический совет."
90100020-173 = ""
90100020-175 = ""
90100020-176 = ""
90100020-177 = "Присаживайся. Нам многое нужно обсудить."
90100020-179 = "...Я наверстывала отчёты. Пока меня не было, произошло немало исторических событий."
90100020-180 = "Например, как отряд FOX помог главе обороны Кае устроить переворот."
90100020-181 = "...Верно."
90100020-182 = "Не переживай. Я здесь не для того, чтобы отчитывать тебя, командир отряда Юкино."
90100020-183 = "На самом деле... это я должна перед тобой извиниться."
90100020-184 = "Я исчезла без единого слова. Оставила всех без должного руководства, и в результате произошло бесчисленное множество происшествий и недоразумений."
90100020-185 = "Это была моя ответственность. Да, пока меня не было, многие ученики сделали неправильный выбор. Но я не могу возложить на них ответственность за это."
90100020-187 = "...Потому что это была моя ошибка."
90100020-188 = ""
90100020-189 = "...У меня нет оправдания своим поступкам."
90100020-190 = "И особенно мне жаль членов отрядов академии SRT."
90100020-191 = "В моё отсутствие SRT ослабла и потеряла направление, что в конечном итоге привело к роспуску академии..."
90100020-192 = "...Как назывались те девушки, что остались? Отряд RABBIT?"
90100020-193 = "Они были первокурсницами. Я причинила им много страданий."
90100020-194 = "Как только закончу с обязанностями в Генеральном студенческом совете, возрождение академии SRT станет моим приоритетом. Я хочу, чтобы эти студенты получили лучшее возможное образование."
90100020-195 = ""
90100020-197 = ""
90100020-198 = "Это всё, о чём я могла бы мечтать."
90100020-199 = "...Однако."
90100020-200 = "Это не стирает ущерб, который вы причинили гражданам Кивотоса."
90100020-201 = "Саботаж инфраструктуры, снайперские атаки на сотрудников Генерального ученического совета и попытка взорвать бомбу в самом сердце города ради переворота... Это серьёзные преступления, Юкино."
90100020-202 = "Помилование могло бы смягчить моё личное чувство вины, но общественность так легко не забудет. Мы уже подорвали их доверие к нам."
90100020-203 = "Прошу понять. Мы не можем относиться к этому легкомысленно, даже сосредоточившись на восстановлении SRT."
90100020-204 = "Я знала, что делаю. С самого начала я была готова понести соответствующее наказание, каким бы тяжёлым оно ни было."
90100020-205 = "Но... члены моего отряда всего лишь выполняли мои приказы. Отрядом руководила я."
90100020-206 = "Вы можете возложить всю ответственность на меня. И хотя я понимаю, как это выглядит со стороны, прошу лишь проявить милосердие к членам моего отряда."
90100020-207 = "...Юкино. Снова пытаешься взять всю ответственность на себя? Это твоя плохая привычка."
90100020-208 = "Как последствия и результаты не возникают из одной причины, так и общественные проблемы нельзя свести к одному козлу отпущения."
90100020-209 = "Каждый несёт свою долю ответственности. Каждый выполняет свою роль."
90100020-210 = "...И, разумеется, я не исключение."
90100020-211 = "Поэтому МЫ ВСЕ должны разделить бремя вины и ответственность за восстановление."
90100020-212 = ""
90100020-214 = ""
90100020-215 = ""
90100020-216 = "...Однажды я не смогла должным образом отреагировать на подозрение в террористической атаке. Мирные жители попали под перекрёстный огонь."
90100020-217 = "Люди справедливо хотели привлечь SRT к ответственности. Я была командиром на месте и потому сдалась, взяв всю ответственность на себя."
90100020-218 = "Но вы, президент Генерального ученического совета, вместо этого обвинили себя. Вы урегулировали ситуацию и не привлекли меня к ответственности."
90100020-219 = "Вы говорите, что один человек не может нести ответственность за все проблемы мира... Тогда почему вы в одиночку несли бремя силы SRT?"
90100020-220 = "Потому что... в то время у меня была возможность это сделать."
90100020-221 = "Тогда у меня хватало внутреннего ресурса, общественного капитала и полномочий, чтобы принять вину на себя."
90100020-222 = "Хороший руководитель не станет возлагать ответственность на подчинённого за выполнение задания. Ты действовала по моей просьбе, а у меня были средства тебе помочь."
90100020-223 = "В таком случае и я—"
90100020-224 = "Нет, Юкино. Ты слишком истощена. Вина давит на тебя."
90100020-225 = "Однажды твоей голове станет легче. И уверяю, тогда ещё не будет поздно помогать другим и возвращать свои долги."
90100020-226 = "Но сегодня у меня есть просьба."
90100020-227 = ""
90100020-229 = ""
90100020-230 = "...Я слушаю, президент Генерального ученического совета."
90100020-231 = "Мы не вернём честь SRT, сидя в Исправительном бюро и пережёвывая сожаления."
90100020-232 = "Я сделаю всё, чтобы искупить свои ошибки. Пожалуйста, отдайте мне приказ."
90100020-233 = ""
90100020-235 = ""
90100020-236 = ""
90100020-237 = "...Хотя помилование может оказаться невозможным, я МОГУ дать вам возможность послужить нашим гражданам."
90100020-238 = ""
90100020-240 = ""
90100020-241 = "Скажи, Юкино. Ты слышала о «Преданиях»?"
90100020-242 = "Это общий термин для беспочвенных слухов, историй и городских легенд, передаваемых от ученика к ученику. Раньше они распространялись из уст в уста, а интернет вызвал новый всплеск интереса к такому фольклору."
90100020-243 = "Предания охватывают истории, которые никак не могут существовать в нашей реальности. И всё же эти истории живут и распространяются, потому что, несмотря на фантастичность, в них есть крупица истины."
90100020-245 = "Например, поезд, направляющийся к станции из иного мира..."
90100020-247 = "Или неотслеживаемый голос на загадочной радиостанции, проклинающий каждого, кто его услышит..."
90100020-249 = "Или лифт, из которого после посадки и выхода по определённой процедуре уже невозможно вернуться..."
90100020-250 = ""
90100020-251 = "...Ты не выглядишь удивлённой. Ты ценитель подобных страшных историй?"
90100020-252 = "Нет. Я считаю непродуктивным позволять себе увлекаться подобными выдумками."
90100020-253 = "Разумеется. Сначала я тоже считала Предания полной нелепицей. Они будто никак не влияют на реальность и лишь легкомысленно отвлекают от настоящих проблем."
90100020-254 = "Однако в последнее время сразу несколько учеников заявили, что стали свидетелями проявлений Преданий."
90100020-255 = "Хуже того, другие утверждают, что подверглись нападению таких проявлений."
90100020-256 = "Эти так называемые «Предания» причиняют людям вред?"
90100020-257 = "Да. Несколько учеников загадочно исчезли после встречи с предполагаемыми существами. Другие... потеряли способность говорить."
90100020-258 = "Валькирия могла бы справиться, если бы это был различимый террористический акт или обычное исчезновение человека. Но ситуация гораздо сложнее. И требует осмотрительности."
90100020-259 = "Административный совет решил передать расследование организации более высокого уровня. Нам нужны специалисты, прежде чем эти городские легенды вызовут массовый вред и панику."
90100020-260 = "Нам нужно быстрое расследование вне обычных юридических процедур. Проще говоря, мне нужна отдельная группа, способная действовать за пределами полномочий обычных правоохранительных органов..."
90100020-261 = ""
90100020-263 = ""
90100020-264 = ""
90100020-265 = "...Вам нужна SRT."
90100020-266 = "Именно так, командир отряда."
90100020-267 = "Однако, как я уже говорила, это лишь предложение. Не приказ и не распоряжение."
90100020-268 = "Мы не знаем, с чем именно столкнёмся, и вам может грозить ужасная, потусторонняя опасность."
90100020-269 = ""
90100020-273 = ""
90100020-275 = "Если то, что там находится, одолеет вас, вы и сами можете стать Преданием."
90100020-276 = "Такова миссия. Вы согласны её принять?"
90100020-277 = ""
90100020-278 = "Да."
90100020-279 = "Нам нужно погасить долги."
90100020-280 = ""
90100020-282 = ""
90100020-283 = ""
90100020-284 = "Прекрасно. Я немедленно передам вам результаты наших исследований Преданий."
90100020-285 = "Нам нужно, чтобы вы собрали сведения о том, чем на самом деле являются эти феномены «Преданий». Вы должны понять этого врага, а затем устранить его."
90100020-286 = "...И ещё, Юкино. Это моя личная просьба, а не приказ президента Генерального ученического совета."
90100020-287 = ""
90100020-289 = ""
90100020-290 = "Пожалуйста, вернитесь в целости."
90100020-291 = "Без сомнений."
90100020-292 = "Мы доверяем своим инстинктам. И наша обязанность — понимать, когда следует отступить из боя, который невозможно выиграть."
90100020-294 = "Если позволите, у меня есть ещё одна просьба."
