[translation]
90100020-1 = "Episódio 02;Entre a Raposa e a Prodígio"
90100020-5 = ""
90100020-6 = "Que calor dos infernos......"
90100020-7 = "Por que tá tão quente assim? O verão ainda nem começou!"
90100020-8 = "Aliás... esse pátio da cadeia é o pior lugar do mundo.#nNão tem uma mísera sombra e esses muros de concreto barram até o vento..."
90100020-9 = "Será que acham que presidiária não tem direito a um resquício de sombra?!"
90100020-10 = ""
90100020-12 = ""
90100020-13 = ""
90100020-14 = "Não é óbvio? É pra não criar pontos cegos na visão dos guardas～"
90100020-15 = "Se tivesse esconderijo com sombra, ficaria fácil demais fugir da prisão, não acha?"
90100020-16 = "Ouvi dizer que a Wakamo recebia ferramentas de fuga exatamente debaixo da sombra das árvores."
90100020-17 = "Aquela desgraçada... Nunca fui com a fuça dela desde o primeiro dia."
90100020-18 = "A gente devia ter descido a lenha nela até ela perder qualquer vontade de pensar em fuga!"
90100020-19 = ""
90100020-22 = ""
90100020-23 = "Calma lá, Kurumi-chan. O regulamento proíbe expressamente o uso desmedido de força."
90100020-24 = "Eu sei perfeitamente disso... Mas me dar conta de que agora sou eu que tô presa num centro correcional me faz lembrar daquela época e me sobe um ódio mortal."
90100020-25 = "......Mas vem cá, Niko, você não sente calor não?#nTamo correndo juntas faz tempo e você não soltou uma gota de suor!"
90100020-26 = "Eu lido super bem com o calor. Uma temperatura amena como a de hoje até parece uma brisa refrescante pra mim."
90100020-27 = "Não é possível... Nós passamos rigorosamente pelo mesmo treinamento de aclimatação térmica da SRT...#nComo pode haver tanta discrepância?!"
90100020-28 = "Será que não é apenas diferença de biotipo corporal?"
90100020-29 = "......Não será porque a Kurumi tem [ruby=・]aquilo[/ruby] menor do que a Niko～?"
90100020-30 = "MENOR O QUÊ, SUA CARA DE PAU?!"
90100020-31 = "As orelhas, ué! As orelhas de raposa.#n......Hehehe, o que você andou imaginando aí, hein?"
90100020-32 = "Dizem que as extremidades do corpo são as mais sensíveis à troca de temperatura, não é?"
90100020-33 = "Como as orelhas da Niko são bem grandonas e felpudas, ela dissipa o calor corporal com muito mais facilidade."
90100020-34 = "Pensando bem... no verão, a primeira coisa que ferve na minha cabeça são as orelhas mesmo."
90100020-35 = "Em compensação, no inverno elas congelam tão rápido que chegam a doer."
90100020-36 = "É mesmo...? Bem, cada um com a sua fisiologia, fazer o quê."
90100020-37 = "Haaaah... Mas quer saber? Eu prefiro mil vezes o inverno.#nNo calor, fica suando e abafando embaixo do peito, é um inferno..."
90100020-38 = ""
90100020-40 = ""
90100020-41 = ""
90100020-42 = "..................Tsc."
90100020-43 = "Você acabou de estalar a língua com desdém pra mim, Otogi?!"
90100020-44 = "......Eu? Imagina, impressão sua."
90100020-45 = "Mentirosa! Eu ouvi perfeitamente o 'tsc' saindo da sua boca!"
90100020-46 = ""
90100020-48 = ""
90100020-49 = ""
90100020-50 = "......A Yukino continua correndo sem parar."
90100020-51 = "Ô Yukinooo! Até quando vai ficar nisso? O horário do banho de sol tá quase acabando!"
90100020-52 = ""
90100020-54 = ""
90100020-56 = ""
90100020-57 = ""
90100020-58 = "......Só mais uma volta e eu encerro."
90100020-59 = ""
90100020-61 = ""
90100020-62 = ""
90100020-63 = "Desde que fomos transferidas para cá, a Yukino só pensa em treinar até a exaustão.#nEla mal troca duas palavras com a gente."
90100020-64 = "Será que ela quer ficar sozinha pra pensar na vida?"
90100020-71 = ""
90100020-72 = "Bem... motivos pra matutar é o que não falta na cabeça dela, né."
90100020-73 = "É verdade, compreendo o peso... mas..."
90100020-74 = "Mesmo assim, não queria ver ela se castigando desse jeito..."
90100020-77 = ""
90100020-78 = ""
90100020-79 = "（Ficar definhando aqui [ruby=na prisão]no centro correcional[/ruby] de braços cruzados não vai apagar os meus pecados.）"
90100020-80 = "（Para me tornar uma adulta capaz de assumir as próprias responsabilidades, preciso treinar mais, aprender mais――e aprender a confiar nas pessoas.）"
90100020-81 = "（Mas......）"
90100020-83 = "'A culpa de toda essa desgraça é de vocês, suas terroristas militaristas?!'"
90100020-84 = "'Operação em prol dos cidadãos? Não me faça rir!#nEu perdi tudo o que tinha por causa do plano maldito de vocês!'"
90100020-85 = ""
90100020-87 = "'Por que eu tenho que passar por esse pesadelo?! Eu também sou uma cidadã inocente! Alguém me ajude!'"
90100020-88 = "'......Teria sido mil vezes melhor se vocês nunca tivessem se metido!'"
90100020-89 = ""
90100020-91 = "'Não tenho nada pra falar com pirralhas armadas!#nChamem alguém do alto escalão――alguém que tenha culhão pra assumir a responsabilidade!'"
90100020-92 = ""
90100020-93 = "（Naquele instante fatídico... qual teria sido a escolha certa? O que eu deveria ter feito? Até hoje não encontrei a resposta.）"
90100020-94 = "（Será que, como dizia o Sensei, o tempo é o único remédio capaz de curar essas feridas?）"
90100020-95 = "（Ou será que apenas uma [ruby=super-humana]líder genial como a Presidente do Conselho Estudantil Federal[/ruby] seria capaz de consertar tudo isso......?）"
90100020-96 = "......D-Detenta 5020......"
90100020-97 = "D-Detenta número 5020......!"
90100020-98 = ""
90100020-99 = "Ué? É a diretora do presídio. Parece que tá procurando alguém aflita."
90100020-100 = "Não é o seu número de matrícula, Yukino?"
90100020-101 = "Yukinooo, tão chamando você ali no portão!"
90100020-104 = ""
90100020-105 = "......Perdoe-me pelo incômodo, senhorita Yukino.#nSei que ainda é desconfortável ser chamada por um número, mas são as normas..."
90100020-106 = "......De forma alguma. Eu estava concentrada na corrida e demorei a responder."
90100020-107 = "Qual seria a ordem?"
90100020-108 = "Uma solicitação extraordinária de audiência presencial acabou de ser protocolada.#nPoderia se preparar para uma saída temporária...?"
90100020-109 = "O horário regulamentar de visitas para as detentas já foi encerrado por hoje."
90100020-110 = "Sim, eu sei... mas trata-se de uma autoridade excepcionalíssima."
90100020-111 = ""
90100020-113 = ""
90100020-114 = "――A Presidente do Conselho Estudantil Federal está requisitando sua presença."
90100020-115 = "A Presidente do Conselho Estudantil Federal......?"
90100020-119 = ""
90100020-120 = "......Peço desculpas por insistir na mesma pergunta repetidas vezes."
90100020-121 = "Mas é realmente verdade que a Presidente do Conselho Estudantil Federal, outrora desaparecida, retornou ao cargo?"
90100020-122 = "Sim... Foi tudo tão repentino que a Guarda Valkyrie virou um formigueiro em polvorosa nas primeiras semanas."
90100020-123 = "Mas a poeira finalmente assentou.#nGraças à liderança impecável da Presidente, todo o trabalho acumulado nos gabinetes foi praticamente zerado."
90100020-124 = "Se as coisas continuarem nesse ritmo, até as condições da nossa prisão devem melhorar aos poucos."
90100020-125 = ""
90100020-127 = ""
90100020-128 = "（Quer dizer que nós... deveríamos apenas ter acreditado e esperado pelo retorno dela......?）"
90100020-129 = "É claro que não podemos dizer que a Valkyrie voltou cem por cento à normalidade. Ainda temos a crise da Chefe de Defesa e todo aquele rolo――"
90100020-130 = ""
90100020-132 = ""
90100020-133 = "A-Ai, me perdoe... Falei sem pensar, fui insensível com o seu caso..."
90100020-134 = "Não se preocupe, não me ofendi."
90100020-135 = ""
90100020-143 = "Senhora Presidente. Trouxe a senhorita Yukino――isto é, a detenta número 5020."
90100020-144 = "Por favor, queira entrar."
90100020-145 = "（......Que tom de voz estranho.）"
90100020-146 = "（Sinto uma dissonância esquisita... De alguma forma, não parece a voz dela......?）"
90100020-147 = "（Como era a entonação da Presidente do Conselho Estudantil Federal no passado......?）"
90100020-148 = "（A imagem do rosto dela... sumiu da minha memória...）"
90100020-149 = ""
90100020-153 = ""
90100020-154 = "Gabinete da Presidência do Conselho Estudantil Federal"
90100020-155 = ""
90100020-156 = ""
90100020-157 = "Há quanto tempo não nos falamos, Comandante Yukino."
90100020-158 = ""
90100020-160 = ""
90100020-161 = "A senhora é――"
90100020-162 = ""
90100020-164 = ""
90100020-165 = ""
90100020-166 = ""
90100020-167 = ""
90100020-169 = "――A Presidente do Conselho Estudantil Federal."
90100020-170 = "Faz muito tempo mesmo. Sua fisionomia e presença parecem um pouco... diferentes."
90100020-171 = "Muitas pessoas têm me dito isso ultimamente. Confesso que eu mesma não percebo tanta alteração."
90100020-172 = "Talvez seja o reflexo natural de ter me ausentado do cargo por tanto tempo."
90100020-173 = ""
90100020-175 = ""
90100020-176 = ""
90100020-177 = "Não fiquemos de pé formalmente, por favor, tome assento."
90100020-179 = "......Já fui plenamente inteirada de todos os acontecimentos que sucederam durante a minha ausência."
90100020-180 = "Consta nos autos que a Chefe da Defesa, Kaya, tentou orquestrar um golpe de estado utilizando as forças do seu esquadrão."
90100020-181 = ".........Sim, senhora."
90100020-182 = "Fique em paz. Não estou aqui para apontar o dedo ou culpá-la de nada."
90100020-183 = "Pelo contrário... sou eu quem deve pedir as mais sinceras desculpas a vocês."
90100020-184 = "Tantas crises se sucederam e tanto caos assolou Kivotos.#nE tudo isso aconteceu unicamente porque eu sumi do meu posto."
90100020-185 = "Em meio a um vácuo de poder tão desolador, se alguém acabou trilhando o caminho errado――com que moral eu poderia exigir punições cegas?"
90100020-187 = "......A falha original foi exclusivamente minha."
90100020-188 = ""
90100020-189 = "Não... a responsabilidade também é nossa."
90100020-190 = "Principalmente... em relação à Academia Especial SRT, carrego um remorso profundo no coração."
90100020-191 = "A disputa pela jurisdição da SRT culminou na dissolução institucional da nossa escola."
90100020-192 = "A começar pelas meninas do Esquadrão RABBIT――"
90100020-193 = "Fizemos calouras recém-ingressadas passarem por traumas terríveis e desumanos."
90100020-194 = "Assim que a poeira das urgências baixar, pretendo restaurar a Academia Especial SRT aos seus moldes originais.#nEmpenhar-me-ei ao máximo para garantir a melhor formação de elite a todas as operadoras."
90100020-195 = ""
90100020-197 = ""
90100020-198 = "Se a senhora fizer isso pelas nossas companheiras, não tenho mais nada a pleitear neste mundo."
90100020-199 = "......Contudo."
90100020-200 = "Isso não significa que o passado de vocês será magicamente apagado da história."
90100020-201 = "Paralisar a infraestrutura pública para viabilizar um golpe, invadir a sede do Conselho Estudantil Federal e tentar detonar explosivos no centro da metrópole... A gravidade dessas ações é inegável."
90100020-202 = "Eu poderia, por decreto monocrático, conceder-lhes um indulto presidencial de anistia. No entanto, isso apenas inflamaria o rancor popular, e a confiança da sociedade jamais seria restabelecida."
90100020-203 = "Precisamos conduzir este processo com extrema sensatez e paciência.#n......Para que a SRT recupere o respeito que merece. Peço que compreenda minha posição."
90100020-204 = "Desde o instante em que quebrei o juramento e cometi o crime, preparei meu espírito para aceitar qualquer sentença, por mais severa que fosse."
90100020-205 = "Porém... as demais operadoras do Esquadrão FOX apenas cumpriram ordens diretas que partiram de mim."
90100020-206 = "Não me importo com o que aconteça com o meu futuro... Eu lhe suplico: conceda leniência e benevolência às minhas subordinadas."
90100020-207 = "Tentar carregar o peso do mundo inteiro sozinha nas próprias costas...#nEsse sempre foi o seu maior e mais teimoso defeito, Yukino."
90100020-208 = "Todos os acontecimentos deste universo estão entrelaçados em teias complexas.#nÉ uma ilusão achar que um único indivíduo é capaz de assumir a culpa por tudo."
90100020-209 = "O presente que vivemos hoje... vejamos bem:#né o resultado de cada um de nós assumindo uma pequena parcela de responsabilidade e cumprindo o seu papel."
90100020-210 = "......E é óbvio que eu não sou exceção a essa regra."
90100020-211 = "Portanto, o preço para superarmos esta crise deve ser pago por todos nós, em conjunto."
90100020-212 = ""
90100020-214 = ""
90100020-215 = ""
90100020-216 = "......Houve uma missão no passado em que falhei na contenção inicial de um alvo terrorista,#ne civis inocentes acabaram sendo arrastados para o tiroteio."
90100020-217 = "A fúria daqueles cidadãos deveria ter caído inteiramente sobre mim, que atuava como comandante em campo..."
90100020-218 = "Mas a senhora se colocou à frente de todos os projéteis políticos e assumiu o bombardeio midiático, livrando a SRT de qualquer sanção."
90100020-219 = "Se ninguém neste mundo pode carregar um problema sozinho...#nPor que a senhora sempre carregou o poder e o fardo da SRT inteiramente em seus próprios ombros?"
90100020-220 = "Naquela época...... era porque eu tinha margem para suportar."
90100020-221 = "Naqueles dias, eu detinha a autoridade, a posição institucional e a estabilidade necessárias para absorver os deslizes de vocês."
90100020-222 = "Quando agentes que cumpriram uma missão sob as minhas ordens caem em desgraça, tendo eu capacidade de socorrê-las, empurrar toda a culpa sobre suas cabeças não seria a conduta de uma verdadeira líder."
90100020-223 = "Se é assim, então agora cabe a mim――"
90100020-224 = "Não creio que a Yukino do presente tenha forças para isso.#nA exaustão transparece nos seus olhos. Carregar a própria culpa já consome até a sua última gota de energia."
90100020-225 = "Um dia, quando o seu espírito recuperar o fôlego e a serenidade para amparar os erros alheios, conversaremos de novo."
90100020-226 = "Até lá... permita-me este pequeno ato de autoridade, senhorita Yukino."
90100020-227 = ""
90100020-229 = ""
90100020-230 = "......Compreendo o ponto de vista da senhora."
90100020-231 = "Contudo, permanecer trancafiada em uma cela fazendo penitência não devolverá a honra e o prestígio da SRT."
90100020-232 = "Se a senhora puder nos conceder uma oportunidade concreta de expiar nossos crimes em campo, aceitarei qualquer missão que nos confiar.#nAguardamos suas ordens."
90100020-233 = ""
90100020-235 = ""
90100020-236 = ""
90100020-237 = "......Embora um indulto seja inviável no momento, conceder-lhes uma oportunidade de prestar serviço extraordinário à sociedade é perfeitamente justificável."
90100020-238 = ""
90100020-240 = ""
90100020-241 = "......Você já ouviu falar no termo 'Lore'――ou Lendas Urbanas?"
90100020-242 = "Histórias misteriosas que circulam de boca em boca entre as pessoas, sem fonte identificável ou comprovação científica.#nMitos folclóricos... lendas urbanas, ou contos de terror."
90100020-243 = "Narrativas difíceis de engolir à primeira vista, mas que possuem uma lógica tão sedutora que se espalham como praga――e ganham vida própria no imaginário coletivo."
90100020-245 = "O trem fantasma que conduz passageiros a uma estação além da realidade――"
90100020-247 = "A frequência de rádio da meia-noite que amaldiçoa quem escuta aquela voz sussurrada――"
90100020-249 = "O elevador que, se operado em uma sequência ritualística secreta, transporta a pessoa para um abismo sem retorno――"
90100020-250 = ""
90100020-251 = "......Vejo que não demonstrou o menor sobressalto.#nPor acaso tem predileção por contos sobrenaturais?"
90100020-252 = "Deixar-se abalar emocionalmente por boatos cuja veracidade é nula seria pura ineficiência tática."
90100020-253 = "Concordo. Em circunstâncias normais, lendas urbanas não mereceriam um segundo sequer da nossa atenção――meras fantasias pueris."
90100020-254 = "Contudo, nos últimos tempos, relatórios de [ruby=・]contato[/ruby] [ruby=・]real[/ruby] com essas anomalias têm se multiplicado exponencialmente."
90100020-255 = "E o problema transcende meros avistamentos: danos e baixas reais já começaram a se manifestar."
90100020-256 = "Vítimas reais causadas por... Lendas Urbanas?"
90100020-257 = "Alunas que alegam ter cruzado o caminho dessas anomalias frequentemente perdem a fala em surtos catatônicos ou desaparecem sem deixar vestígios antes mesmo que possamos interrogá-las."
90100020-258 = "Se fossem atentados terroristas comuns, a Guarda Valkyrie seria acionada imediatamente, mas no presente caso, nem a natureza do inimigo é conhecida."
90100020-259 = "Para conter a proliferação do pânico, o Comitê Administrativo deliberou transferir a investigação para um escalão operacional superior."
90100020-260 = "Quando as forças convencionais de segurança são incapazes de conter uma ameaça e torna-se indispensável uma intervenção tática veloz e semilegal――"
90100020-261 = ""
90100020-263 = ""
90100020-264 = ""
90100020-265 = "A convocação recai naturalmente sobre a unidade de operações especiais SRT."
90100020-266 = "Exatamente."
90100020-267 = "No entanto, que fique claro: esta é apenas uma [ruby=・]proposta[/ruby] da Presidente do Conselho Estudantil Federal.#nNão é uma ordem imperativa, tampouco uma diretriz compulsória."
90100020-268 = "Nem sequer conhecemos a forma real do inimigo, e no pior dos cenários, vocês poderão ter o mesmo destino macabro das vítimas."
90100020-269 = ""
90100020-273 = ""
90100020-275 = "Se a anomalia encontrar vocês antes que vocês a encontrem... a próxima lenda urbana a circular por Kivotos poderá ser o próprio Esquadrão FOX."
90100020-276 = "Mesmo sabendo do perigo do abismo, você aceita assumir esta operação?"
90100020-277 = ""
90100020-278 = "Sim, senhora."
90100020-279 = "Afinal, nós temos uma dívida de honra incomensurável para redimir."
90100020-280 = ""
90100020-282 = ""
90100020-283 = ""
90100020-284 = "Muito bem. Compartilharei com a sua equipe todo o dossiê de inteligência que reunimos."
90100020-285 = "Descubram a verdadeira natureza dessas anomalias e eliminem essa ameaça que paira sobre Kivotos."
90100020-286 = "......E mais uma coisa.#nIsto não é a Presidente do Conselho Estudantil Federal falando, é um pedido pessoal meu."
90100020-287 = ""
90100020-289 = ""
90100020-290 = "Por favor――voltem sãs e salvas para casa."
90100020-291 = "Fique tranquila quanto a isso."
90100020-292 = "Diante de um combate sem perspectiva de vitória, recuar imediatamente para preservar a tropa também é a especialidade de uma força de operações especiais."
90100020-294 = "Com sua licença, teria uma dúvida crucial antes de iniciarmos os preparativos."
90100020-295 = "Pois não, disponha."
90100020-296 = "Mesmo sendo uma operação sigilosa não oficial, precisaremos de canais de comunicação com o exterior para estabelecimento de base e reabastecimento logístico bélico. Uma organização mantenedora de apoio."
90100020-297 = "No passado, a própria Presidente supria essa retaguarda.#nPorém, no cenário político atual, isso atrairia escândalos fatais."
90100020-298 = "Tem toda razão. Se eu prestar apoio logístico ostensivo ao Esquadrão FOX,#npassará a impressão pública de que o Conselho Estudantil Federal restaurou a SRT de forma autoritária."
90100020-299 = "Felizmente, existe uma entidade perfeitamente talhada para desempenhar esse papel."
90100020-300 = "Uma agência de investigação reconhecida por todas as instâncias de Kivotos, com orçamento robusto e prerrogativas extraordinárias equivalentes ao Conselho Estudantil Federal."
90100020-301 = "――A Schale."
90100020-302 = ""
90100020-304 = ""
90100020-306 = "......Por acaso ouvi direito...?"
90100020-308 = "Próximo Episódio;Saco Vazio Não Para em Pé"
