[translation]
101100-1 = "Эпизод 10; Столкновение 2"
101100-2 = ""
101100-3 = ""
101100-4 = "Вотум недоверия... Ух. Всё окончательно выходит из-под контроля..."
101100-5 = "Н-Но... Рин замещает президента Генерального студенческого совета! Если лишить Рин полномочий..."
101100-6 = "Генеральный студенческий совет будет парализован, Аой. Ты помнишь, что произошло сразу после исчезновения президента."
101100-7 = "Я готова пойти на этот риск, если это поможет обуздать ваше безумие."
101100-8 = "Пока Сенсей из Шале или начальник обороны не найдены, у нас нет выбора."
101100-9 = "..."
101100-10 = "Завтра утром я созову всех начальников управлений, и мы обсудим детали вашего вотума недоверия."
101100-11 = "Отдыхайте, пока можете, Рин. Завтра вам будет нелегко."
101100-12 = "..."
101100-13 = "Если у вас есть время подслушивать, может, работы у вас недостаточно!"
101100-14 = "Е-Есть, госпожа!"
101100-15 = "Пошли отсюда..."
101100-16 = ""
101100-18 = ""
101100-21 = "Момока, Аюму. Вы обе тоже уходите. Это приказ."
101100-22 = "Э-Это..."
101100-23 = "Угх... Э-эм..."
101100-24 = "Всё хорошо. Идите, обе. Спасибо за всё, что вы для меня сделали."
101100-25 = "Я-я... Хорошо, Рин... Но завтра с самого утра я буду здесь."
101100-26 = "*вздох* ...Как же... неловко..."
101100-27 = ""
101100-29 = ""
101100-31 = ""
101100-32 = "Тогда увидимся завтра, Аой."
101100-33 = "..."
101100-34 = ""
101100-36 = ""
101100-37 = ""
101100-38 = ""
101100-46 = ""
101100-47 = ""
101100-48 = ""
101100-49 = ""
101100-50 = ""
101100-51 = "...?! Ч-Что...?!"
101100-52 = ""
101100-54 = ""
101100-56 = ""
101100-57 = "Всё идёт даже лучше, чем ожидалось. Зал Генерального студенческого совета пуст."
101100-58 = "В худшем случае я даже ожидал столкновения с теми лисами. Хотя их присутствие ничего бы не изменило."
101100-59 = "Здесь только главный администратор."
101100-60 = "...! Вы...! Корпорация Кайзер?!"
101100-61 = "...Значит, это и есть главный администратор."
101100-62 = "Я бы не советовал ничего предпринимать. Все сети связи и системы тревоги уже выведены из строя."
101100-63 = "...!!!"
101100-64 = "Все права Генерального студенческого совета переданы Корпорация Кайзер."
101100-65 = "Группа башни Санктум, доложить обстановку."
101100-66 = "*трррк* Башня Санктум под нашим контролем, сэр!"
101100-67 = "Хорошо. Соедините с президентом."
101100-68 = ""
101100-70 = ""
101100-71 = "*трррк* Превосходно, соединение установлено без проблем. Ох... Но следующие шаги займут некоторое время."
101100-72 = "Для начала объявляю военное положение в D.U."
101100-73 = "С этого момента вся связь, логистика и транспорт в D.U. и из него перекрываются, а деятельность всех административных ведомств приостанавливается."
101100-74 = "Никто снаружи не сможет узнать, что здесь происходит. А тем временем..."
101100-75 = "Что всё это значит? Какова цель Корпорация Кайзер?"
101100-76 = "Мы занимаем башню Санктум."
101100-77 = "...!"
101100-78 = "Зачем? Недавно мы заполучили древнее оружие, а для его... Ах, неважно. Не стану утомлять вас мелкими подробностями."
101100-79 = "Вам достаточно знать одно: теперь Кивотос находится под контролем Корпорация Кайзер. Город академий теперь наш. Не Гематрия, не Генерального студенческого совета. Наш."
101100-80 = "...!"
101100-82 = "Разве не радует? «Корпоративный город» звучит куда лучше, чем «Город академий». Ха-ха-ха."
101100-85 = ""
101100-86 = "[ns] «Корпорация „Кайзер“...»"
101100-87 = "Генеральный студенческий совет распущен, начальники разбрелись кто куда... Ни до кого не дозвониться, и никто не знает, что сейчас происходит внутри башни Санктум..."
101100-88 = "Угх... Мы вообще ничего не можем сделать, чтобы хоть как-то облегчить ситуацию. Это ужасно бесит..."
101100-89 = "*вздох* ...Обычно я любой ценой избегаю таких раздражающих ситуаций..."
101100-90 = "А? Эта дверь открыта!"
101100-91 = "Ты права. Проверим."
101100-92 = "И-и... Эти ублюдки из PMC идут сюда. Нам надо уходить."
101100-93 = "С-сюда, все."
101100-94 = "Уф."
101100-95 = "[ns] «Канна, твои раны выглядят плохо...»"
101100-96 = ""
101100-98 = "...Для меня это конец, Сенсей."
101100-99 = "[ns] «Что...?!»"
101100-100 = "Д-Директор?! Что это значит?"
101100-101 = "О чём ты говоришь?!"
101100-103 = "Хех... Здесь всё выглядит точно так же, как во время нашего лагеря первокурсников... Почти ничего не изменилось, да?"
101100-104 = "Тогда я думала, что стану праведным полицейским... Похоже, изменилась только я."
101100-105 = "Я... я должна извиниться, что втянула вас, Бюро общественной безопасности."
101100-106 = "Директор Канна..."
101100-107 = "Н-Нет... Для меня это слишком."
101100-108 = "Слушайте внимательно. Выйдете из здания и пойдёте дальше — найдёте станцию скоростного поезда, который идёт за пределы D.U. Она рядом с парком Коусаги, так что место вам знакомо. И ещё..."
101100-109 = "Ах, чуть не забыла. Ваши вещи."
101100-110 = "Мне удалось вернуть ваш планшет и телефон."
101100-111 = ""
101100-115 = "[ns] «Шиттимский сундук... Как ты?!»"
101100-116 = "Думаете, я просто сидела сложа руки? Я проникла в секретные файлы Валькирии, чтобы выяснить, где вас держат... и где спрятано это..."
101100-117 = "Чтобы сделать всё без подозрений, пришлось убедить Кайзер, будто я готова с ними сотрудничать. Быстро, берите."
101100-118 = "[ns] Взять Шиттимский сундук."
101100-121 = "Положение критическое. Корпорация Кайзер теперь полностью контролирует Кивотос и башню Санктум."
101100-122 = "Если никто ничего не сделает, весь город погрузится в хаос."
101100-123 = "Я всё ещё просто продажный коп, поступившийся идеалами ради безопасности. Это всё сопротивление, на которое меня хватило. Но, Сенсей, если бы в мой худший момент вы не показали мне ошибочность моего пути, наверное, я не смогла бы даже этого."
101100-124 = "Не все в Валькирии такие, как я, Сенсей."
101100-125 = "Там гораздо больше людей, которые сражаются за то, во что верят. За справедливость. Просто посмотрите на этих двоих..."
101100-126 = "..."
101100-127 = "..."
101100-128 = ""
101100-130 = ""
101100-131 = ""
101100-132 = "[ns1] «Нет, Канна, ты отличный полицейский.»\n[ns2] «Ты не сдалась. Ты поступила согласно своим убеждениям.»"
101100-135 = "..."
101100-136 = "[s3] «Теперь, когда это у нас, всё должно быть хорошо.»\n[s4] «С этим как-нибудь всё наладится.»"
101100-139 = "...А?"
101100-140 = "С-Сенсей?"
101100-141 = "Этот маленький планшет настолько важен?"
101100-142 = ""
101100-144 = ""
101100-145 = ""
101100-146 = "[ns5] «...Мы жаждем семи рыданий.»\n[ns6] «...Мы несём коан Иерихона.»"
101100-152 = ""
101100-153 = ""
101100-154 = "УА-А-А! Сенсей!"
101100-155 = "Я так рада, что вы в безопасности! Я с ума сходила от беспокойства! Когда питание отключилось, мне было ужасно страшно!"
101100-156 = "А теперь происходит что-то ужасное!"
101100-157 = "[s7] «Да, я знаю.» \n[s8] «Я рад, что ты в безопасности, Арона.»"
101100-160 = "*всхлип* Я... Я в порядке, Сенсей..."
101100-161 = ""
101100-163 = "[ns] «Хорошо. Вы все мне доверяете?»"
