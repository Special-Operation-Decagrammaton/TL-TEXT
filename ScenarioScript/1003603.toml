[translation]
1003603-1 = "Переплата"
1003603-2 = "Внутри собора Тринити"
1003603-3 = "Когда я прибыл в собор, все студенты Сестринства выглядели обеспокоенными."
1003603-4 = "Хината нас не слушает..."
1003603-5 = "Я очень за неё переживаю."
1003603-6 = "[s1] «(Хината их не слушает?)»\n[s2] «(Я тоже начинаю волноваться...)»"
1003603-7 = "О. Сенсей?"
1003603-8 = "О. Сенсей?"
1003603-9 = "З-Здравствуйте. Что привело вас в собор?"
1003603-10 = "В-Вы пришли из-за моего последнего сообщения?"
1003603-11 = "У-ух..."
1003603-12 = "[s3] «Ты в порядке? Выглядишь неважно.»\n[s4] «Ты вся в поту. У тебя жар?»"
1003603-13 = "Ну, дело в том..."
1003603-14 = "Ну, дело в том..."
1003603-15 = "Я-Я имею в виду, нет. Ничего! Наверное, просто простуда..."
1003603-16 = "Ничего такого, с чем я не справлюсь. Все иногда болеют. Я всё ещё могу работать..."
1003603-17 = "Клянусь, со мной всё нормально. В-Вам не нужно так сильно волноваться. Хаха..."
1003603-18 = "[s5] «Давай отведём тебя в другое место, Хината.»\n[s6] «Просто успокойся и иди за мной, хорошо?»"
1003603-19 = "А-А?"
1003603-20 = "А-А?"
1003603-21 = "Но я не..."
1003603-22 = "Хорошо..."
1003603-23 = ""
1003603-26 = ""
1003603-28 = "Эм, Сенсей...?"
1003603-29 = "Почему мы пришли сюда?"
1003603-30 = "А?"
1003603-31 = "Вы привели меня сюда по какой-то причине?"
1003603-32 = "Мне нужно сесть и отдохнуть?"
1003603-33 = "Э-Эм... Хорошо. Все сегодня только это мне и говорят..."
1003603-34 = "...н-но у меня ещё есть дела."
1003603-35 = "Я не могу просто сидеть без дела. Меньше всего мне хочется всех подвести..."
1003603-36 = "[s7] «Ты их не подводишь. Они за тебя переживают.»\n[s8] «Оставь это мне. Я помогу им закончить твою работу.»"
1003603-37 = "Н-Но я не могу просто свалить свою работу на других!"
1003603-38 = "Н-Но я не могу просто свалить свою работу на других!"
1003603-39 = "Особенно когда... я никак не могу отплатить им тем же. Я ведь не способна делать то, что делают они."
1003603-40 = "Это значит..."
1003603-41 = "[s] «Я совсем так не думаю.»"
1003603-42 = "...?"
1003603-43 = "О чём ты?"
1003603-44 = "[s] «Все полагаются на тебя, Хината.»"
1003603-45 = "Я..."
1003603-46 = "П-Правда?"
1003603-47 = "Это правда?"
1003603-48 = "Они всегда так говорят... но мне трудно в это поверить."
1003603-49 = "Хотя, может быть, это правда, раз вы так говорите."
1003603-50 = "Я очень хочу в это верить..."
1003603-51 = "Нет, погодите."
1003603-52 = "Простите. Уверена, это правда."
1003603-53 = "То есть... должно быть правдой, раз вы так говорите."
1003603-54 = "А-Ахаха..."
1003603-55 = "От этого мне становится гораздо... спокойнее."
1003603-58 = "― Э-Эм, простите меня... Сенсей.[wa:7900]"
1003603-60 = "― Я никогда не хотела быть для вас обузой...[wa:1010]"
1003603-63 = "― Я думала, что смогу перетерпеть...[wa:2120]"
1003603-65 = "― Если я нездорова, от меня никакой пользы. Как же стыдно...[wa:1800]"
1003603-68 = "― Но вы правы. Мне нужно отдохнуть.[wa:4190]"
1003603-71 = "― Поэтому, если... это не слишком большая просьба,[wa:2490]"
1003603-73 = "― не могли бы вы немного побыть со мной?"
1003603-76 = "― Мне было бы гораздо спокойнее, если бы вы остались...[wa:9640]"
1003603-79 = "― Останетесь? Спасибо.[wa:3040]"
1003603-81 = "― Вы такой добрый, Сенсей.[wa:1290]"
1003603-84 = "Благодаря вам мне уже гораздо лучше."
1003603-85 = "Хорошо. Сегодня я пойду домой и отдохну."
1003603-86 = "Я всё ещё раскрасневшаяся и вся в поту. Бывало и лучше."
1003603-87 = "Мне нужно отдохнуть, прежде чем я снова встану на ноги."
1003603-88 = "Особенно если остальные и правда на меня полагаются, как вы сказали."
1003603-90 = "После этого я вывел Хинату из собора."
1003603-91 = "Под горячими взглядами окружающих я начал придумывать объяснения тому, как наверняка выглядела со стороны ситуация между мной и Хинатой."
