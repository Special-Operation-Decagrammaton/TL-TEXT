[translation]
90000120-1 = "Эпизод 13;Новое Начало"
90000120-2 = "Клубная комната Отряда Исследования Сверхъестественного"
90000120-3 = ""
90000120-4 = "*вздыхает*"
90000120-5 = "С тобой всё хорошо, председатель?"
90000120-6 = "Основной формой Декаграмматона был ИИ торгового автомата, который каким-то образом переродился в супер-ИИ после того, как услышал слуховую галлюцинацию? В голове не укладывается."
90000120-7 = "Даже если бы мы захотели проверить, правда ли это, здание полностью разрушено и находится под водой..."
90000120-8 = "В итоге мы лишь выслушали лекцию бредящего ИИ и едва не погибли в огромном наводнении."
90000120-9 = "Но по крайней мере Декаграмматон мёртв? Или исчез, да? Значит, всё вернулось в норму, как мы и хотели."
90000120-10 = "...Нет, не вернулось."
90000120-11 = "Во-первых, настоящей угрозой всегда были пророки Декаграмматона, а не он сам."
90000120-12 = "Неважно, действительно ли он всего лишь ИИ торгового автомата или страдающее манией величия существо, которое лишь принимает такой облик. Его пророки всё равно способны действовать самостоятельно."
90000120-13 = "Декаграмматон сказал, что ему придётся снова подтвердить собственное существование с самого начала. Следовательно, угроза ещё не исчезла."
90000120-14 = "Пророки Декаграмматона не остановятся, и он это знает. Поэтому он и позвал нас именно сейчас."
90000120-15 = "Этот так называемый десятый пророк, Малкут... Вот что беспокоит меня больше всего."
90000120-16 = "Даже в Древе Жизни она названа последней Сефирой... Думаю, именно этот пророк и станет нашей величайшей угрозой."
90000120-18 = "Звучит не очень хорошо..."
90000120-19 = "...Но меня беспокоит ещё кое-что. Декаграмматон сказал, что встретил существование, полностью затмевающее его самого."
90000120-20 = "Что это вообще могло быть?.."
90000120-24 = ""
90000120-25 = "Есть какие-нибудь мысли, Сенсей?"
90000120-26 = "[s] «Я тоже не уверен.»"
90000120-27 = "Хм..."
90000120-28 = "Но одно я могу сказать наверняка: Алиса совершенно никак со всем этим не связана."
90000120-29 = ""
90000120-31 = ""
90000120-32 = "Мне придётся встретиться с Рио и раз и навсегда разобраться с этим вопросом."
90000120-33 = "Ах, прошу прощения, я заболталась. Вернёмся к этой теме в другой раз."
90000120-35 = ""
90000120-37 = ""
90000120-38 = "Кстати, как мне вообще докладывать об этом Президенту Рио? Декаграмматон мёртв, так что задание окончено?"
90000120-39 = "Нет, Старшей Сестре ничего докладывать не нужно. В конце концов, угроза Декаграмматона и его пророков никуда не делась."
90000120-40 = "Даже если Декаграмматона больше нет, его пророки продолжат нападать на Кивотос и без него. И каждый раз нам придётся отвечать на их атаки."
90000120-41 = "К тому же нужно подготовиться к новому пророку, который ещё не появился. Ведь Древо Жизни пока не завершено."
90000120-42 = "Хм. То есть нам никак не остановить этих пророков."
90000120-43 = ""
90000120-45 = ""
90000120-48 = "*пшшш* Химари! Ты там?"
90000120-49 = "Чихиро?.."
90000120-50 = "Мы нашли пропавший коммуникационный блок Хаба! Он приближается сюда примерно на глубине трёхсот метров под Миллениум."
90000120-51 = "Ответь, как только получишь сообщение! Мне срочно нужна твоя помощь!"
90000120-52 = ""
90000120-54 = ""
90000120-57 = "...Хм. Угу, понятно."
90000120-58 = "С нападением Хаба... точнее уже Хода, восьмого пророка Декаграмматона... Похоже, мне снова пора примерить роль невероятно прекрасной героини-хакерши."
90000120-59 = "..."
90000120-60 = "Эйми, не смотри на меня так неодобрительно. Лучше начинай готовиться."
90000120-61 = "Хмф, как скажете, Президент."
90000120-62 = "Хорошо. Отряд Исследования Сверхъестественного, за работу!"
90000120-64 = "Следующий эпизод;Сигнал"
