[translation]
13240-1 = "Эпизод 24;Железнодорожная пушка"
13240-10 = "Аргх!"
13240-11 = ""
13240-13 = ""
13240-14 = ""
13240-16 = ""
13240-17 = "Ты действительно сильна... Таканаши Хошино."
13240-18 = "С дороги, Повязка. У меня больше нет времени."
13240-19 = "Нужно разобраться с Железнодорожной пушкой, пока сюда не добрались мои младшие."
13240-20 = "Верно. Я знаю. Диспетчерская вон там."
13240-21 = "Но я тебя не пропущу, пока ты меня не победишь! Я ещё... я ещё стою."
13240-22 = ""
13240-24 = ""
13240-25 = "...С дороги."
13240-27 = "Нет. Ещё нет!"
13240-28 = ""
13240-31 = ""
13240-37 = "...Наша стратегия наконец подходит к финалу."
13240-38 = "Стратегия первая... «Сделанного не воротишь»."
13240-39 = "Вторая. «Пределы тела невозможно преодолеть»."
13240-40 = "Третья. «Сердце невозможно предсказать или контролировать»."
13240-41 = ""
13240-43 = ""
13240-45 = "И наконец. «Самая маленькая брешь способна разрушить величайшую плотину»."
13240-46 = "Эта кампания погружается в ускользающую истину, ведомая жадностью и виной грешников."
13240-47 = "В конце этого хаоса мы наконец раскроем ответ на шестой коан!"
13240-48 = ""
13240-50 = ""
13240-51 = "...Хм?"
13240-52 = "Постой, что-то..."
13240-59 = "Мы пришли... Это Долина председателей студсовета?"
13240-60 = "Да, Хошино должна быть здесь."
13240-61 = "И Железнодорожная пушка с Суо тоже..."
13240-63 = "Они должны быть в той стороне. Быстрее!"
13240-64 = ""
13240-71 = "..."
13240-72 = "Всё не так, как я представляла..."
13240-73 = "Это ведь должен быть выставочный зал, созданный председателями студсовета Абидоса сотни лет назад..."
13240-74 = "Пулемёты и посты охраны... Зенитная пушка? Зачем всё это выставочному залу?"
13240-75 = "Смотрите. Эмблема Геенны."
13240-76 = "...Э-Это очень странно. Почему эмблема Геенны выставлена посреди Пустыни Абидос?"
13240-77 = "..."
13240-78 = ""
13240-81 = ""
13240-82 = "Эй, вон там."
13240-83 = "Да?"
13240-85 = "Это..."
13240-88 = "[ns] «Это же...»"
13240-89 = "Железнодорожная пушка..."
13240-90 = "П-Постой. Она НАСТОЛЬКО большая?! Может, у меня что-то с восприятием глубины..."
13240-91 = "Железнодорожная пушка «Схемата»... Она больше, чем я могла представить..."
13240-92 = "Ага..."
13240-95 = "[ns] «К её разработке наверняка был причастен кто-то из Геенны.»"
13240-96 = "Да... Наверное, тот же человек, который убедил студсовет изменить направление проекта Транс-пустынной железной дороги."
13240-97 = "И всё же её размер не укладывается в голове... У Кивотоса просто нет технологий для эксплуатации чего-то такого масштаба..."
13240-99 = "Тогда... Это..."
13240-100 = "..."
13240-102 = "Да, именно! Сенсей!"
13240-105 = "Это не обычное оружие! В нём используются технологии, которых сейчас попросту нет в Кивотосе!"
13240-106 = "Иными словами, это древнее оружие или нечто равноценное!"
13240-107 = "Но до сих пор такие технологии постоянно... Нет, не может быть..."
13240-108 = "[s] «Гематрия...»"
13240-109 = "Н-Но мне ещё нужно кое-что подтвердить! Дайте немного времени на анализ."
13240-110 = "Ух... Вот бы Плана была здесь..."
13240-111 = "[s] «Как Плана?»"
13240-112 = "Она всё ещё спит. Ничего особенно плохого с ней нет, но... похоже, она полностью истощена..."
13240-113 = ""
13240-117 = "П-Плана?!"
13240-118 = "...Арона... Сенсей..."
13240-119 = ""
13240-122 = ""
13240-124 = "Ты в порядке, Плана?! Нигде не болит?"
13240-125 = "[s] «Как ты, Плана?»"
13240-126 = "...Пока я спала... плыла в бессознательности... я чувствовала взгляд."
13240-127 = "Взгляд...?"
13240-128 = "...Да. Кто-то наблюдает... за этим местом... за всем, что здесь происходит..."
13240-129 = "[s] «...»"
13240-130 = "А? К-Кто? Здесь больше никого нет...!"
13240-131 = "Я тоже не обнаруживаю здесь никого, Плана."
13240-132 = "Но... я чувствую его... Этот взгляд..."
13240-133 = ""
13240-135 = ""
13240-136 = ""
13240-137 = "Плана...?!"
13240-138 = ""
13240-146 = "Это...?!"
13240-147 = "Выстрел? Он был оттуда!"
13240-148 = "Это оружие Хошино!"
13240-149 = "Пошли! Быстро!"
13240-150 = ""
13240-152 = ""
13240-154 = "Сенсей? Не зависайте! Быстрее!"
13240-155 = "[ns] «...Иду!»"
