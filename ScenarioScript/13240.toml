[translation]
13240-1 = "Episódio 24;Canhão Ferroviário Shemata"
13240-10 = "Argh!"
13240-17 = "...Chegar tão longe assim."
13240-18 = "Pode sair logo do caminho, garota do tapa-olho?"
13240-19 = "Quero destruir isso antes que as calouras cheguem."
13240-20 = "É, imagino que sim."
13240-21 = "...Mas eu ainda não perdi!"
13240-25 = "...Você está no meu caminho."
13240-27 = "Não vou deixar você passar!"
13240-37 = "...A conquista finalmente chegou ao seu estágio final."
13240-38 = "Primeira regra: \"O que já aconteceu não pode ser mudado\"."
13240-39 = "Segunda: \"O corpo possui limites físicos\"."
13240-40 = "Terceira: \"A mente não pode ser prevista nem controlada\"."
13240-45 = "E quarta: \"Uma pequena ferida pode se tornar fatal\"."
13240-46 = "Esta é uma campanha que explora a psicologia humana em meio ao tormento do desejo e da culpa."
13240-47 = "Quando este caos chegar ao fim,#n eu alcançarei o \"Sexto Preceito Antigo\"."
13240-51 = "...Hm?"
13240-52 = "Tem algo..."
13240-59 = "Chegamos...?"
13240-60 = "Nn, a Hoshino-senpai deve estar aqui."
13240-61 = "A Suou-san e o Canhão Ferroviário também..."
13240-63 = "É por ali, vamos depressa!"
13240-71 = "..."
13240-72 = "Ei, isso é bem diferente do que eu imaginava...?"
13240-73 = "Ouvi dizer que era um tipo de pavilhão de exposições...#n construído pelo Conselho Estudantil de Abydos há séculos."
13240-74 = "Tem até canhões automáticos e baterias antiaéreas."
13240-75 = "Tem o emblema de Gehenna."
13240-76 = "P-Por que há um emblema de Gehenna no Deserto de Abydos?"
13240-77 = "..."
13240-82 = "Olhem."
13240-83 = "O quê?!"
13240-85 = "Aquilo é..."
13240-88 = "[ns] \"Aquilo é o tal...\""
13240-89 = "O Canhão Ferroviário..."
13240-90 = "E-Espera aí. Ninguém me disse que era tão gigante assim.#n Isso bagunça até a minha noção de perspectiva?!"
13240-91 = "...E-Eu não esperava que fosse tão grande."
13240-92 = "Nn..."
13240-95 = "[ns] \"Entendi, então Gehenna também...\""
13240-96 = "Provavelmente quem deu a ideia para o projeto da ferrovia transdesértica tem ligação com isso."
13240-97 = "Mas esse tamanho todo não faz sentido...#n Nunca imaginei que existisse uma tecnologia dessas em Kivotos..."
13240-99 = "Então, como será que construíram isso...?"
13240-100 = "..."
13240-102 = "Sensei!"
13240-105 = "Aquilo usa uma tecnologia que não existe na Kivotos atual!"
13240-106 = "Uma arma antiga, ou algo no mesmo nível...!"
13240-107 = "Não pode ser...?!"
13240-108 = "[s] \"...Talvez seja coisa da Gematria.\""
13240-109 = "Vou investigar um pouco mais!"
13240-110 = "Uuu... Numa hora dessas, se a Plana-chan estivesse aqui..."
13240-111 = "[s] \"Como a Plana está?\""
13240-112 = "Ela ainda está dormindo.#n Parece que está muito cansada..."
13240-117 = "P-Plana-chan?!"
13240-118 = "Arona-senpai... Sensei."
13240-124 = "Plana-chan, você está bem?#n Está doendo em algum lugar?!"
13240-125 = "[s] \"Plana, você está bem?\""
13240-126 = "...Enquanto eu dormia, senti um olhar."
13240-127 = "Um olhar...?"
13240-128 = "...Sim.#n Mesmo agora, estamos sendo observados por alguém."
13240-129 = "[s] \"...\""
13240-130 = "Hã?!#n Mas não tem ninguém aqui..."
13240-131 = "Plana-chan...?"
13240-132 = "Esse olhar é..."
13240-137 = "Plana-chan...?!"
13240-146 = "Isso é...?!"
13240-147 = "É por ali!"
13240-148 = "É o som da arma da Hoshino-senpai!"
13240-149 = "Vamos lá!"
13240-154 = "Sensei, depressa!"
13240-155 = "[ns] \"...Entendido!\""
