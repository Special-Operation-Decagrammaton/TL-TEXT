212110-45 = "Ah…… that's not it."
212110-46 = "Eh……?"
212110-47 = "But Iroha-senpai, you're still wearing your armband, right……?"
212110-48 = "This is……."
212110-52 = "I don't even know why I still have it myself……."
212110-53 = "I have no intention of returning to Pandemonium Society until Makoto-senpai is back to normal."
212110-54 = "Makoto-senpai has been acting strange for so long……."
212110-55 = "……."
212110-56 = "How have you been doing, Ibuki?"
212110-57 = "I was worried, so I came to check on you."
212110-58 = "Ibuki has been, um, super energetic—"
212110-59 = "……."
212110-62 = "……."
212110-63 = "……It doesn't look like you've been doing very well."
212110-64 = "Yeah…… everyone seems super busy."
212110-65 = "Ever since Iroha-senpai left, Makoto-senpai has been working really hard too."
212110-66 = "Doing all sorts of things with other people."
212110-67 = "Operations, plans, and lots of stuff like that."
212110-68 = "So she seems tired…… and she doesn't really play with Ibuki anymore."
212110-69 = "……."
212110-70 = "Satsuki-senpai and Chiaki-senpai haven't been coming around much lately either."
212110-71 = "So, Ibuki is lonely."
212110-72 = "……So it was as I expected."
212110-73 = "Ibuki, would you like to come with me?"
212110-74 = "Eh? Really?"
212110-75 = "Yes. I don't feel like Pandemonium Society is a good environment for you anymore."
212110-76 = "Especially if there's no one there to properly look after you."
212110-77 = "If you come with me, I'll brush your hair and read you books."
212110-78 = "Wow~! Ibuki loves it most when Iroha-senpai brushes my hair!"
212110-79 = "……Hehe. Yes."
212110-80 = "But……."
212110-84 = "If I do that, Makoto-senpai will be all alone."
212110-85 = "……."
212110-86 = "Ibuki knows that being alone is lonely."
212110-87 = "Makoto-senpai…… must be very lonely."
212110-88 = "……I suppose so."
212110-89 = "So, Ibuki will—"
212110-90 = "Stay with Makoto-senpai."
212110-91 = "……Are you sure?"
212110-92 = "Yeah. Ibuki is strong. I can be a good girl!"
212110-93 = "If that is how you feel, Ibuki…… I understand."
212110-94 = "Iroha-senpai, please wait properly until Makoto-senpai is back to normal."
212110-95 = "And then, you absolutely have to come back to Pandemonium Society. Okay?"
212110-96 = "……Yes. I will."
212110-101 = "Promise!"
212110-106 = "It's a promise."
212110-116 = "……."
212110-117 = "Phew…… I think I can finally catch my breath."
212110-122 = "……Makoto-senpai, are you done being busy?"
212110-123 = "Ah, Ibuki."
212110-124 = "I've only cleared one hurdle. There's still no end in sight."
212110-125 = "Was Iroha silently processing things like this all this time……?"
212110-126 = "Hmph, no use talking about someone who isn't here."
212110-127 = "Makoto-senpai, do you want to see Iroha-senpai?"
212110-128 = "Ha! Who said such a thing?"
212110-129 = "It just means I can handle this much on my own."
212110-130 = "Just because I don't usually do the work doesn't mean I don't have a perfect grasp of the practical side of things. Kishishi."
212110-131 = "That's not it. Ibuki asked, 'Do you want to see her?'"
212110-135 = "…………."
212110-136 = "……Makoto-senpai, you've looked really lonely lately."
212110-137 = "……That is not the case."
212110-138 = "I, Makoto Hanuma, do not refuse those who come, nor do I chase those who leave."
212110-139 = "Especially not someone who raised the banner of rebellion during such a critical time."
212110-140 = "Above all, a great leader is a lonely one. You wouldn't understand that yet, though."
212110-141 = "Yeah…… Ibuki doesn't really understand complicated things like that……."
212110-142 = "But Makoto-senpai, you said it before, right? That rebellion is cool."
212110-146 = "……I did?"
212110-147 = "Yeah."
