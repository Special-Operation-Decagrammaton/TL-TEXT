212110-35 = ""
212110-38 = ""
212110-39 = "Ибуки."
212110-40 = ""
212110-42 = ""
212110-43 = "Ура! Это Ироха!"
212110-44 = "Ироха, ты вернёшься в Пандемониум? Ибуки так рада тебя видеть!"
212110-45 = "А... Нет, не совсем."
212110-46 = "М-м? Не вернёшься...?"
212110-47 = "Но на тебе всё ещё повязка и форма... Вот Ибуки и подумала, что ты возвращаешься..."
212110-48 = "...Это..."
212110-49 = ""
212110-51 = ""
212110-52 = "Сама не знаю, почему я... Скажем так, ничего другого надеть не нашлось."
212110-53 = "Но, Ибуки, я не вернусь в Пандемониум, пока Макото не станет прежней."
212110-54 = "...Но Макото... всё ещё ведёт себя странно..."
212110-55 = "..."
212110-56 = "А ты как, Ибуки? Как поживаешь?"
212110-57 = "Вообще-то я как раз пришла тебя проведать."
212110-58 = "А у Ибуки всё просто заме-е-ечательно..."
212110-59 = ""
212110-61 = ""
212110-62 = "..."
212110-63 = "...Не очень-то замечательно, да?"
212110-64 = "Ага... Все очень заняты."
212110-65 = "Макото с тех пор, как ты ушла, работает не покладая рук."
212110-66 = "Она всё время чем-то занимается в Пандемониуме. Кажется, это называется «операция»?"
212110-67 = "Всякие важные дела, планы и всё такое."
212110-68 = "Поэтому ей почти некогда играть с Ибуки. И она выглядит такой уставшей..."
212110-69 = "..."
212110-70 = "Сацуки и Чиаки теперь тоже редко бывают в клубной комнате."
212110-71 = "И Ибуки одиноко."
212110-72 = "...Понятно. Я так и думала, что этим кончится."
212110-73 = "Ибуки, хочешь пойти со мной?"
212110-74 = "Что? Правда?!"
212110-75 = "Да. Хотя бы на время. По-моему, сейчас в Пандемониуме... тебе не место."
212110-76 = "Особенно когда все постоянно заняты и некому за тобой присмотреть."
212110-77 = "Пойдёшь со мной, буду расчёсывать тебе волосы и читать книжки."
212110-78 = "Ура! Ибуки обожает, когда Ироха расчёсывает ей волосы!"
212110-79 = "...Фу-фу. Рада это слышать."
212110-80 = "Но..."
212110-81 = ""
212110-83 = ""
212110-84 = "Тогда Макото останется совсем одна."
212110-85 = "..."
212110-86 = "Ироха, Ибуки знает, каково это, когда ты совсем одна."
212110-87 = "Макото сейчас наверняка о-о-очень одиноко."
212110-88 = "...Ты права."
212110-89 = "Ага. Поэтому Ибуки..."
212110-90 = "...останется с Макото."
212110-91 = "...Ты уверена, что хочешь именно этого?"
212110-92 = "Ага. Ибуки ведь хорошая. С Ибуки всё будет хорошо."
212110-93 = "Если ты так решила..."
212110-94 = "Ироха, береги себя, пока Макото не станет прежней."
212110-95 = "А потом пообещай вернуться в Пандемониум. Хорошо?"
212110-96 = "...Да. Обещаю."
212110-97 = ""
212110-99 = ""
212110-101 = "Давай на мизинчиках!"
212110-102 = ""
212110-104 = ""
212110-105 = ""
212110-106 = "Обещаю."
212110-113 = ""
212110-114 = ""
212110-115 = ""
212110-116 = "..."
212110-117 = "Уф... Наконец-то можно передохнуть."
212110-118 = ""
212110-121 = ""
212110-122 = "...Макото, ты закончила свои очень важные дела?"
212110-123 = "А. Ибуки."
212110-124 = "Даже не спрашивай. Дел ещё непочатый край."
212110-125 = "Подумать только, Ироха всё это время молча со всем этим справлялась..."
212110-126 = "Хмф. Нет смысла говорить о тех, кто ушёл."
212110-127 = "Макото, ты скучаешь по Ирохе?"
212110-128 = "А?! Кто тебе такое сказал?!"
212110-129 = "Она мне не нужна. Я со всем справляюсь сама."
212110-130 = "Обычно я не утруждаю себя подобными мелочами, но я ПРЕКРАСНО разбираюсь во всей её работе. Кихехе."
212110-131 = "Нет, Ибуки не про работу. Ибуки спрашивает... Ты просто хочешь её увидеть? Как друга?"
212110-132 = ""
212110-134 = ""
212110-135 = "..."
212110-136 = "...Ибуки кажется, что Макото в последнее время очень одиноко."
212110-137 = "...Неправда."
212110-138 = "Я, Ханума Макото, никогда не отталкиваю тех, кто приходит, и не удерживаю тех, кто уходит."
212110-139 = "Особенно... тех, кто вздумал восстать в такой решающий момент."
212110-140 = "Ты ещё слишком мала, чтобы понять, Ибуки. Но выдающимся лидерам неизбежно приходится быть одинокими."
212110-141 = "Угу. Ибуки не разбирается в таких сложных вещах..."
212110-142 = "Но ведь ты говорила, что «бунтовать круто», Макото."
212110-143 = ""
212110-145 = ""
212110-146 = "...Я такое говорила?"
212110-147 = "Ага. Ты сама так сказала, Макото."
212110-148 = ""
212110-150 = ""
212110-151 = "...Бунтовать. Бунтовать...?"
212110-152 = "..."
212110-153 = "...Ах."
