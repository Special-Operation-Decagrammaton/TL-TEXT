[translation]
212110-1 = "Episode 11;I Want to Stay by Your Side"
212110-8 = "……."
212110-9 = "……So, the advance route is—"
212110-10 = "Makoto-senpai……."
212110-14 = "Ibuki, what is it? I'm busy right now……."
212110-15 = "……Are you really busy?"
212110-16 = "Indeed. I'm short-handed, and the work that needs processing is piling up."
212110-17 = "Save it for later."
212110-18 = "……Okay."
212110-23 = "Satsuki-senpai~"
212110-27 = "Chiaki-senpai~"
212110-31 = "……."
212110-32 = "There's no one here……."
212110-33 = "I wonder if Iroha-senpai…… is really never coming back……."
212110-34 = "Ibuki wants to stay with her forever, though……."
212110-39 = "Ibuki."
