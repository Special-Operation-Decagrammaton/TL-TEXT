[translation]
2002703-1 = "Контроль темпа"
2002703-3 = "В особенно погожий день мы с Широко бродили по пляжу, холмам и лесам. Она была взволнована сильнее обычного..."
2002703-4 = ""
2002703-6 = ""
2002703-8 = ""
2002703-9 = "О. Здесь тоже хорошо."
2002703-10 = ""
2002703-12 = ""
2002703-13 = "Теперь туда, Сенсей."
2002703-14 = ""
2002703-16 = ""
2002703-18 = ""
2002703-24 = "...Так прошло несколько часов."
2002703-25 = ""
2002703-30 = "Я изо всех сил пытался держаться в темпе Широко, но в конце концов рухнул от усталости."
2002703-31 = "Сенсей...?!"
2002703-32 = "Вы в порядке? Что случилось? Вы ранены?"
2002703-33 = "Съели ядовитое растение? Вас ужалило насекомое? Может, что-то произошло на пляже..."
2002703-34 = "А? Не это?"
2002703-35 = "Вы не ранены? Тогда..."
2002703-36 = "[s1] «Мне просто нужно немного отдохнуть.»\n[s2] «Я уже не такой молодой учитель, а поход выдался серьёзный!»"
2002703-39 = ""
2002703-41 = ""
2002703-42 = "...О."
2002703-43 = "Простите, Сенсей..."
2002703-44 = "Мы слишком торопились. Мне хотелось увидеть всё до конца дня."
2002703-45 = "Я не хотела... чтобы вам было так тяжело..."
2002703-46 = "Иногда я слишком увлекаюсь, Сенсей. Просто я так радовалась..."
2002703-47 = "Я даже не заметила, как вам тяжело..."
2002703-48 = "Это всё моя вина..."
2002703-49 = "..."
2002703-50 = "[s3] «После короткого отдыха всё будет нормально.»\n[s4] «Не переживай. Мне тоже было весело!»"
2002703-53 = "Хорошо..."
2002703-54 = "Можем отдохнуть здесь. Не слишком жарко. И дует прохладный ветер..."
2002703-55 = "Идеальное место... чтобы вы отдохнули."
2002703-56 = "[s5] «Ты ведь тоже устала.»\n[s6] «Тебе не нужен отдых?»"
2002703-59 = "Я в порядке. Никаких проблем. Если понадобится, смогу пройти вдвое больше."
2002703-60 = "Но..."
2002703-61 = ""
2002703-63 = ""
2002703-65 = ""
2002703-67 = "Опасности поблизости не вижу. Но если мы оба уснём, мне будет неспокойно... так что я останусь бодрствовать."
2002703-68 = "Не беспокойтесь обо мне, Сенсей. Закройте глаза. Отдохните."
2002703-69 = "Я смогу расслабиться... когда буду уверена, что с вами всё в порядке."
2002703-70 = "Да. Именно так."
2002703-71 = "Ну..."
2002703-72 = ""
2002703-74 = ""
2002703-77 = ""
2002703-78 = "Спокойной ночи, Сенсей."
2002703-79 = ""
2002703-81 = ""
2002703-82 = ""
2002703-84 = ""
2002703-85 = ""
2002703-87 = "Я закрыл глаза, и усталость мгновенно накрыла меня. Я тут же отключился."
2002703-88 = "Не знаю, сколько я проспал, но когда пришёл в себя, казалось, будто всю усталость смыло."
2002703-91 = "Открыв глаза, я увидел солнце, садящееся над пляжем."
2002703-92 = ""
2002703-97 = "[ns7] «Эм... Пляж?»\n[ns8] «Я был уверен, что уснул в другом месте...»"
2002703-100 = "...О."
2002703-101 = "Вы проснулись."
2002703-102 = ""
2002703-104 = ""
2002703-105 = "Вы крепко спали. Поэтому я принесла вас сюда."
2002703-106 = "Я подумала: вы спите в незнакомом лесу. Там могли быть ядовитые насекомые... Я переживала."
2002703-107 = "Как себя чувствуете? Если хотите, можете ещё поспать."
2002703-108 = "А, я?"
2002703-109 = "Разве я не хочу ещё исследовать окрестности?"
2002703-110 = "Нет... Всё нормально."
2002703-111 = "Само исследование было... не главным. Но пока я исследовала всё вокруг, я могла делать кое-что особенное."
2002703-112 = "Например, оставаться рядом с вами... весь день..."
2002703-113 = "..."
2002703-114 = "Есть..."
2002703-115 = "Я больше нигде не могу так делать. Именно это мне и нравилось."
2002703-116 = "Так что не перенапрягайтесь, Сенсей. Я не хочу быть единственной, кому весело..."
2002703-117 = "Иначе это уже не весело."
2002703-118 = "Отныне... я буду идти медленнее."
2002703-119 = "Темп задавайте вы, Сенсей."
2002703-120 = "Так будет приятнее для нас обоих."
2002703-121 = "Уже поздно..."
2002703-122 = "Пойдём обратно, Сенсей."
2002703-123 = "Если хотите... я могу отнести вас обратно, как принесла сюда."
2002703-124 = ""
2002703-126 = ""
2002703-130 = "[ns9] Отряхнуться и встать.\n[ns10] «Мне уже намного лучше, но спасибо.»"
2002703-133 = ""
2002703-134 = "..."
2002703-135 = "Хорошо..."
