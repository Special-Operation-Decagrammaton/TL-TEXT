[translation]
10033005-174 = "#video;10033"
10033005-1 = "Пролог;Как гром среди ясного неба"
10033005-2 = "*зевок*"
10033005-3 = "Давненько у нас не было возможности просто расслабиться."
10033005-4 = "Да. Сейчас жизнь идёт неспешно."
10033005-5 = "Именно. Медленно, тихо и без всякой суеты. А вишенка на торте — это..."
10033005-7 = ""
10033005-9 = ""
10033005-11 = "Ох. Возможно, это слишком самонадеянно с моей стороны, но как бы я хотела заморозить этот миг навечно."
10033005-12 = "Меня посетило вдохновение."
10033005-13 = ""
10033005-15 = ""
10033005-17 = "Тихое мирное озеро"
10033005-18 = "Карп изящно взмывает ввысь"
10033005-19 = "Отдых в волнах"
10033005-20 = ""
10033005-22 = ""
10033005-23 = "Хайку Чисэ, вдохновлённое совершенством этого момента. Ах, я переполнена чувствами."
10033005-24 = "Истинное умиротворение!"
10033005-25 = ""
10033005-27 = ""
10033005-28 = "Ньяхаха! Мир, любовь и всё такое!"
10033005-29 = "Кстати. Я получила новости: Геенна хочет приехать в Хяккияко на школьную экскурсию."
10033005-31 = "Понятно."
10033005-32 = "Неплохая смена обстановки, правда?"
10033005-33 = "Смена обстановки!"
10033005-35 = "Да-да. Хи-хи... Этот момент..."
10033005-36 = ""
10033005-38 = ""
10033005-39 = "Прости? Ния. Что ты только что сказала?"
10033005-40 = "Ты не слушала? Геенна приезжает сюда на экскурсию."
10033005-41 = "Геенна. Экскурсия. Хяккияко. Сюда."
10033005-42 = "Ага. Всё верно."
10033005-43 = ""
10033005-45 = ""
10033005-46 = "Чего-о-о-о-о?!"
10033005-48 = "Мы едем в путешествие?"
10033005-49 = "Н-на какой стадии подготовка? Д-договоры! Нам нужны договоры! Кто-нибудь составил маршрут? Нужно обратиться в финансовый отдел за бюджетом!"
10033005-50 = "Нам всё это нужно?"
10033005-51 = "...Сметы и деловые предложения! Расписание, план питания, отказы от ответственности, отчёты о состоянии объектов, соглашения о неконкуренции и, и... Ох! Что ещё? ЧТО ЕЩЁ?"
10033005-52 = "Ещё десять секунд назад ты была воплощением спокойствия. Что случилось?"
10033005-54 = "Т-ты права. Нужно двигаться шаг за шагом..."
10033005-55 = "Хорошая мысль. Потому что я ни одной из этих заумностей не делала."
10033005-56 = "Я так и знала! Почему ты не сообщила мне раньше?"
10033005-57 = "Эм... Я просто забы—"
10033005-59 = ""
10033005-61 = ""
10033005-62 = ""
10033005-63 = "...совершенно не забыла, просто я настолько безоговорочно доверяю нашей Кахо, что знала: ты справишься, даже если всё свалится на тебя в последний момент."
10033005-64 = "Д-да, хорошо прозвучало. Не каждый удостаивается такого абсолютного доверия с моей стороны. Какая же ты везучая!"
10033005-65 = ""
10033005-67 = ""
10033005-68 = ""
10033005-69 = "Ни. Я. Я сейчас—"
10033005-70 = "Кья-а-а! Чисэ, спаси меня!"
10033005-71 = ""
10033005-73 = ""
10033005-74 = ""
10033005-75 = "Смотри. Сообщение!"
10033005-77 = "Доставлено Кахо, мною."
10033005-78 = "О! На тебя всегда можно положиться, дорогая Чисэ."
10033005-79 = ""
10033005-81 = ""
10033005-82 = "*вздыхает* Мне нужно успокоиться и оценить ситуацию. Но с тобой я ещё не закончила, Ния."
10033005-83 = ""
10033005-85 = ""
10033005-86 = ""
10033005-87 = "Сообщение от Префектурной команды Геенны?"
10033005-89 = ""
10033005-90 = ""
10033005-91 = ""
10033005-92 = "Что?! Деловая встреча между Префектурной командой и Советом Хяккарёран?!"
10033005-93 = "«...В связи с этим мы просим клуб Инь-Ян оказать содействие в размещении и организационных вопросах...»"
10033005-94 = ""
10033005-96 = ""
10033005-97 = ""
10033005-99 = "Проснись, Кахо...! Здесь спать вредно."
10033005-100 = ""
10033005-103 = ""
10033005-104 = "Как всегда, ты права, Чисэ! Если я сейчас рухну, кто предотвратит катастрофу, которая несётся прямо на нас?"
10033005-105 = "Позволь мне ещё раз изложить текущую ситуацию, Ния."
10033005-106 = "Т-ты выглядишь немного напряжённой, Кахо. Может, массаж? Ч-чашечку чая?"
10033005-107 = ""
10033005-110 = ""
10033005-111 = ""
10033005-112 = "Позволь. Мне. Изложить. Текущую ситуацию."
10033005-113 = "Ньяха...ха. Ч-чего Кахо пожелает, то Кахо и получит!"
10033005-114 = "Во-первых, мы получили от академии Геенны предложение об экскурсии в Хяккияко. Верно?"
10033005-115 = "Можно и так сказать."
10033005-116 = "С тех пор мы не продвинулись в административной подготовке этой поездки ни на йоту."
10033005-117 = "И вот через считаные дни студенты академии Геенны прибудут сюда, в Объединённую академию Хяккияко. Я права или не права?"
10033005-118 = "Т-ты отлично умеешь подводить итоги, Кахо!"
10033005-119 = ""
10033005-121 = ""
10033005-122 = "Кроме того, это уведомление у меня в руках — просьба Префектурной команды организовать встречу между ними и Советом Хяккарёран."
10033005-123 = "И теперь именно мне предстоит организовать всю логистику между нами и Хяккарёран, чтобы эта просьба стала реальностью?"
10033005-125 = "Я правильно понимаю ситуацию?"
10033005-126 = "Сто баллов на экзамене тебе, Кахо!"
10033005-127 = ""
10033005-130 = ""
10033005-131 = ""
10033005-132 = ""
10033005-134 = "Ах. Кахо сегодня очень сонная?"
10033005-135 = ""
10033005-138 = ""
10033005-139 = "Нет-нет. Спасибо за заботу, Чисэ. Но я просто не могу позволить себе потерять сознание, пока не преодолею это испытание."
10033005-140 = "Я не стану отдыхать. На кону сама репутация Хяккияко. Я не позволю ей пасть к ногам Геенны."
10033005-141 = "Ого, Кахо, ты прямо вошла во вкус! Мне нравится!"
10033005-142 = ""
10033005-144 = ""
10033005-145 = ""
10033005-146 = "Я начну работу с Советом Хяккарёран. До свидания, Ния."
10033005-147 = "А? А как же экскурсия?"
10033005-148 = "Студенты Геенны прибудут только через несколько дней."
10033005-149 = "Но Префектурная команда будет здесь уже завтра в это же время."
10033005-150 = "Поэтому сначала я должна заняться самым срочным. Я немедленно составлю план вместе с Хяккарёран."
10033005-151 = "Н-но как же всё остальное? Ты успеешь сделать это всё?"
10033005-153 = "Клуб Инь-Ян отвечает за приём гостей! Что бы ни случилось!"
10033005-155 = "Учитывая это, Ния, в моё отсутствие остальную подготовку возьмёшь на себя ты!"
10033005-156 = ""
10033005-158 = ""
10033005-159 = ""
10033005-160 = "Кахо — просто воплощение усердия, правда?"
10033005-161 = "Мгм. Ты счастлива?"
10033005-162 = "Не переживай, Чисэ. Я всегда счастлива. А раз Кахо ушла заниматься своими делами, полагаю, мы могли бы выполнить её приказ и сделать свою часть работы."
10033005-163 = "Но это ведь было бы совсем не весело, правда?"
10033005-164 = "Хм. А почему это не весело?"
10033005-165 = "Потому что в хорошей истории обязательно должны быть неожиданные повороты сюжета и обстоятельства, превосходящие самые безумные ожидания зрителей!"
10033005-166 = "И, Чисэ, разве ты не согласна, что нам следует постараться сделать это событие весёлым для всех участников?"
10033005-167 = "Да! Очень-очень весёлым!"
10033005-168 = "Ньяхаха! Чисэ одобрила, значит, несёмся вперёд на полной скорости!"
10033005-169 = ""
10033005-171 = ""