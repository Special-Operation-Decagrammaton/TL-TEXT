[translation]
209-1 = "Рассуждение о бессмертии"
209-9 = ""
209-10 = "...Похоже, судьбе нравится снова переплетать наши нити, Сенсей."
209-11 = "Ах, мой внешний вид?"
209-12 = "Прошу простить это неприглядное зрелище. Даже не знаю, какая из форм — эта или предыдущая — была ужаснее."
209-13 = ""
209-15 = ""
209-16 = "Но что такое форма? Тело? Всего лишь сосуд, обречённый истечь."
209-17 = "Судьба, которой вынуждены встретиться все смертные существа. Смерть. Разрушение. Уничтожение."
209-18 = "Срок жизни наших физических форм — лишь мгновение в огромной вселенной. Короткое и легко забываемое."
209-19 = ""
209-21 = ""
209-22 = "Но искусство остаётся!"
209-23 = "Сосуд души, физическое тело, может рассыпаться в прах и атомы, но созданное им искусство остаётся."
209-25 = "Только искусство превосходит смерть! Только искусство способно подтвердить существование и ценность наших душ, когда тела давно забыты."
209-26 = "Для нас, существ, привязанных к физической форме, это единственный путь. Единственный способ для смертного достичь бессмертия."
209-28 = "..."
209-29 = "Итак, позвольте представить вам моё собственное бессмертие, Сенсей."
209-30 = "Я создал свой последний шедевр. Я разработал новую серию Communio Sanctorum... Это искусственные ангелы наших новых доктрин."
209-31 = "Грегориус."
209-32 = "Да, да! Спасибо! Ещё один раунд аплодисментов, мой дорогой Сенсей."
209-34 = "Со страстью! С огнём! Итак, представление начинается!"
