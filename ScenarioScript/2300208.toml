[translation]
2300208-1 = "Дневник ипомеи"
2300208-2 = "Открытая терраса дома Шале"
2300208-3 = "Я пришёл в Шале чуть раньше обычного и увидел Ханаэ с лейкой на открытой террасе."
2300208-4 = "Хм-хм...♪ Пейте побольше и растите большими и сильными! ♪"
2300208-5 = "[s] «Что ты делаешь так рано?»"
2300208-6 = "А, Сенсей. Доброе утро!"
2300208-7 = "Как видишь, поливаю цветы. Хотела добавить больше красок террасе возле моего кабинета."
2300208-8 = "Я так горжусь этими цветами. Каждый раз, когда смотрю, они немного подрастают. Приходя в Шале, я всегда первым делом иду на террасу."
2300208-9 = "[s] «Ради полива необязательно приходить так рано, правда?»"
2300208-10 = "Верно, но... после школы уже не увидишь, как распускается ипомея."
2300208-11 = "Чтобы увидеть её цветение как следует, нужно вставать рано."
2300208-12 = "Смотри, Сенсей. Эти бутоны, возможно, распустятся завтра."
2300208-13 = "Когда ипомеи зацветут, я сорву немного и принесу в кабинет."
2300208-14 = "...Эм, тебе нравятся ипомеи?"
2300208-15 = "[s] «Да.»"
2300208-16 = "Хи-хи. Рада слышать."
2300208-17 = "Но я сделаю их ещё ярче и красивее, чтобы они нравились тебе ещё больше."
2300208-19 = "После этого мы с Ханаэ обсуждали, как выращивать ипомеи на террасе."
