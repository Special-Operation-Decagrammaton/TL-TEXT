[translation]
10052070-1 = "Хесед, Милосердный арбитр"
10052070-2 = "Мне скучно!"
10052070-3 = "Опять начинается. Знаешь, скоро мы можем попасть в какой-нибудь кризис. Наслаждайся скукой."
10052070-4 = "Но они все ушли! Даже Сенсей. На этом скучном корабле остались только мы."
10052070-5 = "Мы не в отпуске, знаешь ли? В каком-то смысле мы на вражеской территории."
10052070-6 = "Верно. Тот, кто снаружи... Хесед?"
10052070-7 = "Да. Это территория Хеседа."
10052070-8 = "Интересно, какой он..."
10052070-9 = "Он тебе не старый школьный друг... Не обязательно с ним знакомиться. Кажется, Хесед — какой-то завод."
10052070-10 = "Завод в руинах Миллениума. Ого, даже ностальгия накатила."
10052070-11 = "Помню. Мы отправились в руины искать G.BIBLE. А вместо этого провалились..."
10052070-13 = "...и нашли Арис."
10052070-15 = ""
10052070-16 = "Это был завод ИИ, да? Кажется, он назывался «Divi:Sion»?"
10052070-17 = "Как бы он ни назывался... Он всё время делал этих большеголовых кальмаров? Медуз?"
10052070-18 = ""
10052070-19 = "И Кей тоже была частью всего этого. Погоди, если подумать, у нас ОЧЕНЬ много личной истории с Хеседом."
10052070-20 = "А нас заперли здесь и заставили сидеть в резерве. Нечестно!"
10052070-21 = "Ничего не поделаешь. Сказали, что Хесед буквально завод и в реальном времени производит орды войск."
10052070-22 = "Поэтому нам нужно задействовать всех людей и ресурсы, чтобы его остановить."
10052070-23 = "Ну, мне кажется немного «личным», что они не используют «персонал», который прямо здесь!"
10052070-24 = "...Ты же сама вытянула жребий и оставила нас здесь..."
10052070-25 = "Ух. Не могу поверить, что ты напомнила о таком болезненном моменте!"
10052070-26 = "И всё же надо ценить небольшой перерыв... хотя мы и не развлекаться сюда пришли."
10052070-27 = ""
10052070-29 = ""
10052070-30 = "...Насчёт нас. Нас двоих..."
10052070-31 = "Да?"
10052070-32 = "Мы ведь правда через столько всего прошли вместе, да?"
10052070-33 = "Руины, космос, а теперь Стальной континент..."
10052070-34 = "Ага... Мы всего лишь хотели делать игры... Как нас так занесло?"
10052070-35 = "Это не пустая трата, Мидори! Все эти приключения дают отличное вдохновение!"
10052070-36 = "Ты то же самое говорила, когда нас выбросило в стратосферу. Но ЭТО мы пока особо не использовали, да?"
10052070-37 = ""
10052070-39 = ""
10052070-40 = ""
10052070-41 = ""
10052070-42 = ""
10052070-43 = ""
10052070-44 = ""
10052070-45 = ""
10052070-47 = "Ч-что это? Какая-то сигнализация «всё-в-порядке»?"
10052070-48 = ""
10052070-50 = ""
10052070-51 = "Момои! Смотри на экран. Ой, всё плохо!"
10052070-52 = ""
10052070-57 = ""
10052070-58 = "А?! Разве это не... Рабочие? И...!"
10052070-59 = ""
10052070-60 = "И они идут прямо к нам!"
10052070-61 = ""
10052070-63 = ""
10052070-65 = "Транспортный корабль, приём? Простите, но..."
10052070-66 = "Мы потеряли из виду нескольких Рабочих и несколько отрядов. Они направляются к вам."
10052070-67 = "Система защиты корабля не оптимальна... но вам двоим придётся справиться!"
10052070-68 = ""
10052070-70 = ""
10052070-71 = "..."
10052070-72 = "Мы их задержим, Химари. Не волнуйся."
10052070-73 = "С-Сестрёнка?!"
10052070-74 = "Мы не можем просто сидеть здесь и ничего не делать. Эти костюмы так хорошо защищены! Придётся выйти и что-то сделать!"
10052070-75 = "Сенсей и Арис стараются изо всех сил, мы не можем бездельничать!"
10052070-76 = "Вы двое и так уже многое для нас сделали."
10052070-77 = "Оставаться на корабле — тоже важная роль."
10052070-78 = "Сейчас это НЕ «важно»!"
10052070-79 = ""
10052070-81 = ""
10052070-82 = "..."
10052070-83 = "Ага. Кажется, я поняла."
10052070-84 = "Не волнуйся, Химари. Мы что-нибудь придумаем."
10052070-85 = ""
10052070-87 = ""
10052070-98 = "Ч-Что нам делать?!"
10052070-99 = "Мне отступить, чтобы помочь Мидори и Момои?"
10052070-100 = "..."
10052070-101 = "Это вариант, но разумнее сделать это после того, как мы закрепимся в этой области."
10052070-102 = "Согласна. Мы проделали долгий путь. Уходить, не закончив миссию, было бы неразумно."
10052070-103 = "Отступление сейчас поставит под угрозу целостность нашего построения."
10052070-104 = "Думаю, нам нужно довериться Момои и Мидори."
10052070-105 = "...Да. Если бы против нас был кто-то другой, а не Хесед, я бы выделила людей."
10052070-106 = "Но при таком количестве войск мы ведём войну на истощение."
10052070-107 = "Тем не менее, предлагаю Химари и Арис быть готовыми немедленно отправиться на помощь при необходимости."
10052070-108 = "Почему мы?"
10052070-109 = "Потому что вы двое самые быстрые."
10052070-110 = "Логично и справедливо. Согласна."
10052070-111 = ""
10052070-112 = "[ns1] «...Давайте победим Хеседа как можно быстрее.»\n[ns2] «И вернёмся к Момои и Мидори.»"
10052070-115 = "Да. Тогда, Сенсей, отдавайте приказы."
