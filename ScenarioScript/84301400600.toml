[translation]
84301400600-5 = "Это я."
84301400600-6 = "Если ты имеешь дело и с программной, и с аппаратной частью, тебе может понадобиться помощь с идентификацией."
84301400600-7 = "Хорошо придумано, Рио. Как раз именно это мне сейчас и нужно."
84301400600-8 = "Можешь сказать, что это такое?"
84301400600-9 = "Конечно."
84301400600-10 = ""
84301400600-12 = ""
84301400600-13 = ""
84301400600-14 = "Оно очень подозрительное, вот что. Я хочу, чтобы ты немедленно принесла это сюда."
84301400600-15 = "Хм... но тогда Инженерный отдел никак не сможет доказать свою невиновность..."
84301400600-16 = "Я с этим разберусь. Подкину в блок Avant Guard подходящее вредоносное ПО. И спрячу его достаточно хорошо, чтобы Инженерный отдел не обвинили в том, что они его пропустили."
84301400600-17 = "Если они узнают, что дело в чипе, это может поставить под угрозу весь Экспо. Для наших целей этот чип должен оставаться в тайне."
84301400600-18 = "Когда они найдут вредоносное ПО, они могут обвинить тебя в том, что это ты его туда поместила."
84301400600-19 = ""
84301400600-21 = ""
84301400600-22 = "Сейчас это неважно."
84301400600-23 = "В любом случае тихо возвращайся сюда. Расскажу больше, когда придёшь. Рио, конец связи."
84301400600-24 = ""
84301400600-26 = ""
84301400600-27 = "Придётся придумать оправдание для Карин и Асуны."
84301400600-28 = "..."
84301400600-29 = "А что до тебя, Рио..."
84301400600-30 = "Ты и правда..."
