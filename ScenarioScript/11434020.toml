[translation]
11434020-1 = "Скрытая концовка;«Счастливы, но...»"
11434020-12 = "За мной!"
11434020-13 = "*тяжело дышит* *пыхтит* *тяжело дышит*"
11434020-14 = "*тяжело дышит* *тяжело дышит* Э-Это... Это..."
11434020-15 = "Не разговаривай, просто беги!! *тяжело дышит* *тяжело дышит*"
11434020-20 = ""
11434020-21 = "*тяжело дышит* *тяжело дышит* Так, теперь можно остановиться."
11434020-22 = "...Все в порядке? Никого не потеряли, да?"
11434020-23 = ""
11434020-25 = ""
11434020-26 = "Я вообще не понимаю, что происходит. То есть я рада, что мы победили, но..."
11434020-27 = "Т-Тоже самое... но..."
11434020-28 = "Это... уже за гранью... рока..."
11434020-30 = "Ох, ну конечно."
11434020-31 = ""
11434020-36 = "*ахает*"
11434020-37 = "«Вот вы где! Один вопрос, пожалуйста!»"
11434020-38 = ""
11434020-39 = "«Можно взять у вас интервью?!»"
11434020-40 = "«Как называется ваша группа? Хотя бы название лейбла скажите!»"
11434020-41 = "«Как вам удавалось так долго оставаться незамеченными?! Все хотят знать!»"
11434020-42 = ""
11434020-43 = "А-А-А-А!!"
11434020-45 = "Ч-Что...?"
11434020-46 = "Что вообще здесь происходит?!"
11434020-47 = "Кажется, произошло недоразумение?! Мы и не думали, что всё зайдёт так далеко!"
11434020-48 = "Э-Эй, мы вообще-то не настоящая группа! Мы умеем играть только эту одну песню!"
11434020-49 = "Фух... И вот мы снова вошли в историю. Четыре непревзойдённых таланта вышли на сцену и сделали её своей."
11434020-50 = "Хватит подливать масла в огонь!"
11434020-51 = ""
11434020-56 = "Мы всё объяснили, вежливо всем отказали и ушли."
