[translation]
1301302-1 = "Охота за легендарным додзинси"
1301302-2 = "В библиотеке"
1301302-3 = ""
1301302-4 = "Я ищу легендарный додзинси!"
1301302-5 = "[s1] «Сколько же в тебе энергии...!»\n[s2] «Погоди-погоди. Для начала расскажи предысторию.»"
1301302-8 = "Ой, прости, Сенсей! Кажется, я слишком разошлась..."
1301302-9 = "Говорят, где-то в академии Красная Зима есть додзинси, который собрал предыдущий состав Фронта освобождения знаний."
1301302-10 = "Разве от одной мысли о легендарном додзинси сердце не начинает биться быстрее?!"
1301302-11 = "Там может быть информация о нашей прошлой истории, культуре и ещё куче всего!"
1301302-12 = "Кхм! В общем, он может помочь решить все проблемы, от которых Фронт освобождения знаний страдает прямо сейчас!"
1301302-13 = "[s] «Ты правда так думаешь...?»"
1301302-14 = ""
1301302-16 = ""
1301302-18 = ""
1301302-19 = "Да! Так что давай искать его вместе, Сенсей!"
1301302-20 = "...Хм? Бумага довольно легко портится? Точно! Значит, чем дольше мы тянем, тем больше влаги она впитывает! Прямо сейчас она разрушается!"
1301302-21 = "Есть ли у меня хоть какие-то зацепки? Не переживай о мелочах! Я подготовилась!"
1301302-23 = ""
1301302-25 = ""
1301302-27 = ""
1301302-29 = ""
1301302-31 = ""
1301302-32 = ""
1301302-34 = ""
1301302-36 = "[ns] «Эм, Момидзи? А это... что?»"
1301302-37 = ""
1301302-39 = ""
1301302-40 = ""
1301302-41 = "Что такое, Сенсей?"
1301302-42 = "Так мы и будем искать легендарный додзинси! Разве не очевидно?"
1301302-43 = "...Что-то не так?"
1301302-44 = "[s] «Я просто не уверен... что это лучший способ...»"
1301302-45 = "О чём ты говоришь, Сенсей?"
1301302-46 = "У лозоходства такая богатая культура и история."
1301302-47 = "Обычно рамки используют, чтобы искать подземные источники воды..."
1301302-48 = "Но если использовать основные принципы лозоходства, мы должны суметь найти и потерянные вещи!"
1301302-49 = "Тсс. Смотри. Медные прутья... уже поворачиваются."
1301302-50 = ""
1301302-52 = ""
1301302-53 = "Если пойти в ту сторону, где они начинают вращаться быстрее..."
1301302-54 = ""
1301302-56 = ""
1301302-57 = "Крутись, крутись, крутись..."
1301302-58 = ""
1301302-60 = ""
1301302-61 = "Здесь! Я уверена!"
1301302-62 = "Я возьму оружие и взорву здесь всё к чертям!"
1301302-63 = "[ns] «Так ты уничтожишь додзинси, который ищешь!»"
1301302-65 = ""
1301302-67 = ""
1301302-68 = "Ой, правда? Т-Тогда что нам делать?"
1301302-69 = "Копать...? Но большая часть земли в Красной Зиме промёрзла насквозь, так что будет нелегко."
1301302-70 = "Но, наверное, это всё-таки лучше, чем взорвать легендарный додзинси..."
1301302-76 = ""
1301302-77 = "Мы уже выкопали целый метр! И не нашли ни единого клочка бумаги... Уф..."
1301302-78 = "Интересно, почему? Может, с моими навыками лозоходства что-то не так?"
1301302-79 = "[s] «Не думаю, что дело именно в твоих навыках лозоходства...»"
1301302-80 = "Точно! Конечно, не в них! Нам просто нужен другой метод."
1301302-81 = ""
1301302-83 = ""
1301302-84 = "Как насчёт... маятника!"
1301302-85 = "Сейчас он почти не двигается..."
1301302-86 = "Но чем ближе мы будем к нужному предмету, тем шире он начнёт вращаться!"
1301302-87 = ""
1301302-88 = "Ладно, забудь! Следующим используем датчик магнитного поля!"
1301302-89 = "Можно скачать бесплатное приложение и использовать встроенный магнитный датчик телефона!"
1301302-90 = ""
1301302-91 = "Детектор вен!"
1301302-92 = ""
1301302-93 = "Карты Таро...!"
1301302-94 = ""
1301302-95 = "Астрология..."
1301302-96 = ""
1301302-97 = "Уээээ..."
1301302-98 = "[s] «М-Момидзи? Не плачь...»"
1301302-99 = "Но... но я никак не могу найти додзинси, каким бы инструментом ни пользовалась..."
1301302-100 = "[s] «Он настолько важен?»"
1301302-101 = "..."
1301302-102 = "Д-Для меня — да..."
1301302-103 = "Другим это может показаться пустяком, а если мы всё-таки найдём его, Сенсею он даже может показаться глупым и нелепым..."
1301302-104 = "Но этот додзинси всё равно часть истории Фронта освобождения знаний..."
1301302-105 = "Я уверена, там будут комиксы, рисунки и другие материалы, которых я раньше никогда не видела."
1301302-106 = ""
1301302-108 = ""
1301302-109 = "Поэтому я не могу сдаться."
1301302-110 = "Я понимаю, что это глупо, так что прости, что втянула тебя, Сенсей."
1301302-111 = "Я могу... поискать его сама. Можешь возвращаться..."
1301302-112 = "Ещё раз прости... Это была всего лишь глупая мечта."
1301302-113 = "Спасибо за сегодняшний день, Сенсей. Береги себя."
1301302-114 = "[s] «Где ищем дальше?»"
1301302-115 = "А-А? Тебе ведь вообще незачем переживать из-за этого додзинси..."
1301302-116 = "Но ты всё равно будешь помогать мне искать его?"
1301302-117 = "..."
1301302-118 = "От всего сердца спасибо тебе, Сенсей! И ещё раз прости..."
1301302-120 = ""
1301302-121 = ""
1301302-122 = "...Обычно после такого трогательного момента герои находят то, что искали..."
1301302-123 = "По крайней мере, в манге так бывает..."
1301302-124 = "Уф... Похоже, в реальности всё не настолько просто..."
1301302-125 = "[s3] «Может, додзинси всё это время был внутри нас.»\n[s4] «Может, настоящий додзинси находится в наших сердцах.»"
1301302-128 = "Эта фраза будто прямиком из какого-то дешёвого субботнего утреннего мультфильма..."
1301302-129 = ""
1301302-131 = ""
1301302-132 = "Погоди, Сенсей. Внутри... Внутри..."
1301302-133 = ""
1301302-135 = ""
1301302-136 = "Сенсей, неужели...?!"
1301302-137 = "[s] «Что такое, Момидзи?»"
1301302-138 = "В библиотеку! Немедленно!"
1301302-140 = "Самую дальнюю часть библиотеки сейчас используют как склад."
1301302-141 = "Возможно, это как раз единственное место, которое никому не пришло в голову проверить!"
1301302-142 = "...!"
1301302-143 = ""
1301302-145 = ""
1301302-146 = "Я нашла его, Сенсей! Легендарный додзинси Фронта освобождения знаний!"
1301302-147 = "[s5] «Не могу поверить, что он хранился здесь! Поздравляю, Момидзи!»\n[s6] «Всегда находится в последнем месте, где ищешь!»"
1301302-150 = "Ты прав. Хи-хи-хи. Я так счастлива. И всё благодаря тебе."
1301302-151 = "Что? Ты просто сказал первое, что пришло в голову?"
1301302-152 = "Но это всё равно очень помогло! Именно твои слова подсказали мне поискать на складе!"
1301302-153 = "К тому же ты весь день помогал мне с поисками."
1301302-154 = "Ладно! Посмотрим, что внутри..."
1301302-155 = ""
1301302-157 = ""
1301302-159 = ""
1301302-160 = "..."
1301302-161 = "Хи-хи. Почему у меня так сильно бьётся сердце?"
1301302-162 = "Это без сомнения сделали наши предшественники. Он полон их работ: какие-то немного неуклюжие, а какие-то вдохновляющие!"
1301302-163 = "Но каждая страница буквально кричит об их чувствах, усилиях и отчаянной самоотдаче, которые они вложили в его создание!"
1301302-164 = "Прямо как сборник ранних работ с Комисена..."
1301302-165 = "Что? Я разочарована?"
1301302-166 = "Конечно нет. Как я могу разочароваться, найдя ещё одну частицу истории Фронта освобождения знаний?"
1301302-167 = "Да, здесь нет всех ответов на наши проблемы или какого-нибудь великого откровения."
1301302-168 = "Но он даёт мне кое-что важнее. Видеть, что наши давние старшие создали это с теми же чувствами, которые мы несём и сегодня... Это даёт мне смелость продолжать двигаться вперёд."
1301302-169 = ""
1301302-171 = ""
1301302-172 = ""
1301302-173 = "Хи-хи-хи. Сенсей?"
1301302-174 = ""
1301302-176 = ""
1301302-178 = ""
1301302-179 = "Я так рада, что ты здесь со мной!"
