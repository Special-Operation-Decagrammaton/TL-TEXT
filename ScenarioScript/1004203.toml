[translation]
1004203-1 = "Поздняя ночь в академии"
1004203-2 = "Крыша главного здания академии"
1004203-3 = "Доброе утро, Сенсей."
1004203-4 = "[s1] «Доброе утро.»\n[s2] «Наверное, „доброй ночи“ было бы уместнее.»"
1004203-5 = "Да. Приветствия важны."
1004203-6 = "Да. Приветствия важны."
1004203-7 = "[s] «Я уже слышал. Где мы?»"
1004203-8 = "На крыше ближайшей школы."
1004203-9 = "[s] «Ну да. Но почему мы на этой крыше?»"
1004203-10 = "Потому что эта дверь открыта. Через неё можно попасть внутрь здания."
1004203-11 = "Пожалуйста, держитесь рядом."
1004203-12 = ""
1004203-14 = ""
1004203-15 = "[ns3] «П-Подожди, Ацуко!»\n[ns4] «М-Мы что, пробираемся внутрь?!»"
1004203-16 = "...Как странно. Быстрее, Сенсей!"
1004203-17 = "...Как странно. Быстрее, Сенсей!"
1004203-18 = "[ns] Последовать за ней."
1004203-19 = ""
1004203-23 = "Не совсем так я это представляла..."
1004203-24 = "Вон там. Я хочу посмотреть, как выглядит класс."
1004203-25 = ""
1004203-27 = ""
1004203-28 = "[ns5] «П-Подожди!»\n[ns6] Последовать за ней."
1004203-31 = "..."
1004203-32 = "Вот как они выглядят..."
1004203-33 = "[s] «Ацуко, нельзя вторгаться на территорию школы.»"
1004203-34 = "Серьёзно?"
1004203-35 = "Но... я не собираюсь причинять вред."
1004203-36 = "...Понимаю. Если кто-то узнает, для меня это плохо закончится."
1004203-37 = "Я хочу хотя бы ненадолго это испытать. Пожалуйста?"
1004203-38 = "[s7] «*вздыхает* ...Только один раз.»\n[s8] «И совсем недолго, хорошо?»"
1004203-39 = "Спасибо, Сенсей."
1004203-40 = "Спасибо, Сенсей."
1004203-41 = ""
1004203-43 = ""
1004203-45 = ""
1004203-47 = "Ацуко села за парту и выжидающе посмотрела на меня."
1004203-48 = "Сенсей, вопрос."
1004203-49 = "[s] «...Хочешь, чтобы я задал тебе вопрос?»"
1004203-50 = "Вы ведь учитель, значит, конечно, у меня есть вопрос к вам."
1004203-51 = "[s9] «(А... Это и есть игра в школу?)»\n[s10] «Да, Ацуко. Что такое?»"
1004203-52 = "Откуда берутся дети?"
1004203-53 = "Откуда берутся дети?"
1004203-54 = "[s] «...»"
1004203-55 = "Ха-ха. Это была шутка. Как... классный шут, кажется, так это называется."
1004203-56 = ""
1004203-58 = ""
1004203-59 = "Давайте ещё исследуем школу."
1004203-61 = "Ого! Актовый зал такой большой."
1004203-62 = "В этой школе и правда столько учеников?"
1004203-63 = "Не представляю, насколько шумно здесь, когда все собираются вместе."
1004203-65 = "Это... душевая?"
1004203-66 = "Наверное, здесь они моются после занятий физкультурой. Как весело."
1004203-67 = "В Ариусе мыться вместе с другими было одним из моих любимых занятий."
1004203-68 = "Хорошо, следующая остановка, Сенсей."
1004203-70 = "Похоже, это комната какого-то клуба."
1004203-71 = "Клуб исследования декоративных камней? Они собирают камни? Никогда о таком не слышала."
1004203-72 = "Наверное, в школах столько же клубов, сколько существует увлечений."
1004203-73 = "[s] «У тебя есть какие-нибудь хобби?»"
1004203-74 = "Я?"
1004203-75 = "Ну... Хм... Никогда об этом не думала..."
1004203-76 = ""
1004203-79 = "Сенсей! В коридоре кто-то есть."
1004203-80 = "[s] «Быстро, бежим!»"
1004203-81 = ""
1004203-84 = "Я поспешно вывел Ацуко из академии."
1004203-86 = "...Хи-хи, это было близко."
1004203-87 = "Но... разве это не было захватывающе?"
1004203-88 = "[s] Глубоко вздохнуть."
1004203-89 = "Хи-хи. Сегодня вам многое пришлось терпеть ради меня, Сенсей."
1004203-90 = "Что ж, до следующего раза."
