[translation]
42140-1 = "Эпизод 14: Дилемма заключённого"
42140-2 = "К тому времени, как я покинул парк Коусаги и вернулся в Шале, уже был поздний вечер..."
42140-3 = ""
42140-7 = "Здание Шале, магазин Ангел 24"
42140-10 = "Я подошёл к прилавку взять бэнто, но..."
42140-11 = ""
42140-14 = "[ns] «А? Ничего не осталось?»"
42140-15 = "Простите, Сенсей. Сегодня всё закончилось."
42140-16 = "[s1] «Мне просто нужно было хоть что-нибудь поесть...» \n[s2] «Больше совсем ничего нет? Может, хотя бы просроченные?»"
42140-19 = "Нет, простите... У нас закончились абсолютно все бэнто..."
42140-20 = "По какой-то причине со вчерашнего дня только в этот Ангел 24, который находится в Шале, вообще не привозят бэнто."
42140-21 = "Я пыталась выяснить причину, но мне сказали, что это связано с новым распоряжением и что даже запланированные поставки бэнто отменили..."
42140-22 = "Из напитков у нас осталась только вода..."
42140-23 = "[s] «То есть ни хлеба, ни каких-нибудь других напитков тоже нет...?»"
42140-24 = "Да... В общем, что-нибудь поесть или выпить..."
42140-25 = "Я всё ещё здесь, но сегодня мы практически весь день закрыты. Простите за неудобства..."
42140-26 = "[s3] «Всё в порядке. Ты не виновата, Сора.»\n[s4] «(Я ожидал куда более серьёзной мести, чем такая мелочная...)»"
42140-27 = ""
42140-28 = ""
42140-33 = "Эм, Сенсей? Вы случайно не знаете, что вообще происходит в D.U.?"
42140-34 = "После переворота и всего этого здесь совсем всё заглохло. От главного офиса магазина никаких вестей."
42140-35 = "Нам выдали новые инструкции, которые надо выучить, но там столько правил! А ещё иногда заходят страшные охранники «Кайзера» и проверяют, соблюдаем ли мы все требования..."
42140-36 = "Говорят, все магазины Ангел 24 закроют и заменят на Кайзер 26... А моя работа..."
42140-37 = "Я слышала про магазины Кайзер 26 ужасные вещи. Говорят, там нужно работать по двадцать шесть часов в сутки, Сенсей! Я так не выдержу..."
42140-38 = "[ns5] «А я всё думал, откуда взялось число 26...»\n[ns6] «...Работать 26 часов в сутки вообще невозможно...»"
42140-39 = ""
42140-40 = ""
42140-43 = "[ns] «А поесть тебе всё-таки удалось?»"
42140-44 = "Да. К счастью, сегодня я взяла с собой обед."
42140-45 = "Вчера я приготовила слишком много тушёного мяса с картошкой, так что просто взяла остатки на ужин..."
42140-46 = ""
42140-48 = ""
42140-49 = ""
42140-50 = "Ой, эм..."
42140-51 = "Если хотите, можете взять мой."
42140-52 = "[ns] «Н-Нет! Правда, всё нормально!»"
42140-53 = ""
42140-57 = "Я не смог заставить себя забрать ужин Соры, поэтому вежливо отказался и вернулся в исполнительный офис Шале."
42140-59 = "Исполнительный офис Шале"
42140-63 = "[ns] «Я умираю с голоду...»"
42140-69 = "Эй, доставка FOX EATS!"
42140-70 = "У меня заказ для кого-то по имени... [USERNAME]?"
42140-71 = ""
42140-74 = "[ns] «Эм... Но я ничего не заказывал.»"
42140-75 = "Странно... У меня тут заказ на бенто с инаризуси, доставить прямо в исполнительный офис Шале."
42140-76 = "Если откроете дверь, я смогу сверить данные заказа!"
42140-77 = ""
42140-80 = "[ns7] Открыть дверь.\n[ns8] Не открывать дверь."
42140-81 = ""
42140-85 = "...Спасибо."
42140-90 = ""
42140-91 = "[ns9] «Вы...?»"
42140-92 = "Добрый вечер, Сенсей. Давно не виделись."
42140-93 = "Привет-привет."
42140-94 = "Не верится, что мы проделали весь этот путь только ради встречи с вами..."
42140-95 = ""
42140-97 = ""
42140-98 = "Уже довольно поздно. Вы ужинали?"
42140-99 = "А что мне ещё было делать? Не могли же мы уйти, так и не отдав еду!"
42140-100 = ""
42140-104 = "Липкая взрывчатка установлена. Всем укрыться."
42140-105 = "[s10] «Стойте! Что вообще происходит?!»"
42140-106 = ""
42140-110 = "Три... два... один..."
42140-111 = ""
42140-114 = "[ns11] «Стойте, стойте, стойте! Я же могу просто—!»"
42140-115 = ""
42140-124 = ""
42140-125 = "Ого, получилось немного мощнее, чем я ожидала."
42140-126 = "Отоги, сколько ты туда заложила? Дверь же полностью снесло!"
42140-127 = "Упс, виновата. Я снайпер, не вините меня за то, что я не разбираюсь во взрывчатке."
42140-128 = "Ха-ха-ха... Простите, Сенсей. Мы обязательно починим вам дверь, честное скаутское."
42140-129 = "[s12] «Вы...?»"
42140-130 = ""
42140-133 = "Я бы сказала «добрый вечер», но при таких обстоятельствах... И всё же мы правда рады снова вас видеть, Сенсей."
42140-134 = "Уже довольно поздно. Вы ужинали?"
42140-137 = "[ns] «Ещё нет.»"
42140-138 = "Мы так и думали."
42140-139 = "Я слышала, что во время передачи власти возникли... некоторые неожиданные проблемы с поставками, и магазин Шале каким-то образом... пропустили..."
42140-141 = "Неплохая попытка, Нико. Мы все знаем, что кто-то просто мелочно мстит."
42140-142 = "Возиться с поставками еды? Серьёзно? Детский сад какой-то."
42140-143 = "Но если подумать, тактически это довольно эффективно."
42140-144 = "Пустой желудок рано или поздно победит любые идеалы."
42140-146 = "Но Сенсей ведь не устраивает сидячую забастовку в исполнительном офисе Шале. Это... немного незрело."
42140-147 = ""
42140-149 = ""
42140-150 = "Ну, пока что мы из FOX EATS... то есть отряд FOX, будем снабжать вас чем сможем."
42140-151 = "[ns] «Это инаризуси?»"
42140-152 = "Ага. Помните те, что были в прошлый раз?"
42140-153 = "Кажется, они вам понравились, поэтому в этот раз я приготовила ещё."
42140-154 = "Не стесняйтесь, угощайтесь."
42140-156 = "Хотя я понимаю и не обижусь, если в нынешней ситуации вы немного насторожены..."
42140-157 = ""
42140-160 = "[ns] Съесть инаризуси Нико."
42140-161 = ""
42140-166 = ""
42140-167 = "...Нико, он уже ест."
42140-168 = "Постойте... Вы только что... просто взяли и съели?"
42140-170 = "Вы, эм... случайно не в себе?"
42140-171 = "[s13] «Я так проголодался... Это безумно вкусно. Наоборот, мне отлично.»\n[s14] «Жареный тофу такой нежный, а рис — идеальной текстуры!»"
42140-174 = "Я не это имела в виду..."
42140-175 = ""
42140-177 = ""
42140-178 = ""
42140-179 = "Знаю, странно слышать это от меня, но... вам не приходило в голову, что мы могли что-нибудь с ними сделать?"
42140-180 = "[s] «...А? В смысле, яд? Здесь...?»"
42140-181 = "Ну, нет, но..."
42140-182 = ""
42140-185 = "Сенсей, кажется, вы упускаете суть. Сейчас мы, вообще-то, по разные стороны."
42140-186 = "Уверена, вы прекрасно знаете, что мы объединились с исполняющей обязанности президента Каей, чтобы она поддержала возрождение SRT."
42140-187 = "Сразу после того, как вы отказали Кае в лицо, её люди приходят к вам с едой, а вы даже не подозреваете скрытых мотивов?"
42140-188 = "Вы наивный или просто глупый?"
42140-189 = "Я знаю выражение «держи врагов близко», но не настолько же, чтобы есть их еду!"
42140-190 = "Знаете, на поле боя мы иногда оставляем неисправные боеприпасы, чтобы враг их подобрал. Здесь похожий принцип!"
42140-191 = "Именно поэтому академия SRT учит студентов никогда не трогать еду и воду, принадлежащие противнику."
42140-192 = "[ns] «Но я вам не враг.»"
42140-193 = ""
42140-195 = ""
42140-196 = "[ns] «...Я всего лишь ваш учитель.»"
42140-197 = ""
42140-199 = ""
42140-200 = "Хм..."
42140-201 = "Вы и правда полностью соответствуете своей репутации."
42140-203 = "Такое безусловное доверие не приносит ничего хорошего, даже с союзниками или друзьями."
42140-204 = "Если люди видят, что вы слишком доверчивы, они могут счесть вас наивным и ненадёжным, а это мешает переговорам."
42140-205 = "Те, кто не относится настороженно и скептически к чужим мотивам, обычно остаются в проигрыше."
42140-206 = "Зная это, почему вы всё равно продолжаете так поступать?"
42140-207 = "[s] «Я понял, что доверие приносит куда больше пользы, чем подозрительность.»"
42140-209 = "...Философия и идеалы."
42140-210 = "Сенсей, вы знаете о дилемме заключённого?"
42140-211 = "Это психологическая теория. Двух заключённых разделяют и дают им два варианта. Если ни один не предаст другого, обоих отпустят. Но если один решит сотрудничать, а другой — нет, на свободу выйдет только предатель."
42140-212 = "Иными словами, два заключённых могут либо сотрудничать ради общей выгоды, либо предать друг друга ради личной. Обычно они в итоге предают друг друга, потому что это оптимальный выбор."
42140-213 = "Пусть это всего лишь теория, она подчёркивает необходимость самосохранения. Мы имели дело с самыми разными преступниками, и я ни разу не видела, чтобы кто-то жертвовал своим благополучием ради чужой выгоды."
42140-214 = "...Так называемое доверие, которым хвастаются взрослые, ничем не отличается."
42140-215 = "[s15] «Сложно, но твоя точка зрения интересная!»\n[s16] «Вы и правда элита SRT!»"
42140-218 = "Это обычная теория игр. Для такого едва ли нужна специальная подготовка..."
42140-219 = ""
42140-221 = ""
42140-222 = "Ч-Что... В-В-Вы только что нас похвалили?!"
42140-223 = "О нет. Вы нашли её слабое место. Все бойтесь комплиментов!"
42140-224 = "[s] «Но твоя теория... Думаю, реальность часто будет тебя удивлять.»"
42140-225 = "Да, настоящая жизнь куда сложнее каких-то простых моделей теории игр."
42140-226 = "Как ваши решения повлияют на будущее? Скажется ли результат этой игры на следующей?"
42140-227 = "...Но, Сенсей, эта игра на самом деле не о том, чтобы выиграть этот раунд или проиграть тот."
42140-228 = "Самый эффективный способ победить — сделать так, чтобы проигравший не смог вернуться. Поселить во враге столько страха, недоверия и ощущения предательства, чтобы он больше никогда не выступил против вас."
42140-230 = "Сенсей, скорее всего, когда всё закончится, мы больше никогда не увидимся."
42140-231 = "Возможно, мы даже не вспомним ваш ответ в этой игре, Сенсей. Мы оружие, которое умеет смотреть только вперёд."
42140-232 = "Это незначительное решение, которое в итоге никого не будет волновать."
42140-233 = "И всё же вы нам доверяете?"
42140-234 = "[s] «Да.»"
42140-236 = "Если вы не собираетесь воспринимать нас всерьёз, тогда—"
42140-237 = "Куруми. Остынь."
42140-239 = "Даже если мы скажем, что сегодня уйдём отсюда и забудем обо всём случившемся, вы всё равно поставите на возможность завтрашнего дня?"
42140-240 = "[ns] «Конечно»."
42140-241 = ""
42140-243 = ""
42140-245 = "[ns17] «Моя работа — научить вас добираться до завтрашнего дня так, как захотите вы сами.»\n[ns18] «В этом весь смысл. Чтобы мои ученики однажды стали взрослыми завтрашнего дня.»"
42140-246 = ""
42140-247 = ""
42140-249 = ""
42140-250 = ""
42140-252 = ""
42140-253 = "...Вы тот ещё человек, Сенсей."
42140-254 = "...Такой же странный, как о вас говорят."
42140-255 = "[s] «Знаете, ваш отряд FOX — прекрасное доказательство силы доверия.»"
42140-257 = "[ns19] «Я видел, насколько отряд FOX доверяет своему командиру.»\n[ns20] «Ваше доверие к Юкино — основа вашей силы.»"
42140-260 = "Наше доверие к Юкино..."
42140-261 = "...Ну, тут вы не ошиблись."
42140-262 = "В конце концов, она командир нашего отряда."
42140-263 = ""
42140-266 = "[ns] «...А что-то не так?»"
42140-267 = ""
42140-269 = ""
42140-270 = ""
42140-272 = "Нет, вовсе нет."
42140-273 = "Связи между членами отряда FOX всегда были нерушимы."
42140-275 = "Так что можете перестать пытаться влезть между нами своими красивыми словами."
42140-276 = "Она наша подруга. И была ею ещё до того, как стала командиром отряда."
42140-278 = "Что ж, сегодняшний вечер оказался весьма познавательным."
42140-279 = ""
42140-281 = ""
42140-282 = ""
42140-283 = "Мы доставили вам еду, так что наша миссия завершена."
42140-284 = "Похоже, мы нагрянули без предупреждения, засыпали вас вопросами и теперь так же бесцеремонно уходим. Прошу прощения."
42140-285 = "Чтобы загладить вину, может, вы хотите спросить нас о чём-нибудь?"
42140-286 = "[s21] «Отряд RABBIT доволен своим решением?»\n[s22] «Как там RABBIT? Они хорошо осваиваются?»"
42140-289 = "Отряд RABBIT..."
42140-290 = "Местоположение наших подразделений засекречено, поэтому мы не можем это разглашать..."
42140-291 = ""
42140-293 = ""
42140-295 = ""
42140-296 = ""
42140-297 = ""
42140-299 = "...Сядьте на автобус номер 10 в сторону Синкирō у остановки перед Шале, выйдите на конечной, пройдите километр на восток вдоль высохшей долины — и найдёте объект, которого нет на карте."
42140-300 = "С виду это заброшенный лагерь, но на самом деле там полностью действующая тренировочная база для студентов SRT, работавшая ещё до исчезновения президента Генерального студенческого совета."
42140-301 = "Сейчас там размещён отряд RABBIT."
42140-302 = "Сами сможете спросить, как у них дела."
42140-304 = "Нико! Нельзя же просто взять и рассказать им это!"
42140-305 = "Местоположение отрядов SRT — конфиденциальная информация второго уровня!"
42140-306 = "Всё нормально. Они не в тюрьме, и к ним должны иметь право приходить посетители."
42140-307 = "Но, эм... постарайтесь никому об этом не рассказывать. Особенно Юкино..."
42140-308 = "Ну вот как с тобой можно..."
42140-309 = "Ладно. Я больше ничего по этому поводу не думаю."
42140-311 = "Вообще-то, заместитель командира, формально вы выше меня по званию."
42140-312 = "Хи-хи. Спасибо вам обеим."
42140-313 = "Если Сенсей сможет достучаться до этих девочек, может, и для нас ещё есть надежда..."
42140-314 = ""
42140-316 = ""
42140-317 = ""
42140-318 = "До следующей—"
42140-319 = "...Берегите себя, Сенсей."
42140-320 = ""
42140-322 = ""
42140-326 = "После их ухода я доел оставшиеся инаризуси, размышляя, что делать дальше."
42140-327 = ""
42140-330 = "...Почему-то инаризуси Нико были ещё вкуснее, чем в прошлый раз."
42140-332 = "Следующий эпизод; Правосудие SRT"
