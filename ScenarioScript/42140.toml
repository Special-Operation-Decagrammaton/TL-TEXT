[translation]
42140-1 = "Episódio 14;O Dilema do Prisioneiro"
42140-2 = "(Depois de arrumar as coisas e voltar do Parque Kousagi, já estava bem tarde...)"
42140-7 = "Loja de Conveniência Angel 24"
42140-10 = "(Olhando para a prateleira de bentôs...)"
42140-14 = "[ns] \"Ué? Não tem nenhum bentô...?\""
42140-15 = "D-Desculpa... Hoje esgotou tudo."
42140-16 = "[s1] \"E eu que queria comprar um bentô na loja de conveniência pro jantar de hoje...\"\n[s2] \"Sendo assim, nem sobrou nada do descarte...?\""
42140-19 = "Sim... Nem mesmo o bentô de broto de feijão que sempre ia pro descarte..."
42140-20 = "Além disso, não sei por quê, mas desde ontem só a nossa loja foi proibida de encomendar bentôs..."
42140-21 = "Quando perguntei o motivo, só me disseram que era uma nova ordem administrativa...#nE todos os bentôs que eu já tinha encomendado foram cancelados..."
42140-22 = "Agora só sobrou praticamente água mineral..."
42140-23 = "[s] \"Por acaso pães e chás também...?\""
42140-24 = "Sim. Não só pães, mas também não consigo encomendar nenhum tipo de bebida..."
42140-25 = "Hoje a loja está aberta só de fachada.#nPeço desculpas pelo transtorno..."
42140-26 = "[s3] \"Não é culpa sua, Sora.\"\n[s4] (Será que isso... é uma provocação direcionada a mim...?)"
42140-33 = "S-Sensei... Hum, por acaso você sabe de alguma coisa#nsobre o que anda acontecendo no D.U. ultimamente?"
42140-34 = "Talvez por causa da confusão na cidade anteontem, não tem ninguém nas ruas...#nE o clima na matriz também está bem estranho..."
42140-35 = "Mandaram um manual enorme dizendo que são novas regras para o setor de serviços...#nE uns caras assustadores da Kaiser Security vieram à loja verificar se estamos cumprindo a ordem administrativa..."
42140-36 = "Está até correndo o boato de que a \"Angel 24\" pode fechar e virar \"Kaiser 26\" no lugar... O que é que eu faço?"
42140-37 = "Parece que a \"Kaiser 26\" tem um ambiente de trabalho tão pesado que nem 26 horas de expediente por dia dão conta... Se eu trabalhar num lugar desses, vou morrer de exaustão..."
42140-38 = "[ns5] \"Então era isso que significava o 26...\"\n[ns6] \"Trabalhar 26 horas por dia não é meio impossível...?\""
42140-43 = "[ns] \"Você já jantou, Sora?\""
42140-44 = "Sim. Eu trouxe marmita de casa, então está tudo bem."
42140-45 = "Ontem acabei fazendo nikujaga demais—"
42140-50 = "Ah, hum..."
42140-51 = "Bem... Se você não se importar..."
42140-52 = "[ns] \"T-Tudo bem! Não se preocupe comigo!\""
42140-57 = "(Como eu obviamente não podia aceitar a marmita da Sora, voltei correndo para o escritório da Schale)"
42140-59 = "Escritório da Schale"
42140-63 = "[ns] \"Que fome...\""
42140-69 = "\"É da 'FOX EATS'!\""
42140-70 = "\"[USERNAME]-sama, você pediu um bentô, certo?\""
42140-74 = "[ns] \"Hum, eu não pedi nada não...\""
42140-75 = "\"Que estranho... Recebemos um pedido para entregar uma porção de inarizushi aqui.\""
42140-76 = "\"Vou conferir, então poderia abrir um pouquinho a porta?\""
42140-80 = "[ns7] Abrir a porta.\n[ns8] Não abrir a porta."
42140-85 = "\"...Obrigada.\""
42140-91 = "[ns9] \"Vocês são daquela vez...?\""
42140-92 = "Boa noite, Sensei. Que bom vê-lo novamente."
42140-93 = "E aí! Tudo certo?"
42140-94 = "Haa... Pensar que a gente ia se encontrar de novo..."
42140-98 = "Sensei, você já jantou?"
42140-99 = "...Não tem jeito.#nVoltar de mãos vazias agora também não dá..."
42140-104 = "...Instalação concluída. Pronto para detonar."
42140-105 = "[s10] \"...O que vocês estão fazendo?\""
42140-110 = "3... 2... 1..."
42140-114 = "[ns11] \"Espera, eu já vou abrir—\""
42140-125 = "Opa, foi mais espalhafatoso do que eu pensava."
42140-126 = "Otogi! Quanto explosivo você usou nesse arrombamento?!#nA porta voou com batente e tudo!"
42140-127 = "Foi mal, foi mal. Não tô muito acostumada com CQB."
42140-128 = "Ahaha... Desculpa, Sensei.#nNós vamos consertar a porta rapidinho..."
42140-129 = "[s12] \"Vocês são daquela vez...?\""
42140-133 = "Boa noite... Embora a situação deixe meio sem graça dizer isso...#nQue bom vê-lo novamente, Sensei."
42140-134 = "Sensei, você já jantou?"
42140-137 = "[ns] \"Ainda não.\""
42140-138 = "...Imaginei."
42140-139 = "Parece que essa nova ordem administrativa acabou afetando a logística das lojas de conveniência..."
42140-141 = "Afetou nada, isso é pura birra só porque você não fez o que ela queria."
42140-142 = "Parece até criança do fundamental... Fazer uma coisa dessas é ridículo demais."
42140-143 = "Ah, mas cortar os suprimentos do inimigo durante o acampamento é uma estratégia válida."
42140-144 = "Por mais forte que seja a determinação de alguém, ninguém consegue lutar de barriga vazia, né?"
42140-146 = "Acho que o Sensei não tá bem \"acampando\" aqui na Schale, né..."
42140-150 = "Enfim, por ora... Nós da FOX EATS...#nDigo, do Esquadrão FOX, trouxemos uma refeição simples."
42140-151 = "[ns] \"Isso é... inarizushi?\""
42140-152 = "Sim. Você já comeu o inarizushi que eu fiz antes, não foi?"
42140-153 = "Como você pareceu gostar muito... fiz com a mesma receita daquela vez."
42140-154 = "Tem bastante, então fique à vontade para comer o quanto quiser."
42140-156 = "Bom, imagino que você fique com receio de comer algo que nós trouxemos..."
42140-160 = "[ns] Comer o inarizushi."
42140-167 = "...Tá comendo na maior tranquilidade?"
42140-168 = "Quê...? Sério...?#nNossa... Você não tem nenhum senso de cautela, não...?"
42140-170 = "Hum, está tudo bem...?"
42140-171 = "[s13] \"Está ótimo, uma delícia.\"\n[s14] \"O tempero pegou super bem e o arroz está no ponto perfeito! Maravilhoso!\""
42140-174 = "Não, não foi nesse sentido que eu perguntei..."
42140-179 = "Talvez seja estranho nós perguntarmos isso, mas...#nVocê não desconfia que possa ter veneno ou algo assim?"
42140-180 = "[s] \"...Quê? Tem veneno nesse inarizushi?\""
42140-181 = "Não, não tem, mas..."
42140-185 = "Olha só, parece que você tá entendendo errado... No momento, nós somos inimigos."
42140-186 = "Como Sensei da Schale, você já sabe, né? Nós do Esquadrão FOX nos aliamos à Presidente Interina do Conselho Estudantil Geral, Kaya, para reabrir a Academia Especial SRT."
42140-187 = "Depois de você recusar a proposta da Presidente Interina Kaya, achou mesmo que nós, aliadas dela, viríamos trazer comida sem segundas intenções?"
42140-188 = "Até pra ser bonzinho demais tem limite..."
42140-189 = "Até existe aquele ditado sobre \"enviar sal ao inimigo\", mas...#nEm geral, o mais sensato é não encostar em nada que venha do lado oposto, né?"
42140-190 = "No campo de batalha, às vezes até deixam munição defeituosa de propósito pra caso o inimigo saqueie..."
42140-191 = "Na SRT também vivem ensinando que \"em território inimigo, não se deve nem beber água que você mesmo não tenha trazido\"..."
42140-192 = "[ns] \"É que eu não sou inimigo de vocês.\""
42140-196 = "[ns] \"...Sou apenas o Sensei.\""
42140-200 = "Hmm..."
42140-201 = "...Parece que você é mesmo como diziam."
42140-203 = "Mesmo que não sejam inimigos, confiar facilmente nos outros acaba saindo caro depois."
42140-204 = "Confiar rápido demais passa a impressão de imaturidade para o outro lado... o que faz você sair perdendo em negociações."
42140-205 = "Em sociedade, é preciso desconfiar dos outros desde o início...#nSe não ficar em guarda, você acaba levando a pior—"
42140-206 = "...Você também é adulto, Sensei, então sabe disso, não sabe?"
42140-207 = "[s] \"Porque se ganha muito mais confiando do que se perde desconfiando.\""
42140-209 = "...Hmph."
42140-210 = "Você não conhece o \"Dilema do Prisioneiro\", Sensei?"
42140-211 = "É uma teoria sobre qual é a escolha mais \"racional\" numa situação em que, se ambos cooperarem, ninguém sai prejudicado,#nmas se o outro te trair, você acaba pagando a pena sozinho..."
42140-212 = "Ou seja... independentemente do que o outro faça, trair sempre traz mais vantagem,#nentão a escolha é sempre trair."
42140-213 = "Na prática, nós já lidamos com muitos \"prisioneiros\" até hoje...#nE nunca houve um único que escolhesse beneficiar o outro de propósito."
42140-214 = "...A \"confiança\" de que os adultos tanto falam, no fundo, é a mesma coisa."
42140-215 = "[s15] \"Parece um papo bem complexo... mas interessante.\"\n[s16] \"...Como esperado da elite da SRT!\""
42140-218 = "Hmph, não precisa nem ser da elite pra saber o básico assim—"
42140-222 = "Não é isso...!"
42140-223 = "Caiu direitinho..."
42140-224 = "[s] \"Mas na realidade não é diferente?\""
42140-225 = "Claro, se formos trazer isso pra realidade, tem que levar várias outras variáveis em conta, né?"
42140-226 = "Tipo o impacto que o resultado dessa escolha vai ter no futuro..."
42140-227 = "...Mas, Sensei, essa história também pode acabar numa única rodada."
42140-228 = "Numa sociedade selvagem onde quem perde nunca mais volta, o mais eficaz é#n\"trair sempre para impor o medo\" — a estratégia All-Defect."
42140-230 = "...Quando tudo isso acabar, talvez nós nunca mais possamos voltar."
42140-231 = "Afinal, somos armas.#nNão vamos nem nos lembrar da escolha do Sensei."
42140-232 = "E essa escolha provavelmente não vai afetar nenhuma outra aluna."
42140-233 = "Mesmo assim, você confia em nós... nas suas alunas?"
42140-234 = "[s] \"Sim, eu confio.\""
42140-236 = "Falar é fácil—"
42140-237 = "...Calma, Kurumi."
42140-239 = "Mesmo quando ninguém consegue prometer nem o hoje,#nvocê aposta nas possibilidades do amanhã, Sensei."
42140-240 = "[ns] \"Com certeza.\""
42140-245 = "[ns17] \"Porque eu sou o Sensei.\"\n[ns18] \"Porque o meu papel é guiar as crianças que serão os adultos de amanhã.\""
42140-253 = "...Que pessoa estranha."
42140-254 = "...Realmente, faz jus aos boatos."
42140-255 = "[s] \"Além disso, vocês mesmas são a prova da força da 'confiança'.\""
42140-257 = "[ns19] \"Ouvi dizer que o Esquadrão FOX tem uma confiança enorme na líder.\"\n[ns20] \"Acho que a maior força do Esquadrão FOX está na confiança entre as integrantes.\""
42140-260 = "Na Yukino-chan, é...?"
42140-261 = "...Bom, mais ou menos."
42140-262 = "...É a líder do esquadrão, né."
42140-266 = "[ns] \"...Aconteceu alguma coisa?\""
42140-272 = "Não, nada..."
42140-273 = "Afinal, o laço do Esquadrão FOX é mais forte do que qualquer coisa."
42140-275 = "Pelo menos, com certeza não vai ser abalado por meia dúzia de palavras de um Sensei malandro como você."
42140-276 = "...Bom, somos melhores amigas desde antes de ela virar líder, né."
42140-278 = "Obrigada. Acho que já deu para entender bem o que o Sensei pensa..."
42140-283 = "Como já entregamos o bentô, acho que está na hora de irmos."
42140-284 = "Desculpe aparecer tão tarde da noite.#nE desculpe também por enchermos você de perguntas do nada..."
42140-285 = "Sei que não serve exatamente como pedido de desculpas, mas#nhá algo que queira nos perguntar?"
42140-286 = "[s21] \"Ouvi dizer que o Esquadrão RABBIT se juntou a vocês...\"\n[s22] \"Como estão as garotas do Esquadrão RABBIT?\""
42140-289 = "O Esquadrão RABBIT agora está..."
42140-290 = "A localização do esquadrão é considerada confidencial, então fica meio difícil falar..."
42140-299 = "...Se você pegar o ônibus 10 sentido Shin-Kiroo no ponto em frente à Schale, descer no ponto final e caminhar cerca de 1 km para leste ao longo do desfiladeiro seco, vai encontrar uma instalação que não consta nos mapas."
42140-300 = "Pode parecer um acampamento abandonado, mas é uma instalação militar construída antes do desaparecimento da Presidente do Conselho Estudantil Geral para treinamentos e operações das alunas da SRT."
42140-301 = "...O Esquadrão RABBIT está lá."
42140-302 = "Por favor, veja com seus próprios olhos como elas estão, Sensei [USERNAME]."
42140-304 = "Ei, Niko! Por que você contou?!"
42140-305 = "A localização do acampamento onde elas estão é informação de sigilo nível 2!"
42140-306 = "Tudo bem, só saber se elas estão bem não vai causar problema."
42140-307 = "Mas se descobrirem, provavelmente vou levar bronca... então não contem pra Yukino-chan, tá?"
42140-308 = "Sério, você não tem jeito...!"
42140-309 = "Haa... Depois não vem reclamar do que acontecer."
42140-311 = "É ordem da vice-líder, então não tem o que fazer, né?"
42140-312 = "Hehe, obrigada."
42140-313 = "Além disso, se o Sensei [USERNAME] conseguir mudar aquelas garotas, quem sabe um dia nós também..."
42140-318 = "Então, até logo..."
42140-319 = "Não, cuide-se bem — Sensei."
42140-326 = "(Depois que as integrantes do Esquadrão FOX foram embora, fiquei pensando no que fazer a partir de agora enquanto comia o resto do inarizushi)"
42140-330 = "(...Tive a impressão de que o inarizushi que a Niko trouxe estava com o tempero um pouco mais forte do que antes)"
42140-332 = "Próximo;A Justiça da SRT"
