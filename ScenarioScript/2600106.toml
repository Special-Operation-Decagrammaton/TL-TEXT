[translation]
2600106-1 = "Такая бледная, что насквозь видно"
2600106-2 = "Торговый район электроники Кивотос Hub"
2600106-4 = "Пока я выбирал новые наушники, заметил Котаму, слушающую музыку."
2600106-5 = ""
2600106-7 = ""
2600106-8 = ""
2600106-9 = "..."
2600106-10 = "[ns] «Эй, Котама.»"
2600106-11 = "... ♪"
2600106-12 = ""
2600106-14 = ""
2600106-15 = "(То же место...)"
2600106-16 = "[s] Подойти к Котаме."
2600106-17 = ""
2600106-22 = "― [log=코타마]О, Сенсей.[/log][wa:880]"
2600106-25 = "― [log=코타마]Прости...[/log][wa:460]"
2600106-26 = "― [log=코타마]Я слишком заслушалась.[/log][wa:2655]"
2600106-30 = "[ns] «Ничего страшного. Что ты слушала?»"
2600106-31 = "― [log=코타마]Это?[/log][wa:1325]"
2600106-34 = "― [log=코타마]Хи-хи. Сенсей,[/log][wa:2395]"
2600106-35 = "― [log=코타마]тебе правда так интересно?[/log][wa:2030]"
2600106-39 = "[ns] «Это, эм... шум? В кафе?»"
2600106-40 = "― [log=코타마]Это не совсем музыка.[/log][wa:1425]"
2600106-41 = "― [log=코타마]Просто... разговоры людей и сопровождающий их шум.[/log][wa:1755]"
2600106-44 = "― [log=코타마]Называется «Urban Ambiance».[/log][wa:10]"
2600106-47 = "― [log=코타마]Здесь нет ритма или мелодии...[/log][wa:850]"
2600106-48 = "― [log=코타마]Но слушать есть что. Ритм повседневных разговоров, хор толпы...[/log][wa:2385]"
2600106-51 = "― [log=코타마]Эти звуки создают не инструменты и не певцы.[/log][wa:10]"
2600106-52 = "― [log=코타마]Их создают люди, настоящие люди. Для меня это лучше любой музыкальной аранжировки.[/log][wa:3345]"
2600106-55 = "― [log=코타마]И я бы хотела[/log][wa:800]"
2600106-56 = "― [log=코타마]слушать их вечно.[/log][wa:1090]"
2600106-59 = "Остаток времени я слушал альбомы, которые рекомендовала Котама."
2600106-61 = "Ну как, Сенсей, нравится?"
2600106-62 = "[s] «Кто бы мог подумать, что в повседневных звуках тоже есть музыка?»"
2600106-63 = "Сейчас они довольно популярны. Есть множество альбомов с разными фоновыми шумами для создания определённого настроения."
2600106-64 = "Например, если хочешь лучше сосредоточиться на работе, может помочь звук дождя или шум оживлённого кафе."
2600106-65 = "[s] «А у тебя есть любимый звук?»"
2600106-66 = "Ну, дождь или звуки кафе тоже хороши, но..."
2600106-67 = ""
2600106-69 = ""
2600106-70 = "Думаю, больше всего мне нравится твой голос."
2600106-71 = "[s] «Мой голос?»"
2600106-72 = "Да. Когда я слышу твой голос, успокаиваюсь и мысли становятся яснее."
2600106-73 = "Жаль только, что нельзя купить саундтрек с твоим голосом..."
2600106-74 = ""
2600106-76 = ""
2600106-77 = ""
2600106-78 = "Так что, Сенсей, может, запишем один прямо сейчас?"
2600106-79 = "[s] «Нет.»"
2600106-80 = "Нечестно!"
2600106-82 = "После этого я всё оставшееся время мешал Котаме записать меня. Новые наушники я в итоге так и не купил."
