[translation]
10038080-1 = "Эпизод 8;Тебе, кто готов колебаться тысячу раз"
10038080-3 = ""
10038080-5 = ""
10038080-7 = ""
10038080-9 = ""
10038080-10 = "Я, Кагуя из Клуба пекинской оперы, приветствую вас, госпожа."
10038080-12 = "Да. Как вы? Справляетесь с управлением Гэнрюмоном?"
10038080-13 = "...Для меня всё это пока непривычно, но со временем, полагаю, я освоюсь."
10038080-14 = "С Пекинской оперой это мало связано, но, возможно, вы собираетесь передать эту роль кому-то другому."
10038080-15 = "Почему бы не отдать её Гэнрюмону? Очевидно, свободного времени у них хватает."
10038080-16 = "......"
10038080-17 = "Позвольте спросить вас, Кагуя. Чего вы желаете?"
10038080-18 = "Клуб пекинской оперы намерен заменить Гэнрюмон?"
10038080-19 = "Вовсе нет. Цель Клуба пекинской оперы заключена уже в самом его названии."
10038080-20 = "Именно поэтому мы идеально подходим на роль хранителей традиций Саньхайцзина."
10038080-21 = "И о каких именно традициях идёт речь?"
10038080-22 = "Ох, их куда больше, чем можно выразить простыми словами."
10038080-23 = "Тогда позвольте мне выразить их словами посерьёзнее. Говоря о традициях, вы имеете в виду наш дух, наши основополагающие принципы?"
10038080-24 = "......"
10038080-25 = "Противостоять тирании, защищать слабых, помнить добро и вынести всё ради правого дела. Разве не этой традицией мы гордимся больше всего?"
10038080-26 = "Зачем вы спрашиваете меня о том, что и так знаете...?"
10038080-27 = ""
10038080-29 = ""
10038080-31 = "Потому что... я хочу, чтобы вы доверились мне."
10038080-32 = ""
10038080-34 = ""
10038080-35 = "Что вы имеете в виду...?"
10038080-36 = "Люди сомневались в моих решениях. Вы и все, кто стоит рядом с вами, — и, уверена, ещё многие другие."
10038080-37 = "Но скажите: неужели традиции Саньхайцзина, которые вы защищаете, настолько хрупки?"
10038080-38 = "*ахает*"
10038080-39 = ""
10038080-40 = "А!"
10038080-42 = "Неужели они настолько ничтожны, что небольшая интрига нескольких посторонних способна обрушить их целиком?"
10038080-43 = "Это..."
10038080-44 = ""
10038080-46 = ""
10038080-47 = "Верьте."
10038080-48 = ""
10038080-51 = ""
10038080-52 = "В себя. А если не в себя — тогда в Саньхайцзин, в его силу, в его историю!"
10038080-53 = "Корни Саньхайцзина уходят глубоко. Их не так-то просто расшатать! И они будут уходить всё глубже!"
10038080-54 = "Госпожа...!"
10038080-55 = "И ещё один вопрос, совершенно искренний. Кто представляет большую угрозу для нашего учреждения: я или Шинтани Кай?"
10038080-56 = "Думаю... Думаю, ответ очевиден."
10038080-57 = "Тогда разве не будет правильным, если вы и Клуб пекинской оперы отойдёте в сторону и выберете другой путь?"
10038080-58 = "...Вы готовы такое позволить?"
10038080-59 = "Ах, вот это уже интересный вопрос. Хм..."
10038080-60 = "Вы отступите из принципа или из практических соображений?"
10038080-61 = "И из принципа, и из практических соображений."
10038080-62 = "Ах, тогда можно спросить, что именно вы имеете в виду?"
10038080-63 = "Если коротко: мы можем вместе остановить распространение синдрома Тайка. Кажется, мы поняли, что его вызывает."
10038080-65 = "Ах..."
10038080-66 = "Да, тогда мы все сможем вместе работать над лекарствами и профилактическими мерами."
10038080-67 = "...Вы женщина большого ума и сияющей благодати."
10038080-68 = "Вы упомянули, что есть и более длинная часть ответа?"
10038080-69 = ""
10038080-71 = ""
10038080-73 = ""
10038080-74 = "......"
10038080-75 = "Госпожа, у меня есть просьба."
10038080-76 = ""
10038080-78 = ""
10038080-79 = ""
10038080-80 = "Пожалуйста, накажите меня прямо здесь и сейчас."
10038080-81 = "[s] «Что...?!»"
10038080-83 = "...Продолжайте."
10038080-84 = "Вы должны это сделать. Чтобы восстановить свою власть как президента."
10038080-85 = "Если вы оставите меня без наказания, никто больше не будет подчиняться вашим приказам. Никто не станет вас слушать."
10038080-86 = "Так покажите свою силу и сами немедленно вынесите приговор!"
10038080-87 = "Нет. Законы существуют именно затем, чтобы силу не приходилось демонстрировать столь грубо."
10038080-88 = "Но в смутные времена законы часто дают сбой."
10038080-89 = "Если их не исполнять, они становятся лишь чернилами на бумаге, а добродетель превращается в уязвимость!"
10038080-90 = "Трагично, что мы оказались в ситуации, где приходится демонстрировать силу. Я прекрасно это понимаю."
10038080-91 = "Но мы в ней оказались. И теперь вы не должны колебаться. Ни один правитель не может себе этого позволить. Вы понимаете."
10038080-94 = "Проложите путь праведности через это осквернённое поле."
10038080-95 = "Не позволяйте злу укорениться."
10038080-96 = "Думайте о своих людях. Об их безопасности, об их жизни."
10038080-97 = ""
10038080-101 = "Узурпатор поставил их образ жизни под угрозу. Я."
10038080-104 = "Обнажите оружие, госпожа. Докажите, что у вас есть сила вести за собой."
10038080-105 = "Пусть каждый выстрел станет заявлением. ВЫ — президент. У ВАС есть власть. И ВЫ её примените — как лидер и защитница народа."
10038080-106 = ""
10038080-108 = ""
10038080-109 = "И если на этом праведном пути останется несколько стреляных гильз, они лишь покажут, как упорно вы сражались."
10038080-110 = ""
10038080-112 = ""
10038080-113 = ""
10038080-114 = "Когда-то вы пытались дать мне совет через своё представление."
10038080-115 = "Что вы думаете об этом теперь?"
10038080-117 = "...Оглядываясь назад, мне следовало тщательнее выбрать способ."
10038080-118 = "Но от самого послания я не отказываюсь."
10038080-119 = "Оно показало мою верность и путь, который я избрала."
10038080-120 = "Если бы я могла повернуть время вспять и вернуться в тот миг, я дала бы тот же совет сотню раз, провела бы тысячу лет в тюрьме и пережила бы десять тысяч исключений."
10038080-121 = ""
10038080-123 = ""
10038080-125 = ""
10038080-126 = "Вы подняли ещё один интересный вопрос."
10038080-128 = "Как я могу наказать столь преданного человека?"
10038080-129 = ""
10038080-131 = ""
10038080-132 = "......"
10038080-134 = "Я уже не та, кем была, когда давала вам тот совет. Вы должны видеть эту разницу."
10038080-135 = ""
10038080-137 = "Теперь я узурпатор, и этого уже не изменить."
10038080-138 = "Узурпаторов следует карать и выставлять на улицах в назидание всем."
10038080-141 = ""
10038080-142 = "Иначе ваши приказы не будут иметь силы, а ваши законы, какими бы благородными они ни были, не устоят."
10038080-143 = ""
10038080-145 = ""
10038080-146 = "Но вы стали узурпатором не по своей воле."
10038080-147 = "......"
10038080-148 = "Я не хотела этого говорить, но на это обязана ответить."
10038080-149 = "Тогда я выслушаю."
10038080-150 = ""
