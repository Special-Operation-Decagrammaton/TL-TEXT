10038080-154 = "Вы ведь тоже стали президентом не по собственной воле."
10038080-155 = "И всё же разве вы не несёте всю ответственность, которую возлагает эта должность?"
10038080-156 = "Именно поэтому я всегда вас уважала."
10038080-157 = "Именно поэтому всегда считала вас благословением для Саньхайцзина."
10038080-158 = "И если ради вас мне придётся умереть здесь, я умру — и сделала бы это снова и снова."
