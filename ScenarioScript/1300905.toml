[translation]
1300905-1 = "Тренировка Цубаки: практика"
1300905-2 = "Как президент Клуба внутренней дисциплины, сегодня я научу тебя, нашего советника, тому, как мы тренируемся."
1300905-3 = "Иными словами, тема сегодняшнего дня — «как засыпать удобнее и спать глубже»."
1300905-4 = "[s] «Хорошо.»"
1300905-5 = "Сенсей, не недооценивай силу сна..."
1300905-6 = "Хорошо выспаться на самом деле очень трудно!"
1300905-7 = "Смотри, в современном мире множество людей страдают бессонницей и отчаянно ищут решение."
1300905-8 = "Они идут в интернет и задают самые разные вопросы, мечтая хотя бы об одной ночи спокойного сна."
1300905-9 = "Кто-то принимает тёплую ванну, кто-то пьёт горячее какао, кто-то медитирует — список бесконечен..."
1300905-10 = "Методов миллион, но я покажу тот, который считаю самым эффективным."
1300905-11 = "Я прекрасно знаю, что из-за работы ты недосыпаешь."
1300905-12 = "[s] «Хорошо! Я доверяю тебе, президент.»"
1300905-13 = "Отлично. Тогда покажу на себе. Смотри внимательно, Сенсей."
1300905-14 = "Первое — метод дыхания даньтянь."
1300905-15 = ""
1300905-17 = "Ложишься вот так и очищаешь разум..."
1300905-18 = "Потом сосредотачиваешь внимание на животе..."
1300905-19 = "..."
1300905-20 = "..."
1300905-21 = "[s] «Эм, Цубаки?»"
1300905-22 = "Хр-р..."
1300905-23 = "[s1] «Не прошло и двадцати секунд!»\n[s2] «Цубаки, стой! Ты слишком хороша в этом!»"
1300905-29 = ""
1300905-30 = "А? Уже пора есть...?"
1300905-31 = "[s3] «Прошло всего двадцать секунд!»\n[s4] «Для меня это слишком сложно, Цубаки!»"
1300905-32 = "Хм. Правда? Тогда метод дыхания даньтянь тебе не подойдёт..."
1300905-33 = "Хм. Правда? Тогда метод дыхания даньтянь тебе не подойдёт..."
1300905-34 = "Ладно... В этот раз просто посижу и помедитирую. За этим будет легче следить."
1300905-35 = ""
1300905-36 = ""
1300905-37 = "Во время медитации нужно сидеть вот так, а не лежать. Теперь сосредоточься."
1300905-38 = "Сенсей, тебе нужно сидеть вот... так... Хр-р."
1300905-39 = "[s] «Ты уснула прямо во время объяснения?!»"
1300905-40 = "Что? И это не подходит?"
1300905-41 = "[s] «Для такого любителя, как я, это слишком сложно.»"
1300905-42 = "Нет, Сенсей. Нельзя сдаваться, даже не попробовав!"
1300905-43 = "Ладно, так даже лучше. Вместо демонстрации я буду инструктировать тебя."
1300905-44 = "Попробуй сам, Сенсей."
1300905-45 = "[s] «Сам?»"
1300905-46 = ""
1300905-47 = ""
1300905-48 = "Теперь ложись и закрой глаза вот так."
1300905-51 = "Хорошо. Вдох... выдох... Почувствуй, как грудь поднимается... и опускается..."
1300905-52 = "Медленно сосредоточь разум, Сенсей."
1300905-53 = "Ты всё сильнее расслабляешься. Сознание медленно погружается в глубины сна."
1300905-54 = "Тебе становится всё соннее и соннее..."
1300905-56 = "Под голос Цубаки я почувствовал, как начинаю отключаться."
1300905-57 = "Медленно... Медленно... Глаза закрылись..."
1300905-58 = "...Я продолжал ждать, что усну, но ничего не происходило."
1300905-59 = "[ns] «...»"
1300905-61 = "[ns] «(Это вообще работает?)»"
1300905-63 = "[ns] «(А Цубаки? Она опять уснула?)»"
1300905-65 = "Голос Цубаки больше не звучал, и я решил приоткрыть глаза."
1300905-66 = ""
1300905-67 = "(Так вот как выглядит Сенсей с закрытыми глазами... Хи-хи...)"
1300905-68 = ""
1300905-70 = "[ns] «...Цубаки?»"
1300905-71 = "Мы встретились взглядами."
1300905-72 = "О, Сенсей! Я думала, ты уснул..."
1300905-73 = "О нет..."
1300905-74 = ""
1300905-76 = "[s] «Ты в порядке? Ты упала!»"
1300905-77 = "Д-Да..."
1300905-78 = "Сенсей. Ты ведь этого не видел, да...?"
1300905-79 = "[s5] «Да. Я видела, как ты смотрел прямо на меня.»\n[s6] «А? Я ничего не видел...»"
1300905-80 = "...Пожалуй, я просто посплю здесь."
1300905-81 = "[s7] «Нет-нет, ничего не видел. Я просто пошутил!»"
1300905-82 = "Угх..."
1300905-83 = "Значит, ты ничего не видел? Правда?"
1300905-84 = "[s8] «Может, краем глаза что-то и заметил. Возможно.»"
1300905-86 = "...Хмф. Как грубо."
1300905-87 = "Ты такая заноза, Сенсей!"
1300905-89 = "Остаток дня я пытался поднять Цубаки настроение."
