[translation]
1007203-1 = "Подводная операция по добыче припасов 2"
1007203-2 = "Я встретился с Саки у того же причала, что и в прошлый раз..."
1007203-3 = ""
1007203-5 = ""
1007203-6 = "Ха. Ха-ха... Ха-ха-ха..."
1007203-7 = ""
1007203-9 = ""
1007203-10 = "А, Сенсей! Вот вы где."
1007203-11 = "[s] «Сегодня ты в хорошем настроении.»"
1007203-12 = "Ну, утром я рылась в старом сарае и нашла кое-что полезное."
1007203-13 = "Позвольте представить..."
1007203-14 = ""
1007203-16 = ""
1007203-18 = "Штурмовую мину!"
1007203-19 = "[s] «Штурмовую что?»"
1007203-20 = "О, вы впервые такую видите, Сенсей?"
1007203-21 = ""
1007203-23 = ""
1007203-24 = "Это старое противотанковое оружие. На конец этого шеста крепится взрывчатка, затем его втыкают во вражеский танк и взрывают заряд в упор."
1007203-25 = "Они простые в использовании и дешёвые в изготовлении, поэтому были популярны в эпоху Воюющих государств Хяккияко."
1007203-26 = "Как видите, чтобы использовать её, нужно подобраться вплотную к танку, так что как оружие она имеет массу недостатков..."
1007203-27 = "Но из-за конструкции, похожей на копьё, у неё есть своеобразный круг поклонников."
1007203-28 = "Почему такое редкое оружие вообще валялось в сарае рыбацкой деревни...?"
1007203-29 = "Владелец сарая сказал, что собирался её выбросить, поэтому отдал мне бесплатно. Сегодня мой счастливый день!"
1007203-30 = "[s] «Но для чего ты собираешься её использовать?»"
1007203-31 = "Сенсей, вы когда-нибудь слышали о подводной ударной палке?"
1007203-32 = "Это длинное оружие, похожее на гарпун, которым пользуются водолазы. Оно достаточно мощное, чтобы убивать акул и китов."
1007203-33 = "Принцип действия такой ударной палки в основном тот же, что и у штурмовой мины..."
1007203-34 = "[s] «Вы ведь не о том...»"
1007203-35 = "Я использую штурмовую мину, чтобы оглушить рыбу с близкого расстояния!"
1007203-36 = "В прошлый раз у самого дна я видела много рыб размером с брёвна."
1007203-37 = "Поймать такую руками было бы сложно, но немного пороха точно её оглушит!"
1007203-38 = "[s1] «Я в этом не уверен...»\n[s2] «Твой план слишком опасный.»"
1007203-41 = "Всё нормально! Нужно только подобрать са-а-амое правильное количество пороха..."
1007203-42 = "Я участвовала в бесчисленных подводных подрывных операциях. Для меня это пустяк."
1007203-43 = ""
1007203-45 = ""
1007203-46 = ""
1007203-47 = "Я скоро вернусь!"
1007203-48 = ""
1007203-50 = ""
1007203-57 = "И вскоре..."
1007203-60 = ""
1007203-62 = "*БУМ*"
1007203-63 = ""
1007203-76 = ""
1007203-77 = "[ns] «Саки! Ты в порядке?!»"
1007203-78 = "Я в порядке..."
1007203-79 = "Но рыба, за которой я охотилась..."
1007203-80 = ""
1007203-82 = ""
1007203-83 = "...была полностью уничтожена."
1007203-84 = "Есть там уже нечего..."
1007203-85 = "Что пошло не так? Расстояние я рассчитала идеально..."
1007203-86 = "[s] «Может, слишком большая мощность?»"
1007203-87 = "Наверное. Я уменьшила количество пороха, но всё-таки эта штука рассчитана пробивать танковую броню..."
1007203-88 = "Я воткнула её в рыбу, но взрыв оказался для неё слишком сильным..."
1007203-89 = "[s3] «Ты ВОТКНУЛА её в рыбу...»\n[s4] «Может, просто использовать обычный гарпун?»"
1007203-90 = ""
1007203-91 = ""
1007203-93 = ""
1007203-94 = "В смысле...!"
1007203-95 = "Ах..."
1007203-96 = "Вы... правы..."
1007203-97 = "Я бы уже столько рыбы наловила гарпуном, но так зациклилась на огневой мощи, что даже не подумала о нём..."
1007203-98 = "Как я могла быть такой дурой?"
1007203-100 = "После этого я отвёл Саки на рыбный рынок и купил ей миску сашими."
1007203-101 = "Она сказала, что не голодна, но когда закончила, в миске не осталось ни рисинки..."
