[translation]
2002602-1 = "Как строят здания"
2002602-5 = "Автобусная остановка возле D.U."
2002602-6 = "Я проработал всю ночь и утром ждал первый автобус домой."
2002602-7 = ""
2002602-10 = ""
2002602-11 = ""
2002602-12 = "К моему удивлению, несмотря на столь ранний час, на остановке ждала большая группа студентов."
2002602-13 = ""
2002602-15 = ""
2002602-16 = "[ns] «(Сегодня какое-то мероприятие?)»"
2002602-17 = "Сто лет уже не было работы. Я уже собиралась списать весь этот месяц со счетов."
2002602-18 = "Лучшего момента и не придумать. В магазине появились новые товары, на которые я засматриваюсь, а мне нужны деньги."
2002602-19 = "Надеюсь только, в этот раз работа будет не слишком тяжёлой. Терпеть не могу таскать песок и цемент."
2002602-20 = "Согласна. Может, трубы поставить или небольшую пристройку собрать... Вот было бы неплохо."
2002602-21 = ""
2002602-23 = ""
2002602-25 = "[ns] Ждать автобус."
2002602-31 = ""
2002602-32 = "Мне нужно пять человек на леса и десять на монтаж стального каркаса!"
2002602-33 = ""
2002602-36 = ""
2002602-37 = "Я! Я могу!"
2002602-38 = "О, я тоже, я тоже!"
2002602-40 = "Хорошо. Нас уже ждут на объекте, так что все в автобус!"
2002602-41 = ""
2002602-43 = ""
2002602-47 = ""
2002602-48 = ""
2002602-49 = ""
2002602-51 = ""
2002602-52 = "[ns] «П-Подождите...»"
2002602-53 = "Эй, ты! Хватит копаться!"
2002602-54 = "Ты собираешься заплатить нам, если мы из-за тебя упустим работу?"
2002602-55 = "[s1] «Но я не—»\n[s2] «Я просто хотел сесть на автобус...»"
2002602-58 = ""
2002602-60 = ""
2002602-62 = ""
2002602-65 = ""
2002602-68 = "Все внутри? Поехали!"
2002602-69 = "[ns] «Пожалуйста, подождите хоть секунду...!»"
2002602-71 = "Толпа студентов подхватила меня с собой, и мы отправились в неизвестное место."
2002602-73 = ""
2002602-74 = "Доброе утро, трудящиеся Кивотоса!"
2002602-75 = "Я Ясумори Минори из Академии Красной Зимы. Сегодня я отвечаю за руководство этой стройплощадкой!"
2002602-76 = "Для большинства из нас это первая работа за долгое время, так что покажем им, на что мы способны!"
2002602-77 = "И помните: безопасные условия и справедливая оплата — право каждого работника! Если считаете, что здесь вы этого не получили, приходите ко мне в офис прямо на объекте!"
2002602-78 = "Да!!"
2002602-79 = "Перед началом я поведу вас в скандировании."
2002602-80 = "У-у!!"
2002602-81 = "Безопасность прежде всего!"
2002602-82 = "Да! Да! Да!"
2002602-83 = "Хорошо! Всем безопасной работы!"
2002602-84 = "[ns] «Для такого раннего утра энергии у них хоть отбавляй...»"
2002602-85 = "...О?"
2002602-86 = "[USERNAME] Сенсей? Что вы здесь делаете?"
2002602-87 = "[s3] «Меня похитила толпа трудолюбивых студентов.»\n[s4] «В общем, я ждал автобус, а потом...»"
2002602-91 = "А, значит, вас унесло вместе с сегодняшними рабочими..."
2002602-92 = "Простите, что привезли вас сюда против вашей воли. Трудовая партия использует ту автобусную остановку как утреннее место сбора."
2002602-93 = "Но что теперь делать? Я не могу выделить транспорт, чтобы отвезти вас домой, а поблизости здесь нет автобусных остановок..."
2002602-94 = "[ns] «Не переживай за меня.»"
2002602-96 = "[ns] «Я всё равно давно хотел посмотреть, как работает Трудовая партия.»"
2002602-97 = "О? Тогда хотите осмотреться, раз уж вы здесь?"
2002602-98 = "Я не смогу вернуть вам потерянное время, но после рабочего дня угощу вас огромным кацудоном в заведении неподалёку."
2002602-99 = "Соус у них густой, мяса много — отличная награда после тяжёлого рабочего дня."
2002602-100 = "По-моему, рабочий день не заканчивается, пока не набьёшь желудок кацудоном или гюдоном."
2002602-101 = "А теперь, прежде чем начнём... Наденьте это."
2002602-102 = ""
2002602-104 = ""
2002602-106 = ""
2002602-107 = ""
2002602-108 = "[ns] «А это что...?»"
2002602-109 = "Каска и светоотражающий пояс. Самое важное на стройке — безопасность! И второе по важности — тоже безопасность!"
2002602-110 = "Некоторое оборудование здесь опасно даже для крепких студентов Кивотоса."
2002602-111 = "Не подходите к конструкциям, которые выглядят неустойчиво. И что бы ни случилось, смотрите под ноги!"
2002602-112 = "[s] «Понял.»"
2002602-113 = "Хорошо!"
2002602-114 = "Ну что ж... За работу!"
2002602-118 = "Сварочная бригада! Установить защитные ограждения!"
2002602-124 = "Штукатурная бригада! Сюда три мешка раствора! Хочу, чтобы все щели в фанере были заделаны!"
2002602-125 = "[s5] «Какая скорость...»\n[s6] «Вы целый этаж закончили в мгновение ока!»"
2002602-128 = "Впечатлены? Хм. По-моему, сегодня все работают даже немного медленно..."
2002602-129 = "[s] «Ты шутишь? Это здание закончат в два счёта!»"
2002602-130 = "Не будьте так уверены. Трудовой партии так трудно находить работу именно потому, что мы медленнее других бригад."
2002602-131 = "Разумеется, качество нашей работы не имеет равных во всём Кивотосе..."
2002602-132 = "И мне кажется, студенты здесь работают в хорошем темпе, поэтому я не понимаю, почему мы вечно отстаём от графика."
2002602-133 = "[s7] «Загадка...»\n[s8] «Но они же работают так быстро...»"
2002602-136 = ""
2002602-138 = ""
2002602-140 = ""
2002602-141 = "Ах, президент Минори, здравствуйте! Кажется, лично мы встречаемся впервые, верно?"
2002602-142 = "Я президент строительной компании Magma Construction. Очень приятно, искренне приятно."
2002602-143 = "А, так вы наш заказчик. Спасибо, что предоставили нам эту возможность."
2002602-144 = "О, пустяки, совершенно пустяки. Это мне следует благодарить вас за то, что приехали так срочно!"
2002602-145 = "...Что привело вас на объект? Хотите проверить нашу работу?"
2002602-146 = "Я лично ручаюсь, что мы соблюдаем все правила безопасности до последней буквы, так что вам не о чем беспокоиться."
2002602-147 = "О нет, ничего такого..."
2002602-148 = "Если совсем откровенно, дорогуша... я хотела попросить вас об одной ма-а-аленькой услуге."
2002602-149 = "Об услуге."
2002602-150 = "Видите ли — ох, как же неловко это признавать, — у меня возникли непредвиденные расходы, и сейчас мои средства не совсем доступны."
2002602-151 = "Я просто не уверена, что сегодня у меня хватит денег выплатить зарплату Трудовой партии."
2002602-152 = ""
2002602-154 = ""
2002602-155 = "О, но не волнуйтесь! Завтра я всё верну с процентами, так что если мы просто оставим это между нами—"
2002602-157 = "Внимание всем! Прекратить работу! Всё остановить!"
2002602-158 = ""
2002602-160 = ""
2002602-161 = ""
2002602-164 = "Нет оплаты — нет труда!"
2002602-165 = "Труд — это борьба за человеческое существование! Без справедливой и равной оплаты труда быть не может!"
2002602-166 = "Каждый, кто приходит ко мне и сладкими речами пытается получить бесплатную работу..."
2002602-167 = "...капиталистическая свинья, которая не понимает истинной ценности труда!"
2002602-168 = "Я-я не говорила, что не заплачу! Мне просто нужно больше времени..."
2002602-169 = "Называйте это как хотите! Трудовая партия не примет неравных условий."
2002602-170 = "Мы не будем работать ни минуты — ни секунды — без справедливой компенсации!"
2002602-171 = "Да! Да!"
2002602-172 = "Хмф... Похоже, нынче никто не хочет работать."
2002602-173 = "Ладно, будь по-вашему. На сегодня покиньте объект."
2002602-174 = "Но обещаю, завтра деньги будут. И тогда мы забудем всю эту неприятную историю и вернёмся к работе, хорошо?"
2002602-175 = "Если вы сможете платить справедливо, мы с радостью—"
2002602-176 = "Подождите. А что насчёт работы, которую мы уже сделали сегодня?"
2002602-177 = "Я же сказала, сегодня у меня вообще нет денег!"
2002602-178 = "Завтра! Всё обсудим завтра!"
2002602-179 = "Ага! Так вот как вы собирались выжать из нас бесплатный труд, буржуйка..."
2002602-180 = "Похоже, пришло время показать вам ценность нашего труда!"
2002602-181 = "Подрывная бригада! Динамит, сюда!"
2002602-182 = "Динамит?! Что вы задумали...?!"
2002602-183 = "Вы собираетесь саботировать стройку из-за небольшого недоразумения...?!"
2002602-184 = "Саботаж — какое некрасивое слово. Мы просто восстанавливаем равновесие."
2002602-185 = "Всё, что мы построили без оплаты, мы снесём!"
2002602-186 = "Стойте! Если вы всё разрушите, завтра вам придётся строить это заново!"
2002602-187 = "Подумайте, насколько это расточительно!"
2002602-188 = "У вас разве нет гордости строителей? Творцов?"
2002602-189 = "Даже капиталисты понимают, что за качественное искусство нужно платить."
2002602-190 = ""
2002602-192 = ""
2002602-194 = ""
2002602-195 = "Я спрошу в последний раз. У вас есть деньги на сегодняшнюю зарплату?"
2002602-196 = "Я же сказала! У меня буквально нет ни одной—"
2002602-197 = ""
2002602-199 = ""
2002602-202 = "Снести всё!"
2002602-203 = ""
2002602-208 = "Не-е-ет!"
2002602-209 = ""
2002602-210 = ""
2002602-211 = "Ха-ха... После сегодняшней тяжёлой работы у меня разыгрался аппетит."
2002602-212 = "Хорошо, все! Кацудон для всех. Я угощаю! Набивайте животы!"
2002602-215 = "Троекратное ура президенту!"
2002602-216 = "Мне всё равно, какая работа, лишь бы президент Минори была бригадиром!"
2002602-217 = ""
2002602-218 = "А-а-а... Но почему наши проекты всегда отстают от графика? Я правда не понимаю."
2002602-219 = ""
2002602-221 = ""
2002602-223 = "Я подумал, не ответить ли ей, но в итоге прикусил язык..."
2002602-225 = "Перед возвращением в Шале я вместе с Трудовой партией поел горячего кацудона."
