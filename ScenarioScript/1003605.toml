1003605-84 = ""
1003605-86 = ""
1003605-88 = ""
1003605-89 = "З-Здравствуйте. Как вы?"
1003605-90 = "Я могу чем-нибудь помочь? А-Ахаха..."
1003605-91 = "Х-Хината?! Что ты там делала?"
1003605-92 = "О-О, в кустах? Я... просто ухаживала за ними! Немного поливала с очень близкого расстояния."
1003605-93 = "Но что это за шум только что был?"
1003605-94 = "Н-Ничего. В любом случае, что привело вас сюда?"
1003605-95 = "Я-Я с радостью помогу, если вам что-то нужно! Только покажите дорогу.#nВообще-то давайте прямо сейчас!"
1003605-96 = "О-О. Эм, хорошо..."
