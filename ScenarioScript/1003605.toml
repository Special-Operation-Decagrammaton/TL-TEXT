[translation]
1003605-1 = "В кустах"
1003605-2 = "Внутри собора Тринити"
1003605-3 = "Я пришёл в собор Тринити, рассчитывая увидеть Хинату в хорошем настроении."
1003605-4 = "До мессы снова оставалось время, поэтому внутри не было студентов."
1003605-5 = ""
1003605-8 = "И тут я снова увидел открытую дверь с одной стороны собора."
1003605-9 = "[s1] «(У меня дежавю...)»\n[s2] Пройти через открытую дверь."
1003605-10 = ""
1003605-11 = ""
1003605-15 = "Парк за собором Тринити"
1003605-16 = "Дверь вывела наружу, в большой парк за собором."
1003605-17 = "Похоже, это была частная территория собора. Затем я заметил Хинату, ухаживавшую за деревом посреди парка."
1003605-18 = "Хм-хм-хм. ♪"
1003605-19 = "...?"
1003605-20 = "Хм? Сенсей?"
1003605-21 = "[s] «Привет»."
1003605-22 = "О-Ох. Здравствуйте..."
1003605-23 = "Эм..."
1003605-24 = "Сенсей, как вы сюда попали? Посторонним вход сюда запрещён.#nДверь всегда держат запертой..."
1003605-25 = "О нет."
1003605-26 = "Только не говорите... Кажется, я знаю, что вы сейчас скажете."
1003605-27 = "Р-Разве что вы скажете, что мне показалось. Я ведь не могла снова совершить ту же ошибку. Правда? Правда...? Хаха..."
1003605-28 = "[s3] «Боюсь, твоё предчувствие совершенно верное.»\n[s4] «Не переживай. В этот раз я закрыл дверь.»"
1003605-29 = "Я-Я так и знала! Я снова забыла закрыть дверь за собой!"
1003605-30 = "Я-Я так и знала! Я снова забыла закрыть дверь за собой!"
1003605-31 = "Ох...! Почему я постоянно это делаю?!"
1003605-32 = "[s5] «Все ошибаются.»\n[s6] «Всё нормально, Хината.»"
1003605-33 = "Я знаю, но всё же...!"
1003605-34 = "Я знаю, но всё же...!"
1003605-35 = "Значит, когда вы прошли, то закрыли дверь?"
1003605-36 = "Спасибо, Сенсей. Вы всегда за мной присматриваете."
1003605-37 = "Хотя сейчас вас здесь вообще не было бы, если бы я не ошиблась."
1003605-38 = "Что я здесь делаю? О, этот небольшой парк — одно из мест, за которыми я уже давно ухаживаю."
1003605-39 = "Можно сказать, я управляющая этого парка."
1003605-40 = "Верно. Мои обязанности управляющей не ограничиваются только тем, что находится внутри собора."
1003605-41 = "О, но вам не нужно волноваться. Теперь я лучше понимаю, что нельзя взваливать на себя слишком много работы, как раньше."
1003605-42 = "Я стала лучше просить других сестёр о помощи, когда работы больше, чем я могу выполнить сама."
1003605-43 = "И за это я должна благодарить вас, Сенсей."
1003605-44 = "Ухаживать за этим парком не очень сложно, поэтому здесь я справляюсь сама."
1003605-45 = "Возможно, прежняя я почувствовала бы себя перегруженной, но теперь всё иначе."
1003605-46 = "Ну..."
1003605-47 = ""
1003605-52 = "*ах!*"
1003605-53 = "[s7] «Пора прятаться.»\n[s8] Прыгнуть в ближайшие кусты."
