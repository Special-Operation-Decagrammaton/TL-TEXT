1003605-64 = "...но нигде её не вижу. Куда она могла уйти?"
1003605-66 = "С-Сенсей..."
1003605-67 = "Плохо дело. Я совсем не ожидала, что в такой час сюда придёт кто-то ещё."
1003605-68 = "Э-Эм..."
1003605-69 = "В этом кусте не очень много места."
1003605-70 = ""
1003605-72 = ""
1003605-73 = "Ч-что это было?"
1003605-74 = "Я не уверена..."
1003605-75 = "О нет. Кажется, нас заметили!"
1003605-76 = "[s9] «А ты зачем спряталась?»\n[s10] «Прятаться нужно было только мне.»"
1003605-77 = "Погодите. Что?"
1003605-78 = "Погодите. Что?"
1003605-79 = "Эм..."
1003605-80 = "Вы правы, да? Теперь, когда я подумала, так гораздо логичнее..."
1003605-81 = "Кажется, я что-то слышала из кустов."
1003605-82 = "О нет. Они нас найдут!"
