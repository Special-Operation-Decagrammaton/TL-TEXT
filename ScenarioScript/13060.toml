[translation]
13060-1 = "Episódio 6;O Contrato"
13060-3 = "Um contrato assinado pela Yume-senpai...?"
13060-4 = "É um contrato em que o Conselho Estudantil de Abydos compra da Nephthys#nos direitos de uso das instalações associadas à Ferrovia Transdesértica."
13060-6 = "Da Nephthys..."
13060-8 = "...Quando o poder do distrito autônomo enfraquece, naturalmente não resta outra opção senão vender os direitos, não é?"
13060-9 = "Originalmente, esta ferrovia era um projeto conjunto entre o Conselho Estudantil de Abydos e a Nephthys.#nO primeiro, como contratante original, detinha os direitos,#nmas acabou vendendo-os para a Nephthys devido a dificuldades financeiras."
13060-10 = "A antiga presidente do conselho estudantil provavelmente pretendia comprá-los de volta."
13060-11 = "Sim, e este é o contrato em questão."
13060-13 = "...P-Posso dar uma olhada nisso?"
13060-15 = "A Vendedora \"Saint Nephthys\" e a Compradora \"Conselho Estudantil de Abydos\"...#nacordam a venda dos direitos de uso das instalações da Ferrovia Transdesértica por 1 milhão de ienes...#ne a Parte Compradora compromete-se a pagar imediatamente 10 mil ienes como sinal do contrato."
13060-16 = "Após a celebração deste contrato, o saldo restante deverá ser quitado integralmente em até 2 anos..."
13060-17 = "Caso a Parte Compradora atrase o pagamento previsto neste contrato,#ndeverá pagar à Parte Vendedora multa moratória de..."
13060-18 = "...Presidente do Conselho Estudantil de Abydos, Yume Kuchinashi."
13060-19 = "..."
13060-22 = "...É a letra da Yume-senpai."
13060-23 = "Não tem como eu esquecer... isso é da senpai..."
13060-24 = "Exatamente como o senhor disse, está escrito que o Conselho Estudantil de Abydos comprará da Nephthys#nos direitos de uso das instalações da Ferrovia Transdesértica por 1 milhão de ienes."
13060-25 = "Q-Quando foi que ela fez uma coisa dessas... sem que eu soubesse..."
13060-26 = "...Eu tinha certeza de que tinha recolhido tudo o que a Yume-senpai deixou.#nAté o menor bilhete, até o menor pedacinho de papel..."
13060-27 = "Mas eu nunca nem ouvi falar de um contrato desses..."
13060-29 = "Provavelmente... como o contrato não estava concluído, ela não chegou a contar, não acha?"
13060-33 = "Afinal, o pagamento ainda não foi concluído."
13060-34 = "Isso quer dizer que o contrato ainda é válido...?"
13060-35 = "Sim. Conseguimos confirmar o pagamento do sinal,#nmas o saldo restante ainda não foi quitado."
13060-36 = "Depois disso, a própria existência do contrato acabou sendo esquecida até hoje.#nAcreditamos que não houve passagem de bastão quando o responsável deixou a empresa."
13060-37 = "E agora, enquanto organizávamos o depósito, ele foi encontrado \"por acaso\"."
13060-39 = "Por acaso...?"
13060-40 = "[s] \"Por acaso, é?\""
13060-41 = "Nn..."
13060-43 = "Para nós também, é uma situação bastante incômoda."
13060-44 = "Por causa deste contrato, quando pensávamos ter adquirido os direitos da Ferrovia Transdesértica,#nnão podemos mexer nos direitos de uso das instalações associadas porque ainda estão em processo de compra e venda."
13060-45 = "Se ao menos isso não tivesse sido encontrado..."
13060-47 = "E-E então...?"
13060-48 = "Portanto, gostaríamos que vocês confirmassem se \"têm a intenção de manter este contrato\"."
13060-49 = "...Hã.#nVocês vieram até aqui só para perguntar isso...?"
13060-51 = "Para nós, trata-se de uma questão extremamente importante."
13060-52 = "Se conseguirmos resolver este assunto, poderemos reivindicar nossa participação na Ferrovia Transdesértica na assembleia geral dos credores, que acontecerá daqui a dois dias."
13060-53 = "Assembleia geral... dos credores?"
13060-54 = "Com certeza é só uma reunião de cobradores de dívidas, né?"
13060-55 = "Que maneira peculiar de colocar.#nTrata-se de uma reunião dos investidores que aplicaram no fundo privado."
13060-56 = "Permita-me perguntar novamente, Hoshino Takanashi-san.#nVocê tem a intenção de pagar o saldo restante e adquirir esses direitos?"
13060-58 = "..."
13060-59 = "Olha, mesmo que você me diga isso assim tão de repente..."
13060-60 = "Mesmo que a gente comprasse esses direitos agora..."
13060-61 = "Além disso, aumentar nossa dívida de propósito..."
13060-62 = "Sim, sim.#nNão vale a pena pagar 1 milhão por direitos como esses, não é mesmo?"
13060-63 = "Vocês já devem estar tendo trabalho o suficiente só para pagar a dívida que já têm."
13060-64 = "Então, podemos considerar este contrato cancelado, certo?"
13060-66 = "Hoshino-san, assine aqui, por favor."
13060-67 = "E-Espera um pouquinho, tá?#nSe você me apressar tanto assim, o velhote aqui fica sem jeito."
13060-69 = "[ns] \"Poderia nos dar um pouco de tempo para pensar?\""
13060-71 = "Hm?"
13060-72 = "[s1] \"Foi tudo muito repentino para essas garotas.\"\n[s2] \"...Ou será que há algum motivo para querer que ela assine agora mesmo?\""
13060-75 = "Hmm..."
13060-76 = "Então é assim..."
13060-77 = "Afinal, não nos precipitamos um pouco demais...?"
13060-78 = "Vamos manter a calma.#nDe qualquer forma, o contrato perderá a validade em dois dias."
13060-80 = "Em dois dias...?"
13060-85 = "Por favor, olhem a data.#nO contrato foi firmado há quase dois anos, exatamente daqui a dois dias.#nQuando essa data chegar, o contrato será automaticamente invalidado."
13060-86 = "Gostaríamos de ter resolvido esta questão o quanto antes, mas..."
13060-87 = "...Não tem jeito."
13060-88 = "A assembleia geral acontecerá ao meio-dia de depois de amanhã, no antigo prédio da Estação Central de Abydos."
13060-89 = "Se decidirem que desejam manter este contrato,#npor favor, compareçam ao local."
13060-90 = "— Isto é, se conseguirem."
13060-91 = "...?"
13060-95 = "Como assim, se conseguirmos...?"
13060-96 = "..."
13060-98 = "Se se atrasarem nem que seja um instante, o contrato será invalidado naquele exato momento."
13060-99 = "Isso é tudo o que tínhamos a informar."
13060-100 = "Perguntas... parece que não há nenhuma."
13060-101 = "Bem, vamos indo então."
13060-110 = "...?"
13060-111 = "O que está fazendo, Supervisora?#nGuie-nos na saída."
13060-112 = "...Com licença."
13060-117 = "Hmm..."
13060-118 = "..."
13060-119 = "Bem, resumindo a história..."
13060-121 = "Não, não, não!#nNem precisa resumir, isso é suspeito demais!"
13060-122 = "Serika-chan...?!"
13060-123 = "Do nada aparecem cobradores de dívidas querendo que a gente decida o que fazer com um contrato antigo!"
13060-124 = "Um contrato esquecido, sobre os direitos de uso de instalações que ninguém quer...#nE ainda por cima vêm nos procurar agora por um contrato que vence automaticamente em dois dias..."
13060-125 = "Com certeza tem coisa por trás disso!"
13060-129 = "...Shiroko-senpai, que olhar é esse?"
13060-130 = "Não, eu concordo.#nSe até a Serika achou suspeito, com certeza tem alguma coisa aí."
13060-131 = "Pois é... ei, espera aí, não gostei muito desse jeito de falar não."
13060-132 = "[s] \"Que tal pesquisarmos primeiro sobre a Ferrovia Transdesértica?\""
13060-133 = "...Sim, eu também estou curiosa.#nQue tipo de segredo estará escondido naquele projeto fracassado..."
13060-134 = "[s3] \"É melhor lidarmos com isso com cautela.\"\n[s4] \"Ainda temos tempo.\""
13060-135 = "...Hoshino-senpai."
13060-136 = "...Hoshino-senpai."
13060-137 = "Tenho a impressão de que a chave para este problema está na presidente do conselho estudantil de dois anos atrás...#nYume Kuchinashi-san."
13060-141 = "Mas nós... não sabemos o que aconteceu em Abydos naquela época."
13060-142 = "A-Ayane-chan...?"
13060-143 = "...Hoshino-senpai, você poderia nos contar?#nSobre o \"Conselho Estudantil de Abydos\"."
13060-144 = "Nonomi-senpai, você também sabe de alguma coisa, não sabe?"
13060-146 = "B-Bem, isso é..."
13060-148 = "...Esta sala nunca foi originalmente a sala do conselho estudantil, não é?#nDeveria ser a sala da comissão do festival escolar."
13060-149 = "...A única sala no primeiro andar que, por algum motivo, está sempre trancada."
13060-150 = "Aquela é a verdadeira sala do conselho estudantil, não é?#nPor que está trancada...?"
13060-151 = "Nn, eu também quero saber.#nPor que a antiga presidente do conselho estudantil assinou um contrato que só aumentaria a dívida?"
13060-152 = "Hã?#nA Shiroko-senpai também não sabe?"
13060-153 = "Nn... nunca me contaram os detalhes."
13060-154 = "É mesmo, a Shiroko-senpai foi capturada pelas veteranas depois, né?"
13060-155 = "Eu não fui capturada..."
13060-157 = "E-Esperem um pouco.#nA Hoshino-senpai está sem jeito..."
13060-158 = "...Tudo bem, Nonomi-chan."
13060-162 = "A presidente do conselho... a Yume-senpai vivia causando todo tipo de problema..."
13060-163 = "...Resumindo, ela era o tipo de pessoa fácil de enganar.#nPor isso, estava sempre se metendo em encrenca."
13060-164 = "É-É mesmo...?#nQue milagre essa veterana ter conseguido se formar, hein."
13060-165 = "...Ela não conseguiu se formar."
13060-170 = "— Porque a Yume-senpai desapareceu antes da formatura."
13060-171 = "...!!"
13060-172 = "Desapareceu...?"
13060-176 = "D-Desapareceu?!#nComo assim?!"
13060-178 = "Ela sumiu de repente... e 33 dias depois, foi encontrada no Deserto de Abydos."
13060-179 = "Com o halo destruído..."
13060-180 = "Isso é..."
13060-181 = "O que aconteceu?!"
13060-182 = "...Parece que foi um \"acidente\".#nEla se perdeu no deserto e..."
13060-183 = "Como assim acidente?! O que isso quer dizer?!"
13060-184 = "...Eu também não sei os detalhes."
13060-185 = "Hã?!"
13060-186 = "Por quê?#nVocê era a vice-presidente do conselho estudantil, não era?"
13060-187 = "É que..."
13060-188 = "...Desde três dias antes de a Yume-senpai desaparecer, eu já não sabia do paradeiro dela."
13060-189 = "Eu só fiquei sabendo que ela tinha desaparecido bem depois."
13060-190 = "Por que ela se perdeu no deserto..."
13060-191 = "Pra começo de conversa, por que ela foi para o deserto..."
13060-192 = "O que ela estava pensando..."
13060-193 = "Por mais que eu seguisse os rastros dela...#nno fim, eu nunca descobri."
13060-194 = "Com certeza, devia estar escrito naquela caderneta."
13060-195 = "Caderneta...?"
13060-196 = "Sempre que acontecia alguma coisa, a Yume-senpai anotava tudo na caderneta dela."
13060-202 = "...Nunca pensei que, só agora, encontraria um lado da senpai que eu não conhecia."
13060-203 = "E não é só uma ou duas coisas que estão estranhas.#nO fato de o contrato estar pela metade é uma delas."
13060-204 = "Já se passaram dois anos desde que o contrato foi assinado, por que só agora..."
13060-205 = "......"
13060-206 = "......Ah."
13060-207 = "...?"
13060-208 = "Essa data..."
13060-209 = "H-Hoshino-senpai...?!"
13060-211 = "Obrigada por tudo de sempre, Hoshino-chan!!#nCuide-se bem!"
13060-221 = "H-Hoshino-senpai?!"
13060-222 = "V-Você está bem?"
13060-226 = "O dia em que o contrato foi assinado..."
13060-227 = "Esse..."
13060-228 = "É o dia em que a Yume-senpai — desapareceu."
13060-229 = "...!!"
13060-235 = "Como se um monte de gente fosse voltar a se reunir bem no meio desse deserto?!#nJá chega desses seus sonhos impossíveis!"
13060-239 = "Eu não preciso disso!#nSe quiser fazer, faça sozinha, senpai!"
13060-243 = "Não aguento mais acompanhar você nisso!#nO conselho estudantil acabou!"
13060-254 = "[ns] \"Hoshino?!\""
13060-255 = "H-Hoshino-senpai!#nAonde você vai?!"
13060-256 = "Eu vou atrás dela!"
13060-265 = "Shiroko-chan...!"
13060-266 = "O-O que a gente faz?#nSerá que devemos ir atrás também..."
13060-267 = "Mas a única que consegue alcançar a Hoshino-senpai é a Shiroko-senpai..."
13060-268 = "B-Bem, isso é verdade, mas..."
13060-269 = "Quer dizer... se o dia em que a presidente Yume desapareceu é a mesma data do documento..."
13060-270 = "...Provavelmente, sim."
13060-275 = "A presidente Yume, logo depois de assinar este contrato..."
13060-277 = "...Desapareceu?"
13060-283 = "Próximo;O Limite do Corpo"
