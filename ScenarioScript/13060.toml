[translation]
13060-1 = "Эпизод 6;Договор купли-продажи"
13060-3 = "Что ты имеешь в виду? Составленный... Юмэ?"
13060-4 = "Да. Здесь говорится, что студсовет Абидоса приобрёл у Нефтис права на использование некоторых объектов, созданных в рамках проекта Транс-пустынной железной дороги."
13060-6 = "У Нефтис...?"
13060-8 = "...Когда район рушится, подобные контракты продают направо и налево."
13060-9 = "Транс-пустынная железная дорога была совместным проектом студсовета Абидоса и Нефтис. Но формально права принадлежали студсовету, который изначально и заказал проект."
13060-10 = "Студсовет продал эти права Нефтис, чтобы расплатиться с долгами, а позже прежний председатель, Кучинаши Юмэ, попыталась выкупить права обратно."
13060-11 = "...Это, по сути, и есть содержание договора."
13060-13 = "Д-Дай сюда."
13060-15 = "Договор купли-продажи... Студсовет Абидоса соглашается приобрести у Нефтис права на... объекты Транс-пустынной железной дороги... за один миллион йен... при подписании договора покупатель уплачивает договорный сбор в размере десяти тысяч йен..."
13060-16 = "Покупатель обязуется выплатить продавцу оставшуюся сумму в течение двухлетнего срока, установленного настоящим договором..."
13060-17 = "Компенсация за просрочку выплаты остатка составит..."
13060-18 = "Подпись... Председатель студсовета Абидоса... Кучинаши Юмэ..."
13060-19 = "..."
13060-20 = ""
13060-22 = "...Мм."
13060-23 = "Это почерк Юмэ. Я узнаю его где угодно."
13060-24 = "Именно. В договоре указано, что студсовет Абидоса приобрёл у Нефтис объекты Транс-пустынной железной дороги за один миллион йен."
13060-25 = "Когда она это сделала? И я ничего не знала?"
13060-26 = "Я перечитала каждый клочок бумаги, оставшийся после Юмэ. Каждый лист, каждую записку, каждый выброшенный черновик... Всё."
13060-27 = "Но об этом договоре я никогда не слышала... Я бы ещё поняла, будь он от более старого студсовета, но я не могла пропустить след Юмэ..."
13060-29 = "Вероятно, потому что договор ещё не завершён."
13060-30 = ""
13060-32 = ""
13060-33 = "Это договор с ограниченным сроком, а оговорённая сумма до сих пор не выплачена."
13060-34 = "То есть договор всё ещё действует?"
13060-35 = "Да. Именно так. Договор подписан и нотариально заверен, но сама оплата спустя два года так и не поступила."
13060-36 = "Никто не считал этот договор особенно важным, особенно после того, как сотрудник, занимавшийся им, покинул компанию."
13060-37 = "Поэтому он оказался забыт в хранилище, пока его... случайно не обнаружили."
13060-39 = "Случайно..."
13060-40 = "[s] «Случайно...»"
13060-41 = "Мм."
13060-43 = "Это создало для нас серьёзную проблему. Было бы лучше, если бы этот договор так и остался погребённым."
13060-44 = "Один этот лист бумаги не позволяет нам получить все права на Транс-пустынную железную дорогу, поскольку связанные объекты не могли войти в нашу покупку."
13060-45 = "Права на эти объекты сейчас принадлежат студсовету Абидоса."
13060-47 = "И значит...?"
13060-48 = "Итак, как вы намерены действовать? Собираетесь выполнить свою часть договора?"
13060-49 = "Что, простите? Вы проделали весь этот путь только чтобы спросить нас об этом?"
13060-51 = "Это довольно важный вопрос."
13060-52 = "Через два дня состоится общее собрание кредиторов, где будут обсуждаться доли проекта, но мы не можем двигаться дальше, пока этот вопрос не решён."
13060-53 = "Общее собрание кредиторов...?"
13060-54 = "В смысле большое собрание всех кредиторов?"
13060-55 = "Верно. Все инвесторы фонда прямых инвестиций соберутся, чтобы обсудить дальнейшие планы."
13060-56 = "Итак, Хошино. Как представитель студсовета Абидоса, намерены ли вы выплатить Нефтис оставшуюся сумму, указанную в договоре?"
13060-58 = "..."
13060-59 = "Всё это слишком внезапно. Вы врываетесь сюда и требуете выполнить договор, о котором мы даже не знали..."
13060-60 = "К тому же покупка подобных прав..."
13060-61 = "Вы сказали, остаток — миллион йен? Мы и так по уши в долгах."
13060-62 = "Прекрасно, именно это мы и хотели услышать! Кто в здравом уме заплатит миллион йен за кучку заброшенного металлолома?"
13060-63 = "Насколько я понимаю, вы, дети, и так едва справляетесь с текущими выплатами. Было бы неразумно копать яму ещё глубже, не так ли?"
13060-64 = "Сочту это подтверждением, что вы больше не заинтересованы выполнять свою часть договора!"
13060-66 = "Тогда почему бы вам просто не подписать вот здесь отказ, Хошино? Маленькая бумажка, подтверждающая, что вы передаёте все имеющиеся права фонду прямых инвестиций."
13060-67 = "П-Погодите секунду... Я теперь не очень люблю подписывать случайные договоры..."
13060-69 = "[ns] «Перестаньте давить на моих студентов.»"
13060-70 = ""
13060-71 = "Хм?"
13060-72 = "[s1] «Любой договор нужно тщательно изучить до подписания.»\n[s2] «Не возражаете дать нам время всё проверить?»"
13060-75 = "Хм..."
13060-76 = "Для нас это проблема..."
13060-77 = "Мы поторопились...?"
13060-78 = "Независимо от вашего решения сейчас, срок этого договора истекает через два дня."
13060-80 = "Всего через два дня...?"
13060-81 = ""
13060-83 = ""
13060-85 = "Через два дня исполнится ровно два года с момента подписания. Можете сами проверить дату. Как только эти два дня закончатся, всё — договор прекратит действие."
13060-86 = "Именно поэтому общее собрание кредиторов назначено ровно через два дня. Мы хотели разобраться заранее, но... можем подождать."
13060-87 = "Скажу предельно ясно."
13060-88 = "Через два дня в районном офисе Центральной станции Абидоса состоится общее собрание кредиторов фонда."
13060-89 = "Если хотите сохранить договор в силе, вам нужно явиться на собрание до полудня, заявить о намерении исполнить его и нотариально всё заверить."
13060-90 = "Если сможете, конечно."
13060-91 = "...?"
13060-92 = ""
13060-94 = ""
13060-95 = "Если... сможем...?"
13060-96 = "..."
13060-98 = "Два дня, районный офис, полдень. Не забудьте. Опоздаете хоть на миллисекунду — договор ничтожен."
13060-99 = "Это всё, что мы пришли сообщить. Спасибо за уделённое время."
13060-100 = "В таком случае..."
13060-101 = "Пойдёмте."
13060-102 = ""
13060-104 = ""
13060-106 = ""
13060-107 = ""
13060-108 = ""
13060-109 = ""
13060-110 = "...?"
13060-111 = "Эй, надзиратель Хайлендер! Ты разве не наш сопровождающий?"
13060-112 = "...Ну что же."
13060-113 = ""
13060-115 = ""
13060-117 = "Эм..."
13060-118 = "..."
13060-119 = "Эм... То есть..."
13060-121 = "Да пошли они! Хватит! Я не собираюсь слушать этих мошенников!"
13060-122 = "Сэрика...?!"
13060-123 = "Они думают, можно размахивать красивыми бумажками и требовать от нас все эти деньги?"
13060-124 = "Кем они себя возомнили? Королевской семьёй из-за какой-то груды заброшенного железа!"
13060-125 = "Погодите, точно! Почему они так носятся с кучей хлама? Что они скрывают?!"
13060-126 = ""
13060-128 = ""
13060-129 = "Н-Не смотри на меня так, Широко... Ты сейчас слишком мной гордишься..."
13060-130 = "Я согласна со всем, что она сказала. И если даже Сэрика заметила их подозрительные намерения, значит, там точно что-то есть."
13060-131 = "Эй! Я не НАСТОЛЬКО доверчивая!"
13060-132 = "[s] «Она права. Первый шаг — понять, какой секрет они скрывают.»"
13060-133 = "Да, я тоже так думаю. Что погребено под этим провальным проектом..."
13060-134 = "[s3] «С договорами нужно действовать осторожно.»\n[s4] «У нас есть время продумать план.»"
13060-135 = "...Понятно."
13060-136 = "...Понятно."
13060-137 = "Хошино... В центре всего этого стоит прежний председатель студсовета, Кучинаши Юмэ."
13060-138 = ""
13060-140 = ""
13060-141 = "Мы понимаем, что тема болезненная, поэтому никогда её не поднимали. Но нам нужна полная картина. Так что... что произошло, когда вы с Юмэ вместе состояли в студсовете?"
13060-142 = "А-Аяне...?"
13060-143 = "Пожалуйста, Хошино. Нам нужно знать, что произошло со студсоветом Абидоса. Не думаю, что мы сможем решить эту проблему без этого."
13060-144 = "Ты ведь тоже знаешь, правда, Нономи?"
13060-146 = "Э-Это..."
13060-148 = "Я всегда задавалась вопросом, почему Комитет по выплате долга работает из Штаба школьного фестиваля, а не из комнаты студсовета."
13060-149 = "И ещё этот запертый класс на первом этаже. Зачем опечатывать класс в заброшенном здании?"
13060-150 = "Это и есть старая комната студсовета, верно, Хошино?"
13060-151 = "У меня тоже есть вопросы. Зачем прежний председатель подписала договор, который ещё сильнее вгонял школу в долги?"
13060-152 = "А? Я думала, хотя бы Широко всё это знает."
13060-153 = "Я никогда не давила на неё, требуя подробностей."
13060-154 = "Ну... Широко же буквально подобрали на улице..."
13060-155 = "Это... Всё было совсем не так."
13060-157 = "Погодите, все. Не нужно так давить на Хошино. Когда она будет готова—"
13060-158 = "Спасибо, Нономи. Но всё нормально."
13060-159 = ""
13060-161 = ""
13060-162 = "Наша прежняя председательница студсовета... Если честно, она была ходячим предупреждающим знаком."
13060-163 = "Она была... такой наивной. Постоянно бросалась в неприятности и позволяла всем вокруг собой пользоваться."
13060-164 = "И при этом каким-то образом умудрилась выпуститься?!"
13060-165 = "...Нет. Не выпустилась."
13060-166 = ""
13060-168 = ""
13060-170 = "...Юмэ пропала прежде, чем успела окончить школу."
13060-171 = "...!!"
13060-172 = "Пропала...?"
13060-173 = ""
13060-175 = ""
13060-176 = "Она пропала?! Как вообще такое возможно??"
13060-178 = "Кто знает. Она исчезла, а... через тридцать три дня её нашли в Пустыне Абидос."
13060-179 = "Её нашли с разрушенным нимбом."
13060-180 = "Её нимб...?"
13060-181 = "К-Как?!"
13060-182 = "Наверное, несчастный случай. Думаю, она заблудилась в пустыне."
13060-183 = "Наверное?! Но как? Что с ней произошло?"
13060-184 = "...Не знаю."
13060-185 = "Что?!"
13060-186 = "Ты ведь тогда была вице-президентом?"
13060-187 = "Это... Ну..."
13060-188 = "Потому что... я ушла за три дня до исчезновения Юмэ."
13060-189 = "Поэтому я не могу сказать, что происходило в течение шестидесяти часов перед её исчезновением."
13060-190 = "Я узнала, что она пропала, только позже... Но зачем она пошла так глубоко в пустыню? Почему заблудилась? Я не знаю."
13060-191 = "Что она делала? Что могло произойти?"
13060-192 = "Что... Что она думала?"
13060-193 = "Я очень долго искала ответы на эти вопросы. Перерыла каждый оставшийся в этом мире след Юмэ в поисках хоть какой-то зацепки. Но ничего."
13060-194 = "А я была уверена, что всё будет записано в этой чёртовой тетради. Ха."
13060-195 = "Какой тетради?"
13060-196 = "У Юмэ была глупенькая маленькая тетрадь, куда она записывала вообще всё. Даже самые незначительные вещи."
13060-197 = ""
13060-199 = ""
13060-200 = ""
13060-202 = "И после всех тех поисков вдруг найти вот такой её след..."
13060-203 = "Подозрительно до жути, правда? Почему договор вообще бросили на полпути?"
13060-204 = "И он внезапно появляется спустя два года после подписания? Судя по дате здесь, в этот момент Юмэ уже..."
13060-205 = "..."
13060-206 = "...Ах."
13060-207 = "?!"
13060-208 = "Дата... Это..."
13060-209 = "Х-Хошино...?!"
13060-211 = "Как всегда, спасибо, Хошино! Береги себя, хорошо?"
13060-212 = ""
13060-220 = ""
13060-221 = "Хошино?!"
13060-222 = "Т-Ты в порядке? Вот, сядь!"
13060-223 = ""
13060-225 = ""
13060-226 = "Эта дата... Дата на договоре..."
13060-227 = "Эта дата..."
13060-228 = "Это точная дата исчезновения Юмэ."
13060-229 = "...!!"
13060-230 = ""
13060-232 = ""
13060-235 = "Кому вообще захочется ехать в какую-то дыру посреди пустыни?! Хоть раз в жизни перестань мечтать!"
13060-236 = ""
13060-239 = "Знаешь что, да делай что хочешь! Мне это не нужно! Мне ничего не нужно!"
13060-240 = ""
13060-243 = "К чёрту эту игру в студсовет! Я больше не собираюсь играть с тобой в семью!"
13060-244 = ""
13060-254 = "[ns] «Хошино?!»"
13060-255 = "Стой, Хошино! Вернись!"
13060-256 = "Я пойду за ней."
13060-257 = ""
13060-259 = ""
13060-265 = "Широко! Подожди!"
13060-266 = "Ух! Почему они такие? Нам тоже идти?"
13060-267 = "...Всё нормально. Всё равно кроме Широко никто не сможет угнаться за Хошино."
13060-268 = "Наверное, но всё же..."
13060-269 = "Аяне, если договор был составлен в день исчезновения Юме..."
13060-270 = "Это может означать только одно..."
13060-271 = ""
13060-273 = ""
13060-275 = "Да. Исчезновение председателя Юмэ и этот договор..."
13060-277 = "Могут быть связаны..."
13060-278 = ""
13060-281 = ""
13060-283 = "Следующий эпизод;Пределы тела"
