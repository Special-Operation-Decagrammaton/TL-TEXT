[translation]
3502-1 = "Подарок и подарок"
3502-3 = "Ух... Жарко..."
3502-4 = "Но Моримори... Здесь же есть Моримори..."
3502-5 = "Сегодня после обеда у нас десерт Моримори..."
3502-6 = ""
3502-10 = ""
3502-11 = "...Хм? А...?"
3502-12 = "...Главный префект?!"
3502-13 = "...Хм?"
3502-14 = "А, я всё гадала, кто тут бормочет. Что ты здесь делаешь, Мэгу?"
3502-15 = ""
3502-17 = ""
3502-18 = "...Что-то связанное с горячими источниками?"
3502-19 = "А? О, нет, не сейчас. Я просто пришла купить Моримори на десерт!"
3502-20 = "Моримори...?"
3502-21 = "А, точно, в магазине есть мороженое с таким названием."
3502-22 = "Значит, сегодня ты не роешь поблизости горячие источники?"
3502-23 = "Эм, ну..."
3502-24 = "...А! Погоди!"
3502-25 = "Президент Касуми сказала мне, что говорить, когда встречу Префектурную команду или кого-то из Валькирия. А ты главный префект, значит..."
3502-26 = "...Что ты делаешь?"
3502-27 = "Ну... Эм... Дай мне минутку вспомнить..."
3502-28 = ""
3502-30 = ""
3502-31 = "...Уже вспомнила?"
3502-32 = "...Ага!"
3502-33 = "Да! Вспомнила. Сначала я отдаю тебе это..."
3502-34 = ""
3502-36 = ""
3502-37 = ""
3502-38 = "...Эм... О, вот оно! Та-дам! Держи!"
3502-39 = ""
3502-41 = ""
3502-42 = ""
3502-43 = ""
3502-44 = "А теперь... Кхм!"
3502-45 = "«Спасибо за ваш тяжёлый труд. Это мелочь, но небольшой знак нашей благодарности. Пожалуйста, и дальше хорошо о нас заботьтесь»."
3502-46 = "..."
3502-47 = "......"
3502-48 = "И... всё!"
3502-49 = "Это всё, что мне нужно было сделать. Эй, а почему ты спросила, не рою ли я горячие источники?"
3502-50 = "Президент пока не говорила мне этого делать, но уверена, скажет, когда придёт время!"
3502-51 = "Понятно... Значит, это..."
3502-52 = ""
3502-54 = ""
3502-55 = "*вздыхает*"
3502-56 = "...Мэгу?"
3502-57 = "То, что Касуми велела тебе сделать... Ты уже делала это с кем-нибудь ещё?"
3502-58 = "...А? Нет, ещё нет."
3502-59 = "Ты первая. А почему спрашиваешь?"
3502-60 = "Хорошо. Хотя бы это радует."
3502-61 = "Тогда у меня одна просьба. Пожалуйста, выслушай меня."
3502-62 = "Просьба? ...Какая?"
3502-63 = "Ну да, конечно, я слушаю. Говори!"
3502-64 = "Спасибо. Тогда..."
3502-65 = "Передай Касуми это сообщение слово в слово."
3502-66 = ""
3502-68 = ""
3502-70 = ""
3502-71 = "*ахает*"
3502-72 = "Ты только что разорвала подарок...!"
3502-73 = "Касуми поймёт. Объяснение ей не понадобится. Но если уж выразить словами..."
3502-74 = "Скажи ей: «Если узнаю, что ты снова занимаешься чем-то подобным, разберусь с этим лично»."
3502-75 = "«Я предупреждаю. Избавься от старых привычек, пока находишься в Геенна»."
3502-76 = ""
3502-78 = "...Это всё. Запомнила?"
3502-79 = "Эм... Что? Ладно, значит, я дала тебе подарок, потом ты испортила подарок... а теперь я должна сказать президенту, что ты испортила подарок..."
3502-80 = "Эм-м, я не очень понимаю..."
3502-81 = "Но ладно. Вы с президентом обе умные, так что наверняка есть веская причина. Конечно, я передам!"
3502-82 = "Хи-хи. Спасибо."
3502-83 = "...О, вообще-то...!"
3502-84 = "Главный префект!! Подожди здесь!! Я сейчас быстро вернусь!"
3502-85 = ""
3502-87 = ""
3502-88 = ""
3502-89 = "...Ладно, я вернулась!"
3502-90 = "Долго ждала, да? Вот, держи!"
3502-91 = ""
3502-93 = ""
3502-94 = ""
3502-95 = "Это... мороженое?"
3502-96 = "...Моримори? Ты отдаёшь его мне?"
3502-97 = "Ага! Я хотела купить много и поделиться со всеми. Так что тебе тоже одно положено!"
3502-98 = "Сегодня жарко. Моримори отлично охлаждает!"
3502-99 = "...Ой, погоди."
3502-100 = "Ты ведь не хочешь подарков от нас, да? Ты же прошлый раз разорвала..."
3502-101 = "Прости-прости! Просто купила по привычке, понимаешь."
3502-102 = ""
3502-104 = ""
3502-105 = "...Нет, всё нормально."
3502-106 = "Спасибо, Мэгу. Обязательно съем с удовольствием."
3502-107 = "...А? Всё нормально? А чем это отличается...?"
3502-108 = "О, уверена, Касуми всё объяснит, если спросишь её."
3502-109 = "..."
3502-110 = "...Мэгу?"
3502-111 = "А? Я?"
3502-112 = "Ты же третьекурсница, верно? Похоже, ты близка с Касуми..."
3502-113 = "Я знаю, что раньше существовала прежняя версия Отдела горячих источников. Хотя тогда в нём было всего около десяти человек..."
3502-114 = "Ты ведь тогда была президентом? А Касуми пришла позже."
3502-115 = "А? О, точно! После того как пришла президент Касуми, она сказала, что займёт должность президента, и я передала её ей."
3502-116 = "Ого! Ты и правда всё знаешь, главный префект!"
3502-117 = "О, я бы так не сказала..."
3502-118 = "Хм..."
3502-119 = "Меня интересует вот что: это Касуми сама предложила? Она сказала: «Я займу твоё место президента»?"
3502-120 = "Ага."
3502-121 = "...Хорошо, тогда понятно."
3502-122 = "...Хотя, может, не совсем так."
3502-123 = "А?"
3502-124 = "Вообще-то она спросила: «Чего ты хочешь?» Я ответила: «Я просто хочу и дальше рыть горячие источники!»"
3502-125 = "А она сказала: «Тогда я сделаю так, чтобы ты могла этим заниматься»."
3502-126 = "Так что теперь я могу просто рыть горячие источники, и у меня есть куча новых людей, которые помогают!"
3502-127 = ""
3502-129 = ""
3502-130 = "...Понятно."
3502-131 = "Я примерно так и думала. Люди с... её прошлым хотя бы склонны держать слово."
3502-132 = ""
3502-134 = "...А? Что ты имеешь в виду?"
3502-135 = "Ничего. Просто увидела другую сторону этой истории."
3502-136 = "Теперь мне нужно закончить одно дело, так что пора идти. Береги себя в такую жару, Мэгу. А насчёт Касуми..."
3502-137 = "...Передай ей ещё кое-что. Скажи: «Не создавай слишком много проблем»."
3502-138 = "Хорошо! Пока, главный префект!"
3502-139 = ""
3502-141 = ""
3502-142 = "Мне тоже пора идти."
3502-144 = "...Вот так всё и было!"
3502-145 = "И главный префект просила передать тебе..."
3502-146 = "«Если узнаю, что ты снова занимаешься чем-то подобным, разберусь с этим лично»."
3502-147 = "«Я предупреждаю. Избавься от старых привычек, пока находишься в Геенна»."
3502-148 = ""
3502-151 = "Ииииик!!"
3502-152 = "Подарок и подарок"
