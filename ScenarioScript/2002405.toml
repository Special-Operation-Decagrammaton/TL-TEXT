[translation]
2002405-1 = "Насыщенный вкус чёрного чая"
2002405-2 = "Добрый день, Сенсей."
2002405-3 = "Рада сообщить, что наконец прибыли новые чайные листья, которых мы ждали."
2002405-4 = "С этим брендом меня познакомили ученики, недавно побывавшие на чаепитии. Они принесли листья, которые, по их словам, остались после приготовления комбучи. Я попробовала — вкус оказался весьма хорош!"
2002405-5 = "Мои обычные запасы чайных листьев закончились, поэтому ради разнообразия я заказала чёрный чай этого бренда."
2002405-6 = "[s] «Не могу дождаться, когда попробую!»"
2002405-7 = "Свежий вкус бергамота должен сделать его немного более освежающим, чем традиционный чёрный чай."
2002405-8 = "Я не была уверена, что лучше подать к нему, поэтому приготовила несколько разных лёгких закусок."
2002405-9 = "[s] «...Какой большой выбор.»"
2002405-10 = "Это чаепитие должно послужить извинением за моё прежнее поведение. Было бы неправильно экономить на тортах и десертах."
2002405-11 = "Угощайтесь и наслаждайтесь."
2002405-12 = "А тем временем я заварю чай."
2002405-16 = "О, дизайн этой коробки немного отличается от той, что я видела раньше."
2002405-17 = "Подождите. Это...?"
2002405-18 = ""
2002405-20 = ""
2002405-21 = ""
2002405-23 = "(Это сушёная ламинария, а не чайные листья!)"
2002405-24 = "(Почему?! Кто вообще кладёт ламинарию в коробку из-под чая?)"
2002405-25 = "(Неужели компания настолько неправильно поняла мой заказ?!)"
2002405-26 = "(Даже для занятого магазина такая ошибка непростительна.)"
2002405-27 = "(Но... чайных листьев у меня больше нет. И, конечно, было бы ужасно невежливо отпустить Сенсея, не подав ему ни чашки чая...)"
2002405-28 = "(Значит, выбора нет... придётся подать Сенсею... этот чай из ламинарии...)"
2002405-29 = "[ns] «Что-то не так?»"
2002405-30 = "О-О нет! Совершенно ничего."
2002405-31 = ""
2002405-33 = ""
2002405-34 = "Поскольку этот вид чая для меня новый, мне пришлось узнать идеальную температуру заваривания."
2002405-37 = "С-Спасибо за ожидание. Прошу, насладитесь этим королевским купажом, заваренным специально для вас."
2002405-38 = "Этот чай следует пить медленно, небольшими глотками."
2002405-41 = "— Хи-хи... тонкий аромат бергамота...[wa:2300]"
2002405-43 = "― так освежает."
2002405-46 = "― (Это определённо ламинария...[wa:1540]"
2002405-48 = "— Запах ни с чем не спутать...)[wa:340]"
2002405-51 = "— А его необычное, свежее послевкусие...[wa:1810]"
2002405-53 = "— отлично сочетается с закусками...[wa:100]"
2002405-56 = "— (Ламинария слишком сильная..."
2002405-58 = "— и вкусы сталкиваются у меня во рту...)[wa:280]"
2002405-61 = "― Сенсей, вы впервые...[wa:1680]"
2002405-63 = "— пробуете нечто подобное?"
2002405-66 = "― П-понятно...[wa:860]"
2002405-68 = "— Такой чай нелегко достать. Хи... хи-хи...[wa:2140]"
2002405-71 = "― (Вы ведь не раскрыли мой маленький обман?[wa:10]"
2002405-73 = "— Запах может быть... сильно не тот, но хотя бы цвет правильный...)[wa:80]"
2002405-76 = "― (Если бы я знала, что так получится...[wa:440]"
2002405-78 = "— я бы просто заказала свой обычный чёрный чай.)[wa:920]"
2002405-81 = "Мы с Нагисой некоторое время наслаждались чаем и угощениями."
2002405-83 = "Фух... всё оказалось не так плохо, как я боялась."
2002405-84 = "Он не слишком подходил к закускам, но по крайней мере это было лучше, чем предложить простую воду..."
2002405-85 = "Ну как вам, Сенсей? Вам понравилось?"
2002405-86 = "[s] «Ага, было вкусно!»"
2002405-88 = "[ns] «Очень вкусная была ламинария.»"
2002405-89 = "Да, это определённо был вкус идеального настоя из ламинарии—"
2002405-90 = ""
2002405-92 = ""
2002405-93 = "Стойте! Подождите минутку, Сенсей! Вы знали, что это не чёрный чай? Когда вы поняли?"
2002405-94 = "[s] «С самого начала...?»"
2002405-95 = "..."
2002405-96 = "Цель этого чаепития была в том, чтобы загладить моё прежнее неподобающее поведение, но вместо этого вы увидели ещё один мой постыдный момент."
2002405-97 = "Ничего не поделать..."
2002405-98 = "Мне остаётся только силой стереть вам память."
2002405-100 = "Пришлось постараться, но мне удалось избежать попыток Нагисы стереть мне память."
