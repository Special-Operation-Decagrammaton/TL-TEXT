[translation]
13290-1 = "Episódio 29;Batalha Feroz (2)"
13290-34 = "...Fugiu de novo?"
13290-35 = "Por aqui."
13290-52 = "Argh...!"
13290-53 = "...!"
13290-54 = "Quem não tem nada a ver com isso..."
13290-55 = "É melhor sair do caminho!"
13290-60 = "Ugh!"
13290-61 = "Não atrapalha... Chefe do Comitê Disciplinar-chan!"
13290-62 = "Isso é um problema de Abydos... Não, é um problema meu!"
13290-63 = "Eu tenho a ver com isso, sim."
13290-64 = "...Como assim?"
13290-65 = "Porque o Sensei pediu... ou algo assim?!"
13290-68 = "Haa...!"
13290-76 = "(Desse jeito, o trem não vai aguentar...!)"
13290-77 = "(...Preciso ir para o teto!)"
13290-93 = "Haa... haa..."
13290-97 = "Haa, haa..."
13290-98 = "...Você não desiste fácil mesmo, hein."
13290-99 = "É, acho que ouço isso com frequência."
13290-103 = "(O objetivo da Chefe do Comitê Disciplinar-chan é me impedir de chegar à Estação Grande Oásis.)"
13290-104 = "(Sendo assim... ela tem duas opções: parar o trem ou me derrubar dele.)"
13290-105 = "..."
13290-111 = "(Se eu derrubá-la primeiro, ela não vai mais conseguir me alcançar.)"
13290-112 = "(E para isso...)"
13290-122 = "Próximo;A Existência do Caderno"
