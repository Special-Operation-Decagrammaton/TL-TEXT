1004202-37 = "[ns] Последовать за ней."
1004202-41 = "..."
1004202-42 = "[s] «Наверное, в заброшенном здании и правда не осталось парт.»"
1004202-43 = "Да. Похоже, я не смогу попробовать побыть обычной школьницей."
1004202-44 = "Ничего. Наверняка есть и другие занятия."
1004202-45 = "Дайте подумать."
