1004202-14 = "Прошу прощения. Сила привычки."
1004202-15 = "Здесь я могу свободно говорить и показывать лицо."
1004202-16 = "Пожалуйста, позвольте."
1004202-17 = "Доброе утро, Сенсей."
1004202-18 = "[s1] «...Эм. Доброе утро?»\n[s2] «Р-Разве сейчас не вечер?»"
1004202-19 = "Да. Приветствие — важный социальный жест. Добро пожаловать, Сенсей!"
1004202-20 = "Да. Приветствие — важный социальный жест. Добро пожаловать, Сенсей!"
1004202-21 = "Это заброшенное школьное здание станет моим домом на следующую неделю."
1004202-22 = "Меня оставили здесь с припасами и поспешили уйти."
1004202-23 = "Крайне важно, чтобы моё местоположение оставалось тайной. Поэтому вы будете моим тайным другом, Сенсей [USERNAME]."
1004202-24 = "[s] «Т-Тайным другом??»"
1004202-25 = "Вы не слышали такого выражения? Это друг, о котором другие не знают."
1004202-26 = "Раз уж вы здесь, чем займёмся ради развлечения?"
1004202-27 = "[s] «Ну... А что для тебя весело?»"
1004202-28 = "Я решила. Мы будем играть в школу."
1004202-29 = "[s] «Играть в школу?»"
1004202-30 = "Другие студенты бывают на уроках Сенсея, верно?"
1004202-31 = "Я тоже хочу. В этом здании наверняка есть классы."
1004202-32 = "А раз вы учитель, а я студент, всё необходимое у нас есть."
1004202-33 = "Пойдём играть."
