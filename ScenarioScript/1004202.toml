1004202-49 = "Хм?"
1004202-50 = "А. Остальные скоро вернутся."
1004202-51 = "Придётся закончить. Саори мне жизни не даст, если узнает, что вы были здесь."
1004202-52 = "[s] «Не хочу, чтобы из-за меня у тебя были неприятности.»"
1004202-53 = "Простите. Может, в следующий раз."
1004202-55 = "Я оставил Ацуко в заброшенном здании, но, уходя, не смог не заметить её разочарованного выражения."
