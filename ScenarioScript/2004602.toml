[translation]
2004602-1 = "Бегущее небо не ведает усталости"
2004602-2 = ""
2004602-3 = "О, Сенсей? Как быстро."
2004602-4 = "Я думала, вам понадобится больше времени, чтобы добраться сюда. Видимо, вы очень спешили."
2004602-5 = "Я благодарна."
2004602-6 = "[ns] «Ты ранена? Они всё ещё за тобой гонятся?»"
2004602-7 = "Ньяхаха... Я в порядке. Спасибо, что волнуетесь."
2004602-8 = "Пока что я от них оторвалась, но они всё ещё меня ищут."
2004602-9 = "Хм? Знаю ли я о них что-нибудь?"
2004602-10 = "М-м-м, ну..."
2004602-11 = "Ньяхах... Ни малейшего понятия!"
2004602-12 = "Я знаю, кто это МОЖЕТ быть, но вариантов слишком много!"
2004602-13 = "Должность президента Клуба Инь-Ян наживает тебе множество врагов — и политических, и не только."
2004602-14 = "Но кто бы за этим ни стоял, увидев рядом со мной Сенсея из Шале, они дважды подумают."
2004602-15 = "Так что... могу я попросить вас побыть со мной, пока всё не станет безопасно?"
2004602-16 = "[s] «Конечно!»"
2004602-17 = "Ньяхаха! Мне нравится ваш энтузиазм! Рада, что спросила."
2004602-18 = "Ну, тогда двигаемся. Я знаю одно местечко..."
2004602-20 = "Так мы с Нией покинули район Хяккияко."
2004602-21 = ""
2004602-22 = "Открытая сцена на Центральной площади"
2004602-23 = "Ого! Какой сильный!"
2004602-24 = "Датэ Мяусамунэ непобедим! Непобедим! НЕЕЕПОБЕДИМ!!"
2004602-25 = ""
2004602-27 = ""
2004602-28 = ""
2004602-31 = ""
2004602-32 = "Ньяхаха, рада, что мы пришли это посмотреть."
2004602-33 = "Грандиозный финал фестиваля. Торговая гильдия сказала, что выложилась на полную."
2004602-34 = "И они не врали!"
2004602-35 = ""
2004602-37 = ""
2004602-38 = "...Хм, Сенсей? Вам... не понравилось?"
2004602-39 = "По-моему, было довольно неплохо, но... сейчас по вашему лицу трудно что-то понять."
2004602-40 = "Ну да, они немного вольно обошлись с историей, но это же кабуки! Драматизация — часть очарования..."
2004602-41 = "...впрочем, если раньше вы не видели кабуки, можете этого не знать."
2004602-42 = "Сначала немного сложно понять, что происходит, но стоит втянуться — и становится очень интересно."
2004602-43 = "[ns1] «Нет, дело не в этом, просто...»\n[ns2] «Мы разве не скрываемся от преследователей?»"
2004602-46 = "А-а, понятно. Вот что вас беспокоило."
2004602-47 = "Скажем так: вы слышали выражение «если хочешь спрятать дерево — посади его в лесу»?"
2004602-48 = "Хяккияко сейчас забито людьми. В такой толпе мы легко затеряемся."
2004602-49 = "Сюда! Она пошла сюда!"
2004602-50 = ""
2004602-52 = ""
2004602-53 = "Надо схватить её, пока опять не потеряли!"
2004602-54 = "Ахаха... Хотя, похоже, мы всё-таки слишком задержались."
2004602-55 = "Тогда двигаемся дальше..."
2004602-56 = ""
2004602-58 = ""
2004602-59 = ""
2004602-60 = "Улица выставки исторических постановок"
2004602-61 = "Ха-ха! Кто следующий бросит мне вызов?"
2004602-62 = "Фух! Я слышала об этом представлении, но самой участвовать — совсем другое дело."
2004602-63 = "За это и люблю Хяккияко. Поездка окупилась с лихвой."
2004602-65 = "Видите, это интерактивный аттракцион. Можете тоже поучаствовать, Сенсей. Покажите всем, какой вы крутой..."
2004602-66 = "[s3] «Нет, мы ведь скрываемся.»\n[s4] «Не будем привлекать внимание.»"
2004602-69 = "Но там есть приз. Это... суперредкая карта Mushiqueen...?"
2004602-70 = "А, точно, из той карточной игры, которая всем вроде нравится..."
2004602-71 = "...то есть из невероятно популярной карточной игры, которая сейчас в моде у всех возрастов!"
2004602-72 = "М-м, да, но это, наверное, не в ВАШЕМ вкусе, Сенсей..."
2004602-73 = "[ns5] «Погоди, таких карт во всём мире всего штуки четыре!!»\n[ns6] «Ладно, участвуем!!»"
2004602-76 = "Ньяхаха?!"
2004602-77 = "Ого... вот это реакция."
2004602-78 = "Не то, чего я ожидала, но..."
2004602-79 = "...ну, раз уж пришли, надо развлечься, ньяхаха!"
2004602-80 = "Там, вон там!"
2004602-81 = ""
2004602-83 = ""
2004602-84 = "Ой, нам пора, Сенсей. Сюда."
2004602-86 = "Вместе с Нией я пробежался по множеству увлекательных площадок фестиваля."
2004602-87 = "А поздно вечером..."
2004602-90 = "А-а... Какой приятный ветерок..."
2004602-91 = "Знаете? В зависимости от времени года здесь пахнет разными цветами. Весной — сакурой, летом — хризантемами, а в другие сезоны..."
2004602-92 = "...Я порчу атмосферу, да? Наверное, лучше просто дать вам насладиться моментом!"
2004602-93 = "...Не знаю, почему я вдруг заговорила как экскурсовод."
2004602-94 = "В этом месте есть что-то такое, от чего студенты Хяккияко становятся гораздо разговорчивее."
2004602-95 = "И, наверное, в этом смысле я просто ещё один студент Хяккияко... Просто к слову... Ньяхаха..."
2004602-96 = "Хм-м? Потому что люди любят Хяккияко...?"
2004602-97 = "Фуфу, одно из объяснений. Ньяхаха! На самом деле отличный ответ!"
2004602-98 = "[ns] «Кстати, давно хотел спросить...»"
2004602-100 = "[ns] «Мы здесь не слишком заметны?»"
2004602-102 = ""
2004602-103 = "Нашли тебя!"
2004602-104 = "На этот раз не уйдёшь!"
2004602-105 = ""
2004602-106 = "[ns9] «Они нас заметили!»\n[ns10] «Беги! Я их задержу!»"
2004602-109 = "Ньяхаха! Вот это наш Сенсей! Уже приготовил крутую фразу..."
2004602-110 = "...но сейчас она не понадобится."
2004602-111 = "Кхм, здравствуйте, мои младшие из Клуба Инь-Ян."
2004602-112 = "Как видите, я сопровождала Сенсея, который приехал навестить нас в Хяккияко."
2004602-113 = "Можно сказать, выполняла внешнее поручение."
2004602-115 = "Ну... Сенсей определённо С вами, но...!"
2004602-116 = "Мы думали, вы просто опять сбежали прогуливать работу..."
2004602-118 = "*всхлип* *всхлип* Даже собственные члены клуба мне не доверяют..."
2004602-119 = "Неужели вы правда думаете, что я, президент Клуба Инь-Ян, стала бы уклоняться от обязанностей и сбегать развлекаться?"
2004602-120 = "Подтвердите, Сенсей."
2004602-121 = "[ns] «Ния.»"
2004602-123 = "[ns] «Хватит мучить младших и возвращайся уже к работе...»"
2004602-124 = "Ньяхаха... Стоило бы, да?"
2004602-125 = "Тогда спасибо, что сегодня были со мной. Я отлично провела время. До следующего раза, хорошо?"
2004602-127 = "Ния помахала на прощание с озорной улыбкой."
2004602-128 = "Остальные члены клуба крепко держали её за руки, пока уводили прочь."
