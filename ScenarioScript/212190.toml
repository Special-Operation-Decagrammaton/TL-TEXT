[translation]
212190-1 = "Episode 19;What Was Left Behind"
212190-3 = "(When Gehenna had regained its composure)"
212190-4 = "(A general assembly for all Gehenna students was held)"
212190-11 = "I wonder what they're going to say."
212190-12 = "Who knows. It sounds important, though."
