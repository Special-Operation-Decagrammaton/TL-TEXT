212190-158 = "Just like Makoto said, without running away from our responsibilities."
212190-159 = "……Yes. That's right."
212190-160 = "First of all... to our brave and proud underclassmen."
212190-161 = "Yeah..."
212190-163 = "……."
212190-164 = "I can't believe the President stood up for the Prefect Prefect."
