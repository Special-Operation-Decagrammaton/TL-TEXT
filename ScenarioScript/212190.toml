212190-49 = "……Everyone in Gehenna."
212190-50 = "First, as the Prefect Prefect, I would like to apologize for the tragic events of the past few days."
212190-51 = "I was trapped by a curse, and I truly believed that was the path to order and peace."
212190-52 = "These hands, which trampled on everyone's will and took up arms against Kivotos...#nwere undoubtedly my own."
212190-53 = "……."
212190-54 = "Hmm..."
212190-55 = "I won't make excuses like saying I was brainwashed."
212190-56 = "In the end, I did exactly what the Kaiser did.#nEven though I despised it so much."
212190-57 = "The noisy, selfish daily life that everyone was supposed to enjoy...#nI tried to erase it with my own self-righteous judgment."
212190-58 = "I would like to take this opportunity to say this to the underclassmen who stood in my way until the very end, #nand to all the students who stood up with courage."
212190-61 = "Prefect Prefect..."
212190-67 = "Everyone was right.#nIf you hadn't stopped us, Gehenna might have gone down a path of no return."
212190-68 = "……I intend to bear all the blame and resentment that everyone directs at me."
212190-69 = "Prefect Prefect..."
212190-73 = "As of today, I am resigning from all authority as Prefect Prefect—"
212190-74 = "Absolutely not!!!"
212190-82 = "Makoto...?"
212190-83 = "Hina Sorasaki! Who said you could resign!?#nI, Lady Makoto Hanuma, do not remember giving you permission!"
212190-84 = "What are you talking about..."
212190-88 = "Hmph, that's a gloomy look that doesn't suit you."
212190-89 = "Besides, if you take all the responsibility and step down, what happens to my position?"
212190-90 = "Are you saying I should go around telling everyone that the Pandemonium Society President couldn't even control one Prefect Prefect and caused this catastrophe!?"
212190-91 = "President Makoto! The Prefect Prefect is serious—"
212190-92 = "Quiet, Administrative Officer Ako! I am speaking now!"
212190-93 = "Citizens of Gehenna! Listen!"
