212190-364 = "Макото, пожалуйста, хватит заставлять меня переживать из-за твоей унылой физиономии."
212190-365 = "Ты сейчас со МНОЙ разговариваешь, Ироха?"
212190-366 = "Да. С тобой. С Ханумой Макото из Геенны, упрямой до мозга костей и высокомерной до небес."
