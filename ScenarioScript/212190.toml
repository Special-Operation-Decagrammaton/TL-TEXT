212190-166 = "Karen, does this mean—"
212190-167 = "Yeah."
212190-168 = "Maybe this was the moment Gehenna became one?"
212190-169 = "Heh. Prefect Prefect, you look much more relaxed."
212190-170 = "……Maybe we really can achieve the great Gehenna we dreamed of."
212190-171 = "Of course we can. We're the ones who are going to build it from now on. Right?"
212190-172 = "Yeah! We're the Gehenna Rebuilding Committee, after all!"
212190-176 = "But, that name... are we really going to keep using it?"
212190-177 = "Shouko-chan gave it to us. It seems she named it with the intention of bringing back the Kaiser era."
212190-178 = "I don't think the name itself is bad. It means 'to rebuild'."
212190-179 = "Gehenna is the kind of school where something is exploding and breaking somewhere every day, right?#nSo people like us have to keep rebuilding it over and over."
