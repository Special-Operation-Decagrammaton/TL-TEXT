212190-124 = "If you want to throw stones at the Prefect Prefect, throw them all at me! I'll take them all!"
212190-126 = "Oh..."
212190-127 = "She's surprisingly passionate, isn't she?"
212190-129 = "And Hina Sorasaki! Forget about resigning or giving up your authority!"
212190-130 = "You will continue to work under me, spending your whole life cleaning up Gehenna's messes to atone for your sins!#nKishishi! I have decided!"
212190-135 = "……Selfish to the end."
212190-136 = "Alright! That's enough apologizing! The combat plan is scrapped!"
212190-137 = "The Pandemonium Society will find a way to return the ammo and everything else we requisitioned from you soon!"
212190-138 = "Everyone, go back to enjoying your lives as freely as Gehenna students do! That is all!!"
