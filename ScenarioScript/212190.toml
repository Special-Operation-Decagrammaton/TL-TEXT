[translation]
212190-1 = "Episódio 19;O Que Foi Deixado Para Trás"
212190-3 = "(Quando Gehenna finalmente começou a recuperar a calma)"
212190-4 = "(Foi convocada uma assembleia geral para todo o corpo discente da escola)"
212190-5 = ""
212190-9 = ""
212190-10 = ""
212190-11 = "O que será que vão falar no microfone?"
212190-12 = "Sei lá. Mas pelo bafafá, parece que é coisa muito importante."
212190-13 = "Já pensou se for aquele discurso biruta de outro dia de novo?"
212190-14 = "Declarar guerra contra Kivotos? Misericórdia, já deu o que tinha que dar daquela doideira."
212190-15 = "......"
212190-16 = "Aquele dia foi bizarro demais, né? Do nada bateu aquela sensação esquisita de que a gente TINHA que ir pra guerra."
212190-17 = "Comigo foi igualzinho! Parecia uma obrigação enfiada na goela que não dava pra dizer não."
212190-18 = "Agora que a poeira baixou, não faz o menor sentido."
212190-19 = "Aliás, e aqueles preparativos todos de invasão? Cancelaram de vez?"
212190-20 = "Ei, vocês também tiveram a munição confiscada pela guarda?"
212190-21 = "Pois é! Será que vão devolver as minhas caixas? Deram aqueles 'pontos', mas não quero ponto nenhum!"
212190-22 = "A minha era uma caixa de balas de edição limitada de colecionador! Tomara que falem disso hoje."
212190-23 = ""
212190-25 = ""
212190-26 = ""
212190-27 = "Eita...... me deu um arrepio na espinha só de ouvir o chiado do microfone."
212190-28 = "Em você também? Depois daquela frequência bizarra, peguei um trauma danado desses alto-falantes......"
212190-29 = ""
212190-30 = ""
212190-32 = "[ns] \"......\""
212190-33 = ""
212190-34 = "Opa, parece que vai começar."
212190-35 = "Ué? Aquela ali subindo no palco não é――"
212190-39 = ""
212190-40 = ""
212190-41 = "Presidente Hina......"
212190-42 = "......"
212190-43 = ""
212190-44 = "A chefa da Disciplina......?"
212190-45 = "O que será que ela vai falar?"
212190-48 = ""
212190-49 = "......Alunas de Gehenna."
212190-50 = "Antes de qualquer coisa, venho a este púlpito, como Presidente do Comitê de Disciplina, pedir o mais profundo e sincero perdão pelos trágicos acontecimentos dos últimos dias."
212190-51 = "Aprisionada por um transe mental perverso, cheguei a acreditar piamente que aquela tirania imposta era a verdadeira ordem e a verdadeira paz."
212190-52 = "Pisotear a vontade de vocês e apontar o fuzil contra Kivotos...... foram atrocidades cometidas por estas minhas próprias mãos."
212190-53 = "......"
212190-54 = "Caramba......"
212190-55 = "Não vou me acovardar atrás da desculpa de ter sofrido uma lavagem cerebral."
212190-56 = "Pois no final das contas, acabei agindo exatamente igual à Imperatriz do Trovão.#nMesmo tendo passado a vida inteira jurando o mais profundo ódio a tudo o que ela representava."
212190-57 = "A rotina caótica, barulhenta e livre que todas vocês tinham o direito sagrado de desfrutar......#eu quase aniquilei por um julgamento arrogante e egoísta."
212190-58 = "Aproveito este momento solene para dirigir minhas palavras às minhas jovens júniors que me enfrentaram até o limite da exaustão,#e a todas as alunas corajosas que se ergueram para combater a loucura:"
212190-60 = ""
212190-61 = "Presidente Hina......"
212190-62 = ""
212190-64 = ""
212190-65 = ""
212190-66 = ""
212190-67 = "Eram vocês que estavam certas.#nSe vocês não tivessem arriscado a própria vida para nos conter, Gehenna teria mergulhado num abismo sem volta."
212190-68 = "......Estou pronta para carregar nos meus ombros todo o rancor, todas as vaias e toda a punição que vocês julgarem justa."
212190-69 = "Presidente......"
212190-70 = ""
212190-72 = ""
212190-73 = "Sendo assim, a partir de hoje, renuncio a toda e qualquer autoridade como Presidente do Comitê de Disciplina e me desligo do――"
212190-74 = "NADA DISSOOOOOOO!!!"
212190-75 = ""
212190-77 = ""
212190-78 = ""
212190-81 = ""
212190-82 = "Makoto......?!"
212190-83 = "Sorasaki Hina! Quem foi que te deu autorização para renunciar a qualquer coisa?!#nEsta que vos fala, Hanuma Makoto, não assinou despacho nenhum concedendo permissão!"
212190-84 = "O que você está dizendo......?"
212190-85 = ""
212190-87 = ""
212190-88 = "Humph! Essa sua carinha de cachorrinho sem dono não combina nada com você!"
212190-89 = "Pra começo de conversa: se você puxar toda a culpa para si e sair de fininho, como é que fica a MINHA honra magnífica?!"
212190-90 = "Quer que o mundo inteiro saia fofocando que a líder suprema da Sociedade Pandemônio não foi capaz nem de segurar as rédeas de uma chefinha da Disciplina e por isso causou essa tragédia?!"
212190-91 = "Líder Makoto! A Presidente está falando muito a sério――"
212190-92 = "Silêncio, Diretora Administrativa Amau Ako! Agora quem está no microfone sou eu!"
212190-93 = "Cidadãos de Gehenna! Ouçam com atenção!"
212190-94 = "A líder da Pandemonium......?"
212190-95 = "Quem começou com aquela palhaçada de atacar Kivotos foi ela, não foi......?"
212190-96 = "EXATAMENTE! Fui eu mesma, a grandiosa Hanuma Makoto!"
212190-97 = "Toda essa palhaçada monumental e sem pé nem cabeça――"
212190-98 = ""
212190-100 = ""
212190-101 = "Foi tudo culpa da minha burrice monumental por ter dançado alegremente conforme a música daquele fantasma maldito da Imperatriz do Trovão!!"
212190-103 = ""
212190-104 = ""
212190-105 = ""
212190-106 = "Gente, ela pode falar isso no microfone?!"
212190-107 = ""
212190-108 = "Makoto......"
212190-109 = "É vergonhoso até a medula dos ossos, mas esta líder máxima no topo de Gehenna foi enganada por planos mofados do passado e ordenou que vocês pegassem em armas!"
212190-110 = "O erro foi meu! A derrota foi MINHA!#nPor isso eu peço desculpas: ME PERDOEM, FIZ CAGADA!!"
212190-111 = ""
212190-113 = ""
212190-115 = ""
212190-116 = "......Até na hora de pedir desculpas ela consegue ser um escândalo ambulante."
212190-117 = "Fufufu...... bem a cara da Makoto-chan."
212190-118 = "PORÉM! Sorasaki Hina não tem nada a ver com isso!"
212190-119 = "Ela lutou e sangrou até o último cartucho para proteger Gehenna!"
212190-120 = "Se ela em algum momento apontou a arma para vocês, a culpa recai inteiramente sobre esta líder tapada que não soube discernir o certo do errado!"
212190-121 = "Makoto, os meus erros sou eu quem devo――"
212190-122 = "CALE ESSA BOCA! A sua responsabilidade é a MINHA responsabilidade!"
212190-123 = "Eu assumo todas as broncas e pecados de Gehenna nos meus ombros soberanos!#nPor isso, alunas ouvintes――!"
212190-124 = "Se alguém aqui tiver pedras para atirar na Disciplina, que atire TODAS em mim! Aguentarei cada pedrada com o peito estufado!"
212190-125 = ""
212190-126 = "Uau......"
212190-127 = "Olha aí, até que a mulher tem um espírito de liderança foda, vai!"
212190-128 = ""
212190-129 = "E quanto a você, Sorasaki Hina! Deixe de choradeira barata e engula essa história de renunciar ao cargo!"
212190-130 = "Você continuará debaixo do meu comando supremo pelo resto da vida, limpando a bagunça de Gehenna para pagar pelos seus erros!#nKwahaha! Esta é a minha sentença final e irrevogável!"
212190-131 = ""
212190-133 = ""
212190-134 = ""
212190-135 = "......Arrogante e mandona até o último segundo, como sempre."
212190-136 = "Muito bem! O momento de penitência encerra-se aqui! O plano de ofensiva está formally cancelado e arquivado!"
212190-137 = "Quanto às munições e aos pertences confiscados, a Pandemonium dará um jeito de devolver tudo nos próximos dias!"
212190-138 = "Tratem de voltar para suas vidas desordeiras e aproveitem a liberdade desenfreada como autênticas alunas de Gehenna! DISPERSAR!!"
212190-139 = ""
212190-141 = ""
212190-144 = "UOOOOOOOHHH!! Mandou benzasso, chefa!!"
212190-145 = "Isso aí!! Isso sim é a nossa Gehenna de raiz!!"
212190-146 = "[ns] \"Até na hora de se desculpar a Makoto é única no mundo......\""
212190-147 = ""
212190-148 = "......Bem, considerando os estragos potenciais...... o clima final até que ficou excelente."
212190-149 = "Ficou mesmo."
212190-150 = "......Graças ao escândalo dela, sinto como se um peso imenso tivesse saído das minhas costas."
212190-151 = ""
212190-153 = ""
212190-154 = "Presidente Hina."
212190-155 = "......Não precisa dizer nada, Ako. Eu já sei."
212190-156 = "......"
212190-157 = "Nós precisamos acertar as contas do nosso próprio jeito."
212190-158 = "Sem fugir das nossas responsabilidades, exatamente como a Makoto berrou ali."
212190-159 = "......Sim. A senhora tem toda razão."
212190-160 = "A começar...... pelas nossas corajosas e orgulhosas júniors."
212190-161 = "Sim......"
212190-162 = ""
212190-163 = "......"
212190-164 = "Quem diria que a líder da Pandemonium iria subir no palanque pra proteger a chefa da Disciplina, né?"
212190-165 = "O jeito espalhafatoso foi ridículo, mas a mensagem de coração bateu certinho."
212190-166 = "Karen, isso quer dizer que――"
212190-167 = "É."
212190-168 = "Acho que este foi, de verdade, o momento em que Gehenna se tornou uma só."
212190-169 = "Hahaha! Olha só pra você, Mayumi, com essa cara toda radiante de alívio."
212190-170 = "......Talvez aquela Gehenna grandiosa com que sonhamos não seja uma utopia impossível, afinal."
212190-171 = "Mas é claro que não é! A gente vai construir ela juntas daqui pra frente! Não é isso?"
212190-172 = "Com certeza! Afinal, nós somos o Comitê de Restauração de Gehenna!"
212190-173 = ""
212190-175 = ""
212190-176 = "Mas peraí...... a gente vai continuar com esse nome mesmo?"
212190-177 = "Foi a Shoko......zinha que inventou o nome, provavelmente pensando em restaurar a tirania da Imperatriz."
212190-178 = "O nome em si é lindo: significa 'erguer de pé novamente'."
212190-179 = "Gehenna não é um lugar onde todo dia explode uma parede ou um prédio vem abaixo?#nPor isso alunas como nós precisam estar sempre de prontidão para reconstruir tudo de novo e de novo."
212190-180 = "Em vez de revirar glórias mofadas do passado, consertar o dia a dia para o futuro...... é isso?"
212190-181 = "Exatamente! Que se dane a Imperatriz do Trovão.#nNós vamos reconstruir Gehenna do nosso próprio jeitinho."
212190-182 = "Esse é o verdadeiro propósito do novo Comitê de Restauração de Gehenna daqui em diante."
212190-183 = ""
212190-185 = ""
212190-186 = ""
212190-187 = ""
212190-188 = "Falou e disse, minha líder linda!"
212190-193 = ""
212190-194 = ""
212190-195 = ""
212190-196 = "Olha, o que você falou lá na praça já foi mais do que suficiente, sério. Não precisava vir até aqui......"
212190-197 = "......Presidente, a senhora ainda está muito pálida."
212190-198 = ""
212190-200 = ""
212190-201 = "......Iori, Chinatsu.#nA sensação das coronhadas e dos disparos contra vocês duas...... ainda queima nas palmas das minhas mãos."
212190-202 = ""
212190-204 = ""
212190-205 = "O olhar de desespero de vocês enquanto gritavam meu nome para me fazer acordar...... eu lembro de tudo."
212190-206 = "......!"
212190-207 = "Como líder da Disciplina―― e como veterana de vocês―― cometi o pecado mais imperdoável de todos."
212190-208 = "Prometi que guardaria a linha para proteger vocês, e fui a responsável por abrir as feridas mais profundas nos seus corpos."
212190-209 = "......Me perdoem, de verdade.#nEu sei muito bem que nenhuma palavra bonita é capaz de apagar essa culpa."
212190-210 = ""
212190-212 = ""
212190-213 = ""
212190-214 = "Peço perdão também em meu nome.#nSei que pisotear a sinceridade e a lealdade de vocês não é algo que se perdoa facilmente."
212190-215 = ""
212190-217 = ""
212190-218 = "......Doeu. Doeu pra burro, sabia?#nO tiro doeu, mas nem se compara com――"
212190-219 = "Aquele olhar gélido e sem coração que vocês lançaram pra gente...... doeu cem vezes mais que qualquer bala.#nFoi como se arrancassem um pedaço do meu peito fora......"
212190-220 = "............"
212190-221 = "A gente gritou com a alma pra vocês voltarem......! Suas veteranas cabeças de vento!!"
212190-222 = "Perdão...... me perdoe, Iori......"
212190-223 = "......Eu também senti muito medo."
212190-224 = "Parecia que todo o chão sob os nossos pés estava desmoronando."
212190-225 = ""
212190-227 = ""
212190-228 = ""
212190-229 = "Mas...... se conseguimos empunhar as armas mais uma vez, foi porque a justiça que as senhoritas nos ensinaram continuava viva dentro dos nossos corações."
212190-230 = "Por isso, desta vez, fomos nós que guardamos a linha no lugar de vocês."
212190-231 = "......Por favor, não fiquem se torturando com remorso.#nAfinal de contas, as senhoritas voltaram sãs e salvas para nós, não voltaram?"
212190-232 = ""
212190-234 = ""
212190-235 = "......É, exatamente isso. Que bom que vocês tão de volta com a gente."
212190-236 = ""
212190-238 = ""
212190-239 = "......Muito obrigada.#nE mais do que isso――"
212190-240 = "Tenho um orgulho incomensurável de vocês duas. Foram membros da Disciplina mil vezes mais nobres do que eu jamais fui."
212190-241 = "Hehehe......"
212190-242 = "......Fufufu."
212190-243 = "Chega de lamentações. Pagarei pelas minhas falhas com atitudes concretas de agora em diante."
212190-244 = "Concordo plenamente. Afinal, temos montanhas de expedientes acumulados:#nreparação de danos, processos disciplinares, inventário de munições perdidas...... a lista é infinita."
212190-245 = "Eu gostaria muito de dar férias a vocês duas, mas a situação não permite. Conseguem retomar o serviço imediatamente?"
212190-246 = "COMO É QUE É?! Mas já tá mostrando as garras de capataz na mesma hora?!"
212190-247 = "Hahaha...... Acho que esse é o jeito torto da Diretora Ako pedir desculpas:#ndizendo que não consegue viver sem vocês duas."
212190-248 = "Exatamente, é isso mesmo.#nCom essa montanha colossal de serviço, como vocês esperam que eu dê conta sem a competência de vocês duas?"
212190-249 = ""
212190-251 = ""
212190-252 = "......Por favor.#nVenham guardar a linha de Gehenna ao nosso lado novamente, sim?"
212190-253 = ""
212190-255 = ""
212190-256 = "Ai, ai...... você não tem jeito mesmo, né, Ako-chan."
212190-257 = ""
212190-259 = ""
212190-260 = ""
212190-261 = ""
212190-262 = "......Muito obrigada a todas."
212190-264 = ""
212190-265 = "Chamar de 'luta eterna' soaria poético demais, talvez."
212190-266 = "Mas a liberdade é exatamente isso."
212190-267 = "Ela nunca está pronta, nunca é segura e nunca tem fim."
212190-268 = ""
212190-270 = ""
212190-271 = "Ser livre significa――"
212190-272 = "nunca abrir mão da responsabilidade de pensar e decidir o próprio rumo."
212190-273 = "A minha......"
212190-274 = "......"
212190-275 = "Não."
212190-276 = "A NOSSA Gehenna continuará sendo uma academia eternamente livre."
212190-277 = ""
212190-279 = ""
212190-280 = ""
212190-281 = "Cidadãos! Divirtam-se até o amanhecer e vivam como bem entenderem!"
212190-282 = "Pois toda e qualquer bronca no final das contas, esta que vos fala, Hanuma Makoto, assume com gosto!"
212190-283 = ""
212190-286 = ""
212190-287 = "Olha, o discurso até que foi poético e emocionante, mas......"
212190-288 = "A audiência da transmissão foi de míseros 0,3%!"
212190-289 = ""
212190-291 = ""
212190-292 = "POR QUE DIABOS, DROGA?!!"
212190-293 = ""
212190-295 = ""
212190-296 = ""
212190-297 = "Mas antes já era essa mesma média de audiência, não era? Esse é o normal de Gehenna."
212190-298 = "Estar igual a antes é a melhor notícia possível."
212190-299 = "Significa que mesmo depois de todo aquele terremoto, o espírito fundamental de Gehenna continua intacto."
212190-300 = "Grrr......! Aquele discurso era uma obra-prima filosófica com o puro extrato da minha genialidade, pô!!"
212190-301 = "[s] \"Eu ouvi cada palavra com muita atenção, Makoto.\""
212190-302 = ""
212190-304 = ""
212190-305 = "Oooooh!"
212190-306 = "Como esperado do meu Sensei! Sabia que você seria capaz de compreender os ideais sublimes que trago na alma!"
212190-307 = "Poucos líderes na história têm a coragem de pregar virtudes tão magnânimas! Talvez apenas a Secretária-Geral de Red Winter chegue perto do meu brilho!"
212190-308 = "[s] \"......Hum?\""
212190-309 = "Ora, não precisa ser modesto! A essa altura do campeonato, o Sensei já testemunhou a verdade:"
212190-310 = "A garra maligna que tentou manchar Gehenna virou pó sob o bramido majestoso da minha voz estrondosa! Não sobrou nem poeira!"
212190-311 = "Gehenna é um santuário seguro e continuará grandiosa por toda a eternidade!"
212190-312 = "Não acha que agora é o momento perfeito para selarmos uma aliança eterna?"
212190-313 = ""
212190-316 = "[ns] \"Muito obrigado por tudo, Makoto!\""
212190-317 = ""
212190-318 = "[ns1] \"Foi graças a você que Gehenna superou esta crise imensa.\"\n[ns2] \"Como Sensei e como adulto, sou imensamente grato a você.\""
212190-321 = "H-Humph......"
212190-322 = "Falar olhando nos meus olhos com esse sorriso gentil é golpe baixo, sabia?"
212190-323 = ""
212190-325 = ""
212190-326 = ""
212190-327 = "Toda essa bagunça acabou causando transtornos indescritíveis ao Sensei."
212190-328 = "Eu...... não sabia muito bem como colocar isso em palavras."
212190-329 = "Sobretudo porque não faço ideia de como compensar a angústia física e mental que lhe causei."
212190-330 = "Ameaças, cárcere numa cela, estresse...... passou muito além de um mero incômodo passageiro."
212190-331 = "......O que devo fazer?"
212190-332 = "Que tipo de pedido de desculpas seria suficiente para o Sensei se dar por satisfeito?"
212190-333 = "[s] \"Que tal continuar sendo simplesmente você mesma, Makoto?\""
212190-334 = "O quê......?!"
212190-335 = "O que...... o que quer dizer com isso?"
212190-336 = "Confesso que não compreendi o significado filosófico oculto......"
212190-337 = "[s] \"Considere isso a sua lição de casa.\""
212190-338 = ""
212190-341 = "[ns] \"Quero que continue refletindo sobre o que isso significa.\""
212190-342 = "............"
212190-343 = "Continuar sendo eu mesma...... basta apenas isso......?"
212190-344 = "Quer que eu olhe para dentro de mim e encare quem sou de verdade?"
212190-345 = "......Que enigma espinhoso. As palavras do Sensei são sempre assim."
212190-346 = ""
212190-348 = ""
212190-349 = "Pois bem: gravarei essa lição de casa no fundo do meu coração."
212190-350 = "E permito-me mais um voto solene como líder da Sociedade Pandemônio:"
212190-351 = "Juro que jamais permitirei que semelhantes calamidades voltem a ocorrer."
212190-352 = "Gehenna ficará bem."
212190-353 = "[s] \"Sim. Eu confio em você.\""
212190-354 = "......Sim."
212190-355 = "Preciso continuar me esforçando com afinco para merecer tamanha confiança."
212190-356 = ""
212190-358 = ""
212190-359 = ""
212190-360 = "......"
212190-361 = ""
212190-363 = ""
212190-364 = "E aí, vai ficar nessa pose deprimida até quando? Tá estragando todo o meu ritmo de trabalho."
212190-365 = "Porventura essa insolência destina-se a esta que vos fala?"
212190-366 = "E tem outra pessoa aqui na sala por acaso?#nTô falando com a senhora mesma, a boba, teimosa e com autoestima estratosférica Makoto-senpai."
212190-367 = "Hah! Provocaçãozinha barata. Quem disse que me falta ânimo――"
212190-368 = "Dá pra ver na sua cara."
212190-369 = "Desde aquele dia você mal consegue pregar os olhos e fica se revirando na cama a noite toda."
212190-370 = "......"
212190-371 = "Aquilo foi uma falha crassa, com certeza. Mas não precisa ficar com essa cara de condenada ao corredor da morte."
212190-372 = "Chega de ficar remoendo fantasmas da Imperatriz do Trovão,#tremendo de pavor pensando: 'E se isso acontecer de novo?'."
212190-373 = "Ficar com medo e insegura não combina em nada com você."
212190-374 = "Trate de atropelar as coisas no peito e na raça como sempre fez."
212190-375 = ""
212190-377 = ""
212190-378 = "Essa é a sua especialidade, não é? Ande de cabeça erguida e com aquela empáfia inabalável de sempre."
212190-379 = "É assim que a Makoto-senpai deve ser."
212190-380 = ""
212190-384 = ""
212190-385 = ""
212190-386 = "......"
212190-387 = "......"
212190-388 = ""
212190-390 = ""
212190-391 = ""
212190-392 = "Ouvir um sermão desses de uma júnior insolente...... Fui deveras subestimada!"
212190-393 = "Kwahaha! Suas palavras atrevidas foram devidamente arquivadas nos meus ouvidos!"
212190-394 = "PORÉM, NÃO SURTIRAM EFEITO ALGUM!!#nAcha mesmo que uma ninhada de problemas desses abala o meu ímpeto?!"
212190-395 = "Acha que a grandiosa Makoto se rebaixa às aflições banais de meros mortais comuns?!"
212190-396 = "Jamais! É um equívoco astronômico!!"
212190-397 = "Se eu perdi o sono, foi meramente por excesso de cafeína nas veias!"
212190-398 = "E a única coisa capaz de me causar remorso na alma seria se eu tivesse comido o pudim da Ibuki sem querer!!"
212190-399 = ""
212190-401 = ""
212190-402 = "Makoto-senpai, você comeu o pudim da Ibuki de novo?!"
212190-403 = "N-Não, desta vez não comi! Juro que tá guardadinho intacto na geladeira......!"
212190-404 = ""
212190-406 = ""
212190-407 = ""
212190-408 = "Recuperar o ânimo tão rápido tira até a graça de tentar consolar."
212190-409 = "......Mas tá infinitamente melhor do que a cara de enterro de ontem."
212190-410 = "A Makoto-chan é a Makoto-chan."
212190-411 = "Não importa o que aconteça neste mundo, ela sempre será ela mesma."
212190-412 = "......É, você tem razão."
212190-413 = "Opa, opa! Eu posso falar agora sobre o quanto a Makoto-senpai foi incrível naquele momento?!"
212190-414 = "Aquele berro com autoridade quebrando o transe na base da raça!"
