212190-370 = "..."
212190-371 = "Да, ты натворила дел. Все в курсе, беда-то какая. Неважно, виновата ты сама, ошиблась или обстоятельства так сложились. Хватит себя наказывать."
212190-372 = "Не трать больше время на чепуху об Императоре-тиране. Жизнь слишком коротка, чтобы бояться того, что ты, возможно, сделаешь в будущем."
212190-373 = "Эта испуганная, тревожная Макото — не настоящая ты."
