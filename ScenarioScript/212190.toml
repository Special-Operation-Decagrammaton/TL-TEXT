212190-222 = "I'm sorry... I'm so sorry..."
212190-223 = "……I was scared, too."
212190-224 = "It felt like everything I had believed in was crumbling away."
212190-229 = "But... even so, the reason we were able to take up our guns again is because the justice you taught us was still alive within us."
212190-230 = "So this time, we held the line in your place."
212190-231 = "……Please don't blame yourself too much. #nAfter all, you've come back to us, haven't you?"
212190-235 = "……Yeah. That's right. I'm glad you came back."
212190-239 = "……Thank you. #nAnd—"
212190-240 = "I'm proud of you both. You were much better Prefects than I was."
212190-241 = "Hehe..."
212190-242 = "……Hehe."
212190-243 = "No more apologizing. I will atone for my mistakes with my actions from now on."
212190-244 = "Indeed. We have a mountain of work to do. #nRestoring the damage, disciplinary procedures, listing missing equipment... the list goes on."
212190-245 = "I'd like to let you two rest, but the situation is what it is. Can you return to duty immediately?"
212190-246 = "Huh!? Isn't it a bit too soon to show your true colors!?"
212190-247 = "Hehe... I think that's just Administrative Officer Ako's way of apologizing. #n'We need you here, always.'"
