[translation]
212190-1 = "Эпизод 19;То, что осталось позади"
212190-3 = "Когда всё наконец улеглось..."
212190-4 = "Все студенты Геенны получили уведомление об обязательном общем собрании."
212190-5 = ""
212190-9 = ""
212190-10 = ""
212190-11 = "Зачем вообще это собрание?"
212190-12 = "Понятия не имею. Сказали только, что дело важное."
212190-13 = "...Они ведь не собираются снова огорошить нас какой-нибудь новостью?"
212190-14 = "Ты про всю эту историю с «завоеванием Кивотоса»?"
212190-15 = "..."
212190-16 = "Ага, про неё... Странное было чувство, словно выбора вообще не оставалось."
212190-17 = "У меня тоже. Сложно объяснить, будто возникло желание, которому невозможно сопротивляться."
212190-18 = "А потом оно совсем пропало. Ну серьёзно, кому вообще нужна ВОЙНА?"
212190-19 = "Кстати, что стало со всеми приготовлениями к войне? Мы просто прекращаем?"
212190-20 = "Эй! У вас тоже все патроны забрали?"
212190-21 = "А, да-да. Их ведь должны вернуть, правда? Хотя мне начислили обратно бонусные баллы."
212190-22 = "Кажется, это была какая-то временная акция. Надеюсь, на собрании всё объяснят."
212190-23 = ""
212190-25 = ""
212190-26 = ""
212190-27 = "Ух... Посмотри на мою руку, аж мурашки пошли."
212190-28 = "У меня тоже. После того первого пронзительного звука меня до сих пор передёргивает."
212190-29 = ""
212190-30 = ""
212190-32 = "[ns] «...»"
212190-33 = ""
212190-34 = "Эй, кажется, там что-то начинается."
212190-35 = "М? Это ведь...?"
212190-39 = ""
212190-40 = ""
212190-41 = "...Глава Префектуры Хина."
212190-42 = "..."
212190-43 = ""
212190-44 = "Глава Префектуры...?"
212190-45 = "Что она говорит?"
212190-48 = ""
212190-49 = "...Дорогие студенты Геенны."
212190-50 = "Прежде всего я, Сорасаки Хина, как глава Префектуры хочу принести извинения за трагические события последних дней."
212190-51 = "Находясь под чужим воздействием, я искренне верила, что действую во благо Геенны."
212190-52 = "Этими руками... я попрала свободу воли, на которую имеют право все студенты Геенны. Я подняла оружие ради нелепой мечты о завоеваниях."
212190-53 = "..."
212190-54 = "...Хм."
212190-55 = "Я не собираюсь оправдываться тем, что мне промыли мозги."
212190-56 = "В конечном счёте именно мне предстоит нести ответственность за свои поступки. Я пошла по стопам той, кому всегда противостояла: Императора-тирана."
212190-57 = "Я не имела права в один прекрасный день объявить, что нашим шумным, свободным будням в Геенне пришёл конец."
212190-58 = "Я хочу обратиться к младшим студентам, которые отстояли правду и восстали против нашей тирании. И ко всем студентам, сражавшимся против нас."
212190-60 = ""
212190-61 = "Глава Префектуры..."
212190-62 = ""
212190-64 = ""
212190-65 = ""
212190-66 = ""
212190-67 = "Вы поступили правильно. Благодаря каждому из вас Геенна не сбилась с верного пути."
212190-68 = "Я не намерена прятаться от вашей критики и негодования."
212190-69 = "Глава Префектуры..."
212190-70 = ""
212190-72 = ""
212190-73 = "Поэтому с сегодняшнего дня я слагаю с себя полномочия главы Префектуры и..."
212190-74 = "А ВОТ И НЕТ!!"
212190-75 = ""
212190-77 = ""
212190-78 = ""
212190-81 = ""
212190-82 = "Макото...?"
212190-83 = "Стой, Сорасаки Хина! Кто тебе разрешил по собственной прихоти уходить с должности?! Я, Ханума Макото, этого не одобряла!"
212190-84 = "...Макото? Ты что...?"
212190-85 = ""
212190-87 = ""
212190-88 = "Фу. Вид у тебя совсем убитый."
212190-89 = "Ты решила взять на себя всю ответственность и уйти, но подумала хоть, как это выставит меня?"
212190-90 = "Ведь весь мир решит, что председатель Пандемониума не может даже удержать главу Префектуры под контролем!"
212190-91 = "Председатель Макото! Глава Префектуры говорит совершенно искренне...!"
212190-92 = "Тишина, старший администратор Амау Ако! Сейчас МОЯ очередь говорить!"
212190-93 = "Итак, солдаты Геенны! Смирно!"
212190-94 = "Председатель Общества Пандемониума...?"
212190-95 = "Это ведь она призывала нас к войне, да?"
212190-96 = "Именно! Это я! Ханума Макото!"
212190-97 = "Всё это завоевание Кивотоса и сопровождавшее его безумие..."
212190-98 = ""
212190-100 = ""
212190-101 = "Скажу вам прямо! Всё произошло потому, что я по глупости поддалась обману приспешников свергнутого Императора-тирана!"
212190-103 = ""
212190-104 = ""
212190-105 = ""
212190-106 = "Н-ничего себе... Она правда сказала это вслух?"
212190-107 = ""
212190-108 = "Макото..."
212190-109 = "Мне стыдно признать: ваша досточтимая правительница попала под влияние одного из старых проектов Императора! Поэтому я и приказала вам взяться за оружие!"
212190-110 = "Это моя вина! Я проиграла! Простите! Мой промах!"
212190-111 = ""
212190-113 = ""
212190-115 = ""
212190-116 = "Серьёзно... Какое драматичное извинение..."
212190-117 = "Фу-фу, от Макото другого и не жди."
212190-118 = "Однако! Сорасаки Хина здесь совсем другое дело!"
212190-119 = "Несмотря ни на что, она до последнего отдавала все силы защите Геенны!"
212190-120 = "Да, из-за промывания мозгов она совершала дурные поступки. Но виновата в этом я! Моё неверное решение!"
212190-121 = "Макото, я сама это сделала по своей..."
212190-122 = "Молчать! Твоя ответственность — это моя ответственность!"
212190-123 = "Более того, я, Ханума Макото, беру на себя ответственность за всю Геенну! Так что, студенты...!"
212190-124 = "Все камни, которые вы хотели бросить в главу Префектуры Хину, бросайте лучше в меня! Я с радостью стану её щитом!"
212190-125 = ""
212190-126 = "...Ничего себе."
212190-127 = "Она просто... берёт и делает, да?"
212190-128 = ""
212190-129 = "А что до тебя, Сорасаки Хина! Чтобы я больше не слышала от тебя жалких речей об отставке!"
212190-130 = "Всю оставшуюся жизнь будешь служить под моим началом и разгребать беспорядки Геенны в искупление грехов! Ки-хе-хе! Потому что я так сказала!"
212190-131 = ""
212190-133 = ""
212190-134 = ""
212190-135 = "...Ну надо же. Эгоистка до самого конца."
212190-136 = "А теперь хватит извинений! Всё, народ, наша завоевательная миссия завершена!"
212190-137 = "Общество Пандемониума возместит всем стоимость патронов и прочего изъятого имущества!"
212190-138 = "А теперь все по домам! По моему приказу веселитесь вовсю, как подобает Геенне! РАЗОЙТИСЬ!!"
212190-139 = ""
212190-141 = ""
212190-144 = "УРА-А-А!! Вот это КРУТО!"
212190-145 = "Вот это МОЯ Геенна!"
212190-146 = "[ns] «Извинилась в своём неповторимом стиле Макото»."
212190-147 = ""
212190-148 = "...И что тут скажешь? По крайней мере, худшего удалось избежать."
212190-149 = "...Ага."
212190-150 = "Признаю, она помогла мне хотя бы отчасти избавиться от чувства вины."
212190-151 = ""
212190-153 = ""
212190-154 = "Глава Префектуры."
212190-155 = "...Я знаю, Ако."
212190-156 = "..."
212190-157 = "Теперь нам остаётся лишь искренне раскаяться и попросить прощения, подтвердив свои слова делами."
212190-158 = "И, как сказала Макото, нести ответственность, не прячась от неё."
212190-159 = "...Да. Не прячась."
212190-160 = "Начнём с наших отважных младших студентов."
212190-161 = "Ага..."
212190-162 = ""
212190-163 = "..."
212190-164 = "Не могу поверить, что председатель вступилась за главу Префектуры..."
212190-165 = "«Вступилась» — это, пожалуй, громко сказано, но намерение было."
212190-166 = "Карен..."
212190-167 = "Ага."
212190-168 = "Если посмотреть с другой стороны, разве мы не стали свидетелями момента, когда Геенна по-настоящему объединилась?"
212190-169 = "...Я-ха. Вы выглядите довольной, председатель."
212190-170 = "Может, великая Геенна, о которой мы мечтали... не такая уж недостижимая мечта."
212190-171 = "Именно. Ведь мы построим её вместе, кирпичик за кирпичиком. Верно?"
212190-172 = "Ага! Ведь мы — Лига наследия Геенны!"
212190-173 = ""
212190-175 = ""
212190-176 = "...Ты хочешь сохранить это название?"
212190-177 = "Шоуко... Это она его придумала. И да, её целью было вернуть времена Императора-тирана."
212190-178 = "Но само название ведь не плохое, верно? Оно о гордости за то, кто мы есть. О восстановлении."
212190-179 = "Геенна всегда была и будет местом, где всё взрывается, а здания превращаются в руины. И именно таким, как мы, приходится всё отстраивать."
212190-180 = "Значит, мы сосредоточимся на том, чтобы строить нашу нынешнюю жизнь, а не воскрешать славу давно исчезнувшей империи?"
212190-181 = "Именно. Мне плевать, что Император-тиран делал или не делал. Меня волнует эта Геенна, которую мы будем восстанавливать по кусочкам."
212190-182 = "Вот чем станет Лига наследия Геенны."
212190-183 = ""
212190-185 = ""
212190-186 = ""
212190-187 = ""
212190-188 = "Я-ха-ха! Вот это наш председатель!"
212190-193 = ""
212190-194 = ""
212190-195 = ""
212190-196 = "Ну... Вашей речи и так было более чем достаточно, глава Префектуры. Всё хорошо..."
212190-197 = "...Глава Префектуры, вам нехорошо?"
212190-198 = ""
212190-200 = ""
212190-201 = "...Иори. Чинацу. Я до сих пор помню, что чувствовала, когда напала на вас. Будто то мгновение навеки отпечаталось у меня на руках."
212190-202 = ""
212190-204 = ""
212190-205 = "...И помню ваши лица, когда вы решились противостоять мне."
212190-206 = "...!"
212190-207 = "Я ваша глава Префектуры и старший товарищ. Я серьёзно отношусь к этой роли, но предала её."
212190-208 = "Это я должна была защищать вас. Вместо этого вам пришлось защищать всех от меня."
212190-209 = "...Простите. Я понимаю, что красивыми словами не искупить содеянного."
212190-210 = ""
212190-212 = ""
212190-213 = ""
212190-214 = "...Я тоже хочу извиниться. Вы обратились ко мне со всей искренностью, а я растоптала ваши чувства. Я не заслуживаю прощения."
212190-215 = ""
212190-217 = ""
212190-218 = "...М-мне было так больно. Не от пуль... Хотя от них тоже, но... Вы смотрели на меня так, будто я ничто...!"
212190-219 = "Пули были пустяком по сравнению с этим... Будто в груди дыру пробили..."
212190-220 = "..."
212190-221 = "А я кричала, кричала и умоляла вас вернуться! Глупая глава Префектуры!! И вы... Вы, глупый старший администратор!"
212190-222 = "Прости... Мне правда очень жаль..."
212190-223 = "...Глава Префектуры. Старший администратор Ако... Мне тоже было страшно."
212190-224 = "Казалось, всё, во что мы верили и ради чего трудились, рушится у меня на глазах."
212190-225 = ""
212190-227 = ""
212190-228 = ""
212190-229 = "Но именно поэтому мы смогли снова взяться за оружие. Ведь вы учили нас поступать правильно."
212190-230 = "Пришла наша очередь защитить школу."
212190-231 = "Пожалуйста, не вините себя так сильно. Мы просто счастливы, что вы вернулись."
212190-232 = ""
212190-234 = ""
212190-235 = "...Я тоже так думаю. Я... очень рада вашему возвращению."
212190-236 = ""
212190-238 = ""
212190-239 = "...Спасибо вам. И ещё..."
212190-240 = "Я так вами горжусь. Вы оказались достойнее нас в Префектуре."
212190-241 = "Хи-хи..."
212190-242 = "...Фуфу."
212190-243 = "Теперь хватит извинений. Я искуплю вину делами."
212190-244 = "Я тоже. А дел более чем достаточно: дисциплинарные разбирательства, учёт утраченного снаряжения, расчёт стоимости восстановительных работ..."
212190-245 = "Знаю, прошу о многом, но, учитывая обстоятельства... Вы сможете немедленно вернуться к службе?"
212190-246 = "ЧЕГО?! Так вот ты какая на самом деле, Амау Ако!"
212190-247 = "Фу-фу... Считай это её особым способом извиниться. Если пропустить её слова через мой «Переводчик со старшеадминистраторского», получится: «Без вас нам никак»."
212190-248 = "Разумеется. Как бы мы справились с таким объёмом работы без наших способных младших студентов?"
212190-249 = ""
212190-251 = ""
212190-252 = "Так что прошу вас: встанете со мной в строй?"
212190-253 = ""
212190-255 = ""
212190-256 = "Хмф! А мне что, можно отказаться?"
212190-257 = ""
212190-259 = ""
212190-260 = ""
212190-261 = ""
212190-262 = "Спасибо вам всем..."
212190-264 = ""
212190-265 = "Вечная борьба... Возможно, слишком громкие слова."
212190-266 = "Но свобода именно такова."
212190-267 = "Свобода никогда не бывает абсолютной, а борьба за её защиту никогда не закончится."
212190-268 = ""
212190-270 = ""
212190-271 = "Быть «свободным»..."
212190-272 = "Значит не бежать от ответственности. Думать своей головой и противостоять несправедливости."
212190-273 = "Моя..."
212190-274 = "..."
212190-275 = "Нет."
212190-276 = "НАША Геенна всегда была и будет землёй СВОБОДЫ!"
212190-277 = ""
212190-279 = ""
212190-280 = ""
212190-281 = "Так что вперёд, солдаты! Шумите, веселитесь и наслаждайтесь жизнью от души!"
212190-282 = "Ведь я, Ханума Макото, возьму на себя ответственность за наших студентов!"
212190-283 = ""
212190-286 = ""
212190-287 = "Ух ты! Речь, какую раз в жизни услышишь!"
212190-288 = "Но рейтинг просмотров составил 0,3%!"
212190-289 = ""
212190-291 = ""
212190-292 = "ЧТО? ПОЧЕМУ?!"
212190-293 = ""
212190-295 = ""
212190-296 = ""
212190-297 = "В общем-то, всё вернулось на круги своя. И это тоже часть свободы Геенны."
212190-298 = "Пожалуй, я даже рада, что ничего не изменилось."
212190-299 = "Несмотря ни на что, жизнь продолжается."
212190-300 = "Ц! Подумать только, они пропустили великое изложение моей философии, которую будут изучать ещё многие поколения!"
212190-301 = "[s] «Я прекрасно всё расслышал, Макото»."
212190-302 = ""
212190-304 = ""
212190-305 = "Ого! Сенсей!"
212190-306 = "Разумеется, вы понимаете мои благородные идеалы! И вновь доказываете, чего стоите, Сенсей."
212190-307 = "Хотя, возможно, это и нескромно, но я ещё не встречала лидера благороднее себя. Соперничать со мной может разве что грозный председатель, правящий ледяными землями Красной Зимы."
212190-308 = "[s] «...Что-что?»"
212190-309 = "Не время скромничать, Сенсей. Вы ведь наверняка понимаете: великий час близок."
212190-310 = "Своим громогласным обличением я сокрушила зловещую руку прошлого, столь долго пытавшуюся управлять будущим Геенны, словно кукловод!"
212190-311 = "Наследие Геенны будет жить в будущем Кивотоса, прокладывая пылающий путь славы и свободы."
212190-312 = "И в этот миг триумфа совершенно естественно заложить основы нашего вечного союза!"
212190-313 = ""
212190-316 = "[ns] «Спасибо, Макото»."
212190-317 = ""
212190-318 = "[ns1] «Благодаря тебе мы преодолели этот кризис».\n[ns2] «Спасибо тебе как твой учитель и наставник»."
212190-321 = "...Ух."
212190-322 = "С-Сенсей... Так нечестно... Смотреть на меня таким взглядом..."
212190-323 = ""
212190-325 = ""
212190-326 = ""
212190-327 = "Я доставила вам немало неприятностей."
212190-328 = "...Если начистоту, я храбрилась как обычно, потому что пыталась уйти от этой темы..."
212190-329 = "Но на этот раз... Даже не знаю, можно ли загладить причинённый мной вред, и физический, и душевный."
212190-330 = "Как искупить то, что я угрожала вам, удерживала вас силой, доставляла неприятности... и совершила множество других проступков?"
212190-331 = "...Что мне сделать?"
212190-332 = "Что нужно, чтобы моего извинения было достаточно?"
212190-333 = "[s] «Пообещай мне всегда оставаться собой, Макото»."
212190-334 = "...?!"
212190-335 = "Что... вы имеете в виду?"
212190-336 = "И всё? Вы именно это и имели в виду? Я же говорю, что не понимаю!"
212190-337 = "[s] «Тогда это твоё домашнее задание»."
212190-338 = ""
212190-341 = "[ns] «Разберись, что это значит лично для тебя»."
212190-342 = "..."
212190-343 = "Если я останусь верна себе... этого хватит?"
212190-344 = "Вы хотите, чтобы я задумалась... о том, кто я такая?"
212190-345 = "...С вами никогда не бывает просто. Вы постоянно заставляете меня «заглянуть в себя»."
212190-346 = ""
212190-348 = ""
212190-349 = "Я буду бережно хранить это домашнее задание всем сердцем и душой."
212190-350 = "И как Ханума Макото из Геенны я должна сделать заявление."
