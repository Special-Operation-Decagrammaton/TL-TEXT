212190-181 = "Exactly! It has nothing to do with the Kaiser.#nWe're going to rebuild Gehenna in our own way."
212190-182 = "That's what the Gehenna Rebuilding Committee is from now on."
212190-188 = "Heh! Yo, Prefect Prefect!"
212190-196 = "Um, the plaza was enough, so you didn't have to come all the way here..."
212190-197 = "……Prefect Prefect, you still don't look well."
212190-201 = "……Iori, Chinatsu. #nThe feeling of the moment I shot you... it still lingers in my hands."
212190-205 = "Those eyes, calling out to me while fighting desperately... I remember it all."
212190-206 = "……!"
212190-207 = "As the Prefect Prefect—and as a senior—I did something I absolutely should never have done."
212190-208 = "I promised to protect you, yet I was the one who inflicted the deepest wounds."
212190-209 = "……I'm truly sorry. #nI know there are no words that can wipe away my mistakes."
212190-214 = "I apologize as well. #nI don't expect to be easily forgiven for trampling on the sincerity of my underclassmen."
212190-218 = "……It hurt. It hurt so much. #nThe bullets, sure, but more than that—"
212190-219 = "Those cold eyes looking at us... that hurt dozens of times more than the bullets. #nIt felt like a hole had been punched in my chest..."
212190-220 = "…………."
