212190-95 = "She's the one who suggested attacking Kivotos, right...?"
212190-96 = "That's right! It was me, Lady Makoto Hanuma!"
212190-97 = "This whole ridiculous mess—"
212190-101 = "I, in my foolishness, was danced around by the ghost of the Kaiser and caused this!!"
212190-106 = "Is she allowed to say that!?"
212190-108 = "Makoto..."
212190-109 = "It's a pathetic story, but I, Makoto, the pinnacle of Gehenna, was swayed by an old, dusty plan and ordered you all to take up arms!"
212190-110 = "This is my fault—and my defeat!#nI apologize! I am sorry!!"
212190-116 = "……Even her apology is loud."
212190-117 = "Hehe... that's so like Makoto."
212190-118 = "But Hina Sorasaki is different!"
212190-119 = "She fought desperately to protect Gehenna until the very end!"
212190-120 = "She may have stood in your way at times.#nBut that was because this foolish President couldn't make a sound judgment!"
