212190-145 = "Yeah, that's the Gehenna we know!!"
212190-146 = "[ns] \"Even her apology is so Makoto...\""
212190-148 = "……Well, the result is... not a bad atmosphere."
212190-149 = "Yeah."
212190-150 = "……Thanks to that, I feel like a weight has been lifted off my shoulders."
