[translation]
51040-1 = "Эпизод 4; Из Клуба Инь-Ян"
51040-2 = "Комната Клуба Инь-Ян"
51040-4 = "Рада, что вы проделали весь путь сюда, Сенсей."
51040-5 = "Приятно снова вас видеть, ня-ха-ха!"
51040-6 = "Добро пожаловать в Хяккияко."
51040-7 = "Здравствуйте, Сенсей..."
51040-8 = "[s] «Давно не виделись, все.»"
51040-9 = "Да... Пожалуй, прошло уже немало времени."
51040-10 = "Есть..."
51040-11 = ""
51040-13 = ""
51040-15 = "Бездна времени стала широка..."
51040-16 = "Улыбка Сенсея меркнет,"
51040-17 = "потерянная моей слабой памятью."
51040-18 = "Теперь сияет вновь."
51040-19 = ""
51040-21 = ""
51040-22 = "Х-Хайку Чисэ!"
51040-23 = "Нужно это записать!"
51040-24 = "[s] «Эм, д-да. Когда такое говорит Чисэ, уже как-то не до смеха.»"
51040-26 = "...?"
51040-27 = "[s] «Ч-Чисэ?!»"
51040-28 = "Ня-ха-ха! Что ж, если отвлечься от поэзии Чисэ..."
51040-29 = "У нас в Хяккияко жизнь тоже была довольно насыщенной."
51040-30 = "Isn't that so, Kaho?"
51040-32 = "Верно. Восстановление повреждённой инфраструктуры, распределение экстренного финансирования для ремонта общежитий и другие проекты... В целом восстановительные работы всё ещё продолжаются."
51040-33 = "[s] «Похоже, вам пришлось нелегко.»"
51040-34 = "Ах, Кахо, не утомляй Сенсея после такой долгой дороги сюда."
51040-35 = "В последнее время Хяккияко занимается не только восстановлением..."
51040-36 = "Например, этим фестивалем, который мы проводим."
51040-37 = "[s1] «По дороге сюда я видел подготовку к фестивалю.»\n[s2] «Я слышал, Шизуко всё организовала...»"
51040-40 = "Вот как..."
51040-41 = "Тогда перейдём к сути. Да, Шизуко очень усердно работала, чтобы всё получилось."
51040-42 = ""
51040-44 = ""
51040-45 = "Когда приближается новый фестиваль, она слегка сходит с ума. По крайней мере, скучно не бывает."
51040-46 = "...Нет, я хотела сказать, что горжусь ею."
51040-47 = "[s] «А, да... Конечно.»"
51040-48 = "Похоже, Шизуко уже давно хотела возродить Фестиваль фонарей Хяккияко. Хотя его перестали проводить два десятилетия назад."
51040-49 = "Что ж, думаю, момент она выбрала удачно."
51040-50 = "Ния, когда ты так говоришь, звучит двусмысленно..."
51040-51 = "Да брось, Кахо. Нельзя отрицать, что время было идеальным."
51040-52 = ""
51040-54 = ""
51040-55 = "[ns] «...И что это должно значить?»"
51040-56 = "Ну разве не удобно, что Шизуко хочет возродить фестиваль, который идеально подходит для нынешней ситуации?"
51040-57 = "Какой подходящий первый шаг для Хяккияко посреди всех этих восстановительных работ. Разве это не покажет всем, что впереди нас ждёт великое будущее?"
51040-59 = "Хотя мне кажется, что Ния немного преувеличивает..."
51040-60 = "Но мы все согласны, что Хяккияко давно нужно было что-нибудь, чтобы развеять эту мрачную атмосферу в академии."
51040-62 = "Ничто так не прогоняет хандру и не возвращает улыбки студентам, как фестиваль!"
51040-63 = "Хорошо, когда цели сами себя оправдывают."
51040-64 = "Чисэ, ты ведь допоздна не спишь и репетируешь к концерту, да? Я так тобой горжусь!"
51040-66 = "Да... Я тоже... стараюсь..."
51040-67 = "Ч-Чисэ!"
51040-69 = "Ня-ха-ха! Вы все заставляете меня так вами гордиться!"
51040-70 = "В последнее время у всех было полно работы, так что надеюсь, в этот раз Ния сама справится со своими обязанностями..."
51040-71 = "Ах... Только настроение стало таким хорошим..."
51040-72 = "Ну какая же ты злюка, Кахо, говорить такие жестокие вещи ни с того ни с сего... *хнык* *хнык*"
51040-73 = ""
51040-75 = ""
51040-76 = ""
51040-78 = "Ния, будет очень неудобно, если ты сейчас сбежишь..."
51040-79 = ""
51040-82 = ""
51040-83 = "Ня-ха-ха... В-вот как?"
51040-84 = "Ну, в любом случае, надеюсь, Сенсей сможет как следует насладиться фестивалем, ня-ха-ха!"
51040-85 = "И было бы ещё лучше, если бы вы заодно поддержали Шизуко!"
51040-86 = "[s] «...А?»"
51040-87 = "Что такое?"
51040-88 = "О, точно. Кажется, я и правда говорила, что вы можете погладить Чисэ."
51040-89 = "Мяу?"
51040-90 = "[s] «...Вы хотели спросить меня о чём-то ещё?»"
51040-91 = "Ох, Сенсей, с таким подозрением смотреть на своих милых студентов..."
51040-92 = "Мысль о том, что мы позвали вас сюда лишь потому, что нам что-то нужно, очень меня огорчает. *хнык*"
51040-93 = "Я так стараюсь, чтобы Сенсей считал меня человеком, которому можно доверять, но этого всё мало. *хнык*"
51040-94 = "[s] «П-Прости. Это было очень грубо с моей стороны...»"
51040-95 = "Ну... Есть одна крошечная вещь, которая меня беспокоит."
51040-96 = "[s] «Так тебе всё-таки что-то ещё нужно!»"
51040-97 = ""
51040-99 = ""
51040-100 = ""
51040-102 = ""
51040-105 = "Ния, это..."
51040-106 = ""
51040-110 = "Да, Кахо думает, что это, скорее всего, чья-то шутка."
51040-111 = "Но я решила рассказать об этом, раз уж вы приехали на фестиваль."
51040-112 = "[s] «...Письмо?»"
51040-113 = "Клуб Инь-Ян получил его на днях."
51040-114 = ""
51040-118 = "Отправители называют себя «Красота природы»."
51040-119 = "Это городская легенда. Клуб, существующий лишь в пересудах и слухах... Можно сказать, письмо словно пришло из другого времени."
51040-120 = "[s] «Городская легенда под названием „Красота природы“?»"
51040-122 = "По правде говоря, даже в Хяккияко истории о «Красоте природы» знают лишь немногие."
51040-123 = "Шёпот, слухи, страшилки, которые рассказывают друг другу на ночёвках. А если выразиться ещё более сенсационно..."
51040-124 = ""
51040-129 = "Это авторы «Ста историй о призраках», которые передаются из поколения в поколение."
51040-130 = "Одни называют их злодейским клубом, восставшим против альянса Хяккияко, другие утверждают, что это чудовища, околдовывающие людей странными фолиантами..."
51040-131 = "И они прислали угрозу именно Клубу Инь-Ян!"
51040-132 = "[s] «Как страшно... Что написано в письме?»"
51040-133 = "Я вам прочитаю."
51040-135 = "«Пусть все заблудшие души внемлют нашим словам»."
51040-136 = "«Нашему славному досугу скоро придёт конец, ибо некоторые чувства обретают истинный смысл лишь тогда, когда ими наслаждаются вместе»."
51040-137 = "«Когда настанет час веселья и ваши глаза засияют от цветов, распускающихся в небесах,»"
51040-138 = ""
51040-141 = "[log=니야]«Красота природы» вновь явит себя.[/log]"
51040-145 = "Вот и всё."
51040-146 = "Ния, это письмо..."
51040-147 = "Именно, Кахо. Обычное расплывчатое послание с угрозами."
51040-148 = "Ничего удивительного. Во время крупных мероприятий такое случается постоянно."
51040-149 = "Isn't that so, Kaho?"
51040-150 = ""
51040-152 = ""
51040-153 = ""
51040-154 = "...Да. Всё именно так, как сказала Ния."
51040-155 = "Например, якобы приказы Генерального студенческого совета отменить фестиваль, если мы не выдадим Моурё больше талонов для киосков."
51040-156 = "...Или звонки официальным тоном с требованием назначить Моурё судьями фестиваля... Честно говоря, в основном это их розыгрыши."
51040-157 = "[s] «Они делают так на каждом фестивале? Звучит хлопотно.»"
51040-159 = "Разумеется, это внутреннее дело. Не стоит из-за такого бежать к Сенсею и втягивать Шале."
51040-160 = "Ня-ха-ха! Мы бы никогда не стали беспокоить вас подобным. Правда ведь, Кахо?"
51040-161 = "Ну, это..."
51040-162 = "Да, Ния права."
51040-163 = "[s] «Я не против вам помочь.»"
51040-164 = "Что ж, рада это слышать, но обычно такими ситуациями всё равно занимается Хяккарёран."
51040-165 = "Но затем Хяккарёран прекратил деятельность после исчезновения президента и вице-президента."
51040-166 = "А вдобавок..."
51040-167 = ""
51040-170 = "Буквально на днях Хяккарёран официально опубликовал Декларацию о роспуске."
51040-171 = ""
51040-176 = "Погодите, это не сходится. Мне говорили, что они больше не патрулируют академию — после того как им приказали распуститься или что-то вроде того."
51040-177 = ""
51040-179 = ""
51040-181 = "Нет!"
51040-183 = "[ns] «...Так Хяккарёран и правда распустили?»"
51040-184 = "После исчезновения руководства клуб больше не может продолжать свою деятельность..."
51040-185 = "А может, кто-то решил, что больше нет смысла его сохранять."
51040-186 = "На данный момент трудно представить способ официально предотвратить их роспуск."
51040-187 = "...Интересно, чем они сейчас занимаются."
51040-188 = "Это лишь вопрос времени, когда Моурё обнаружат, что их главного препятствия больше нет."
51040-189 = "Поэтому я и надеялась, что Сенсей из Шале сможет какое-то время побыть здесь и подменить Хяккарёран..."
51040-190 = "Конечно, заодно вам стоит насладиться фестивалем. Я не шутила, когда это говорила."
51040-191 = "[s] «Рад, что ты, как всегда, честна, Ния.»"
51040-192 = "Ня-ха-ха! С вами я всегда честна!"
51040-193 = "Конечно, кто-то может сказать, что эгоистично сейчас взваливать на Сенсея ещё больше работы..."
51040-194 = "Но в такие времена приходится использовать все доступные ресурсы."
51040-195 = "Какая морока... То есть, я изо всех сил стараюсь как президент Клуба Инь-Ян."
51040-196 = "И если ради этого Сенсею придётся увидеть мою коварную сторону — пусть так."
51040-197 = "[s] «Да, вот это уже больше похоже на Нию.»"
51040-198 = "Сенсей..."
51040-199 = "Ня-ха-ха. Вы разочарованы моими скрытыми мотивами?"
51040-200 = "[s3] «Ты называешь себя интриганкой, но работаешь ради всех в Хяккияко.»\n[s4] «Я не удивлён, что у тебя такие добрые намерения, Ния.»"
51040-203 = "Ох, вы хотите сказать, что я лицемерка?"
51040-204 = "[s] «А?! Я вовсе не это имел в виду!»"
51040-205 = "...Что ж, Сенсей, возможно, мне не стоит этого говорить."
51040-206 = "Но если вы продолжите соглашаться на все безумные просьбы, однажды вы об этом пожалеете."
51040-207 = "Вот даже сейчас вы понятия не имеете, не замышляю ли я чего-нибудь."
51040-208 = "Иногда вы правда заставляете меня волноваться, знаете ли?"
51040-209 = "[s] «Почему ты говоришь это уже после того, как я согласился помочь?!»"
51040-210 = "Ня-ха-ха! Не переживайте, мы очень благодарны, что вы нам поможете!"
51040-211 = "Правда ведь, Чисэ? Кахо?"
51040-213 = "Конечно..."
51040-214 = "...Мы будем очень признательны за любую помощь Сенсея."
51040-215 = "Сенсей... вы ведь пробудете здесь ещё какое-то время, да?"
51040-216 = "Тогда я смогу показать вам, что сегодня репетирую..."
51040-217 = ""
51040-219 = ""
51040-220 = "Репетиция Чисэ!"
51040-221 = "Невероятная честь — увидеть её вживую!"
51040-223 = "Ня-ха-ха, значит, Сенсей всё-таки согласен выполнить нашу просьбу."
51040-224 = "Следующий шаг..."
51040-225 = ""
51040-229 = "П-Пождите-е-е-е!"
51040-230 = ""
51040-232 = ""
51040-234 = ""
51040-237 = "Я слышала эти рассказы!"
51040-238 = ""
51040-241 = "Я — Юкари!"
51040-244 = ""
51040-245 = ""
51040-246 = "Первокурсница-элита и гордый член Совета урегулирования Хяккарёран!"
51040-247 = "Президент Клуба Инь-Ян, выслушайте мою просьбу!"
51040-248 = ""
51040-250 = ""
51040-252 = ""
51040-253 = "...А."
51040-255 = "Следующий эпизод;Появление самопровозглашённой элитной девушки!"
