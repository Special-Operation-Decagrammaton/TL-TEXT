[translation]
51040-1 = "Episódio 4;No Clube Yin-Yang"
51040-2 = "Sala do Clube Yin-Yang"
51040-4 = "Sensei, sinto muito fazê-lo vir até aqui~"
51040-5 = "Fico feliz em vê-lo novamente, nyaha."
51040-6 = "Bem-vindo ao Clube Yin-Yang."
51040-7 = "Oiê, Sensei."
51040-8 = "[s] \"Quanto tempo, pessoal.\""
51040-9 = "Pois é... Já se passou bastante tempo desde aquele dia, não é?"
51040-10 = "Uhum~"
51040-15 = "Na névoa fina,"
51040-16 = "O rosto do Sensei"
51040-17 = "Me vem à mente."
51040-18 = "Até agorinha, eu tinha esquecido~"
51040-22 = "U-Um haicai da Chise-chan...!"
51040-23 = "Preciso registrar isso...!"
51040-24 = "[s] \"Ahaha... Quando vem da Chise, não soa como brincadeira...\""
51040-26 = "...?"
51040-27 = "[s] \"É-É brincadeira, né?!\""
51040-28 = "Nyahaha. Deixando os comentários da Chise de lado..."
51040-29 = "Os dias em Hyakkiyako têm sido bem corridos desde então."
51040-30 = "Não é mesmo, Kaho?"
51040-32 = "Sim. A restauração da infraestrutura, a elaboração do orçamento emergencial para reconstruir os dormitórios...#nNenhum desses trabalhos foi concluído ainda."
51040-33 = "[s] \"Vocês continuam ocupadas como sempre...\""
51040-34 = "Nyaha, que isso, Kaho~#nJá que o Sensei veio nos visitar, relaxe um pouco, fique à vontade~"
51040-35 = "Ultimamente temos outros assuntos além dos trabalhos de reconstrução, não temos?"
51040-36 = "Por exemplo... sobre o festival que vai acontecer em breve?"
51040-37 = "[s1] \"Se for sobre isso, eu vi no caminho para cá.\"\n[s2] \"Parece que a Shizuko está preparando tudo...\""
51040-40 = "Então isso agiliza bastante a conversa."
51040-41 = "Como você disse, a Shizuko-san está se esforçando muito mesmo~"
51040-45 = "A Shizuko-san se joga de cabeça sem pensar nas consequências quando o assunto é festival, então nunca fico entediada de observar—"
51040-46 = "—Quero dizer, eu acho isso absolutamente maravilhoso."
51040-47 = "[s] \"Ah, sim... É-É verdade.\""
51040-48 = "Nyahaha. Pelo jeito, a Shizuko-san sempre quis reviver o \"Festival das Lanternas de Hyakkiyako\"."
51040-49 = "Bem, para nós isso também vem bem a calhar, digamos assim~"
51040-50 = "Niya-sama, falar desse jeito..."
51040-51 = "Ora, Kaho... Mas é a pura verdade, não é?"
51040-55 = "[ns] \"Hum... O que você quer dizer com isso?\""
51040-56 = "O Festival das Lanternas que a Shizuko-san quer reviver se encaixa perfeitamente na nossa situação atual."
51040-57 = "Podemos dizer que é a oportunidade perfeita para Hyakkiyako, que tem vivido só de trabalhos de reconstrução, recuperar seu ânimo, não acha~?"
51040-59 = "As palavras da Niya-sama são um pouco diretas demais, mas..."
51040-60 = "É fato que Hyakkiyako inteira perdeu o ânimo...#nTodos sentem que precisamos de algum impulso para mudar isso."
51040-62 = "Pensei que, com esse festival, talvez tudo ficasse mais animado~ e pudéssemos trazer o sorriso de volta ao rosto de todos~"
51040-63 = "A Shizuko-san realmente nos deu um ótimo pontapé inicial."
51040-64 = "Ultimamente a Chise também tem ensaiado todas as noites para a nova apresentação, não é~?#nHum~ Maravilhoso!"
51040-66 = "Uhum~, eu também vou me esforçar~"
51040-67 = "Ch-Chise-chan...!"
51040-69 = "Nyahahaha~, muito bem, muito bem!"
51040-70 = "Sim, e como o volume de trabalho aumentou junto com isso... espero que a Niya-sama se dedique ainda mais do que antes. Entendido?"
51040-71 = "Aah~, assim você estraga o clima agradável que estava aqui agora há pouco."
51040-72 = "Dizer uma coisa tão assustadora... Como você é cruel, Kaho, buá buá."
51040-78 = "Niya-sama, pelo menos desta vez, não vai fugir, né...?#nEu realmente, realmente ficaria em apuros."
51040-83 = "Nyaha~... Do que será que está falando?"
51040-84 = "Enfim, deixando isso de lado. Já que está aqui, espero que o Sensei também aproveite o festival."
51040-85 = "Ah, verdade. A Shizuko-san ficaria bem feliz se você fosse dar um oi para ela, não acha~?"
51040-86 = "[ns] \"...Hum?\""
51040-87 = "Nyaha, aconteceu alguma coisa?"
51040-88 = "Ah, sim, claro. Sobre aquele assunto que mencionei...#nGostaria de fazer carinho na Chise-nyan antes de ir?"
51040-89 = "Miau?"
51040-90 = "[s] \"Seria ótimo se fosse só isso...\""
51040-91 = "Ora, ora. Lançar um olhar tão desconfiado para uma aluna tão fofinha e adorável..."
51040-92 = "Isso me deixa tão triste, buá buá."
51040-93 = "Eu me esforço tanto para conquistar a confiança do Sensei...#nSerá que estou passando uma má impressão?"
51040-94 = "[s] \"Ah, d-desculpa...\""
51040-95 = "...Bem, na verdade tem uma coisinha que eu gostaria de colocar a par."
51040-96 = "[s] \"Eu sabia que ia dar nisso...\""
51040-105 = "Niya-sama, isso é..."
51040-110 = "Pois é, a Kaho disse que provavelmente é só uma brincadeira de mau gosto, mas..."
51040-111 = "Achei que... por via das dúvidas, deveria contar ao Sensei."
51040-112 = "[s] \"...Isso é uma carta?\""
51040-113 = "Sim. Chegou ao Clube Yin-Yang há alguns dias."
51040-118 = "O remetente é... o \"Clube Beleza da Natureza\"."
51040-119 = "Acredite ou não, é um clube que só existe em uma lendária \"história de terror\"...#nOu seja, uma carta enviada através das eras♪"
51040-120 = "[s] \"História de terror...?\""
51040-122 = "O Clube Beleza da Natureza é um clube cuja existência só circula em boatos entre alguns estudantes de Hyakkiyako."
51040-123 = "É como uma lenda urbana ou fofoca... Não, para usar um termo mais apropriado..."
51040-129 = "\"Hyakumonogatari\" — por assim dizer."
51040-130 = "Eles são chamados — ou não — de \"um clube perverso que rejeita a atual forma de aliança de Hyakkiyako\" ou \"espíritos malignos que manipulam livros macabros para ludibriar as pessoas\"..."
51040-131 = "E uma suposta \"carta de ameaça\" desse tal clube chegou endereçada a nós, do Clube Yin-Yang."
51040-132 = "[s] \"Pela explicação parece bem assustador... O que diz a carta?\""
51040-133 = "O conteúdo é o seguinte:"
51040-135 = "<A vocês, nós anunciamos>"
51040-136 = "<Nossa elegância jamais chegou ao fim; a verdadeira beleza deve ser apreciada por muitos>"
51040-137 = "<Quando a diversão começar e erguerem os olhos para a grande flor que desabrochar no céu —>"
51040-141 = "[log=니야]<Mais uma vez — iremos visitá-los>[/log]"
51040-145 = "—E esse é o conteúdo da carta."
51040-146 = "Niya-sama, isso..."
51040-147 = "Sim — uma típica carta de aviso."
51040-148 = "Não acho que precisemos exagerar nas medidas de segurança, sabe.#nIsso acontece direto quando tem algum grande evento."
51040-149 = "Não é, Kaho?"
51040-154 = "...Sim, a Niya-sama tem razão."
51040-155 = "Coisas como cancelar o festival em nome do Conselho Estudantil Geral, ou então em nome de Schale, ou exigir que distribuam mais cupons para a Trupe Chimi durante o festival."
51040-156 = "...A maioria são trotes — digo, cartas vindas da Trupe Chimi, que acabou pegando gosto por brincar de autoridade."
51040-157 = "[s] \"...Não é à toa que vocês andam tão ocupadas.\""
51040-159 = "Claro, tudo isso são apenas assuntos internos de Hyakkiyako.#nNão é nada grave a ponto de ficarmos choramingando para o Sensei de Schale~"
51040-160 = "Nyahaha, não poderíamos incomodá-lo tanto assim... né, Kaho?"
51040-161 = "Isso..."
51040-162 = "Sim, você tem razão."
51040-163 = "[s] \"Por mim não tem problema nenhum.\""
51040-164 = "Agradeço a gentileza, mas... nesses casos, o normal seria a Hyakkaryouran cuidar da situação—"
51040-165 = "Porém, como você sabe, desde que a Presidente e a Vice-Presidente desapareceram, as atividades da Hyakkaryouran estão praticamente paralisadas."
51040-166 = "E, finalmente, ontem..."
51040-170 = "A Hyakkaryouran emitiu oficialmente uma \"ordem de dissolução\"—"
51040-176 = "Não, não pode ser.#nOuvi dizer que estão suspensas por causa da tal \"ordem de dissolução\"."
51040-181 = "Não!"
51040-183 = "[ns] \"É verdade que a Hyakkaryouran vai se dissolver?\""
51040-184 = "Sim. Com o desaparecimento da Presidente e de sua substituta, disseram que ficou difícil manter o comitê..."
51040-185 = "Talvez já tenham decidido que \"não há mais necessidade de mantê-lo\"."
51040-186 = "Uma vez emitida a ordem de dissolução, o Clube Yin-Yang também terá que dar andamento aos trâmites."
51040-187 = "...Francamente, o que será que todo mundo anda pensando?"
51040-188 = "...Bem, às vezes dá vontade de desabafar um pouco.#nNyahaha, será que é só questão de tempo até a Trupe Chimi perceber~?"
51040-189 = "Enfim, estamos com um mooonte de problemas.#nPor isso, gostaria que o Sensei preenchesse a lacuna deixada pela Hyakkaryouran."
51040-190 = "Claro, eu realmente quero que você aproveite o festival também."
51040-191 = "[s] \"Você é bem sincera, Niya.\""
51040-192 = "Hufufu, sim."
51040-193 = "Mas sei que, fazendo tantos pedidos egoístas assim, não posso reclamar se me achar interesseira, né?"
51040-194 = "É que, diante da situação, prefiro tomar todas as precauções possíveis, digamos assim."
51040-195 = "Para ser sincera, dá trabalho... quero dizer, quero dar o meu melhor para cumprir meu dever como presidente do clube~"
51040-196 = "Se for por isso, não me importo nem um pouco em abrir o jogo com o Sensei."
51040-197 = "[s] \"É, acho que isso é bem o seu jeito.\""
51040-198 = "...Sensei."
51040-199 = "Nyahaha!#nQuer dizer que está decepcionado comigo por eu viver tramando esquemas~?"
51040-200 = "[s3] \"Você fala desse jeito, mas no fundo está sempre pensando em todos...\"\n[s4] \"Acho que isso é bem a cara da Niya.\""
51040-203 = "Ora, ora~? Está dizendo que eu tenho duas caras...?"
51040-204 = "[s] \"Ei, não foi isso que eu quis dizer?!\""
51040-205 = "...Bem, talvez não caiba a mim dizer isso, mas..."
51040-206 = "Se continuar cedendo aos caprichos dos outros desse jeito, vai acabar se metendo em uma grande encrenca um dia desses, viu?"
51040-207 = "Afinal, não dá para descartar a possibilidade de eu ainda estar escondendo alguma coisa~"
51040-208 = "Até eu fico um pouquinho preocupada com isso."
51040-209 = "[s] \"Vou manter isso em mente, mas ainda quero te ajudar, Niya.\""
51040-210 = "Ora, disposto a me ajudar assim!#nQue alívio enorme."
51040-211 = "Não é, Chise? Kaho?"
51040-213 = "Uhum. Ajuda muito~"
51040-214 = "Sem dúvida, fico muito grata, mas..."
51040-215 = "Sensei, você ainda vai ficar por aqui, né~?"
51040-216 = "Vou te mostrar o ensaio de hoje~"
51040-220 = "O ensaio da Chise-chan...!"
51040-221 = "Poder assistir tão de perto assim... Aah!"
51040-223 = "Nyaha~, já que conseguimos a resposta do Sensei hoje..."
51040-224 = "Agora só falta—"
51040-229 = "—Aguardem um instante!!!!!"
51040-237 = "Eu ouvi toda a conversa!"
51040-241 = "Meu nome é Yukari!"
51040-246 = "Sou uma aluna do primeiro ano do orgulhoso Comitê de Mediação de Conflitos Hyakkaryouran e a mais forte integrante de elite!"
51040-247 = "Vim até aqui pois tenho um assunto urgente para tratar com a Presidente do Clube Yin-Yang!"
51040-253 = "...Hã?"
51040-255 = "Próximo;A Garota Autoproclamada Elite Entra em Cena!"
