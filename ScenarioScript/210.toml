[translation]
210-1 = "Злобное пляжное преступление"
210-3 = "Я вернулась, Сенсей. Хи-хи-хи!"
210-4 = "Хм, вы не особо удивлены меня видеть."
210-5 = "Похоже, вы уже привыкли, что я появляюсь из ниоткуда, да, Сенсей? Отлично. *хрум-хрум*"
210-6 = "В общем. *хрум* Причина, почему я здесь..."
210-7 = "Знаете ту сбежавшую заключённую из Исправительного бюро? Так вот, её заметили — она устроила проблемы дальше по побережью."
210-8 = "Что-то про угнанный ховеркрафт. Или ховеркрафт устроил погром...? Не знаю. Подробности меня утомляют."
210-9 = "Так или иначе, *хрум-хрум*, пора Шале вмешаться."
210-10 = "Но вы, наверное, уже и сами это знали, да, Сенсей? Ну конечно знали."
210-11 = "Просто идите вдоль пляжа и ориентируйтесь на звуки хаоса. Уверена, справитесь."
210-12 = "А я присмотрю за всем отсюда. Мне вполне хватает развлечения в виде этой пачки крекеров с икрой трески. *хрум-хрум*"
210-13 = ""
210-14 = ""
210-16 = ""
210-17 = "Удаты, Шеншей!"
