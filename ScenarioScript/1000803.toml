[translation]
1000803-1 = "Навестить заболевшую Нэру"
1000803-2 = "Комната Нэру"
1000803-3 = "..."
1000803-4 = "Ургх."
1000803-5 = "Апчхи-и-и!"
1000803-6 = "*вздох* Чёрт."
1000803-7 = "Простуда... Я не болела простудой, кажется, с начальной школы."
1000803-8 = "Апчхи-и-и!"
1000803-9 = "Угх... Отстой!"
1000803-10 = "Это плохо. У меня и так посещаемость ужасная."
1000803-11 = "*динь-дон*"
1000803-12 = "Угх..."
1000803-13 = "Кто там...? Я сейчас слишком больна."
1000803-14 = "*динь-дон*"
1000803-15 = "Уходи!"
1000803-16 = "Если газета или продавец — проваливайте!"
1000803-18 = "*динь-дон* *динь-дон*"
1000803-19 = "...Ну ладно."
1000803-20 = "Кто бы ты ни был, смелости тебе не занимать."
1000803-26 = "*динь-дон* *динь-дон* *динь-дон* *динь-дон* *динь-дон* *динь-дон* *динь-дон* *динь-дон*"
1000803-27 = "Всё. Это война."
1000803-28 = "Не двигайся! Сейчас вынесу мусор!"
1000803-29 = ""
1000803-30 = "*бах*"
1000803-31 = ""
1000803-32 = "Посмотрим на твою рожу, прежде чем я её размажу... Что за?!"
1000803-33 = "[s] «Привет»."
1000803-34 = "С-Сенсей! Что ты здесь делаешь?"
1000803-35 = "А? Ты услышал, что я заболела?!"
1000803-36 = "Это сообщение было для Аканэ! Я что, случайно отправила его тебе? Чёрт!"
1000803-37 = "Угх, я облажалась... Простуда совсем мозги размягчила!"
1000803-38 = "..."
1000803-39 = ""
1000803-41 = "(*вздох* Не могу поверить, что позволяю Сенсею видеть меня такой.)"
1000803-42 = "(Хорошо хоть я не в пижаме — вчера вырубилась сразу...)"
1000803-43 = ""
1000803-45 = "Н-Ну, раз уж пришёл, не стой там."
1000803-46 = "...Заходи."
1000803-48 = "*вздыхает*"
1000803-49 = "Полного объяснения не нужно."
1000803-50 = "Мы уже проходили это раньше, так что скажу коротко."
1000803-51 = "Сенсей, если хоть одно слово о том, что я простудилась, выйдет наружу..."
1000803-52 = "[s] «Можешь не продолжать. Я могила.»"
1000803-53 = "П-Правильно. Хорошо. Быстро учишься."
1000803-54 = "Причина, почему я не хочу, чтобы об этом узнали..."
1000803-55 = "[s] «Ты хочешь казаться сильной, а такой слух испортит репутацию.»"
1000803-56 = "..."
1000803-57 = "Н-Неправда! Ну, что-то вроде того, но всё не так! Совсем не так!"
1000803-58 = "Я лучший секретный агент Миллениума."
1000803-59 = "Эм... Н-Ну..."
1000803-60 = "[s1] «Я сохранил в тайне твою уборку.»\n[s2] «Я сохранил в тайне твою игру в банки.»"
1000803-61 = "..."
1000803-62 = "..."
1000803-63 = "У-Угх... Как бесит!"
1000803-64 = "Не знаю почему, но это реально действует мне на нервы! А-а-а-ргх!"
1000803-65 = "[s] Передать ей пакет с лекарствами и едой."
1000803-67 = "А? Что это?"
1000803-68 = ""
1000803-69 = "*шорох*"
1000803-70 = "Лекарство и каша..."
1000803-71 = "Хе. К-Конечно, Сенсей. Ты пришёл позаботиться обо мне."
1000803-72 = "Я почти никогда не болею, так что лекарств дома не было."
1000803-73 = "Спасибо, что купил. Давай сюда."
1000803-74 = "То есть я сейчас выпью это, немного посплю и смогу вернуться в школу, да...?"
1000803-75 = "Подождите."
1000803-76 = "Это клубничное лекарство от простуды для маленьких детей!"
1000803-77 = "[s] «Ты предпочла бы вишнёвое?»"
1000803-78 = "Да не в этом проблема!"
1000803-79 = "Угх. Жар снова поднялся... Вдох. Выдох. Успокойся."
1000803-80 = "Эффект, наверное... тот же, даже если это детское лекарство."
1000803-81 = ""
1000803-82 = ""
1000803-83 = "*глоток* *глоток*"
1000803-84 = "Фу... Что они вообще сюда кладут?"
1000803-85 = "...Я немного полежу."
1000803-86 = "Кашу съем потом. Поставь в холодильник."
1000803-87 = "И ещё..."
1000803-88 = "(Я здесь больная. Наверное, могу попросить что угодно...)"
1000803-89 = ""
1000803-90 = ""
1000803-91 = "...м-можешь посидеть рядом... пока я не усну?"
1000803-93 = "(Голос Нэру становится всё тише.)"
1000803-94 = "Как я и сказала. Ни слова об этом."
1000803-95 = "Ты..."
1000803-96 = "...же..."
1000803-97 = "Хр-р..."
1000803-98 = "..."
1000803-100 = "(Я ещё немного посмотрел, как спит Нэру, а потом ушёл.)"
