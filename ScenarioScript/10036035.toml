[translation]
10036035-10 = ""
10036035-12 = ""
10036035-13 = "Кто следующий?"
10036035-14 = "Фестиваль под нашей защитой."
10036035-16 = "К-Кто они вообще такие? Почему у них настолько идеальная командная работа?"
10036035-17 = "Мы не вывезем. Надо отступать!"
10036035-18 = "Без диджея?!"
10036035-20 = "ДА, без диджея!"
10036035-22 = "Чёрт...! Пока отступаем!"
10036035-23 = ""
10036035-25 = ""
10036035-26 = "Подождите нас!"
10036035-27 = ""
10036035-29 = ""
10036035-30 = ""
10036035-31 = "...Фух, с этим разобрались."
10036035-32 = ""
10036035-34 = ""
10036035-35 = ""
10036035-36 = "Ага, все ушли."
10036035-37 = "[s] «А за что они вообще мстили?»"
10036035-38 = "Не знаю, но хоть ума хватило сбежать."
10036035-39 = ""
10036035-41 = ""
10036035-42 = ""
10036035-43 = ""
10036035-44 = "И этого парня они не забрали."
10036035-45 = "Хнннгх! Хнгх! Хнгх!"
10036035-46 = "Простите, господин DJ B.o.B. Мы не хотели заставлять вас ждать."
10036035-47 = ""
10036035-49 = ""
10036035-50 = "*ахает*"
10036035-51 = "Продолжим с того места, где остановились."
10036035-52 = "П-Погодите. Почему вы меня спасли?"
10036035-53 = "Разве вы не собирались меня избить или что-то такое?"
10036035-54 = "Это никогда не было нашей целью... хотя кое-что всё же произошло."
10036035-55 = "Дело в том, что нам не понравилось ваше поведение на площадке концерта."
10036035-56 = "Вы давили на людей, думали только о себе и издевались над бедной подработкой."
10036035-57 = ""
10036035-59 = ""
10036035-61 = ""
10036035-62 = "Д-Да... Так что, пожалуйста, перестаньте вести себя как злодей третьего сорта..."
10036035-63 = "Задачи ей давать, конечно, можно, но будьте разумнее и добрее."
10036035-64 = "Видели...?"
10036035-65 = "Хорошо."
10036035-66 = "Ага, наверное, меня немного занесло. Особенно потому, что давно не был на пляже."
10036035-67 = "[s] «Вы удивительно спокойно это принимаете...»"
10036035-68 = "Ну, вся эта маленькая... прогулка немного расставила всё по местам. Напомнила, зачем я вообще стал диджеем."
10036035-69 = "Хотя работать тридцать шесть часов в сутки... Да ну нафиг."
10036035-70 = "Прекрасно. Тогда можете идти."
10036035-71 = "Ацуко? Ты уверена?"
10036035-72 = "Если он и лжёт, то очень убедительно. Я решила ему поверить."
10036035-73 = "Кроме того, мы здесь ради Саори, а не ради лишних проблем."
10036035-74 = "...Химэ сказала своё слово."
10036035-75 = "Ладно, ага! И, эм, спасибо, наверное!"
10036035-76 = ""
10036035-78 = ""
10036035-79 = ""
10036035-80 = "...Вышло не совсем так, как я ожидала, но сойдёт."
10036035-81 = "При всех его недостатках он показался мне очень... искренним человеком. Думаю, обещание сдержит."
10036035-83 = ""
10036035-84 = "*тяжело дышит* *тяжело дышит*..."
10036035-85 = "Так, теперь настроить вертушки."
10036035-86 = ""
10036035-88 = ""
10036035-89 = "Подработка! Эм, мисс Подработка!"
10036035-90 = "А, вот вы где. Я вернула всё оборудование на место, как вы сказали, и все декорации стоят именно там, где вы хотели. Ни царапины."
10036035-91 = "Хорошо, хорошо. Уверен, ты отлично справилась."
10036035-92 = "Вообще-то ты уже достаточно сделала. Можешь пойти отдохнуть."
10036035-93 = "Эм... отдохнуть? Ну, спасибо, но..."
10036035-94 = "Вы уверены? Я знаю, что вы очень тщательно всё расставляете..."
10036035-95 = "Что-то случилось, пока вас не было?"
10036035-96 = "Я, эм, понял, что в жизни действительно важно..."
10036035-97 = "Понимаешь, я шёл по тропе и—"
10036035-98 = ""
10036035-100 = ""
10036035-101 = "[ns] «Стоп!»"
10036035-102 = "*ахает* Вы! Вы были с ними!"
10036035-103 = "[s] «Послушайте, господин B.o.B, почему бы вам не отдохнуть в тени вон там? Я помогу, пока вы отдыхаете.»"
10036035-104 = "Е-Если вы так говорите. Тогда я... наверное, скоро вернусь!"
10036035-105 = ""
10036035-107 = ""
10036035-108 = "С-Сенсей?"
10036035-109 = "Вы что, сюда бегом добирались? Вы запыхались..."
10036035-110 = "[s3] «Я, эм, просто обрадовался тебя увидеть, Саори.»\n[s4] «(Успел как раз вовремя...)»"
10036035-113 = "Не поймите неправильно, я рада вас видеть, просто не ожидала, что вы вот так внезапно появитесь."
10036035-114 = "С остальными всё в порядке? Ацуко, Мисаки, Хиёри?"
10036035-115 = "[s] «Да, они все наслаждаются фестивалем.»"
10036035-116 = "А, хорошо. Отлично."
10036035-117 = "Я была здесь, готовила сцену к концерту."
10036035-118 = "Этот диджей ведёт главное событие, так что ждите."
10036035-119 = "[s] «Давай помогу.»"
10036035-120 = "О нет, это моя работа, не ваша..."
10036035-121 = ""
10036035-123 = ""
10036035-124 = "Ого, тяжёлое! Тогда хотя бы поднимем ВМЕСТЕ!"
