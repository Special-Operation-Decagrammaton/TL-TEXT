[translation]
90100112-2 = ""
90100112-3 = "Исполнительный офис Генерального ученического совета"
90100112-5 = "Заключённая 1192 прибыла, как было приказано."
90100112-6 = "Приём."
90100112-7 = ""
90100112-12 = ""
90100112-13 = "Давно не виделись, начальник обороны."
90100112-14 = "Нет... Ширануи Кая. Так тебе подходит больше."
90100112-15 = "Вы..."
90100112-16 = "Меня полностью проинформировали о том, что произошло, пока меня не было."
90100112-17 = "Ты устроила переворот, пока исполняющую обязанности президента Нанагами Рин отстранили."
90100112-18 = "Хотя я тоже ответственна за хаос в Кивотосе... твои действия едва не положили конец Генеральному студенческому совету."
90100112-19 = "...Поэтому перед судом я хотела услышать твои показания лично."
90100112-20 = "Кая, почему ты стремилась занять пост президента Генерального студенческого совета?"
90100112-21 = ""
90100112-23 = ""
90100112-24 = "..."
90100112-25 = "Погодите, вы... Кто вы вообще?"
90100112-26 = "...Простите?"
90100112-27 = "Ты... не узнаёшь меня, Кая?"
90100112-28 = "Я вас в жизни не видела!"
90100112-29 = "Почему вы носите форму президента Генерального студенческого совета? Вы устроили переворот? И он УДАЛСЯ?! КАК?!"
90100112-30 = ""
90100112-32 = ""
90100112-33 = "Похоже, ты не понимаешь, поэтому позволь представиться."
90100112-34 = "Я глава Генерального студенческого совета, органа, управляющего Академическим городом Кивотос—"
90100112-35 = "Что ты несёшь?!"
90100112-36 = "Я служила вместе с президентом Генерального студенческого совета. Я её знала. Она была моей подругой. Вы — НЕ она."
90100112-37 = ""
90100112-39 = ""
90100112-40 = "Да, держитесь вы уверенно. Даже внешне похожи, но вы совершенно другая!"
90100112-41 = "Настоящая президент Генерального студенческого совета была элегантнее и теплее... В ней даже была какая-то чудинка, и именно эти несовершенства делали её ещё прекраснее."
90100112-42 = "Как ты смеешь так разговаривать с президентом Генерального студенческого совета!"
90100112-43 = "О, что? Она тебя подкупила? Любой, у кого есть глаза, заметит разницу."
90100112-44 = "Когда настоящая президент Генерального студенческого совета вернётся, вы, Сенсей из Шале, и Рин, вы все—"
90100112-45 = ""
90100112-47 = ""
90100112-50 = ""
90100112-51 = "Ммф, ммф!"
90100112-52 = "Прошу прощения, президент Генерального студенческого совета. Похоже, она забылась. Всё-таки срок у неё был ОЧЕНЬ долгий."
90100112-53 = "...Спасибо за службу. Мы с Каей встретимся позже, когда она будет чувствовать себя лучше."
90100112-54 = ""
90100112-59 = "...Я больше не подведу!"
90100112-60 = ""
90100112-61 = ""
90100112-62 = ""
90100112-64 = "...Неужели я и правда кажусь настолько другой?"
