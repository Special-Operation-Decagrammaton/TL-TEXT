[translation]
13225-5 = "Tsc, essas duas...!"
13225-6 = "Sofremos danos severos!#nO-O que fazemos?!"
13225-7 = "Tsc... Reporte ao QG!#nNão temos tempo para ficar presos aqui!"
13225-9 = "É o alvo!"
13225-11 = "Opa. Rendição, rendição!"
13225-12 = "Não atireeem.#nPrimeiro a gente conversa, né?"
13225-14 = "...Não, não são elas.#nPara onde foram as garotas de Abydos?"
13225-16 = "Abydos?"
13225-17 = "Corredoras solitárias não precisam de passageirooos."
13225-19 = "Não encontramos ninguém lá dentro também!"
13225-20 = "Será que elas nem estavam no trem desde o início?!"
13225-22 = "Isso não é possível...!"
13225-24 = "Aliás, vocês podiam pelo menos servir um chazinho, né?"
13225-25 = "Quero docinhooos."
13225-27 = "Q-Que diabos são essas duas..."
13225-33 = "[ns] \"Estão todas bem?\""
13225-37 = "Nn, estou bem."
13225-38 = "...Sim, ainda bem que conseguimos passar despercebidas."
13225-39 = "Se tivéssemos demorado um segundo a mais para pular, teríamos sido descobertas..."
13225-41 = "Daqui até o Setor 35-9, devemos levar cerca de uma hora!"
13225-42 = "Vamos!"
13225-48 = "Área Interditada do Deserto de Abydos — Setor 35-9"
13225-50 = "...Chegamos."
13225-51 = "Então esta é a estação de entroncamento que o mordomo mencionou..."
13225-52 = "Mas ela não foi fechada há muito tempo?"
13225-53 = "Nn, aquela porta ali está aberta."
13225-58 = "Vamos dar uma olhada!"
13225-65 = "Aqui é..."
13225-66 = "Deve ser a sala de controle."
13225-72 = "Entendo... Usando isto, é possível ir para várias áreas diferentes."
13225-77 = "Não só para a cidade de Abydos e a Estação Grande Oásis, mas até para Gehenna."
13225-78 = "Já foi ativado com privilégios de administrador...#nProvavelmente usando o cartão da Nonomi-senpai..."
13225-80 = "Acho que foi a Suou-san."
13225-81 = "...Há algumas horas,#ndois trens partiram em direção ao Vale do Conselho Estudantil."
13225-83 = "Um deles é a Hoshino-senpai."
13225-84 = "Então..."
13225-98 = "Se pegarmos este vagão, devemos conseguir chegar lá."
13225-99 = "Já podemos embarcar?"
13225-100 = "Sim. No piloto automático, vamos chegar ao \"Vale do Conselho Estudantil\" em uma hora."
13225-102 = "Parece que vamos chegar antes de escurecer."
13225-103 = "É nesse Vale do Conselho Estudantil que está o Canhão Ferroviário, né?"
13225-104 = "Sim. Precisamos alcançar a Hoshino-senpai antes que ela faça alguma coisa."
13225-105 = "Ah, que senpai mais trabalhosa..."
13225-107 = "Por que será que a Suou-san chamou a Hoshino-senpai para aquele lugar?#nO que será que ela está tramando...?"
13225-108 = "Vamos descobrir quando chegarmos lá."
13225-109 = "Por enquanto, só nos resta ir!"
13225-110 = "[s] \"Pois é, vamos partir.\""
13225-122 = "Será que é aqui mesmo?"
13225-126 = "Será que aquilo é..."
13225-137 = "Próximo;O Vale do Conselho Estudantil"
