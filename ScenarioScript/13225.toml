[translation]
13225-5 = "Г-Гья-а-а!! Ублюдки...!"
13225-6 = "Поезд уничтожен! Что теперь делать?"
13225-7 = "Ух... Доложите основному отряду. Иначе мы здесь застрянем!"
13225-9 = "Мы нашли студентов Хайлендер!"
13225-11 = "Ого-ого-ого! Мы сдаёмся! Сдаёмся!"
13225-12 = "Не стреляйте... Давайте как цивилизованные люди!"
13225-14 = "...Эти не цель. Где студенты Абидоса?"
13225-16 = "Абидос? А? Что это?"
13225-17 = "Мы одинокие гонщики скорости... Пассажиры — роскошь!"
13225-19 = "Внутри их нет!"
13225-20 = "Их не было в поезде?!"
13225-22 = "Что..? Не может быть...!"
13225-24 = "Вы так нас и оставите? А чай где? Так с гостями обращаются?"
13225-25 = "Мне... печенье...!"
13225-27 = "Ч-Что вы вообще несёте...?"
13225-33 = "[ns] «Все в порядке?»"
13225-34 = ""
13225-36 = ""
13225-37 = "Да, все целы."
13225-38 = "...Да, кажется, мы выбрались незаметно."
13225-39 = "Хорошо, что рассчитали момент. Иначе могли серьёзно пострадать..."
13225-41 = "До закрытого сектора 35-9 примерно час. Я поведу!"
13225-42 = "Да! Идём!"
13225-48 = "Пустыня Абидос, закрытый район, сектор 35-9"
13225-50 = "...Мы пришли. Кажется, это оно."
13225-51 = "Значит, это... скрытая узловая станция..."
13225-52 = "Разве эта станция не была закрыта уже очень давно? Она не выглядит совсем заброшенной..."
13225-53 = "Да. Смотрите, вон та дверь открыта."
13225-54 = ""
13225-57 = ""
13225-58 = "Пойдём внутрь!"
13225-59 = ""
13225-65 = "Это..."
13225-66 = "...диспетчерская станции. Похоже, кто-то уже был здесь..."
13225-67 = ""
13225-69 = ""
13225-72 = "Понятно. Судя по всему, с этой станции можно попасть во множество разных частей Абидоса."
13225-73 = ""
13225-75 = ""
13225-76 = ""
13225-77 = "Есть маршрут в центр Абидоса, на станцию Великого оазиса... даже в район Геенны..."
13225-78 = "Права администратора уже активны... Кто-то, должно быть, разблокировал всё картой Нономи."
13225-80 = "...Да. Наверное, Суо."
13225-81 = "...В журнале управления указано, что несколько часов назад два поезда отправились в Долину председателей студсовета."
13225-83 = "Хошино. Нужно идти за ней."
13225-84 = "Что ж..."
13225-85 = ""
13225-87 = ""
13225-98 = "...Вот. Этот поезд."
13225-99 = "Мы все поместимся?"
13225-100 = "Да, система автоматическая, машинист не нужен... До Долины примерно час пути."
13225-102 = "Один час... Приедем до заката."
13225-103 = "Эта «Долина»... Железнодорожная пушка всё это время была спрятана там?"
13225-104 = "Да. Хошино, возможно, уже там. Нужно спешить, пока она не сделала какую-нибудь глупость."
13225-105 = "*вздох* Она как маленький ребёнок у бассейна — за ней постоянно нужен присмотр. Не то, чего ждёшь от старшекурсницы."
13225-107 = "Чего хочет Суо...? Интересно, зачем она позвала туда Хошино..."
13225-108 = "...Да. Узнать можно только одним способом."
13225-109 = "Садимся, Сенсей!"
13225-110 = "[s] «Да, отправляемся в Долину.»"
13225-111 = ""
13225-113 = ""
13225-122 = "...Это Долина председателей студсовета?"
13225-123 = ""
13225-125 = ""
13225-126 = "А вон то..."
13225-137 = "Следующий эпизод;Долина председателей студсовета"
