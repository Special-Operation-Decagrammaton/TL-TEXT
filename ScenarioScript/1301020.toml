[translation]
1301020-1 = "Королева устного счёта"
1301020-2 = "Я пришёл в Миллениум по делам Шале."
1301020-3 = "Если не торопиться, расчёты довольно простые..."
1301020-4 = "Но судя по этому, люди уже не знают, что один плюс один равно два?"
1301020-5 = "[s] «Эм... Наверное, обычная человеческая ошибка?»"
1301020-6 = "Именно, но от этого мне только грустнее, Сенсей."
1301020-7 = "Подожди, где баланс?"
1301020-8 = "[s] «У тебя... впечатляющий калькулятор.»"
1301020-9 = "О, этот? Модель SI-LAB."
1301020-10 = "Хи-хи. Он поддерживает трёхмерные графики, симуляции виртуальных экспериментов, электронные таблицы и даже некоторое программирование!"
1301020-11 = "Если немного модифицировать, можно ещё показывать фото и видео."
1301020-12 = "...Хотя некоторые студенты используют его как эмулятор игр."
1301020-13 = "Он настолько удобный, что я всё чаще полагаюсь на калькулятор, и это меня беспокоит."
1301020-14 = "[s] «Разве использовать калькулятор в бухгалтерии не нормально?»"
1301020-15 = "Да, но некоторые вещи можно посчитать в уме."
1301020-16 = "А в последнее время я неосознанно тянусь к калькулятору даже для них."
1301020-17 = "Хотя перевод галлонов в литры — простая задача..."
1301020-18 = "[s] «Передача части работы мозга внешнему устройству — естественный этап развития цивилизации.»"
1301020-19 = "...Эм, ты точно тот самый Сенсей, которого я знала?"
1301020-20 = "Не могу поверить, что из твоих уст вышло что-то настолько умное..."
1301020-21 = "[s] «Эй! Как грубо!»"
1301020-22 = "Ну... в твоих словах есть смысл."
1301020-23 = "Но если мозг не использовать, он в конце концов деградирует."
1301020-24 = "Как оружие с изношенным стволом, за которым не ухаживали, начинает стрелять хуже."
1301020-25 = "Раз уж мы об этом заговорили..."
1301020-26 = "Почему бы тебе не потренировать мозг устным счётом?"
1301020-27 = "О, убежать от этого не получится."
1301020-29 = "Ладно, начинается весёлая математика!"
1301020-31 = "Готовы?"
1301020-32 = "[s1] «Хмф, Юука, ты меня недооцениваешь.»\n[s2] «Я довольно быстро считаю в уме!»"
1301020-33 = "Для меня это новость..."
1301020-34 = "Для меня это новость..."
1301020-35 = "Раз ты так уверен, начнём!"
1301020-36 = "Для начала что-нибудь простое... Сколько будет 13 умножить на 17?"
1301020-37 = "[s] «237!»"
1301020-38 = "Ого. Быстро!"
1301020-39 = "Т-Тогда сколько будет 187 минус 23, делённое на 37?!"
1301020-40 = "[s] «7.27373737373...!»"
1301020-41 = "И это быстро!"
1301020-42 = "Т-Теперь будет сложнее...!"
1301020-43 = "Обратная матрица для 3x3 матрицы 1, 19, 37, 23, 101, 3, 7, 41, 31 равна...?"
1301020-44 = "[s] «8, 34, 108, 287, 324, 83, 70, 61, 6!»"
1301020-45 = "Н-Не может быть. Как ты так быстро...?"
1301020-46 = "Подожди. Тут что-то не так..."
1301020-47 = ""
1301020-49 = ""
1301020-50 = "Сенсей! Ты ответил неправильно на всё!"
1301020-51 = "Ты просто называл случайные числа, да?!"
1301020-52 = "[s] «Зато быстро, правда?»"
1301020-53 = "Это жульничество."
1301020-54 = "Я разработаю для тебя программу тренировки мозга."
1301020-55 = "[s] «Нет! Пожалуйста, не надо!»"
1301020-56 = "Ты не оставил мне выбора!"
