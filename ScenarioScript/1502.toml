[translation]
1502-1 = "Проблемы и следопыты, часть 2"
1502-2 = "Исполнительный офис Семинара"
1502-3 = ""
1502-4 = "Юука, я принесла весы, которые использовались на медосмотре."
1502-5 = "Спасибо, Эйми."
1502-6 = "Я рада, что мои опасения не подтвердились. К счастью, в этот раз недовольные студенты не устроили сцену из-за результатов медосмотра."
1502-7 = "«В этот раз»?"
1502-8 = "Такое уже бывало. В Миллениум много... скажем так, эксцентричных студентов. Некоторые приносили на медосмотр свои изобретения и раньше уже создавали проблемы."
1502-9 = "Один студент пытался взвешиваться в ботинках с реактивной тягой. А в другой раз кто-то притащил целый экзоскелет на силовой тест."
1502-10 = "Хотелось бы, чтобы они поняли: мы всего лишь измеряем их собственное физическое развитие."
1502-11 = "Я и не знала. Впечатляет."
1502-12 = "Не то чтобы я совсем их не понимала. Если честно, в этом году после взвешивания я сама выпустила в весы целый магазин."
1502-13 = "Это всё вина Отдела разработки игр! Рядом с ними я всегда начинаю есть слишком много вредной еды."
1502-14 = "Разве ты не можешь просто изменить собственную запись, используя свои полномочия?"
1502-15 = "Я-Я никогда так не поступлю! Член руководства Семинар не должен злоупотреблять властью ради личной выгоды!"
1502-16 = "Пусть я и казначей, но обязана соблюдать те же правила, что и все остальные."
1502-17 = "Как скажешь."
1502-18 = ""
1502-20 = ""
1502-21 = ""
1502-22 = "Кстати, я как раз собираюсь занести данные в личные записи студентов. Какой там был пароль?"
1502-23 = "Не помню, чтобы я его когда-нибудь меняла. Должен быть тот же."
1502-24 = "Попробуй «1q2w3e4r»."
1502-25 = ""
1502-27 = ""
1502-29 = "Сработало. Спасибо."
1502-31 = "Хакерская комната Веритас"
1502-32 = "Мы внутри."
1502-33 = "Молодец, Котама!"
1502-34 = "Как ты узнала пароль от сервера с личными данными студентов?"
1502-35 = "Там до сих пор стандартный пароль, заданный при установке."
1502-36 = "Ты хочешь сказать, эта скряга-казначей ни разу не поменяла пароль? Как можно настолько игнорировать базовую кибербезопасность?!"
1502-37 = "В итоге это лишь упрощает нам работу."
1502-38 = "Дальше я. Перемещаю дрон в серверную.#nПосле последних доработок получить оттуда доступ к внутренней сети будет проще простого."
1502-39 = ""
1502-44 = "Готово. Теперь у нас должен быть полный доступ."
1502-45 = "Готова, Маки?"
1502-46 = "Уже работаю!"
1502-47 = ""
1502-49 = ""
1502-50 = "Сканирую узел устройства, к которому подключён дрон Харэ..."
1502-51 = ""
1502-53 = ""
1502-54 = "Нейтрализую прокси перегрузкой..."
1502-55 = ""
1502-57 = ""
1502-58 = "И перехватываю права администратора украденным паролем..."
1502-59 = ""
1502-64 = "Есть! Авторизация получена, и теперь все эти записи мои!"
1502-65 = "Так, посмотрим..."
1502-66 = "Для начала уменьшу свой вес на 10 килограммов и прибавлю росту 10 сантиметров. А грудь, пожалуй, увеличу до 90 сантиметров..."
1502-67 = "При таком весе вообще бывает подобное телосложение? Ты слегка перебарщиваешь с фантазией."
1502-68 = "Маки, мою тоже измени."
1502-69 = "Хи-хи. Любое твоё желание!"
1502-70 = ""
1502-74 = "О? А это что у нас? Медицинские данные нашей любимой казначейки Семинар Юки."
1502-75 = "Она мне никогда особо не нравилась — слишком уж любит вмешиваться. Может, немного развлечёмся?"
1502-76 = "Вот как?"
1502-77 = "Вы только посмотрите! Юука внезапно весит целых 100 килограммов!"
1502-78 = "Вот бы увидеть её лицо, когда она это заметит."
1502-79 = "Это уже мелочность высшей степени."
1502-80 = ""
1502-81 = ""
1502-84 = ""
1502-88 = "Ч-Что происходит? Меня выбрасывает из системы!"
1502-89 = "Нас взламывают в ответ через сервер! Меньше чем через 10 секунд нас отследят!"
1502-90 = "Маки, сотри журнал и отключайся. Сейчас!"
1502-91 = "Н-Но мы столько старались, чтобы сюда попасть. Ух, ладно!"
1502-92 = "Стой! Если рядом есть другой узел... Есть, дай-ка скопирую туда!"
1502-93 = ""
1502-97 = ""
1502-98 = "SYSTEM: Копирование папки «student_data» в папку «social_network»."
1502-99 = "Что ты делаешь?!"
1502-100 = "Что? Просто быстро делаю резервную копию данных, пока мы не потеряли доступ."
1502-101 = "Посмотри внимательнее! Ты загружаешь данные обо всех студентах Миллениум на публичный сервер социальной сети!"
1502-102 = "Ой-ой..."
1502-104 = "Исполнительный офис Семинара"
1502-105 = "Этого... не может быть."
1502-106 = "Что такое, Эйми? Редко увидишь, чтобы тебя хоть что-то выбило из колеи."
1502-107 = "Результаты медосмотра студентов ведь не должны быть публичными, верно?"
1502-108 = "Разумеется. Личные данные наших студентов защищены строжайшими протоколами безопасности. Даже Веритас не смогли бы пробраться в эту систему."
1502-109 = "Тогда почему они разлетелись по всем соцсетям?"
1502-110 = "Ч-Что? Ты шутишь..."
1502-111 = ""
1502-113 = ""
1502-115 = "Не шутишь! Н-Но кто мог это сделать? И зачем?!"
1502-116 = ""
1502-118 = ""
1502-119 = "Юука."
1502-120 = "Что?!"
1502-121 = "Я и не знала, что ты настолько набрала вес. Не думала о диете?"
1502-122 = "П-Прости? Это немного грубо, тебе не кажется?!"
1502-123 = "Я-Я знаю, что немного поправилась, но для моего телосложения это всё ещё считается нормой!"
1502-124 = "Но здесь написано, что ты весишь 100 килограммов."
1502-125 = ""
1502-127 = ""
1502-129 = "Этого не может быть!!!"
