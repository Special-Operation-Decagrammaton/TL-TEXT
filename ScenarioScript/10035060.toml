[translation]
10035060-1 = "Эпизод 6;Появляется аллигатор!"
10035060-3 = "[ns1] «Как же жарко...»\n[ns2] «Кажется, я сейчас растаю...»"
10035060-6 = "...Простите, Сенсей."
10035060-7 = "Такояки, налетайте..."
10035060-8 = "Никто не идёт."
10035060-9 = "Думаешь, кому-то хочется горячей еды в такую жару?"
10035060-10 = "Простите, что втянула вас во всё это..."
10035060-11 = "Не переживайте! У вас хорошие такояки, директор. Обычно нам нечасто удаётся поесть такие!"
10035060-12 = "Правда? Кто вообще поверит, что Дикая Гончая готовит такояки, не говоря уже о том, что нам удалось их попробовать?"
10035060-13 = "Я у вас всех в огромном долгу."
10035060-14 = "И у вас тоже, Сенсей..."
10035060-15 = "Вот, я только что приготовила такояки... Хотите?"
10035060-16 = "Это всё, что я сейчас могу вам предложить."
10035060-17 = "[s3] «Как-то неправильно брать это бесплатно...»\n[s4] «Давай я куплю, и мы поделимся?»"
10035060-20 = "Но мне нужно обслуживать покупателей..."
10035060-21 = "Каких покупателей? Никаких покупателей не будет."
10035060-22 = "И директор, если вы продолжите стоять прямо перед огнём, совсем вымотаетесь."
10035060-23 = "Вы уже вся в поту..."
10035060-24 = "...Пожалуй, я могу сделать короткий перерыв."
10035060-26 = "Фух, и правда стало немного лучше."
10035060-27 = "Перерывы для этого и нужны. Вам стоит делать их почаще."
10035060-28 = "..."
10035060-29 = "[s] «Вы все отлично справились. Замечательная работа.»"
10035060-30 = "Я думала, просто приду сюда и помочу ноги в воде, но всё оказалось не совсем так, как я ожидала."
10035060-31 = "Может, стоило просто остаться в привычной комнате с кондиционером."
10035060-32 = "А мне вообще-то было очень приятно!"
10035060-33 = "Я смогла увидеть столько людей, которые прекрасно проводят время!"
10035060-34 = "..."
10035060-35 = "[s] «А ты что думаешь, Канна?»"
10035060-36 = "Если честно..."
10035060-37 = "С тех пор как я поступила в «Валькирию», впервые день превратился в настолько полный бардак."
10035060-38 = "При общении с людьми я совершала одну ошибку за другой..."
10035060-39 = "Из-за неверного решения я нарушила работу всего парка..."
10035060-40 = "Не зря говорят, что человеку не стоит браться за задачи, которые ему не по силам."
10035060-41 = "[s] «А по-моему, ты вполне справляешься, Канна.»"
10035060-42 = ""
10035060-44 = ""
10035060-45 = "Вы не очень хорошо умеете лгать, Сенсей."
10035060-46 = "Очевидно, у меня нет навыков для работы спасателем."
10035060-47 = "Если бы слова Коноки не застали меня врасплох, всё не обернулось бы таким беспорядком."
10035060-49 = "Конока, заместитель директора? Что она сказала...?"
10035060-50 = "Кстати, директор, вы так и не рассказали, почему ваше имя вообще оказалось в списке."
10035060-51 = "Заместитель директора вас туда запихнула или что-то такое?"
10035060-52 = "..."
10035060-53 = "Теперь уже нет смысла это скрывать."
10035060-54 = ""
10035060-55 = ""
10035060-56 = ""
10035060-57 = ""
10035060-58 = "...Если совсем честно, я всё равно НЕ была обязана сюда приходить."
10035060-59 = "Но те слова..."
10035060-60 = "Я оказалась здесь, потому что подумала: возможно, это вернёт мне прежний энтузиазм. Такой, какой был, когда я впервые подавала заявку в Бюро общественной безопасности."
10035060-61 = "Как идиотка..."
10035060-62 = "Вот я здесь, всё ещё цепляюсь за эту идею из одного упрямства."
10035060-64 = ""
10035060-65 = "..."
10035060-67 = "В любом случае, всё нормально."
10035060-68 = "Может, это даже к лучшему."
10035060-69 = "По крайней мере, теперь я точно знаю, что всё ещё не подхожу для непосредственной работы с людьми."
10035060-70 = "[s] «Это неправда.»"
10035060-71 = "Хм?"
10035060-72 = "[s] «Ты ведь всё ещё хочешь помогать другим, правда?»"
10035060-73 = "...Это трудно, когда я даже правильно улыбаться не умею."
10035060-74 = "Когда я подавала заявку, мне отказали из-за моего «свирепого» вида."
10035060-75 = "[s] «Дело не столько в том, МОЖЕШЬ ли ты...»"
10035060-77 = "[ns] «...а в том, ХОЧЕШЬ ли ты этого.»"
10035060-78 = ""
10035060-79 = "Думаете?"
10035060-80 = "Вы всё продолжаете меня удивлять, Сенсей."
10035060-81 = "[s] «Так думаю не только я. Мы все так считаем.»"
10035060-82 = ""
10035060-84 = ""
10035060-85 = "[ns] «Кирино...»"
10035060-86 = ""
10035060-87 = "[ns] «Фубуки...»"
10035060-88 = ""
10035060-89 = "[ns] «...даже Рабу.»"
10035060-90 = ""
10035060-91 = "[ns] «...Мне только что послышалось „да“ от Рабу?»"
10035060-92 = ""
10035060-93 = "А?!"
10035060-94 = "Чёрт, надо было молчать..."
10035060-95 = ""
10035060-97 = ""
10035060-98 = "Я знаю это лицо. Комакадзэ Рабу из этой никчёмной «Банды шлемов»."
10035060-99 = "А, точно, я раньше видела этот шлем!"
10035060-100 = "Он был на тебе, когда ты каталась с горки!"
10035060-102 = "А ТЫ была той, кто отправил меня вниз на счёт ДВА! Я чуть инфаркт не получила!"
10035060-103 = "Ц! Что, «Валькирия» теперь ещё и следит за мной?"
10035060-104 = ""
10035060-106 = ""
10035060-107 = "[ns5] «А? П-Погоди!»\n[ns6] «Она убегает?!»"
10035060-110 = "За ней! Давай, Фубуки!"
10035060-111 = "Но такояки только-только остыли до идеальной температуры..."
10035060-113 = ""
10035060-114 = ""
10035060-115 = ""
10035060-116 = ""
10035060-117 = "Погодите... тревога сработала!"
10035060-118 = "Думаете, Банда шлемов уже начала устраивать проблемы?"
10035060-119 = "О! С-Смотрите туда!"
10035060-120 = "Главный бассейн...!"
10035060-128 = "А-а-а!"
10035060-129 = "Аллигатор! В воде чудовище-аллигатор!"
10035060-130 = "Бегите! Все из бассейна!"
10035060-131 = "Вот оно!"
10035060-132 = "Это то существо, которое я видела!"
10035060-133 = "Погодите, это какой-то робот?"
10035060-134 = "*ахает* Что бы это ни было, оно жрёт горку!"
10035060-135 = "Э-Это серьёзно?!"
10035060-136 = "Где Банда шлемов вообще раздобыла такую штуку?"
10035060-137 = "[s] «Людям угрожает опасность.»"
10035060-138 = "Верно! И как сотрудница Бюро общественной безопасности я не могу этого допустить."
10035060-140 = "Держитесь, мы идём на помощь!"
