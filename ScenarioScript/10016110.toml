[translation]
10016110-1 = "Послесловие;Эпизод Общества гурманов"
10016110-3 = "Ещё одну газировку «Цветущая сакура», пожалуйста."
10016110-4 = "А мне ледяную стружку с чернилами кальмара и ещё порцию сушёного морского огурца с арахисовым маслом!"
10016110-5 = "Мне ещё яичного жареного риса, рамэна, жареных гёдза и китайской рисовой миски... А, и ещё одну порцию эдамамэ, пожалуйста."
10016110-6 = ""
10016110-8 = ""
10016110-9 = "...Вы не перебарщиваете, даже если всё бесплатно?"
10016110-10 = "Ну да, наш главный приз — общий талон на питание — позволяет есть сколько угодно, но это же не значит, что надо объедаться."
10016110-11 = "И даже негде достать лекарство для пищеварения..."
10016110-12 = "Объедаться? Как человек, посвятивший себя гурманству, я никогда не опущусь до столь безвкусного поступка."
10016110-13 = "...Просто после завершения фестиваля и возможности наконец поесть аппетит у меня разыгрался сильнее обычного."
10016110-15 = "Похоже, в старой поговорке есть доля истины: «Лёгкие упражнения каждый день — залог хорошего аппетита.»"
10016110-16 = "Лёгкие упражнения..."
10016110-17 = "Кстати... Харуна, ты сегодня участвовала в соревнованиях?"
10016110-18 = "Да. Я представляла академию Геенны в нескольких легкоатлетических дисциплинах."
10016110-19 = "Хотя выступила не слишком хорошо."
10016110-20 = "Чего? Тогда почему ты говоришь об этом с такой гордостью?"
10016110-21 = "Как сказала секретарь Миллениум на церемонии закрытия, цель Фестиваля Хало — не результаты, а возможность каждому студенту насладиться физической активностью."
10016110-22 = "...И я действительно прекрасно провела время на спортивном празднике."
10016110-23 = "А остальные члены нашего клуба, в отличие от меня, отлично проявили себя в своих дисциплинах, так что сегодня даже Префектская команда Геенны наверняка оставит нас в покое."
10016110-24 = "Я тоже сегодня отлично повеселилась!"
10016110-25 = "Обычно ванкособу ручной работы готовят очень долго, и меня всегда немного раздражало ожидание..."
10016110-26 = "Не думала, что когда-нибудь увижу автомат, способный готовить лапшу с той же скоростью, с какой я её ем. Технологии Миллениум, как всегда... ☆"
10016110-28 = "Если бы только машина не сломалась посреди дела, я бы насладилась этим ещё немного... Фуфу."
10016110-29 = "Угу! И газировка с морским огурцом была вкусной!"
10016110-30 = "Кажется, я ещё никогда не пробовала напиток, который настолько раскрывает вкус морского огурца."
10016110-31 = "Я слышала, Миллениум использовал новую технологию молекулярной кухни... Как думаете, мы сможем повторить её в Геенне?"
10016110-33 = "И не забудем, что Джунко вырвалась с последнего места вперёд и принесла Геенне победу в финальной эстафете."
10016110-34 = "Фуфуфу. Жаль, мы не успели запечатлеть лица префектов, когда Джунко обогнала бегунью из Абидос."
10016110-35 = "Да! Джунко выглядела так круто!"
10016110-36 = "Хаха... Когда вы так говорите, мне и правда кажется, будто я совершила что-то невероятное."
10016110-41 = ""
10016110-42 = "Джунко."
10016110-43 = "Тебе понравился сегодняшний спортивный праздник?"
10016110-44 = "Хм... Даже не знаю."
10016110-45 = "Я потеряла кошелёк и не смогла попробовать еду в нескольких киосках, куда очень хотела попасть, потом меня неправильно поняли и за мной гонялись студенты, похожие на членов какого-то другого клуба..."
10016110-46 = "В общем, день не особо отличался от любого другого дня с Обществом гурманов, но..."
10016110-47 = ""
10016110-49 = ""
10016110-50 = ""
10016110-52 = ""
10016110-54 = "...Было весело."
10016110-55 = "Рада слышать это."
10016110-56 = "Обычную еду вроде риса и мисо-супа часто недооценивают из-за простого и привычного вкуса, но... я с этим не согласна."
10016110-57 = "Еда, которую можно есть каждый день и которая не надоедает... Пожалуй, это и есть вершина гурманства."
10016110-58 = "Точно. Жирная фестивальная еда хороша время от времени, но постоянно я бы её есть не смогла..."
10016110-59 = ""
10016110-61 = ""
10016110-62 = "*нюх* *нюх* Чувствуете запах гари?"
10016110-63 = "Пахнет горящими дровами, будто что-то собираются коптить..."
10016110-64 = "А, похоже, готовят костёр и танец свиньи, как всегда на вечеринке после фестиваля."
10016110-65 = "...Танец свиньи? Это ещё что?"
10016110-66 = "А, танец свиньи... Мы все собираемся и танцуем вместе вокруг костра."
10016110-67 = ""
10016110-70 = "Он так называется, потому что обычно над огнём целиком жарится огромная свинья!"
10016110-71 = ""
10016110-73 = ""
10016110-74 = ""
10016110-75 = ""
10016110-77 = "...Да, это гастрономический опыт, восходящий к древним кулинарным традициям времён костров, мяса и охоты."
10016110-78 = "Ого, звучит невероятно вкусно!"
10016110-79 = "А как думаете, можно поджарить на костре что-нибудь ещё? Например морского огурца или... или осьминога?!"
10016110-80 = "Конечно. Костёр Фестиваля Хало наверняка будет огромным, так что места хватит для всего, что захотите приготовить."
10016110-81 = "Отлично! Тогда принесём много оставшихся морских огурцов и осьминогов и сделаем вкусную газировку!"
10016110-83 = "Пока остальные будут танцевать танец свиньи, мы станцуем танец осьминога!"
10016110-84 = ""
10016110-86 = ""
10016110-89 = ""
10016110-90 = "...Эм, Акари. Ты же знаешь, на вечеринке после фестиваля ничего такого не делают..."
10016110-91 = "Ты точно хочешь так вводить Изуми в заблуждение?"
10016110-92 = "Фуфуфу. А почему бы и нет?"
10016110-93 = "Именно такие вещи люди и делают, когда их захватывает праздничное настроение."
10016110-94 = "Eat or Die. Ради хорошей еды я готова на всё. Разве не таков девиз Общества гурманов?"
10016110-95 = ""
10016110-97 = ""
10016110-98 = "Джунко, когда закончишь уборку, пойдём вместе! Нельзя упустить редкий гастрономический опыт — поджарить осьминога на костре и съесть его..."
10016110-99 = ""
10016110-101 = ""
10016110-102 = ""
10016110-103 = ""
10016110-105 = "Да. Пожалуй, для нас это и правда обычное дело."
