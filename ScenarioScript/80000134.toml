[translation]
80000134-1 = "Своевременный тирамису"
80000134-2 = "Получив приглашение Миё, я отправился в общежитие Вайлдхант."
80000134-3 = "...Благодаря тому, что она сообщила точное время смены караула Префектурного совета, я быстро прошёл пост проверки."
80000134-4 = "Общежитие Картеля свободной торговли"
80000134-6 = ""
80000134-7 = "Добро пожаловать, Сенсей."
80000134-8 = "[s] «Как ты, Миё?»"
80000134-9 = "Всё хорошо, если не считать творческого кризиса."
80000134-10 = "Хотя новые схемы контрабанды, конечно, всё так же приходят в голову совершенно естественно."
80000134-11 = "[s] «Что?»"
80000134-12 = "В любом случае, простите, что заставила вас ехать так далеко."
80000134-13 = "Мне стоило прийти самой, но в последнее время разрешение на выход получить очень трудно."
80000134-14 = "[s] «Всё нормально. Я всегда рад приглашению от Миё.»"
80000134-15 = "П-Правда? Хи-хи..."
80000134-16 = "[s] «В конце концов, если откажусь, меня ещё похитят...»"
80000134-17 = "Ч-Что это за ответ?! Я НИКОГДА такого не сделаю. Мы ударили вас по голове ОДИН раз, а потом я притащила вас сюда, чтобы вы восстановились..."
80000134-18 = "Но совсем ли невозможно похищение? Ну, пришлось бы учесть переменные... свободный график, уединённое место, звукоизоляцию..."
80000134-19 = ""
80000134-21 = ""
80000134-22 = "...Стоп, нет! НЕТ! Я не... Никогда бы такого не сделала."
80000134-23 = "Угх..."
80000134-24 = "[s] «Ха. Ладно, что ты готовишь, Миё?»"
80000134-25 = "А, я..."
80000134-26 = "...готовила тирамису. Для вас."
80000134-27 = "[s] «Тирамису...?»"
80000134-28 = "Да. Сегодня День святого Валентина."
80000134-29 = "Я хотела закончить прямо перед вашим приходом, чтобы он был свежим. Но почему-то заняло намного больше времени, чем планировала. У этого дела много слоёв, Сенсей — как у тирамису."
80000134-30 = "И готовлю его впервые..."
80000134-31 = "[s] «Тогда давай закончим вместе?»"
80000134-32 = "Н-Нет! Всё хорошо! Отдыхайте!"
80000134-33 = "Я почти закончила, видите?"
80000134-34 = "Савоярди уже уложены. Они пропитаны эспрессо, сверху маскарпоне..."
80000134-35 = "Осталось только посыпать какао-порошком..."
80000134-36 = ""
80000134-38 = ""
80000134-39 = ""
80000134-40 = ""
80000134-41 = "Эй, Сенсей."
80000134-42 = "[s] «Хм?»"
80000134-43 = "Я посыпаю этот чёрный порошок на белый маскарпоне..."
80000134-44 = "Почти как писать на чистом листе бумаги. Правда?"
80000134-45 = "[s] «Хм, можно и так посмотреть.»"
80000134-46 = "Иногда я думаю..."
80000134-47 = "Может, писательство — это просто способ запачкать белый лист... Оставить след."
80000134-48 = "Ну, что-то вроде..."
80000134-49 = ""
80000134-51 = ""
80000134-52 = ""
80000134-53 = "Эм, забудьте. Теперь сверху...!"
80000134-54 = ""
80000134-56 = ""
80000134-57 = "...Г-Готово, Сенсей!"
80000134-58 = ""
80000134-60 = "[ns] «Выглядит вкусно...!»"
80000134-61 = "Х-Хи-хи, спасибо, Сенсей."
80000134-62 = "Эм, кстати..."
80000134-63 = "[s] «Хм?»"
80000134-64 = ""
80000134-66 = ""
80000134-68 = ""
80000134-69 = "Я говорила, что хочу сделать его свежим, но перед вашим приходом читала рецепт. Оказывается, тирамису НА САМОМ ДЕЛЕ нужно охлаждать минимум два часа. Чтобы вкусы смешались... и поженились."
80000134-70 = "Поэтому я подумала..."
80000134-71 = "Е-Если у вас случайно есть время..."
80000134-72 = "[s] «Я с радостью подожду два часа.»"
80000134-73 = "П-Правда?! Спасибо, Сенсей!"
80000134-74 = "Тогда я заварю чай. Может, без кофеина, чтобы уравновесить эспрессо?"
80000134-75 = "Как насчёт ромашкового?"
80000134-77 = "И мы с Миё пили чай и разговаривали несколько часов."
80000134-78 = "Вкусный тирамису более чем стоил ожидания."
