[translation]
2002503-1 = "Сезонный наряд"
2002503-2 = "В торговом районе я увидел Харуку, которая бродила вдоль витрин."
2002503-3 = ""
2002503-6 = ""
2002503-7 = "На ней всё ещё была короткая юката, как и раньше."
2002503-8 = "[ns1] «Харука!»\n[ns2] Помахать Харуке."
2002503-9 = "О! С-Сенсей?!"
2002503-10 = "О! С-Сенсей?!"
2002503-11 = "П-простите! Вы так далеко приехали, а потом вам пришлось идти ещё дальше, потому что я не нашлась!"
2002503-12 = "...Что?"
2002503-13 = "Хотите, чтобы я пошла за вами? Д-да! Поняла."
2002503-14 = ""
2002503-17 = ""
2002503-20 = "С-Сенсей? Куда мы..."
2002503-21 = "Вы подумали, что мне холодно? И захотели зайти внутрь... только чтобы я согрелась?"
2002503-22 = "В-вам не нужно этого делать... Не ради такой, как я..."
2002503-23 = "Что? О, это? Вы хотите знать... почему на мне короткая...?"
2002503-24 = "[s3] «Можно спросить про эту юкату?»\n[s4] «Мне стало интересно, почему ты выбрала именно её.»"
2002503-25 = "Э-это..."
2002503-26 = "Э-это..."
2002503-27 = "Эм, тут н-нет ничего интересного... Просто... эта..."
2002503-28 = "Э-эта была самой дешёвой..."
2002503-29 = "[s5] «Ты переживаешь из-за цены?»\n[s6] «Так вот в чём причина...»"
2002503-30 = "К-конечно. Понятно... Даже если она дешёвая... всё равно слишком красивая для такой, как я. Так ведь?"
2002503-31 = "К-конечно. Понятно... Даже если она дешёвая... всё равно слишком красивая для такой, как я. Так ведь?"
2002503-32 = "Я... я даже не была уверена, что стоит покупать эту, но подумала... что будет ещё неудобнее, если у меня вообще не будет юкаты, ведь у всех остальных в офисе она есть..."
2002503-33 = "Поэтому я купила эту, чтобы не выделяться, но тратить много денег на одежду для такой, как я, было бы бессмысленно, так что..."
2002503-34 = "Проститепроститепростите...!"
2002503-35 = "...Что?"
2002503-36 = "Вы не это имели в виду? Ч-что вы хотите сказать? Вы... и так знали, что дело примерно в этом? Я не понимаю..."
2002503-37 = "[s7] «Хочешь сходить за зимней одеждой?»\n[s8] «Давай купим новое кимоно. Я угощаю.»"
2002503-38 = "Ну... ладно. Хорошо..."
2002503-39 = "Ну... ладно. Хорошо..."
2002503-40 = "...А?"
2002503-41 = "Стойте... Что вы сказали?"
2002503-42 = ""
2002503-44 = ""
2002503-45 = "...Ах."
2002503-46 = "Нетнетнетнетнетнетнетнетнетнетнет!"
2002503-47 = "Н-нет! Ни за что! Вы не можете тратить свои драгоценные деньги на такую, как я! Никогда, никогда, никогда! Этого не может случиться!"
2002503-48 = "Если вы это сделаете... Если я когда-нибудь его испачкаю... Если на него попадёт хотя бы пылинка... я умру!"
2002503-49 = "С-со мной всё нормально, Сенсей. Пожалуйста, не надо! Пожалуйста, не делайте ничего такого!"
2002503-50 = "[s9] «А? П-почему? Ладно...»\n[s10] (Я пытался помочь, но, кажется, почему-то сделал только хуже...)"
2002503-51 = "У-у этого наряда много хороших качеств! Для меня его более чем достаточно! Да! Вообще-то я даже такого не заслуживаю! О-он дешёвый, мягкий и в нём удобно двигаться!"
2002503-52 = "У-у этого наряда много хороших качеств! Для меня его более чем достаточно! Да! Вообще-то я даже такого не заслуживаю! О-он дешёвый, мягкий и в нём удобно двигаться!"
2002503-53 = "Именно благодаря этому наряду я смогла прийти сюда с вами и даже п-получить вашу заботу—"
2002503-54 = "Н-нет! Нет-нет-нет-нет! Я беру это назад! Я не это имела в виду! Это ошибка! Я просто что-то ляпнула!"
2002503-55 = "Нетнетнетстойтенетстойтеянеэтоимелаввидунетянеимела это в виду я не просто выдала первую попавшуюся причину я лишь хотела сказать э-э-э!"
2002503-56 = "Эм!"
2002503-57 = "Э-э!"
2002503-58 = "..."
2002503-59 = ""
2002503-61 = ""
2002503-62 = "Я хочу умереть!"
2002503-64 = "Когда Харука наконец успокоилась, вместо похода за одеждой я купил ей десерт в кафе."
2002503-66 = "Простите... Вам правда не стоило всё это делать..."
2002503-67 = "В-всё нормально? Как это может быть нормально? Я такая обуза... И вы за всё заплатили..."
2002503-68 = "...Что?"
2002503-69 = "В-вы хотите, чтобы я дала обещание? Что-то про мою одежду? К-какое обещание..."
2002503-70 = "То есть! Подождите. К-конечно я сдержу обещание, данное вам, даже если от этого будет зависеть моя жизнь, Сенсей!"
2002503-71 = "[s11] «Хочу, чтобы ты пообещала не перенапрягаться.»\n[s12] «Если почувствуешь, что можешь простудиться, найди место и согрейся.»"
2002503-72 = "Эм... Хм... Не совсем понимаю, почему... Почему вы просите именно об этом..."
2002503-73 = "Эм... Хм... Не совсем понимаю, почему... Почему вы просите именно об этом..."
2002503-74 = "Н-но да! Обещаю! Я обязательно так и сделаю!"
2002503-75 = "То есть... этого достаточно?"
2002503-76 = "Хорошо? К-как здорово... Эм... наверное..."
2002503-77 = "[s13] «Похоже, ты сама в это не веришь.»\n[s14] «Я этому рад. Ты мне доверяешь?»"
2002503-78 = "Да! Да, доверяю!"
2002503-79 = "Да! Да, доверяю!"
2002503-80 = "Я не сомневалась в вас! Никогда бы не стала!"
2002503-81 = "Всё, что вы говорите, обязательно правда!"
2002503-82 = "Безусловно! Потому что я уничтожу любого, кто скажет обратное!"
2002503-83 = "..."
2002503-84 = "Хи... Хи-хи..."
2002503-86 = "Я купил Харуке грелку для рук, чтобы она не замёрзла по дороге домой, а затем вернулся в Шале."
