[translation]
10023080-1 = "Эпизод 8;Помни, ничто не вечно"
10023080-2 = ""
10023080-5 = "Как вы себя чувствуете, Сенсей?"
10023080-6 = "[s] «Не жалуюсь. А ты, Токи?»"
10023080-7 = "Мне нечего докладывать."
10023080-8 = "[s] «Не как доклад — тебя что-то беспокоит?»"
10023080-9 = ""
10023080-11 = ""
10023080-12 = "...Как бы я ни старалась, вы всегда так быстро меня раскусываете."
10023080-13 = "Скажу честно, Сенсей. Я не уверена, что нам делать."
10023080-14 = "Ты не знаешь?! Да мы тут в десять раз больше запутались!"
10023080-15 = "Поняла, Шумная Мои."
10023080-16 = "Шумная Мои?! Это моё прозвище?!"
10023080-17 = "Не только твоё. У меня есть прозвища для всех: Мидори — Истинный Президент, Юзу — Робкая, а Арис — Очаровательная."
10023080-18 = "У всех крутые прозвища! Почему у меня какое-то дурацкое?"
10023080-19 = "Сенсей! Ну же! Это уже почти травля! Вы должны такое останавливать!"
10023080-20 = ""
10023080-22 = ""
10023080-23 = "[ns] «...Как сказала Момои, травля — это плохо.»"
10023080-25 = "Но Момои была права, Сенсей."
10023080-26 = "Что нам делать...?"
10023080-28 = "Это очень просто! Победим плохих парней и станем отрядом героических горничных!"
10023080-29 = "Мы даже не уверены, кто здесь плохие парни..."
10023080-30 = "Хм? Это тоже просто! Плохие парни — это..."
10023080-31 = "Плохие парни..."
10023080-32 = "О! Внезапно всё закружилось! Я теряю сознание, Юзу! Помоги!"
10023080-33 = ""
10023080-35 = ""
10023080-37 = ""
10023080-38 = ""
10023080-39 = "Если вы не против, у меня есть предложение. Пожалуйста, выйдите из этого дела, Отдел разработки игр... и вы тоже, Сенсей."
10023080-40 = ""
10023080-43 = ""
10023080-45 = ""
10023080-46 = "[ns] «Почему... Почему ты этого хочешь, Токи?»"
10023080-47 = "Токи... Ты ведь собираешься сделать что-то опасное, правда?"
10023080-48 = "Признаю, предложение о союзе застало меня врасплох."
10023080-49 = "Но в этом нет необходимости. Я выполню свой долг и доведу это дело до конца."
10023080-50 = "[s] «Но в одиночку?»"
10023080-51 = "Да. Эту миссию мне поручила C&C, поэтому я завершу её как член C&C. Я не запятнаю репутацию организации."
10023080-53 = "Как... ты собираешься справиться с этим одна, Токи?"
10023080-55 = "Мне придётся немного понаблюдать за развитием ситуации. Если потребуется, я поддержу план Благородной Воровки и помогу остановить аукцион."
10023080-56 = "В противном случае я просто заберу Корону Короля Часов раньше Благородной Воровки и верну её в Валькирию."
10023080-57 = "Это дело изначально не имело отношения к Отделу разработки игр. Или к вам, Сенсей."
10023080-58 = "Поэтому возвращайтесь с Сенсеем в Миллениум."
10023080-59 = "Здесь мы и попрощаемся."
10023080-60 = ""
10023080-62 = ""
10023080-64 = ""
10023080-65 = "Нет! Не отступайте, члены отряда!"
10023080-66 = "Арис? Ты не понимаешь..."
10023080-67 = "Ещё как понимаю! Токи присоединилась к нашему отряду! Бум-бум-бум!"
10023080-68 = "Ты член нашего отряда! А Отдел разработки игр не бросает товарищей!"
10023080-70 = "...Я понимаю, что ситуация была не самой удачной..."
10023080-71 = "И что нас бы вообще здесь не было, если бы не Момои."
10023080-72 = "Мидори... Тебе надо научиться оставлять прошлое в прошлом..."
10023080-73 = "Не обращайте на неё внимания!"
10023080-74 = "Мы не оставим тебя разбираться с этим в одиночку, Токи!"
10023080-75 = "В конце концов, мы твои товарищи по C&C! Мы ведь немного одолжили себе это название, помнишь?"
10023080-77 = "Для вас всё так просто?"
10023080-78 = "Меня учили, что самые простые причины обычно и есть самые важные."
10023080-79 = "Или... мы ошибаемся, и ты хочешь уйти потому, что не считаешь нас членами своего отряда?"
10023080-80 = "Н-нет! Просто... Я не знаю, что это значит. Я всегда всё делала одна... и не знаю, как вести себя в ситуациях, с которыми раньше не сталкивалась. По крайней мере, вне поля боя."
10023080-81 = "Если ты так чувствуешь, я хочу помочь Токи. Даже если остальные не присоединятся к нашему отряду!"
10023080-83 = "Если Арис этого хочет — вперёд!"
10023080-84 = "Мы последуем за тобой, Арис..."
10023080-86 = "Хи-хи. Этот грандиозный финал был настоящим воплощением красоты."
10023080-87 = ""
10023080-88 = ""
10023080-89 = ""
10023080-91 = ""
10023080-94 = ""
10023080-95 = "Мэйтаро не добился бы своего положения, будь он глупцом. Он уже восстановил контроль над тайным аукционом и возобновил торги."
10023080-96 = "Его охрана прямо сейчас разыскивает нас."
10023080-97 = "Если я не ошибаюсь, Корону Короля Часов выставят на торги примерно в полночь."
10023080-98 = "Когда Мэйтаро понял, что мы не собираемся уничтожать друг друга, он перешёл к плану Б: устранить нас до того, как часы пробьют двенадцать."
10023080-99 = "[s] «Очень хороший краткий пересказ.»"
10023080-100 = "Ну, это ведь вы предложили нам заключить союз, Сенсей."
10023080-101 = "[s] «Есть два вопроса, которые не дают мне покоя...»"
10023080-102 = "Спрашивайте."
10023080-103 = "Хотя... все свои секреты я пока раскрыть не могу."
10023080-104 = ""
10023080-107 = "[ns] «Первый вопрос касается последней фразы на визитной карточке.»"
10023080-108 = "Печальный меч роскоши, так и не вручённый другому."
10023080-109 = "Мы думали, ты говорила о мече на картине с рыцарем!"
10023080-110 = "Это было совсем по-детски просто. И меч, и корона — символы власти."
10023080-111 = "Я рассчитывала, что акцент загадки на часах станет подсказкой."
10023080-112 = "Но мы вообще не знали, что существует эта Корона Короля Часов."
10023080-113 = "В этом и была суть проблемы. Вы не могли расшифровать визитную карточку, потому что исходили из неверной предпосылки."
10023080-114 = "Потому что Мэйтаро лгал вам с самого первого разговора."
10023080-115 = "[s] «Вся эта миссия с самого начала была сложной схемой...»"
10023080-116 = "Хи-хи. Сюрприз!"
10023080-117 = "А теперь Мэйтаро узнает, что судьба не всегда вращается в его пользу. Этот мир — не площадка для его капризов и прихотей."
10023080-118 = "Мой ответ вас удовлетворил?"
10023080-119 = "[s] «Да. Второй вопрос... Зачем... всё это?»"
10023080-120 = "Вы становитесь предсказуемым, Сенсей."
10023080-121 = "Мои причины тоже просты. Я делаю это ради всех."
10023080-123 = "Ради всех...? То есть ты крадёшь вещи ради блага других людей?"
10023080-125 = "Именно. Мои стандарты красоты гласят: чем выше ценность, тем больше людей должны иметь возможность ею наслаждаться!"
10023080-126 = "Искусство — не привилегия избранных, спрятанная в их коллекциях и никогда не видящая света дня. Каждый имеет право наслаждаться красотой!"
10023080-127 = ""
10023080-129 = ""
10023080-131 = "Если позволить коварным планам Мэйтаро осуществиться, Корона Короля Часов в конце концов снова окажется на Чёрном рынке. Этого нельзя допустить."
10023080-132 = "Представьте, что настолько ценное произведение искусства внезапно снова появляется в преступном мире. Можете представить, что начнётся?"
10023080-133 = "Начнётся настоящий хаос. Я намерена забрать её до того, как случится такой печальный исход."
10023080-134 = "[s] «А потом? После этого ты передашь её Валькирии?»"
10023080-135 = "Вы серьёзно ждёте, что я доверюсь этим глупцам? Эти новички должны были держать меня под стражей. Я похожа на заключённую хоть в каком-то смысле?"
10023080-136 = "Я сохраню её у себя, пока мир наконец не сможет осознать истинную красоту таких произведений."
10023080-137 = "[s] «Так в итоге ты просто оставишь её себе!»"
10023080-138 = ""
10023080-140 = ""
10023080-142 = ""
10023080-143 = "Да, и? Ваше удивление забавно."
10023080-144 = "Вы забыли, что имеете дело с большой страшной воровкой? Теперь подожмёте хвост и ускачете?"
10023080-145 = ""
10023080-147 = ""
10023080-148 = "Я принимаю ваше предложение, Сенсей."
10023080-149 = "О?"
10023080-150 = "Я намерена завершить свою миссию. Мне поручено вернуть украденные предметы, значит, я их верну. Если временное партнёрство поможет добиться этого, я пожму ей руку."
10023080-151 = "И ещё..."
10023080-153 = "Мы..."
10023080-154 = "...Команда Токи!"
10023080-156 = "М-мы..."
10023080-158 = "...отряд!"
10023080-159 = ""
10023080-161 = ""
10023080-163 = "Вы все..."
10023080-164 = "Хи-хи. Вы продемонстрировали золотой стандарт красоты."
10023080-165 = "Отлично."
10023080-166 = "Ну что ж. Партнёры, составим план атаки?"
