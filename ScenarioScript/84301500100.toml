[translation]
84301500100-5 = "...Понятно."
84301500100-6 = "Да, этот чип и правда подозрительный. Похоже, он пришёл из-за пределов Миллениум."
84301500100-7 = "Ты можешь это определить?"
84301500100-8 = "Гарантировать не могу... но я знаю стили наших студентов. Никто из них не стал бы делать его таким образом."
84301500100-9 = "Откуда ты знаешь их стили?"
84301500100-10 = "Я президент студсовета Миллениум. Мне нужно знать, что нравится моим студентам и чего они хотят, чтобы создать школу, в которой всем будет лучше всего."
84301500100-11 = "Хотя это не значит, что я всегда принимаю лучшие решения..."
84301500100-12 = "Никто не ВСЕГДА принимает лучшие решения. Не стоит зацикливаться на этом."
84301500100-13 = "...Я... Нет, я..."
84301500100-14 = "В нынешнем положении я не могу..."
84301500100-15 = ""
84301500100-17 = ""
84301500100-18 = ""
84301500100-19 = "...Кого-то не хватает."
84301500100-20 = "У Нэру есть другое дело. Но оно уже в процессе, и скоро она должна вернуться."
84301500100-21 = "А пока я продолжу изучать чип. Это не займёт много времени, так что подождите, пожалуйста."
