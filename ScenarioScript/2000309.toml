[translation]
2000309-1 = "Друзья на высоте"
2000309-2 = "Центр Кивотоса"
2000309-3 = "Прогуливаясь по центру, я заметил Маширо, смотревшую на город с крыши здания."
2000309-4 = "Она серьёзно наблюдает за людьми внизу."
2000309-5 = "[s] «Интересно, чем она занята...»"
2000309-6 = "Я решил подняться на крышу и посмотреть, что она делает."
2000309-8 = "Крыша здания в центре города"
2000309-9 = ""
2000309-10 = ""
2000309-11 = "Сенсей? Что вы здесь делаете?"
2000309-12 = "Вы случайно увидели меня, пока шли по улице?"
2000309-13 = "Понятно. Должно быть, я была слишком погружена в мысли, чтобы заметить вас."
2000309-14 = "Хотите знать, снайперское ли это задание? Нет, я просто люблю так проводить время."
2000309-15 = "Отсюда видно большую часть города."
2000309-16 = "Машины, въезжающие в центр и выезжающие из него, усердно работающие люди и даже студенты в школе..."
2000309-17 = "Когда я вижу, насколько упорядоченно живёт этот город, трудно поверить, что в нём вообще может существовать несправедливость."
2000309-18 = "Но я знаю, что в Кивотосе прячутся те, кто ждёт возможности нарушить этот покой."
2000309-19 = "Я состою в Оперативной группе правосудия. Мне следовало бы делать больше..."
2000309-20 = "[s] «Но ты и так очень много работаешь, Маширо.»"
2000309-21 = "Правда? Мне кажется, мои усилия в лучшем случае самые обычные."
2000309-22 = "И я лишь делаю всё возможное, чтобы не отставать от остальных членов группы. Если бы я этого не делала..."
2000309-23 = "И всё же. Если вас это радует, возможно, быть обычной не так уж плохо. Хех..."
2000309-24 = "[s] «Ты ещё долго здесь останешься?»"
2000309-25 = "Обычно я не остаюсь так надолго."
2000309-26 = "Но я не против побыть здесь ещё немного, если вы останетесь со мной."
2000309-27 = ""
2000309-28 = ""
2000309-29 = "Ну что? Составите мне компанию... ещё совсем ненадолго?"
2000309-31 = "Мы с Маширо наблюдали за городом с крыши здания до самого заката."
