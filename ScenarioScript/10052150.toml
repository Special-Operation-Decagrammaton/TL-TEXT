[translation]
10052150-1 = "Даат, Мудрость Бездны, Сокрытая в Тени"
10052150-2 = ""
10052150-3 = "Что они пытаются сделать?"
10052150-4 = "Неужели это...?!"
10052150-5 = ""
10052150-14 = "Ого."
10052150-15 = "И-и-и-и-и?!"
10052150-16 = "Юзу? Сестрёнка?!"
10052150-17 = "Мидори... Кажется, я наконец прозрела!"
10052150-18 = "Ты вообще о чём?!"
10052150-19 = "Я думала, концепция космического линкора станет хитом... Но настоящий сценарист должен смотреть дальше и видеть то, что лежит за пределами возможного!"
10052150-20 = "Гигантский трансформирующийся динозавр-комбинированный робот! Мне даже в голову такое не приходило!"
10052150-21 = "Ты понимаешь, что нас тут вообще-то могут затоптать насмерть?!"
10052150-22 = "Сейчас я могу уверенно сказать только одно."
10052150-23 = "Будь здесь Нэру... уверена, она сказала бы что-то вроде..."
10052150-24 = "«Это чертовски круто.»"
10052150-25 = "[s1] «Это не гигантский трансформирующийся динозавр-комбинированный робот, Момои!»\n[s2] «Это гигантский трансформирующийся МОНСТР-комбинированный робот!»"
10052150-28 = "..."
10052150-29 = "Сейчас это вообще важно?!"
10052150-30 = ""
10052150-36 = "Лично я считаю таксономию важной областью исследований—#nПогодите, эта штука не к нам идёт? Это абсурд! Как мы вообще справимся с чем-то настолько огромным?"
10052150-37 = ""
10052150-39 = ""
10052150-41 = "..."
10052150-42 = "Не о чем беспокоиться."
10052150-43 = ""
10052150-45 = ""
10052150-46 = "Рио? Только не говори, что ты..."
10052150-47 = "Да. Запасной план для таких ситуаций."
10052150-48 = ""
10052150-50 = ""
10052150-51 = "Нео-Авангард."
10052150-52 = "Начать развёртывание."
10052150-53 = ""
10052150-61 = ""
10052150-62 = "Это...?!"
10052150-63 = "...Нео-Авангард?"
10052150-64 = ""
10052150-66 = ""
10052150-69 = ""
10052150-70 = "..."
10052150-71 = "..."
10052150-72 = "Пф! Ахахаха! Что это вообще такое? Дизайн — это ещё ладно..."
10052150-73 = "Но боже мой. Разве эта штука не слишком маленькая? Что вы вообще сможете с ней сделать? Думаю, одного щелчка Даат хватит, чтобы разнести её на куски!"
10052150-75 = "М-мне вдруг стало спокойнее. Хи-хи!"
10052150-76 = "Думаешь? Ты права. Размер действительно имеет значение во многих ситуациях."
10052150-77 = "Но не здесь и не сейчас."
10052150-78 = ""
10052150-80 = ""
10052150-81 = "Ч-Что...?"
10052150-82 = "Кей?"
10052150-83 = "...Ну, я всё-таки дала тебе обещание. Ладно. Времени мало, так что начнём."
10052150-84 = "Но сначала скажу это. Эйн, Соф, Ор. Спасибо."
10052150-85 = "Ч-Что?"
10052150-86 = "О чём... ты говоришь?"
10052150-87 = "Они, конечно же, блефуют! Наша Даат стойкая! Непобедимая! Сильнейшая! В мире нет способа ей противостоять!"
10052150-88 = "При любых других условиях твоё утверждение было бы верным."
10052150-89 = "Однако ваше решение использовать силу Безымянных Богов оказалось именно той переменной, которая была нужна нам для успеха."
10052150-90 = "Более того, вы использовали эту силу, чтобы создать явление, которое называете Стальным континентом."
10052150-91 = "...Похоже, вы попытались сменить подход, но я уже привыкла учитывать и это."
10052150-92 = "Постой... Из-за того, что мы создали Стальной континент...?"
10052150-93 = "Но даже если принцесса и её ключ здесь..."
10052150-94 = "..."
10052150-95 = "Н-неужели...?!"
10052150-96 = "Всё просто. То, что уже произошло однажды, может произойти снова. И естественно, во второй раз обычно всё идёт легче, чем в первый."
10052150-97 = "Был день, когда Хрома пыталась снизойти на Кивотос."
10052150-98 = "Мы сражались против этой силы, но одновременно использовали часть её мощи."
10052150-99 = "Мы выжили, используя абсолютно все доступные нам возможности."
10052150-100 = "Не только вы боретесь, Эйн, Соф и Ор. Борется каждое живое существо."
10052150-101 = "Стальной континент был создан силой Безымянных Богов."
10052150-102 = "И все восемь пророков на этом континенте в тот или иной момент подверглись её влиянию."
10052150-103 = "Наши многочисленные сражения с ними высвободили эту силу в данной области."
10052150-104 = "А ещё есть Кей, которая теперь поглотила ядра всех восьми пророков."
10052150-105 = "Если я смогу проанализировать энергию, то смогу её воспроизвести."
10052150-106 = "А как только сделаю это — смогу распоряжаться ею как захочу."
10052150-107 = ""
10052150-110 = "А? Погодите, тогда получается...!"
10052150-111 = "Что не так? В каком-то смысле эта сила всегда принадлежала мне и Арис."
10052150-112 = "Если есть претензии, не надо предъявлять их мне."
10052150-114 = "Тогда этот ваш Нео-чего-то-там станет...!"
10052150-115 = "Да. Я бы назвала это «гигантификацией материи.»"
10052150-116 = ""
10052150-126 = ""
10052150-129 = "ЭТО ПОТРЯСАЮЩЕ!!"
10052150-130 = "Э-это и правда невероятно!"
10052150-131 = "(Хотелось бы, конечно, обсудить с ней дизайн...)"
10052150-132 = "...Так вот какой у тебя был козырь."
10052150-133 = "Прости. У врага повсюду были уши, и я боялась утечки."
10052150-134 = "Поэтому ты рассказала об этом только Кей."
10052150-135 = "Кей была самым безопасным вариантом с точки зрения секретности."
10052150-136 = "А? Гигантский Нео-Авангард..."
10052150-137 = ""
10052150-143 = "Вежливо и осторожно протягивает руку к Юзу."
10052150-144 = "Ч-ЧЕГООО?!"
10052150-145 = "Ну разумеется."
10052150-146 = "Ведь пилотом Нео-Авангарда будет Юзу."
10052150-149 = "Я на это не соглашалась?!"
10052150-150 = "А! Юзу не заикалась! Значит, она действительно в шоке!"
10052150-151 = "Но ты ведь уже управляла другим Авангардом, верно?"
10052150-152 = "А...! Ты права, Рио! Был же Авангард, модифицированный специально для UZQueen!"
10052150-153 = "Да. Я об этом знаю. Поэтому..."
10052150-154 = ""
10052150-156 = ""
10052150-157 = "Садись в Нео-Авангард, Юзу."
10052150-158 = ""
10052150-160 = ""
10052150-162 = ""
10052150-163 = "А-а-а-а-а-а-а-а-а...?!"
10052150-164 = ""
10052150-172 = "Ч-Что же делать?!"
10052150-173 = "Для начала Нео-Авангард может управляться считыванием твоих мозговых волн."
10052150-174 = "...Пока что."
10052150-175 = "Пока что?!"
10052150-176 = "Да. Пока что Нео-Авангард будет двигаться так, как ты думаешь."
10052150-177 = "Т-т-т-ты просто повторила то же самое!"
10052150-178 = ""
10052150-182 = "Вперёд, Даат! Избавься от этой нелепой штуки!"
