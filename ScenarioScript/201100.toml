[translation]
201100-1 = "Эпизод 10;Маскарад"
201100-2 = "Бар Triad Drink"
201100-3 = ""
201100-5 = "[ns] «Оруэлл...?»"
201100-6 = "Имена — всего лишь имена. Но Знаки... Да, значение имеют лишь Знаки."
201100-7 = "Я не желаю недопонимания. Этот телеэкран — не телеэкран в том смысле, который знаком вам."
201100-8 = "На самом деле он делает обратное. Наблюдает — собирает информацию и реагирует соответствующим образом."
201100-9 = "И всё же я хотел бы задать вам вопрос, Сенсей."
201100-10 = "Ваша собственная Мистика... Она тоже изменилась. Совсем немного, но я вижу это. Я наблюдал."
201100-11 = "Я вижу, что в её нити вплетены новые возможности, прежде недостижимые."
201100-12 = "[s] «Ты что-нибудь знаешь о Посохе Шакеда?»"
201100-13 = "ПОСОХ Шакеда...? Посох ШАКЕДА...?!"
201100-14 = "Боже мой. Неужели собственные уши меня подводят? Вы действительно говорите о Ветви?"
201100-15 = "Понимаю, понимаю. Да, вы, обладающий необъяснимой силой... Вы также владеете Посохом! Впечатляющий символ! Самый впечатляющий, должен признать."
201100-16 = "Если эта Ветвь, которая должна находиться в руках президента Генерального ученического совета, находится в этом Ковчеге, то это должно быть..."
201100-17 = ""
201100-19 = ""
201100-20 = "...Понятно. Всего лишь реплика."
201100-21 = "Но образ заменяет реальность. И потому копия становится настоящей."
201100-22 = "...Как и нынешняя президент Генерального ученического совета."
201100-23 = ""
201100-25 = ""
201100-26 = ""
201100-27 = ""
201100-28 = "Тексты, которые вы мне приносите, всегда превосходят клише способами, выходящими за рамки моих ожиданий."
201100-29 = "Вы знаете, где находится президент Генерального ученического совета?"
201100-30 = "...Хм? Что вы имеете в виду?"
201100-31 = "Вы только что сами сказали. Что нынешняя президент — реплика, заменившая реальность."
201100-32 = "Если нынешняя президент Генерального ученического совета — реплика, тогда где настоящая?"
201100-33 = "...Хм."
201100-34 = "Чтобы существо, принадлежащее этому миру, отрицало Симуляцию мира. Феномены! Все до единого необъяснимы!"
201100-35 = "Кто вы? Кто вы, чей взгляд остаётся столь твёрдым перед лицом нереальности?"
201100-36 = "Кто дал вам эту власть? Сенсей? Или президент Генерального ученического совета?"
201100-37 = "Ах. Возможно, эти разбитые осколки вас настолько повреждены, что вы уже не способны рассуждать должным образом—"
201100-38 = "...!"
201100-39 = ""
201100-41 = ""
201100-42 = ""
201100-43 = "[ns1] «Отойди, Оруэлл.»\n[ns2] «Я не прощу тебя, если ты хоть как-то навредишь моему студенту.»"
201100-46 = "Прошу прощения. Я не хотел."
201100-47 = "Просто такова моя природа наблюдателя, исследователя и учёного — испытывать интерес перед отклонением."
201100-48 = "Если оставить трактовку в стороне и сначала ответить на ваш вопрос..."
201100-49 = "Симулякр никогда не скрывает истину. Симулякр и есть истина."
201100-50 = "О чём вы говорите? Вы хотите сказать, что нынешняя президент Генерального ученического совета и есть настоящая?"
201100-51 = "Я не говорю правду. Я не лгу. Есть лишь реальность."
201100-52 = "И доказательство тому... В этом мире нет ни свидетельств, ни причин, способных опровергнуть нынешнюю президента Генерального ученического совета."
201100-53 = "Это..."
201100-54 = ""
201100-56 = ""
201100-57 = ""
201100-58 = "[ns] «Не меняй тему.»"
201100-59 = ""
201100-61 = ""
201100-62 = "[ns3] «Чтобы спасти студента, не нужны великие цели или красивые речи.»\n[ns4] «Хватит нести эту эзотерическую чушь.»\n[ns5] «Иначе мы уйдём прямо сейчас.»"
201100-66 = "[ns] «Где президент Генерального ученического совета?»"
201100-67 = "Раз вы спрашиваете меня о местонахождении президента Генерального ученического совета... значит, вы ищете способ разрушить эту симуляцию."
201100-68 = "Но у вас уже есть средство сделать это, Сенсей."
201100-69 = "Мистика в этом Ковчеге — Ветвь Шакедии, позволяющая наблюдать истину."
201100-70 = "Используйте эту Ветвь, чтобы наблюдать Идею, и симулякр исчезнет, словно тень перед светом."
201100-71 = ""
201100-74 = "[ns6] «Не заставляй меня повторять вопрос.»\n[ns7] «Где сейчас находится президент Генерального ученического совета?»"
201100-77 = "...Понимаю."
201100-78 = "Хотя я и не поклонник сведения Знаков к вопросам практической выгоды, полагаю, у меня нет выбора, раз вы этого желаете."
201100-79 = "Предположим гипотетически."
201100-80 = "Если все в этом мире верят, что «лебеди белые», как эффективнее всего доказать существование «чёрного лебедя»?"
201100-81 = "...Показать им чёрного лебедя."
201100-82 = "Верно. Лучший способ опровергнуть реальность — предъявить контрпример, который ей противоречит."
201100-83 = "Но если вы не можете показать им своего чёрного лебедя... не можете ли вы хотя бы предъявить чёрное перо?"
201100-84 = "История этого мира была грубо и внезапно переписана лишь прошлой ночью. Противоречия всё ещё разбросаны по подтексту."
201100-85 = "Если оставить их без внимания, поток информации со временем размоет эти противоречия, и они исчезнут. Но если их зафиксировать и записать, они станут указателями, ведущими к Идее."
201100-86 = "[s] «...И как мне найти эти противоречия?»"
201100-87 = "Как вообще находят противоречия? Они повсюду, нужно лишь смотреть. Погрузитесь в святилище истины, что одиноко несёт дозор глубоко в море информации."
201100-88 = "«Море информации»... Вы имеете в виду интернет."
201100-89 = "Да! Современная Агора — социальные сети! Где желания и слухи закручиваются в восхитительный водоворот."
201100-90 = "Онлайн-сообщество повседневной жизни граждан, событий и личных впечатлений. Поистине подходящее отражение современного общества, не так ли?"
201100-91 = "Даже Мистика, которую вы носите с собой, принимает форму такого медиа-устройства, Сенсей."
201100-92 = "Исследуйте, собирайте и записывайте их."
201100-93 = "Ведь не ваша вера, а святилище Шакедии определит, чёрное это перо или белое."
201100-94 = "Записи примут форму чёрного лебедя, и другие жители Кивотоса увидят то же, что видите вы."
201100-95 = ""
201100-98 = "[ns] «Арона. Есть какие-нибудь опасения насчёт этого метода?»"
201100-100 = ""
201100-101 = "...Насколько я вижу, нет. Выглядит определённо подозрительно, но одно приложение соцсетей не должно суметь повлиять на Ковчег Шиттим."
201100-102 = "Технически MomoTalk — то же самое."
201100-103 = "Но даже Супер-ИИ Ароне понадобится немного времени, чтобы собрать и обработать все эти данные из интернета."
201100-104 = "Угх. Это как получить домашнее задание наблюдать за ипомеей прямо перед концом летних каникул."
201100-105 = "Поправка: это будет легко."
201100-106 = "Ковчег Шиттим значительно улучшился. Я возьму на себя ваши «задачи Сенсея», а у тебя останется достаточно вычислительной мощности для выполнения задания."
201100-107 = "Это хорошая возможность. Я давно хотела помогать с управлением студентами и ежедневными отчётами, чтобы снизить твою нагрузку."
201100-108 = "Ах, Плана! Ты что, пытаешься отобрать у меня работу?!"
201100-109 = "Мне всё равно, насколько ты великолепный ИИ! Я никогда не отдам тебе титул «Личного секретаря Сенсея»!"
201100-110 = "..."
201100-111 = "Н-Но!! Эм! Я ведь не только суперспособная, но ещё и очень понимающая."
201100-112 = "Так что, наверное... можем работать по очереди, ладно?"
201100-113 = "Спасибо, Арона."
201100-114 = "Таким образом, можно заключить, что новая функция социальных сетей не вызовет функциональных проблем."
201100-115 = "Пожалуйста, сделайте выбор, Сенсей."
201100-117 = ""
201100-118 = "[ns] «Хорошо. Я сделаю это.»"
201100-119 = "Прекрасный выбор."
201100-120 = ""
201100-122 = ""
201100-123 = ""
201100-124 = ""
201100-125 = ""
201100-126 = "Я чрезвычайно рад отправиться в это путешествие по исследованию Мистик мира не с кем иным, как с Сенсеем из Шале."
201100-127 = ""
201100-129 = ""
201100-130 = "[ns8] «Я по-прежнему не собираюсь к вам присоединяться.»\n[ns9] «Я лишь делаю всё возможное, чтобы спасти студента.»"
201100-133 = ""
201100-135 = ""
201100-136 = ""
201100-137 = ""
201100-138 = "Ха-ха! Само собой."
201100-139 = "И это признак настоящего взрослого. Вы не позволяете личным чувствам просачиваться в профессиональные дела."
201100-140 = ""
201100-142 = ""
201100-143 = ""
201100-144 = ""
201100-145 = "...Ну разумеется!"
201100-146 = "Я рад, что на этот раз вы приняли «рациональное» решение, Сенсей."
201100-147 = "Ах да. Я советую вам сохранять анонимность в сети. Известность вашего имени затруднит отделение беспристрастных мнений от бесполезных."
201100-148 = "И наконец, в знак благодарности я предоставлю вам доступ к своему локальному экземпляру. Надеюсь, он окажется полезен."
201100-150 = "Что ж, приятного пользования."
