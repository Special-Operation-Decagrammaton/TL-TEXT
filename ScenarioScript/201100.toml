[translation]
201100-1 = "Episódio 10; Baile de Máscaras"
201100-2 = "Drink Bar - 'Triad'"
201100-3 = ""
201100-5 = "[ns] \"Orwell......?\""
201100-6 = "Não se apegue a meros nomes. O que realmente importa são os 'símbolos'."
201100-7 = "E caso a minha aparência gere qualquer equívoco, permita-me esclarecer:#na 'teletela' não é um artefato que apenas vomita informações de forma unilateral."
201100-8 = "Pelo contrário: ela existe para perscrutar o interlocutor, colher dados e viabilizar o diálogo."
201100-9 = "Nesse sentido, desta vez serei eu quem fará a pergunta."
201100-10 = "O mistério que reside com o Sensei...... parece carregar uma essência um tanto distinta daquela de antes."
201100-11 = "Como se abrigasse uma nova possibilidade jamais catalogada――"
201100-12 = "[s] \"Você conhece o 'Cajado de Amendoeira'?\""
201100-13 = "O Cajado de Amendoeira......?!"
201100-14 = "Oh, céus...... não me diga que se refere àquela 'Vara' sagrada?!"
201100-15 = "Eu já sabia que o Sensei era portador de um poder insondável, mas pensar nisso......#nEsse é, sem sombra de dúvidas, o mais impressionante de todos os 'símbolos' que conheço!"
201100-16 = "A 'Vara' que originalmente deveria repousar nas mãos da Presidente do Conselho agora repousa no relicário.#nIsso significa que......"
201100-17 = ""
201100-19 = ""
201100-20 = "...... Compreendo. Trata-se de uma relíquia replicada, um simulacro."
201100-21 = "Entretanto, num mundo onde as imagens substituem a própria realidade, essa réplica passa a ter o valor de uma relíquia autêntica."
201100-22 = "...... Exatamente como a 'atual Presidente do Conselho'."
201100-23 = ""
201100-25 = ""
201100-26 = ""
201100-27 = ""
201100-28 = "O texto tecido pelo Sensei sempre ultrapassa qualquer expectativa. Rompe todos os clichês."
201100-29 = "Você sabe onde a verdadeira Presidente do Conselho está?!"
201100-30 = "...... Como disse? Aonde quer chegar com isso?"
201100-31 = "Você acabou de afirmar com todas as letras!#nDisse que a atual Presidente é como uma réplica que substituiu a realidade!"
201100-32 = "Se a atual Presidente não passa de uma cópia, onde foi parar a verdadeira?!"
201100-33 = "...... Ora, ora."
201100-34 = "Um ser que pertence a este mundo ousando negar a própria simulação do mundo......?#nQue fenômeno incompreensível."
201100-35 = "Quem é você afinal? Por qual motivo contempla a irrealidade através dos olhos da realidade?"
201100-36 = "De onde provém a sua autoridade? Do Sensei? Ou da Presidente do Conselho?"
201100-37 = "Ou será que você se quebrou por dentro a ponto de perder a sanidade dos seus próprios pensamentos――"
201100-38 = "......!"
201100-41 = ""
201100-42 = ""
201100-43 = "[ns1] \"Tira a mão dela.\"\n[ns2] \"Se der mais um passo em direção à minha aluna, não terei piedade.\""
201100-46 = "...... Peço escusas. Não havia a menor intenção de causar dano a ela."
201100-47 = "É apenas o vício inevitável da minha natureza de observador, peregrino e pesquisador da Gemátria......#nQuando me deparo com uma 'mutação' tão anômala, é irresistível não querer dissecá-la."
201100-48 = "Deixando a análise sobre ela de lado por um momento, responderei à sua indagação......"
201100-49 = "O simulacro não existe para ocultar a verdade.#nO próprio simulacro É a verdade."
201100-50 = "Você está dizendo que a atual Presidente do Conselho é a verdadeira?!"
201100-51 = "Apenas a realidade existe. Julgá-la como mentira ou verdade é irrelevante."
201100-52 = "Como prova incontestável disso...... não resta mais nenhum vestígio ou justificativa no mundo capaz de negar a existência da atual Presidente, não é mesmo?"
201100-53 = "Não pode ser......"
201100-54 = ""
201100-56 = ""
201100-57 = ""
201100-58 = "[ns] \"Dá pra parar de fugir do assunto?\""
201100-59 = ""
201100-61 = ""
201100-62 = "[ns3] \"Para salvar uma aluna, não preciso de justificativas pomposas nem discursos bonitos.\"\n[ns4] \"Se a sua intenção é continuar me enrolando com falatório vazio......\"\n[ns5] \"A nossa conversa termina aqui.\""
201100-66 = "[ns] \"Onde está a Presidente do Conselho neste exato momento?\""
201100-67 = "Descobrir o paradeiro físico dela não parece ser o seu verdadeiro objetivo...... Já entendi tudo.#nO Sensei está procurando uma maneira de quebrar esta simulação."
201100-68 = "Se for esse o caso, o Sensei já tem em mãos a ferramenta necessária."
201100-69 = "O mistério guardado no relicário―― o 'Ramo de Amendoeira' capaz de contemplar a verdade."
201100-70 = "Se contemplar o Ideal primordial através dessa vara, o simulacro se dissipará espontaneamente, como uma sombra que se esvai diante da luz."
201100-71 = ""
201100-74 = "[ns6] \"Não me faça repetir pela terceira vez.\"\n[ns7] \"Onde a Presidente do Conselho está agora?\""
201100-77 = "...... Compreendo."
201100-78 = "Não aprecio mutilar os símbolos por mero pragmatismo, mas se é essa a sua exigência inegociável, não me resta alternativa."
201100-79 = "Tomemos um exemplo hipotético."
201100-80 = "Num cenário em que toda a humanidade tenha como premissa absoluta que 'todos os cisnes são brancos', qual seria a forma definitiva de comprovar a existência de um 'cisne negro'?"
201100-81 = "...... Seria mostrando um cisne negro com os próprios olhos, não é?"
201100-82 = "Precisamente. A melhor forma de refutar a realidade aceita é apresentar um contraexemplo concreto."
201100-83 = "Porém, trazer a 'verdadeira Presidente do Conselho' em carne e osso não será tarefa simples.#nPortanto...... se não apresentarem ao menos uma pena negra, argumento algum terá poder de persuasão."
201100-84 = "Este mundo sofreu uma mutação repentina na noite passada. As contradições ainda jazem dispersas pelos cantos de Kivotos."
201100-85 = "Se forem ignoradas, serão tragadas pelo fluxo avassalador da informação e virarão pó.#nContudo, se forem devidamente registradas e consolidadas, servirão como bússola para reencontrar o Ideal."
201100-86 = "[s] \"...... E como a gente faz para encontrar essas contradições?\""
201100-87 = "Basta mergulhar a vara sagrada que contempla a verdade no oceano de dados da informação.#nFeito isso, as penas negras emergirão à superfície por conta própria."
201100-88 = "O oceano de dados...... você se refere à internet, não é?"
201100-89 = "Exatamente.#nEspecialmente as redes sociais, a ágora moderna onde convergem todos os anseios e boatos do mundo."
201100-90 = "O cotidiano dos cidadãos, os episódios presenciados e as impressões de cada indivíduo são registrados em primeira pessoa.#nNão é exagero afirmar que essa comunidade virtual é o símbolo máximo da sociedade contemporânea."
201100-91 = "O fato de o mistério em posse do Sensei ter assumido a forma de um dispositivo de mídia não é mera coincidência."
201100-92 = "Investigue, recolha e registre."
201100-93 = "Se a cor da pena é branca ou negra, não caberá à sua subjetividade decidir: a sagrada vara de Amendoeira revelará por si só."
201100-94 = "E no dia em que esses registros se acumularem até compor a figura inteira de um 'cisne negro'......#naté mesmo os cidadãos de Kivotos despertarão para a anomalia."
201100-95 = ""
201100-98 = "[ns] \"Arona, o que você acha?\""
201100-100 = ""
201100-101 = "...... Soa um pouco suspeito, mas instalar o aplicativo de redes sociais na Arca de Shittim não é problema nenhum!"
201100-102 = "Afinal, o MomoTalk também funciona como uma espécie de rede social!"
201100-103 = "Só que coletar e filtrar uma quantidade colossal de dados dispersos de incontáveis usuários da internet#nvai exigir um tempinho a mais, mesmo para a Super IA Arona-chan!"
201100-104 = "Uuuugh...... parece até quando passam aquela lição de férias pra observar o crescimento do feijão no último dia antes das aulas voltarem......"
201100-105 = "Não há motivo para preocupação."
201100-106 = "As capacidades da Arca de Shittim foram aprimoradas em relação ao padrão anterior.#nPortanto, se eu assumir parte das atribuições antes desempenhadas pela Senpai,#nnão haverá gargalos significativos."
201100-107 = "Eu já desejava aliviar o fardo da Senpai há algum tempo.#nPosso gerenciar os plantões diários e os relatórios de expediente perfeitamente......"
201100-108 = "Não vai me dizer que você tá querendo roubar o meu posto de veterana, Plana-chan?!"
201100-109 = "Por mais brilhante que você seja como operadora de IA,#no cargo de secretária número um do Sensei é meu e eu não abro mão!"
201100-110 = "......"
201100-111 = "M-Mas como eu sou uma veterana de coração muito generoso......"
201100-112 = "Se for pra gente revezar um pouquinho...... posso compartilhar algumas tarefas com você!"
201100-113 = "Muito obrigada pela compreensão, Senpai."
201100-114 = "Sendo assim, a integração do novo módulo de redes sociais está operacionalmente aprovada."
201100-115 = "Sensei, aguardamos o seu veredito final."
201100-117 = ""
201100-118 = "[ns] \"...... Está bem. Vamos seguir a sua proposta.\""
201100-119 = "Uma excelente escolha."
201100-120 = ""
201100-122 = ""
201100-123 = ""
201100-124 = ""
201100-125 = ""
201100-126 = "Explorar os mistérios deste mundo lado a lado com o ilustre Sensei é um privilégio que me enche de――"
201100-127 = ""
201100-129 = ""
201100-130 = "[ns8] \"Não se iluda: não estamos formando aliança nenhuma.\"\n[ns9] \"Estou apenas fazendo o que for necessário para salvar minhas alunas.\""
201100-133 = ""
201100-135 = ""
201100-136 = ""
201100-137 = ""
201100-138 = "Sim, compreendo perfeitamente o seu ponto."
201100-139 = "Afinal, um adulto digno desse nome jamais mistura sentimentos pessoais com o cumprimento do dever."
201100-140 = ""
201100-142 = ""
201100-143 = ""
201100-144 = ""
201100-145 = "...... É DISSO QUE EU TÔ FALANDO!"
201100-146 = "Fico imensamente satisfeito por ver o Sensei tomar uma decisão pautada na mais pura 'racionalidade' desta vez."
201100-147 = "Ah, antes que eu me esqueça:#npara colher informações de forma neutra e irrestrita, o anonimato é indispensável."
201100-148 = "Vou transferir as credenciais de acesso de uma conta anônima em minha posse para você. Fique à vontade para utilizá-la.#nConsidere um modesto gesto de gratidão por ter se disposto a ouvir minhas reflexões."
201100-150 = "Sendo assim...... aproveite a magia da mídia."
