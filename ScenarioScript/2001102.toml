[translation]
2001102-1 = "Подготовка к подработке"
2001102-2 = "Я пришёл к месту встречи вовремя, как и обещал."
2001102-3 = "О, сюда, Сенсей."
2001102-4 = "Кхм, прежде всего спасибо, что согласились сегодня поговорить со мной, Сенсей."
2001102-5 = "Я знаю, обычно вы довольно заняты работой..."
2001102-6 = "[s1] «Ты позвала меня, конечно я должен был прийти.»\n[s2] «Ты уже не раз меня уговаривала, так что всё нормально.»"
2001102-7 = "А? В смысле?"
2001102-8 = "[s3] «Я имею в виду, что ты особенная.»"
2001102-9 = "О-Особенная... Я?! Сенсей!"
2001102-10 = "Как мне вообще реагировать, когда вы ни с того ни с сего говорите такие странные вещи?! Вы хотите сказать, что...?!"
2001102-11 = "[s4] «Конечно. Серика, ты бесценный студент.»"
2001102-12 = "...А?"
2001102-13 = "...И только это вы имели в виду?"
2001102-14 = "У-У-у-ух!"
2001102-15 = "Н-Не говорите вещи, которые можно неправильно понять! Я чуть не подумала невесть что!"
2001102-16 = "Ух! Серьёзно!"
2001102-17 = "...А? Я умею влиять на людей? Я... убедительная?! К-Когда это я вообще—"
2001102-18 = "Эм, вообще-то... наверное, бывало, что я так делала."
2001102-19 = "В-В любом случае, это всё в прошлом! П-Простите!"
2001102-20 = "П-Похоже, мне есть над чем задуматься."
2001102-21 = "[s5] «Прости, я просто пошутил. Я приду, когда бы ты меня ни позвала.»"
2001102-22 = "Что? Вы шутили?"
2001102-23 = "Вы даже заставили меня почувствовать себя виноватой за своё поведение!"
2001102-24 = "Я на мгновение действительно, совершенно искренне раскаялась! И-Идиот!"
2001102-26 = "Уф... Я уже вымоталась, а мы ещё даже не начали. Серьёзно!"
2001102-27 = "[s] «Я немного увлёкся. Прости.»"
2001102-28 = "*вздох*... Серьёзно, Сенсей?"
2001102-29 = "Ну, ладно. Всё-таки вы пришли сюда специально, чтобы помочь мне."
2001102-30 = "Я-я правда за это благодарна."
2001102-31 = "[s] «Ты слишком добрая, Серика!»"
2001102-32 = "Ч-Что?! Зачем вы превращаете это в такое событие?!"
2001102-33 = "Хватит пытаться меня смутить! Давайте уже к делу!"
2001102-34 = "Как я говорила в MomoTalk, у меня есть несколько вопросов по моей подработке мико."
2001102-35 = "Это ведь не совсем обычная подработка."
2001102-36 = "Я мало знаю о том, как быть мико, поэтому хотела попросить у вас совета, Сенсей."
2001102-37 = "Итак! Я сама немного изучила, кто такие мико."
2001102-38 = ""
2001102-40 = ""
2001102-42 = ""
2001102-43 = ""
2001102-44 = ""
2001102-45 = ""
2001102-46 = ""
2001102-47 = "Начнём с происхождения мико..."
2001102-48 = "[s6] «Ты начинаешь с их происхождения?!»\n[s7] «Серика, ты собираешься написать энциклопедию о мико?»"
2001102-49 = "А-А? А что в этом плохого?"
2001102-50 = "А-А? А что в этом плохого?"
2001102-51 = "З-Зачем я так глубоко копаю тему мико?"
2001102-52 = "Ну, особой причины на самом деле нет..."
2001102-53 = "Просто... если я идеально сыграю роль мико на мероприятии, мне больше заплатят!"
2001102-54 = "...и как после такого мне не быть мотивированной?!"
2001102-55 = "[s] «Это так на тебя похоже, Серика.»"
2001102-56 = "В общем, многое показалось мне немного запутанным, поэтому научите меня, Сенсей."
2001102-57 = "Научите меня стать идеальной мико, чтобы мне больше заплатили!"
2001102-58 = "(Глаза Серики сияли неистовым энтузиазмом.)"
2001102-59 = "[s] «Вот что первым приходит мне в голову при слове „мико“.»"
2001102-61 = "(Я сходил в ближайший магазин и одолжил принадлежности для уборки.)"
2001102-63 = "Это... метла?"
2001102-64 = "И какое вообще отношение она имеет к работе мико?!"
2001102-65 = "[s8] «Когда думаешь о мико, конечно же вспоминаешь метлу!»\n[s9] «Метлы — орудия мико и ведьм!»"
2001102-66 = "Я-я в этом не уверена, но раз вы так говорите, Сенсей... Я вам доверяю."
2001102-67 = "Я-я в этом не уверена, но раз вы так говорите, Сенсей... Я вам доверяю."
2001102-68 = "И что мне с ней делать?"
2001102-69 = "[s] «Ну, убираться, конечно!»"
2001102-70 = "У-Убираться? То есть, это логично, но слишком уж просто."
2001102-71 = "Нет-нет. Не нужно всё усложнять."
2001102-73 = "Хорошо! Начну убираться, как вы сказали, Сенсей!"
2001102-75 = ""
2001102-76 = "Просто медленно подметать отсюда..."
2001102-77 = ""
2001102-78 = ""
2001102-79 = "*шурх* *шурх*"
2001102-80 = ""
2001102-81 = ""
2001102-82 = "Смести разбросанные листья... Не пропустить мусор на земле."
2001102-83 = ""
2001102-84 = "[s] «Ага! Ты всё больше похожа на настоящую мико, Серика!»"
2001102-85 = "Д-Да? Ну, тогда хорошо."
2001102-86 = ""
2001102-87 = "Но... это правда помогает мне стать лучшей мико?"
2001102-89 = "(Благодаря выдающимся навыкам уборки Серики парк стал невероятно чистым!)"
2001102-91 = "Фух. Думаю, с уборкой хватит. Хорошо, что дальше, Сенсей?"
2001102-92 = "[s] «Вторая важнейшая вещь для мико — это... гохэй!»"
2001102-93 = "Г-Гохэй...?!"
2001102-94 = ""
2001102-96 = ""
2001102-97 = ""
2001102-98 = "П-Подождите. Сенсей?"
2001102-101 = "Этот... гохэй — это палочка с прикреплённой к концу бумагой, верно?"
2001102-102 = "Что делать?!"
2001102-103 = "Мне нужно махать им, пока я танцую или благословляю? Эм, я не знаю как..."
2001102-104 = "[s] «Мико Серика, благослови меня!»"
2001102-105 = "Ч-Что? Сенсей, хватит меня смущать!"
2001102-107 = "В-Вот так?"
2001102-109 = "Или вот так?"
2001102-110 = "Я-я понятия не имею, что делаю!"
2001102-111 = "[s] «А теперь следующее!»"
2001102-113 = "После этого я продолжил объяснять Серике, чем занимается мико."
2001102-114 = "Следующая важнейшая вещь — к-карта заклинания?"
2001102-115 = "Мне нужно отправиться в путешествие и собрать разбросанные кусочки особого драгоценного камня? Какого ещё камня?!"
2001102-116 = ""
2001102-118 = ""
2001102-119 = "А чтобы возродить деревню, мне нужно приготовить алкоголь, пережёвывая рис? Это вообще... Сенсей?!"
2001102-121 = "Наше бурное обсуждение продолжалось ещё три часа."
2001102-122 = "[s] «Фух... Какой плодотворный урок.»"
2001102-123 = "Ох, эм, ничего себе..."
2001102-124 = "Столько всего..."
2001102-125 = "мне нужно учитывать как мико... Я-я и не знала."
2001102-126 = "Н-Но теперь я-я должна быть готова, правда?! Надеюсь?"
2001102-127 = "Не могу сказать, что освоила всё идеально, но если постараюсь...!"
2001102-128 = "[s] «Эм, Серика, тут такое дело...»"
2001102-130 = "Я не смог больше смотреть на растерянную Серику и рассказал ей правду."
2001102-132 = "Что? Всё, что вы мне до сих пор рассказывали, было из игр, манги и аниме?"
2001102-133 = "[s] «...Да.»"
2001102-134 = "..."
2001102-135 = "[s] «С-Серика?»"
2001102-137 = "Сенсей? То есть вы хотите сказать..."
2001102-138 = "Вы всё это время просто издевались надо мной. Всё это время?!"
2001102-139 = "Уф! Я вам доверяла! Я даже жевала рис, пока челюсть не заболела! Я действительно это делала!"
2001102-140 = "[s] «П-Прости! Мне нечего сказать в своё оправдание!»"
2001102-141 = "А-А-А-А-АРГХ!"
2001102-143 = "*вздох* Ну серьёзно...!"
2001102-144 = "Если вы не знали, надо было просто честно сказать!"
2001102-145 = "Вы только зря потратили моё время на разговоры о всякой странной ерунде!"
2001102-146 = "[s] «Я хотел помочь Серике любой ценой!»"
2001102-147 = "Хмф. Если вы так это ставите, наверное, я не могу слишком сильно злиться."
2001102-148 = "*вздох* Сенсей..."
2001102-149 = "Я потратила с вами весь день, Сенсей! Это даже не была консультация или что-то подобное. Мы просто весь день валяли дурака."
2001102-150 = "Да, только мы вдвоём... одни... вместе."
2001102-151 = ""
2001102-152 = "...А?!"
2001102-153 = "П-Подождите, только мы вдвоём? Я-я не имела в виду, что это было свидание или что-то странное!"
2001102-154 = "Вы ни в коем случае не должны так это понимать!"
2001102-155 = "[s] «Ага! Я точно, абсолютно, на сто процентов не пойму это неправильно!»"
2001102-156 = "..."
2001102-157 = "Ну, вообще-то можете понять н-немножко неправильно."
2001102-158 = "Ух! Серьёзно!"
2001102-160 = "(Мне едва удалось успокоить Серику, которая продолжала сердито колотить меня по спине.)"
