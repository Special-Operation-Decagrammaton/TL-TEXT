[translation]
2000805-1 = "Неважно, это вина Сенсея!"
2000805-2 = "Дополнительный корпус Геенны"
2000805-3 = "Меня обеспокоило, что Ако внезапно отключилась от MomoTalk, поэтому я пошёл её искать."
2000805-4 = ""
2000805-11 = ""
2000805-12 = "Ой. Сенсей?"
2000805-13 = "[s] «Вы все отлично справляетесь.»"
2000805-14 = "Ч-Что это вдруг...?"
2000805-15 = ""
2000805-17 = ""
2000805-18 = "А-Ах. Да. Я действительно связалась с вами. Упс."
2000805-19 = "Хи-хи. Спасибо за беспокойство, но ничего особенного не произошло."
2000805-20 = "Это был обычный день. Ничего особенного."
2000805-21 = "Хотите знать, что я делаю здесь так поздно?"
2000805-22 = "Накопилась огромная гора документов, с которыми нужно разобраться... Если я, администратор, этого не сделаю, никто не сделает."
2000805-23 = "Такова моя судьба идеального управляющего."
2000805-24 = "[s] «Я могу чем-нибудь помочь?»"
2000805-26 = "Хм-м, если я оставлю это вам, моя нагрузка, вероятно, только вырастет."
2000805-27 = ""
2000805-29 = ""
2000805-30 = "О, тогда можете вынести за меня эту коробку? Я собиралась выбросить её, но забыла."
2000805-31 = "Это... Так, посмотрим..."
2000805-32 = ""
2000805-33 = "Куча мусора, замаскированного под документы, которые прислало Общество Пандемониума."
2000805-34 = ""
2000805-35 = "Мои тапочки, которыми я больше не могу пользоваться, потому что их набили острыми предметами."
2000805-36 = "Поводок для питомца, на котором написано: «Сгинь, псина главы префектов!»"
2000805-37 = "[s1] «Разве это не травля?»\n[s2] «Ако, тебя что, травят?»"
2000805-38 = "Что? В смысле...?"
2000805-39 = "Что? В смысле...?"
2000805-40 = "Возможно, именно этого они и добивались, но они просто срывают на мне своё раздражение, потому что я — лицо Префекторской команды."
2000805-41 = "Ну, всё равно это неважно. Меня это совсем не беспокоит."
2000805-42 = "Такова моя роль старшего администратора Префекторской команды. Я справлюсь со всем, что они мне подбросят!"
2000805-43 = "[s] «Важно следить за уровнем стресса, Ако.»"
2000805-44 = "А?"
2000805-45 = "Я не могу это так оставить. Вы что, делаете вид, будто успокаиваете меня, а сами намекаете, что я плохо справляюсь со стрессом?"
2000805-46 = "Я, у которой нет ни единого недостатка, когда дело касается управления?"
2000805-47 = "[s] «Ага.»"
2000805-48 = "Даже не задумались?!"
2000805-49 = "Как вы можете говорить такую чепуху?! К-Конечно, не могу сказать, что у меня совсем нет стресса, но..."
2000805-50 = "Глава всегда занята, члены команды постоянно создают проблемы, а я вот работаю до глубокой ночи."
2000805-51 = "Иногда я злюсь, потому что всё это ужасно раздражает!"
2000805-52 = "Но всё же... думаю, я умею о себе заботиться."
2000805-53 = "Ну, может, в последнее время стало немного хуже. Ничего особенно не изменилось, разве что я стала чаще встречаться с вами."
2000805-54 = ""
2000805-56 = ""
2000805-57 = "Погодите... Мой стресс усилился из-за вас, Сенсей?!"
2000805-58 = "[s] «Из-за меня?!»"
2000805-59 = "А, теперь всё сходится! Если оглянуться назад, становится очевидно, что после знакомства с вами мой стресс почему-то стал ещё сильнее!"
2000805-60 = "Вы постоянно заставляете меня волноваться — вы мозолите мне глаза! Раздражаете меня, а иногда доводите до ярости!"
2000805-61 = "Это вы всё время заставляете меня нервничать!"
2000805-62 = "[s] «Так вот что происходило?!»"
2000805-63 = "Да, теперь я всё поняла!"
2000805-64 = "Отключение электричества, сломанный лифт, подгоревшая крокета, хлеб в холодильнике, который испортился, — всё это... Всё из-за вас, Сенсей!"
2000805-65 = "[s3] «Кто вообще делает такие бредовые выводы?!»\n[s4] «И снова: последнее совершенно точно было твоей виной.»"
2000805-66 = "Нет! Это вы плохой, Сенсей! Как ни посмотри, это ваша вина!"
2000805-67 = "Нет! Это вы плохой, Сенсей! Как ни посмотри, это ваша вина!"
2000805-68 = "[s] «Ты просто срываешься на мне?!»"
2000805-69 = "Что?! Что за ерунда! Я никогда так не делала!"
2000805-70 = "[s] «И кто теперь говорит ерунду?!»"
2000805-71 = ""
2000805-73 = ""
2000805-74 = "Хи-хи, похоже, до вас никак не достучаться."
2000805-75 = "Хорошо. Тогда хотите поспорить? Проигравший наденет поводок и будет лаять как собака."
2000805-76 = "[s] «Ладно. Давай.»"
2000805-77 = "..."
2000805-78 = "...Что?!"
2000805-79 = "П-Подождите... Это... Если вы вдруг согласились..."
2000805-80 = "То есть даже если мы поспорим... в такой ситуации ведь невозможно определить победителя или проигравшего..."
2000805-81 = "[s] «Решим броском монеты.»"
2000805-82 = "Что?!"
2000805-83 = "Броском монеты?!"
2000805-84 = "Вы хотите решить всё настолько случайным способом? М-Можно ли так вообще? Вы же учитель, правда? Вы уверены, что это нормально?"
2000805-85 = "[s] «Ты что, убегаешь, Амау Ако?»"
2000805-86 = "Гх!"
2000805-87 = "К-Кто это убегает?!"
2000805-88 = "Ладно! Это спор! Подбрасываем монету, и проигравший надевает поводок и лает как собака!"
2000805-89 = "Орёл или решка! Выбирайте, Сенсей. Если выпадет противоположная сторона — я выиграла!"
2000805-90 = "Но монету подбрасываю я! Так честно, правда?"
2000805-91 = "[s5] Выбрать орла.\n[s6] Выбрать решку."
2000805-92 = "Хорошо. Тогда я ставлю на решку."
2000805-93 = ""
2000805-95 = ""
2000805-96 = "Итак, решающий бросок!"
2000805-97 = ""
2000805-99 = ""
2000805-101 = ""
2000805-102 = "Готовы? Проверяю монету."
2000805-103 = "Результат...!"
2000805-104 = ""
2000805-106 = ""
2000805-107 = "О-Орёл?!"
2000805-108 = "Хорошо. Тогда я ставлю на орла."
2000805-109 = ""
2000805-111 = ""
2000805-112 = "Итак, решающий бросок!"
2000805-113 = ""
2000805-115 = ""
2000805-117 = ""
2000805-118 = "Готовы? Проверяю монету."
2000805-119 = "Результат...!"
2000805-120 = ""
2000805-122 = ""
2000805-123 = "Р-Решка?!"
2000805-124 = ""
2000805-126 = ""
2000805-127 = "..."
2000805-128 = "Эм, п-подождите..."
2000805-129 = "Сенсей, д-давайте это обсудим."
2000805-130 = "[s] «На колени.»"
2000805-131 = "Что?!"
2000805-132 = "П-Подождите, Сенсей? Вы серьёзно?! Здесь?!"
2000805-133 = "Т-Так... Эм... Т-Так... Эм..."
2000805-134 = "А-А если кто-нибудь придёт?"
2000805-135 = "[s] «Я посмотрю, чтобы никто не подошёл.»"
2000805-136 = "Но даже если вы..."
2000805-137 = "Эм..."
2000805-140 = "― Ух... Не могу поверить, что это произошло.[wa:1100]"
2000805-143 = "― Я никогда не забуду этого унижения![wa:2140]"
2000805-146 = "[ns] «Хорошо. Что мне делать дальше?»"
2000805-147 = "― Ах! Подождите, пожалуйста![wa:1330]"
2000805-149 = "― Всё, что дальше, уже не входило в нашу договорённость![wa:10]"
2000805-152 = "― П-Прогулка?! Сейчас? В таком виде?[wa:3800]"
2000805-155 = "― Э-Это уже точно...[wa:960]"
2000805-157 = "― П-Простите... Я лишь хотела немного вас подразнить, но всё вышло из-под контроля...[wa:1870]"
2000805-160 = "― С-Сколько ещё мне нужно оставаться в таком виде?[wa:3990]"
2000805-163 = ""
2000805-164 = "...Как унизительно."
2000805-165 = "Никто никогда не обращался со мной так!"
2000805-166 = "[s] Извиниться за незрелое поведение."
2000805-167 = ""
2000805-169 = ""
2000805-170 = "..."
2000805-171 = "Ну ладно."
2000805-172 = "Мне не стоило пытаться свалить всё на вас... Наверное, я просто была раздражена..."
2000805-173 = "Почему-то рядом с вами я никогда не могу скрыть свои чувства."
2000805-174 = "Ну, можно сказать, теперь мне намного спокойнее..."
2000805-175 = "...В любом случае!"
2000805-176 = "Давайте просто считать, что мы квиты!"
2000805-178 = "(Помирившись с Ако, я оставил неловкую атмосферу позади и вернулся в Шале.)"
2000805-179 = "(Лишь вернувшись, я понял, что забрал с собой поводок.)"
