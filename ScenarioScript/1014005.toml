[translation]
1014005-1 = "Осведомлённая лисица"
1014005-2 = "Внутри станции метро рядом с Шале"
1014005-3 = "Я закончил работу и должен был ехать на метро обратно в Шале."
1014005-4 = ""
1014005-6 = ""
1014005-7 = ""
1014005-8 = ""
1014005-9 = "На станции я увидел Куруми, фотографировавшуюся в автоматической фотокабинке."
1014005-10 = "Ах... Не нервничай..."
1014005-11 = "Раз, два..."
1014005-12 = ""
1014005-13 = "...Почему-то Куруми выглядела невероятно напряжённой, пытаясь сделать фото."
1014005-14 = ""
1014005-16 = ""
1014005-17 = ""
1014005-19 = "...Кья-а-а!"
1014005-20 = "[ns] Подойти к Куруми."
1014005-25 = "― [log=쿠루미]Ух, фу![/log][wa:510]"
1014005-29 = "― [log=쿠루미]Ч-Что? Когда вы пришли, Сенсей?[/log][wa:3730]"
1014005-32 = "[ns] «Почему ты так нервничаешь перед камерой...?»"
1014005-33 = "― [log=쿠루미]Я-я не нервничаю! Совсем![/log][wa:1280]"
1014005-35 = "― [log=쿠루미]Просто... мне немного трудно поймать правильный момент...[/log][wa:10]"
1014005-38 = "― [log=안내 음성]Смотрите сюда... Раз. Два. Три.[/log][wa:3970]"
1014005-40 = "― [log=쿠루미]Х-Хаха.[/log][wa:760]"
1014005-43 = "― [log=쿠루미]Ух... Я опять закрыла глаза.[/log][wa:1320]"
1014005-45 = "― [log=쿠루미]Почему-то этот отсчёт заставляет меня нервничать.[/log][wa:730]"
1014005-48 = "― [log=쿠루미]Н-Нет, постойте. Я никогда не нервничаю![/log][wa:1930]"
1014005-50 = "― [log=쿠루미]Я просто неосознанно закрыла глаза...[/log][wa:10]"
1014005-53 = "― [log=안내 음성]«Смотрите сюда»[/log][wa:330]"
1014005-55 = "― [log=쿠루미]Сейчас получится...![/log]"
1014005-58 = "― [log=안내 음성]«Раз. Два. Три.»[/log][wa:1780]"
1014005-60 = "― [log=쿠루미]Хаха.[/log][wa:570]"
1014005-63 = "― [log=쿠루미]Почему?! Почему я постоянно[/log][wa:1190]"
1014005-65 = "― [log=쿠루미]закрываю глаза?![/log]"
1014005-68 = "Ух, сколько раз я уже провалилась?"
1014005-69 = "Наличности почти не осталось..."
1014005-70 = "[s] «Думаешь, отсчёт заставляет тебя закрывать глаза?»"
1014005-71 = "Проблема не в самом отсчёте... Думаю, дело в ожидании вспышки."
1014005-72 = "Как боец первой линии, я часто сталкиваюсь со светошумовыми атаками. И в моём щите тоже есть вспышка."
1014005-73 = "Меня всегда учили отворачивать голову и закрывать глаза, когда ожидается вспышка."
1014005-74 = "Наверное, срабатывает мышечная память."
1014005-75 = "[s] «А на обычных фотографиях такое бывает?»"
1014005-76 = "Нет, только когда я начинаю ДУМАТЬ о том, что сейчас будет вспышка."
1014005-77 = "В такой кабинке ты заранее знаешь, что она сработает, и тебе точно говорят когда."
1014005-78 = "Поэтому инстинктивно напрягаюсь."
1014005-79 = "Ух... Вот почему я не хотела пользоваться фотокабинкой."
1014005-80 = "[s] «Куруми, можешь встать у той стены на секунду?»"
1014005-81 = "У стены? Вот так...?"
1014005-82 = ""
1014005-84 = ""
1014005-85 = "[ns] «Нет, прямо перед той белой стеной, вплотную.»"
1014005-86 = ""
1014005-88 = ""
1014005-89 = "Не понимаю, чем поможет просто стоять у стены."
1014005-90 = "Это никак не решает мою пробле—"
1014005-91 = ""
1014005-94 = "...Ах!"
1014005-95 = "Ч-Что вы делаете? Вы только что сфотографировали меня на телефон без разрешения!"
1014005-96 = "[s] «Прости-прости. Нужно было предупредить.»"
1014005-97 = ""
1014005-100 = "[ns] «Но тогда фотография могла получиться хуже.»"
1014005-101 = "Сомневаюсь, что она получилась хорошо! Я ведь вообще не была готова!"
1014005-102 = ""
1014005-104 = ""
1014005-105 = "...А? О. Неплохо."
1014005-106 = "[s1] «Все расслабляются в разные моменты.»\n[s2] «По-моему, естественное выражение тебе идёт больше всего, Куруми.»"
1014005-108 = "Что значит «идёт»...?!"
1014005-109 = "Не думайте, что сладкими речами выберетесь! Что вы собираетесь делать с этой фотографией?"
1014005-110 = "[s3] «Есть компании, которые печатают фото на документы из цифровых снимков.»\n[s4] «Можно попросить их напечатать твоё фото на документы из этого кадра.»"
1014005-113 = "Что? Надо было сразу рассказать мне об этом способе!"
1014005-114 = "...Нет. Отчасти я сама виновата, что не объяснила подробно."
1014005-115 = "В любом случае сегодня получилась пустая трата времени."
1014005-116 = "Потрачены деньги и время..."
1014005-117 = "[s] «А мне кажется, я остался в плюсе.»"
1014005-118 = "Как это вы остались в плюсе?"
1014005-119 = "[s] «У меня появилась фотография Куруми.»"
1014005-120 = "Э-Это..."
1014005-121 = "Угх... А-а-ах..."
1014005-122 = "Эту фотографию. Если используете её хоть для чего-то кроме документов, не думайте, что я вас пощажу!"
1014005-124 = "После этого я вернулся в Шале с необычно застенчивой Куруми."
