[translation]
2001606-1 = "Улыбающаяся фройляйн"
2001606-2 = "Получив сообщение от Ирохи в MomoTalk, я тщательно подготовился к её приходу."
2001606-3 = "[ns1] «Кофе и закуски есть...»\n[ns2] «Надо успеть немного поработать до её прихода.»"
2001606-14 = "[ns] «Готово... Ироха должна прийти с минуты на минуту.»"
2001606-15 = "Я был готов к её приходу, но в обычное время Ироха не появилась. Обед прошёл, а её всё не было."
2001606-16 = "Ирохи нигде не было видно."
2001606-19 = "Настало 15:00, а Ироха так и не пришла."
2001606-20 = "Обычно она приходила в Шале сразу после сообщения. Я начал переживать, не случилось ли с ней чего-то."
2001606-21 = "Я раздумывал, что делать, но выбор был только один."
2001606-22 = "[ns] «Может, сходить в Общество Пандемониума.»"
2001606-26 = "Когда я добрался до Общества Пандемониума академии Геенны, там царил хаос."
2001606-27 = "Как только танки будут готовы, перевезём прошедшее проверку стрелковое вооружение отряда. Не тяните и заканчивайте."
2001606-28 = "Поняла!"
2001606-29 = "Пожалуйста, обслуживайте оборудование на складе до следующей тренировки. Я не хочу делать всё дважды."
2001606-30 = "Я серьёзно. Очень не хочу, ясно?"
2001606-31 = "Так точно! Поняла, Ироха!"
2001606-32 = "Следующее в списке..."
2001606-33 = "На этом всё. Надеюсь, все хорошо поработают ради проверки боевой готовности Общества Пандемониума на следующей неделе."
2001606-34 = "Есть, госпожа!"
2001606-35 = "Вот."
2001606-36 = "[s] «Ироха?»"
2001606-37 = "Что? Сенсей?!"
2001606-38 = "С-Сенсей... Что вы здесь делаете?"
2001606-39 = "[s] «А... Насчёт этого...»"
2001606-40 = "Я рассказал Ирохе, как оказался в Обществе Пандемониума."
2001606-41 = "Вы пришли сюда только потому, что волновались?"
2001606-42 = "Просто потому, что я не пришла в Шале, как обычно?"
2001606-43 = "Пф."
2001606-44 = "[s] «Что тут смешного?!»"
2001606-45 = "Ха-ха-ха-ха! Вы прошли весь этот путь только чтобы проверить, всё ли со мной в порядке?"
2001606-46 = "Ох, Сенсей... Кажется, вы размякли."
2001606-47 = "Я же говорила, что хожу в Шале, чтобы вытащить вас из офиса!"
2001606-48 = "А что, если всё это было частью моего гениального плана? Что, если я специально не пришла, чтобы выманить вас из офиса?"
2001606-49 = "Вы вообще иногда думаете?"
2001606-50 = "[s] «Что?! Это всё с самого начала было твоим планом?!»"
2001606-51 = "Конечно нет."
2001606-52 = "Как видите, я действительно была здесь очень занята."
2001606-53 = "[s] «Так ты и правда работала... Я удивлён.»"
2001606-54 = "Я называю себя лежебокой, но иногда даже мне приходится быть продуктивной. Всё-таки я командир Общества Пандемониума."
2001606-55 = "Хи-хи. Ну что, поражены тем, какая я крутая? Вы ещё ничего не видели."
2001606-56 = "[s] «Прости, что отвлёк тебя, пока ты занята.»"
2001606-57 = "Извиняться не за что."
2001606-58 = "Вы проделали весь этот путь, а я здесь уже почти закончила."
2001606-59 = "Осталось только доложить председателю результаты сегодняшней проверки."
2001606-60 = "Но отчёты могут задерживаться по самым разным причинам."
2001606-61 = ""
2001606-63 = ""
2001606-64 = ""
2001606-65 = ""
2001606-66 = "[ns] «Вот теперь я узнаю Ироху.»"
2001606-67 = "Так что, может, покажу вам своё секретное убежище?"
2001606-68 = "Согласны?"
2001606-70 = "[ns] «Это... гараж?»"
2001606-71 = "Угу. Здесь мы храним танки, но я устроила себе собственный уголок."
2001606-72 = "Сюда, Сенсей."
2001606-73 = ""
2001606-76 = "Я здесь."
2001606-79 = "― Хи-хи,[wa:10]"
2001606-81 = "― неплохое место, правда?[wa:1060]"
2001606-84 = "― Смотрите на эту пушистую подушку![wa:10]"
2001606-86 = "― Идеально подобранный набор разных закусок.[wa:110]"
2001606-89 = "― И целая куча книг и игр.[wa:1440]"
2001606-92 = "― Это моё личное убежище. Я им довольно горжусь.[wa:700]"
2001606-94 = "― Ну как?"
2001606-97 = "[ns3] «Похоже, ты вложила в него много сил.»\n[ns4] «Понимаю, почему ты им гордишься.»"
2001606-98 = "― Хи-хи. Давайте, хвалите меня ещё![wa:960]"
2001606-99 = "― Хи-хи. Давайте, хвалите меня ещё![wa:960]"
2001606-101 = "― Я вся внимание.[wa:470]"
2001606-104 = "― Хорошо! Теперь, когда я заманила вас сюда...[wa:1240]"
2001606-106 = "― Может, как обычно, вместе прогуляем работу?[wa:10]"
2001606-109 = "― М-м, Сенсей?[wa:680]"
2001606-113 = "Прости, что тыкаю вас этим в лицо, но..."
2001606-114 = "Я снова вас поймала, Сенсей."
2001606-115 = "[s] «У тебя это всегда получается.»"
2001606-116 = "Хи-хи. Вам правда стоит быть осторожнее, Сенсей."
2001606-117 = "Вы всегда теряете бдительность, поэтому атаковать слишком легко."
2001606-118 = "[s] «Я постараюсь ради тебя, Ироха.»"
2001606-119 = "Буду ждать, Сенсей."
2001606-121 = "Мы с Ирохой провели время в её убежище, пока мне действительно не пришлось возвращаться к работе."
