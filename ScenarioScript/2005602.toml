[translation]
2005602-1 = "Что ты здесь делаешь?"
2005602-2 = "...Я решил, что Коюки, скорее всего, просто дурачится, поэтому проигнорировал её сообщения и отправился в круглосуточный магазин за поздним перекусом."
2005602-7 = "...? А? ...Сенсей?"
2005602-8 = "Что вы здесь делаете, Сенсей?"
2005602-9 = "[ns1] «Этот голос...»\n[ns2] «...Хм?»"
2005602-10 = ""
2005602-11 = ""
2005602-13 = ""
2005602-14 = "Это правда вы! Привет, Сенсей!"
2005602-15 = "Я уже подумала, что мне мерещится! Ну потому что чего это вы вообще так поздно на улице? Опять работаете?"
2005602-16 = "...А? Что я здесь делаю? Эй! Я первая спросила, так что сначала отвечайте вы!"
2005602-17 = "...А-а. Значит, всё-таки работаете допоздна. Бу-у. Я так и думала, но как же скучно."
2005602-18 = "Ладно-ладно, теперь моя очередь. Я просто по поручению! Старшекурсницы попросили меня кое-что купить перед сном."
2005602-19 = "А чем там заняты старшекурсницы? Хм-м..."
2005602-20 = "...Тем же, чем и вы. Работают."
2005602-21 = "[s3] «...Похоже, у Семинара тоже нелёгкие времена.»\n[s4] «Но мило, что они хотя бы пытаются дать тебе отдохнуть.»"
2005602-24 = "А? Чего вы так умиляетесь ИМ?! Я вообще-то прямо перед вами! Э-эй! Сенсей!!"
2005602-25 = "...А?"
2005602-26 = "Кстати, а что насчёт тех сообщений в MomoTalk, которые я отправляла раньше?"
2005602-27 = ""
2005602-29 = ""
2005602-30 = "...Каких сообщений в MomoTalk?"
2005602-31 = "[s5] «...Я так и знал, что там ничего серьёзного.»\n[s6] Показать ей сообщения из MomoTalk."
2005602-34 = "А-а-а. Эти!"
2005602-35 = "Ну-у-у, ничего особенного. Правда!"
2005602-36 = "Мы со старшекурсницами просто спорили, что вы ответите, если я ни с того ни с сего напишу вам «лол»."
2005602-37 = ""
2005602-40 = "...Что это за лицо?"
2005602-41 = "Эй, я ничего плохого не сделала! Серьёзно! Я вам даже не врала! Я ведь могла написать что-нибудь вроде: «А-а-а! Сенсей, помогите! Я В ОПАСНОСТИ!»"
2005602-42 = "И мы вообще-то не ставили ничего настоящего, ясно?! Так что! Никаких! Нотаций!"
2005602-43 = "Уже поздно, день был длинный, ужасный и тяжёлый! Я страдаю от недосыпа! СТРАДАЮ!"
2005602-44 = "...Что?"
2005602-45 = "...В мой «спектакль» трудно поверить, потому что я так одета?"
2005602-46 = "...Я выгляжу самым расслабленным и довольным человеком на свете?#nЭто ещё кто сказал, а?! Ну да, мне удобно, но всё равно!!"
2005602-47 = "[s7] «Ты сама это выбрала, Коюки?»\n[s8] «На удивление стильно!»"
2005602-50 = "А? А-а."
2005602-51 = "Не-а, обычно я просто сплю в чём-нибудь большом и свободном, что есть дома. Это Юука мне выбрала!"
2005602-52 = "Дизайн ведь очень милый, правда? И цвет такой яркий, что меня видно откуда угодно!"
2005602-53 = "[s9] «Это и правда так...»\n[s10] «(Возможно, именно в этом и был смысл.)»"
2005602-56 = "Эй! Вы сейчас о чём-то странном подумали, да?!"
2005602-57 = "...А?"
2005602-58 = "...Мне странно ходить в этом на улице, потому что это пижама?"
2005602-59 = "...И перед сном её придётся постирать? ...Ради гигиены?"
2005602-60 = "Да ну вас! Не придётся! Я живу так близко отсюда, что это почти как будто я всё ещё дома!"
2005602-61 = "И вообще, кто бы говорил, Сенсей! Вы сами сейчас совсем не похожи на того аккуратного и собранного взрослого, каким обычно бываете! Так что вам меня за одежду точно не отчитывать!"
2005602-62 = "[s11] «Но это другое...»\n[s12] «...Вот как ты решила играть?»"
2005602-65 = "Ну-ну! Не цепляйтесь к мелочам!!"
2005602-66 = "В любом случае, наша встреча здесь — это точно судьба! Давайте отметим перекусом, я угощаю!"
2005602-67 = "Вам ничего не нужно? Ой, да бросьте. Ну же, ну же!!"
2005602-68 = "...Такое редко случается, так что если я задержусь надолго, старшекурсницы могут не поверить, что я действительно ходила за покупками?"
2005602-69 = "Да ладно! Я ЖЕ СКАЗАЛА не цепляться к мелочам! А теперь — к полке со снеками!"
2005602-71 = "Мы с Коюки купили немного перекуса на потом, всё это время болтая без умолку."
2005602-72 = "Она упорно настаивала, что заплатит за всё сама, но в конце концов мне удалось уговорить её хотя бы поделить счёт пополам."
2005602-75 = "Ого! На улице идеально! Чувствуете, какой воздух хрустящий, Сенсей?"
2005602-76 = "Обожаю вот так гулять и жевать снеки посреди ночи."
2005602-77 = "Ну всё! Время ПИРА!"
2005602-79 = ""
2005602-82 = "...Ладно! Скажите «а-а-ам», Сенсей! А-а-ам!"
2005602-83 = ""
2005602-85 = ""
2005602-86 = "...Сенсей? Что такое?"
2005602-87 = "[s13] «Кстати, разве у тебя не было поручения?»\n[s14] «Тебя ведь там ждут, разве нет?»"
2005602-90 = "...!"
2005602-91 = "Не-е, вообще не переживайте. У меня уже есть план!"
2005602-92 = "Если я скажу всем, что была с вами, они точно поймут!"
2005602-93 = "А ещё скажу: «Я купила Сенсею кучу вкусняшек в благодарность за то, что он всегда нам помогает!»"
2005602-94 = ""
2005602-96 = ""
2005602-97 = "...Хи-хи."
2005602-98 = "[s15] «Так и знал, что здесь что-то нечисто!»\n[s16] Немедленно начать звонить в Семинар."
2005602-101 = "А!! Стойте!! Стойте-стойте-стойте!! ХВАТИТ! СТО-О-ОЙТЕ!"
2005602-102 = "Ну Сенсе-эй! Я и не знала, что вы такой зануда! Шуток совсем не понимаете?"
2005602-103 = "Думаете, с такой негибкостью можно выжить в этом жестоком мире?"
2005602-104 = "...А?"
2005602-105 = "...То есть я, по-вашему, само воплощение гибкости? Эй! Хватит воспринимать всерьёз всё, что я говорю!"
2005602-106 = "Уф, обещаю скоро вернуться, ну пожалуйста? Давайте ещё совсем чуть-чуть поболтаем! Я только это и имела в виду!"
2005602-107 = "...Так что давайте!! Скажите «а-а-ам»!!"
2005602-108 = "...А-а-а-ам!!"
2005602-110 = "По просьбе Коюки мы ещё немного посидели и поболтали на детской площадке."
2005602-111 = "Было непонятно, действительно ли она сонная, но на всякий случай я проводил её обратно до комнаты."
