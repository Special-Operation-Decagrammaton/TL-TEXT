[translation]
10026030-1 = "Эпизод 3;Участок A: Каменный лабиринт"
10026030-2 = "Команда решила сначала исследовать ближайшие руины."
10026030-3 = ""
10026030-6 = "Итак... Вот оно, да?"
10026030-7 = "«Руины» — самое подходящее слово."
10026030-8 = "Теперь здесь одни обломки. И всё же... По планировке и статуям ясно, что когда-то это был какой-то собор."
10026030-9 = ""
10026030-11 = ""
10026030-13 = "Похоже на то..."
10026030-14 = "Хм..."
10026030-15 = "А ты как думаешь, Кохару? По-твоему, это собор?"
10026030-16 = "Мм... Да, согласна... Но разве ты сама этого не знаешь? Почему спрашиваешь именно меня?"
10026030-17 = "Думала, я не смогу прийти к такому же выводу?"
10026030-18 = "Вовсе нет! Конечно, ты согласна с нами. Было бы странно, если бы нет, правда?"
10026030-19 = "Верно. Не о чем беспокоиться!"
10026030-20 = ""
10026030-22 = ""
10026030-23 = "...Ты опять надо мной издеваешься, да?!"
10026030-24 = ""
10026030-26 = ""
10026030-27 = ""
10026030-28 = "[ns1] «...Уи?»\n[ns2] «О чём задумалась?»"
10026030-31 = "А? Ни о чём. По крайней мере, ни о чём особенно необычном."
10026030-32 = "Я-Я просто подумала... Можно предположить, что эти руины действительно когда-то были собором."
10026030-33 = "Но если судить по расположению и размеру на карте, а также по лабиринту каменных стен..."
10026030-34 = "...это больше похоже на какой-то тренировочный полигон или место для испытаний... а может, и то и другое."
10026030-35 = "Чтобы выяснить наверняка, придётся изучить всё подробнее. Давайте разделимся, так быстрее охватим территорию. Здесь огромная площадь."
10026030-36 = "Я-Я пойду в эту сторону..."
10026030-37 = ""
10026030-39 = ""
10026030-40 = "Уи...?"
10026030-41 = "Хи-хи. Она живее, чем я ожидала. И довольно нелюдимая..."
10026030-42 = "Эм, в общем, Уи права. Здесь очень просторно."
10026030-43 = "Нам стоит разделиться."
10026030-44 = ""
10026030-46 = ""
10026030-49 = ""
10026030-51 = "Мы искали в лабиринте всё необычное."
10026030-52 = "Здесь пересекалось множество проходов. Повсюду стояли деревянные столбы, а значительная часть территории заросла мягким мхом."
10026030-53 = "И ещё..."
10026030-55 = ""
10026030-57 = "[ns3] «Кохару? Мы вообще-то должны были разделиться...»\n[ns4] «Почему ты просто ходишь за мной?»"
10026030-60 = "Что? Тебя это не устраивает?!"
10026030-61 = "Я же ясно сказала! Моя обязанность — следить за обстановкой, в том числе и за вами, Сенсей!"
10026030-62 = "Мне следовало бы присматривать и за Ханако, но раз мы все разделились..."
10026030-63 = "Ну не могу же я быть в двух местах одновременно! Поэтому делаю всё возможное в нашей ситуации."
10026030-64 = "...Что?"
10026030-65 = "Ну, я иду за вами, а не за Ханако, потому что... потому что, эм..."
10026030-66 = "Я не обязана отвечать! Что это вообще, допрос какой-то?! Не отвлекайтесь!"
10026030-67 = ""
10026030-70 = "А?! И-и-ик!"
10026030-71 = ""
10026030-73 = ""
10026030-74 = ""
10026030-75 = "Кажется, я понимаю..."
10026030-76 = "О... Да, Сенсей...?"
10026030-77 = "[s5] «Привет, Уи.»\n[s6] «Похоже, наши пути здесь пересекаются.»"
10026030-80 = "Похоже на то. Я недавно и Хинату встретила..."
10026030-81 = "Интересное место. Интересно, его специально строили как лабиринт?.."
10026030-82 = ""
10026030-84 = ""
10026030-85 = "О... Вижу, вы не одни, Сенсей."
10026030-86 = "...?!"
10026030-87 = "О, да... Я-Я... То есть... Ну..."
10026030-88 = "[s7] «Мы просто случайно встретились.»\n[s8] «Ей было тревожно одной, так что...»"
10026030-91 = "А. Понятно. Ну... Спасибо за вашу работу."
10026030-92 = "Я пойду дальше."
10026030-93 = "А? Вы хотите остаться вместе?"
10026030-94 = "Мм... Понятно..."
10026030-95 = ""
10026030-97 = ""
10026030-98 = ""
10026030-99 = ""
10026030-100 = ""
10026030-101 = "Эм... Я предпочитаю работать одна. Мне... некомфортно рядом с малознакомыми людьми."
10026030-102 = "Если бы мы приехали сюда отдыхать, всё было бы иначе. Но сейчас мне нужно сосредоточиться на работе."
10026030-103 = "Надеюсь, вы понимаете. Я не хочу никого обидеть... До встречи..."
10026030-104 = ""
10026030-106 = ""
10026030-107 = "Фух! Чуть не попалась."
10026030-108 = "Слушайте, не надо мне напоминать. Я знаю, что она добрая и что мне не нужно рядом с ней нервничать..."
10026030-109 = "И я не нервничаю... Правда! Блин! Вы говорите так, будто я постоянно на взводе..."
10026030-110 = ""
10026030-113 = "А-а-а-а!"
10026030-114 = ""
10026030-116 = ""
10026030-117 = ""
10026030-118 = "...Что?"
10026030-119 = "Сенсей? Хм... Это Кохару с вами?"
10026030-120 = "..."
10026030-121 = "А... З-Здравствуйте..."
10026030-122 = "Мы разделились, а лабиринт снова свёл нас вместе. Какое весёлое место!"
10026030-123 = "Д-Да... Верно..."
10026030-124 = "[ns] «...»"
10026030-125 = ""
10026030-126 = ""
10026030-128 = "За день мы ещё несколько раз сталкивались с Уи и Хинатой."
10026030-130 = "[ns9] «Похоже, это конец лабиринта.»\n[ns10] «Хорошая работа, Кохару.»"
10026030-133 = "Я вымоталась... Сенсей, мы ведь почти закончили, да?"
10026030-134 = "...Мм? О. Я рада, что, по-вашему, сегодня я хорошо справилась."
10026030-135 = "Всё оказалось не так страшно, как я думала. Через некоторое время я даже начала здороваться в ответ..."
10026030-136 = "Когда мы несколько раз встретились, стало легче..."
10026030-137 = ""
10026030-140 = "...!"
10026030-141 = "Наверное, следующим шагом мне нужно научиться здороваться первой, да?"
10026030-142 = "Вот увидите, Сенсей! Я научусь отлично здороваться первой!"
10026030-143 = ""
10026030-145 = ""
10026030-146 = ""
10026030-147 = ""
10026030-148 = "Э-Эм..."
10026030-150 = "П-П-При...!"
10026030-151 = ""
10026030-152 = ""
10026030-153 = "..."
10026030-154 = "..."
10026030-155 = "..."
10026030-156 = ""
10026030-158 = ""
10026030-159 = "Кья-а-а-а-а-а!!"
