[translation]
1002005-1 = "Чем я могу тебе помочь?"
1002005-2 = "В-Вот ты где, Сенсей. Сюда."
1002005-3 = "Можешь сесть там, а я останусь напротив. Р-Руки держи так, чтобы я их видела."
1002005-4 = "[s1] «Кафе под открытым небом? Шикарно. Ты забронировала столик?»\n[s2] «Может, для начала закажем напитки?»"
1002005-5 = "Я-я уже заказала нам напитки. Просто сиди там, Сенсей."
1002005-6 = "Я-я уже заказала нам напитки. Просто сиди там, Сенсей."
1002005-7 = "П-Причина, по которой я позвала тебя сюда... мне становится тревожно, когда я не вижу тебя."
1002005-8 = "Так что можно заодно..."
1002005-9 = "В смысле, сегодня у меня есть и другие дела. Они много времени не займут..."
1002005-10 = "...но это не повод спускать с тебя глаз! Это мой долг как члена Отряда справедливости!"
1002005-11 = "[s3] «Другие дела? Ты про то, над чем сейчас работаешь?»\n[s4] Посмотреть на тетрадь на столе рядом с Кохару."
1002005-12 = "...?!"
1002005-13 = "...?!"
1002005-14 = "Э-Это просто... В смысле..."
1002005-15 = "Я, эм..."
1002005-16 = "[s5] «Это те дополнительные задания, с которыми ты хотела помощи?»\n[s6] «Могла просто сказать об этом с самого начала.»"
1002005-17 = "Ну, я..."
1002005-18 = "Ну, я..."
1002005-19 = "*вздох* Ты прав."
1002005-20 = "М-Можешь помочь мне, Сенсей?"
1002005-21 = "Мне просто... нужна помощь с учёбой."
1002005-22 = "А?"
1002005-23 = "Правда? С-Спасибо. Не думала, что ты так легко согласишься."
1002005-24 = "А? С какой главы?"
1002005-25 = "Э-Эм. Начинается отсюда."
1002005-27 = "(После этого я изо всех сил помогал запинающейся Кохару разобраться с дополнительными заданиями.)"
1002005-28 = "(Учить ей пришлось много, но сам материал оказался не слишком сложным.)"
1002005-29 = "(Понадобилось время, чтобы она поняла основы, но дальше всё пошло гладко.)"
1002005-31 = "И это последнее."
1002005-32 = "Правда всё? Как я так быстро закончила?"
1002005-33 = "Не могу поверить."
1002005-34 = "Сенсей. Это..."
1002005-35 = "...?"
1002005-36 = "...Ха."
1002005-37 = "Теперь я поняла. Для тебя это вообще было пустяком."
1002005-38 = "Ты ведь профессионально обучаешь людей..."
1002005-39 = "Но всё равно. Наверное, я хочу сказать..."
1002005-40 = "...спасибо, Сенсей. Правда."
1002005-41 = "А? Что-то не так?"
1002005-42 = "На что ты смотришь?"
1002005-43 = "[s7] «Что это за книга там?»\n[s8] «На учебник не похоже.»"
1002005-44 = "А? Эта? Эм... Что она здесь делает?"
1002005-45 = "А? Эта? Эм... Что она здесь делает?"
1002005-46 = "Так, эта книга..."
1002005-47 = "...Эм."
1002005-48 = "А?"
1002005-50 = "[s] «Ох.»"
1002005-52 = "[s9] «О. Не знал, что ты читаешь такое.»\n[s10] «У тебя довольно взрослые вкусы, Кохару.»"
1002005-53 = "..."
1002005-54 = "..."
1002005-55 = "...!"
1002005-56 = "$#^@%#$@!"
1002005-57 = "%$^#&%$%#$@^!!@#$^!!!"
1002005-58 = ""
1002005-59 = "*ГРОХОТ*"
1002005-61 = "(И это всё, что я помню.)"
1002005-62 = "(После того как стол перевернулся, меня вырубило, поэтому дальше я ничего не помню.)"
