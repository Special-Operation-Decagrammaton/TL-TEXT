[translation]
11000-5 = "[FF6666]...Nós desejamos as Sete Lamentações.[-]"
11000-7 = "[FF6666]...Nós nos lembramos dos Preceitos de Jericó.[-]"
11000-10 = "Senha de acesso aprovada."
11000-13 = "Bem-vindo à \"Arca de Shittim\", Sensei [USERNAME]."
11000-36 = "...Foi erro meu."
11000-37 = "Minhas escolhas... e toda esta situação que elas acabaram provocando."
11000-45 = "No fim, só depois de chegar a este desfecho é que fui perceber que você tinha razão o tempo todo..."
11000-50 = "...Sei que é egoísmo pedir isso a essa altura, mas, por favor."
11000-51 = "Sensei [USERNAME]."
11000-52 = "Você provavelmente vai se esquecer de tudo o que eu disse, mas não tem problema."
11000-53 = "Mesmo sem se lembrar de nada, diante da mesma situação, você com certeza faria as mesmas escolhas..."
11000-56 = "Por isso... o que importa não são as experiências, e sim as escolhas."
11000-57 = "As inúmeras escolhas que somente você é capaz de fazer."
11000-71 = "Nós já conversamos sobre aqueles que carregam responsabilidades, não foi?"
11000-72 = "Naquela época eu não entendia... Mas agora eu compreendo."
11000-73 = "Os deveres e as responsabilidades de um adulto. E as suas escolhas, que nasciam diretamente disso."
11000-74 = "E até a determinação por trás de cada uma delas."
11000-75 = "..."
11000-76 = "Portanto, Sensei."
11000-77 = "Se for você — o adulto em quem eu posso confiar —,"
11000-78 = "então, além deste fim retorcido e distorcido, um outro resultado..."
11000-79 = "As escolhas que levam até lá... você com certeza vai encontrar."
11000-82 = "Então, Sensei, por favor..."
11000-85 = "...ei."
11000-86 = "...Sensei, acorde, por favor."
11000-87 = "Sensei [USERNAME]!!"
11000-89 = "Saguão do Conselho Estudantil Geral"
11000-91 = "..."
11000-92 = "[s] \"...?\""
11000-93 = "Eu pedi para que aguardasse um momento, mas parece que estava bem cansado.#nDormiu tão pesado que quase não acordava."
11000-94 = "...Pelo visto estava sonhando. Agora desperte direito e preste atenção, por favor."
11000-95 = "Vou explicar novamente a situação atual."
11000-96 = "Eu sou Rin Nanagami, executiva do Conselho Estudantil Geral da cidade acadêmica de \"Kivotos\"."
11000-97 = "E você provavelmente é o Sensei que convocamos até aqui... ao que tudo indica."
11000-98 = "...Ah. Falei em tom de suposição porque eu mesma não conheço os detalhes de como o Sensei veio parar aqui."
11000-99 = "..."
11000-100 = "Deve estar confuso, eu entendo."
11000-101 = "Lamento profundamente que as coisas tenham chegado a este ponto. Mas, por ora, apenas me acompanhe."
11000-102 = "Há algo que precisamos que o Sensei faça de qualquer maneira."
11000-103 = "..."
11000-104 = "Vamos dizer que é algo crucial... do qual depende o destino de toda a cidade acadêmica."
11000-106 = "[ns] Acompanhar."
11000-111 = "Vuuuuuuum—"
11000-114 = "Bem-vindo a \"Kivotos\", Sensei."
11000-115 = "Kivotos é uma gigantesca cidade acadêmica formada por milhares de escolas. E também é onde você vai trabalhar a partir de agora."
11000-116 = "Muita coisa aqui deve ser diferente do lugar de onde você veio, então talvez demore um pouco para se acostumar no começo..."
11000-117 = "Mas, sendo o Sensei, acredito que não há motivo para se preocupar tanto."
11000-118 = "Afinal, você foi escolhido pela própria Presidente do Conselho Estudantil Geral."
11000-119 = "...Deixemos essa explicação para depois, com mais calma."
11000-120 = "(Dim-dom)"
11000-122 = "Sala de Recepção"
11000-123 = "(Murmúrios...)"
11000-124 = "Espera aí! Presidente Interina! Te achei, estava te esperando! Chama logo a Presidente do Conselho Estudantil Geral!"
11000-125 = "...Hã? Quem é esse adulto do seu lado?"
11000-126 = "Administradora-Chefe. Estávamos à sua espera."
11000-127 = "Viemos falar com a Presidente do Conselho Estudantil Geral. A Chefe do Comitê Disciplinar exige uma explicação convincente sobre a situação atual."
11000-130 = "Aah... Fui logo interceptada por gente trabalhosa."
11000-131 = "Boa tarde a todas as representantes dos conselhos estudantis, do Comitê Disciplinar e demais pessoas com tempo de sobra que se deram ao trabalho de vir até aqui."
11000-132 = "Eu sei muito bem o motivo de pessoas tão desocup— digo, tão importantes estarem nos visitando."
11000-133 = "Vieram cobrar responsabilidades pelo caos que está tomando conta da cidade acadêmica... certo?"
11000-134 = "Se você já sabe disso, então dê um jeito! Vocês são o Conselho Estudantil Geral, não são?!"
11000-135 = "Milhares de distritos escolares estão um caos completo! Outro dia a usina eólica da minha escola simplesmente desligou do nada!"
11000-137 = "Também recebemos informações de que parte das alunas suspensas detidas no Departamento Correcional Federal fugiu."
11000-138 = "A frequência com que delinquentes como as Sukebans atacam nossas alunas a caminho da escola aumentou drasticamente nos últimos tempos.#nEstá ficando difícil manter a ordem pública."
11000-139 = "O tráfico ilegal de armas de origem desconhecida, incluindo tanques e helicópteros, cresceu mais de 2000%.#nDesse jeito, a rotina escolar normal fica completamente comprometida."
11000-141 = "..."
11000-142 = "O que a Presidente do Conselho Estudantil Geral está fazendo numa situação dessas? Por que ela não dá as caras há semanas?!#nChama ela aqui agora!"
11000-143 = "..."
11000-144 = "A Presidente do Conselho Estudantil Geral não está presente no momento. Para ser totalmente franca, ela desapareceu."
11000-146 = "...O quê?!"
11000-147 = "...!!"
11000-148 = "Então aquele boato era mesmo..."
11000-150 = "Indo direto ao ponto: com o sumiço da administradora-mestra da \"Torre Sanctum\", o Conselho Estudantil Geral perdeu o controle administrativo da cidade."
11000-151 = "Estávamos procurando um meio de contornar a autenticação... mas, até instantes atrás, não tínhamos encontrado solução alguma."
11000-152 = "Quer dizer que agora existe uma solução, Administradora-Chefe?"
11000-153 = "Sim."
11000-154 = "Este Sensei aqui é quem vai resolver esse impasse."
11000-156 = "!?"
11000-157 = "!"
11000-158 = "Esta pessoa?"
11000-159 = "[s] \"Eu?\""
11000-160 = "Espera aí! Pensando bem, quem é esse Sensei afinal? Por que está aqui?"
11000-161 = "Parece ser alguém de fora de Kivotos... mas então é mesmo um Sensei."
11000-163 = "Sim. Este é o Sensei [USERNAME],#nque vai atuar como Sensei em Kivotos a partir de hoje, tendo sido nomeado pessoalmente pela Presidente do Conselho Estudantil Geral."
11000-164 = "Nomeado pela Presidente que desapareceu...? Isso só está ficando mais confuso ainda..."
11000-165 = "[s] Cumprimentar todas."
11000-166 = "B-Boa tarde, Sensei. Eu sou da Escola de Ciências Millennium..."
11000-167 = "N-Não, agora não é hora de apresentações...!"
11000-168 = "Pode ignorar a barulhenta aí. Continuando..."
11000-169 = "Quem você chamou de barulhenta?! E-Eu sou Yuuka Hayase! Guarde bem esse nome, Sensei!"
11000-170 = "[s] \"Prazer em conhecer.\""
11000-172 = "...Originalmente, o Sensei foi convidado para ser o orientador de um certo clube fundado pela Presidente do Conselho Estudantil Geral."
11000-173 = "O Clube de Investigação Federal \"Schale\"."
11000-174 = "Não se trata de um clube comum, mas de uma espécie de órgão extrajudicial.#nPor ser uma organização federal, tem autoridade até para recrutar alunas de qualquer escola de Kivotos sem restrições,"
11000-175 = "e também pode conduzir operações de combate nos distritos autônomos de qualquer academia sem limitações."
11000-176 = "Não sei ao certo por que a Presidente do Conselho Estudantil Geral criou uma instituição com tanto poder..."
11000-177 = "A sede do Schale fica na zona externa, a cerca de 30 km daqui.#nNo momento o prédio está praticamente vazio, mas, por ordens da Presidente, levamos \"uma certa coisa\" para o subsolo de lá."
11000-178 = "Preciso levar o Sensei até lá."
11000-179 = "Momoka, preciso de um helicóptero direto para a sede do Schale..."
11000-180 = "Sede do Schale? ...Ah, lá na zona externa? Ih, tá uma baita confusão por lá agora, sabia?"
11000-181 = "Uma confusão...?"
11000-182 = "Uma aluna suspensa que fugiu do Departamento Correcional tá tocando o terror lá. Virou uma zona de guerra."
11000-183 = "...Hã?"
11000-184 = "Ela guarda rancor do Conselho Estudantil Geral, então juntou as delinquentes da região e tá botando fogo em tudo por lá.#nParece que arranjou até um tanque cruzador de algum lugar, acredita?"
11000-185 = "E pelo jeito ela tá tentando tomar o prédio do Schale, que pertence ao Conselho Estudantil Geral. Agindo como se tivesse algo super importante escondido lá, né?"
11000-186 = "..."
11000-187 = "Ah, mas aquele lugar já tá todo destruído mesmo, nem é nada dema... Opa, senpai, o delivery do meu almoço chegou! Depois a gente se fala!"
11000-188 = "(Clic)"
11000-189 = "..."
11000-190 = "(Tremendo de raiva)..."
11000-191 = "[s1] \"Tudo bem?\"\n[s2] \"Quer respirar fundo?\""
11000-192 = "...E-Estou bem. ...Surgiu um pequeno contratempo, mas nada de mais."
11000-193 = "...E-Estou bem. ...Surgiu um pequeno contratempo, mas nada de mais."
11000-195 = "(Encarando...)"
11000-196 = "...?"
11000-197 = "Q-Que foi? Por que está olhando assim pra gente?"
11000-198 = "Que alívio ter bem aqui na minha frente representantes tão ilustres e desocupadas de cada academia."
11000-199 = "...Hã?"
11000-200 = "Para restaurar a ordem em Kivotos, precisamos urgentemente da força de todas vocês que estão com tempo de sobra. Vamos."
11000-202 = "E-Espera aí?! P-Pra onde a gente tá indo?!"
11000-205 = "Zona Externa do D.U. • Arredores do Clube Schale"
11000-206 = "(Fiuuuuuuu!!)"
11000-207 = "(CABUUUUM!)"
11000-208 = "M-Mas que coisa é essa?!"
11000-209 = "(Ratatatatá!!)"
11000-210 = "Por que raios a gente tem que lutar contra delinquentes?!"
11000-211 = "Porque precisamos retomar aquela sede para recuperar o controle da Torre Sanctum..."
11000-212 = "Eu já ouvi essa parte...! Mas, pra sua informação, eu sou do conselho estudantil da minha escola e tenho certa posição lá! Por que logo eu tenho que...!"
11000-214 = "(Pá-pá-pá-pá!)"
11000-215 = "A-Ai!! Isso dói, caramba!! Essas malucas estão usando munição JHP ilegal?!"
11000-216 = "Abaixe-se, Yuuka. Além disso, munição ponta oca não é classificada como ilegal."
11000-217 = "Na minha escola vai virar ilegal já já! Isso deixa cicatriz!"
11000-218 = "O Sensei está conosco agora, então precisamos ter ainda mais cuidado."
11000-219 = "Proteger o Sensei é a prioridade máxima.#nRetomar aquele prédio vem em segundo lugar."
11000-220 = "Hasumi-san tem razão. Como o Sensei veio de fora de Kivotos..."
11000-221 = "Diferente de nós, uma única bala pode colocar a vida dele em risco. Muita atenção a isso!"
11000-222 = "Eu sei! Sensei, por favor, não vá para a linha de frente! Fique aqui neste lugar seguro enquanto a gente luta!"
11000-223 = "[s3] \"Eu assumo o comando, pode deixar comigo.\"\n[s4] \"A partir de agora, sigam minhas ordens.\""
11000-224 = "H-Hã?! Você vai fazer o comando tático? Bom... afinal você é um Sensei..."
11000-225 = "H-Hã?! Você vai fazer o comando tático? Bom... afinal você é um Sensei..."
11000-226 = "Entendido. A partir de agora, seguiremos o comando do Sensei."
11000-227 = "É natural que alunas obedeçam às orientações de um Sensei, não é mesmo? Contamos com você."
11000-229 = "Beleza, então vamos nessa!"
