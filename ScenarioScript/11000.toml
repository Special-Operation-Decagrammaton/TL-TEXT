[translation]
11000-5 = "[FF6666]...Мы жаждем семи стенаний.[-]"
11000-7 = "[FF6666]...Мы несём коан Иерихона.[-]"
11000-10 = "Пароль принят."
11000-13 = "Добро пожаловать в Ковчег Шиттим, Сенсей [USERNAME]."
11000-36 = "...Это всё моя вина."
11000-37 = "Мои решения и всё, к чему они привели."
11000-45 = "Только когда всё дошло до этого, я поняла, что вы с самого начала были правы..."
11000-50 = "...Я знаю, что с моей стороны это бесстыдно, но всё же должна попросить вас о помощи."
11000-51 = "Сенсей [USERNAME]."
11000-52 = "Вы забудете эти слова, но это неважно."
11000-53 = "Даже без воспоминаний вы, вероятно, примете то же решение при тех же обстоятельствах..."
11000-56 = "Вот почему... важны решения, которые мы принимаем, а не пережитый нами опыт."
11000-57 = "Есть решения, которые можете принять только вы."
11000-71 = "Раньше я уже говорила об ответственности."
11000-72 = "Тогда я не понимала её по-настоящему, но теперь понимаю."
11000-73 = "Взросление, ответственность, обязательства... и решения, которые вы принимаете, выходя за рамки этих понятий."
11000-74 = "Даже смысл, стоящий за ними."
11000-75 = "..."
11000-76 = "Сенсей."
11000-77 = "Я доверяю именно вам."
11000-78 = "Только вы можете освободить нас от этой искривлённой, искажённой судьбы..."
11000-79 = "...и найти решения, которые приведут нас к новой реальности."
11000-82 = "Поэтому, Сенсей. Прошу вас..."
11000-85 = "...сэй."
11000-86 = "...Сенсей. Проснитесь."
11000-87 = "Сенсей [USERNAME]!"
11000-89 = "Вестибюль Генерального ученического совета"
11000-90 = ""
11000-91 = "..."
11000-92 = "[s] «...?»"
11000-93 = "Вы, должно быть, очень устали. Не ожидала, что вы заснёте прямо во время ожидания — и уж тем более что вас будет так трудно разбудить."
11000-94 = "Наверное, вам что-то снилось. В любом случае, придите в себя и сосредоточьтесь..."
11000-95 = "Позвольте мне ещё раз объяснить текущую ситуацию."
11000-96 = "Меня зовут Нанагами Рин. Я служащая Генерального ученического совета академического города Кивотос."
11000-97 = "А вы — преподаватель, которого мы вызвали сюда... по крайней мере, похоже на то."
11000-98 = "Прошу простить мою неуверенность. Я говорю так лишь потому, что сама не до конца понимаю, как именно вы сюда попали."
11000-99 = "..."
11000-100 = "Понимаю, для вас всё это должно быть крайне запутанно."
11000-101 = "Прошу прощения. Но пока что я хотела бы, чтобы вы последовали за мной."
11000-102 = "Мне нужно, чтобы вы кое-что сделали."
11000-103 = "..."
11000-104 = "Скажем так: это чрезвычайно серьёзный вопрос, от которого может зависеть судьба всего академического города."
11000-105 = ""
11000-106 = "[ns] Последовать за ней."
11000-111 = "*жужжание механизма*"
11000-114 = "Добро пожаловать в Кивотос, Сенсей."
11000-115 = "Кивотос — огромный город, в котором расположены тысячи разных академий. Отныне вы будете работать здесь."
11000-116 = "Полагаю, он сильно отличается от места, которое вы называете домом. Поначалу вам может быть непросто привыкнуть..."
11000-117 = "...но почему-то мне кажется, что вы прекрасно справитесь."
11000-118 = "В конце концов, вас выбрала лично президент Генерального ученического совета."
11000-119 = "Остальные подробности оставим на потом."
11000-120 = "*динь*"
11000-122 = "Приёмная"
11000-123 = "*гул голосов*"
11000-124 = "А вот и вы, исполняющая обязанности президента! Мы заждались! Позовите уже настоящего президента!"
11000-125 = "А? Что за взрослый рядом с вами?"
11000-126 = "Я ждала встречи с вами, главный администратор."
11000-127 = "Я пришла на встречу с президентом Генерального ученического совета. Глава префектов требует ответов."
11000-128 = ""
11000-130 = "Что ж... момент, мягко говоря, не самый подходящий."
11000-131 = "Здравствуйте, гости, представляющие ученические советы соседних академий, дисциплинарные комитеты и прочих лиц, у которых, видимо, слишком много свободного времени."
11000-132 = "Я прекрасно понимаю, почему вы, праздно шатающиеся... то есть важные представители... собрались здесь сегодня."
11000-133 = "Вы пришли потребовать от нас ответа за беспорядки, происходящие в академическом городе. Я права?"
11000-134 = "Раз вы прекрасно всё понимаете, так сделайте что-нибудь! Вы представляете Генеральный ученический совет!"
11000-135 = "Тысячи районов академий охвачены паникой! А ещё всего несколько дней назад отключился ветрогенератор нашей академии!"
11000-137 = "Мы также получили сведения, что несколько отстранённых студентов сбежали из-под стражи Федерального исправительного бюро."
11000-138 = "Резко выросло число бандитов, нападающих на наших студентов по дороге в школу. Общественная безопасность совершенно не обеспечивается."
11000-139 = "Незаконный оборот танков, вертолётов и прочего неизвестного вооружения вырос более чем на 2000 процентов. Такими темпами обычная школьная жизнь в Кивотосе скоро останется в прошлом."
11000-141 = "..."
11000-142 = "И чем же занимается президент Генерального ученического совета, пока всё вокруг катится к чертям? Я требую немедленно привести её сюда!"
11000-143 = "..."
11000-144 = "Президента сейчас здесь нет. Если говорить прямо — она пропала без вести."
11000-146 = "Что?!"
11000-147 = "...!"
11000-148 = "Значит, слухи были правдой..."
11000-150 = "Перейду сразу к делу. Генеральный ученический совет лишён полномочий, потому что исчез главный администратор Башни Санктум."
11000-151 = "Мы пытались найти способ обойти проверку доступа, но всё было безуспешно... до этого момента."
11000-152 = "Вы хотите сказать, что нашли способ, главный администратор?"
11000-153 = "Именно."
11000-154 = "Сенсей — решение нашей проблемы."
11000-156 = "...?!"
11000-157 = "!"
11000-158 = "Этот человек?"
11000-159 = "[s] «Я?»"
11000-160 = "Погодите. Кто вообще этот «Сенсей», о котором вы говорите? И что этот человек здесь делает?"
11000-161 = "Похоже, он не из Кивотоса... Тогда преподаватель — вполне логично."
11000-163 = "Это Сенсей [USERNAME]. Он не только будет преподавать в Кивотосе — его лично выбрала президент Генерального ученического совета."
11000-164 = "Выбран пропавшим президентом...? Всё становится только запутаннее..."
11000-165 = "[s] Улыбнуться и поприветствовать всех."
11000-166 = "Д-да. Приятно познакомиться, Сенсей. Я из Научной школы Миллениум..."
11000-167 = "П-погодите, сейчас не до знакомств...!"
11000-168 = "Можете не обращать внимания на эту надоедливую девчонку. Продолжим—"
11000-169 = "Кого это ты назвала надоедливой?! Я-я Хаясэ Юука! Обязательно запомните это имя, Сенсей!"
11000-170 = "[s] «Мне тоже приятно познакомиться»."
11000-172 = "...Вы будете советником клуба, который создала президент Генерального ученического совета."
11000-173 = "Федеральный следственный клуб «Шале»."
11000-174 = "Это не обычный клуб — скорее своего рода внесудебная организация. Поскольку клуб федеральный, вам разрешено регистрировать в нём студентов из любой академии Кивотоса."
11000-175 = "Кроме того, вам разрешено без ограничений участвовать в боевых действиях на территории любого академического района."
11000-176 = "Однако я не знаю, зачем президенту понадобилось создавать организацию с настолько широкими полномочиями."
11000-177 = "Клубная комната Шале находится примерно в 30 километрах отсюда. Сейчас здание пустует, но по просьбе президента нам пришлось поместить кое-что в подвал."
11000-178 = "И моя задача — доставить вас туда."
11000-179 = "Момока. Мне нужен вертолёт, чтобы добраться до клубной комнаты Шале."
11000-180 = "До клубной комнаты Шале? ...А, той, что на окраине? Там сейчас творится какой-то кошмар."
11000-181 = "Что значит «кошмар»?"
11000-182 = "Отстранённый студент сбежал из Исправительного бюро и теперь устраивает погром. Там сейчас настоящее поле боя!"
11000-183 = "Что?"
11000-184 = "Она собрала всех местных бандитов, и теперь они крушат всё на своём пути, мстя Генеральному ученическому совету. Говорят, у них даже есть танк «Крусейдер»!"
11000-185 = "Наверное, они пытаются захватить здание Шале, потому что оно принадлежит Генеральному ученическому совету. Может, думают, что внутри хранится что-то ценное."
11000-186 = "..."
11000-187 = "Ну и ладно. Город и так уже помойка, так что большой разницы это не сделает— О, отлично! Мою еду привезли. Потом поговорим!"
11000-188 = "*щелчок*"
11000-189 = "..."
11000-190 = "*щёлкает пальцами*"
11000-191 = "[s1] «Ты в порядке?»\n[s2] «Дыши глубже, Рин. Дыши глубже.»"
11000-192 = "Я в порядке... Просто небольшая заминка. Ничего страшного."
11000-193 = "Я в порядке... Просто небольшая заминка. Ничего страшного."
11000-194 = ""
11000-195 = "(пристально смотрит)"
11000-196 = "...?"
11000-197 = "Что? Почему вы так на нас смотрите?"
11000-198 = "Как же нам повезло, что рядом оказались такие надёжные представители академий."
11000-199 = "А?"
11000-200 = "Нам понадобится ваша помощь, чтобы вернуть Кивотосу порядок. Идёмте."
11000-202 = "Погодите, что? К-куда мы идём?"
11000-205 = "Окраина D.U., рядом с клубной комнатой Шале"
11000-206 = "*вжух*"
11000-207 = "*ГРОХОТ*"
11000-208 = "Ч-что происходит?!"
11000-209 = "*бах* *бах* *бах* *бах*"
11000-210 = "Почему именно мы должны с ними драться?!"
11000-211 = "Рин сказала, что вернуть клубную комнату критически важно, если они хотят восстановить контроль над Башней Санктум."
11000-212 = "Я это понимаю, но почему такая чёрная работа свалилась именно на меня?! Я состою в престижном ученическом совете своей академии!"
11000-213 = ""
11000-214 = "*бах* *бах* *бах*"
11000-215 = "Ай! Больно! Какого чёрта?! Они что, используют нелегальные экспансивные патроны JHP?!"
11000-216 = "Просто укройся, Юука. И вообще, технически экспансивные пули не считаются незаконными."
11000-217 = "Ну вот в нашей академии с этой минуты считаются! От такого шрам останется!"
11000-218 = "Не забывайте, что Сенсей здесь с нами."
11000-219 = "Безопасность Сенсея — наш главный приоритет. Возвращение здания на втором месте."
11000-220 = "Хасуми права. Сенсей не из Кивотоса."
11000-221 = "А значит, в отличие от нас, даже одна пуля может серьёзно ранить Сенсея. Не забывайте об этом!"
11000-222 = "Я знаю! Сенсей, вам нельзя выходить на поле боя. Оставайтесь здесь, а мы со всем разберёмся!"
11000-223 = "[s3] «Я возьму командование на себя. Доверься мне.»\n[s4] «Теперь указания буду давать я.»"
11000-224 = "Ч-что? Вы возьмёте командование? Ну... наверное, в этом есть смысл, раз вы преподаватель."
11000-225 = "Ч-что? Вы возьмёте командование? Ну... наверное, в этом есть смысл, раз вы преподаватель."
11000-226 = "Хорошо. Мы будем следовать вашим указаниям."
11000-227 = "Студент должен слушаться преподавателя. Мы рассчитываем на вас."
11000-228 = ""
11000-229 = "Ладно! Вперёд!"
