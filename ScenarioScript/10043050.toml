[translation]
10043050-1 = "Эпизод 5;Главное — несгибаемый дух"
10043050-2 = ""
10043050-3 = "Понятно... значит, Рэй немного отдыхает."
10043050-4 = "[s] «Да, мы ОЧЕНЬ много бегали туда-сюда.»"
10043050-5 = "(кивает) Следить за каждым человеком в этой огромной толпе и искать что-то подозрительное..."
10043050-6 = "...это выматывает и физически, и морально."
10043050-7 = "[s] «Ты сама держишься, Сумирэ?»"
10043050-8 = "Я в порядке. Для такого у меня хватает выносливости."
10043050-9 = "Вообще-то я заметила пару подозреваемых. И пока на мне эта форма и я изображаю «подработчицу»..."
10043050-10 = "...думаю, знаю, как к ним подобраться!"
10043050-11 = "Пошли!"
10043050-12 = ""
10043050-14 = ""
10043050-19 = ""
10043050-20 = "Во-первых, вон тот человек."
10043050-21 = ""
10043050-23 = ""
10043050-25 = ""
10043050-26 = "Третья подача, прямая, свинг-страйк..."
10043050-27 = "Четвёртая подача, сплиттер, бол..."
10043050-28 = ""
10043050-33 = "Пятая подача, удар... флай в центр... Значит, процент отбивания..."
10043050-34 = "...а ERA питчера теперь..."
10043050-35 = ""
10043050-37 = ""
10043050-39 = "Видите его, Тренер? Он всё это время что-то записывает."
10043050-40 = "[s] «Это... определённо необычно.»"
10043050-41 = "Именно. Я даже не так хорошо знаю бейсбол, но всё равно сразу его заметила."
10043050-42 = "Зачем он записывает всю статистику обеих команд?"
10043050-43 = "Пойду выясню..."
10043050-44 = "А? Что я собираюсь делать? Не волнуйтесь, Тренер. Просто выполняю свою «подработку»."
10043050-47 = "Если посчитать OPS..."
10043050-48 = ""
10043050-50 = ""
10043050-51 = ""
10043050-52 = "Здравствуйте, сэр! Хотите напиток?"
10043050-53 = "Ого! Ч-что...? Напиток? Что?"
10043050-54 = "Если подумать, я так увлёкся записями, что забыл о жажде. Ладно, давайте один."
10043050-55 = "Вот, держите. Пейте!"
10043050-56 = ""
10043050-60 = ""
10043050-61 = "Так, следующий отбивающий выходит, и..."
10043050-62 = "Что вы записываете?"
10043050-63 = "Это? Да... ничего особенного. Средние показатели отбивания, типы подач, результаты ударов и всё такое."
10043050-64 = "А? Зачем вам это знать?"
10043050-65 = "..."
10043050-66 = "Не ваше дело! Просто занимайтесь своей работой!"
10043050-67 = ""
10043050-69 = ""
10043050-70 = "(Видели, Тренер?)"
10043050-71 = "[s1] «(...Нужно расследовать дальше.)»\n[s2] «(Только не слишком явно...)»"
10043050-74 = "(Поняла!)"
10043050-80 = ""
10043050-81 = "А-а, из-за тебя я пропустил розыгрыш! Всё испортила! На сайте ставок мне начисляют очки только если я загружаю ВСЁ в реальном времени!"
10043050-82 = ""
10043050-85 = ""
10043050-86 = "...На сомнительный сайт ставок, где вы пытаетесь влиять на коэффициенты."
10043050-87 = "Знаешь, я фанат, билет купил... Буду делать здесь что хочу!"
10043050-88 = "Мне это совсем не кажется правильным."
10043050-89 = "Фанаты здесь ради игроков, а игроки — ради фанатов."
10043050-90 = "Спортивной культуре нужны фанаты, и много, но всё равно существуют границы!"
10043050-91 = "Представьте тренировочный центр, где участники просто «делают что хотят». Что тогда?"
10043050-92 = "Уф, я не просил лекцию! ...Ладно, я ухожу."
10043050-93 = ""
10043050-95 = ""
10043050-97 = "Ну, по крайней мере, мы остановили нечестного фаната..."
10043050-98 = "...но на преступника он совсем не похож."
10043050-99 = "[s] «Ну, я всё равно думаю, что остановить его было правильно...»"
10043050-100 = "Спасибо, Тренер."
10043050-101 = "Но не будем сдаваться. Если я сдамся сейчас... пропущу столько подъёмов по лестницам!"
10043050-102 = "Следующая зацепка вон там!"
10043050-106 = ""
10043050-107 = "Вперёд, Герои! Боритесь! Побеждайте!"
10043050-108 = "Маршируйте под барабаны победы! Мы вместе с вами!"
10043050-109 = ""
10043050-111 = ""
10043050-113 = ""
10043050-114 = "[ns] «Группа поддержки?»"
10043050-115 = "Не только, Тренер. Присмотритесь."
10043050-116 = "Они МОГУТ выглядеть как самая обычная барабанная группа поддержки..."
10043050-117 = "Но знаете ли вы, что барабанами можно передавать секретные сообщения азбукой Морзе?"
10043050-118 = ""
10043050-121 = "Я уже подумал, что Сумирэ слишком глубоко копает, но..."
10043050-124 = ""
10043050-125 = ""
10043050-126 = "К-как вы узнали? План был идеальным: притвориться фанатами «Героев» и с помощью азбуки Морзе воровать их сигналы! Как вы догадались?"
10043050-127 = ""
10043050-130 = ""
10043050-131 = "Я брала азбуку Морзе факультативом. Участникам Клуба взлома кодов, кажется, не помешали бы тренировки."
10043050-132 = "[s3] «Ты брала?!»\n[s4] «И только ради этого?»"
10043050-135 = "Немного отвлекусь... но всё же хочу кое-что сказать."
10043050-136 = "Победы и поражения имеют ценность потому, что по умолчанию все согласны: игра должна быть честной."
10043050-137 = "Искажая эту честность, как вы сейчас, вы просто обесцениваете победу."
10043050-138 = "Настоящий спорт держится на спортивном духе."
10043050-139 = ""
10043050-142 = ""
10043050-143 = "...Может быть, но нам страшно, понимаете?"
10043050-144 = "А что, если мы ПРОИГРАЕМ «Героям»?"
10043050-145 = "Что, если эта команда неудачников и правда нас победит? Ни один фанат «Мародёров» такого не выдержит!"
10043050-146 = "То есть сейчас они, конечно, НЕ выигрывают, но ведь МОГУТ! Мы не знаем!"
10043050-147 = "[s5] «В этом и одна из прелестей спорта.»\n[s6] «Азарт неожиданного исхода.»"
10043050-150 = ""
10043050-151 = "[ns7] «Всем нам приятнее побеждать, чем проигрывать.»\n[ns8] «Мы бы все хотели заранее знать, что всегда победим. Но...»"
10043050-154 = ""
10043050-155 = "..."
10043050-156 = ""
10043050-157 = "Простите... Мы были неправы..."
10043050-159 = "Хорошо, что вы это признаёте."
10043050-160 = "Знаете, если у вас действительно столько страсти..."
10043050-161 = "...почему бы не направить её на собственное здоровье и форму в Тренировочном центре Миллениума?"
10043050-162 = "[s] «Ты ОТЛИЧНЫЙ продавец, Сумирэ...»"
10043050-163 = ""
10043050-165 = ""
10043050-166 = "Хм? Не совсем понимаю, что вы имеете в виду, Тренер."
10043050-169 = "...В любом случае проверить стоило, но теперь мы снова в тупике."
10043050-170 = "Это непросто, Тренер. Совсем непросто."
10043050-171 = "[s] «Я рад, что ты так увлеклась, но не стоит каждый раз сразу делать выводы...»"
10043050-172 = "Вы правы. Думаю, мне не повредит немного задуматься о себе."
10043050-173 = "А пока на этом огромном стадионе такой шум, что никому нет дела до того, что мы здесь делаем."
10043050-174 = "В каком-то смысле это даже удивительно."
10043050-175 = "[s] «Удивительно, насколько драматично здесь всё бывает?»"
10043050-176 = "Просто удивительно вообще."
10043050-177 = "Знаете, я не всегда хорошо выражаю мысли и не всегда говорю ясно."
10043050-178 = ""
10043050-180 = "А некоторые считают, что я ко всему отношусь слишком серьёзно."
10043050-181 = "Может, если бы я лучше умела расслабляться и не напрягаться..."
10043050-182 = "...мне было бы проще подходить к людям вот так."
10043050-183 = ""
10043050-185 = "[ns9] «Мне кажется, ты хороша такой, какая есть.»\n[ns10] «Нам нужны люди, которые умеют относиться к делу серьёзно.»"
10043050-188 = "Спасибо, Тренер."
10043050-189 = "Хи-хи... Хотя я знаю, вы ВСЕГДА находите что-нибудь хорошее, что сказать."
10043050-190 = ""
10043050-192 = ""
10043050-193 = "...Эм, это была шутка. Надеюсь, я не... прозвучала странно или обидно."
10043050-194 = "Не прозвучала? Хорошо, я рада."
10043050-195 = "..."
10043050-196 = "Кстати об удивительных вещах — посмотрите, какой здесь командный дух. Команда не сдаётся, и болельщики тоже."
10043050-197 = "Даже если они всегда проигрывают, даже если чуть-чуть не дотягивают до победы, они не падают духом."
10043050-198 = "...Эй, Тренер?"
10043050-199 = ""
10043050-201 = ""
10043050-202 = "Или мне сказать «Сенсей»?"
10043050-203 = "[s] «...?!»"
10043050-205 = "[ns] Молча выслушать Сумирэ."
10043050-206 = "Вам может показаться странным, что я вдруг заговорила обо всём этом ни с того ни с сего."
10043050-207 = "Но мне кажется, я понимаю людей, которые продолжают стараться, и тех, кто помогает им не сбиться с пути."
10043050-208 = "В конце концов, я тренер."
10043050-209 = "Но теперь я задумалась... что именно вообще такое «тренировка»?"
10043050-210 = "[s] «А ты как думаешь, Сумирэ?»"
10043050-211 = ""
10043050-213 = ""
10043050-214 = "..."
10043050-215 = "В человеке уживается множество разных сторон. У каждого есть внутренние противоречия."
10043050-216 = "Иногда то, что хочется сделать прямо сейчас, конфликтует с тем, кем человек хочет стать."
10043050-217 = "Я часто вижу это в своей работе."
10043050-220 = "Например, допустим, вы начали новую диету."
10043050-221 = "Но контролировать питание — это много труда. Устаёшь. Постоянно борешься с собой, голоден, скучаешь по любимой еде... Это тяжело. Больно."
10043050-222 = "И что хочется сделать в такой ситуации? Можно решить съесть, ну, не знаю, сливочную пасту с сыром."
10043050-223 = "Только представьте весь этот густой, насыщенный сыр, сладкие сливки и, может быть, ещё немного бекона."
10043050-224 = "С перцем сверху."
10043050-225 = "[ns] «Я хочу такую.»"
10043050-226 = "Фуфу. А кто бы не захотел?"
10043050-229 = "А после всей этой пасты можно запить её приятным холодным шоколадным коктейлем."
10043050-230 = "С немного горьковатым шоколадом, чтобы уравновесить сливочный вкус, который ещё остался во рту."
10043050-231 = "Было бы приятно, правда?"
10043050-232 = "...И это отдалило бы вас от здорового, сбалансированного тела, которого вы хотели добиться."
10043050-235 = "Сила воли хрупкая. Какая-нибудь крошечная, совершенно нелепая вещь может просто разбить её."
10043050-236 = "Я сама стараюсь говорить прямо и просто. Некоторые считают меня нечуткой или слишком резкой."
10043050-237 = "И не только меня. Такая репутация есть у всего Клуба спортивных тренировок, по крайней мере среди посторонних."
10043050-238 = "Но даже так..."
10043050-241 = "Иногда я вижу, как участник тренируется настолько усердно, что потом едва может добраться домой."
10043050-242 = "И всё равно приходит на следующий день, сохраняя желание продолжать."
10043050-243 = "Может, так делает один человек из десяти."
10043050-246 = "Но если ты можешь поддержать этого одного человека и помочь ему достичь цели..."
10043050-247 = "Иногда мне кажется, что уже этого достаточно."
10043050-248 = "Наверное, я уже просто болтаю без остановки..."
10043050-249 = "Но, думаю, я снова хочу сказать одно: я уважаю людей, которые принимают этот вызов, и тех, кто помогает им не сойти с пути."
10043050-250 = "Я ими восхищаюсь. Они мне просто нравятся. Ничего не могу с собой поделать."
10043050-251 = "Я... Я так же отношусь и к вам, Сенсей."
10043050-252 = "[s] «Ой?!»"
10043050-253 = "Фуфу. Вы звучите удивлённо."
10043050-254 = ""
10043050-256 = ""
10043050-257 = ""
10043050-258 = "Тренер."
10043050-259 = ""
10043050-262 = "Мне казалось, что нужно поблагодарить её, но я не мог вымолвить ни слова."
10043050-263 = "В тот момент я мог лишь смотреть ей в глаза..."
10043050-264 = ""
10043050-268 = "Эй, подработчица! Сюда!"
10043050-269 = "Все остальные подработчики куда-то исчезли. Можешь принести мне напиток?"
10043050-270 = ""
10043050-272 = ""
10043050-273 = "А? Остальные подработчики...?"
10043050-274 = "[s] «Пропала?»"
10043050-275 = "Ну, с этим разберёмся потом. Вот напиток. Холодный, как надо."
10043050-276 = ""
10043050-279 = "Спасибо!"
10043050-282 = ""
10043050-283 = "Фух, то что нужно. Да, не знаю, куда они делись. Я уже ужасно хотел пить."
10043050-284 = "Вы помните... примерно когда они исчезли?"
10043050-285 = "Хм, может, где-то во втором иннинге...? Как раз когда матч начал становиться интереснее."
10043050-286 = "«Становиться интереснее». Значит, именно когда люди стали чаще искать напитки, они все куда-то ушли."
10043050-287 = "Ну как, Тренер?"
10043050-288 = "Верно. Это точно странно. Если бы мы могли узнать, куда они ушли..."
10043050-289 = ""
10043050-291 = ""
10043050-293 = "Фух! После всех этих криков без напитков горло совсем пересохло..."
10043050-294 = ""
10043050-297 = "[ns] «О, Ханаэ. Снова встретились.»"
10043050-298 = "О?"
10043050-299 = "Сенсей!"
10043050-302 = ""
10043050-303 = "А, я не знала, что ты здесь работаешь, Сумирэ!"
10043050-304 = "Ага. Ты сказала, что хочешь пить, Ханаэ? Подожди."
10043050-305 = ""
10043050-307 = ""
10043050-308 = ""
10043050-309 = "*глоть* *глоть*... Спасибо! У меня уже немного голова кружилась!"
10043050-310 = "Фух, да, именно то, что нужно! Теперь могу болеть весь день!"
10043050-311 = "Как вовремя, Сумирэ! Из тебя вышел бы отличный Рыцарь спасения!"
10043050-313 = "Фуфу. Я бы предпочла быть Рыцарем здоровья и просто ходить, делая людей здоровее."
10043050-314 = "Тоже звучит здорово! Погоди, Рыцари здоровья вообще существуют?"
10043050-315 = ""
10043050-317 = ""
10043050-318 = "О, кстати о напитках..."
10043050-319 = "...похоже, остальные подработчики все вместе куда-то ушли."
10043050-320 = ""
10043050-322 = ""
10043050-323 = "!!!"
10043050-324 = "[s] «Ты знаешь куда?»"
10043050-325 = "Ага, я видела, как они пошли вон туда!"
10043050-330 = "Это...?"
10043050-331 = "[s] «К местам за кэтчером...?»"
10043050-332 = "Если подумать, отличное место для поддержки."
10043050-333 = "Оттуда весь стадион видно!"
10043050-334 = ""
10043050-337 = ""
10043050-338 = ""
10043050-340 = "(Значит, по какой-то странной причине все подработчики собрались в одном месте, откуда видно весь стадион.)"
10043050-341 = ""
10043050-343 = ""
10043050-344 = "(Я почти уверена, что это значит...)"
10043050-345 = ""
10043050-350 = ""
10043050-351 = ""
10043050-352 = "Сумирэ! Сенсей! Вы там? Преступник только что снова позвонил!"
10043050-353 = "Как обычно, наговорил нам бла-бла-бла и повесил трубку..."
10043050-355 = "Но благодаря этому, кажется, у нас появилась зацепка, где он находится!"
10043050-356 = "[s] «Серьёзно?!»"
10043050-357 = "Отлично, Рэй! Что за зацепка?"
10043050-358 = "Качество связи. Пока они говорили, я ходила по трибунам..."
10043050-359 = "...и в зависимости от того, где я находилась, звонок становился то чище, то шумнее!"
10043050-360 = "Так что если играть по принципу горячо-холодно..."
10043050-361 = ""
10043050-364 = ""
10043050-365 = "...мы сможем найти их таким способом. Отличная работа, Рэй."
10043050-366 = "[s] «Ну, тогда мы знаем, что делать...»"
10043050-367 = "Да, Тренер."
10043050-368 = "Во время следующего звонка преступника нужно удерживать на линии как можно дольше..."
10043050-370 = "...и мы его выследим!"
