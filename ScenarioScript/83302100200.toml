[translation]
83302100200-5 = ""
83302100200-6 = "А, глава префектов. Я вас ждала."
83302100200-7 = "Чинацу? Что ты здесь делаешь?"
83302100200-8 = "Ну... поступило сообщение о беспорядках в школьной столовой."
83302100200-9 = "В школьной столовой...?"
83302100200-10 = "Фуука и так по уши занята заказом Общества Пандемониума. Сомневаюсь, что сейчас она способна нормально разобраться с нарушителями."
83302100200-11 = "Так... Кто на этот раз устроил переполох? Банда шлемов? Или какая-то другая группа решила воспользоваться моментом?"
83302100200-12 = "Эм... В том-то и странность..."
83302100200-13 = "Что ты имеешь в виду?"
83302100200-14 = "Как ни странно, на этот раз беспорядки устроила не одна из преступных групп Геенны..."
83302100200-15 = "Говорят, на столовую напал какой-то неопознанный монстр..."
83302100200-16 = "...Неопознанный монстр? Ты уверена, что это не чья-то шутка?"
83302100200-17 = "Сообщила Джури, так что сомневаюсь, что она пыталась нас обмануть..."
83302100200-18 = ""
83302100200-20 = ""
83302100200-22 = ""
83302100200-23 = "...Хорошо. Информации мало, но очевидно, что нужно разобраться."
