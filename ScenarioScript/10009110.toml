[translation]
10009110-1 = "Послесловие;Скрытное вымогательство"
10009110-4 = "Ступайте вперёд с верой и честью в сердце!"
10009110-5 = ""
10009110-14 = ""
10009110-15 = ""
10009110-16 = ""
10009110-17 = ""
10009110-20 = "Будет немного больно, но простите меня. Это ради общего блага!"
10009110-21 = ""
10009110-23 = ""
10009110-24 = "Пока миру нужно исцеление, Рыцари Спасения никогда не дрогнут!"
10009110-25 = "Нет, стой! Если хочешь помочь..."
10009110-26 = ""
10009110-27 = "Тогда останови эту к-кап— гах!"
10009110-28 = "Вы в порядке? Скоро закончим с дезинфекцией, а пока постарайтесь не делать резких движений."
10009110-29 = "Нельзя позволить этим ранам стать хуже... Хотя, может, всё-таки наложить шину на всё тело?"
10009110-31 = "Ч-что? Ты издеваешься? Ты пытаешься помочь или просто ищешь повод меня связать?!"
10009110-32 = "Аргх! Даже Рыцари Спасения против нас..."
10009110-34 = "С-спасибо, Рыцари Спасения! Вы очень помогли!"
10009110-35 = "Мы лишь выполняли свой долг."
10009110-36 = "И всё же я возмущена уже самим фактом, что такое вообще происходит."
10009110-38 = "Э-эм, ах! Если бы только директор Канна была здесь!"
10009110-39 = "Но, похоже, Бюро общественной безопасности не было направлено..."
10009110-40 = "Я слышала, возникла проблема с документами."
10009110-41 = "В полевом отчёте не было печати."
10009110-42 = "А в запросе на поддержку не хватало двух приложений."
10009110-43 = "Чтобы получить эти приложения, требовалось продлить сертификат."
10009110-44 = "Обычно сертификаты выдают по средам, хотя есть процедура экстренного продления."
10009110-45 = "Но для экстренного продления нужно дополнительное разрешение от начальника обороны..."
10009110-46 = "Стойте! Вы хотите сказать, что проблема была в бюрократии?"
10009110-47 = "Мы вообще-то должны спасать жизни! Кому какое дело до бланков и процедур?!"
10009110-48 = "Удивительно, что ваше Бюро общественной безопасности вообще способно кому-то помогать с такой бюрократией!"
10009110-49 = "О-ой, эм, но в некоторых случаях для правильного администрирования некоторые процедуры могут быть, эм, необходимыми или неизбежными—"
10009110-50 = "Тогда мне просто придётся самой поговорить с руководством Полицейской академии Валькирии!"
10009110-51 = "Эм, но... не слишком ли это далеко заходит?"
10009110-52 = "Да! Даже от вас, капитан Минэ, это может выглядеть как, эм, вмешательство во внутренние дела, что способно привести к межшкольному конфликту—"
10009110-54 = "Я опечалена, возмущена и даже поражена тем, что мои искренние возражения не воспринимают всерьёз!"
10009110-55 = "Я говорю вам, что нуждающиеся не получают помощь из-за проблем в ваших процедурах и процессах, а что вы отвечаете? Что я не могу выразить свои опасения из-за тех самых процедур и процессов!"
10009110-57 = "Минэ увидела генерального директора по безопасности, который как раз проводил инспекцию на месте."
10009110-58 = "Хотя студенты Валькирии пытались её остановить, Минэ лично высказала претензии генеральному директору по безопасности."
10009110-59 = "Смущённый генеральный директор попытался уйти от ответственности, заявив, что за это отвечает другой отдел, чем лишь сильнее разжёг праведный гнев Минэ..."
10009110-60 = "Но это уже другая история."
10009110-62 = "О? Снаружи что-то происходит?"
10009110-63 = "Того противного генерального директора по безопасности нет, и вместе с ним исчезла туча охраны, что вьётся вокруг словно мошкара..."
10009110-64 = "Хи-хи-хи... Похоже, идеальная возможность!"
10009110-65 = ""
10009110-69 = ""
10009110-70 = ""
10009110-71 = "Пора возвращаться к работе!"
10009110-72 = ""
