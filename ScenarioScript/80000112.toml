[translation]
80000112-1 = "Операционный офицер не хочет проигрывать"
80000112-3 = "Я, как обычно, работал в Шале."
80000112-4 = ""
80000112-8 = "[ns] «Алло, Сенсей слушает.»"
80000112-9 = ""
80000112-11 = ""
80000112-12 = "Приветствую, Сенсей."
80000112-13 = "Я звоню, потому что как член Хяккарёран... хотела бы официально обратиться к Шале за помощью."
80000112-14 = "Ну... Не думаю, что это сильно поможет, но сегодня в вашем расписании есть свободное время?"
80000112-15 = "[s] «Полно.»"
80000112-17 = "[ns] «А даже если бы и не было, для студента я всегда найду время, Кикё!»"
80000112-18 = "*вздох* Не нужно так рисоваться. Я прекрасно знаю, насколько тяжёлый у Шале рабочий график."
80000112-19 = "Я знаю, что вы постоянно делаете всё возможное, чтобы помочь студентам. Именно за это я вас так высоко ценю..."
80000112-20 = "Но я не собираюсь доставлять вам неудобства или, ещё хуже, заставлять вас перерабатывать."
80000112-21 = "Более того, если вы устроите что-нибудь подобное под видом заботы обо мне, я разозлюсь. Поэтому советую тщательно выбирать следующие слова."
80000112-22 = "[ns1] «Мне очень приятно это слышать, Кикё.»\n[ns2] «Но сегодня я действительно свободен, так что не переживай.»"
80000112-25 = "...Хмф."
80000112-26 = "Понятно. Если в расписании действительно нет конфликтов, хорошо."
80000112-27 = "Ладно... Я буду ждать."
80000112-28 = ""
80000112-30 = ""
80000112-31 = "...Со звонком Сенсею разобрались."
80000112-32 = ""
80000112-35 = "[ns] «(Хм? Кажется, звонок ещё...)»"
80000112-36 = "Теперь нужно всё подготовить до прихода Сенсея..."
80000112-37 = ""
80000112-39 = ""
80000112-40 = "Я должна убедиться, что мой план безупречен."
80000112-41 = ""
80000112-43 = ""
80000112-44 = "[ns] «Что это сейчас было...?»"
80000112-46 = "После того как она, не заметив ничего, положила трубку, я встретился с Кикё в условленном месте."
80000112-47 = ""
80000112-50 = ""
80000112-51 = "[ns] «Итак, с чем тебе сегодня нужна моя помощь?»"
80000112-52 = "А, всё очень просто."
80000112-53 = "Сенсей, вы ведь знаете, что сегодня День святого Валентина?"
80000112-54 = "[s] «Верно.»"
80000112-55 = "В такой особенный день по всему Хяккияко проходит множество мероприятий."
80000112-56 = "Сегодня я собираюсь помочь на нескольких из них, поскольку это важная часть обязанностей Хяккарёран."
80000112-57 = "[s] «Понятно... Довольно важная задача. Я постараюсь изо всех сил!»"
80000112-58 = "Рада вашему энтузиазму."
80000112-59 = "Тогда отправимся на место?"
80000112-63 = "Я последовал за Кикё и помогал ей на мероприятиях в торговом квартале."
80000112-64 = ""
80000112-66 = ""
80000112-67 = ""
80000112-68 = ""
80000112-69 = ""
80000112-70 = ""
80000112-71 = ""
80000112-72 = ""
80000112-73 = ""
80000112-77 = "Начали мы с импровизированного мастер-класса по приготовлению шоколада..."
80000112-78 = ""
80000112-79 = ""
80000112-80 = ""
80000112-81 = ""
80000112-82 = ""
80000112-85 = "Потом помогали проводить Шоколадный конкурс Кивотоса..."
80000112-87 = ""
80000112-88 = ""
80000112-89 = ""
80000112-91 = "Я был судьёй на импровизационной битве хайку на тему Дня святого Валентина и так далее."
80000112-92 = "После насыщенного дня, проведённого на нескольких мероприятиях..."
80000112-93 = ""
80000112-94 = "Огромное спасибо за сегодня!"
80000112-95 = "Благодаря присутствию офицера Хяккарёран и Сенсея из Шале в этот раз мы получили гораздо больше внимания!"
80000112-96 = "Было чудесно видеть, как дети улыбаются ещё ярче обычного! Можно будет попросить вашей помощи и в следующий раз?"
80000112-97 = "[s] «Я не против.»"
80000112-98 = "Вы такой популярный, Сенсей. Наверное, довольны собой."
80000112-99 = "Может, у вас талант присматривать за маленькими детьми?"
80000112-100 = "Ха-ха! Это и к вам относится, госпожа офицер!"
80000112-101 = "Дети называли вас крутой старшей сестрой, когда вы молниеносно отвечали на все вопросы в викторине во время забега на трёх ногах! Ха-ха!"
80000112-102 = "Э-Это... только потому, что... я просто... хорошо справляюсь с викторинами."
80000112-103 = "[s] «Кикё... Ты что, смущаешься?»"
80000112-104 = ""
80000112-106 = ""
80000112-107 = "...Хмф."
80000112-112 = "[ns] «Фух, закончили довольно поздно.»"
80000112-113 = ""
80000112-115 = ""
80000112-116 = "...Да. Вы правы. Солнце уже село."
80000112-117 = "Спасибо, что весь день поспевали за мной, Сенсей."
80000112-118 = "Благодаря вам Хяккарёран сегодня смог многого добиться."
80000112-119 = "..."
80000112-120 = "Мм, и всё же..."
80000112-121 = "Я хочу услышать, что вы думаете о сегодняшней работе вместе со мной."
80000112-122 = "[s] «А, да. Мне было очень весело.»"
80000112-123 = "Вот как?"
80000112-124 = "..."
80000112-125 = "...И всё?"
80000112-126 = "Больше совсем нечего сказать?"
80000112-127 = "[s] «Хм? Нет, ничего особенного...»"
80000112-128 = "Подумайте, Сенсей. Сегодня мы вместе побывали на множестве мероприятий."
80000112-129 = "И все они были замечательными... мероприятиями ко Дню святого Валентина."
80000112-130 = "Если подумать об этом, разве в вашем сердце не появились какие-нибудь новые чувства?"
80000112-131 = "Может, вам захотелось чего-то нового?"
80000112-132 = "Не стесняйтесь. Расскажите. Я умею хранить секреты."
80000112-133 = "[s] «А, если так... Есть кое-что.»"
80000112-134 = "Да... Я так и знала."
80000112-135 = "Пожалуйста, скажите."
80000112-136 = ""
80000112-138 = ""
80000112-139 = ""
80000112-140 = "Что бы вы ни пожелали, произнесите это. Я хочу услышать это от вас лично."
80000112-141 = ""
80000112-144 = "[ns] «Я рад, что сегодня смог тебе помочь.»"
80000112-145 = ""
80000112-148 = "[ns] «Надеюсь, в будущем ты не будешь стесняться звать меня на помощь с такими вещами.»"
80000112-149 = "Конечно, именно для этого и существует Шале..."
80000112-150 = "Да. И вы будете повторять что-то подобное до самого конца."
80000112-151 = ""
80000112-153 = ""
80000112-154 = "...И всё?"
80000112-155 = "[s] «Да. П-Почему?»"
80000112-156 = "...Хм. Понятно."
80000112-157 = ""
80000112-159 = ""
80000112-160 = ""
80000112-161 = "Вот как... Хи-хи."
80000112-162 = "У вас правда больше нет никаких желаний?"
80000112-163 = "Боже... Это..."
80000112-164 = "─Невероятно!"
80000112-165 = ""
80000112-168 = "[ns] «Кикё?»"
80000112-169 = "Я столько сил вложила в этот план, а вы... Ни разу..."
80000112-170 = "Ни единого раза─!"
80000112-171 = "...не подумали сказать: «Подари мне шоколад на День святого Валентина!»"
80000112-172 = "Не могу поверить!"
80000112-173 = "[s] «...А?»"
80000112-175 = "Дойдя до предела, Кикё наконец призналась."
80000112-176 = ""
80000112-177 = "[ns] «То есть всё, что мы сегодня делали, было частью твоего плана, чтобы...»"
80000112-178 = "...*вздох* Да. Теперь уже нет смысла скрывать."
80000112-179 = "Вы правы. Всё это было нужно, чтобы пробудить в вашем сердце валентиновское желание."
80000112-180 = "Чтобы вы начали думать: «Как же я хочу получить шоколад от Кикё!»"
80000112-181 = "...А вы каким-то образом ловко избегали любых подобных слов. Ни разу!"
80000112-182 = "[s] «Погоди, а зачем тебе вообще...?»"
80000112-183 = "Устраивать такой план?"
80000112-184 = "Очевидно же: если бы я просто взяла и вручила вам шоколад..."
80000112-185 = "Не услышав от вас этих слов..."
80000112-186 = "[s] «То ты бы...?»"
80000112-187 = "Я-я бы..."
80000112-188 = "Я бы чувствовала, что проиграла!"
80000112-189 = "[s] «...»"
80000112-190 = "Я обещала себе, что когда вы попросите мой шоколад, немного вас подразню, а потом наконец отдам."
80000112-191 = "А вместо этого всё полностью прошло мимо вас!"
80000112-192 = "Ургх! Не могу поверить! Теперь понимаете? Понимаете, что сделали не так?"
80000112-193 = "[s] «Тебя сейчас не заносит?!»"
80000112-194 = "Не могу поверить, что вы так упорно отгораживались от меня до самого конца..."
80000112-195 = "Где я ошиблась? Расчёты были неверны?"
80000112-196 = "[s] «Послушай, Кикё. Насчёт того, почему я не попросил шоколад...»"
80000112-197 = "...Хм? У вас была причина так себя вести?"
80000112-198 = "Вы хотите сказать, что во время звонка... услышали, как я сказала, что приготовила шоколад, ещё до того как положила трубку?"
80000112-199 = "И решили, что после нашей волонтёрской работы я сама его вам отдам?"
80000112-200 = "То есть вы всё знали с самого начала..."
80000112-201 = "..."
80000112-202 = "Уф!"
80000112-203 = "[s] «Эм... Прости, что не учёл твои чувства.»"
80000112-204 = "То есть, если бы я знала, я бы—!"
80000112-205 = "Погодите! Если так... значит, вы всё это время ждали моего шоколада..."
80000112-206 = "То есть... О! Эм..."
80000112-207 = "...Кхм!"
80000112-208 = "...Как вы и сказали, Сенсей. Пожалуйста, примите шоколад, который я приготовила."
80000112-209 = ""
80000112-211 = ""
80000112-212 = ""
80000112-214 = "Это особый шоколад ручной работы, созданный операционным офицером Хяккарёран специально для вас."
80000112-215 = "Вот. Возьми."
80000112-216 = ""
80000112-218 = ""
80000112-220 = ""
80000112-221 = ""
80000112-222 = ""
80000112-223 = ""
80000112-224 = ""
80000112-225 = "[ns] «Спасибо, Кикё—»"
80000112-226 = "Поблагодарить меня было бы неплохо!"
80000112-227 = "...После того как попробуете... конечно..."
80000112-228 = "Лучше поблагодарите меня потом."
80000112-229 = ""
80000112-231 = ""
80000112-232 = ""
80000112-233 = ""
80000112-234 = "Мне... сейчас слишком неловко смотреть вам в лицо."
80000112-235 = "Просто потом пришлите мне десятистраничный отчёт со впечатлениями от шоколада."
80000112-236 = "[s] «Эм, н-ну да...»"
80000112-237 = "...Хмф!"
80000112-239 = "Шоколад, который я после всей этой суматохи получил от Кикё..."
80000112-240 = "...был сладким и вкусным."
