[translation]
900900601-10 = "Спецвыпуск! Ограниченная акция уже идёт!"
900900601-20 = "Эта грандиозная распродажа — только для вас! Серьёзно! Мы на этом несём огромные убытки! Так что готовьтесь оторваться по полной!"
900900601-30 = "Товар заканчивается! Запасы ограничены, так что это ваш последний шанс!"
900900601-40 = "Всё распродано! Пожалуйста, дождитесь пополнения запасов!"
900900601-50 = "Распродажа в честь открытия! Скидки, о которых можно только мечтать!"
900900601-60 = "Спасибо за покупку!"
900900601-70 = "Благодаря вам всё прошло с огромным успехом!"
900900601-80 = "Пусть всё уже распродано, но стрим продолжается!"
900900601-90 = "Таковы уж договорные обязательства!"
900900601-100 = "Всё подходит к концу!"
900900601-110 = "Не осталось ли у вас покупок напоследок?"
900900601-120 = "Добро пожаловать на специальный прямой эфир!"
900900601-130 = "Ведущая этой программы — звёздный репортёр Школы журналистики Кронос, Кавару Шинон!"
900900601-140 = "Не упустите шанс!"
900900601-150 = "Вкусно!"
900900601-160 = "...А? Что это ещё за сценарий?!"
900900601-170 = "Наверное, это и называют «мудростью взрослого»!"
900900601-180 = "Спасибо за покупку!"
900900601-190 = "Так быстро, что даже камера не успевает поймать!"
900900601-200 = "Сможет ли Сенсей преодолеть этот кризис?!"
900900601-210 = "Не переключайтесь!"
900900601-220 = "Вы всё ещё здесь?"
900900601-230 = "В-Вы ведь знаете, что стрим уже закончился, да?"
900900601-240 = "Я не могу помочь! Журналист обязан сохранять нейтралитет!"
900900601-250 = "Эй! «Сделать вид, что сделал» — против правил!"
900900601-260 = "Какой успех! Сегодня мы точно бьём все рекорды!"
900900601-270 = "Поздравляем! Расскажите, что вы сейчас чувствуете!"
900900601-280 = "Спецвыпуск! Ограниченная акция уже идёт!"
900900601-290 = "Эта грандиозная распродажа — только для вас! Серьёзно! Мы на этом несём огромные убытки! Так что готовьтесь оторваться по полной!"
