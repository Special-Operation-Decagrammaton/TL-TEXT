[translation]
900900601-550 = "A TV-exclusive\nspecial campaign\nis underway~!"
900900601-560 = "A massive sale,\nrisking us going into the red~!\nTake a look!"
900900601-570 = "Almost sold out!\nDisplay model only,\nthis is your last chance~!"
900900601-580 = "Thank you for selling out!\nPlease wait for\nrestocking!"
900900601-590 = "Grand opening sale~!\nGreat bargains to be had!"
900900601-600 = "Thank you for your\ncontinued patronage!"
900900601-610 = "Thanks to you,\nit's a huge success!"
900900601-620 = "The show keeps going\neven if we sell out, right?!"
900900601-630 = "Contractually speaking,\nthat's how it works!"
900900601-640 = "It's finally time\nfor the ending!"
900900601-650 = "Is there anything\nyou missed out on buying?"
900900601-660 = "Welcome to the\nspecial live broadcast!"
900900601-670 = "This program is brought to you by the Journalism Club's idol,\nShinon Kawanagare!"
900900601-680 = "Be careful\nnot to miss it!"
900900601-690 = "That's delicious,\nisn't it!"
900900601-700 = "……Huh?\nDoes the script\nlook a bit weird to you!?"
900900601-710 = "So this is what\nadult composure is like!"
900900601-720 = "Thank you\nfor your purchase!"
900900601-730 = "At this speed,\nthe cameras can't\nkeep up!!"
900900601-740 = "Can Sensei\npossibly overcome\nthis trial!?"
900900601-750 = "Please stay\n tuned!"
900900601-760 = "Oh, why are you here?"
900900601-770 = "Eh... The broadcast\nis already over...?"
900900601-780 = "Unfortunately,\nI can't help you!\nThe news must remain neutral!"
900900601-790 = "Ah—!\nSaying \"we did it\" \nis cheating!"
900900601-800 = "You were amazing out there!\nBreaking our viewership ratings\nis guaranteed!!"
900900601-810 = "Congratulations!\nWould you like to say a few words?"
