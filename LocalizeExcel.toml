2470272508 = "At regular intervals, the Monkey Conductor absorbs the souls of allied students to deal massive damage and inflict stun.\n\nIf allied Striker students in a different space attack the Monkey Conductor while it is using a skill,\nthe skill usage will be stopped and the damage taken will increase."
