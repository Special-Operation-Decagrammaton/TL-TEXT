1947924520 = "Description"
4276897696 = "Virtual Aptitude Test BETA"
3840632710 = "A Common Uniform?"
2958028279 = "Hifumi appears wearing a uniform she claims was given to her by the tournament management. Her attire, which is at least distinct from a \"racing suit,\" draws the gazes of those around her. However, believing it to be a common uniform, Hifumi explains its functionality point by point to Sensei's questions."
3275971778 = "Fairy Queen"
3473256340 = "On her way back after finishing shopping with Sensei, Hifumi was driving safely when a tailgating car hit-and-run her. Triggered, Hifumi begins pursuing the fleeing car with brilliant tank-handling skills. And after the chase, she puts the tailgating driver in their place with an overwhelming difference in driving technique."
354998620 = "Special"
2367636329 = "In stark contrast to the daytime, the stadium at night was quiet, and Hifumi and Sensei were there. Hifumi, who used to call herself \"ordinary,\" was bewildered to realize that she, too, was someone's \"special.\" However, through discussing it with Sensei, she comes to accept that both sides are truly her, and looks forward."
2019819975 = "An Ordinary Secret Base!"
2826655036 = "Asked by Hifumi, Sensei was helping paint parts of Crusader-chan. After finishing painting together, the two of them were waiting for the paint to dry when the heat got in the way. To escape the heat, Hifumi creates shade using the tank and a flag, preparing a secret base just for the two of them."
120049956 = "Packet Sleeping"
1484507511 = "A mysterious, large box delivered to Schale. When Sensei cautiously opens it, Rana is inside as a \"souvenir.\""
1693721023 = "A Girl's Pickup"
3775521247 = "Azusa asks Sensei to accompany her on city driving practice. However, the tank she was supposed to have parked has vanished, and the two walk around searching the parking lot. In the end, it turns out that it was \"moved for vehicle inspection,\" and Azusa breathes a sigh of relief."
1246140576 = "A Girl's Greed"
2468872292 = "Azusa came to buy tank supplies with Sensei. Azusa finds and wants a Momo Friends collaboration item, but confesses her fear of losing something. She says that especially when it comes to tank supplies, you never know when they might break. However, she buys an air freshener for the reason that she can take it off and display it after she's done using it."
373714608 = "A Girl's Errand"
1085670391 = "Entrusted with running a lunch errand, Azusa takes Sensei and heads to DT. The true identity was a drive-thru, but Azusa mistakes the ordering station for a briefing and the pickup window for a checkpoint. However, with Sensei's support, her order thankfully goes through safely, and she acquires what was requested to complete her resupply."
3335124235 = "A Wind That Caressed a Girl"
3619478159 = "Azusa asks Sensei to take \"proof photographs of tournament participation\" required to pass a failed subject. However, in the middle of taking the pictures, Azusa collapses, overcome by the strong sunlight. After moving to the shade, Azusa apologizes for \"disappointing\" Sensei, but Sensei's gentle words of reassurance bring a happy expression to her face."
311885108 = "Rana and Colossus"
3678365542 = "Worried after Rana stopped responding after sending a half-baked message, Sensei visits Special Class 183. There, Rana is building some kind of giant machine. When Sensei helps complete it, Rana says its true identity is a smartphone \"charger.\" Thus, Rana's smartphone battery is revived."
169014044 = "Debug Patch"
1361333594 = "Sensei presents an external HDD to Rana, who says she lacks space due to bugs and patches. However, Rana gives a puzzled look. Hearing her out, bug extermination means getting rid of \"insects,\" and applying a patch means physically plugging holes in a punch card. Rana explains that she has no space left because of her notebook catching bugs and her patched punch cards."
181324778 = "Deadlock"
568809012 = "Rana had to retake a psychological test five times. When Sensei investigates, Rana's answers legitimately triggered the questions meant to measure \"response dishonesty,\" treating Rana's serious answers as errors. Having skipped grades repeatedly, Rana confesses she is afraid of being called \"abnormal.\" However, Sensei tells her it's okay to just be herself."
2955691743 = "Protocol Itemization"
1823091636 = "Rana appears at the entrance of Schale with a food delivery courier. When asked, Rana claims she is \"food\" and used delivery to reach Sensei's location. When Sensei asks why she came to Schale, Rana replies, \"I just wanted to see you.\" Sensei takes Rana along to visit a shopping mall and amusement park."
3156899463 = "Nostalgic Non-Everyday"
1817493399 = "\"Midnight with Lore\" is Orwell's talk show. Tonight, we introduce the \"Nightmare Train.\""
2508914330 = "Start Your Engines! ~No. 183 Forever!~"
3251321361 = "Battle-hardened veterans gather in Gehenna. At the end of the intense tank race, to whom will the goddess of victory smile—"
2152586779 = "Prologue"
224631780 = "The Souvenir is a Championship Trophy"
