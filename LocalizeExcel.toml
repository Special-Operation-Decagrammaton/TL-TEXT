3603770283 = "@Odyssey_Daily"
2007090752 = "Honestly, isn't the current General Student Council President a bit off? She should just focus on General Student Council work instead of sticking her nose into other academies' affairs. This is straight-up an infringement of autonomy."
771049019 = "For real. The current General Student Council President is acting kind of weird. There's even a rumor that she was replaced by someone else while she was missing... Wait, is that actually a thing?"
2062205063 = "We're all doomed. The General Student Council President is gonna see this post and send us all straight to the Correction Bureau."
258982861 = "The General Student Council President isn't that free. If you want to act tough, go do it somewhere else."
3639933123 = "Earlier near Terminal 3, the Captain and the executives of 'The Island' were running around in a panic... Did something happen?"
2246597607 = "[Breaking News] Sammy Escapes"
2771476829 = "Sammy was always free to roam around, wasn't she? What's the sudden rush?"
3260113997 = "[Breaking News] Captain Jumps into the Sea"
1463964144 = "Seriously, what is going on?"
3472058604 = "I'm at Aohama Port right now, and it looks like Odyssey's ship is about to set sail. They just got back to D.U., too... Did something happen at the academy?"
3762741207 = "Bye-bye"
3840915724 = "Farewell"
439616356 = "Take care over there"
4294008614 = "I feel like I'm finally talking about something relevant to this instance's purpose for once, but... lately, while doing my daily routines, I've been feeling this strange sense of dissonance. I can't quite put it into words, but it feels like I'm forgetting something important... Like I'm overlooking something."
1419880164 = "Probably all the Odyssey students are feeling something similar. Lately, whenever I see the empty hammock hanging on the railing, I feel so lonely."
4159184879 = "...Is that really the reason, I wonder? ...I want to see Sammy."
