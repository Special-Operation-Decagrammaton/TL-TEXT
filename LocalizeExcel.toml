1006517551 = "The Apothecary's Wanderings (5)"
2218090194 = "The Apothecary's Wanderings (6)"
4115258558 = "The Apothecary's Wanderings (1)"
2861337959 = "While visiting the Black Market, Sensei is kidnapped by a gang. It is Kai, who happened to be passing by, who rescues them. After briefly explaining what has happened since the incident in Shanhaijing, Kai takes Sensei to the place where they are currently staying. Upon arrival, they find that the elderly landlord is suffering from a serious illness."
2018946506 = "The Apothecary's Wanderings (2)"
1752426576 = "Sensei asks Kai to treat the old man, noting that Kai could cure him if they wanted to, but had chosen not to. A deal is struck: in exchange for the treatment, Sensei agrees to grant one request from Kai. After taking the medicine Kai concocted, the old man recovers his health in an instant."
2538956798 = "The Apothecary's Wanderings (3)"
792075492 = "Kai asks Sensei why they came to the Black Market and is stunned by the answer. However, it piques Kai's interest, and they decide to explore the Black Market together. While surveying the area, the two stumble upon a scene where the elderly landlord is being surrounded by a gang."
257972076 = "The Apothecary's Wanderings (4)"
3746302841 = "Unable to watch the argument between the gang and the old man escalate, Kai intervenes. Kai settles the situation with ease, but feels a strong sense of discomfort at their own action of 'saving the old man'."
3789536442 = "The Apothecary's Wanderings (5)"
4060686472 = "Ever since the incident in Shanhaijing, Kai has been in a state of confusion. Kai says the catalyst was the words Sensei spoke to them. Because Kai is aware that they cannot understand what is 'normal,' they are bewildered by something unknown that has begun to sprout within them."
3249063630 = "The Apothecary's Wanderings (6)"
123379259 = "Sensei suggests that Kai try to learn about 'normal.' However, Kai replies that what is natural for everyone else feels unnatural to them. Even so, taking Sensei's words to heart, Kai takes the first step toward facing what it means to be normal."
513757911 = "Set Sail! Pandemonium Ship: Chairman Makoto's Magnificent Summer Retreat"
