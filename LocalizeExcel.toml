2960710592 = "The Indelible"
837815597 = "Ibuki's Runaway Incident"
3212067640 = "After Makoto eats her pudding, Ibuki storms out of the Prefect Team lounge and runs away from home. As she wanders aimlessly, who should she happen to meet...?"
1594454384 = "Ibuki's Runaway Incident"
2023740485 = "After Makoto eats her pudding, Ibuki storms out of the Prefect Team lounge and runs away from home. As she wanders aimlessly, who should she happen to meet...?"
3159234165 = "Ibuki's Runaway Incident (1)"
1250138371 = "Ibuki's Runaway Incident (2)"
815986830 = "Ibuki's Runaway Incident (3)"
3765673841 = "Gehenna is Peaceful Today Too"
314611152 = "As the Prefect Team is cracking down on troublemakers as usual, a passing Makoto interrupts just as usual. While Pandemonium Society and the Prefect Team glare at each other in the street, a mysterious trio of girls suddenly breaks into the fray."
2404467793 = "Gehenna Restoration Committee"
280731846 = "The trio calls themselves the Gehenna Restoration Committee. Mayumi, the committee chair, boldly declares to Makoto, \"Gehenna isn't great anymore!\" After listening to the respective claims of Pandemonium Society and the Prefect Team, Mayumi announces that they will unite Gehenna with their own hands to make it a strong academy once again."
1622727060 = "Make Gehenna Great!"
3973550309 = "The Gehenna Restoration Committee starts moving step-by-step from grassroots activities. However, things do not go as smoothly as they hoped, and they learn how difficult it is to realize their ideals. Shouko, the brains of the Gehenna Restoration Committee, suggests that they need a \"symbol\" to give authority to their activities. It seems Shouko already has a specific person in mind."
1641190660 = "Make Gehenna Great...!"
2210742662 = "Having made contact with Teacher, the Gehenna Restoration Committee begins to passionately talk about their feelings for Gehenna. They want to bring back the glorious era of Gehenna, when there were strict rules and everyone followed the school regulations. When Teacher promises to cooperate in response to their wish, Mayumi immediately takes action."
4254754102 = "Make Gehenna Great...?"
2990294971 = "While passing the baton of detailed explanation to Shouko, Mayumi talks about her ideal of a \"Great Gehenna.\" As a first step, they begin running the Trigger Happy Zone—a place where students can go wild to their heart's content without being cracked down on by the Prefect Team. However, since it was actually unauthorized, the group goes to the Pandemonium Society to get ex post facto approval."
3499418034 = "Negotiation"
3711191844 = "The Restoration Committee visits the Pandemonium Society to obtain activity permission. Through Shouko's eloquence and Teacher's cooperation, they somehow manage to persuade Makoto. Next, they meet with Hina of the Prefect Team, explain the situation, and secure a promise of non-interference. Thus, they successfully obtain consent from both the Pandemonium Society and the Prefect Team."
585418668 = "Karen"
3523112257 = "Outside Gehenna Academy's autonomous district, Karen rescues a Gehenna student who was being threatened by delinquents. Afterwards, Karen notices Teacher happening to be nearby and offers to act as Teacher's bodyguard. Thanks to that, Teacher successfully finishes their work, and upon parting ways, hears from Karen about her inner resolve to take part in the Gehenna Restoration Committee's activities."
4058431972 = "Trigger Happy Zone"
705014674 = "Gehenna students have begun voluntarily observing rules such as \"first-come, first-served\" and \"forming lines.\" The Gehenna Restoration Committee's attempts to gradually instill order in Gehenna through time limits and a mileage system are beginning to show results. Seeing this, Teacher resolves to support the Gehenna Restoration Committee with all their might."
3161366694 = "Chance"
3695701956 = "To enhance the appeal of the point system, the group visits affiliated stores where accumulated points can be used. However, when they actually try the food at the target restaurant, it isn't as delicious as the rumors suggested. The Gourmet Research Society, whom they happen to encounter, seems to be of the same opinion, and despite Mayumi's attempts to persuade her, Haruna ruthlessly blows up the restaurant. Shouko ponders this scene before her."
3898526130 = "Negotiation...?"
4124917679 = "Shouko states that the Gourmet Research Society and the Hot Spring Development Department are major uncertain factors in aiming for a great Gehenna. Intending to control the Hot Spring Development Department's actions by intentionally avoiding Kasumi and approaching Megu, Shouko instead incurs Kasumi's backlash. Though they manage to avoid disaster for the time being, Teacher feels a small sense of incongruity regarding her methods."
1319276458 = "Unfamiliar Peace"
200177053 = "Thanks to the Gehenna Restoration Committee's activities, Gehenna has become quieter than before. Makoto feels a sense of crisis at the fact that organizations other than the Pandemonium Society are expanding their influence. Meanwhile, the Prefect Team is enjoying a rare taste of peace and spending a tranquil time. Amidst all this, Iori recalls her conversation with Karen from earlier about a \"future where the Prefect Team is no longer needed.\""
1217784543 = "Problem Solving"
4186691531 = "Realizing that students in Gehenna have nowhere to go to discuss their troubles, Mayumi decides that they should take on that role. While pursuing their first consultation regarding a \"school ghost rumor,\" the group makes their way to the broadcasting room. However, the door is locked, and they cannot check inside. Suddenly, Teacher remembers a rumor associated with the broadcasting room."
35149090 = "Trees in the Forest"
3348675679 = "The Gehenna Restoration Committee interviews Kirara and Erika, who once encountered a broadcasting accident. Hearing their testimony, Shouko falls into thought, looking as though something rings a bell. Concluding that they need to enter the broadcasting room to check inside in order to solve the problem, the Gehenna Restoration Committee goes to negotiate with the Pandemonium Society."
38381485 = "Shadow of Swaying Flames"
3174880895 = "Visiting the Pandemonium Society, the Gehenna Restoration Committee uses their past activity track record as leverage in negotiations to get school broadcasting privileges approved. Gaining legal entry, the group investigates the interior of the broadcasting room. They discover that the cause of the ghost rumor is a bad connection from a deteriorated cable. Parting ways with Mayumi and Karen, who hurry off to report to their client, Shouko remains behind in the broadcasting room and gazes quietly at the equipment."
3170845441 = "Mayumi"
2615319093 = "Mayumi is cleaning the Trigger Happy Zone by herself. With Teacher helping out, she talks about her deep love for Gehenna and the future of the academy that they are trying to change. Behind the scenes, Shouko visits the Pandemonium Society alone. Reporting that the maintenance of the broadcasting equipment and the expansion of the broadcast network are complete, she simultaneously proposes a blitz speech by Makoto."
3130877927 = "An Inevitable Occurrence"
1152577695 = "The very moment Makoto is about to begin her speech, an equipment malfunction occurs, and mysterious words begin to air. After a brief restoration, just as everyone is breathing a sigh of relief, Makoto suddenly declares war on Kivotos. With Hina instantly appearing on the podium, everyone expects her to stop Makoto, but instead she shows agreement and shakes hands with her, throwing the scene into ultimate chaos."
2561484869 = "Relics of the Past"
2431496816 = "Teacher, who went around visiting Gehenna's club activities to grasp the situation, notices that anomalies are occurring exclusively among the third-years, including Makoto, Hina, Ako, and Sena. While discussing countermeasures with unaffected second-years like Iroha and Iori, third-year Satsuki visits Teacher. Tension rises, but Satsuki is unaffected, and states that the root cause of the series of incidents is brainwashing by the \"True NK Ultra Plan.\""
4211088235 = "A Step Too Late"
2745023164 = "The only unaffected third-year is Satsuki, the head of the Pandemonium Society Intelligence Department. She begins to talk about the true identity of the Kaiser's NK Ultra Plan and its dangers. Based on that information, they reach a consensus to aim for resolving the situation while the declaration of war on Kivotos is still restricted to internal information within Gehenna. Crossing the boundaries of club activities, an operation for Gehenna's survival begins to move."
3589255139 = "Chinatsu"
3107677907 = "Visiting the Emergency Medicine Department, Chinatsu exchanges words with Sena, who has unexceptionally gone strange. Even though she is definitely Sena, seeing her justify Gehenna's attacks across all of Kivotos hardens Chinatsu's resolve to make sure she brings her back to normal."
792108159 = "The Gehenna Restoration Committee's Reaction"
3808986636 = "Mayumi and Karen are bewildered by the madness shrouding Gehenna. However, Shouko welcomes this as the arrival of a \"Great Gehenna.\" Led by the Pandemonium Society third-years who have come to visit the Gehenna Restoration Committee, Shouko heads to the Pandemonium Society's operation command room."
659494854 = "Gehenna United"
373240233 = "The Pandemonium Society and the Prefect Team join hands and proceed with preparations for an attack. The autonomous district's resources are requisitioned one after another, and the second-year students are also gradually dyed in the atmosphere enveloping Gehenna. Seeing this, Mayumi and Karen lose sight of where they are aiming to go."
2329517258 = "I Quit"
3212628286 = "Visiting the Pandemonium Society, Mayumi and Karen try to persuade Makoto, but she refuses to break her hardline attitude. Seeing Makoto like that, Iroha declares that she is quitting the Pandemonium Society. While Shouko suggests that Iroha's defection should be dealt with strictly, Makoto rejects it. Feigning obedience, Shouko smiles mysteriously."
1351431619 = "Hot Spring Development Department"
657902876 = "The Hot Spring Development Department receives a forceful order from the Pandemonium Society. Kasumi tries to flatly refuse, but is pushed into taking it on by Megu, who is uncharacteristically fired up. Feeling a strong sense of incongruity regarding Megu's demeanor, Kasumi pours her heart out to Teacher, who happens to visit at an opportune time. Afterwards, having learned the current state of Gehenna from Teacher, Kasumi resolves to cooperate with all her might."
2183499872 = "Hard to Say"
2637879427 = "Mayumi and Karen blame themselves, wondering if their activities brought about the current situation. Teacher tells them that this very sense of incongruity is proof that their efforts were not in vain. Encouraged by Teacher's words, Mayumi and Karen pull themselves together and resolve to fight to create a \"truly great Gehenna.\""
276320167 = "Chiaki"
2813606694 = "Chiaki, feeling a sense of loneliness upon seeing the changed Pandemonium Society, interviews Shouko when they happen to cross paths, attempting to exchange opinions. Amidst the parallel lines of discussion, Chiaki's instincts as a reporter strongly insist that Shouko is suspicious."
3573775966 = "Satsuki"
1320054402 = "Satsuki invites Teacher to the Pandemonium Society Intelligence Department's secret laboratory. While searching for a way to break the brainwashing, Satsuki looks back on the Kaiser era. Saying that she and Makoto should have disposed of all of Kaiser's relics in the past, Satsuki thinks of the remnants from that era and finds a clue to resolving the situation."
2574305810 = "Resistance Formed"
1052683941 = "\"Underclassmen\" from various organizations gather to form a resistance. Even so, while still racking their brains over how to break the brainwashing, Satsuki brings good news. According to her, if they use jamming frequencies to cancel out the frequencies used for brainwashing, they might be able to lift the brainwashing. To do that, they need to identify the frequencies used, and they conclude that the clues are in the broadcasting room."
2108264872 = "I Want to Be By Your Side"
694612940 = "In the fractured Pandemonium Society, Ibuki endured her loneliness. Although invited by Iroha, who has returned after a long while, to come along with her, Ibuki chooses to stay by Makoto's side. Brainwashed, Makoto bustles about in hectic preparation for attacks, but Ibuki's words shake the memories sleeping in Makoto's subconscious."
3728999235 = "Will You Cheer For Me, Teacher?"
3966608263 = "The Resistance attempts to infiltrate the broadcasting room, but their path is blocked by heavy security. As if anticipating their moves, Shouko appears with Hina in tow and leaves a warning. As Teacher follows after being spoken to by Hina upon parting, they are detained under the name of \"protection.\""
2512307957 = "Imprisonment"
942929582 = "Teacher is locked in a cell under the name of \"protection.\" Makoto visits for the sake of persuasion, but sees eye to eye with Teacher. Next, Shouko also comes and engages in dialogue with Teacher, but conversely, Shouko herself shows agitation at Teacher's words."
970775719 = "The Rebels"
3347031609 = "Entrusted with all the preparations for combat rations, the Gourmet Research Society delays as much as possible while under Haruna and Akari's supervision to resist. As this successfully causes flaws in the supply plan, Makoto, anxious about delays to the overall schedule, decides to restore Kaiser's strategic weapon, and the situation begins to move rapidly."
615477350 = "Operation Planning"
2403023457 = "Faced with the obstacle of the broadcasting room's remote control system, Kirara and Erika offer their cooperation. Though they were trying to make meticulous preparations, information brought by Chiaki that Kaiser's weapon was about to be restored forces them to start the operation immediately."
3540415323 = "Operation Gehenna Recovery (1)"
1438541752 = "Infiltrate the broadcasting room and transmit the set jamming frequencies to the entire academy. Toward that ultimate goal, an operation upon which Gehenna's fate rests begins. While the Hot Spring Development Department digs an underground tunnel to rescue Teacher, Iori and Chinatsu charge into the main building as a diversion to draw the enemy's attention."
3781429285 = "Operation Gehenna Recovery (2)"
196335811 = "Hina and Makoto stand in the way of Iori and Chinatsu as they aim for the Gehenna main building. Even so, the two continue to call out to them without regard for their own bodies, believing their voices will reach them. Unfortunately, the situation does not change, and though they are slowly being cornered, they somehow manage to hold out until Teacher's arrival. Just when Mayumi and Karen join up and the counterattack seems ready to begin, Shouko appears."
3226876046 = "We Who Become Flames"
3737355680 = "Shouko is certain of her victory and reveals that she is a follower of Kaiser. However, the jamming frequencies reached through Satsuki's tenacity resonate throughout Gehenna, and the brainwashing begins to waver. Just when it seems all of this is over, the Death Trigger activates right before the cancellation is complete, and the third-years' minds are on the verge of being destroyed. The second-years are struck with despair, but in response to Iroha's cries of grief, Makoto finally opens her eyes and strikes down Kaiser's legacy that shrouds Gehenna."
2627851490 = "What Was Left Behind"
4261624041 = "Stopping Hina as she tries to apologize in front of the entire student body, Makoto declares that she will take all the responsibility. Seeing her speech and responding to the Gehenna students uniting as one, Mayumi and Karen decide to make a fresh start. Hina returns to the Prefect Team and Makoto to the Pandemonium Society, each apologizing to their underclassmen in their own way. Afterwards, Teacher gives Makoto homework: to simply keep being Makoto."
2393383984 = "Those Left Behind"
151641469 = "The upperclassmen, having returned to normal, spend time reconciling with their respective underclassmen. Meanwhile, Kasumi senses the shadow of \"Bodensatz,\" an organization she once belonged to, behind this incident."
2010497725 = "The Indelible"
4159819389 = "Hina confronts her own dark side, which was brought to light by this incident. Consumed by self-blame, Hina is gently supported by Teacher, who helps her stand up once again. This does not mean everything is settled and done with... as the imprisoned Shouko reveals the existence of the mastermind to Teacher, and Makoto and Hina quietly discuss what Kaiser left behind."
208885278 = "Ibuki's Runaway Incident (1)"
3468041821 = "Makoto eats her pudding without permission, and a furious Ibuki storms out of the Pandemonium Society and runs away from home. Despite Makoto's desperate efforts searching everywhere, Ibuki cannot be found. Around that time, the Problem Solver 68 happens to run into Ibuki. Realizing that Ibuki is from the Pandemonium Society, they are initially intimidated, but finding themselves unable to just ignore her, they decide to accompany her."
2954703779 = "Ibuki's Runaway Incident (2)"
10866310 = "At Iroha's request, the Prefect Team begins searching for Ibuki. Ibuki, who has been having fun with the Problem Solver 68, is discovered by Ako, but refuses to go home. Even Haruka starts saying she wants to stay with Ibuki, and Aru takes Ibuki and Ako back to the Problem Solver 68 office."
1790224862 = "Ibuki's Runaway Incident (3)"
1674270680 = "The group gathers at the Problem Solver 68 office, along with the members of the Pandemonium Society who arrive late. Makoto apologizes to Ibuki, and each expresses their inner feelings. However, contrary to the warm atmosphere, Kayoko and Makoto exchange meaningful words. And upon leaving, Ako imparts information concerning a \"storm\" to Kayoko."
