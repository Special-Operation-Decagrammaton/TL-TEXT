1265553395 = "The Weight of the Vacancy"
1713340321 = "Path to Ryugu"
2213309909 = "On the day of the mass prison break, Nanami sets her sights on the ocean, journeying through unfamiliar land."
71651844 = "Path to Ryugu"
2242285787 = "On the day of the mass prison break, Nanami sets her sights on the ocean, journeying through unfamiliar land."
3005988327 = "Path to Ryugu (1)"
1955320180 = "Path to Ryugu (2)"
2186991648 = "Division of Roles"
3964687291 = "When the policy regarding Sammy's disembarkation was made public, the blame from Odyssey's students concentrated entirely on the General Student Council President. As Sensei makes their way back from Odyssey, they are approached by the General Student Council President. She reveals that she intentionally took on the role of the villain, expressing her hope that this incident would serve as an opportunity to break away from blind faith in authority and custom."
2931575436 = "Chase on the Water"
1914181232 = "The day of disembarkation arrives, and just as only the procedures remain, Sammy suddenly disappears. A chase across the deck ensues, but the pursuit drags on as many students harbor and hide Sammy. Minato finally corners Sammy and tries to catch her, but misjudges the distance and falls into the sea. While everyone is bound by taboos and unable to approach Minato, Sammy is the very first to move."
415566887 = "A Change of Heart"
895446679 = "Seeing Sammy's actions, Minato changes her mind. The General Student Council President also easily accepts this change of heart in Minato. Odyssey decides to stay with Sammy until her final day. However, that night, Sensei receives a message from Sanae stating that Sammy has very little time left."
3695417333 = "Taking Up the Oar"
2517938056 = "Facing Sammy's sudden turn for the worse, the students discuss the taboo surrounding 'a cat drawing its last breath on a ship.' As the debate grows heated, Minato decides as captain to defy the taboo. The gift for Sammy is a familiar sight—showing her the open ocean where ships sail. Minato calls upon the entire student body to set sail."
1647764844 = "The Final Voyage"
2691008338 = "Sammy's final voyage begins. When the sun rises and the horizon shines, Sammy quietly closes her eyes, surrounded by her dear friends."
3094426154 = "The Weight of the Vacancy"
174712929 = "Half a month has passed, and Odyssey is slowly regaining its calm from the commotion surrounding Sammy. Sensei witnesses the students beginning to change, little by little. Confirming that Odyssey has taken a new step forward, Sensei leaves the academy. On the way back, Sensei is approached by the General Student Council President and hears an unexpected truth."
1510134740 = "On Proper Temperatures"
2943518751 = "Kasumi develops a seaside hot spring and invites Sensei. However, roads were illegally torn up for its development. As a result, she becomes a target of the Prefect Team's crackdown, and even Sensei is arrested as an accomplice. Naturally, though, Kasumi has already hatched an escape plan and breaks out of prison alongside Sensei."
3622450176 = "Charisma of the Hot Spring District"
146529220 = "Kasumi steps into the underworld to procure construction materials. Seeing her handle prominent merchants in the Black Market with ease, Sensei asks Kasumi to show her her 'true feelings.' However, she is deftly evaded and brushed off with smoke."
2807831929 = "Entanglements"
861701543 = "Told by Kasumi that she wants to thank him, Sensei heads to the meeting place. Upon arrival, he stumbles upon a scene where Kasumi is confronting a student wearing an unfamiliar uniform. Their conversation includes an unfamiliar term: 'Bordensatz.' Noticing Sensei, Kasumi hastily urges him to go home."
2125872919 = "Kinigawa Kasumi"
804847012 = "Kasumi tries to express her gratitude while Sensei brushes it off, saying no thanks are necessary, resulting in a standoff. As they walk along the beach together, Kasumi finally reaches her limit and promises to answer just one question, whatever it may be. With that, Sensei asks about the lab coat Kasumi is always wearing."
1325920005 = "The Road to the Dragon Palace (1)"
3356883563 = "The day of an unprecedented mass breakout from the Correction Bureau. Guided by Professor Niyaniya, Nanami is dropped off in an unfamiliar area. Though she has no choice but to head for the ocean on her own, the journey is far from smooth for someone unaccustomed to land."
856872019 = "The Road to the Dragon Palace (2)"
1444107276 = "Fortunately, Nanami manages to catch a ride in a car heading toward the sea. After some commotion, she successfully returns to the ocean, breathing in the nostalgic scent to her heart's content. As a return gift for the driver who brought her here—whose goodwill asked for nothing in return—Nanami attempts to repay the favor in her own unique way."
