3936047 = "Ally Striker students are divided into two spaces based on their formation positions to participate in combat.\nThe Monkey Conductor appears split across two spaces and will preferentially attack students in the same space.\n\nAssign Tank students capable of withstanding the Monkey Conductor's powerful attacks to each space."
