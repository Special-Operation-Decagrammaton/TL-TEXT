929924431 = "If I Were on TV"
2914636148 = "Prologue"
1658643691 = "A girl who visited Sensei after a long, exhausting journey through unsteady steps. Her wish was simple: to put an end to endless conflict."
809358651 = "Class 183"
1211301725 = "Guided by Rana, Sensei arrives at \"Class 183\" deep in the mountains. Introducing themselves as a research organization of top Red Winter scientists, Anna and Erina showcase a tank currently under construction. However, the two begin bickering after disagreeing on their explanations."
1670107208 = "The Usual Routine"
682982497 = "As Rana and Sensei watch the situation unfold, Anna and Erina fail to reach a consensus on the tank's design. After engaging in this \"exchange of opinions,\" the two resort to physical \"persuasion\" via wrestling to settle on a conclusion. This very match is the \"never-ending conflict\" Rana wished Sensei would stop."
2587294597 = "What Business Do You Have Here?"
3012095394 = "Sent to Class 183 with three entirely different sets of circumstances, the trio finds a glimmer of hope in Cherino's declaration that \"the Gehenna Cup winner will receive the ultimate reward.\" Plotting to win their freedom by claiming victory, the race preliminaries are only four days away."
894372207 = "You're Right, But I'm Correct"
56997331 = "Although opinions continue to clash between Anna and Erina, Sensei's mediation drastically reduces their fights. Thanks to this, tank construction begins to proceed smoothly. With the situation looking up, Class 183 is enveloped in a bright atmosphere. However, only Anna seems somewhat uneasy."
1735123314 = "Why a Tank?"
3558314185 = "Sensei asks the three why a tank, despite their goal of \"winning the Gehenna Cup.\" Though their personal motivations differ, all three share the exact same goal of winning. However, as a result, their progress is so smooth that they run completely out of materials for the tank."
3407720727 = "What's Mine is Mine"
3640611060 = "Seeking out the materials they ran out of, the group slips down the mountain under the cover of night. They infiltrate the Red Winter Secretariat to procure supplies, only to find Marina and the Public Peace Bureau blocking their path."
2120795861 = "There's No Need to Go That Far"
715411051 = "Even faced with Marina and the Public Peace Bureau, Anna and Erina stand their ground without flinching. Despite the ruckus, the Class 183 trio successfully brings back the supplies. Thanks to that effort, tank construction finally reaches its climax a few days later. Behind the scenes, however, Marina is getting chewed out by Cherino."
3374322219 = "Joy and Worry"
1756879207 = "Preliminaries day. Final checks begin on the \"Puppy,\" completed after much hardship. Minor flaws are found, but none of them are fatal. All that's left is to start the engine and head to the venue—until Anna reports there is no fuel."
1859767393 = "For Each Other's Sake"
3596323184 = "Learning there is no fuel left, Erina rushes off. Anna is left standing dumbfounded, completely at a loss for words. Class 183 seems ready to stall right at the starting line, but to break the deadlock, Rana poses a question she has kept hidden in her heart."
3129291636 = "In Search of a Friend"
1612498461 = "The group heads out to search for Erina and finds her in the blizzard. Anna and Erina finally lay bare the feelings they've kept hidden in their hearts. Clearing the air, they make up and forge an even stronger bond. Seeing Erina sneeze, Rana comes up with a way to reach the race venue even without fuel."
1648978776 = "Assuming All Friction is Ignored"
689756728 = "No fuel, no time. However, the plan Rana came up with solves everything. Propelled by the recoil of shellfire, the tank dashes down the mountain in a single breath, just barely making it in time for the preliminary application deadline."
3117436017 = "Peace for Each"
1348888834 = "Red Winter is in an uproar due to a coup d'état. The Class 183 trio heads to the Secretariat to get the final hurdle stamped: their outing permit."
1426807957 = "Going to Gehenna"
255072719 = "The Class 183 entourage finally arrives at the Gehenna Cup main tournament venue. They encounter numerous rivals, along with Iroha, the absolute champion of tank racing."
2950101776 = "If I Were on TV"
14204933 = "Watching TV in the Gehenna Cup participants' lodgings, the Class 183 trio is deeply moved while watching the introductory videos of their rivals."
895932308 = "Having advanced to the main tournament, Class 183 steps onto the Gehenna Cup grounds with high expectations."
4029941380 = "The Gehenna Cup looms near. What rivals await Class 183—"
155334161 = "Occult Research Club"
36885371 = "This is the magical, everyday story of students who research the occult hidden within art."
2341156566 = "Occult Research Club"
1443904036 = "This is the magical, everyday story of students who research the occult hidden within art."
2316215755 = "Suspicious Fortune-Telling"
323395856 = "Suspicious Liminal Space (1)"
3027657614 = "Suspicious Liminal Space (2)"
3789706054 = "A Special Performance"
161799357 = "While Tsumugi is preparing for a live show, she gets harassed by some delinquents. However, Tsumugi doesn't flinch; she pulls out her guitar and treats them to a 'special performance.' Peace is the manifestation of a merciful heart. If the will to commit violence breeds conflict, then one must crush that will before it starts. Today, too, Tsumugi shouts for love and peace."
1627731059 = "Sleeping Beauty"
3039523692 = "While taking a night walk, Sensei runs into Tsumugi at the park. When asked, Tsumugi explains she was sleeping in the park because it gives her inspiration. Although Sensei urges her to return to the dorms, Tsumugi can't go back because she snuck out without permission. So, Tsumugi comes along with Sensei to Schale, where she plays a performance to help boost Sensei's work efficiency."
2433104691 = "Carpe Diem"
1538088413 = "On the way back from a concert, Tsumugi and Sensei stop to eat some sweets together. While talking about what is 'special,' Tsumugi speaks about her philosophy on art—Carpe Diem. She then promises that one day, she will perform a song created solely for Sensei."
1534388980 = "Light and Darkness"
617387565 = "At Tsumugi's invitation, Sensei visits an exhibition themed around 'the darkness lurking in art.' As they walk around viewing the pieces and exchanging opinions, Tsumugi gains inspiration for a new song. Light shines most beautifully in the darkness—when Tsumugi performs the song for Sensei another day, it plays a gentle melody, unlike her usual death metal."
4011688063 = "Suspicious Fortune-Telling"
2278795121 = "Rena says she's been having bad luck lately. For her sake, Eri tries doing a fortune-telling reading, which results in the finding that 'imitating a cat' will ward off misfortune. Rena doesn't seem to believe it at all in the moment, but late at night, when everyone else is asleep, she tries imitating a cat all by herself. Strangely enough, from the very next day, no more bad things happen to her."
723942235 = "Suspicious Liminal Space (1)"
1165794301 = "After hearing a rumor that there is a liminal space within the academy, the Occult Research Club sets out to investigate. What awaited the group as they stepped into the suspicious building was an eerie sign."
454263912 = "Suspicious Liminal Space (2)"
934430591 = "The Occult Research Club continues their exploration, noisy despite their fear. Finally reaching the 8th floor, the group confronts a great evil—or so they thought. It turns out the building is just a set built by students from the Film Department. Having uncovered the truth, the group leaves the building feeling refreshed. ...The blood-stained girl they saw on the way out must surely be part of the set, too."
1969245600 = "Train in a Dream"
67561232 = "If there is a past you wish to return to, please listen quietly on a late-night platform. A train heading to the past just might come to pick you up."
843776207 = "Train Bound for the Past"
2952232891 = "Fare Evasion"
2977149122 = "A Train That Shouldn't Exist"
3578602917 = "Spot Check"
566078205 = "The Ranks and the Execs"
435155634 = "An Unexpected Reunion"
2396709331 = "The Fox and the Rabbit"
3984385139 = "Looking for a Friend"
593238005 = "Express Train for Private Hyacinth Academy"
3074763493 = "Bullet Train"
58320216 = "Ekiben"
3667920182 = "Train Bound for the Past"
714623568 = "A student from Private Hyacinth Academy, which was closed down and whose students transferred to other academies. While waiting for a train at the station, she reminisces about the past and encounters an express train \"bound for Private Hyacinth Academy\"—a line that should have been discontinued long ago."
4177125948 = "Fare Evasion"
3792136270 = "Sensei was traveling on a Highlander train. However, having lost their ticket, they are nearly thrown off the train during a ticket inspection. Just when all hope seems lost, Sensei is saved thanks to the FOX Platoon happening to be on board. Upon asking, Sensei learns that the FOX Platoon is heading to Kawanishi Station to investigate a train that shouldn't exist."
1542490081 = "A Train That Shouldn't Exist"
2261865012 = "Eyewitness reports have been coming in regarding a mysterious train. However, Momoka, the Traffic Department Director, dismisses them, stating that operating according to the testimonies is physically unlikely. Unable to mobilize Valkyrie due to jurisdictional issues, the General Student Council President asks Yukino to investigate."
3217051810 = "Spot Check"
1457234732 = "Kurumi and Otogi visit Kawanishi Station disguised as CCC executives to conduct interviews. However, the station staff finds the two suspiciously overly helpful compared to the usual CCC and grows suspicious. With some quick thinking from Otogi, they somehow manage to get through the situation."
745546688 = "The Ranks and the Execs"
1096681363 = "After finishing interviews with users, Kurumi and Otogi head to the station office. However, the station master of Kawanishi Station also finds the two suspiciously helpful compared to the usual CCC, casting suspicious glances their way. Once again, Otogi's quick thinking successfully covers for them. Afterward, they obtain testimony suggesting that the \"Profiteering Broker\" might be involved."
1050046740 = "An Unexpected Reunion"
3651589811 = "After staking out at night to intercept the problematic train, Kurumi and Otogi catch a cold. With Niko also out of commission, Yukino is forced to step up and conduct the interviews herself. Conducting the interviews with an unusual demeanor, Yukino happens to run into her underclassman, Miyako."
2967418712 = "The Fox and the Rabbit"
3976802473 = "Miyako is displeased that Yukino and the others didn't contact her after leaving the detention camp. However, Yukino explains it was necessary for their operation, and Miyako is tentatively convinced. Meanwhile, it turns out that Miyako was also investigating the same incident on a friend's request. Miyako shares her information with Yukino and introduces her client."
3700706023 = "Looking for a Friend"
3997188198 = "A student from Hyacinth Academy visits the FOX Platoon at Miyako's introduction. She shares the situation with the FOX Platoon, stating she saw a train pull into the platform that had no business being there. Guessing that the trigger for the train's appearance might be a student from Hyacinth Academy, the platoon agrees to gather again at night."
350050892 = "Express Train for Private Hyacinth Academy"
9593635 = "Recreating the situation experienced by Miyako's friend, a train that shouldn't exist finally pulls into the platform. With no passengers visible inside, the train gives off an eerie atmosphere. Undaunted, the FOX Platoon boards the train."
1050215819 = "Bullet Train (1)"
2220200859 = "The interior of the train is an infinite structure where no end is in sight, no matter how many cars they pass through. Changing their strategy, the FOX Platoon decides not to search for the enemy, but to draw them out instead. When they activate the emergency stop switch to signal an abnormal situation inside the train—a monkey-like animatronic conductor appears."
3332551061 = "Bullet Train (2)"
1056026822 = "They defeat what appears to be the conductor and engage the brakes, but for some reason, the train doesn't stop and instead keeps accelerating. The FOX Platoon has no choice but to destroy the engine mechanism to bring the train to a forced stop. Shaken by the impact, the group is thrown out of the train along with other passengers. Seeing red spider lilies blooming near the tracks, the FOX Platoon reflects on the students' memories."
1604545363 = "Ekiben"
2949529384 = "This time, Sensei boards a train with the \"wrong ticket.\" Just as they are about to be thrown out of the train yet again, Miyako, who happens to be there, throws them a lifeline. Saved in the nick of time, Sensei ends up sitting next to Miyako. The two share idle chatter, but the topic eventually shifts to SRT, and Miyako opens up about Yukino's past."
