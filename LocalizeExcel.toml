1231709678 = "Vol.2 Odyssey Chapter"
2261800104 = "The Odyssey Maritime School fleet has returned to D.U.! What news have the Odyssey students brought back from the sea?"
849701426 = "Horizon in the Eyes"
3810323872 = "Sammy, a ship cat who has spent a long time with the Odyssey students. Sammy's worsening health sparks a conflict that divides the students in two."
4021215574 = "S.O.S."
4041311388 = "Return of the Olympus"
3495906358 = "Ocean's Taboo"
1132489376 = "White Uniforms and Curry"
3410173576 = "The Elderly Cat, Sammy"
3032649239 = "Curiosity Killed the Cat..."
1213356270 = "A Restless Waiting Period"
3577098988 = "The Third Option"
3001593746 = "S.O.S."
746532052 = "Sensei was treasure hunting with Arona and Plana on the beach. Arona found a ball made of woven rope, and when Sensei picked it up, \"S.O.S.\" was written on it. Believing this to be a distress signal, Sensei visits the General Student Council President to ask for her opinion. The President recognizes the ball as having drifted from Odyssey and orders the fleet at sea to return."
246641988 = "Return of the Olympus"
1574683535 = "Hearing of Odyssey's return, a large crowd flocks to the port. Sensei and the General Student Council President are welcomed by Sumika and other Odyssey students, and board the flagship Olympus. Amidst a grand welcome, they meet the head of the student council known as the \"Island\"—Captain Minato of the Seaways."
2840471655 = "Ocean's Taboo"
4107757722 = "Guided by Minato, Sensei tours Odyssey's various clubs. Wherever they go, Odyssey students seem overly anxious about \"sailor taboos.\" Afterwards, Sensei and the General Student Council President are invited to a dinner party before talks begin."
902993283 = "White Uniforms and Curry"
206447646 = "In accordance with Odyssey tradition, Sensei and the General Student Council President are served curry. During the discussion following the meal, Minato talks about how much emphasis Odyssey students place on \"taboos.\" When Sensei asks about the ball with S.O.S. written on it, Minato replies that it's \"Sammy's toy.\""
1453439230 = "The Elderly Cat, Sammy"
4054456941 = "Sensei is relieved that the distress signal was a misunderstanding. However, Minato mentions that even without this summons, they were already considering a return to D.U. Apparently, conflict has arisen within the academy over how to handle Sammy, whose health has worsened, using the \"taboos\" as an excuse. The General Student Council President grants a one-week grace period to find a solution."
989252645 = "Curiosity Killed the Cat..."
3030870987 = "Although a one-week grace period has been granted, as if following the sailor's taboos, misfortune continues to follow Sammy wherever he goes. As Odyssey students grow increasingly anxious about the taboos, Sensei strains their back trying to help Sumika, who fell on the deck."
83253996 = "A Restless Waiting Period"
2355009320 = "Carried to Odyssey's infirmary, Sensei is treated by Sanae, the head of the infirmary. Along the way, Sanae calmly remarks that the debate over Sammy's disembarkation is nothing more than students' self-satisfaction. The General Student Council President then appears and takes Sensei to visit the \"Island\"."
1925103632 = "The Third Option"
2863133021 = "Minato, who had been delaying her decision, acknowledged her own weakness and struggled with anguish. Seeing this, the General Student Council President proposed using her own \"authority\" to provide a righteous justification for Sammy's disembarkation. With a sorrowful expression, Minato reluctantly accepts."
3876238400 = "Divers and Safety Measures"
157835473 = "While visiting Schale for her shift, Kokoro points out that hazards lurk everywhere in the office while tidying up supplies. She ends up getting absorbed in taking measures to prevent accidents."
1723241164 = "Divers and Sea Shanties"
3165996038 = "Kokoro is caught humming a tune while working by Sensei. According to an embarrassed Kokoro, everyone who hears her sing jumps into the sea. At Sensei's request, she agrees to let them listen after tying herself up and making thorough preparations. Sensei somehow manages to maintain consciousness against her overwhelmingly tone-deaf singing voice."
4007337301 = "Divers and Miso Soup"
734483639 = "Kokoro says she dislikes miso soup. When Sensei finds this strange, Kokoro explains that stormy, rough seas with poor visibility are sometimes described as \"miso soup.\" Rather, Kokoro says she loves a warm bowl of miso soup after diving. Claiming she made too much today, she shares her miso soup with Sensei, and they eat together."
1015913429 = "Divers and Decompression Sickness"
1328713023 = "One day when Sensei was visiting to observe the Diving Club's activities. Due to a mistake by Sensei, Kokoro is forced into an emergency ascent and suffers from decompression sickness. With her consciousness fading, Kokoro boldly leans on Sensei for help."
990427823 = "An Inquisitive Killer Whale"
2551132856 = "Kotone has poor eyesight and cannot tell who someone is unless she gets close. When Sensei worries about her, Kotone tells them there is a way to identify people by sound, and explains which sounds carry well underwater."
798055919 = "Lost Killer Whale"
2080254678 = "When her glasses break and she can barely see ahead, Kotone heads to an optician with Sensei to get a new pair. Along the way, Sensei feels like they're on pins and needles walking around with Kotone in her usual outfit, but Kotone doesn't seem to care. However, once she gets her new glasses and can see her surroundings, Kotone finally feels embarrassed."
3352714660 = "Drifting Killer Whale"
2890681896 = "Sensei is worried when they can't find Kotone at the place they promised to meet. Searching the area, they discover Kotone floating on the water's surface. She explains that lying in the water while sunbathing is very comfortable. When invited, Sensei tries it too, but can't quite get the hang of the balance and finds they cannot relax."
1149286592 = "A Message to Convey"
3091744008 = "Kotone says she made a friend she got along well with via shortwave radio during a voyage. However, since contact was recently cut off, she was trying to send a letter to an address she'd heard beforehand. Having made it to the mailbox, Kotone hesitates on whether to send the letter, wondering if she's being a bother. Sensei encourages Kotone and gives her a push."
4176315336 = "A Kind of Mannerism"
508250077 = "Kasumi makes preparations for the Hot Spring Development Department's training camp at the beach. She goes out shopping with Sensei, but along the way, they get hassled by some Black Market delinquents. However, unlike usual, Kasumi resolves the situation with surprising and unusual mildness."
418745514 = "Dive into OCEAN!"
76319451 = "The Diving Club was suffering from chronic funding shortages to maintain their equipment. To add insult to injury, they caused an explosion accident, saddling them with massive debts... Can the Diving Club avoid the crisis of disbandment?"
2787310695 = "The Girl's Beach Flute"
1877989650 = "Sardine Ice Cream"
3504510715 = "The Girl with Poor Eyesight"
1296231326 = "Specialty Kelp Tea"
1617586141 = "Dangerous Barnacles"
