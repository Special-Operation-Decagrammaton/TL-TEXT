#[+][Sinopse do Volume]
1231709678 = "Vol. 2 Odisseia"
2261800104 = "A frota do Colégio Marítimo Odisseia atracou de volta no D.U.! Qual será a mensagem que as alunas da Odisseia trouxeram do alto-mar?"

#[+][Sinopse dos Capítulos]
849701426 = "O Horizonte Refletido nos Olhos"
3810323872 = "O gato marinheiro Sammy passou longos anos navegando ao lado das garotas da Odisseia. Porém, quando sua saúde começa a definhar, um dilema baseado em antigos tabus dos mares divide a tripulação ao meio."

