583205708 = "Class 183, Disbanding!"
3095642916 = "Off your Tank!"
3688029786 = "I'll Write to You When I Get There"
4104086610 = "Air-Cooled 0-Cylinder"
245265694 = "Paradise of Warriors"
117918086 = "Paradise Lies Where You Dash Through"
3167318731 = "Prologue"
3290973226 = "Makoto loudly declares the opening of the Gehenna Cup. However, because the microphone wasn't turned on, her 30-minute speech up to that point reached no one."
1819059770 = "The Souvenir is a Championship Trophy"
2721489330 = "Arriving at the lodging prepared by Gehenna, Special Class 183 is moved by the facilities and hospitality. Exchanging greetings with other participating teams and spending a fun time, Anna and Erina find it hard to sleep at night due to the tension of facing the main match."
2314671506 = "Starting Now, We... (1)"
1651151692 = "The race day arrives. Sensei, invited as the tournament commentator, takes commemorative photos with the three members of Class 183. At the same time, members of the Pandemonium Society are buzzing about their \"custom-made clothes\" being stolen. And then, the starting moment finally arrives. The moment Satsuki gives the signal and the race begins, the tank next to Koinu-go explodes."
4118353135 = "Starting Now, We... (2)"
614496572 = "The three members of Class 183 are bewildered to find themselves caught up in an artillery battle despite it being a tank race. The rule of the Gehenna Cup is to \"shell all targets and be the first to return to the starting line.\" Put another way, they can do whatever it takes to achieve that, Iroha tells Class 183 amidst the fierce chaos."
1635998454 = "Rules of Engagement?"
2166339801 = "A lawless Gehenna Cup. While C&C and the Game Development Department engage in a fierce battle—Class 183 looks on and uses the opening to push ahead."
2141410352 = "Time On Target"
2864090624 = "Moving in stealth and skillfully avoiding the fierce clashes happening everywhere, Class 183 finally bumps into an enemy tank. However, it is fortunately out of ammo, making Valkyrie team Class 183's first combat success."
2161882777 = "I Don't Listen to the Weak"
4285447579 = "Powerhouses drop out one by one. The C&C team, which had been on a winning streak, ends up trading mutual destruction in a mirror match against an identical tank piloted by Toki. Meanwhile, the three members of Class 183 heading to their next target encounter an unexpected opponent."
2561254611 = "Run and Get 3, Participate and Get 1"
3236480027 = "Class 183 reaches out to help the Ninjutsu Research Department team, who advanced to the main tournament with a tank made of cardboard and sheer manpower. Touched by the Ninjutsu Research Department's indomitable spirit, Class 183 steels their resolve. However, without time to rest, looking down from the hill Koinu-go has climbed, the Abydos team and Remedial Class team are sparking conflict."
4067448400 = "Red Light"
2555980580 = "Spotting Cherino, Class 183 attempts to flee the scene. But just as they are cornered and seem doomed, the Remedial Class team cuts in to throw Class 183 a lifeline. Erina was on the verge of breaking down, but Anna and Rana's encouragement helps her bounce back."
2115253644 = "A Coup, Isn't It?"
3470259662 = "Aided by the Remedial Class team, Class 183 narrowly manages to defeat the Red Winter Office team. Cherino is furious, but Rana's explanation that they were merely fighting a \"tank race\" rather than a \"coup\" clears up the misunderstanding, and Class 183 avoids being purged. At last, the race enters its final stages."
1490119510 = "Do Your Absolute Best"
39249276 = "Class 183 reaches the volcanic zone and confronts the absolute champion Iroha's Toramaru team. However, volcanic activity has unluckily escalated, creating a situation where the tournament's management is in jeopardy. Iroha suggests that if the race is canceled, both sides will be treated as runners-up. But the three members of Class 183 refuse to concede the championship and challenge the match."
1750496948 = "Class 183, Disbanding!"
1855274050 = "Rana worries about the parting that comes after winning, but Anna and Erina laugh, saying they'll stay friends forever even if they win. And amidst worsening volcanic ash, the final battle begins."
932528563 = "Off your Tank!"
2205257543 = "Special Class 183 claimed victory. Reflecting on the journey, Rana asks Iroha to learn \"words to offer a friend when they need comfort someday.\" Looking satisfied with Iroha's answer, Rana joins Anna and Erina to take a group photo commemorating their victory."
2571471402 = "I'll Write to You When I Get There"
1197500779 = "The three members of Class 183 receive an award from Cherino at the Gehenna Cup victory celebration. The three are overjoyed, but an investigation suddenly begins regarding the trouble they caused during the preliminaries. As a result, indefinite detention in Special Class 183 is ordered, meaning escape is impossible and their environment hasn't changed. Yet, something has surely changed between the three of them."
3793283036 = "Air-Cooled 0-Cylinder"
1902928889 = "Just before the main tournament, the Remedial Class's Crusader-chan had its air conditioner break down. A package arrives from Pandemonium Society to Hifumi, who had ordered dry ice as a remedy. But contrary to expectations, what's inside the box is a functional and cool-looking racing suit."
3977589434 = "Paradise of Warriors"
4162184746 = "The race ended, and a closing celebration party was held. Competitors who vied for victory gathered together in one place to deepen their bonds."
4166411545 = "Paradise Lies Where You Dash Through"
2824330210 = "As the race ended and cleanup progressed, a tank on its last legs made its appearance. The Ninjutsu Research Department, having refused to give up until the very end, crosses the finish line watched over by the staff."
3958571189 = "Just before the main tournament, the Remedial Class's Crusader-chan had its air conditioner break down. The remedy for that is—"
2682898429 = "The race ends, and a closing celebration party is held."
2506146639 = "Behind the celebration party, cleanup after the race was underway. And there is one more thing being forgotten—"
1884380721 = "Grand Assault - Nightmare Train"
3312135576 = "Grand Assault - Nightmare Train Repulsion"
