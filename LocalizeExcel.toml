2505008134 = "In Challenge stages, the boss has infinite HP. Deal as much damage as possible before the hermit crab falls to aim for a high score!"
4284578638 = "The boss's damage taken accumulates, and when the ATG gauge is full, a special pattern is triggered.\nInput the buttons in order within the time limit.\nSuccess will temporarily incapacitate the boss and strengthen your hermit crab!"
3084229724 = "You can strengthen your hermit crab by upgrading equipment with event items earned in Normal stages.\nEquipment can only be upgraded in bulk."
4277618846 = "Normal/Challenge stages can be set to Double-Up mode once conditions are met.\nIn Double-Up mode, damage dealt and damage taken are doubled.\nTake on an even more thrilling challenge!"
4038879599 = "Normal/Challenge stages can be played at higher multipliers once conditions are met.\nCurrency consumption and rewards increase according to the set multiplier.\nNote that for Challenge stages, the multiplier does not apply to the score earned!"
