#[+][Resumos dos Episódios]
#[-][Capítulo 1]
3599070940 = "Kunekune, a Sombra Ondulante"#[?][Episódio: 01]
1780733194 = "Entre os corredores das academias de Kivotos, começam a circular rumores arrepiantes sobre o misterioso 'Kunekune'."

3350929154 = "Entre a Raposa e a Prodígio"#[?][Episódio: 02]
4268210737 = "Cumprindo pena no Centro Correcional, as integrantes do Esquadrão FOX passam seus dias em silêncio. Yukino ainda se tortura pelos erros do passado. É quando a diretora da prisão a convoca para uma audiência sigilosa com a Presidente do Conselho Estudantil Federal. Após alinharem os acontecimentos do período de seu sumiço, a Presidente oferece a Yukino uma chance de redenção: investigar os fenômenos das Lendas Urbanas."

1745364049 = "Saco Vazio Não Para em Pé"#[?][Episódio: 03]
2002791633 = "Designadas para a missão, o Esquadrão FOX recebe a ordem de atuar em cooperação direta com o Sensei. Antes do início das operações, o grupo se reúne com o Sensei em uma churrascaria requintada. Desconfiadas da insistência dele em apenas enchê-las de carne boa, as garotas questionam suas reais intenções, mas aos poucos vão desarmando a guarda diante de sua franqueza acolhedora."

1500063239 = "Uma Nova Base de Operações"#[?][Episódio: 04]
3830197242 = "Como o Esquadrão FOX não pode atuar publicamente, o Sensei cede uma ala reservada no subsolo da Schale como abrigo clandestino, articulada previamente pela Presidente do Conselho Estudantil Federal. As garotas transformam o local em seu novo QG operacional e dão início aos preparativos da missão."

3890647442 = "Coleta de Pistas"#[?][Episódio: 05]
462822871 = "Infiltrando-se na cidade, o Esquadrão FOX inicia a investigação a partir dos relatos de vítimas que desmaiaram após avistarem um 'espantalho branco'. Niko se disfarça de funcionária de meio período para interrogar alunas do Clube de Atletismo de Gehenna, mas a abordagem falha. Contudo, Erika, que observava de perto, acaba fornecendo uma pista crucial."

1210340112 = "Entre Verdades e Mentiras"#[?][Episódio: 06]
2755602640 = "Com base nas informações recolhidas, o Esquadrão FOX tenta traçar uma linha de raciocínio. Porém, as evidências ainda são frágeis para uma conclusão definitiva. Cientes de que o culpado pode ser um fantasma e não uma cidadã comum, elas decidem aprofundar as buscas nas ruas."

2620890405 = "Vulto na Rodovia Expressa"#[?][Episódio: 07]
1869455062 = "Continuando as rondas por diversos distritos, as garotas se reúnem para cruzar dados, mas não encontram avanços concretos. Quando se preparavam para mais uma noite em claro, deparam-se com Natsuki puxando seu riquixá em plena rodovia expressa. Dela, ouvem a sinistra lenda urbana do 'Kunekune' que está aterrorizando o distrito de Hyakkiyako."

1289441933 = "Do Outro Lado da Miragem"#[?][Episódio: 08]
1473250037 = "Com as pistas em mãos, o Esquadrão FOX aguarda a hora mais quente do dia para a miragem se formar. Quando o fenômeno se manifesta, Otogi, que vigiava pela mira telescópica, é hipnotizada pelo Kunekune e entra em surto psicótico. Graças à reação rápida de Kurumi, Otogi recupera a lucidez, mas as balas disparadas durante o transe desapareceram sem deixar vestígios."

2449096511 = "Um Fio de Esperança"#[?][Episódio: 09]
1411259920 = "Analisando o transe de Otogi e o mistério dos projéteis evaporados, o Esquadrão FOX formula uma hipótese sólida sobre as condições de surgimento e combate do Kunekune. Equipando-se com contramedidas táticas adequadas, a unidade marcha para aniquilar a anomalia."

2338801941 = "Rumo às Trevas (1)"#[?][Episódio: 10/1]
2311301627 = "Para emboscar a criatura, o Esquadrão FOX escolhe um túnel subterrâneo abandonado, longe de civis. Como proteção contra a hipnose visual do Kunekune, todas colocam óculos de visão noturna. Quando a silhueta ondulante se materializa na escuridão, a caçada das raposas tem início."

1663922802 = "Rumo às Trevas (2)"#[?][Episódio: 10/2]
1425272534 = "Graças aos óculos de visão noturna, o Esquadrão FOX elimina o Kunekune com sucesso. No local de sua destruição, resta apenas um misterioso fragmento de vidro que emite um brilho espectral, refletindo uma campina verdejante desconhecida. Yukino confia o estilhaço ao Sensei, decidindo omitir a descoberta da Presidente. Com os estômagos roncando, as garotas comemoram a vitória com um jantar."

768002174 = "Inexplicável (1)"#[?][Episódio: 11/1]
1409392123 = "O Esquadrão FOX comparece ao gabinete do Conselho Estudantil Federal. A Presidente parabeniza Yukino pelo sucesso da missão, confirmando que os incidentes do Kunekune cessaram. Do lado de fora, as outras três integrantes encontram Erika por acaso e, desta vez não como agentes infiltradas, mas como amigas, vão juntas a um café. Mais tarde, a Presidente do Conselho Estudantil Federal se reúne com Kaya... e descobre que Kaya também é uma das poucas pessoas que se lembram de seu passado."

2813820339 = "Inexplicável (2)"#[?][Episódio: 11/2]
738638449 = "O Esquadrão FOX comparece ao gabinete do Conselho Estudantil Federal. A Presidente parabeniza Yukino pelo sucesso da missão, confirmando que os incidentes do Kunekune cessaram. Do lado de fora, as outras três integrantes encontram Erika por acaso e, desta vez não como agentes infiltradas, mas como amigas, vão juntas a um café. Mais tarde, a Presidente do Conselho Estudantil Federal se reúne com Kaya... e descobre que Kaya também é uma das poucas pessoas que se lembram de seu passado."

#[-][Capítulo 2]
173129466 = "Dívida de Sangue Não Fica Impune"#[?][Episódio: 01]
570905695 = "Na calada da noite no Porto de Kanezaki, um devedor desesperado está prestes a ser emparedado dentro de um tambor de óleo."

1101320102 = "Salsicha de Peixe com Sabor de Caranguejo"#[?][Episódio: 02]
4141877022 = "Durante uma ceia tardia no QG, Niko, Kurumi e Otogi relembram o caso dos camarões resolvido no passado pelo Esquadrão RABBIT. Entre risos, comentam que seria cômico se surgisse um incidente parecido com caranguejos. No mesmo instante, Yukino entra na sala com uma nova missão: investigar relatos sobre caranguejos anômalos no porto."

1336515377 = "Caranguejos e Tambores de Óleo"#[?][Episódio: 03]
2780412479 = "Os boatos falam de um caranguejo colossal que devora tudo o que vê pela frente. Achando a história absurda demais para ser real, o Esquadrão FOX se mostra cético. Porém, para acalmar o pânico da população, a equipe prepara uma infiltração no porto."

2563787234 = "O Pescador de Caranguejos"#[?][Episódio: 04/1]
2808788758 = "Conversando com os trabalhadores das docas, Niko descobre que a pesca de caranguejos disparou nos últimos meses, derrubando os preços de mercado a níveis alarmantes."

2971010417 = "O Sumiço da Serragem"#[?][Episódio: 04/2]
1660918464 = "Niko ajuda um operário que perdeu sacas de serragem no cais. Ao recuperar a carga, aprende que o transporte de caranguejos vivos exige caixotes de madeira forrados com serragem fresca."

1494676020 = "A Rota Gastronômica"#[?][Episódio: 04/3]
1067607850 = "Para ajudar uma lanchonete às moscas pelo medo popular, Niko distribui panfletos promocionais com carisma. Curiosos com as promoções, os clientes voltam a lotar os estabelecimentos locais."

3956832813 = "Retrospectiva: Dia 1"#[?][Episódio: 04/4]
2500079061 = "A apuração conclui que os boatos quase não afetam a rotina comercial do porto, embora o medo psicológico ainda paire no ar. Com poucas pistas concretas, o Esquadrão FOX arquiteta a próxima fase de busca."

4131045778 = "Registros Sobre Uma Anomalia"#[?][Episódio: 05]
24103466 = "Buscando referências sobre o Perorozilla, Yukino visita a biblioteca pública. Todos os artigos pertinentes haviam sido recolhidos dos arquivos, mas com a ajuda providencial de Shimiko, ela obtém novos caminhos de pesquisa."

2040570986 = "O Pescador Desaparecido"#[?][Episódio: 06/1]
2968028731 = "Niko segue apurando sobre o sumiço misterioso de um pescador. Um veterano afirma que o rapaz fugiu da rotina brutal do mar, enquanto um jovem suspeita de dívidas impagáveis de agiotagem."

714617311 = "Reconhecimento de Terreno"#[?][Episódio: 06/2]
1438816199 = "Ao descobrir uma estação de cargas no Porto de Kanezaki, Niko interroga os maquinistas e toma ciência de trens de passageiros que operam apenas de madrugada. Sem acesso aos registros sigilosos, ela pede que Kurumi invada o sistema da Administração de Transportes."

2398972522 = "Carpaccio e Chumbo Grosso"#[?][Episódio: 06/3]
605148683 = "Niko tenta obter declarações na sede da Família Carpaccio, mas é enxotada na porta. No distrito comercial, ouve sussurros alarmantes sobre as cobranças cruéis praticadas pelos mafiosos."

2108578455 = "Retrospectiva: Dia 2"#[?][Episódio: 06/4]
1569734950 = "As evidências sugerem que o pescador endividado fugiu nos trens da madrugada. Contudo, Yukino pressente que algo não se encaixa. Com o apoio de Sensei, o Esquadrão FOX decide aprofundar as investigações."

516333235 = "Edital de Licitação Pública"#[?][Episódio: 07]
105104110 = "Tomando café da manhã em um restaurante no porto, as garotas do Esquadrão FOX descobrem pelo dono do local que a Família Carpaccio, encarregada da segurança portuária, está encurralada diante da iminente renovação de contrato."

950626273 = "A Raposa e o Carregamento"#[?][Episódio: 08/1]
2750021426 = "Na calada da noite no Porto de Kanezaki, Niko invade os galpões clandestinos da Família Carpaccio com o apoio tático de Otogi e Kurumi."

1657414332 = "Varredura Clandestina"#[?][Episódio: 08/2]
877460878 = "Revirando os armazéns, Niko descobre indícios suspeitos. Quase flagrada por capangas da máfia em patrulha, ela usa de astúcia e reflexos afiados para escapar do cerco sem ser descoberta."

372206390 = "Retrospectiva: Dia 3"#[?][Episódio: 08/3]
1463926984 = "As peças se encaixam: o sumiço dos devedores é obra de uma conspiração sórdida da Família Carpaccio. Determinadas a revelar a verdade, as agentes do Esquadrão FOX preparam um ataque direto."

3430867049 = "Interrogatório Padrão SRT"#[?][Episódio: 09]
1540130814 = "Capturando um figurão da Família Carpaccio, o Esquadrão FOX aplica as técnicas clássicas de interrogatório da SRT. O mafioso confessa que a lenda do caranguejo monstro foi forjada pelo sindicato para aterrorizar os cidadãos. Porém, um rugido ensurdecedor abala o cais: um autêntico e colossal Caranguejo de Tambor de Óleo emerge da água atacando o porto!"

4070492427 = "Valores Imutáveis"#[?][Episódio: 10]
3578537993 = "Com manobras combinadas impecáveis, o Esquadrão FOX abate a besta colossal. Nos escombros da batalha, encontram outro estilhaço de vidro idêntico ao do Kunekune. Yukino entrega a relíquia ao Sensei, mas a comemoração dura pouco: milhares de caranguejos comuns escapam das jaulas, forçando as garotas a passarem a noite inteira caçando crustáceos pelo cais!"

2781401687 = "Epílogo"#[?][Episódio: 11]
1017824045 = "Rin apresenta ao Sensei os resultados periciais: o misterioso vidro projeta visões de algum lugar desconhecido em Kivotos. No QG do Esquadrão FOX, todos celebram com um banquete farto de caranguejos frescos. Enquanto isso, na biblioteca central, a vice-presidente do comitê bibliotecário, desaparecida há tempos, ressurge misteriosamente."

