2210067228 = "Vol.1 Fogo e Sombra"
1567989824 = "Na caótica e rebelde Academia Gehenna, os ventos da mudança começam a soprar para impor a ordem. Até onde essa transformação radical levará a escola......?"

#[+][Sinopse dos Capítulos]
2468589893 = "Façamos Gehenna Grande Novamente!"
947752189 = "Para resgatar a disciplina e a glória dos velhos tempos no meio do caos de Gehenna, é fundado o 'Comitê de Restauração de Gehenna'. Será que o sonho dessas garotas vai dar frutos?"

3320099911 = "Nós, as Chamas Que Ardem"
3334258236 = "As sombras de uma era esquecida voltam a cobrir a Academia Gehenna. Conseguirão as alunas mais novas resgatar suas queridas veteranas?"

