511752786 = "If you do not log in, your consecutive attendance days will reset to Day 1. (Updates daily at 04:00 / Achieved Steps are maintained)\nAfter resetting, you can restore attendance records by logging in for more than your previous consecutive days or by consuming Pyroxene. (※Already claimed rewards cannot be claimed again)\nPyroxene required for restoration increases by 30 for each day missed. (Max 210, no limit on number of times)\nWhen you log in for more than your previous consecutive days again, the Pyroxene required for restoration will reset."
