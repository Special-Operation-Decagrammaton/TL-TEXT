3295829362 = "Class 183"
275201071 = "Symbol of a Maid"
2631367848 = "Sensei cleans the office from top to bottom alongside Karyu. After cleaning, seeing the dust-stained apron prompts Karyu to share her thoughts. She explains that aprons are worn to keep clothes clean, which closely aligns with the \"maid\" spirit of eagerly taking on the tasks nobody else wants to do. Sensei resonates with this and they discuss the true symbol of a maid."
3672584645 = "Habits and Time"
1123694273 = "To help ease the fatigue of heavy workloads, Shimiko invites Sensei to the library. However, since the guest cushion is frayed, Shimiko gives Sensei her own favorite cushion instead. Sensei is touched by her affection when she mentions she uses her favorite items until they can no longer be repaired. Entrusting themselves to Shimiko's cushion, Sensei falls asleep while listening to her read aloud."
2743994296 = "Starting Point of Magic"
2523020723 = "Eli mentions she has started talking to her classmates, and tells Sensei about meeting her \"magic hat,\" which is the source of her confidence. She happily shares that the magic hat gave her the courage to take a step forward, which in turn led her to meeting Sensei. Afterward, as a share of its mysterious power, Sensei has Eli place the hat on their head."
1567631360 = "Genius and Experiments"
3716806598 = "Anna was reading a professional wrestling guide, but found the description \"use moderate force\" too abstract and struggled with gauging her strength. To learn from firsthand experience, Anna asks Sensei to put her in a joint lock. However, rather than putting a student in a wrestling hold, Sensei instead volunteers to be the test subject. Sensei is on edge the entire time the hold is applied."
827480703 = "Genius and Verification"
1327457066 = "Anna asks Sensei to visit Class 183 under strict confidence. Having developed a cheap and durable new material called \"Annacrete,\" she begins an experiment using the Puppy. Although verifying its strength goes smoothly, Anna forgets to account for the exit and seals the hatch, nearly trapping herself inside the Puppy. She manages to escape by punching a hole through the floor."
3728934035 = "Genius and Outings"
121768975 = "A barbecue party held on the hill behind Class 183. Using scraps from around the area as materials, Anna crafted all the barbecue tools with just a single toolbox. Just as they are about to begin, Anna realizes she forgot to ask Sensei to bring the meat. As a result, the two of them end up gnawing on jerky together."
2030604885 = "Genius and Forever After"
2160366373 = "As class president, Anna was organizing Class 183's documents. While sorting through the massive amount of records, she discovers a document from before she came to Class 183. Mixed inside was a certificate Anna had made for herself long ago. Looking dejected as she explains she made it because the awards ceremony was canceled due to circumstances, Sensei decides to hold an awards ceremony right then and there."
504111642 = "Cooking is Chemistry!"
3853115975 = "Invited to visit Class 183 to help with research, Sensei is greeted by Erina, now acting as a chef. Sensei is asked to taste-test, but Class 183 has virtually no ingredients, let alone seasonings. However, Erina procures what she lacks by making full use of chemical reactions, successfully completing an exquisite dish of nikujaga."
2712952066 = "Persuasion is Chemistry!"
1682621237 = "Although grumbling about not wanting to study, Erina actually enjoys accumulating knowledge. That day, what Erina was grumbling about while studying was wrestling moves. Erina practices by putting Sensei in a hold as a test subject, but their bodies become hopelessly tangled together. When Erina suggests they lube up with oil to slip out, Sensei desperately stops her."
486933029 = "Fashion is Chemistry!"
884460563 = "Erina obtains permission to go outside under the guise of market research for a chemical fiber product she developed. She and Sensei head to a store, but it is a ghost town. When asked, the clerk explains that all the products have issues and aren't selling at all. However, upon hearing this, Erina shows no sign of discouragement and is in high spirits, claiming it all depends on how they're used."
2326833892 = "We Are All Chemistry!"
4230686105 = "Wanting to express her daily gratitude, Erina tries to give Sensei a present. However, she fails to make an artificial diamond, and instead gets an idea, telling Sensei she'll be right back before rushing off. As dusk falls and a blizzard begins, Erina finally returns, clutching a snow crystal processed so that it wouldn't melt."
3771863442 = "It’s our Engine! ~Escape from Class 183!~"
1293972984 = "The students of Class 183 aim to win the Gehenna Cup and use that honor to win a pardon from Cherino. Overcoming numerous hardships, can they even make it into the preliminaries?"
