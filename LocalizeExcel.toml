#[+][Resumos dos Episódios]
#[-][Capítulo 1]
3001593746 = "S.O.S."#[?][Episódio: 01]
746532052 = "Enquanto caçava conchas e pequenos tesouros na praia com Arona e Plana, o Sensei encontra uma bola feita de corda trançada com as letras 'S.O.S.' gravadas nela. Acreditando se tratar de um pedido real de socorro, Sensei procura a Presidente do Conselho Estudantil Federal. Ela logo deduz que o objeto veio à deriva do Colégio Marítimo Odisseia e ordena o retorno imediato da frota, que estava navegando em alto-mar."

246641988 = "O Retorno do Olympos"#[?][Episódio: 02]
1574683535 = "Ao saberem da volta da Odisseia, multidões se aglomeram no cais. O Sensei e a Presidente do Conselho Estudantil Federal são recebidos por Sumika e pelas alunas da Odisseia, subindo a bordo da nau capitânia, o lendário Olympos. Em meio a uma recepção calorosa e cheia de formalidades navais, eles finalmente conhecem a líder do conselho estudantil 'Island' — a Capitã Kairo Minato."

2840471655 = "Os Tabus do Mar"#[?][Episódio: 03]
4107757722 = "Guiado por Minato, o Sensei faz um tour pelos diversos clubes a bordo do Olympos. Por onde passa, percebe que as garotas da Odisseia levam os lendários 'tabus de marinheiro' a sério até demais, cheias de crendices e superstições. Após o passeio, Sensei e a Presidente do Conselho Estudantil Federal são convidados para um banquete antes do início oficial da reunião."

902993283 = "Uniforme Branco e Curry"#[?][Episódio: 04]
206447646 = "Seguindo a sagrada tradição marítima da Odisseia, Sensei e a Presidente do Conselho Estudantil Federal são servidos com o clássico curry de bordo. Durante a conversa pós-refeição, Minato explica por que as alunas respeitam os tabus com tanto fervor. Em seguida, ao ser questionada sobre a bola com 'S.O.S.', Minato revela a verdade: aquilo não passava de um brinquedo do gato Sammy."

1453439230 = "Sammy, o Velho Gato Marinheiro"#[?][Episódio: 05]
4054456941 = "Aliviado ao saber que o pedido de socorro foi apenas um mal-entendido, o Sensei escuta de Minato que a frota já pretendia voltar ao D.U. de qualquer jeito. A capitã confessa que a saúde de Sammy piorou drasticamente e que a tripulação está rachada por causa dos tabus marítimos sobre desembarcar ou não o felino. A Presidente do Conselho Estudantil Federal concede um prazo de uma semana para buscarem uma solução definitiva."

989252645 = "A Curiosidade Matou o Gato..."#[?][Episódio: 06]
3030870987 = "Apesar do prazo de uma semana, uma sequência bizarra de pequenos azares começa a acontecer por onde Sammy passa, como se os tabus navais estivessem se cumprindo à risca. Enquanto a tensão e as superstições aumentam no navio, o Sensei tenta acudir Sumika, que tropeça no convés, e acaba travando as costas no processo."

83253996 = "Uma Espera Inquieta"#[?][Episódio: 07]
2355009320 = "Carregado até a enfermaria do navio, o Sensei é atendido por Sanae, a chefe médica. Durante a consulta, Sanae opina friamente que a briga toda sobre desembarcar Sammy não passa de puro egoísmo e comodismo das alunas. Nesse momento, a Presidente do Conselho Estudantil Federal aparece e leva o Sensei com ela para uma nova conversa com a Island."

1925103632 = "A Terceira Opção"#[?][Episódio: 08]
2863133021 = "Por ter adiado uma decisão difícil, Minato se martiriza, reconhecendo a própria fraqueza como capitã. Ao ver o sofrimento da garota, a Presidente do Conselho Estudantil Federal propõe usar sua própria 'autoridade' como pretexto para ordenar o desembarque de Sammy, livrando Minato do peso da culpa. Com o coração apertado, Minato aceita a proposta."

2186991648 = "Divisão de Papéis"#[?][Episódio: 09]
3964687291 = "Assim que a ordem de desembarque de Sammy se torna pública, toda a revolta das alunas se volta contra a Presidente do Conselho Estudantil Federal. No caminho de volta, a Presidente conversa a sós com o Sensei e confessa ter assumido o papel de vilã de propósito, na esperança de fazer as garotas da Odisseia pararem de seguir regras e dogmas cegamente."

2931575436 = "Pega-Pega a Bordo"#[?][Episódio: 10]
1914181232 = "No dia marcado para o desembarque, quando faltavam apenas os trâmites finais, Sammy desaparece misteriosamente. Uma perseguição alucinada toma conta do convés, mas as alunas conspiram para esconder o bichano. Ao finalmente encurralá-lo, Minato calcula mal o pulo e despenca no mar! Com todos paralisados pelo medo do tabu da água, o primeiro a agir para salvá-la é o próprio Sammy."

415566887 = "Mudança de Ideia"#[?][Episódio: 11]
895446679 = "Tocada pela atitude heroica de Sammy, Minato decide mudar de ideia e enfrentar as consequências. A Presidente do Conselho Estudantil Federal aceita a decisão com tranquilidade. O Colégio Odisseia decide, em consenso, acompanhar Sammy a bordo até o fim dos seus dias. Porém, naquela mesma noite, o Sensei recebe um chamado urgente de Sanae: a vida de Sammy está por um fio."

3695417333 = "Erguer os Remos"#[?][Episódio: 12]
2517938056 = "Com o estado de Sammy se deteriorando rápido, as alunas se desesperam diante do terrível tabu de 'um gato morrer a bordo de um navio'. Em meio ao caos e ao pavor coletivo, Minato toma sua decisão mais corajosa como capitã: desafiar os tabus. O melhor presente de despedida para Sammy é a paisagem que ele sempre amou — o mar aberto. Pelo sistema de som, Minato convoca toda a tripulação para zarpar."

1647764844 = "A Última Viagem"#[?][Episódio: 13]
2691008338 = "Tem início a derradeira viagem de Sammy. Sob o brilho dourado do sol nascente que doura a linha do horizonte, cercado pelo carinho e pelas lágrimas das pessoas que mais o amaram, o velho gato fecha seus olhos em paz pela última vez."

3094426154 = "O Peso de um Lugar Vazio"#[?][Episódio: 14]
174712929 = "Meio mês se passa, e a poeira aos poucos baixa na Odisseia após a despedida de Sammy. O Sensei testemunha o amadurecimento gradual das alunas, que agora navegam com o próprio discernimento. Sentindo que o colégio deu um passo firme em direção ao futuro, o Sensei se despede. No caminho de volta, a Presidente do Conselho Estudantil Federal o aborda... e revela uma verdade estarrecedora."

