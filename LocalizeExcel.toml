1685330631 = "Vol.0 Conselho Estudantil Federal"
3839113926 = "Como Administradora-Chefe do Conselho Estudantil Federal, Rin continua atolada de serviço até o pescoço. Será que essa folga forçada que empurraram pra ela vai render pelo menos um dia de paz......?"

#[+][Sinopse dos Capítulos]
3915905801 = "Num Dia de Primavera Onde Florescem as Amendoeiras"
789937573 = "Num dia de primavera florido de amendoeiras, alguém inesperado finalmente voltou. Mas numa forma que você jamais poderia imaginar."

