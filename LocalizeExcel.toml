3667920182 = "Train Bound for the Past"
714623568 = "A student from Private Hyacinth Academy, which was closed down and whose students transferred to other academies. While waiting for a train at the station, she reminisces about the past and encounters an express train \"bound for Private Hyacinth Academy\"—a line that should have been discontinued long ago."
4177125948 = "Fare Evasion"
3792136270 = "Sensei was traveling on a Highlander train. However, having lost their ticket, they are nearly thrown off the train during a ticket inspection. Just when all hope seems lost, Sensei is saved thanks to the FOX Platoon happening to be on board. Upon asking, Sensei learns that the FOX Platoon is heading to Kawanishi Station to investigate a train that shouldn't exist."
1542490081 = "A Train That Shouldn't Exist"
2261865012 = "Eyewitness reports have been coming in regarding a mysterious train. However, Momoka, the Traffic Department Director, dismisses them, stating that operating according to the testimonies is physically unlikely. Unable to mobilize Valkyrie due to jurisdictional issues, the General Student Council President asks Yukino to investigate."
3217051810 = "Spot Check"
1457234732 = "Kurumi and Otogi visit Kawanishi Station disguised as CCC executives to conduct interviews. However, the station staff finds the two suspiciously overly helpful compared to the usual CCC and grows suspicious. With some quick thinking from Otogi, they somehow manage to get through the situation."
745546688 = "The Ranks and the Execs"
1096681363 = "After finishing interviews with users, Kurumi and Otogi head to the station office. However, the station master of Kawanishi Station also finds the two suspiciously helpful compared to the usual CCC, casting suspicious glances their way. Once again, Otogi's quick thinking successfully covers for them. Afterward, they obtain testimony suggesting that the \"Profiteering Broker\" might be involved."
1050046740 = "An Unexpected Reunion"
3651589811 = "After staking out at night to intercept the problematic train, Kurumi and Otogi catch a cold. With Niko also out of commission, Yukino is forced to step up and conduct the interviews herself. Conducting the interviews with an unusual demeanor, Yukino happens to run into her underclassman, Miyako."
2967418712 = "The Fox and the Rabbit"
3976802473 = "Miyako is displeased that Yukino and the others didn't contact her after leaving the detention camp. However, Yukino explains it was necessary for their operation, and Miyako is tentatively convinced. Meanwhile, it turns out that Miyako was also investigating the same incident on a friend's request. Miyako shares her information with Yukino and introduces her client."
3700706023 = "Looking for a Friend"
3997188198 = "A student from Hyacinth Academy visits the FOX Platoon at Miyako's introduction. She shares the situation with the FOX Platoon, stating she saw a train pull into the platform that had no business being there. Guessing that the trigger for the train's appearance might be a student from Hyacinth Academy, the platoon agrees to gather again at night."
350050892 = "Express Train for Private Hyacinth Academy"
9593635 = "Recreating the situation experienced by Miyako's friend, a train that shouldn't exist finally pulls into the platform. With no passengers visible inside, the train gives off an eerie atmosphere. Undaunted, the FOX Platoon boards the train."
1050215819 = "Bullet Train (1)"
2220200859 = "The interior of the train is an infinite structure where no end is in sight, no matter how many cars they pass through. Changing their strategy, the FOX Platoon decides not to search for the enemy, but to draw them out instead. When they activate the emergency stop switch to signal an abnormal situation inside the train—a monkey-like animatronic conductor appears."
3332551061 = "Bullet Train (2)"
1056026822 = "They defeat what appears to be the conductor and engage the brakes, but for some reason, the train doesn't stop and instead keeps accelerating. The FOX Platoon has no choice but to destroy the engine mechanism to bring the train to a forced stop. Shaken by the impact, the group is thrown out of the train along with other passengers. Seeing red spider lilies blooming near the tracks, the FOX Platoon reflects on the students' memories."
1604545363 = "Ekiben"
2949529384 = "This time, Sensei boards a train with the \"wrong ticket.\" Just as they are about to be thrown out of the train yet again, Miyako, who happens to be there, throws them a lifeline. Saved in the nick of time, Sensei ends up sitting next to Miyako. The two share idle chatter, but the topic eventually shifts to SRT, and Miyako opens up about Yukino's past."
