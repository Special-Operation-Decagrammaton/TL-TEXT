2210067228 = "Vol. 1 Fire and Shadow Chapter"
4116035908 = "The Chairman's Magnificent Summer"
3200421019 = "Makoto learns that Gehenna students are starting to forget not just the Pandemonium Society, but even her. To command awe, she decides to change her image and prepares a swimsuit. While consulting on how to make her swimsuit look natural, Makoto confesses she's bad at swimming. To figure out how to get people to notice her swimsuit naturally without swimming, she consults Sensei."
4205255274 = "The Flustered Chairman's Summer"
3624659385 = "Makoto decides to debut as a swimsuit model. Meanwhile, Sensei mediates a dispute between the Prefect Team and the Pandemonium Society, but seeing that, Makoto feels conflicted."
1438650316 = "The Shy Chairman's Summer"
3239871215 = "Makoto has been avoiding Sensei. However, they face each other again at the school pool, and she honestly confesses the feelings she's realized."
2635540075 = "The Perfect Chairman's Summer"
4287275201 = "Makoto shows off her perfect self at a swimsuit photoshoot. She says Sensei will surely notice her perfection someday and wishes for him to stay by her side forever."
685871196 = "Satsuki's Safety Measures"
487370655 = "Sensei meets Satsuki at the beach and receives thorough safety measures, from being slathered in sunscreen to having his playtime managed. Once Satsuki finishes her explanation, Sensei applies sunscreen to her, and they spend time watching the sea under a parasol."
439246109 = "Satsuki's Sea Measures"
2404183346 = "Satsuki, fearing the sea and avoiding waves, trains to stay safe. Encouraged by Sensei, she steps into the shallows for the first time and gradually gets used to the sea. After learning how fun the sea is, she continues to maintain her safety awareness."
2187272134 = "Satsuki's Pain Measures"
3738602266 = "Satsuki, initially afraid of the sea, has finally gotten used to splashing water with Sensei. However, she mistakes seaweed for tentacles and a plastic bag for a jellyfish. After losing her footing, she clings to Sensei for a while."
3323625327 = "Satsuki's Gaze Measures"
3500781959 = "Satsuki and Sensei move to a busier beach. They get caught up in problems on the sand, which Sensei solves one after another. By the time they notice, it's evening. Satsuki is torn between liking that Sensei can't ignore problems and wanting him to look only at her. She asks Sensei to look only at her, promising to check the safety of their surroundings herself."
4252501786 = "Kyogoku Satsuki"
613672079 = "Satsuki walks the night beach with Sensei. She realizes that even though she hates dark places, she doesn't mind it at all in this moment. She realizes the reason she isn't afraid of the dark is because Sensei is by her side."
3283459532 = "When the Vacation Begins..."
316385823 = "Sensei heads to the beach after being invited by Chiaki to write an article together. They enter a food stall rumored to be a rip-off. However, the owner, realizing Chiaki is a reporter for the Weekly Pandemonium, provides service regardless of profit. Impressed, Chiaki writes a big article about it, but because of the continued recklessness, the shop goes out of business before long."
4103963358 = "According to a Certain Secretary"
2044523053 = "Sensei heads to the beach with Chiaki to chase a scoop. They get a big story, but Chiaki forgets her paper notepad and can't record it. After worrying, she realizes she can write it on the sand. However, a big wave washes away the notes she worked so hard to write."
1989992924 = "According to Recent Investigations"
1236249763 = "Chiaki is down due to a lack of scoops. She finds things that look like scoops to Sensei to be boring by Gehenna standards. What she encounters at the beach is an incredible scoop."
2149469591 = "NC, ND."
2069910016 = "Chiaki starts finishing her manuscript with Sensei. She wants exciting material from Sensei, but he's tough and doesn't give her any scoops. Realizing that if there isn't one, she should make one, she comes up with a novel idea. Chiaki locks Sensei inside a desk."
1281609261 = "Ausflug and an Elegant Summer Vacation"
1167915423 = "Iroha comes to Sensei's office, saying she won a vacation. Seeing her reading and lazing around as usual without any sense of the season, Sensei blurts out, 'Why don't you spend it more like summer?' Hearing this, Iroha changes into the swimsuit she brought for some reason and resumes reading."
2444307689 = "Ausflug and a Special Summer Vacation"
3234070202 = "Iroha was brought to the beach while driving Toramaru as Sensei asked. She only read books at the beach and visited shops, but in the end, she sat next to Sensei under a parasol and read."
4103184573 = "Ausflug and the End of Summer Vacation"
3787449724 = "Iroha invites Sensei on an escape and takes him to a quiet rural town by the sea. They walk through markets, cafes, and the beach as they please. As the sun sets, they walk on the sand dyed crimson. She reveals today is the last day of summer vacation and invites him to run away somewhere far together someday."
3091035621 = "Ausflug and a Summer Patrol?"
2147745274 = "While patrolling in Toramaru, Iroha is called out by Sensei. Hesitating, she tells Sensei to come inside the tank. When Sensei enters, Iroha is in a swimsuit for some reason. She makes excuses, saying the AC is broken and it's hot, and she was patrolling in a swimsuit because no one would see her. She tries to go slack off at the beach with Sensei on board."
159171374 = "Vacation with Ibuki!"
3087532465 = "Sensei and Ibuki visit the beach to play, but they fall asleep as soon as they arrive due to exhaustion. Seeing Sensei moving the parasol repeatedly to avoid the sun, Ibuki guides him to the shade of a palm tree to rest."
739228984 = "Class with Ibuki!"
1008969371 = "Ibuki opens a sea creature lecture with Sensei as her student. She introduces creatures according to the location, starting from rocks to the shoreline and shallows. However, a blue jellyfish with poisonous tentacles drifts toward Ibuki. Scared, Ibuki clings to Sensei and doesn't let go for a while even after getting out of the sea."
3506753372 = "Food with Ibuki!"
4087976993 = "The two enjoy eating their way through the summer-only beach stalls. On the way, a seagull steals what Sensei was eating, but Ibuki, who got extras at every stall, shares with Sensei. They eat happily, filling both their stomachs and hearts."
1004419525 = "Together with Ibuki."
501030319 = "Ibuki collects seashells and glass shards to draw. Sensei buys a rake to help her collect them efficiently, but when they use it, they also pull up a lot of drifting trash. Seeing Ibuki laugh and say, 'This will clean the sea!', Sensei is moved. In the end, they collected 5 bags of trash."
787760397 = "Set Sail! Pandemonium Ship: Chairman Makoto's Magnificent Summer Retreat"
3356056017 = "Sensei was invited to the Pandemonium Society's luxury cruise... or so he thought. No one knows yet that it's the beginning of a drifting life..."
95147835 = "Cast Girl Away"
46813507 = "Romantic Cruising"
1750647567 = "Girl's Drifting Chronicle"
3577930395 = "The Reason I'm Here, and the Ship Must Depart"
2390684382 = "Geistership"
2223863621 = "Society of the Dead Devils"
2277211176 = "Pandemonium of the Caribbean"
3799061615 = "Fools in August"
1417165498 = "Life of Bis-Maru (1)"
