3664619223 = "The \"Nightmare Train\" is an imaginary train that appears during quiet hours. Carrying passengers who hold a deep nostalgia for the past, this train never reaches its destination, trapping its passengers in a carriage that runs for eternity. Inside, you cannot find other passengers, nor even a trace that passengers were ever there. However, if the train's riding rules are violated, conductors may appear. Witnesses describe their appearances in myriad ways—perhaps they change their form according to each person's memories."
