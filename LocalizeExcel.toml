#[+][Resumos dos Episódios]
#[-][Capitulo 1]
4128684242 = "A Folga da Administradora-Chefe (1)"#[?][Episódio: 01]
3255574769 = "As diretoras do Conselho Estudantil Federal armam um complô para forçar Rin a descansar do trabalho acumulado. Apesar de Rin bater o pé dizendo que não tem tempo a perder, Aoi e as outras já tinham cuidado de tudo antes. Sem saída, Rin aceita tirar uma folga relâmpago, e o Sensei é escalado como o fiscal oficial do descanso dela."

274943668 = "A Folga da Administradora-Chefe (2)"#[?][Episódio: 02]
1711221830 = "O Sensei leva Rin para passear por D.U. e curtir o dia de folga. Só que Rin não consegue se desligar do serviço e puxa assunto sobre o Conselho a todo momento. Numa tentativa desesperada de mudar de assunto, o Sensei a leva para um fliperama. Rin diz que nunca jogou na vida, mas pega o jeito num piscar de olhos e dá uma surra no Sensei. A jogatina faz Rin se lembrar de uma velha conhecida que não vê há tempos."

182317656 = "O Gambito da Rainha"#[?][Episódio: 03]
1354224060 = "Rin e o Sensei vão até o Centro Correcional para visitar a detenta Kaya. Encontrando-a com a mesma pose de sempre, Rin a desafia para uma partida de xadrez. Enquanto jogam, elas relembram o golpe de estado, e Kaya conta sobre o \"Cajado de Amendoeira\" que afanou da Schale na época. Para Kaya, aquilo não passava de um smartwatch inútil, mas os registros da antiga Presidente diziam que o aparelho tinha o poder de enxergar a verdade."

1861570067 = "Nostalgia Azul-Celeste"#[?][Episódio: 04]
2238102298 = "Após a visita a Kaya, Rin volta ao Conselho e encontra o \"Cajado de Amendoeira\" guardado no depósito. Dentro de um relicário, parecia só um smartwatch qualquer, mas assim que Rin o toca, um pequeno milagre acontece. Ao recobrar a consciência com alguém chamando seu nome, ela dá de cara com uma garota loira afirmando ser a Presidente do Conselho Estudantil Federal."

1121617851 = "Falha na Memória"#[?][Episódio: 05]
3900724871 = "Ao acordar, Rin se depara com uma garota desconhecida afirmando com todas as letras ser a Presidente do Conselho. Rin acha que é pegadinha, mas fica boquiaberta ao ver que todas as diretoras estão tratando a garota como a verdadeira líder. Com a memória da verdadeira Presidente apagada do mundo todo, Rin corre para pedir socorro ao Sensei. Por sorte, o Sensei é o único que também percebe que aquela garota é uma impostora."

3528020198 = "O Retorno da Prodígio"#[?][Episódio: 06]
3251654458 = "A suposta Presidente e o Sensei admitem que não se conhecem. Rin tenta questionar onde ela esteve durante todo o sumiço, mas a garota desconversa dizendo que suas memórias estão confusas. O impasse continua e o Sensei decide observar a situação. Em pouco tempo, a falsa Presidente demonstra uma competência assustadora, resolvendo as crises de Kivotos uma atrás da outra. Um clima de alívio e comemoração pelo retorno da líder começa a tomar conta de todos."

4150457986 = "Emparelhamento"#[?][Episódio: 07]
3940272632 = "Ao sair do prédio do Conselho, o Sensei é abordado por Plana, que garante que a garota é uma farsa, já que sequer conseguia ver Arona e Plana. Buscando uma saída para a crise, Arona e Plana tentam emparelhar a Arca de Shittim com o \"Cajado de Amendoeira\", liberando novas funções no sistema. Nesse momento, Plana detecta que estão sendo seguidos. Ao olhar para trás, o Sensei vê que Rin vinha logo atrás deles."

562672561 = "Ilusões e Deduções"#[?][Episódio: 08]
1001704649 = "Rin e o Sensei saem pelas ruas atrás de alguém que ainda se lembre da verdadeira Presidente do Conselho. Eles interrogam várias pessoas, mas ninguém tem a menor lembrança dela. Quando a esperança parecia perdida, um encontro por acaso com Mai traz uma pista de ouro."

4291342361 = "Boa Noite, Sr. Orwell"#[?][Episódio: 09]
2194592478 = "Rin e o Sensei vão até um bar decadente e encontram ninguém menos que Decalcomanie. Com uma nova cabeça pensante, ele relembra tudo o que a Gemátria tentou fazer e discursa que a \"mídia\" é o verdadeiro poder que dita o mundo na nova era. Ao final da conversa, a nova cabeça se apresenta como Orwell."

68071874 = "Baile de Máscaras"#[?][Episódio: 10]
2049815982 = "Orwell sugere que a mídia pode ser a ferramenta perfeita para resolver a anomalia que tomou conta de Kivotos. A promessa de que a mídia pode revelar quem é real ou falso deixa o Sensei com a pulga atrás da orelha, mas sem nenhuma outra pista em mãos, ele resolve dar uma chance à proposta de Orwell."

