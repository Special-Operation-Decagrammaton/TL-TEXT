3774576463 = "Ex. Caça às Lendas Urbanas"
561204670 = "Fenômenos anômalos de origem desconhecida, conhecidos como 'Lendas Urbanas', começaram a se manifestar por todos os cantos de Kivotos. Será o Esquadrão FOX capaz de resgatar as alunas desaparecidas e restaurar o cotidiano que lhes foi roubado?"

#[+][Sinopse dos Capítulos]
2425389763 = "Miragem ao Meio-Dia"
1157145156 = "Em dias de calor escaldante, onde o ar tremula em miragens, redobre a atenção nas ruas! Mesmo que aviste um 'espantalho branco' no meio do asfalto, jamais fique encarando."

3065626693 = "O Que Espreita nos Tambores de Óleo"
237435633 = "A lenda urbana de um caranguejo colossal capaz de devorar qualquer coisa. Se você ouvir o eco metálico de tambores de óleo rolando na escuridão da noite acompanhado pelo estalar de pinças afiadas... corra sem olhar para trás."

