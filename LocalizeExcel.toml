804603942 = "In Limited Dash Recruitment, you can obtain 100 Elephs for the student set as the rate-up target as a first-time bonus.\n(This first-time bonus can only be obtained once during the recruitment period. After obtaining the bonus, you cannot obtain 100 Elephs even if you change the rate-up target.)"
827861865 = "Limited Dash Points are different from Recruitment Points and Archive Points; points earned in other recruitments do not accumulate.\nPlease note that Limited Dash Recruitment is a limited-time event."
