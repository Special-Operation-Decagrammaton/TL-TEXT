3141468330 = "Gregorius's damage taken changes based on the number of debuffs applied.\nYou can check the number of debuffs on the icon to the right of the HP bar.\nAttacking when the icon is green will deal the most damage."
3201704943 = "When Gregorius is debuffed, the same effect is replicated on the Choir.\nAlso, damage dealt to the Choir is transferred to Gregorius.\nTry applying debuffs to Gregorius and using area attacks on the enemies."
2842532800 = "The Pipe Organ alternates between skills that apply debuffs and skills that remove them.\nAim at Gregorius when the debuff-applying skill activates,\nand aim at your allies when the debuff-removing skill activates.\n\nAttack the Pipe Organ with an EX Skill to reduce its HP to 0 and change its orientation."
