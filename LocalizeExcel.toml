1221590577 = "Value Found Only There"
594085898 = "Breaching (1)"
3866007255 = "Breaching (2)"
1150636869 = "Barnacles, Big and Small"
3788559044 = "The Girl's Beach Flute"
3909686954 = "Visiting Odyssey, Sensei spots a girl playing a refreshing flute tune by the water's surface, but she runs away before they can call out to her. When asked about the student, Minato and Ami reply that she must be a student from the Diving Club, a high-risk group. Sensei decides to communicate with the Diving Club."
1976371281 = "Sardine Ice Cream"
3223223283 = "Visiting Odyssey's commercial district, which was pointed out as the Diving Club's hangout, Sensei meets Sayuri and Makina. Though initially suspicious, Sensei succeeds in winning them over with ice cream. However, right as the topic of the \"Diving Club\" comes up, Trident inconveniently interrupts, and Sayuri and Makina run off."
1307571401 = "The Girl with Poor Eyesight"
1500223721 = "Chasing after Sayuri and Makina, Sensei accidentally bumps into a girl wearing a headset due to a lack of attention ahead. Kotone is suspicious of Sensei claiming to be looking for the Diving Club, but Kokoro joins the conversation midway to smooth things over—or so it seems, until Kokoro takes one look at Sensei and becomes wary of them as a \"peeping Tom\"."
2449328209 = "Specialty Kelp Tea"
2068229808 = "After the misunderstanding is cleared up, Sensei is treated to some kelp tea. While chatting over tea, the Diving Club members confide in Sensei about their financial troubles. Sensei then offers to become the Diving Club's sponsor and suggests giving them some work in return."
1603038281 = "Dangerous Barnacles"
3966383488 = "Through Sensei's mediation, the Diving Club takes on the job of removing barnacles attached to the ship's hull. Trying to increase work efficiency, Sayuri and Makina use grinders instead of the designated scrapers. As a result, something explodes while they are working on the hull, causing an accident that punches a hole in the ship."
2745376954 = "Damages"
75102599 = "Far from improving their financial situation, the Diving Club is held responsible for the accident, adding damages and saddling them with massive debt. Since the damages are billed to the \"Club\", Minato suggests that disbanding the club would effectively wipe the slate clean. Leaving the answer pending, a suspicious student approaches Kokoro and the others as they are at their wits' end."
1198231585 = "Stowaway"
3344396155 = "To overcome the crisis of disbandment, the Diving Club decides to take on a request from a suspicious student. Though harboring anxieties, the group heads to the blue hole indicated on the map, but along the way, they discover an unintended passenger on board. Sensei, who had been taking a nap in a cabin without permission, ends up joining this adventure by chance. Little do they know what dark shadows are moving behind the scenes..."
1764096436 = "Blue Hole"
329886798 = "Arriving at the blue hole, the Diving Club begins their dive. However, a pod of whales blocks their path, and Sayuri and Makina surface early. Next, while Kokoro and Kotone are diving, Sensei chats with Makina about what Sensei's role is. Suddenly, a fleet led by the notorious \"Jiao Long of the Tides\" appears and takes Sensei hostage."
415217445 = "Jiao Long of the Tides"
3259719005 = "Nanami possessed extraordinary navigation skills, to the point of being considered the next captain of the Island. However, due to her ideology, she was sent to the Correction Bureau, and the fleet fell apart in the past. To fund the reconstruction of the \"Ryugu\", Nanami extorts the Diving Club to retrieve ambergris from the ocean floor. When Kokoro hesitates on the grounds of lacking equipment, the group is left tied up."
3599122265 = "Value Found Only There"
3707980455 = "Though it goes against her convictions as a diver, Kokoro chooses to submit to Nanami, deciding that nothing is more important than Sensei's safety. However, encouraged by Sensei, she resolves to fight back. The group begins searching for a breakthrough to counter them, and Kotone comes up with a way to enlist her \"friend's\" cooperation."
772854751 = "Breaching (1)"
691815538 = "Returning with the equipment Kokoro complained was lacking, Nanami once again threatens the Diving Club to dive to the ocean floor. However, Kokoro refuses and guides a whales to rock the ship violently. The impact of the huge wave generated throws Sensei and the Diving Club into the sea. Drifting in the ocean, Kokoro hands her octopus to Sensei and prepares for battle."
1265355110 = "Breaching (2)"
243643129 = "Having no answers against the Diving Club swimming freely through the sea, Nanami declares surrender. Kokoro warns Nanami that harming Sensei again will not go unpunished. After Nanami retreats, the group, having lost their boat in the aftermath of the battle, drift in the sea hugging each other until help arrives."
3903645147 = "Barnacles, Big and Small"
3782928219 = "To pay off their debt, the Diving Club once again works hard on removing barnacles from the ship's bottom. Visiting the work site, Ami expresses her gratitude to Kokoro for protecting Sensei and defeating the \"Jiao Long of the Tides\". Afterwards, Sensei joins them after buying refreshments, and everyone shares ice cream together."
