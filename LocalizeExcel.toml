3267483309 = "Twilight's Haughty Triumvirate (2)"
3205956272 = "Invincible Armor-Piercing of the Ice-Free Port (1)"
1759210737 = "Invincible Armor-Piercing of the Ice-Free Port (2)"
3070106301 = "Mesudeku, Projection of a Daydream Turning into Foam"
599811565 = "Cast Girl Away"
574577555 = "Sensei receives a video message from the Pandemonium Society. It's an invitation to a luxury cruise. Sensei decides to participate. It was supposed to be an elegant trip, but... before he knew it, 7 days had passed since the group started drifting."
1186535370 = "Romantic Cruising"
452291351 = "What awaited the group that arrived at the port in high spirits was not a luxury cruise ship, but an old small boat. It was the result of Makoto contracting based only on price. Furthermore, they hear rumors of a ghost ship from a fisherman, but Makoto ignores it and decides to set sail. Once they get out to sea, it seems to go smoothly, but the engine breaks down in the middle of the ocean, and the ship stops moving."
1970933749 = "Girl's Drifting Chronicle"
467099822 = "The engine failure marks the beginning of an endless drifting life. Communication devices don't work, but Makoto is optimistic, thinking someone will come to help before their 1-week supply runs out. However, time flows mercilessly, and as days pass without any sign of help, only Iroha grows increasingly anxious."
3382519070 = "The Reason I'm Here, and the Ship Must Depart"
3633066522 = "The 6th day of drifting arrives without improvement. Iroha finally explodes at a word from Makoto, who refuses to lose her carefree attitude. That becomes a turning point, and the ship's situation, which had been maintained by Iroha's efforts, deteriorates rapidly. As Iroha begins to wonder why she belongs to the Pandemonium Society, a ghost ship appears, adding to the situation."
2635569648 = "Geistership"
736612902 = "Makoto, braver than usual, decides to infiltrate the mysterious galleon without listening to anyone. The group, following her, boards the galleon and encounters pirate ghosts on the deck. They try to escape from the pirates appearing one after another, but the floor collapses and they are separated."
1764056783 = "Society of the Dead Devils"
672366034 = "Satsuki and the others look for clues where they fell. Satsuki's appearance as she investigates steadily despite being scared is a seriousness Chiaki didn't know. Organizing the gathered information, it emerges that this ship might originate from Gehenna hundreds of years ago."
2764933449 = "Pandemonium of the Caribbean"
3649124551 = "Before she knew it, Makoto had gathered the pirates and become their captain. Commanding the pirates with spirit and charisma, she names the galleon 'Bis-Maru' and loudly declares the conquest of Kivotos. The group's drifting ends, and a journey across the vast ocean seems to begin, but suddenly, the Odyssey Maritime High School Prefect Team—Trident—launches an attack."
3055741969 = "Fools in August"
3735532875 = "A 'Trident' lookout on the Harpyia discovers a ship not on radar at close range. A ghost ship that doesn't respond to radio and ignores light warnings. Sumika, aiming for achievement, orders an attack to subdue the pirates. On the other side, Makoto and the others unite and begin to counterattack."
1933432205 = "Life of Bis-Maru (1)"
1351846767 = "The Pandemonium ship's crew has old equipment and low proficiency. However, thanks to the ballistic table Ibuki calculated on the spot, the cannon's accuracy improves significantly. And as if responding to Makoto's spirit, the Pandemonium ship group stands up to intercept. Trident, caught in an unexpected counterattack, is thrown into disarray and attempts to ram them with their ship."
4046021370 = "Life of Bis-Maru (2)"
2928006900 = "Makoto and the others repel Trident as they ram and board. In the momentum, they succeed in pushing Trident back to the Harpyia. However, before they can rejoice, Trident's main force arrives, and before the overwhelming and merciless naval bombardment, Bis-Maru sinks to the bottom of the sea without a way to resist. In that instant, the one who saved Makoto, who was about to be thrown into the sea, was Iroha, who should have been fighting with her."
2222224926 = "Saltwater Dreams"
724039273 = "Rescued by Trident, the Pandemonium Society's misunderstanding is cleared. However, strangely, the pirates and Bis-Maru have disappeared like smoke. Summarizing the outcome, Satsuki talks about the former Gehenna Ocean Academy sinking accident, suggesting the possibility that Bis-Maru was a real ghost ship. Meanwhile, Iroha and Makoto reconcile thanks to Ibuki."
2984281256 = "Romantic Cruising (Real)"
2837841855 = "As an apology for attacking them, mistaking them for pirates, the Pandemonium Society receives hospitality from Odyssey. Although different from the original plan, the 'real' cruise trip finally begins."
1224711387 = "Pirates, Ninjas, and Pandemonium"
2313542306 = "Ibuki, completely obsessed with pirates, proposes a new concept: 'Ninja Pirate Pandemonium.' While Makoto and Ibuki play, Iroha secretly apologizes to Chiaki."
2162573193 = "Dream Battleship"
3920086545 = "After everything is over, Makoto gifts a state-of-the-art ship to the fisherman as an apology for the small boat they sank. While being thanked by the fisherman, Makoto thinks of Bis-Maru. Fascinated by naval warfare through the battle with Trident, Makoto harbors a new ambition: building Bis-Maru No. 2."
2035061192 = "The Sea's Lively Messenger"
4007127749 = "Sumika visits Gehenna as an apology envoy from Odyssey. Sumika, who didn't hear the name, starts searching for Makoto with the clue 'a silver-haired person who looks strong.' As she is guided, the person Sumika meets after climbing Mount Hinomu is Hina."
2942384744 = "Day of the Lobster"
3296040630 = "Finally the 0th day since the group started drifting. Even for Pandemonium Society members, their limits were approaching. Just when it seemed like it was the end, they land on an uninhabited island Ibuki discovered. Makoto, who saw the fighting spirit of a fighter in the hermit crab she found on the island, names it 'Tiger Shark-Maru'."
4068886041 = "Poor Caravan Following the Beach (1)"
4269663733 = "Before Makoto, who is happy about meeting 'Tiger Shark-Maru,' the Abydos Countermeasures Committee suddenly appears. With tit-for-tat, the Pandemonium Society group decides to compete in a 'Crab Fight' without even knowing the rules. At Nonomi's signal, the battle between Iroha and Ayane begins."
1885748433 = "Poor Caravan Following the Beach (2)"
3994601186 = "Iroha wins, and the group learns that the World's Greatest Crab Martial Arts Tournament is being held on this island right now, where 'the team that collects 5 stars the fastest wins.' Hearing that the prize is the 'Queen's Anything Ticket' that grants any wish, Makoto loudly declares she aims to win."
3164504076 = "Busy, No-Holiday Mad Dog (1)"
4067185913 = "The group exploring the island is called out by Kanna and Konoka of the Public Safety Bureau. They are challenged to a duel, saying they are rumored for defeating the Countermeasures Committee, which was a favorite to win."
3124498706 = "Busy, No-Holiday Mad Dog (2)"
4289614980 = "Chiaki and her partner Black Dolly win after a fierce battle. Kanna warns the group that they have attracted even more attention due to this winning streak. However, Makoto doesn't care and is instead fired up, seeing it as an opportunity to show the excellence of the Pandemonium Society."
3614356968 = "Acrobatics Where Light and Shadow Cross (1)"
1443103477 = "Taking advantage of Makoto's absence, Niya of the Yin-Yang Club challenges Satsuki to a 'Crab Duel.' Satsuki, who has no interest in Crab Fights, tries to hand over a star without fighting, but Ibuki stops her, saying Makoto will be sad if they lose stars. Satsuki, realizing that the moment Makoto was absent was precisely targeted, accepts the challenge, thinking she cannot remain defeated in an information war."
3292993986 = "Acrobatics Where Light and Shadow Cross (2)"
2910015494 = "Satsuki, who fought back with pride as an intelligence officer, brilliantly defeats Chise's crab. When Makoto returns and immediately grasps the situation, Niya reconsiders her perception of Makoto."
2599035953 = "Twilight's Haughty Triumvirate (1)"
4190193347 = "Before the Pandemonium Society, which is steadily accumulating wins, a strange-looking Tea Party stands in their way. To Makoto, who protests that 3 vs 1 is cowardly, Nagisa introduces one player as her trump card. The battle between Hifumi, who was suddenly brought here and doesn't seem to understand the situation, and Makoto begins."
3204464467 = "Twilight's Haughty Triumvirate (2)"
3284342036 = "The Pandemonium Society wins against Hifumi. With this, only 1 star remains until victory, but now that they have defeated Trinity, they cannot imagine who the final enemy is."
1436369757 = "Invincible Armor-Piercing of the Ice-Free Port (1)"
3168436421 = "Standing as the final opponent is Cherino of Red Winter Federal Academy and the giant crab 'Purge-kun No. 2.' Tiger Shark-Maru is frightened by its overwhelming physique. Just when it seemed like all was lost, Ibuki's talent as a Crab Fighter blooms, and she stands up together with Crab-Crab-san."
106858870 = "Invincible Armor-Piercing of the Ice-Free Port (2)"
1951598584 = "Collecting 5 stars, Makoto finally gets the 'Queen's Anything Ticket.' Wishing for world conquest, the wish doesn't come true—Makoto's consciousness is pulled back to reality. It was all a fleeting dream. Reality was in the middle of drifting. At the same time, Hoshino, who woke up, gets scolded by Serika, but she wears a somewhat happy expression."
3470148017 = "Mesudeku, Projection of a Daydream Turning into Foam"
3280163468 = "In a daydream, the former Kaiser PMC director appears before Sensei. Following him is a giant collection of nightmares. He asks Sensei what he finds in the fleeting dream."
1310881861 = "The luxury cruise trip has finally begun. Sensei patrols the ship and watches over the Pandemonium Society members enjoying themselves."
878718668 = "Ibuki, obsessed with playing pirates, reaches a genius conclusion."
3444594496 = "The Pandemonium Society group visits the port to compensate for the ship they sank. Makoto, awakened to the romance of surface ships, thinks of a super-giant battleship."
436985890 = "Sumika is dispatched to Gehenna Academy to clean up the aftermath of the commotion. Her role as a diplomatic envoy should have ended easily...?"
1567989824 = "A wind of reform, bringing order to the freedom and chaos of Gehenna Academy, begins to blow. Where will its journey ultimately lead...?"
2468589893 = "Make Gehenna Great Again!"
947752189 = "The \"Gehenna Restoration Committee\" was established to restore the order of the past to the chaotic Gehenna Academy. Will their heartfelt wishes bear fruit?"
4248973689 = "Gehenna is Peaceful Today Too"
