#[+][Resumos dos Episódios]
1243927570 = "Nascimento"#[?][Episódio: 01]
1589381619 = "De olho na teletela de um bar decadente, Decalcomanie tem uma epifania durante uma conversa inusitada."

3168557994 = "A Carta da Presidente"#[?][Episódio: 02]
4191685078 = "Com a ajuda das diretoras, Rin se desdobra para dar conta das obrigações como Presidente Interina do Conselho Estudantil Federal. Enquanto lembrava da antiga Presidente, ela se recorda de uma certa carta. Dentro do envelope, havia fotos do dia a dia do Conselho. Porém, uma única foto em preto e branco trazia um cenário que nem a própria Rin jamais tinha visto."

3623875494 = "Sonho Estranho"#[?][Episódio: 03]
1715689698 = "Quando o Sensei acorda na Schale, a anomalia já estava acontecendo. Nem sinal de nenhuma aluna, e Kivotos inteira havia perdido as cores, mergulhada num preto e branco sombrio. Ao chegar ao gabinete da Presidente do Conselho, o Sensei dá de cara com uma garota de aura misteriosa. Mas antes que pudesse descobrir quem ela era, um bipe eletrônico o traz de volta à realidade, dando início a mais um novo dia."

1888812381 = "O Trapezoedro Reluzente"#[?][Episódio: 04]
4098329356 = "Durante uma missão em alto-mar, as garotas encontram um fragmento de vidro que emite um brilho pra lá de estranho."

