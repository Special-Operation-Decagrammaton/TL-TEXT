927130613 = "[Notice] Regarding Illegal Dumping on Shonzaki Beach\nRecently, there has been an increase in the illegal dumping of household garbage and waste around Shonzaki Beach.\nIllegal dumping of garbage is strictly prohibited by ordinance, and violators may be subject to fines if discovered.\nWe ask for your understanding and cooperation to protect our beautiful marine environment."
1247745885 = "Come to think of it, a lot of things have been washing up on the beach lately. Maybe I should go clean up while treasure hunting. Might even find some ambergris lying around."
1249306913 = "Treasure washed up from the sea... sounds romantic. Though sometimes there are orbs giving off a weird glow, you'd better not pick those up. You might get cursed."
1817694323 = "Don't suddenly say scary things like that. Are you trying to scare me so you can keep all the loot to yourself?"
1550336337 = "Did everyone hear? The Odyssey fleet is coming back to D.U. by order of the General Student Council President! I've never seen an Odyssey ship before, so I'm super excited!"
1293516 = "Has it been like half a year? Wait, why does Odyssey go on months-long voyages with the whole school?"
779974372 = "Well, to learn navigation skills, obviously. Getting used to handling a ship reportedly takes months. It even says so on Odyssey's official website."
768811170 = "That's obviously just a cover story. From what I heard from someone in the know, they go on voyages to sacrifice students to \"something\" in the deep sea."
1825008407 = "Sacrifices these days... just because it's an urban legend instance, you're taking it way too far. Be careful not to get sued~"
1652459134 = "Ah, I finally have reception! I couldn't get full link for ages, I thought I was gonna go through withdrawal! Time to read my backlog of posts today!"
3310578423 = "...The General Student Council President is missing?! Eh, what happened while I was gone...?"
1900246665 = "That's right."
4257673849 = "Speaking of Odyssey, their curry is also famous! Ah, I wanna eat the curry I had at Odyssey before again... Does anyone have any recommended secret ingredients to put in curry? Tell me one each."
52365041 = "Pineapple. Put it in thinking you've been tricked. The tropical sweetness goes great with the spicy curry spices."
162930521 = "Bacon... is that too boring?"
1840609906 = "Chocolate."
2822929676 = "Tanaka."
104473537 = "You replied to the wrong person~"
586436606 = "This afternoon, when I got close to give Sammy a snack, he made this face... What kind of expression is he making? Was he startled?"
1337068821 = "I bet he was startled looking at your face."
4275241088 = "Lame."
256267890 = "Hey, are there any Odyssey students in this instance? Ever since Schale's Sensei went to Odyssey yesterday, they've been walking around with their back bent the whole time... What did you do to Sensei?"
2318461340 = "Sensei is at fault. Acting so kind to just anyone like that..."
1956303792 = "Seriously, what did you do!?"
