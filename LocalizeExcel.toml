#[+][Resumos dos Episódios]
#[-][Capítulo 1]
3765673841 = "Mais um Dia de Paz em Gehenna"#[?][Episódio: 01]
314611152 = "Enquanto o Comitê de Disciplina tentava enquadrar baderneiras como sempre faz, Makoto passa por ali e resolve meter o bedelho, também como sempre faz. O clima esquenta entre a Sociedade Pandemônio e a Disciplina em plena rua, até que um trio misterioso aparece e se enfia no meio da confusão."

2404467793 = "O Comitê de Restauração de Gehenna"#[?][Episódio: 02]
280731846 = "O trio se apresenta como o Comitê de Restauração de Gehenna. A líder Mayumi não engole desaforo e solta o verbo na cara de Makoto: \"A Gehenna de hoje não tem nada de grandiosa!\". Depois de ouvir os dois lados, Mayumi promete unir Gehenna com as próprias mãos para fazer a escola voltar aos seus dias de glória."

1622727060 = "Gehenna Grande de Novo!"#[?][Episódio: 03]
3973550309 = "O Comitê de Restauração começa a trabalhar de formiguinha, direto na base. Mas as coisas não andam nada fáceis, e elas logo descobrem que tirar os ideais do papel é pedreira pura. Shoko, o cérebro do grupo, sugere que precisam de um \"símbolo\" de respeito para dar autoridade à causa... e ela já tem um alvo perfeito em mente."

1641190660 = "Gehenna Grande de Novo......!"#[?][Episódio: 04]
2210742662 = "Ao entrarem em contato com o Sensei, as meninas do Comitê de Restauração abrem o coração com paixão sobre o que sentem por Gehenna. Elas querem resgatar a era de ouro da escola, quando todos seguiam as regras e reinava a disciplina. Tocado pela sinceridade delas, o Sensei promete dar uma força, e Mayumi já parte para a ação."

4254754102 = "Gehenna Grande de Novo......?"#[?][Episódio: 05]
2990294971 = "Enquanto Shoko explica os pormenores do plano, Mayumi discursa sobre a sua visão de uma Gehenna grandiosa. O primeiro passo é abrir a Área do Gatilho Livre: um espaço onde a galera pode atirar e causar à vontade sem ser perseguida pela Disciplina. O único detalhe é que abriram o lugar na surdina, sem autorização nenhuma, e agora vão ter que correr atrás do aval da Sociedade Pandemônio."

3499418034 = "Negociações"#[?][Episódio: 06]
3711191844 = "O Comitê de Restauração bate ponto na Sociedade Pandemônio para tentar legalizar a atividade. Com a lábia afiada de Shoko e uma mãozinha camarada do Sensei, elas conseguem dobrar Makoto. Logo em seguida, vão até Hina na Disciplina para explicar o projeto e garantir que ninguém interfira. Assim, conseguem a bênção dos dois lados mais poderosos de Gehenna."

585418668 = "Karen"#[?][Episódio: 07]
3523112257 = "Fora dos limites de Gehenna, Karen salva uma colega de escola que estava sendo coagida por arruaceiras. Ao notar que o Sensei estava por perto por pura coincidência, Karen se oferece para ser a guarda-costas dele. Depois de ajudá-lo a cumprir os afazeres em segurança, Karen desabafa com o Sensei na hora do adeus sobre os reais motivos que a fizeram entrar no Comitê de Restauração."

4058431972 = "Área do Gatilho Livre"#[?][Episódio: 08]
705014674 = "As alunas de Gehenna começam a respeitar regras por vontade própria, como fazer fila e esperar a ordem de chegada. Através de limites de tempo e um sistema de pontos de fidelidade, a ideia do Comitê de introduzir a ordem aos poucos começa a dar resultados reais. Vendo o empenho das garotas, o Sensei decide apoiá-las com tudo o que tem."

3161366694 = "Oportunidade de Ouro"#[?][Episódio: 09]
3695701956 = "Para deixar o sistema de pontos mais atraente, o grupo sai em busca de restaurantes parceiros onde as alunas possam trocar seus pontos. Só que na hora de provar a comida do local pretendido, o rango não era lá essas coisas. O Clube de Pesquisa Gastronômica surge por acaso e concorda: a comida é medíocre. Mesmo com Mayumi tentando acalmar os ânimos, Haruna não perdoa e explode o restaurante. Diante dos escombros, Shoko fica pensativa."

3898526130 = "Negociações......?"#[?][Episódio: 10]
4124917679 = "Shoko alerta que o Clube de Pesquisa Gastronômica e o Departamento de Fontes Termais são bombas-relógio que atrapalham os planos de uma Gehenna grandiosa. Para controlar as Fontes Termais, Shoko dribla Kasumi e tenta negociar direto com Megu, mas acaba irritando Kasumi profundamente. O fogo é contornado por enquanto, mas o Sensei sente uma pontinha de estranheza no método de Shoko."

1319276458 = "Uma Paz Estranha"#[?][Episódio: 11]
200177053 = "Com as ações do Comitê de Restauração, Gehenna estava estranhamente silenciosa. Makoto fica com a pulga atrás da orelha ao ver outro grupo ganhando tanta influência. Enquanto isso, o Comitê de Disciplina aproveita uma calmaria que não via há séculos. Nesse clima tranquilo, Iori se pega relembrando de uma conversa antiga com Karen sobre um futuro em que a Disciplina não precisaria mais existir."

1217784543 = "Resolvendo Pepinos"#[?][Episódio: 12]
4186691531 = "Percebendo que as alunas de Gehenna não têm a quem recorrer quando precisam desabafar, Mayumi decide que o Comitê vai virar um disque-ajuda escolar. Ao investigar o primeiro caso — uma lenda urbana sobre um suposto fantasma na escola —, o grupo vai parar na sala da rádio escolar. A porta está trancada a sete chaves, mas o Sensei se recorda de boatos bem curiosos envolvendo aquele lugar."

35149090 = "A Árvore no Meio da Floresta"#[?][Episódio: 13]
3348675679 = "O Comitê de Restauração procura Kirara e Erika para saber sobre uma gafe que cometeram na transmissão da rádio no passado. As pistas deixam Shoko pensativa, como se tivesse ligado os pontos de um quebra-cabeça. Chegando à conclusão de que precisam entrar na sala da rádio a todo custo, o grupo ruma até a Sociedade Pandemônio para tentar uma autorização oficial."

38381485 = "Sombras de Chamas Trêmulas"#[?][Episódio: 14]
3174880895 = "Usando o histórico de sucessos do Comitê como moeda de troca, o grupo consegue arrancar de Makoto a autorização para operar a rádio escolar. Livres para investigar por dentro, elas descobrem que o suposto fantasma era apenas um cabo velho com mau contato. Mayumi e Karen saem empolgadas para avisar quem pediu ajuda, mas Shoko fica para trás, encarando os transmissores em silêncio absoluto."

3170845441 = "Mayumi"#[?][Episódio: 15]
2615319093 = "Mayumi limpa a Área do Gatilho Livre sozinha. Enquanto recebe uma ajuda do Sensei, ela fala com brilho nos olhos sobre seu amor por Gehenna e o futuro que sonha construir. Pelas costas de todas, Shoko vai até a Sociedade Pandemônio sozinha: avisa que toda a rede de transmissão foi modernizada e sugere a Makoto que faça um pronunciamento surpresa histórico."

3130877927 = "O Inevitável Acontece"#[?][Episódio: 16]
1152577695 = "No exato instante em que Makoto se prepara para discursar, o sinal pifa e uma voz misteriosa começa a ecoar pelos alto-falantes. O áudio volta e todos respiram aliviados, mas a surpresa dura pouco: do nada, Makoto declara guerra total a Kivotos inteira. Hina sobe correndo ao palco e todos acham que ela vai conter o absurdo, mas ela concorda com Makoto e aperta a mão da rival, instaurando o caos absoluto em Gehenna."

2561484869 = "Herança do Passado"#[?][Episódio: 17]
2431496816 = "Ao percorrer os clubes de Gehenna para entender a loucura, o Sensei repara que a anomalia afetou apenas as alunas do 3º ano — incluindo Makoto, Hina, Ako e Sena. Enquanto debate uma saída com Iroha, Iori e as alunas do 2º ano ilesas, Satsuki (que é do 3º ano) chega de repente. O clima pesa, mas Satsuki não foi afetada: ela revela que todo aquele surto coletivo foi causado por uma lavagem cerebral do 'Verdadeiro Projeto NK-Ultra'."

#[-][Capítulo 2]
4211088235 = "Tarde Demais"#[?][Episódio: 01]
2745023164 = "Como a única veterana do 3º ano a escapar da anomalia, Satsuki, diretora de inteligência da Sociedade Pandemônio, revela a verdadeira face do terrível Projeto NK-Ultra do antigo Imperador do Trovão. Como a declaração de guerra ainda não vazou para fora de Gehenna, todos concordam em neutralizar a crise internamente. Deixando as picuinhas de lado, clubes rivais se unem numa corrida desesperada contra o tempo."

3589255139 = "Chinatsu"#[?][Episódio: 02]
3107677907 = "Chinatsu vai ao Clube de Resgate Médico e encontra Sena totalmente fora de si. Embora o corpo seja o de Sena, ela defende com convicção cega o ataque massivo de Gehenna contra Kivotos. Em prantos, Chinatsu jura para si mesma que vai trazer sua veterana de volta à razão custe o que custar."

792108159 = "A Reação do Comitê de Restauração"#[?][Episódio: 03]
3808986636 = "Diante da loucura que tomou Gehenna, Mayumi e Karen entram em parafuso. Mas Shoko celebra o caos como a chegada da 'Gehenna Grandiosa'. Convocada pelas veteranas da Sociedade Pandemônio, Shoko ruma direto para a sala de comando de guerra da escola."

659494854 = "Gehenna Unida"#[?][Episódio: 04]
373240233 = "Sociedade Pandemônio e Comitê de Disciplina marcham de mãos dadas preparando a invasão. Os recursos do distrito são confiscados e a lavagem cerebral começa a contaminar até as alunas do 2º ano. Vendo o horror se alastrar, Mayumi e Karen perdem totalmente o chão."

2329517258 = "Tô Fora!"#[?][Episódio: 05]
3212628286 = "Mayumi e Karen tentam fazer Makoto voltar a si, mas encontram uma parede de ferro. Vendo a insanidade da líder, Iroha declara com todas as letras que está abandonando a Sociedade Pandemônio. Shoko exige que Iroha seja punida severamente por traição, mas Makoto recusa. Fingindo obedecer, Shoko abre um sorriso sinistro pelas costas de todos."

1351431619 = "O Departamento de Fontes Termais"#[?][Episódio: 06]
657902876 = "O Departamento de Fontes Termais recebe uma ordem arbitrária e autoritária da Sociedade Pandemônio. Kasumi tenta mandar pastar de imediato, mas Megu, tomada por uma empolgação bizarra, aceita a missão. Desconfiada do comportamento esquisito de Megu, Kasumi desabafa com o Sensei. Ao descobrir a verdade sobre a lavagem cerebral, Kasumi fecha com a resistência com força total."

2183499872 = "Não Entendi Nada"#[?][Episódio: 07]
2637879427 = "Mayumi e Karen entram em crise de culpa, achando que o trabalho do Comitê causou todo aquele desastre. O Sensei as consola, dizendo que a dor que sentem é a prova viva de que a dedicação delas nunca foi em vão. Revigoradas pelas palavras do Sensei, as duas enxugam as lágrimas e juram lutar pela verdadeira grandeza de Gehenna."

276320167 = "Chiaki"#[?][Episódio: 08]
2813606694 = "Arrasada ao ver a Sociedade Pandemônio desmoronar na loucura, a repórter Chiaki esbarra com Shoko e tenta puxar assunto. Em meio a um debate truncado, o faro jornalístico de Chiaki apita no volume máximo: tem muita coisa podre por trás da pose calma de Shoko."

3573775966 = "Satsuki"#[?][Episódio: 09]
1320054402 = "Satsuki leva o Sensei até a câmara secreta do departamento de inteligência. Enquanto vasculha uma cura para o transe, ela relembra a época sombria do Imperador do Trovão. Jurando que havia destruído todo aquele entulho bélico junto com Makoto no passado, Satsuki se lembra de remanescentes daquela era e finalmente encontra uma ponta de esperança."

2574305810 = "Nasce a Resistência"#[?][Episódio: 10]
1052683941 = "As alunas mais novas de cada clube de Gehenna formam a Resistência. O impasse sobre como quebrar a lavagem cerebral parecia insolúvel, até Satsuki chegar com a salvação: se transmitirem uma frequência interferente que neutralize a onda de lavagem cerebral, o transe se quebrará. Para achar a frequência certa, elas precisam invadir a sala da rádio."

2108264872 = "Quero Ficar ao Seu Lado"#[?][Episódio: 11]
694612940 = "Nos corredores vazios de uma Sociedade Pandemônio em frangalhos, Ibuki suporta a solidão. Iroha volta para buscá-la e pede que venha com ela, mas Ibuki decide ficar ao lado de Makoto. Mesmo dopada pelo transe e correndo com os preparativos de guerra, a pureza das palavras de Ibuki faz a mente adormecida de Makoto estremecer."

3728999235 = "Você Vai Torcer Por Mim, Sensei?"#[?][Episódio: 12]
3966608263 = "A Resistência tenta se infiltrar na rádio escolar, mas dá de cara com uma segurança impenetrável. Como se já esperasse o bote, Shoko surge escoltada por Hina e dá um ultimato. Na saída, Hina aborda o Sensei e, sob o pretexto de 'protegê-lo', o tranca numa cela."

2512307957 = "Cativeiro"#[?][Episódio: 13]
942929582 = "Trancafiado sob a desculpa de 'proteção', o Sensei recebe a visita de Makoto, mas os dois não chegam a acordo nenhum. Em seguida, Shoko vai até a cela para tentar dobrá-lo, mas é ela quem acaba desestabilizada pela franqueza desconcertante do Sensei."

970775719 = "As Rebeldes"#[?][Episódio: 14]
3347031609 = "Encarregado de cozinhar rações de guerra para a tropa toda e vigiado de perto por Haruna e Akari, o Clube de Alimentação faz corpo mole de propósito para atrasar o cronograma. A tática dá certo e sabota a logística das tropas. Preocupada com o atraso generalizado, Makoto resolve ativar a arma estratégica do Imperador do Trovão, e a crise entra em ponto de ebulição."

615477350 = "Montando o Plano"#[?][Episódio: 15]
2403023457 = "Diante do bloqueio eletrônico remoto na rádio escolar, Kirara e Erika se apresentam para ajudar. Elas estavam nos preparativos finais quando Chiaki chega com a notícia apavorante: a arma do Imperador do Trovão está prestes a ser ressuscitada. A operação tem que começar imediatamente!"

3540415323 = "Operação Resgate de Gehenna (1)"#[?][Episódio: 16]
1438541752 = "Invadir a rádio e transmitir a frequência interferente para toda a escola: com esse objetivo final, começa a batalha pelo destino de Gehenna. O Departamento de Fontes Termais abre túneis no subsolo para resgatar o Sensei, enquanto Iori e Chinatsu atacam a entrada principal do prédio como isca para atrair o grosso das forças inimigas."

3781429285 = "Operação Resgate de Gehenna (2)"#[?][Episódio: 17]
196335811 = "A caminho do prédio central, Iori e Chinatsu dão de cara com Hina e Makoto. Mesmo cercadas e sob fogo cerrado, as duas gritam pelo coração de suas veteranas, arriscando a própria vida. O cerco se aperta, mas elas aguentam firme até o Sensei, Mayumi e Karen chegarem para virar o jogo. Quando o contra-ataque estava pronto, Shoko dá as caras."

3226876046 = "Nós, as Chamas Que Ardem"#[?][Episódio: 18]
3737355680 = "Certa da vitória, Shoko revela sua lealdade fanática ao antigo Imperador do Trovão. Mas a frequência interferente descoberta por Satsuki ecoa pelos autofalantes de Gehenna, abalando a lavagem cerebral. Quando parecia que o pesadelo ia acabar, um mecanismo de autodestruição mental é acionado, ameaçando colapsar a mente das alunas do 3º ano. No desespero das mais novas, o choro angustiado de Iroha faz Makoto finalmente despertar, quebrando as correntes do passado."

2627851490 = "O Que Foi Deixado Para Trás"#[?][Episódio: 19]
4261624041 = "Diante de toda a escola, Hina tenta se desculpar, mas Makoto assume o microfone e puxa toda a culpa para os próprios ombros. Vendo a escola unida e inspirada pelo discurso desengonçado porém sincero de Makoto, Mayumi e Karen decidem recomeçar sua jornada. Hina volta para a Disciplina e Makoto para a Pandemonium, acertando as contas com suas protegidas. E o Sensei deixa uma lição de casa especial para Makoto: continuar sendo simplesmente a Makoto."

2393383984 = "O Que Restou"#[?][Episódio: 20]
151641469 = "Livres do transe, as veteranas vivem momentos emocionantes de reconciliação com as alunas mais novas. Enquanto isso, nos bastidores, Kasumi pressente que toda a trama guarda a sombra sinistra de uma antiga organização à qual pertenceu no passado: o 'Bodensatz'."

2010497725 = "Chamas Eternas"#[?][Episódio: 21]
4159819389 = "Confrontada com o lado sombrio de sua própria mente exposto pelo transe, Hina é consumida pelo remorso. Com carinho e paciência, o Sensei a acolhe e a ajuda a ficar de pé novamente. Parecia um final feliz... mas na prisão, Shoko sussurra para o Sensei a existência de um mentor nas sombras, enquanto Makoto e Hina conversam em silêncio sobre os verdadeiros vestígios deixados pelo Imperador do Trovão."

