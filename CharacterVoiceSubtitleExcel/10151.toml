[translation]
10151-CVGroup_Battle_Buffed_1-1 = "Thank you for the co-authored work."
10151-CVGroup_Battle_Covered_1-1 = "Behold, genius-level cover."
10151-CVGroup_Battle_Defense_1-1 = "Ropework, evade!"
10151-CVGroup_Battle_In_1-1 = "I'm not very used to this, but... I'll give it a try!"
10151-CVGroup_Battle_In_2-1 = "P-Please don't shoot! I'm the class representative of a special class, you know!?"
10151-CVGroup_Battle_Move_1-1 = "Hah... hah... Ugh, my stamina..."
10151-CVGroup_Battle_Move_2-1 = "Running is... not my specialty."
10151-CVGroup_Battle_Recovery_1-1 = "Let's get in touch so we can receive a medal."
10151-CVGroup_Battle_TacticalAction_1-1 = "Ha!"
10151-CVGroup_Battle_Victory_1-1 = "The victory of a genius scientist, wouldn't you say?"
10151-CVGroup_Battle_Victory_2-1 = "Once you understand the principles, it's simple."
10151-CVGroup_CommonSkill-1 = "Aren't you happy to have a genius with you?"
10151-CVGroup_ExSkill_1-1 = "The fusion of science and ropework!"
10151-CVGroup_ExSkill_2-1 = "Sorry for being naturally brilliant."
10151-CVGroup_ExSkill_3-1 = "If only there was a ring, I'd be unstoppable...!"
10151-CVGroup_ExSkill_Level_1-1 = "Special move, here I go!"
10151-CVGroup_ExSkill_Level_2-1 = "Take this!!"
10151-CVGroup_ExSkill_Level_3-1 = "Ta-da! How's that?!"
10151-CVGroup_Formation_In_1-1 = "Leave it to the scientist."
10151-CVGroup_Formation_In_2-1 = "A formation... What a fine title."
10151-CVGroup_Formation_Select-1 = "Whoa! It's high! Would it be alright to use aerial combat maneuvers?"
10151-CVGroup_Growup_1-1 = "I'm already a genius as it is...\nAt this rate, I'll become an even greater genius... Is this really okay, Sensei?"
10151-CVGroup_Growup_2-1 = "I don't have anywhere left to pin my medals...\nMaybe I should pin them to my trousers."
10151-CVGroup_Growup_3-1 = "My achievements have increased yet again."
10151-CVGroup_Growup_4-1 = "Fufu... My own talent is almost frightening."
10151-CVGroup_Relationship_Up_1-1 = "If I were... just an ordinary person... would you still, Sensei...\n...N-No, pretend you didn't hear that."
10151-CVGroup_Relationship_Up_2-1 = "The words of praise I receive from you...\nI don't expect to hear them all the time.\nThank you... truly."
10151-CVGroup_Relationship_Up_3-1 = "Thank you for not hating someone as showy and pretentious as me."
10151-CVGroup_Relationship_Up_4-1 = "Every moment I spend with you—\nis the greatest medal I could ever ask for."
10151-CVGroup_Tactic_In_1-1 = "It's so hard to turn down autograph requests."
10151-CVGroup_Tactic_In_2-1 = "Is this like an academic conference?"
10151-CVGroup_Tactic_Victory_1-1 = "I haven't even used 10% of my knowledge yet, you know?"
10151-CVGroup_Tactic_Victory_2-1 = "That was a very simple theorem."
