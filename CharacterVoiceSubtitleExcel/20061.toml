[translation]
20061-CVGroup_CommonSkill-1 = "Prese~nt!"
20061-CVGroup_ExSkill_1-1 = "Delightful! Thrilling! Ha-ha-ha-ha-ha!"
20061-CVGroup_ExSkill_2-1 = "What a wild bull! Ole! Ole!"
20061-CVGroup_ExSkill_3-1 = "Oops, I forgot to attach the control button!\nHa-ha-ha-ha!"
20061-CVGroup_ExSkill_Level_1-1 = "Ouch... Ha-ha-ha-ha!"
20061-CVGroup_ExSkill_Level_2-1 = "Guh...! How interesting!"
20061-CVGroup_ExSkill_Level_3-1 = "Gah...! Well, I suppose these things happen!"
20061-CVGroup_Formation_In_1-1 = "Looks like we've got time to dig up one more place! Let's move on!"
20061-CVGroup_Formation_In_2-1 = "Civil engineering? Demolition? Or perhaps...?"
20061-CVGroup_Formation_Select-1 = "Ah! It'd be great if people did this when I was drowning too!"
20061-CVGroup_Growup_1-1 = "Oh, is this really alright?\nDoing this to me—you know this might leave more than just a summer burn, right?"
20061-CVGroup_Growup_2-1 = "I'm a believer in gratefully accepting whatever comes my way, but...\nIt seems I've built up a debt to Sensei."
20061-CVGroup_Growup_3-1 = "If I were to use what I've learned here somewhere else—\nyou won't hold a grudge against me, will you?"
20061-CVGroup_Growup_4-1 = "So this is what they call a summer memory, huh?\nIt feels so refreshing deep down in my chest. Thank you, Sensei."
20061-CVGroup_Relationship_Up_1-1 = "Oh my, this has turned into quite a predicament.\nI can't stop thinking about Sensei. What an amusing change."
20061-CVGroup_Relationship_Up_2-1 = "You've got quite an unusual taste, don't you?\nWell, that's a good thing for me, though! Ha-ha-ha-ha!"
20061-CVGroup_Relationship_Up_3-1 = "My, do you actually understand—what it is you're doing right now?"
20061-CVGroup_Relationship_Up_4-1 = "...I'm the type to properly pay back my debts, you see.\nNow then, what should I do about this?"
