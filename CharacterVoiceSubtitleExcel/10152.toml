[translation]
10152-CVGroup_Battle_Buffed_1-1 = "Because \"friendship\"... is important."
10152-CVGroup_Battle_Covered_1-1 = "Let's take a short break."
10152-CVGroup_Battle_Defense_1-1 = "Hehe, how cute."
10152-CVGroup_Battle_In_1-1 = "A demonic summoning ritual... would you like to join me?"
10152-CVGroup_Battle_In_2-1 = "Now, let us play a requiem."
10152-CVGroup_Battle_Move_1-1 = "Shall we change the venue for our performance?"
10152-CVGroup_Battle_Move_2-1 = "There is someone waiting over there."
10152-CVGroup_Battle_Recovery_1-1 = "...Warm."
10152-CVGroup_Battle_TacticalAction_1-1 = "Ready, go!"
10152-CVGroup_Battle_Victory_1-1 = "I look forward to the next feast."
10152-CVGroup_Battle_Victory_2-1 = "Love and peace, indeed."
10152-CVGroup_CommonSkill-1 = "Hehe, I've been struck by inspiration."
10152-CVGroup_ExSkill_1-1 = "The feast begins."
10152-CVGroup_ExSkill_2-1 = "I have been waiting for this moment."
10152-CVGroup_ExSkill_3-1 = "Everyone, are you ready?"
10152-CVGroup_ExSkill_Level_1-1 = "This is the welfare of society!!"
10152-CVGroup_ExSkill_Level_2-1 = "Peace... all I need is peace!"
10152-CVGroup_ExSkill_Level_3-1 = "Love and peaaaace!"
10152-CVGroup_Formation_In_1-1 = "The preparations for the performance are complete."
10152-CVGroup_Formation_In_2-1 = "What would you like to hear today?"
10152-CVGroup_Formation_Select-1 = "Hehe, this child is also a fine instrument, you know?"
10152-CVGroup_Growup_1-1 = "Thanks to you, Sensei, it has descended upon me. Because when it comes to composition—\n'Inspiration'\n—is more important than anything else."
10152-CVGroup_Growup_2-1 = "Yes, it is a joyous thing.\nAfter all, it means I can open a new door to growth."
10152-CVGroup_Growup_3-1 = "Hehe... I feel like something that was sleeping deep inside\nhas just awakened."
10152-CVGroup_Growup_4-1 = "Even if you feel you've grown, you must not become conceited.\nIn the endless world of art—\n—'Challenge'\n...is what matters most."
10152-CVGroup_Relationship_Up_1-1 = "Music is about connecting hearts with the artist.\n...If that is the case,\ncan't we call this very moment music as well? Hehe."
10152-CVGroup_Relationship_Up_2-1 = "Suddenly... I felt like playing the melody of my heart.\nBecause even feelings that cannot be put into words can be carried by a melody."
10152-CVGroup_Relationship_Up_3-1 = "I can understand Cinderella's feelings now.\nWith 12 o'clock approaching... I wished so much\nthat time would just stop right here."
10152-CVGroup_Relationship_Up_4-1 = "As long as people live, they change.\nHowever, this feeling I have right now...\nI hope it never changes, that is what I think."
10152-CVGroup_Tactic_In_1-1 = "This is the stage for tonight."
10152-CVGroup_Tactic_In_2-1 = "Tsumugi Music Corps, departing."
10152-CVGroup_Tactic_Victory_1-1 = "Hehe, how was the music corps' performance?"
10152-CVGroup_Tactic_Victory_2-1 = "Please, do let me know your thoughts on the performance."
