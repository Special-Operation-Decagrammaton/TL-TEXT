[translation]
20064-CVGroup_CommonSkill-1 = "Like a fragrant flower."
20064-CVGroup_ExSkill_1-1 = "To the stage where the light shines."
20064-CVGroup_ExSkill_2-1 = "Theater is a mirror that reflects one's inner self."
20064-CVGroup_ExSkill_3-1 = "Bringing imagination to the stage of reality."
20064-CVGroup_ExSkill_Level_1-1 = "The next lead is here."
20064-CVGroup_ExSkill_Level_2-1 = "Come this way, now, for the thunderous applause."
20064-CVGroup_ExSkill_Level_3-1 = "It is your turn."
20064-CVGroup_Formation_In_1-1 = "How may I be of assistance?"
20064-CVGroup_Formation_In_2-1 = "I shall fulfill my duty."
20064-CVGroup_Formation_Select-1 = "Um... could you please put me down soon?"
20064-CVGroup_Growup_1-1 = "So, there were still seeds of growth within my heart."
20064-CVGroup_Growup_2-1 = "May peaceful and calm days come to pass."
20064-CVGroup_Growup_3-1 = "Hmm... I've thought of a good plot twist.\nA very charming performance."
20064-CVGroup_Growup_4-1 = "This is... the strength to walk upon the stage that is the world, isn't it?"
20064-CVGroup_Relationship_Up_1-1 = "This pounding in my chest... yet another secret I cannot reveal to Sensei has been added."
20064-CVGroup_Relationship_Up_2-1 = "Even though managing one's expressions is essential for a performer... \nI almost lost my composure for a moment."
20064-CVGroup_Relationship_Up_3-1 = "Why is it... I feel as though standing before Sensei allows you to see through all my secrets."
20064-CVGroup_Relationship_Up_4-1 = "To think you would care for me this much... \nDon't blame me if my true feelings accidentally slip out, alright?"
