20062-CVGroup_Growup_1-1 = "Eh? I like studying itself, you know?\nI just hate opening reference books and writing things down."
20062-CVGroup_Growup_2-1 = "Hard work is bitter, but the results are sweet!\nThough, I could use some edible film to swallow it..."
20062-CVGroup_Growup_3-1 = "Getting stronger makes you more persuasive, right? Ehe!"
