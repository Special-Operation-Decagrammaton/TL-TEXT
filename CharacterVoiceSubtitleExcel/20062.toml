20062-CVGroup_ExSkill_2-1 = "Shouldn't this be fine?"
20062-CVGroup_ExSkill_3-1 = "Let's go for extra innings!"
20062-CVGroup_ExSkill_Level_1-1 = "Save the thanks for later!"
20062-CVGroup_ExSkill_Level_2-1 = "All that studying really paid off!"
20062-CVGroup_ExSkill_Level_3-1 = "It's like a tag team match!"
20062-CVGroup_Formation_In_1-1 = "We can take a detour when we're done, right? Yay~!"
