20062-CVGroup_Relationship_Up_1-1 = "I hate studying, but...\nif Sensei is here with me, maybe it's not so bad?"
20062-CVGroup_Relationship_Up_2-1 = "Sensei, do people ever tell you you're dense?\nOh, is that so... No, I was just asking."
20062-CVGroup_Relationship_Up_3-1 = "Going to the cafe together, going out on trips...\nDon't tell me you don't know what this means, okay?"
20062-CVGroup_Relationship_Up_4-1 = "Come see me more often.\nEspecially since you know how boring a place that is."
