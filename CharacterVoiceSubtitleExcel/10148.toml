[translation]
10148-CVGroup_Battle_Buffed_1-1 = "Ah, thank you."
10148-CVGroup_Battle_Covered_1-1 = "Let's calm down a little."
10148-CVGroup_Battle_Defense_1-1 = "Well, I can handle this much..."
10148-CVGroup_Battle_In_1-1 = "Sigh... if I'm going to do it, I'll do it thoroughly."
10148-CVGroup_Battle_In_2-1 = "This is a hassle, let's just get it over with."
10148-CVGroup_Battle_Move_1-1 = "Is it that way next?"
10148-CVGroup_Battle_Move_2-1 = "Phew, next is..."
10148-CVGroup_Battle_Recovery_1-1 = "Thanks. That helped."
10148-CVGroup_Battle_TacticalAction_1-1 = "Yes, yes, I'm heading there."
10148-CVGroup_Battle_Victory_1-1 = "...You know, you're allowed to praise me."
10148-CVGroup_Battle_Victory_2-1 = "I'll take a break at Schale before heading home."
10148-CVGroup_CommonSkill-1 = "We both have it rough, don't we?"
10148-CVGroup_ExSkill_1-1 = "It's packed to the brim... I wonder if this will even close properly.\n...Ehh!?"
10148-CVGroup_ExSkill_2-1 = "Carry your own things... sigh, fine, whatever.\n...Augh!?"
10148-CVGroup_ExSkill_3-1 = "Can't you see it won't fit anymore?\n...Guh!?"
10148-CVGroup_ExSkill_Level_1-1 = "Do I really have to use something like this as a weapon...?"
10148-CVGroup_ExSkill_Level_2-1 = "This luggage is in the way."
10148-CVGroup_ExSkill_Level_3-1 = "Here, take this too!"
10148-CVGroup_Formation_In_1-1 = "Sigh... so you're saying things won't run without me?"
10148-CVGroup_Formation_In_2-1 = "Yes, yes, I'm right here."
10148-CVGroup_Formation_Select-1 = "Yawn... ah.\nUm... please forget that."
10148-CVGroup_Growup_1-1 = "I prefer not being expected to do much, but...\nGood grief. You really need me, don't you, Sensei?"
10148-CVGroup_Growup_2-1 = "So, you're telling me to work harder?\n...Eh? Why are you saying that now...? Do you really need me to explain?"
10148-CVGroup_Growup_3-1 = "Do you want to be with me that much?\n...Sigh, you're hopeless."
10148-CVGroup_Growup_4-1 = "Um... I actually come to Schale to slack off...\nNo, it's fine, but..."
10148-CVGroup_Relationship_Up_1-1 = "After this...\nOh, no... if you'd like, shall we go out? Just the two of us."
10148-CVGroup_Relationship_Up_2-1 = "Fufu. Yes, I understand.\nThat's the signal to slack off together, right?"
10148-CVGroup_Relationship_Up_3-1 = "You've really come to understand me, Sensei.\n...Or is it the other way around?"
10148-CVGroup_Relationship_Up_4-1 = "A trip? I hate them.\n...Well, I suppose it depends on who I'm going with."
10148-CVGroup_Tactic_In_1-1 = "Sigh... the work is piling up."
10148-CVGroup_Tactic_In_2-1 = "I'm not feeling well, can I leave early?"
10148-CVGroup_Tactic_Victory_1-1 = "Phew, that's taken care of. Good work."
10148-CVGroup_Tactic_Victory_2-1 = "That's it for today, right...?"