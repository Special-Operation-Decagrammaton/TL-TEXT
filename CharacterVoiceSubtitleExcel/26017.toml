[translation]
26017-CVGroup_CommonSkill-1 = "Beep beep."
26017-CVGroup_CommonSkill_2-1 = "Did someone call a tank?"
26017-CVGroup_CommonSkill_3-1 = "Vroom! Vrooom! Vroooom!"
26017-CVGroup_ExSkill_1-1 = "Mobile laboratory, arriving now."
26017-CVGroup_ExSkill_2-1 = "It's based on scientific evidence, so rest assured."
26017-CVGroup_ExSkill_3-1 = "Puppy-gou, descending."
26017-CVGroup_ExSkill_Level_1-1 = "Unyaa."
26017-CVGroup_ExSkill_Level_2-1 = "Boom."
26017-CVGroup_Formation_In_1-1 = "Are you looking for an expert?"
26017-CVGroup_Formation_In_2-1 = "I'm always on standby."
26017-CVGroup_Formation_Select-1 = "It's high up. So this is an adult's perspective..."
26017-CVGroup_Growup_1-1 = "Thank you as always, Sensei.\nI'm still growing, so look forward to it."
26017-CVGroup_Growup_2-1 = "This feeling of gaining strength and moving forward a step...\nThat's why I can't stop growing."
26017-CVGroup_Growup_3-1 = "Even if I keep growing and eventually become someone distant...\nPlease keep watching over me."
26017-CVGroup_Growup_4-1 = "Thank you, Sensei.\n...From now on, I'll learn lots of words to express my gratitude."
26017-CVGroup_Relationship_Up_1-1 = "You understand me better than I do myself, Sensei.\nI'm grateful. I'm happy."
26017-CVGroup_Relationship_Up_2-1 = "Lately, the frequency of me thinking about you has increased.\nA delightful phenomenon."
26017-CVGroup_Relationship_Up_3-1 = "Thank you for always spoiling me."
26017-CVGroup_Relationship_Up_4-1 = "Every time I repeat the verification, I become certain.\nI love you, Sensei."
