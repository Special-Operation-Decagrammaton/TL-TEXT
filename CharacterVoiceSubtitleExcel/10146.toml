[translation]
10146-CVGroup_Battle_Buffed_1-1 = "Concentrate your support!"
10146-CVGroup_Battle_Covered_1-1 = "I shall grant you the honor of being my shield!"
10146-CVGroup_Battle_Defense_1-1 = "Hey! Do something about this!"
10146-CVGroup_Battle_In_1-1 = "Don't fall behind! Let's go!"
10146-CVGroup_Battle_In_2-1 = "I'll finish this in under three minutes."
10146-CVGroup_Battle_Move_1-1 = "I am enough on my own."
10146-CVGroup_Battle_Move_2-1 = "W-wait, isn't it over yet!?"
10146-CVGroup_Battle_Recovery_1-1 = "Honestly, you're too slow."
10146-CVGroup_Battle_TacticalAction_1-1 = "I was just about to move."
10146-CVGroup_Battle_Victory_1-1 = "A natural victory. Nothing worth celebrating."
10146-CVGroup_Battle_Victory_2-1 = "Kiki! It didn't even require Makoto-sama's presence."
10146-CVGroup_CommonSkill-1 = "Hanuma Makoto is here."
10146-CVGroup_ExSkill_1-1 = "I shall take you to new lands."
10146-CVGroup_ExSkill_2-1 = "Kikiki! I shall turn this place into the sea of Gehenna!"
10146-CVGroup_ExSkill_3-1 = "The time to set sail has come! Raise the anchor!"
10146-CVGroup_ExSkill_Level_1-1 = "It shouldn't be rusted... hm!? I suppose it isn't there."
10146-CVGroup_ExSkill_Level_2-1 = "It should be easy...!? Who's there!?"
10146-CVGroup_ExSkill_Level_3-1 = "Kikiki! This much... eek!? ...I-it went exactly as planned!"
10146-CVGroup_Formation_In_1-1 = "Is this situation really worth ruining my day off?"
10146-CVGroup_Formation_In_2-1 = "Let's finish this quickly! Makoto-sama is off-duty, after all."
10146-CVGroup_Formation_Select-1 = "Ah, I understand... So, where are we?"
10146-CVGroup_Growup_1-1 = "I appreciate the optimal support. After all, an excellent leader deserves equipment to match."
10146-CVGroup_Growup_2-1 = "Do you want me to be even more active? You're a troublesome person, Sensei, kiki."
10146-CVGroup_Growup_3-1 = "Oh? That is a truly novel perspective. To think I could learn something new."
10146-CVGroup_Growup_4-1 = "Kikiki. Just as the rumors said, your guidance is strict. I suppose that's why only I can endure it."
10146-CVGroup_Relationship_Up_1-1 = "Hmph. You finally understand. That's right. It's enough to just keep your eyes on Makoto-sama."
10146-CVGroup_Relationship_Up_2-1 = "Do you treat all the other students the same way, Sensei? ...I don't understand it."
10146-CVGroup_Relationship_Up_3-1 = "Have you made up your mind to walk alongside me? Then, right now—I see, that's fine. An excellent leader is patient."
10146-CVGroup_Relationship_Up_4-1 = "Doesn't one's attire affect one's image... No! Never mind!"
10146-CVGroup_Tactic_In_1-1 = "Ah, leave the commanding to me. I'll get it sorted."
10146-CVGroup_Tactic_In_2-1 = "Why must I be forced to do something like this..."
10146-CVGroup_Tactic_Victory_1-1 = "Kiki! I must add this great achievement to my autobiography!"
10146-CVGroup_Tactic_Victory_2-1 = "It's over. Let's leave at once."